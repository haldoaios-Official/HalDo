<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HalDo Kosmos – Sonne · Erde · Mond</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #cosmos { position: fixed; inset: 0; display: block; }
  /* Optional: Text-Overlay wie im OS */
  #brandOverlay {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: #66e0ff; font-family: 'Segoe UI', monospace; font-size: 12px;
    letter-spacing: 4px; text-transform: uppercase; opacity: 0.7;
    text-shadow: 0 0 10px #00aaff; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="cosmos"></canvas>
<div id="brandOverlay">HALIL DONMA • HALDO AI OS PRO MAX</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ============================================================
   HALDO KOSMOS – Sonne, Erde, Mond, Sterne, Ring
   Exakt aus der index.html (voller Code, nichts gekürzt)
   ============================================================ */
function initCosmos(canvasId = 'cosmos') {
  const canvas = document.getElementById(canvasId);
  if (!canvas) { console.warn('Cosmos-Canvas nicht gefunden:', canvasId); return null; }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000006, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);
  camera.position.set(0, 2.5, 13);
  camera.lookAt(0, 0.5, 0);

  // ---------- Sterne (8000 Punkte, sphärisch verteilt) ----------
  const starGeo = new THREE.BufferGeometry();
  const starCount = 8000;
  const pos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i += 3) {
    const r = 200 + Math.random() * 800;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i]     = r * Math.sin(ph) * Math.cos(th);
    pos[i + 1] = r * Math.cos(ph);
    pos[i + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, sizeAttenuation: true })
  );
  scene.add(stars);

  // ---------- Sonne (leuchtend, mit Glow-Sprite) ----------
  const sunPos = new THREE.Vector3(-8, 3, -5);

  const sun = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffd060 })
  );
  sun.position.copy(sunPos);
  scene.add(sun);

  // Sonnen-Glow (Canvas-Radialgradient als Sprite)
  const gc = document.createElement('canvas');
  gc.width = gc.height = 256;
  const gx = gc.getContext('2d');
  const grd = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0,    'rgba(255,230,140,1)');
  grd.addColorStop(0.35, 'rgba(255,160,60,0.55)');
  grd.addColorStop(1,    'rgba(255,100,0,0)');
  gx.fillStyle = grd;
  gx.fillRect(0, 0, 256, 256);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(gc),
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  glow.scale.set(8, 8, 1);
  glow.position.copy(sunPos);
  scene.add(glow);

  const sunLight = new THREE.PointLight(0xffaa55, 2, 100);
  sunLight.position.copy(sunPos);
  scene.add(sunLight);

  // ---------- Erde (prozedurale Canvas-Textur: Ozeane, Kontinente, Wolken) ----------
  const eCanvas = document.createElement('canvas');
  eCanvas.width = 1024;
  eCanvas.height = 512;
  const ex = eCanvas.getContext('2d');
  ex.fillStyle = '#062a5a';
  ex.fillRect(0, 0, 1024, 512);

  // Kontinente (vereinfachte Landmassen als Ellipsen)
  ex.fillStyle = '#1c7a3c';
  [
    [140,200,80,50], [220,230,65,45], [320,180,55,40], [430,190,75,55],
    [540,210,55,45], [640,200,50,40], [700,260,60,70], [760,300,55,60],
    [480,340,55,40], [280,360,50,35], [860,400,55,40], [150,360,60,55],
    [900,180,60,55]
  ].forEach(([x, y, w, h]) => {
    ex.beginPath();
    ex.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
    ex.fill();
  });

  // Wolken
  ex.fillStyle = 'rgba(255,255,255,0.45)';
  for (let i = 0; i < 60; i++) {
    ex.beginPath();
    ex.ellipse(
      Math.random() * 1024,
      Math.random() * 512,
      15 + Math.random() * 55,
      8 + Math.random() * 20,
      Math.random() * Math.PI,
      0,
      Math.PI * 2
    );
    ex.fill();
  }

  const earthTex = new THREE.CanvasTexture(eCanvas);
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1.9, 64, 64),
    new THREE.MeshPhongMaterial({
      map: earthTex,
      shininess: 20,
      specular: 0x224466
    })
  );
  scene.add(earth);

  // Atmosphäre (leicht blauer Rand)
  const atmo = new THREE.Mesh(
    new THREE.SphereGeometry(2.05, 48, 48),
    new THREE.MeshBasicMaterial({
      color: 0x3fa9ff,
      transparent: true,
      opacity: 0.18,
      side: THREE.BackSide
    })
  );
  scene.add(atmo);

  // ---------- Ring mit Text "HALIL DONMA • HALDO AI OS PRO MAX" ----------
  const rc = document.createElement('canvas');
  rc.width = 4096;
  rc.height = 128;
  const rx = rc.getContext('2d');
  rx.clearRect(0, 0, 4096, 128);
  rx.font = 'bold 56px monospace';
  rx.fillStyle = '#66e0ff';
  rx.textAlign = 'center';
  rx.textBaseline = 'middle';
  rx.shadowColor = '#00aaff';
  rx.shadowBlur = 18;
  const txt = 'HALIL DONMA  •  HALDO AI OS PRO MAX  •  ';
  rx.fillText(txt, 1024, 64);
  rx.fillText(txt, 3072, 64);

  const ringTex = new THREE.CanvasTexture(rc);
  ringTex.wrapS = THREE.RepeatWrapping;

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(3.4, 0.06, 12, 220),
    new THREE.MeshBasicMaterial({
      map: ringTex,
      transparent: true,
      color: 0x66e0ff,
      side: THREE.DoubleSide
    })
  );
  ring.rotation.x = Math.PI / 2.1;
  ring.position.y = 0.4;
  scene.add(ring);

  // ---------- Mond ----------
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 24, 24),
    new THREE.MeshPhongMaterial({ color: 0xbbbbbb, shininess: 5 })
  );
  scene.add(moon);

  // ---------- Lichter ----------
  scene.add(new THREE.AmbientLight(0x223344, 1.3));
  const dl = new THREE.DirectionalLight(0xffffff, 1.1);
  dl.position.copy(sunPos);
  scene.add(dl);

  // ---------- Animation ----------
  let t0 = Date.now();
  function animate() {
    requestAnimationFrame(animate);
    earth.rotation.y += 0.0012;
    atmo.rotation.y = earth.rotation.y;
    ring.rotation.z += 0.0018;
    ringTex.offset.x += 0.0006;

    const tt = (Date.now() - t0) * 0.00025;
    moon.position.set(
      4.8 * Math.cos(tt),
      0.6 + 0.3 * Math.sin(tt * 1.7),
      4.8 * Math.sin(tt)
    );

    stars.rotation.y += 0.00008;
    renderer.render(scene, camera);
  }
  animate();

  // ---------- Resize ----------
  function onResize() {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', onResize);

  // Rückgabe-API (falls du stoppen / zerlegen willst)
  return {
    scene, camera, renderer, sun, earth, moon, stars, ring, atmo,
    stop() { renderer.dispose(); removeEventListener('resize', onResize); }
  };
}

/* Auto-Start */
document.addEventListener('DOMContentLoaded', () => {
  window.cosmos = initCosmos('cosmos');
});
</script>
</body>
</html>
