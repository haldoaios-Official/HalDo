<!DOCTYPE html>
<html lang="de" data-theme="holo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050a18" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>HalDo AI OS Pro Max – Professionelle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300e5ff'/%3E%3Ctext x='16' y='24' font-family='Arial' font-size='20' font-weight='bold' text-anchor='middle' fill='%23001a2a'%3EH%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════
   H A L D O   A I   O S   P R O   M A X
   Komplett neu · Modul 1 · v200 Foundation
   Designer: Halil Donma
   ═══════════════════════════════════════════════════════════ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:#000;color:var(--text)}

:root{
  --accent:#00e5ff; --accent2:#4da8ff; --accent3:#b478ff;
  --gold:#ffd580; --gold-glow:rgba(255,213,128,.5);
  --bg:#050a18;
  --glass:rgba(8,18,32,.65); --glass-hi:rgba(20,40,65,.75);
  --glass-border:rgba(0,229,255,.4);
  --text:#e0f2ff; --text-dim:#7ba5c9; --text-mut:#4a6b85;
  --blur:24px; --radius:18px; --radius-sm:14px;
  --shadow-win:0 20px 60px rgba(0,0,0,.55), 0 0 40px rgba(0,229,255,.18);
  --shadow-btn:0 4px 14px rgba(0,0,0,.4);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}

[data-theme="cyborg"]{--accent:#ff78c8;--accent2:#b478ff;--accent3:#ff3d9a;--gold:#ff9ed6;--glass-border:rgba(255,120,200,.45);--shadow-win:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(255,120,200,.22)}
[data-theme="gold"]{--accent:#ffd580;--accent2:#ffaa33;--accent3:#ff8844;--gold:#fff2b0;--glass-border:rgba(255,213,128,.5);--shadow-win:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(255,213,128,.25)}
[data-theme="matrix"]{--accent:#00ff88;--accent2:#00cc66;--accent3:#88ff99;--gold:#aaffcc;--glass-border:rgba(0,255,136,.45);--shadow-win:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(0,255,136,.22)}
[data-theme="crimson"]{--accent:#ff4466;--accent2:#ff2244;--accent3:#ff8888;--gold:#ffb0c0;--glass-border:rgba(255,68,102,.45);--shadow-win:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(255,68,102,.25)}
[data-theme="sunset"]{--accent:#ff8833;--accent2:#ff4466;--accent3:#ffcc44;--gold:#ffdd99;--glass-border:rgba(255,136,51,.45);--shadow-win:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(255,136,51,.25)}
[data-theme="ice"]{--accent:#cceeff;--accent2:#88bbff;--accent3:#aaddff;--gold:#eeffff;--glass-border:rgba(200,235,255,.5);--shadow-win:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(200,235,255,.28)}

/* ── COSMOS CANVAS ── */
#cosmosBg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:#000}

/* ── TOP BAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:calc(56px + var(--safe-top));
  padding:var(--safe-top) 14px 0;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(5,10,24,.85),rgba(5,10,24,.35));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--glass-border);
  z-index:100;
}
#topbar .logo{
  width:40px;height:40px;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  box-shadow:0 0 20px var(--gold-glow),inset 0 0 10px rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:20px;font-weight:900;color:#001;
  transition:transform .2s;
}
#topbar .logo:hover{transform:scale(1.08) rotate(5deg)}
#topbar .title{font-size:16px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}
#topbar .title small{font-size:10px;color:var(--text-dim);-webkit-text-fill-color:var(--text-dim);display:block;font-weight:500;letter-spacing:1px}
#topbar .spacer{flex:1}
#topbar .clock{font-size:12px;font-weight:600;color:var(--text-dim);text-align:right;line-height:1.2;font-variant-numeric:tabular-nums}
#topbar .icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--glass-border);
  background:var(--glass);color:var(--text);cursor:pointer;
  display:grid;place-items:center;font-size:18px;transition:all .2s;
}
#topbar .icon-btn:hover{background:var(--glass-hi);box-shadow:0 0 16px var(--gold-glow);transform:translateY(-1px)}
#topbar .icon-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#001}

/* ── SIDEBAR ── */
#sidebar{
  position:fixed;top:calc(56px + var(--safe-top));left:0;bottom:0;
  width:80px;padding:14px 8px;
  padding-bottom:calc(14px + var(--safe-bottom) + 64px);
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(180deg,rgba(5,10,24,.75),rgba(5,10,24,.9));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border);
  z-index:90;overflow-y:auto;overflow-x:hidden;
  transition:width .3s cubic-bezier(.4,0,.2,1);
}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
#sidebar.expanded{width:220px}
#sidebar .nav-btn{
  min-height:56px;padding:10px 8px;
  border-radius:14px;border:1px solid transparent;
  background:transparent;color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;gap:12px;
  font-size:12px;font-weight:600;transition:all .2s;text-align:left;
}
#sidebar .nav-btn .ico{font-size:22px;flex-shrink:0;width:28px;text-align:center;filter:drop-shadow(0 0 4px currentColor)}
#sidebar .nav-btn .lbl{display:none;white-space:nowrap}
#sidebar.expanded .nav-btn .lbl{display:inline}
#sidebar .nav-btn:hover{background:var(--glass);border-color:var(--glass-border);color:var(--text)}
#sidebar .nav-btn.active{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(180,120,255,.25));border-color:var(--accent);color:var(--text);box-shadow:0 0 20px rgba(0,229,255,.3),inset 0 0 12px rgba(0,229,255,.15)}
#sidebar .divider{height:1px;background:linear-gradient(90deg,transparent,var(--glass-border),transparent);margin:6px 4px}

/* ── BOTTOM BAR ── */
#bottombar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + var(--safe-bottom));
  display:flex;gap:8px;padding:8px;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);border-radius:24px;
  box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(0,229,255,.2);
  z-index:95;
}
#bottombar .bb-btn{
  min-height:44px;padding:0 16px;border:none;border-radius:16px;
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#001;transition:all .2s;
  box-shadow:0 4px 14px rgba(0,229,255,.35);
}
#bottombar .bb-btn.cyborg{background:linear-gradient(135deg,#ff78c8,#b478ff);box-shadow:0 4px 14px rgba(255,120,200,.4)}
#bottombar .bb-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,229,255,.5)}
#bottombar .bb-btn .ico{font-size:18px}

/* ── DESKTOP (Window Container) ── */
#desktop{position:fixed;inset:calc(56px + var(--safe-top)) 0 0 80px;overflow:hidden;pointer-events:none;z-index:50}
#desktop>*{pointer-events:auto}

/* ── WINDOWS ── */
.haldo-win{
  position:absolute;top:60px;left:60px;width:480px;height:520px;
  background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-win);
  border:1.5px solid var(--gold);
  outline:1.5px solid var(--glass-border);
  outline-offset:-3px;
  display:flex;flex-direction:column;
  animation:winIn .3s cubic-bezier(.4,0,.2,1);
  min-width:280px;min-height:200px;
}
@keyframes winIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.haldo-win.closing{animation:winOut .2s forwards}
@keyframes winOut{to{opacity:0;transform:scale(.9) translateY(-10px)}}

.haldo-win .win-head{
  height:44px;padding:0 8px 0 14px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(0,229,255,.12),transparent);
  border-bottom:1px solid var(--glass-border);
  cursor:grab;user-select:none;flex-shrink:0;
}
.haldo-win .win-head:active{cursor:grabbing}
.haldo-win .win-head .ico{font-size:18px;flex-shrink:0}
.haldo-win .win-head .ttl{font-size:13px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.haldo-win .win-head .btns{display:flex;gap:4px}
.haldo-win .win-head .wbtn{
  width:36px;height:36px;border-radius:10px;border:none;
  background:rgba(255,255,255,.06);color:var(--text-dim);cursor:pointer;
  display:grid;place-items:center;font-size:14px;transition:all .15s;
  position:relative;z-index:999999;
}
.haldo-win .win-head .wbtn:hover{background:rgba(255,255,255,.15);color:var(--text)}
.haldo-win .win-head .wbtn.close:hover{background:#ff4466;color:#fff}
.haldo-win .win-body{
  flex:1;overflow:auto;padding:16px;
  position:relative;
}
.haldo-win .win-body::-webkit-scrollbar{width:6px}
.haldo-win .win-body::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;opacity:.5}

/* Splash welcome in each app */
.win-splash{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;min-height:100%;
}
.win-splash .splash-logo{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  display:grid;place-items:center;font-size:32px;
  box-shadow:0 0 30px var(--gold-glow);
  margin-bottom:16px;
  animation:splashPulse 2s ease-in-out infinite;
}
@keyframes splashPulse{0%,100%{transform:scale(1);box-shadow:0 0 30px var(--gold-glow)}50%{transform:scale(1.05);box-shadow:0 0 50px var(--gold-glow)}}
.win-splash h2{font-size:18px;margin-bottom:8px;background:linear-gradient(90deg,var(--accent),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}
.win-splash p{font-size:12px;color:var(--text-dim);max-width:340px;line-height:1.6}
.win-splash .sig{margin-top:14px;font-size:10px;color:var(--text-mut);letter-spacing:2px;text-transform:uppercase}
.win-splash .soon{margin-top:18px;padding:8px 16px;border-radius:20px;background:rgba(0,229,255,.1);border:1px solid var(--accent);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:1px}

/* ── TOASTS ── */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--safe-bottom));display:flex;flex-direction:column;gap:8px;z-index:1000;pointer-events:none}
.toast{
  padding:12px 20px;border-radius:14px;
  background:var(--glass-hi);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  color:var(--text);font-size:13px;font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  animation:toastIn .3s;max-width:340px;pointer-events:auto;
}
.toast.ok{border-color:#00ff88;color:#aaffcc}
.toast.warn{border-color:#ffaa33;color:#ffdd99}
.toast.err{border-color:#ff4466;color:#ffb0c0}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.95)}}

/* ── APP GRID (Launcher) ── */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.app-tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 8px;border-radius:14px;border:1px solid transparent;
  background:rgba(255,255,255,.03);cursor:pointer;transition:all .2s;
  text-align:center;
}
.app-tile:hover{background:rgba(255,255,255,.08);border-color:var(--glass-border);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.app-tile .ico{font-size:28px;filter:drop-shadow(0 0 6px currentColor)}
.app-tile .nm{font-size:10px;color:var(--text-dim);font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.cat-head{display:flex;align-items:center;gap:8px;padding:10px 0 6px;margin-top:12px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--accent);text-transform:uppercase;border-bottom:1px solid var(--glass-border);margin-bottom:10px}
.cat-head .badge{background:var(--accent);color:#001;padding:2px 8px;border-radius:10px;font-size:9px}

/* ── SETTINGS SECTIONS ── */
.set-section{border:1px solid var(--glass-border);border-radius:14px;margin-bottom:8px;overflow:hidden;background:rgba(255,255,255,.02)}
.set-head{
  padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  font-size:13px;font-weight:700;transition:background .2s;user-select:none;
}
.set-head:hover{background:rgba(255,255,255,.05)}
.set-head .ico{font-size:18px}
.set-head .ttl{flex:1}
.set-head .arrow{font-size:12px;color:var(--text-dim);transition:transform .3s}
.set-section.open .set-head .arrow{transform:rotate(90deg)}
.set-body{display:none;padding:0 16px 16px;font-size:12px}
.set-section.open .set-body{display:block}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1;font-size:12px;color:var(--text)}
.set-row .lbl small{display:block;font-size:10px;color:var(--text-dim);margin-top:2px}
.toggle{
  width:48px;height:28px;border-radius:14px;position:relative;cursor:pointer;
  background:rgba(255,255,255,.1);transition:background .2s;flex-shrink:0;
}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.toggle.on::after{transform:translateX(20px)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{
  padding:6px 12px;border-radius:12px;border:1px solid var(--glass-border);
  background:rgba(255,255,255,.04);color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;
}
.chip:hover{background:rgba(255,255,255,.1);color:var(--text)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001;border-color:transparent;box-shadow:0 4px 12px rgba(0,229,255,.35)}
.slider{width:100%;margin-top:6px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.15);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 12px var(--accent)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}

/* ── CHAT ── */
.chat-box{display:flex;flex-direction:column;height:100%}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.chat-log::-webkit-scrollbar{width:4px}
.chat-log::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;animation:msgIn .2s}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--glass-border);border-bottom-left-radius:4px}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid var(--glass-border);background:rgba(0,0,0,.2)}
.chat-input-row input{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);color:var(--text);font-size:13px;outline:none}
.chat-input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.chat-input-row button{
  min-width:44px;min-height:44px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001;font-size:16px;cursor:pointer;
  transition:transform .15s;
}
.chat-input-row button:hover{transform:scale(1.05)}
.chat-input-row button.listening{background:linear-gradient(135deg,#ff4466,#ff8833);animation:pulseMic 1s infinite}
@keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(255,68,102,.7)}50%{box-shadow:0 0 0 12px rgba(255,68,102,0)}}

/* ── CALCULATOR ── */
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;height:100%;grid-template-rows:auto 1fr}
.calc-display{grid-column:1/-1;padding:16px;background:rgba(0,0,0,.35);border-radius:14px;font-size:32px;font-weight:700;text-align:right;min-height:72px;overflow:hidden;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:1px;display:flex;align-items:center;justify-content:flex-end;border:1px solid var(--glass-border)}
.calc-btn{
  border:none;border-radius:14px;background:rgba(255,255,255,.06);color:var(--text);
  font-size:18px;font-weight:700;cursor:pointer;transition:all .12s;
  border:1px solid var(--glass-border);min-height:52px;
}
.calc-btn:hover{background:rgba(255,255,255,.14)}
.calc-btn:active{transform:scale(.95)}
.calc-btn.op{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.2))}
.calc-btn.eq{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001;font-size:22px}
.calc-btn.ac{background:linear-gradient(135deg,#ff4466,#ff8833);color:#fff}

/* ── Generic App Utilities ── */
.btn{min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(255,255,255,.06);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#001;border-color:transparent}
.inp{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(255,255,255,.04);color:var(--text);font-size:13px;outline:none;margin-bottom:8px}
.inp:focus{border-color:var(--accent)}
.list-item{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:6px;display:flex;align-items:center;gap:10px;font-size:12px;border:1px solid transparent;transition:all .15s}
.list-item:hover{background:rgba(255,255,255,.08);border-color:var(--glass-border)}
.list-item .del{margin-left:auto;background:none;border:none;color:#ff4466;font-size:14px;cursor:pointer;min-width:28px;min-height:28px}
.empty{padding:20px;text-align:center;color:var(--text-mut);font-size:11px;font-style:italic}
.hidden{display:none!important}

/* iPhone / Mobile */
@media(max-width:720px){
  #sidebar{width:64px;padding:10px 4px}
  #sidebar .nav-btn{min-height:50px;padding:8px 4px;justify-content:center}
  #sidebar .nav-btn .ico{font-size:20px;width:auto}
  #desktop{left:64px}
  .haldo-win{width:calc(100vw - 76px)!important;left:4px!important;top:60px!important;height:calc(100vh - 180px)!important;max-height:none!important}
  #bottombar .bb-btn{padding:0 12px;font-size:11px}
  #bottombar .bb-btn .lbl{display:none}
}
@media(max-width:380px){
  #topbar .title small{display:none}

/* ═══════════════════════════════════════════════════════════
   H A L D O   C O R E   ·   Modul 2 · JS-Engine

window.HalDo = window.HalDo || {};

/* ─── 1. TOAST ─── */
HalDo.Toast = (() => {
  const root = document.getElementById('toasts');
  return {
    show(msg, type='', dur=2800) {
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      root.appendChild(el);
      setTimeout(() => { el.style.animation = 'toastOut .2s forwards'; setTimeout(()=>el.remove(), 220); }, dur);
    }
  };
})();

/* ─── 2. SOUND ENGINE (Web Audio, 15 Töne) ─── */
HalDo.Sound = (() => {
  let ctx;
  const getCtx = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; };
  const TONES = {
    ping:   [[880,0.08],[1200,0.06]],
    pop:    [[440,0.05],[660,0.05],[880,0.08]],
    success:[[523,0.1],[659,0.1],[784,0.15]],
    error:  [[400,0.1],[200,0.2]],
    warn:   [[660,0.1],[550,0.1],[660,0.15]],
    bell:   [[1047,0.2],[0,0.05],[1047,0.2]],
    chime:  [[523,0.15],[659,0.15],[784,0.15],[1047,0.3]],
    coin:   [[988,0.08],[1319,0.15]],
    laser:  [[2000,0.05],[800,0.1]],
    click:  [[1200,0.02]],
    notify: [[880,0.1],[0,0.05],[1100,0.15]],
    alert:  [[660,0.1],[880,0.1],[660,0.1],[880,0.15]],
    startup:[[523,0.1],[659,0.1],[784,0.1],[1047,0.25]],
    unlock: [[784,0.08],[1047,0.12]],
    boot:   [[392,0.15],[523,0.15],[659,0.2],[784,0.3]]
  };
  const play = (name='ping', vol=0.15) => {
    try {
      const c = getCtx(); const tone = TONES[name] || TONES.ping;
      let t = c.currentTime;
      tone.forEach(([f, d]) => {
        if (f === 0) { t += d; return; }
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d + 0.02);
        t += d * 0.85;
      });
    } catch(e) {}
  };
  return { play, tones: Object.keys(TONES) };
})();

/* ─── 3. THEME ─── */
HalDo.Theme = (() => {
  const THEMES = {
    holo:{name:'Holo',emoji:'🌌',desc:'Cyan · Blau · Purple'},
    cyborg:{name:'Cyborg',emoji:'⚡',desc:'Pink · Violett'},

    sunset:{name:'Sunset',emoji:'🌅',desc:'Orange · Lila'},
    ice:{name:'Ice',emoji:'❄️',desc:'Weiß · Blau'}
  };
  const set = (t) => {
    document.documentElement.setAttribute('data-theme', t);

    HalDo.Sound.play('unlock');
    HalDo.Toast.show('Theme: ' + (THEMES[t]?.name || t), 'ok');

  const current = () => localStorage.getItem('haldo_theme') || 'holo';
  return { set, current, list: () => THEMES };
})();

/* ─── 4. COSMOS (Three.js: Echte Sonne + 12 Planeten + Sterne) ─── */
HalDo.Cosmos = (() => {
  let scene, camera, renderer, clock;
  let sunMesh, sunGlows = [], planets = [], starsSmall, starsBig;
  let mouseX = 0, mouseY = 0, tgtX = 0, tgtY = 0;
 const TEX_URLS = {
  earthDay:'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg',
  earthNight:'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg',
  earthTopo:'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png',
  earthWater:'https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-water.png',
  earthClouds:'https://cdn.jsdelivr.net/npm/three-globe/example/img/clouds.png',
  moon:'https://cdn.jsdelivr.net/npm/three-globe/example/img/moon.jpg'
};
  const textures = {};
  const loader = new THREE.TextureLoader(); loader.crossOrigin = 'anonymous';

  const makeSunTex = () => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 256;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(256,128,10,256,128,256);
    g.addColorStop(0,'#fff8d0'); g.addColorStop(.3,'#ffcc00');
    g.addColorStop(.6,'#ff8800'); g.addColorStop(.9,'#ff4400');
    x.fillStyle = g; x.fillRect(0,0,512,256);
    for (let i = 0; i < 400; i++) {
      x.fillStyle = Math.random()>.5 ? 'rgba(255,240,150,.5)' : 'rgba(200,60,0,.35)';
      x.beginPath(); x.arc(Math.random()*512, Math.random()*256, Math.random()*6, 0, Math.PI*2); x.fill();
    }
    return new THREE.CanvasTexture(c);
  };

  const makeProcTex = (base, accent, type) => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const x = c.getContext('2d'); x.fillStyle = base; x.fillRect(0,0,256,128);
    if (type === 'bands') {
      for (let i = 0; i < 12; i++) { x.fillStyle = i%2===0 ? base : accent; x.globalAlpha = .6 + Math.random()*.3; x.fillRect(0, i*128/12, 256, 128/12); }
      x.globalAlpha = 1;
    } else if (type === 'crater') {
      for (let i = 0; i < 60; i++) { x.fillStyle = `rgba(0,0,0,${.15+Math.random()*.35})`; x.beginPath(); x.arc(Math.random()*256, Math.random()*128, Math.random()*9+2, 0, Math.PI*2); x.fill(); }
    }
    return new THREE.CanvasTexture(c);
  };

  const makeGlowSprite = (size, c1, c2) => {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(256,256,10,256,256,256);
    g.addColorStop(0,c1); g.addColorStop(.5,c2); g.addColorStop(1,'rgba(255,60,0,0)');
    x.fillStyle = g; x.fillRect(0,0,512,512);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    s.scale.set(size,size,1); return s;
  };

  const createStars = (count, size, opacity) => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count*3), col = new Float32Array(count*3);
    for (let i = 0; i < count; i++) {
      const r = 400 + Math.random()*700, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
      const c = Math.random();
      if (c<.65) { col[i*3]=1;col[i*3+1]=1;col[i*3+2]=1; }
      else if (c<.82) { col[i*3]=.65;col[i*3+1]=.82;col[i*3+2]=1; }
      else if (c<.94) { col[i*3]=1;col[i*3+1]=.9;col[i*3+2]=.55; }
      else { col[i*3]=1;col[i*3+1]=.65;col[i*3+2]=.65; }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(col,3));
    const mat = new THREE.PointsMaterial({size,vertexColors:true,transparent:true,opacity,sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
    return new THREE.Points(geo, mat);
  };

  const init = () => {
    const canvas = document.getElementById('cosmosBg');
    scene = new THREE.Scene(); scene.background = new THREE.Color(0x000208);
    camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 3000);
    camera.position.set(0, 12, 55); camera.lookAt(0,0,0);
    renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    clock = new THREE.Clock();

    ['earthDay','earthNight','earthTopo','earthWater','earthClouds','moon'].forEach(k => {
      loader.load(TEX_URLS[k], t => textures[k] = t, undefined, () => {});
    });

    starsSmall = createStars(5000, 1.0, .75); scene.add(starsSmall);
    starsBig = createStars(900, 2.4, .95); scene.add(starsBig);

    // SUN
    sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(4.5, 64, 64),
      new THREE.MeshBasicMaterial({map: makeSunTex()})
    );
    sunMesh.userData.clickable = true;
    scene.add(sunMesh);

    sunGlows.push(makeGlowSprite(30, 'rgba(255,240,150,.95)', 'rgba(255,180,60,.5)'));
    sunGlows.push(makeGlowSprite(50, 'rgba(255,200,100,.5)', 'rgba(255,120,30,.2)'));
    sunGlows.push(makeGlowSprite(85, 'rgba(255,150,60,.25)', 'rgba(255,60,0,.05)'));
    sunGlows.forEach(g => scene.add(g));

    scene.add(new THREE.PointLight(0xfff5d0, 3.5, 0, 1));
    scene.add(new THREE.AmbientLight(0x505070, .5));

    // PLANETS
    const defs = [
      {name:'Merkur', base:'#8a7d6b', acc:'#5a4f42', size:1.2, dist:12, speed:.7, type:'crater'},
      {name:'Venus', base:'#e8c88a', acc:'#a88040', size:1.7, dist:16, speed:.55, type:'bands'},
      {name:'Erde', base:'#4da8ff', acc:'#1a5599', size:5.0, dist:26, speed:.42, type:'earth'},
      {name:'Mars', base:'#c1440e', acc:'#8a2f0a', size:1.4, dist:34, speed:.35, type:'crater'},
      {name:'Jupiter', base:'#d4a373', acc:'#a08050', size:4.2, dist:44, speed:.25, type:'bands'},
      {name:'Saturn', base:'#e8d5a0', acc:'#a07840', size:3.7, dist:55, speed:.20, type:'bands', ring:true},
      {name:'Uranus', base:'#7de0e0', acc:'#3a8080', size:2.4, dist:64, speed:.15, type:'bands'},
      {name:'Neptun', base:'#3355ee', acc:'#0a1a6a', size:2.2, dist:72, speed:.12, type:'bands'},
      {name:'Pluto', base:'#b08860', acc:'#5a4020', size:.9, dist:80, speed:.09, type:'crater'},
      {name:'Xena', base:'#8866aa', acc:'#4a2a6a', size:1.0, dist:88, speed:.07, type:'crater'},
      {name:'Sedna', base:'#9977cc', acc:'#4a3a7a', size:1.05, dist:96, speed:.05, type:'crater'},
      {name:'Eris', base:'#aaccff', acc:'#5070a0', size:1.1, dist:104, speed:.04, type:'crater'}
    ];

    defs.forEach(def => {
      let mesh, cloudMesh = null;
      if (def.type === 'earth') {
        mesh = new THREE.Mesh(
          new THREE.SphereGeometry(def.size, 64, 64),
          new THREE.MeshPhongMaterial({color:0xffffff, shininess:15, specular:new THREE.Color(0x333333)})
        );
        const applyTex = () => {
          if (textures.earthDay) { mesh.material.map = textures.earthDay; mesh.material.needsUpdate = true; }
          if (textures.earthTopo) { mesh.material.bumpMap = textures.earthTopo; mesh.material.bumpScale = .08; mesh.material.needsUpdate = true; }
          if (textures.earthWater) { mesh.material.specularMap = textures.earthWater; mesh.material.specular = new THREE.Color(0x556677); mesh.material.needsUpdate = true; }
        };
        applyTex();
        setTimeout(applyTex, 1500);
      } else {
        mesh = new THREE.Mesh(
          new THREE.SphereGeometry(def.size, 48, 48),
          new THREE.MeshPhongMaterial({map: makeProcTex(def.base, def.acc, def.type)})
        );
      }
      mesh.userData.name = def.name;
      scene.add(mesh);

      if (def.ring) {
        const ringGeo = new THREE.RingGeometry(def.size*1.4, def.size*2.2, 64);
        const ringMat = new THREE.MeshBasicMaterial({color:0xd4b585, side:THREE.DoubleSide, transparent:true, opacity:.55});
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI/2 - 0.4;
        mesh.add(ring);
      }
      planets.push({mesh, dist:def.dist, speed:def.speed, angle: Math.random()*Math.PI*2, name:def.name});
    });

    // Events
    addEventListener('resize', onResize);
    addEventListener('mousemove', e => { tgtX = (e.clientX/innerWidth - .5)*2; tgtY = (e.clientY/innerHeight - .5)*2; });
    addEventListener('touchmove', e => { if (e.touches[0]) { tgtX = (e.touches[0].clientX/innerWidth - .5)*2; tgtY = (e.touches[0].clientY/innerHeight - .5)*2; } }, {passive:true});
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = ((e.clientX - rect.left)/rect.width)*2 - 1;
      const my = -((e.clientY - rect.top)/rect.height)*2 + 1;
      const ray = new THREE.Raycaster();
      ray.setFromCamera({x:mx, y:my}, camera);
      const hits = ray.intersectObjects([sunMesh, ...planets.map(p=>p.mesh)], false);
      if (hits.length && hits[0].object === sunMesh) {
        HalDo.Sound.play('chime');
        HalDo.Apps.open('chat');
      }
    });

    animate();
  };

  const onResize = () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  };

  const animate = () => {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    mouseX += (tgtX - mouseX) * 0.05;
    mouseY += (tgtY - mouseY) * 0.05;
    camera.position.x = mouseX * 6;
    camera.position.y = 12 + mouseY * 3;
    camera.lookAt(0,0,0);

    sunMesh.rotation.y += 0.002;
    sunGlows.forEach((g,i) => { const s = [30,50,85][i] * (1 + Math.sin(t*0.7 + i)*0.08); g.scale.set(s,s,1); });

    planets.forEach(p => {
      p.angle += p.speed * 0.0025;
      p.mesh.position.set(Math.cos(p.angle)*p.dist, 0, Math.sin(p.angle)*p.dist);
      p.mesh.rotation.y += 0.01;
    });

    starsSmall.rotation.y += 0.00015;
    starsBig.rotation.y += 0.00025;

    renderer.render(scene, camera);
  };

  return { init };
})();

/* ─── 5. WINDOW MANAGER ─── */
HalDo.Win = (() => {
  const desktop = document.getElementById('desktop');
  let zTop = 250;
  const opens = {};

  const open = ({id, title, icon='📦', width=520, height=560, content, onMount}) => {
    if (opens[id]) { opens[id].style.zIndex = ++zTop; HalDo.Sound.play('ping', 0.08); return opens[id]; }
    const win = document.createElement('div');
    win.className = 'haldo-win';
    win.dataset.winId = id;
    win.style.width = Math.min(width, innerWidth - 100) + 'px';
    win.style.height = Math.min(height, innerHeight - 180) + 'px';
    win.style.left = (60 + Object.keys(opens).length * 24) + 'px';
    win.style.top = (60 + Object.keys(opens).length * 24) + 'px';
    win.style.zIndex = ++zTop;
    win.innerHTML = `
      <div class="win-head">
        <span class="ico">${icon}</span>
        <span class="ttl">${title}</span>
        <div class="btns">
          <button class="wbtn close" title="Schließen">✕</button>
        </div>
      </div>
      <div class="win-body">${content || ''}</div>
    `;
    desktop.appendChild(win);
    opens[id] = win;

    // Drag
    const head = win.querySelector('.win-head');
    let dragging = false, sx=0, sy=0, ox=0, oy=0;
    head.addEventListener('mousedown', e => {
      if (e.target.closest('.wbtn')) return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      ox = win.offsetLeft; oy = win.offsetTop;
      win.style.zIndex = ++zTop;
    });
    head.addEventListener('touchstart', e => {
      if (e.target.closest('.wbtn')) return;
      dragging = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      ox = win.offsetLeft; oy = win.offsetTop;
      win.style.zIndex = ++zTop;
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      win.style.left = Math.max(0, Math.min(innerWidth - 100, ox + e.clientX - sx)) + 'px';
      win.style.top = Math.max(0, Math.min(innerHeight - 80, oy + e.clientY - sy)) + 'px';
    });
    document.addEventListener('touchmove', e => {
      if (!dragging) return;
      win.style.left = Math.max(0, Math.min(innerWidth - 100, ox + e.touches[0].clientX - sx)) + 'px';
      win.style.top = Math.max(0, Math.min(innerHeight - 80, oy + e.touches[0].clientY - sy)) + 'px';
    });
    document.addEventListener('mouseup', () => dragging = false);
    document.addEventListener('touchend', () => dragging = false);

    win.querySelector('.wbtn.close').addEventListener('click', () => close(id));
    win.addEventListener('mousedown', () => win.style.zIndex = ++zTop);
    win.addEventListener('touchstart', () => win.style.zIndex = ++zTop);

    if (onMount) setTimeout(() => onMount(win), 50);
    HalDo.Sound.play('ping', 0.08);
    return win;
  };

  const close = (id) => {
    if (!opens[id]) return;
    opens[id].classList.add('closing');
    setTimeout(() => { opens[id]?.remove(); delete opens[id]; }, 200);
  };

  const closeAll = () => Object.keys(opens).forEach(close);
  return { open, close, closeAll };
})();

    Object.entries(GENERIC).forEach(([cat, list]) => {

        if (!out.find(a => a.id === id)) {
          out.push({id, n:name, c:cat, i:'📦'});

    const g = {};

    return g;
  };

/* ─── 9. CHAT SPEECH (TTS + STT) ─── */
HalDo.Chat = (() => {
  const speak = (text) => {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; u.rate = 1.0; u.pitch = 1.0;
      speechSynthesis.speak(u);
    } catch(e) {}
  };
  const listen = (btn, onResult) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { HalDo.Toast.show('Spracherkennung nicht verfügbar', 'warn'); return; }
    const r = new SR(); r.lang = 'de-DE'; r.interimResults = false;
    btn.classList.add('listening');
    r.onresult = e => { const t = e.results[0][0].transcript; btn.classList.remove('listening'); onResult(t); };
    r.onerror = () => { btn.classList.remove('listening'); HalDo.Toast.show('Sprachfehler', 'err'); };
    r.onend = () => btn.classList.remove('listening');
    r.start();
    HalDo.Sound.play('ping', 0.1);
  };
  return { speak, listen };
})();

    'error-soft':   [[500,0.08],[400,0.12]],
    'error-hard':   [[400,0.1],[300,0.1],[200,0.2]],
    // Fun
    'coin-2':       [[880,0.05],[1100,0.05],[1320,0.1]],
    'jump':         [[400,0.08],[800,0.1]],
    'powerup':      [[523,0.06],[659,0.06],[784,0.06],[1047,0.15]],
    'gameover':     [[400,0.15],[300,0.15],[200,0.3]],
    'win':          [[523,0.1],[659,0.1],[784,0.1],[1047,0.1],[1319,0.1],[1568,0.3]],
    'lose':         [[523,0.15],[400,0.15],[300,0.25]],
    'pop-2':        [[1000,0.04],[1500,0.05]],
    'bubble':       [[800,0.03],[1000,0.03],[1200,0.05]]
  };
  // Merge in TONES
  Object.assign(O.tones, EXTRA);
  // Erweiterte play Funktion
  const origPlay = O.play;
  O.play2 = function(name, vol) {
    // Direkt implementiert (weil origPlay closure nicht EXTRA kennt)
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const tone = EXTRA[name];
      if (!tone) return origPlay(name, vol);
      let t = ctx.currentTime;
      tone.forEach(([f, d]) => {
        if (f === 0) { t += d; return; }
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(vol || 0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + d + 0.02);
        t += d * 0.85;
      });
      setTimeout(() => ctx.close(), 2000);
    } catch(e) { origPlay(name, vol); }
  };
  // Kategorien-Getter
  O.categories = {
    Alerts: ['alert-loud','alert-critical','siren','police','horn','warning','danger','error-hard'],
    Blitzer: ['blitzer','radar','construction','fog','ice','traffic','accident'],
    Notify: ['success-2','levelup','reward','achievement','confirm','notification-long','message','dm'],
    System: ['click-soft','click-hard','hover','swoosh','open','close','lock','unlock-2','boot-long','shutdown','error-soft','startup','unlock','boot'],
    Fun: ['coin-2','jump','powerup','gameover','win','lose','pop-2','bubble','coin','pop','ping','chime','bell']
  };
})();

/* ──────────────────────────────────────────────────────────
   3. AVATAR LEBENDIG · Canvas-Gesicht mit Emotionen
   ────────────────────────────────────────────────────────── */
HalDo.AvatarLive = (() => {
  let win = null, canvas, ctx, animId;
  let state = 'idle'; // idle | speaking | listening | thinking | happy | sad | surprised
  let blinkT = 0, lookX = 0, lookY = 0, tgtLookX = 0, tgtLookY = 0;
  let mouthOpen = 0, tgtMouth = 0;
  let t = 0;

  const COLORS = () => {
    const isCy = document.documentElement.getAttribute('data-theme') === 'cyborg';
    return isCy
      ? { skin:'#ff78c8', skin2:'#b478ff', glow:'#ff3d9a', eye:'#ffffff', pupil:'#1a0010', mouth:'#ff3d9a', brow:'#ff3d9a' }
      : { skin:'#4da8ff', skin2:'#00e5ff', glow:'#00e5ff', eye:'#ffffff', pupil:'#001a2a', mouth:'#00e5ff', brow:'#00e5ff' };
  };

  const drawFace = (c) => {
    const W = 320, H = 400;
    ctx.clearRect(0, 0, W, H);
    const cx = W/2, cy = H/2 - 20;

    // Glow
    const grd = ctx.createRadialGradient(cx, cy, 40, cx, cy, 200);
    grd.addColorStop(0, c.glow + '55');
    grd.addColorStop(1, c.glow + '00');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // Atmen (subtle scale)
    const breath = 1 + Math.sin(t*0.02)*0.02;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(breath, breath);
    ctx.translate(-cx, -cy);

    // Kopf
    ctx.beginPath();
    ctx.ellipse(cx, cy, 110, 130, 0, 0, Math.PI*2);
    const headGrad = ctx.createLinearGradient(cx-100, cy-130, cx+100, cy+130);
    headGrad.addColorStop(0, c.skin);
    headGrad.addColorStop(1, c.skin2);
    ctx.fillStyle = headGrad;
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 30;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Augen
    const eyeY = cy - 30, eyeDX = 45;
    const blink = blinkT > 0 ? Math.max(0.1, 1 - blinkT*4) : 1;
    // Linkes Auge
    ctx.beginPath();
    ctx.ellipse(cx-eyeDX, eyeY, 22, 26*blink, 0, 0, Math.PI*2);
    ctx.fillStyle = c.eye;
    ctx.fill();
    if (blink > 0.3) {
      ctx.beginPath();
      ctx.arc(cx-eyeDX + lookX*6, eyeY + lookY*4, 11, 0, Math.PI*2);
      ctx.fillStyle = c.pupil;
      ctx.fill();
      // Glanzpunkt
      ctx.beginPath();
      ctx.arc(cx-eyeDX + lookX*6 - 3, eyeY + lookY*4 - 4, 3, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
    // Rechtes Auge
    ctx.beginPath();
    ctx.ellipse(cx+eyeDX, eyeY, 22, 26*blink, 0, 0, Math.PI*2);
    ctx.fillStyle = c.eye;
    ctx.fill();
    if (blink > 0.3) {
      ctx.beginPath();
      ctx.arc(cx+eyeDX + lookX*6, eyeY + lookY*4, 11, 0, Math.PI*2);
      ctx.fillStyle = c.pupil;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx+eyeDX + lookX*6 - 3, eyeY + lookY*4 - 4, 3, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }

    // Augenbrauen (abhängig von state)
    ctx.strokeStyle = c.brow;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    const browOff = state === 'thinking' ? -8 : state === 'sad' ? 10 : state === 'surprised' ? -14 : 0;
    // Links
    ctx.beginPath();
    ctx.moveTo(cx-eyeDX-18, eyeY-40+browOff);
    ctx.quadraticCurveTo(cx-eyeDX, eyeY-48+browOff, cx-eyeDX+18, eyeY-40+browOff);
    ctx.stroke();
    // Rechts
    ctx.beginPath();
    ctx.moveTo(cx+eyeDX-18, eyeY-40+browOff);
    ctx.quadraticCurveTo(cx+eyeDX, eyeY-48+browOff, cx+eyeDX+18, eyeY-40+browOff);
    ctx.stroke();

    // Mund (abhängig von mouthOpen und state)
    const mouthY = cy + 55;
    const openH = mouthOpen * (state === 'speaking' ? 22 : 8);
    ctx.beginPath();
    if (state === 'happy') {
      ctx.arc(cx, mouthY - 5, 32, 0.15*Math.PI, 0.85*Math.PI);
      ctx.strokeStyle = c.mouth;
      ctx.lineWidth = 5;
      ctx.stroke();
    } else if (state === 'sad') {
      ctx.arc(cx, mouthY + 12, 28, 1.15*Math.PI, 1.85*Math.PI);
      ctx.strokeStyle = c.mouth;
      ctx.lineWidth = 5;
      ctx.stroke();
    } else if (state === 'surprised') {
      ctx.ellipse(cx, mouthY, 14, 18, 0, 0, Math.PI*2);
      ctx.fillStyle = c.mouth;
      ctx.fill();
    } else {
      // Normale Ellipse, skaliert nach mouthOpen
      ctx.ellipse(cx, mouthY, 26, 6 + openH, 0, 0, Math.PI*2);
      ctx.fillStyle = c.mouth;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Holografische Ringe
    if (localStorage.getItem('haldo_rings') !== '0') {
      ctx.strokeStyle = c.glow + '66';
      ctx.lineWidth = 2;
      for (let i = 1; i <= 2; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, 150 + i*20 + Math.sin(t*0.03+i)*4, 0, Math.PI*2);
        ctx.stroke();
      }
    }

    ctx.restore();
  };

  const loop = () => {
    animId = requestAnimationFrame(loop);
    t++;

    // Blinzeln
    blinkT = blinkT > 0 ? blinkT - 0.15 : (Math.random() < 0.005 ? 1 : 0);

    // Augen wandern (nur bei idle / thinking)
    if (state === 'idle' || state === 'thinking') {
      if (Math.random() < 0.01) {
        tgtLookX = (Math.random()-0.5)*2;
        tgtLookY = (Math.random()-0.5)*2;
      }
    }
    lookX += (tgtLookX - lookX) * 0.15;
    lookY += (tgtLookY - lookY) * 0.15;

    // Mund-Animation bei speaking
    if (state === 'speaking') {
      mouthOpen += (Math.random()*0.8 - mouthOpen) * 0.3;
    } else {
      mouthOpen += (0 - mouthOpen) * 0.2;
    }

    if (canvas && ctx) drawFace(COLORS());
  };

  const setState = (s) => {
    state = s;
    if (s === 'happy' || s === 'sad' || s === 'surprised') {
      setTimeout(() => state = 'idle', 3000);
    }
  };

  const open = () => {
    if (win) return;
    const el = document.createElement('div');
    el.className = 'haldo-win';
    el.style.cssText = 'width:min(380px, calc(100vw - 40px));height:min(560px, calc(100vh - 160px));top:70px;left:50%;transform:translateX(-50%);z-index:500';
    el.innerHTML = `
      <div class="win-head">
        <span class="ico">🤖</span>
        <span class="ttl">HalDo · Living Avatar</span>
        <div class="btns"><button class="wbtn close">✕</button></div>
      </div>
      <div class="win-body" style="padding:8px;display:flex;flex-direction:column">
        <canvas id="avCanvas" width="320" height="400" style="width:100%;height:auto;display:block;border-radius:12px;background:rgba(0,0,0,.3)"></canvas>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn primary" id="avChat" style="flex:1;min-width:80px">💬 Chat</button>
          <button class="btn" id="avMic" style="flex:1;min-width:80px">🎤 Sprechen</button>
          <button class="btn" id="avHappy" title="Fröhlich">😊</button>
          <button class="btn" id="avSad" title="Traurig">😢</button>
          <button class="btn" id="avThink" title="Denken">🤔</button>
        </div>
        <div style="text-align:center;font-size:10px;color:var(--text-dim);margin-top:8px">
          ${HalDo.i18n ? HalDo.i18n.t('welcome') : 'Willkommen'} · Präsentiert von Halil Donma
        </div>
      </div>
    `;
    document.getElementById('desktop').appendChild(el);
    win = el;
    canvas = el.querySelector('#avCanvas');
    ctx = canvas.getContext('2d');
    loop();

    el.querySelector('.wbtn.close').addEventListener('click', close);
    el.querySelector('#avChat').addEventListener('click', () => HalDo.Apps.open('chat'));
    el.querySelector('#avMic').addEventListener('click', () => {
      HalDo.Chat.listen(el.querySelector('#avMic'), (txt) => {
        setState('speaking');
        HalDo.Chat.speak('Du hast gesagt: ' + txt);
        setTimeout(() => setState('idle'), 3000);
      });
    });
    el.querySelector('#avHappy').addEventListener('click', () => setState('happy'));
    el.querySelector('#avSad').addEventListener('click', () => setState('sad'));
    el.querySelector('#avThink').addEventListener('click', () => setState('thinking'));
  };

  const close = () => {
    if (!win) return;
    cancelAnimationFrame(animId);
    win.remove(); win = null; canvas = null; ctx = null;
  };

  return { open, close, setState };
})();

/* ──────────────────────────────────────────────────────────
   4. BLITZER APP · Tacho + Warnungen + Sprachansage
   ────────────────────────────────────────────────────────── */
HalDo.Blitzer = (() => {
  let canvas, ctx, animId, t = 0;
  let speed = 0, targetSpeed = 0;
  let warnings = []; // {type, at, spoken}
  let speaking = false;

  const WARNINGS = [
    {icon:'📸', name:'Blitzer', sound:'blitzer', msg:'Achtung! Blitzer in 300 Metern!'},
    {icon:'📸', name:'Radar', sound:'radar', msg:'Radarkontrolle voraus!'},
    {icon:'🚧', name:'Baustelle', sound:'construction', msg:'Baustelle! Bitte verlangsamen.'},
    {icon:'⚠️', name:'Stau', sound:'traffic', msg:'Staugefahr! Achtung.'},
    {icon:'💥', name:'Unfall', sound:'accident', msg:'Unfall voraus! Bitte vorsichtig.'},
    {icon:'🌫️', name:'Nebel', sound:'fog', msg:'Nebel! Sichtweite reduziert.'},
    {icon:'❄️', name:'Glätte', sound:'ice', msg:'Glättegefahr! Vorsichtig fahren.'},
    {icon:'🚨', name:'Gefahr', sound:'danger', msg:'Gefahr! Bitte sofort bremsen.'},
    {icon:'🚔', name:'Polizei', sound:'police', msg:'Polizeikontrolle voraus.'},
    {icon:'🚦', name:'Ampel', sound:'warning', msg:'Ampel! Rotlicht-Gefahr.'},
    {icon:'🛑', name:'Stopp', sound:'alert-loud', msg:'Stopp! Bitte anhalten.'},
    {icon:'🦌', name:'Wild', sound:'warning', msg:'Wildwechsel-Gefahr!'}
  ];

  const draw = () => {
    if (!ctx) return;
    const W = 360, H = 360, cx = W/2, cy = H/2 + 20, R = 140;

    ctx.clearRect(0, 0, W, H);

    // Äußerer Ring
    ctx.beginPath();
    ctx.arc(cx, cy, R+15, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fill();

    // Farbiger Fortschrittsbogen (0-260)
    const maxSpeed = 260;
    const startAngle = Math.PI * 0.75;
    const endAngle = Math.PI * 2.25;
    const speedAngle = startAngle + (Math.min(speed, maxSpeed) / maxSpeed) * (endAngle - startAngle);

    // Hintergrund-Bogen (grau)
    ctx.beginPath();
    ctx.arc(cx, cy, R, startAngle, endAngle);
    ctx.strokeStyle = 'rgba(255,255,255,.1)';
    ctx.lineWidth = 22;
    ctx.stroke();

    // Farbverlauf-Bogen
    const grad = ctx.createLinearGradient(cx-R, cy, cx+R, cy);
    grad.addColorStop(0, '#00e5ff');
    grad.addColorStop(0.5, '#ffd580');
    grad.addColorStop(1, '#ff4466');
    ctx.beginPath();
    ctx.arc(cx, cy, R, startAngle, speedAngle);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 22;
    ctx.lineCap = 'round';
    ctx.stroke();

    // Zahlen & Markierungen
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= maxSpeed; i += 20) {
      const a = startAngle + (i/maxSpeed) * (endAngle - startAngle);
      const r1 = R - 32, r2 = R - 42;
      const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
      const x2 = cx + Math.cos(a) * r2, y2 = cy + Math.sin(a) * r2;
      ctx.strokeStyle = i % 40 === 0 ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.4)';
      ctx.lineWidth = i % 40 === 0 ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      if (i % 40 === 0) {
        const tx = cx + Math.cos(a) * (R - 58), ty = cy + Math.sin(a) * (R - 58);
        ctx.fillText(i, tx, ty);
      }
    }

    // Nadel
    const nx = cx + Math.cos(speedAngle) * (R - 20);
    const ny = cy + Math.sin(speedAngle) * (R - 20);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(nx, ny);
    ctx.strokeStyle = '#ff3d9a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#ff3d9a';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Mittelpunkt
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI*2);
    ctx.fillStyle = '#ff3d9a';
    ctx.fill();

    // Digitale Anzeige
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(Math.round(speed), cx, cy + 80);
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('km/h', cx, cy + 105);

    // Aktuelle Warnung
    const activeW = warnings.find(w => w.active && !w.expired);
    if (activeW) {
      const pulse = 1 + Math.sin(t*0.2)*0.1;
      ctx.save();
      ctx.translate(cx, 40);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#ff3d9a';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(activeW.icon + ' ' + activeW.name, 0, 0);
      ctx.font = '11px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText(activeW.msg, 0, 22);
      ctx.restore();
    }
  };

  const loop = () => {
    animId = requestAnimationFrame(loop);
    t++;
    speed += (targetSpeed - speed) * 0.1;

    // Auto-Geschwindigkeit simulieren (Demo)
    if (!window._blitzerManual) {
      targetSpeed = 60 + Math.sin(t*0.01)*40 + Math.random()*15;
    }

    // Warnungen checken
    warnings.forEach(w => {
      if (!w.active && Date.now() >= w.at) {
        w.active = true;
        if (!w.spoken) {
          w.spoken = true;
          HalDo.Sound.play2(w.sound, 0.15);
          speak(w.msg);
        }
      }
      if (w.active && Date.now() > w.at + 8000) w.expired = true;
    });

    draw();
  };

  const speak = (txt) => {
    if (!window.speechSynthesis || speaking) return;
    speaking = true;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'de-DE'; u.rate = 1.0;
    u.onend = () => speaking = false;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  };

  const open = () => {
    const el = document.createElement('div');
    el.className = 'haldo-win';
    el.style.cssText = 'width:min(420px, calc(100vw - 40px));height:min(680px, calc(100vh - 160px));top:70px;left:50%;transform:translateX(-50%);z-index:500';
    el.innerHTML = `
      <div class="win-head">
        <span class="ico">🚗</span>
        <span class="ttl">HalDo · Blitzer Pro</span>
        <div class="btns"><button class="wbtn close">✕</button></div>
      </div>
      <div class="win-body" style="padding:8px;display:flex;flex-direction:column">
        <canvas id="blitzCanvas" width="360" height="360" style="width:100%;height:auto;display:block;border-radius:12px;background:rgba(0,0,0,.4)"></canvas>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn primary" id="bManual" style="flex:1">🎮 Manuell</button>
          <button class="btn" id="bWarn" style="flex:1">🚨 Warnung testen</button>
          <button class="btn" id="bReset" style="flex:1">↺ Reset</button>
        </div>
        <div style="margin-top:10px;max-height:120px;overflow-y:auto" id="warnList"></div>
      </div>
    `;
    document.getElementById('desktop').appendChild(el);
    win = el;
    canvas = el.querySelector('#blitzCanvas');
    ctx = canvas.getContext('2d');

    // Slider manuell
    el.querySelector('#bManual').addEventListener('click', () => {
      window._blitzerManual = !window._blitzerManual;
      el.querySelector('#bManual').textContent = window._blitzerManual ? '🎮 Auto' : '🎮 Manuell';
    });

    // Warnung testen
    const wlist = el.querySelector('#warnList');
    WARNINGS.forEach(w => {
      const b = document.createElement('button');
      b.className = 'list-item';
      b.style.cssText = 'width:100%;margin-bottom:4px;cursor:pointer';
      b.innerHTML = `<span style="font-size:16px">${w.icon}</span><span style="flex:1;text-align:left">${w.name}</span>`;
      b.addEventListener('click', () => {
        warnings.push({...w, at:Date.now(), spoken:false, active:false});
        HalDo.Toast.show(w.icon + ' ' + w.name + ' ausgelöst', 'warn');
      });
      wlist.appendChild(b);
    });

    el.querySelector('#bWarn').addEventListener('click', () => {
      const w = WARNINGS[Math.floor(Math.random()*WARNINGS.length)];
      warnings.push({...w, at:Date.now(), spoken:false, active:false});
    });

    el.querySelector('#bReset').addEventListener('click', () => {
      warnings = []; targetSpeed = 0; speed = 0;
    });

    el.querySelector('.wbtn.close').addEventListener('click', () => {
      cancelAnimationFrame(animId);
      el.remove();
      canvas = null; ctx = null;
    });

    loop();
  };

  return { open };
})();

const AppHelpers = {

// ── HABITS ──
const HabitsApp = () => {
  const s = AppHelpers.storage('haldo_habits_v2');
  const html = `<div style="display:flex;gap:8px"><input class="inp" id="hName" placeholder="Neue Gewohnheit (z.B. Wasser trinken)" style="margin:0;flex:1"><button class="btn primary" id="hAdd">+</button></div><div id="hList" style="margin-top:12px"></div>`;
  HalDo.Win.open({id:'win-habits2', title:'Habits', icon:'🔁', width:460, height:540, content:html, onMount:(w)=>{
    const render = () => {
      const items = s.load();
      w.querySelector('#hList').innerHTML = items.length ? items.map((h,i)=>{
        const today = new Date().toDateString();
        const done = h.log && h.log.includes(today);
        const streak = (h.log||[]).length;
        return `<div class="list-item"><div style="flex:1"><strong>${h.name}</strong><br><small style="color:var(--text-dim)">🔥 ${streak} Tage Streak</small></div><button class="btn${done?' primary':''}" data-h="${i}">${done?'✓':'○'}</button><button class="del" data-d="${i}">✕</button></div>`;
      }).join('') : '<div class="empty">Noch keine Gewohnheiten</div>';
      w.querySelectorAll('[data-h]').forEach(b => b.addEventListener('click', () => {
        const a = s.load(), i = +b.dataset.h, today = new Date().toDateString();
        a[i].log = a[i].log || [];
        if (a[i].log.includes(today)) a[i].log = a[i].log.filter(d=>d!==today);
        else { a[i].log.push(today); HalDo.Sound.play2('reward', 0.12); }
        s.save(a); render();
      }));
      w.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { const a = s.load(); a.splice(+b.dataset.d,1); s.save(a); render(); }));
    };
    w.querySelector('#hAdd').addEventListener('click', () => {
      const v = w.querySelector('#hName').value.trim(); if (!v) return;
      const a = s.load(); a.push({name:v, log:[]}); s.save(a); w.querySelector('#hName').value = ''; render();
    });
    render();
  }});
};

// ── GOALS ──
const GoalsApp = () => {
  const s = AppHelpers.storage('haldo_goals_v2');
  const html = `<input class="inp" id="gTitle" placeholder="Neues Ziel..."><div style="display:flex;gap:8px;margin-bottom:8px"><input class="inp" id="gTarget" type="number" placeholder="Ziel (z.B. 100)" style="margin:0;flex:1"><input class="inp" id="gUnit" placeholder="Einheit (€, km...)" style="margin:0;flex:1"></div><button class="btn primary" id="gAdd" style="width:100%">+ Ziel hinzufügen</button><div id="gList" style="margin-top:12px"></div>`;
  HalDo.Win.open({id:'win-goals2', title:'Goals', icon:'🎯', width:460, height:540, content:html, onMount:(w)=>{
    const render = () => {
      const items = s.load();
      w.querySelector('#gList').innerHTML = items.length ? items.map((g,i)=>{
        const pct = Math.min(100, Math.round((g.cur||0)/g.target*100));
        return `<div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px"><div style="display:flex;align-items:center"><strong style="flex:1">${g.title}</strong><button class="del" data-d="${i}">✕</button></div><div style="height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .3s"></div></div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim)"><span>${g.cur||0} / ${g.target} ${g.unit||''}</span><span>${pct}%</span></div><button class="btn" data-inc="${i}" style="min-height:32px;font-size:11px">+ Fortschritt</button></div>`;
      }).join('') : '<div class="empty">Noch keine Ziele</div>';
      w.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
        const a = s.load(); const i = +b.dataset.inc;
        const step = Math.max(1, Math.round(a[i].target/10));
        a[i].cur = (a[i].cur||0) + step;
        if (a[i].cur >= a[i].target) HalDo.Sound.play2('achievement', 0.15);
        s.save(a); render();
      }));
      w.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { const a = s.load(); a.splice(+b.dataset.d,1); s.save(a); render(); }));
    };
    w.querySelector('#gAdd').addEventListener('click', () => {
      const t = w.querySelector('#gTitle').value.trim();
      if (!t) return;
      const a = s.load();
      a.push({title:t, target:+w.querySelector('#gTarget').value||100, unit:w.querySelector('#gUnit').value.trim(), cur:0});
      s.save(a); w.querySelector('#gTitle').value=''; w.querySelector('#gTarget').value=''; w.querySelector('#gUnit').value='';
      render();
    });
    render();
  }});
};

/* ──────────────────────────────────────────────────────────
   2. SOUND v2 · 40+ Töne
   ────────────────────────────────────────────────────────── */
HalDo.SoundV2 = (() => {
  const TONES = {
    'alert-loud':   [[880,0.1],[1200,0.1],[880,0.1],[1200,0.15]],
    'alert-critical':[[1400,0.1],[0,0.05],[1400,0.1],[0,0.05],[1400,0.2]],
    'siren':        [[600,0.15],[900,0.15],[600,0.15],[900,0.2]],
    'police':       [[1000,0.1],[700,0.1],[1000,0.1],[700,0.1],[1000,0.15]],
    'horn':         [[400,0.3],[0,0.05],[400,0.3]],
    'blitzer':      [[1400,0.08],[0,0.05],[1800,0.1],[0,0.05],[1400,0.1]],
    'radar':        [[2000,0.06],[0,0.03],[2000,0.06],[0,0.03],[2000,0.1]],
    'warning':      [[660,0.12],[550,0.12],[660,0.18]],
    'danger':       [[220,0.2],[0,0.05],[220,0.2],[0,0.05],[220,0.3]],
    'construction': [[550,0.15],[400,0.15],[550,0.2]],
    'fog':          [[300,0.2],[400,0.2],[500,0.25]],
    'ice':          [[1200,0.08],[1600,0.08],[1200,0.12]],
    'traffic':      [[800,0.1],[1000,0.1],[800,0.15]],
    'accident':     [[500,0.15],[300,0.2],[500,0.2]],
    'success-2':    [[1047,0.1],[1319,0.15],[1568,0.2]],
    'levelup':      [[523,0.1],[659,0.1],[784,0.1],[1047,0.1],[1319,0.25]],
    'reward':       [[880,0.1],[1100,0.1],[1320,0.1],[1760,0.3]],
    'achievement':  [[523,0.15],[659,0.15],[784,0.15],[1047,0.15],[1319,0.15],[1568,0.3]],
    'confirm':      [[880,0.08],[1200,0.12]],
    'notification-long':[[880,0.1],[0,0.05],[880,0.1],[0,0.05],[1200,0.2]],
    'message':      [[1047,0.08],[1319,0.08],[1568,0.12]],
    'dm':           [[880,0.06],[1047,0.06],[1319,0.1]],
    'click-soft':   [[800,0.03]],
    'click-hard':   [[400,0.04]],
    'hover':        [[600,0.02]],
    'swoosh':       [[400,0.05],[600,0.05],[800,0.05],[1000,0.08]],
    'open':         [[500,0.06],[800,0.1]],
    'close':        [[800,0.06],[500,0.1]],
    'lock':         [[600,0.08],[400,0.12]],
    'unlock-2':     [[400,0.08],[800,0.12]],
    'boot-long':    [[392,0.2],[523,0.2],[659,0.2],[784,0.2],[1047,0.4]],
    'shutdown':     [[1047,0.15],[784,0.15],[523,0.15],[392,0.3]],
    'error-soft':   [[500,0.08],[400,0.12]],
    'error-hard':   [[400,0.1],[300,0.1],[200,0.2]],
    'coin-2':       [[880,0.05],[1100,0.05],[1320,0.1]],
    'jump':         [[400,0.08],[800,0.1]],
    'powerup':      [[523,0.06],[659,0.06],[784,0.06],[1047,0.15]],
    'gameover':     [[400,0.15],[300,0.15],[200,0.3]],
    'win':          [[523,0.1],[659,0.1],[784,0.1],[1047,0.1],[1319,0.1],[1568,0.3]],
    'lose':         [[523,0.15],[400,0.15],[300,0.25]],
    'pop-2':        [[1000,0.04],[1500,0.05]],
    'bubble':       [[800,0.03],[1000,0.03],[1200,0.05]]
  };
  const categories = {
    Alerts: ['alert-loud','alert-critical','siren','police','horn','warning','danger','error-hard'],
    Blitzer: ['blitzer','radar','construction','fog','ice','traffic','accident'],
    Notify: ['success-2','levelup','reward','achievement','confirm','notification-long','message','dm'],
    System: ['click-soft','click-hard','hover','swoosh','open','close','lock','unlock-2','boot-long','shutdown','error-soft'],
    Fun: ['coin-2','jump','powerup','gameover','win','lose','pop-2','bubble']
  };
  const play = (name, vol=0.15) => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const tone = TONES[name];
      if (!tone) { if (HalDo.Sound) HalDo.Sound.play(name, vol); return; }
      let t = ctx.currentTime;
      tone.forEach(([f, d]) => {
        if (f === 0) { t += d; return; }
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + d + 0.02);
        t += d * 0.85;
      });
      setTimeout(() => ctx.close(), 2500);
    } catch(e) { if (HalDo.Sound) HalDo.Sound.play(name, vol); }
  };
  return { play, categories, tones: TONES };
})();

/* ──────────────────────────────────────────────────────────
   3. AVATAR LEBENDIG · Canvas
   ────────────────────────────────────────────────────────── */
HalDo.AvatarLive = (() => {
  let win = null, canvas, ctx, animId;
  let state = 'idle', blinkT = 0, lookX = 0, lookY = 0, tgtLookX = 0, tgtLookY = 0;
  let mouthOpen = 0, t = 0;

  const COLORS = () => {
    const isCy = document.documentElement.getAttribute('data-theme') === 'cyborg';
    return isCy
      ? {skin:'#ff78c8',skin2:'#b478ff',glow:'#ff3d9a',eye:'#fff',pupil:'#1a0010',mouth:'#ff3d9a',brow:'#ff3d9a'}
      : {skin:'#4da8ff',skin2:'#00e5ff',glow:'#00e5ff',eye:'#fff',pupil:'#001a2a',mouth:'#00e5ff',brow:'#00e5ff'};
  };

  const draw = () => {
    const c = COLORS();
    const W = 320, H = 400, cx = W/2, cy = H/2 - 20;
    ctx.clearRect(0,0,W,H);
    const grd = ctx.createRadialGradient(cx,cy,40,cx,cy,200);
    grd.addColorStop(0, c.glow+'55'); grd.addColorStop(1, c.glow+'00');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);
    const breath = 1 + Math.sin(t*0.02)*0.02;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(breath,breath); ctx.translate(-cx,-cy);
    ctx.beginPath(); ctx.ellipse(cx,cy,110,130,0,0,Math.PI*2);
    const hg = ctx.createLinearGradient(cx-100,cy-130,cx+100,cy+130);
    hg.addColorStop(0,c.skin); hg.addColorStop(1,c.skin2);
    ctx.fillStyle = hg; ctx.shadowColor = c.glow; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0;
    const eyeY = cy-30, eyeDX = 45, blink = blinkT>0 ? Math.max(0.1,1-blinkT*4) : 1;
    [cx-eyeDX, cx+eyeDX].forEach(ex => {
      ctx.beginPath(); ctx.ellipse(ex, eyeY, 22, 26*blink, 0, 0, Math.PI*2); ctx.fillStyle = c.eye; ctx.fill();
      if (blink > 0.3) {
        ctx.beginPath(); ctx.arc(ex+lookX*6, eyeY+lookY*4, 11, 0, Math.PI*2); ctx.fillStyle = c.pupil; ctx.fill();
        ctx.beginPath(); ctx.arc(ex+lookX*6-3, eyeY+lookY*4-4, 3, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
      }
    });
    ctx.strokeStyle = c.brow; ctx.lineWidth = 4; ctx.lineCap = 'round';
    const browOff = state==='thinking' ? -8 : state==='sad' ? 10 : state==='surprised' ? -14 : 0;
    [[cx-eyeDX,1],[cx+eyeDX,-1]].forEach(([ex,dir]) => {
      ctx.beginPath(); ctx.moveTo(ex-18*dir, eyeY-40+browOff); ctx.quadraticCurveTo(ex, eyeY-48+browOff, ex+18*dir, eyeY-40+browOff); ctx.stroke();
    });
    const mouthY = cy+55, openH = mouthOpen * (state==='speaking' ? 22 : 8);
    ctx.beginPath();
    if (state === 'happy') {
      ctx.arc(cx, mouthY-5, 32, 0.15*Math.PI, 0.85*Math.PI);
      ctx.strokeStyle = c.mouth; ctx.lineWidth = 5; ctx.stroke();
    } else if (state === 'sad') {
      ctx.arc(cx, mouthY+12, 28, 1.15*Math.PI, 1.85*Math.PI);
      ctx.strokeStyle = c.mouth; ctx.lineWidth = 5; ctx.stroke();
    } else if (state === 'surprised') {
      ctx.ellipse(cx, mouthY, 14, 18, 0, 0, Math.PI*2); ctx.fillStyle = c.mouth; ctx.fill();
    } else {
      ctx.ellipse(cx, mouthY, 26, 6+openH, 0, 0, Math.PI*2);
      ctx.fillStyle = c.mouth; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;
    }
    if (localStorage.getItem('haldo_rings') !== '0') {
      ctx.strokeStyle = c.glow+'66'; ctx.lineWidth = 2;
      for (let i = 1; i <= 2; i++) {
        ctx.beginPath(); ctx.arc(cx, cy, 150+i*20+Math.sin(t*0.03+i)*4, 0, Math.PI*2); ctx.stroke();
      }
    }
    ctx.restore();
  };

  const loop = () => {
    animId = requestAnimationFrame(loop);
    t++;
    blinkT = blinkT > 0 ? blinkT-0.15 : (Math.random()<0.005 ? 1 : 0);
    if (state === 'idle' || state === 'thinking') {
      if (Math.random() < 0.01) { tgtLookX = (Math.random()-0.5)*2; tgtLookY = (Math.random()-0.5)*2; }
    }
    lookX += (tgtLookX-lookX)*0.15; lookY += (tgtLookY-lookY)*0.15;
    if (state === 'speaking') mouthOpen += (Math.random()*0.8-mouthOpen)*0.3;
    else mouthOpen += (0-mouthOpen)*0.2;
    if (canvas && ctx) draw();
  };

  const setState = (s) => {
    state = s;
    if (s === 'happy' || s === 'sad' || s === 'surprised') setTimeout(() => state = 'idle', 3000);
  };

  const open = () => {
    if (win && document.contains(win)) return;
    const el = document.createElement('div');
    el.className = 'haldo-win';
    el.style.cssText = 'width:min(380px, calc(100vw - 40px));height:min(600px, calc(100vh - 140px));top:70px;left:50%;transform:translateX(-50%);z-index:500';
    el.innerHTML = `
      <div class="win-head">
        <span class="ico">🤖</span><span class="ttl">HalDo · Living Avatar</span>
        <div class="btns"><button class="wbtn close">✕</button></div>
      </div>
      <div class="win-body" style="padding:8px;display:flex;flex-direction:column">
        <canvas id="avCanvas" width="320" height="400" style="width:100%;height:auto;display:block;border-radius:12px;background:rgba(0,0,0,.3)"></canvas>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn primary" id="avChat" style="flex:1;min-width:80px">💬 Chat</button>
          <button class="btn" id="avMic" style="flex:1;min-width:80px">🎤 Sprechen</button>
          <button class="btn" id="avHappy" title="Fröhlich">😊</button>
          <button class="btn" id="avSad" title="Traurig">😢</button>
          <button class="btn" id="avThink" title="Denken">🤔</button>
        </div>
        <div style="text-align:center;font-size:10px;color:var(--text-dim);margin-top:8px">
          ${HalDo.i18n.t('welcome')} · Präsentiert von Halil Donma
        </div>
      </div>
    `;
    document.getElementById('desktop').appendChild(el);
    win = el;
    canvas = el.querySelector('#avCanvas');
    ctx = canvas.getContext('2d');
    loop();
    el.querySelector('.wbtn.close').addEventListener('click', close);
    el.querySelector('#avChat').addEventListener('click', () => HalDo.Apps.open('chat'));
    el.querySelector('#avMic').addEventListener('click', () => {
      HalDo.Chat.listen(el.querySelector('#avMic'), (txt) => {
        setState('speaking');
        HalDo.Chat.speak('Du hast gesagt: ' + txt);
        setTimeout(() => setState('idle'), 3000);
      });
    });
    el.querySelector('#avHappy').addEventListener('click', () => setState('happy'));
    el.querySelector('#avSad').addEventListener('click', () => setState('sad'));
    el.querySelector('#avThink').addEventListener('click', () => setState('thinking'));
  };

  const close = () => {
    if (!win) return;
    cancelAnimationFrame(animId);
    win.remove(); win = null; canvas = null; ctx = null;
  };

  return { open, close, setState };
})();

/* ──────────────────────────────────────────────────────────
   4. BLITZER APP · Tacho + 12 Warnungen
   ────────────────────────────────────────────────────────── */
HalDo.Blitzer = (() => {
  let canvas, ctx, animId, t = 0, win = null;
  let speed = 0, targetSpeed = 0, warnings = [], speaking = false;

  const WARNINGS = [
    {icon:'📸', name:'Blitzer', sound:'blitzer', msg:'Achtung! Blitzer in 300 Metern!'},
    {icon:'📸', name:'Radar', sound:'radar', msg:'Radarkontrolle voraus!'},
    {icon:'🚧', name:'Baustelle', sound:'construction', msg:'Baustelle! Bitte verlangsamen.'},
    {icon:'⚠️', name:'Stau', sound:'traffic', msg:'Staugefahr! Achtung.'},
    {icon:'💥', name:'Unfall', sound:'accident', msg:'Unfall voraus! Bitte vorsichtig.'},
    {icon:'🌫️', name:'Nebel', sound:'fog', msg:'Nebel! Sichtweite reduziert.'},
    {icon:'❄️', name:'Glätte', sound:'ice', msg:'Glättegefahr! Vorsichtig fahren.'},
    {icon:'🚨', name:'Gefahr', sound:'danger', msg:'Gefahr! Bitte sofort bremsen.'},
    {icon:'🚔', name:'Polizei', sound:'police', msg:'Polizeikontrolle voraus.'},
    {icon:'🚦', name:'Ampel', sound:'warning', msg:'Ampel! Rotlicht-Gefahr.'},
    {icon:'🛑', name:'Stopp', sound:'alert-loud', msg:'Stopp! Bitte anhalten.'},
    {icon:'🦌', name:'Wild', sound:'warning', msg:'Wildwechsel-Gefahr!'}
  ];

  const draw = () => {
    if (!ctx) return;
    const W = 360, H = 360, cx = W/2, cy = H/2+20, R = 140;
    ctx.clearRect(0,0,W,H);
    ctx.beginPath(); ctx.arc(cx,cy,R+15,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fill();
    const maxS = 260, sa = Math.PI*0.75, ea = Math.PI*2.25, spA = sa + (Math.min(speed,maxS)/maxS)*(ea-sa);
    ctx.beginPath(); ctx.arc(cx,cy,R,sa,ea); ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=22; ctx.stroke();
    const g = ctx.createLinearGradient(cx-R,cy,cx+R,cy);
    g.addColorStop(0,'#00e5ff'); g.addColorStop(0.5,'#ffd580'); g.addColorStop(1,'#ff4466');
    ctx.beginPath(); ctx.arc(cx,cy,R,sa,spA); ctx.strokeStyle=g; ctx.lineWidth=22; ctx.lineCap='round'; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for (let i = 0; i <= maxS; i += 20) {
      const a = sa + (i/maxS)*(ea-sa);
      const x1 = cx+Math.cos(a)*(R-32), y1 = cy+Math.sin(a)*(R-32);
      const x2 = cx+Math.cos(a)*(R-42), y2 = cy+Math.sin(a)*(R-42);
      ctx.strokeStyle = i%40===0 ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.4)';
      ctx.lineWidth = i%40===0 ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      if (i%40===0) { const tx = cx+Math.cos(a)*(R-58), ty = cy+Math.sin(a)*(R-58); ctx.fillText(i, tx, ty); }
    }
    const nx = cx+Math.cos(spA)*(R-20), ny = cy+Math.sin(spA)*(R-20);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(nx,ny); ctx.strokeStyle='#ff3d9a'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.shadowColor='#ff3d9a'; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fillStyle='#ff3d9a'; ctx.fill();
    ctx.fillStyle='#00e5ff'; ctx.font='bold 40px monospace'; ctx.textAlign='center'; ctx.fillText(Math.round(speed), cx, cy+80);
    ctx.font='bold 12px sans-serif'; ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillText('km/h', cx, cy+105);
    const aw = warnings.find(w => w.active && !w.expired);
    if (aw) {
      const pulse = 1+Math.sin(t*0.2)*0.1;
      ctx.save(); ctx.translate(cx,40); ctx.scale(pulse,pulse);
      ctx.fillStyle='#ff3d9a'; ctx.font='bold 24px sans-serif'; ctx.textAlign='center'; ctx.fillText(aw.icon+' '+aw.name, 0, 0);
      ctx.font='11px sans-serif'; ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fillText(aw.msg, 0, 22);
      ctx.restore();
    }
  };

  const speak = (txt) => {
    if (!window.speechSynthesis || speaking) return;
    speaking = true;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang='de-DE'; u.rate=1.0; u.onend = () => speaking = false;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };

  const loop = () => {
    animId = requestAnimationFrame(loop);
    t++;
    speed += (targetSpeed-speed)*0.1;
    if (!window._blitzerManual) targetSpeed = 60+Math.sin(t*0.01)*40+Math.random()*15;
    warnings.forEach(w => {
      if (!w.active && Date.now() >= w.at) { w.active = true; if (!w.spoken) { w.spoken = true; HalDo.SoundV2.play(w.sound,0.15); speak(w.msg); } }
      if (w.active && Date.now() > w.at+8000) w.expired = true;
    });
    draw();
  };

  const open = () => {
    if (win && document.contains(win)) return;
    const el = document.createElement('div');
    el.className = 'haldo-win';
    el.style.cssText = 'width:min(420px, calc(100vw - 40px));height:min(700px, calc(100vh - 140px));top:70px;left:50%;transform:translateX(-50%);z-index:500';
    el.innerHTML = `
      <div class="win-head"><span class="ico">🚗</span><span class="ttl">HalDo · Blitzer Pro</span><div class="btns"><button class="wbtn close">✕</button></div></div>
      <div class="win-body" style="padding:8px;display:flex;flex-direction:column">
        <canvas id="blitzCanvas" width="360" height="360" style="width:100%;height:auto;display:block;border-radius:12px;background:rgba(0,0,0,.4)"></canvas>
        <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn primary" id="bManual" style="flex:1">🎮 Manuell</button>
          <button class="btn" id="bWarn" style="flex:1">🚨 Warnung testen</button>
          <button class="btn" id="bReset" style="flex:1">↺ Reset</button>
        </div>
        <div style="margin-top:10px;max-height:140px;overflow-y:auto" id="warnList"></div>
      </div>
    `;
    document.getElementById('desktop').appendChild(el);
    win = el;
    canvas = el.querySelector('#blitzCanvas');
    ctx = canvas.getContext('2d');
    el.querySelector('#bManual').addEventListener('click', (e) => {
      window._blitzerManual = !window._blitzerManual;
      e.target.textContent = window._blitzerManual ? '🎮 Auto' : '🎮 Manuell';
    });
    const wl = el.querySelector('#warnList');
    WARNINGS.forEach(w => {
      const b = document.createElement('button');
      b.className = 'list-item';
      b.style.cssText = 'width:100%;margin-bottom:4px;cursor:pointer';
      b.innerHTML = `<span style="font-size:16px">${w.icon}</span><span style="flex:1;text-align:left">${w.name}</span>`;
      b.addEventListener('click', () => { warnings.push({...w, at:Date.now(), spoken:false, active:false}); HalDo.Toast.show(w.icon+' '+w.name+' ausgelöst','warn'); });
      wl.appendChild(b);
    });
    el.querySelector('#bWarn').addEventListener('click', () => {
      const w = WARNINGS[Math.floor(Math.random()*WARNINGS.length)];
      warnings.push({...w, at:Date.now(), spoken:false, active:false});
    });
    el.querySelector('#bReset').addEventListener('click', () => { warnings = []; targetSpeed = 0; speed = 0; });
    el.querySelector('.wbtn.close').addEventListener('click', () => {
      cancelAnimationFrame(animId); el.remove(); win = null; canvas = null; ctx = null;
    });
    loop();
  };

  return { open };
})();

const store = (key) => ({
  load: () => JSON.parse(localStorage.getItem(key) || '[]'),
  save: (a) => localStorage.setItem(key, JSON.stringify(a))
});

const HabitsApp = () => {
  const s = store('haldo_habits_v2');
  HalDo.Win.open({id:'win-habits2', title:'Habits', icon:'🔁', width:460, height:540,
    content: `<div style="display:flex;gap:8px"><input class="inp" id="hName" placeholder="Neue Gewohnheit..." style="margin:0;flex:1"><button class="btn primary" id="hAdd">+</button></div><div id="hList" style="margin-top:12px"></div>`,
    onMount:(w)=>{
      const render = () => {
        const items = s.load();
        w.querySelector('#hList').innerHTML = items.length ? items.map((h,i)=>{
          const today = new Date().toDateString();
          const done = (h.log||[]).includes(today);
          const streak = (h.log||[]).length;
          return `<div class="list-item"><div style="flex:1"><strong>${h.name}</strong><br><small style="color:var(--text-dim)">🔥 ${streak} Tage</small></div><button class="btn${done?' primary':''}" data-h="${i}">${done?'✓':'○'}</button><button class="del" data-d="${i}">✕</button></div>`;
        }).join('') : '<div class="empty">Noch keine Gewohnheiten</div>';
        w.querySelectorAll('[data-h]').forEach(b => b.addEventListener('click', () => {
          const a = s.load(), i = +b.dataset.h, today = new Date().toDateString();
          a[i].log = a[i].log || [];
          if (a[i].log.includes(today)) a[i].log = a[i].log.filter(d=>d!==today);
          else { a[i].log.push(today); HalDo.SoundV2.play('reward',0.12); }
          s.save(a); render();
        }));
        w.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { const a = s.load(); a.splice(+b.dataset.d,1); s.save(a); render(); }));
      };
      w.querySelector('#hAdd').addEventListener('click', () => {
        const v = w.querySelector('#hName').value.trim(); if (!v) return;
        const a = s.load(); a.push({name:v, log:[]}); s.save(a); w.querySelector('#hName').value=''; render();
      });
      render();
    }});
};

const GoalsApp = () => {

/* ──────────────────────────────────────────────────────────
   8. SETTINGS ERWEITERN · Sprache + Sound-Bibliothek
   ────────────────────────────────────────────────────────── */
const OLD_SETTINGS_OPEN = HalDo.Apps.open;
HalDo.Apps.open = function(id) {
  if (id === 'settings') {
    OLD_SETTINGS_OPEN('settings'); // original öffnen
    setTimeout(() => {
      // Zusätzliche Sections nachträglich anhängen
      const settingsWin = document.querySelector('[data-win-id="win-settings"] .win-body');
      if (!settingsWin || settingsWin.dataset.extended) return;
      settingsWin.dataset.extended = '1';
      const extra = document.createElement('div');
      extra.innerHTML = `
        <div class="set-section">
          <div class="set-head"><span class="ico">🌍</span><span class="ttl">Sprache · ${HalDo.i18n.langNames[HalDo.i18n.current()]}</span><span class="arrow">▶</span></div>
          <div class="set-body">
            <div class="chip-row">${HalDo.i18n.all().map(l => `<div class="chip${l===HalDo.i18n.current()?' on':''}" data-lang="${l}">${HalDo.i18n.langNames[l]}</div>`).join('')}</div>
          </div>
        </div>
        <div class="set-section">
          <div class="set-head"><span class="ico">🔊</span><span class="ttl">Sound-Bibliothek · 40+ Töne</span><span class="arrow">▶</span></div>
          <div class="set-body">
            ${Object.entries(HalDo.SoundV2.categories).map(([cat,arr]) => `
              <div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase">${cat}</div>
              <div class="chip-row">${arr.map(tone => `<div class="chip" data-sound="${tone}">▶ ${tone}</div>`).join('')}</div></div>
            `).join('')}
          </div>
        </div>
      `;
      settingsWin.appendChild(extra);
      // Events
      settingsWin.querySelectorAll('[data-lang]').forEach(c => c.addEventListener('click', () => {
        HalDo.i18n.set(c.dataset.lang);
        settingsWin.querySelectorAll('[data-lang]').forEach(x => x.classList.remove('on'));
        c.classList.add('on');
      }));
      settingsWin.querySelectorAll('[data-sound]').forEach(c => c.addEventListener('click', () => {
        HalDo.SoundV2.play(c.dataset.sound, 0.15);
      }));
      settingsWin.querySelectorAll('.set-head').forEach(h => h.addEventListener('click', () => h.parentElement.classList.toggle('open')));
    }, 150);
    return;
  }
  return OLD_SETTINGS_OPEN(id);
};
