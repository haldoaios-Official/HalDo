<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS Pro Max – v136</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#00e5ff;--primary-rgb:0,229,255;--secondary:#4da8ff;--accent:#b478ff;
  --gold:#ffd700;--gold-rgb:255,215,0;--bg-0:#01010a;--panel:rgba(8,15,35,0.72);
  --border:rgba(0,229,255,0.38);--border-strong:rgba(0,229,255,0.75);
  --text:#e8f6ff;--text-dim:#7fa5d0;
  --glow-sm:0 0 14px rgba(0,229,255,0.5);--glow-md:0 0 28px rgba(0,229,255,0.55);
  --blur:26px;--radius-w:18px;--radius-b:14px;--topbar-h:58px;
  --font-base:13px;--anim-speed:1;
  --safe-top:max(env(safe-area-inset-top,0px),24px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
  
  --win-outer:var(--gold);
  --win-inner:var(--primary);
  --win-inner-border:var(--border-strong);
}
[data-theme="cyborg"]{--primary:#ff78c8;--primary-rgb:255,120,200;--secondary:#b478ff;--accent:#ff78c8;--border:rgba(255,120,200,.42);--border-strong:rgba(255,120,200,.8);--glow-sm:0 0 14px rgba(255,120,200,.55);--glow-md:0 0 28px rgba(255,120,200,.6)}
[data-theme="gold"]{--primary:#ffd700;--primary-rgb:255,215,0;--secondary:#ffb300;--accent:#ff9500;--border:rgba(255,215,0,.42);--border-strong:rgba(255,215,0,.8);--glow-sm:0 0 14px rgba(255,215,0,.55);--glow-md:0 0 28px rgba(255,215,0,.6)}
[data-theme="matrix"]{--primary:#00ff88;--primary-rgb:0,255,136;--secondary:#00cc66;--accent:#00ffaa;--border:rgba(0,255,136,.42);--border-strong:rgba(0,255,136,.8);--glow-sm:0 0 14px rgba(0,255,136,.55);--glow-md:0 0 28px rgba(0,255,136,.6)}
[data-theme="crimson"]{--primary:#ff3355;--primary-rgb:255,51,85;--secondary:#ff6644;--accent:#ff0055;--border:rgba(255,51,85,.42);--border-strong:rgba(255,51,85,.8);--glow-sm:0 0 14px rgba(255,51,85,.55);--glow-md:0 0 28px rgba(255,51,85,.6)}
[data-theme="sunset"]{--primary:#ff9900;--primary-rgb:255,153,0;--secondary:#ff5599;--accent:#ffcc00;--border:rgba(255,153,0,.42);--border-strong:rgba(255,153,0,.8);--glow-sm:0 0 14px rgba(255,153,0,.55);--glow-md:0 0 28px rgba(255,153,0,.6)}
[data-theme="ice"]{--primary:#aee0ff;--primary-rgb:174,224,255;--secondary:#e6f7ff;--accent:#cceeff;--border:rgba(174,224,255,.45);--border-strong:rgba(174,224,255,.85);--glow-sm:0 0 14px rgba(174,224,255,.55);--glow-md:0 0 28px rgba(174,224,255,.6);--text:#f4fbff}

html,body{height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:var(--text);user-select:none;-webkit-font-smoothing:antialiased;position:fixed;inset:0;letter-spacing:.15px;font-size:var(--font-base)}
#cosmosBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}

/* Loader, Welcome, Splash */
#loader{position:fixed;inset:0;z-index:10000;background:radial-gradient(circle at center,#050520,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#loader .spin{width:60px;height:60px;border:3px solid rgba(0,229,255,.2);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:var(--primary);font-weight:600;letter-spacing:2px;font-size:12px}
#welcome{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 24px;text-align:center;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);transition:opacity .6s}
#welcome.hide{opacity:0;pointer-events:none}
#welcome .globe{font-size:90px;filter:drop-shadow(0 0 40px var(--primary));animation:globeFloat 4s ease-in-out infinite}
@keyframes globeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
#welcome h1{font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent),var(--primary));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
#welcome h2{font-size:clamp(14px,2vw,18px);color:var(--text);font-weight:400;line-height:1.6;max-width:600px;opacity:.9}
#welcome .presented{font-size:11px;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase}
#welcome .presented b{color:var(--gold);font-weight:700}
#welcome .enter-btn{margin-top:16px;padding:16px 48px;border-radius:32px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer;border:none;box-shadow:0 8px 30px rgba(var(--primary-rgb),.6);transition:all .25s}
#appSplash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(circle at center,rgba(0,229,255,.18) 0%,rgba(5,8,16,.96) 70%);backdrop-filter:blur(14px)}
#appSplash.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.splash-ic{font-size:110px;filter:drop-shadow(0 0 40px var(--primary));animation:splashSpin 1.2s ease-out}
@keyframes splashSpin{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.15) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
.splash-nm{font-size:28px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),#ffaa00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.splash-pr{font-size:10px;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase}
.splash-pr b{color:var(--gold)}
.splash-greet{font-size:12px;color:var(--text);text-align:center;max-width:80vw;line-height:1.6;margin-top:8px;opacity:.85}

/* Top-Bar */
#topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--topbar-h) + var(--safe-top));padding:var(--safe-top) calc(16px + var(--safe-right)) 0 calc(16px + var(--safe-left));z-index:1000;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(8,15,35,0.92),rgba(8,15,35,0.62));backdrop-filter:blur(var(--blur)) saturate(180%);border-bottom:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.45);box-sizing:border-box}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand-logo{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0%,transparent 40%),radial-gradient(circle at 70% 70%,var(--accent),var(--primary) 45%,var(--secondary) 75%,#002040);box-shadow:0 0 18px rgba(var(--primary-rgb),.7);animation:spinGlobe 20s linear infinite}
@keyframes spinGlobe{to{transform:rotate(360deg)}}
.brand-name{font-size:15px;font-weight:800;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:8px;color:var(--text-dim);letter-spacing:2.5px;margin-top:-1px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:7px}
.tb-btn{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(var(--primary-rgb),.08),rgba(var(--primary-rgb),.02));border:1.5px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tb-clock{font-family:"SF Mono",monospace;font-size:12px;color:var(--primary);padding:0 10px;font-weight:700;background:rgba(var(--primary-rgb),.08);border-radius:8px;height:30px;display:flex;align-items:center;border:1px solid var(--border)}

/* Sidebar */
#sidebar{position:fixed;top:calc(var(--topbar-h) + var(--safe-top));left:0;bottom:calc(60px + var(--safe-bottom));width:220px;padding:12px 10px;z-index:900;background:linear-gradient(180deg,rgba(8,15,35,0.92),rgba(8,15,35,0.75));backdrop-filter:blur(var(--blur));border-right:1.5px solid var(--border);overflow-y:auto;transition:transform .35s}
#sidebar.collapsed{transform:translateX(-100%)}
.side-section{margin-bottom:14px}
.side-label{font-size:9px;color:var(--text-dim);letter-spacing:2.5px;text-transform:uppercase;padding:6px 10px;font-weight:800;opacity:.7}
.side-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;margin:2px 0;border-radius:11px;background:transparent;border:1px solid transparent;color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;text-align:left;min-height:42px}
.side-btn:hover{background:rgba(var(--primary-rgb),.12);border-color:var(--border)}
.side-btn .ico{font-size:16px;width:22px;text-align:center}

/* Bottom-Bar (Chat, AI, CYBORG) */
#bottombar{position:fixed;bottom:0;left:0;right:0;height:calc(60px + var(--safe-bottom));padding-bottom:var(--safe-bottom);z-index:950;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(0deg,rgba(8,15,35,0.95),rgba(8,15,35,0.7));backdrop-filter:blur(20px);border-top:1.5px solid var(--win-outer);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.bb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;min-width:70px}
.bb-btn:hover,.bb-btn.on{background:rgba(var(--primary-rgb),.2);border-color:var(--primary);box-shadow:var(--glow-sm)}
.bb-btn .ic{font-size:18px}

/* Desktop */
#desktop{position:fixed;top:calc(var(--topbar-h) + var(--safe-top));left:220px;right:0;bottom:calc(60px + var(--safe-bottom));z-index:1;overflow:hidden;transition:left .35s}
#desktop.full{left:0}

/* Fenster-Design */
.window{
  position:absolute;min-width:300px;min-height:220px;
  background:linear-gradient(135deg,rgba(8,15,35,0.85),rgba(8,15,35,0.7));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  border:2px solid var(--win-outer);
  border-radius:var(--radius-w);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(var(--gold-rgb),.25);
  display:flex;flex-direction:column;z-index:200;overflow:hidden;
  animation:winOpen .3s cubic-bezier(.4,.14,.3,1);
  position:relative;
}
.window::before{
  content:"";position:absolute;inset:3px;border-radius:calc(var(--radius-w) - 3px);
  border:1.5px solid var(--win-inner);
  pointer-events:none;z-index:0;opacity:.7;
}
.window.active{
  border-color:var(--win-outer);
  box-shadow:0 20px 70px rgba(0,0,0,.7),0 0 60px rgba(var(--gold-rgb),.4);
  z-index:250;
}
@keyframes winOpen{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.win-header{
  display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:grab;
  background:linear-gradient(90deg,rgba(var(--gold-rgb),.15),rgba(var(--primary-rgb),.05));
  border-bottom:1.5px solid var(--win-inner-border);
  min-height:50px;flex-shrink:0;position:relative;z-index:1;
}
.win-title{font-size:13px;font-weight:700;flex:1;padding-left:4px;color:var(--gold);text-shadow:0 0 8px rgba(var(--gold-rgb),.5)}
.win-controls{display:flex;gap:6px;flex-shrink:0}
.win-ctrl{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--win-inner-border);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600;position:relative;z-index:999999}
.win-ctrl:hover{background:rgba(var(--primary-rgb),.25)}
.win-ctrl.close:hover{background:rgba(255,60,80,.75)}
.win-body{flex:1;padding:18px;overflow:auto;font-size:var(--font-base);line-height:1.55;position:relative;z-index:1}

/* UI Elemente */
.btn{min-height:42px;padding:10px 18px;border-radius:var(--radius-b);background:linear-gradient(135deg,rgba(var(--primary-rgb),.2),rgba(var(--primary-rgb),.05));border:1.5px solid var(--border);color:var(--text);font-size:var(--font-base);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:rgba(var(--primary-rgb),.3);box-shadow:var(--glow-sm)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffaa00);color:#000;border-color:transparent}
.input,textarea,select{width:100%;min-height:42px;padding:10px 14px;border-radius:var(--radius-b);background:rgba(0,0,0,.35);border:1.5px solid var(--border);color:var(--text);font-size:var(--font-base);font-family:inherit;outline:none}
.input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 20px rgba(var(--primary-rgb),.35)}
textarea{min-height:100px;resize:vertical}
.toggle{position:relative;display:inline-block;width:48px;height:27px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;border-radius:14px;background:rgba(0,0,0,.55);border:1.5px solid var(--border);cursor:pointer}
.toggle .slider::before{content:"";position:absolute;height:19px;width:19px;left:2px;top:2px;background:linear-gradient(135deg,#888,#aaa);border-radius:50%;transition:.3s}
.toggle input:checked + .slider{background:rgba(var(--primary-rgb),.45);border-color:var(--primary)}
.toggle input:checked + .slider::before{transform:translateX(21px);background:linear-gradient(135deg,var(--primary),#fff)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1.5px solid var(--border);color:var(--text);font-size:11px;font-weight:600;cursor:pointer}
.chip:hover,.chip.on{background:rgba(var(--primary-rgb),.28);border-color:var(--primary)}
.set-section{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(0,0,0,.25)}
.set-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;background:rgba(var(--primary-rgb),.04)}
.set-head .letter{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;font-weight:900;font-size:13px;flex-shrink:0}
.set-head .title{flex:1;font-size:13px;font-weight:700}
.set-body{display:none;padding:10px 15px 15px}
.set-section.open .set-body{display:block}
.slider-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.slider-row label{flex:1;font-size:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--primary);height:24px}
.slider-row .val{min-width:44px;text-align:right;color:var(--primary);font-weight:700;font-size:11px}

/* Toasts, Avatar, Chat, App Grid */
#toasts{position:fixed;bottom:calc(120px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:5000;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;max-width:min(90vw,400px)}
.toast{background:linear-gradient(135deg,rgba(8,15,35,0.92),rgba(8,15,35,0.8));backdrop-filter:blur(20px);border:1.5px solid var(--primary);border-radius:14px;padding:12px 18px;box-shadow:var(--glow-md);font-size:12px;font-weight:600;color:var(--text);animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:10px}
@keyframes toastIn{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{transform:translateY(-24px);opacity:0}}
#avatarFab{position:fixed;bottom:calc(80px + var(--safe-bottom));right:calc(20px + var(--safe-right));z-index:800;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle,var(--primary),var(--secondary) 55%,var(--accent));border:2px solid var(--border-strong);box-shadow:0 0 28px rgba(var(--primary-rgb),.65);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#avatarFab::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--border-strong);animation:pulseRing 2.5s ease-out infinite}
@keyframes pulseRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.chat-container{display:flex;flex-direction:column;height:100%;min-height:320px}
.chat-messages{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:9px}
.chat-msg{padding:10px 14px;border-radius:16px;max-width:85%;font-size:var(--font-base);line-height:1.5;animation:msgIn .3s;word-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#001;border-bottom-right-radius:6px}
.chat-msg.ai{align-self:flex-start;background:rgba(var(--primary-rgb),.15);border:1px solid var(--border);border-bottom-left-radius:6px}
.chat-input-row{display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-row input{flex:1}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:11px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);cursor:pointer;text-align:center}
.app-tile:hover{background:rgba(var(--primary-rgb),.18);box-shadow:var(--glow-sm);transform:translateY(-3px)}
.app-tile .ic{font-size:28px}
.app-tile .nm{font-size:10px;line-height:1.25;word-break:break-word;font-weight:500}
.hidden{display:none!important}
.win-body h3{color:var(--primary);font-size:14px;margin-bottom:11px;margin-top:14px;font-weight:700}
.win-body h3:first-child{margin-top:0}
.win-body p{margin-bottom:9px;color:var(--text-dim);font-size:12px;line-height:1.65}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:7px;border:1px solid var(--border)}
.list-item .txt{flex:1;font-size:12px}

@media(max-width:640px){
  :root{--topbar-h:54px;--font-base:12.5px}
  #sidebar{width:200px}
  #desktop{left:0}
  .window{min-width:260px;max-width:calc(100vw - 20px)}
  #avatarFab{width:60px;height:60px;font-size:26px;bottom:calc(70px + var(--safe-bottom))}
  #bottombar{height:calc(56px + var(--safe-bottom))}
  .bb-btn{padding:4px 8px;min-width:60px}
}
</style>
</head>
<body data-theme="holo">

<div id="loader"><div class="spin"></div><p>TEXTUREN LADEN...</p></div>

<div id="welcome">
  <div class="globe">🌍</div>
  <h1>HALDO AI OS</h1>
  <h2>Willkommen zurück, Bruder 💙<br>Dein Universum aus Kosmos, Medizin und Intelligenz.</h2>
  <div class="presented">Präsentiert von <b>Halil Donma</b></div>
  <button class="enter-btn" onclick="window.HalDo.enterApp()">JETZT STARTEN →</button>
</div>

<div id="appSplash">
  <div class="splash-ic" id="splashIc">🤖</div>
  <div class="splash-nm" id="splashNm">HalDo AI OS</div>
  <div class="splash-pr">Präsentiert von <b>Halil Donma</b></div>
  <div class="splash-greet" id="splashGreet"></div>
</div>

<canvas id="cosmosBg"></canvas>

<div id="topbar">
  <div class="brand" onclick="window.HalDo.UI.toggleSidebar()">
    <div class="brand-logo"></div>
    <div>
      <div class="brand-name">HalDo AI OS</div>
      <div class="brand-sub">PRO MAX · v136</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="tb-clock" id="tbClock">--:--</div>
    <button class="tb-btn" onclick="window.HalDo.UI.openSettings()" title="Einstellungen">⚙️</button>
    <button class="tb-btn" onclick="window.HalDo.UI.openApp('about')" title="Info">ℹ️</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const HalDo = window.HalDo = {};
HalDo.version = 'v136 Pro Max – Das große App-Update';

/* Sound Engine */
HalDo.Sound = (() => {
  let ctx;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; };
  const beep = (f,d,t='sine',v=.15) => { try { const c=ensure(); const o=c.createOscillator(),g=c.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d); } catch(e){} };
  const S = { click:()=>beep(880,.05,'sine',.08), success:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*70)), error:()=>{beep(220,.2,'sawtooth',.15);setTimeout(()=>beep(165,.25,'sawtooth',.15),150)}, message:()=>{beep(1000,.08);setTimeout(()=>beep(1300,.12),90)}, alarm:()=>{for(let i=0;i<3;i++){setTimeout(()=>beep(1200,.15,'square',.2),i*200);setTimeout(()=>beep(900,.15,'square',.2),i*200+100)}} };
  return { play:(n)=>{try{(S[n]||S.click)()}catch(e){}} };
})();

/* Toast Engine */
HalDo.Toast = (() => {
  const c = document.getElementById('toasts');
  return { show(msg, o={}) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span style="font-size:18px">${o.icon||'✨'}</span><span>${msg}</span>`; c.appendChild(t); if (o.sound) HalDo.Sound.play(o.sound); setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(),350); }, o.duration||3000); } };
})();

/* Kosmos */
HalDo.Cosmos = (() => {
  let scene, camera, renderer, sunMesh, sunCorona, sunCorona2, sunCorona3;
  let planets = [], starsSmall, starsBig, clock;
  let earthMesh, earthClouds, earthAtmo, earthNight;
  let jupiterMoons = [];
  let targetMouseX = 0, targetMouseY = 0, mouseX = 0, mouseY = 0;
  let loadedTextures = 0, totalTextures = 6;
  const TEX_URLS = { earthDay: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg', earthNight: 'https://unpkg.com/three-globe/example/img/earth-night.jpg', earthTopology: 'https://unpkg.com/three-globe/example/img/earth-topology.png', earthWater: 'https://unpkg.com/three-globe/example/img/earth-water.png', earthClouds: 'https://unpkg.com/three-globe/example/img/clouds.png', moon: 'https://unpkg.com/three-globe/example/img/moon.jpg' };
  const textures = {};
  const loader = new THREE.TextureLoader(); loader.crossOrigin = 'anonymous';
  const makeProcedural = (color, color2, type) => {
    const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
    const ctx = canvas.getContext('2d'); ctx.fillStyle = color; ctx.fillRect(0,0,256,128);
    if (type === 'bands') { for (let i = 0; i < 12; i++) { ctx.fillStyle = i%2===0?color:color2; ctx.globalAlpha = .5+Math.random()*.3; ctx.fillRect(0, i*128/12, 256, 128/12); } ctx.globalAlpha = 1; if (color === '#d4a373') { ctx.fillStyle = 'rgba(200,80,50,.85)'; ctx.beginPath(); ctx.ellipse(180,80,22,13,0,0,Math.PI*2); ctx.fill(); } }
    else if (type === 'crater') { for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(0,0,0,${.15+Math.random()*.3})`; ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*128,Math.random()*8+2,0,Math.PI*2); ctx.fill(); } }
    else if (type === 'cloud') { for (let i = 0; i < 30; i++) { ctx.fillStyle = `rgba(255,255,255,${.1+Math.random()*.2})`; ctx.beginPath(); ctx.ellipse(Math.random()*256,Math.random()*128,Math.random()*30+10,Math.random()*10+3,Math.random()*Math.PI,0,Math.PI*2); ctx.fill(); } }
    else if (type === 'sun') { const g = ctx.createRadialGradient(128,64,0,128,64,128); g.addColorStop(0,'#fff5a0'); g.addColorStop(.4,'#ffcc00'); g.addColorStop(.7,'#ff9900'); g.addColorStop(1,'#ff4400'); ctx.fillStyle = g; ctx.fillRect(0,0,256,128); for (let i = 0; i < 250; i++) { ctx.fillStyle = Math.random()>.5?'rgba(255,255,220,.5)':'rgba(200,50,0,.35)'; ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*128,Math.random()*4,0,Math.PI*2); ctx.fill(); } }
    return new THREE.CanvasTexture(canvas);
  };
  const loadTex = (key,url) => { loader.load(url, tex => { textures[key] = tex; loadedTextures++; if (loadedTextures===totalTextures) hideLoader(); }, undefined, () => { loadedTextures++; if (loadedTextures===totalTextures) hideLoader(); }); };
  const hideLoader = () => { setTimeout(() => { const l = document.getElementById('loader'); if (l) { l.classList.add('hide'); setTimeout(()=>l.remove(),600); } }, 500); };
  const createStars = (count,size,opacity) => { const geo = new THREE.BufferGeometry(); const pos = new Float32Array(count*3); const colors = new Float32Array(count*3); for (let i = 0; i < count; i++) { const r = 400+Math.random()*700; const theta = Math.random()*Math.PI*2; const phi = Math.acos(2*Math.random()-1); pos[i*3]=r*Math.sin(phi)*Math.cos(theta); pos[i*3+1]=r*Math.sin(phi)*Math.sin(theta); pos[i*3+2]=r*Math.cos(phi); const c = Math.random(); if (c<.65) { colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1; } else if (c<.82) { colors[i*3]=.65; colors[i*3+1]=.82; colors[i*3+2]=1; } else if (c<.94) { colors[i*3]=1; colors[i*3+1]=.9; colors[i*3+2]=.55; } else { colors[i*3]=1; colors[i*3+1]=.65; colors[i*3+2]=.65; } } geo.setAttribute('position', new THREE.BufferAttribute(pos,3)); geo.setAttribute('color', new THREE.BufferAttribute(colors,3)); const mat = new THREE.PointsMaterial({ size, vertexColors:true, transparent:true, opacity, sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending }); return new THREE.Points(geo, mat); };
  const init = () => {
    const canvas = document.getElementById('cosmosBg');
    scene = new THREE.Scene(); scene.background = new THREE.Color(0x000208);
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, .1, 3000);
    camera.position.set(0, 10, 42); camera.lookAt(0,0,0);
    renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    clock = new THREE.Clock();
    ['earthDay','earthNight','earthTopology','earthWater','earthClouds','moon'].forEach(k => loadTex(k, TEX_URLS[k]));
    setTimeout(hideLoader, 6000);
    starsSmall = createStars(5000, 1.0, .75); scene.add(starsSmall);
    starsBig = createStars(900, 2.4, .95); scene.add(starsBig);
    const sunGeo = new THREE.SphereGeometry(4,64,64);
    sunMesh = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ map: makeProcedural('#ffcc00','#ff4400','sun') })); scene.add(sunMesh);
    scene.add(new THREE.PointLight(0xfff5d0, 3.5, 0, 1));
    scene.add(new THREE.AmbientLight(0x505070, .45));
    const makeGlow = (size,c1,c2) => { const c = document.createElement('canvas'); c.width=c.height=512; const cx = c.getContext('2d'); const g = cx.createRadialGradient(256,256,20,256,256,256); g.addColorStop(0,c1); g.addColorStop(.5,c2); g.addColorStop(1,'rgba(255,60,0,0)'); cx.fillStyle=g; cx.fillRect(0,0,512,512); const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false })); s.scale.set(size,size,1); return s; };
    sunCorona = makeGlow(28,'rgba(255,240,150,.95)','rgba(255,180,60,.5)');
    sunCorona2 = makeGlow(45,'rgba(255,200,100,.5)','rgba(255,120,30,.2)');
    sunCorona3 = makeGlow(75,'rgba(255,150,60,.2)','rgba(255,60,0,.05)');
    scene.add(sunCorona); scene.add(sunCorona2); scene.add(sunCorona3);

    const planetDefs = [
      { name:'Merkur', color:'#8a7d6b', color2:'#5a4f42', size:1.2, dist:11, speed:.7, type:'crater' },
      { name:'Venus', color:'#e8c88a', color2:'#a88040', size:1.7, dist:15, speed:.55, type:'cloud' },
      { name:'Erde', color:'#4da8ff', color2:'#1a5599', size:5.0, dist:26, speed:.42, type:'earth' },
      { name:'Mars', color:'#c1440e', color2:'#8a2f0a', size:1.4, dist:34, speed:.35, type:'crater' },
      { name:'Jupiter', color:'#d4a373', color2:'#a08050', size:4.2, dist:44, speed:.25, type:'bands' },
      { name:'Saturn', color:'#e8d5a0', color2:'#a07840', size:3.7, dist:55, speed:.20, type:'bands', ring:true },
      { name:'Uranus', color:'#7de0e0', color2:'#3a8080', size:2.4, dist:64, speed:.15, type:'bands' },
      { name:'Neptun', color:'#3355ee', color2:'#0a1a6a', size:2.2, dist:72, speed:.12, type:'bands' },
      { name:'Pluto', color:'#b08860', color2:'#5a4020', size:.9, dist:80, speed:.09, type:'crater' },
      { name:'Xena', color:'#8866aa', color2:'#4a2a6a', size:1.0, dist:88, speed:.07, type:'crater' },
      { name:'Sedna', color:'#9977cc', color2:'#4a3a7a', size:1.05, dist:96, speed:.05, type:'crater' },
      { name:'Eris', color:'#aaccff', color2:'#5070a0', size:1.1, dist:104, speed:.04, type:'crater' }
    ];

    planets = [];
    planetDefs.forEach(def => {
      const geo = new THREE.SphereGeometry(def.size,64,64);
      let mat;
      if (def.name === 'Erde') {
        mat = new THREE.MeshPhongMaterial({ color:0xffffff, shininess:15, specular:new THREE.Color(0x333333) });
        earthMesh = new THREE.Mesh(geo, mat); earthMesh.position.set(def.dist,0,0); scene.add(earthMesh);
        const applyEarth = () => {
          if (textures.earthDay) { mat.map = textures.earthDay; mat.needsUpdate = true; }
          if (textures.earthTopology) { mat.bumpMap = textures.earthTopology; mat.bumpScale = .08; mat.needsUpdate = true; }
          if (textures.earthWater) { mat.specularMap = textures.earthWater; mat.specular = new THREE.Color(0x556677); mat.needsUpdate = true; }
          if (textures.earthDay && textures.earthNight && !earthNight) {
            const ng = new THREE.SphereGeometry(def.size*1.002,64,64);
            const nm = new THREE.MeshBasicMaterial({ map:textures.earthNight, blending:THREE.AdditiveBlending, transparent:true, opacity:.85, depthWrite:false });
            earthNight = new THREE.Mesh(ng, nm); earthMesh.add(earthNight);
          }
        };
        setTimeout(applyEarth, 1500); setTimeout(applyEarth, 3000); setTimeout(applyEarth, 5000);
        const cg = new THREE.SphereGeometry(def.size*1.015,64,64);
        const cm = new THREE.MeshPhongMaterial({ transparent:true, opacity:.75, depthWrite:false });
        earthClouds = new THREE.Mesh(cg, cm); earthMesh.add(earthClouds);
        setTimeout(() => { if (textures.earthClouds) { cm.map = textures.earthClouds; cm.alphaMap = textures.earthClouds; cm.needsUpdate = true; } }, 2500);
        const ag = new THREE.SphereGeometry(def.size*1.15,64,64);
        const am = new THREE.ShaderMaterial({ vertexShader:`varying vec3 vNormal; varying vec3 vViewPosition; void main(){ vec4 mvPosition = modelViewMatrix * vec4(position,1.0); vNormal = normalize(normalMatrix * normal); vViewPosition = -mvPosition.xyz; gl_Position = projectionMatrix * mvPosition; }`, fragmentShader:`varying vec3 vNormal; varying vec3 vViewPosition; void main(){ vec3 viewDir = normalize(vViewPosition); float fresnel = pow(1.0 - abs(dot(vNormal, viewDir)), 3.0); gl_FragColor = vec4(0.35, 0.65, 1.0, fresnel * 0.95); }`, blending:THREE.AdditiveBlending, side:THREE.BackSide, transparent:true, depthWrite:false });
        earthAtmo = new THREE.Mesh(ag, am); earthMesh.add(earthAtmo);
        const moonGeo = new THREE.SphereGeometry(1.2,32,32); const moonMat = new THREE.MeshPhongMaterial({ color:0xcccccc, shininess:2 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat); moonMesh.userData = { orbitRadius:def.size+5.5, angle:0, speed:.03 }; scene.add(moonMesh); earthMesh.userData.moon = moonMesh;
        setTimeout(() => { if (textures.moon) { moonMat.map = textures.moon; moonMat.needsUpdate = true; } }, 2000);
        planets.push({ mesh:earthMesh, dist:def.dist, speed:def.speed, angle:Math.random()*Math.PI*2 }); return;
      }
      mat = new THREE.MeshPhongMaterial({ map:makeProcedural(def.color,def.color2,def.type), shininess:def.type==='bands'?3:1, emissive:new THREE.Color(def.color2), emissiveIntensity:.12 });
      const mesh = new THREE.Mesh(geo, mat); mesh.position.set(def.dist,0,0); scene.add(mesh);
      if (def.ring) {
        const rg = new THREE.RingGeometry(def.size*1.4, def.size*2.4, 64);
        const rc = document.createElement('canvas'); rc.width=256; rc.height=32; const rx = rc.getContext('2d');
        for (let x = 0; x < 256; x++) { const a = (Math.sin(x*.3)*.4+.5)*(1-Math.abs(x-128)/128*.3); const c = x%3===0?'180,150,100':'232,213,160'; rx.fillStyle=`rgba(${c},${a})`; rx.fillRect(x,0,1,32); }
        const rm = new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(rc), transparent:true, opacity:.88, side:THREE.DoubleSide, depthWrite:false });
        const rMesh = new THREE.Mesh(rg, rm); rMesh.rotation.x = -Math.PI/2.3; mesh.add(rMesh);
      }
      if (def.name === 'Jupiter') { for (let i = 0; i < 4; i++) { const mg = new THREE.SphereGeometry(.25+i*.03,16,16); const mm = new THREE.MeshPhongMaterial({ color:[0xddddcc,0xccccbb,0xbbbbaa,0xaaaa99][i], shininess:1 }); const m = new THREE.Mesh(mg, mm); m.userData = { orbitRadius:def.size+1.8+i*.8, angle:Math.random()*Math.PI*2, speed:.03-i*.005 }; mesh.add(m); jupiterMoons.push(m); } }
      const og = new THREE.RingGeometry(def.dist-.08, def.dist+.08, 128);
      const om = new THREE.MeshBasicMaterial({ color:0x00aaff, side:THREE.DoubleSide, transparent:true, opacity:.09 });
      const oMesh = new THREE.Mesh(og, om); oMesh.rotation.x = -Math.PI/2; scene.add(oMesh);
      planets.push({ mesh, dist:def.dist, speed:def.speed, angle:Math.random()*Math.PI*2 });
    });

    window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    window.addEventListener('mousemove', e => { targetMouseX = (e.clientX/window.innerWidth-.5)*2; targetMouseY = (e.clientY/window.innerHeight-.5)*2; });
    animate();
  };
  const animate = () => {
    requestAnimationFrame(animate); const dt = clock.getDelta(); const t = clock.getElapsedTime();
    mouseX += (targetMouseX-mouseX)*.03; mouseY += (targetMouseY-mouseY)*.03;
    camera.position.x = mouseX*3; camera.position.y = 10+mouseY*2; camera.lookAt(0,0,0);
    if (sunMesh) sunMesh.rotation.y += dt*.08;
    if (sunCorona) { const p = 1+Math.sin(t*1.5)*.04; sunCorona.scale.set(28*p,28*p,1); }
    if (sunCorona2) { const p = 1+Math.sin(t*1.2+1)*.05; sunCorona2.scale.set(45*p,45*p,1); }
    if (sunCorona3) { const p = 1+Math.sin(t*.9+2)*.06; sunCorona3.scale.set(75*p,75*p,1); }
    if (starsSmall) starsSmall.rotation.y += dt*.005;
    if (starsBig) starsBig.rotation.y += dt*.003;
    planets.forEach(p => { p.angle += dt*p.speed*.15; p.mesh.position.x = Math.cos(p.angle)*p.dist; p.mesh.position.z = Math.sin(p.angle)*p.dist; p.mesh.rotation.y += dt*.5; });
    if (earthClouds) earthClouds.rotation.y += dt*.14;
    if (earthNight && earthMesh) earthNight.rotation.y = earthMesh.rotation.y;
    if (earthMesh && earthMesh.userData.moon) { const m = earthMesh.userData.moon; m.userData.angle += dt*m.userData.speed; m.position.x = earthMesh.position.x + Math.cos(m.userData.angle)*m.userData.orbitRadius; m.position.z = earthMesh.position.z + Math.sin(m.userData.angle)*m.userData.orbitRadius; m.rotation.y += dt*.3; }
    jupiterMoons.forEach(m => { m.userData.angle += dt*m.userData.speed; m.position.x = Math.cos(m.userData.angle)*m.userData.orbitRadius; m.position.z = Math.sin(m.userData.angle)*m.userData.orbitRadius; });
    renderer.render(scene, camera);
  };
  return { start: init };
})();

/* Registry */
HalDo.Registry = (() => {

/* Windows */
HalDo.Windows = (() => {
  const desktop = document.getElementById('desktop');
  let zTop = 250; const wins = new Map(); let cascade = 0;
  const create = (id,title,html,opts={}) => {
    if (wins.has(id)) { const w = wins.get(id); w.el.style.zIndex = ++zTop; w.el.classList.add('active'); document.querySelectorAll('.window').forEach(x => { if (x !== w.el) x.classList.remove('active'); }); return w; }
    const el = document.createElement('div'); el.className = 'window active'; el.dataset.id = id;
    const maxW = desktop.clientWidth-20; const maxH = desktop.clientHeight-20;
    const vw = Math.min(maxW, opts.width||500); const vh = Math.min(maxH, opts.height||420);
    el.style.width = vw+'px'; el.style.height = vh+'px';
    const maxX = Math.max(0, desktop.clientWidth-vw); const maxY = Math.max(0, desktop.clientHeight-vh);
    const baseX = 15+(cascade%4)*25; const baseY = 40+(cascade%4)*25; cascade++;
    el.style.left = Math.max(10, Math.min(maxX, opts.x??baseX))+'px';
    el.style.top = Math.max(40, Math.min(maxY, opts.y??baseY))+'px';
    el.style.zIndex = ++zTop;
    const header = document.createElement('div'); header.className = 'win-header';
    header.innerHTML = `<span class="win-title">${title}</span><div class="win-controls"><button class="win-ctrl" data-act="min">–</button><button class="win-ctrl" data-act="max">□</button><button class="win-ctrl close" data-act="close">×</button></div>`;
    const body = document.createElement('div'); body.className = 'win-body'; body.innerHTML = html;
    el.appendChild(header); el.appendChild(body); desktop.appendChild(el);
    el.addEventListener('mousedown', () => { el.style.zIndex = ++zTop; document.querySelectorAll('.window').forEach(x => { if (x !== el) x.classList.remove('active'); }); el.classList.add('active'); });
    header.querySelectorAll('.win-ctrl').forEach(b => { b.addEventListener('click', e => { e.stopPropagation(); const act = b.dataset.act; if (act === 'close') destroy(id); else if (act === 'min') { el.style.display = 'none'; } else if (act === 'max') { if (el.dataset.maxed === '1') { el.style.left = el.dataset.pL; el.style.top = el.dataset.pT; el.style.width = el.dataset.pW; el.style.height = el.dataset.pH; el.dataset.maxed = '0'; } else { el.dataset.pL = el.style.left; el.dataset.pT = el.style.top; el.dataset.pW = el.style.width; el.dataset.pH = el.style.height; el.style.left = '0'; el.style.top = '0'; el.style.width = '100%'; el.style.height = '100%'; el.dataset.maxed = '1'; } } }); });
    let dragging = false, sx, sy, ox, oy;
    const dragStart = e => { if (e.target.closest('.win-ctrl')) return; if (!header.contains(e.target)) return; dragging = true; const rect = el.getBoundingClientRect(); const dRect = desktop.getBoundingClientRect(); ox = rect.left-dRect.left; oy = rect.top-dRect.top; sx = e.clientX; sy = e.clientY; el.style.zIndex = ++zTop; e.preventDefault(); };
    const dragMove = e => { if (!dragging) return; const p = e.touches?e.touches[0]:e; const nx = Math.max(0, Math.min(desktop.clientWidth-el.offsetWidth, ox+p.clientX-sx)); const ny = Math.max(0, Math.min(desktop.clientHeight-el.offsetHeight, oy+p.clientY-sy)); el.style.left = nx+'px'; el.style.top = ny+'px'; };
    const dragEnd = () => { dragging = false; };
    header.addEventListener('mousedown', dragStart); header.addEventListener('touchstart', dragStart, { passive:false });
    window.addEventListener('mousemove', dragMove); window.addEventListener('touchmove', dragMove, { passive:false });
    window.addEventListener('mouseup', dragEnd); window.addEventListener('touchend', dragEnd);
    wins.set(id, { el, body }); return { el, body };
  };
  const destroy = id => { const w = wins.get(id); if (w) { if (id === 'camera' && w.body._stream) w.body._stream.getTracks().forEach(t => t.stop()); if (id === 'voice-memos' && w.body._rec && w.body._rec.state !== 'inactive') w.body._rec.stop(); w.el.remove(); wins.delete(id); } };
  const get = id => wins.get(id);
  const closeAll = () => { wins.forEach((w, id) => destroy(id)); };
  return { create, destroy, get, closeAll };
})();

/* Avatar */
HalDo.Apps.avatar = () => {
  if (HalDo.Windows.get('avatar')) return;
  const w = HalDo.Windows.create('avatar', '🤖 Living Avatar', `
    <h3>🤖 Living AI Avatar</h3>
    <div style="text-align:center;padding:20px">
      <canvas id="avatarCanvas" width="200" height="200" style="border-radius:50%;background:radial-gradient(circle, rgba(0,229,255,0.2) 0%, transparent 70%);box-shadow: 0 0 30px rgba(var(--primary-rgb),0.5)"></canvas>
    </div>
    <div style="display:flex;gap:6px;justify-content:center;margin-top:10px">
      <button class="btn" onclick="window._avatarSpeak()">🗣️ Sprechen</button>
      <button class="btn" onclick="window._avatarHappy()">😊 Glücklich</button>
      <button class="btn" onclick="window._avatarThink()">🤔 Denken</button>
    </div>
    <p style="text-align:center;font-size:11px;margin-top:14px;color:var(--text-dim)">Der Avatar ist mit der KI verbunden und reagiert auf Sprache.</p>
  `, { width: 320, height: 440 });
  const canvas = w.body.querySelector('#avatarCanvas');
  const ctx = canvas.getContext('2d');
  let state = 'idle'; let blink = 1; let mouthOpen = 0; let raf;
  const draw = () => {
    ctx.clearRect(0, 0, 200, 200);
    // Kopf
    ctx.fillStyle = '#0a1a2a'; ctx.strokeStyle = 'var(--primary)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(100, 100, 70, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // Augen
    const eyeY = 80;
    if (blink > 0) {
      ctx.fillStyle = 'var(--primary)';
      ctx.beginPath(); ctx.ellipse(70, eyeY, 8, 8*blink, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(130, eyeY, 8, 8*blink, 0, 0, Math.PI*2); ctx.fill();
      // Pupillen
      if (blink > 0.5) {
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(72, eyeY, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(132, eyeY, 3, 0, Math.PI*2); ctx.fill();
      }
    } else {
      ctx.strokeStyle = 'var(--primary)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(62, eyeY); ctx.lineTo(78, eyeY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(122, eyeY); ctx.lineTo(138, eyeY); ctx.stroke();
    }
    // Mund
    ctx.strokeStyle = 'var(--primary)'; ctx.lineWidth = 3; ctx.beginPath();
    if (state === 'happy') { ctx.arc(100, 115, 20, 0, Math.PI); }
    else if (state === 'thinking') { ctx.arc(100, 125, 10, Math.PI, 0); }
    else { ctx.arc(100, 120, 15, 0.1*Math.PI, 0.9*Math.PI); }
    ctx.stroke();
    // Mund öffnen beim Sprechen
    if (mouthOpen > 0) {
      ctx.fillStyle = 'var(--primary)';
      ctx.beginPath(); ctx.ellipse(100, 125, 10, 5 + 10*mouthOpen, 0, 0, Math.PI*2); ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  };
  draw();
  window._avatarSpeak = () => { state = 'speaking'; mouthOpen = 1; setTimeout(() => { mouthOpen = 0; state = 'idle'; }, 500); HalDo.Avatar.speak("Hallo Bruder, ich bin dein HalDo AI Avatar."); };
  window._avatarHappy = () => { state = 'happy'; setTimeout(() => { state = 'idle'; }, 2000); };
  window._avatarThink = () => { state = 'thinking'; setTimeout(() => { state = 'idle'; }, 2000); };
  const blinkLoop = () => { blink = 0; setTimeout(() => { blink = 1; setTimeout(blinkLoop, 2000 + Math.random()*3000); }, 150); };
  blinkLoop();
  setTimeout(() => { if (!HalDo.Windows.get('avatar')) cancelAnimationFrame(raf); }, 60000);
};

HalDo.Apps.stats = () => {
  if (HalDo.Windows.get('stats')) return;
  const w = HalDo.Windows.create('stats', '📈 Statistik', `
    <h3>📈 Statistik-Rechner</h3>
    <textarea id="stData" placeholder="Zahlen eingeben, getrennt durch Komma oder Leerzeichen...&#10;z.B. 2, 4, 4, 5, 9" style="min-height:80px"></textarea>
    <button class="btn primary" id="stCalc" style="width:100%;margin-top:8px">Berechnen</button>
    <div id="stOut" style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
  `, { width: 460, height: 480 });
  w.body.querySelector('#stCalc').onclick = () => {
    const raw = w.body.querySelector('#stData').value;
    const nums = raw.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
    if (!nums.length) return;
    nums.sort((a,b) => a-b);
    const n = nums.length;
    const sum = nums.reduce((a,b) => a+b, 0);
    const mean = sum / n;
    const median = n % 2 === 0 ? (nums[n/2-1] + nums[n/2]) / 2 : nums[Math.floor(n/2)];
    const min = nums[0]; const max = nums[n-1];
    const variance = nums.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / n;
    const stdDev = Math.sqrt(variance);
    w.body.querySelector('#stOut').innerHTML = `
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Anzahl</div><b style="color:var(--primary)">${n}</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Summe</div><b style="color:var(--primary)">${sum}</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Mittelwert</div><b style="color:var(--primary)">${mean.toFixed(2)}</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Median</div><b style="color:var(--primary)">${median}</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Min / Max</div><b style="color:var(--primary)">${min} / ${max}</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Standardabw.</div><b style="color:var(--primary)">${stdDev.toFixed(2)}</b></div>
    `;
    HalDo.Sound.play('success');
  };
};

/* Stats 2 */
HalDo.Apps.stats2 = () => {
  if (HalDo.Windows.get('stats2')) return;
  const w = HalDo.Windows.create('stats2', '📊 Statistik 2', `
    <h3>📊 Erweiterte Statistik</h3>
    <textarea id="st2Data" placeholder="Zahlen (Komma oder Leerzeichen)" style="min-height:80px"></textarea>
    <button class="btn primary" id="st2Calc" style="width:100%;margin-top:8px">Berechnen</button>
    <div id="st2Out" style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
  `, { width: 460, height: 480 });
  w.body.querySelector('#st2Calc').onclick = () => {
    const nums = w.body.querySelector('#st2Data').value.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));
    if (!nums.length) return;
    const sum = nums.reduce((a,b)=>a+b,0); const mean = sum / nums.length;
    const variance = nums.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / nums.length;
    const stdDev = Math.sqrt(variance);
    const cv = (stdDev / mean) * 100; // Variationskoeffizient
    const min = Math.min(...nums); const max = Math.max(...nums);
    w.body.querySelector('#st2Out').innerHTML = `
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Varianz</div><b style="color:var(--primary)">${variance.toFixed(2)}</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Variationskoeff.</div><b style="color:var(--primary)">${cv.toFixed(1)}%</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Spannweite</div><b style="color:var(--primary)">${max - min}</b></div>
      <div class="list-item" style="flex-direction:column"><div style="font-size:10px;color:var(--text-dim)">Std.Abw.</div><b style="color:var(--primary)">${stdDev.toFixed(2)}</b></div>
    `;
    HalDo.Sound.play('success');
  };
};

  };
  w.body.querySelector('#dcDiff').onclick = () => {
    const t = new Date(w.body.querySelector('#dcTarget').value);

    const days = Math.ceil(diff / 86400000);

    HalDo.Sound.play('success');
  };
};

HalDo.Apps['music-studio'] = () => {

  const w = HalDo.Windows.create('music-studio', '🎹 Musik Studio', `
    <h3>🎹 Musik Studio</h3>
    <p style="font-size:11px">Erstelle einfache Melodien.</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${[261,293,329,349,392,440,493,523].map((f,i) => `<button class="btn" onclick="window._msPlay(${f})">${['C','D','E','F','G','A','B','C'][i]}</button>`).join('')}
    </div>
    <div id="msLog" style="padding:10px;background:rgba(0,0,0,.3);border-radius:10px;font-size:11px;color:var(--text-dim);min-height:60px"></div>
  `, { width: 400, height: 400 });
  let audioCtx;
  window._msPlay = f => {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      o.connect(g).connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.5);
      const log = w.body.querySelector('#msLog');
      log.innerHTML = `<span style="color:var(--primary);font-weight:700">🎵 Note gespielt: ${f} Hz</span><br>` + log.innerHTML;
    } catch(e) {}
  };
};
