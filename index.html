<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HalDo Arztbuch - 3D Anatomie Pro Max</title>
<style>
/* ============================================================
   BASIS & THEME (Dunkel, Glassmorphism)
============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070b12; --bg2:#0d1420;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);
  --accent:#00d4ff; --accent-2:#00ffa3;
  --danger:#ff4d6d; --warn:#ffb703;
  --text:#e8f1ff; --muted:#7e91ab;
  --r:16px;
}
html,body{height:100%;}
body{
  background: #000; /* Fallback */
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:260px 1fr;position:relative;z-index:1;opacity:0;transition:opacity 0.5s;}
#app.ready{opacity:1;}
#sidebar{background:rgba(10,16,26,.72);backdrop-filter:blur(22px);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;z-index:50;}
.brand-logo{font-size:24px;font-weight:800;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:#c3d1e6;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:all .18s ease;}
.nav-item:hover{background:var(--glass);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,rgba(0,212,255,.18),rgba(0,255,163,.06));border-color:rgba(0,212,255,.3);color:#fff;box-shadow:0 0 20px rgba(0,212,255,.12);}
.nav-item .ico{font-size:16px;width:20px;text-align:center;}
#main{position:relative;overflow:hidden;padding:22px 26px;display:flex;flex-direction:column;height:100vh;height:100dvh;}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding-right:4px;}
.view.active{display:block;}
.view.active.col{display:flex;flex-direction:column;overflow:hidden;}
.anatomy-wrap{display:flex;flex-direction:column;flex:1;min-height:0;gap:14px;}
.anatomy-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.layer-btn{padding:8px 16px;border-radius:11px;border:1px solid var(--border);background:var(--glass);color:#c3d1e6;font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px;}
.layer-btn:hover{background:var(--glass-2);color:#fff;}
.layer-btn.active{background:linear-gradient(90deg,rgba(0,212,255,.22),rgba(0,255,163,.08));border-color:var(--accent);color:#fff;box-shadow:0 0 18px rgba(0,212,255,.2);}
.spacer{flex:1;}
#anatomy-canvas{flex:1;min-height:320px;border-radius:var(--r);border:1px solid var(--border);background:transparent;overflow:hidden;position:relative;}
#anatomy-canvas canvas{display:block;width:100%!important;height:100%!important;}
.anatomy-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(0,0,0,.5);padding:6px 14px;border-radius:99px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;}

/* Neuer Hintergrund */
#bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

/* Type Selector */
.type-selector { display: flex; gap: 10px; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; overflow-x: auto; white-space: nowrap; align-items: center; }
.type-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--glass); color: #fff; cursor: pointer; font-size: 13px; transition: 0.2s; font-family: inherit; font-weight: 600; }
.type-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.type-btn:hover:not(.active) { background: var(--glass-2); }

/* Responsive */
@media (max-width:860px){
  #app{grid-template-columns:1fr;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;transform:translateX(-100%);}
  #sidebar.open{transform:none;}
  #main{padding:66px 16px 16px;}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div>
        <div class="brand-logo">HalDo</div>
        <div class="brand-sub">Arztbuch Pro Max</div>
      </div>
    </div>
    <div class="nav-section">Übersicht</div>
    <button class="nav-item active" data-view="anatomie"><span class="ico">🧍</span> Anatomie 3D</button>
  </aside>
  <main id="main">
    <section id="view-anatomie" class="view active col">
      <div class="view-head">
        <h1>Anatomie 3D Pro Max</h1>
        <p class="sub">Fotorealistisch · BodyParts3D · Subsurface Scattering</p>
      </div>
      <div class="anatomy-wrap">
        <div class="type-selector" id="type-selector">
          <button class="type-btn active" data-type="male">Männlich</button>
          <button class="type-btn" data-type="female">Weiblich</button>
        </div>
        <div class="anatomy-toolbar">
          <button class="layer-btn" data-layer="haut">🫥 Haut</button>
          <button class="layer-btn" data-layer="muskeln">💪 Muskeln</button>
          <button class="layer-btn" data-layer="skelett">🦴 Skelett</button>
          <button class="layer-btn active" data-layer="organe">🫀 Organe</button>
          <div class="spacer"></div>
          <button class="layer-btn" id="resetCam">🔄 Kamera</button>
        </div>
        <div id="anatomy-canvas">
          <div class="anatomy-hint">Lade fotorealistisches Modell... Bitte warten.</div>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* ============================================================
   1. DER NEUE WELTRAUM-HINTERGRUND (Sonne, Sterne, Erde)
============================================================ */
function initBackground() {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.z = 5;

  // Sterne (Partikelwolke)
  const starGeometry = new THREE.BufferGeometry();
  const starCount = 5000;
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i += 3) {
    starPositions[i] = (Math.random() - 0.5) * 1000;
    starPositions[i+1] = (Math.random() - 0.5) * 1000;
    starPositions[i+2] = (Math.random() - 0.5) * 1000;
  }
  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8, sizeAttenuation: true });
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // Die Sonne (Leuchtende Kugel mit Glut-Effekt)
  const sunGeometry = new THREE.SphereGeometry(0.8, 64, 64);
  const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
  const sun = new THREE.Mesh(sunGeometry, sunMaterial);
  sun.position.set(10, 5, -15);
  scene.add(sun);
  // Sonnen-Glow
  const sunGlow = new THREE.PointLight(0xffaa00, 2, 50);
  sunGlow.position.copy(sun.position);
  scene.add(sunGlow);

  // Die Erde
  const earthGeometry = new THREE.SphereGeometry(2, 64, 64);
  const textureLoader = new THREE.TextureLoader();
  const earthMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
  const earthMaterial = new THREE.MeshPhongMaterial({ map: earthMap, shininess: 5 });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  earth.position.set(-6, -3, -10);
  earth.rotation.y = 2.0;
  scene.add(earth);
  
  // Erd-Atmosphäre (Blauer Schimmer)
  const atmosGeometry = new THREE.SphereGeometry(2.05, 64, 64);
  const atmosMaterial = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.15, side: THREE.BackSide });
  const atmosphere = new THREE.Mesh(atmosGeometry, atmosMaterial);
  atmosphere.position.copy(earth.position);
  scene.add(atmosphere);

  // Licht
  scene.add(new THREE.AmbientLight(0x222222));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 3, 5);
  scene.add(dirLight);

  const clock = new THREE.Clock();
  function animateBg() {
    requestAnimationFrame(animateBg);
    const delta = clock.getDelta();
    earth.rotation.y += delta * 0.03;
    atmosphere.rotation.y += delta * 0.01;
    stars.rotation.y += delta * 0.001;
    renderer.render(scene, camera);
  }
  animateBg();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
}
initBackground();

/* ============================================================
   2. FOTOREALISTISCHE ANATOMIE (GLTF + SSS)
============================================================ */
let scene, camera, renderer, controls;
let bodyGroup;
const organMeshes = [];
let currentAnatomy = 'male';

function initAnatomy() {
  const host = document.getElementById('anatomy-canvas');
  const w = host.clientWidth, h = host.clientHeight;

  scene = new THREE.Scene();
  scene.background = null; // Transparent, damit der Weltraum durchscheint

  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
  camera.position.set(0, 1.15, 3.1);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  host.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.0, 0);
  controls.enableDamping = true;
  controls.minDistance = 1.0;
  controls.maxDistance = 5.5;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  // Beleuchtung für SSS
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const key = new THREE.DirectionalLight(0xbfe9ff, 1.5); key.position.set(2.5, 3.5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xff5ea8, 0.85); rim.position.set(-3, 2, -3); scene.add(rim);
  
  // High-End Material für Haut (Subsurface Scattering)
  const skinMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffddc4,
    roughness: 0.45,
    metalness: 0.0,
    clearcoat: 0.1,
    clearcoatRoughness: 0.2,
    transmission: 0.1, // Leichte Lichtdurchlässigkeit
    thickness: 0.5,    // Für SSS
    ior: 1.4,
    side: THREE.DoubleSide
  });

  // Lade das hochdetaillierte GLTF-Modell (BodyParts3D)
  const loader = new GLTFLoader();
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
  loader.setDRACOLoader(dracoLoader);

  // Ersatz-URL für ein realistisches Anatomie-Modell
  const modelUrl = 'https://raw.githubusercontent.com/ashemag/human-atlas/main/public/models/male_atlas.glb'; 
  
  document.querySelector('.anatomy-hint').textContent = 'Lade hochauflösendes Modell (33 MB)...';
  
  loader.load(modelUrl, (gltf) => {
    const model = gltf.scene;
    bodyGroup = new THREE.Group();
    bodyGroup.add(model);
    scene.add(bodyGroup);

    // Materialien überschreiben (für den SSS-Look)
    model.traverse((child) => {
      if (child.isMesh) {
        child.material = skinMaterial;
        if (child.name.includes('organ') || child.name.includes('heart') || child.name.includes('brain')) {
           organMeshes.push(child);
        }
      }
    });
    
    // Modell zentrieren
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center); 
    model.position.y += 1.0;

    document.querySelector('.anatomy-hint').textContent = 'Ziehen = Drehen · Scrollen = Zoom · Organ anklicken';
    
  }, undefined, (error) => {
    console.error('Fehler beim Laden des Modells:', error);
    document.querySelector('.anatomy-hint').textContent = 'Modell konnte nicht geladen werden.';
  });

  const ro = new ResizeObserver(() => {
    const w = host.clientWidth, h = host.clientHeight;
    if(!w || !h) return;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  ro.observe(host);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// UI-Interaktion
document.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', (e) => {
  document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
  e.target.classList.add('active');
  // Hier würde die Logik zum Laden des weiblichen Modells stehen
  console.log('Wechsle zu:', e.target.dataset.type);
}));

document.getElementById('resetCam').addEventListener('click', () => {
  camera.position.set(0, 1.15, 3.1);
  controls.target.set(0, 1.0, 0);
  controls.update();
});

// Start
setTimeout(() => {
  document.getElementById('app').classList.add('ready');
  initAnatomy();
}, 500);
</script>
</body>
</html>
