<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS – Real Cosmos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.6' stop-color='%2300e5ff'/%3E%3Cstop offset='1' stop-color='%23003366'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='40' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --primary:#00e5ff;--primary-rgb:0,229,255;
  --secondary:#4da8ff;--accent:#b478ff;
  --gold:#ffd700;--gold-rgb:255,215,0;
  --bg-0:#01010a;--bg-1:#050520;
  --panel:rgba(8,15,35,0.68);--panel-2:rgba(15,28,60,0.82);
  --border:rgba(0,229,255,0.35);--border-strong:rgba(0,229,255,0.7);
  --text:#e8f6ff;--text-dim:#7fa5d0;
  --glow-sm:0 0 14px rgba(0,229,255,0.5);
  --glow-md:0 0 28px rgba(0,229,255,0.55);
  --glow-lg:0 0 55px rgba(0,229,255,0.4);
  --blur:28px;--radius-w:20px;--radius-b:14px;
  --topbar-h:56px;--sidebar-w:230px;
  /* safe area */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
}

[data-theme="cyborg"]{--primary:#ff78c8;--primary-rgb:255,120,200;--secondary:#b478ff;--accent:#ff78c8;--border:rgba(255,120,200,.4);--border-strong:rgba(255,120,200,.8);--glow-sm:0 0 14px rgba(255,120,200,.55);--glow-md:0 0 28px rgba(255,120,200,.6);--glow-lg:0 0 55px rgba(255,120,200,.45);--bg-0:#0a0015;--bg-1:#1a0030}
[data-theme="gold"]{--primary:#ffd700;--primary-rgb:255,215,0;--secondary:#ffb300;--accent:#ff9500;--border:rgba(255,215,0,.4);--border-strong:rgba(255,215,0,.8);--glow-sm:0 0 14px rgba(255,215,0,.55);--glow-md:0 0 28px rgba(255,215,0,.6);--glow-lg:0 0 55px rgba(255,215,0,.45);--bg-0:#080600;--bg-1:#1a1200}
[data-theme="matrix"]{--primary:#00ff88;--primary-rgb:0,255,136;--secondary:#00cc66;--accent:#00ffaa;--border:rgba(0,255,136,.4);--border-strong:rgba(0,255,136,.8);--glow-sm:0 0 14px rgba(0,255,136,.55);--glow-md:0 0 28px rgba(0,255,136,.6);--glow-lg:0 0 55px rgba(0,255,136,.45);--bg-0:#000600;--bg-1:#001408}
[data-theme="crimson"]{--primary:#ff3355;--primary-rgb:255,51,85;--secondary:#ff6644;--accent:#ff0055;--border:rgba(255,51,85,.4);--border-strong:rgba(255,51,85,.8);--glow-sm:0 0 14px rgba(255,51,85,.55);--glow-md:0 0 28px rgba(255,51,85,.6);--glow-lg:0 0 55px rgba(255,51,85,.45);--bg-0:#0a0005;--bg-1:#200008}
[data-theme="sunset"]{--primary:#ff9900;--primary-rgb:255,153,0;--secondary:#ff5599;--accent:#ffcc00;--border:rgba(255,153,0,.4);--border-strong:rgba(255,153,0,.8);--glow-sm:0 0 14px rgba(255,153,0,.55);--glow-md:0 0 28px rgba(255,153,0,.6);--glow-lg:0 0 55px rgba(255,153,0,.45);--bg-0:#0a0500;--bg-1:#201000}
[data-theme="ice"]{--primary:#aee0ff;--primary-rgb:174,224,255;--secondary:#e6f7ff;--accent:#cceeff;--border:rgba(174,224,255,.45);--border-strong:rgba(174,224,255,.85);--glow-sm:0 0 14px rgba(174,224,255,.55);--glow-md:0 0 28px rgba(174,224,255,.6);--glow-lg:0 0 55px rgba(174,224,255,.45);--bg-0:#000814;--bg-1:#001e3c;--text:#f4fbff;--text-dim:#9ac9e0}

html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  background:var(--bg-0);color:var(--text);
  user-select:none;-webkit-font-smoothing:antialiased;letter-spacing:.15px;
  position:fixed;inset:0;
}

#cosmicBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

/* ═══ TOPBAR – SAFE AREA FIXED ═══ */
#topbar{
  position:fixed;
  top:0;left:0;right:0;
  height:calc(var(--topbar-h) + var(--sat));
  padding:var(--sat) calc(18px + var(--sar)) 0 calc(18px + var(--sal));
  box-sizing:border-box;
  z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(8,15,35,0.92),rgba(8,15,35,0.62));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border-bottom:1px solid var(--border);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .3s}
.brand:active{transform:scale(.96)}
.brand-logo{
  width:38px;height:38px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0%,transparent 40%),
    radial-gradient(circle at 70% 70%,var(--accent),var(--primary) 45%,var(--secondary) 75%,#002040 100%);
  box-shadow:0 0 20px rgba(var(--primary-rgb),.7),0 0 40px rgba(var(--primary-rgb),.4),inset -4px -4px 12px rgba(0,0,0,.5),inset 4px 4px 12px rgba(255,255,255,.2);
  animation:logoFloat 4s ease-in-out infinite;
  position:relative;
}
.brand-logo::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--primary);border-right-color:var(--accent);animation:spinRing 6s linear infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.04)}}
@keyframes spinRing{to{transform:rotate(360deg)}}
.brand-name{font-size:16px;font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent),var(--primary));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
.brand-sub{font-size:9px;color:var(--text-dim);letter-spacing:3px;margin-top:-1px;font-weight:600}
@keyframes shimmer{to{background-position:-300% 0}}

.topbar-right{display:flex;align-items:center;gap:7px}
.tb-btn{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.08),rgba(var(--primary-rgb),.02));
  border:1.5px solid var(--border);
  color:var(--text);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;
}
.tb-btn:hover{background:rgba(var(--primary-rgb),.15);box-shadow:var(--glow-sm)}
.tb-btn:active{transform:scale(.92)}
.tb-clock{
  font-family:"SF Mono",ui-monospace,monospace;font-size:13px;color:var(--primary);
  padding:0 12px;font-weight:700;letter-spacing:.8px;
  text-shadow:0 0 10px rgba(var(--primary-rgb),.7);
  background:rgba(var(--primary-rgb),.08);border-radius:9px;height:32px;
  display:flex;align-items:center;border:1px solid var(--border);
}

/* ═══ SIDEBAR – SAFE AREA FIXED ═══ */
#sidebar{
  position:fixed;
  top:calc(var(--topbar-h) + var(--sat));
  left:0;bottom:0;
  width:var(--sidebar-w);
  padding:14px 10px calc(14px + var(--sab)) 10px;
  z-index:900;
  background:linear-gradient(180deg,rgba(8,15,35,0.9),rgba(8,15,35,0.72));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border-right:1.5px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
  transition:transform .35s cubic-bezier(.4,.14,.3,1);
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
}
#sidebar.collapsed{transform:translateX(-100%)}
.side-section{margin-bottom:16px}
.side-label{font-size:9px;color:var(--text-dim);letter-spacing:2.5px;text-transform:uppercase;padding:8px 12px;font-weight:800;opacity:.7}
.side-btn{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px;margin:2px 0;border-radius:12px;
  background:transparent;border:1px solid transparent;
  color:var(--text);font-size:13px;font-weight:500;cursor:pointer;
  transition:all .25s;text-align:left;min-height:44px;
}
.side-btn:hover{background:linear-gradient(90deg,rgba(var(--primary-rgb),.14),rgba(var(--primary-rgb),.03));border-color:var(--border);box-shadow:var(--glow-sm)}
.side-btn:active{transform:scale(.97)}
.side-btn .ico{font-size:17px;width:24px;text-align:center}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}

/* ═══ DESKTOP – SAFE AREA FIXED ═══ */
#desktop{
  position:fixed;
  top:calc(var(--topbar-h) + var(--sat));
  left:var(--sidebar-w);
  right:0;
  bottom:var(--sab);
  z-index:1;
  overflow:hidden;
  transition:left .35s cubic-bezier(.4,.14,.3,1);
}
#desktop.full{left:0}

/* ═══ WINDOWS ═══ */
.window{
  position:absolute;
  min-width:320px;min-height:220px;
  background:linear-gradient(135deg,rgba(8,15,35,0.78),rgba(8,15,35,0.65));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1.5px solid var(--border);
  border-radius:var(--radius-w);
  box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 40px rgba(var(--primary-rgb),.12),inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;
  z-index:200;overflow:hidden;
  animation:winOpen .3s cubic-bezier(.4,.14,.3,1);
}
.window.active{border-color:var(--border-strong);box-shadow:0 20px 70px rgba(0,0,0,.65),0 0 60px rgba(var(--primary-rgb),.35),inset 0 1px 0 rgba(255,255,255,.12);z-index:250}
@keyframes winOpen{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.win-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;cursor:grab;user-select:none;
  background:linear-gradient(90deg,rgba(var(--primary-rgb),.14),rgba(var(--primary-rgb),.02));
  border-bottom:1.5px solid var(--border);
  min-height:48px;flex-shrink:0;
}
.win-header.dragging{cursor:grabbing}
.win-title{font-size:13px;font-weight:700;flex:1;padding-left:4px;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-controls{display:flex;gap:6px}
.win-ctrl{
  width:36px;height:36px;min-width:36px;min-height:36px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--text);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;position:relative;z-index:999999;font-weight:600;
}
.win-ctrl:hover{background:rgba(var(--primary-rgb),.25);box-shadow:var(--glow-sm)}
.win-ctrl.close:hover{background:rgba(255,60,80,.7);border-color:rgba(255,60,80,.9)}
.win-body{
  flex:1;padding:16px;overflow:auto;
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
  font-size:13px;line-height:1.55;
}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}

/* ═══ BUTTONS ═══ */
.btn{
  min-height:42px;padding:10px 18px;border-radius:var(--radius-b);
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.2),rgba(var(--primary-rgb),.05));
  border:1.5px solid var(--border);color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .25s;display:inline-flex;align-items:center;gap:7px;justify-content:center;
}
.btn:hover{background:rgba(var(--primary-rgb),.3);box-shadow:var(--glow-sm);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;border-color:transparent;box-shadow:0 4px 14px rgba(var(--primary-rgb),.4)}
.input,textarea,select{
  width:100%;min-height:42px;padding:10px 14px;border-radius:var(--radius-b);
  background:rgba(0,0,0,.35);border:1.5px solid var(--border);
  color:var(--text);font-size:13px;font-family:inherit;
  transition:all .25s;outline:none;
}
.input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 20px rgba(var(--primary-rgb),.35)}
textarea{min-height:100px;resize:vertical;font-family:inherit}

.toggle{position:relative;display:inline-block;width:50px;height:28px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;border-radius:14px;background:rgba(0,0,0,.55);border:1.5px solid var(--border);cursor:pointer;transition:.3s}
.toggle .slider::before{content:"";position:absolute;height:20px;width:20px;left:2px;top:2px;background:linear-gradient(135deg,#888,#aaa);border-radius:50%;transition:.3s}
.toggle input:checked + .slider{background:rgba(var(--primary-rgb),.45);border-color:var(--primary);box-shadow:0 0 18px rgba(var(--primary-rgb),.5)}
.toggle input:checked + .slider::before{transform:translateX(22px);background:linear-gradient(135deg,var(--primary),#fff);box-shadow:0 0 12px var(--primary)}

.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;
  padding:6px 14px;border-radius:18px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--border);
  color:var(--text);font-size:11px;font-weight:600;cursor:pointer;transition:all .25s;
}
.chip:hover,.chip.on{background:rgba(var(--primary-rgb),.28);border-color:var(--primary);box-shadow:var(--glow-sm)}

/* ═══ SETTINGS ═══ */
.set-section{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(0,0,0,.25)}
.set-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;user-select:none;background:rgba(var(--primary-rgb),.04)}
.set-head:hover{background:rgba(var(--primary-rgb),.1)}
.set-head .letter{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;font-weight:900;font-size:13px;flex-shrink:0}
.set-head .title{flex:1;font-size:13px;font-weight:700}
.set-head .chev{transition:transform .3s;color:var(--primary);font-size:11px}
.set-section.open .chev{transform:rotate(180deg)}
.set-body{display:none;padding:10px 15px 15px}
.set-section.open .set-body{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);min-height:46px}
.set-row:last-child{border-bottom:none}
.set-row-label{flex:1;font-size:12px}

/* ═══ TOASTS ═══ */
#toasts{position:fixed;bottom:calc(110px + var(--sab));left:50%;transform:translateX(-50%);z-index:5000;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;max-width:min(90vw,420px)}
.toast{
  background:linear-gradient(135deg,rgba(8,15,35,0.92),rgba(8,15,35,0.8));
  backdrop-filter:blur(20px) saturate(180%);
  border:1.5px solid var(--primary);border-radius:14px;
  padding:12px 18px;box-shadow:var(--glow-md),0 8px 30px rgba(0,0,0,.5);
  font-size:12px;font-weight:600;color:var(--text);
  animation:toastIn .35s;pointer-events:auto;display:flex;align-items:center;gap:10px;
}
@keyframes toastIn{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.toast.out{animation:toastOut .35s forwards}
@keyframes toastOut{to{transform:translateY(-24px) scale(.9);opacity:0}}

/* ═══ AVATAR FAB ═══ */
#avatarFab{
  position:fixed;
  bottom:calc(22px + var(--sab));
  right:calc(22px + var(--sar));
  z-index:800;
  width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle,var(--primary) 0%,var(--secondary) 55%,var(--accent) 100%);
  border:2px solid var(--border-strong);
  box-shadow:0 0 30px rgba(var(--primary-rgb),.65),0 0 60px rgba(var(--primary-rgb),.35),inset 0 -4px 12px rgba(0,0,0,.4),inset 0 4px 12px rgba(255,255,255,.3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:34px;transition:all .3s;animation:breathe 3.5s ease-in-out infinite;
}
#avatarFab:hover{transform:scale(1.1)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#avatarFab::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--border-strong);animation:pulseRing 2.5s ease-out infinite}
@keyframes pulseRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
#avatarFab.speaking::before{border-color:var(--gold);animation:pulseRing .6s ease-out infinite}

/* ═══ CHAT ═══ */
.chat-container{display:flex;flex-direction:column;height:100%;min-height:340px}
.chat-messages{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin}
.chat-msg{padding:10px 14px;border-radius:16px;max-width:85%;font-size:13px;line-height:1.5;animation:msgIn .35s;word-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#001;border-bottom-right-radius:6px;font-weight:500}
.chat-msg.ai{align-self:flex-start;background:rgba(var(--primary-rgb),.15);border:1px solid var(--border);border-bottom-left-radius:6px}
.chat-msg.system{align-self:center;background:rgba(255,215,0,.1);border:1px solid var(--gold);color:var(--gold);font-size:11px;padding:6px 14px;text-align:center;font-weight:600}
.chat-input-row{display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-row input{flex:1}
.chat-input-row .btn{min-width:46px;padding:10px 13px}

/* ═══ APP GRID ═══ */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:11px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);cursor:pointer;transition:all .3s;text-align:center}
.app-tile:hover{background:rgba(var(--primary-rgb),.18);box-shadow:var(--glow-sm);transform:translateY(-3px)}
.app-tile .ic{font-size:28px}
.app-tile .nm{font-size:10px;line-height:1.25;word-break:break-word;font-weight:500}

/* ═══ SPLASH ═══ */
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at center,#050520,#000008);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .8s}
#splash.hide{opacity:0;pointer-events:none}
#splash .orbit-container{position:relative;width:180px;height:180px;display:flex;align-items:center;justify-content:center}
#splash .splash-logo{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0%,transparent 45%),radial-gradient(circle at 70% 70%,var(--accent),var(--primary) 40%,var(--secondary) 75%,#001a3a);box-shadow:0 0 80px rgba(var(--primary-rgb),.9),0 0 140px rgba(var(--primary-rgb),.5);animation:pulseLogo 2.5s ease-in-out infinite}
#splash .orbit-container::before,#splash .orbit-container::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--border-strong);animation:spinRing 5s linear infinite}
#splash .orbit-container::after{inset:-20px;border-style:dashed;opacity:.5;animation:spinRing 10s linear infinite reverse}
@keyframes pulseLogo{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#splash h1{font-size:28px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent),var(--primary));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;text-align:center;font-weight:900;animation:shimmer 4s linear infinite}
#splash p{color:var(--text-dim);font-size:13px;letter-spacing:1.5px;text-align:center}
#splash .credit{color:var(--gold);font-size:11px;letter-spacing:3px;margin-top:8px;font-weight:700;text-shadow:0 0 12px rgba(var(--gold-rgb),.6)}

.hidden{display:none!important}
.win-body h3{color:var(--primary);font-size:14px;margin-bottom:11px;margin-top:14px;font-weight:700}
.win-body h3:first-child{margin-top:0}

<script>
'use strict';
const HalDo = window.HalDo = {};
HalDo.version = 'v127 Real Cosmos';

/* ═══ SOUND ═══ */
HalDo.Sound = (() => {
  let ctx;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; };
  const beep = (freq, dur, type='sine', vol=.15) => {
    try {
      const c = ensure(); const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
      o.connect(g).connect(c.destination);
      o.start(); o.stop(c.currentTime + dur);
    } catch(e){}
  };
  const S = {
    click:()=>beep(880,.05,'sine',.08),
    notify:()=>{beep(660,.1);setTimeout(()=>beep(880,.1),80);setTimeout(()=>beep(1100,.15),160)},
    success:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*70)),
    error:()=>{beep(220,.2,'sawtooth',.15);setTimeout(()=>beep(165,.25,'sawtooth',.15),150)},
    warning:()=>{beep(440,.15,'square',.12);setTimeout(()=>beep(440,.15,'square',.12),200)},
    message:()=>{beep(1000,.08);setTimeout(()=>beep(1300,.12),90)},
    alarm:()=>{for(let i=0;i<3;i++){setTimeout(()=>beep(1200,.15,'square',.2),i*200);setTimeout(()=>beep(900,.15,'square',.2),i*200+100)}}
  };
  return { play:(n)=>{try{(S[n]||S.click)()}catch(e){}} };
})();

/* ═══ TOAST ═══ */
HalDo.Toast = (() => {
  const c = document.getElementById('toasts');
  return {
    show(msg, o={}) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span style="font-size:18px">${o.icon||'✨'}</span><span>${msg}</span>`;
      c.appendChild(t);
      if (o.sound) HalDo.Sound.play(o.sound);
      setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(), 350); }, o.duration||3000);
    }
  };
})();

/* ═══════════════════════════════════════════════════
   REAL COSMOS mit ECHTEN NASA-TEXTUREN
   ═══════════════════════════════════════════════════ */
HalDo.Cosmos = (() => {
  const canvas = document.getElementById('cosmicBg');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W, H, cx, cy, t = 0;
  let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
  
  // Echte NASA/Wikimedia Texturen
  const TEX_URLS = {
    sun: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/512px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg',
    earth: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/512px-The_Earth_seen_from_Apollo_17.jpg',
    moon: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/512px-FullMoon2010.jpg',
    mercury: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mercury_in_true_color.jpg/512px-Mercury_in_true_color.jpg',
    venus: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Venus_globe.jpg/512px-Venus_globe.jpg',
    mars: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/OSIRIS_Mars_true_color.jpg/512px-OSIRIS_Mars_true_color.jpg',
    jupiter: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Jupiter_and_its_shrunken_Great_Red_Spot.jpg/512px-Jupiter_and_its_shrunken_Great_Red_Spot.jpg',
    saturn: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Saturn_during_Equinox.jpg/512px-Saturn_during_Equinox.jpg',
    uranus: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Uranus2.jpg/512px-Uranus2.jpg',
    neptune: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Neptune_-_Voyager_2_%2829347980845%29_flatten_crop.jpg/512px-Neptune_-_Voyager_2_%2829347980845%29_flatten_crop.jpg'
  };
  const textures = {};
  let loadedCount = 0;
  const totalTex = Object.keys(TEX_URLS).length;
  
  // Lade Texturen
  Object.entries(TEX_URLS).forEach(([name, url]) => {
    const img = new Image();
    img.onload = () => { textures[name] = img; loadedCount++; };
    img.onerror = () => { loadedCount++; };
    img.src = url;
  });
  
  const stars = [], planets = [], shooting = [];
  const starCount = 365;
  
  // 12 Planeten (mit realen Größenverhältnissen angepasst)
  const planetDefs = [
    { name:'Merkur', tex:'mercury', color:'#8a7d6b', color2:'#5a4f42', size:5,   dist:0.22, speed:0.65 },
    { name:'Venus',  tex:'venus',   color:'#e8c88a', color2:'#a88040', size:7,   dist:0.32, speed:0.5 },
    { name:'Erde',   tex:'earth',   color:'#4da8ff', color2:'#1a5599', size:9,   dist:0.43, speed:0.4, moon:true },
    { name:'Mars',   tex:'mars',    color:'#c1440e', color2:'#8a2f0a', size:7,   dist:0.55, speed:0.32 },
    { name:'Jupiter',tex:'jupiter', color:'#e0c090', color2:'#8a6040', size:16,  dist:0.70, speed:0.22, moons:4 },
    { name:'Saturn', tex:'saturn',  color:'#e8d5a0', color2:'#a07840', size:14,  dist:0.86, speed:0.17, ring:true },
    { name:'Uranus', tex:'uranus',  color:'#7de0e0', color2:'#3a8080', size:10,  dist:1.01, speed:0.13 },
    { name:'Neptun', tex:'neptune', color:'#3355ee', color2:'#0a1a6a', size:9.5, dist:1.16, speed:0.10 },
    { name:'Pluto',  tex:null,      color:'#b08860', color2:'#5a4020', size:4,   dist:1.28, speed:0.07 },
    { name:'Xena',   tex:null,      color:'#8866aa', color2:'#4a2a6a', size:4.5, dist:1.38, speed:0.05 },
    { name:'Sedna',  tex:null,      color:'#9977cc', color2:'#4a3a7a', size:5,   dist:1.48, speed:0.04 },
    { name:'Eris',   tex:null,      color:'#aaccff', color2:'#5070a0', size:5.5, dist:1.58, speed:0.03 }
  ];
  
  const nebulas = [
    { x:.15, y:.25, r:.42, c1:'rgba(180,60,255,0.14)', c2:'rgba(80,0,140,0)' },
    { x:.85, y:.55, r:.50, c1:'rgba(0,150,255,0.12)', c2:'rgba(0,50,150,0)' },
    { x:.5,  y:.85, r:.38, c1:'rgba(255,60,180,0.10)', c2:'rgba(120,0,80,0)' },
    { x:.7,  y:.15, r:.35, c1:'rgba(255,200,80,0.08)', c2:'rgba(120,80,0,0)' }
  ];
  
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = window.innerWidth * dpr;
    H = canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    cx = W / 2; cy = H / 2;
    ctx.setTransform(1,0,0,1,0,0);
  };
  
  const init = () => {
    stars.length = 0;
    for (let i = 0; i < starCount; i++) {
      const bright = Math.random();
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: (Math.random() * 1.3 + 0.3) * (bright > .9 ? 1.8 : 1),
        a: Math.random(),
        da: (Math.random() * .015 + .002) * (Math.random() < .5 ? 1 : -1),
        bright,
        hue: Math.random() < .1 ? { r:255, g:215, b:0 } :
             Math.random() < .25 ? { r:180, g:140, b:255 } :
             Math.random() < .5 ? { r:200, g:240, b:255 } : { r:255, g:255, b:255 }
      });
    }
    
    planets.length = 0;
    const minDim = Math.min(W, H);
    planetDefs.forEach((p, i) => {
      // Deutlich größere Planeten
      const baseSize = Math.max((minDim / 380) * p.size, 5);
      planets.push({
        ...p,
        sizePx: baseSize,
        angle: Math.random() * Math.PI * 2,
        angleSpeed: p.speed * 0.0009,
        orbitR: minDim * (0.10 + p.dist * 0.28),
        rot: Math.random() * Math.PI * 2,
        moons: []
      });
      // Erde: 1 Mond
      if (p.moon) {
        planets[planets.length-1].moons.push({ dist: 2.2, size: .35, speed: .015, angle: 0, tex:'moon' });
      }
      // Jupiter: 4 Galileische Monde
      if (p.moons === 4) {
        for (let j = 0; j < 4; j++) {
          planets[planets.length-1].moons.push({
            dist: 1.5 + j * 0.4,
            size: .12 + Math.random() * .08,
            speed: .012 - j * .002,
            angle: Math.random() * 6,
            tex: 'moon',
            color: ['#e8d8c8','#e0d0b8','#c8b8a8','#b8a898'][j]
          });
        }
      }
    });
  };
  
  /* ---- Textur auf Kugel zeichnen ---- */
  const drawTexturedSphere = (img, x, y, r, rot, fallbackColor, fallbackColor2) => {
    // Fallback-Gradient
    if (!img || !img.complete || img.naturalWidth === 0) {
      const grad = ctx.createRadialGradient(x - r*0.4, y - r*0.4, 0, x, y, r);
      grad.addColorStop(0, fallbackColor || '#888');
      grad.addColorStop(0.6, fallbackColor || '#666');
      grad.addColorStop(1, fallbackColor2 || '#333');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    } else {
      // Textur mit Rotation
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
      
      const texSize = r * 2;
      const offset = (rot * texSize * 2) % texSize;
      
      ctx.drawImage(img, x - r - offset, y - r, texSize, texSize);
      ctx.drawImage(img, x - r - offset + texSize, y - r, texSize, texSize);
      
      ctx.restore();
    }
    
    // Kugel-Schatten (3D-Effekt)
    const shade = ctx.createRadialGradient(x - r*0.35, y - r*0.35, r*0.05, x, y, r);
    shade.addColorStop(0, 'rgba(255,255,255,0.25)');
    shade.addColorStop(0.4, 'rgba(0,0,0,0)');
    shade.addColorStop(0.8, 'rgba(0,0,0,0.55)');
    shade.addColorStop(1, 'rgba(0,0,0,0.85)');
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  };
  
  /* ---- Sonne mit Textur ---- */
  const drawSun = () => {
    const sunSize = Math.min(W, H) * 0.06; // Größer (war 0.045)
    
    // Corona-Layer
    for (let layer = 5; layer >= 0; layer--) {
      const r = sunSize * (1.6 + layer * 1.0);
      const grd = ctx.createRadialGradient(cx, cy, sunSize * 0.5, cx, cy, r);
      const alpha = 0.06 + (5 - layer) * 0.028;
      grd.addColorStop(0, `rgba(255,200,100,${alpha * 1.8})`);
      grd.addColorStop(0.4, `rgba(255,140,40,${alpha * 1.2})`);
      grd.addColorStop(0.75, `rgba(255,90,10,${alpha * 0.6})`);
      grd.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    }
    
    // Corona-Strahlen
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.00015);
    for (let i = 0; i < 20; i++) {
      ctx.rotate(Math.PI / 10);
      const len = sunSize * (1.7 + Math.sin(i * 1.7 + t * 0.003) * 0.5);
      const ray = ctx.createLinearGradient(0, 0, 0, -len);
      ray.addColorStop(0, 'rgba(255,220,140,0.55)');
      ray.addColorStop(0.3, 'rgba(255,180,60,0.3)');
      ray.addColorStop(0.7, 'rgba(255,120,20,0.1)');
      ray.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = ray;
      ctx.beginPath();
      ctx.moveTo(-sunSize * 0.35, 0);
      ctx.lineTo(0, -len);
      ctx.lineTo(sunSize * 0.35, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    
    // Sonnen-Prominenzen
    ctx.strokeStyle = 'rgba(255,150,50,0.45)';
    ctx.lineWidth = sunSize * 0.09;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + t * 0.0004;
      const sX = cx + Math.cos(a) * sunSize;
      const sY = cy + Math.sin(a) * sunSize;
      const eX = cx + Math.cos(a + 0.35) * sunSize;
      const eY = cy + Math.sin(a + 0.35) * sunSize;
      const cX = cx + Math.cos(a + 0.175) * sunSize * 1.5;
      const cY = cy + Math.sin(a + 0.175) * sunSize * 1.5;
      ctx.beginPath();
      ctx.moveTo(sX, sY);
      ctx.quadraticCurveTo(cX, cY, eX, eY);
      ctx.stroke();
    }
    
    // Sonnen-Kern mit Textur
    drawTexturedSphere(textures.sun, cx, cy, sunSize, t * 0.0003, '#ffcc44', '#ff6600');
    
    // Zusätzlicher Hellkern
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunSize * 0.5);
    glow.addColorStop(0, 'rgba(255,255,200,0.6)');
    glow.addColorStop(1, 'rgba(255,200,100,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, sunSize * 0.5, 0, Math.PI*2); ctx.fill();
  };
  
  /* ---- Saturn mit Ringen ---- */
  const drawSaturnWithRings = (p, x, y) => {
    const r = p.sizePx;
    
    // Ring hinten
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.4);
    ctx.strokeStyle = 'rgba(232,213,160,0.45)';
    ctx.lineWidth = r * 0.32;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.2, r * 0.55, 0, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(180,150,100,0.3)';
    ctx.lineWidth = r * 0.15;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.55, r * 0.65, 0, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    
    // Planet
    drawTexturedSphere(textures.saturn, x, y, r, p.rot, p.color, p.color2);
    
    // Ring vorne
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.4);
    ctx.strokeStyle = 'rgba(240,220,170,0.65)';
    ctx.lineWidth = r * 0.32;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.2, r * 0.55, 0, 0, Math.PI);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,170,120,0.45)';
    ctx.lineWidth = r * 0.15;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.55, r * 0.65, 0, 0, Math.PI);
    ctx.stroke();
    ctx.restore();
  };
  
  /* ---- Sterne ---- */
  const drawStars = () => {
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0) s.da *= -1;
      const alpha = Math.abs(s.a) * 0.75 + 0.15;
      const px = s.x + mouseX * (s.bright * 4);
      const py = s.y + mouseY * (s.bright * 4);
      if (s.bright > 0.85) {
        const glow = ctx.createRadialGradient(px, py, 0, px, py, s.r * 6);
        glow.addColorStop(0, `rgba(${s.hue.r},${s.hue.g},${s.hue.b},${alpha * 0.5})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(px, py, s.r * 6, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = `rgba(${s.hue.r},${s.hue.g},${s.hue.b},${alpha})`;
      ctx.beginPath(); ctx.arc(px, py, s.r, 0, Math.PI*2); ctx.fill();
    });
  };
  
  /* ---- Nebel ---- */
  const drawNebula = () => {
    nebulas.forEach(n => {
      const grd = ctx.createRadialGradient(n.x * W, n.y * H, 0, n.x * W, n.y * H, n.r * Math.min(W, H));
      grd.addColorStop(0, n.c1);
      grd.addColorStop(1, n.c2);
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(n.x * W, n.y * H, n.r * Math.min(W, H), 0, Math.PI*2); ctx.fill();
    });
  };
  
  /* ---- Sternschnuppen ---- */
  const spawnShooting = () => {
    if (shooting.length >= 3) return;
    shooting.push({
      x: Math.random() * W, y: Math.random() * H * 0.5,
      vx: (Math.random() * 0.6 + 0.4) * 10 * (Math.random() < 0.5 ? 1 : -1),
      vy: (Math.random() * 0.4 + 0.3) * 10,
      life: 1
    });
  };
  const drawShooting = () => {
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i];
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 10, s.y - s.vy * 10);
      grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
      grad.addColorStop(0.3, `rgba(200,240,255,${s.life * 0.8})`);
      grad.addColorStop(1, 'rgba(100,200,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 10, s.y - s.vy * 10);
      ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${s.life})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, Math.PI*2); ctx.fill();
      s.x += s.vx; s.y += s.vy;
      s.life -= 0.012;
      if (s.life <= 0 || s.x < 0 || s.x > W || s.y > H) shooting.splice(i, 1);
    }
  };
  
  /* ---- Haupt-Loop ---- */
  const loop = () => {
    t++;
    mouseX += (targetMouseX - mouseX) * 0.05;
    mouseY += (targetMouseY - mouseY) * 0.05;
    
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bg.addColorStop(0, '#050518');
    bg.addColorStop(0.5, '#02020e');
    bg.addColorStop(1, '#000004');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    
    drawNebula();
    drawStars();
    
    // Umlaufbahnen
    planets.forEach(p => {
      ctx.strokeStyle = 'rgba(80,140,220,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, p.orbitR, 0, Math.PI*2);
      ctx.stroke();
    });
    
    drawSun();
    
    // Planeten
    planets.forEach(p => {
      p.angle += p.angleSpeed;
      p.rot += 0.006;
      const px = cx + Math.cos(p.angle) * p.orbitR;
      const py = cy + Math.sin(p.angle) * p.orbitR;
      
      // Glow
      const glow = ctx.createRadialGradient(px, py, 0, px, py, p.sizePx * 3);
      glow.addColorStop(0, `rgba(255,255,255,0.1)`);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(px, py, p.sizePx * 3, 0, Math.PI*2); ctx.fill();
      
      // Monde
      p.moons.forEach(m => {
        m.angle += m.speed;
        const mx = px + Math.cos(m.angle) * p.sizePx * m.dist;
        const my = py + Math.sin(m.angle) * p.sizePx * m.dist;
        // Mondbahn
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.arc(px, py, p.sizePx * m.dist, 0, Math.PI*2);
        ctx.stroke();
        // Mond mit Textur
        const mr = p.sizePx * m.size;
        drawTexturedSphere(textures[m.tex] || textures.moon, mx, my, mr, 0, m.color || '#dddddd', '#666666');
      });
      
      // Planeten-Körper
      if (p.ring) {
        drawSaturnWithRings(p, px, py);
      } else {
        const tex = p.tex ? textures[p.tex] : null;
        drawTexturedSphere(tex, px, py, p.sizePx, p.rot, p.color, p.color2);
        
        // Atmosphäre für Erde
        if (p.name === 'Erde') {
          const atm = ctx.createRadialGradient(px, py, p.sizePx * 0.9, px, py, p.sizePx * 1.7);
          atm.addColorStop(0, 'rgba(120,200,255,0.35)');
          atm.addColorStop(0.5, 'rgba(80,160,240,0.15)');
          atm.addColorStop(1, 'rgba(60,140,220,0)');
          ctx.fillStyle = atm;
          ctx.beginPath(); ctx.arc(px, py, p.sizePx * 1.7, 0, Math.PI*2); ctx.fill();
        }
      }
    });
    
    drawShooting();
    if (Math.random() < 0.004) spawnShooting();
    
    requestAnimationFrame(loop);
  };
  
  const start = () => {
    resize(); init(); loop();
    window.addEventListener('resize', () => { resize(); init(); });
    window.addEventListener('mousemove', (e) => {
      targetMouseX = (e.clientX / window.innerWidth - 0.5) * 8;
      targetMouseY = (e.clientY / window.innerHeight - 0.5) * 8;
    });
  };
  
  return { start };
})();

/* ═══ WINDOWS – SICHERE POSITIONIERUNG ═══ */
HalDo.Windows = (() => {
  const desktop = document.getElementById('desktop');
  let zTop = 250;
  const wins = new Map();
  let cascadeIndex = 0;
  
  const create = (id, title, html, opts = {}) => {
    if (wins.has(id)) {
      const w = wins.get(id);
      w.el.style.zIndex = ++zTop;
      w.el.classList.add('active');
      document.querySelectorAll('.window').forEach(x => { if (x !== w.el) x.classList.remove('active'); });
      return w;
    }
    const el = document.createElement('div');
    el.className = 'window active';
    el.dataset.id = id;
    
    // GRÖSSE: Sicher innerhalb Desktop
    const maxW = desktop.clientWidth - 24;
    const maxH = desktop.clientHeight - 24;
    const vw = Math.min(maxW, opts.width || 500);
    const vh = Math.min(maxH, opts.height || 420);
    el.style.width = vw + 'px';
    el.style.height = vh + 'px';
    
    // POSITION: Sicher, mit Kaskade für neue Fenster
    const maxX = Math.max(0, desktop.clientWidth - vw);
    const maxY = Math.max(0, desktop.clientHeight - vh);
    const baseX = Math.min(maxX, 20 + cascadeIndex * 25);
    const baseY = Math.min(maxY, 20 + cascadeIndex * 25);
    cascadeIndex = (cascadeIndex + 1) % 5;
    
    el.style.left = Math.max(10, Math.min(maxX - 10, opts.x ?? baseX)) + 'px';
    el.style.top = Math.max(10, Math.min(maxY - 10, opts.y ?? baseY)) + 'px';
    el.style.zIndex = ++zTop;
    
    const header = document.createElement('div');
    header.className = 'win-header';
    header.innerHTML = `
      <span class="win-title">${title}</span>
      <div class="win-controls">
        <button class="win-ctrl" data-act="min" title="Minimieren">–</button>
        <button class="win-ctrl" data-act="max" title="Maximieren">□</button>
        <button class="win-ctrl close" data-act="close" title="Schließen">×</button>
      </div>`;
    const body = document.createElement('div');
    body.className = 'win-body';
    body.innerHTML = html;
    el.appendChild(header);
    el.appendChild(body);
    desktop.appendChild(el);
    
    el.addEventListener('mousedown', () => {
      el.style.zIndex = ++zTop;
      document.querySelectorAll('.window').forEach(x => { if (x !== el) x.classList.remove('active'); });
      el.classList.add('active');
    });
    
    header.querySelectorAll('.win-ctrl').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        const act = b.dataset.act;
        if (act === 'close') destroy(id);
        else if (act === 'min') { el.style.transform = 'scale(0)'; setTimeout(() => { el.style.display = 'none'; setTimeout(() => { el.style.transform = 'scale(1)'; el.style.display = 'flex'; }, 210); }, 200); }
        else if (act === 'max') {
          if (el.dataset.maxed === '1') {
            el.style.left = el.dataset.pL; el.style.top = el.dataset.pT;
            el.style.width = el.dataset.pW; el.style.height = el.dataset.pH;
            el.dataset.maxed = '0';
          } else {
            el.dataset.pL = el.style.left; el.dataset.pT = el.style.top;
            el.dataset.pW = el.style.width; el.dataset.pH = el.style.height;
            el.style.left = '0'; el.style.top = '0';
            el.style.width = '100%'; el.style.height = '100%';
            el.dataset.maxed = '1';
          }
        }
      });
    });
    
    let dragging = false, sx, sy, ox, oy;
    const dragStart = e => {
      if (e.target.closest('.win-ctrl')) return;
      if (!header.contains(e.target)) return;
      if (e.target.closest('.win-body')) return;
      dragging = true;
      const rect = el.getBoundingClientRect();
      const dRect = desktop.getBoundingClientRect();
      ox = rect.left - dRect.left; oy = rect.top - dRect.top;
      sx = e.clientX; sy = e.clientY;
      header.classList.add('dragging');
      el.style.zIndex = ++zTop;
      e.preventDefault();
    };
    const dragMove = e => {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      // WICHTIG: Nie über Desktop-Rand hinaus
      const nx = Math.max(0, Math.min(desktop.clientWidth - el.offsetWidth, ox + p.clientX - sx));
      const ny = Math.max(0, Math.min(desktop.clientHeight - el.offsetHeight, oy + p.clientY - sy));
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    };
    const dragEnd = () => { dragging = false; header.classList.remove('dragging'); };
    header.addEventListener('mousedown', dragStart);
    header.addEventListener('touchstart', dragStart, { passive: false });
    window.addEventListener('mousemove', dragMove);
    window.addEventListener('touchmove', dragMove, { passive: false });
    window.addEventListener('mouseup', dragEnd);
    window.addEventListener('touchend', dragEnd);
    
    wins.set(id, { el, body });
    return { el, body };
  };
  
  const destroy = id => { const w = wins.get(id); if (w) { w.el.remove(); wins.delete(id); } };
  const get = id => wins.get(id);
  const closeAll = () => { wins.forEach((w, id) => destroy(id)); };
  return { create, destroy, get, closeAll };
})();

HalDo.Apps.timer = () => {
  if (HalDo.Windows.get('timer')) return;
  const w = HalDo.Windows.create('timer', '⏱️ Timer', `
    <h3>⏱️ Timer</h3>
    <div style="text-align:center;padding:20px;background:rgba(var(--primary-rgb),.15);border-radius:16px;border:1.5px solid var(--border);margin-bottom:12px">
      <div id="td" style="font-size:48px;font-weight:900;font-family:monospace;color:var(--primary);text-shadow:0 0 20px rgba(var(--primary-rgb),.7)">00:00</div>
    </div>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px">
      ${[30,60,300,600,1800].map(s=>`<button class="chip" onclick="window._tS(${s})">${s>=60?s/60+'m':s+'s'}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn primary" id="ts" style="flex:1">▶ Start</button>
      <button class="btn" id="tp" style="flex:1">⏸ Stop</button>
      <button class="btn" id="tr" style="flex:1">↻ Reset</button>
    </div>`, { width: 400, height: 400, x: 40, y: 20 });
  const disp = w.body.querySelector('#td');
  let total = 60, remaining = 60, running = false, tick;
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const upd = () => disp.textContent = fmt(remaining);
  window._tS = s => { total = remaining = s; upd(); };
  w.body.querySelector('#ts').onclick = () => {
    if (running) return;
    running = true;
    tick = setInterval(() => {
      remaining--; upd();
      if (remaining <= 0) {
        clearInterval(tick); running = false;
        HalDo.Sound.play('alarm');
        HalDo.Toast.show('⏰ Timer abgelaufen!', { icon:'⏰', sound:'alarm', duration:5000 });
      }
    }, 1000);
  };
  w.body.querySelector('#tp').onclick = () => { running = false; clearInterval(tick); };
  w.body.querySelector('#tr').onclick = () => { running = false; clearInterval(tick); remaining = total; upd(); };
  upd();
};

HalDo.Apps.music = () => {
  if (HalDo.Windows.get('music')) return;
  const tracks = [
    { name:'Cosmic Ambient', freq:261.63, color:'#00e5ff' },

    { name:'Nebula Dream', freq:329.63, color:'#ff78c8' },

  ];

    <h3>🎵 Musik Studio</h3>
    <div id="ml"></div>
    <div style="margin-top:12px"><button class="btn" id="ms" style="width:100%">⏹ Stop</button></div>`, { width: 420, height: 420, x: 50, y: 20 });
  const list = w.body.querySelector('#ml');
  list.innerHTML = tracks.map((t,i)=>`
    <div class="list-item" style="cursor:pointer" onclick="window._mp(${i})">
      <span style="font-size:22px;filter:drop-shadow(0 0 6px ${t.color})">🎵</span>

      <span style="color:var(--primary);font-size:16px">▶</span>
    </div>`).join('');
  let osc, lfo;
  const stop = () => { try { osc?.stop(); lfo?.stop(); } catch(e){} };
  window._mp = i => {
    stop();
    const c = new (window.AudioContext||window.webkitAudioContext)();
    osc = c.createOscillator(); const gain = c.createGain(); lfo = c.createOscillator();
    const lfoGain = c.createGain();
    osc.type = 'sine'; osc.frequency.value = tracks[i].freq;
    lfo.type = 'sine'; lfo.frequency.value = 3; lfoGain.gain.value = tracks[i].freq * 0.05;
    lfo.connect(lfoGain).connect(osc.frequency);
    gain.gain.value = .08;
    osc.connect(gain).connect(c.destination);
    osc.start(); lfo.start();
    HalDo.Toast.show('▶ ' + tracks[i].name, { icon:'🎵' });
    HalDo.Sound.play('success');
  };
  w.body.querySelector('#ms').onclick = () => { stop(); HalDo.Sound.play('click'); };
};

/* ═══ AVATAR ═══ */
HalDo.Avatar = (() => {
  const fab = document.getElementById('avatarFab');
  const speak = text => {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; u.rate = 1; u.pitch = 1.1;
      u.onstart = () => fab.classList.add('speaking');
      u.onend = () => fab.classList.remove('speaking');
      window.speechSynthesis.speak(u);
    } catch(e){}
  };
  const think = () => { fab.textContent = '🤔'; setTimeout(() => fab.textContent = '🤖', 800); };
  return { speak, think };
})();
