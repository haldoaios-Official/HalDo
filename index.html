const factory = {};

/* ---- 1) LIST APP (Aufgaben, Bucket-Listen, Ideen) ---- */
factory.list = (title, key, placeholder, defaults = []) => ({
  open() {
    const all = () => HalDo.Store.get(key, []);
    const save = a => HalDo.Store.set(key, a);
    const rootId = 'x_' + key;
    HalDo.Win.open(title, `<div id="${rootId}"></div>`, { w: 420, h: 560 });
    setTimeout(() => {
      const root = document.getElementById(rootId);
      if (!root) return;
      if (!all().length && defaults.length) save(defaults.map(t => ({ text: t, done: false, ts: Date.now() })));
      const render = () => {
        const items = all();
        const done = items.filter(i => i.done).length;
        root.innerHTML = `
          <div style="padding:6px">
            <div style="display:flex;gap:6px;margin-bottom:10px">
              <input id="${rootId}_in" placeholder="${placeholder}" style="flex:1;padding:11px;border-radius:10px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:13px">
              <button id="${rootId}_add" class="chip active" style="min-width:60px">+</button>
            </div>
            <div style="font-size:11px;opacity:.6;margin-bottom:8px">${items.length - done} offen · ${done} erledigt</div>
            <div style="max-height:400px;overflow-y:auto">
              ${items.length === 0 ? '<p style="text-align:center;opacity:.5;padding:20px;font-size:13px">Noch nichts eingetragen</p>' :
                items.map((it, i) => `<div style="padding:10px;background:rgba(0,229,255,.06);border-radius:10px;margin-bottom:5px;border:1px solid rgba(0,229,255,.2);display:flex;align-items:center;gap:10px;font-size:13px">
                  <div data-tgl="${i}" style="width:24px;height:24px;min-width:24px;border-radius:6px;border:2px solid var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;${it.done ? 'background:var(--accent);color:#000' : ''}">${it.done ? '✓' : ''}</div>
                  <span style="flex:1;${it.done ? 'opacity:.5;text-decoration:line-through' : ''}">${it.text}</span>
                  <span data-del="${i}" style="opacity:.5;cursor:pointer;padding:2px">✕</span>
                </div>`).join('')}
            </div>
          </div>
        `;
        root.querySelector(`#${rootId}_add`).onclick = () => {
          const inp = root.querySelector(`#${rootId}_in`);
          const v = inp.value.trim(); if (!v) return;
          const arr = all(); arr.unshift({ text: v, done: false, ts: Date.now() });
          save(arr); HalDo.Sound.play('success'); render();
        };
        root.querySelector(`#${rootId}_in`).onkeydown = e => { if (e.key === 'Enter') root.querySelector(`#${rootId}_add`).click(); };
        root.querySelectorAll('[data-tgl]').forEach(el => el.onclick = () => { const a = all(); a[parseInt(el.dataset.tgl)].done = !a[parseInt(el.dataset.tgl)].done; save(a); HalDo.Sound.play('tap'); render(); });
        root.querySelectorAll('[data-del]').forEach(el => el.onclick = () => { const a = all(); a.splice(parseInt(el.dataset.del), 1); save(a); HalDo.Sound.play('tap'); render(); });
      };
      render();
    }, 100);
  }
});

factory.quiz = (title, questions) => ({
  open() {
    let idx = 0, score = 0;
    const rootId = 'x_quiz_' + Math.random().toString(36).slice(2, 6);
    HalDo.Win.open(title, `<div id="${rootId}"></div>`, { w: 440, h: 560 });
    setTimeout(() => {
      const root = document.getElementById(rootId);
      if (!root) return;
      const render = () => {
        if (idx >= questions.length) {
          root.innerHTML = `<div style="padding:20px;text-align:center">
            <div style="font-size:64px">${score >= questions.length * 0.7 ? '🎉' : '📚'}</div>
            <h2 style="color:var(--accent);font-size:26px;margin:10px 0">${score}/${questions.length}</h2>
            <p style="opacity:.8">${Math.round(score / questions.length * 100)}% richtig</p>
            <button id="${rootId}_restart" class="chip active" style="margin-top:16px;padding:12px 24px">🔄 Nochmal</button>
          </div>`;
          root.querySelector(`#${rootId}_restart`).onclick = () => { idx = 0; score = 0; render(); };
          return;
        }
        const q = questions[idx];
        root.innerHTML = `<div style="padding:6px">
          <div style="display:flex;justify-content:space-between;font-size:11px;opacity:.7;margin-bottom:8px">
            <span>${idx + 1}/${questions.length}</span><span style="color:var(--accent)">✓ ${score}</span>
          </div>
          <div style="height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-bottom:14px">
            <div style="width:${((idx+1)/questions.length)*100}%;height:100%;background:var(--accent)"></div>
          </div>
          <h3 style="font-size:15px;margin-bottom:14px;line-height:1.5">${q.q}</h3>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${q.a.map((opt, i) => `<button data-ans="${i}" style="padding:12px 14px;text-align:left;border-radius:10px;background:rgba(0,229,255,.08);border:1.5px solid rgba(0,229,255,.25);color:var(--text);font-size:13px;cursor:pointer;min-height:46px">${opt}</button>`).join('')}
          </div>
        </div>`;
        root.querySelectorAll('[data-ans]').forEach(btn => btn.onclick = () => {
          const pick = parseInt(btn.dataset.ans);
          if (pick === q.c) { score++; HalDo.Sound.play('success'); btn.style.background = 'rgba(0,255,136,.3)'; btn.style.borderColor = '#00ff88'; }
          else { HalDo.Sound.play('error'); btn.style.background = 'rgba(255,80,80,.3)'; btn.style.borderColor = '#ff5050'; root.querySelectorAll('[data-ans]')[q.c].style.background = 'rgba(0,255,136,.2)'; }
          root.querySelectorAll('[data-ans]').forEach(b => b.style.pointerEvents = 'none');
          setTimeout(() => { idx++; render(); }, 900);
        });
      };
      render();
    }, 100);
  }
});

/* Mathe-Trainer */
HalDo.MatheTrainer = {
  open() {
    let score = 0, current = 0, total = 20;
    const rootId = 'x_mathe';
    HalDo.Win.open('📐 Mathe-Trainer', `<div id="${rootId}"></div>`, { w: 400, h: 500 });
    setTimeout(() => {
      const root = document.getElementById(rootId);
      const newQ = () => {
        const a = Math.floor(Math.random() * 20) + 1;
        const b = Math.floor(Math.random() * 20) + 1;
        const op = ['+', '-', '*'][Math.floor(Math.random() * 3)];
        let ans;
        if (op === '+') ans = a + b;
        else if (op === '-') ans = a - b;
        else ans = a * b;
        return { q: `${a} ${op} ${b}`, ans };
      };
      let Q = newQ();
      const render = () => {
        if (current >= total) {
          root.innerHTML = `<div style="padding:20px;text-align:center"><div style="font-size:64px">${score >= total * 0.7 ? '🎉' : '💪'}</div>
            <h2 style="color:var(--accent);font-size:24px;margin:10px 0">${score}/${total}</h2>
            <p style="opacity:.8">${Math.round(score/total*100)}% richtig</p>
            <button id="${rootId}_re" class="chip active" style="margin-top:16px;padding:12px 24px">🔄 Nochmal</button></div>`;
          root.querySelector(`#${rootId}_re`).onclick = () => { score = 0; current = 0; Q = newQ(); render(); };
          return;
        }
        root.innerHTML = `<div style="padding:8px;text-align:center">
          <div style="font-size:11px;opacity:.6">${current + 1}/${total} · ✓ ${score}</div>
          <div style="margin:20px 0;padding:24px;background:rgba(0,229,255,.1);border-radius:14px;border:1.5px solid var(--accent)">
            <div style="font-size:42px;font-weight:bold;color:var(--accent)">${Q.q} = ?</div>
          </div>
          <input id="${rootId}_in" type="number" autofocus style="width:100%;padding:12px;border-radius:10px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);text-align:center;font-size:20px;margin-bottom:10px">
          <button id="${rootId}_go" class="chip active" style="width:100%;padding:12px">Prüfen</button>
        </div>`;
        const inp = root.querySelector(`#${rootId}_in`);
        inp.focus();
        const check = () => {
          if (parseInt(inp.value) === Q.ans) { score++; HalDo.Sound.play('success'); }
          else { HalDo.Sound.play('error'); HalDo.Toast.show('Richtig wäre: ' + Q.ans, 1500, 'error'); }
          current++; Q = newQ(); render();
        };
        root.querySelector(`#${rootId}_go`).onclick = check;
        inp.onkeydown = e => { if (e.key === 'Enter') check(); };
      };
      render();
    }, 100);
  }
};

HalDo.Zeiterfassung = {
  open() {
    const KEY = 'haldo_worktime_v1';
    const all = () => HalDo.Store.get(KEY, []);
    const save = a => HalDo.Store.set(KEY, a);
    const rootId = 'x_zeit';
    HalDo.Win.open('⏰ Zeiterfassung', `<div id="${rootId}"></div>`, { w: 420, h: 560 });
    setTimeout(() => {
      const root = document.getElementById(rootId);
      let timer = null, startTime = 0, running = false;
      const render = () => {
        const sessions = all();
        const total = sessions.reduce((s, x) => s + x.dur, 0);
        root.innerHTML = `<div style="padding:6px">
          <div style="text-align:center;padding:20px;background:rgba(0,229,255,.08);border-radius:14px;border:1px solid var(--border);margin-bottom:14px">
            <div id="${rootId}_disp" style="font-size:44px;font-weight:bold;color:var(--accent);font-family:monospace">00:00:00</div>
            <div style="font-size:11px;opacity:.6;margin-top:4px">Heute: ${Math.floor(total/60)} Min</div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:14px">
            <button id="${rootId}_go" class="chip active" style="flex:1;padding:12px">${running ? '⏹ Stop' : '▶ Start'}</button>
          </div>
          <div style="font-size:12px;font-weight:600;margin-bottom:8px">📊 Sessions</div>
          <div style="max-height:280px;overflow-y:auto">
            ${sessions.slice(0, 20).map((s, i) => `<div style="padding:8px;background:rgba(0,229,255,.06);border-radius:8px;margin-bottom:4px;display:flex;justify-content:space-between;font-size:12px">
              <span>${new Date(s.ts).toLocaleString('de-DE')}</span>
              <span style="color:var(--accent)">${Math.floor(s.dur/60)}:${String(s.dur%60).padStart(2,'0')}</span>
            </div>`).join('') || '<p style="text-align:center;opacity:.5;padding:14px;font-size:12px">Keine Sessions</p>'}
          </div>
        </div>`;
        const updateDisp = () => {
          if (!running) return;
          const el = document.getElementById(rootId + '_disp');
          if (el) {
            const s = Math.floor((Date.now() - startTime) / 1000);
            el.textContent = `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
          }
        };
        root.querySelector(`#${rootId}_go`).onclick = () => {
          if (running) {
            running = false;
            clearInterval(timer);
            const dur = Math.round((Date.now() - startTime) / 1000);
            const arr = all(); arr.unshift({ ts: Date.now(), dur });
            save(arr); HalDo.Sound.play('success'); render();
          } else {
            running = true;
            startTime = Date.now();
            timer = setInterval(updateDisp, 500);
            HalDo.Sound.play('tap');
            render();
            setTimeout(() => {
              const go = document.getElementById(rootId + '_go');
              if (go) go.onclick = () => {
                if (running) {
                  running = false; clearInterval(timer);
                  const dur = Math.round((Date.now() - startTime) / 1000);
                  const arr = all(); arr.unshift({ ts: Date.now(), dur });
                  save(arr); HalDo.Sound.play('success'); render();
                }
              };
            }, 50);
          }
        };
      };
      render();
    }, 100);
  }
};

HalDo.Projekte = {

              ${projects.filter(p => p.status === col).map((p, i) => `<div style="padding:8px;background:rgba(0,229,255,.06);border-radius:8px;margin-bottom:4px;border:1px solid rgba(0,229,255,.2);font-size:11px;cursor:pointer">

                </div>
              </div>`).join('')}
            </div>`).join('')}
          </div>
        </div>`;
        root.querySelector(`#${rootId}_add`).onclick = () => {
          const inp = root.querySelector(`#${rootId}_in`);
          const v = inp.value.trim(); if (!v) return;

          save(arr); render();

        root.querySelectorAll('[data-move]').forEach(el => el.onclick = () => {
          const arr = all(); const idx = parseInt(el.dataset.move);

          save(arr); render(); HalDo.Sound.play('tap');

        root.querySelectorAll('[data-pdel]').forEach(el => el.onclick = () => {

      };
      root.addEventListener('click',async e=>{
        const b=e.target.closest('button');if(!b)return;
        const s=initial();
        if(b.dataset.openChat){active=b.dataset.openChat;render();return;}
        if(b.dataset.action==='new-chat'){
          const title=prompt('Name oder Kontakt für den neuen Chat:');if(!title?.trim())return;
          const type=(prompt('Typ eingeben: privat, gruppe oder kanal','privat')||'privat').toLowerCase();
          const norm=type==='gruppe'?'group':type==='kanal'?'channel':'direct';
          const conv={id:uid('conv'),title:title.trim(),type:norm,messages:[],createdAt:Date.now()};s.conversations.unshift(conv);persist(s);active=conv.id;render();return;
        }
        if(b.dataset.action==='send-chat'){
          if(!active){toast('Bitte zuerst einen Chat erstellen.','warning');return;}
          const input=root.querySelector('[data-chat-input]'), text=input?.value.trim();if(!text)return;
          const file=root.querySelector('[data-chat-file]')?.files?.[0];const c=s.conversations.find(x=>x.id===active);const msg={id:uid('msg'),text,author:'Du',mine:true,at:Date.now(),file:file?.name||'',replyTo};c.messages.push(msg);replyTo='';persist(s);
          const adapter=window.HalDoServices?.chat;
          if(typeof adapter?.send==='function'){try{await adapter.send({conversationId:c.id,message:msg});}catch(err){toast('Server-Sync fehlgeschlagen; lokal gespeichert.','warning');}}
          render();return;
        }
        if(b.dataset.react){const c=s.conversations.find(x=>x.id===active);const m=c?.messages.find(x=>x.id===b.dataset.react);if(m){m.reaction=m.reaction?'':'❤️';persist(s);render();}return;}
        if(b.dataset.reply){replyTo=b.dataset.reply;const input=root.querySelector('[data-chat-input]');if(input){input.placeholder='Antwort auf Nachricht …';input.focus();}return;}
        if(b.dataset.deleteMsg){const c=s.conversations.find(x=>x.id===active);if(c){c.messages=c.messages.filter(m=>m.id!==b.dataset.deleteMsg);persist(s);render();}return;}
      });
      root.addEventListener('change',e=>{if(e.target.matches('[data-ai-consent]')){const s=initial();s.aiConsent=e.target.checked;persist(s);toast(s.aiConsent?'Freigabe für künftige, ausdrücklich ausgewählte Chat-Kontexte aktiviert.':'AI-Zugriff auf private Chats ausgeschaltet.','info');}});
      root.addEventListener('keydown',e=>{if(e.target.matches('[data-chat-input]')&&e.key==='Enter'){e.preventDefault();root.querySelector('[data-action="send-chat"]')?.click();}});

  /* ------------------------------------------------------------
     D. VIDEO CALLS PRO – echte 1:1 WebRTC-Teststrecke mit manuellem
        SDP-Austausch; Gruppen/zuverlässige NAT-Durchquerung benötigen
        Signaling-Backend und STUN/TURN/SFU.
     ------------------------------------------------------------ */
  H.VideoCalls = (() => {
    let pc=null, localStream=null, screenStream=null, remoteStream=null, rootRef=null;
    const iceServers=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
    const open=()=>{const id=uid('video-call');openWindow('🎥 HalDo Video Calls Pro',`<div id="${id}" class="hdx-root"></div>`,{w:780,h:760});setTimeout(()=>mount(id),80);};
    function mount(id){
      const root=document.getElementById(id);if(!root)return;rootRef=root;
      root.innerHTML=`<div class="hdx-root"><div class="hdx-banner hdx-spread"><div><strong>HalDo Video Calls Pro</strong><div class="hdx-muted">1:1 WebRTC · Kamera · Mikrofon · Bildschirmfreigabe</div></div><span class="hdx-status" data-call-status>Bereit – noch nicht verbunden</span></div>
        <div class="hdx-video-grid"><div><label class="hdx-label">Deine Kamera</label><video class="hdx-video" data-local-video autoplay muted playsinline></video></div><div><label class="hdx-label">Gegenstelle</label><video class="hdx-video" data-remote-video autoplay playsinline></video></div></div>
        <div class="hdx-row" style="margin:10px 0"><button class="hdx-btn primary" data-v="media">🎙 Kamera/Mikrofon erlauben</button><button class="hdx-btn" data-v="mute">Mikrofon umschalten</button><button class="hdx-btn" data-v="camera">Kamera umschalten</button><button class="hdx-btn" data-v="share">Bildschirm teilen</button><button class="hdx-btn danger" data-v="hangup">Auflegen</button></div>
        <div class="hdx-card"><h3>Schritt 1 · Anruf starten</h3><button class="hdx-btn primary" data-v="offer">Verbindungsangebot erstellen</button><label class="hdx-label">Angebot (SDP) – an die andere Person senden</label><textarea class="hdx-field hdx-code" data-offer-out></textarea><button class="hdx-btn" data-v="copy-offer">Angebot kopieren</button></div>
        <div class="hdx-card"><h3>Schritt 2 · Anruf annehmen</h3><label class="hdx-label">Angebot der anderen Person einfügen</label><textarea class="hdx-field hdx-code" data-offer-in></textarea><button class="hdx-btn primary" data-v="answer">Angebot annehmen & Antwort erstellen</button><label class="hdx-label">Deine Antwort (SDP) – zurücksenden</label><textarea class="hdx-field hdx-code" data-answer-out></textarea><button class="hdx-btn" data-v="copy-answer">Antwort kopieren</button></div>
        <div class="hdx-card"><h3>Schritt 3 · Verbindung abschließen</h3><label class="hdx-label">Antwort der Gegenstelle einfügen</label><textarea class="hdx-field hdx-code" data-answer-in></textarea><button class="hdx-btn primary" data-v="connect">Antwort übernehmen / verbinden</button></div>
        <div class="hdx-banner"><strong>Technischer Status:</strong> Diese Ein-Datei-Version bietet einen manuellen 1:1-WebRTC-Signalaustausch als Teststrecke. Es gibt noch keinen zentralen Raum-/Signalisierungsserver, keine Gruppen-SFU und keinen TURN-Dienst. Verbindungen können deshalb hinter restriktiven NAT-/Firewall-Netzen scheitern. Aufzeichnung ist standardmäßig nicht eingebaut.</div>
        </div>`;
      root.addEventListener('click',async e=>{
        const b=e.target.closest('[data-v]');if(!b)return;const act=b.dataset.v;
        try{
          if(act==='media')await startMedia();
          if(act==='mute'){if(!localStream)return toast('Mikrofon noch nicht freigegeben.','warning');localStream.getAudioTracks().forEach(t=>t.enabled=!t.enabled);toast('Mikrofonstatus geändert.','info');}
          if(act==='camera'){if(!localStream)return toast('Kamera noch nicht freigegeben.','warning');localStream.getVideoTracks().forEach(t=>t.enabled=!t.enabled);toast('Kamerastatus geändert.','info');}
          if(act==='share')await shareScreen();
          if(act==='offer')await makeOffer();
          if(act==='answer')await acceptOffer();
          if(act==='connect')await acceptAnswer();
          if(act==='hangup')hangup();
          if(act==='copy-offer')await copyText(root.querySelector('[data-offer-out]').value);
          if(act==='copy-answer')await copyText(root.querySelector('[data-answer-out]').value);
        }catch(err){setStatus('Fehler: '+(err.message||err),true);console.error('HalDo Video Calls:',err);}
      });
      function setStatus(msg,bad=false){const el=root.querySelector('[data-call-status]');if(el){el.textContent=msg;el.className='hdx-status '+(bad?'bad':'');}}
      function waitIce(connection){return new Promise(resolve=>{if(connection.iceGatheringState==='complete')return resolve();let done=false;const finish=()=>{if(done)return;done=true;connection.removeEventListener('icegatheringstatechange',check);resolve();};const check=()=>{if(connection.iceGatheringState==='complete')finish();};connection.addEventListener('icegatheringstatechange',check);setTimeout(finish,12000);});}
      async function startMedia(){if(!navigator.mediaDevices?.getUserMedia)throw new Error('Kamera/Mikrofon benötigen HTTPS und Browserunterstützung.');localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});root.querySelector('[data-local-video]').srcObject=localStream;setStatus('Lokale Medien freigegeben.');return localStream;}
      function createPC(){if(pc)pc.close();pc=new RTCPeerConnection({iceServers});remoteStream=new MediaStream();root.querySelector('[data-remote-video]').srcObject=remoteStream;pc.ontrack=e=>e.streams[0]?.getTracks().forEach(t=>remoteStream.addTrack(t));pc.onconnectionstatechange=()=>setStatus('Verbindung: '+pc.connectionState,pc.connectionState==='failed');if(localStream)localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));return pc;}
      async function makeOffer(){if(!localStream)await startMedia();const connection=createPC();const offer=await connection.createOffer();await connection.setLocalDescription(offer);setStatus('ICE-Kandidaten werden gesammelt …');await waitIce(connection);root.querySelector('[data-offer-out]').value=connection.localDescription.sdp;setStatus('Angebot bereit – SDP an Gegenstelle senden.');}
      async function acceptOffer(){const sdp=root.querySelector('[data-offer-in]').value.trim();if(!sdp)throw new Error('Bitte SDP-Angebot einfügen.');if(!localStream)await startMedia();const connection=createPC();await connection.setRemoteDescription({type:'offer',sdp});const answer=await connection.createAnswer();await connection.setLocalDescription(answer);setStatus('ICE-Kandidaten werden gesammelt …');await waitIce(connection);root.querySelector('[data-answer-out]').value=connection.localDescription.sdp;setStatus('Antwort bereit – an Anrufer zurücksenden.');}
      async function acceptAnswer(){const sdp=root.querySelector('[data-answer-in]').value.trim();if(!sdp)throw new Error('Bitte SDP-Antwort einfügen.');if(!pc)throw new Error('Zuerst ein Verbindungsangebot erstellen.');await pc.setRemoteDescription({type:'answer',sdp});setStatus('Antwort übernommen. Verbindung wird aufgebaut.');}
      async function shareScreen(){if(!navigator.mediaDevices?.getDisplayMedia)throw new Error('Bildschirmfreigabe wird in diesem Browser nicht unterstützt.');screenStream=await navigator.mediaDevices.getDisplayMedia({video:true});const track=screenStream.getVideoTracks()[0];if(pc){const sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(track);else pc.addTrack(track,screenStream);}root.querySelector('[data-local-video]').srcObject=screenStream;track.onended=()=>{if(localStream)root.querySelector('[data-local-video]').srcObject=localStream;};setStatus('Bildschirmfreigabe aktiv.');}
      async function copyText(text){if(!text)return toast('Noch kein SDP-Code vorhanden.','warning');await navigator.clipboard.writeText(text);toast('SDP-Code kopiert.','success');}
      function hangup(){if(pc){pc.close();pc=null;}[localStream,screenStream].filter(Boolean).forEach(s=>s.getTracks().forEach(t=>t.stop()));localStream=null;screenStream=null;root.querySelector('[data-local-video]').srcObject=null;root.querySelector('[data-remote-video]').srcObject=null;setStatus('Anruf beendet.');}
    }
    return {open};
  })();

      function showPanel(tab){const s=initial(),panel=root.querySelector('[data-phone-panel]');if(!panel)return;root.querySelectorAll('[data-phone-tab]').forEach(b=>b.classList.toggle('active',b.dataset.phoneTab===tab));

  /* ------------------------------------------------------------

        Speech Recognition, erlaubte lokale App-Aktionen, optionaler
        sicherer Backend-Endpunkt (keine API-Schlüssel im Frontend).
     ------------------------------------------------------------ */
  H.LivingAvatar = (() => {
    let mode='ai', state='idle', recognition=null;
    const prefs=()=>load('avatar_prefs_v1',{language:'de-DE',autoSpeak:true,rate:0.96,pitch:1.0,voiceURI:'',backendUrl:''});
    const open=(initialMode='ai')=>{mode=initialMode==='cyborg'?'cyborg':'ai';const id=uid('living');openWindow(mode==='cyborg'?'⚡ HalDo CYBORG / JARVIS':'🤖 Living HalDo AI',`<div id="${id}" class="hdx-root"></div>`,{w:590,h:700});setTimeout(()=>mount(id),70);};
    function setState(next){state=next;document.querySelectorAll('.hdx-face').forEach(face=>{face.classList.toggle('speaking',next==='speaking');face.classList.toggle('listening',next==='listening');face.classList.toggle('thinking',next==='thinking');});document.querySelectorAll('[data-avatar-state]').forEach(status=>{status.textContent=({idle:'Bereit',listening:'Hört zu …',thinking:'Denkt nach …',speaking:'Spricht …',error:'Fehler'})[next]||next;});}
    function speak(text,root){if(!('speechSynthesis'in window))return toast('Sprachausgabe in diesem Browser nicht verfügbar.','warning');const p=prefs();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=p.language||'de-DE';u.rate=Number(p.rate)||.96;u.pitch=Number(p.pitch)||1;const voice=speechSynthesis.getVoices().find(v=>v.voiceURI===p.voiceURI);if(voice)u.voice=voice;u.onstart=()=>setState('speaking');u.onend=()=>setState('idle');u.onerror=()=>setState('idle');speechSynthesis.speak(u);}
    async function ask(text,root){const t=text.trim();if(!t)return;setState('thinking');const low=t.toLowerCase();
      const actions=[
        [/arztbuch|anatomie|medizin/,'arztbuch'],[/e.?mail|postfach/,'email'],[/chat pro|messenger|nachricht/,'chat-pro'],[/video.?anruf|videocall|meeting/,'videocall'],[/telefon|phone|anrufen/,'phone'],[/wetter/,'weather'],[/einstellungen|settings/,'settings'],[/app.?liste|alle apps|registry/,'app-registry'],[/fahrschule|führerschein/,'fahrschule'],[/êzîdî|ezidi|ezîdî/,'ezidi']
      ];
      const found=actions.find(([regex])=>regex.test(low));
      if(found){const answer='Natürlich. Ich öffne den gewünschten HalDo-Bereich.';root.querySelector('[data-avatar-reply]').textContent=answer;setState('idle');if(prefs().autoSpeak)speak(answer,root);setTimeout(()=>H.Launch({id:found[1],n:found[1]}),160);return answer;}

  async function processTranscript(raw){
    const text=String(raw||'').trim();if(!text)return;
    state.lastTranscript=text;const q=norm(text);const ctx=updateContext();
    const inp=document.querySelector('#haldoVoiceHub [data-hv-input]');if(inp)inp.value=text;
    H.VoiceHub.emit('transcript',{text,context:ctx});
    if(state.dictation){state.dictation=false;const ok=insertDictation(text);const reply=ok?'Ich habe den gesprochenen Text in das aktive Eingabefeld eingefügt.':'Ich habe kein Eingabefeld in der aktiven App gefunden.';announce(reply);if(readPrefs().autoSpeak)speak(reply);return reply;}
    if(/^(stopp|stop|abbrechen|ruhe|sprache stoppen|vorlesen stoppen)$/.test(q)){stopListening();stopSpeaking();announce('Sprachsteuerung und Sprachausgabe gestoppt.');return 'Sprachsteuerung und Sprachausgabe gestoppt.';}
    if(/(lies|lese|vorlesen|lies mir|lese mir).*(vor|inhalt|seite|fenster|app)|^(vorlesen|lies vor)$/.test(q)){
      const content=getWindowText(ctx.window);announce('Ich lese '+ctx.title+' vor.');speak(content);return content;
    }
    if(/^(diktat|diktieren|spracheingabe|schreib mit)$/.test(q)){state.dictation=true;announce('Diktat aktiv. Sprich jetzt deinen Text.');startListening(true);return 'Diktat aktiv.';}
    if(/(oeffne|offne|öffne|starte|zeige|wechsel zu|gehe zu|geh zu|open)\s+/.test(q)){
      if(/cyborg|jarvis/.test(q)){H.LivingAvatar?.open?.('cyborg');const r='HalDo Cyborg und Jarvis werden geöffnet.';announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
      if(/haldo ai|assistant|ki assistent|ki-assistent/.test(q)){H.LivingAvatar?.open?.('ai');const r='Living HalDo AI wird geöffnet.';announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
      const app=normalizeAppMatch(q.replace(/^(.*?)(oeffne|offne|öffne|starte|zeige|wechsel zu|gehe zu|geh zu|open)\s+/,'').replace(/^(bitte|den|die|das|meine|mein)\s+/,''));
      if(app){const ok=launchApp(app);const r=ok?app.n+' wird geöffnet.':'Die App konnte nicht geöffnet werden.';announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
    }
    if(/(aktiviere|schalte ein|wechsle in|wechsle zu|starte).*(cyborg|jarvis)/.test(q)){H.LivingAvatar?.open?.('cyborg');const r='HalDo Cyborg und Jarvis sind geöffnet.';announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
    if(/(oeffne|offne|öffne|starte|zeige|wechsel zu|gehe zu|geh zu|open).*(haldo ai|haldo ki|assistant|jarvis|cyborg)/.test(q)){const cyborg=/jarvis|cyborg/.test(q);H.LivingAvatar?.open?.(cyborg?'cyborg':'ai');const r=cyborg?'HalDo Cyborg und Jarvis werden geöffnet.':'Living HalDo AI wird geöffnet.';announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
    if(/(haldo ai|haldo ki|jarvis|cyborg).*(zuhoeren|zuhören|hoer zu|hör zu|hoere zu|höre zu)/.test(q)){startListening(false);return 'Ich höre zu.';}
    if(/^(hallo|hi|hey|guten morgen|guten tag|guten abend|hey haldo|hallo haldo)$/.test(q)){const r='Hallo! Ich bin HalDo AI. Du kannst mir sagen, welche App ich öffnen oder vorlesen soll.';announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
    const ctxAdapter=ctx.appId&&state.appAdapters.get(ctx.appId);
    if(ctxAdapter?.commands){
      for(const command of ctxAdapter.commands){
        const matches=(command.phrases||[]).some(p=>q.includes(norm(p)));
        if(matches&&typeof command.run==='function'){
          try{const result=await command.run({text,appId:ctx.appId,window:ctx.window,api:H.VoiceHub});const r=typeof result==='string'?result:(result?.speech||'Die App-Aktion wurde ausgeführt.');announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
          catch(e){const r='Die Aktion in '+ctx.title+' ist fehlgeschlagen: '+e.message;announce(r);speak(r);return r;}
        }
      }
    }
    for(const command of state.commands.values()){
      if(command.appId && command.appId!==ctx.appId)continue;
      const matches=(command.phrases||[]).some(p=>q.includes(norm(p)));
      if(matches){
        try{const result=await command.run({text,appId:ctx.appId,window:ctx.window,api:H.VoiceHub});const r=typeof result==='string'?result:(result?.speech||'Die Sprachaktion wurde ausgeführt.');announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
        catch(e){const r='Die Sprachaktion '+command.name+' ist fehlgeschlagen: '+e.message;announce(r);if(readPrefs().autoSpeak)speak(r);return r;}
      }
    }
    try{
      setState('thinking');const backendReply=await sendToBackend(text);
      if(backendReply){announce(backendReply);setState('idle');if(readPrefs().autoSpeak)speak(backendReply);return backendReply;}
    }catch(e){console.warn('HalDo Voice Backend:',e);}
    const reply='Ich habe dich verstanden. Ich kann alle registrierten HalDo-Apps öffnen, den Inhalt der aktiven App vorlesen und Text in Eingabefelder diktieren. Für freie KI-Antworten und tiefergehende Aktionen muss ein sicherer HalDo-AI-Backend-Dienst verbunden sein.';
    announce(reply);setState('idle');if(readPrefs().autoSpeak)speak(reply);return reply;
  }
  function startListening(dictation=false){
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Recognition){toast('Spracherkennung ist in diesem Browser nicht verfügbar. Nutze Chrome/Edge oder die Texteingabe.','error');setState('error');return false;}
    try{
      if(state.recognition){try{state.recognition.abort();}catch(_){}}
      stopSpeaking(false);state.dictation=!!dictation;
      const rec=new Recognition();state.recognition=rec;rec.lang=readPrefs().language||'de-DE';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
      const transcriptNode=document.querySelector('#haldoVoiceHub [data-hv-interim]');
      rec.onstart=()=>{setState('listening');if(transcriptNode)transcriptNode.textContent='Ich höre zu …';};
      rec.onresult=e=>{let finalText='';let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)finalText+=t;else interim+=t;}if(transcriptNode)transcriptNode.textContent=finalText||interim||'Ich höre zu …';if(finalText)processTranscript(finalText);};
      rec.onerror=e=>{setState('idle');if(e.error!=='no-speech'&&e.error!=='aborted')toast('Mikrofon/Spracherkennung: '+e.error,'error');};
      rec.onend=()=>{if(state.mode==='listening')setState('idle');if(state.recognition===rec)state.recognition=null;};

  }
  function stopListening(){if(state.recognition){try{state.recognition.stop();}catch(_){}state.recognition=null;}state.dictation=false;if(state.mode==='listening')setState('idle');}
  function openPanel(){const dock=document.getElementById('haldoVoiceHub');if(!dock)return;dock.classList.add('hv-open');state.panelOpen=true;dock.querySelector('[data-hv-input]')?.focus();}
  function closePanel(){const dock=document.getElementById('haldoVoiceHub');dock?.classList.remove('hv-open');state.panelOpen=false;}
  function fillVoiceOptions(){
    const dock=document.getElementById('haldoVoiceHub');if(!dock)return;const p=readPrefs();const language=dock.querySelector('[data-hv-language]');const voices=dock.querySelector('[data-hv-voice]');
    if(language){language.innerHTML=LANGS.map(([v,n])=>`<option value="${v}" ${v===p.language?'selected':''}>${n}</option>`).join('');}
    if(voices){voices.innerHTML='<option value="">Automatische passende Stimme</option>'+getVoices().map(v=>`<option value="${String(v.voiceURI).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" ${v.voiceURI===p.voiceURI?'selected':''}>${String(v.name).replace(/</g,'&lt;')} (${v.lang})</option>`).join('');}

  }
  function buildDock(){
    if(document.getElementById('haldoVoiceHub'))return;
    const dock=document.createElement('section');dock.id='haldoVoiceHub';dock.innerHTML=`
      <div class="hv-panel" role="dialog" aria-label="HalDo universeller Sprachassistent">

        <div class="hv-row"><button class="hv-btn primary" data-hv-listen>🎤 Sprechen</button><button class="hv-btn" data-hv-dictate>📝 Diktieren</button><button class="hv-btn" data-hv-read>🔊 Aktive App vorlesen</button><button class="hv-btn" data-hv-stop>⏹ Stop</button></div>

        <label class="hv-label">Nachricht an HalDo</label><div class="hv-row"><input class="hv-input" data-hv-input placeholder="z. B. Öffne Arztbuch oder lies diese App vor"><button class="hv-btn primary" data-hv-send>➤</button></div>
        <details><summary class="hv-label">Stimme und Sprache</summary>
          <label class="hv-label">Sprache / Spracherkennung</label><select class="hv-input" data-hv-language></select>

          <label class="hv-label">Sprechgeschwindigkeit</label><input class="hv-input" type="range" min="0.7" max="1.3" step="0.05" data-hv-rate value="0.98">
          <label class="hv-row" style="align-items:center;font-size:12px"><input type="checkbox" data-hv-autospeak checked> Antworten automatisch vorlesen</label>
          <button class="hv-btn primary" data-hv-save>Stimmeinstellungen speichern</button>
          <div class="hv-muted" data-hv-support></div>
        </details>
        <div class="hv-muted" style="margin-top:9px">Beispiele: „Öffne Arztbuch“, „Starte Fahrschule“, „Öffne HalDo Chat“, „Lies diese App vor“, „Diktieren“, „Stop“.</div>
      </div>
      <button class="hv-launch" type="button" data-hv-toggle aria-label="HalDo Voice öffnen"><span class="hv-orb"></span>🎙 HalDo Voice</button>`;
    document.body.appendChild(dock);
    const p=readPrefs();dock.querySelector('[data-hv-rate]').value=p.rate;dock.querySelector('[data-hv-autospeak]').checked=p.autoSpeak;fillVoiceOptions();
    dock.addEventListener('click',async e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.hasAttribute('data-hv-toggle')){dock.classList.toggle('hv-open');state.panelOpen=dock.classList.contains('hv-open');return;}

  function addWindowTools(win){

  H.Reminders = (function(){
    var KEY = 'v153_reminders';
    var priority = {
      low:{label:'Niedrig',color:'#7dd3fc'},
      normal:{label:'Normal',color:'#8fffd0'},
      high:{label:'Hoch',color:'#ffbd66'},
      urgent:{label:'Dringend',color:'#ff8192'}
    };
    var read = function(){
      var value = storeGet(KEY, []);
      return Array.isArray(value) ? value.filter(function(item){ return item && typeof item.id === 'string' && typeof item.title === 'string'; }) : [];
    };
    var write = function(items){ return storeSet(KEY, items); };
    var dateLabel = function(timestamp){
      if (!timestamp) return 'Ohne Termin';
      var date = new Date(timestamp);
      return isNaN(date.getTime()) ? 'Ungültiger Termin' : date.toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'});
    };
    var statusFor = function(item){
      if (item.done) return 'Erledigt';
      if (!item.dueAt) return 'Offen';
      if (item.dueAt < Date.now()) return 'Überfällig';
      if (item.dueAt - Date.now() < 60 * 60 * 1000) return 'Demnächst';
      return 'Geplant';
    };
    var open = function(){
      var rootId = uid('hdp-reminders');
      openRoot('⏰ HalDo Erinnerungen Pro', rootId, {w:570,h:740}, mount);
      return rootId;

      var search = '';

        if (!('Notification' in window)) return 'Browser-Hinweise nicht verfügbar';
        if (Notification.permission === 'granted') return 'Browser-Hinweise aktiv';
        if (Notification.permission === 'denied') return 'Browser-Hinweise blockiert';
        return 'Browser-Hinweise aus';
      };
      var render = function(){
        if (!root.isConnected) return;
        var items = read();
        var openItems = items.filter(function(x){ return !x.done; });
        var doneItems = items.filter(function(x){ return x.done; });
        var overdue = openItems.filter(function(x){ return x.dueAt && x.dueAt < Date.now(); });
        var visible = items.filter(function(x){
          var matchFilter = filter === 'all' || (filter === 'done' ? x.done : !x.done);
          var matchSearch = !search || (x.title + ' ' + (x.notes || '')).toLowerCase().indexOf(search.toLowerCase()) !== -1;
          return matchFilter && matchSearch;
        }).sort(function(a,b){
          if (a.done !== b.done) return a.done ? 1 : -1;
          return (a.dueAt || Number.MAX_SAFE_INTEGER) - (b.dueAt || Number.MAX_SAFE_INTEGER);
        });
        root.innerHTML = `
          <div class="hdp153-head"><div><div class="hdp153-title">⏰ Erinnerungen Pro</div><div class="hdp153-sub">Termine, Aufgaben und persönliche Erinnerungen · lokal gespeichert</div></div><span class="hdp153-chip">v153 · ${items.length} Einträge</span></div>
          <div class="hdp153-stats">

            <div class="hdp153-stat"><b>${overdue.length}</b><span>Überfällig</span></div>

            <input class="hdp153-field" id="${root.id}-title" name="title" maxlength="120" required placeholder="z. B. Arzttermin, Rückruf, Medikamente …">
            <div class="hdp153-grid" style="margin-top:8px">
              <div><label class="hdp153-label">Datum und Uhrzeit</label><input class="hdp153-field" name="due" type="datetime-local"></div>
              <div><label class="hdp153-label">Priorität</label><select class="hdp153-field" name="priority"><option value="normal">Normal</option><option value="low">Niedrig</option><option value="high">Hoch</option><option value="urgent">Dringend</option></select></div>
            </div>
            <label class="hdp153-label" style="margin-top:8px">Notiz (optional)</label>

            <div class="hdp153-actions" style="margin-top:9px"><button class="hdp153-btn primary" type="submit">Erinnerung speichern</button><button class="hdp153-btn" type="button" data-rem-notification>🔔 ${esc(permissionLabel())}</button></div>
          </form>
          <div class="hdp153-actions" style="margin:8px 0"><input class="hdp153-field" data-rem-search placeholder="Erinnerungen durchsuchen …" value="${esc(search)}" style="flex:1;min-width:150px"><button class="hdp153-btn" type="button" data-rem-check>Fällige prüfen</button></div>
          <div class="hdp153-tabs">
            <button class="hdp153-tab ${filter==='open'?'active':''}" data-rem-filter="open">Offen (${openItems.length})</button>
            <button class="hdp153-tab ${filter==='all'?'active':''}" data-rem-filter="all">Alle (${items.length})</button>
            <button class="hdp153-tab ${filter==='done'?'active':''}" data-rem-filter="done">Erledigt (${doneItems.length})</button>
          </div>
          <div>${visible.length ? visible.map(function(item){
            var p = priority[item.priority] || priority.normal;
            var status = statusFor(item);

            return `<article class="hdp153-item ${item.done?'done':''}">

            </article>`;
          }).join('') : '<div class="hdp153-empty">'+(search?'Keine passenden Erinnerungen gefunden.':'Hier ist gerade nichts zu sehen. Lege oben deine erste Erinnerung an.')+'</div>'}</div>
          <div class="hdp153-foot">${esc(permissionLabel())}. Erinnerungen werden geprüft, solange diese App geöffnet ist. Für zuverlässige Hintergrund-Erinnerungen wäre später ein Push-/Serverdienst nötig.</div>`;
      };
      var checkDue = function(){
        if (!root.isConnected) return;
        var items = read();
        var changed = false;
        var now = Date.now();
        items.forEach(function(item){
          if (!item.done && item.dueAt && item.dueAt <= now && !item.notifiedAt){
            item.notifiedAt = now;
            changed = true;
            notify('⏰ Erinnerung: ' + item.title, 'success');

      root.addEventListener('submit', function(event){

          if (Notification.permission === 'denied'){ notify('Bitte erlaube Hinweise in den Website-Einstellungen deines Browsers.','error'); return; }
          Notification.requestPermission().then(function(permission){ notify(permission === 'granted' ? 'Browser-Hinweise aktiviert.' : 'Keine Berechtigung erteilt.', permission === 'granted' ? 'success' : 'error'); render(); }).catch(function(){notify('Berechtigung konnte nicht abgefragt werden.','error');});
          return;
        }
        if (button.hasAttribute('data-rem-check')){ checkDue(); notify('Fällige Erinnerungen geprüft.','success'); return; }
        if (button.dataset.remDelete){
          if (!window.confirm('Diese Erinnerung wirklich löschen?')) return;
          write(read().filter(function(x){return x.id !== button.dataset.remDelete;})); render(); notify('Erinnerung gelöscht.'); return;
        }
        if (button.dataset.remEdit){
          var items = read(); var item = items.find(function(x){return x.id === button.dataset.remEdit;});
          if (!item) return;
          var title = window.prompt('Erinnerung bearbeiten:',item.title);
          if (title === null) return;
          title = title.trim(); if (!title){ notify('Der Titel darf nicht leer sein.','error'); return; }

      });
      root.addEventListener('change', function(event){

        if (!checkbox) return;
        var items = read(); var item = items.find(function(x){return x.id === checkbox.dataset.remToggle;});
        if (!item) return;
        item.done = checkbox.checked;
        if (item.done) item.notifiedAt = item.notifiedAt || Date.now();
        else item.notifiedAt = null;
        write(items); render();
      });
      render();
      var timer = window.setInterval(function(){
        if (!root.isConnected){ window.clearInterval(timer); return; }
        checkDue();
      },30000);
      checkDue();
    }
    return {open:open, all:read};
  })();

  try{var storedLang=H.Store.get('haldo_v156_language','de');if(DICT[storedLang])lang=storedLang;}catch(_){}
  function t(key){return (DICT[lang]&&DICT[lang][key])||DICT.de[key]||key;}
  function langOptions(){return LANGS.map(function(x){return '<option value="'+x.id+'" '+(x.id===lang?'selected':'')+'>'+x.name+'</option>';}).join('');}
  function setLang(value,root,render){
    if(!DICT[value])return;
    lang=value;try{H.Store.set('haldo_v156_language',lang);}catch(_){}
    if(root){root.dir=(LANGS.find(function(x){return x.id===lang;})||LANGS[0]).dir;render();}
  }
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);}
  function notify(message,type){try{H.Toast.show(String(message),2500,type==='success'?'success':type==='error'?'error':'notify');}catch(_){console.info('[HalDo]',message);}}
  function speak(value){
    if(H.AppVoice&&typeof H.AppVoice.speak==='function')H.AppVoice.speak(String(value||''));
    else if(H.VoiceHub&&typeof H.VoiceHub.speak==='function')H.VoiceHub.speak(String(value||''));
    else notify('HalDo Voice ist in diesem Browser nicht verfügbar.','error');
  }
  function openChat(){if(H.Chat&&typeof H.Chat.open==='function')H.Chat.open();else notify('HalDo AI Chat ist nicht verfügbar.','error');}
  function downloadBlob(blob,name){
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name||'haldo-download';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    window.setTimeout(function(){URL.revokeObjectURL(url);},15000);
  }
  function readStore(key,fallback){try{var value=H.Store.get(key,fallback);return value==null?fallback:value;}catch(_){return fallback;}}
  function writeStore(key,value){try{H.Store.set(key,value);return true;}catch(error){notify('Speichern fehlgeschlagen: '+(error.message||error),'error');return false;}}

  H.KontaktePro=(function(){
    var KEY='haldo_v156_contacts',items=[],filter='all',search='',editing=null,selected=null,coachAnswer='';
    var categories=['private','family','work','other'];
    function clean(item){
      if(!item||typeof item!=='object')return null;
      var x={id:String(item.id||uid('contact'))};
      ['first','last','company','email','phone','address','city','country','birth','website','notes'].forEach(function(k){x[k]=String(item[k]||'').slice(0, k==='notes'?2000:300);});
      x.category=categories.indexOf(item.category)>=0?item.category:'other';
      x.favorite=!!item.favorite;x.createdAt=Number(item.createdAt)||Date.now();
      return x;
    }

    function vEsc(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
    function toVCard(c){
      var full=displayName(c),lines=['BEGIN:VCARD','VERSION:3.0','N:'+vEsc(c.last)+';'+vEsc(c.first)+';;;','FN:'+vEsc(full)];
      if(c.company)lines.push('ORG:'+vEsc(c.company));
      if(c.phone)lines.push('TEL;TYPE=CELL:'+vEsc(c.phone));
      if(c.email)lines.push('EMAIL;TYPE=INTERNET:'+vEsc(c.email));
      if(c.address||c.city||c.country)lines.push('ADR;TYPE=HOME:;;'+vEsc(c.address)+';'+vEsc(c.city)+';;;'+vEsc(c.country));
      if(c.birth)lines.push('BDAY:'+c.birth.replace(/-/g,''));

    function unV(value){return String(value||'').replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');}
    function fromVCard(text){
      var unfolded=String(text||'').replace(/\r?\n[ \t]/g,'');
      return unfolded.split(/BEGIN:VCARD/i).slice(1).map(function(block){
        var lines=block.split(/\r?\n/),o={category:'other'};
        lines.forEach(function(line){
          var p=line.indexOf(':');if(p<0)return;
          var key=line.slice(0,p).split(';')[0].toUpperCase(),val=unV(line.slice(p+1));
          if(key==='N'){var n=val.split(';');o.last=n[0]||'';o.first=n[1]||'';}
          if(key==='FN'&&!o.first&&!o.last)o.first=val;
          if(key==='ORG')o.company=val;
          if(key==='TEL')o.phone=val;
          if(key==='EMAIL')o.email=val;
          if(key==='NOTE')o.notes=val;
          if(key==='BDAY'&&/^\d{8}$/.test(val))o.birth=val.slice(0,4)+'-'+val.slice(4,6)+'-'+val.slice(6,8);
          if(key==='ADR'){var a=val.split(';');o.address=a[2]||'';o.city=a[3]||'';o.country=a[6]||'';}
        });
        return clean(o);
      }).filter(function(x){return x&&(x.first||x.last||x.company||x.email||x.phone);});
    }

  H.DokumentePro=(function(){

      });

        if(!db){reject(new Error(t('unsupported')));return;}

        try{request=operation(store);}catch(e){reject(e);return;}
        var result;

      var total=records.reduce(function(n,x){return n+(x.size||0);},0);
      var selected=previewId?records.find(function(x){return x.id===previewId;}):null;
      var html=appHeader('📁','HalDo Dokumente Pro','Dateien · Download · Vorschau · Kategorien · HalDo AI · 10 Sprachen')+
        '<div class="hdp156-stats"><div class="hdp156-stat"><b>'+records.length+'</b><span>'+t('documents')+'</span></div><div class="hdp156-stat"><b>'+records.filter(function(x){return x.favorite;}).length+'</b><span>'+t('favorites')+'</span></div><div class="hdp156-stat"><b>'+formatBytes(total)+'</b><span>'+t('size')+'</span></div></div>'+
        '<div class="hdp156-panel"><label class="hdp156-label">'+t('selectLanguage')+'</label><select class="hdp156-field" data-doc-lang>'+langOptions()+'</select>'+
        '<label class="hdp156-label">'+t('upload')+'</label><input class="hdp156-field" type="file" data-doc-files multiple>'+
        '<div class="hdp156-actions"><button class="hdp156-btn" type="button" data-doc-note>＋ '+t('newNote')+'</button><button class="hdp156-btn" type="button" data-doc-export>'+t('docExport')+'</button></div>'+
        '<div class="hdp156-muted" style="margin-top:7px">'+t('fileLimit')+' '+t('localOnly')+'</div></div>'+
        '<input class="hdp156-field" data-doc-search value="'+esc(search)+'" placeholder="'+t('search')+'">'+
        '<div class="hdp156-tabs"><button class="hdp156-tab '+(filter==='all'?'active':'')+'" data-doc-filter="all">'+t('allFiles')+'</button><button class="hdp156-tab '+(filter==='favorites'?'active':'')+'" data-doc-filter="favorites">★ '+t('favorites')+'</button><button class="hdp156-tab '+(filter===t('images')?'active':'')+'" data-doc-filter="'+esc(t('images'))+'">'+t('images')+'</button><button class="hdp156-tab '+(filter===t('pdf')?'active':'')+'" data-doc-filter="'+esc(t('pdf'))+'">'+t('pdf')+'</button><button class="hdp156-tab '+(filter===t('text')?'active':'')+'" data-doc-filter="'+esc(t('text'))+'">'+t('text')+'</button><button class="hdp156-tab '+(filter===t('otherFiles')?'active':'')+'" data-doc-filter="'+esc(t('otherFiles'))+'">'+t('otherFiles')+'</button></div>'+
        '<div>'+(visible.length?visible.map(function(x){return '<article class="hdp156-row"><div class="hdp156-avatar">'+(x.type&&x.type.indexOf('image/')===0?'🖼️':/pdf/i.test(x.type+' '+x.name)?'📕':/text|json|csv/i.test(x.type+' '+x.name)?'📄':'📦')+'</div><div class="hdp156-row-main"><div class="hdp156-row-title">'+esc(x.name)+(x.favorite?' ★':'')+'</div><div class="hdp156-meta">'+esc(typeLabel(x))+' · '+formatBytes(x.size)+' · '+esc(new Date(x.addedAt).toLocaleDateString((LANGS.find(function(l){return l.id===lang;})||LANGS[0]).locale))+'</div><div class="hdp156-contact-actions"><button class="hdp156-btn" data-doc-preview="'+esc(x.id)+'">'+t('preview')+'</button><button class="hdp156-btn" data-doc-download="'+esc(x.id)+'">'+t('download')+'</button><button class="hdp156-btn" data-doc-fav="'+esc(x.id)+'">'+(x.favorite?'★':'☆')+'</button><button class="hdp156-btn" data-doc-rename="'+esc(x.id)+'">'+t('rename')+'</button><button class="hdp156-btn danger" data-doc-delete="'+esc(x.id)+'">'+t('delete')+'</button></div></div></article>';}).join(''):'<div class="hdp156-empty">'+t('noDocuments')+'</div>')+'</div>'+
        (selected?previewMarkup(selected):'')+
        '<div class="hdp156-ai"><div class="hdp156-ai-title">🦾 '+t('docSummary')+' · HalDo AI</div><p class="hdp156-muted">Die lokale Dokumentenhilfe zählt Dateien und Speicherbedarf. Dateiinhalte werden nicht automatisch an einen KI-Dienst hochgeladen.</p><div class="hdp156-feedback">'+esc(summary())+'</div><div class="hdp156-actions"><button class="hdp156-btn" data-doc-read>🔊 '+t('read')+'</button><button class="hdp156-btn" data-doc-chat>HalDo AI Chat</button></div></div>'+
        '<div class="hdp156-foot">'+t('storageWarning')+' IndexedDB speichert die Originaldateien lokal. Export der Metadaten ist kein vollständiges Dateiarchiv; lade wichtige Originale einzeln herunter.</div>';
      root.innerHTML=html;
    }
    function makeRecord(file,category,description){
      return {id:uid('doc'),name:String(file.name||'haldo-datei').slice(0,180),type:file.type||'application/octet-stream',size:file.size||0,lastModified:file.lastModified||Date.now(),addedAt:new Date().toISOString(),category:category||'Allgemein',description:description||'',favorite:false,blob:file};
    }
    function addFiles(fileList){
      var files=Array.from(fileList||[]);
      if(!files.length)return;
      var chain=Promise.resolve(),added=0,skipped=0;
      files.forEach(function(file){
        chain=chain.then(function(){
          if(file.size>MAX_BYTES){skipped++;return;}
          return put(makeRecord(file,'Allgemein','')).then(function(){added++;});
        });
      });
      chain.then(function(){return refresh();}).then(function(){render();notify(added+' Datei(en) gespeichert.'+(skipped?' '+skipped+' Datei(en) wegen Größenlimit übersprungen.':''),'success');})
        .catch(function(error){notify('Datei konnte nicht gespeichert werden: '+(error.message||error),'error');refresh().then(render);});
    }
    function createNote(){
      var title=window.prompt(t('noteTitle'),'HalDo Notiz');if(title===null)return;
      title=title.trim();if(!title){notify('Bitte einen Titel eingeben.','error');return;}
      var text=window.prompt(t('noteContent'),'');if(text===null)return;
      var file=new File([text],title.toLowerCase().endsWith('.txt')?title:title+'.txt',{type:'text/plain;charset=utf-8',lastModified:Date.now()});
      put(makeRecord(file,'Notiz','Aus HalDo Dokumente Pro erstellt.')).then(function(){return refresh();}).then(function(){render();notify(t('docSaved'),'success');})
        .catch(function(error){notify('Textdokument konnte nicht gespeichert werden: '+(error.message||error),'error');});
    }
    function exportIndex(){
      var rows=[['Name','MIME-Typ','Bytes','Kategorie','Favorit','Hinzugefügt','Beschreibung']];
      records.forEach(function(x){rows.push([x.name,x.type,x.size,x.category,x.favorite?'Ja':'Nein',x.addedAt,x.description]);});
      var csv='\uFEFF'+rows.map(function(row){return row.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
      downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'haldo-dokumente-index.csv');notify(t('docExport'),'success');
    }
    function open(){
      filter='all';search='';previewId=null;root=null;
      var id=uid('haldo-documents');
      H.Win.open('📁 HalDo Dokumente Pro','<div class="hdp156-root" id="'+esc(id)+'"></div>',{w:760,h:850});
      window.setTimeout(function(){
        root=document.getElementById(id);
        if(!root||!root.isConnected)return;
        if(H.AppVoice&&H.AppVoice.attach)H.AppVoice.attach('documents');
        dbOpen().then(function(){return refresh();}).then(render).catch(function(error){
          root.innerHTML=appHeader('📁','HalDo Dokumente Pro','Dokumentenverwaltung')+'<div class="hdp156-panel">'+esc(error.message||t('unsupported'))+'</div><div class="hdp156-foot">'+t('storageWarning')+'</div>';
        });
      },75);
    }
    function bind(){
      if(!root)return;
      root.addEventListener('click',function(e){
        var b=e.target.closest('button');if(!b||!root.contains(b))return;
        if(b.dataset.docFilter){filter=b.dataset.docFilter;render();return;}
        if(b.hasAttribute('data-doc-note')){createNote();return;}
        if(b.hasAttribute('data-doc-export')){exportIndex();return;}
        if(b.hasAttribute('data-doc-read')){speak(summary());return;}
        if(b.hasAttribute('data-doc-chat')){openChat();return;}
        var id=b.dataset.docDownload||b.dataset.docPreview||b.dataset.docFav||b.dataset.docRename||b.dataset.docDelete;
        if(!id)return;
        var record=records.find(function(x){return x.id===id;});if(!record)return;
        if(b.dataset.docDownload){downloadRecord(record);return;}
        if(b.dataset.docPreview){
          revokePreview();previewId=id;
          if(record.blob&&(record.type.indexOf('image/')===0||record.type==='application/pdf'||/\.pdf$/i.test(record.name)))previewUrl=URL.createObjectURL(record.blob);
          else if(record.blob&&(record.type.indexOf('text/')===0||/\.txt$|\.md$|\.csv$|\.json$/i.test(record.name))){
            record.blob.text().then(function(text){previewText=text.slice(0,200000);render();}).catch(function(){previewText='Textvorschau nicht verfügbar.';render();});return;
          }
          render();return;
        }
        if(b.dataset.docFav){record.favorite=!record.favorite;put(record).then(refresh).then(render);return;}
        if(b.dataset.docRename){
          var name=window.prompt(t('rename'),record.name);if(name===null)return;name=name.trim();
          if(!name){notify('Dateiname darf nicht leer sein.','error');return;}
          record.name=name.slice(0,180);put(record).then(refresh).then(render);return;
        }
        if(b.dataset.docDelete){
          if(!window.confirm(t('confirmDelete')))return;
          remove(id).then(refresh).then(function(){if(previewId===id){previewId=null;revokePreview();}render();notify(t('docDeleted'),'success');});
        }
      });
      root.addEventListener('change',function(e){
        if(e.target.matches('[data-doc-lang]')){setLang(e.target.value,root,render);return;}
        if(e.target.matches('[data-doc-files]')){addFiles(e.target.files);e.target.value='';}
      });
      root.addEventListener('input',function(e){
        if(e.target.matches('[data-doc-search]')){search=e.target.value;var p=e.target.selectionStart;render();var q=root.querySelector('[data-doc-search]');if(q){q.focus();try{q.setSelectionRange(p,p);}catch(_){}}}
      });
      var observer=new MutationObserver(function(){if(!root.isConnected){revokePreview();observer.disconnect();}});
      observer.observe(document.body,{childList:true,subtree:true});
    }
    registerVoice('haldo-open-documents',['öffne dokumente','öffne haldo dokumente','starte dokumentenverwaltung'],function(){open();return 'HalDo Dokumente Pro wird geöffnet.';});
    registerVoice('haldo-read-documents',['lies dokumentenübersicht','lies meine dokumente vor'],function(){return summary();});
    return {open:open,summary:summary,version:'156.0.0',download:downloadRecord};
  })();

  /* Registry: bestehende Kontakte-App modernisieren, Dokumente ergänzen. */
  if(H.Registry&&Array.isArray(H.Registry.featured)){
    var contactApp=H.Registry.featured.find(function(x){return x.id==='contacts';});
    if(contactApp)contactApp.n='HalDo Kontakte Pro';
    else H.Registry.featured.push({id:'contacts',n:'HalDo Kontakte Pro',i:'👥'});
    var documentsApp=H.Registry.featured.find(function(x){return x.id==='documents'||x.id==='dokumente';});
    if(documentsApp)documentsApp.n='HalDo Dokumente Pro';
    else H.Registry.featured.push({id:'documents',n:'HalDo Dokumente Pro',i:'📁'});
  }

  /* Zentrales Launch-Routing: v155 und frühere Apps bleiben erhalten. */
  var previousLaunch=H.Launch;
  H.Launch=function(app){
    if(app&&app.id==='contacts')return H.KontaktePro.open();
    if(app&&(app.id==='documents'||app.id==='dokumente'))return H.DokumentePro.open();
    if(typeof previousLaunch==='function')return previousLaunch.apply(this,arguments);
    notify('HalDo App konnte nicht gestartet werden.','error');
  };
  if(H.Master)H.Master.version='156.0.0';
  console.info('🦚 HalDo v156 bereit: HalDo Kontakte Pro + HalDo Dokumente Pro.');
})();
</script>
<!-- ENDE HALDO ZWEIER-PAKET v156 -->
