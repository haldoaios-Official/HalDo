<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000814">
<title>HalDo AI OS Pro Max – by Halil Donma</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'SF Pro Display',system-ui,'Segoe UI',sans-serif;color:#fff;user-select:none}
body{background:#000814;position:relative}

:root{
  --primary:#00e5ff;--secondary:#4da8ff;--accent:#b478ff;
  --bg-glass:rgba(10,20,45,0.55);--border:rgba(0,229,255,0.4);
  --glow:0 0 20px rgba(0,229,255,0.5);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --font-size:14px;
}
body.cyborg{--primary:#ff78c8;--secondary:#b478ff;--accent:#ff78c8;--border:rgba(255,120,200,0.55);--glow:0 0 20px rgba(255,120,200,0.6)}
body.gold{--primary:#ffd700;--secondary:#ffaa00;--accent:#ff8800;--border:rgba(255,215,0,0.55);--glow:0 0 20px rgba(255,215,0,0.6)}
body.matrix{--primary:#00ff88;--secondary:#00cc66;--accent:#00ff44;--border:rgba(0,255,136,0.55);--glow:0 0 20px rgba(0,255,136,0.6)}
body.crimson{--primary:#ff4466;--secondary:#cc2244;--accent:#ff6688;--border:rgba(255,68,102,0.55);--glow:0 0 20px rgba(255,68,102,0.6)}
body.sunset{--primary:#ff9966;--secondary:#ff5577;--accent:#ffcc66;--border:rgba(255,153,102,0.55);--glow:0 0 20px rgba(255,153,102,0.6)}
body.ice{--primary:#aaddff;--secondary:#66bbee;--accent:#cceeff;--border:rgba(170,221,255,0.55);--glow:0 0 20px rgba(170,221,255,0.6)}

#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

#topbar{
  position:fixed;top:0;left:0;right:0;height:calc(56px + var(--safe-top));
  padding-top:var(--safe-top);background:var(--bg-glass);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding-left:12px;padding-right:12px;gap:8px;z-index:500;
  box-shadow:0 4px 24px rgba(0,0,0,0.4);
}
#logo{
  font-size:17px;font-weight:800;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  cursor:pointer;letter-spacing:1px;white-space:nowrap;
}
#topbar .spacer{flex:1}
.tb-btn{
  width:40px;height:40px;min-width:40px;border-radius:12px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:var(--primary);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;z-index:999999;position:relative;
}
.tb-btn:hover{background:rgba(255,255,255,0.15);box-shadow:var(--glow);transform:translateY(-1px)}
.tb-btn:active{transform:scale(0.95)}

#sidebar{
  position:fixed;top:calc(56px + var(--safe-top));left:0;bottom:0;width:68px;
  background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--border);z-index:400;
  display:flex;flex-direction:column;padding:10px 0;gap:6px;overflow-y:auto;
  transition:width 0.25s ease;scrollbar-width:thin;
}
#sidebar.open{width:210px}
.sb-btn{
  height:46px;margin:0 8px;border-radius:12px;
  display:flex;align-items:center;gap:12px;padding:0 12px;
  background:rgba(255,255,255,0.03);border:1px solid transparent;
  color:#fff;font-size:13px;cursor:pointer;transition:all 0.2s;
  flex-shrink:0;overflow:hidden;white-space:nowrap;
}
.sb-btn:hover{background:rgba(255,255,255,0.08);border-color:var(--border);box-shadow:var(--glow)}
.sb-btn .ico{font-size:20px;flex-shrink:0;width:24px;text-align:center}
.sb-btn .lbl{display:none;font-weight:500}
#sidebar.open .sb-btn .lbl{display:inline}

#desktop{position:fixed;inset:calc(56px + var(--safe-top)) 0 70px 68px;z-index:100;pointer-events:none}

.window{
  position:absolute;min-width:320px;min-height:200px;
  background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1.5px solid var(--border);border-radius:18px;
  box-shadow:0 8px 32px rgba(0,0,0,0.6),0 0 40px rgba(0,229,255,0.15);
  display:flex;flex-direction:column;overflow:hidden;
  pointer-events:auto;z-index:200;transition:box-shadow 0.2s;
}
.window.active{z-index:250;box-shadow:0 8px 32px rgba(0,0,0,0.7),0 0 60px rgba(0,229,255,0.35);border-color:var(--primary)}
.win-header{
  height:44px;padding:0 6px 0 14px;
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,0.28);border-bottom:1px solid var(--border);
  cursor:grab;user-select:none;flex-shrink:0;
}
.win-header:active{cursor:grabbing}
.win-title{flex:1;font-size:13px;font-weight:600;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.win-btn{
  width:40px;height:40px;min-width:40px;min-height:40px;
  border-radius:10px;border:none;background:rgba(255,255,255,0.06);
  color:#fff;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:999999 !important;position:relative;
  transition:background 0.15s;
}
.win-btn:hover{background:rgba(255,255,255,0.2)}
.win-btn.close{color:#ff6688}
.win-body{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.65;scrollbar-width:thin}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

#bottombar{
  position:fixed;bottom:0;left:0;right:0;height:calc(58px + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);display:flex;align-items:center;
  justify-content:center;gap:10px;padding-left:8px;padding-right:8px;z-index:500;
  box-shadow:0 -4px 24px rgba(0,0,0,0.4);
}
.bb-btn{
  height:42px;min-width:90px;padding:0 14px;border-radius:12px;
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all 0.2s;z-index:999999;position:relative;
}
.bb-btn:hover{background:rgba(255,255,255,0.15);box-shadow:var(--glow)}
.bb-btn.active{background:var(--primary);color:#000;border-color:var(--primary)}
.bb-btn:active{transform:scale(0.96)}

#toasts{position:fixed;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:90vw}
.toast{
  background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:12px;padding:10px 16px;
  color:#fff;font-size:13px;font-weight:500;box-shadow:var(--glow);
  animation:toastIn 0.3s ease;min-width:200px;max-width:400px;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.out{animation:toastOut 0.3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

#avatarWidget{
  position:fixed;bottom:calc(70px + var(--safe-bottom));right:12px;
  width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(0,229,255,0.4),rgba(180,120,255,0.3));
  border:2px solid var(--primary);box-shadow:0 0 24px var(--primary);
  z-index:450;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:32px;transition:all 0.3s;animation:breathe 3s ease-in-out infinite;
}
#avatarWidget:hover{transform:scale(1.1)}
@keyframes breathe{0%,100%{box-shadow:0 0 24px var(--primary),0 0 0 0 rgba(0,229,255,0.6)}50%{box-shadow:0 0 40px var(--primary),0 0 0 16px rgba(0,229,255,0)}}
#avatarWidget.speaking{animation:pulse 0.6s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.appGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px;padding:4px}
.appTile{
  aspect-ratio:1;border-radius:14px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px;cursor:pointer;transition:all 0.2s;text-align:center;
}
.appTile:hover{background:rgba(255,255,255,0.1);transform:translateY(-2px);box-shadow:var(--glow)}
.appTile .ico{font-size:28px}
.appTile .nm{font-size:10px;font-weight:600;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.cat-header{font-size:16px;font-weight:700;color:var(--primary);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.cat-header:first-child{margin-top:0}

.set-section{margin-bottom:12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:rgba(255,255,255,0.02)}
.set-head{padding:12px 14px;font-weight:700;font-size:13px;color:var(--primary);cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.04)}
.set-head:hover{background:rgba(255,255,255,0.08)}
.set-body{display:none;padding:10px 14px;border-top:1px solid var(--border)}
.set-section.open .set-body{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;gap:8px}
.set-row:last-child{border-bottom:none}
.set-row label{flex:1;color:#dde}
.toggle{position:relative;width:42px;height:24px;flex-shrink:0;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:rgba(255,255,255,0.15);border-radius:12px;transition:0.2s}
.toggle .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:0.2s}
.toggle input:checked + .slider{background:var(--primary);box-shadow:0 0 12px var(--primary)}
.toggle input:checked + .slider:before{transform:translateX(18px)}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid var(--border);font-size:11px;cursor:pointer;transition:all 0.2s}
.chip.active,.chip:hover{background:var(--primary);color:#000;border-color:var(--primary);font-weight:600}

input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;color:#fff;font-size:13px;width:100%;font-family:inherit;
}
input:focus,textarea:focus,select:focus{outline:none;box-shadow:var(--glow)}
button.primary{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#000;border:none;border-radius:10px;padding:10px 18px;
  font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;
}
button.primary:hover{box-shadow:var(--glow);transform:translateY(-1px)}
button.secondary{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  color:#fff;border-radius:10px;padding:10px 18px;
  font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;
}
button.secondary:hover{background:rgba(255,255,255,0.15)}

.chat-msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.chat-msg{padding:10px 14px;border-radius:12px;max-width:85%;font-size:13px;line-height:1.5;word-wrap:break-word}
.chat-msg.user{background:rgba(77,168,255,0.25);align-self:flex-end;border:1px solid rgba(77,168,255,0.4)}
.chat-msg.ai{background:rgba(180,120,255,0.2);align-self:flex-start;border:1px solid rgba(180,120,255,0.4)}
.chat-input{display:flex;gap:6px;margin-top:10px}

.earth-rings{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;pointer-events:none;z-index:5;opacity:0.4;display:none}
body.cosmic-text .earth-rings{display:block}
.ring-txt{position:absolute;inset:0;animation:spin 60s linear infinite;font-family:monospace;font-size:11px;color:var(--primary);text-shadow:0 0 8px var(--primary)}
.ring-txt:nth-child(2){animation-duration:80s;animation-direction:reverse;color:var(--secondary)}
.ring-txt:nth-child(3){animation-duration:100s;color:var(--accent)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

@media(max-width:600px){
  #desktop{inset:calc(56px + var(--safe-top)) 0 70px 0}
  .window{min-width:85vw;max-width:95vw}
  .bb-btn{min-width:75px;padding:0 10px;font-size:12px}
}
</style>
</head>

<script>
/* ============================================================
   HALDO AI OS PRO MAX – CORE ENGINE
   ============================================================ */

const LANG = {
  de:{welcome:"Willkommen bei HalDo AI OS Professionelle – präsentiert von Halil Donma",tag:"Danke, dass du da bist"},
  en:{welcome:"Welcome to HalDo AI OS Professional – presented by Halil Donma",tag:"Thank you for being here"},
  ku:{welcome:"Bi xêr hatî HalDo AI OS Professionelle – pêşkêşkirî ji aliyê Halil Donma",tag:"Sipas ku tu li vir î"},
  ez:{welcome:"Bê xêr hatî HalDo AI OS – ji aliyê Halil Donma ve tê pêşkêşkirin",tag:"Spas ji bo hebûna te"},
  tr:{welcome:"HalDo AI OS Professionelle'ye Hoş Geldiniz – Halil Donma tarafından sunuldu",tag:"Burada olduğun için teşekkürler"},
  ar:{welcome:"مرحبا بك في HalDo AI OS الاحترافي – مقدم من خليل دونما",tag:"شكرا لوجودك"},
  he:{welcome:"ברוך הבא ל-HalDo AI OS המקצועי – מוצג על ידי חליל דונמה",tag:"תודה שאתה כאן"},
  fa:{welcome:"به HalDo AI OS حرفه‌ای خوش آمدید – ارائه شده توسط خلیل دونما",tag:"متشکریم که اینجا هستید"},
  ru:{welcome:"Добро пожаловать в HalDo AI OS Professional – представляет Халил Донма",tag:"Спасибо, что вы здесь"},
  fr:{welcome:"Bienvenue dans HalDo AI OS Professionnel – présenté par Halil Donma",tag:"Merci d'être là"},
  es:{welcome:"Bienvenido a HalDo AI OS Profesional – presentado por Halil Donma",tag:"Gracias por estar aquí"},
  it:{welcome:"Benvenuto in HalDo AI OS Professionale – presentato da Halil Donma",tag:"Grazie per essere qui"},
  zh:{welcome:"欢迎来到 HalDo AI OS 专业版 – 由 Halil Donma 呈现",tag:"感谢您的到来"},
  ja:{welcome:"HalDo AI OS プロフェッショナルへようこそ – Halil Donma プレゼンツ",tag:"ここにいてくれてありがとう"},
  uz:{welcome:"HalDo AI OS Professionalga xush kelibsiz – Halil Donma tomonidan taqdim etilgan",tag:"Bu yerda bo'lganingiz uchun rahmat"}
};
let currentLang = localStorage.getItem('haldo_lang') || 'de';
let currentTheme = localStorage.getItem('haldo_theme') || 'holo';
let soundOn = localStorage.getItem('haldo_sound') !== 'off';
let cosmicTextOn = localStorage.getItem('haldo_cosmic_text') === 'on';

/* ============ SOUND ENGINE ============ */
const Sound = {
  ctx:null,
  init(){ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); },
  tone(freq,dur=0.12,type='sine',vol=0.08,slideTo=null){
    if(!soundOn) return;
    try{
      this.init();
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,this.ctx.currentTime+dur);
      g.gain.setValueAtTime(vol,this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
      o.connect(g).connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime+dur);
    }catch(e){}
  },
  click(){ this.tone(880,0.06,'square',0.05); },
  open(){ this.tone(440,0.1,'sine',0.06,880); },
  close(){ this.tone(660,0.1,'sine',0.06,330); },
  success(){ this.tone(523,0.1,'sine',0.08); setTimeout(()=>this.tone(784,0.15,'sine',0.08),100); },
  error(){ this.tone(220,0.2,'sawtooth',0.08); },
  welcome(){ this.tone(523,0.1,'sine',0.08); setTimeout(()=>this.tone(659,0.1,'sine',0.08),120); setTimeout(()=>this.tone(784,0.2,'sine',0.08),240); },
  notify(){ this.tone(880,0.05,'triangle',0.06); setTimeout(()=>this.tone(1100,0.08,'triangle',0.06),80); }
};

/* ============ COSMIC CANVAS ============ */
const Cosmos = (()=>{
  const cvs = document.getElementById('cosmos');
  const ctx = cvs.getContext('2d');
  let W=0,H=0, cx=0, cy=0;
  const stars = [], planets = [], shooting = [], nebulas = [];
  const PLANET_DEFS = [
    {name:'Merkur', r:3,  dist:0.14, speed:0.9,  color:'#a8a8a8'},
    {name:'Venus',  r:4.5,dist:0.19, speed:0.68, color:'#ffcc88'},
    {name:'Erde',   r:5,  dist:0.24, speed:0.55, color:'#3a88d4', earth:true},
    {name:'Mars',   r:4,  dist:0.30, speed:0.45, color:'#d45030'},
    {name:'Jupiter',r:9,  dist:0.40, speed:0.30, color:'#e0a870', bands:true},
    {name:'Saturn', r:7.5,dist:0.50, speed:0.22, color:'#e8d090', ring:true},
    {name:'Uranus', r:6,  dist:0.60, speed:0.16, color:'#88dddd'},
    {name:'Neptun', r:6,  dist:0.70, speed:0.12, color:'#5588dd'},
    {name:'Pluto',  r:2.5,dist:0.78, speed:0.10, color:'#bb9977'},
    {name:'Eris',   r:2.5,dist:0.85, speed:0.08, color:'#ccbbaa'},
    {name:'Haumea', r:2.5,dist:0.92, speed:0.06, color:'#aaaaaa'},
    {name:'Makemake',r:2.5,dist:0.98,speed:0.05, color:'#ccaazz'}
  ];

  function resize(){
    W = cvs.width = innerWidth;
    H = cvs.height = innerHeight;
    cx = W/2; cy = H/2;
    const base = Math.min(W,H);
    // stars
    stars.length = 0;
    for(let i=0;i<365;i++){
      stars.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.5+0.3,
        phase:Math.random()*Math.PI*2,
        speed:Math.random()*0.5+0.5
      });
    }
    // planets
    planets.length = 0;
    PLANET_DEFS.forEach((d,i)=>{
      planets.push({...d, angle:Math.random()*Math.PI*2, x:0, y:0, mx:0, my:0, moonAngle:0});
    });
    // nebulas
    nebulas.length = 0;
    for(let i=0;i<6;i++){
      nebulas.push({
        x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*300+200,
        color:['rgba(120,80,200,0.10)','rgba(200,100,150,0.08)','rgba(80,150,200,0.10)','rgba(180,120,255,0.07)'][i%4]
      });
    }
  }
  window.addEventListener('resize', resize);

  function drawSun(t){
    const sunR = Math.min(W,H)*0.045;
    // Corona glow
    const g1 = ctx.createRadialGradient(cx,cy,0,cx,cy,sunR*4);
    g1.addColorStop(0,'rgba(255,200,50,0.55)');
    g1.addColorStop(0.3,'rgba(255,140,0,0.25)');
    g1.addColorStop(0.7,'rgba(255,80,0,0.08)');
    g1.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(cx,cy,sunR*4,0,Math.PI*2); ctx.fill();
    // Corona rays
    for(let i=0;i<24;i++){
      const a = (i/24)*Math.PI*2 + t*0.0002;
      const len = sunR*(2+Math.sin(t*0.002+i)*0.8);
      ctx.strokeStyle = `rgba(255,180,40,${0.2+Math.sin(t*0.003+i)*0.15})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*sunR, cy+Math.sin(a)*sunR);
      ctx.lineTo(cx+Math.cos(a)*len, cy+Math.sin(a)*len);
      ctx.stroke();
    }
    // Sun body
    const g2 = ctx.createRadialGradient(cx-sunR*0.3,cy-sunR*0.3,0,cx,cy,sunR);
    g2.addColorStop(0,'#fff8cc');
    g2.addColorStop(0.5,'#ffcc44');
    g2.addColorStop(1,'#ff8800');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(cx,cy,sunR,0,Math.PI*2); ctx.fill();
    // Pulsing corona waves
    ctx.strokeStyle = 'rgba(255,200,80,0.4)';
    for(let k=0;k<3;k++){
      const rr = sunR*(1.3+k*0.4 + Math.sin(t*0.003+k)*0.1);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.stroke();
    }
  }

  function drawPlanets(t){
    const base = Math.min(W,H);
    // Orbit rings
    planets.forEach(p=>{
      const dist = base*p.dist;
      ctx.strokeStyle = 'rgba(0,229,255,0.06)';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.arc(cx,cy,dist,0,Math.PI*2); ctx.stroke();
    });
    planets.forEach(p=>{
      p.angle += 0.0004 * p.speed * 60;
      const dist = base*p.dist;
      p.x = cx + Math.cos(p.angle)*dist;
      p.y = cy + Math.sin(p.angle)*dist*0.55; // elliptical perspective
      // Planet glow
      const grd = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      grd.addColorStop(0,p.color+'cc');
      grd.addColorStop(1,p.color+'00');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2); ctx.fill();
      // Body
      const bg = ctx.createRadialGradient(p.x-p.r*0.4,p.y-p.r*0.4,0,p.x,p.y,p.r);
      bg.addColorStop(0,'#ffffff');
      bg.addColorStop(0.4,p.color);
      bg.addColorStop(1,'#333');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      // Earth clouds + moon
      if(p.earth){
        ctx.strokeStyle='rgba(255,255,255,0.7)';
        ctx.lineWidth=0.8;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.9,0.5,2.5); ctx.stroke();
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.7,3.5,5.5); ctx.stroke();
        // Moon
        p.moonAngle += 0.02;
        const mx = p.x + Math.cos(p.moonAngle)*(p.r*3);
        const my = p.y + Math.sin(p.moonAngle)*(p.r*2);
        ctx.fillStyle='#cccccc';
        ctx.beginPath(); ctx.arc(mx,my,1.8,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(200,200,200,0.3)';
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2); ctx.stroke();
      }
      // Saturn ring
      if(p.ring){
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(0.4);
        ctx.strokeStyle='rgba(232,208,144,0.7)';
        ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.ellipse(0,0,p.r*2.2,p.r*0.6,0,0,Math.PI*2);
        ctx.stroke();
        ctx.restore();
      }
    });
  }

  function drawStars(t){
    stars.forEach(s=>{
      const tw = 0.4 + Math.sin(t*0.001*s.speed + s.phase)*0.6;
      ctx.fillStyle = `rgba(255,255,255,${tw})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      if(s.r>1.2){
        ctx.strokeStyle = `rgba(200,220,255,${tw*0.5})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(s.x-s.r*2,s.y); ctx.lineTo(s.x+s.r*2,s.y);
        ctx.moveTo(s.x,s.y-s.r*2); ctx.lineTo(s.x,s.y+s.r*2);
        ctx.stroke();
      }
    });
  }

  function drawNebulas(){
    nebulas.forEach(n=>{
      const g = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      g.addColorStop(0,n.color);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
    });
  }

  function drawShooting(t){
    if(Math.random()<0.004 && shooting.length<4){
      shooting.push({
        x: Math.random()*W, y: -20,
        vx: -3 - Math.random()*3, vy: 4 + Math.random()*3,
        life: 1
      });
    }
    for(let i=shooting.length-1;i>=0;i--){
      const s = shooting[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.008;
      if(s.life<=0 || s.y>H+50){ shooting.splice(i,1); continue; }
      const grad = ctx.createLinearGradient(s.x,s.y,s.x-s.vx*15,s.y-s.vy*15);
      grad.addColorStop(0,`rgba(255,255,255,${s.life})`);
      grad.addColorStop(1,'rgba(0,229,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x,s.y);
      ctx.lineTo(s.x-s.vx*15,s.y-s.vy*15);
      ctx.stroke();
    }
  }

  let last = 0;
  function loop(t){
    if(t-last < 16) { requestAnimationFrame(loop); return; }
    last = t;
    // Background gradient
    const bg = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H));
    bg.addColorStop(0,'#0a0a1a');
    bg.addColorStop(0.5,'#050510');
    bg.addColorStop(1,'#000005');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);
    drawNebulas();
    drawStars(t);
    drawSun(t);
    drawPlanets(t);
    drawShooting(t);
    requestAnimationFrame(loop);
  }
  resize();
  requestAnimationFrame(loop);
  return {resize};
})();

/* ============ THEMES ============ */
const THEMES = ['holo','cyborg','gold','matrix','crimson','sunset','ice'];
function applyTheme(t){
  document.body.classList.remove(...THEMES.filter(x=>x!=='holo'));
  if(t!=='holo') document.body.classList.add(t);
  currentTheme = t;
  localStorage.setItem('haldo_theme', t);
  document.getElementById('cyborgBtn').classList.toggle('active', t==='cyborg');
}
function cycleTheme(){
  const idx = THEMES.indexOf(currentTheme);
  const next = THEMES[(idx+1)%THEMES.length];
  applyTheme(next);
  Sound.click();
  toast('🎨 Theme: '+next.toUpperCase());
}
function toggleCyborg(){
  applyTheme(currentTheme==='cyborg'?'holo':'cyborg');
  Sound.success();
  toast(currentTheme==='cyborg'?'⚡ CYBORG-Modus AN':'🤖 Holo-Modus AN');
}
applyTheme(currentTheme);

  document.getElementById('sidebar').classList.toggle('open');

}

/* ============ TOASTS ============ */
function toast(msg, dur=2800){
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = msg;
  c.appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),300); }, dur);
}

/* ============ WINDOW MANAGER ============ */
let winZ = 250;
const openWindows = new Map();
function openWin(id, title, content, opts={}){
  if(openWindows.has(id)){
    const w = openWindows.get(id).el;
    w.style.zIndex = ++winZ;
    w.classList.add('active');
    return openWindows.get(id);
  }
  const w = document.createElement('div');
  w.className = 'window';
  const width = opts.width || Math.min(720, innerWidth-100);
  const height = opts.height || Math.min(560, innerHeight-160);
  const left = opts.left ?? (Math.max(20, (innerWidth-width)/2 + Math.random()*60-30));
  const top = opts.top ?? (Math.max(70, (innerHeight-height)/2 + Math.random()*40-20));
  w.style.cssText = `width:${width}px;height:${height}px;left:${left}px;top:${top}px;z-index:${++winZ}`;
  w.innerHTML = `
    <div class="win-header">
      <div class="win-title">${title}</div>
      <button class="win-btn" data-min title="Minimieren">─</button>
      <button class="win-btn close" data-close title="Schließen">✕</button>
    </div>
    <div class="win-body">${content}</div>
  `;
  document.getElementById('desktop').appendChild(w);
  // Focus
  const focus = ()=>{ w.style.zIndex = ++winZ; document.querySelectorAll('.window').forEach(x=>x.classList.remove('active')); w.classList.add('active'); };
  w.addEventListener('pointerdown', focus);
  focus();
  // Drag
  const header = w.querySelector('.win-header');
  let dx=0,dy=0,dragging=false;
  header.addEventListener('pointerdown', e=>{
    if(e.target.closest('.win-btn')) return;
    dragging = true;
    dx = e.clientX - w.offsetLeft;
    dy = e.clientY - w.offsetTop;
    header.setPointerCapture(e.pointerId);
  });
  header.addEventListener('pointermove', e=>{
    if(!dragging) return;
    let x = e.clientX - dx, y = e.clientY - dy;
    x = Math.max(-w.offsetWidth+80, Math.min(innerWidth-80, x));
    y = Math.max(56, Math.min(innerHeight-60, y));
    w.style.left = x+'px';
    w.style.top = y+'px';
  });
  header.addEventListener('pointerup', ()=>{ dragging=false; });
  // Buttons
  w.querySelector('[data-close]').onclick = ()=>{ closeWin(id); };
  w.querySelector('[data-min]').onclick = ()=>{ w.style.display='none'; toast('Fenster minimiert'); };
  Sound.open();
  const obj = {el:w, id, title};
  openWindows.set(id, obj);
  return obj;
}
function closeWin(id){
  const w = openWindows.get(id);
  if(w){ w.el.remove(); openWindows.delete(id); Sound.close(); }
}

function openLauncher(){
  let html = '<input type="text" id="appSearch" placeholder="🔍 App suchen..." style="margin-bottom:12px">';

  Object.keys(APPS).forEach(k=>{

    html += `<div class="cat-header" data-cat="${k}">${cat.icon} ${k} – ${cat.name}</div>`;
    html += '<div class="appGrid">';
    cat.apps.forEach(a=>{
      html += `<div class="appTile" data-app="${a.name}" data-appid="${a.id}" data-fn="${a.fn?'1':''}">
        <div class="ico">${a.ico}</div><div class="nm">${a.name}</div>
      </div>`;
    });
    html += '</div>';
  });
  html += '</div>';
  const win = openWin('launcher', '📱 HalDo App Launcher – 375+ Apps A–Z', html, {width:800, height:600});
  const body = win.el.querySelector('.win-body');
  body.querySelectorAll('.appTile').forEach(t=>{
    t.onclick = ()=>{
      const appid = t.dataset.appid;
      const name = t.dataset.app;
      const cat = Object.values(APPS).find(c=>c.apps.find(a=>a.id===appid));
      const appDef = cat.apps.find(a=>a.id===appid);
      Sound.click();
      if(appDef.fn){ appDef.fn(); }
      else{ openAppStub(name, appid); }
    };
  });
  body.querySelector('#appSearch').addEventListener('input', e=>{
    const q = e.target.value.toLowerCase();
    body.querySelectorAll('.appTile').forEach(t=>{
      const nm = t.dataset.app.toLowerCase();
      t.style.display = nm.includes(q)?'flex':'none';
    });
  });
}

/* ============ CALENDAR ============ */
function openCalendar(){
  const now = new Date();
  const month = now.getMonth(), year = now.getFullYear();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstDay = new Date(year, month, 1).getDay();
  const monthName = now.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  let days = '';
  for(let i=0;i<(firstDay===0?6:firstDay-1);i++) days += '<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const isToday = d===now.getDate();
    days += `<div style="padding:8px 4px;text-align:center;border-radius:8px;${isToday?'background:var(--primary);color:#000;font-weight:700':'background:rgba(255,255,255,0.04)'}">${d}</div>`;
  }
  openWin('calendar', '📅 HalDo Calendar', `
    <h3 style="color:var(--primary);text-align:center;margin-bottom:12px">${monthName}</h3>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px">
      <div style="text-align:center;opacity:0.6">Mo</div><div style="text-align:center;opacity:0.6">Di</div>
      <div style="text-align:center;opacity:0.6">Mi</div><div style="text-align:center;opacity:0.6">Do</div>
      <div style="text-align:center;opacity:0.6">Fr</div><div style="text-align:center;opacity:0.6">Sa</div>
      <div style="text-align:center;opacity:0.6">So</div>
      ${days}
    </div>
  `, {width:420, height:520});
}

async function openWeather(){
  const content = `
    <div style="text-align:center;padding:20px">
      <div style="margin-bottom:12px"><input type="text" id="wCity" placeholder="Stadt eingeben (z.B. Berlin)" value="Berlin" style="max-width:280px;margin:0 auto"></div>
      <button class="primary" onclick="fetchWeather()">🌤️ Wetter abrufen</button>
      <div id="wResult" style="margin-top:20px"></div>
    </div>
  `;
  openWin('weather', '🌤️ HalDo Weather LIVE', content, {width:520, height:500});
  window.fetchWeather = async ()=>{
    const city = document.getElementById('wCity').value.trim();
    const res = document.getElementById('wResult');
    res.innerHTML = '<p style="opacity:0.6">Lade Wetterdaten...</p>';
    try{
      const geo = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=de');
      const gdata = await geo.json();
      if(!gdata.results || !gdata.results.length){ res.innerHTML = '<p style="color:#ff6688">Stadt nicht gefunden</p>'; return; }
      const loc = gdata.results[0];
      const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
      const wd = await w.json();
      const c = wd.current;
      const codes = {0:'☀️ Klar',1:'🌤️ Meist klar',2:'⛅ Teils wolkig',3:'☁️ Wolkig',45:'🌫️ Nebel',48:'🌫️ Nebel',51:'🌦️ Niesel',61:'🌧️ Regen',63:'🌧️ Regen',65:'⛈️ Starkregen',71:'🌨️ Schnee',73:'🌨️ Schnee',75:'❄️ Stark',80:'🌦️ Schauer',81:'🌧️ Schauer',82:'⛈️ Schauer',95:'⛈️ Gewitter',96:'⛈️ Hagel',99:'⛈️ Hagel'};
      res.innerHTML = `
        <div style="padding:16px;background:rgba(255,255,255,0.05);border-radius:14px;border:1px solid var(--border)">
          <div style="font-size:16px;font-weight:700">${loc.name}, ${loc.country||''}</div>
          <div style="font-size:44px;font-weight:800;color:var(--primary);margin:8px 0">${c.temperature_2m}°C</div>
          <div style="font-size:14px">${codes[c.weather_code]||c.weather_code}</div>
          <div style="display:flex;justify-content:space-around;margin-top:12px;font-size:12px;opacity:0.85">
            <div>💨 ${c.wind_speed_10m} km/h</div>
            <div>💧 ${c.relative_humidity_2m}%</div>
            <div>🌡️ ${wd.daily.temperature_2m_min[0]}–${wd.daily.temperature_2m_max[0]}°C</div>
          </div>
        </div>
      `;
      Sound.notify();
    }catch(e){ res.innerHTML = '<p style="color:#ff6688">Fehler: '+e.message+'</p>'; }
  };
  fetchWeather();
}

      </div>
    </div>
  `, {width:340, height:320});

let timerInterval=null, timerEnd=0;
window.startTimer = function(){
  const m = parseInt(document.getElementById('tMin').value)||0;
  timerEnd = Date.now() + m*60000;
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const rem = Math.max(0, timerEnd-Date.now());
    const mm = Math.floor(rem/60000), ss = Math.floor((rem%60000)/1000);
    const d = document.getElementById('timerDisp');
    if(d) d.textContent = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
    if(rem<=0){ clearInterval(timerInterval); Sound.success(); toast('⏰ Timer abgelaufen!'); }
  }, 250);
  Sound.click();
};
window.stopTimer = function(){ clearInterval(timerInterval); Sound.click(); };

/* ============ CHAT ============ */
function openChat(){
  const html = `
    <div id="chatMsgs" class="chat-msgs">
      <div class="chat-msg ai">👋 Hallo! Ich bin <b>HalDo AI</b> – dein lebendiger KI-Assistent. Sag mir "Hallo HalDo", "Hi HalDo" oder stelle mir eine Frage.</div>
    </div>
    <div class="chat-input">
      <input type="text" id="chatIn" placeholder="Nachricht schreiben..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="primary" onclick="sendChat()">Senden</button>
      <button class="secondary" onclick="startVoice()" title="Sprache">🎤</button>
    </div>
  `;
  openWin('chat', '💬 HalDo AI Chat', html, {width:520, height:520});
}
window.sendChat = function(){
  const inp = document.getElementById('chatIn');
  const txt = inp.value.trim();
  if(!txt) return;
  const msgs = document.getElementById('chatMsgs');
  msgs.innerHTML += `<div class="chat-msg user">${txt}</div>`;
  inp.value = '';
  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(()=>{
    const reply = aiReply(txt);
    msgs.innerHTML += `<div class="chat-msg ai">${reply}</div>`;
    msgs.scrollTop = msgs.scrollHeight;
    speak(reply.replace(/<[^>]+>/g,''));
    Sound.notify();
  }, 400);
};
function aiReply(txt){
  const t = txt.toLowerCase().trim();
  const greets = ['hi haldo','hey haldo','hallo haldo','haldo','hi','hallo','hey'];
  if(greets.some(g=>t===g||t.startsWith(g+' '))){
    return `👋 Hallo! Ich bin <b>HalDo AI</b> – die intelligente Seele von HalDo AI OS. Wie kann ich dir helfen, Bruder?`;
  }
  if(t.includes('wie geht') || t.includes('wie gehts')){
    return 'Mir geht es wunderbar! 🚀 Ich bin bereit, dir zu helfen. Und dir?';
  }
  if(t.includes('wer bist du') || t.includes('dein name')){
    return 'Ich bin <b>HalDo AI</b>, dein persönlicher Assistent, erschaffen von <b>Halil Donma</b>. Ich bin Teil des HalDo AI OS Professional.';
  }
  if(t.includes('zeit') || t.includes('uhr')){
    return `🕐 Es ist ${new Date().toLocaleTimeString('de-DE')} Uhr.`;
  }
  if(t.includes('datum')){
    return `📅 Heute ist ${new Date().toLocaleDateString('de-DE',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}.`;
  }
  if(t.includes('wetter')){
    return '🌤️ Öffne die Wetter-App für Live-Daten! Klick in der Seitenleiste auf „Wetter".';
  }
  if(t.includes('danke')){
    return 'Gern geschehen, Bruder! 💙 Immer für dich da.';
  }
  return `🤖 Interessant! Ich verstehe deine Nachricht: "${txt.slice(0,80)}". In der vollständigen Version kann ich dir viel mehr helfen. Für jetzt: probier mal "Wie geht's?", "Wer bist du?" oder "Wie ist die Zeit?"`;
}
window.startVoice = function(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    toast('Spracherkennung nicht verfügbar'); return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'de-DE';
  rec.onresult = e=>{ document.getElementById('chatIn').value = e.results[0][0].transcript; sendChat(); };
  rec.start();
  Sound.click();
};
function speak(txt){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'de-DE';
  u.rate = 1;
  const av = document.getElementById('avatarWidget');
  av.classList.add('speaking');
  speechSynthesis.speak(u);
  u.onend = ()=>av.classList.remove('speaking');
}
