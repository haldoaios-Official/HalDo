<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05080f">
<title>HalDo AI OS Pro Max</title>
<style>
:root{
  --primary:#00e5ff;--secondary:#4da8ff;--accent:#b478ff;
  --glow:rgba(0,229,255,.5);
  --bg1:#05080f;--bg2:#0a1220;
  --glass:rgba(10,25,45,.55);--glass-strong:rgba(10,25,45,.9);
  --border:rgba(0,229,255,.4);--gold:#ffd700;
  --text:#e8f4ff;--muted:#8fb3d9;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(ellipse at 50% 30%,var(--bg2) 0%,var(--bg1) 70%);
  color:var(--text);padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;font-size:14px}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;opacity:.5}
::-webkit-scrollbar-track{background:transparent}

/* ══════════ COSMOS ══════════ */
#cosmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
#sun{
  position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;
  border-radius:50%;
  background:radial-gradient(circle,#fff7cc 0%,#ffcc44 30%,#ff8800 60%,transparent 78%);
  box-shadow:0 0 90px 30px rgba(255,180,0,.5),0 0 180px 70px rgba(255,100,0,.25);
  animation:sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse{
  0%,100%{box-shadow:0 0 90px 30px rgba(255,180,0,.5),0 0 180px 70px rgba(255,100,0,.25)}
  50%{box-shadow:0 0 130px 50px rgba(255,180,0,.7),0 0 250px 110px rgba(255,100,0,.35)}
}
.orbit{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(0,229,255,.08);transform:translate(-50%,-50%);pointer-events:none}
.planet{
  position:absolute;left:50%;top:50%;border-radius:50%;
  animation:orbit linear infinite;
  box-shadow:0 0 12px 3px var(--pglow,rgba(0,229,255,.4));
}
@keyframes orbit{
  from{transform:translate(-50%,-50%) rotate(0) translateX(var(--r)) rotate(0)}
  to{transform:translate(-50%,-50%) rotate(360deg) translateX(var(--r)) rotate(-360deg)}
}

/* ══════════ TOP BAR ══════════ */
#topbar{
  position:fixed;top:var(--safe-t);left:0;right:0;height:58px;z-index:150;
  display:flex;align-items:center;padding:0 14px;gap:10px;
  background:linear-gradient(180deg,rgba(5,12,22,.95),rgba(5,12,22,.5));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1.5px solid var(--border);
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#topbar .logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;flex-shrink:0;
  box-shadow:0 0 20px var(--glow),0 0 40px rgba(180,120,255,.3);
  transition:transform .2s;position:relative;overflow:hidden;
}
#topbar .logo:active{transform:scale(.94)}
#topbar .logo img{width:100%;height:100%;object-fit:cover}
#topbar .title{font-size:15px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#topbar .subtitle{font-size:10px;color:var(--muted);margin-top:1px}
#topbar .spacer{flex:1}
.icon-btn{
  min-width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,229,255,.08);border:1.5px solid var(--border);
  font-size:18px;transition:all .2s;
}
.icon-btn:active{background:rgba(0,229,255,.2);transform:scale(.94)}

/* ══════════ SIDEBAR ══════════ */
#sidebar{
  position:fixed;top:calc(var(--safe-t) + 58px);left:0;bottom:calc(var(--safe-b) + 62px);
  width:82px;z-index:140;padding:14px 6px;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(180deg,rgba(10,25,45,.85),rgba(5,12,22,.9));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1.5px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
  transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:6px 0 24px rgba(0,0,0,.4);
}
#sidebar.hidden{transform:translateX(-100%)}
.nav-btn{
  width:70px;height:64px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(0,229,255,.05);border:1.5px solid rgba(0,229,255,.18);
  font-size:22px;transition:all .2s;flex-shrink:0;
}
.nav-btn:active{background:rgba(0,229,255,.25);transform:scale(.95)}
.nav-btn.active{background:rgba(0,229,255,.2);border-color:var(--primary);box-shadow:0 0 16px var(--glow)}
.nav-btn .lbl{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.nav-btn.active .lbl{color:var(--primary)}

/* ══════════ WINDOW AREA ══════════ */
#winLayer{position:fixed;inset:0;z-index:200;pointer-events:none;padding-top:calc(var(--safe-t) + 58px);padding-left:82px}
.win{
  position:absolute;pointer-events:auto;
  min-width:320px;min-height:220px;
  max-width:calc(100vw - 100px);max-height:calc(100vh - 130px);
  background:linear-gradient(160deg,rgba(10,25,45,.92),rgba(8,18,35,.96));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1.5px solid var(--border);border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px var(--glow);
  display:flex;flex-direction:column;overflow:hidden;
  z-index:200;transition:box-shadow .2s;
}
.win.active{z-index:250;box-shadow:0 25px 80px rgba(0,0,0,.8),0 0 60px var(--glow)}
.win-head{
  height:48px;display:flex;align-items:center;padding:0 10px 0 16px;gap:8px;
  background:linear-gradient(180deg,rgba(0,229,255,.12),rgba(0,229,255,.03));
  border-bottom:1.5px solid var(--border);flex-shrink:0;
  cursor:grab;
}
.win-head:active{cursor:grabbing}
.win-head .wtitle{flex:1;font-size:13px;font-weight:700;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;padding:0 100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-btn{
  min-width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;background:rgba(0,229,255,.1);border:1.5px solid var(--border);
  position:relative;z-index:999999;
}
.win-btn.close:hover,.win-btn.close:active{background:rgba(255,80,80,.4);border-color:#ff5050}
.win-body{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.6}

/* ══════════ BOTTOM BAR ══════════ */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;height:62px;z-index:150;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 12px var(--safe-b);padding-bottom:calc(var(--safe-b) + 8px);
  background:linear-gradient(0deg,rgba(5,12,22,.95),rgba(5,12,22,.5));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1.5px solid var(--border);
}
.bb-btn{
  height:44px;padding:0 16px;border-radius:14px;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.1));
  border:1.5px solid var(--border);
  font-size:14px;font-weight:600;
  box-shadow:0 4px 16px rgba(0,229,255,.2);
  transition:all .2s;
}
.bb-btn:active{transform:scale(.95);background:linear-gradient(135deg,rgba(0,229,255,.35),rgba(180,120,255,.25))}
.bb-btn.pink{border-color:rgba(255,120,200,.5);background:linear-gradient(135deg,rgba(255,120,200,.2),rgba(180,120,255,.15))}

/* ══════════ TOASTS ══════════ */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 100px);z-index:1000;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100vw - 40px);max-width:380px;
}
.toast{
  background:linear-gradient(135deg,rgba(0,229,255,.9),rgba(180,120,255,.9));
  color:#001;padding:12px 20px;border-radius:14px;
  font-size:13px;font-weight:700;text-align:center;
  box-shadow:0 8px 32px rgba(0,229,255,.5);
  animation:toastIn .3s ease-out;max-width:100%;
  border:1.5px solid rgba(255,255,255,.3);
}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.out{animation:toastOut .3s ease-in forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

/* ══════════ WELCOME BANNER ══════════ */
#welcomeBanner{
  position:fixed;top:calc(var(--safe-t) + 70px);left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:1100;padding:14px 24px;border-radius:16px;
  background:linear-gradient(135deg,rgba(0,229,255,.95),rgba(180,120,255,.95));
  color:#001;font-size:14px;font-weight:800;text-align:center;
  box-shadow:0 12px 40px rgba(0,229,255,.6),0 0 60px rgba(180,120,255,.4);
  border:2px solid var(--gold);opacity:0;pointer-events:none;
  transition:all .4s cubic-bezier(.2,.9,.3,1);
  max-width:calc(100vw - 40px);
}
#welcomeBanner.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════ MODAL ══════════ */
#modalLayer{
  position:fixed;inset:0;z-index:1100;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
}
#modalLayer.show{display:flex}
.modal{
  background:linear-gradient(160deg,rgba(10,25,45,.98),rgba(8,18,35,.99));
  border:1.5px solid var(--border);border-radius:18px;
  max-width:460px;width:100%;max-height:80vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 60px var(--glow);
  padding:22px;
}
.modal h2{margin-bottom:14px;font-size:18px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ══════════ UTILS ══════════ */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{padding:10px 16px;border-radius:12px;background:rgba(0,229,255,.12);
  border:1.5px solid var(--border);font-weight:600;font-size:13px;
  transition:all .2s;min-height:40px}
.btn:active{background:rgba(0,229,255,.3);transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#001;border:none;box-shadow:0 4px 16px var(--glow)}
.btn.danger{background:rgba(255,80,80,.2);border-color:rgba(255,80,80,.5)}
.inp{width:100%;padding:10px 14px;border-radius:12px;
  background:rgba(0,229,255,.08);border:1.5px solid rgba(0,229,255,.3);
  font-size:14px;outline:none;transition:all .2s;margin-bottom:10px}
.inp:focus{border-color:var(--primary);box-shadow:0 0 12px var(--glow)}
.card{background:rgba(0,229,255,.06);border:1.5px solid rgba(0,229,255,.2);
  border-radius:14px;padding:14px;margin-bottom:10px}
.card:hover{border-color:var(--primary);box-shadow:0 0 16px var(--glow)}
.list-item{padding:12px 14px;border-radius:12px;background:rgba(0,229,255,.06);
  border:1.5px solid rgba(0,229,255,.15);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
.grad-text{background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}

/* App Grid */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-top:10px}
.app-tile{
  aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.1));
  border:1.5px solid rgba(0,229,255,.3);font-size:22px;
  transition:all .2s;cursor:pointer;padding:6px;
}
.app-tile:active{transform:scale(.92);background:linear-gradient(135deg,rgba(0,229,255,.4),rgba(180,120,255,.3))}
.app-tile .app-name{font-size:9px;font-weight:600;text-align:center;color:var(--muted);line-height:1.2;overflow:hidden}

/* Avatar */
.avatar-stage{display:flex;flex-direction:column;align-items:center;padding:20px 0}
.avatar-face{width:160px;height:160px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 40%,rgba(0,229,255,.3),rgba(0,50,100,.6));
  border:2px solid var(--primary);box-shadow:0 0 60px var(--glow),inset 0 0 40px rgba(0,229,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:70px}
.avatar-face.speaking{animation:speakPulse 1s ease-in-out infinite}
@keyframes speakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.avatar-ring{position:absolute;inset:-20px;border-radius:50%;border:2px dashed var(--primary);
  animation:spin 8s linear infinite;opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}

/* Settings */
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(0,229,255,.15)}
.settings-row .lbl{font-size:14px}
.theme-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.theme-chip{padding:8px 14px;border-radius:12px;font-size:12px;font-weight:600;
  border:2px solid transparent;transition:all .2s}
.theme-chip.active{border-color:var(--gold);box-shadow:0 0 12px var(--gold)}
@media (max-width:480px){
  #sidebar{width:70px;padding:10px 4px}
  .nav-btn{width:58px;height:56px;font-size:18px}
  .nav-btn .lbl{font-size:8px}
  #winLayer{padding-left:70px}
}
</style>
</head>
<body>

<!-- COSMOS -->
<div id="cosmos">
  <div id="sun"></div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo" id="logoBtn">🦚</div>
  <div>
    <div class="title">HalDo AI OS</div>
    <div class="subtitle">Pro Max v123</div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="HalDo.registry.open()">🔎</button>
  <button class="icon-btn" onclick="HalDo.apps.settings.open()">⚙️</button>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <button class="nav-btn" data-nav="home" onclick="HalDo.nav('home')"><span>🏠</span><span class="lbl">Home</span></button>
  <button class="nav-btn" data-nav="apps" onclick="HalDo.nav('apps')"><span>📱</span><span class="lbl">Apps</span></button>
  <button class="nav-btn" data-nav="system" onclick="HalDo.nav('system')"><span>⚙️</span><span class="lbl">System</span></button>
  <button class="nav-btn" data-nav="chat" onclick="HalDo.nav('chat')"><span>💬</span><span class="lbl">Chat</span></button>
  <button class="nav-btn" data-nav="files" onclick="HalDo.nav('files')"><span>📁</span><span class="lbl">Files</span></button>
  <button class="nav-btn" data-nav="setup" onclick="HalDo.nav('setup')"><span>🔧</span><span class="lbl">Setup</span></button>
  <button class="nav-btn" data-nav="info" onclick="HalDo.nav('info')"><span>ℹ️</span><span class="lbl">Info</span></button>
  <button class="nav-btn" data-nav="ai" onclick="HalDo.apps.avatar.open()"><span>🤖</span><span class="lbl">AI</span></button>
  <button class="nav-btn" data-nav="cyborg" onclick="HalDo.apps.settings.open('cyborg')"><span>⚡</span><span class="lbl">CYBORG</span></button>
</div>

<!-- WINDOWS -->
<div id="winLayer"></div>

<!-- BOTTOM BAR -->
<div id="bottombar">
  <button class="bb-btn" onclick="HalDo.apps.aiChat.open()">💬 Chat</button>
  <button class="bb-btn" onclick="HalDo.apps.avatar.open()">🤖 AI</button>
  <button class="bb-btn pink" onclick="HalDo.theme.toggleCyborg()">⚡ CYBORG</button>
</div>

<!-- TOASTS -->
<div id="toasts"></div>

<!-- WELCOME -->
<div id="welcomeBanner"></div>

<!-- MODAL -->
<div id="modalLayer" onclick="if(event.target===this)HalDo.closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   H A L D O   A I   O S   —   C O R E   v 1 2 3
   ═══════════════════════════════════════════════════════════ */

window.HalDo = window.HalDo || {};

/* ───────── STORAGE ───────── */
HalDo.store = {
  get(k, d) { try { const v = localStorage.getItem('haldo_' + k + '_v1'); return v == null ? d : JSON.parse(v); } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem('haldo_' + k + '_v1', JSON.stringify(v)); } catch(e){} },
  del(k) { localStorage.removeItem('haldo_' + k + '_v1'); }
};

/* ───────── THEME ───────── */
HalDo.theme = {
  current: 'holo',
  presets: {
    holo:    { primary:'#00e5ff', secondary:'#4da8ff', accent:'#b478ff', name:'Holo',    emoji:'💠' },
    cyborg:  { primary:'#ff78c8', secondary:'#b478ff', accent:'#ff4488', name:'Cyborg',  emoji:'⚡' },
    gold:    { primary:'#ffd700', secondary:'#ffb000', accent:'#ff8c00', name:'Gold',    emoji:'👑' },
    matrix:  { primary:'#00ff88', secondary:'#00cc66', accent:'#88ff00', name:'Matrix',  emoji:'🟢' },
    crimson: { primary:'#ff5555', secondary:'#ff7788', accent:'#ff0088', name:'Crimson', emoji:'🔴' },
    sunset:  { primary:'#ff8800', secondary:'#ffaa44', accent:'#ffcc00', name:'Sunset',  emoji:'🌅' }
  },
  apply(name) {
    const p = this.presets[name] || this.presets.holo;
    const r = document.documentElement.style;
    r.setProperty('--primary', p.primary);
    r.setProperty('--secondary', p.secondary);
    r.setProperty('--accent', p.accent);
    r.setProperty('--glow', p.primary + '88');
    r.setProperty('--border', p.primary + '66');
    this.current = name;
    HalDo.store.set('theme', name);
    document.querySelectorAll('.theme-chip').forEach(c => c.classList.toggle('active', c.dataset.t === name));
  },
  toggleCyborg() {
    this.apply(this.current === 'cyborg' ? 'holo' : 'cyborg');
    HalDo.toast(this.current === 'cyborg' ? '⚡ CYBORG MODE' : '💠 Holo Mode');
  },
  init() { this.apply(HalDo.store.get('theme', 'holo')); }
};

/* ───────── TOAST ───────── */
HalDo.toast = function(msg, ms) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, ms || 2400);
};

/* ───────── WELCOME ───────── */
HalDo.welcome = function(appName) {
  const b = document.getElementById('welcomeBanner');
  b.textContent = '✨ Willkommen bei HalDo AI OS Professional — ' + (appName || 'Halil Donma App') + ' präsentiert ✨';
  b.classList.add('show');
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove('show'), 3200);
};

/* ───────── MODAL ───────── */
HalDo.modal = function(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalLayer').classList.add('show');
};
HalDo.closeModal = function() {
  document.getElementById('modalLayer').classList.remove('show');
};

/* ───────── WINDOW MANAGER ───────── */
HalDo.win = {
  zTop: 200,
  open(id, opts) {
    opts = opts || {};
    const existing = document.getElementById('win-' + id);
    if (existing) { this.focus(id); return existing; }
    const layer = document.getElementById('winLayer');
    const w = document.createElement('div');
    w.className = 'win active';
    w.id = 'win-' + id;
    const isMobile = window.innerWidth < 700;
    const W = Math.min(opts.w || (isMobile ? window.innerWidth - 96 : 520), window.innerWidth - 100);
    const H = Math.min(opts.h || (isMobile ? window.innerHeight - 220 : 560), window.innerHeight - 130);
    const offset = (this.zTop - 200) % 8 * 24;
    w.style.width = W + 'px';
    w.style.height = H + 'px';
    w.style.left = Math.max(90, (window.innerWidth - W) / 2 + offset - 40) + 'px';
    w.style.top = Math.max(70, (window.innerHeight - H) / 2 + offset - 30) + 'px';
    w.innerHTML = `
      <div class="win-head" data-drag="1">
        <button class="win-btn close" title="Schließen">✕</button>
        <div class="wtitle">${opts.title || 'Fenster'}</div>
        <button class="win-btn min" title="Minimieren">▁</button>
      </div>
      <div class="win-body"></div>
    `;
    layer.appendChild(w);
    this.zTop++;
    w.style.zIndex = this.zTop;
    w.querySelector('.close').onclick = (e) => { e.stopPropagation(); this.close(id); };
    w.querySelector('.min').onclick = (e) => { e.stopPropagation(); w.style.display = 'none'; setTimeout(() => this.close(id), 100); };
    w.addEventListener('mousedown', () => this.focus(id));
    w.addEventListener('touchstart', () => this.focus(id), { passive: true });
    this.drag(w, w.querySelector('.win-head'));
    return w;
  },
  focus(id) {
    document.querySelectorAll('.win').forEach(w => w.classList.remove('active'));
    const w = document.getElementById('win-' + id);
    if (w) { w.classList.add('active'); this.zTop++; w.style.zIndex = this.zTop; }
  },
  close(id) {
    const w = document.getElementById('win-' + id);
    if (w) w.remove();
  },
  body(id) {
    const w = document.getElementById('win-' + id);
    return w ? w.querySelector('.win-body') : null;
  },
  drag(win, handle) {
    let sx, sy, ox, oy, dragging = false;
    const start = (e) => {
      const t = e.touches ? e.touches[0] : e;
      // Drag-zone: exclude left/right 100px (close & min buttons)
      const rect = handle.getBoundingClientRect();
      const x = t.clientX - rect.left;
      if (x < 100 || x > rect.width - 100) return;
      dragging = true;
      sx = t.clientX; sy = t.clientY;
      ox = win.offsetLeft; oy = win.offsetTop;
      e.preventDefault();
    };
    const move = (e) => {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      let nx = ox + (t.clientX - sx);
      let ny = oy + (t.clientY - sy);
      nx = Math.max(85, Math.min(nx, window.innerWidth - 100));
      ny = Math.max(62, Math.min(ny, window.innerHeight - 80));
      win.style.left = nx + 'px';
      win.style.top = ny + 'px';
      e.preventDefault();
    };
    const end = () => { dragging = false; };
    handle.addEventListener('mousedown', start);
    handle.addEventListener('touchstart', start, { passive: false });
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }
};

HalDo.apps.aiChat = {
  open() {
    const w = HalDo.win.open('aiChat', { title:'💬 HalDo AI Chat', w: 540, h: 620 });
    HalDo.welcome('HalDo AI Chat');
    const b = HalDo.win.body('aiChat');
    const history = HalDo.store.get('chat', []);
    b.innerHTML = `
      <div id="chatLog" style="height:calc(100% - 60px);overflow-y:auto;padding-right:6px;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px">
        <input class="inp" id="chatInput" placeholder="Schreib etwas..." style="margin:0;flex:1">
        <button class="btn primary" id="chatSend" style="min-width:60px">➤</button>
      </div>
    `;
    const log = b.querySelector('#chatLog');
    const addMsg = (role, text) => {
      const d = document.createElement('div');
      const isUser = role === 'user';
      d.style.cssText = `margin-bottom:10px;padding:10px 14px;border-radius:14px;max-width:80%;font-size:13px;
        ${isUser ? 'background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.2));margin-left:auto;border:1.5px solid rgba(0,229,255,.4)' : 'background:rgba(180,120,255,.15);border:1.5px solid rgba(180,120,255,.3)'}`;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    };
    history.forEach(m => addMsg(m.role, m.text));
    const send = () => {
      const inp = b.querySelector('#chatInput');
      const text = inp.value.trim();
      if (!text) return;
      addMsg('user', text);
      history.push({ role:'user', text });
      inp.value = '';
      setTimeout(() => {
        let reply = '🤖 Ich verstehe dich, Bruder. Diese Funktion ist in Phase 4 (AI-Anbindung) verfügbar. Für jetzt speichere ich deine Nachricht.';
        const t = text.toLowerCase();
        if (t.includes('hi') || t.includes('hallo') || t.includes('hey') || t.includes('haldo')) reply = '👋 Hallo Bruder! Willkommen bei HalDo AI OS Professional. Wie kann ich dir helfen?';
        else if (t.includes('zeit')) reply = '🕐 ' + new Date().toLocaleTimeString('de-DE');
        else if (t.includes('datum')) reply = '📅 ' + new Date().toLocaleDateString('de-DE', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
        else if (t.includes('theme')) reply = '🎨 Aktuelles Theme: ' + HalDo.theme.presets[HalDo.theme.current].name;
        addMsg('assistant', reply);
        history.push({ role:'assistant', text: reply });
        HalDo.store.set('chat', history.slice(-50));
      }, 400);
    };
    b.querySelector('#chatSend').onclick = send;
    b.querySelector('#chatInput').onkeydown = e => { if (e.key === 'Enter') send(); };
    b.querySelector('#chatInput').focus();
  }
};

HalDo.apps.calc = {
  open() {
    const w = HalDo.win.open('calc', { title:'🔢 Calculator Pro', w: 340, h: 480 });

      <input class="inp" id="calcDisplay" readonly style="text-align:right;font-size:24px;height:60px;margin-bottom:14px" value="0">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        ${['C','←','%','÷','7','8','9','×','4','5','6','−','1','2','3','＋','0','.','=',''].map(k => 
          `<button class="btn ${k==='='?'primary':''}" style="height:52px;font-size:16px;font-weight:700" data-k="${k}" ${k===''?'disabled':''}>${k}</button>`
        ).join('')}
      </div>

    const disp = b.querySelector('#calcDisplay');

    b.querySelectorAll('[data-k]').forEach(btn => {
      btn.onclick = () => {

        if (k === 'C') expr = '';
        else if (k === '←') expr = expr.slice(0, -1);
        else if (k === '=') {
          try {
            const evalExpr = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/＋/g,'+').replace(/%/g,'/100');
            const r = Function('"use strict";return(' + evalExpr + ')')();
            expr = String(r);
          } catch(e) { expr = 'Error'; }
        } else expr += k;
        disp.value = expr || '0';
      };
    });
  }
};

/* ───── TIMER ───── */
HalDo.apps.timer = {
  open() {
    const w = HalDo.win.open('timer', { title:'⏱️ Timer', w: 400, h: 440 });
    HalDo.welcome('Timer');
    const b = HalDo.win.body('timer');
    b.innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div id="timerDisp" class="grad-text" style="font-size:56px;font-weight:800;font-variant-numeric:tabular-nums">00:00</div>
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="HalDo.apps.timer.set(60)">1 Min</button>
        <button class="btn" onclick="HalDo.apps.timer.set(300)">5 Min</button>
        <button class="btn" onclick="HalDo.apps.timer.set(600)">10 Min</button>
        <button class="btn" onclick="HalDo.apps.timer.set(1500)">25 Min</button>
      </div>
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="btn primary" onclick="HalDo.apps.timer.start()">▶ Start</button>
        <button class="btn danger" onclick="HalDo.apps.timer.stop()">⏸ Stop</button>
      </div>
    `;
  },
  secs: 0, int: null,
  set(s) { this.stop(); this.secs = s; this.render(); },
  start() {
    if (!this.secs) return;
    this.stop();
    this.int = setInterval(() => {
      this.secs--;
      this.render();
      if (this.secs <= 0) { this.stop(); HalDo.toast('⏰ Timer fertig!'); HalDo.apps.avatar.speak('Zeit abgelaufen!'); }
    }, 1000);
  },
  stop() { if (this.int) clearInterval(this.int); this.int = null; },
  render() {
    const d = document.getElementById('timerDisp');
    if (!d) return;
    const m = Math.floor(this.secs / 60), s = this.secs % 60;
    d.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
};

/* ═══════════════════════════════════════════════════════════
   INIT

(function init() {
  // Cosmos: Sterne
  const cos = document.getElementById('cosmos');
  for (let i = 0; i < 200; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 0.5;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    cos.appendChild(s);
  }
  // Orbit-Ringe
  const orbits = [90, 130, 170, 210, 250, 290];
  orbits.forEach(r => {
    const o = document.createElement('div');
    o.className = 'orbit';
    o.style.width = (r * 2) + 'px';
    o.style.height = (r * 2) + 'px';
    cos.appendChild(o);
  });
  // Planeten
  const planets = [
    { c:'#a89984', r:90, s:5, t:12, g:'rgba(168,153,132,.5)' },
    { c:'#e8b05c', r:120, s:6, t:18, g:'rgba(232,176,92,.5)' },
    { c:'#4da8ff', r:150, s:7, t:24, g:'rgba(77,168,255,.5)' },
    { c:'#e26b4a', r:180, s:5, t:30, g:'rgba(226,107,74,.5)' },
    { c:'#e8c87a', r:210, s:9, t:38, g:'rgba(232,200,122,.5)' },
    { c:'#c9a860', r:240, s:8, t:46, g:'rgba(201,168,96,.5)' },
    { c:'#7de8e8', r:270, s:7, t:55, g:'rgba(125,232,232,.5)' },
    { c:'#5a7ce8', r:300, s:8, t:65, g:'rgba(90,124,232,.5)' }
  ];
  planets.forEach(p => {
    const el = document.createElement('div');
    el.className = 'planet';
    el.style.width = p.s + 'px';
    el.style.height = p.s + 'px';
    el.style.background = p.c;
    el.style.setProperty('--r', p.r + 'px');
    el.style.setProperty('--pglow', p.g);
    el.style.animationDuration = p.t + 's';
    cos.appendChild(el);
  });
  // Logo click → toggle sidebar
  document.getElementById('logoBtn').onclick = () => {
    document.getElementById('sidebar').classList.toggle('hidden');
  };
  // Theme
  HalDo.theme.init();
  // Welcome
  setTimeout(() => HalDo.welcome('HalDo AI OS Professional'), 600);
  // Dashboard nach 1.2s öffnen
  setTimeout(() => HalDo.apps.dashboard.open(), 1500);
  // ESC schließt Modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') HalDo.closeModal();
  });
  console.log('%c🦚 HalDo AI OS Pro Max v123 — Foundation bereit', 'color:#00e5ff;font-size:14px;font-weight:bold');
})();
</script>
