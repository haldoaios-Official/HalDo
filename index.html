/* =========================================
   SETTINGS RENDER LOGIK
   ========================================= */
HalDo.UI.renderSettings = () => {
  if (HalDo.Win.windows['haldo-settings']) return HalDo.Win.focus('haldo-settings');

  const getVal = (id, def) => HalDo.Store.get(id, def);

  const renderItem = (item) => {
    const val = getVal(item.id, item.def);
    
    if (item.type === 'toggle') {
      return `<div class="set-row">
        <div class="set-label">${item.label} ${item.desc ? `<small>${item.desc}</small>` : ''}</div>
        <div class="toggle ${val?'on':''}" data-id="${item.id}" data-type="toggle"></div>
      </div>`;
    }
    if (item.type === 'chips') {
      return `<div class="set-row" style="flex-direction:column;align-items:flex-start">
        <div class="set-label">${item.label} ${item.desc ? `<small>${item.desc}</small>` : ''}</div>
        <div class="set-btn-group" style="justify-content:flex-start;width:100%">
          ${item.opts.map(o => `<div class="set-chip ${val===o?'active':''}" data-id="${item.id}" data-val="${o}" data-type="chips">${o}</div>`).join('')}
        </div>
      </div>`;
    }
    if (item.type === 'slider') {
      return `<div class="set-row">
        <div class="set-label">${item.label}</div>
        <input type="range" class="set-slider" min="${item.min}" max="${item.max}" value="${val}" data-id="${item.id}" data-type="slider">
      </div>`;
    }
    if (item.type === 'color') {
      return `<div class="set-row">
        <div class="set-label">${item.label}</div>
        <input type="color" class="set-color-picker" value="${val}" data-id="${item.id}" data-type="color">
      </div>`;
    }
    if (item.type === 'input') {
      return `<div class="set-row">
        <div class="set-label">${item.label}</div>
        <input type="text" class="set-input" value="${val}" data-id="${item.id}" data-type="input" placeholder="Eingeben...">
      </div>`;
    }
    if (item.type === 'text') {
      return `<div class="set-row">
        <div class="set-label">${item.label}</div>
        <span style="font-size:12px;color:var(--dim);font-weight:700">${item.val}</span>
      </div>`;
    }
    if (item.type === 'button') {
      return `<div class="set-row">
        <div class="set-label">${item.label}</div>
        <button class="set-action-btn ${item.danger?'danger':''}" data-action="${item.action}">${item.text}</button>
      </div>`;
    }
    return '';
  };

  const html = `
    <div class="settings-modal">
      <div class="set-search">
        <input type="text" id="setSearch" placeholder="🔍 Suche alle Einstellungen..." oninput="HalDo.UI.filterSettings(this.value)">
      </div>
      <div class="set-list" id="setList">
        ${MASTER_SETTINGS.map(sec => `
          <div class="set-card" data-search="${sec.title.toLowerCase()} ${sec.items.map(i=>i.label.toLowerCase()).join(' ')}">
            <div class="set-card-head">
              <div class="set-card-letter">${sec.key}</div>
              <div class="set-card-title">${sec.icon} ${sec.title}</div>
              <div class="set-card-arrow">▸</div>
            </div>
            <div class="set-card-body">
              ${sec.items.map(renderItem).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  const win = HalDo.Win.create('haldo-settings', '⚙️ Einstellungen A–Z', html, {width: 600, height: 700});

  // Accordion Logik
  win.querySelectorAll('.set-card-head').forEach(h => {
    h.addEventListener('click', () => {
      h.parentElement.classList.toggle('open');
      HalDo.Sound.click();
    });
  });

  // Event Listener für Toggles
  win.querySelectorAll('.toggle').forEach(t => {
    t.addEventListener('click', () => {
      t.classList.toggle('on');
      const isOn = t.classList.contains('on');
      HalDo.Store.set(t.dataset.id, isOn);
      HalDo.Sound.click();
      applyChange(t.dataset.id, isOn);
    });
  });

  // Event Listener für Chips
  win.querySelectorAll('.set-chip').forEach(c => {
    c.addEventListener('click', () => {
      const group = c.parentElement;
      group.querySelectorAll('.set-chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      HalDo.Store.set(c.dataset.id, c.dataset.val);
      HalDo.Sound.click();
      applyChange(c.dataset.id, c.dataset.val);
    });
  });

  // Event Listener für Slider & Color & Input
  win.querySelectorAll('.set-slider, .set-color-picker, .set-input').forEach(el => {
    el.addEventListener('input', (e) => {
      const val = e.target.value;
      HalDo.Store.set(e.target.dataset.id, val);
      applyChange(e.target.dataset.id, val);
    });
  });

  // Event Listener für Action Buttons
  win.querySelectorAll('.set-action-btn').forEach(b => {
    b.addEventListener('click', () => {
      const action = b.dataset.action;
      if (action === 'toast') { HalDo.Toast.show('✅ Aktion ausgeführt'); HalDo.Sound.success(); }
      if (action === 'reset') {
        if (confirm('⚠️ BIST DU SICHER? Alle Daten (Tasks, Notizen, Einstellungen) werden gelöscht!')) {
          localStorage.clear();
          location.reload();
        }
      }
      if (action === 'export') {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          try { data[key] = JSON.parse(localStorage.getItem(key)); } catch(e) { data[key] = localStorage.getItem(key); }
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'haldo_backup.json';
        a.click();
        HalDo.Toast.show('💾 Export gestartet'); HalDo.Sound.success();
      }
    });
  });
};

/* =========================================
   LIVE ANWENDUNG DER EINSTELLUNGEN
   ========================================= */
const applyChange = (id, val) => {
  // Themes
  if (id === 'theme') {
    const map = {Holo:'holo',Cyborg:'cyborg',Gold:'gold',Matrix:'matrix',Crimson:'crimson',Sunset:'sunset',Ice:'ice'};
    document.documentElement.setAttribute('data-theme', map[val] || 'holo');
  }
  if (id === 'custom-color') {
    document.documentElement.style.setProperty('--accent', val);
    document.documentElement.style.setProperty('--border', val + '80'); // 50% alpha
  }
  // Display
  if (id === 'font-size') {
    const m = {S:'13px',M:'15px',L:'17px',XL:'19px'};
    document.documentElement.style.setProperty('--fs', m[val] || '15px');
  }
  if (id === 'blur-strength') {
    const m = {Wenig:'12px',Mittel:'24px',Viel:'36px',Max:'48px'};
    document.documentElement.style.setProperty('--blur', m[val] || '24px');
  }
  if (id === 'anim-speed') {
    const m = {'0.5x':0.5,'1x':1,'2x':2};
    document.documentElement.style.setProperty('--anim', m[val] || 1);
  }
  // Cyborg Modus
  if (id === 'cyborg-mode') {
    document.documentElement.setAttribute('data-theme', val ? 'cyborg' : 'holo');
  }
  if (id === 'glass-opacity') {
    const alpha = val / 100;
    document.documentElement.style.setProperty('--glass', `rgba(10,20,40,${alpha})`);
  }
};

/* Suchfunktion */
HalDo.UI.filterSettings = (q) => {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.set-card').forEach(card => {
    if (!q) { card.classList.remove('hidden'); return; }
    const isMatch = card.dataset.search.includes(q);
    card.classList.toggle('hidden', !isMatch);
    if (isMatch) card.classList.add('open');
  });
};

/* Nav-Override um immer die neuen Settings zu öffnen */
const _navOrig = HalDo.UI.nav;
HalDo.UI.nav = function(section) {
  if (section === 'system') { return HalDo.UI.open('settings'); }
  return _navOrig.call(HalDo.UI, section);
};

const _openOrig = HalDo.UI.open;
HalDo.UI.open = function(appId) {
  if (appId === 'settings') return HalDo.UI.renderSettings();
  return _openOrig.call(HalDo.UI, appId);
};
