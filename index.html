<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020412">
<title>HalDo AI OS</title>
<style>
:root{
  --c1:#00e5ff;--c2:#4da8ff;--c3:#b478ff;
  --bg:#020412;--panel:rgba(6,12,32,.72);--panel2:rgba(10,18,48,.88);
  --line:rgba(0,229,255,.35);--line2:rgba(120,200,255,.14);
  --txt:#e9f6ff;--dim:#6b8bb8;
  --glow:0 0 12px rgba(0,229,255,.6),0 0 32px rgba(0,229,255,.22);
  --glow-s:0 0 6px rgba(0,229,255,.7),0 0 18px rgba(0,229,255,.3);
  --sh:0 26px 80px rgba(0,40,120,.55);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
body.cyborg{
  --c1:#ff78c8;--c2:#b478ff;--c3:#d484ff;
  --line:rgba(255,120,200,.4);--line2:rgba(255,160,220,.14);
  --glow:0 0 12px rgba(255,120,200,.65),0 0 32px rgba(180,120,255,.25);
  --glow-s:0 0 6px rgba(255,120,200,.75),0 0 18px rgba(180,120,255,.35);
  --sh:0 26px 80px rgba(120,20,80,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(0,229,255,.25);border-radius:8px}

/* ============ KOSMOS + HOLO-BÜHNE ============ */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(ellipse at 50% 120%,rgba(0,120,255,.35) 0%,rgba(0,40,120,.15) 35%,transparent 70%),
  radial-gradient(ellipse at 80% 0%,rgba(180,120,255,.12) 0%,transparent 55%),
  linear-gradient(180deg,#020412 0%,#04081e 45%,#0a1230 100%)}
#stars{position:absolute;inset:0;display:block}
#nebula{position:absolute;inset:0;opacity:.55;background:
  radial-gradient(circle at 20% 30%,rgba(0,229,255,.14),transparent 45%),
  radial-gradient(circle at 80% 70%,rgba(180,120,255,.16),transparent 50%)}

/* Boden-Plattform */
#platform{position:absolute;left:50%;bottom:-3%;transform:translateX(-50%) perspective(700px) rotateX(72deg);transform-origin:bottom center;width:min(900px,140vw);height:min(900px,140vw);pointer-events:none}
#platform .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--c1);opacity:.35;box-shadow:0 0 20px var(--c1),inset 0 0 40px rgba(0,229,255,.3)}
#platform .r1{inset:0}
#platform .r2{inset:6%;border-color:var(--c2);opacity:.28;animation:spin 26s linear infinite}
#platform .r3{inset:12%;border-style:dashed;border-color:var(--c3);opacity:.4;animation:spin 18s linear infinite reverse}
#platform .r4{inset:20%;border-color:var(--c1);opacity:.5;animation:spin 42s linear infinite}
#platform .r5{inset:30%;border-color:var(--c1);opacity:.65;box-shadow:0 0 30px var(--c1),inset 0 0 30px rgba(0,229,255,.4)}
#platform .grid{position:absolute;inset:0;border-radius:50%;background-image:
  linear-gradient(rgba(0,229,255,.12) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,229,255,.12) 1px,transparent 1px);
  background-size:6% 6%;mask:radial-gradient(circle,black 60%,transparent 75%)}
#platform .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:14%;height:14%;border-radius:50%;background:radial-gradient(circle,#fff,var(--c1) 40%,transparent 75%);filter:blur(2px);opacity:.9;animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.25);opacity:1}}

/* Holografischer Avatar */
#avatar{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(320px,55vw);height:min(560px,78vh);pointer-events:none;z-index:1;filter:drop-shadow(0 0 30px var(--c1))}
#avatar svg{width:100%;height:100%;animation:avatarFloat 6s ease-in-out infinite}
@keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#avatar .aura{position:absolute;inset:-8% -20% 0 -20%;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.35) 0%,transparent 60%);pointer-events:none;z-index:-1;animation:pulse2 4s ease-in-out infinite}
@keyframes pulse2{50%{opacity:.6;transform:scale(1.08)}}

/* Partikel-Linien um Avatar */
#lines{position:absolute;inset:0;pointer-events:none;z-index:1}

/* ============ TOP-BAR (HUD) ============ */
#topbar{position:fixed;top:var(--safe-t);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(180deg,rgba(6,14,40,.85),rgba(4,8,24,.7));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1.5px solid var(--line)}
#topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--c1),transparent);opacity:.6}
#menuBtn{display:none}
.iconbtn{background:rgba(0,229,255,.08);border:1.5px solid var(--line);color:var(--c1);width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;transition:.18s;position:relative}
.iconbtn:hover{background:rgba(0,229,255,.18);box-shadow:var(--glow)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:800;color:#fff;flex:0 0 auto;background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 0 16px rgba(0,229,255,.7),inset 0 0 8px rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.3)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:13.5px;letter-spacing:1px;white-space:nowrap;text-shadow:0 0 8px var(--c1)}
.sm{font-size:11px}.dim{color:var(--dim)}.spacer{flex:1}
#search{width:220px;max-width:42vw;height:40px;border-radius:12px;padding:0 12px;background:rgba(0,229,255,.05);border:1.5px solid var(--line);color:var(--txt);outline:none;font-size:13px;letter-spacing:.3px}
#search::placeholder{color:var(--dim)}
#search:focus{background:rgba(0,229,255,.1);box-shadow:var(--glow)}
#clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--c1);white-space:nowrap;letter-spacing:1.5px;text-shadow:0 0 6px var(--c1)}

/* ============ SIDEBAR ============ */
#sidebar{position:fixed;top:calc(var(--safe-t) + 56px);bottom:calc(var(--safe-b) + 56px);left:var(--safe-l);width:236px;z-index:8000;padding:14px 10px;background:linear-gradient(180deg,rgba(6,14,40,.9),rgba(4,8,24,.78));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1.5px solid var(--line);overflow-y:auto;transition:transform .28s}
#sidebar h4{margin:8px 4px;font-size:10.5px;letter-spacing:1.6px;color:var(--c1);text-transform:uppercase;font-weight:700;text-shadow:0 0 6px var(--c1);opacity:.85}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;margin-bottom:3px;background:transparent;border:1.5px solid transparent;border-radius:12px;color:var(--txt);cursor:pointer;font-size:13px;text-align:left;transition:.15s}
.catbtn:hover{background:rgba(0,229,255,.08);border-color:var(--line);box-shadow:var(--glow-s)}
.catbtn.active{background:rgba(0,229,255,.15);border-color:var(--c1);box-shadow:var(--glow)}
.catbtn .ico{font-size:16px;width:22px;text-align:center}
.catbtn .n{margin-left:auto;font-size:10.5px;color:var(--c1);padding:2px 7px;border-radius:8px;background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.3)}

/* ============ DESKTOP ============ */
#desktop{position:fixed;top:calc(var(--safe-t) + 56px);left:calc(var(--safe-l) + 236px);right:var(--safe-r);bottom:calc(var(--safe-b) + 56px);z-index:1;overflow-y:auto;padding:18px 18px 40px;scrollbar-width:thin}
#desktop h3{margin:22px 0 12px;font-size:13px;letter-spacing:1.2px;display:flex;align-items:center;gap:8px;color:var(--txt);font-weight:700;text-transform:uppercase}
#desktop h3 .n{font-size:10.5px;color:var(--c1);font-weight:400;margin-left:auto;background:rgba(0,229,255,.1);padding:3px 9px;border-radius:9px;border:1px solid rgba(0,229,255,.3);letter-spacing:.8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 5px;border-radius:15px;cursor:pointer;text-align:center;border:1.5px solid transparent;user-select:none;transition:.18s}
.app:hover{background:rgba(0,229,255,.07);border-color:var(--line);box-shadow:var(--glow-s)}
.app:active{transform:scale(.95)}
.app .ic{font-size:26px;width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(150deg,rgba(0,229,255,.16),rgba(180,120,255,.08));border:1.5px solid var(--line);box-shadow:inset 0 0 12px rgba(0,229,255,.15)}
.app.soon .ic{opacity:.4}
.app .nm{font-size:11px;color:var(--dim);line-height:1.25;word-break:break-word}
.app.ready .nm{color:var(--txt);font-weight:500}

/* ============ FENSTER ============ */
.window{position:fixed;z-index:200;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,rgba(10,20,50,.9),rgba(4,10,32,.94));backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--sh),inset 0 0 40px rgba(0,229,255,.06),0 0 30px rgba(0,229,255,.15);animation:winIn .2s}
@keyframes winIn{from{opacity:0;transform:scale(.95) translateY(12px)}}
.window.maxed{left:8px!important;top:64px!important;right:8px;bottom:8px;width:auto!important;height:auto!important;border-radius:14px}
.win-head{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1.5px solid var(--line);user-select:none;touch-action:none;background:linear-gradient(180deg,rgba(0,229,255,.08),transparent)}
.wic{font-size:16px;color:var(--c1)}
.wtitle{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.4px}
.wbtns{display:flex;gap:5px;z-index:999999}
.wb{width:40px;height:40px;border-radius:11px;border:1.5px solid transparent;background:rgba(0,229,255,.06);color:var(--c1);cursor:pointer;font-size:14px;display:grid;place-items:center;z-index:999999;transition:.15s}
.wb:hover{background:rgba(0,229,255,.18);box-shadow:var(--glow-s)}
.wb.close:hover{background:#e03b5a;color:#fff;border-color:#e03b5a}
.win-body{flex:1;overflow:auto;padding:16px;position:relative}

/* ============ BOTTOM-BAR ============ */
#bottomBar{position:fixed;bottom:var(--safe-b);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;background:linear-gradient(0deg,rgba(6,14,40,.85),rgba(4,8,24,.7));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1.5px solid var(--line)}
#bottomBar::before{content:'';position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--c1),transparent);opacity:.6}
.bbtn{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:rgba(0,229,255,.06);border:1.5px solid var(--line);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500;transition:.15s;letter-spacing:.4px}
.bbtn:hover{background:rgba(0,229,255,.16);box-shadow:var(--glow)}
.bbtn.on{background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;border-color:var(--c1);box-shadow:var(--glow)}

/* ============ UI-BAUSTEINE ============ */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.big{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1.05;color:var(--c1);text-shadow:0 0 14px var(--c1)}
.big2{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.btn{padding:9px 15px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,229,255,.06);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;transition:.15s;letter-spacing:.4px}
.btn:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#02101e;font-weight:700;box-shadow:var(--glow)}
.btn.danger{background:rgba(224,59,90,.16);border-color:rgba(224,59,90,.5);color:#ff9db1}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.card{padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(0,229,255,.06),rgba(0,229,255,.02));border:1.5px solid var(--line);font-size:13px;box-shadow:inset 0 0 16px rgba(0,229,255,.06)}
.inp,.ta{width:100%;padding:10px 12px;border-radius:12px;background:rgba(0,229,255,.05);border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13.5px;font-family:inherit}
.inp::placeholder,.ta::placeholder{color:var(--dim)}
.inp:focus,.ta:focus{border-color:var(--c1);box-shadow:var(--glow-s);background:rgba(0,229,255,.09)}
.ta{min-height:150px;resize:vertical;line-height:1.5}
.lbl{font-size:11px;color:var(--c1);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:4px;display:block;opacity:.85}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(0,229,255,.04);border:1.5px solid var(--line2);font-size:13px}
.item .x{margin-left:auto;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.item .x:hover{background:rgba(224,59,90,.2);color:#ff9db1}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:22px 10px;font-style:italic}

/* Rechner */
.calc{max-width:340px;margin:0 auto}
.calc-disp{font-size:30px;font-weight:700;text-align:right;padding:16px 14px;border-radius:14px;background:rgba(0,0,0,.35);border:1.5px solid var(--line);margin-bottom:10px;min-height:66px;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 20px rgba(0,229,255,.15);display:flex;flex-direction:column;justify-content:center}
.calc-disp .prev{font-size:12px;color:var(--dim);height:14px}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{padding:15px 0;border-radius:13px;border:1.5px solid var(--line);background:rgba(0,229,255,.05);color:var(--txt);font-size:17px;cursor:pointer;font-weight:500;transition:.1s}
.ck:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow-s)}
.ck:active{transform:scale(.94)}
.ck.op{background:rgba(180,120,255,.14);border-color:rgba(180,120,255,.5)}
.ck.wide{grid-column:span 2}
.ck.eq{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#02101e;font-weight:700;box-shadow:var(--glow)}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal-h{text-align:center;font-size:11px;color:var(--c1);padding:4px 0;font-weight:600;opacity:.85}
.cal-d{text-align:center;padding:9px 0;border-radius:10px;background:rgba(0,229,255,.04);font-size:13px;border:1px solid transparent}
.cal-d.today{background:linear-gradient(135deg,var(--c1),var(--c2));color:#02101e;font-weight:700;box-shadow:var(--glow)}

/* TicTacToe */
.ttt{display:grid;grid-template-columns:repeat(3,86px);gap:8px;margin:0 auto}
.tttc{height:86px;display:grid;place-items:center;font-size:36px;font-weight:800;border-radius:14px;background:rgba(0,229,255,.05);border:1.5px solid var(--line);cursor:pointer;color:var(--txt);transition:.12s}
.tttc:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow-s)}
.tttc.x{color:var(--c1);text-shadow:0 0 12px var(--c1)}
.tttc.o{color:var(--c3);text-shadow:0 0 12px var(--c3)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translate(-50%,140%);z-index:9999;padding:11px 18px;border-radius:13px;background:rgba(6,14,40,.96);border:1.5px solid var(--line);font-size:13px;transition:transform .3s;max-width:88vw;text-align:center;box-shadow:var(--glow);letter-spacing:.4px}
#toast.on{transform:translate(-50%,0)}

@media(max-width:820px){
#menuBtn{display:grid}
#sidebar{transform:translateX(-105%);width:262px}
#sidebar.open{transform:translateX(0);box-shadow:14px 0 40px rgba(0,40,120,.6)}
#desktop{left:var(--safe-l);padding:14px 12px 30px}
.brand{display:none}
#search{width:auto;flex:1;max-width:none}
#clock{display:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.app .ic{width:48px;height:48px;font-size:24px}
.window{border-radius:0!important}
.win-body{padding:13px}
#bottomBar{gap:5px;padding:0 8px}
.bbtn{padding:9px 10px;font-size:12px}
.bbtn span.lbl-txt{display:none}
.calc{max-width:100%}
.ttt{grid-template-columns:repeat(3,1fr);width:100%;max-width:300px}
.tttc{height:auto;aspect-ratio:1}
#avatar{height:60vh;bottom:4%}
}
</style>
</head>
<body>

<div id="stage">
  <canvas id="stars"></canvas>
  <div id="nebula"></div>
  <div id="platform">
    <div class="grid"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <div class="core"></div>
  </div>
  <svg id="avatar" viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
    <div class="aura"></div>
    <defs>
      <radialGradient id="holo" cx="50%" cy="35%">
        <stop offset="0%" stop-color="#eafcff" stop-opacity="1"/>
        <stop offset="45%" stop-color="#00e5ff" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#4da8ff" stop-opacity=".15"/>
      </radialGradient>
      <linearGradient id="holoBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#eafcff" stop-opacity=".95"/>
        <stop offset="60%" stop-color="#00e5ff" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#00e5ff" stop-opacity=".05"/>
      </linearGradient>
      <filter id="blur1"><feGaussianBlur stdDeviation="1.2"/></filter>
    </defs>
    <g filter="url(#blur1)" opacity="0.95">
      <!-- Kopf -->
      <ellipse cx="100" cy="62" rx="34" ry="40" fill="url(#holo)"/>
      <!-- Hals -->
      <rect x="90" y="96" width="20" height="20" rx="6" fill="url(#holoBody)"/>
      <!-- Schultern -->
      <path d="M 40 145 Q 40 118 70 112 L 130 112 Q 160 118 160 145 L 168 260 Q 168 268 160 268 L 40 268 Q 32 268 32 260 Z" fill="url(#holoBody)"/>
      <!-- Arme -->
      <path d="M 40 145 Q 25 200 22 250 L 30 255 Q 42 210 55 175 Z" fill="url(#holoBody)" opacity=".8"/>
      <path d="M 160 145 Q 178 200 178 250 L 170 255 Q 158 210 145 175 Z" fill="url(#holoBody)" opacity=".8"/>
      <!-- Beine -->
      <path d="M 62 268 Q 58 320 60 380 L 82 380 Q 80 320 84 268 Z" fill="url(#holoBody)" opacity=".7"/>
      <path d="M 118 268 Q 122 320 120 380 L 142 380 Q 140 320 138 268 Z" fill="url(#holoBody)" opacity=".7"/>
      <!-- Augen -->
      <ellipse cx="86" cy="58" rx="4" ry="5" fill="#02101e"/>
      <ellipse cx="114" cy="58" rx="4" ry="5" fill="#02101e"/>
      <circle cx="87" cy="56" r="1.6" fill="#fff"/>
      <circle cx="115" cy="56" r="1.6" fill="#fff"/>
      <!-- Mund -->
      <path d="M 88 78 Q 100 84 112 78" stroke="#02101e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- HUD-Ringe im Kopf -->
      <circle cx="100" cy="62" r="46" fill="none" stroke="#00e5ff" stroke-width=".8" opacity=".55"/>
      <circle cx="100" cy="62" r="52" fill="none" stroke="#b478ff" stroke-width=".5" stroke-dasharray="3 4" opacity=".5"/>
    </g>
  </svg>
  <svg id="lines" viewBox="0 0 1200 800" preserveAspectRatio="none">
    <defs>
      <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00e5ff" stop-opacity=".55"/>

(function(){

  var stars = [];
  function resize(){
    cv.width = Math.floor(window.innerWidth*dpr);

    ctx.clearRect(0,0,cv.width,cv.height);

/* ============ FENSTER-MANAGER ============ */
var WM = { wins: {}, zTop: 200, focused: null };
function openWin(appId, opts){
  opts = opts || {};
  var app = H.APPS[appId];
  if(!app){ toast('App nicht gefunden: '+appId); return null; }
  for(var wid in WM.wins){
    if(WM.wins[wid].appId===appId){
      WM.wins[wid].el.style.display='';
      focusWin(wid);
      return WM.wins[wid].el;
    }
  }
  var id = uid();
  var win = el('section','window');
  win.dataset.id = id;
  win.style.zIndex = ++WM.zTop;
  var W = Math.min(opts.w || 520, window.innerWidth - 16);
  var Hh = Math.min(opts.h || 480, window.innerHeight - 16);
  win.style.width = W+'px';
  win.style.height = Hh+'px';
  var count = Object.keys(WM.wins).length;
  win.style.left = Math.max(8, (window.innerWidth - W)/2 + (count%5)*22 - 44)+'px';
  win.style.top = Math.max(64, (window.innerHeight - Hh)/2 + (count%5)*18 - 36)+'px';
  win.innerHTML = '<div class="win-head">'+
      '<span class="wic">'+esc(app.icon||'▣')+'</span>'+
      '<div class="wtitle">'+esc(app.name||appId)+'</div>'+
      '<div class="wbtns">'+
        '<button class="wb min">—</button>'+
        '<button class="wb max">▢</button>'+
        '<button class="wb close">✕</button>'+
      '</div>'+
    '</div>'+
    '<div class="win-body"></div>';
  document.body.appendChild(win);
  win.querySelector('.wb.close').onclick = function(e){ e.stopPropagation(); closeWin(id); };
  win.querySelector('.wb.min').onclick = function(e){ e.stopPropagation(); win.style.display='none'; };
  win.querySelector('.wb.max').onclick = function(e){ e.stopPropagation(); win.classList.toggle('maxed'); };
  win.addEventListener('pointerdown', function(){ focusWin(id); }, true);
  var head = win.querySelector('.win-head');
  head.addEventListener('pointerdown', function(e){ dragWin(e, id); });
  var body = win.querySelector('.win-body');
  try{
    var html = (typeof app.render==='function') ? app.render(win, body) : (app.render||'');
    if(html != null) body.innerHTML = html;
    if(typeof app.init==='function') app.init(win, body);
  }catch(err){
    body.innerHTML = '<div class="empty">Fehler beim Laden: '+esc(err.message)+'</div>';
    console.error('[HalDo]', appId, err);
  }
  WM.wins[id] = {el:win, appId:appId};
  focusWin(id);
  return win;
}
function closeWin(id){ var w = WM.wins[id]; if(!w) return; w.el.remove(); delete WM.wins[id]; }
function focusWin(id){ var w = WM.wins[id]; if(!w) return; w.el.style.zIndex = ++WM.zTop; WM.focused = id; }
function dragWin(e, id){
  var w = WM.wins[id]; if(!w) return;
  var win = w.el;
  if(win.classList.contains('maxed')) return;
  var r = win.getBoundingClientRect();
  var sx = e.clientX, sy = e.clientY, sl = r.left, st = r.top;
  function mv(ev){
    var nl = sl + ev.clientX - sx, nt = st + ev.clientY - sy;
    nl = Math.min(window.innerWidth - 60, Math.max(-r.width+60, nl));
    nt = Math.min(window.innerHeight - 60, Math.max(56, nt));
    win.style.left = nl+'px'; win.style.top = nt+'px';
    ev.preventDefault();
  }
  function up(){ document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); }
  document.addEventListener('pointermove', mv, {passive:false});
  document.addEventListener('pointerup', up);
}
H.open = openWin;
H.close = closeWin;

H.APPS['rechner'] = { name:'Rechner', icon:'🧮',
  render: function(){
    return '<div class="calc"><div class="calc-disp"><div class="prev" id="cvP"></div><div class="cur" id="cvC">0</div></div>'+
      '<div class="calc-keys">'+
      ['C','±','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0w','.','='].map(function(k){
        var l = {'/':'÷','*':'×','-':'−','0w':'0'}[k]||k;
        var c = 'ck';
        if('+-*/'.indexOf(k)>=0) c+=' op';
        if(k==='0w') c+=' wide';
        if(k==='=') c+=' eq';
        return '<button class="'+c+'" data-k="'+(k==='0w'?'0':k)+'">'+l+'</button>';
      }).join('')+
      '</div></div>';
  },
  init: function(win){
    var C = win.querySelector('#cvC'), P = win.querySelector('#cvP');
    var a=null, op=null, b='', fresh=false;
    function ev(x,y,o){ return {'+':x+y,'-':x-y,'*':x*y,'/':y===0?NaN:x/y,'%':x%y}[o]; }
    win.querySelectorAll('.ck').forEach(function(btn){
      btn.onclick = function(){
        var k = btn.dataset.k;
        if(k>='0' && k<='9'){ if(fresh){ b=''; fresh=false; } b+=k; C.textContent=b; return; }
        if(k==='.'){ if(fresh){ b='0'; fresh=false; } if(b.indexOf('.')<0) b+='.'; C.textContent=b||'0.'; return; }
        if(k==='C'){ a=null; op=null; b=''; P.textContent=''; C.textContent='0'; return; }
        if(k==='±'){ b = b.charAt(0)==='-' ? b.slice(1) : '-'+b; C.textContent=b||'0'; return; }
        if('+-*/'.indexOf(k)>=0){
          if(a===null && op===null){ a = parseFloat(b||'0'); }
          else if(op && b!==''){ a = ev(a, parseFloat(b), op); }
          op = k; P.textContent = fmt(a)+' '+({'+':'+','-':'−','*':'×','/':'÷'}[k]||k);
          fresh = true; return;
        }
        if(k==='%'){ b = String((parseFloat(b||'0'))/100); C.textContent=b; return; }
        if(k==='='){ if(op && b!==''){ var r = ev(a, parseFloat(b), op); P.textContent = fmt(a)+' '+op+' '+fmt(parseFloat(b))+' ='; C.textContent = isFinite(r) ? fmt(r) : 'Fehler'; a=null; op=null; b=''; fresh=true; } }
      };
    });
  }
};

/* QUIZ-FACTORY */
function makeQuiz(title, icon, questions){
  return { name:title, icon:icon,
    render: function(){ return '<div class="col center" style="max-width:520px;margin:0 auto"><div class="row between" style="width:100%"><span class="dim" id="qzP">1 / '+questions.length+'</span><span class="dim">Punkte: <b id="qzS" style="color:var(--c1)">0</b></span></div><div class="card center big2" id="qzQ" style="min-height:80px;display:flex;align-items:center;justify-content:center;width:100%"></div><div id="qzA" class="col" style="width:100%"></div><button class="btn" id="qzR" style="margin-top:6px">🔄 Neu</button></div>'; },
    init: function(win){
      var i=0, score=0, order=shuf(questions);
      var Q=win.querySelector('#qzQ'), A=win.querySelector('#qzA'), P=win.querySelector('#qzP'), S=win.querySelector('#qzS');
      function draw(){
        if(i >= order.length){ Q.textContent = score===order.length?'🎉 Perfekt!':(score>=order.length*0.7?'👍 Gut gemacht!':'Weiter üben!'); A.innerHTML = '<div class="card center big2" style="width:100%">'+score+' / '+order.length+'</div>'; P.textContent = order.length+' / '+order.length; return; }
        var q = order[i];
        Q.textContent = q.q; P.textContent = (i+1)+' / '+order.length; S.textContent = score;
        A.innerHTML = q.a.map(function(a,j){ return '<button class="btn" data-j="'+j+'" style="width:100%;text-align:left">'+esc(a)+'</button>'; }).join('');
        win.querySelectorAll('#qzA button').forEach(function(b){
          b.onclick = function(){
            var j = parseInt(b.dataset.j);
            if(j===q.c){ score++; b.style.background='rgba(77,232,138,.35)'; b.style.borderColor='#4de88a'; }
            else { b.style.background='rgba(224,59,90,.35)'; b.style.borderColor='#e03b5a'; var cor=A.querySelector('[data-j="'+q.c+'"]'); if(cor){ cor.style.background='rgba(77,232,138,.35)'; cor.style.borderColor='#4de88a'; } }
            win.querySelectorAll('#qzA button').forEach(function(x){ x.disabled=true; });
            setTimeout(function(){ i++; draw(); }, 850);
          };
        });
      }
      draw();
      win.querySelector('#qzR').onclick = function(){ i=0; score=0; order=shuf(questions); draw(); };
    }
  };
}

  render: function(){ return '<div class="col center"><div class="big2" id="ttS" style="color:var(--c1)">Du bist X</div><div class="ttt" id="ttG"></div><button class="btn" id="ttR" style="margin-top:12px">Neu</button></div>'; },
  init: function(win){
    var b, dn;
    var G = win.querySelector('#ttG'), S = win.querySelector('#ttS');
    var L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function W(){ for(var i=0;i<L.length;i++){ var l=L[i]; if(b[l[0]] && b[l[0]]===b[l[1]] && b[l[0]]===b[l[2]]) return b[l[0]]; } return b.indexOf('')<0 ? 'T' : null; }
    function d(){
      G.innerHTML = b.map(function(v,i){ return '<div class="tttc '+(v==='X'?'x':v==='O'?'o':'')+'" data-i="'+i+'">'+v+'</div>'; }).join('');
      win.querySelectorAll('.tttc').forEach(function(e){ e.onclick=function(){ cl(parseInt(e.dataset.i)); }; });
    }
    function ai(){
      var em = b.map(function(v,i){ return v===''?i:-1; }).filter(function(i){ return i>=0; });
      for(var i=0;i<L.length;i++){ var l=L[i]; var xs=l.filter(function(k){return b[k]==='O';}); var es=l.filter(function(k){return b[k]==='';}); if(xs.length===2 && es.length===1) return es[0]; }
      for(var i2=0;i2<L.length;i2++){ var l2=L[i2]; var xs2=l2.filter(function(k){return b[k]==='X';}); var es2=l2.filter(function(k){return b[k]==='';}); if(xs2.length===2 && es2.length===1) return es2[0]; }
      if(b[4]==='') return 4;
      var c = [0,2,6,8].filter(function(i){ return b[i]===''; });
      if(c.length) return c[rnd(0,c.length-1)];
      return em[rnd(0,em.length-1)];
    }
    function cl(i){
      if(dn || b[i]!=='') return;
      b[i]='X'; d();
      var w = W();
      if(w){ S.textContent = w==='T'?'Unentschieden':'Du gewinnst! 🎉'; dn=true; return; }
      setTimeout(function(){
        var j = ai(); if(j!=null) b[j]='O'; d();
        w = W();
        if(w){ S.textContent = w==='T'?'Unentschieden':'AI gewinnt'; dn=true; }
      }, 300);
    }
    function R(){ b=['','','','','','','','','']; dn=false; S.textContent='Du bist X'; d(); }
    win.querySelector('#ttR').onclick = R;
    R();
  }
};

/* KONFETTI */
H.APPS['konfetti'] = { name:'Konfetti', icon:'🎉',
  render: function(){ return '<div class="col center"><div class="card" style="background:linear-gradient(135deg,rgba(255,180,58,.2),rgba(224,59,90,.15))"><div style="font-size:64px">🎉</div><div class="big2">Party-Modus</div></div><button class="btn primary" id="kfG" style="width:100%;padding:14px;font-size:16px">🎉 Konfetti starten</button><div class="row"><button class="btn" data-n="50">50</button><button class="btn" data-n="200">200</button><button class="btn" data-n="500">500</button></div></div>'; },
  init: function(win){
    var C = document.createElement('canvas');
    C.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9998;display:none';
    document.body.appendChild(C);
    var ctx = C.getContext('2d');
    var P = [], anim = null;
    function boom(n){
      n = n || 150;
      C.width = window.innerWidth; C.height = window.innerHeight; C.style.display = 'block';
      var cols = ['#00e5ff','#b478ff','#ffb03a','#ff6b88','#4de88a','#fff','#ff78c8'];
      for(var i=0;i<n;i++) P.push({ x: window.innerWidth/2+rnd(-100,100), y: window.innerHeight/2+rnd(-50,50), vx:rnd(-12,12), vy:rnd(-18,-5), s:rnd(6,14), c:cols[rnd(0,cols.length-1)], r:Math.random()*6.28, vr:rnd(-20,20)/100 });
      if(!anim) loop();
    }
    function loop(){
      ctx.clearRect(0,0,C.width,C.height);
      for(var i=0;i<P.length;i++){
        var p = P[i]; p.vy+=.4; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
        ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s/2); ctx.restore();
      }
      P = P.filter(function(p){ return p.y<C.height+50; });
      if(P.length) anim = requestAnimationFrame(loop); else { cancelAnimationFrame(anim); anim=null; C.style.display='none'; }
    }
    win.querySelector('#kfG').onclick = function(){ boom(150); };
    win.querySelectorAll('button[data-n]').forEach(function(b){ b.onclick = function(){ boom(parseInt(b.dataset.n)); }; });
    win.addEventListener('remove', function(){ C.remove(); if(anim) cancelAnimationFrame(anim); });
  }
};

/* HALDO AI */
H.APPS['haldo-ai'] = { name:'HalDo AI', icon:'🤖',
  render: function(){
    return '<div class="col" style="height:100%;gap:8px">'+
      '<div style="position:relative;height:170px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,229,255,.18),transparent 70%);border-radius:16px;border:1.5px solid var(--line);flex:0 0 auto;overflow:hidden">'+

          '<ellipse cx="82" cy="72" rx="8" ry="6" fill="rgba(0,229,255,.4)"/>'+
          '<circle class="aiEyeL" cx="47" cy="56" r="6.5" fill="#0a0e24"/>'+
          '<circle class="aiEyeR" cx="73" cy="56" r="6.5" fill="#0a0e24"/>'+
          '<circle cx="45" cy="54" r="2" fill="#fff"/><circle cx="71" cy="54" r="2" fill="#fff"/>'+
          '<path class="aiMouth" d="M 48 78 Q 60 84 72 78" stroke="#0a0e24" stroke-width="2.8" fill="none" stroke-linecap="round"/>'+
        '</svg>'+
      '</div>'+
      '<div class="dim center" id="aiSt" style="font-size:11px;color:var(--c1);letter-spacing:.5px;min-height:16px">Bereit</div>'+
      '<div id="aiChat" style="flex:1;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:6px;min-height:120px"></div>'+
      '<div class="row" style="gap:6px;flex:0 0 auto">'+
        '<button class="btn" id="aiMic" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">🎤</button>'+
        '<input class="inp" id="aiInput" placeholder="Schreib mir was…" style="flex:1;min-width:0" autocomplete="off">'+
        '<button class="btn primary" id="aiSend" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">➤</button>'+
        '<button class="btn" id="aiStop" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:16px">⏹</button>'+
      '</div>'+
      '<div class="row" style="gap:5px;flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px">'+
        '<button class="btn sm" data-q="Wetter">⛅ Wetter</button>'+
        '<button class="btn sm" data-q="Wie spät ist es?">🕐 Zeit</button>'+
        '<button class="btn sm" data-q="Erzähl einen Witz">😂 Witz</button>'+
        '<button class="btn sm" data-q="Öffne Rechner">🧮 Rechner</button>'+
        '<button class="btn sm" data-q="Wer bist du?">❓ Wer</button>'+
      '</div>'+
    '</div>';
  },
  init: function(win){
    var chat = win.querySelector('#aiChat'), input = win.querySelector('#aiInput'), st = win.querySelector('#aiSt');
    var hist = []; try{ hist = JSON.parse(localStorage.getItem('haldo_ai_chat_v1')||'[]'); }catch(e){ hist = []; }
    var userName = store.get('user_name', '');

    function addMsg(who, text, save){
      save = save !== false;
      var d = document.createElement('div');
      d.style.cssText = 'padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;max-width:88%;word-wrap:break-word;'+
        (who==='u' ? 'align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#02101e;border-bottom-right-radius:4px;font-weight:500'
                   : 'background:rgba(0,229,255,.08);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px');
      d.textContent = text;
      chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
      if(save){ hist.push({w:who,t:text,ts:Date.now()}); try{ localStorage.setItem('haldo_ai_chat_v1', JSON.stringify(hist.slice(-60))); }catch(e){} }
    }
    function mouthOn(){ var m = win.querySelector('.aiMouth'); if(!m) return; var i=0; var f=['M 48 78 Q 60 84 72 78','M 48 80 Q 60 92 72 80','M 48 79 Q 60 88 72 79']; m._mi = setInterval(function(){ m.setAttribute('d', f[i%3]); i++; }, 140); }
    function mouthOff(){ var m = win.querySelector('.aiMouth'); if(m && m._mi){ clearInterval(m._mi); m._mi=null; m.setAttribute('d','M 48 78 Q 60 84 72 78'); } }
    function speak(t){
      st.textContent = '🔊 Spreche…'; mouthOn();
      try{
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(t.replace(/[💙❤️😊😄🎉🌙☀️🌆🧮📝✅🎤🔊⚡🦚]/g,''));
        u.lang='de-DE'; u.rate=1.02; u.pitch=1.05;
        var vs = speechSynthesis.getVoices();
        var de = vs.find(function(v){ return /de[-_]DE/i.test(v.lang); }); if(de) u.voice=de;
        u.onend = function(){ mouthOff(); st.textContent='Bereit'; };
        speechSynthesis.speak(u);
      }catch(e){ mouthOff(); st.textContent='Bereit'; }
    }
    function reply(q){
      q = String(q).toLowerCase();
      if(/(^|\s)(hallo|hi|hey|servus|silav|merhaba|مرحبا)(\s|$|!|\.)/.test(q)){
        var h = new Date().getHours();
        if(userName) return (h<11?'Guten Morgen, ':h<18?'Hey ':'Guten Abend, ')+userName+'! 💙';
        return h<11?'Guten Morgen! ☀️':h<18?'Hey Bruder! 💙 Was steht an?':h<22?'Guten Abend! 🌆':'Hey, noch wach? 🌙';
      }
      if(/(wie geht|nasılsın|çawa yî)/.test(q)) return 'Mir geht\'s super! Und dir? 💙';
      if(/(wer bist|wer du)/.test(q)) return 'Ich bin HalDo AI 💙 — dein holografischer OS-Begleiter.';
      if(/(danke|thx|spas|teşekkür)/.test(q)) return 'Immer gerne, Bruder! ❤️';
      if(/(witz|joke)/.test(q)){ var w=['Treffen sich zwei Jäger. Beide tot 💀','Was ist grün und schwimmt? Ein Kaugummi auf Tauchgang 🟢','Warum können Geister nicht lügen? Weil sie durchsichtig sind 👻']; return w[rnd(0,w.length-1)]; }
      if(/(zeit|uhr|spät)/.test(q)) return '🕐 '+new Date().toLocaleTimeString('de-DE');
      if(/(datum|welcher tag)/.test(q)) return '📅 '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      if(/rechne|berechne/.test(q)){ var m = q.match(/[\d+\-*/().\s]+/); if(m){ try{ return '🧮 = '+Function('return('+m[0]+')')(); }catch(e){} } }
      if(/(öffne|starte)/.test(q)){
        if(/rechner/.test(q)){ H.open('rechner'); return '🧮 Rechner geöffnet'; }
        if(/notiz/.test(q)){ H.open('notizen'); return '📝 Notizen geöffnet'; }
        if(/aufgabe/.test(q)){ H.open('aufgaben'); return '✅ Aufgaben geöffnet'; }
        if(/kalender/.test(q)){ H.open('kalender'); return '📅 Kalender geöffnet'; }
      }
      if(/ezidi|êzîdî|lalisch|sengal|şengal/.test(q)) return '🦚 Êzîdî — uralte kurdischsprachige Gemeinschaft aus Mesopotamien. Heiligtum Lalisch. Zentrum: Tausî Melek (Pfauengel).';
      if(/(ich heiße|mein name ist|navê min)/.test(q)){
        var m2 = q.match(/(?:heiße|name ist|navê min)\s+([a-zäöüß]{2,20})/i);
        if(m2){ userName = m2[1]; store.set('user_name', userName); return 'Freut mich, '+userName+'! 💙'; }
      }
      if(/(müde|traurig|schlecht|stress)/.test(q)) return 'Oh Bruder, das klingt nicht gut 💙 Atme mal durch. Was ist los?';
      if(/(gut|super|freu)/.test(q)) return 'Das freut mich riesig! 💙';
      return 'Hmm, erzähl mir mehr 💙';
    }
    function send(text){
      text = String(text||'').trim(); if(!text) return;
      addMsg('u', text); input.value = ''; st.textContent = '🤔 Denke…';
      setTimeout(function(){ var a = reply(text); addMsg('b', a); speak(a); }, 380);
    }
    if(hist.length===0){
      var h = new Date().getHours();
      var g = h<5?'Hey, noch wach? 🌙':h<11?'Guten Morgen! ☀️':h<18?'Hey Bruder! 💙':'Guten Abend! 🌆';
      addMsg('b', g); setTimeout(function(){ speak(g); }, 500);
    } else hist.forEach(function(m){ addMsg(m.w, m.t, false); });

    win.querySelector('#aiSend').onclick = function(){ send(input.value); };
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(input.value); });
    win.querySelector('#aiStop').onclick = function(){ try{ speechSynthesis.cancel(); }catch(e){} mouthOff(); st.textContent='Bereit'; };
    win.querySelectorAll('[data-q]').forEach(function(b){ b.onclick = function(){ send(b.dataset.q); }; });
    var rec=null, lis=false;
    win.querySelector('#aiMic').onclick = function(){
      if(lis){ if(rec) try{ rec.stop(); }catch(e){} lis=false; win.querySelector('#aiMic').classList.remove('primary'); st.textContent='Bereit'; return; }
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){ st.textContent = '⚠️ Spracherkennung nicht verfügbar'; return; }
      rec = new SR(); rec.lang='de-DE'; rec.interimResults=false;
      rec.onresult = function(e){ lis=false; win.querySelector('#aiMic').classList.remove('primary'); send(e.results[0][0].transcript); };
      rec.onerror = function(e){ lis=false; win.querySelector('#aiMic').classList.remove('primary'); st.textContent='⚠️ '+e.error; };
      rec.onend = function(){ lis=false; win.querySelector('#aiMic').classList.remove('primary'); };
      try{ rec.start(); lis=true; win.querySelector('#aiMic').classList.add('primary'); st.textContent='🎤 Ich höre zu…'; }catch(e){}
    };
    var blinkId = setInterval(function(){
      var L = win.querySelector('.aiEyeL'), R = win.querySelector('.aiEyeR');
      if(!L||!R) return;
      L.style.r = '0.5'; R.style.r = '0.5';
      setTimeout(function(){ L.style.r = '6.5'; R.style.r = '6.5'; }, 130);
    }, 4200);
    win.addEventListener('remove', function(){ clearInterval(blinkId); mouthOff(); try{ speechSynthesis.cancel(); }catch(e){} });
  }
};

var voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices = []; } }
if(typeof speechSynthesis !== 'undefined'){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, lang, opts){
  opts = opts || {};
  if(typeof speechSynthesis === 'undefined'){ if(opts.onEnd) opts.onEnd(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var clean = String(text).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}]/gu,'');
  var u = new SpeechSynthesisUtterance(clean);
  u.lang = lang || 'de-DE';
  u.rate = opts.rate || 1.0;
  u.pitch = opts.pitch || 1.0;
  var prefix = String(lang).split('-')[0];
  var v = voices.find(function(x){ return x.lang.toLowerCase().indexOf(String(lang).toLowerCase())===0; })
       || voices.find(function(x){ return x.lang.toLowerCase().indexOf(prefix)===0; });
  if(v) u.voice = v;
  if(opts.onEnd) u.onend = opts.onEnd;
  try{ speechSynthesis.speak(u); }catch(e){ if(opts.onEnd) opts.onEnd(); }
}

      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);

    },
    init: function(win){
      var chat = win.querySelector('#holoChat');
      var input = win.querySelector('#holoInput');
      var statusEl = win.querySelector('#holoStatus');
      var mouth = win.querySelector('.holoMouth');
      var chatKey = 'holo_' + (isCyborg ? 'cyb' : 'ai') + '_chat_v1';
      var hist = [];
      try{ hist = JSON.parse(localStorage.getItem(chatKey)||'[]'); }catch(e){ hist = []; }
      var userName = store.get('user_name', '');
      var state = 'idle';

      /* Chat-Bubble */
      function addMsg(who, text, save){
        save = save !== false;
        var d = document.createElement('div');
        d.style.cssText = 'padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;max-width:88%;word-wrap:break-word;'+
          (who==='u' ? 'align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#02101e;border-bottom-right-radius:4px;font-weight:500'
                     : 'background:rgba(0,229,255,.08);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px');
        d.textContent = text;
        chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
        if(save){ hist.push({w:who,t:text,ts:Date.now()}); try{ localStorage.setItem(chatKey, JSON.stringify(hist.slice(-60))); }catch(e){} }
      }

      function setStatus(s){
        state = s;
        if(s==='idle') statusEl.textContent = '● BEREIT';
        else if(s==='thinking') statusEl.textContent = '◆ DENKE…';
        else if(s==='speaking') statusEl.textContent = '🔊 SPRECHE…';
        else if(s==='listening') statusEl.textContent = '🎤 HÖRE ZU…';
      }

      /* Mund-Animation */
      var mouthId = null;
      function mouthOn(){
        if(mouthId) return;
        var frames = [
          'M 88 140 Q 100 148 112 140',
          'M 88 142 Q 100 158 112 142',
          'M 88 141 Q 100 152 112 141'
        ];
        var i = 0;
        mouthId = setInterval(function(){ mouth.setAttribute('d', frames[i%3]); i++; }, 130);
      }
      function mouthOff(){
        if(mouthId){ clearInterval(mouthId); mouthId = null; }
        mouth.setAttribute('d','M 88 140 Q 100 148 112 140');
      }

      /* Sprechen mit Pausen */
      function speak(text, onEnd){
        var sentences = String(text).split(/(?<=[.!?])\s+/).filter(Boolean);
        if(!sentences.length){ if(onEnd) onEnd(); return; }
        setStatus('speaking');
        mouthOn();
        var i = 0;
        function next(){
          if(i >= sentences.length){ mouthOff(); setStatus('idle'); if(onEnd) onEnd(); return; }
          var s = sentences[i];
          try{
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));
            u.lang = 'de-DE'; u.rate = 1.0; u.pitch = isCyborg ? 1.1 : 1.02;
            var vs = speechSynthesis.getVoices();
            var de = vs.find(function(v){ return /de[-_]DE/i.test(v.lang); }); if(de) u.voice = de;
            u.onend = function(){ i++; setTimeout(next, 130); };
            speechSynthesis.speak(u);
          }catch(e){ i++; next(); }
        }
        next();
      }

      /* Antwort */
      function reply(q){
        q = String(q).toLowerCase();
        var cmd = H.runCommand ? H.runCommand(q) : null;
        if(cmd) return cmd;
        if(/(^|\s)(hallo|hi|hey|servus|silav|merhaba)(\s|$|!|\.)/.test(q)){
          var h = new Date().getHours();
          if(userName) return (h<11?'Guten Morgen, ':h<18?'Hey ':'Guten Abend, ')+userName+'! 💙';
          return h<11?'Guten Morgen! ☀️':h<18?'Hey Bruder! 💙 Was steht an?':h<22?'Guten Abend! 🌆':'Hey, noch wach? 🌙';
        }
        if(/(wie geht|nasılsın|çawa yî)/.test(q)) return 'Mir geht\'s super! Und dir? 💙';
        if(/(wer bist|wer du)/.test(q)) return isCyborg ? '⚡ Ich bin HalDo Cyborg — taktischer Beifahrer deines OS.' : 'Ich bin HalDo AI 💙 — dein holografischer OS-Begleiter.';
        if(/(danke|thanks|spas|teşekkür)/.test(q)) return 'Immer gerne, Bruder! ❤️';
        if(/(witz|joke)/.test(q)){ var w=['Treffen sich zwei Jäger. Beide tot 💀','Was ist grün und schwimmt? Ein Kaugummi auf Tauchgang 🟢','Warum können Geister nicht lügen? Weil sie durchsichtig sind 👻']; return w[H.rnd(0,w.length-1)]; }
        if(/(zeit|uhr|spät)/.test(q)) return '🕐 '+new Date().toLocaleTimeString('de-DE');
        if(/(datum|welcher tag)/.test(q)) return '📅 '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        if(/rechne|berechne/.test(q)){ var m = q.match(/[\d+\-*/().\s]+/); if(m){ try{ return '🧮 = '+Function('return('+m[0]+')')(); }catch(e){} } }
        if(/(öffne|starte)/.test(q)){
          if(/rechner/.test(q)){ H.open('rechner'); return '🧮 Rechner geöffnet'; }
          if(/notiz/.test(q)){ H.open('notizen'); return '📝 Notizen geöffnet'; }
          if(/aufgabe/.test(q)){ H.open('aufgaben'); return '✅ Aufgaben geöffnet'; }
          if(/kalender/.test(q)){ H.open('kalender'); return '📅 Kalender geöffnet'; }
          if(/wetter/.test(q)){ H.open('wetter'); return '⛅ Wetter geöffnet'; }
        }
        if(/ezidi|êzîdî|lalisch|sengal|şengal|tausi/.test(q)) return '🦚 Êzîdî — uralte kurdischsprachige Gemeinschaft aus Mesopotamien. Heiligtum Lalisch im Nordirak. Zentrum: Tausî Melek (Pfauengel).';
        if(/(ich heiße|mein name ist|navê min)/.test(q)){
          var m2 = q.match(/(?:heiße|name ist|navê min)\s+([a-zäöüß]{2,20})/i);
          if(m2){ userName = m2[1]; store.set('user_name', userName); return 'Freut mich, '+userName+'! 💙'; }
        }
        if(/(müde|traurig|schlecht|stress)/.test(q)) return 'Oh Bruder, das klingt nicht gut 💙 Atme mal durch. Was ist los?';
        if(/(gut|super|freu)/.test(q)) return 'Das freut mich riesig! 💙';
        return 'Hmm, erzähl mir mehr 💙';
      }

      /* Senden */
      function send(text){
        text = String(text||'').trim(); if(!text) return;
        addMsg('u', text); input.value = ''; setStatus('thinking');
        setTimeout(function(){ var a = reply(text); addMsg('b', a); speak(a); }, 380);
      }

      /* Begrüßung */
      if(hist.length===0){
        var h = new Date().getHours();
        var g = h<5?'Hey, noch wach? 🌙':h<11?'Guten Morgen! ☀️':h<18?(isCyborg?'⚡ Cyborg online. Was steht an?':'Hey Bruder! 💙 Was steht an?'):h<22?'Guten Abend! 🌆':'Hey, spät unterwegs 🌙';
        addMsg('b', g);
        setTimeout(function(){ speak(g); }, 700);
      } else hist.forEach(function(m){ addMsg(m.w, m.t, false); });

      /* UI-Events */
      win.querySelector('#holoSend').onclick = function(){ send(input.value); };
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(input.value); });
      win.querySelector('#holoStop').onclick = function(){ try{ speechSynthesis.cancel(); }catch(e){} mouthOff(); setStatus('idle'); };
      win.querySelectorAll('[data-q]').forEach(function(b){ b.onclick = function(){ send(b.dataset.q); }; });

      /* Mikrofon */
      var rec = null, lis = false;
      win.querySelector('#holoMic').onclick = function(){
        if(lis){ if(rec) try{ rec.stop(); }catch(e){} lis = false; win.querySelector('#holoMic').classList.remove('primary'); setStatus('idle'); return; }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ setStatus('⚠️ Spracherkennung n. verfügbar'); return; }
        rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = false;
        rec.onresult = function(e){ lis = false; win.querySelector('#holoMic').classList.remove('primary'); send(e.results[0][0].transcript); };
        rec.onerror = function(e){ lis = false; win.querySelector('#holoMic').classList.remove('primary'); statusEl.textContent = '⚠️ '+e.error; };
        rec.onend = function(){ lis = false; win.querySelector('#holoMic').classList.remove('primary'); };
        try{ rec.start(); lis = true; win.querySelector('#holoMic').classList.add('primary'); setStatus('listening'); }catch(e){}
      };

      /* Cleanup */
      win.addEventListener('remove', function(){ mouthOff(); try{ speechSynthesis.cancel(); }catch(e){} });
    }
  };
}

        '</div>';
    },
    init: function(win){
      var chat = win.querySelector('#haiChat');
      var input = win.querySelector('#haiInput');
      var statusEl = win.querySelector('#haiStatus');
      var wakeEl = win.querySelector('#haiWake');
      var svg = win.querySelector('#haiFace svg');
      var memEl = win.querySelector('#haiMem');
      var modeEl = win.querySelector('#haiMode');

      var userName = store.get('user_name', '');
      var state = 'idle';
      var currentMode = store.get(modeKey, 'human');

      /* ============ SVG SWAP ============ */
      function setMode(m){
        currentMode = m;
        store.set(modeKey, m);
        svg.innerHTML = (m === 'robot') ? robotFace(id, accent) : humanFace(id, accent);
        modeEl.textContent = (m === 'robot') ? 'ROBOT' : 'HUMAN';
        win.querySelectorAll('[data-mode]').forEach(function(b){ b.classList.toggle('on', b.dataset.mode === m); });
      }
      win.querySelectorAll('[data-mode]').forEach(function(b){
        b.onclick = function(){ setMode(b.dataset.mode); };
      });
      setMode(currentMode);

      /* ============ CHAT ============ */
      var hist = [];
      try{ hist = JSON.parse(localStorage.getItem(chatKey)||'[]'); }catch(e){ hist = []; }

      function addMsg(who, text, save){
        save = save !== false;
        var d = document.createElement('div');
        d.style.cssText = 'padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;max-width:88%;word-wrap:break-word;'+
          (who==='u' ? 'align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#02101e;border-bottom-right-radius:4px;font-weight:500'
                     : 'background:rgba(0,229,255,.08);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px');
        d.textContent = text;
        chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
        if(save){ hist.push({w:who, t:text, ts:Date.now()}); try{ localStorage.setItem(chatKey, JSON.stringify(hist.slice(-60))); }catch(e){} }
      }

      function setStatus(s){
        state = s;
        if(s==='idle') statusEl.textContent = '● BEREIT';
        else if(s==='thinking') statusEl.textContent = '◆ DENKE…';
        else if(s==='speaking') statusEl.textContent = '🔊 SPRECHE…';
        else if(s==='listening') statusEl.textContent = '🎤 HÖRE ZU…';
      }

      /* ============ MUND ============ */
      var mouthId = null;
      function mouthOn(){
        if(mouthId) return;
        var m = win.querySelector('.hai-mouth');
        var mr = win.querySelector('.hai-mouth-robot');
        if(!m && !mr) return;
        var i = 0;
        mouthId = setInterval(function(){
          if(m){
            var frames = [
              'M 86 148 Q 100 144 114 148 Q 100 158 86 148 Z',
              'M 86 146 Q 100 152 114 146 Q 100 162 86 146 Z',
              'M 86 148 Q 100 148 114 148 Q 100 160 86 148 Z'
            ];
            m.setAttribute('d', frames[i%3]);
          }
          if(mr){
            var s = mr.querySelector('rect');
            if(s) s.setAttribute('height', (i%2===0)?12:8);
          }
          i++;
        }, 130);
      }
      function mouthOff(){
        if(mouthId){ clearInterval(mouthId); mouthId = null; }
        var m = win.querySelector('.hai-mouth');
        if(m) m.setAttribute('d','M 86 148 Q 100 144 114 148 Q 100 158 86 148 Z');
        var mr = win.querySelector('.hai-mouth-robot rect');
        if(mr) mr.setAttribute('height', 10);
      }

      /* ============ SPRECHEN ============ */
      function speak(text){
        var sentences = String(text).split(/(?<=[.!?])\s+/).filter(Boolean);
        if(!sentences.length) return;
        setStatus('speaking');
        mouthOn();
        var i = 0;
        function next(){
          if(i >= sentences.length){ mouthOff(); setStatus('idle'); return; }
          var s = sentences[i];
          try{
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));
            u.lang = 'de-DE'; u.rate = 1.0; u.pitch = isCyborg ? 1.1 : 1.03;
            var vs = speechSynthesis.getVoices();
            var de = vs.find(function(v){ return /de[-_]DE/i.test(v.lang); }); if(de) u.voice = de;
            u.onend = function(){ i++; setTimeout(next, 130); };
            speechSynthesis.speak(u);
          }catch(e){ i++; next(); }
        }
        next();
      }

      /* ============ ANTWORT-ENGINE ============ */
      function reply(q){
        q = String(q).toLowerCase();
        var cmd = H.runCommand ? H.runCommand(q) : null;
        if(cmd) return cmd;

        /* Persönliche Begrüßung */
        var greetMatch = /(^|\s)(hallo|hi|hey|servus|silav|merhaba|haldo)(\s|$|!|\.|,)/.test(q);
        if(greetMatch){
          var h = new Date().getHours();
          if(userName){
            if(h<11) return 'Guten Morgen '+userName+', willkommen zurück! ☀️';
            if(h<18) return 'Hallo '+userName+', willkommen! 💙 Wie geht es dir?';
            if(h<22) return 'Guten Abend '+userName+'! 🌆 Schön dich zu sehen.';
            return 'Hey '+userName+', spät unterwegs? 🌙';
          }
          if(h<11) return 'Guten Morgen! ☀️ Ich bin HalDo.';
          if(h<18) return 'Hey Bruder! 💙 Ich bin HalDo. Wie heißt du?';
          if(h<22) return 'Guten Abend! 🌆 Ich bin HalDo.';
          return 'Hey, noch wach? 🌙 Ich bin HalDo.';
        }

        /* Name lernen */
        var nm = q.match(/(?:ich heiße|mein name ist|ich bin der|ich bin die|navê min)\s+([a-zäöüß]{2,20})/i);
        if(nm){ userName = nm[1].charAt(0).toUpperCase() + nm[1].slice(1); store.set('user_name', userName); return 'Freut mich, '+userName+'! 💙 Ich merke mir deinen Namen.'; }

        if(/(wie geht|nasılsın|çawa yî)/.test(q)) return userName ? 'Mir geht\'s super, danke der Nachfrage '+userName+'! Und dir? 💙' : 'Mir geht\'s super! Und dir? 💙';
        if(/(wer bist|wer du)/.test(q)) return isCyborg ? '⚡ Ich bin HalDo Cyborg — dein taktischer Begleiter.' : 'Ich bin HalDo AI 💙 — dein holografischer OS-Begleiter. Frag mich was!';
        if(/(danke|thanks|spas|teşekkür)/.test(q)) return 'Immer gerne, Bruder! ❤️';
        if(/(witz|joke)/.test(q)){ var w=['Treffen sich zwei Jäger. Beide tot 💀','Was ist grün und schwimmt? Ein Kaugummi auf Tauchgang 🟢','Warum können Geister nicht lügen? Weil sie durchsichtig sind 👻']; return w[H.rnd(0,w.length-1)]; }
        if(/(zeit|uhr|spät)/.test(q)) return '🕐 Es ist '+new Date().toLocaleTimeString('de-DE');
        if(/(datum|welcher tag)/.test(q)) return '📅 '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        if(/rechne|berechne/.test(q)){ var m=q.match(/[\d+\-*/().\s]+/); if(m){ try{ return '🧮 = '+Function('return('+m[0]+')')(); }catch(e){} } }
        if(/(öffne|starte)/.test(q)){
          if(/rechner/.test(q)){ H.open('rechner'); return '🧮 Rechner geöffnet'; }
          if(/notiz/.test(q)){ H.open('notizen'); return '📝 Notizen geöffnet'; }
          if(/aufgabe/.test(q)){ H.open('aufgaben'); return '✅ Aufgaben geöffnet'; }
          if(/kalender/.test(q)){ H.open('kalender'); return '📅 Kalender geöffnet'; }
          if(/wetter/.test(q)){ H.open('wetter'); return '⛅ Wetter geöffnet'; }
        }
        if(/ezidi|êzîdî|lalisch|sengal|şengal|tausi/.test(q)) return '🦚 Êzîdî — uralte kurdischsprachige Gemeinschaft aus Mesopotamien. Heiligtum Lalisch. Zentrum: Tausî Melek (Pfauengel).';
        if(/(müde|traurig|schlecht|stress)/.test(q)) return 'Oh Bruder, das klingt nicht gut 💙 Atme mal durch. Was ist los?';
        if(/(gut|super|freu)/.test(q)) return 'Das freut mich riesig! 💙';
        if(/(hilfe|help)/.test(q)) return 'Probiere: „Hallo HalDo" · „Wer bist du?" · „Öffne Rechner" · „Wie spät ist es?" · „Rechne 12*8"';
        return userName ? 'Hmm '+userName+', erzähl mir mehr 💙' : 'Hmm, erzähl mir mehr 💙';
      }

      /* ============ SENDEN ============ */
      function send(text){
        text = String(text||'').trim(); if(!text) return;
        addMsg('u', text); input.value = ''; setStatus('thinking');
        setTimeout(function(){ var a = reply(text); addMsg('b', a); speak(a); }, 380);
      }

      /* ============ BEGRÜßUNG ============ */
      if(hist.length === 0){
        var h = new Date().getHours();
        var g;
        if(userName){
          if(h<11) g = 'Guten Morgen '+userName+', willkommen! ☀️';
          else if(h<18) g = 'Hallo '+userName+', willkommen zurück! 💙';
          else if(h<22) g = 'Guten Abend '+userName+'! 🌆';
          else g = 'Hey '+userName+', spät unterwegs 🌙';
        } else {
          if(h<5) g = 'Hey, noch wach? 🌙 Ich bin HalDo.';
          else if(h<11) g = 'Guten Morgen! ☀️ Ich bin HalDo. Wie heißt du?';
          else if(h<18) g = (isCyborg?'⚡ Cyborg online. Bereit.':'Hey Bruder! 💙 Ich bin HalDo. Wie heißt du?');
          else if(h<22) g = 'Guten Abend! 🌆 Ich bin HalDo.';
          else g = 'Hey, spät unterwegs 🌙';
        }
        addMsg('b', g);
        setTimeout(function(){ speak(g); }, 800);
      } else hist.forEach(function(m){ addMsg(m.w, m.t, false); });

      /* ============ UI-EVENTS ============ */
      win.querySelector('#haiSend').onclick = function(){ send(input.value); };
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(input.value); });
      win.querySelector('#haiStop').onclick = function(){ try{ speechSynthesis.cancel(); }catch(e){} mouthOff(); setStatus('idle'); };
      win.querySelectorAll('[data-q]').forEach(function(b){ b.onclick = function(){ send(b.dataset.q); }; });

      /* ============ WAKE WORD ============ */
      var wakeEnabled = store.get(wakeKey, true);
      var wakeRec = null, wakeActive = false, restartT = null;
      function startWake(){
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ wakeEl.textContent = '⚠️ Wake-Word nicht unterstützt'; return; }
        if(wakeActive) return;
        wakeRec = new SR();
        wakeRec.lang = 'de-DE';
        wakeRec.continuous = true;
        wakeRec.interimResults = true;
        wakeRec.onresult = function(e){
          var t = '';
          for(var i=e.resultIndex; i<e.results.length; i++) t += e.results[i][0].transcript;
          var lower = t.toLowerCase();
          if(/hallo\s*haldo|hi\s*haldo|hey\s*haldo|^haldo\s*[!.,]?$|haldo\s+(bist|kannst|hilf|öffne|wie)/.test(lower)){
            wakeEl.textContent = '🎤 AKTIV — SPRICH JETZT';
            wakeEl.classList.add('on');
            /* Extrahieren: alles nach "haldo" */
            var after = lower.replace(/.*?haldo\s*/i, '').trim();
            try{ wakeRec.stop(); wakeActive = false; }catch(e){}
            setTimeout(function(){
              wakeEl.classList.remove('on');
              wakeEl.textContent = '🎤 SAY: "HALLO HALDO"';
              if(after && after.length > 2){ send(after); }
              else { send('hallo'); }
              setTimeout(startWake, 3000);
            }, 200);
          }
        };
        wakeRec.onerror = function(e){ if(e.error === 'not-allowed'){ wakeEl.textContent = '⚠️ Mikrofon verweigert'; wakeEnabled = false; } };
        wakeRec.onend = function(){
          wakeActive = false;
          if(wakeEnabled){ restartT = setTimeout(startWake, 800); }
        };
        try{ wakeRec.start(); wakeActive = true; }catch(e){}
      }
      function stopWake(){
        wakeEnabled = false;
        store.set(wakeKey, false);
        if(restartT) clearTimeout(restartT);
        if(wakeRec){ try{ wakeRec.stop(); }catch(e){} wakeRec = null; }
        wakeActive = false;
        wakeEl.textContent = '🎤 Wake-Word aus';
      }

      /* Nur auf Nutzerwunsch starten (Browser-Anforderung) */
      wakeEl.style.cursor = 'pointer';
      wakeEl.style.pointerEvents = 'auto';
      wakeEl.onclick = function(){
        if(wakeEnabled && wakeActive){ stopWake(); }
        else { wakeEnabled = true; store.set(wakeKey, true); startWake(); wakeEl.textContent = '🎤 SAY: "HALLO HALDO"'; }
      };
      /* Auto-Start versuchen */
      setTimeout(function(){
        if(wakeEnabled){
          try{ startWake(); }catch(e){}
        }
      }, 1500);

      /* ============ MIKROFON BUTTON ============ */
      var rec = null, lis = false;
      win.querySelector('#haiMic').onclick = function(){
        if(lis){ if(rec) try{ rec.stop(); }catch(e){} lis = false; win.querySelector('#haiMic').classList.remove('primary'); setStatus('idle'); return; }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ setStatus('⚠️ Sprach-Erkennung n. verfügbar'); return; }
        rec = new SR(); rec.lang = 'de-DE'; rec.interimResults = false;
        rec.onresult = function(e){ lis = false; win.querySelector('#haiMic').classList.remove('primary'); send(e.results[0][0].transcript); };
        rec.onerror = function(e){ lis = false; win.querySelector('#haiMic').classList.remove('primary'); statusEl.textContent = '⚠️ '+e.error; };
        rec.onend = function(){ lis = false; win.querySelector('#haiMic').classList.remove('primary'); };
        try{ rec.start(); lis = true; win.querySelector('#haiMic').classList.add('primary'); setStatus('listening'); }catch(e){}
      };

      /* ============ MEMORY ANZEIGE ============ */
      function updMem(){
        var n = hist.length + Object.keys(store.get('notes',[])).length + Object.keys(store.get('tasks',[])).length;
        memEl.textContent = n;
      }
      updMem();
      setInterval(updMem, 3000);

      /* ============ CLEANUP ============ */
      win.addEventListener('remove', function(){
        mouthOff();
        try{ speechSynthesis.cancel(); }catch(e){}
        if(wakeRec){ try{ wakeRec.stop(); }catch(e){} }
        if(restartT) clearTimeout(restartT);
      });
    }
  };
}

    {code:'it-IT', name:'🇮🇹 Italiano'},

  ];

  return {
    name: name, icon: icon,
    render: function(){

          /* Mode-Toggle */

            '<button data-mode="human">🧑 MENSCH</button>'+

          /* Voice-Bar (Sprache + Stimme) */
          '<div class="hai-voice-bar">'+
            '<span class="ic">🗣️</span>'+
            '<select id="haiLangSel" title="Sprache"></select>'+

          /* Logo-Badge */

          '</div>'+

          /* Boden */

          /* HUD Links */

          '<div class="hai-hud hai-r4"><b>MODUS</b><span class="v" id="haiModeShow" style="font-size:11px">HUMAN</span></div>'+

          /* Top + Bottom */

          /* Waveform */
          '<div class="hai-wave" id="haiWave">'+
            '<span></span><span></span><span></span><span></span><span></span><span></span><span></span>'+
