<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root{
  --bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;user-select:none}
body{font-family:var(--font);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ===== 3D HINTERGRUND ===== */
#cosmos-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
#cyborg-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* ===== WELCOME ===== */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);transition:opacity 0.5s}
#welcome.hide{opacity:0;pointer-events:none}
#welcome h1{font-size:clamp(32px,5.5vw,64px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(251,191,36,.8)}
#welcome h2{font-size:clamp(16px,2vw,22px);color:#e5e7eb;font-weight:400;line-height:1.6}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase}
#welcome .presented b{color:#fbbf24}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s}
#welcome .enter-btn:hover{transform:scale(1.05)}

/* ===== TASKBAR ===== */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(17,24,39,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 20px;gap:10px;z-index:9997}
#taskbar.show{display:flex}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:8px 16px;border-radius:8px;font-weight:bold;display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow:hidden}
.taskbar-app{background:rgba(55,65,81,.5);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent}
.taskbar-app:hover{border-color:var(--accent);background:rgba(31,41,55,.8)}
.taskbar-app.active{border-color:var(--accent);background:rgba(6,182,212,.2)}
#sys-clock{color:var(--dim);font-size:13px;font-weight:600}

/* ===== START MENÜ ===== */
#start-menu{position:fixed;bottom:60px;left:10px;width:350px;max-height:80vh;background:rgba(17,24,39,.98);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;z-index:9998;box-shadow:0 -10px 40px rgba(0,0,0,.8)}
#start-menu.show{display:flex}
.sm-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--accent)}
.sm-search{padding:10px;border-bottom:1px solid var(--border)}
.sm-search input{background:rgba(0,0,0,0.3);border:none;padding:8px 12px;border-radius:6px}
.sm-apps{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:10px;border-radius:8px;cursor:pointer;transition:background .2s}
.sm-app-card:hover{background:rgba(55,65,81,.5)}
.sm-app-card .ico{font-size:28px;margin-bottom:6px}
.sm-app-card .nm{font-size:11px;text-align:center;line-height:1.2}

/* ===== WINDOW MANAGER (APPS) ===== */
.window{position:fixed;top:50px;left:50px;width:800px;height:600px;min-width:400px;min-height:300px;background:rgba(10,14,26,.95);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.7);resize:both}
.window-header{padding:12px 16px;background:rgba(0,0,0,0.4);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none}
.window-title{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:10px}
.window-controls{display:flex;gap:8px}
.win-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);transition:background .2s}
.win-btn:hover{background:rgba(255,255,255,0.2)}
.win-btn.close:hover{background:var(--danger)}
.window-body{flex:1;overflow-y:auto;padding:20px}

/* ===== SPLASH & PANELS ===== */
#app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%, rgba(6,182,212,.2) 0%, rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px)}
#app-splash.show{display:flex;animation:splashIn .3s}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);animation:starGlow 1.2s ease-out}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash-presented{font-size:12px;color:var(--dim);letter-spacing:4px;text-transform:uppercase}
.splash-presented b{color:#fbbf24}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg)}50%{transform:scale(1.2) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}

.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.btn{padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;transition:all .2s;display:inline-block}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.list-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center}
.list-item:hover{background:rgba(31,41,55,.95);border-color:var(--accent)}
.list-item .title{font-weight:600;margin-bottom:4px}
.list-item .meta{color:var(--dim);font-size:12px}
.badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info{flex:1}
.settings-row .ctrl{flex-shrink:0;margin-left:16px;min-width:150px}
#glb-uploader{position:fixed;bottom:60px;right:20px;z-index:50;background:rgba(0,0,0,0.8);padding:12px;border-radius:12px;border:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:12px}
</style>
</head>

<script>
/* ================= 3D KOSMOS (FIXED) ================= */
function initCosmos() {
  try {
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 18); 

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // STERNE
    const starGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(8000 * 3);
    const colorArray = new Float32Array(8000 * 3);
    for(let i=0; i<8000*3; i++) {
      posArray[i] = (Math.random() - 0.5) * 400;
      colorArray[i] = Math.random() * 0.5 + 0.5;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.3, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })));

    // SONNE (Prozedurale Textur, kein Fehler)
    const sunCanvas = document.createElement('canvas'); sunCanvas.width = sunCanvas.height = 512;
    const sCtx = sunCanvas.getContext('2d');
    sCtx.fillStyle = '#ffaa00'; sCtx.fillRect(0, 0, 512, 512);
    for(let i=0; i<2000; i++) {
      sCtx.fillStyle = Math.random() > 0.5 ? '#ffdd00' : '#ff5500';
      sCtx.beginPath(); sCtx.arc(Math.random()*512, Math.random()*512, Math.random()*10, 0, Math.PI*2); sCtx.fill();
    }
    const sunTex = new THREE.CanvasTexture(sunCanvas);
    const sun = new THREE.Mesh(new THREE.SphereGeometry(4, 64, 64), new THREE.MeshBasicMaterial({ map: sunTex }));
    sun.position.set(16, 10, -15); scene.add(sun);
    
    // Sonnen-Glow
    const glowCanvas = document.createElement('canvas'); glowCanvas.width = glowCanvas.height = 256;
    const gCtx = glowCanvas.getContext('2d');
    const gGrad = gCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
    gGrad.addColorStop(0, 'rgba(255,200,0,1)'); gGrad.addColorStop(0.5, 'rgba(255,100,0,0.5)'); gGrad.addColorStop(1, 'rgba(0,0,0,0)');
    gCtx.fillStyle = gGrad; gCtx.fillRect(0,0,256,256);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCanvas), transparent: true, blending: THREE.AdditiveBlending }));
    sunGlow.scale.set(25, 25, 1); sunGlow.position.copy(sun.position); scene.add(sunGlow);

    // MOND
    const moon = new THREE.Mesh(new THREE.SphereGeometry(1.8, 64, 64), new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg'), roughness: 0.9 }));
    moon.position.set(-14, 8, -10); scene.add(moon);

    // ERDE
    const earth = new THREE.Mesh(new THREE.SphereGeometry(3.5, 64, 64), new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'), roughness: 0.5, emissive: 0x112244, emissiveIntensity: 1.0 }));
    earth.position.set(0, 0, 0); scene.add(earth);

    // Atmosphäre
    const atm = new THREE.Mesh(new THREE.SphereGeometry(3.65, 64, 64), new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.3, side: THREE.BackSide }));
    atm.position.copy(earth.position); scene.add(atm);

    // TEXT-RING
    const ringCanvas = document.createElement('canvas'); ringCanvas.width = 2048; ringCanvas.height = 128;
    const rCtx = ringCanvas.getContext('2d');
    rCtx.font = 'bold 60px Arial'; rCtx.fillStyle = 'rgba(251, 191, 36, 0.9)'; rCtx.textAlign = 'center'; rCtx.textBaseline = 'middle';
    rCtx.fillText("HALIL DONMA • HALDO AI OS PRO MAX • PROFESSIONALE APP • ", 1024, 64);
    const ringTex = new THREE.CanvasTexture(ringCanvas);
    ringTex.wrapS = THREE.RepeatWrapping; ringTex.repeat.x = 2;
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 4.5, 0.1, 64, 1, true), new THREE.MeshBasicMaterial({ map: ringTex, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false }));
    ring.position.copy(earth.position); ring.rotation.x = Math.PI / 2; scene.add(ring);

    // LICHT
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sunLight = new THREE.DirectionalLight(0xfff8e1, 3.0); sunLight.position.copy(sun.position); scene.add(sunLight);
    const fillLight = new THREE.DirectionalLight(0x3b82f6, 1.5); fillLight.position.set(-10, -5, 10); scene.add(fillLight);

    function animate() {
      requestAnimationFrame(animate);
      earth.rotation.y += 0.001; moon.rotation.y += 0.002; ring.rotation.z -= 0.003; sun.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  } catch (e) { console.error("Kosmos Fehler:", e); }
}

/* ================= 3D MENSCH (ANATOMIE) ================= */
let A = {scene:null, cam:null, ren:null, ctrl:null, current:null};
function initCyborg() {
  try {
    const canvas = document.getElementById('cyborg-canvas');
    A.scene = new THREE.Scene();
    A.cam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    A.cam.position.set(0, 1.2, 4);
    A.ren = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    A.ren.setSize(window.innerWidth, window.innerHeight); A.ren.setPixelRatio(Math.min(window.devicePixelRatio, 2)); A.ren.setClearColor(0x000000, 0);
    A.ctrl = new THREE.OrbitControls(A.cam, A.ren.domElement); A.ctrl.enableDamping = true; A.ctrl.enablePan = false; A.ctrl.enableZoom = true; A.ctrl.minDistance = 1.0; A.ctrl.maxDistance = 8;
    A.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(3, 4, 5); A.scene.add(d1);
    const d2 = new THREE.DirectionalLight(0x06b6d4, 1.5); d2.position.set(-3, 2, -5); A.scene.add(d2);
    const loader = new THREE.GLTFLoader();
    function loadModel(url, isManual = false) {
      loader.load(url, (gltf) => {
        if(A.current) A.scene.remove(A.current);
        const m = gltf.scene; m.traverse(o => { if(o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
        A.scene.add(m); A.current = m;
        const box = new THREE.Box3().setFromObject(m); const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
        m.position.x = -center.x; m.position.y = -box.min.y; m.position.z = -center.z;
        const maxDim = Math.max(size.x, size.y, size.z); const fov = A.cam.fov * (Math.PI / 180);
        let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.3;
        A.cam.position.set(0, size.y / 2, cameraZ); A.ctrl.target.set(0, size.y / 2, 0); A.ctrl.update();
        document.getElementById('glb-uploader').style.display = 'none';
      }, undefined, (err) => {
        if (!isManual) {
          document.getElementById('glb-uploader').style.borderColor = 'var(--danger)';
          const geo = new THREE.CapsuleGeometry(0.3, 1.2, 16, 32); const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true, transparent: true, opacity: 0.5 });
          const mesh = new THREE.Mesh(geo, mat); mesh.position.y = 0.9; A.scene.add(mesh); A.cam.position.set(0, 1, 3); A.ctrl.target.set(0, 1, 0);
        }
      });
    }
    loadModel('./male_base.glb');
    document.getElementById('manual-glb').addEventListener('change', function(e) {
      const file = e.target.files[0]; if (!file) return; loadModel(URL.createObjectURL(file), true);
    });
    (function loop() { requestAnimationFrame(loop); A.ctrl.update(); A.ren.render(A.scene, A.cam); })();
    window.addEventListener('resize', () => { A.cam.aspect = window.innerWidth / window.innerHeight; A.cam.updateProjectionMatrix(); A.ren.setSize(window.innerWidth, window.innerHeight); });
  } catch (e) { console.error("Cyborg Fehler:", e); }
}

/* ================= TÖNE & SPLASH ================= */
let audioCtx = null;
function playTone(type) {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const patterns = { glass: [{f:1760,t:'sine',d:0.6},{f:2637,t:'sine',d:0.6}], chime: [{f:880,t:'sine',d:0.4},{f:1320,t:'sine',d:0.4}] };
    const notes = patterns[type] || patterns.glass; let t = 0;
    notes.forEach(n => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = n.f; o.type = n.t;
      const st = audioCtx.currentTime + t; g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.2, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + n.d);
      o.start(st); o.stop(st + n.d + 0.1); t += 0.1;
    });
  } catch(e) {}
}

function showAppSplash(icon, name) {
  const el = document.getElementById('app-splash');
  el.querySelector('.splash-icon').textContent = icon;
  el.querySelector('.splash-name').textContent = name;
  el.classList.add('show');
  playTone('glass');
  setTimeout(() => el.classList.remove('show'), 1200);
}

/* ================= WINDOW MANAGER ================= */
const openWindows = {}; // Tracks open windows

function openApp(id) {
  const appDef = REGISTRY.find(a => a.id === id);
  if(!appDef) return;
  
  showAppSplash(appDef.ico, appDef.nm);
  document.getElementById('start-menu').classList.remove('show');
  
  if (openWindows[id]) {
    // Fokus auf existierendes Fenster
    const win = document.getElementById('win-' + id);
    win.style.zIndex = getNextZIndex();
    return;
  }

  const win = document.createElement('div');
  win.className = 'window';
  win.id = 'win-' + id;
  win.style.width = appDef.defW + 'px';
  win.style.height = appDef.defH + 'px';
  win.style.left = (100 + Object.keys(openWindows).length * 30) + 'px';
  win.style.top = (50 + Object.keys(openWindows).length * 30) + 'px';
  win.style.zIndex = getNextZIndex();
  
  win.innerHTML = `
    <div class="window-header" onmousedown="startDrag(event, '${id}')">
      <div class="window-title">${appDef.ico} ${appDef.nm}</div>
      <div class="window-controls">
        <button class="win-btn close" onclick="closeApp('${id}')">✕</button>
      </div>
    </div>
    <div class="window-body" id="body-${id}"></div>
  `;
  
  document.body.appendChild(win);
  openWindows[id] = true;
  
  // Taskbar update
  const tb = document.getElementById('taskbar-apps');
  tb.innerHTML += `<div class="taskbar-app" id="tb-${id}" onclick="focusApp('${id}')">${appDef.ico} ${appDef.nm}</div>`;
  
  // Render app specific content
  setTimeout(() => {
    appDef.fn(document.getElementById('body-' + id));
  }, 50);
}

function closeApp(id) {
  const win = document.getElementById('win-' + id);
  if(win) win.remove();
  const tb = document.getElementById('tb-' + id);
  if(tb) tb.remove();
  delete openWindows[id];
}

function focusApp(id) {
  const win = document.getElementById('win-' + id);
  if(win) win.style.zIndex = getNextZIndex();
}

let zIndexCounter = 20;
function getNextZIndex() { return zIndexCounter++; }

/* ================= DRAG & DROP WINDOWS ================= */
let dragState = null;

function startDrag(e, id) {
  if (e.target.closest('.win-btn')) return;
  const win = document.getElementById('win-' + id);
  dragState = { id, startX: e.clientX, startY: e.clientY, winX: win.offsetLeft, winY: win.offsetTop };
  win.style.zIndex = getNextZIndex();
}

document.addEventListener('mousemove', (e) => {
  if(!dragState) return;
  const win = document.getElementById('win-' + dragState.id);
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  win.style.left = (dragState.winX + dx) + 'px';
  win.style.top = (dragState.winY + dy) + 'px';
});

document.addEventListener('mouseup', () => { dragState = null; });

/* ================= CLICK OUTSIDE START MENU ================= */
window.addEventListener('click', (e) => {
  const sm = document.getElementById('start-menu');
  const btn = document.querySelector('.start-btn');
  if(sm.classList.contains('show') && !sm.contains(e.target) && !btn.contains(e.target)) {
    sm.classList.remove('show');
  }
});

    html += `<div style="text-align:center;padding:10px;border:1px solid var(--border);border-radius:6px;${isToday ? 'background:var(--accent);color:#fff;font-weight:bold' : ''}">${d}</div>`;

function loadWeather() {
  const el = document.getElementById('wx'); if(!el) return;
  if(!navigator.geolocation) { el.textContent = 'GPS fehlt.'; return; }
  navigator.geolocation.getCurrentPosition(async p => {
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code`);
      const j = await r.json();
      el.innerHTML = `<div style="font-size:48px;font-weight:800;color:var(--accent)">${j.current.temperature_2m}°C</div><div class="meta">Code: ${j.current.weather_code}</div>`;
    } catch(e) { el.textContent = 'Fehler.'; }
  }, () => { el.textContent = 'GPS verweigert.'; });
}
