<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1e">
<title>HalDo AI OS · Professionelle</title>
<style>
/* ============ ROOT ============ */
:root{
  --c1:#00e5ff; --c2:#4da8ff; --c3:#b478ff;
  --gold:#ffd700; --bg:#050914; --bg2:#0a0f1e;
  --glass:rgba(10,20,40,.55);
  --glass2:rgba(20,35,65,.45);
  --border:rgba(0,229,255,.35);
  --border-gold:rgba(255,215,0,.55);
  --text:#e8f4ff; --text-dim:#8aa3c7;
  --blur:22px; --glow:0 0 30px rgba(0,229,255,.35);
  --radius:18px; --radius-sm:14px;
  --font:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;user-select:none;-webkit-user-select:none}

/* ============ COSMOS BACKGROUND ============ */
#cosmos{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse at 20% 30%,#0a1a3a 0%,#050914 50%,#01020a 100%);}
#cosmos canvas{position:absolute;inset:0;width:100%;height:100%}
#nebula{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 70% 20%,rgba(180,120,255,.18),transparent 45%),
    radial-gradient(circle at 15% 75%,rgba(0,229,255,.14),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(255,120,200,.12),transparent 40%);
  filter:blur(40px);animation:nebulaFlow 40s ease-in-out infinite alternate}
@keyframes nebulaFlow{0%{transform:scale(1) rotate(0)}100%{transform:scale(1.15) rotate(6deg)}}

/* ============ TOP BAR ============ */
#topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:500;
  padding:var(--safe-top) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(5,9,20,.85),rgba(5,9,20,.4));
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-bottom:1px solid var(--border)}
#topbar .logo-btn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--border);
  background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.2));
  cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(0,229,255,.4);transition:transform .2s}
#topbar .logo-btn:active{transform:scale(.9)}
#topbar .brand{font-weight:700;font-size:15px;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--c1),var(--c3));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:0 0 20px rgba(0,229,255,.4)}
#topbar .spacer{flex:1}
#topbar .sys-icons{display:flex;gap:8px;align-items:center}
#topbar .ic{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--glass);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;transition:all .2s}
#topbar .ic:active{transform:scale(.9);background:rgba(0,229,255,.2)}
#clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-dim);font-weight:600}

/* ============ SIDEBAR ============ */
#sidebar{position:fixed;left:calc(10px + var(--safe-l));top:calc(62px + var(--safe-top));bottom:calc(86px + var(--safe-bot));
  width:76px;z-index:400;display:flex;flex-direction:column;gap:6px;padding:8px;
  background:var(--glass);border:1.5px solid var(--border);border-radius:22px;
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  box-shadow:var(--glow);overflow-y:auto;overflow-x:hidden;transition:width .28s cubic-bezier(.4,0,.2,1)}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:var(--c1);border-radius:2px}
#sidebar.expanded{width:200px}
.nav-btn{min-height:52px;border-radius:14px;border:1px solid transparent;background:transparent;
  color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:0 12px;font-family:var(--font);font-size:13px;font-weight:600;
  white-space:nowrap;overflow:hidden;transition:all .2s}
.nav-btn .ico{font-size:20px;min-width:24px;text-align:center}
.nav-btn .lbl{opacity:0;transition:opacity .2s;font-size:12px}
#sidebar.expanded .nav-btn .lbl{opacity:1}
.nav-btn:hover{background:rgba(0,229,255,.12);border-color:var(--border)}
.nav-btn:active{transform:scale(.95)}
.nav-btn.active{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(180,120,255,.25));
  border-color:var(--border);box-shadow:0 0 15px rgba(0,229,255,.4)}

/* ============ DESKTOP / WINDOWS ============ */
#desktop{position:fixed;inset:0;z-index:1;pointer-events:none}
.win{position:absolute;pointer-events:auto;
  background:var(--glass);border:1.5px solid var(--border);border-radius:var(--radius);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(0,229,255,.15);
  display:flex;flex-direction:column;overflow:hidden;
  min-width:280px;min-height:200px;z-index:200;transition:box-shadow .2s,transform .15s;
  animation:winOpen .22s cubic-bezier(.34,1.56,.64,1)}
@keyframes winOpen{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.win.active{z-index:250;box-shadow:0 25px 70px rgba(0,0,0,.7),0 0 40px rgba(0,229,255,.35)}
.win.gold{border-color:var(--border-gold);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,215,0,.25)}
.win-header{height:44px;display:flex;align-items:center;padding:0 4px 0 14px;gap:8px;
  cursor:grab;background:linear-gradient(90deg,rgba(0,229,255,.08),transparent);
  border-bottom:1px solid var(--border);flex-shrink:0}
.win-header:active{cursor:grabbing}
.win-title{flex:1;font-size:13px;font-weight:700;letter-spacing:.3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.win-btn{width:40px;height:40px;min-width:40px;border-radius:10px;border:none;
  background:transparent;color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:999999}
.win-btn:hover{background:rgba(255,80,80,.25)}
.win-btn:active{transform:scale(.88)}
.win-body{flex:1;overflow:auto;padding:14px;font-size:13px}
.win-body::-webkit-scrollbar{width:6px}
.win-body::-webkit-scrollbar-thumb{background:var(--c1);border-radius:3px}
.win-body::-webkit-scrollbar-track{background:transparent}
.win-resize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 50%,var(--c1) 50%,var(--c1) 60%,transparent 60%,transparent 70%,var(--c1) 70%,var(--c1) 80%,transparent 80%);opacity:.5}

/* ============ BOTTOM BAR ============ */
#bottombar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + var(--safe-bot));z-index:450;
  display:flex;gap:6px;padding:6px;
  background:var(--glass);border:1.5px solid var(--border);border-radius:999px;
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  box-shadow:var(--glow)}
.bb-btn{min-width:56px;height:48px;padding:0 16px;border-radius:999px;border:none;
  background:transparent;color:var(--text);cursor:pointer;
  display:flex;align-items:center;gap:6px;font-family:var(--font);
  font-size:12px;font-weight:700;transition:all .2s;white-space:nowrap}
.bb-btn .ico{font-size:18px}
.bb-btn:hover{background:rgba(0,229,255,.15)}
.bb-btn:active{transform:scale(.92)}
.bb-btn.cyborg{background:linear-gradient(135deg,rgba(255,120,200,.3),rgba(180,120,255,.3));
  border:1px solid rgba(255,120,200,.5)}
.bb-btn.chat{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(77,168,255,.3));
  border:1px solid var(--c1)}

/* ============ TOASTS ============ */
#toasts{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(100px + var(--safe-bot));z-index:1000;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--glass);border:1.5px solid var(--border);border-radius:14px;
  padding:12px 20px;font-size:13px;font-weight:600;backdrop-filter:blur(var(--blur));
  box-shadow:var(--glow);animation:toastIn .3s cubic-bezier(.34,1.56,.64,1);
  max-width:90vw;text-align:center;pointer-events:auto}
.toast.success{border-color:rgba(0,255,150,.6);box-shadow:0 0 30px rgba(0,255,150,.4)}
.toast.error{border-color:rgba(255,80,80,.6);box-shadow:0 0 30px rgba(255,80,80,.4)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(20px) scale(.9)}}

/* ============ FORMS ============ */
input,textarea,select,button{font-family:var(--font);font-size:13px}
.inp,textarea.inp,select.inp{width:100%;padding:11px 14px;border-radius:12px;
  border:1px solid var(--border);background:rgba(0,20,40,.4);color:var(--text);
  outline:none;transition:all .2s;min-height:44px}
.inp:focus{border-color:var(--c1);box-shadow:0 0 15px rgba(0,229,255,.4)}
textarea.inp{resize:vertical;min-height:80px}
.btn{padding:11px 20px;border-radius:12px;border:1px solid var(--border);
  background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.2));
  color:var(--text);font-weight:700;cursor:pointer;min-height:44px;
  transition:all .2s;font-family:var(--font);font-size:13px}
.btn:active{transform:scale(.96)}
.btn:hover{box-shadow:0 0 20px rgba(0,229,255,.5)}
.btn.danger{background:rgba(255,80,80,.2);border-color:rgba(255,80,80,.5)}
.btn.gold{background:linear-gradient(135deg,rgba(255,215,0,.25),rgba(255,180,0,.15));
  border-color:var(--border-gold)}
.btn.small{padding:6px 12px;min-height:34px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--border);background:rgba(0,20,40,.4);cursor:pointer;
  font-size:12px;font-weight:600;transition:all .15s;margin:3px;min-height:34px}
.chip:active{transform:scale(.94)}
.chip.active{background:linear-gradient(135deg,var(--c1),var(--c3));color:#000;
  border-color:transparent;box-shadow:0 0 20px rgba(0,229,255,.6);font-weight:800}
.toggle{position:relative;width:48px;height:28px;border-radius:999px;
  background:rgba(0,20,40,.6);border:1px solid var(--border);cursor:pointer;transition:all .25s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;
  border-radius:50%;background:var(--text);transition:all .25s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.toggle.on{background:linear-gradient(135deg,var(--c1),var(--c3));border-color:transparent;
  box-shadow:0 0 15px rgba(0,229,255,.6)}
.toggle.on::after{left:22px;background:#001}
.slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--c1),var(--c3));outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--text);cursor:pointer;box-shadow:0 0 12px var(--c1)}

/* ============ SETTINGS ROWS ============ */
.set-section{margin-bottom:14px;border:1px solid var(--border);border-radius:14px;
  overflow:hidden;background:rgba(0,15,30,.3)}
.set-head{padding:14px 16px;background:linear-gradient(90deg,rgba(0,229,255,.08),transparent);
  cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  font-weight:700;font-size:13px;letter-spacing:.3px;user-select:none}
.set-head .arrow{transition:transform .25s;font-size:11px;opacity:.7}
.set-section.open .set-head .arrow{transform:rotate(90deg)}
.set-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.set-section.open .set-body{max-height:3000px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-top:1px solid rgba(0,229,255,.12);font-size:13px}
.set-row .lbl{flex:1}
.set-row .lbl small{display:block;font-size:11px;color:var(--text-dim);margin-top:2px;font-weight:400}
.set-row .ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ============ APP REGISTRY ============ */
.apps-cat{margin-bottom:16px}
.apps-cat h3{font-size:14px;margin-bottom:8px;color:var(--c1);font-weight:800;letter-spacing:.5px}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.app-tile{aspect-ratio:1;border-radius:14px;border:1px solid var(--border);
  background:var(--glass2);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;
  transition:all .2s;overflow:hidden}
.app-tile .ico{font-size:26px}
.app-tile .nm{font-size:9.5px;font-weight:600;line-height:1.15;opacity:.85;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.app-tile:hover{transform:translateY(-2px);border-color:var(--c1);box-shadow:0 8px 20px rgba(0,229,255,.3)}
.app-tile:active{transform:scale(.94)}

/* ============ AVATAR ============ */
#avatar-stage{position:relative;width:200px;height:200px;margin:20px auto;
  display:flex;align-items:center;justify-content:center}
.avatar-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c1);
  animation:ringSpin 8s linear infinite;box-shadow:0 0 30px rgba(0,229,255,.6)}
.avatar-ring:nth-child(2){inset:15px;border-color:var(--c3);animation-duration:12s;animation-direction:reverse}
.avatar-ring:nth-child(3){inset:30px;border-style:dashed;animation-duration:16s}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.avatar-face{position:relative;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(0,229,255,.5),rgba(180,120,255,.3),rgba(0,20,50,.9));
  border:2px solid var(--c1);box-shadow:0 0 40px rgba(0,229,255,.5),inset 0 0 30px rgba(0,229,255,.3);
  animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.eye{position:absolute;top:38%;width:20px;height:20px;border-radius:50%;
  background:var(--c1);box-shadow:0 0 12px var(--c1);animation:blink 4s infinite}
.eye.l{left:22%} .eye.r{right:22%}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mouth{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);
  width:36px;height:16px;border-radius:0 0 20px 20px;
  background:var(--c3);box-shadow:0 0 10px var(--c3);transition:all .2s}
.avatar-face.speaking .mouth{animation:talk .18s infinite alternate}
@keyframes talk{from{height:6px}to{height:22px}}
.avatar-face.listening{border-color:#00ff88;box-shadow:0 0 50px #00ff88}
.avatar-face.thinking .eye{animation:none;transform:scaleY(.5)}

/* ============ UTILITIES ============ */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.col{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.card{padding:12px;border:1px solid var(--border);border-radius:12px;
  background:rgba(0,20,40,.3);margin-bottom:8px}
.card h4{font-size:13px;margin-bottom:6px;color:var(--c1)}
.card p{font-size:12px;color:var(--text-dim);line-height:1.5}
.muted{color:var(--text-dim);font-size:12px}
.empty{text-align:center;padding:30px;color:var(--text-dim);font-size:12px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;
  background:rgba(0,20,40,.3);margin-bottom:6px;border:1px solid transparent;transition:all .2s}
.list-item:hover{border-color:var(--border);background:rgba(0,229,255,.08)}
.list-item .grow{flex:1;min-width:0}
.list-item strong{display:block;font-size:13px;margin-bottom:2px}
.list-item small{font-size:11px;color:var(--text-dim)}
.del-btn{width:32px;height:32px;border-radius:8px;border:none;background:rgba(255,80,80,.2);
  color:#fff;cursor:pointer;font-size:14px}

/* ============ MOBILE ============ */
@media(max-width:640px){
  #sidebar{width:64px}
  #sidebar.expanded{width:180px}
  .win{min-width:calc(100vw - 90px);max-width:calc(100vw - 90px)}
  #clock{display:none}
  #topbar .brand{font-size:13px}
  .bb-btn{min-width:48px;padding:0 12px;font-size:11px}
  .bb-btn .lbl{display:none}
}
</style>
</head>
<body>

<div id="cosmos">
  <canvas id="starfield"></canvas>
  <div id="nebula"></div>
</div>

<header id="topbar">
  <div class="logo-btn" id="logoBtn" title="Sidebar ein/aus">🦚</div>
  <div class="brand">HalDo AI OS</div>
  <div class="spacer"></div>
  <div class="sys-icons">
    <div id="clock">--:--</div>
    <div class="ic" id="themeBtn" title="Theme">🎨</div>
    <div class="ic" id="setBtn" title="Einstellungen">⚙️</div>
  </div>
</header>

<nav id="sidebar"></nav>

<div id="desktop"></div>

<div id="bottombar">
  <button class="bb-btn chat" onclick="HalDo.apps.chat()"><span class="ico">💬</span><span class="lbl">Chat</span></button>
  <button class="bb-btn" onclick="HalDo.apps.avatar()"><span class="ico">🤖</span><span class="lbl">AI</span></button>
  <button class="bb-btn cyborg" onclick="HalDo.theme.toggleCyborg()"><span class="ico">⚡</span><span class="lbl">CYBORG</span></button>
</div>

<div id="toasts"></div>

<script>
'use strict';
/* ================================================================
   HalDo AI OS Professionelle – Core Engine v125
   Entwickler: Halil Donma
   ================================================================ */

/* ---------- GLOBAL API ---------- */
window.HalDo = window.HalDo || {};

/* ---------- UTILS ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (tag,attrs={},...kids)=>{
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className=attrs[k];
    else if(k==='style') e.style.cssText=attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==='html') e.innerHTML=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(k=>{ if(k==null)return; e.append(k.nodeType?k:document.createTextNode(k)); });
  return e;
};
const LS = {
  get(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d}catch{return d} },
  set(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch{} },
  del(k){ try{localStorage.removeItem(k)}catch{} }
};
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- TOASTS ---------- */
HalDo.toast = (msg,type='info',ms=3000)=>{
  const t=el('div',{class:'toast '+(type==='ok'?'success':type==='err'?'error':'')},msg);
  $('#toasts').append(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},ms);
};

/* ---------- CLOCK ---------- */
function tickClock(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,'0');
  const mm=String(d.getMinutes()).padStart(2,'0');
  $('#clock').textContent=`${hh}:${mm}`;
}
setInterval(tickClock,10000); tickClock();

/* ================================================================
   THEME SYSTEM
   ================================================================ */
HalDo.theme = {
  presets:{
    holo:    {c1:'#00e5ff',c2:'#4da8ff',c3:'#b478ff',gold:false,name:'Holo'},
    cyborg:  {c1:'#ff78c8',c2:'#ff5cb8',c3:'#b478ff',gold:false,name:'Cyborg'},
    gold:    {c1:'#ffd700',c2:'#ffb800',c3:'#ff9500',gold:true, name:'Gold'},
    matrix:  {c1:'#00ff88',c2:'#00cc66',c3:'#00aa55',gold:false,name:'Matrix'},
    crimson: {c1:'#ff4d6d',c2:'#ff2e4d',c3:'#cc0033',gold:false,name:'Crimson'},
    sunset:  {c1:'#ff9500',c2:'#ff5e5e',c3:'#ff2e83',gold:false,name:'Sunset'},
    ice:     {c1:'#a0e9ff',c2:'#7dd3fc',c3:'#c4b5fd',gold:false,name:'Ice'}
  },
  current:'holo',
  apply(name){
    const p=this.presets[name]; if(!p)return;
    document.documentElement.style.setProperty('--c1',p.c1);
    document.documentElement.style.setProperty('--c2',p.c2);
    document.documentElement.style.setProperty('--c3',p.c3);
    document.documentElement.style.setProperty('--border',p.c1+'59');
    document.documentElement.style.setProperty('--glow','0 0 30px '+p.c1+'59');
    document.documentElement.style.setProperty('--border-gold', p.gold ? 'rgba(255,215,0,.7)' : p.c1+'59');
    this.current=name; LS.set('haldo_theme',name);
    HalDo.toast(`Theme: ${p.name}`,'ok',1500);
  },
  toggleCyborg(){
    const next = this.current==='cyborg' ? 'holo' : 'cyborg';
    this.apply(next);
    HalDo.toast(next==='cyborg'?'⚡ CYBORG-MODUS aktiv':'🤖 Standard-Modus','ok',1800);
  },
  init(){
    const saved=LS.get('haldo_theme','holo');
    this.apply(saved);
  }
};

(function initCosmos(){
  const cvs=$('#starfield'); const ctx=cvs.getContext('2d');
  let W,H,stars=[],shooters=[],planets=[];
  const PLANET_DEFS=[
    {name:'Merkur',color:'#a0a0a0',r:4,dist:110,spd:.022},
    {name:'Venus',  color:'#e8b87a',r:6,dist:150,spd:.016},
    {name:'Erde',   color:'#3a9eff',r:7,dist:195,spd:.012},
    {name:'Mars',   color:'#e0633a',r:5,dist:240,spd:.010},
    {name:'Jupiter',color:'#d9a066',r:11,dist:295,spd:.007},
    {name:'Saturn', color:'#e3c88a',r:9,dist:345,spd:.005,ring:true},
    {name:'Uranus', color:'#7dd3c4',r:7,dist:390,spd:.004},
    {name:'Neptun', color:'#4a7fff',r:7,dist:430,spd:.003},
    {name:'Pluto',  color:'#c8a789',r:3,dist:465,spd:.0025},
    {name:'Ceres',  color:'#8a8078',r:2,dist:490,spd:.002},
    {name:'Eris',   color:'#a8a8b8',r:3,dist:510,spd:.0018},
    {name:'Haumea', color:'#b8c8d8',r:2,dist:530,spd:.0015}
  ];
  function resize(){
    W=cvs.width=innerWidth*devicePixelRatio;
    H=cvs.height=innerHeight*devicePixelRatio;
    cvs.style.width=innerWidth+'px'; cvs.style.height=innerHeight+'px';
    ctx.scale(devicePixelRatio,devicePixelRatio);
    W=innerWidth; H=innerHeight;
    stars=[]; const N=Math.min(500,Math.floor(W*H/4000));
    for(let i=0;i<N;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.2,a:Math.random()*.7+.3,sp:Math.random()*.02+.005});
    planets=PLANET_DEFS.map((p,i)=>({...p,ang:Math.random()*Math.PI*2}));
  }
  function spawnShooter(){
    shooters.push({x:Math.random()*W,y:Math.random()*H*.5,vx:(Math.random()-.3)*8,vy:Math.random()*3+3,life:60,max:60});
    if(shooters.length>2) shooters.shift();
  }
  setInterval(spawnShooter,4500);
  function draw(){
    ctx.clearRect(0,0,W,H);
    const cx=W*.72, cy=H*.35, sunR=32;
    // Sonne + Corona
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,sunR*4);
    g.addColorStop(0,'rgba(255,220,80,1)');
    g.addColorStop(.25,'rgba(255,160,40,.8)');
    g.addColorStop(.5,'rgba(255,100,20,.3)');
    g.addColorStop(1,'rgba(255,50,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,sunR*4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff5c8'; ctx.beginPath(); ctx.arc(cx,cy,sunR,0,Math.PI*2); ctx.fill();
    // Bahnen
    planets.forEach(p=>{
      ctx.strokeStyle='rgba(0,229,255,.06)'; ctx.lineWidth=.5;
      ctx.beginPath(); ctx.arc(cx,cy,p.dist,0,Math.PI*2); ctx.stroke();
    });
    // Planeten
    planets.forEach(p=>{
      const px=cx+Math.cos(p.ang)*p.dist, py=cy+Math.sin(p.ang)*p.dist;
      // Glow
      const pg=ctx.createRadialGradient(px,py,0,px,py,p.r*3);
      pg.addColorStop(0,p.color); pg.addColorStop(1,'transparent');
      ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,py,p.r*3,0,Math.PI*2); ctx.fill();
      // Körper
      ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(px,py,p.r,0,Math.PI*2); ctx.fill();
      if(p.ring){
        ctx.strokeStyle='rgba(255,215,150,.6)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(px,py,p.r*1.8,p.r*.5,0.4,0,Math.PI*2); ctx.stroke();
      }
      p.ang+=p.spd*.02;
    });
    // Sterne
    stars.forEach(s=>{
      s.a+=Math.sin(Date.now()*.001*s.sp)*.01;
      const a=Math.max(.1,Math.min(1,s.a));
      ctx.fillStyle=`rgba(200,230,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    });
    // Sternschnuppen
    shooters.forEach(s=>{
      s.x+=s.vx; s.y+=s.vy; s.life--;
      const grd=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*6,s.y-s.vy*6);
      grd.addColorStop(0,`rgba(255,255,255,${s.life/s.max})`);
      grd.addColorStop(1,'transparent');
      ctx.strokeStyle=grd; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*6,s.y-s.vy*6); ctx.stroke();
    });
    shooters=shooters.filter(s=>s.life>0);
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);
  resize(); draw();
})();

HalDo.wm = {
  wins:{},
  zIndex:250,
  open(id,title,content,opts={}){
    if(this.wins[id]){ this.focus(id); return this.wins[id]; }
    const w=el('div',{class:'win'+(opts.gold?' gold':''), 'data-id':id});
    w.style.width =(opts.w||480)+'px';
    w.style.height=(opts.h||400)+'px';
    w.style.left  =((innerWidth - (opts.w||480))/2)+'px';
    w.style.top   =((innerHeight-(opts.h||400))/2 - 30)+'px';
    const hdr=el('div',{class:'win-header'},
      el('div',{class:'win-title'},title),
      el('button',{class:'win-btn','data-act':'min',title:'Min'},'—'),
      el('button',{class:'win-btn','data-act':'close',title:'Schließen'},'✕')
    );
    const body=el('div',{class:'win-body'});
    if(typeof content==='string') body.innerHTML=content;
    else body.append(content);
    const res=el('div',{class:'win-resize'});
    w.append(hdr,body,res);
    $('#desktop').append(w);
    this.wins[id]={el:w,body,hdr,id};
    this.focus(id);
    // Drag
    let drag=false,sx=0,sy=0,ox=0,oy=0;
    hdr.addEventListener('pointerdown',e=>{
      if(e.target.closest('.win-btn'))return;
      drag=true; sx=e.clientX; sy=e.clientY;
      ox=parseFloat(w.style.left); oy=parseFloat(w.style.top);
      hdr.setPointerCapture(e.pointerId);
      this.focus(id);
    });
    hdr.addEventListener('pointermove',e=>{
      if(!drag)return;
      let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
      nx=Math.max(70,Math.min(innerWidth-100,nx));
      ny=Math.max(56,Math.min(innerHeight-60,ny));
      w.style.left=nx+'px'; w.style.top=ny+'px';
    });
    hdr.addEventListener('pointerup',()=>{drag=false});
    // Resize
    let rz=false,rx=0,ry=0,rw=0,rh=0;
    res.addEventListener('pointerdown',e=>{
      rz=true; rx=e.clientX; ry=e.clientY;
      rw=w.offsetWidth; rh=w.offsetHeight;
      res.setPointerCapture(e.pointerId);
    });
    res.addEventListener('pointermove',e=>{
      if(!rz)return;
      w.style.width =Math.max(280,rw+e.clientX-rx)+'px';
      w.style.height=Math.max(200,rh+e.clientY-ry)+'px';
    });
    res.addEventListener('pointerup',()=>{rz=false});
    // Buttons
    w.addEventListener('click',e=>{
      const b=e.target.closest('.win-btn'); if(!b)return;
      if(b.dataset.act==='close') this.close(id);
      if(b.dataset.act==='min') w.style.display='none';
    });
    w.addEventListener('pointerdown',()=>this.focus(id));
    return this.wins[id];
  },
  focus(id){
    for(const k in this.wins) this.wins[k].el.classList.remove('active');
    const w=this.wins[id]; if(!w)return;
    w.el.classList.add('active'); w.el.style.zIndex=++this.zIndex;
  },
  close(id){
    const w=this.wins[id]; if(!w)return;
    w.el.style.animation='winOpen .2s reverse';
    setTimeout(()=>{w.el.remove()},200);
    delete this.wins[id];
  }
};

  },

  tasks(){

  calendar(){
    const now=new Date();
    const y=now.getFullYear(), m=now.getMonth();
    const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
    const monthNames=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    let html=`<div style="text-align:center;font-size:16px;font-weight:800;margin-bottom:12px">${monthNames[m]} ${y}</div>`;
    html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px;font-weight:700;color:var(--c1);margin-bottom:6px">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div>${d}</div>`).join('')+'</div>';
    html+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
    const start=(first+6)%7;
    for(let i=0;i<start;i++) html+='<div></div>';
    for(let d=1;d<=days;d++){
      const today=d===now.getDate();
      html+=`<div style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:600;${today?'background:linear-gradient(135deg,var(--c1),var(--c3));color:#000;box-shadow:0 0 12px var(--c1)':'background:rgba(0,20,40,.4)'}">${d}</div>`;
    }
    html+='</div>';
    HalDo.wm.open('calendar','📅 Calendar',html,{w:380,h:440});
  },

  weather(){
    const w=HalDo.wm.open('weather','🌤️ Weather LIVE',`<div class="empty">Lade Wetterdaten...</div>`,{w:400,h:440});
    function load(city){
      w.body.innerHTML=`<div class="empty">Lade ${esc(city)}...</div>`;
      fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=de&format=json`)
      .then(r=>r.json()).then(g=>{
        if(!g.results||!g.results[0]) throw new Error('Stadt nicht gefunden');
        const {latitude,longitude,name,country}=g.results[0];
        return fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&forecast_days=5`).then(r=>r.json()).then(d=>({d,name,country}));

  calc(){
    const html=`<div style="text-align:right;padding:14px;font-size:28px;font-weight:800;background:rgba(0,20,40,.4);border-radius:12px;margin-bottom:10px;min-height:60px;overflow-x:auto" id="calcDisp">0</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
      ${['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=','='].map(k=>`<button class="btn" data-k="${k}" style="min-height:44px;font-size:16px">${k}</button>`).join('')}
    </div>`;
    HalDo.wm.open('calc','🧮 Calculator',html,{w:320,h:400});
    let expr='';
    document.addEventListener('click',e=>{
      const b=e.target.closest('[data-k]'); if(!b)return;
      const k=b.dataset.k; const d=$('#calcDisp'); if(!d)return;
      if(k==='C'){ expr=''; d.textContent='0'; return; }
      if(k==='⌫'){ expr=expr.slice(0,-1); d.textContent=expr||'0'; return; }
      if(k==='='){
        try{ const safe=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
          const r=Function('"use strict";return ('+safe+')')(); d.textContent=r; expr=String(r);
        }catch{ d.textContent='Fehler'; expr=''; }
        return;
      }
      expr+=k; d.textContent=expr;
    });
  },

  passwd(){
    const html=`<div class="col">
      <label>Länge: <span id="pwLen">16</span></label>
      <input type="range" class="slider" id="pwSlider" min="6" max="64" value="16">
      <div class="row">
        <button class="chip active" data-pw="lower">abc</button>
        <button class="chip active" data-pw="upper">ABC</button>
        <button class="chip active" data-pw="num">123</button>
        <button class="chip active" data-pw="sym">!@#</button>
      </div>
      <input class="inp" id="pwOut" readonly style="font-family:monospace;text-align:center;font-size:16px;letter-spacing:1px">
      <div class="row"><button class="btn" onclick="HalDo.apps._pwGen()">🔐 Generieren</button><button class="btn" onclick="HalDo.apps._pwCopy()">📋 Kopieren</button></div>
    </div>`;
    HalDo.wm.open('passwd','🔐 Password',html,{w:400,h:400});
    const opts={lower:true,upper:true,num:true,sym:true};
    document.addEventListener('click',e=>{
      if(e.target.dataset.pw){ opts[e.target.dataset.pw]=!opts[e.target.dataset.pw]; e.target.classList.toggle('active'); }
    });
    const sl=$('#pwSlider'); if(sl) sl.oninput=e=>$('#pwLen').textContent=e.target.value;
    HalDo.apps._pwGen=()=>{
      const len=parseInt($('#pwSlider')?.value||16);
      let chars='';
      if(opts.lower)chars+='abcdefghijklmnopqrstuvwxyz';
      if(opts.upper)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if(opts.num)chars+='0123456789';
      if(opts.sym)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
      if(!chars){ HalDo.toast('Mindestens 1 Zeichentyp','err'); return; }
      let pw=''; const arr=new Uint32Array(len); crypto.getRandomValues(arr);
      for(let i=0;i<len;i++) pw+=chars[arr[i]%chars.length];
      const o=$('#pwOut'); if(o) o.value=pw;
    };
    HalDo.apps._pwCopy=()=>{ const o=$('#pwOut'); if(o&&o.value){ navigator.clipboard.writeText(o.value); HalDo.toast('Kopiert!','ok'); } };
    setTimeout(()=>HalDo.apps._pwGen(),100);
  },

  units(){
    const html=`<div class="col">
      <select class="inp" id="uCat">
        <option value="len">Länge</option><option value="mass">Masse</option>

      </select>
      <input class="inp" id="uVal" type="number" value="1" placeholder="Wert">
      <select class="inp" id="uFrom"></select>
      <select class="inp" id="uTo"></select>
      <div class="card" style="text-align:center;font-size:20px;font-weight:800" id="uOut">—</div>
      <button class="btn" onclick="HalDo.apps._uCalc()">Umrechnen</button>
    </div>`;
    HalDo.wm.open('units','📏 Unit Converter',html,{w:380,h:480});
    const units={
      len:{m:1,km:1000,cm:.01,mm:.001,in:.0254,ft:.3048,mi:1609.34},
      mass:{kg:1,g:.001,mg:1e-6,lb:.453592,oz:.0283495,t:1000},
      temp:{C:1,F:1,K:1},
      area:{m2:1,km2:1e6,cm2:1e-4,ha:1e4,ac:4046.86}
    };
    function fill(){
      const cat=$('#uCat').value; const keys=Object.keys(units[cat]);
      $('#uFrom').innerHTML=keys.map(k=>`<option>${k}</option>`).join('');
      $('#uTo').innerHTML=keys.map(k=>`<option>${k}</option>`).join('');
    }
    fill(); $('#uCat').onchange=fill;
    HalDo.apps._uCalc=()=>{
      const cat=$('#uCat').value; const v=parseFloat($('#uVal').value);
      const from=$('#uFrom').value, to=$('#uTo').value;
      let r;
      if(cat==='temp'){
        let c; if(from==='C')c=v; else if(from==='F')c=(v-32)*5/9; else c=v-273.15;
        if(to==='C')r=c; else if(to==='F')r=c*9/5+32; else r=c+273.15;
      } else {
        r = v*units[cat][from]/units[cat][to];
      }
      $('#uOut').textContent = r.toFixed(4).replace(/\.?0+$/,'') + ' ' + to;
    };
  },

  _avSpeak(text){
    if(!('speechSynthesis' in window)) return HalDo.toast('TTS nicht verfügbar','err');
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=1; u.pitch=1;
    const f=$('#avFace'), s=$('#avStatus');
    if(f){ f.classList.add('speaking'); if(s)s.textContent='Spreche...'; }
    u.onend=()=>{ if(f)f.classList.remove('speaking'); if(s)s.textContent='Bereit'; };
    speechSynthesis.speak(u);
  },

  _avListen(){
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return HalDo.toast('Speech API nicht verfügbar','err');
    const r=new SR(); r.lang='de-DE'; r.continuous=false;
    const f=$('#avFace'), s=$('#avStatus');
    if(f)f.classList.add('listening'); if(s)s.textContent='Höre zu...';
    r.onresult=(e)=>{
      const text=e.results[0][0].transcript;
      if(s)s.textContent='Du sagtest: '+text;
      const resp=HalDo.ai.reply(text);
      setTimeout(()=>{ HalDo.apps._avSpeak(resp); },300);
    };
    r.onerror=(e)=>{ if(s)s.textContent='Fehler: '+e.error; if(f)f.classList.remove('listening'); };
    r.onend=()=>{ if(f)f.classList.remove('listening'); };
    r.start();
  },

      const b=$('#chatBody'); if(!b) return;
      const isMe=who==='me';
      const m=el('div',{
        style:`padding:10px 14px;margin:6px 0;border-radius:12px;max-width:85%;font-size:13px;line-height:1.45;${isMe?'background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(77,168,255,.2));margin-left:auto;text-align:right':'background:rgba(180,120,255,.2);margin-right:auto'}`
      },text);
      b.append(m); b.scrollTop=b.scrollHeight;
    }
    addMsg('ai','Willkommen bei HalDo AI OS Professionelle, Bruder 💙 Ich bin HalDo AI. Sag „Hallo" oder stelle eine Frage.');
    HalDo.apps._chatAdd=addMsg;
    HalDo.apps._chatSend=()=>{
      const i=$('#chatIn'); const v=i.value.trim(); if(!v) return;
      addMsg('me',v); i.value='';
      const resp=HalDo.ai.reply(v);
      setTimeout(()=>addMsg('ai',resp),300);

    HalDo.apps._chatVoice=()=>{
      const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR) return HalDo.toast('Speech API nicht verfügbar','err');

      r.onresult=(e)=>{ const t=e.results[0][0].transcript; $('#chatIn').value=t; HalDo.apps._chatSend(); };

/* ================================================================
   AI (Regelbasiert mit Greeting-Erkennung)
   ================================================================ */
HalDo.ai = {
  reply(text){
    const t=text.toLowerCase().trim();
    if(/^(hi|hey|hallo|haldo|servus|moin|guten tag| salam|merheba)/.test(t)) return 'Hallo Bruder! 💙 Ich bin HalDo AI. Wie kann ich dir helfen?';
    if(/wie geht|wie läuft|wie geht's/.test(t)) return 'Mir geht es bestens! Danke der Nachfrage. Und dir, Bruder?';
    if(/wer bist|dein name/.test(t)) return 'Ich bin HalDo AI – die künstliche Intelligenz in HalDo AI OS. Entwickelt von Halil Donma.';
    if(/uhrzeit|wie spät/.test(t)) return 'Es ist '+new Date().toLocaleTimeString('de',{hour:'2-digit',minute:'2-digit'})+' Uhr.';
    if(/datum|welcher tag/.test(t)) return 'Heute ist '+new Date().toLocaleDateString('de',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'.';
    if(/wetter/.test(t)) return 'Öffne die Weather-App für Live-Wetterdaten. Klicke auf 🌤️ Weather in der Sidebar.';
    if(/danke|thank/.test(t)) return 'Immer gerne, Bruder! 💙';
    if(/tschüss|bye|ciao|bis bald/.test(t)) return 'Bis bald! HalDo AI OS ist immer für dich da. 🚀';
    if(/ezidi|êzîdî|yezidi|lalisch|melek/.test(t)) return 'Die êzîdîsche Religion ist eine sehr alte Glaubensgemeinschaft. Öffne die App „Êzîdî Wissen" für detaillierte Infos, Bruder. 🕊️';
    if(/hilfe|help/.test(t)) return 'Sag „Hallo" für einen Gruß, „Wetter" für Wetter, „Uhrzeit" für die Zeit, oder frag nach einer App.';
    return 'Ich habe verstanden: „'+text+'". Öffne die Chat- oder Memory-App für mehr Funktionen. Sag „Hilfe" für eine Liste.';
  }
};

function renderSettingRow(item){
  const {type,label,hint,ctrl}=item;
  let c='';
  if(type==='toggle') c=`<div class="toggle ${item.on?'on':''}" onclick="this.classList.toggle('on')"></div>`;
  else if(type==='select') c=`<select class="inp" style="width:auto;min-width:120px">${(item.opts||[]).map(o=>`<option>${o}</option>`).join('')}</select>`;
  else if(type==='slider') c=`<input type="range" class="slider" min="0" max="100" value="50" style="width:120px">`;
  else if(type==='button') c=`<button class="btn small" onclick="HalDo.toast('${item.act||'Aktion'}','ok')">${item.btnText||'Öffnen'}</button>`;
  else if(type==='text') c=`<input class="inp" placeholder="${item.ph||''}" style="width:140px">`;
  return `<div class="set-row"><div class="lbl">${esc(label)}${hint?`<small>${esc(hint)}</small>`:''}</div><div class="ctrl">${c}</div></div>`;
}

function openApps(){
  const grouped={};
  APP_REG.forEach(a=>{ (grouped[a.c]=grouped[a.c]||[]).push(a); });
  const cats=Object.keys(grouped).sort();
  const html=cats.map(c=>`
    <div class="apps-cat">
      <h3>${c} · HalDo ${catName(c)} (${grouped[c].length})</h3>
      <div class="apps-grid">
        ${grouped[c].map(a=>`<div class="app-tile" onclick="event.stopPropagation();(${a.fn.toString()})()"><div class="ico">${a.i}</div><div class="nm">${esc(a.n)}</div></div>`).join('')}
      </div>
    </div>`).join('');
  HalDo.wm.open('apps','📱 Alle Apps A-Z',html,{w:560,h:640});
}
function catName(c){
  const names={A:'AI & Assistant',B:'Bildung',C:'Fahrschule',D:'Gesundheit',E:'Arbeit',F:'Finanzen',G:'Zuhause',H:'World',I:'Wissen',J:'Kultur & Religion',K:'Keyboard',L:'Lernen',M:'Medien',N:'Notizen',O:'Online',P:'Kreativität',Q:'Wissenschaft',R:'Sicherheit',S:'System',T:'Travel',U:'Universität',V:'Voice',W:'Windows',X:'Explorer',Y:'Your Life',Z:'Entwickler'};
  return names[c]||c;
}

function openSetup(){
  const html=`<div class="col">
    <div class="card"><h4>🎨 Theme wechseln</h4>
      <div class="row">${Object.entries(HalDo.theme.presets).map(([k,v])=>`<button class="chip ${HalDo.theme.current===k?'active':''}" onclick="HalDo.theme.apply('${k}')">${v.name}</button>`).join('')}</div>
    </div>
    <div class="card"><h4>⚡ CYBORG-Modus</h4>
      <p class="muted" style="margin-bottom:8px">Wechselt zwischen Standard (Cyan) und CYBORG (Pink/Violett).</p>
      <button class="btn" onclick="HalDo.theme.toggleCyborg()">CYBORG umschalten</button>
    </div>
    <div class="card"><h4>💾 Daten-Export</h4>
      <button class="btn" onclick="exportAll()">JSON Export</button>
    </div>
    <div class="card"><h4>⚠️ Reset</h4>
      <button class="btn danger" onclick="if(confirm('Alle Daten löschen?')){localStorage.clear();location.reload()}">Factory Reset</button>
    </div>
  </div>`;
  HalDo.wm.open('setup','🔧 Setup',html,{w:440,h:460});
}

function exportAll(){
  const all={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('haldo_')) all[k]=LS.get(k);
  }
  const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='haldo-export-'+Date.now()+'.json'; a.click();
  URL.revokeObjectURL(url);
  HalDo.toast('Export gestartet','ok');
}
