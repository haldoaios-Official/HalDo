<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root {
  --bg:#0a0e1a; --bg2:rgba(17,24,39,.85); --bg3:#1f2937; --border:#374151;
  --text:#f3f4f6; --dim:#9ca3af; --accent:#06b6d4; --accent2:#3b82f6;
  --success:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --radius:12px; --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; overflow:hidden; background:#000; user-select:none; }
body { font-family:var(--font); color:var(--text); font-size:14px; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea,select { font-family:inherit; background:var(--bg2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; width:100%; outline:none; font-size:14px; }
input:focus,textarea:focus,select:focus { border-color:var(--accent); }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }

/* 3D HINTERGRUND */
#cosmos-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; width:100%; height:100%; }
#cyborg-canvas { position:fixed; inset:0; z-index:1; pointer-events:none; width:100%; height:100%; }

/* WELCOME */
#welcome { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:9999; gap:20px; padding:40px; text-align:center; background:rgba(0,0,0,0.6); backdrop-filter:blur(10px); transition:opacity 0.5s; }
#welcome.hide { opacity:0; pointer-events:none; }
#welcome h1 { font-size:clamp(32px,5.5vw,64px); font-weight:900; letter-spacing:4px; background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 30px rgba(251,191,36,.8); }
#welcome h2 { font-size:clamp(16px,2vw,22px); color:#e5e7eb; font-weight:400; line-height:1.6; }
#welcome .presented { font-size:12px; color:#9ca3af; letter-spacing:3px; text-transform:uppercase; }
#welcome .presented b { color:#fbbf24; }
#welcome .enter-btn { margin-top:20px; padding:16px 48px; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:30px; font-size:16px; font-weight:700; letter-spacing:2px; box-shadow:0 0 40px rgba(6,182,212,.6); transition:transform .2s; color:#fff; }
#welcome .enter-btn:hover { transform:scale(1.05); }

/* TASKBAR */
#taskbar { position:fixed; bottom:0; left:0; right:0; height:50px; background:rgba(17,24,39,.95); backdrop-filter:blur(15px); border-top:1px solid var(--border); display:none; align-items:center; padding:0 20px; gap:10px; z-index:9997; }
#taskbar.show { display:flex; }
.start-btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); padding:8px 16px; border-radius:8px; font-weight:bold; display:flex; align-items:center; gap:8px; color:#fff; cursor:pointer; }
.taskbar-apps { flex:1; display:flex; gap:8px; overflow:hidden; }
.taskbar-app { background:rgba(55,65,81,.5); padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; border:1px solid transparent; }
.taskbar-app:hover { border-color:var(--accent); background:rgba(31,41,55,.8); }
.taskbar-app.active { border-color:var(--accent); background:rgba(6,182,212,.2); }
#sys-clock { color:var(--dim); font-size:13px; font-weight:600; }

/* START MENÜ */
#start-menu { position:fixed; bottom:60px; left:10px; width:420px; max-height:80vh; background:rgba(17,24,39,.98); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:12px; display:none; flex-direction:column; overflow:hidden; z-index:9998; box-shadow:0 -10px 40px rgba(0,0,0,.8); }
#start-menu.show { display:flex; }
.sm-header { padding:16px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; font-weight:bold; color:var(--accent); }
.sm-search { padding:10px; border-bottom:1px solid var(--border); }
.sm-search input { background:rgba(0,0,0,0.3); border:none; padding:8px 12px; border-radius:6px; }
.sm-apps { flex:1; overflow-y:auto; padding:10px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.sm-app-card { display:flex; flex-direction:column; align-items:center; padding:10px; border-radius:8px; cursor:pointer; transition:background .2s; }
.sm-app-card:hover { background:rgba(55,65,81,.5); }
.sm-app-card .ico { font-size:28px; margin-bottom:6px; }
.sm-app-card .nm { font-size:11px; text-align:center; line-height:1.2; }

/* WINDOW MANAGER */
.window { position:fixed; background:rgba(10,14,26,.95); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; z-index:10; box-shadow:0 20px 50px rgba(0,0,0,.7); resize:both; min-width:400px; min-height:300px; }
.window.minimized { display:none; }
.window-header { padding:12px 16px; background:rgba(0,0,0,0.4); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; cursor:move; user-select:none; }
.window-title { font-weight:600; color:var(--accent); display:flex; align-items:center; gap:10px; }
.window-controls { display:flex; gap:8px; }
.win-btn { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.1); transition:background .2s; }
.win-btn:hover { background:rgba(255,255,255,0.2); }
.win-btn.close:hover { background:var(--danger); }
.window-body { flex:1; overflow:hidden; padding:0; display:flex; }

/* SPLASH */
#app-splash { position:fixed; inset:0; z-index:99999; display:none; align-items:center; justify-content:center; flex-direction:column; gap:20px; background:radial-gradient(circle at 50% 50%, rgba(6,182,212,.2) 0%, rgba(5,8,16,.98) 75%); backdrop-filter:blur(10px); }
#app-splash.show { display:flex; animation:splashIn .3s; }
.splash-icon { font-size:110px; filter:drop-shadow(0 0 40px #06b6d4); animation:starGlow 1.2s ease-out; }
.splash-name { font-size:32px; font-weight:800; background:linear-gradient(90deg,#fde047,#f59e0b); -webkit-background-clip:text; background-clip:text; color:transparent; }
.splash-presented { font-size:12px; color:var(--dim); letter-spacing:4px; text-transform:uppercase; }
.splash-presented b { color:#fbbf24; }
@keyframes splashIn { from { opacity:0; } to { opacity:1; } }
@keyframes starGlow { 0% { transform:scale(0) rotate(0deg); } 50% { transform:scale(1.2) rotate(180deg); } 100% { transform:scale(1) rotate(360deg); } }

/* APP-INHALT (Sidebar + Content) */
.app-sidebar { width:170px; flex:none; padding:10px 8px; background:rgba(0,10,20,.6); border-right:1px solid rgba(55,65,81,.5); display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
.side-btn { text-align:left; padding:9px 12px; font-size:12px; background:transparent; border:1px solid transparent; color:#a0c8e0; cursor:pointer; border-radius:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-btn:hover { background:rgba(55,65,81,.5); color:#fff; }
.side-btn.active { background:rgba(6,182,212,.2); border-color:var(--accent); color:#fff; }
.side-btn.speak-btn { margin-top:auto; color:var(--accent); }
.app-content { flex:1; padding:18px; overflow-y:auto; min-width:0; }
.app-content h3 { margin-bottom:12px; color:var(--accent); font-size:16px; letter-spacing:.5px; }
.app-content input, .app-content select, .app-content textarea { margin-bottom:8px; }
.app-content button { padding:9px 16px; margin:4px 4px 4px 0; background:var(--accent); border:1px solid var(--accent); color:#fff; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; }
.app-content button:hover { background:var(--accent2); border-color:var(--accent2); }
.app-content button.danger { background:var(--danger); border-color:var(--danger); }
.app-content button.ghost { background:transparent; color:var(--text); border-color:var(--border); }
.list-row { display:flex; align-items:center; gap:8px; padding:10px 12px; background:rgba(55,65,81,.3); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:13px; margin-bottom:6px; }
.list-row:hover { background:rgba(55,65,81,.6); border-color:var(--accent); }
.list-row .meta { color:var(--dim); font-size:11px; margin-left:auto; }
.muted { color:var(--dim); }
.flash { color:var(--accent); font-size:12px; margin-top:8px; }
.qt-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.qt-panel { background:rgba(31,41,55,.5); padding:14px; border-radius:10px; border:1px solid var(--border); }
.qt-panel h4 { margin-bottom:8px; font-size:12px; color:var(--accent); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; font-size:11px; margin-top:10px; }
.cal-cell { min-height:56px; padding:3px; background:rgba(55,65,81,.4); border:1px solid var(--border); border-radius:4px; cursor:pointer; }
.cal-cell:hover { background:rgba(55,65,81,.8); }
.cal-cell .day { color:var(--accent); font-weight:700; font-size:10px; }
.cal-cell.today { border-color:var(--accent); box-shadow:0 0 6px rgba(6,182,212,.4); }
.cal-head { color:var(--accent); text-align:center; padding:3px; font-weight:700; font-size:10px; }
.chat-box { display:flex; flex-direction:column; height:100%; }
.chat-log { flex:1; overflow-y:auto; padding:10px; background:rgba(0,0,0,.3); border-radius:10px; border:1px solid var(--border); margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
.msg { padding:8px 12px; border-radius:10px; font-size:13px; max-width:85%; line-height:1.5; }
.msg.user { align-self:flex-end; background:var(--accent); color:#fff; }
.msg.ai { align-self:flex-start; background:rgba(31,41,55,.9); border:1px solid var(--border); }
.chat-input { display:flex; gap:8px; }
.chat-input input { flex:1; margin:0; }
.chat-input button { margin:0; }
.anatomy-wrap { width:100%; height:calc(100% - 5px); min-height:380px; border:1px solid var(--border); border-radius:10px; overflow:hidden; position:relative; background:#001122; }
.layer-toggles { position:absolute; top:10px; left:10px; z-index:2; display:flex; gap:10px; font-size:11px; background:rgba(0,20,40,.8); padding:6px 10px; border:1px solid var(--accent); border-radius:6px; }
.layer-toggles label { display:flex; align-items:center; gap:4px; cursor:pointer; color:#b8e6ff; }
.layer-toggles input { width:auto; margin:0; }
</style>

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = LANGCODES[currentLang] || 'de-DE';
  u.rate = parseFloat(localStorage.getItem('haldo_voice_rate') || 1.0);
  u.pitch = parseFloat(localStorage.getItem('haldo_voice_pitch') || 1.0);
  speechSynthesis.speak(u);
}

function initCosmos() {
  try {
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 18);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const starGeo = new THREE.BufferGeometry();
    const posArr = new Float32Array(8000*3);
    const colArr = new Float32Array(8000*3);
    for (let i=0; i<8000*3; i++) { posArr[i] = (Math.random()-0.5)*400; colArr[i] = Math.random()*0.5+0.5; }
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size:0.3, vertexColors:true, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending })));

    const sunCanvas = document.createElement('canvas'); sunCanvas.width = sunCanvas.height = 512;
    const sCtx = sunCanvas.getContext('2d');
    sCtx.fillStyle = '#ffaa00'; sCtx.fillRect(0,0,512,512);
    for (let i=0; i<2000; i++) {
      sCtx.fillStyle = Math.random() > 0.5 ? '#ffdd00' : '#ff5500';
      sCtx.beginPath(); sCtx.arc(Math.random()*512, Math.random()*512, Math.random()*10, 0, Math.PI*2); sCtx.fill();
    }
    const sun = new THREE.Mesh(new THREE.SphereGeometry(4, 64, 64), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sunCanvas) }));
    sun.position.set(16, 10, -15); scene.add(sun);

    const moon = new THREE.Mesh(new THREE.SphereGeometry(1.8, 64, 64), new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg'), roughness:0.9 }));
    moon.position.set(-14, 8, -10); scene.add(moon);

    const earth = new THREE.Mesh(new THREE.SphereGeometry(3.5, 64, 64), new THREE.MeshStandardMaterial({
      map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
      roughness:0.5, emissive:0x112244, emissiveIntensity:1.0
    }));
    scene.add(earth);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sunLight = new THREE.DirectionalLight(0xfff8e1, 3.0); sunLight.position.copy(sun.position); scene.add(sunLight);

    (function animate() {
      requestAnimationFrame(animate);
      earth.rotation.y += 0.001; moon.rotation.y += 0.002; sun.rotation.y += 0.001;
      renderer.render(scene, camera);
    })();
    addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  } catch(e) { console.warn('Cosmos:', e); }
}

/* ==================== CYBORG (GLTF) ==================== */
let A = {scene:null, cam:null, ren:null, ctrl:null, current:null};
function initCyborg() {
  try {
    const canvas = document.getElementById('cyborg-canvas');
    A.scene = new THREE.Scene();
    A.cam = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
    A.cam.position.set(0, 1.2, 4);
    A.ren = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    A.ren.setSize(innerWidth, innerHeight);
    A.ren.setPixelRatio(Math.min(devicePixelRatio, 2));
    A.ren.setClearColor(0x000000, 0);
    A.ctrl = new THREE.OrbitControls(A.cam, A.ren.domElement);
    A.ctrl.enableDamping = true; A.ctrl.enablePan = false; A.ctrl.minDistance = 1.0; A.ctrl.maxDistance = 8;
    A.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(3,4,5); A.scene.add(d1);
    const d2 = new THREE.DirectionalLight(0x06b6d4, 1.5); d2.position.set(-3,2,-5); A.scene.add(d2);

    const loader = new THREE.GLTFLoader();
    function loadModel(url, isManual) {
      loader.load(url, gltf => {
        if (A.current) A.scene.remove(A.current);
        const m = gltf.scene;
        m.traverse(o => { if (o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
        A.scene.add(m); A.current = m;
        const box = new THREE.Box3().setFromObject(m);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        m.position.x = -center.x; m.position.y = -box.min.y; m.position.z = -center.z;
        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = A.cam.fov * (Math.PI/180);
        const cameraZ = Math.abs(maxDim/2/Math.tan(fov/2)) * 1.3;
        A.cam.position.set(0, size.y/2, cameraZ);
        A.ctrl.target.set(0, size.y/2, 0); A.ctrl.update();
        const el = document.getElementById('glb-uploader'); if (el) el.style.display = 'none';
      }, undefined, () => {
        if (!isManual) {
          const el = document.getElementById('glb-uploader'); if (el) el.style.borderColor = 'var(--danger)';
          const geo = new THREE.CapsuleGeometry(0.3, 1.2, 16, 32);
          const mat = new THREE.MeshBasicMaterial({ color:0x06b6d4, wireframe:true, transparent:true, opacity:0.5 });
          const mesh = new THREE.Mesh(geo, mat); mesh.position.y = 0.9;
          A.scene.add(mesh); A.cam.position.set(0,1,3); A.ctrl.target.set(0,1,0);
        }
      });
    }
    loadModel('./male_base.glb');
    const fileInp = document.getElementById('manual-glb');
    if (fileInp) fileInp.addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      loadModel(URL.createObjectURL(f), true);
    });
    (function loop() { requestAnimationFrame(loop); A.ctrl.update(); A.ren.render(A.scene, A.cam); })();
    addEventListener('resize', () => { A.cam.aspect = innerWidth/innerHeight; A.cam.updateProjectionMatrix(); A.ren.setSize(innerWidth, innerHeight); });
  } catch(e) { console.warn('Cyborg:', e); }
}

/* ==================== WINDOW MANAGER ==================== */
const openWindows = {};
let zCounter = 20;
const nextZ = () => zCounter++;

function openApp(id) {
  const def = REGISTRY.find(a => a.id === id); if (!def) return;
  const splash = document.getElementById('app-splash');
  splash.querySelector('.splash-icon').textContent = def.ico;
  splash.querySelector('.splash-name').textContent = def.nm;
  splash.classList.add('show');
  setTimeout(() => splash.classList.remove('show'), 900);
  document.getElementById('start-menu').classList.remove('show');

  if (openWindows[id]) {
    const win = document.getElementById('win-'+id);
    if (win) { win.classList.remove('minimized'); win.style.zIndex = nextZ(); }
    return;
  }

  const win = document.createElement('div');
  win.className = 'window'; win.id = 'win-'+id;
  win.style.width = '880px'; win.style.height = '600px';
  win.style.left = (80 + Object.keys(openWindows).length*25) + 'px';
  win.style.top = (40 + Object.keys(openWindows).length*25) + 'px';
  win.style.zIndex = nextZ();
  win.innerHTML = `
    <div class="window-header" onmousedown="startDrag(event,'${id}')">
      <div class="window-title">${def.ico} ${def.nm}</div>
      <div class="window-controls">
        <button class="win-btn" onclick="event.stopPropagation();minimizeApp('${id}')">—</button>
        <button class="win-btn" onclick="event.stopPropagation();maximizeApp('${id}')">▢</button>
        <button class="win-btn close" onclick="event.stopPropagation();closeApp('${id}')">✕</button>
      </div>
    </div>
    <div class="window-body" id="body-${id}"></div>
  `;
  document.body.appendChild(win);
  openWindows[id] = true;
  document.getElementById('taskbar-apps').innerHTML += `<div class="taskbar-app" id="tb-${id}" onclick="focusApp('${id}')">${def.ico} ${def.nm}</div>`;
  setTimeout(() => { try { def.fn(document.getElementById('body-'+id)); } catch(e) { console.error(e); document.getElementById('body-'+id).innerHTML = '<p style="color:#f77;padding:20px">Fehler: '+e.message+'</p>'; } }, 60);
}
function closeApp(id) {
  const w = document.getElementById('win-'+id); if (w) w.remove();
  const tb = document.getElementById('tb-'+id); if (tb) tb.remove();
  delete openWindows[id];
}
function focusApp(id) { const w = document.getElementById('win-'+id); if (w) { w.classList.remove('minimized'); w.style.zIndex = nextZ(); } }
function minimizeApp(id) { const w = document.getElementById('win-'+id); if (w) w.classList.toggle('minimized'); }
function maximizeApp(id) {
  const w = document.getElementById('win-'+id); if (!w) return;
  if (w.dataset.max === '1') {
    w.style.left = w.dataset.l; w.style.top = w.dataset.t;
    w.style.width = w.dataset.wd; w.style.height = w.dataset.ht;
    w.dataset.max = '0';
  } else {
    w.dataset.l = w.style.left; w.dataset.t = w.style.top;
    w.dataset.wd = w.style.width; w.dataset.ht = w.style.height;
    w.style.left = '0'; w.style.top = '0';
    w.style.width = '100vw'; w.style.height = 'calc(100vh - 50px)';
    w.dataset.max = '1';
  }
}

let dragState = null;
function startDrag(e, id) {
  if (e.target.closest('.win-btn')) return;
  const w = document.getElementById('win-'+id);
  dragState = { id, sx: e.clientX, sy: e.clientY, wx: w.offsetLeft, wy: w.offsetTop };
  w.style.zIndex = nextZ();
}
addEventListener('mousemove', e => {
  if (!dragState) return;
  const w = document.getElementById('win-'+dragState.id);
  if (!w || w.dataset.max === '1') return;
  w.style.left = (dragState.wx + e.clientX - dragState.sx) + 'px';
  w.style.top = (dragState.wy + e.clientY - dragState.sy) + 'px';
});
addEventListener('mouseup', () => { dragState = null; });

function makeCRUD(config) {
  return function(body) {
    body.style.cssText = 'display:flex;height:100%;';
    const sb = document.createElement('div'); sb.className = 'app-sidebar';
    const ct = document.createElement('div'); ct.className = 'app-content';
    body.appendChild(sb); body.appendChild(ct);

    let items = store('crud_'+config.id, config.initial || []);
    let selectedId = items[0] ? items[0].id : null;
    const persist = () => save('crud_'+config.id, items);
    const fields = config.fields;
    let active = 'select';

    function renderSidebar() {
      sb.innerHTML = '';
      ['create','edit','select','settings','delete'].forEach(k => {
        const b = document.createElement('button');
        b.className = 'side-btn' + (active===k?' active':'');
        b.textContent = T(k);
        b.onclick = () => { active = k; renderBody(); };
        sb.appendChild(b);
      });
      const sp = document.createElement('button');
      sp.className = 'side-btn speak-btn';
      sp.textContent = '🔊 ' + T('speak');
      sp.onclick = () => speak((config.title||config.id)+'. '+items.length+' Einträge.');
      sb.appendChild(sp);
    }

    function flash(msg) {
      const d = document.createElement('div'); d.className='flash'; d.textContent = msg;
      ct.appendChild(d); setTimeout(() => d.remove(), 1800);
    }

    function renderBody() {
      renderSidebar();
      ct.innerHTML = '';
      if (active === 'create') {
        ct.innerHTML = '<h3>'+T('create')+'</h3>';
        const form = document.createElement('form');
        fields.forEach(f => { const i = document.createElement('input'); i.name = f.name; i.placeholder = f.label; form.appendChild(i); });
        const b = document.createElement('button'); b.textContent = T('save'); form.appendChild(b);
        form.onsubmit = e => {
          e.preventDefault();
          const item = { id: Date.now() };
          fields.forEach(f => item[f.name] = form.querySelector('[name="'+f.name+'"]').value);
          items.push(item); persist(); form.reset(); flash('✓ '+T('save'));
        };
        ct.appendChild(form);
      } else if (active === 'edit') {
        ct.innerHTML = '<h3>'+T('edit')+'</h3>';
        if (!items.length) { ct.innerHTML += '<p class="muted">'+T('noEntries')+'</p>'; return; }
        if (!items.find(i => i.id===selectedId)) selectedId = items[0].id;
        const sel = document.createElement('select');
        items.forEach(it => { const o = document.createElement('option'); o.value = it.id; o.textContent = it[fields[0].name] || '#'+it.id; sel.appendChild(o); });
        sel.value = selectedId;
        sel.onchange = () => { selectedId = Number(sel.value); renderBody(); };
        ct.appendChild(sel);
        const item = items.find(i => i.id === selectedId);
        const form = document.createElement('form');
        fields.forEach(f => { const i = document.createElement('input'); i.name = f.name; i.placeholder = f.label; i.value = item[f.name]||''; form.appendChild(i); });
        const b = document.createElement('button'); b.textContent = T('save'); form.appendChild(b);
        form.onsubmit = e => {
          e.preventDefault();
          fields.forEach(f => item[f.name] = form.querySelector('[name="'+f.name+'"]').value);
          persist(); flash('✓ '+T('save')); renderBody();
        };
        ct.appendChild(form);
      } else if (active === 'select') {
        ct.innerHTML = '<h3>'+T('select')+'</h3>';
        const search = document.createElement('input'); search.placeholder = '🔍 '+T('search');
        ct.appendChild(search);
        const list = document.createElement('div'); ct.appendChild(list);
        const rl = () => {
          list.innerHTML = '';
          const q = search.value.toLowerCase();
          const filt = items.filter(it => !q || fields.some(f => String(it[f.name]||'').toLowerCase().includes(q)));
          if (!filt.length) { list.innerHTML = '<p class="muted">'+T('noEntries')+'</p>'; return; }
          filt.forEach(it => {
            const row = document.createElement('div'); row.className = 'list-row';
            row.innerHTML = '<span>'+esc(it[fields[0].name]||'—')+'</span>' + (fields[1]?'<span class="meta">'+esc(it[fields[1].name]||'')+'</span>':'');
            row.onclick = () => { selectedId = it.id; active = 'edit'; renderBody(); };
            list.appendChild(row);
          });
        };
        search.oninput = rl; rl();
      } else if (active === 'settings') {
        ct.innerHTML = '<h3>'+T('settings')+'</h3><p>'+T('total')+': <b>'+items.length+'</b></p>';
        const exp = document.createElement('button'); exp.textContent = '⬇ Export JSON';
        exp.onclick = () => { const blob = new Blob([JSON.stringify(items,null,2)],{type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = config.id+'.json'; a.click(); };
        ct.appendChild(exp);
        const wipe = document.createElement('button'); wipe.className = 'danger'; wipe.textContent = '🗑 Alles löschen';
        wipe.onclick = () => { if (confirm(T('confirm'))) { items = []; persist(); renderBody(); } };
        ct.appendChild(wipe);
      } else if (active === 'delete') {
        ct.innerHTML = '<h3>'+T('delete')+'</h3>';
        if (!items.length) { ct.innerHTML += '<p class="muted">'+T('noEntries')+'</p>'; return; }
        items.forEach(it => {
          const row = document.createElement('div'); row.className = 'list-row';
          row.innerHTML = '<span>'+esc(it[fields[0].name]||'—')+'</span>';
          const d = document.createElement('button'); d.className = 'danger'; d.textContent = '✕';
          d.onclick = () => { if (confirm(T('confirm'))) { items = items.filter(x => x.id !== it.id); persist(); renderBody(); } };
          row.appendChild(d); ct.appendChild(row);
        });
      }
    }
    renderBody();
  };
}

function viewAI(body) {
  body.style.cssText = 'display:flex;height:100%;padding:18px;';
  let chats = store('ai_chats', [{id:1,name:'Chat 1',messages:[{role:'ai',text:'Hallo! Ich bin HalDo AI. Was kann ich für dich tun?'}]}]);
  let currentId = chats[0].id;
  const persist = () => save('ai_chats', chats);
  const wrap = document.createElement('div'); wrap.className = 'chat-box'; wrap.style.flex='1';
  const log = document.createElement('div'); log.className = 'chat-log';
  const inputRow = document.createElement('div'); inputRow.className = 'chat-input';
  const inp = document.createElement('input'); inp.placeholder = 'Nachricht…';
  const snd = document.createElement('button'); snd.textContent = '➤';
  const topBar = document.createElement('div'); topBar.style.cssText='display:flex;gap:8px;margin-bottom:8px;';
  const newBtn = document.createElement('button'); newBtn.textContent = '+ Neuer Chat';
  newBtn.onclick = () => { const id = Date.now(); chats.push({id,name:'Chat '+chats.length,messages:[{role:'ai',text:'Neuer Chat gestartet.'}]}); currentId=id; persist(); render(); };
  const speakBtn = document.createElement('button'); speakBtn.className='ghost'; speakBtn.textContent = '🔊 Vorlesen';
  speakBtn.onclick = () => { const c = chats.find(x=>x.id===currentId); if (c && c.messages.length) speak(c.messages[c.messages.length-1].text); };
  topBar.appendChild(newBtn); topBar.appendChild(speakBtn);
  wrap.appendChild(topBar); wrap.appendChild(log); inputRow.appendChild(inp); inputRow.appendChild(snd); wrap.appendChild(inputRow);
  body.appendChild(wrap);

  function render() {
    const c = chats.find(x=>x.id===currentId) || chats[0];
    log.innerHTML = '';
    c.messages.forEach(m => { const d = document.createElement('div'); d.className = 'msg '+m.role; d.textContent = m.text; log.appendChild(d); });
    log.scrollTop = log.scrollHeight;
  }
  function send() {
    const v = inp.value.trim(); if (!v) return;
    const c = chats.find(x=>x.id===currentId);
    c.messages.push({role:'user',text:v}); persist(); inp.value=''; render();
    setTimeout(() => {
      let reply = demotextAI(v);
      c.messages.push({role:'ai',text:reply}); persist(); render(); speak(reply);
    }, 300);
  }
  snd.onclick = send;
  inp.onkeydown = e => { if (e.key==='Enter') send(); };
  render();
}
function demotextAI(q) {
  const ql = q.toLowerCase();
  if (/hallo|hi|hey/.test(ql)) return 'Hallo Bruder! Wie kann ich dir helfen?';
  if (/herz/.test(ql)) return 'Das Herz ist ein muskuläres Hohlorgan mit vier Kammern: zwei Vorhöfe und zwei Ventrikel. Es pumpt sauerstoffarmes Blut aus dem Körper und sauerstoffreiches aus der Lunge.';
  if (/kopf/.test(ql)) return 'Bei Kopfschmerzen: Ruhe, Wasser trinken, frische Luft. Bei anhaltenden Beschwerden bitte einen Arzt aufsuchen.';
  if (/arztbrief|bericht/.test(ql)) return 'Sehr geehrte Kollegin, sehr geehrter Kollege, hiermit berichten wir über den Aufenthalt des Patienten. Diagnose: … Therapie: … Empfehlung: …';
  return 'Interessante Frage: "'+q+'". Im Demo-Modus antworte ich vorbereitet. Trage in den Einstellungen (Sicherheit) einen API-Key ein, um die Live-KI zu aktivieren.';
}

    sb.innerHTML = '';

      sb.appendChild(b);
    });

    ct.innerHTML = '';
    if (active === 'select') {
      const head = document.createElement('div'); head.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px;';
      const prev = document.createElement('button'); prev.textContent='◀';
      prev.onclick = () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1); render(); };
      const next = document.createElement('button'); next.textContent='▶';
      next.onclick = () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1); render(); };
      const title = document.createElement('h3'); title.style.margin='0'; title.style.flex='1';
      title.textContent = viewDate.toLocaleString(currentLang, {month:'long',year:'numeric'});
      head.appendChild(prev); head.appendChild(title); head.appendChild(next);
      ct.appendChild(head);
      const grid = document.createElement('div'); grid.className='cal-grid';
      ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d => { const c = document.createElement('div'); c.className='cal-head'; c.textContent=d; grid.appendChild(c); });
      const y = viewDate.getFullYear(), m = viewDate.getMonth();
      const startDay = (new Date(y,m,1).getDay()+6)%7;
      const days = new Date(y,m+1,0).getDate();
      const today = new Date();
      for (let i=0;i<startDay;i++) grid.appendChild(document.createElement('div'));
      for (let d=1;d<=days;d++) {
        const c = document.createElement('div'); c.className='cal-cell';
        const dt = new Date(y,m,d);
        if (dt.toDateString()===today.toDateString()) c.classList.add('today');
        c.innerHTML = '<div class="day">'+d+'</div>';
        const key = dt.toISOString().slice(0,10);
        events.filter(e=>e.date===key).forEach(e => {
          const ev = document.createElement('div');
          ev.style.cssText='font-size:10px;background:rgba(6,182,212,.4);color:#fff;padding:1px 3px;margin-top:2px;border-radius:2px;';
          ev.textContent = e.title; c.appendChild(ev);
        });
        c.onclick = () => { const tit = prompt('Termin am '+d+'.'+(m+1)+'.'+y+':',''); if (tit) { events.push({id:Date.now(),title:tit,date:key}); persist(); render(); } };
        grid.appendChild(c);
      }
      ct.appendChild(grid);
    } else if (active === 'create') {
      ct.innerHTML = '<h3>➕ Termin</h3>';
      const form = document.createElement('form');
      const ti = document.createElement('input'); ti.placeholder='Titel'; form.appendChild(ti);
      const di = document.createElement('input'); di.type='date'; di.value = new Date().toISOString().slice(0,10); form.appendChild(di);
      const b = document.createElement('button'); b.textContent = T('save'); form.appendChild(b);
      form.onsubmit = e => { e.preventDefault(); events.push({id:Date.now(),title:ti.value,date:di.value}); persist(); active='select'; render(); };
      ct.appendChild(form);
    } else {
      ct.innerHTML = '<h3>🗑 Termine löschen</h3>';
      events.forEach(ev => {
        const row = document.createElement('div'); row.className='list-row';
        row.innerHTML = '<span>'+esc(ev.title)+'</span><span class="meta">'+ev.date+'</span>';
        const d = document.createElement('button'); d.className='danger'; d.textContent='✕';
        d.onclick = () => { if (confirm(T('confirm'))) { events = events.filter(x=>x.id!==ev.id); persist(); render(); } };
        row.appendChild(d); ct.appendChild(row);
      });
    }
  }
  render();
}

/* H: Health (mit 3D Anatomie) */
function viewHealth(body) {
  body.style.cssText = 'display:flex;height:100%;';
  const sb = document.createElement('div'); sb.className='app-sidebar';
  const ct = document.createElement('div'); ct.className='app-content';
  body.appendChild(sb); body.appendChild(ct);
  const sections = [
    ['anatomy','🧬 3D Anatomie'],
    ['diseases','🦠 Krankheiten'],
    ['meds','💊 Medikamente'],
    ['labs','🧪 Laborwerte'],
    ['vitals','❤ Vitalwerte'],
    ['emergency','🚨 Notfall']
  ];
  let active = 'anatomy';
  let raf, cleanup = null;

  function render() {
    sb.innerHTML = '';
    sections.forEach(([id,label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active===id?' active':'');
      b.textContent = label; b.onclick = () => { active = id; render(); };
      sb.appendChild(b);
    });
    const sp = document.createElement('button'); sp.className='side-btn speak-btn'; sp.textContent='🔊 '+T('speak');
    sp.onclick = () => speak('HalDo Arztbuch. Anatomie, Krankheiten, Medikamente, Laborwerte, Vitalwerte.');
    sb.appendChild(sp);

    if (cleanup) { try { cleanup(); } catch(e) {} cleanup = null; }
    ct.innerHTML = '';
    if (active === 'anatomy') initAnatomy();
    else if (active === 'emergency') {
      ct.innerHTML = '<h3>🚨 NOTFALL</h3><p>Notruf: <b style="color:#ef4444;font-size:28px">112</b></p><p class="muted">Bei Herzinfarkt, Schlaganfall, schweren Unfällen sofort anrufen.</p><button class="danger" onclick="window.location.href=\'tel:112\'">📞 112 anrufen</button>';
    } else {
      const key = {diseases:'health_diseases',meds:'health_meds',labs:'health_labs',vitals:'health_vitals'}[active];
      const fields = {diseases:[{name:'name',label:'Krankheit'},{name:'icd',label:'ICD-10'},{name:'desc',label:'Beschreibung'}],meds:[{name:'name',label:'Medikament'},{name:'dose',label:'Dosierung'},{name:'info',label:'Info'}],labs:[{name:'name',label:'Laborwert'},{name:'value',label:'Wert'},{name:'unit',label:'Einheit'}],vitals:[{name:'name',label:'Vitalwert'},{name:'value',label:'Wert'},{name:'date',label:'Datum'}]}[active];
      const cfg = {id:key, fields, title:sections.find(s=>s[0]===active)[1]};
      makeCRUD({id:key, fields, initial:[]})(ct);
    }
  }

  function initAnatomy() {
    const wrap = document.createElement('div'); wrap.className = 'anatomy-wrap'; ct.appendChild(wrap);
    if (typeof THREE === 'undefined') { wrap.innerHTML='<p style="padding:20px;color:#f88">Three.js fehlt.</p>'; return; }
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setClearColor(0x001122, 1);
    wrap.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth/wrap.clientHeight, 0.1, 100);
    camera.position.set(0, 1.2, 4); camera.lookAt(0, 0.7, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(2,4,3); scene.add(dl);
    const dl2 = new THREE.DirectionalLight(0x88ccff, 0.5); dl2.position.set(-3,1,-2); scene.add(dl2);
    const skel = new THREE.Group(); const org = new THREE.Group();
    const boneMat = new THREE.MeshStandardMaterial({ color:0xeeeecc, roughness:0.6 });
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.22,24,24), boneMat); skull.position.y=1.5; skel.add(skull);
    for (let i=0;i<8;i++) { const v = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.09,12), boneMat); v.position.y = 1.2 - i*0.11; skel.add(v); }
    for (let i=0;i<5;i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(0.25,0.018,8,22,Math.PI), boneMat); r.position.y = 1.1 - i*0.1; r.rotation.y = Math.PI/2; skel.add(r); }
    const pelv = new THREE.Mesh(new THREE.TorusGeometry(0.2,0.035,8,20), boneMat); pelv.position.y=0.42; pelv.rotation.x=Math.PI/2; skel.add(pelv);
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.75,12), boneMat); armL.position.set(0.38,1.0,0); skel.add(armL);
    const armR = armL.clone(); armR.position.x=-0.38; skel.add(armR);
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.05,0.95,12), boneMat); legL.position.set(0.12,0,0); skel.add(legL);
    const legR = legL.clone(); legR.position.x=-0.12; skel.add(legR);
    scene.add(skel);
    const brain = new THREE.Mesh(new THREE.SphereGeometry(0.16,20,20), new THREE.MeshStandardMaterial({ color:0xff88aa, roughness:0.5 })); brain.position.y=1.5; org.add(brain);
    const heart = new THREE.Mesh(new THREE.SphereGeometry(0.1,16,16), new THREE.MeshStandardMaterial({ color:0xcc2222, roughness:0.35 })); heart.position.set(0.05,1.0,0.02); org.add(heart);
    const lungL = new THREE.Mesh(new THREE.SphereGeometry(0.13,16,16), new THREE.MeshStandardMaterial({ color:0xffaabb, roughness:0.5 })); lungL.position.set(0.16,1.05,0); lungL.scale.set(1,1.4,1); org.add(lungL);
    const lungR = lungL.clone(); lungR.position.x=-0.16; org.add(lungR);
    const liver = new THREE.Mesh(new THREE.SphereGeometry(0.13,16,16), new THREE.MeshStandardMaterial({ color:0x884422, roughness:0.5 })); liver.position.set(-0.08,0.75,0); liver.scale.set(1.3,0.7,1); org.add(liver);
    const stomach = new THREE.Mesh(new THREE.SphereGeometry(0.1,16,16), new THREE.MeshStandardMaterial({ color:0xddaa66, roughness:0.5 })); stomach.position.set(0.08,0.7,0); org.add(stomach);
    scene.add(org);
    const tg = document.createElement('div'); tg.className='layer-toggles';
    tg.innerHTML = '<label><input type="checkbox" data-layer="sk" checked> Skelett</label><label><input type="checkbox" data-layer="or" checked> Organe</label>';
    tg.querySelectorAll('input').forEach(cb => cb.onchange = () => {
      if (cb.dataset.layer==='sk') skel.visible = cb.checked;
      if (cb.dataset.layer==='or') org.visible = cb.checked;
    });
    wrap.appendChild(tg);
    let rot = 0;
    function anim() { raf = requestAnimationFrame(anim); rot+=0.006; skel.rotation.y=rot; org.rotation.y=rot; renderer.render(scene, camera); }
    anim();
    const ro = new ResizeObserver(() => { const w = wrap.clientWidth, h = wrap.clientHeight; if (w&&h) { renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); } });
    ro.observe(wrap);
    cleanup = () => { cancelAnimationFrame(raf); ro.disconnect(); renderer.dispose(); };
  }
  render();
}

function viewRecorder(body) {
  body.style.cssText = 'display:flex;height:100%;';
  let recs = store('recordings', []);
  const persist = () => save('recordings', recs);
  const sb = document.createElement('div'); sb.className='app-sidebar';
  const ct = document.createElement('div'); ct.className='app-content';
  body.appendChild(sb); body.appendChild(ct);
  let mr = null, chunks = [];
  let active = 'select';

  function render() {
    sb.innerHTML = '';
    [['select','🎙 Aufnahmen'],['create','⏺ Neu'],['delete','🗑 Löschen']].forEach(([id,label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active===id?' active':'');
      b.textContent = label; b.onclick = () => { active = id; render(); };
      sb.appendChild(b);
    });
    const sp = document.createElement('button'); sp.className='side-btn speak-btn'; sp.textContent='🔊 '+T('speak');
    sp.onclick = () => speak('Recorder. '+recs.length+' Aufnahmen.');
    sb.appendChild(sp);
    ct.innerHTML = '';
    if (active === 'select') {
      ct.innerHTML = '<h3>🎙 Aufnahmen</h3>';
      if (!recs.length) { ct.innerHTML += '<p class="muted">'+T('noEntries')+'</p>'; return; }
      recs.forEach(r => {
        const p = document.createElement('div'); p.className='qt-panel'; p.style.marginBottom='8px';
        p.innerHTML = '<h4>'+esc(r.name)+'</h4>';
        const a = document.createElement('audio'); a.controls=true; a.src=r.url; a.style.cssText='width:100%';
        p.appendChild(a); ct.appendChild(p);
      });
    } else if (active === 'create') {
      ct.innerHTML = '<h3>⏺ Aufnahme</h3>';
      const start = document.createElement('button'); start.textContent='⏺ Start';
      const stop = document.createElement('button'); stop.textContent='⏹ Stop';
      const status = document.createElement('div'); status.style.cssText='margin-top:10px;color:#06b6d4;';
      start.onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({audio:true});
          mr = new MediaRecorder(stream); chunks = [];
          mr.ondataavailable = e => chunks.push(e.data);
          mr.onstop = () => {
            const blob = new Blob(chunks, {type:'audio/webm'});
            recs.push({id:Date.now(),url:URL.createObjectURL(blob),name:'Aufnahme '+new Date().toLocaleTimeString()});
            persist();
            stream.getTracks().forEach(t=>t.stop());
            active='select'; render();
          };
          mr.start(); status.textContent='⏺ Läuft…';
        } catch(e) { status.textContent = 'Mikrofon-Fehler: '+e.message; }
      };
      stop.onclick = () => { if (mr && mr.state==='recording') mr.stop(); };
      ct.appendChild(start); ct.appendChild(stop); ct.appendChild(status);
    } else {
      ct.innerHTML = '<h3>🗑 Löschen</h3>';
      recs.forEach(r => {
        const row = document.createElement('div'); row.className='list-row';
        row.innerHTML = '<span>'+esc(r.name)+'</span>';
        const d = document.createElement('button'); d.className='danger'; d.textContent='✕';
        d.onclick = () => { if (confirm(T('confirm'))) { recs = recs.filter(x=>x.id!==r.id); persist(); render(); } };
        row.appendChild(d); ct.appendChild(row);
      });
    }
  }
  render();
}

  body.appendChild(sp);

/* V: Video Studio */
function viewVideo(body) {
  body.style.cssText = 'display:flex;height:100%;';
  let vids = store('videos', []);
  const persist = () => save('videos', vids);
  const sb = document.createElement('div'); sb.className='app-sidebar';
  const ct = document.createElement('div'); ct.className='app-content';
  body.appendChild(sb); body.appendChild(ct);
  let active = 'select';

  function render() {
    sb.innerHTML = '';
    [['select','🎬 Videos'],['create','➕ Import'],['delete','🗑 Löschen']].forEach(([id,label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active===id?' active':'');
      b.textContent = label; b.onclick = () => { active = id; render(); };
      sb.appendChild(b);
    });
    const sp = document.createElement('button'); sp.className='side-btn speak-btn'; sp.textContent='🔊 '+T('speak');
    sp.onclick = () => speak('Video Studio. '+vids.length+' Videos.');
    sb.appendChild(sp);
    ct.innerHTML = '';
    if (active === 'select') {
      ct.innerHTML = '<h3>🎬 Videos</h3>';
      if (!vids.length) { ct.innerHTML += '<p class="muted">'+T('noEntries')+'</p>'; return; }
      vids.forEach(v => {
        const p = document.createElement('div'); p.className='qt-panel'; p.style.marginBottom='8px';
        p.innerHTML = '<h4>'+esc(v.name)+'</h4>';
        const vd = document.createElement('video'); vd.controls=true; vd.src=v.url; vd.style.cssText='width:100%';
        p.appendChild(vd); ct.appendChild(p);
      });
    } else if (active === 'create') {
      ct.innerHTML = '<h3>➕ Video importieren</h3>';
      const inp = document.createElement('input'); inp.type='file'; inp.accept='video/*';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => { vids.push({id:Date.now(),name:f.name,url:r.result}); persist(); active='select'; render(); };
        r.readAsDataURL(f);
      };
      ct.appendChild(inp);
    } else {
      ct.innerHTML = '<h3>🗑 Löschen</h3>';
      vids.forEach(v => {
        const row = document.createElement('div'); row.className='list-row';
        row.innerHTML = '<span>'+esc(v.name)+'</span>';
        const d = document.createElement('button'); d.className='danger'; d.textContent='✕';
        d.onclick = () => { if (confirm(T('confirm'))) { vids = vids.filter(x=>x.id!==v.id); persist(); render(); } };
        row.appendChild(d); ct.appendChild(row);
      });
    }
  }
  render();
}

/* W: Weather */
function viewWeather(body) {
  body.style.cssText = 'padding:18px;overflow-y:auto;';
  body.innerHTML = '<h3>🌤️ Wetter</h3>';
  const out = document.createElement('div'); out.id='wx-out'; out.style.cssText='font-size:18px;margin:20px 0;';
  body.appendChild(out);
  const btn = document.createElement('button'); btn.textContent='📍 Standort';
  btn.onclick = () => {
    if (!navigator.geolocation) { out.textContent = 'GPS fehlt'; return; }
    out.textContent = 'Lade…';
    navigator.geolocation.getCurrentPosition(async p => {
      try {
        const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&current=temperature_2m,weather_code');
        const j = await r.json();
        out.innerHTML = '<div style="font-size:48px;font-weight:800;color:#06b6d4">'+j.current.temperature_2m+'°C</div><div class="muted">Code: '+j.current.weather_code+'</div>';
        speak('Aktuelle Temperatur: '+Math.round(j.current.temperature_2m)+' Grad.');
      } catch(e) { out.textContent = 'Fehler.'; }
    }, () => { out.textContent = 'GPS verweigert.'; });
  };
  body.appendChild(btn);
  const sp = document.createElement('button'); sp.className='ghost'; sp.style.marginLeft='8px'; sp.textContent='🔊 '+T('speak');
  sp.onclick = () => speak('Wetter. Aktuelle Vorhersage.');
  body.appendChild(sp);
}

/* Z: System Center */
function viewSystemCenter(body) {
  body.style.cssText = 'display:flex;height:100%;';
  const sb = document.createElement('div'); sb.className='app-sidebar';
  const ct = document.createElement('div'); ct.className='app-content';
  body.appendChild(sb); body.appendChild(ct);
  let active = 'lang';

  function render() {
    sb.innerHTML = '';
    [['lang','🌐 Sprache'],['voice','🎤 Stimme'],['storage','💾 Speicher'],['about','ℹ Über']].forEach(([id,label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active===id?' active':'');
      b.textContent = label; b.onclick = () => { active = id; render(); };
      sb.appendChild(b);
    });
    const sp = document.createElement('button'); sp.className='side-btn speak-btn'; sp.textContent='🔊 '+T('speak');
    sp.onclick = () => speak('System Center.');
    sb.appendChild(sp);
    ct.innerHTML = '';
    if (active === 'lang') {
      ct.innerHTML = '<h3>🌐 Sprache</h3>';
      const sel = document.createElement('select');
      Object.keys(LANGNAMES).forEach(code => {
        const o = document.createElement('option'); o.value=code; o.textContent = LANGNAMES[code];
        if (code === currentLang) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = () => setLanguage(sel.value);
      ct.appendChild(sel);
    } else if (active === 'voice') {
      ct.innerHTML = '<h3>🎤 Stimme</h3>';
      const r = document.createElement('input'); r.type='range'; r.min=0.5; r.max=2; r.step=0.1; r.value = parseFloat(localStorage.getItem('haldo_voice_rate')||1);
      const p = document.createElement('input'); p.type='range'; p.min=0.5; p.max=2; p.step=0.1; p.value = parseFloat(localStorage.getItem('haldo_voice_pitch')||1);
      const rl = document.createElement('div'); rl.textContent = 'Rate: '+r.value;
      const pl = document.createElement('div'); pl.textContent = 'Pitch: '+p.value;
      r.oninput = () => { rl.textContent = 'Rate: '+r.value; localStorage.setItem('haldo_voice_rate', r.value); };
      p.oninput = () => { pl.textContent = 'Pitch: '+p.value; localStorage.setItem('haldo_voice_pitch', p.value); };
      ct.appendChild(rl); ct.appendChild(r); ct.appendChild(pl); ct.appendChild(p);
      const t = document.createElement('button'); t.textContent='🔊 Test';
      t.onclick = () => speak('Testansage von HalDo AI OS Pro Max.');
      ct.appendChild(t);
    } else if (active === 'storage') {
      ct.innerHTML = '<h3>💾 Speicher</h3>';
      let total = 0;
      for (let i=0; i<localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('haldo_')) total += (localStorage.getItem(k)||'').length; }
      ct.innerHTML += '<p>Belegt: <b>'+(total/1024).toFixed(2)+' KB</b></p>';
      const w = document.createElement('button'); w.className='danger'; w.textContent='🗑 Alles zurücksetzen';
      w.onclick = () => { if (confirm('Alle Daten löschen?')) { Object.keys(localStorage).filter(k=>k.startsWith('haldo_')).forEach(k=>localStorage.removeItem(k)); location.reload(); } };
      ct.appendChild(w);
    } else {
      ct.innerHTML = '<h3>ℹ Über</h3><p>HalDo AI OS Pro Max v1.0.0</p><p class="muted">Von Halil Donma. 20 Sprachen · 26 Apps · 3D Kosmos · 3D Anatomie · TTS.</p>';
    }
  }
  render();
}
