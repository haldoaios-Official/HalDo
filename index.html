<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HalDo AI OS">
  <meta name="mobile-web-app-capable" content="yes">
  <title>🦚 HalDo AI OS</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦚</text></svg>">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --p1: #00e5ff;
      --p2: #4da8ff;
      --p3: #b478ff;
      --bg: #050810;
      --bg-2: #0a0f1a;
      --card: rgba(255, 255, 255, 0.03);
      --text: #e8ecff;
      --text-dim: #a8b0cc;
      --text-mute: #6b7390;
      --border-soft: 1px solid rgba(255, 255, 255, 0.08);
      --glow: 0 0 24px rgba(0, 229, 255, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    /* ZOOM KILLER */
    .home-app, .nebula-app, .app-icon, [class*="app"] {
      transition: filter 0.2s !important;
    }

    .home-app:hover, .nebula-app:hover, .app-icon:hover, [class*="app"]:hover {
      transform: none !important;
      filter: drop-shadow(0 0 20px #00e5ff) brightness(1.3) !important;
    }

    .home-app span, .nebula-app span, .app-name {
      pointer-events: none !important;
    }

    #haldo-root {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    #haldo-header {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
      z-index: 900;
      height: 56px;
    }

    #haldo-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--p1);
    }

    #haldo-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      padding-bottom: 90px;
    }

    /* HAUPT-SIDEBAR */
    #haldo-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 300px;
      background: rgba(10, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 9999;
      display: flex;
      flex-direction: column;
    }

    #haldo-sidebar.open {
      transform: translateX(0);
      box-shadow: 10px 0 50px rgba(0, 0, 0, 0.8);
    }

    .hs-logo-area {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hs-logo-area img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #111;
    }

    .hs-logo-area h2 {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }

    .hs-search {
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hs-search input {
      width: 100%;
      padding: 10px 15px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }

    .hs-menu-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px 10px;
    }

    .hs-cat-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #555;
      font-weight: 800;
      padding: 10px 15px 5px;
      margin-top: 10px;
    }

    .hs-app-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 15px;
      cursor: pointer;
      border-radius: 8px;
      color: #ccc;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .hs-app-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .hs-app-item .icon {
      font-size: 20px;
      width: 26px;
      text-align: center;
    }

    #haldo-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 9998;
    }

    #haldo-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* LOADER */
    #haldo-loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, #0a0f1a 0%, #050810 60%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.35s;
      padding: 20px;
    }

    #haldo-loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    #haldo-loader .logo {
      font-size: 72px;
      animation: haldoBounce 1.2s infinite;
    }

    #haldo-loader .title {
      margin-top: 8px;
      font-size: 22px;
      font-weight: 900;
      color: var(--p1);
      letter-spacing: 1px;
    }

    #haldo-loader .subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-mute);
      letter-spacing: 3px;
      font-weight: 800;
      text-transform: uppercase;
    }

    #haldo-loader .bar-wrap {
      margin-top: 24px;
      width: min(280px, 80vw);
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    #haldo-loader .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--p1), var(--p3));
      border-radius: 2px;
      transition: width 0.2s;
      box-shadow: 0 0 12px var(--p1);
    }

    #haldo-loader .status {
      margin-top: 14px;
      font-size: 10.5px;
      color: var(--text-mute);
      font-weight: 700;
      letter-spacing: 0.5px;
      min-height: 16px;
      text-align: center;
    }

    #haldo-loader .count {
      margin-top: 6px;
      font-size: 10px;
      color: var(--text-mute);
      opacity: 0.6;
    }

    @keyframes haldoBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    /* WELCOME OVERLAY */
    #haldo-app-welcome {
      position: fixed;
      inset: 0;
      z-index: 999999; /* WICHTIG: Über allen Apps! */
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      --gold-1: #ffd54f;
      --gold-2: #fff8c0;
      --gold-3: #ffb300;
      --gold-4: #ff8f00;
    }

    #haldo-app-welcome.show {
      display: flex;
      pointer-events: auto;
      opacity: 1;
      cursor: pointer;
    }

    #haldo-app-welcome.out {
      opacity: 0;
    }

    .haw-backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(255, 180, 50, 0.25) 0%, rgba(10, 15, 26, 0.96) 45%, rgba(5, 8, 16, 0.99) 100%);
      backdrop-filter: blur(6px);
      z-index: 0;
    }

    .haw-scene {
      position: relative;
      width: min(420px, 82vw);
      height: min(420px, 82vw);
      margin-bottom: -40px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .haw-peacock-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 220px;
      line-height: 1;
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      filter: blur(3px) drop-shadow(0 0 40px rgba(255, 200, 50, 0.8));
      z-index: 1;
      animation: peacockBg 2.4s ease-out forwards;
    }

    @keyframes peacockBg {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6) rotate(-8deg); }
      35% { opacity: 0.55; }
      100% { opacity: 0.28; transform: translate(-50%, -50%) scale(1.35) rotate(0deg); }
    }

    .haw-rays {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 380px;
      height: 380px;
      transform: translate(-50%, -50%);
      background: conic-gradient(from 0deg, rgba(255, 213, 79, 0.28) 0deg, transparent 20deg, rgba(255, 213, 79, 0.28) 40deg, transparent 60deg, rgba(255, 213, 79, 0.28) 80deg, transparent 100deg, rgba(255, 213, 79, 0.28) 120deg, transparent 140deg, rgba(255, 213, 79, 0.28) 160deg, transparent 180deg, rgba(255, 213, 79, 0.28) 200deg, transparent 220deg, rgba(255, 213, 79, 0.28) 240deg, transparent 260deg, rgba(255, 213, 79, 0.28) 280deg, transparent 300deg, rgba(255, 213, 79, 0.28) 320deg, transparent 340deg);
      border-radius: 50%;
      z-index: 2;
      opacity: 0;
      animation: raysFadeIn 1.2s ease-out 0.1s forwards, raysRotate 20s linear infinite;
      mask-image: radial-gradient(circle, transparent 80px, black 130px, transparent 190px);
      -webkit-mask-image: radial-gradient(circle, transparent 80px, black 130px, transparent 190px);
    }

    @keyframes raysFadeIn {
      to { opacity: 0.85; }
    }

    @keyframes raysRotate {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .haw-sun {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 45% 40%, #fff8c0 0%, #ffe082 22%, #ffd54f 42%, #ffb300 68%, #ff8f00 88%, #e65100 100%);
      box-shadow: 0 0 60px rgba(255, 200, 50, 0.85), 0 0 120px rgba(255, 180, 40, 0.55), 0 0 200px rgba(255, 150, 30, 0.3), inset -18px -18px 40px rgba(200, 100, 0, 0.35), inset 10px 10px 30px rgba(255, 255, 200, 0.4);
      z-index: 3;
      opacity: 0;
      animation: sunAppear 1s ease-out forwards, sunPulse 2.5s ease-in-out 1s infinite;
    }

    @keyframes sunAppear {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      60% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes sunPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.06); }
    }

    .haw-wing {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 88px;
      line-height: 1;
      z-index: 4;
      opacity: 0;
      filter: drop-shadow(0 0 24px rgba(255, 200, 50, 0.95)) drop-shadow(0 0 8px rgba(255, 255, 200, 0.7));
      pointer-events: none;
    }

    .haw-wing-l {
      animation: wingL 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    .haw-wing-r {
      animation: wingR 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      transform: scaleX(-1);
    }

    @keyframes wingL {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-100deg); opacity: 0; }
      20% { opacity: 1; }
      65% { transform: translate(-190%, -50%) scale(1.05) rotate(-28deg); opacity: 1; }
      100% { transform: translate(-260%, -50%) scale(1.25) rotate(-18deg); opacity: 0.92; }
    }

    @keyframes wingR {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-100deg) scaleX(-1); opacity: 0; }
      20% { opacity: 1; }
      65% { transform: translate(90%, -50%) scale(1.05) rotate(-28deg) scaleX(-1); opacity: 1; }
      100% { transform: translate(160%, -50%) scale(1.25) rotate(-18deg) scaleX(-1); opacity: 0.92; }
    }

    .haw-content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: contentFadeIn 1s ease-out 0.4s both;
    }

    @keyframes contentFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .haw-brand {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--gold-1);
      text-transform: uppercase;
      filter: drop-shadow(0 0 12px rgba(255, 200, 50, 0.8));
    }

    .haw-presents {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255, 213, 79, 0.72);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .haw-divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-1), transparent);
      margin: 8px 0 10px;
      box-shadow: 0 0 10px var(--gold-1);
    }

    .haw-welcome-text {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 213, 79, 0.85);
      letter-spacing: 1px;
    }

    .haw-by {
      font-size: 11.5px;
      font-weight: 600;
      color: rgba(255, 213, 79, 0.68);
      letter-spacing: 1.5px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .haw-app-name {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 900;
      letter-spacing: 1px;
      margin: 4px 0;
      background: linear-gradient(90deg, var(--gold-1) 0%, var(--gold-2) 20%, var(--gold-3) 40%, var(--gold-2) 60%, var(--gold-1) 80%, var(--gold-2) 100%);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: goldShimmer 3s linear infinite;
      filter: drop-shadow(0 0 20px rgba(255, 200, 50, 0.7));
      line-height: 1.15;
    }

    @keyframes goldShimmer {
      0% { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    /* FLOATING BUTTONS */
    .haldo-fab {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #00e5ff, #b478ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .haldo-fab:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6);
    }

    #haldo-missing-banner {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(255, 183, 0, 0.15);
      border: 1px solid rgba(255, 183, 0, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffd54f;
      font-size: 11.5px;
      font-weight: 700;
      z-index: 9998;
      display: none;
      align-items: center;
      gap: 10px;
    }

    #haldo-missing-banner.show {
      display: flex;
    }

    #haldo-missing-banner .x {
      margin-left: auto;
      background: transparent;
      border: none;
      color: #ffd54f;
      font-size: 16px;
      cursor: pointer;
    }

    #haldo-diag {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(5, 8, 16, 0.97);
      padding: 20px;
      overflow-y: auto;
      display: none;
    }

    #haldo-diag.show {
      display: block;
    }

    #haldo-diag h2 {
      color: var(--p1);
      font-size: 18px;
      margin-bottom: 12px;
    }

    #haldo-diag .close {
      position: sticky;
      top: 0;
      float: right;
      background: var(--p1);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="haldo-loader">
    <div class="logo">🦚</div>
    <div class="title">HalDo AI OS</div>
    <div class="subtitle">Halil Donma App</div>
    <div class="bar-wrap"><div class="bar" id="haldo-bar"></div></div>
    <div class="status" id="haldo-status">System startet...</div>
    <div class="count" id="haldo-count">0 / 0</div>
  </div>

  <!-- WELCOME OVERLAY (z-index 999999 -> über alles) -->
  <div id="haldo-app-welcome" aria-hidden="true">
    <div class="haw-backdrop"></div>
    <div class="haw-scene">
      <div class="haw-peacock-bg">🦚</div>
      <div class="haw-rays"></div>
      <div class="haw-sun"></div>
      <div class="haw-wing haw-wing-l">🦚</div>
      <div class="haw-wing haw-wing-r">🦚</div>
    </div>
    <div class="haw-content">
      <div class="haw-brand">🦚 HalDo AI OS</div>
      <div class="haw-presents">HalDo AI präsentiert</div>
      <div class="haw-divider"></div>
      <div class="haw-welcome-text">Willkommen in</div>
      <div class="haw-app-name" id="haw-app-name">HalDo App</div>
      <div class="haw-by">Einer App von Halil Donma</div>
    </div>
  </div>

  <div id="haldo-missing-banner">
    <span>⚠️</span>
    <span id="haldo-missing-text">—</span>
    <button class="x" id="haldo-missing-close">✕</button>
  </div>

  <div id="haldo-diag">
    <button class="close" id="haldo-diag-close">✕ Schließen</button>
    <h2>🦚 HalDo Diagnostics</h2>
    <div id="haldo-diag-content"></div>
  </div>

  <div id="haldo-overlay"></div>

  <nav id="haldo-sidebar">
    <div class="hs-logo-area">
      <img src="logo.png" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><text y=\'.9em\' font-size=\'90\'>🦚</text></svg>'" alt="HalDo">
      <h2>HalDo AI OS</h2>
    </div>
    <div class="hs-search">
      <input type="text" id="hs-search-input" placeholder="🔍 App suchen...">
    </div>
    <div class="hs-menu-list" id="hs-menu-list"></div>
  </nav>

  <div id="haldo-root">
    <header id="haldo-header">
      <button id="haldo-menu" style="background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px">☰</button>
      <div id="haldo-title">🦚 HalDo AI OS</div>
      <div style="display:flex; gap:5px;">
        <button id="haldo-arztbuch-btn" style="background:transparent;border:none;color:var(--text-mute);font-size:16px;cursor:pointer;padding:4px 8px" title="Arztbuch">🩺</button>
        <button id="haldo-fahrschule-btn" style="background:transparent;border:none;color:var(--text-mute);font-size:16px;cursor:pointer;padding:4px 8px" title="Fahrschule">🚦</button>
        <button id="haldo-grid-btn" style="background:transparent;border:none;color:var(--text-mute);font-size:16px;cursor:pointer;padding:4px 8px" title="Ansicht wechseln">🔳</button>
        <button id="haldo-diag-btn" style="background:transparent;border:none;color:var(--text-mute);font-size:16px;cursor:pointer;padding:4px 8px" title="Diagnostics">⚙</button>
      </div>
    </header>
    <main id="haldo-content"></main>
  </div>

  <div id="haldo-desk"></div>
  <div id="haldo-taskbar"></div>

  <div class="haldo-fab" id="haldo-fs-fab" style="bottom: 30px;" onclick="if(window.openFahrschule) window.openFahrschule(); else alert('Fahrschule.js nicht geladen');">🚦</div>
  <div class="haldo-fab" id="haldo-ab-fab" style="bottom: 100px; background: linear-gradient(135deg, #00ff88, #00e5ff);" onclick="if(window.openArztbuch) window.openArztbuch(); else alert('Arztbuch.js nicht geladen');">🩺</div>

  <script>
    (function() {
      "use strict";

      var SCRIPTS = [
        "runtime.js", "store.js", "voice.js", "notify.js", "theme.js", "apps.js",
        "ai-engine.js", "haldo-ai.js", "deskpane.js", "avatar.js", "shell.js",
        "settings.js", "system-center.js", "update.js", "backup.js", "recovery.js", "diagnostics.js", "appstore.js", "analytics.js", "dashboard.js",
        "chat.js", "ai.js", "email.js", "posteingang.js", "kontakte.js", "aufnahme.js", "phone.js", "videocall.js", "voicememos.js",
        "tasks.js", "todo.js", "notes.js", "kalender.js", "projekte.js", "arbeitszeit.js", "dokumente.js", "links.js", "passwort.js", "clipboard.js", "filemanager.js",
        "fitness.js", "gesundheit.js", "stimmung.js", "gewohnheiten.js", "schlaf.js", "atem.js", "wasser.js",
        "kueche.js", "rezept.js", "einkauf.js", "zuhause.js", "finanzen.js", "reisen.js", "auto.js", "musik.js", "photos.js", "video.js", "bild.js",
        "wetter.js", "rechner.js", "wissenschaftlich.js", "umrechner.js", "waehrung.js", "timer.js", "pomodoro.js", "uebersetzer.js", "woerterbuch.js", "vokabeln.js", "flashcards.js", "lerne.js", "notfall.js", "bewertung.js", "spiele.js", "sprachen.js",
        "fahrschule.js", "arztbuch.js", "blitzer.js", "periodensystem.js", "mathe.js", "geo-quiz.js", "ezidi.js", "wissen.js",
        "qr.js", "barcode.js", "random.js", "text-analyse.js", "datum-rechner.js", "netzwerk-info.js", "geraete-info.js", "weltuhr.js", "kamera.js", "spiegel.js", "taschenlampe.js", "lupe.js",
        "kredit.js", "bmi.js", "statistik.js", "labor.js", "bookmarks.js", "leseliste.js", "sticky-notes.js", "heatmap.js", "i18n.js", "voice-kurdisch.js", "home.js", "home-patch.js", "splash.js"
      ];

      var MENU_APPS = [
        { cat: 'Wichtigste Apps', items: [ { id: 'settings', name: 'Einstellungen', icon: '⚙️', action: 'settings' }, { id: 'fahrschule', name: 'Fahrschule', icon: '🚦', action: 'fahrschule' }, { id: 'arztbuch', name: 'Arztbuch', icon: '🩺', action: 'arztbuch' } ] },
        { cat: 'Kommunikation', items: [ { id: 'chat', name: 'Chat', icon: '💬' }, { id: 'email', name: 'E-Mail', icon: '📧' }, { id: 'phone', name: 'Telefon', icon: '📞' }, { id: 'kontakte', name: 'Kontakte', icon: '👥' }, { id: 'videocall', name: 'Videocall', icon: '📹' } ] },
        { cat: 'Produktivität', items: [ { id: 'notes', name: 'Notizen', icon: '📝' }, { id: 'kalender', name: 'Kalender', icon: '📅' }, { id: 'tasks', name: 'Aufgaben', icon: '✅' }, { id: 'dokumente', name: 'Dokumente', icon: '📄' }, { id: 'passwort', name: 'Passwörter', icon: '🔐' }, { id: 'rechner', name: 'Rechner', icon: '🧮' } ] },
        { cat: 'Wissen & Lernen', items: [ { id: 'blitzer', name: 'Blitzer', icon: '📡' }, { id: 'uebersetzer', name: 'Übersetzer', icon: '🌐' }, { id: 'wissen', name: 'Wissen', icon: '🧠' }, { id: 'sprachen', name: 'Sprachen', icon: '🗣️' }, { id: 'ezidi', name: 'Ezidi', icon: '📖' } ] },
        { cat: 'Lifestyle & Gesundheit', items: [ { id: 'fitness', name: 'Fitness', icon: '💪' }, { id: 'gesundheit', name: 'Gesundheit', icon: '❤️' }, { id: 'musik', name: 'Musik', icon: '🎵' }, { id: 'wetter', name: 'Wetter', icon: '🌤️' }, { id: 'finanzen', name: 'Finanzen', icon: '💰' } ] }
      ];

      var loaded = [], missing = [], bootComplete = false;
      var _origLog = console.log.bind(console), WINDOW_OPEN_PATTERN = /Fenster geöffnet:\s*(.+?)\s*$/;

      console.log = function() {
        if (bootComplete && window.HalDoWelcome && !window.__suppressWelcome) {
          try {
            var joined = Array.prototype.slice.call(arguments).filter(function(a) { return typeof a === "string"; }).join(" ");
            var m = joined.match(WINDOW_OPEN_PATTERN);
            if (m && m[1] && m[1].length >= 2 && m[1].length < 60) window.HalDoWelcome.show(m[1]);
          } catch (e) { }
        }
        return _origLog.apply(null, arguments);
      };

      var welcomeTimeout = null, lastShownApp = null, lastShownTime = 0;

      function formatAppName(name) {
        if (!name) return "HalDo App";
        return "HalDo " + String(name).trim().replace(/^HalDo\s+/i, "");
      }

      function showWelcome(appName) {
        if (!bootComplete || window.__haldoWelcomeEnabled === false) return;
        var formatted = formatAppName(appName), now = Date.now();
        if (formatted === lastShownApp && (now - lastShownTime) < 600) return;
        lastShownApp = formatted; lastShownTime = now;
        
        var overlay = document.getElementById("haldo-app-welcome"), nameEl = document.getElementById("haw-app-name");
        if (!overlay) return;
        if (nameEl) nameEl.textContent = formatted;
        
        overlay.classList.remove("out");
        overlay.classList.add("show");
        
        var animated = overlay.querySelectorAll(".haw-peacock-bg, .haw-rays, .haw-sun, .haw-wing, .haw-content, .haw-app-name");
        animated.forEach(function(el) {
          el.style.animation = "none";
          void el.offsetWidth;
          el.style.animation = "";
        });
        
        clearTimeout(welcomeTimeout);
        welcomeTimeout = setTimeout(hideWelcome, window.__haldoWelcomeDuration || 2200);
      }

      function hideWelcome() {
        var overlay = document.getElementById("haldo-app-welcome");
        if (!overlay) return;
        overlay.classList.add("out");
        setTimeout(function() { overlay.classList.remove("show", "out"); }, 400);
      }

      document.addEventListener("DOMContentLoaded", function() {
        var overlay = document.getElementById("haldo-app-welcome");
        if (overlay) overlay.addEventListener("click", function() { clearTimeout(welcomeTimeout); hideWelcome(); });
      });

      window.HalDoWelcome = { show: showWelcome, hide: hideWelcome, formatAppName: formatAppName };

      function updateProgress(current, total, label) {
        var bar = document.getElementById("haldo-bar"), status = document.getElementById("haldo-status"), count = document.getElementById("haldo-count");
        if (bar) bar.style.width = Math.round((current / total) * 100) + "%";
        if (status) status.textContent = label || "";
        if (count) count.textContent = current + " / " + total;
      }

      function loadAllScripts() {
        return new Promise(function(resolve) {
          var total = SCRIPTS.length, done = 0;
          updateProgress(0, total, "Lade " + total + " Apps parallel...");
          if (!window.__haldoLoadedScripts) window.__haldoLoadedScripts = {};
          
          SCRIPTS.forEach(function(src) {
            if (window.__haldoLoadedScripts[src]) { loaded.push(src); done++; return; }
            var s = document.createElement("script");
            s.src = src; s.async = false;
            s.onload = function() {
              window.__haldoLoadedScripts[src] = true;
              loaded.push(src); done++;
              updateProgress(done, total, "Geladen: " + done + " / " + total);
              if (done >= total) resolve();
            };
            s.onerror = function() {
              missing.push(src); done++;
              updateProgress(done, total, "Fehlt: " + done + " / " + total);
              if (done >= total) resolve();
            };
            document.head.appendChild(s);
          });
          if (total === 0) resolve();
        });
      }

      (async function() {
        var tStart = performance.now();
        await loadAllScripts();
        var tLoad = performance.now() - tStart;
        updateProgress(SCRIPTS.length, SCRIPTS.length, "✅ System bereit (" + Math.round(tLoad) + "ms)");
        
        var loader = document.getElementById("haldo-loader");
        if (loader) {
          loader.classList.add("hide");
          setTimeout(function() { loader.remove(); }, 400);
        }
        
        bootComplete = true;

        // WELCOME BEIM START VON HALDO OS TRIGGERN
        setTimeout(function() {
          if (window.HalDoWelcome) window.HalDoWelcome.show("HalDo AI OS");
        }, 500);
        
        setTimeout(function() {
          if (window.HalDo && HalDo.Shell && HalDo.Shell.init) {
            try { HalDo.Shell.init(); } catch(e) { }
          }
        }, 100);
        
        setTimeout(setupAdditionalHooks, 250);
        reportMissing();
      })();

      function setupAdditionalHooks() {
        if (window.HalDo && HalDo.Deskpane) {
          var dp = HalDo.Deskpane;
          ["openWindow", "openApp", "open", "launchApp"].forEach(function(method) {
            if (typeof dp[method] === "function" && !dp["__welcomePatched_" + method]) {
              var orig = dp[method];
              dp[method] = function() {
                try {
                  var args = Array.prototype.slice.call(arguments);
                  var name = extractAppNameFromArgs(args);
                  if (name) window.HalDoWelcome.show(name);
                } catch (e) {}
                return orig.apply(this, arguments);
              };
              dp["__welcomePatched_" + method] = true;
            }
          });
        }
        observeDeskForWindows();
      }

      function extractAppNameFromArgs(args) {
        if (!args || !args.length) return null;
        var a = args[0];
        if (typeof a === "string") return a;
        if (a && typeof a === "object") return a.title || a.name || a.appName || a.label || a.id || null;
        return null;
      }

      function observeDeskForWindows() {
        var desk = document.getElementById("haldo-desk");
        if (!desk || !window.MutationObserver) return;
        var observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (node.nodeType !== 1) return;
              var title = extractWindowTitle(node);
              if (title) window.HalDoWelcome.show(title);
            });
          });
        });
        observer.observe(desk, { childList: true, subtree: true });
      }

      function extractWindowTitle(node) {
        if (!node.classList) return null;
        var cls = String(node.className || "");
        var isWindow = /(^|\s)(window|win|desk-window|app-window|haldo-window|hp-window|hw-window)/i.test(cls);
        if (!isWindow && !node.hasAttribute("data-window") && !node.hasAttribute("data-app-window")) return null;
        var t = node.getAttribute("data-title") || node.getAttribute("data-app-name");
        if (t) return t.trim();
        var titleEl = node.querySelector(".window-title, .win-title, .hp-window-title, .hw-window-title, .title");
        if (titleEl && titleEl.textContent) return titleEl.textContent.trim();
        var h = node.querySelector("h1, h2, h3, header .title");
        if (h && h.textContent && h.textContent.length < 60) return h.textContent.trim();
        return null;
      }

      function reportMissing() {
        if (!missing.length) return;
        var banner = document.getElementById("haldo-missing-banner"), text = document.getElementById("haldo-missing-text");
        if (!banner || !text) return;
        text.textContent = missing.length + " Apps fehlen";
        banner.classList.add("show");
        var close = document.getElementById("haldo-missing-close");
        if (close) close.addEventListener("click", function() { banner.classList.remove("show"); });
      }

      document.addEventListener("DOMContentLoaded", function() {
        var list = document.getElementById("hs-menu-list"), searchInput = document.getElementById("hs-search-input");

        function renderSidebar(filter) {
          filter = (filter || '').toLowerCase();
          var html = '';
          MENU_APPS.forEach(function(cat) {
            var visibleItems = cat.items.filter(function(item) { return item.name.toLowerCase().includes(filter); });
            if (visibleItems.length > 0) {
              html += '<div class="hs-cat-title">' + cat.cat + '</div>';
              visibleItems.forEach(function(item) {
                html += '<div class="hs-app-item" data-appid="' + item.id + '" data-action="' + (item.action || 'open') + '"><span class="icon">' + item.icon + '</span><span>' + item.name + '</span></div>';
              });
            }
          });
          if (list) list.innerHTML = html;
        }

        renderSidebar('');

        if (searchInput) searchInput.addEventListener('input', function(e) { renderSidebar(e.target.value); });

        if (list) {
          list.addEventListener('click', function(e) {
            var item = e.target.closest('.hs-app-item');
            if (!item) return;
            var appId = item.dataset.appid, action = item.dataset.action;
            document.getElementById('haldo-sidebar').classList.remove('open');
            document.getElementById('haldo-overlay').classList.remove('open');

            if (action === 'settings') { if (window.HalDoSettings) window.HalDoSettings.open(); }
            else if (action === 'fahrschule') { if (window.openFahrschule) window.openFahrschule(); }
            else if (action === 'arztbuch') { if (window.openArztbuch) window.openArztbuch(); }
            else {
              if (window.HalDo && window.HalDo.Deskpane && window.HalDo.Deskpane.open) window.HalDo.Deskpane.open(appId);
              else window.HalDoWelcome.show(appId);
            }
          });
        }

        var btn = document.getElementById("haldo-diag-btn"); if (btn) btn.addEventListener("click", function() {});
        var closeBtn = document.getElementById("haldo-diag-close"); if (closeBtn) closeBtn.addEventListener("click", function() { document.getElementById("haldo-diag").classList.remove("show"); });
        var menu = document.getElementById("haldo-menu"), sidebar = document.getElementById("haldo-sidebar"), overlay = document.getElementById("haldo-overlay");
        if (menu && sidebar && overlay) {
          menu.addEventListener("click", function() { sidebar.classList.add("open"); overlay.classList.add("open"); });
          overlay.addEventListener("click", function() { sidebar.classList.remove("open"); overlay.classList.remove("open"); });
        }
        
        var gridBtn = document.getElementById("haldo-grid-btn"), isGridMode = false;
        if (gridBtn) {
          gridBtn.addEventListener("click", function() {
            isGridMode = !isGridMode;
            var desk = document.getElementById("haldo-desk");
            if (desk) {
              if (isGridMode) { desk.classList.add("haldo-grid-mode"); gridBtn.style.color = "var(--p1)"; }
              else { desk.classList.remove("haldo-grid-mode"); gridBtn.style.color = "var(--text-mute)"; }
            }
          });
        }
      });
    })();
  </script>

  <style>
    #haldo-desk.haldo-grid-mode { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)) !important; grid-gap: 20px !important; padding: 30px !important; overflow-y: auto !important; align-content: start !important; }
    #haldo-desk.haldo-grid-mode > div, #haldo-desk.haldo-grid-mode > .home-app, #haldo-desk.haldo-grid-mode > .nebula-app { position: relative !important; top: auto !important; left: auto !important; transform: none !important; margin: 0 auto !important; width: 60px !important; height: 60px !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; }
    #haldo-desk.haldo-grid-mode > div span, #haldo-desk.haldo-grid-mode > .home-app span, #haldo-desk.haldo-grid-mode > .nebula-app span { position: absolute !important; bottom: -20px !important; left: 50% !important; transform: translateX(-50%) !important; width: 80px !important; text-align: center !important; white-space: normal !important; font-size: 10px !important; line-height: 1.2 !important; }
  </style>
</body>
