<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦚 HalDo AI OS v2</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --primary:#00d4b8;--primary-2:#7c3aed;--accent:#f5c542;
    --bg:#0a0e17;--bg-2:#111827;
    --panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.09);
    --text:#e8eef7;--text-dim:#8fa3bf;
    --success:#22c55e;--danger:#ef4444;
    --radius:14px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  body.light-mode{
    --bg:#f4f6fb;--bg-2:#ffffff;
    --panel:rgba(0,0,0,.03);--panel-2:rgba(0,0,0,.06);
    --border:rgba(0,0,0,.10);
    --text:#0e1420;--text-dim:#5a6b85;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:
      radial-gradient(1200px 800px at 15% -10%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 60%),
      radial-gradient(1000px 700px at 110% 10%,color-mix(in srgb,var(--primary-2) 16%,transparent),transparent 55%),
      var(--bg);
    color:var(--text);min-height:100vh;overflow-x:hidden;
    transition:background .3s;
  }
  body.no-anim *{animation:none!important;transition:none!important}

  /* BOOT */
  #boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
  #boot img{width:110px;height:110px;object-fit:contain;animation:pulse 1.2s ease-in-out infinite}
  #boot h1{margin-top:18px;font-size:20px;letter-spacing:3px;color:var(--text-dim);font-weight:500}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
  #boot.hide{opacity:0;pointer-events:none}

  /* TOPBAR */
  #topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  #topbar .brand{display:flex;align-items:center;gap:12px}
  #topbar .brand img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--primary) 40%,transparent))}
  #topbar .brand h1{font-size:17px;font-weight:600;letter-spacing:.4px}
  #topbar .brand h1 span{color:var(--primary)}
  #topbar .spacer{flex:1}
  #topbar .pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--border);font-size:12px;color:var(--text-dim)}
  #topbar .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}

  /* MAIN NAV */
  #mainnav{display:flex;gap:6px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 65%,transparent);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  #mainnav::-webkit-scrollbar{display:none}
  #mainnav button{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:11px;background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .18s;font-family:inherit}
  #mainnav button img{width:20px;height:20px;object-fit:contain}
  #mainnav button .emoji{font-size:17px;line-height:1}
  #mainnav button:hover{color:var(--text);background:var(--panel)}
  #mainnav button.active{color:var(--text);background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,transparent),color-mix(in srgb,var(--primary-2) 18%,transparent));border-color:color-mix(in srgb,var(--primary) 40%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--primary) 12%,transparent)}

  /* VIEW */
  #view{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
  body:not(.no-anim) #view{animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* COMMON */
  .hero{display:flex;align-items:center;gap:20px;padding:24px;border-radius:var(--radius);background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 10%,transparent),color-mix(in srgb,var(--primary-2) 10%,transparent));border:1px solid var(--border);margin-bottom:24px}
  .hero img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--primary) 40%,transparent))}
  .hero .h-text h2{font-size:22px;margin-bottom:4px}
  .hero .h-text p{color:var(--text-dim);font-size:13.5px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
  .stat{padding:18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--border);transition:all .18s}
  .stat:hover{background:var(--panel-2);transform:translateY(-2px)}
  .stat .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .stat .value{font-size:26px;font-weight:700;color:var(--primary)}
  .stat .sub{font-size:12px;color:var(--text-dim);margin-top:4px}

  .section-title{display:flex;align-items:center;gap:10px;margin:8px 0 14px;font-size:16px;font-weight:600}
  .section-title .emoji{font-size:19px}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .app-card{padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--border);cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:8px;text-align:left;font-family:inherit;color:var(--text)}
  .app-card:hover{background:var(--panel-2);border-color:color-mix(in srgb,var(--primary) 40%,transparent);transform:translateY(-2px)}
  .app-card .icon{font-size:26px}
  .app-card .name{font-size:13.5px;font-weight:600}
  .app-card .desc{font-size:11.5px;color:var(--text-dim);line-height:1.4}

  .placeholder{padding:40px 24px;border-radius:var(--radius);background:var(--panel);border:1px dashed var(--border);text-align:center;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:12px}
  .placeholder img{width:56px;opacity:.7}
  .placeholder h3{color:var(--text);font-size:15px}
  .placeholder p{font-size:13px;max-width:440px;line-height:1.5}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary);font-size:11px;font-weight:600;border:1px solid color-mix(in srgb,var(--primary) 30%,transparent)}

  /* SETTINGS LAYOUT */
  .settings-wrap{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
  @media(max-width:720px){.settings-wrap{grid-template-columns:1fr}}
  .settings-nav{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px;position:sticky;top:100px;max-height:calc(100vh - 130px);overflow-y:auto}
  @media(max-width:720px){.settings-nav{position:static;max-height:none}}
  .settings-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;background:transparent;border:none;color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
  .settings-nav button:hover{background:var(--panel-2);color:var(--text)}
  .settings-nav button.active{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,transparent),color-mix(in srgb,var(--primary-2) 18%,transparent));color:var(--text);border-left:2px solid var(--primary)}
  .settings-nav .ico{font-size:16px;width:20px;text-align:center}

  .settings-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;min-height:400px}
  .settings-panel h2{font-size:18px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .settings-panel .panel-desc{color:var(--text-dim);font-size:13px;margin-bottom:18px;line-height:1.5}

  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
  .setting-row:last-child{border-bottom:none}
  .setting-row .info{flex:1;min-width:0}
  .setting-row .info .lbl{font-size:14px;font-weight:500;margin-bottom:3px}
  .setting-row .info .hint{font-size:12px;color:var(--text-dim);line-height:1.4}

  .setting-row input[type="text"],
  .setting-row input[type="number"],
  .setting-row input[type="password"],
  .setting-row select,
  .setting-row textarea{
    background:var(--bg-2);border:1px solid var(--border);color:var(--text);
    padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;
    min-width:160px;outline:none;
  }
  .setting-row input:focus,.setting-row select:focus,.setting-row textarea:focus{border-color:var(--primary)}
  .setting-row input[type="color"]{width:44px;height:34px;padding:2px;border-radius:9px;border:1px solid var(--border);background:var(--bg-2);cursor:pointer}
  .setting-row input[type="range"]{width:180px;accent-color:var(--primary)}

  .toggle{position:relative;width:46px;height:26px;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .2s;flex-shrink:0}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:all .2s}
  .toggle.on{background:color-mix(in srgb,var(--primary) 30%,transparent);border-color:var(--primary)}
  .toggle.on::after{left:22px;background:var(--primary);box-shadow:0 0 8px var(--primary)}

  .btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
  .btn:hover{background:var(--panel);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border:none;color:#fff}
  .btn.danger{background:color-mix(in srgb,var(--danger) 18%,transparent);border-color:var(--danger);color:var(--danger)}
  .btn.danger:hover{background:color-mix(in srgb,var(--danger) 30%,transparent)}

  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
  .theme-btn{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-family:inherit;color:var(--text);display:flex;flex-direction:column;gap:8px;align-items:center;transition:all .15s}
  .theme-btn:hover{border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
  .theme-btn .swatch{width:100%;height:26px;border-radius:6px;display:flex}
  .theme-btn .swatch span{flex:1}
  .theme-btn .tname{font-size:12px;font-weight:500}

  .storage-list{max-height:220px;overflow-y:auto;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .storage-list .key{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
  .storage-list .key:last-child{border-bottom:none}
  .storage-list .key .k{color:var(--primary)}
  .storage-list .key .v{color:var(--text-dim)}

  footer{text-align:center;padding:24px 20px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--border);margin-top:20px}
  footer img{width:16px;vertical-align:middle;margin-right:6px;opacity:.7}
</style>
</head>
<body>

<div id="boot">
  <img src="logo.png" alt="HalDo">
  <h1>HALDO AI OS</h1>
</div>

<header id="topbar">
  <div class="brand">
    <img src="logo.png" alt="Logo">
    <h1>HalDo <span>AI OS</span></h1>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="clock-pill"><span class="dot"></span><span id="clock">--:--</span></div>
</header>

<nav id="mainnav"></nav>
<main id="view"></main>

<footer>
  <img src="logo.png" alt="Logo">
  HalDo AI OS v2 · Phase 2 (Einstellungen)
</footer>

<script>
(function(){
  "use strict";

  /* ================= STORAGE ================= */
  const Storage = {
    prefix:"haldo_v2_",
    get(k,d=null){try{const r=localStorage.getItem(this.prefix+k);return r===null?d:JSON.parse(r);}catch(e){return d;}},
    set(k,v){try{localStorage.setItem(this.prefix+k,JSON.stringify(v));return true;}catch(e){console.warn("Storage voll",e);return false;}},
    del(k){localStorage.removeItem(this.prefix+k);},
    keys(){const o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(this.prefix))o.push(k.slice(this.prefix.length));}return o;},
    sizeKB(){let b=0;this.keys().forEach(k=>{const v=localStorage.getItem(this.prefix+k)||"";b+=k.length+v.length;});return (b/1024).toFixed(1);},
    rawKB(){let b=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);b+=k.length+(localStorage.getItem(k)||"").length;}return (b/1024).toFixed(1);}
  };

  /* ================= BUS ================= */
  const Bus = {
    _h:{},
    on(e,f){(this._h[e]=this._h[e]||[]).push(f);},
    emit(e,d){(this._h[e]||[]).forEach(f=>{try{f(d);}catch(x){console.warn(x);}});}
  };

  /* ================= REGISTRY ================= */
  const Registry = {
    apps:[],
    register(a){
      if(!a.id||!a.name){console.warn("App braucht id + name");return;}
      if(this.apps.find(x=>x.id===a.id)){console.warn("App doppelt:",a.id);return;}
      this.apps.push(Object.assign({icon:"📦",desc:"",category:"System",mount:null},a));
      Bus.emit("registry:change",this.apps);
    },
    get(id){return this.apps.find(a=>a.id===id);},
    byCategory(){const m={};this.apps.forEach(a=>{(m[a.category]=m[a.category]||[]).push(a);});return m;},
    count(){return this.apps.length;}
  };

  /* ================= ROUTER ================= */
  const Router = {
    routes:{},current:null,
    add(p,h){this.routes[p]=h;},
    go(p){
      if(!this.routes[p])p="home";
      this.current=p;
      Storage.set("last_route",p);
      document.querySelectorAll("#mainnav button").forEach(b=>b.classList.toggle("active",b.dataset.route===p));
      const v=document.getElementById("view");
      v.innerHTML="";
      this.routes[p](v);
      Bus.emit("route:change",p);
      window.scrollTo({top:0,behavior:"instant"});
    },
    start(){this.go(Storage.get("last_route","home"));}
  };

  /* ================= UTIL ================= */
  const U = {
    el(t,a={},...c){
      const n=document.createElement(t);
      for(const k in a){
        if(k==="class")n.className=a[k];
        else if(k==="html")n.innerHTML=a[k];
        else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);
        else if(k==="style"&&typeof a[k]==="object")Object.assign(n.style,a[k]);
        else n.setAttribute(k,a[k]);
      }
      c.forEach(x=>{if(x==null)return;n.appendChild(typeof x==="string"?document.createTextNode(x):x);});
      return n;
    },
    esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
  };

  /* ================= SETTINGS MODULE ================= */
  const THEMES = {
    "haldo":   {primary:"#00d4b8",primary2:"#7c3aed",accent:"#f5c542"},
    "aurora":  {primary:"#22c55e",primary2:"#ec4899",accent:"#a855f7"},
    "sunset":  {primary:"#f97316",primary2:"#ec4899",accent:"#facc15"},
    "ocean":   {primary:"#0ea5e9",primary2:"#06b6d4",accent:"#38bdf8"},
    "forest":  {primary:"#10b981",primary2:"#059669",accent:"#84cc16"},
    "royal":   {primary:"#8b5cf6",primary2:"#eab308",accent:"#f472b6"},
    "cyber":   {primary:"#06b6d4",primary2:"#ec4899",accent:"#a855f7"},
    "mono":    {primary:"#94a3b8",primary2:"#cbd5e1",accent:"#e2e8f0"},
    "fire":    {primary:"#ef4444",primary2:"#f97316",accent:"#facc15"}
  };

  const Settings = {
    defaults:{
      general:   {name:"Bruder",lang:"de",startPage:"home",splash:true,darkMode:true},
      appearance:{primary:"#00d4b8",primary2:"#7c3aed",accent:"#f5c542",fontSize:100,animations:true,glow:true,glass:true,mode:"dark"},
      avatar:    {mode:"human",size:180,visible:true,floating:true,personality:"freundlich"},
      voice:     {tts:true,rate:1.0,pitch:1.0,stt:false,wakeWord:false,wakeWords:"Hallo HalDo, Silav, Merhaba"},
      ai:        {apiKey:"",model:"flash",temperature:0.7,maxLength:512,systemPrompt:""},
      apps:      {sort:"az",favorites:[],hidden:[]},
      notifications:{browser:false,sound:true,vibration:true},
      network:   {offlineMode:false,peerId:""},
      security:  {pin:"",lockAfter:0,analytics:false},
      backup:    {autoBackup:false}
    },
    state:{},
    load(){
      this.state = JSON.parse(JSON.stringify(this.defaults));
      for(const cat in this.defaults){
        const s = Storage.get("set_"+cat,null);
        if(s && typeof s === "object") Object.assign(this.state[cat], s);
      }
      this.apply();
    },
    save(cat){
      Storage.set("set_"+cat, this.state[cat]);
      this.apply();
      Bus.emit("settings:change",{cat,state:this.state});
    },
    get(cat,key){ return key ? this.state[cat]?.[key] : this.state[cat]; },
    set(cat,key,val){ this.state[cat][key]=val; this.save(cat); },
    apply(){
      const a = this.state.appearance;
      const r = document.documentElement.style;
      r.setProperty("--primary",a.primary);
      r.setProperty("--primary-2",a.primary2);
      r.setProperty("--accent",a.accent);
      // Font size: scale base 16px
      const scale = (a.fontSize||100)/100;
      document.body.style.fontSize = (16*scale) + "px";
      // Animations
      document.body.classList.toggle("no-anim", !a.animations);
      // Mode
      document.body.classList.toggle("light-mode", a.mode==="light");
      // Glow effect on brand logo
      const brand = document.querySelector("#topbar .brand img");
      if(brand) brand.style.filter = a.glow
        ? `drop-shadow(0 0 8px color-mix(in srgb, ${a.primary} 40%, transparent))`
        : "none";
    },
    reset(cat){
      if(cat){ this.state[cat] = JSON.parse(JSON.stringify(this.defaults[cat])); this.save(cat); }
      else { localStorage.keys(); Storage.keys().forEach(k=>{ if(k.startsWith("set_")) Storage.del(k); }); this.load(); }
    }
  };

  /* ================= NAV ================= */
  const NAV_ITEMS = [
    {route:"home",    label:"Home",         emoji:"🏠"},
    {route:"apps",    label:"Apps",         emoji:"📱"},
    {route:"avatar",  label:"Avatar",       emoji:"🦚"},
    {route:"settings",label:"Einstellungen",emoji:"⚙️"},
    {route:"wissen",  label:"Wissen",       emoji:"📚"}
  ];
  function buildNav(){
    const nav=document.getElementById("mainnav");
    nav.innerHTML="";
    NAV_ITEMS.forEach(item=>{
      nav.appendChild(U.el("button",
        {"data-route":item.route,onclick:()=>Router.go(item.route)},
        U.el("img",{src:"logo.png",alt:""}),
        U.el("span",{class:"emoji"},item.emoji),
        U.el("span",{},item.label)
      ));
    });
  }

  /* ================= VIEWS ================= */
  function viewHome(root){
    const name = Settings.get("general","name") || "Bruder";
    const daysUsed = Storage.get("days_used",1);
    const storageKB = Storage.sizeKB();
    const today = new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long"});

    root.appendChild(U.el("div",{class:"hero"},
      U.el("img",{src:"logo.png",alt:"Logo"}),
      U.el("div",{class:"h-text"},
        U.el("h2",{},"Willkommen zurück, "+name+" 🦚"),
        U.el("p",{},"Heute ist "+today+". System läuft stabil — Phase 2 (Einstellungen) aktiv.")
      )
    ));

    root.appendChild(U.el("div",{class:"grid"},
      statCard("Apps registriert",Registry.count(),"Registry aktiv"),
      statCard("Speicher belegt",storageKB+" KB","localStorage"),
      statCard("Tage genutzt",daysUsed,"seit Installation"),
      statCard("Version","v2.0","Phase 2")
    ));

    root.appendChild(U.el("div",{class:"section-title"},
      U.el("span",{class:"emoji"},"⚡"),
      U.el("span",{},"Schnellstart")
    ));
    root.appendChild(U.el("div",{class:"card-grid"},
      quickCard("⚙️","Einstellungen","Farben, Backup, PIN","settings"),
      quickCard("📱","Apps","Alle Apps ansehen","apps"),
      quickCard("🦚","Avatar","Chat + Sprache","avatar"),
      quickCard("📚","Wissen","Lexika & Info","wissen")
    ));

    function statCard(label,value,sub){
      return U.el("div",{class:"stat"},
        U.el("div",{class:"label"},label),
        U.el("div",{class:"value"},String(value)),
        U.el("div",{class:"sub"},sub)
      );
    }
    function quickCard(icon,name,desc,route){
      return U.el("button",{class:"app-card",onclick:()=>Router.go(route)},
        U.el("div",{class:"icon"},icon),
        U.el("div",{class:"name"},name),
        U.el("div",{class:"desc"},desc)
      );
    }
  }

  function viewApps(root){
    root.appendChild(U.el("div",{class:"section-title"},
      U.el("span",{class:"emoji"},"📱"),
      U.el("span",{},"Apps"),
      U.el("span",{class:"badge",style:{marginLeft:"auto"}},Registry.count()+" registriert")
    ));
    if(Registry.count()===0){
      root.appendChild(U.el("div",{class:"placeholder"},
        U.el("img",{src:"logo.png",alt:""}),
        U.el("h3",{},"Noch keine Apps registriert"),
        U.el("p",{},"Der Container ist bereit. In Phase 4-10 kommen die Apps in 7 Prioritäten hinzu — voll funktionsfähig, keine Anzeige-Apps.")
      ));
      return;
    }
    const byCat = Registry.byCategory();
    for(const cat in byCat){
      root.appendChild(U.el("div",{class:"section-title"},U.el("span",{},cat)));
      const g = U.el("div",{class:"card-grid"});
      byCat[cat].forEach(app=>{
        g.appendChild(U.el("button",{class:"app-card",onclick:()=>{
          if(typeof app.mount==="function"){
            document.getElementById("view").innerHTML="";
            app.mount(document.getElementById("view"));
          } else alert(`App "${app.name}" hat noch keine Funktion.`);
        }},
          U.el("div",{class:"icon"},app.icon),
          U.el("div",{class:"name"},app.name),
          U.el("div",{class:"desc"},app.desc||"")
        ));
      });
      root.appendChild(g);
    }
  }

  function viewAvatar(root){
    root.appendChild(U.el("div",{class:"section-title"},
      U.el("span",{class:"emoji"},"🦚"),
      U.el("span",{},"Avatar")
    ));
    root.appendChild(U.el("div",{class:"placeholder"},
      U.el("img",{src:"logo.png",alt:"",style:{width:"120px"}}),
      U.el("h3",{},"Avatar-System — Phase 3"),
      U.el("p",{},"Hier entsteht dein lebendiger Avatar: 3 Modi (Human/Cyborg/Hologram), Spracheingabe, Sprachausgabe, Gemini-Konversation und Wake-Word.")
    ));
  }

  function viewWissen(root){
    root.appendChild(U.el("div",{class:"section-title"},
      U.el("span",{class:"emoji"},"📚"),
      U.el("span",{},"Wissen")
    ));
    root.appendChild(U.el("div",{class:"placeholder"},
      U.el("img",{src:"logo.png",alt:""}),
      U.el("h3",{},"Wissens-Lexika — Phase 5-8"),
      U.el("p",{},"Länder, Edelsteine, Greifvögel, Blumen, Pilze, Astronomie und mehr — alles mit echten Daten, Suche und Filtern.")
    ));
  }

  /* ================= SETTINGS VIEW ================= */
  const SETTINGS_CATS = [
    {id:"general",       icon:"🧩", name:"Allgemein"},
    {id:"appearance",    icon:"🎨", name:"Darstellung"},
    {id:"avatar",        icon:"🦚", name:"Avatar"},
    {id:"voice",         icon:"🎙️", name:"Stimme"},
    {id:"ai",            icon:"🤖", name:"KI & Gemini"},
    {id:"apps",          icon:"📱", name:"Apps"},
    {id:"notifications", icon:"🔔", name:"Benachrichtigungen"},
    {id:"network",       icon:"🌐", name:"Netzwerk"},
    {id:"storage",       icon:"💾", name:"Speicher"},
    {id:"control",       icon:"🎮", name:"Bedienung"},
    {id:"security",      icon:"🔒", name:"Sicherheit"},
    {id:"backup",        icon:"📦", name:"Backup"},
    {id:"stats",         icon:"📊", name:"Statistiken"},
    {id:"info",          icon:"ℹ️", name:"Info"}
  ];

  let currentSettingsTab = "general";

  function viewSettings(root){
    const wrap = U.el("div",{class:"settings-wrap"});
    const nav = U.el("div",{class:"settings-nav"});
    SETTINGS_CATS.forEach(c=>{
      const btn = U.el("button",{
        class: c.id===currentSettingsTab ? "active" : "",
        "data-cat": c.id,
        onclick:()=>{ currentSettingsTab=c.id; viewSettings(root); }
      }, U.el("span",{class:"ico"},c.icon), U.el("span",{},c.name));
      nav.appendChild(btn);
    });
    const panel = U.el("div",{class:"settings-panel"});
    renderSettingsPanel(panel, currentSettingsTab);
    wrap.appendChild(nav);
    wrap.appendChild(panel);
    root.appendChild(wrap);
  }

  function settingRow(label, hint, control){
    return U.el("div",{class:"setting-row"},
      U.el("div",{class:"info"},
        U.el("div",{class:"lbl"},label),
        hint ? U.el("div",{class:"hint"},hint) : null
      ),
      control
    );
  }

  function makeToggle(cat, key){
    const val = Settings.get(cat,key);
    const t = U.el("div",{class:"toggle"+(val?" on":""),onclick:()=>{
      const nv = !Settings.get(cat,key);
      Settings.set(cat,key,nv);
      t.classList.toggle("on",nv);
    }});
    return t;
  }

  function makeInput(cat, key, type="text", placeholder=""){
    return U.el("input",{
      type, value: Settings.get(cat,key)||"",
      placeholder,
      oninput:(e)=>{ Settings.set(cat,key,e.target.value); }
    });
  }

  function makeSelect(cat, key, options){
    const cur = Settings.get(cat,key);
    const sel = U.el("select",{onchange:(e)=>{ Settings.set(cat,key,e.target.value); }});
    options.forEach(([v,l])=>{
      const o=U.el("option",{value:v},l);
      if(v===cur) o.setAttribute("selected","selected");
      sel.appendChild(o);
    });
    return sel;
  }

  function renderSettingsPanel(panel, cat){
    panel.innerHTML="";
    const catMeta = SETTINGS_CATS.find(c=>c.id===cat);

    if(cat === "general") return renderGeneral(panel);
    if(cat === "appearance") return renderAppearance(panel);
    if(cat === "storage") return renderStorage(panel);
    if(cat === "backup") return renderBackup(panel);
    if(cat === "stats") return renderStats(panel);
    if(cat === "security") return renderSecurity(panel);
    if(cat === "info") return renderInfo(panel);
    if(cat === "apps") return renderAppsSettings(panel);

    // Placeholder für Phase 3+
    panel.appendChild(U.el("h2",{},U.el("span",{},catMeta.icon),U.el("span",{},catMeta.name)));
    panel.appendChild(U.el("p",{class:"panel-desc"},"Diese Kategorie wird in Phase 3+ mit allen Steuerelementen ausgestattet."));
    panel.appendChild(U.el("div",{class:"placeholder",style:{padding:"30px 20px"}},
      U.el("img",{src:"logo.png",alt:""}),
      U.el("h3",{},"Vorbereitet für spätere Phase"),
      U.el("p",{},"Die Datenstruktur steht bereits. Steuerelemente kommen mit Avatar/Stimme/KI-Modulen.")
    ));
  }

  function renderGeneral(p){
    p.appendChild(U.el("h2",{},"🧩"," ","Allgemein"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Grundlegende Einstellungen für dein HalDo AI OS."));

    p.appendChild(settingRow("Dein Name","Wird im Dashboard begrüßt",makeInput("general","name","text","z. B. Bruder")));
    p.appendChild(settingRow("Sprache","Systemsprache (bereit für i18n)",makeSelect("general","lang",[["de","Deutsch"],["en","English"],["ku","Kurdî"],["tr","Türkçe"],["ar","العربية"]])));
    p.appendChild(settingRow("Startseite","Welche Seite beim Öffnen zuerst",makeSelect("general","startPage",[
      ["home","🏠 Home"],["apps","📱 Apps"],["avatar","🦚 Avatar"],["settings","⚙️ Einstellungen"],["wissen","📚 Wissen"]
    ])));
    p.appendChild(settingRow("Splash-Animation","Kurzer Boot-Bildschirm beim Start",makeToggle("general","splash")));
  }

  function renderAppearance(p){
    p.appendChild(U.el("h2",{},"🎨"," ","Darstellung"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Farben, Themes und Schrift — alles wirkt sofort live."));

    // Theme presets
    p.appendChild(U.el("div",{class:"lbl",style:{fontWeight:"600",marginTop:"6px",marginBottom:"4px"}},"Fertige Themes"));
    const tGrid = U.el("div",{class:"theme-grid"});
    for(const tname in THEMES){
      const t = THEMES[tname];
      tGrid.appendChild(U.el("button",{class:"theme-btn",onclick:()=>{
        Settings.set("appearance","primary",t.primary);
        Settings.set("appearance","primary2",t.primary2);
        Settings.set("appearance","accent",t.accent);
        viewSettings(document.getElementById("view"));
      }},
        U.el("div",{class:"swatch"},
          U.el("span",{style:{background:t.primary}}),
          U.el("span",{style:{background:t.primary2}}),
          U.el("span",{style:{background:t.accent}})
        ),
        U.el("div",{class:"tname"},tname.charAt(0).toUpperCase()+tname.slice(1))
      ));
    }
    p.appendChild(tGrid);

    // Custom colors
    p.appendChild(U.el("div",{style:{marginTop:"20px"}}));
    p.appendChild(settingRow("Primärfarbe","Hauptfarbe für Akzente & Buttons",makeColorInput("appearance","primary")));
    p.appendChild(settingRow("Sekundärfarbe","Für Gradienten",makeColorInput("appearance","primary2")));
    p.appendChild(settingRow("Akzentfarbe","Highlights",makeColorInput("appearance","accent")));

    // Font size
    const fontSizeCtl = U.el("div",{style:{display:"flex",alignItems:"center",gap:"12px"}},
      U.el("input",{type:"range",min:"80",max:"130",step:"5",value:Settings.get("appearance","fontSize"),
        oninput:(e)=>{ Settings.set("appearance","fontSize",parseInt(e.target.value)); val.textContent=e.target.value+"%"; }}),
      (val = U.el("span",{style:{minWidth:"42px",color:"var(--primary)",fontWeight:"600"}},Settings.get("appearance","fontSize")+"%"))
    );
    p.appendChild(settingRow("Schriftgröße","Skaliert die gesamte Oberfläche",fontSizeCtl));

    p.appendChild(settingRow("Dunkelmodus","Hell oder dunkel",(()=>{
      const isDark = Settings.get("appearance","mode")==="dark";
      const t = U.el("div",{class:"toggle"+(isDark?" on":""),onclick:()=>{
        const nv = Settings.get("appearance","mode")==="dark" ? "light" : "dark";
        Settings.set("appearance","mode",nv);
        t.classList.toggle("on",nv==="dark");
      }});
      return t;
    })()));

    p.appendChild(settingRow("Animationen","Übergänge & Effekte",makeToggle("appearance","animations")));
    p.appendChild(settingRow("Glow-Effekt","Leuchten um Logo",makeToggle("appearance","glow")));

    // Reset
    p.appendChild(U.el("div",{style:{marginTop:"20px",display:"flex",gap:"10px"}},
      U.el("button",{class:"btn",onclick:()=>{
        const d = Settings.defaults.appearance;
        Object.assign(Settings.state.appearance, d);
        Settings.save("appearance");
        viewSettings(document.getElementById("view"));
      }},"🎨 Darstellung zurücksetzen")
    ));
  }

  function makeColorInput(cat,key){
    return U.el("input",{type:"color",value:Settings.get(cat,key),oninput:(e)=>{
      Settings.set(cat,key,e.target.value);
    }});
  }

  function renderStorage(p){
    p.appendChild(U.el("h2",{},"💾"," ","Speicher"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Live-Übersicht aller gespeicherten HalDo-Daten im Browser."));

    const totalKB = Storage.sizeKB();
    const rawKB = Storage.rawKB();
    const keys = Storage.keys();

    p.appendChild(U.el("div",{class:"grid",style:{marginBottom:"18px"}},
      U.el("div",{class:"stat"},U.el("div",{class:"label"},"HalDo-Daten"),U.el("div",{class:"value"},totalKB+" KB")),
      U.el("div",{class:"stat"},U.el("div",{class:"label"},"Gesamt (alle Keys)"),U.el("div",{class:"value"},rawKB+" KB")),
      U.el("div",{class:"stat"},U.el("div",{class:"label"},"Anzahl Keys"),U.el("div",{class:"value"},keys.length))
    ));

    p.appendChild(U.el("div",{class:"lbl",style:{fontWeight:"600",marginBottom:"8px"}},"Gespeicherte Keys"));
    const list = U.el("div",{class:"storage-list"});
    if(keys.length===0) list.appendChild(U.el("div",{style:{color:"var(--text-dim)"}},"— keine Keys —"));
    keys.forEach(k=>{
      const raw = localStorage.getItem(Storage.prefix+k)||"";
      const short = raw.length > 40 ? raw.slice(0,40)+"…" : raw;
      list.appendChild(U.el("div",{class:"key"},
        U.el("span",{class:"k"},k),
        U.el("span",{class:"v"},short)
      ));
    });
    p.appendChild(list);

    p.appendChild(U.el("div",{style:{marginTop:"18px",display:"flex",gap:"10px",flexWrap:"wrap"}},
      U.el("button",{class:"btn",onclick:()=>{
        if(confirm("Alle HalDo-Daten löschen? Einstellungen gehen verloren!")){
          keys.forEach(k=>Storage.del(k));
          Settings.load();
          viewSettings(document.getElementById("view"));
        }
      }},"🗑️ Alle HalDo-Daten löschen"),
      U.el("button",{class:"btn",onclick:()=>viewSettings(document.getElementById("view"))},"🔄 Aktualisieren")
    ));
  }

  function renderBackup(p){
    p.appendChild(U.el("h2",{},"📦"," ","Backup"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Exportiere deine Einstellungen als JSON oder stelle sie wieder her."));

    p.appendChild(settingRow("Voll-Backup exportieren","Alle HalDo-Daten als JSON-Datei",
      U.el("button",{class:"btn primary",onclick:exportBackup},"⬇️ Export")
    ));

    p.appendChild(settingRow("Backup importieren","JSON-Datei auswählen und einspielen",
      (()=>{
        const input = U.el("input",{type:"file",accept:".json",style:{display:"none"},onchange:(e)=>importBackup(e)});
        const btn = U.el("button",{class:"btn",onclick:()=>input.click()},"⬆️ Import");
        return U.el("div",{},btn,input);
      })()
    ));

    p.appendChild(U.el("div",{style:{marginTop:"24px",padding:"16px",border:"1px solid var(--danger)",borderRadius:"12px",background:"color-mix(in srgb,var(--danger) 8%,transparent)"}},
      U.el("div",{style:{fontWeight:"600",marginBottom:"6px",color:"var(--danger)"}},"⚠️ Gefahrenzone"),
      U.el("div",{style:{fontSize:"13px",color:"var(--text-dim)",marginBottom:"12px",lineHeight:"1.5"}},"Diese Aktionen können NICHT rückgängig gemacht werden."),
      U.el("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap"}},
        U.el("button",{class:"btn danger",onclick:()=>{
          if(confirm("Nur Einstellungen zurücksetzen?")){
            Storage.keys().forEach(k=>{ if(k.startsWith("set_")) Storage.del(k); });
            Settings.load();
            viewSettings(document.getElementById("view"));
          }
        }},"Einstellungen zurücksetzen"),
        U.el("button",{class:"btn danger",onclick:()=>{
          if(confirm("KOMPLETT-RESET? Alle HalDo-Daten werden gelöscht!") && confirm("Wirklich sicher?")){
            Storage.keys().forEach(k=>Storage.del(k));
            location.reload();
          }
        }},"Komplett-Reset")
      )
    ));
  }

  function exportBackup(){
    const data = {};
    Storage.keys().forEach(k=>{ data[k] = Storage.get(k); });
    const payload = {
      app:"HalDo AI OS",
      version:"2.0",
      phase:2,
      exported: new Date().toISOString(),
      data
    };
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "haldo-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alert("✅ Backup exportiert!");
  }

  function importBackup(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const payload = JSON.parse(ev.target.result);
        if(!payload.data){ alert("❌ Ungültiges Backup-Format"); return; }
        if(!confirm("Backup importieren? Aktuelle Daten werden überschrieben.")) return;
        for(const k in payload.data){ Storage.set(k,payload.data[k]); }
        alert("✅ Backup importiert! Seite wird neu geladen.");
        location.reload();
      }catch(err){ alert("❌ Fehler beim Lesen: "+err.message); }
    };
    reader.readAsText(file);
  }

  function renderStats(p){
    p.appendChild(U.el("h2",{},"📊"," ","Statistiken"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Live-Zahlen aus deiner aktuellen Installation."));

    const keys = Storage.keys();
    const days = Storage.get("days_used",1);
    const firstUse = Storage.get("first_use",null);
    const kb = Storage.sizeKB();

    p.appendChild(U.el("div",{class:"grid"},
      statBlock("Tage genutzt", days, firstUse ? "seit "+new Date(firstUse).toLocaleDateString("de-DE") : "heute gestartet"),
      statBlock("Storage-Keys", keys.length, "in localStorage"),
      statBlock("Speicher", kb+" KB", "HalDo-Daten"),
      statBlock("Registry", Registry.count(), "registrierte Apps")
    ));

    function statBlock(l,v,s){
      return U.el("div",{class:"stat"},
        U.el("div",{class:"label"},l),
        U.el("div",{class:"value"},String(v)),
        U.el("div",{class:"sub"},s)
      );
    }
  }

  function renderSecurity(p){
    p.appendChild(U.el("h2",{},"🔒"," ","Sicherheit"));
    p.appendChild(U.el("p",{class:"panel-desc"},"PIN und Sperr-Optionen. Die PIN wird lokal gespeichert."));

    const pin = Settings.get("security","pin");
    p.appendChild(settingRow("PIN aktiv", pin ? "PIN ist gesetzt ✅" : "Kein PIN gesetzt",
      (()=>{
        const t = U.el("div",{class:"toggle"+(pin?" on":""),onclick:()=>{
          if(Settings.get("security","pin")){
            Settings.set("security","pin","");
            viewSettings(document.getElementById("view"));
          }else{
            const v = prompt("Neue PIN eingeben (4-8 Ziffern):");
            if(v && /^\d{4,8}$/.test(v)){
              Settings.set("security","pin",v);
              viewSettings(document.getElementById("view"));
            } else if(v) alert("❌ Nur 4-8 Ziffern erlaubt");
          }
        }});
        return t;
      })()
    ));

    p.appendChild(settingRow("Analytics","Interne Nutzungsstatistik (lokal)",makeToggle("security","analytics")));
  }

  function renderAppsSettings(p){
    p.appendChild(U.el("h2",{},"📱"," ","Apps"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Sortierung und Verwaltung. Favoriten & Verstecken kommen mit den Apps in Phase 4+."));
    p.appendChild(settingRow("Sortierung","Wie Apps in der Liste sortiert werden",makeSelect("apps","sort",[
      ["az","Alphabetisch (A-Z)"],["za","Alphabetisch (Z-A)"],["cat","Nach Kategorie"],["new","Neueste zuerst"]
    ])));
  }

  function renderInfo(p){
    p.appendChild(U.el("h2",{},"ℹ️"," ","Info"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Über HalDo AI OS"));

    p.appendChild(U.el("div",{class:"hero",style:{marginTop:"14px"}},
      U.el("img",{src:"logo.png",alt:""}),
      U.el("div",{class:"h-text"},
        U.el("h2",{},"HalDo AI OS"),
        U.el("p",{},"Version 2.0 · Phase 2 (Einstellungen)")
      )
    ));

    const rows = [
      ["Version","2.0"],
      ["Phase","2 / 11"],
      ["Registry","aktiv"],
      ["Storage","localStorage"],
      ["Ursprüngliche Apps","857 (Backup gesichert)"],
      ["Ziel","70 Apps voll funktionsfähig"]
    ];
    rows.forEach(([k,v])=>{
      p.appendChild(settingRow(k,null,U.el("span",{style:{color:"var(--primary)",fontWeight:"600"}},v)));
    });

    p.appendChild(U.el("div",{style:{marginTop:"20px",textAlign:"center",color:"var(--text-dim)",fontSize:"12px"}},
      "🦚 Gebaut mit Liebe für Bruder · " + new Date().getFullYear()
    ));
  }

  /* ================= BOOT ================= */
  function boot(){
    // Tage-Zähler
    const lastDate = Storage.get("last_date","");
    const todayStr = new Date().toDateString();
    if(!Storage.get("first_use",null)) Storage.set("first_use",Date.now());
    if(lastDate !== todayStr){
      Storage.set("days_used", (Storage.get("days_used",0)||0)+1);
      Storage.set("last_date", todayStr);
    }

    // Uhr
    function tick(){
      const el = document.getElementById("clock");
      if(el) el.textContent = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    }
    tick();
    setInterval(tick,15000);

    // Settings laden (VOR Router.start)
    Settings.load();

    // Nav + Router
    buildNav();
    Router.add("home",viewHome);
    Router.add("apps",viewApps);
    Router.add("avatar",viewAvatar);
    Router.add("settings",viewSettings);
    Router.add("wissen",viewWissen);

    // Splash weg (wenn aktiviert)
    const splashOn = Settings.get("general","splash");
    if(splashOn){
      setTimeout(()=>{
        const b = document.getElementById("boot");
        if(b){ b.classList.add("hide"); setTimeout(()=>b.remove(),500); }
      },300);
    } else {
      const b = document.getElementById("boot");
      if(b) b.remove();
    }

    // Startseite
    const startPage = Settings.get("general","startPage") || "home";
    Router.go(startPage);

    // Globale API
    window.HalDo = { Storage, Bus, Registry, Router, U, Settings, version:"2.0", phase:2 };
    console.log("%c🦚 HalDo AI OS v2 — Phase 2 geladen","color:#00d4b8;font-weight:bold;font-size:14px");
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
</body>
