<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>HalDo AI OS v150</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="css.css">
<script src="beep-notify.js"></script>
</head>
<body>

<div id="bootScreen">
  <div class="boot-logo">
    <img src="logo.png" alt="HalDo" class="boot-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div class="boot-logo-fallback">🦚</div>
  </div>
  <div class="boot-title">HalDo AI OS</div>
  <div class="boot-version">v150 · Cosmic Edition</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootBarFill"></div></div>
  <div class="boot-status" id="bootStatus">Boot Detection…</div>
  <div class="boot-hud">
    <div class="boot-ring boot-ring-1"></div>
    <div class="boot-ring boot-ring-2"></div>
    <div class="boot-ring boot-ring-3"></div>
  </div>
</div>

<div id="bgLayer"><canvas id="bgCanvas"></canvas></div>
<div class="hint" id="hint">☀️ Sonne = Chat · 🪐 Planeten = Apps</div>

<header id="topbar">
  <button class="icon-btn menu-btn" id="sidebarBtn" title="Menü">☰</button>
  <div class="logo" id="logoBtn">
    <img src="logo.png" alt="HalDo" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="peacock" style="display:none">🦚</span>
    <div class="txt"><span class="t1">HalDo</span><span class="t2">AI OS v150</span></div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="testBtn" title="Selbsttest" style="background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.5);color:#4ade80">✅</button>
  <button class="icon-btn" id="voiceBtn">🔊</button>
  <button class="icon-btn" id="themeToggle">🎨</button>
  <button class="icon-btn" id="settingsBtn">⚙️</button>
</header>

<aside id="sidebar"></aside>
<main id="desktop"></main>

<footer id="bottombar">
  <button class="bbtn" id="bbChat"><span class="ico">💬</span>Chat</button>
  <button class="bbtn" id="bbVoice"><span class="ico">🔊</span>Voice</button>
  <button class="bbtn cyborg" id="bbCyborg"><span class="ico">⚡</span>CYBORG</button>
</footer>

<div id="settings" class="modal"><div class="panel-box"><div class="phead"><span class="ico">⚙️</span><h2>Allgemeine Einstellungen</h2><button class="close" id="settingsClose">✕</button></div><div class="pbody" id="settingsBody"></div></div></div>
<div id="appSettings" class="modal"><div class="panel-box"><div class="phead"><span class="ico" id="appSetIco">⚙️</span><h2 id="appSetTitle">App-Einstellungen</h2><button class="close" id="appSetClose">✕</button></div><div class="pbody" id="appSetBody"></div></div></div>
<div id="voicePanel" class="modal"><div class="panel-box"><div class="phead"><span class="ico">🔊</span><h2>HalDoVoice</h2><button class="close" id="voicePanelClose">✕</button></div><div class="pbody" id="voicePanelBody"></div></div></div>
<div id="testPanel" class="modal"><div class="panel-box"><div class="phead"><span class="ico">✅</span><h2>HalDo Selbsttest</h2><button class="close" id="testPanelClose">✕</button></div><div class="pbody" id="testPanelBody"></div></div></div>
<div id="toast"></div>

<script src="kernel.js"></script>
<script src="config.js"></script>
<script src="storage.js"></script>
<script src="security.js"></script>
<script src="registry.js"></script>
<script src="app-manager.js"></script>
<script src="runtime.js"></script>
<script src="router.js"></script>
<script src="window-manager.js"></script>
<script src="display.js"></script>
<script src="desktop.js"></script>
<script src="cosmic-world.js"></script>
<script src="voice.js"></script>
<script src="language.js"></script>
<script src="memory.js"></script>
<script src="ai-core.js"></script>
<script src="ai-avatar.js"></script>
<script src="menu-system.js"></script>

<script src="chat.js"></script>
<script src="ezidi.js"></script>
<script src="welt.js"></script>
<script src="wissen.js"></script>
<script src="games.js"></script>
<script src="prompt.js"></script>
<script src="kreativ.js"></script>
<script src="lernen.js"></script>
<script src="produktiv.js"></script>
<script src="finanzen.js"></script>
<script src="werkzeuge.js"></script>
<script src="verkehr.js"></script>
<script src="comm.js"></script>
<script src="dokumente.js"></script>
<script src="medien.js"></script>
<script src="fitness.js"></script>
<script src="kueche.js"></script>
<script src="zuhause.js"></script>
<script src="aufnahme.js"></script>
<script src="system-center.js"></script>

<script src="update.js"></script>
<script src="backup.js"></script>
<script src="recovery.js"></script>
<script src="diagnostics.js"></script>

<script src="init.js"></script>

<script>
(function(){
  "use strict";
  function runTest(){
    var results = [];
    function check(label, fn){
      try { var r = fn(); results.push({ ok: !!r, label: label, info: r === true ? "" : r }); }
      catch(e){ results.push({ ok: false, label: label, info: e.message }); }
    }
    check("kernel.js", function(){ return window.HalDo && HalDo.Kernel ? "geladen" : false; });
    check("config.js", function(){ return window.HalDo && HalDo.Config ? "geladen" : false; });
    check("registry.js", function(){ return window.HalDo && HalDo.Registry ? HalDo.Registry.count() + " Apps" : false; });
    check("router.js", function(){ return window.HalDo && HalDo.Router ? "geladen" : false; });
    check("window-manager.js", function(){ return window.HalDo && HalDo.WindowManager ? "geladen" : false; });
    check("desktop.js", function(){ return window.HalDo && HalDo.Desktop ? "geladen" : false; });
    check("voice.js", function(){ return window.HalDo && HalDo.Voice ? "geladen" : false; });
    check("ai-core.js", function(){ return window.HalDo && HalDo.AI ? "geladen" : false; });
    check("App: chat", function(){ return HalDo.Modules && HalDo.Modules.chat ? "✓" : false; });
    check("App: haldoai", function(){ return HalDo.Modules && HalDo.Modules.haldoai ? "✓" : false; });
    check("App: prompt", function(){ return HalDo.Modules && HalDo.Modules.prompt ? "✓" : false; });
    check("App: ezidi", function(){ return HalDo.Modules && HalDo.Modules.ezidi ? "✓" : false; });
    check("App: welt", function(){ return HalDo.Modules && HalDo.Modules.welt ? "✓" : false; });
    check("App: wissen", function(){ return HalDo.Modules && HalDo.Modules.wissen ? "✓" : false; });
    check("App: games", function(){ return HalDo.Modules && HalDo.Modules.games ? "✓" : false; });
    check("App: kreativ", function(){ return HalDo.Modules && HalDo.Modules.kreativ ? "✓" : false; });
    check("App: lernen", function(){ return HalDo.Modules && HalDo.Modules.lernen ? "✓" : false; });
    check("App: produktiv", function(){ return HalDo.Modules && HalDo.Modules.produktiv ? "✓" : false; });
    check("App: finanzen", function(){ return HalDo.Modules && HalDo.Modules.finanzen ? "✓" : false; });
    check("App: werkzeuge", function(){ return HalDo.Modules && HalDo.Modules.werkzeuge ? "✓" : false; });
    check("App: verkehr", function(){ return HalDo.Modules && HalDo.Modules.verkehr ? "✓" : false; });
    check("App: comm", function(){ return HalDo.Modules && HalDo.Modules.comm ? "✓" : false; });
    check("App: dokumente", function(){ return HalDo.Modules && HalDo.Modules.dokumente ? "✓" : false; });
    check("App: medien", function(){ return HalDo.Modules && HalDo.Modules.medien ? "✓" : false; });
    var okCount = results.filter(function(r){ return r.ok; }).length;
    var total = results.length;
    var html = '<div style="padding:10px;background:' + (okCount === total ? "rgba(34,197,94,.15)" : "rgba(239,68,68,.15)") + ';border-radius:10px;margin-bottom:12px;text-align:center;border:1px solid ' + (okCount === total ? "rgba(34,197,94,.5)" : "rgba(239,68,68,.5)") + '">'
      + '<div style="font-size:34px">' + (okCount === total ? "✅" : "⚠️") + '</div>'
      + '<div style="font-size:18px;font-weight:900;color:' + (okCount === total ? "#4ade80" : "#ff8080") + ';margin-top:8px">' + okCount + ' / ' + total + ' OK</div></div>';
    html += '<div style="background:rgba(0,0,0,.3);padding:12px;border-radius:10px;max-height:50vh;overflow-y:auto">';
    results.forEach(function(r){
      html += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;display:flex;gap:8px;align-items:center">'
        + '<span style="font-size:14px">' + (r.ok ? "✅" : "❌") + '</span>'
        + '<span style="flex:1;font-weight:500">' + r.label + '</span>'
        + (r.info ? '<span style="font-size:10px;color:var(--text-mute)">' + r.info + '</span>' : '')
        + '</div>';
    });
    html += '</div>';
    return { html: html };
  }
  function openTestPanel(){
    var modal = document.getElementById("testPanel");
    var body = document.getElementById("testPanelBody");
    if(!modal || !body) return;
    var r = runTest();
    body.innerHTML = r.html;
    modal.classList.add("show");
  }
  window.HalDoTest = openTestPanel;
  document.addEventListener("DOMContentLoaded", function(){
    var tb = document.getElementById("testBtn");
    if(tb) tb.addEventListener("click", openTestPanel);
    var tc = document.getElementById("testPanelClose");
    if(tc) tc.addEventListener("click", function(){ document.getElementById("testPanel").classList.remove("show"); });
  });
})();
</script>

</body>
</html>
