<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>HalDo AI OS · v122</title>
<style>
:root{
  --c1:#00e5ff;--c2:#4da8ff;--c3:#b478ff;
  --bg:#05060f;--panel:rgba(10,14,32,.72);--panel2:rgba(18,22,44,.82);
  --line:rgba(0,229,255,.28);--line2:rgba(255,255,255,.08);
  --txt:#e9edff;--dim:#8a95bd;--acc:var(--c1);
  --glow:0 0 12px rgba(0,229,255,.45),0 0 32px rgba(0,229,255,.15);
  --sh:0 26px 70px rgba(0,0,0,.6);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
body.cyborg{
  --c1:#ff78c8;--c2:#b478ff;--c3:#d484ff;
  --line:rgba(255,120,200,.32);
  --glow:0 0 12px rgba(255,120,200,.5),0 0 32px rgba(180,120,255,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ============ KOSMOS ============ */
#cosmos{position:fixed;inset:0;overflow:hidden;z-index:0;
  background:radial-gradient(ellipse at 68% 14%,#101a3a 0%,#070a1c 45%,#03040c 100%);}
#stars{position:absolute;inset:0;display:block}
.sun{position:absolute;left:50%;top:52%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff8c8,var(--c1) 42%,var(--c3) 68%,rgba(0,0,0,0) 72%);
  box-shadow:0 0 70px 26px rgba(0,229,255,.32),0 0 200px 90px rgba(180,120,255,.15);
  animation:sunPulse 8s ease-in-out infinite;}
@keyframes sunPulse{50%{transform:scale(1.06)}}
.orbit{position:absolute;left:50%;top:52%;border:1px solid rgba(255,255,255,.05);border-radius:50%;
  transform:translate(-50%,-50%);animation:spin linear infinite;}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.planet{position:absolute;left:50%;top:0;border-radius:50%;transform:translate(-50%,-50%);}

/* ============ TOP-BAR ============ */
#topbar{
  position:fixed;top:var(--safe-t);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--panel);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1.5px solid var(--line);
}
#menuBtn{display:none}
.iconbtn{background:rgba(255,255,255,.06);border:1.5px solid var(--line);color:var(--txt);
  width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;
  display:grid;place-items:center;transition:.15s;flex:0 0 auto;}
.iconbtn:hover{background:rgba(0,229,255,.12);box-shadow:var(--glow)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
  font-size:20px;font-weight:800;color:#fff;flex:0 0 auto;
  background:linear-gradient(135deg,var(--c1),var(--c3));
  box-shadow:0 0 14px rgba(0,229,255,.5);}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-size:13.5px;letter-spacing:.4px;white-space:nowrap}
.sm{font-size:11px}
.dim{color:var(--dim)}
.spacer{flex:1}
#search{
  width:220px;max-width:42vw;height:40px;border-radius:12px;padding:0 12px;
  background:rgba(255,255,255,.06);border:1.5px solid var(--line2);color:var(--txt);
  outline:none;font-size:13px;transition:.15s;
}
#search:focus{border-color:var(--c1);box-shadow:var(--glow)}
#clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);white-space:nowrap}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:calc(var(--safe-t) + 56px);bottom:calc(var(--safe-b) + 56px);left:var(--safe-l);
  width:236px;z-index:8000;padding:14px 10px;
  background:var(--panel);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-right:1.5px solid var(--line);overflow-y:auto;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#sidebar h4{margin:8px 4px 8px;font-size:10.5px;letter-spacing:1.4px;color:var(--dim);
  text-transform:uppercase;font-weight:700}
.catbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;margin-bottom:3px;
  background:transparent;border:1.5px solid transparent;border-radius:12px;color:var(--txt);
  cursor:pointer;font-size:13px;text-align:left;transition:.15s;
}
.catbtn:hover{background:rgba(0,229,255,.08);border-color:var(--line)}
.catbtn.active{background:rgba(0,229,255,.14);border-color:var(--c1);box-shadow:var(--glow)}
.catbtn .ico{font-size:16px;width:22px;text-align:center;flex:0 0 auto}
.catbtn .n{margin-left:auto;font-size:10.5px;color:var(--dim);padding:2px 7px;border-radius:8px;
  background:rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
.catbtn.active .n{background:rgba(0,229,255,.2);color:#fff}

/* ============ DESKTOP ============ */
#desktop{
  position:fixed;top:calc(var(--safe-t) + 56px);left:calc(var(--safe-l) + 236px);right:var(--safe-r);
  bottom:calc(var(--safe-b) + 56px);z-index:1;overflow-y:auto;padding:18px 18px 40px;
}
#desktop h3{
  margin:22px 0 12px;font-size:14px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;
  color:var(--txt);font-weight:700;
}
#desktop h3:first-child{margin-top:0}
#desktop h3 .ico{font-size:18px}
#desktop h3 .n{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto;
  background:rgba(255,255,255,.06);padding:3px 9px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 5px;border-radius:15px;
  cursor:pointer;text-align:center;transition:.18s;border:1.5px solid transparent;user-select:none;
}
.app:hover{background:rgba(0,229,255,.06);border-color:var(--line);transform:translateY(-2px)}
.app:active{transform:scale(.95)}
.app .ic{
  font-size:26px;width:52px;height:52px;display:grid;place-items:center;border-radius:15px;
  background:linear-gradient(150deg,rgba(0,229,255,.14),rgba(180,120,255,.08));
  border:1.5px solid var(--line);
  transition:.18s;
}
.app.ready:hover .ic{box-shadow:var(--glow)}
.app.soon .ic{opacity:.4}
.app .nm{font-size:11px;color:var(--dim);line-height:1.25;word-break:break-word;padding:0 2px}
.app.ready .nm{color:var(--txt);font-weight:500}

/* ============ FENSTER ============ */
.window{
  position:fixed;z-index:200;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel2);
  backdrop-filter:blur(26px) saturate(1.5);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1.5px solid var(--line);border-radius:18px;
  box-shadow:var(--sh),0 0 0 1px rgba(0,0,0,.3),var(--glow);
  animation:winIn .2s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
@keyframes winIn{from{opacity:0;transform:scale(.95) translateY(12px)}}
.window.maxed{left:8px!important;top:64px!important;right:8px;bottom:8px;width:auto!important;height:auto!important;border-radius:14px}
.window.dragging{transition:none!important}
.win-head{
  height:46px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;
  border-bottom:1.5px solid var(--line);user-select:none;
  touch-action:none;position:relative;
}
.win-head::before{
  content:'';position:absolute;left:100px;right:100px;top:0;bottom:0;
  cursor:grab;
}
.win-head:active::before{cursor:grabbing}
.wic{font-size:16px;flex:0 0 auto}
.wtitle{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtns{display:flex;gap:5px;position:relative;z-index:999999}
.wb{
  width:40px;height:40px;border-radius:11px;border:1.5px solid transparent;background:rgba(255,255,255,.05);
  color:var(--dim);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;
  transition:.12s;position:relative;z-index:999999;
}
.wb:hover{background:rgba(0,229,255,.15);color:var(--txt)}
.wb.close:hover{background:#e03b5a;color:#fff;border-color:#e03b5a}
.win-body{flex:1;overflow:auto;padding:16px;position:relative}
.win-body.nopad{padding:0}

/* ============ BOTTOM-BAR ============ */
#bottomBar{
  position:fixed;bottom:var(--safe-b);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;
  background:var(--panel);backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-top:1.5px solid var(--line);
}
.bbtn{
  display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--line);color:var(--txt);
  cursor:pointer;font-size:13px;font-weight:500;transition:.15s;
}
.bbtn:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow)}
.bbtn.cyborg{background:linear-gradient(135deg,rgba(255,120,200,.14),rgba(180,120,255,.14))}
.bbtn.on{background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;border-color:var(--c1);box-shadow:var(--glow)}

/* ============ UI-BAUSTEINE ============ */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.big{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.05}
.big2{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{
  padding:9px 15px;border-radius:12px;border:1.5px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500;
  transition:.15s;font-family:inherit;
}
.btn:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#fff;font-weight:600}
.btn.danger{background:rgba(224,59,90,.16);border-color:rgba(224,59,90,.5);color:#ff9db1}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.card{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.045);border:1.5px solid var(--line);font-size:13px}
.card.tight{padding:9px 11px}
.inp,.ta{
  width:100%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.055);
  border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13.5px;font-family:inherit;
  transition:.15s;
}
.inp:focus,.ta:focus{border-color:var(--c1);box-shadow:var(--glow)}
.ta{min-height:150px;resize:vertical;line-height:1.5;font-family:inherit}
.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:4px;display:block}
h3{font-size:12.5px;margin:14px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.list{display:flex;flex-direction:column;gap:6px}
.item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  background:rgba(255,255,255,.045);border:1.5px solid var(--line2);font-size:13px;
}
.item .x{margin-left:auto;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.item .x:hover{background:rgba(224,59,90,.2);color:#ff9db1}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:22px 10px;font-style:italic}

/* Rechner */
.calc{max-width:340px;margin:0 auto}
.calc-disp{
  font-size:30px;font-weight:700;text-align:right;padding:16px 14px;border-radius:14px;
  background:rgba(0,0,0,.25);border:1.5px solid var(--line);margin-bottom:10px;min-height:66px;
  overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;justify-content:center;
}
.calc-disp .prev{font-size:12px;color:var(--dim);height:14px;overflow:hidden}
.calc-disp .cur{line-height:1.1}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{
  padding:15px 0;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--txt);font-size:17px;cursor:pointer;transition:.1s;font-weight:500;
}
.ck:hover{background:rgba(0,229,255,.14)}
.ck:active{transform:scale(.94)}
.ck.op{background:rgba(180,120,255,.12);border-color:rgba(180,120,255,.4)}
.ck.wide{grid-column:span 2}
.ck.eq{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#fff;font-weight:700}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal-h{text-align:center;font-size:11px;color:var(--dim);padding:4px 0;font-weight:600}
.cal-d{
  text-align:center;padding:9px 0;border-radius:10px;background:rgba(255,255,255,.04);
  font-size:13px;cursor:pointer;transition:.15s;border:1.5px solid transparent;
}
.cal-d:hover{background:rgba(0,229,255,.1)}
.cal-d.today{background:var(--c1);color:#fff;font-weight:700;box-shadow:var(--glow)}
.cal-d.empty{background:transparent;cursor:default;pointer-events:none}

/* Spiele */
.ttt{display:grid;grid-template-columns:repeat(3,86px);gap:8px;margin:0 auto}
.tttc{
  height:86px;display:grid;place-items:center;font-size:36px;font-weight:800;border-radius:14px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--line);cursor:pointer;transition:.12s;
  color:var(--txt);
}
.tttc:hover{background:rgba(0,229,255,.12)}
.tttc.x{color:var(--c1)}
.tttc.o{color:var(--c3)}
.mem{display:grid;grid-template-columns:repeat(4,66px);gap:8px;margin:0 auto}
.mc{
  height:66px;display:grid;place-items:center;font-size:28px;border-radius:12px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1.5px solid var(--line);transition:.18s;user-select:none;
}
.mc.open{background:rgba(0,229,255,.24);border-color:var(--c1)}
.mc.done{background:rgba(180,120,255,.12);border-color:var(--c3);opacity:.55}
.g2048{
  display:grid;grid-template-columns:repeat(4,72px);gap:8px;padding:10px;border-radius:16px;
  background:rgba(0,0,0,.22);border:1.5px solid var(--line);margin:0 auto;width:fit-content;
}
.g2048 .t{
  height:72px;display:grid;place-items:center;font-size:22px;font-weight:800;border-radius:10px;
  transition:.1s;color:#fff;
}
.snake-cv{display:block;margin:0 auto;background:#04050f;border:1.5px solid var(--line);border-radius:14px;max-width:100%;touch-action:none}
.hang-keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px;max-width:460px}
.hk{
  width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);
  color:var(--txt);cursor:pointer;font-size:13px;font-weight:600;
}
.hk:disabled{opacity:.35;cursor:default}
.hk.bad{background:rgba(224,59,90,.32);border-color:#e03b5a;color:#fff}
.hk.good{background:rgba(0,229,255,.32);border-color:var(--c1);color:#fff}
.reaction-area{
  height:220px;border-radius:14px;border:1.5px solid var(--line);display:grid;place-items:center;
  cursor:pointer;user-select:none;font-size:18px;font-weight:600;transition:background .15s;
}
.typing-text{font-size:15px;line-height:1.7;padding:14px;border-radius:12px;background:rgba(0,0,0,.22);border:1.5px solid var(--line);font-family:ui-monospace,Menlo,monospace}
.typing-text .ok{color:#4de88a}
.typing-text .bad{color:#ff6b88;text-decoration:underline}

/* Piano */
.piano{display:flex;justify-content:center;gap:3px;margin-top:12px;user-select:none}
.pk{
  width:52px;height:150px;border-radius:0 0 10px 10px;border:1.5px solid var(--line);
  background:linear-gradient(180deg,#fff,#dde3f5);color:#1a1d2e;font-weight:700;cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:13px;
  transition:.08s;font-family:inherit;
}
.pk:active,.pk.on{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;transform:scale(.97)}

/* Farbe / QR */
.swatch{width:100%;height:120px;border-radius:14px;border:1.5px solid var(--line)}
canvas.qr{display:block;margin:0 auto;background:#fff;border-radius:12px;image-rendering:pixelated}

/* Übersetzer */
.tr-out{min-height:90px;padding:12px;border-radius:12px;background:rgba(0,229,255,.06);border:1.5px solid var(--line)}

/* Periodensystem */
.ptable{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;font-size:10px;min-width:640px}
.pe{padding:6px 3px;border-radius:6px;text-align:center;border:1px solid var(--line2);cursor:pointer}
.pe:hover{border-color:var(--c1);box-shadow:var(--glow)}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translate(-50%,140%);z-index:9999;
  padding:11px 18px;border-radius:13px;background:rgba(10,14,32,.96);
  border:1.5px solid var(--line);font-size:13px;transition:transform .3s cubic-bezier(.4,0,.2,1);
  max-width:88vw;text-align:center;box-shadow:var(--sh),var(--glow);
}
#toast.on{transform:translate(-50%,0)}

/* Search dropdown */
#searchRes{
  position:fixed;top:calc(var(--safe-t) + 60px);left:50%;transform:translateX(-50%);width:min(90vw,420px);
  max-height:60vh;overflow-y:auto;z-index:9500;padding:8px;
  background:var(--panel2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--sh),var(--glow);
  display:none;
}
#searchRes.on{display:block}
#searchRes .sr{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;
  border:1.5px solid transparent;font-size:13px;
}
#searchRes .sr:hover{background:rgba(0,229,255,.1);border-color:var(--line)}
#searchRes .sr .ico{font-size:18px;width:24px;text-align:center}

/* ============ MOBILE ============ */
@media(max-width:820px){
  #menuBtn{display:grid}
  #sidebar{transform:translateX(-105%)}
  #sidebar.open{transform:translateX(0);box-shadow:14px 0 40px rgba(0,0,0,.55)}
  #desktop{left:var(--safe-l);padding:14px 12px 30px}
  .brand{display:none}
  #search{width:auto;flex:1;max-width:none}
  #clock{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
  .app .ic{width:48px;height:48px;font-size:24px}
  .window{border-radius:0!important}
  .window.maxed{left:0!important;top:56px!important;right:0;bottom:56px;border-radius:0!important}
  .win-body{padding:13px}
  .mem{grid-template-columns:repeat(4,1fr);width:100%;max-width:340px}
  .mc{height:auto;aspect-ratio:1}
  .ttt{grid-template-columns:repeat(3,1fr);width:100%;max-width:300px}
  .tttc{height:auto;aspect-ratio:1}
  .g2048{grid-template-columns:repeat(4,1fr);width:100%;max-width:340px}
  .g2048 .t{height:auto;aspect-ratio:1;font-size:18px}
  .pk{width:40px;height:130px}
  #bottomBar{gap:5px;padding:0 8px}
  .bbtn{padding:9px 10px;font-size:12px}
  .bbtn span.lbl-txt{display:none}
  .calc{max-width:100%}
  .calc-disp{font-size:26px;padding:14px 12px}
  .ck{padding:14px 0;font-size:16px}
  .ptable{min-width:520px}
}
@media(max-width:400px){
  .bbtn{padding:9px 8px}

  <button class="bbtn cyborg" data-act="cyborg">⚡ <span class="lbl-txt">CYBORG</span></button>
</div>

<div id="searchRes"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   HalDo AI OS v122 — kompletter Neubau
   ========================================================================= */
(function(){
'use strict';

/* ---------- Helpers ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase()
  .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const uid = ()=>Math.random().toString(36).slice(2,10);
const pad = (n,l=2)=>String(n).padStart(l,'0');
const fmt = n => (Math.round(n*100)/100).toLocaleString('de-DE');

const store = {
  key: k => 'haldo_'+k+'_v1',
  get(k,d){ try{ const v=localStorage.getItem(this.key(k)); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(this.key(k), JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(this.key(k)); }catch(e){} }
};

let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200);
}

/* =========================================================================
   KOSMOS — Sonne + 12 Planeten
   ========================================================================= */
(function cosmos(){
  const cv=$('#stars'), ctx=cv.getContext('2d',{alpha:true});
  let dpr = Math.min(devicePixelRatio||1, 2);
  function draw(){
    const w=cv.width=Math.floor(innerWidth*dpr);
    const h=cv.height=Math.floor(innerHeight*dpr);
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    ctx.clearRect(0,0,w,h);
    for(let i=0;i<280;i++){
      const x=Math.random()*w, y=Math.random()*h, r=(Math.random()*1.3+.3)*dpr;
      ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.7+.2)+')';
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
    for(let i=0;i<12;i++){
      const x=Math.random()*w, y=Math.random()*h, r=(Math.random()*2+1.2)*dpr;
      const g=ctx.createRadialGradient(x,y,0,x,y,r*6);
      g.addColorStop(0,'rgba(160,220,255,.5)');
      g.addColorStop(1,'rgba(160,220,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r*6,0,7); ctx.fill();
    }
  }
  draw();
  addEventListener('resize',()=>{ dpr=Math.min(devicePixelRatio||1,2); draw(); },{passive:true});

  const cos=$('#cosmos');
  cos.appendChild(el('div','sun'));
  const P=[
    ['#a9c8ff', 168, 12, 22],
    ['#ffd18a', 250, 17, 34],
    ['#8ad4ff', 348, 19, 50],
    ['#ff8ea3', 440, 16, 66],
    ['#e0b4ff', 545, 24, 90],
    ['#7de3c7', 650, 21, 118],
    ['#9fd7ff', 760, 20, 148],
    ['#c1a3ff', 875, 18, 184],
    ['#ffbfa3', 990, 15, 224],
    ['#a3ffd1', 1095, 14, 266],
    ['#ffa3c9', 1200, 13, 314],
    ['#d1c9ff', 1305, 12, 360]
  ];
  P.forEach(([c,d,s,sec])=>{
    const o=el('div','orbit');
    o.style.width=o.style.height=d+'px';
    o.style.animationDuration=sec+'s';
    const p=el('div','planet');
    p.style.width=p.style.height=s+'px';
    p.style.background='radial-gradient(circle at 34% 30%,#fff,'+c+' 58%,rgba(0,0,0,.62))';
    p.style.boxShadow='0 0 16px '+c+',0 0 40px '+c+'44';
    o.appendChild(p); cos.appendChild(o);
  });
})();

/* =========================================================================
   THEME (Holo / Cyborg)
   ========================================================================= */
function setTheme(mode){
  if(mode==='cyborg'){ document.body.classList.add('cyborg'); }
  else{ document.body.classList.remove('cyborg'); }
  store.set('theme', mode);
  $('#themeBtn').textContent = mode==='cyborg'?'🌌':'⚡';
  $$('.bbtn.cyborg').forEach(b=>b.classList.toggle('on', mode==='cyborg'));
}
$('#themeBtn').onclick = ()=>{
  const on = document.body.classList.contains('cyborg');
  setTheme(on?'holo':'cyborg');
  toast(on?'Holo-Modus aktiv 🌌':'CYBORG-Modus aktiv ⚡');
};
setTheme(store.get('theme','holo'));

/* =========================================================================
   FENSTER-MANAGER
   ========================================================================= */
const WM = {
  wins: new Map(),
  zTop: 200,
  focused: null,

  open(appId, opts={}){
    const app = APPS[appId];
    if(!app){ toast('App nicht gefunden: '+appId); return; }
    for(const [id,w] of this.wins){
      if(w.appId===appId){
        w.el.style.display='';
        this.focus(id);
        return w.el;
      }
    }
    const id = uid();
    const win = el('section','window');
    win.dataset.id = id;
    win.style.zIndex = ++this.zTop;

    const W = Math.min(opts.w||520, innerWidth-16);
    const H = Math.min(opts.h||420, innerHeight-16);
    win.style.width  = W+'px';
    win.style.height = H+'px';
    win.style.left   = Math.max(8, (innerWidth-W)/2 + (this.wins.size%5)*22 - 44)+'px';
    win.style.top    = Math.max(64, (innerHeight-H)/2 + (this.wins.size%5)*18 - 36)+'px';

    win.innerHTML =
      '<div class="win-head">'+
        '<span class="wic">'+esc(app.icon||'▣')+'</span>'+
        '<div class="wtitle">'+esc(app.name||appId)+'</div>'+
        '<div class="wbtns">'+
          '<button class="wb min" title="Minimieren">—</button>'+
          '<button class="wb max" title="Vollbild">▢</button>'+
          '<button class="wb close" title="Schließen">✕</button>'+
        '</div>'+
      '</div>'+
      '<div class="win-body"></div>';

    document.body.appendChild(win);

    $('.wb.close', win).onclick = e => { e.stopPropagation(); this.close(id); };
    $('.wb.min',  win).onclick = e => { e.stopPropagation(); this.minimize(id); };
    $('.wb.max',  win).onclick = e => { e.stopPropagation(); this.maximize(id); };

    win.addEventListener('pointerdown', ()=>this.focus(id), true);

    const head = $('.win-head', win);
    head.addEventListener('pointerdown', e=>this.dragStart(e,id));

    const body = $('.win-body', win);
    try{
      const html = (typeof app.render==='function') ? app.render(win, body) : (app.render||'');
      if(html!=null) body.innerHTML = html;
      if(typeof app.init==='function') app.init(win, body);
    }catch(err){
      body.innerHTML = '<div class="empty">Fehler beim Laden: '+esc(err.message)+'</div>';
      console.error('[HalDo App]', appId, err);
    }

    this.wins.set(id, {el:win, appId});
    this.focus(id);
    return win;
  },

  close(id){
    const w = this.wins.get(id); if(!w) return;
    w.el.style.animation = 'winIn .14s reverse';
    setTimeout(()=>{ w.el.remove(); }, 130);
    this.wins.delete(id);
    if(this.focused===id) this.focused = null;
  },

  focus(id){
    const w = this.wins.get(id); if(!w) return;
    w.el.style.zIndex = ++this.zTop;
    this.focused = id;
  },

  minimize(id){
    const w = this.wins.get(id); if(!w) return;
    w.el.style.display='none';
    toast('Fenster minimiert – über App-Symbol erneut öffnen');
  },

  maximize(id){
    const w = this.wins.get(id); if(!w) return;
    w.el.classList.toggle('maxed');
  },

  dragStart(e, id){
    const w = this.wins.get(id); if(!w) return;
    const win = w.el;
    if(win.classList.contains('maxed')) return;
    const r = win.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const startL = r.left, startT = r.top;
    win.classList.add('dragging');

    const onMove = ev => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      let nl = startL + dx;
      let nt = startT + dy;
      nl = Math.min(innerWidth-60, Math.max(-r.width+60, nl));
      nt = Math.min(innerHeight-60, Math.max(56, nt));
      win.style.left = nl+'px';
      win.style.top  = nt+'px';
      ev.preventDefault();
    };
    const onUp = () => {
      win.classList.remove('dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    };
    document.addEventListener('pointermove', onMove, {passive:false});
    document.addEventListener('pointerup', onUp);
  }
};
window.HalDo = window.HalDo || {};
window.HalDo.WM = WM;

/* =========================================================================
   APP-IMPLEMENTIERUNGEN
   ========================================================================= */
const APPS = {};

/* ---- Rechner ---- */
APPS['rechner'] = {
  name:'Rechner', icon:'🧮',
  render:()=>'<div class="calc">'+
    '<div class="calc-disp"><div class="prev" id="cvPrev"></div><div class="cur" id="cvCur">0</div></div>'+
    '<div class="calc-keys">'+
      '<button class="ck" data-k="C">C</button>'+
      '<button class="ck" data-k="±">±</button>'+
      '<button class="ck" data-k="%">%</button>'+
      '<button class="ck op" data-k="/">÷</button>'+
      '<button class="ck" data-k="7">7</button>'+
      '<button class="ck" data-k="8">8</button>'+
      '<button class="ck" data-k="9">9</button>'+
      '<button class="ck op" data-k="*">×</button>'+
      '<button class="ck" data-k="4">4</button>'+
      '<button class="ck" data-k="5">5</button>'+
      '<button class="ck" data-k="6">6</button>'+
      '<button class="ck op" data-k="-">−</button>'+
      '<button class="ck" data-k="1">1</button>'+
      '<button class="ck" data-k="2">2</button>'+
      '<button class="ck" data-k="3">3</button>'+
      '<button class="ck op" data-k="+">+</button>'+
      '<button class="ck wide" data-k="0">0</button>'+
      '<button class="ck" data-k=".">.</button>'+
      '<button class="ck eq" data-k="=">=</button>'+
    '</div></div>',
  init:(win)=>{
    const cur=$('#cvCur',win), prev=$('#cvPrev',win);
    let a=null, op=null, b='', fresh=false;
    const set=v=>{ cur.textContent=v; };
    const eval_=(x,y,o)=>({'+':x+y,'-':x-y,'*':x*y,'/':y===0?NaN:x/y,'%':x%y}[o]);
    win.querySelectorAll('.ck').forEach(btn=>{
      btn.onclick=()=>{
        const k=btn.dataset.k;
        if(k>='0'&&k<='9'){ if(fresh){b='';fresh=false;} b+=k; set(b); return; }
        if(k==='.'){ if(fresh){b='0';fresh=false;} if(!b.includes('.')) b+= '.'; set(b||'0.'); return; }
        if(k==='C'){ a=null; op=null; b=''; fresh=false; prev.textContent=''; set('0'); return; }
        if(k==='±'){ b = b.startsWith('-') ? b.slice(1) : '-'+b; set(b||'-0'); return; }
        if('+-*/'.includes(k)){
          if(a===null && op===null){ a = parseFloat(b||'0'); }
          else if(op && b!==''){ a = eval_(a, parseFloat(b), op); }
          op = k; prev.textContent = fmt(a)+' '+({'+':'+','-':'−','*':'×','/':'÷'}[k]||k);
          fresh = true;
          return;
        }
        if(k==='%'){ b = String((parseFloat(b||'0'))/100); set(b); return; }
        if(k==='='){
          if(op && b!==''){ const r = eval_(a, parseFloat(b), op); prev.textContent = fmt(a)+' '+op+' '+fmt(parseFloat(b))+' ='; set(isFinite(r)?fmt(r):'Fehler'); a=null; op=null; b=''; fresh=true; }
        }
      };
    });
  }
};

/* ---- Notizen ---- */
APPS['notizen'] = {
  name:'Notizen', icon:'📝',
  render:()=>'<div class="col">'+
    '<div class="row"><input class="inp" id="ntTitle" placeholder="Titel…"><button class="btn primary" id="ntAdd">Speichern</button></div>'+
    '<textarea class="ta" id="ntBody" placeholder="Inhalt…"></textarea>'+
    '<div id="ntList" class="list"></div></div>',
  init:(win)=>{
    const T=$('#ntTitle',win), B=$('#ntBody',win), L=$('#ntList',win);
    const render=()=>{
      const all=store.get('notes',[]);
      L.innerHTML = all.length ? all.map(n=>'<div class="item"><b>'+esc(n.t)+'</b><span class="dim">'+(n.b?esc(n.b.slice(0,50)):'')+'</span><span class="x" data-id="'+n.id+'">✕</span></div>').join('') : '<div class="empty">Noch keine Notizen</div>';
      L.querySelectorAll('.x').forEach(x=>x.onclick=()=>{
        const id=x.dataset.id;
        store.set('notes', store.get('notes',[]).filter(n=>n.id!==id));
        render();
      });
    };
    $('#ntAdd',win).onclick=()=>{
      const t=T.value.trim(), b=B.value.trim();
      if(!t){ toast('Titel fehlt'); return; }
      const all=store.get('notes',[]); all.unshift({id:uid(), t, b, ts:Date.now()});
      store.set('notes',all); T.value=''; B.value=''; render(); toast('Gespeichert');
    };
    render();
  }
};

/* ---- Aufgaben ---- */
APPS['aufgaben'] = {
  name:'Aufgaben', icon:'✅',
  render:()=>'<div class="col">'+
    '<div class="row"><input class="inp" id="tkT" placeholder="Neue Aufgabe…"><button class="btn primary" id="tkA">+</button></div>'+
    '<div id="tkL" class="list"></div></div>',
  init:(win)=>{
    const T=$('#tkT',win), L=$('#tkL',win);
    const render=()=>{
      const all=store.get('tasks',[]);
      L.innerHTML = all.length ? all.map(t=>'<div class="item"><input type="checkbox" data-id="'+t.id+'" '+(t.done?'checked':'')+'><span style="'+(t.done?'text-decoration:line-through;opacity:.5':'')+'">'+esc(t.t)+'</span><span class="x" data-id="'+t.id+'">✕</span></div>').join('') : '<div class="empty">Keine Aufgaben</div>';
      L.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{
        const all=store.get('tasks',[]); const t=all.find(x=>x.id===c.dataset.id); if(t) t.done=c.checked;
        store.set('tasks',all); render();
      });
      L.querySelectorAll('.x').forEach(x=>x.onclick=()=>{
        store.set('tasks', store.get('tasks',[]).filter(t=>t.id!==x.dataset.id)); render();
      });
    };
    $('#tkA',win).onclick=()=>{
      const t=T.value.trim(); if(!t) return;
      const all=store.get('tasks',[]); all.unshift({id:uid(), t, done:false, ts:Date.now()});
      store.set('tasks',all); T.value=''; render();
    };
    T.addEventListener('keydown',e=>{ if(e.key==='Enter') $('#tkA',win).click(); });
    render();
  }
};

/* ---- Kalender ---- */
APPS['kalender'] = {
  name:'Kalender', icon:'📅',
  render:()=>'<div class="col">'+
    '<div class="row between"><button class="btn sm" id="calPrev">◀</button><b id="calTitle"></b><button class="btn sm" id="calNext">▶</button></div>'+
    '<div class="cal" id="calGrid"></div></div>',
  init:(win)=>{
    let cur = new Date();
    const render=()=>{
      $('#calTitle',win).textContent = cur.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
      const y=cur.getFullYear(), m=cur.getMonth();
      const first = new Date(y,m,1).getDay();
      const days = new Date(y,m+1,0).getDate();
      const offset = (first+6)%7;
      let html='';
      ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>html+='<div class="cal-h">'+d+'</div>');
      for(let i=0;i<offset;i++) html+='<div class="cal-d empty"></div>';
      const today = new Date();
      for(let d=1;d<=days;d++){
        const isT = d===today.getDate() && m===today.getMonth() && y===today.getFullYear();
        html += '<div class="cal-d'+(isT?' today':'')+'">'+d+'</div>';
      }
      $('#calGrid',win).innerHTML = html;
    };
    $('#calPrev',win).onclick=()=>{ cur=new Date(cur.getFullYear(),cur.getMonth()-1,1); render(); };
    $('#calNext',win).onclick=()=>{ cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); render(); };
    render();
  }
};

/* ---- Weltuhr ---- */
APPS['uhr'] = {
  name:'Weltuhr', icon:'🕐',
  render:()=>'<div class="col" id="wcWrap"></div>',
  init:(win)=>{
    const zones = ['Europe/Berlin','Europe/London','America/New_York','Asia/Tokyo','Asia/Dubai','Australia/Sydney'];
    const wrap=$('#wcWrap',win);
    const render=()=>{
      wrap.innerHTML = zones.map(z=>{
        const t = new Date().toLocaleTimeString('de-DE',{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const d = new Date().toLocaleDateString('de-DE',{timeZone:z,weekday:'short'});
        return '<div class="item"><b>'+z.split('/')[1].replace(/_/g,' ')+'</b><span class="dim">'+d+'</span><span style="margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600">'+t+'</span></div>';
      }).join('');
    };
    render(); win._tick = setInterval(render,1000);
  }
};

/* ---- Timer ---- */
APPS['timer'] = {
  name:'Timer', icon:'⏱️',
  render:()=>'<div class="col center">'+
    '<div class="big" id="tmD">00:00</div>'+
    '<div class="row" style="justify-content:center"><input class="inp" id="tmI" type="number" min="1" max="600" value="5" style="width:90px"><span>Min</span></div>'+
    '<div class="row" style="justify-content:center">'+
      '<button class="btn primary" id="tmStart">Start</button>'+
      '<button class="btn" id="tmPause">Pause</button>'+
      '<button class="btn danger" id="tmReset">Reset</button>'+
    '</div></div>',
  init:(win)=>{
    let rem=300, id=null, running=false;
    const D=$('#tmD',win);
    const draw=()=>{ D.textContent = pad(Math.floor(rem/60))+':'+pad(rem%60); };
    const tick=()=>{ if(rem<=0){ clearInterval(id); id=null; running=false; toast('⏰ Timer abgelaufen!'); return; } rem--; draw(); };
    $('#tmStart',win).onclick=()=>{ if(running) return; const v=parseInt($('#tmI',win).value)||5; if(!id){ rem=Math.max(1,v*60); draw(); } running=true; id=setInterval(tick,1000); };
    $('#tmPause',win).onclick=()=>{ running=false; clearInterval(id); id=null; };
    $('#tmReset',win).onclick=()=>{ running=false; clearInterval(id); id=null; rem=(parseInt($('#tmI',win).value)||5)*60; draw(); };
    draw();
  }
};

/* ---- Stoppuhr ---- */
APPS['stoppuhr'] = {
  name:'Stoppuhr', icon:'⏲️',
  render:()=>'<div class="col center">'+
    '<div class="big" id="swD">00:00.00</div>'+
    '<div class="row" style="justify-content:center">'+
      '<button class="btn primary" id="swStart">Start</button>'+
      '<button class="btn" id="swStop">Stop</button>'+
      '<button class="btn danger" id="swReset">Reset</button>'+
    '</div>'+
    '<div class="list" id="swLaps"></div></div>',
  init:(win)=>{
    let t0=0, elapsed=0, id=null;
    const D=$('#swD',win), L=$('#swLaps',win);
    const draw=()=>{
      const ms = elapsed + (id ? Date.now()-t0 : 0);
      const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60, c=Math.floor(ms/10)%100;
      D.textContent = pad(m)+':'+pad(s)+'.'+pad(c);
    };
    $('#swStart',win).onclick=()=>{ if(id) return; t0=Date.now(); id=setInterval(draw,42); };
    $('#swStop',win).onclick=()=>{
      if(!id) return;
      elapsed += Date.now()-t0;
      clearInterval(id); id=null;
      const laps = store.get('sw_laps',[]);
      const ms = elapsed;
      const m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60, c=Math.floor(ms/10)%100;
      laps.unshift(pad(m)+':'+pad(s)+'.'+pad(c));
      store.set('sw_laps',laps.slice(0,20));
      L.innerHTML = laps.slice(0,20).map(x=>'<div class="item">'+x+'</div>').join('');
    };
    $('#swReset',win).onclick=()=>{ elapsed=0; t0=Date.now(); if(id){ clearInterval(id); id=null; } D.textContent='00:00.00'; store.set('sw_laps',[]); L.innerHTML=''; };
    draw();
  }
};

/* ---- Pomodoro ---- */
APPS['pomodoro'] = {
  name:'Pomodoro', icon:'🍅',
  render:()=>'<div class="col center">'+
    '<div class="big2" id="pmMode">Fokus</div>'+
    '<div class="big" id="pmD">25:00</div>'+
    '<div class="row" style="justify-content:center">'+
      '<button class="btn primary" id="pmStart">Start</button>'+
      '<button class="btn" id="pmSkip">Skip</button>'+
      '<button class="btn danger" id="pmReset">Reset</button>'+
    '</div>'+
    '<div class="card" style="max-width:340px;margin:8px auto 0"><span class="dim">Fokus 25 min · Pause 5 min · nach 4 Runden lange Pause 15 min</span></div></div>',
  init:(win)=>{
    let focus=25*60, shortP=5*60, longP=15*60, cur=focus, isFocus=true, round=0, id=null;
    const D=$('#pmD',win), M=$('#pmMode',win);
    const draw=()=>{ D.textContent = pad(Math.floor(cur/60))+':'+pad(cur%60); M.textContent = isFocus?'Fokus':'Pause'; };
    const tick=()=>{ if(cur<=0){ nextPhase(); return; } cur--; draw(); };
    const nextPhase=()=>{
      clearInterval(id); id=null;
      if(isFocus){ round++; if(round%4===0) cur=longP; else cur=shortP; isFocus=false; }
      else{ cur=focus; isFocus=true; }
      draw();
    };
    $('#pmStart',win).onclick=()=>{ if(id) return; id=setInterval(tick,1000); };
    $('#pmSkip',win).onclick=()=>nextPhase();
    $('#pmReset',win).onclick=()=>{ clearInterval(id); id=null; cur=focus; isFocus=true; round=0; draw(); };

  }

  init:(win)=>{
    let g, score;
    const G=$('#g2G',win), S=$('#g2S',win);
    const colors={2:'#2a3350',4:'#314070',8:'#3d5195',16:'#4b64b8',32:'#5f7ad9',64:'#7b95f2',128:'#9db2ff',256:'#b9c8ff',512:'#d4ddff',1024:'#e8efff',2048:'#ffffff'};
    const addTile=()=>{ const e=[]; for(let i=0;i<16;i++) if(!g[i]) e.push(i); if(!e.length) return; g[e[Math.floor(Math.random()*e.length)]] = Math.random()<.9?2:4; };

      S.textContent = 'Punkte: '+score;

        const c = colors[v]||'#ff6f9c';
        return '<div class="t" style="background:'+(v?c:'rgba(255,255,255,.04)')+';color:'+(v>=128?'#0a0c18':'#e9edff')+'">'+(v||'')+'</div>';
      }).join('');
    };
    const slide=(row)=>{
      let a=row.filter(x=>x), out=[];
      for(let i=0;i<a.length;i++){
        if(a[i]===a[i+1]){ out.push(a[i]*2); score+=a[i]*2; i++; }
        else out.push(a[i]);
      }
      while(out.length<4) out.push(0);
      return out;
    };
    const move=(d)=>{
      const get=(i,j)=> g[i*4+j];
      const set=(i,j,v)=>{ g[i*4+j]=v; };
      let moved=false;
      if(d==='left'||d==='right'){
        for(let i=0;i<4;i++){
          let row=[get(i,0),get(i,1),get(i,2),get(i,3)];

          const nr=slide(row);

        for(let j=0;j<4;j++){

          if(d==='down') col.reverse();
          const nc=slide(col);
          if(d==='down') nc.reverse();
          for(let i=0;i<4;i++) if(get(i,j)!==nc[i]){ set(i,j,nc[i]); moved=true; }
        }
      }
      if(moved){ addTile(); draw(); }
    };
    const reset=()=>{ g=Array(16).fill(0); score=0; addTile(); addTile(); draw(); };
    win.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));

  }

APPS['tippen'] = {
  name:'Tipptest', icon:'⌨️',
  render:()=>'<div class="col">'+
    '<div class="typing-text" id="tpT"></div>'+
    '<input class="inp" id="tpI" placeholder="Hier tippen…" autocomplete="off" autocapitalize="off" spellcheck="false">'+
    '<div class="row between"><span class="dim">WPM</span><b id="tpW">0</b><span class="dim">Genauigkeit</span><b id="tpA">100%</b></div></div>',
  init:(win)=>{
    const TEXT='Der schnelle braune Fuchs springt über den faulen Hund und verschwindet im tiefen Wald.';
    const T=$('#tpT',win), I=$('#tpI',win), W=$('#tpW',win), A=$('#tpA',win);
    let t0=null;
    const draw=()=>{
      const v=I.value;
      T.innerHTML = [...TEXT].map((c,i)=>{
        if(i>=v.length) return esc(c);
        return '<span class="'+(v[i]===c?'ok':'bad')+'">'+esc(c)+'</span>';
      }).join('');
    };
    I.oninput=()=>{
      if(!t0) t0=Date.now();
      draw();
      const v=I.value;
      const ok = [...v].filter((c,i)=>c===TEXT[i]).length;
      A.textContent = v.length?Math.round(ok/v.length*100)+'%':'100%';
      const min = (Date.now()-t0)/60000;
      W.textContent = min>0?Math.round(v.split(/\s+/).filter(Boolean).length/min):0;
    };
    draw();
  }
};

      L.innerHTML = all.length ? all.map(m=>'<div class="item"><span>'+new Date(m.ts).toLocaleString('de-DE')+'</span><button class="btn sm" data-id="'+m.id+'" style="margin-left:auto">Abspielen</button><span class="x" data-id="'+m.id+'">✕</span></div>').join('') : '<div class="empty">Keine Aufnahmen</div>';

APPS['klavier'] = {
  name:'Piano', icon:'🎹',
  render:()=>'<div class="col center"><div class="piano" id="pnP"></div></div>',
  init:(win)=>{
    const N=['C','D','E','F','G','A','B','C2'];
    const F=[261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25];
    let ctx=null;
    const play=(f)=>{
      ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.18, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+1.2);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+1.3);
    };
    const P=$('#pnP',win);
    P.innerHTML = N.map((n,i)=>'<button class="pk" data-i="'+i+'">'+n+'</button>').join('');
    P.querySelectorAll('.pk').forEach(b=>{
      b.onclick=()=>{ play(F[parseInt(b.dataset.i)]); b.classList.add('on'); setTimeout(()=>b.classList.remove('on'),200); };
    });
  }
};

      const sum=nums.reduce((a,b)=>a+b,0), avg=sum/nums.length;
      const sorted=[...nums].sort((a,b)=>a-b);
      const median = sorted.length%2 ? sorted[(sorted.length-1)/2] : (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
      const min=Math.min(...nums), max=Math.max(...nums);
      const varr = nums.reduce((a,b)=>a+(b-avg)**2,0)/nums.length;
      const std = Math.sqrt(varr);
      const rows = [['Anzahl',nums.length],['Summe',fmt(sum)],['Mittelwert',fmt(avg)],['Median',fmt(median)],['Min',min],['Max',max],['Varianz',fmt(varr)],['Stdabw.',fmt(std)]];

    };
    const send=()=>{
      const t=I.value.trim(); if(!t) return;
      push('u',t); hist.push({who:'u',text:t}); I.value='';
      setTimeout(()=>{ const a=reply(t); push('a',a); hist.push({who:'a',text:a}); store.set('ai_hist',hist.slice(-40)); }, 300);
    };
    $('#aiS',win).onclick=send;
    I.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
  }
};

function buildSidebar(){
  sidebar.innerHTML='<h4>Navigation</h4>';
  SIDEBAR_ITEMS.forEach(it=>{
    if(it.sep){ const d=el('div'); d.style.cssText='height:8px'; sidebar.appendChild(d); return; }
    const b = el('button','catbtn');
    b.innerHTML = '<span class="ico">'+it.ico+'</span><span>'+it.lbl+'</span>';
    b.dataset.act = it.act;
    b.onclick = ()=>sidebarAction(it.act);
    sidebar.appendChild(b);
  });
  sidebar.appendChild(el('h4','','Alle Kategorien'));
  REGISTRY.forEach(r=>{
    const b = el('button','catbtn');
    b.innerHTML = '<span class="ico">'+r.ico+'</span><span>'+r.k+' · '+r.t+'</span><span class="n">'+r.apps.length+'</span>';
    b.dataset.cat = r.k;
    b.onclick = ()=>{ renderCategory(r.k); closeSidebarMobile(); };
    sidebar.appendChild(b);
  });
}

function sidebarAction(act){
  closeSidebarMobile();
  if(act==='home'){ renderHome(); return; }
  if(act==='apps'){ renderHome(); setTimeout(()=>desktop.scrollTo({top:400,behavior:'smooth'}),50); return; }
  if(act==='system'){ WM.open('rechner'); return; }
  if(act==='chat'){ WM.open('chat',{w:480,h:560}); return; }
  if(act==='files'){ WM.open('dateien'); return; }
  if(act==='setup'){ openInfo(); return; }
  if(act==='info'){ openInfo(); return; }
  if(act==='ai'){ WM.open('haldo-ai',{w:520,h:600}); return; }
  if(act==='cyborg'){ $('#themeBtn').click(); return; }
}

/* =========================================================================

   ========================================================================= */
const searchRes = $('#searchRes');
$('#search').addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ searchRes.classList.remove('on'); return; }
  const hits = [];
  REGISTRY.forEach(r=>{
    r.apps.forEach(name=>{
      if(name.toLowerCase().includes(q)) hits.push({name, cat:r.k, catT:r.t, ico:r.ico, id:findAppId(name)});
    });
  });
  if(!hits.length){ searchRes.classList.remove('on'); return; }
  searchRes.innerHTML = hits.slice(0,20).map(h=>
    '<div class="sr" data-id="'+(h.id||'')+'" data-n="'+esc(h.name)+'"><span class="ico">'+h.ico+'</span><span>'+esc(h.name)+'</span><span class="dim" style="margin-left:auto;font-size:11px">'+h.cat+'</span></div>'
  ).join('');
  searchRes.classList.add('on');
  searchRes.querySelectorAll('.sr').forEach(s=>s.onclick=()=>{
    const id = s.dataset.id;
    const n = s.dataset.n;
    if(id) WM.open(id);
    else toast('„'+n+'" kommt bald!');
    searchRes.classList.remove('on');
    $('#search').value='';
  });
});
document.addEventListener('click', e=>{
  if(!e.target.closest('#search') && !e.target.closest('#searchRes')) searchRes.classList.remove('on');
});
