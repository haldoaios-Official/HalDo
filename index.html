<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000208">
<title>HalDo AI OS Pro Max Professionelle</title>
<style>
:root{--bg0:#000208;--cyan:#00e5ff;--blue:#4da8ff;--purple:#b478ff;--pink:#ff78c8;--gold:#ffd166;--accent:#00e5ff;--accent2:#4da8ff;--glass:rgba(10,20,40,.55);--border:rgba(0,229,255,.4);--bordergold:rgba(255,209,102,.55);--text:#e8f4ff;--dim:rgba(232,244,255,.6);--shadow:0 20px 60px rgba(0,0,0,.6);--blur:24px;--fs:15px;--anim:1}
[data-theme="cyborg"]{--accent:#ff78c8;--accent2:#b478ff;--border:rgba(255,120,200,.45)}
[data-theme="gold"]{--accent:#ffd166;--accent2:#ffb347;--border:rgba(255,209,102,.5)}
[data-theme="matrix"]{--accent:#00ff88;--accent2:#00cc66;--border:rgba(0,255,136,.4)}
[data-theme="crimson"]{--accent:#ff4477;--accent2:#cc2255;--border:rgba(255,68,119,.4)}
[data-theme="sunset"]{--accent:#ff8844;--accent2:#ff4466;--border:rgba(255,136,68,.4)}
[data-theme="ice"]{--accent:#aaeeff;--accent2:#88ccff;--border:rgba(170,238,255,.4)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:var(--fs);color:var(--text);background:var(--bg0);user-select:none;-webkit-user-select:none}
#cosmosBg{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block}
.top-bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 12px;padding-top:env(safe-area-inset-top);background:linear-gradient(180deg,rgba(0,2,8,.85),rgba(0,2,8,.4));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:100;gap:10px}
.logo-btn{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 24px var(--accent);transition:transform .2s;border:1px solid rgba(255,255,255,.3);flex-shrink:0;font-size:22px;color:#000;font-weight:900}
.logo-btn:active{transform:scale(.92)}
.logo-btn img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.brand{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.brand-title{font-size:14px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:9px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}
.top-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:rgba(0,229,255,.08);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .2s}
.icon-btn:active{transform:scale(.92);background:rgba(0,229,255,.2)}
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:68px;padding:12px 8px;padding-bottom:calc(env(safe-area-inset-bottom) + 80px);display:flex;flex-direction:column;gap:8px;z-index:90;background:linear-gradient(180deg,rgba(0,2,8,.7),rgba(0,2,8,.4));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;transition:transform .3s}
.sidebar::-webkit-scrollbar{display:none}
.sidebar.hidden{transform:translateX(-100%)}
.nav-btn{width:52px;height:52px;min-height:52px;border-radius:14px;border:1px solid var(--border);background:rgba(0,229,255,.06);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:18px;gap:1px;transition:all .2s;flex-shrink:0}
.nav-btn span{font-size:8px;color:var(--dim);letter-spacing:.3px}
.nav-btn:active,.nav-btn.active{background:rgba(0,229,255,.2);border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,255,.4)}
.nav-btn.active span{color:var(--accent)}
.desktop{position:fixed;top:56px;left:68px;right:0;bottom:72px;z-index:50;overflow:hidden;pointer-events:none;transition:left .3s}
.desktop.full{left:0}
.win{position:absolute;top:40px;left:20px;width:640px;max-width:calc(100vw - 140px);height:520px;max-height:calc(100vh - 200px);background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border-radius:18px;border:1.5px solid var(--bordergold);box-shadow:var(--shadow),0 0 40px rgba(0,229,255,.15);display:flex;flex-direction:column;overflow:hidden;z-index:200;pointer-events:auto;animation:winIn calc(.3s*var(--anim)) cubic-bezier(.34,1.56,.64,1)}
.win.focused{z-index:250;border-color:var(--accent)}
@keyframes winIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.win-header{height:48px;min-height:48px;display:flex;align-items:center;padding:0 8px 0 16px;background:linear-gradient(180deg,rgba(0,229,255,.12),transparent);border-bottom:1px solid var(--border);cursor:move;gap:8px}
.win-title{flex:1;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-btn{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:999999}
.win-btn:hover{background:rgba(255,255,255,.1)}
.win-btn.close:hover{background:rgba(255,80,80,.3)}
.win-body{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.6}
.win-body::-webkit-scrollbar{width:6px}
.win-body::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;text-align:center;padding:24px}
.splash-icon{font-size:64px;filter:drop-shadow(0 0 24px var(--accent))}
.splash h2{font-size:22px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.splash p{color:var(--dim);font-size:13px;max-width:400px}
.splash .presenter{margin-top:8px;font-size:11px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;font-weight:700}
.splash .logo-inline{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 20px var(--accent))}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;height:72px;padding:8px 16px;padding-bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(0deg,rgba(0,2,8,.9),rgba(0,2,8,.4));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:100}
.bbtn{flex:1;max-width:180px;height:52px;border-radius:14px;border:1.5px solid var(--border);background:rgba(0,229,255,.1);color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 0 16px rgba(0,229,255,.15)}
.bbtn:active{transform:scale(.95)}
.bbtn .icon{font-size:20px}
.bbtn.cyborg{background:linear-gradient(135deg,rgba(255,120,200,.25),rgba(180,120,255,.25));border-color:rgba(255,120,200,.6)}
.toast-wrap{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:12px 20px;border-radius:12px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--accent);color:var(--text);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 20px rgba(0,229,255,.3);animation:toastIn .3s ease;max-width:320px}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.set-section{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(0,229,255,.04)}
.set-header{padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:13px;transition:background .15s}
.set-header:hover{background:rgba(0,229,255,.08)}
.set-header .letter{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:13px;flex-shrink:0}
.set-header .arrow{margin-left:auto;transition:transform .2s;color:var(--dim)}
.set-section.open .arrow{transform:rotate(90deg)}
.set-body{display:none;padding:4px 16px 12px}
.set-section.open .set-body{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);gap:12px}
.set-row:last-child{border-bottom:none}
.set-row .label{font-size:13px;color:var(--text);flex:1}
.toggle{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle.on{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.toggle.on::after{transform:translateX(18px)}
.chip-group{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(0,229,255,.05);color:var(--text);font-size:11px;cursor:pointer;transition:all .15s;min-height:32px;display:flex;align-items:center}
.chip:active{transform:scale(.95)}
.chip.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:12px}
.app-tile{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--border);background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(77,168,255,.06));display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;padding:8px;text-align:center;gap:4px}
.app-tile:active{transform:scale(.94);background:rgba(0,229,255,.25)}
.app-tile .app-icon{font-size:26px}
.app-tile .app-name{font-size:9px;color:var(--text);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(0,229,255,.05);color:var(--text);font-size:11px;cursor:pointer;flex-shrink:0;font-weight:700}
.cat-tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
#loader{position:fixed;inset:0;z-index:9999;background:#000208;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
.loader-ring{width:80px;height:80px;border-radius:50%;border:3px solid rgba(0,229,255,.2);border-top-color:var(--cyan);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:var(--cyan);font-size:14px;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 20px var(--cyan)}
.loader-sub{color:rgba(255,255,255,.4);font-size:11px;letter-spacing:2px}
.chat-wrap{display:flex;flex-direction:column;height:100%;gap:10px}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:8px 0}
.chat-msg{padding:10px 14px;border-radius:14px;max-width:80%;font-size:13px;line-height:1.5;animation:msgIn .3s}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:600}
.chat-msg.ai{align-self:flex-start;background:rgba(0,229,255,.12);border:1px solid var(--border)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;height:44px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.4);color:var(--text);padding:0 14px;font-size:14px;font-family:inherit}
.chat-input input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.4)}
.chat-input button{width:44px;height:44px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-size:18px;cursor:pointer;font-weight:900}
@media(max-width:640px){
.win{top:10px !important;left:8px !important;width:calc(100vw - 16px) !important;height:calc(100vh - 160px) !important;max-width:none;max-height:none}
.bbtn .label{display:none}.bbtn{max-width:none}
.sidebar{width:60px}.nav-btn{width:46px;height:46px;font-size:16px}
.desktop{left:60px}.desktop.full{left:0}
}
</style>
</head>
<body>

<canvas id="cosmosBg"></canvas>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">HalDo AI OS</div>
  <div class="loader-sub">Pro Max · Professionelle</div>
</div>

<div class="top-bar">
  <div class="logo-btn" onclick="HalDo.UI.toggleSidebar()">
    <img src="logo.png" alt="H" onerror="this.style.display='none'; this.parentElement.textContent='🦚';">
  </div>
  <div class="brand">
    <div class="brand-title">HalDo AI OS</div>
    <div class="brand-sub">Pro Max · v125</div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" onclick="HalDo.UI.open('settings')" title="Einstellungen">⚙️</button>
    <button class="icon-btn" onclick="HalDo.UI.open('notifications')" title="Mitteilungen">🔔</button>
  </div>
</div>

<nav class="sidebar" id="sidebar">
  <button class="nav-btn active" data-nav="home" onclick="HalDo.UI.nav('home')"><span>🏠</span><span>Home</span></button>
  <button class="nav-btn" data-nav="apps" onclick="HalDo.UI.nav('apps')"><span>📱</span><span>Apps</span></button>
  <button class="nav-btn" data-nav="system" onclick="HalDo.UI.nav('system')"><span>⚙️</span><span>System</span></button>
  <button class="nav-btn" data-nav="chat" onclick="HalDo.UI.nav('chat')"><span>💬</span><span>Chat</span></button>
  <button class="nav-btn" data-nav="files" onclick="HalDo.UI.nav('files')"><span>📁</span><span>Files</span></button>
  <button class="nav-btn" data-nav="setup" onclick="HalDo.UI.nav('setup')"><span>🔧</span><span>Setup</span></button>
  <button class="nav-btn" data-nav="info" onclick="HalDo.UI.nav('info')"><span>ℹ️</span><span>Info</span></button>
</nav>

<div class="desktop" id="desktop"></div>

<div class="bottom-bar">
  <button class="bbtn" onclick="HalDo.UI.open('chat')"><span class="icon">💬</span><span class="label">Chat</span></button>
  <button class="bbtn" onclick="HalDo.UI.open('avatar')"><span class="icon">🤖</span><span class="label">AI</span></button>
  <button class="bbtn cyborg" onclick="HalDo.UI.toggleCyborg()"><span class="icon">⚡</span><span class="label">CYBORG</span></button>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
const HalDo = {};

/* ============ SOUNDS ============ */
HalDo.Sound = (() => {
  let ctx;
  const getCtx = () => { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; };
  const play = (freq, dur, type='sine', vol=.15) => {
    try { const c = getCtx(); const o = c.createOscillator(); const g = c.createGain();
      o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur);
    } catch(e) {}
  };
  return {
    click: () => play(880,.05,'square',.08),
    open: () => { play(660,.08); setTimeout(()=>play(880,.08),60); setTimeout(()=>play(1100,.1),120); },
    close: () => { play(800,.06); setTimeout(()=>play(500,.08),50); },
    success: () => { play(523,.1); setTimeout(()=>play(659,.1),80); setTimeout(()=>play(784,.15),160); },
    error: () => play(200,.2,'sawtooth'),
    notify: () => { play(1200,.05); setTimeout(()=>play(1400,.08),50); },
    welcome: () => { play(523,.08); setTimeout(()=>play(659,.08),80); setTimeout(()=>play(784,.08),160); setTimeout(()=>play(1047,.15),240); }
  };
})();

/* ============ TOAST ============ */
HalDo.Toast = (() => {
  const show = (msg, ms=2500) => {
    const wrap = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, ms);
  };
  return { show };
})();

/* ============ I18N ============ */
HalDo.I18n = {
  lang: 'de',
  langs: ['de','en','ku','ez','ar','fa','he','ru','fr','es','it','zh','ja','uz','tr'],
  t: {
    de: { welcome: 'Willkommen bei', presented: 'Präsentiert von Halil Donma', pro: 'Pro Max Professionelle', apps: 'Apps', settings: 'Einstellungen', search: 'Suchen...' },
    en: { welcome: 'Welcome to', presented: 'Presented by Halil Donma', pro: 'Pro Max Professional', apps: 'Apps', settings: 'Settings', search: 'Search...' }
  },
  get(k) { return (this.t[this.lang] || this.t.de)[k] || this.t.de[k]; }
};

/* ============ SETTINGS (A-Z, 26 categories) ============ */
const SETTINGS = [
  { key:'A', title:'Account & Profil', icon:'👤', items:[
    {id:'haldo-account',label:'HalDo-Konto',type:'toggle',def:true},
    {id:'cloud-sync',label:'Cloud-Sync',type:'toggle',def:true},
    {id:'sub',label:'Abo-Status',type:'text',val:'Pro Max'},
    {id:'family',label:'Familienfreigabe',type:'toggle',def:false},
    {id:'devices',label:'Meine Geräte',type:'text',val:'3 verknüpft'}
  ]},
  { key:'B', title:'Benachrichtigungen', icon:'🔔', items:[
    {id:'toasts',label:'Toast-Benachrichtigungen',type:'toggle',def:true},
    {id:'welcome',label:'Welcome-Banner',type:'toggle',def:true},
    {id:'dnd',label:'Nicht-Stören-Modus',type:'toggle',def:false},
    {id:'focus',label:'Fokus-Modus',type:'chips',opts:['Kein','Arbeit','Schlaf','Gaming'],def:'Kein'},
    {id:'badges',label:'App-Badges',type:'toggle',def:true}
  ]},
  { key:'C', title:'CYBORG & KI-Design', icon:'⚡', items:[
    {id:'cyborg',label:'CYBORG-Modus',type:'toggle',def:false},
    {id:'avatar-anim',label:'Avatar-Animationen',type:'toggle',def:true},
    {id:'holo-rings',label:'Holografische Ringe',type:'toggle',def:true},
    {id:'auto-speak',label:'Auto-Speak',type:'toggle',def:false},
    {id:'ki-model',label:'KI-Modell',type:'chips',opts:['Standard','Pro','Lokal'],def:'Standard'}
  ]},
  { key:'D', title:'Display & Anzeige', icon:'🖥️', items:[
    {id:'font-size',label:'Schriftgröße',type:'chips',opts:['S','M','L','XL'],def:'M'},
    {id:'blur',label:'Blur-Stärke',type:'chips',opts:['Wenig','Mittel','Viel','Max'],def:'Mittel'},
    {id:'glow',label:'Glow-Stärke',type:'chips',opts:['Sanft','Normal','Stark'],def:'Normal'},
    {id:'dark',label:'Dunkelmodus',type:'toggle',def:true},
    {id:'safe',label:'Safe-Area',type:'toggle',def:true}
  ]},
  { key:'E', title:'Energie & Akku', icon:'🔋', items:[
    {id:'power-save',label:'Energiesparmodus',type:'toggle',def:false},
    {id:'bg',label:'Hintergrundaktivität',type:'toggle',def:true},
    {id:'battery',label:'Akku-Status',type:'text',val:'Gut (94%)'}
  ]},
  { key:'F', title:'Farbsystem & Themes', icon:'🎨', items:[
    {id:'theme',label:'Theme',type:'chips',opts:['Holo','Cyborg','Gold','Matrix','Crimson','Sunset','Ice'],def:'Holo'},
    {id:'transparency',label:'Transparenz',type:'toggle',def:true},
    {id:'gold-borders',label:'Goldene Ränder',type:'toggle',def:true}
  ]},
  { key:'G', title:'Geräte & Hardware', icon:'📷', items:[
    {id:'camera',label:'Kamera',type:'toggle',def:true},
    {id:'mic',label:'Mikrofon',type:'toggle',def:true},
    {id:'bt',label:'Bluetooth',type:'toggle',def:false},
    {id:'nfc',label:'NFC',type:'toggle',def:false},
    {id:'sensors',label:'Sensoren',type:'toggle',def:true}
  ]},
  { key:'H', title:'Hintergrund & Kosmos', icon:'🌌', items:[
    {id:'sun',label:'Sonne',type:'toggle',def:true},
    {id:'planets',label:'Planeten',type:'toggle',def:true},
    {id:'moon',label:'Mond',type:'toggle',def:true},
    {id:'stars',label:'Sterne',type:'toggle',def:true},
    {id:'nebel',label:'Nebel',type:'toggle',def:true},
    {id:'shooting',label:'Sternschnuppen',type:'toggle',def:true}
  ]},
  { key:'I', title:'Info & Über', icon:'ℹ️', items:[

/* ============ SETTINGS STORE ============ */
HalDo.Store = (() => {
  const KEY = 'haldo_settings_v1';
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
  const get = (id, def) => data[id] !== undefined ? data[id] : def;
  const set = (id, v) => { data[id] = v; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} };
  const all = () => data;
  return { get, set, all };
})();

/* ============ WINDOW MANAGER ============ */
HalDo.Win = (() => {
  const windows = {};
  let zTop = 200;

  const create = (id, title, content, opts = {}) => {
    const desktop = document.getElementById('desktop');
    const win = document.createElement('div');
    win.className = 'win focused';
    win.dataset.id = id;
    win.style.zIndex = ++zTop;
    const w = opts.width || 640, h = opts.height || 520;
    win.style.width = w + 'px';
    win.style.height = h + 'px';
    win.style.top = (opts.top || 40) + 'px';
    win.style.left = (opts.left || 20) + 'px';
    win.innerHTML = `
      <div class="win-header">
        <div class="win-title">${title}</div>
        <button class="win-btn minimize" title="Minimize">—</button>
        <button class="win-btn close" title="Close">✕</button>
      </div>
      <div class="win-body">${content}</div>
    `;
    desktop.appendChild(win);
    windows[id] = win;
    win.addEventListener('mousedown', () => {
      Object.values(windows).forEach(w => w.classList.remove('focused'));
      win.classList.add('focused');
      win.style.zIndex = ++zTop;
    });
    win.querySelector('.close').addEventListener('click', (e) => { e.stopPropagation(); destroy(id); });
    win.querySelector('.minimize').addEventListener('click', (e) => { e.stopPropagation(); win.style.display = 'none'; });
    const header = win.querySelector('.win-header');
    header.addEventListener('mousedown', (e) => {
      if (e.target.closest('.win-btn')) return;
      const sx = e.clientX, sy = e.clientY;
      const rect = win.getBoundingClientRect();
      const ox = rect.left, oy = rect.top;
      const onMove = (me) => {
        win.style.left = Math.max(0, ox + me.clientX - sx) + 'px';
        win.style.top = Math.max(56, oy + me.clientY - sy) + 'px';
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    return win;
  };

  const destroy = (id) => {
    if (windows[id]) { windows[id].remove(); delete windows[id]; HalDo.Sound.close(); }
  };

  const focus = (id) => {
    const w = windows[id];
    if (w) { w.style.display = 'flex'; w.classList.add('focused'); w.style.zIndex = ++zTop; }
  };

  return { create, destroy, focus, windows };
})();

/* ============ UI ============ */
HalDo.UI = (() => {
  const nav = (section) => {
    HalDo.Sound.click();
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === section));
    switch(section) {
      case 'home': open('home'); break;
      case 'apps': open('apps'); break;
      case 'system': open('settings'); break;
      case 'chat': open('chat'); break;
      case 'files': open('files'); break;
      case 'setup': open('setup'); break;
      case 'info': open('info'); break;
    }
  };

  const toggleSidebar = () => {
    const sb = document.getElementById('sidebar');
    const dk = document.getElementById('desktop');
    sb.classList.toggle('hidden');
    dk.classList.toggle('full');
    HalDo.Sound.click();
  };

  const toggleCyborg = () => {
    const cur = HalDo.Store.get('cyborg', false);
    HalDo.Store.set('cyborg', !cur);
    document.documentElement.setAttribute('data-theme', !cur ? 'cyborg' : 'holo');
    HalDo.Toast.show(!cur ? '⚡ CYBORG-Modus AKTIV' : '🤖 Standard-Modus');
    HalDo.Sound.success();
  };

  const open = (appId) => {
    HalDo.Sound.open();
    if (appId === 'settings') return renderSettings();
    if (appId === 'chat') return renderChat();
    if (appId === 'avatar') return renderAvatar();
    if (appId === 'home') return renderHome();
    if (appId === 'apps') return renderApps();
    if (appId === 'files') return renderFileManager();
    if (appId === 'info') return renderInfo();
    if (appId === 'setup') return renderSetup();
    if (appId === 'notifications') return renderNotifications();
    // Generic app
    const app = APPS.find(a => a.id === appId) || { name: appId, shortName: appId, icon: '📱' };
    return renderGenericApp(app);
  };

  /* --- SETTINGS --- */
  const renderSettings = () => {
    if (HalDo.Win.windows['settings']) return HalDo.Win.focus('settings');
    const html = SETTINGS.map(sec => `
      <div class="set-section" data-key="${sec.key}">
        <div class="set-header">
          <div class="letter">${sec.key}</div>
          <span>${sec.icon} ${sec.title}</span>
          <span class="arrow">▸</span>
        </div>
        <div class="set-body">
          ${sec.items.map(item => renderSettingItem(item)).join('')}
        </div>
      </div>
    `).join('');
    const win = HalDo.Win.create('settings', '⚙️ Einstellungen A–Z', html, {width:680, height:600});
    win.querySelectorAll('.set-header').forEach(h => {
      h.addEventListener('click', () => {
        h.parentElement.classList.toggle('open');
        HalDo.Sound.click();
      });
    });
    win.querySelectorAll('.toggle').forEach(t => {
      t.addEventListener('click', () => {
        t.classList.toggle('on');
        HalDo.Store.set(t.dataset.id, t.classList.contains('on'));
        HalDo.Sound.click();
        applySetting(t.dataset.id, t.classList.contains('on'));
      });
    });
    win.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => {
        c.parentElement.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        HalDo.Store.set(c.dataset.setid, c.textContent.trim());
        HalDo.Sound.click();
        applySetting(c.dataset.setid, c.textContent.trim());
      });
    });
  };

  const renderSettingItem = (item) => {
    const stored = HalDo.Store.get(item.id, item.def);
    if (item.type === 'toggle') {
      return `<div class="set-row"><span class="label">${item.label}</span><div class="toggle ${stored?'on':''}" data-id="${item.id}"></div></div>`;
    }
    if (item.type === 'chips') {
      return `<div class="set-row" style="flex-direction:column;align-items:flex-start;gap:8px"><span class="label">${item.label}</span><div class="chip-group">${item.opts.map(o => `<div class="chip ${stored===o?'active':''}" data-setid="${item.id}">${o}</div>`).join('')}</div></div>`;
    }
    if (item.type === 'text') {
      return `<div class="set-row"><span class="label">${item.label}</span><span style="font-size:12px;color:var(--dim)">${item.val}</span></div>`;
    }
    return '';
  };

  const applySetting = (id, val) => {
    if (id === 'theme') {
      const map = {Holo:'holo',Cyborg:'cyborg',Gold:'gold',Matrix:'matrix',Crimson:'crimson',Sunset:'sunset',Ice:'ice'};
      document.documentElement.setAttribute('data-theme', map[val] || 'holo');
    }
    if (id === 'font-size') {
      const map = {S:'13px',M:'15px',L:'17px',XL:'19px'};
      document.documentElement.style.setProperty('--fs', map[val] || '15px');
    }
    if (id === 'anim-speed') {
      const map = {'0.5x':0.5,'1x':1,'2x':2};
      document.documentElement.style.setProperty('--anim', map[val] || 1);
    }
    if (id === 'blur') {
      const map = {Wenig:'10px',Mittel:'24px',Viel:'36px',Max:'48px'};
      document.documentElement.style.setProperty('--blur', map[val] || '24px');

  /* --- HOME --- */
  const renderHome = () => {
    if (HalDo.Win.windows['home']) return HalDo.Win.focus('home');

        </div>
      </div>
    `;
    HalDo.Win.create('home', '🏠 Home', html, {width:520, height:420});
  };

  /* --- APPS --- */
  const renderApps = () => {
    if (HalDo.Win.windows['apps']) return HalDo.Win.focus('apps');

    const input = document.getElementById('chatInput');

    if (!input || !log) return;
    const val = input.value.trim();
    if (!val) return;
    const userMsg = document.createElement('div');
    userMsg.className = 'chat-msg user';
    userMsg.textContent = val;
    log.appendChild(userMsg);
    input.value = '';
    log.scrollTop = log.scrollHeight;
    HalDo.Sound.click();
    setTimeout(() => {
      const aiMsg = document.createElement('div');
      aiMsg.className = 'chat-msg ai';
      aiMsg.textContent = getAIResponse(val);
      log.appendChild(aiMsg);
      log.scrollTop = log.scrollHeight;
      HalDo.Sound.notify();

  };

  const getAIResponse = (text) => {
    const t = text.toLowerCase();
    if (t.match(/hallo|hi|hey|servus|merhaba|slav/)) return 'Hallo Bruder! 💙 Schön dich zu sehen. Wie kann ich dir helfen?';
    if (t.match(/wie geht|how are/)) return 'Mir geht es bestens! Ich bin bereit, dir zu helfen. Und dir?';
    if (t.match(/wer bist|who are/)) return 'Ich bin HalDo AI — dein persönlicher KI-Assistent. Entwickelt von Halil Donma. 🤖';
    if (t.match(/ezidi|êzîdî/)) return 'Die êzîdî Religion ist eine der ältesten Glaubensrichtungen. Möchtest du mehr über die êzîdî Kultur, Sprache oder Geschichte erfahren? 🦚';
    if (t.match(/danke|thanks/)) return 'Gern geschehen, Bruder! 💙 Immer für dich da.';
    if (t.match(/zeit|time/)) return 'Es ist jetzt ' + new Date().toLocaleTimeString('de-DE');
    if (t.match(/datum|date/)) return 'Heute ist ' + new Date().toLocaleDateString('de-DE', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    return 'Verstanden! Ich arbeite noch an meiner vollen KI-Anbindung. Bald kann ich dir bei allem helfen. Bis dahin: Wie kann ich dich unterstützen? 💙';
  };

  /* --- AVATAR --- */
  const renderAvatar = () => {

      <div class="splash">
        <div style="width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(0,229,255,.4),rgba(0,80,160,.2));display:flex;align-items:center;justify-content:center;font-size:80px;border:3px solid var(--accent);box-shadow:0 0 40px var(--accent);animation:breathe 3s ease-in-out infinite">
          🤖

        <h2>HalDo AI Avatar</h2>

    HalDo.Win.create('avatar', '🤖 HalDo AI Avatar', html, {width:480, height:520});
    HalDo.Sound.welcome();
  };

  /* --- FILE MANAGER --- */
  const renderFileManager = () => {

    HalDo.Win.create('files', '📁 Files', html, {width:520, height:420});
  };

  /* --- INFO --- */
  const renderInfo = () => {

      <div class="splash">
        <div class="splash-icon">🦚</div>
        <h2>HalDo AI OS Pro Max</h2>
        <p style="font-size:12px;line-height:1.8">
          <strong>Version:</strong> v125 · Phase 1 Foundation<br>
          <strong>Entwickler:</strong> Halil Donma<br>
          <strong>Apps:</strong> 375 registriert (A–Z)<br>
          <strong>Sprachen:</strong> 15+ integriert<br>
          <strong>Plattform:</strong> Browser · iPhone · iPad · Laptop
        </p>
        <p class="presenter">Präsentiert von Halil Donma</p>
      </div>
    `;
    HalDo.Win.create('info', 'ℹ️ Über HalDo', html, {width:480, height:480});
  };

  /* --- SETUP --- */
  const renderSetup = () => {
    if (HalDo.Win.windows['setup']) return HalDo.Win.focus('setup');
    const html = `
      <div class="splash">
        <div class="splash-icon">🔧</div>
        <h2>HalDo Setup</h2>
        <p>Design, Reset, Export & System-Setup</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px">
          <button class="chip" onclick="HalDo.UI.open('settings')">⚙️ Einstellungen</button>
          <button class="chip" onclick="HalDo.UI.toggleCyborg()">⚡ CYBORG</button>
          <button class="chip" onclick="if(confirm('Reset? Alle Einstellungen löschen?')){localStorage.clear();location.reload()}">🔄 Reset</button>

        <p class="presenter">Präsentiert von Halil Donma</p>

    HalDo.Win.create('setup', '🔧 Setup', html, {width:480, height:420});

  /* --- NOTIFICATIONS --- */
  const renderNotifications = () => {

/* ============ COSMOS (Three.js) ============ */
HalDo.Cosmos = (() => {
  let scene, camera, renderer, sun, corona1, corona2, corona3;
  let planets = [], stars1, stars2, earthMesh, earthClouds, earthAtmo, moon;
  let clock, targetX = 0, targetY = 0, mouseX = 0, mouseY = 0;

  const makeGlow = (size, c1, c2) => {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const cx = c.getContext('2d');
    const g = cx.createRadialGradient(256, 256, 20, 256, 256, 256);
    g.addColorStop(0, c1); g.addColorStop(.5, c2); g.addColorStop(1, 'rgba(255,60,0,0)');
    cx.fillStyle = g; cx.fillRect(0, 0, 512, 512);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(size, size, 1);
    return s;
  };

  const makeSunTex = () => {
    const c = document.createElement('canvas'); c.width = 512; c.height = 256;
    const cx = c.getContext('2d');
    const g = cx.createRadialGradient(256, 128, 0, 256, 128, 256);
    g.addColorStop(0, '#fff5a0'); g.addColorStop(.4, '#ffcc00'); g.addColorStop(.7, '#ff9900'); g.addColorStop(1, '#ff4400');
    cx.fillStyle = g; cx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 400; i++) {
      cx.fillStyle = Math.random() > .5 ? 'rgba(255,255,220,.5)' : 'rgba(200,50,0,.35)';
      cx.beginPath(); cx.arc(Math.random() * 512, Math.random() * 256, Math.random() * 5, 0, Math.PI * 2); cx.fill();
    }
    return new THREE.CanvasTexture(c);
  };

  const makePlanetTex = (c1, c2, type) => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const cx = c.getContext('2d');
    cx.fillStyle = c1; cx.fillRect(0, 0, 256, 128);
    if (type === 'bands') {
      for (let i = 0; i < 12; i++) { cx.fillStyle = i % 2 === 0 ? c1 : c2; cx.globalAlpha = .5 + Math.random() * .3; cx.fillRect(0, i * 128 / 12, 256, 128 / 12); }
      cx.globalAlpha = 1;
    } else if (type === 'crater') {
      for (let i = 0; i < 40; i++) { cx.fillStyle = `rgba(0,0,0,${.15 + Math.random() * .3})`; cx.beginPath(); cx.arc(Math.random() * 256, Math.random() * 128, Math.random() * 8 + 2, 0, Math.PI * 2); cx.fill(); }
    } else if (type === 'cloud') {
      for (let i = 0; i < 30; i++) { cx.fillStyle = `rgba(255,255,255,${.1 + Math.random() * .2})`; cx.beginPath(); cx.ellipse(Math.random() * 256, Math.random() * 128, Math.random() * 30 + 10, Math.random() * 10 + 3, Math.random() * Math.PI, 0, Math.PI * 2); cx.fill(); }
    }
    return new THREE.CanvasTexture(c);
  };

  const makeStars = (count, size, opacity) => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 400 + Math.random() * 700;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i*3+2] = r * Math.cos(phi);
      const c = Math.random();
      if (c < .65) { col[i*3] = 1; col[i*3+1] = 1; col[i*3+2] = 1; }
      else if (c < .82) { col[i*3] = .65; col[i*3+1] = .82; col[i*3+2] = 1; }
      else if (c < .94) { col[i*3] = 1; col[i*3+1] = .9; col[i*3+2] = .55; }
      else { col[i*3] = 1; col[i*3+1] = .65; col[i*3+2] = .65; }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size, vertexColors: true, transparent: true, opacity, sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending });
    return new THREE.Points(geo, mat);
  };

  const init = () => {
    const canvas = document.getElementById('cosmosBg');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000208);
    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, .1, 3000);
    camera.position.set(0, 10, 42);
    camera.lookAt(0, 0, 0);
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    clock = new THREE.Clock();

    // Stars
    stars1 = makeStars(5000, 1.0, .75); scene.add(stars1);
    stars2 = makeStars(900, 2.4, .95); scene.add(stars2);

    // Sun
    sun = new THREE.Mesh(new THREE.SphereGeometry(4, 64, 64), new THREE.MeshBasicMaterial({ map: makeSunTex() }));
    scene.add(sun);
    scene.add(new THREE.PointLight(0xfff5d0, 3.5, 0, 1));
    scene.add(new THREE.AmbientLight(0x505070, .45));

    // Corona
    corona1 = makeGlow(28, 'rgba(255,240,150,.95)', 'rgba(255,180,60,.5)');
    corona2 = makeGlow(45, 'rgba(255,200,100,.5)', 'rgba(255,120,30,.2)');
    corona3 = makeGlow(75, 'rgba(255,150,60,.2)', 'rgba(255,60,0,.05)');
    scene.add(corona1); scene.add(corona2); scene.add(corona3);

    // Planets
    const defs = [
      {name:'Merkur',c1:'#8a7d6b',c2:'#5a4f42',size:1.2,dist:11,speed:.7,type:'crater'},
      {name:'Venus',c1:'#e8c88a',c2:'#a88040',size:1.7,dist:15,speed:.55,type:'cloud'},
      {name:'Erde',c1:'#4da8ff',c2:'#1a5599',size:5.0,dist:26,speed:.42,type:'earth'},
      {name:'Mars',c1:'#c1440e',c2:'#8a2f0a',size:1.4,dist:34,speed:.35,type:'crater'},
      {name:'Jupiter',c1:'#d4a373',c2:'#a08050',size:4.2,dist:44,speed:.25,type:'bands'},
      {name:'Saturn',c1:'#e8d5a0',c2:'#a07840',size:3.7,dist:55,speed:.20,type:'bands',ring:true},
      {name:'Uranus',c1:'#7de0e0',c2:'#3a8080',size:2.4,dist:64,speed:.15,type:'bands'},
      {name:'Neptun',c1:'#3355ee',c2:'#0a1a6a',size:2.2,dist:72,speed:.12,type:'bands'},
      {name:'Pluto',c1:'#b08860',c2:'#5a4020',size:.9,dist:80,speed:.09,type:'crater'},
      {name:'Xena',c1:'#8866aa',c2:'#4a2a6a',size:1.0,dist:88,speed:.07,type:'crater'},
      {name:'Sedna',c1:'#9977cc',c2:'#4a3a7a',size:1.05,dist:96,speed:.05,type:'crater'},
      {name:'Eris',c1:'#aaccff',c2:'#5070a0',size:1.1,dist:104,speed:.04,type:'crater'}
    ];

    defs.forEach(d => {
      const geo = new THREE.SphereGeometry(d.size, 48, 48);
      const mat = new THREE.MeshPhongMaterial({ map: makePlanetTex(d.c1, d.c2, d.type === 'earth' ? 'cloud' : d.type), shininess: 15 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(d.dist, 0, 0);
      scene.add(mesh);

      if (d.name === 'Erde') {
        earthMesh = mesh;
        // Try load real earth texture
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = 'anonymous';
        loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg', tex => {
          mat.map = tex; mat.needsUpdate = true;
        }, undefined, () => {});
        // Atmosphere
        const atmoGeo = new THREE.SphereGeometry(d.size * 1.15, 48, 48);
        const atmoMat = new THREE.MeshBasicMaterial({ color: 0x4da8ff, transparent: true, opacity: .12, blending: THREE.AdditiveBlending });
        earthAtmo = new THREE.Mesh(atmoGeo, atmoMat);
        earthMesh.add(earthAtmo);
        // Moon
        moon = new THREE.Mesh(new THREE.SphereGeometry(.6, 24, 24), new THREE.MeshPhongMaterial({ color: 0xcccccc }));
        earthMesh.add(moon);
        moon.position.set(8, 0, 0);
      }

      if (d.ring) {
        const ringGeo = new THREE.RingGeometry(d.size * 1.4, d.size * 2, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xe8d5a0, side: THREE.DoubleSide, transparent: true, opacity: .5 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.2;
        mesh.add(ring);
      }

      planets.push({ mesh, dist: d.dist, speed: d.speed, name: d.name, angle: Math.random() * Math.PI * 2 });
    });

    // Mouse parallax
    window.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth - .5) * 2;
      targetY = (e.clientY / window.innerHeight - .5) * 2;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
    setTimeout(() => {
      const l = document.getElementById('loader');
      if (l) { l.classList.add('hide'); setTimeout(() => l.remove(), 600); }
    }, 800);
  };

  const animate = () => {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    mouseX += (targetX - mouseX) * .05;
    mouseY += (targetY - mouseY) * .05;

    if (sun) sun.rotation.y += .002;
    if (corona1) { corona1.scale.setScalar(28 + Math.sin(t * 2) * 2); }
    if (corona2) { corona2.scale.setScalar(45 + Math.sin(t * 1.5) * 3); }
    if (corona3) { corona3.scale.setScalar(75 + Math.sin(t * 1.2) * 4); }

    planets.forEach(p => {
      p.angle += p.speed * .005;
      p.mesh.position.x = Math.cos(p.angle) * p.dist;
      p.mesh.position.z = Math.sin(p.angle) * p.dist;
      p.mesh.rotation.y += .01;
      if (p.name === 'Erde' && moon) {
        moon.position.x = Math.cos(t * .8) * 8;
        moon.position.z = Math.sin(t * .8) * 8;
      }
    });

    if (stars1) stars1.rotation.y = mouseX * .05;
    if (stars2) stars2.rotation.y = mouseX * .05;

    camera.position.x = mouseX * 3;
    camera.position.y = 10 - mouseY * 3;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  };

  return { init };
})();
