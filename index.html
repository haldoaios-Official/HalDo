<style>

  <svg viewBox="0 0 100 100">
    <defs><radialGradient id="ag"><stop offset="0%" stop-color="var(--accent1)" stop-opacity=".4"/><stop offset="100%" stop-color="var(--accent2)" stop-opacity=".1"/></radialGradient></defs>
    <circle cx="50" cy="50" r="45" fill="url(#ag)" stroke="var(--accent1)" stroke-width="1.5" opacity=".8"/>

<script>
/* ═══════════════════════════════════════════════════════
   HALDO AI OS PRO MAX v127 – CORE
   ═══════════════════════════════════════════════════════ */
const HalDo = {apps:{},win:{},theme:{},store:{},util:{},i18n:{},voice:{},ai:{},avatar:{}};

HalDo.store.get = (k,d) => { try { const v = localStorage.getItem('haldo_'+k+'_v1'); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
HalDo.store.set = (k,v) => { try { localStorage.setItem('haldo_'+k+'_v1', JSON.stringify(v)); } catch(e){} };
HalDo.util.uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
HalDo.util.esc = (s) => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
HalDo.util.today = () => new Date().toISOString().slice(0,10);
HalDo.util.toast = (msg) => {
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2500);
};
HalDo.avatar.setState = (s) => {
  const a = document.getElementById('avatar');
  if(!a) return;
  a.classList.remove('speaking','listening','thinking','idle');
  a.classList.add(s);
};

/* ═══════════════════════════════════════════════════════
   SPRACHEN (18)
   ═══════════════════════════════════════════════════════ */

HalDo.i18n.current = () => HalDo.store.get('lang','de');
HalDo.i18n.set = (lang) => {
  if (!LANGS[lang]) lang='de';
  HalDo.store.set('lang', lang);
  document.documentElement.dir = LANGS[lang].dir;
  document.documentElement.lang = lang;
  HalDo.util.toast('🌐 ' + LANGS[lang].flag + ' ' + LANGS[lang].name);
  renderSidebar();
  document.querySelectorAll('.win').forEach(w => {
    const id = w.id.replace('win-','');
    if (APPS[id]) { const app = APPS[id](); w.querySelector('.win-body').innerHTML = app.html; if(app.onMount) app.onMount(w); }
  });
};
HalDo.i18n.t = (key) => {
  const lang = HalDo.i18n.current();
  if (STR[lang] && STR[lang][key]) return STR[lang][key];
  if (STR.de[key]) return STR.de[key];
  return key;
};
HalDo.i18n.langFor = (appId) => {
  const override = HalDo.store.get('app_lang_'+appId,null);
  return override || HalDo.i18n.current();
};
HalDo.i18n.setApp = (appId, lang) => {
  HalDo.store.set('app_lang_'+appId, lang);
  const w = document.getElementById('win-'+appId);
  if (w && APPS[appId]) { const app=APPS[appId](); w.querySelector('.win-body').innerHTML=app.html; if(app.onMount) app.onMount(w); }
};

HalDo.voice.speak = (text, langOverride) => {
  if (!('speechSynthesis' in window)) return;
  const voiceOn = HalDo.store.get('voice_on', true);
  if (!voiceOn) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = langOverride || HalDo.i18n.current();
    u.lang = LANGS[lang] ? LANGS[lang].speech : 'de-DE';
    u.rate = HalDo.store.get('voice_rate', 1.05);
    u.pitch = HalDo.store.get('voice_pitch', 1.1);
    u.volume = HalDo.store.get('voice_volume', 1);
    window.speechSynthesis.speak(u);
    HalDo.avatar.setState('speaking');
    u.onend = () => HalDo.avatar.setState('idle');
  } catch(e){}
};
HalDo.voice.listen = (callback, langOverride) => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { HalDo.util.toast('❌ Spracherkennung nicht verfügbar (Chrome/Safari)'); return; }
  const r = new SR();
  r.lang = LANGS[langOverride || HalDo.i18n.current()]?.speech || 'de-DE';
  r.interimResults = false;
  HalDo.avatar.setState('listening');
  r.onresult = (e) => { callback(e.results[0][0].transcript); HalDo.avatar.setState('idle'); };
  r.onerror = () => { HalDo.avatar.setState('idle'); HalDo.util.toast('❌ Spracherkennung Fehler'); };
  r.onend = () => HalDo.avatar.setState('idle');
  try { r.start(); } catch(e) { HalDo.util.toast('❌ Mikrofon Start fehlgeschlagen'); }
};
HalDo.voice.beep = (freq, dur) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch(e){}
};

HalDo.ai.ask = (msg, ctx) => {
  const lang = HalDo.i18n.current();
  const m = msg.toLowerCase().trim();
  const t = (k) => HalDo.i18n.t(k);
  // Context-aware responses
  if (ctx && ctx.app === 'fahrschule') {
    if (m.includes('klasse') || m.includes('class') || m.includes('çîn')) return {text: `🚗 ${t('class')} ${ctx.class || 'B'}: ${ctx.info || 'PKW bis 3,5t'}. ${t('ask_ai')}: ${ctx.tip || 'Übe täglich 20 Fragen!'}`, lang};
    if (m.includes('prüfung') || m.includes('exam') || m.includes('azmûn')) return {text: `📝 ${t('exam')}: 30 Fragen, max. 10 Fehler. Ich lese dir jede Frage vor – klick 🔊!`, lang};
    if (m.includes('theorie') || m.includes('theorie') || m.includes('tîorî')) return {text: `📚 ${t('learn')}: Erst Theorie, dann Praxis. Frag mich zu jedem Thema!`, lang};
  }
  if (ctx && ctx.app === 'blitzer') {
    if (m.includes('blitzer') || m.includes('radar')) return {text: `🚦 ${t('warning')}: ${t('speed')} reduzieren! Ich sage dir jede Gefahr an.`, lang};
    if (m.includes('tempo') || m.includes('speed')) return {text: `⚡ ${t('speed')}: ${ctx.speed || 0} km/h. ${t('limit')}: ${ctx.limit || 120} km/h.`, lang};
  }
  if (ctx && ctx.app === 'arztbuch') {
    if (m.includes('schmerz') || m.includes('pain')) return {text: `🩺 ${t('warning')}: Bei starken Schmerzen sofort zum Arzt! Ich kann nur informieren, nicht behandeln.`, lang};
    if (m.includes('medikament') || m.includes('medicine')) return {text: `💊 Medikamente: Immer Rücksprache mit Arzt oder Apotheker halten.`, lang};
  }
  if (ctx && ctx.app === 'nav') {
    if (m.includes('ziel') || m.includes('destination')) return {text: `🧭 ${t('destination')}: ${ctx.dest || 'Ziel'}. Folge den goldenen Pfeilen!`, lang};
  }
  // General
  const kb = {
    de: {hallo:'Hallo Bruder! 👋',wie:'Mir geht es gut! Und dir?',name:'Ich bin HalDo AI 🤖',zeit:()=>'Es ist '+new Date().toLocaleTimeString('de-DE'),datum:()=>'Heute ist '+new Date().toLocaleDateString('de-DE',{weekday:'long'}),danke:'Gern! 💙',hilfe:'Ich kann: chatten, Apps öffnen, Fragen beantworten, vorlesen.',witz:'Warum können Geister schlecht lügen? Weil man durch sie hindurchsieht! 👻'},
    en: {hallo:'Hello brother! 👋',wie:'I\'m fine! And you?',name:'I\'m HalDo AI 🤖',zeit:()=>'It\'s '+new Date().toLocaleTimeString('en-US'),datum:()=>'Today is '+new Date().toLocaleDateString('en-US',{weekday:'long'}),danke:'You\'re welcome! 💙',hilfe:'I can chat, open apps, answer questions, read aloud.',witz:'Why can\'t ghosts lie? Because you can see right through them! 👻'},
    ku: {hallo:'Silav bira! 👋',wie:'Ez baş im! Tu çawa yî?',name:'Ez HalDo AI me 🤖',zeit:()=>'Niha '+new Date().toLocaleTimeString('tr-TR'),datum:()=>'Îro '+new Date().toLocaleDateString('tr-TR',{weekday:'long'}),danke:'Spas! 💙',hilfe:'Ez dikarim biaxivim, sepanan vekim, pirsan bibersivim.',witz:'Çima cin bi derew nayên? Ji ber ku tu di wan re dibînî! 👻'},
    tr: {hallo:'Merhaba kardeşim! 👋',wie:'İyiyim! Sen nasılsın?',name:'Ben HalDo AI 🤖',zeit:()=>'Saat '+new Date().toLocaleTimeString('tr-TR'),datum:()=>'Bugün '+new Date().toLocaleDateString('tr-TR',{weekday:'long'}),danke:'Rica ederim! 💙',hilfe:'Sohbet edebilirim, uygulamalar açabilirim, soruları cevaplayabilirim.',witz:'Hayaletler neden yalan söyleyemez? Çünkü içlerinden görürsün! 👻'},
    ar: {hallo:'مرحبا أخي! 👋',wie:'أنا بخير! وأنت؟',name:'أنا HalDo AI 🤖',zeit:()=>'الساعة '+new Date().toLocaleTimeString('ar-SA'),datum:()=>'اليوم '+new Date().toLocaleDateString('ar-SA',{weekday:'long'}),danke:'على الرحب! 💙',hilfe:'أستطيع المحادثة، فتح التطبيقات، الإجابة على الأسئلة.',witz:'لماذا لا تكذب الأشباح؟ لأنك تراها من الداخل! 👻'}
  };
  const langKb = kb[lang] || kb.de;
  for (const [k, v] of Object.entries(langKb)) {
    if (m.includes(k)) return {text: typeof v==='function'?v():v, lang};
  }
  if (m.endsWith('?')) return {text: lang==='de'?'Gute Frage, Bruder! Ich lerne noch. 🤔':lang==='en'?'Good question! I\'m still learning. 🤔':'...', lang};
  return {text: lang==='de'?`Verstanden: "${msg}". Merke ich mir! 💾`:lang==='en'?`Understood: "${msg}". I'll remember it! 💾`:`OK: "${msg}" 💾`, lang};
};

let zTop = 250;
HalDo.win.open = (id, title, html, opts={}) => {
  const existing = document.getElementById('win-'+id);
  if (existing) { HalDo.win.focus(id); return existing; }
  const w = document.createElement('div');
  w.className='win'; w.id='win-'+id;
  const cnt = Object.keys(HalDo.win.open._c||{}).length;
  w.style.left = Math.max(10,(60 + (cnt*20) % 200)) + 'px';
  w.style.top = Math.max(10,(40 + (cnt*20) % 120)) + 'px';
  w.innerHTML = `
    <div class="win-head">
      <div class="title">${HalDo.util.esc(title)}</div>
      <div class="app-tools">
        <button data-tool="lang" title="Sprache">🌐</button>
        <button data-tool="settings" title="Einstellungen">⚙️</button>
        <button data-tool="ai" title="KI">🤖</button>
      </div>
      <div class="win-ctrls">
        <button class="win-btn" data-act="min" title="Min">—</button>
        <button class="win-btn close" data-act="close" title="Close">✕</button>
      </div>
    </div>
    <div class="win-body">${html}</div>
    <div class="win-resize"></div>`;
  document.getElementById('desktop').appendChild(w);
  // Drag
  const head = w.querySelector('.win-head');
  let dragX=0, dragY=0, drag=false;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-btn') || e.target.closest('[data-tool]')) return;
    drag = true; HalDo.win.focus(id);
    dragX = e.clientX - w.offsetLeft; dragY = e.clientY - w.offsetTop;
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!drag) return;
    w.style.left = Math.max(0, Math.min(window.innerWidth-100, e.clientX - dragX)) + 'px';
    w.style.top = Math.max(0, Math.min(window.innerHeight-100, e.clientY - dragY)) + 'px';
  });
  head.addEventListener('pointerup', () => drag=false);
  head.addEventListener('pointercancel', () => drag=false);
  // Resize
  const rz = w.querySelector('.win-resize');
  let rs=false, rw=0, rh=0, rx=0, ry=0;
  rz.addEventListener('pointerdown', e => { rs=true; rw=w.offsetWidth; rh=w.offsetHeight; rx=e.clientX; ry=e.clientY; rz.setPointerCapture(e.pointerId); e.stopPropagation(); });
  rz.addEventListener('pointermove', e => { if(!rs)return; w.style.width=Math.max(280,rw+(e.clientX-rx))+'px'; w.style.height=Math.max(200,rh+(e.clientY-ry))+'px'; });
  rz.addEventListener('pointerup', () => rs=false);
  // Controls
  w.querySelector('[data-act="close"]').onclick = () => { w.remove(); delete HalDo.win.open._c?.[id]; closeDrawer(); };
  w.querySelector('[data-act="min"]').onclick = () => w.classList.toggle('min');
  w.querySelector('[data-tool="lang"]').onclick = () => openLangDrawer(id);
  w.querySelector('[data-tool="settings"]').onclick = () => openAppSettingsDrawer(id);
  w.querySelector('[data-tool="ai"]').onclick = () => openAIDrawer(id);
  w.addEventListener('pointerdown', () => HalDo.win.focus(id));
  HalDo.win.focus(id);
  HalDo.win.open._c = HalDo.win.open._c || {}; HalDo.win.open._c[id] = 1;
  if (opts.onMount) setTimeout(()=>opts.onMount(w), 0);
  return w;
};
HalDo.win.focus = (id) => {
  document.querySelectorAll('.win').forEach(x=>x.classList.remove('active'));
  const w = document.getElementById('win-'+id); if(w){ w.style.zIndex = ++zTop; w.classList.add('active'); }
};
HalDo.win.close = (id) => { const w=document.getElementById('win-'+id); if(w)w.remove(); };

const drawer = document.getElementById('appDrawer');
const drTitle = document.getElementById('drTitle');

document.getElementById('drClose').onclick = () => closeDrawer();
function closeDrawer() { drawer.classList.remove('open'); }
function openDrawer(title, html) {
  drTitle.textContent = title;
  drBody.innerHTML = html;
  drawer.classList.add('open');
}
function openLangDrawer(appId) {
  const cur = HalDo.i18n.langFor(appId);
  let html = '<div class="dr-section"><h4>Sprache</h4>';
  Object.entries(LANGS).forEach(([k,v])=>{
    html += `<div class="dr-row"><span>${v.flag} ${v.name}</span><button class="btn ghost" style="padding:4px 12px;min-height:32px;font-size:11px;${k===cur?'background:var(--accent1);color:#02040a':''}" data-setlang="${k}">${k===cur?'✓':'→'}</button></div>`;
  });
  html += '</div>';
  openDrawer('🌐 Sprache – ' + (appId || 'Global'), html);
  drBody.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{
    const lang = b.dataset.setlang;
    if (appId) HalDo.i18n.setApp(appId, lang); else HalDo.i18n.set(lang);
    closeDrawer();
  });
}
function openAIDrawer(appId) {
  const ctx = getAppContext(appId);
  let html = `<div class="dr-section"><h4>🤖 KI – ${appId || 'Global'}</h4>
    <textarea class="inp ta" id="drawerAIIn" placeholder="Frag mich was zu ${appId || 'HalDo'}..."></textarea>
    <div class="row"><button class="btn" id="drawerAIAsk" style="flex:1">💬 Fragen</button><button class="btn ghost" id="drawerAIMic" style="flex:0 0 48px">🎙</button></div>
    <div id="drawerAIOut" class="small" style="margin-top:12px;padding:8px;background:rgba(0,229,255,.06);border-radius:8px;min-height:44px">Bereit!</div>
    <button class="btn ghost" style="width:100%;margin-top:8px;font-size:11px" id="drawerAIOpen">Vollbild-Chat öffnen</button>
  </div>`;
  openDrawer('🤖 KI – ' + (appId || 'Global'), html);
  const out = drBody.querySelector('#drawerAIOut');
  const ask = () => {
    const v = drBody.querySelector('#drawerAIIn').value.trim();
    if (!v) return;
    const r = HalDo.ai.ask(v, ctx);
    out.innerHTML = `<b>Du:</b> ${HalDo.util.esc(v)}<br><br><b>KI:</b> ${HalDo.util.esc(r.text)}`;
    HalDo.voice.speak(r.text, r.lang);
    drBody.querySelector('#drawerAIIn').value = '';
  };
  drBody.querySelector('#drawerAIAsk').onclick = ask;
  drBody.querySelector('#drawerAIMic').onclick = () => HalDo.voice.listen((txt) => { drBody.querySelector('#drawerAIIn').value = txt; ask(); });
  drBody.querySelector('#drawerAIOpen').onclick = () => { closeDrawer(); HalDo.apps.open('chat'); };
}
function openAppSettingsDrawer(appId) {
  const app = APP_SETTINGS[appId];
  if (!app) { openDrawer('⚙️ Einstellungen – ' + appId, '<div class="empty">Keine spezifischen Einstellungen. Nutze globale Einstellungen.</div>'); return; }
  const cur = HalDo.store.get('app_set_'+appId, {});
  let html = '';
  app.sections.forEach(sec => {
    html += `<div class="dr-section"><h4>${sec.name}</h4>`;
    sec.items.forEach(it => {
      const val = cur[it.key] !== undefined ? cur[it.key] : it.default;
      if (it.type==='select') {
        html += `<div class="dr-row"><span>${it.label}</span><select data-k="${it.key}">${it.options.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
      } else if (it.type==='toggle') {
        html += `<div class="dr-row"><span>${it.label}</span><input type="checkbox" data-k="${it.key}" ${val?'checked':''} style="width:44px;height:24px"></div>`;
      } else if (it.type==='lang') {
        html += `<div class="dr-row"><span>${it.label}</span><select data-lang="1"><option value="">(global)</option>${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===HalDo.store.get('app_lang_'+appId)?'selected':''}>${v.flag} ${v.name}</option>`).join('')}</select></div>`;
      } else if (it.type==='number') {
        html += `<div class="dr-row"><span>${it.label}</span><input type="number" data-k="${it.key}" value="${val}" min="${it.min||0}" max="${it.max||9999}" style="width:90px"></div>`;
      }
    });
    html += '</div>';
  });
  html += `<button class="btn danger" style="width:100%;margin-top:8px;font-size:12px" id="drResetApp">🗑 App-Daten zurücksetzen</button>`;
  openDrawer('⚙️ Einstellungen – ' + appId, html);
  drBody.querySelectorAll('[data-k]').forEach(el => {
    el.onchange = () => {
      const d = HalDo.store.get('app_set_'+appId, {});
      if (el.type==='checkbox') d[el.dataset.k] = el.checked;
      else d[el.dataset.k] = el.value;
      HalDo.store.set('app_set_'+appId, d);
      if (APPS[appId]) { const w=document.getElementById('win-'+appId); if(w){ const app=APPS[appId](); w.querySelector('.win-body').innerHTML=app.html; if(app.onMount) app.onMount(w); } }
    };
  });
  drBody.querySelectorAll('[data-lang]').forEach(el => {
    el.onchange = () => { if (el.value) HalDo.i18n.setApp(appId, el.value); else HalDo.store.set('app_lang_'+appId, null); };
  });
  drBody.querySelector('#drResetApp').onclick = () => { HalDo.store.set('app_set_'+appId, {}); HalDo.util.toast('✅ '+appId+' zurückgesetzt'); closeDrawer(); };
}

function getAppContext(appId) {
  const s = HalDo.store.get('app_set_'+appId, {});
  if (appId==='fahrschule') return {app:'fahrschule', class:s.class||'B', info:'PKW bis 3,5t', tip:'Übe täglich 20 Fragen!'};
  if (appId==='blitzer') return {app:'blitzer', speed:0, limit:+s.limit||120};
  if (appId==='arztbuch') return {app:'arztbuch'};
  if (appId==='nav') return {app:'nav', dest:'Berlin'};
  return {app: appId};
}

function initCosmos(){
  const c = document.getElementById('cosmos');
  for (let i=0; i<180; i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2+1;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${Math.random()*3}s;opacity:${Math.random()*.7+.3}`;
    c.appendChild(s);
  }
  for (let i=0; i<3; i++){
    const s = document.createElement('div');
    s.className='shooting';
    s.style.cssText = `left:${60+Math.random()*40}%;top:${Math.random()*50}%;animation-delay:${i*2}s`;
    c.appendChild(s);
  }
  const planets = [
    {size:6,orbit:120,dur:20,color:'#b0b0b0'},{size:10,orbit:170,dur:30,color:'#ffb87a'},
    {size:12,orbit:230,dur:45,color:'#4da8ff'},{size:8,orbit:290,dur:60,color:'#ff6b3d'},
    {size:26,orbit:370,dur:100,color:'#e0a870'},{size:22,orbit:450,dur:140,color:'#ffd89a'},
    {size:16,orbit:530,dur:180,color:'#88ddff'},{size:16,orbit:610,dur:220,color:'#5a8fff'},
    {size:10,orbit:690,dur:260,color:'#a8e8ff'},{size:12,orbit:770,dur:320,color:'#7a9fff'},
    {size:10,orbit:850,dur:380,color:'#6a9fff'},{size:8,orbit:930,dur:440,color:'#5a8fff'}
  ];
  planets.forEach((p,i) => {
    const o = document.createElement('div');
    o.className='orbit'; o.style.width=p.orbit*2+'px'; o.style.height=p.orbit*2+'px';
    c.appendChild(o);
    const pl = document.createElement('div');
    pl.className='planet';
    pl.style.cssText = `width:${p.size}px;height:${p.size}px;background:radial-gradient(circle at 30% 30%,#fff,${p.color});animation-duration:${p.dur}s;animation-delay:-${i*p.dur/12}s;--orbit:${p.orbit}px;left:50%;top:50%;margin-left:${-p.size/2}px;margin-top:${-p.size/2}px;`;
    c.appendChild(pl);
  });
}

      {label:'Dein Name',type:'input',key:'yourName',default:'Bruder'},
      {label:'Lieblingsfarbe',type:'color',key:'favColor',default:'#00e5ff'}
    ]},
    {k:'Z',name:'zZz (Nacht)',items:[
      {label:'Nachtmodus',type:'toggle',key:'nightMode',default:false},
      {label:'Auto-Nachtmodus',type:'toggle',key:'autoNight',default:false},
      {label:'Idle-Timeout (min)',type:'number',key:'idleTimeout',default:30}
    ]}
  ];
  const cur = HalDo.store.get('settings', {});
  let html = `<div class="small" style="margin-bottom:12px">Einstellungen A–Z (26 Sektionen)</div>`;
  sections.forEach(sec => {
    html += `<div class="card"><h4>${sec.k} – ${sec.name}</h4>`;
    sec.items.forEach(it => {
      const val = cur[it.key] !== undefined ? cur[it.key] : it.default;
      if (it.type==='toggle') html += `<div class="kv"><span>${it.label}</span><input type="checkbox" data-set="${it.key}" ${val?'checked':''} style="width:44px;height:24px"></div>`;
      else if (it.type==='select') html += `<div class="kv"><span>${it.label}</span><select data-set="${it.key}" style="max-width:130px;padding:4px 8px;background:rgba(255,255,255,.05);border:1px solid var(--c-border);border-radius:8px;color:var(--c-text);font-size:11px">${it.options.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
      else if (it.type==='number') html += `<div class="kv"><span>${it.label}</span><input type="number" data-set="${it.key}" value="${val}" step="${it.step||1}" style="max-width:80px;padding:4px 8px;background:rgba(255,255,255,.05);border:1px solid var(--c-border);border-radius:8px;color:var(--c-text);font-size:11px"></div>`;
      else if (it.type==='input') html += `<div class="kv"><span>${it.label}</span><input data-set="${it.key}" value="${HalDo.util.esc(val||'')}" style="max-width:130px;padding:4px 8px;background:rgba(255,255,255,.05);border:1px solid var(--c-border);border-radius:8px;color:var(--c-text);font-size:11px"></div>`;
      else if (it.type==='textarea') html += `<div class="kv"><span>${it.label}</span></div><textarea class="inp ta" data-set="${it.key}">${HalDo.util.esc(val||'')}</textarea>`;
      else if (it.type==='color') html += `<div class="kv"><span>${it.label}</span><input type="color" data-set="${it.key}" value="${val}" style="width:44px;height:32px;border-radius:8px;border:1px solid var(--c-border);background:transparent"></div>`;
      else if (it.type==='text') { const vv = it.value!==undefined ? (typeof it.value==='function'?it.value():it.value) : val; html += `<div class="kv"><span>${it.label}</span><span class="v">${HalDo.util.esc(vv||'')}</span></div>`; }
      else if (it.type==='button') html += `<button class="btn ${it.danger?'danger':'ghost'}" data-action="${it.action}" style="width:100%;margin-top:6px;font-size:11px">${it.label}</button>`;
      else if (it.type==='lang') html += `<div class="kv"><span>${it.label}</span><select data-lang-global="1" style="max-width:130px;padding:4px 8px;background:rgba(255,255,255,.05);border:1px solid var(--c-border);border-radius:8px;color:var(--c-text);font-size:11px">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===HalDo.i18n.current()?'selected':''}>${v.flag} ${v.name}</option>`).join('')}</select></div>`;
    });
    html += '</div>';
  });
  return {
    title:'⚙️ Einstellungen A–Z',
    html,
    onMount:(w)=>{
      w.querySelectorAll('[data-set]').forEach(el => {
        el.onchange = () => {
          const d = HalDo.store.get('settings', {});
          if (el.type==='checkbox') d[el.dataset.set] = el.checked;
          else d[el.dataset.set] = el.value;
          HalDo.store.set('settings', d);
          HalDo.util.toast('✅ '+el.dataset.set);
        };
      });
      w.querySelectorAll('[data-lang-global]').forEach(el => el.onchange = () => HalDo.i18n.set(el.value));
      w.querySelectorAll('[data-action]').forEach(b => b.onclick = () => {
        const a = b.dataset.action;
        if (a==='clearAll') { if(confirm('Wirklich alle Daten löschen?')) { Object.keys(localStorage).filter(k=>k.startsWith('haldo_')).forEach(k=>localStorage.removeItem(k)); location.reload(); } }
        else if (a==='exportAll') { const dump={}; for(const k in localStorage) if(k.startsWith('haldo_')) dump[k]=localStorage[k]; const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'}); const a2=document.createElement('a'); a2.href=URL.createObjectURL(blob); a2.download='haldo_backup_'+Date.now()+'.json'; a2.click(); HalDo.util.toast('💾 Backup erstellt'); }
        else if (a==='importAll') { const inp=document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=(e)=>{const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{try{const data=JSON.parse(rd.result); Object.keys(data).forEach(k=>localStorage.setItem(k,data[k])); HalDo.util.toast('✅ Import OK'); location.reload();}catch(err){HalDo.util.toast('❌ Fehler');}}; rd.readAsText(f);}; inp.click(); }
        else if (a==='resetTheme') { HalDo.theme.set('normal'); HalDo.util.toast('✅ Theme zurückgesetzt'); }
        else if (a==='tutorial') HalDo.util.toast('📚 Tutorial folgt');
        else if (a==='faq') HalDo.util.toast('❓ FAQ folgt');
        else if (a==='checkUpdates') HalDo.util.toast('✅ Version v127 aktuell');
      });
    }
  };
};

  const QUESTIONS = {
    de:[

      {q:'Red triangle?',a:['Order','Prohibition','Warning'],c:2},
      {q:'Distance outside city?',a:['Half speedo','1 car','5m'],c:0},
      {q:'Blinking?',a:['Sometimes','Always','Never'],c:1},
      {q:'Tire tread min?',a:['1mm','1.6mm','3mm'],c:1}
    ],
    ku:[
      {q:'Desthilat bê nîşan?',a:['Rast','Çep','Meztir'],c:0},
      {q:'Promîl ji bo destpêkê?',a:['0,0‰','0,5‰','1,1‰'],c:0},
      {q:'Sêgoşeya sor?',a:['Ferman','Qedexe','Hişyarî'],c:2}
    ],
    tr:[
      {q:'Tabelasız geçiş hakkı?',a:['Sağ','Sol','Büyük'],c:0},
      {q:'Acemi sürücü promil?',a:['0,0‰','0,5‰','1,1‰'],c:0},
      {q:'Kırmızı üçgen?',a:['Emir','Yasak','Uyarı'],c:2}
    ],
    ar:[
      {q:'أولوية المرور بدون إشارة؟',a:['اليمين','اليسار','الأكبر'],c:0},
      {q:'نسبة الكحول للمبتدئين؟',a:['0.0‰','0.5‰','1.1‰'],c:0},
      {q:'المثلث الأحمر؟',a:['أمر','منع','تحذير'],c:2}
    ]
  };
  let state = {
    class: s.class || 'B',
    mode: s.mode || 'Lernen',
    idx: 0,
    score: 0,
    done: false,
    showClassPicker: !s.class
  };
  const qs = (QUESTIONS[lang] || QUESTIONS.de).slice();
  const autoRead = s.autoRead || false;
  const showProgress = s.showProgress !== false;
  const render = () => {
    if (state.showClassPicker) {
      let h = `<h3>${t('class')}</h3><div class="small">${t('choose')}:</div><div class="grid">`;
      Object.entries(CLASSES).forEach(([k,v])=>{
        h += `<button class="btn ghost" data-cls="${k}" style="text-align:left;flex-direction:column;align-items:flex-start"><b style="color:var(--accent1);font-size:14px">${k}</b><br><span style="font-size:10px;opacity:.7">${v.info}</span></button>`;
      });
      h += '</div>';
      return h;
    }
    if (state.done) {
      const score = state.score;
      return `<div class="centered"><div class="big-icon">${score>=Math.ceil(qs.length*.7)?'🏆':'📚'}</div><h3>${state.class}: ${score}/${qs.length}</h3><div class="small">${score>=Math.ceil(qs.length*.7)?'✅ '+t('success'):'📖 '+t('again')}</div>

        <button class="btn ghost" id="fAskAI" style="margin-top:8px;font-size:11px">🤖 ${t('ask_ai')}</button></div>`;
    }
    const q = qs[state.idx];
    let h = '';
    if (showProgress) h += `<div class="progress" style="margin-bottom:8px"><div style="width:${(state.idx/qs.length)*100}%"></div></div>`;
    h += `<div class="row" style="justify-content:space-between"><div class="small">${state.class} • ${state.idx+1}/${qs.length}</div><div class="row" style="gap:4px">
      <button class="win-btn" id="fReadQ" title="${t('read_aloud')}">🔊</button>
      <button class="win-btn" id="fVoiceAnswer" title="${t('voice_answer')}">🎙</button>
      <button class="win-btn" id="fAskAIBtn" title="${t('ask_ai')}">🤖</button></div></div>
      <h3 style="margin:12px 0;font-size:15px">${HalDo.util.esc(q.q)}</h3>`;
    q.a.forEach((a,i) => { h += `<button class="btn ghost" style="width:100%;margin-bottom:6px;text-align:left" data-i="${i}">${HalDo.util.esc(a)}</button>`; });
    h += `<button class="btn ghost" id="fBack" style="margin-top:12px;width:100%;font-size:11px">← ${t('back')}</button>`;
    return h;
  };
  return {
    title:'🚗 Fahrschule A–T',
    html:`<div id="fBody">${render()}</div>`,
    onMount:(w)=>{
      const rebind = () => {
        const b = w.querySelector('#fBody');
        b.innerHTML = render();
        b.querySelectorAll('[data-cls]').forEach(x=>x.onclick=()=>{ state.class=x.dataset.cls; state.showClassPicker=false; state.idx=0; state.score=0; state.done=false; HalDo.store.set('app_set_fahrschule',{...HalDo.store.get('app_set_fahrschule',{}),class:state.class}); rebind(); if(autoRead) HalDo.voice.speak(qs[0].q, lang); });
        b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{
          if(+x.dataset.i===qs[state.idx].c) state.score++;
          state.idx++;
          if(state.idx>=qs.length) state.done=true;
          rebind();
          if(!state.done && autoRead) HalDo.voice.speak(qs[state.idx].q, lang);
        });
        const back=b.querySelector('#fBack'); if(back) back.onclick=()=>{ state.showClassPicker=true; rebind(); };
        const reset=b.querySelector('#fReset'); if(reset) reset.onclick=()=>{ state.idx=0; state.score=0; state.done=false; rebind(); };
        const readQ=b.querySelector('#fReadQ'); if(readQ) readQ.onclick=()=>{ HalDo.voice.speak(qs[state.idx].q, lang); };
        const voiceA=b.querySelector('#fVoiceAnswer'); if(voiceA) voiceA.onclick=()=>{ HalDo.voice.listen((txt)=>{ const curQ=qs[state.idx]; const match=curQ.a.findIndex((a,i)=>txt.toLowerCase().includes(a.toLowerCase())||txt.toLowerCase().includes(String.fromCharCode(65+i))); if(match>=0){ if(match===curQ.c) state.score++; state.idx++; if(state.idx>=qs.length) state.done=true; rebind(); } else { HalDo.util.toast('❌ Nicht erkannt'); } }, lang); };
        const askAI1=b.querySelector('#fAskAIBtn'); if(askAI1) askAI1.onclick=()=>openAIDrawer('fahrschule');
        const askAI2=b.querySelector('#fAskAI'); if(askAI2) askAI2.onclick=()=>openAIDrawer('fahrschule');
      };
      rebind();
      if(autoRead && !state.showClassPicker && !state.done) HalDo.voice.speak(qs[state.idx].q, lang);
    }
  };
};

APPS.blitzer = () => {
  const s = HalDo.store.get('app_set_blitzer', {});
  const lang = HalDo.i18n.langFor('blitzer');
  const limit = +s.limit || 120;
  const warnFrom = +s.warnFrom || 100;
  const voiceWarn = s.voiceWarn !== false;
  const beepWarn = s.beepWarn !== false;
  const dangers = {
    de:['Achtung Blitzer!','Geschwindigkeitskontrolle!','Stau voraus!','Baustelle!','Unfallstelle!','Wildwechsel!','Glatteis möglich','Nebel!','Schulweg!','Rettungsgasse!','LKW-Kolonne','Geisterfahrer!','Ölspur','Aquaplaning','Vollsperrung','Tunnel! Licht an','Rückstau','Verkehrskontrolle','Fahrbahnschäden','Fahrzeugpanne'],
    en:['Speed camera!','Speed check!','Traffic jam!','Construction!','Accident!','Wild animals!','Ice possible','Fog!','School zone!','Emergency lane!','Truck convoy','Wrong-way driver!','Oil spill','Aquaplaning','Road closed','Tunnel! Lights on','Backup traffic','Police check','Road damage','Vehicle breakdown'],
    tr:['Radar!','Hız kontrolü!','Trafik sıkışıklığı!','İnşaat!','Kaza!','Yaban hayatı!','Buzlanma','Sis!','Okul bölgesi!','Acil şerit!','Kamyon konvoyu','Ters yön!','Yağ döküntüsü','Aquaplaning','Yol kapalı','Tünel! Işık','Trafik birikimi','Polis kontrolü','Yol hasarı','Araç arızası'],
    ku:['Radar!','Kontrola lezê!','Trafîk giran e!','Avahî!','Qeza!','Ajalên çolê!','Cemed gengaz','Mij!','Rêya dibistanê!','Rêya alîkarîyê!','Kerwan kamyon','Ajovan xelet!','Şopa rûn','Aquaplaning','Rê girtî','Tûnel! Ronahî','Trafîk sekinî','Kontrola polîs','Ziyana rê','Wesayît xerab'],
    ar:['رادار!','فحص السرعة!','ازدحام مروري!','أشغال!','حادث!','حيوانات برية!','جليد محتمل','ضباب!','منطقة مدرسة!','طريق الطوارئ!','قافلة شاحنات','سائق عكسي!','تسرب زيت','انزلاق مائي','طريق مغلق','نفق! أضواء','ازدحام','تفتيش شرطة','أضرار طريق','تعطل مركبة']
  };
  const langDangers = dangers[lang] || dangers.de;
  const cx=100,cy=100,r=82,startDeg=135,toRad=d=>d*Math.PI/180,pt=(deg,rr)=>[cx+rr*Math.cos(toRad(deg)),cy+rr*Math.sin(toRad(deg))];
  let ticks='';
  for(let i=0;i<=26;i++){const ang=startDeg+(i/26)*270;const[x1,y1]=pt(ang,r);const[x2,y2]=pt(ang,r-6);ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i%5===0?'#fff':'rgba(255,255,255,.4)'}" stroke-width="${i%5===0?2:1}"/>`;}
  let lastIdx=-1;
  return {
    title:'🚦 Blitzer v2',
    html:`<div class="centered">
      <div style="position:relative;width:280px;height:280px">
        <svg viewBox="0 0 200 200" style="width:100%;height:100%">
          <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
          <defs><linearGradient id="agrad"><stop offset="0%" stop-color="#00e5ff"/><stop offset="50%" stop-color="#b478ff"/><stop offset="100%" stop-color="#ff4466"/></linearGradient></defs>
          <path id="arcProg" fill="none" stroke="url(#agrad)" stroke-width="10" stroke-linecap="round"/>
          ${ticks}
          <g id="needle" style="transform-origin:100px 100px;transition:transform .12s">
            <line x1="100" y1="100" x2="${pt(startDeg,r-10)[0]}" y2="${pt(startDeg,r-10)[1]}" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <circle cx="100" cy="100" r="8" fill="#fff" stroke="#00e5ff" stroke-width="2"/>
          </g>
        </svg>
        <div style="position:absolute;top:62%;left:50%;transform:translate(-50%,0);text-align:center">
          <div id="spd" style="font-size:42px;font-weight:800;color:#fff;text-shadow:0 0 12px var(--accent1)">0</div>
          <div class="small" style="font-size:9px">km/h</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
        <div style="padding:6px 14px;background:#fff;color:#000;border-radius:50%;font-weight:900;font-size:18px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:5px solid #ff2244">${limit}</div>
        <div style="padding:8px 14px;background:#4da8ff;color:#fff;border-radius:10px;font-weight:700;font-size:12px">A7 → Frankfurt</div>
      </div>
      <input type="range" min="0" max="260" value="0" id="spdIn" style="width:100%;margin-top:12px">
      <div id="warnBox" style="margin-top:12px;padding:12px;background:rgba(0,229,255,.08);border-radius:10px;font-size:13px;min-height:48px;width:100%;text-align:center;border-left:4px solid var(--accent1);transition:all .2s">${t('speed')} anpassen</div>
      <div class="small" style="margin-top:8px;font-size:10px">🔊 ${voiceWarn?'KI-Sprachansage aktiv':'Sprachansage aus'} • ${beepWarn?'Ton an':'Ton aus'}</div>
    </div>`,
    onMount:(w)=>{
      const upd=()=>{
        const v=+w.querySelector('#spdIn').value;
        w.querySelector('#spd').textContent=v;
        const sweep=(v/260)*270;const endDeg=startDeg+sweep;
        const[sx,sy]=pt(startDeg,r);const[ex,ey]=pt(endDeg,r);
        const large=sweep>180?1:0;
        w.querySelector('#arcProg').setAttribute('d',`M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}`);
        w.querySelector('#needle').style.transform=`rotate(${sweep}deg)`;
        const wb=w.querySelector('#warnBox');let msg='✓ OK',col='#4dff88';
        if(v>limit+10){msg=`⚠️ ZU SCHNELL! +${v-limit}`;col='#ff4466';}
        else if(v>limit){msg=`⚡ +${v-limit} über Limit`;col='#ffcc00';}
        else if(v>50){msg='✓ OK';col='#4da8ff';}
        const di=Math.floor(v/20);
        if(v>=warnFrom && di!==lastIdx){
          lastIdx=di;
          const d=langDangers[Math.floor(Math.random()*langDangers.length)];
          msg='🚨 '+d;col='#ff4466';
          if(beepWarn){HalDo.voice.beep(880,.15);setTimeout(()=>HalDo.voice.beep(660,.15),180);}
          if(voiceWarn) HalDo.voice.speak(d, lang);
          wb.style.animation='pulseWarn .6s 2';
          setTimeout(()=>wb.style.animation='',1200);
        } else if(v<warnFrom) lastIdx=-1;
        wb.textContent=msg;wb.style.color=col;wb.style.borderLeftColor=col;
      };
      w.querySelector('#spdIn').oninput=upd;upd();
    }
  };
};

  const c = colorMap[arrowColor];
  const arrowCount = +s.arrowCount || 10;
  const dirs = {
    de:['⬆️ Geradeaus','↗️ Leicht rechts','⬅️ Links','➡️ Rechts','🔄 Wenden','⬆️ Weiter','🎯 Ziel erreicht!'],
    en:['⬆️ Straight','↗️ Slight right','⬅️ Left','➡️ Right','🔄 Turn around','⬆️ Continue','🎯 Arrived!'],
    tr:['⬆️ Düz','↗️ Hafif sağ','⬅️ Sol','➡️ Sağ','🔄 Geri dön','⬆️ Devam','🎯 Hedefe ulaşıldı!'],
    ku:['⬆️ Rast','↗️ Kêm rast','⬅️ Çep','➡️ Rast','🔄 Bizinve','⬆️ Berdewam','🎯 Gihîşt!'],
    ar:['⬆️ مباشرة','↗️ يمين قليلاً','⬅️ يسار','➡️ يمين','🔄 استدارة','⬆️ استمر','🎯 وصلت!']
  };
  const dir = dirs[lang] || dirs.de;
  return {
    title:'🧭 Navigation',
    html:`<div class="row" style="margin-bottom:12px"><label style="display:flex;align-items:center;gap:8px">${t('theme')}: <input type="color" id="navColor" value="${c}" style="width:44px;height:44px;border-radius:10px;border:1.5px solid var(--c-border);background:transparent;cursor:pointer"></label></div>
      <input class="inp" id="navDest" placeholder="${t('destination')}" value="Berlin">
      <button class="btn" id="navGo">🧭 ${t('start_nav')}</button>
      <div id="navDisp" style="position:relative;height:340px;background:radial-gradient(circle at 50% 100%,rgba(0,0,0,.5),rgba(0,0,0,.8));border-radius:12px;overflow:hidden;margin-top:12px;border:1px solid var(--c-border)">
        <div id="navArrows" style="position:absolute;inset:0;pointer-events:none;color:${c}"></div>
        <div id="navInfo" style="position:absolute;top:12px;left:12px;right:12px;padding:10px;background:rgba(0,0,0,.6);border-radius:10px;font-size:12px;color:#fff"><b style="color:${c}">📍 ${t('ready')}</b></div>
        <div id="navText" style="position:absolute;bottom:12px;left:12px;right:12px;font-weight:800;font-size:18px;text-align:center;text-shadow:0 0 12px currentColor;color:${c}"></div>
      </div>`,
    onMount:(w)=>{
      const setColor=(col)=>{
        HalDo.store.set('app_set_nav',{...HalDo.store.get('app_set_nav',{}),arrowColor:col});
        w.querySelector('#navText').style.color=colorMap[col]||col;
        w.querySelector('#navInfo').querySelector('b').style.color=colorMap[col]||col;
        w.querySelector('#navArrows').style.color=colorMap[col]||col;
      };
      w.querySelector('#navColor').oninput=(e)=>setColor(e.target.value);
      let dirIdx=0;
      w.querySelector('#navGo').onclick=()=>{
        const dest=w.querySelector('#navDest').value.trim()||t('destination');
        const cont=w.querySelector('#navArrows');cont.innerHTML='';
        const cc=colorMap[arrowColor]||c;
        for(let i=0;i<arrowCount;i++){
          const a=document.createElement('div');
          a.style.cssText=`position:absolute;width:22px;height:28px;background:${cc};clip-path:polygon(50% 0%,100% 100%,50% 78%,0% 100%);left:${48+(Math.random()-.5)*15}%;bottom:0;opacity:0;animation:navFly 2s ease-out infinite;animation-delay:${i*.22}s;box-shadow:0 0 15px ${cc};filter:drop-shadow(0 0 6px ${cc})`;
          cont.appendChild(a);
        }
        dirIdx=0;
        const info=w.querySelector('#navInfo'),txt=w.querySelector('#navText');
        const tick=()=>{
          if(dirIdx>=dir.length)return;
          info.innerHTML=`<b style="color:${cc}">📍 ${HalDo.util.esc(dest)}</b><br><span style="opacity:.7">${dir[dirIdx]}</span>`;
          txt.textContent=dir[dirIdx];
          if(s.voiceGuide!==false) HalDo.voice.speak(dir[dirIdx].replace(/[^\w\s]/g,''),lang);
          if(dirIdx===dir.length-1){info.innerHTML=`<b style="color:#4dff88">✅ ${HalDo.util.esc(dest)}</b>`;txt.style.color='#4dff88';return;}
          dirIdx++;setTimeout(tick,2000);
        };
        tick();
      };
    }
  };
};

/* ───── CHAT (AI) ───── */
APPS.chat = () => {
  const history = HalDo.store.get('chat_history', []);
  const lang = HalDo.i18n.langFor('chat');
  const voiceOn = HalDo.store.get('voice_on', true);
  return {
    title:'💬 '+t('chat'),
    html:`<div id="chatLog" style="overflow-y:auto;padding:8px;height:260px;margin-bottom:8px;background:rgba(0,0,0,.25);border-radius:10px;border:1px solid var(--c-border)"></div>
      <div class="row" style="margin-bottom:6px">
        <input class="inp" id="chatIn" placeholder="${t('hello')}..." style="margin:0">
        <button class="win-btn" id="chatMic" title="${t('microphone')}">🎙</button>
        <button class="btn" id="chatSend" style="padding:8px 14px">➤</button>
      </div>
      <div class="row"><button class="btn ghost" id="chatVoice" style="flex:1;font-size:11px">🔊 <span id="voiceState">${voiceOn?'An':'Aus'}</span></button><button class="btn ghost" id="chatClear" style="flex:1;font-size:11px">🗑</button></div>`,
    onMount:(w)=>{
      let vOn = voiceOn;
      const log=w.querySelector('#chatLog');
      const render=()=>{log.innerHTML=history.length?history.map(h=>`<div style="margin-bottom:8px;text-align:${h.role==='user'?'right':'left'}"><div style="display:inline-block;padding:8px 12px;border-radius:14px;background:${h.role==='user'?'rgba(0,229,255,.2)':'rgba(180,120,255,.2)'};max-width:88%;font-size:13px;text-align:left;word-break:break-word">${HalDo.util.esc(h.text)}</div></div>`).join(''):`<div class="empty">${t('hello')}! 👋</div>`;log.scrollTop=log.scrollHeight;};
      render();
      const send=(msg)=>{
        if(!msg.trim())return;
        history.push({role:'user',text:msg});HalDo.store.set('chat_history',history);render();
        const tid='th_'+Date.now();
        log.innerHTML+=`<div id="${tid}" style="text-align:left;margin-bottom:8px"><div style="display:inline-block;padding:8px 12px;border-radius:14px;background:rgba(180,120,255,.2);font-size:13px">🤔 ...</div></div>`;
        log.scrollTop=log.scrollHeight;
        HalDo.avatar.setState('thinking');
        setTimeout(()=>{
          document.getElementById(tid)?.remove();
          const r=HalDo.ai.ask(msg,{app:'chat'});
          history.push({role:'ai',text:r.text});HalDo.store.set('chat_history',history);render();
          if(vOn) HalDo.voice.speak(r.text, r.lang);
          HalDo.avatar.setState('speaking');setTimeout(()=>HalDo.avatar.setState('idle'),2500);
        },700);
      };
      w.querySelector('#chatSend').onclick=()=>{const i=w.querySelector('#chatIn');send(i.value);i.value='';};
      w.querySelector('#chatIn').onkeydown=(e)=>{if(e.key==='Enter'){send(e.target.value);e.target.value='';}};
      w.querySelector('#chatMic').onclick=()=>{
        w.querySelector('#chatMic').textContent='🔴';
        HalDo.voice.listen((txt)=>{send(txt);w.querySelector('#chatMic').textContent='🎙';}, lang);
      };
      w.querySelector('#chatVoice').onclick=()=>{vOn=!vOn;HalDo.store.set('voice_on',vOn);w.querySelector('#voiceState').textContent=vOn?'An':'Aus';if(!vOn) window.speechSynthesis?.cancel();};
      w.querySelector('#chatClear').onclick=()=>{history.length=0;HalDo.store.set('chat_history',[]);render();};
    }
  };
};

const nameToId = (name) => {
  const slug = slugify(name);
  if (APPS[slug]) return slug;
  if (ALIASES[slug]) return ALIASES[slug];
  return slug;
};

/* Patch Registry */
APPS.registry = () => {
  const letters = Object.keys(REGISTRY);
  let activeLetter = letters[0];
  const render = () => `
    <div class="tabs">${letters.map(l=>`<button class="tab ${l===activeLetter?'active':''}" data-l="${l}">${l}</button>`).join('')}</div>
    <div class="small" style="margin-bottom:8px">${REGISTRY[activeLetter].length} Apps • Total 375</div>
    <div>${REGISTRY[activeLetter].map(n=>{
      const id = nameToId(n);
      const avail = APPS[id] ? '' : ' <span style="font-size:9px;color:var(--c-dim)">(bald)</span>';
      return `<div class="list-item" style="cursor:pointer" data-open="${id}"><div class="txt">${n}${avail}</div><div style="color:var(--accent1);font-weight:700">→</div></div>`;
    }).join('')}</div>`;
  return {
    title:'📱 '+HalDo.i18n.t('apps'),
    html:render(),
    onMount:(w)=>{
      const rb = () => {
        w.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{
          activeLetter=x.dataset.l;
          w.querySelector('.win-body').innerHTML=render();
          rb();
        });
        w.querySelectorAll('[data-open]').forEach(item => {
          item.onclick = () => {
            const id = item.dataset.open;
            if (APPS[id]) {
              HalDo.apps.open(id);
            } else {
              HalDo.util.toast('🔧 '+item.querySelector('.txt').textContent.replace(' (bald)','').trim()+' – Modul folgt in v128');
            }
          };
        });
      };
      rb();
    }
  };
};
