<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root{
  --bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--text);font-size:14px;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ===== 3D HINTERGRUND ===== */
#cosmos-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
#cyborg-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* ===== WELCOME ===== */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9998;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);transition:opacity 0.5s ease}
#welcome.hide{opacity:0;pointer-events:none}
#welcome h1{font-size:clamp(32px,5.5vw,64px);font-weight:900;letter-spacing:4px;animation:fadeUp 1s ease-out;
  background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(251,191,36,.8),0 0 60px rgba(245,158,11,.5);
}
#welcome h2{font-size:clamp(16px,2vw,22px);color:#e5e7eb;font-weight:400;line-height:1.6;animation:fadeUp 1s ease-out .2s both;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;animation:fadeUp 1s ease-out .4s both;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#welcome .presented b{color:#fbbf24;font-weight:700}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s;animation:fadeUp 1s ease-out .6s both}
#welcome .enter-btn:hover{transform:scale(1.05);box-shadow:0 0 60px rgba(6,182,212,.9)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== FLOATING MENU BUTTON ===== */
#menu-btn{position:fixed;top:20px;left:20px;z-index:100;background:rgba(17,24,39,.8);border:1px solid var(--accent);border-radius:50%;width:56px;height:56px;display:none;align-items:center;justify-content:center;font-size:26px;box-shadow:0 0 20px rgba(6,182,212,.4);transition:all .2s;backdrop-filter:blur(10px)}
#menu-btn:hover{transform:scale(1.1);background:rgba(17,24,39,1)}
#menu-btn.show{display:flex}

/* ===== SIDEBAR (Nur 2 Menüpunkte) ===== */
#sidebar{position:fixed;top:90px;left:20px;width:280px;background:rgba(17,24,39,.95);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(15px);z-index:100;transform:translateX(-20px);opacity:0;transition:all .2s}
#sidebar.show{display:flex;transform:translateX(0);opacity:1}
.sidebar-content{padding:10px}
.sidebar-btn{display:flex;align-items:center;gap:16px;padding:16px;border-radius:10px;transition:all .2s;color:var(--text);width:100%;text-align:left;font-size:16px;font-weight:600}
.sidebar-btn:hover{background:var(--bg3);color:var(--accent)}
.sidebar-btn .icon{font-size:24px}

/* ===== APP LAUNCHER (Grid) ===== */
#launcher{position:fixed;inset:0;z-index:90;background:rgba(5,8,16,.85);backdrop-filter:blur(15px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;opacity:0;transition:opacity .3s}
#launcher.show{display:flex;opacity:1}
.launcher-header{font-size:28px;font-weight:800;color:var(--accent);margin-bottom:30px;display:flex;align-items:center;gap:12px}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:20px;max-width:900px;width:100%;max-height:70vh;overflow-y:auto;padding:10px}
.app-card{background:rgba(17,24,39,.6);border:1px solid rgba(55,65,81,.5);border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .2s;text-align:center}
.app-card:hover{background:rgba(31,41,55,.95);border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(6,182,212,.2)}
.app-card .ico{font-size:36px}
.app-card .nm{font-size:12px;font-weight:600;color:#e5e7eb}

/* ===== APP OVERLAY ===== */
#app-content{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:550px;z-index:200;background:rgba(10,14,26,.98);backdrop-filter:blur(20px);border-left:1px solid var(--border);display:none;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1)}
#app-content.show{display:flex;transform:translateX(0)}
.app-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.2)}
.app-header h2{font-size:18px;color:var(--accent);display:flex;align-items:center;gap:10px}
.close-btn{background:var(--bg3);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s}
.close-btn:hover{background:var(--danger)}
.app-body{flex:1;overflow-y:auto;padding:24px}

/* ===== SPLASH ===== */
#app-splash{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%, rgba(6,182,212,.2) 0%, rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px)}
#app-splash.show{display:flex;animation:splashIn .3s ease-out}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);animation:starGlow 1.2s ease-out}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.splash-presented{font-size:12px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-top:10px}
.splash-presented b{color:#fbbf24}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg)}50%{transform:scale(1.2) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}

/* ===== UI ELEMENTE IN APPS ===== */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.panel .desc{color:var(--dim);font-size:13px;margin-bottom:12px}
.btn{padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;transition:all .2s;display:inline-block}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.list-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.list-item:hover{background:rgba(31,41,55,.95);border-color:var(--accent)}
.list-item .title{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.list-item .meta{color:var(--dim);font-size:12px}
.badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info{flex:1}
.settings-row .info .lbl{font-weight:600;margin-bottom:4px}
.settings-row .ctrl{flex-shrink:0;margin-left:16px;min-width:150px}
.calc-display{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;font-size:36px;text-align:right;font-weight:600;margin-bottom:12px;min-height:80px;overflow:hidden;word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{padding:18px;font-size:20px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-weight:600}
.calc-grid button.op{color:var(--accent)}
.calc-grid button.eq{background:var(--accent);color:#fff}
.emergency-btn{display:flex;align-items:center;justify-content:center;width:100%;height:200px;background:linear-gradient(135deg,#dc2626,#ef4444);border-radius:20px;font-size:48px;font-weight:900;color:#fff;letter-spacing:4px;box-shadow:0 0 40px rgba(239,68,68,.4);cursor:pointer}
#glb-uploader{position:fixed;bottom:20px;right:20px;z-index:50;background:rgba(0,0,0,0.8);padding:12px;border-radius:12px;border:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:12px;transition:opacity 0.3s}
</style>
</head>
<body>

<canvas id="cosmos-canvas"></canvas>
<canvas id="cyborg-canvas"></canvas>

<!-- MENÜ BUTTON -->
<button id="menu-btn" onclick="toggleSidebar(event)">☰</button>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-content">
    <button class="sidebar-btn" onclick="openLauncher()">
      <span class="icon">📱</span> HalDo AI Apps
    </button>
    <button class="sidebar-btn" onclick="openApp('settings')">
      <span class="icon">⚙️</span> Einstellungen
    </button>
  </div>
</div>

<!-- APP LAUNCHER -->
<div id="launcher">
  <div class="launcher-header"><span>🚀</span> HalDo AI Apps</div>
  <div class="app-grid" id="app-grid">
    <!-- Wird per JS befüllt -->
  </div>
  <button class="btn ghost" style="margin-top:20px" onclick="closeLauncher()">Schließen</button>
</div>

<!-- APP OVERLAY (Fenster) -->
<div id="app-content">
  <div class="app-header">
    <h2 id="app-title">App</h2>
    <button class="close-btn" onclick="closeApp()">✕</button>
  </div>
  <div class="app-body" id="app-body"></div>
</div>

<!-- WELCOME -->
<div id="welcome">
  <h1>HALDO AI OS PRO MAX</h1>
  <h2>Willkommen zurück, Bruder 💙<br>Dein Universum aus Medizin, Alltag und Intelligenz.</h2>
  <div class="presented">Präsentiert von <b>Halil Donma</b></div>
  <button class="enter-btn" onclick="enterApp()">JETZT STARTEN →</button>
</div>

<!-- APP SPLASH -->
<div id="app-splash">
  <div class="splash-icon">🤖</div>
  <div class="splash-name">HalDo AI OS</div>
  <div class="splash-presented">Präsentiert von <b>Halil Donma</b></div>
</div>

<!-- MANUELLER GLB UPLOAD -->
<div id="glb-uploader">
  <span style="color:var(--dim)">Modell hochladen:</span>
  <label class="btn" style="padding:6px 12px;font-size:12px">
    Wählen <input type="file" id="manual-glb" accept=".glb" style="display:none">
  </label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ================= 3D KOSMOS ================= */
function initCosmos() {
  try {
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Sterne
    const starGeo = new THREE.BufferGeometry();
    const posArray = new Float32Array(3000 * 3);
    for(let i=0; i<3000*3; i++) posArray[i] = (Math.random() - 0.5) * 200;
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 })));

    // Sonne
    const sun = new THREE.Mesh(new THREE.SphereGeometry(3, 64, 64), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
    sun.position.set(12, 8, -15);
    scene.add(sun);
    
    const createGlow = (color) => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.2, `rgba(${color[0]},${color[1]},${color[2]},1)`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
      return new THREE.CanvasTexture(c);
    };
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: createGlow([255,220,0]), transparent: true, blending: THREE.AdditiveBlending }));
    sunGlow.scale.set(28, 28, 1);
    sunGlow.position.copy(sun.position);
    scene.add(sunGlow);

    // Mond
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(1.2, 64, 64),
      new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg'), roughness: 1 })
    );
    moon.position.set(-10, 6, -8);
    scene.add(moon);

    // Erde
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(4, 64, 64),
      new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'), roughness: 0.6, emissive: 0x112244, emissiveIntensity: 0.5 })
    );
    earth.position.set(0, -3, 0);
    scene.add(earth);

    // Atmosphäre
    const atm = new THREE.Mesh(
      new THREE.SphereGeometry(4.15, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.2, side: THREE.BackSide })
    );
    atm.position.copy(earth.position);
    scene.add(atm);

    // Ring
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(5, 0.05, 16, 100),
      new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending })
    );
    ring.position.copy(earth.position);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sunLight = new THREE.DirectionalLight(0xfff8e1, 2.5);
    sunLight.position.copy(sun.position);
    scene.add(sunLight);
    const fillLight = new THREE.DirectionalLight(0x3b82f6, 1.0);
    fillLight.position.set(-10, -5, 10);
    scene.add(fillLight);

    function animate() {
      requestAnimationFrame(animate);
      earth.rotation.y += 0.001;
      moon.rotation.y += 0.002;
      ring.rotation.z += 0.005;
      sunGlow.scale.x = 28 + Math.sin(Date.now() * 0.002) * 2;
      sunGlow.scale.y = 28 + Math.sin(Date.now() * 0.002) * 2;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  } catch (e) { console.error("Kosmos Fehler:", e); }
}

/* ================= 3D MENSCH ================= */
let A = {scene:null, cam:null, ren:null, ctrl:null, current:null};
function initCyborg() {
  try {
    const canvas = document.getElementById('cyborg-canvas');
    A.scene = new THREE.Scene();
    A.cam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    A.cam.position.set(0, 1.2, 4);
    
    A.ren = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    A.ren.setSize(window.innerWidth, window.innerHeight);
    A.ren.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    A.ren.setClearColor(0x000000, 0);
    
    A.ctrl = new THREE.OrbitControls(A.cam, A.ren.domElement);
    A.ctrl.enableDamping = true;
    A.ctrl.enablePan = false;
    A.ctrl.enableZoom = true;
    A.ctrl.minDistance = 1.5;
    A.ctrl.maxDistance = 8;

    A.scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(3, 4, 5); A.scene.add(d1);
    const d2 = new THREE.DirectionalLight(0x06b6d4, 1.5); d2.position.set(-3, 2, -5); A.scene.add(d2);

    const loader = new THREE.GLTFLoader();

    function loadModel(url, isManual = false) {
      loader.load(url, (gltf) => {
        if(A.current) A.scene.remove(A.current);
        
        const m = gltf.scene;
        m.traverse(o => { if(o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
        A.scene.add(m);
        A.current = m;
        
        const box = new THREE.Box3().setFromObject(m);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        
        m.position.x = -center.x;
        m.position.y = -box.min.y;
        m.position.z = -center.z;
        
        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = A.cam.fov * (Math.PI / 180);
        let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.2;
        
        A.cam.position.set(0, size.y / 2, cameraZ);
        A.ctrl.target.set(0, size.y / 2, 0);
        A.ctrl.update();
        
        document.getElementById('glb-uploader').style.opacity = '0';
        setTimeout(() => document.getElementById('glb-uploader').style.display = 'none', 300);
      }, undefined, (err) => {
        if (!isManual && url === './male_base.glb') {
          document.getElementById('glb-uploader').style.borderColor = 'var(--danger)';
          document.getElementById('glb-uploader').style.boxShadow = '0 0 15px rgba(239,68,68,0.5)';
          
          // Fallback Hologramm
          const geo = new THREE.CapsuleGeometry(0.3, 1.2, 16, 32);
          const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true, transparent: true, opacity: 0.5 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.y = 0.9;
          A.scene.add(mesh);
          A.cam.position.set(0, 1, 3);
          A.ctrl.target.set(0, 1, 0);
        }
      });
    }

    loadModel('./male_base.glb');

    document.getElementById('manual-glb').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      loadModel(URL.createObjectURL(file), true);
    });

    (function loop() {
      requestAnimationFrame(loop);
      A.ctrl.update();
      A.ren.render(A.scene, A.cam);
    })();

    window.addEventListener('resize', () => {
      A.cam.aspect = window.innerWidth / window.innerHeight;
      A.cam.updateProjectionMatrix();
      A.ren.setSize(window.innerWidth, window.innerHeight);
    });
  } catch (e) { console.error("Cyborg Fehler:", e); }
}

/* ================= TÖNE & SPLASH ================= */
let audioCtx = null;
function playTone(type) {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const patterns = {
      glass: [{f:1760,t:'sine',d:0.6},{f:2637,t:'sine',d:0.6}],
      chime: [{f:880,t:'sine',d:0.4},{f:1320,t:'sine',d:0.4}],
      epic: [{f:440,t:'triangle',d:0.8},{f:554,t:'triangle',d:0.8},{f:659,t:'triangle',d:0.8}]
    };
    const notes = patterns[type] || patterns.glass;
    let t = 0;
    notes.forEach(n => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = n.f; o.type = n.t;
      const st = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.2, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + n.d);
      o.start(st); o.stop(st + n.d + 0.1);
      t += 0.1;
    });
  } catch(e) {}
}

function showAppSplash(icon, name) {
  const el = document.getElementById('app-splash');
  el.querySelector('.splash-icon').textContent = icon;
  el.querySelector('.splash-name').textContent = name;
  el.classList.add('show');
  playTone(localStorage.getItem('haldo_tone') || 'glass');
  setTimeout(() => el.classList.remove('show'), 1500);
}

/* ================= APP DATEN ================= */
const APPS = [

window.addEventListener('DOMContentLoaded', () => {
  initCosmos();
  initCyborg();
  
  const grid = document.getElementById('app-grid');
  APPS.forEach(a => {
    grid.innerHTML += `
      <div class="app-card" onclick="openApp('${a.id}')">
        <div class="ico">${a.ico}</div>
        <div class="nm">${a.nm}</div>
      </div>
    `;

function enterApp() {
  document.getElementById('welcome').classList.add('hide');
  document.getElementById('menu-btn').classList.add('show');
}

function toggleSidebar(e) {
  if(e) e.stopPropagation();
  document.getElementById('sidebar').classList.toggle('show');
}

function openLauncher() {
  document.getElementById('sidebar').classList.remove('show');
  document.getElementById('launcher').classList.add('show');
}

function closeLauncher() {
  document.getElementById('launcher').classList.remove('show');
}

function closeApp() {
  const overlay = document.getElementById('app-content');
  overlay.classList.remove('show');
  setTimeout(() => { overlay.style.display = 'none'; }, 300);
}

function openApp(id) {
  closeLauncher();
  const app = APPS.find(a => a.id === id) || (id === 'settings' ? {ico:'⚙️', nm:'Einstellungen'} : null);
  if(!app) return;
  
  showAppSplash(app.ico, app.nm);
  
  const overlay = document.getElementById('app-content');
  const title = document.getElementById('app-title');
  const body = document.getElementById('app-body');
  
  title.innerHTML = `<span>${app.ico}</span> ${app.nm}`;
  body.innerHTML = '';
  overlay.style.display = 'flex';
  setTimeout(() => overlay.classList.add('show'), 50);
  
  // Render spezifische Funktion
  if (id === 'settings') viewSettings(body);
  else if (id === 'anatomy') viewAnatomy(body);
  else if (id === 'ai') viewAI(body);
  else if (id === 'calc') viewCalc(body);
  else if (id === 'timer') viewTimer(body);
  else if (id === 'notes') viewNotes(body);
  else if (id === 'weather') viewWeather(body);
  else if (id === 'emergency') viewEmergency(body);
  else if (id === 'diseases') viewDiseases(body);
  else if (id === 'meds') viewMeds(body);
  else if (id === 'labs') viewLabs(body);
  else if (id === 'dashboard') viewDashboard(body);
  else {
    // Standard-Modul für alle anderen
    body.innerHTML = `
      <div class="panel">
        <h3>${app.ico} ${app.nm}</h3>
        <p class="desc">Dieses Modul ist bereit. Es wird in Kürze mit weiteren Funktionen ausgestattet.</p>
        <div class="btn-row"><button class="btn" onclick="closeApp()">Zurück</button></div>
      </div>
    `;
  }
}

    </div>
  `;
}
function resetCyborgCam() {
  if(A.current) {
    const box = new THREE.Box3().setFromObject(A.current);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = A.cam.fov * (Math.PI / 180);
    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.2;
    A.cam.position.set(0, size.y / 2, cameraZ);
    A.ctrl.target.set(0, size.y / 2, 0);
    A.ctrl.update();
  }
}

// 3. KI CHAT
function viewAI(c){
  c.innerHTML = `
    <div id="chat-log" style="display:flex;flex-direction:column;gap:12px;height:350px;overflow-y:auto;padding:16px;background:rgba(0,0,0,.3);border-radius:12px;margin-bottom:12px">
      <div class="list-item">Hallo Bruder 💙 Ich bin HalDo KI. Frag mich zu Symptomen oder Medikamenten.</div>
    </div>
    <div style="display:flex;gap:10px">
      <input id="ai-input" placeholder="Deine Frage…" onkeydown="if(event.key==='Enter')aiSend()">
      <button class="btn" onclick="aiSend()">Senden</button>
    </div>
  `;
}
function aiSend(){
  const inp = document.getElementById('ai-input');
  const log = document.getElementById('chat-log');
  const q = inp.value.trim(); if(!q) return;
  log.insertAdjacentHTML('beforeend', `<div class="list-item" style="background:var(--accent);color:#fff;align-self:flex-end">${q}</div>`);
  inp.value = '';
  setTimeout(() => {
    log.insertAdjacentHTML('beforeend', `<div class="list-item">Dazu habe ich noch keine gesicherte Kurzinfo. Bitte konsultiere für Diagnosen immer einen Arzt.<div style="margin-top:8px;color:var(--accent);cursor:pointer;font-size:11px" onclick="speak('Dazu habe ich noch keine gesicherte Kurzinfo.')">🔊 Vorlesen</div></div>`);
    log.scrollTop = log.scrollHeight;
  }, 300);
}
function speak(text){
  if(!('speechSynthesis' in window)) return alert('TTS nicht verfügbar.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 1.0; u.pitch = 1.0;
  speechSynthesis.speak(u);
}

// 4. RECHNER
let calcBuf = '';
function viewCalc(c){ 
  c.innerHTML = `<div class="panel" style="max-width:360px;margin:0 auto">
    <h3>🧮 Rechner</h3>
    <div class="calc-display" id="calc-d">0</div>
    <div class="calc-grid">
      <button onclick="calcIn('C')" style="color:var(--danger)">C</button>
      <button onclick="calcIn('(')">(</button>
      <button onclick="calcIn(')')">)</button>
      <button class="op" onclick="calcIn('/')">÷</button>
      <button onclick="calcIn('7')">7</button>
      <button onclick="calcIn('8')">8</button>
      <button onclick="calcIn('9')">9</button>
      <button class="op" onclick="calcIn('*')">×</button>
      <button onclick="calcIn('4')">4</button>
      <button onclick="calcIn('5')">5</button>
      <button onclick="calcIn('6')">6</button>
      <button class="op" onclick="calcIn('-')">−</button>
      <button onclick="calcIn('1')">1</button>
      <button onclick="calcIn('2')">2</button>
      <button onclick="calcIn('3')">3</button>
      <button class="op" onclick="calcIn('+')">+</button>
      <button onclick="calcIn('0')">0</button>
      <button onclick="calcIn('.')">.</button>
      <button onclick="calcIn('⌫')">⌫</button>
      <button class="eq" onclick="calcIn('=')">=</button>
    </div>
  </div>`; 
}
function calcIn(t){ 
  const d = document.getElementById('calc-d'); 
  if(t === 'C') calcBuf = ''; 
  else if(t === '⌫') calcBuf = calcBuf.slice(0, -1);
  else if(t === '='){ try{ calcBuf = String(eval(calcBuf || '0')); }catch{ calcBuf = 'ERR'; } } 
  else calcBuf += t; 
  d.textContent = calcBuf || '0'; 
}

// 5. TIMER
let timerInt = null;
function viewTimer(c){
  c.innerHTML = `<div class="panel" style="text-align:center;margin:0 auto;max-width:300px">
    <h3>⏱️ Timer</h3>
    <input id="timer-min" type="number" min="1" value="5" style="text-align:center;font-size:24px;margin-bottom:16px">
    <div style="font-size:56px;font-weight:800;color:var(--accent);margin:20px 0" id="timer-show">05:00</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn" onclick="startTimerApp()">Start</button>
      <button class="btn ghost" onclick="stopTimerApp()">Stop</button>
    </div>
  </div>`;
}
function startTimerApp(){
  stopTimerApp();
  let total = (parseInt(document.getElementById('timer-min').value) || 5) * 60;
  const show = document.getElementById('timer-show');
  const tick = () => { 
    if(total <= 0){ clearInterval(timerInt); playTone('glass'); speak('Zeit abgelaufen.'); return; } 
    total--; 
    const m = Math.floor(total/60), s = total%60;
    show.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; 
  };
  tick();
  timerInt = setInterval(tick, 1000);
}
function stopTimerApp(){ clearInterval(timerInt); }

// 7. WETTER
function viewWeather(c){
  c.innerHTML = `<div class="panel" style="text-align:center">
    <h3>🌤️ Wetter</h3>
    <div id="wx" style="margin:20px 0;font-size:18px">Lade Wetterdaten...</div>
    <button class="btn" onclick="loadWeather()">Aktualisieren</button>
  </div>`;
  loadWeather();
}
function loadWeather(){
  const el = document.getElementById('wx');
  if(!el) return;
  if(!navigator.geolocation){ el.textContent = 'GPS nicht verfügbar.'; return; }
  navigator.geolocation.getCurrentPosition(async p => {
    try{
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code`);
      const j = await r.json();
      el.innerHTML = `<div style="font-size:48px;font-weight:800;color:var(--accent)">${j.current.temperature_2m}°C</div><div style="color:var(--dim);margin-top:8px">Wetter-Code: ${j.current.weather_code}</div>`;
    }catch(e){ el.textContent = 'Fehler beim Laden.'; }
  }, () => { el.textContent = 'GPS verweigert.'; });
}
