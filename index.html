/* Voice */
HalDo.voice.speak = (text,langOverride)=>{
  if(!('speechSynthesis' in window))return;
  if(!HalDo.store.get('voice_on',true))return;
  try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const lang=langOverride||HalDo.i18n.current();u.lang=LANGS[lang]?LANGS[lang].speech:'de-DE';u.rate=HalDo.store.get('voice_rate',1.05);u.pitch=HalDo.store.get('voice_pitch',1.1);window.speechSynthesis.speak(u);HalDo.avatar.setState('speaking');u.onend=()=>HalDo.avatar.setState('idle')}catch(e){}
};
HalDo.voice.listen = (cb,langOverride)=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){HalDo.util.toast('❌ Spracherkennung nicht verfügbar');return}
  const r=new SR();r.lang=LANGS[langOverride||HalDo.i18n.current()]?.speech||'de-DE';r.interimResults=false;HalDo.avatar.setState('listening');
  r.onresult=(e)=>{cb(e.results[0][0].transcript);HalDo.avatar.setState('idle')};
  r.onerror=()=>{HalDo.avatar.setState('idle');HalDo.util.toast('❌ Fehler')};
  r.onend=()=>HalDo.avatar.setState('idle');
  try{r.start()}catch(e){}
};
HalDo.voice.beep = (freq,dur)=>{
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type='sine';o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.start();o.stop(ctx.currentTime+dur)}catch(e){}
};

  if(ctx&&ctx.app==='blitzer'){if(m.includes('blitzer')||m.includes('tempo'))return{text:`🚦 ${t('speed')} reduzieren! Ich warne dich.`,lang};}
  if(ctx&&ctx.app==='arztbuch'){if(m.includes('schmerz'))return{text:`🩺 Bei Schmerzen zum Arzt!`,lang};if(m.includes('medikament'))return{text:`💊 Rücksprache mit Arzt!`,lang};}
  if(ctx&&ctx.app==='nav'){if(m.includes('ziel'))return{text:`🧭 ${t('destination')}: ${ctx.dest||'Ziel'}`,lang};}
  const kb={
    de:{hallo:'Hallo Bruder! 👋',wie:'Gut! Und dir?',name:'HalDo AI 🤖',zeit:()=>'Es ist '+new Date().toLocaleTimeString('de-DE'),datum:()=>'Heute ist '+new Date().toLocaleDateString('de-DE',{weekday:'long'}),danke:'Gern! 💙',hilfe:'Ich kann Apps öffnen, Fragen beantworten, vorlesen.',witz:'Geister können nicht lügen, man sieht durch sie hindurch! 👻'},

    tr:{hallo:'Merhaba! 👋',wie:'İyiyim! Sen?',name:'HalDo AI 🤖',zeit:()=>new Date().toLocaleTimeString('tr-TR'),datum:()=>new Date().toLocaleDateString('tr-TR',{weekday:'long'}),danke:'Rica! 💙',hilfe:'Uygulama açarım, soruları cevaplarım.',witz:'Hayaletler yalan söyleyemez! 👻'},
    ku:{hallo:'Silav! 👋',wie:'Ez baş im! Tu?',name:'HalDo AI 🤖',zeit:()=>new Date().toLocaleTimeString('tr-TR'),datum:()=>new Date().toLocaleDateString('tr-TR',{weekday:'long'}),danke:'Spas! 💙',hilfe:'Ez sepanan vekim.',witz:'Cin derewan nabêjin! 👻'},
    ar:{hallo:'مرحبا! 👋',wie:'بخير! وأنت؟',name:'HalDo AI 🤖',zeit:()=>new Date().toLocaleTimeString('ar-SA'),datum:()=>new Date().toLocaleDateString('ar-SA',{weekday:'long'}),danke:'شكراً! 💙',hilfe:'أفتح التطبيقات.',witz:'الأشباح لا تكذب! 👻'}
  };
  const lk=kb[lang]||kb.de;
  for(const[k,v] of Object.entries(lk)){if(m.includes(k))return{text:typeof v==='function'?v():v,lang}}
  return{text:lang==='de'?`OK: "${msg}" 💾`:lang==='en'?`OK: "${msg}" 💾`:lang==='tr'?`Tamam: "${msg}" 💾`:`"${msg}" 💾`,lang};
};

/* Window Manager */
let zTop=250;
HalDo.win.open = (id,title,html,opts={})=>{
  const existing=document.getElementById('win-'+id);
  if(existing){HalDo.win.focus(id);return existing}
  const w=document.createElement('div');w.className='win';w.id='win-'+id;
  const cnt=Object.keys(HalDo.win.open._c||{}).length;
  w.style.left=Math.max(10,(60+(cnt*20)%200))+'px';
  w.style.top=Math.max(10,(40+(cnt*20)%120))+'px';
  w.innerHTML=`<div class="win-head"><div class="title">${HalDo.util.esc(title)}</div><div class="app-tools"><button data-tool="lang">🌐</button><button data-tool="settings">⚙️</button><button data-tool="ai">🤖</button></div><div class="win-ctrls"><button class="win-btn" data-act="min">—</button><button class="win-btn close" data-act="close">✕</button></div></div><div class="win-body">${html}</div><div class="win-resize"></div>`;
  document.getElementById('desktop').appendChild(w);
  const head=w.querySelector('.win-head');let dx=0,dy=0,dr=false;
  head.addEventListener('pointerdown',e=>{if(e.target.closest('.win-btn')||e.target.closest('[data-tool]'))return;dr=true;HalDo.win.focus(id);dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;head.setPointerCapture(e.pointerId)});
  head.addEventListener('pointermove',e=>{if(!dr)return;w.style.left=Math.max(0,Math.min(window.innerWidth-100,e.clientX-dx))+'px';w.style.top=Math.max(0,Math.min(window.innerHeight-100,e.clientY-dy))+'px'});
  head.addEventListener('pointerup',()=>dr=false);
  head.addEventListener('pointercancel',()=>dr=false);
  const rz=w.querySelector('.win-resize');let rs=false,rw=0,rh=0,rx=0,ry=0;
  rz.addEventListener('pointerdown',e=>{rs=true;rw=w.offsetWidth;rh=w.offsetHeight;rx=e.clientX;ry=e.clientY;rz.setPointerCapture(e.pointerId);e.stopPropagation()});
  rz.addEventListener('pointermove',e=>{if(!rs)return;w.style.width=Math.max(280,rw+(e.clientX-rx))+'px';w.style.height=Math.max(200,rh+(e.clientY-ry))+'px'});
  rz.addEventListener('pointerup',()=>rs=false);
  w.querySelector('[data-act="close"]').onclick=()=>{w.remove();delete HalDo.win.open._c?.[id];closeDrawer()};
  w.querySelector('[data-act="min"]').onclick=()=>w.classList.toggle('min');
  w.querySelector('[data-tool="lang"]').onclick=()=>openLangDrawer(id);
  w.querySelector('[data-tool="settings"]').onclick=()=>openAppSettingsDrawer(id);
  w.querySelector('[data-tool="ai"]').onclick=()=>openAIDrawer(id);
  w.addEventListener('pointerdown',()=>HalDo.win.focus(id));
  HalDo.win.focus(id);
  HalDo.win.open._c=HalDo.win.open._c||{};HalDo.win.open._c[id]=1;
  if(opts.onMount)setTimeout(()=>opts.onMount(w),0);
  return w;
};
HalDo.win.focus = (id)=>{document.querySelectorAll('.win').forEach(x=>x.classList.remove('active'));const w=document.getElementById('win-'+id);if(w){w.style.zIndex=++zTop;w.classList.add('active')}};

function openLangDrawer(appId){
  const cur=HalDo.i18n.langFor(appId);let html='<div class="dr-section"><h4>Sprache</h4>';

  html+='</div>';openDrawer('🌐 Sprache – '+(appId||'Global'),html);
  drBody.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{if(appId)HalDo.i18n.setApp(appId,b.dataset.setlang);else HalDo.i18n.set(b.dataset.setlang);closeDrawer()});

function openAIDrawer(appId){
  const ctx=getAppContext(appId);
  let html=`<div class="dr-section"><h4>🤖 KI – ${appId||'Global'}</h4><textarea class="inp ta" id="drawerAIIn" placeholder="Frag mich..."></textarea><div class="row"><button class="btn" id="drawerAIAsk" style="flex:1">💬</button><button class="btn ghost" id="drawerAIMic" style="flex:0 0 48px">🎙</button></div><div id="drawerAIOut" class="small" style="margin-top:12px;padding:8px;background:rgba(0,229,255,.06);border-radius:8px;min-height:44px">Bereit!</div></div>`;
  openDrawer('🤖 KI – '+(appId||'Global'),html);
  const out=drBody.querySelector('#drawerAIOut');
  const ask=()=>{const v=drBody.querySelector('#drawerAIIn').value.trim();if(!v)return;const r=HalDo.ai.ask(v,ctx);out.innerHTML=`<b>Du:</b> ${HalDo.util.esc(v)}<br><br><b>KI:</b> ${HalDo.util.esc(r.text)}`;HalDo.voice.speak(r.text,r.lang);drBody.querySelector('#drawerAIIn').value=''};
  drBody.querySelector('#drawerAIAsk').onclick=ask;
  drBody.querySelector('#drawerAIMic').onclick=()=>HalDo.voice.listen(txt=>{drBody.querySelector('#drawerAIIn').value=txt;ask()});

function openAppSettingsDrawer(appId){
  const app=APP_SETTINGS[appId];
  if(!app){openDrawer('⚙️ – '+appId,'<div class="empty">Keine spezifischen Einstellungen.</div>');return}
  const cur=HalDo.store.get('app_set_'+appId,{});let html='';
  app.sections.forEach(sec=>{html+=`<div class="dr-section"><h4>${sec.name}</h4>`;
    sec.items.forEach(it=>{const val=cur[it.key]!==undefined?cur[it.key]:it.default;
      if(it.type==='select')html+=`<div class="dr-row"><span>${it.label}</span><select data-k="${it.key}">${it.options.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
      else if(it.type==='toggle')html+=`<div class="dr-row"><span>${it.label}</span><input type="checkbox" data-k="${it.key}" ${val?'checked':''} style="width:44px;height:24px"></div>`;
      else if(it.type==='lang')html+=`<div class="dr-row"><span>${it.label}</span><select data-lang="1"><option value="">(global)</option>${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===HalDo.store.get('app_lang_'+appId)?'selected':''}>${v.flag} ${v.name}</option>`).join('')}</select></div>`;
      else if(it.type==='number')html+=`<div class="dr-row"><span>${it.label}</span><input type="number" data-k="${it.key}" value="${val}" min="${it.min||0}" max="${it.max||9999}" style="width:90px"></div>`;
    });html+='</div>'});
  html+=`<button class="btn danger" style="width:100%;margin-top:8px;font-size:12px" id="drResetApp">🗑 App-Daten zurücksetzen</button>`;
  openDrawer('⚙️ – '+appId,html);
  drBody.querySelectorAll('[data-k]').forEach(el=>{el.onchange=()=>{const d=HalDo.store.get('app_set_'+appId,{});if(el.type==='checkbox')d[el.dataset.k]=el.checked;else d[el.dataset.k]=el.value;HalDo.store.set('app_set_'+appId,d);if(APPS[appId]){const w=document.getElementById('win-'+appId);if(w){const app=APPS[appId]();w.querySelector('.win-body').innerHTML=app.html;if(app.onMount)app.onMount(w)}}}});
  drBody.querySelectorAll('[data-lang]').forEach(el=>{el.onchange=()=>{if(el.value)HalDo.i18n.setApp(appId,el.value);else HalDo.store.set('app_lang_'+appId,null)}});
  drBody.querySelector('#drResetApp').onclick=()=>{HalDo.store.set('app_set_'+appId,{});HalDo.util.toast('✅ zurückgesetzt');closeDrawer()};
}

function getAppContext(appId){
  const s=HalDo.store.get('app_set_'+appId,{});
  if(appId==='fahrschule')return{app:'fahrschule',class:s.class||'B',info:'PKW'};
  if(appId==='blitzer')return{app:'blitzer',limit:+s.limit||120};
  if(appId==='arztbuch')return{app:'arztbuch'};
  if(appId==='nav')return{app:'nav',dest:'Berlin'};
  return{app:appId};
}

/* ═══════════════════════════════════════════════════════
   3D KOSMOS (Three.js)
   ═══════════════════════════════════════════════════════ */
function init3DCosmos(){
  if (typeof THREE === 'undefined') {
    console.warn('Three.js fehlt, fallback auf CSS');
    for(let i=0;i<200;i++){const s=document.createElement('div');s.style.cssText=`position:absolute;width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;background:#fff;border-radius:50%;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${Math.random()*.7+.3}`;document.getElementById('cosmos').appendChild(s)}
    return;
  }
  const c=document.getElementById('cosmos');
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
  const renderer=new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  c.appendChild(renderer.domElement);

  const textureLoader = new THREE.TextureLoader();
  textureLoader.crossOrigin = 'anonymous';

  // SONNE
  const sunGeo = new THREE.SphereGeometry(8, 64, 64);
  const sunMat = new THREE.MeshBasicMaterial({color:0xffaa00});
  const sun = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sun);
  // Glow
  const glowGeo = new THREE.SphereGeometry(9.5, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({color:0xff6600, transparent:true, opacity:0.25});
  scene.add(new THREE.Mesh(glowGeo, glowMat));

  // Licht
  const sunLight = new THREE.PointLight(0xffffff, 2, 0, 0);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x222233, 0.6));

  // Planeten (mit echten Texturen wo möglich)
  const planets = [
    {name:'Merkur',size:0.8,dist:15,speed:0.04,color:0x8c7853,tex:null},
    {name:'Venus',size:1.2,dist:20,speed:0.025,color:0xffc649,tex:null},
    {name:'Erde',size:1.3,dist:26,speed:0.02,color:0x4da8ff,tex:'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'},
    {name:'Mars',size:1.0,dist:32,speed:0.018,color:0xc1440e,tex:null},
    {name:'Jupiter',size:3.0,dist:42,speed:0.012,color:0xd8ca9d,tex:null},
    {name:'Saturn',size:2.5,dist:52,speed:0.009,color:0xead6b8,tex:null,ring:true},
    {name:'Uranus',size:1.8,dist:62,speed:0.006,color:0xa8e8ff,tex:null},
    {name:'Neptun',size:1.7,dist:72,speed:0.005,color:0x5b9bd5,tex:null}
  ];

  const planetMeshes = [];
  planets.forEach(p => {
    const geo = new THREE.SphereGeometry(p.size, 32, 32);
    let mat;
    if (p.tex) {
      const tex = textureLoader.load(p.tex);
      mat = new THREE.MeshPhongMaterial({map:tex, color:0xffffff});
    } else {
      mat = new THREE.MeshPhongMaterial({color:p.color});
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.x = p.dist;
    mesh.userData = {angle: Math.random()*Math.PI*2, speed: p.speed, dist: p.dist, name:p.name, size:p.size};
    scene.add(mesh);
    planetMeshes.push(mesh);

    // Umlaufbahn-Linie
    const orbitPts = [];
    for(let i=0;i<=128;i++){const a=(i/128)*Math.PI*2;orbitPts.push(new THREE.Vector3(Math.cos(a)*p.dist,0,Math.sin(a)*p.dist))}
    const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPts);
    const orbitMat = new THREE.LineBasicMaterial({color:0x00e5ff, transparent:true, opacity:0.15});
    scene.add(new THREE.LineLoop(orbitGeo, orbitMat));

    // Saturn-Ring
    if(p.ring){
      const ringGeo = new THREE.RingGeometry(p.size*1.5, p.size*2.5, 64);
      const ringMat = new THREE.MeshBasicMaterial({color:0xc9b896, side:THREE.DoubleSide, transparent:true, opacity:0.6});
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI/2 - 0.3;
      mesh.add(ring);
    }

    // Mond für Erde
    if(p.name==='Erde'){
      const moonGeo = new THREE.SphereGeometry(0.35, 24, 24);
      const moonMat = new THREE.MeshPhongMaterial({color:0xcccccc});
      const moon = new THREE.Mesh(moonGeo, moonMat);
      moon.userData = {angle:0, speed:0.15, dist:2.5};
      mesh.add(moon);
      planetMeshes.push({userData:{isMoon:true, parent:mesh, ...moon.userData}, isMoon:true, mesh:moon});
    }
  });

  // Sterne (Partikel)
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2000;
  const starPos = new Float32Array(starCount*3);
  for(let i=0;i<starCount*3;i+=3){
    starPos[i] = (Math.random()-0.5)*1000;
    starPos[i+1] = (Math.random()-0.5)*1000;
    starPos[i+2] = (Math.random()-0.5)*1000;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({color:0xffffff, size:1.2, sizeAttenuation:true});
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // Kamera
  camera.position.set(0, 25, 60);
  camera.lookAt(0,0,0);

  // Resize
  window.addEventListener('resize', ()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});

  // Animation
  let time = 0;
  function animate(){
    requestAnimationFrame(animate);
    time += 0.01;
    sun.rotation.y += 0.005;
    planetMeshes.forEach(pm => {
      if (pm.isMoon) {
        pm.mesh.userData.angle += pm.mesh.userData.speed * 0.01;
        pm.mesh.position.x = Math.cos(pm.mesh.userData.angle) * pm.mesh.userData.dist;
        pm.mesh.position.z = Math.sin(pm.mesh.userData.angle) * pm.mesh.userData.dist;
      } else {
        pm.userData.angle += pm.userData.speed * 0.01;
        pm.position.x = Math.cos(pm.userData.angle) * pm.userData.dist;
        pm.position.z = Math.sin(pm.userData.angle) * pm.userData.dist;
        pm.rotation.y += 0.01;
      }
    });
    stars.rotation.y += 0.0002;
    camera.position.x = Math.sin(time * 0.1) * 5;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
  }
  animate();
  HalDo.three.cosmosScene = scene;
  HalDo.three.cosmosCamera = camera;
  HalDo.three.cosmosRenderer = renderer;
}

      else if(it.type==='color')html+=`<div class="kv"><span>${it.label}</span><input type="color" data-set="${it.key}" value="${val}" style="width:44px;height:32px;border-radius:8px;border:1px solid var(--c-border)"></div>`;

  }};

function init3DAnatomy(w){
  const container = w.querySelector('#anatomie3d');
  if(!container || typeof THREE === 'undefined') return;
  // Clear existing
  container.querySelectorAll('canvas').forEach(c=>c.remove());
  const info = w.querySelector('#organInfo');
  const oName = w.querySelector('#organName');
  const oText = w.querySelector('#organText');

  const scene = new THREE.Scene();
  const width = container.clientWidth || 400;
  const height = container.clientHeight || 400;
  const camera = new THREE.PerspectiveCamera(50, width/height, 0.1, 100);
  camera.position.set(0, 1, 6);
  camera.lookAt(0, 0, 0);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  container.insertBefore(renderer.domElement, container.firstChild);

  const ambient = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(5, 10, 7);
  scene.add(dir);
  const fill = new THREE.DirectionalLight(0x00e5ff, 0.5);
  fill.position.set(-5, 0, 5);
  scene.add(fill);

  // Body parts (clickable, named)
  const parts = [];
  function addOrgan(name, position, size, color, geometry='sphere'){
    let geo;
    if(geometry==='sphere') geo = new THREE.SphereGeometry(size, 24, 24);
    else if(geometry==='box') geo = new THREE.BoxGeometry(size*1.5, size, size);
    else if(geometry==='cylinder') geo = new THREE.CylinderGeometry(size*0.7, size*0.7, size*1.5, 24);
    const mat = new THREE.MeshPhongMaterial({color, transparent:true, opacity:0.85});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(...position);
    mesh.userData = {name, color, originalColor:color};
    scene.add(mesh);
    parts.push(mesh);
    return mesh;
  }

  // Kopf (Kugel)
  addOrgan('kopf', [0, 2.2, 0], 0.55, 0xffe0bd);
  // Gehirn (innen)
  const gehirn = addOrgan('gehirn', [0, 2.3, 0], 0.35, 0xff88aa);
  // Hals
  addOrgan('hals', [0, 1.55, 0], 0.2, 0xffe0bd, 'cylinder');
  // Torso
  addOrgan('torso', [0, 0.6, 0], 0.9, 0xffe0bd, 'box');
  // Herz
  addOrgan('herz', [-0.15, 0.85, 0.1], 0.18, 0xff4466);
  // Lunge (2x)
  addOrgan('lunge', [-0.35, 1.0, 0], 0.22, 0xffb0c0);
  addOrgan('lunge', [0.35, 1.0, 0], 0.22, 0xffb0c0);
  // Leber
  addOrgan('leber', [0.3, 0.55, 0.05], 0.28, 0xa0522d);
  // Magen
  addOrgan('magen', [-0.3, 0.35, 0.1], 0.2, 0xffaa88);
  // Nieren (2x)
  addOrgan('niere', [-0.4, 0.3, -0.2], 0.15, 0x8b0000);
  addOrgan('niere', [0.4, 0.3, -0.2], 0.15, 0x8b0000);
  // Darm
  addOrgan('darm', [0, 0.1, 0.1], 0.35, 0xffaa00);
  // Pankreas
  addOrgan('pankreas', [0, 0.5, -0.1], 0.12, 0xffdd88);
  // Milz
  addOrgan('milz', [-0.45, 0.6, 0.05], 0.14, 0x800080);
  // Arme
  addOrgan('arm_l', [-0.85, 0.8, 0], 0.15, 0xffe0bd, 'cylinder').rotation.z = 0.3;
  addOrgan('arm_r', [0.85, 0.8, 0], 0.15, 0xffe0bd, 'cylinder').rotation.z = -0.3;
  // Beine
  addOrgan('bein_l', [-0.25, -0.5, 0], 0.18, 0xffe0bd, 'cylinder');
  addOrgan('bein_r', [0.25, -0.5, 0], 0.18, 0xffe0bd, 'cylinder');

  // Raycaster
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('click', (e)=>{
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(parts);
    if (hits.length > 0) {
      const hit = hits[0].object;
      const name = hit.userData.name;
      // Highlight
      parts.forEach(p=>p.material.emissive = new THREE.Color(0x000000));
      hit.material.emissive = new THREE.Color(0x00e5ff);
      // Info panel
      const data = ORGAN_INFO[name];
      if (data) {
        oName.textContent = data.name;
        oText.innerHTML = `<div>${data.info}</div><div style="margin-top:6px"><b style="color:#ff4466">Krankheiten:</b> ${data.krankheiten.join(', ')}</div><div style="margin-top:4px"><b style="color:#4dff88">Medikamente:</b> ${data.medikamente.join(', ')}</div>`;
        info.classList.add('show');
        if (HalDo.store.get('voice_on',true)) HalDo.voice.speak(data.name + '. ' + data.info, 'de');
      }
    }
  });

  // Orbit (manual rotation via touch)
  let rotY = 0, rotX = 0, dragging = false, lastX = 0, lastY = 0;
  renderer.domElement.addEventListener('pointerdown', e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
  renderer.domElement.addEventListener('pointermove', e=>{if(!dragging)return;rotY+=(e.clientX-lastX)*0.01;rotX+=(e.clientY-lastY)*0.01;rotX=Math.max(-0.5,Math.min(0.5,rotX));lastX=e.clientX;lastY=e.clientY});
  renderer.domElement.addEventListener('pointerup', ()=>{dragging=false});

  const resetBtn = w.querySelector('#abReset');
  if(resetBtn) resetBtn.onclick = ()=>{rotY=0;rotX=0};
  const askBtn = w.querySelector('#abAsk');
  if(askBtn) askBtn.onclick = ()=>openAIDrawer('arztbuch');

  // Resize
  const obs = new ResizeObserver(()=>{const wt=container.clientWidth,ht=container.clientHeight;if(wt&&ht){camera.aspect=wt/ht;camera.updateProjectionMatrix();renderer.setSize(wt,ht)}});
  obs.observe(container);

  // Animation
  let time = 0;
  function animate(){
    if(!container.isConnected){obs.disconnect();return}
    requestAnimationFrame(animate);
    time += 0.01;
    // Auto rotate slightly
    const group = scene;
    parts.forEach(p=>{p.rotation.y += 0.002});
    camera.position.x = Math.sin(rotY) * 6;
    camera.position.z = Math.cos(rotY) * 6;
    camera.position.y = 1 + rotX * 3;
    camera.lookAt(0, 0.5, 0);
    renderer.render(scene, camera);
  }
  animate();
}

/* ==== BLITZER ==== */
APPS.blitzer = () => {
  const s = HalDo.store.get('app_set_blitzer',{});
  const lang = HalDo.i18n.langFor('blitzer');
  const limit = +s.limit||120;
  const voiceWarn = s.voiceWarn!==false;
  const dangers = {de:['Achtung Blitzer!','Stau voraus!','Baustelle!','Unfallstelle!','Wildwechsel!','Glatteis!','Nebel!','Schulweg!','Geisterfahrer!','Ölspur'],en:['Speed camera!','Traffic jam!','Construction!','Accident!','Wild animals!','Ice!','Fog!','School!','Wrong-way!','Oil spill'],tr:['Radar!','Trafik!','İnşaat!','Kaza!','Yaban!','Buz!','Sis!','Okul!','Ters yön!','Yağ!'],ku:['Radar!','Trafîk!','Avahî!','Qeza!','Ajal!','Cemed!','Mij!','Dibistan!','Ajovan xelet!','Rûn!'],ar:['رادار!','ازدحام!','أشغال!','حادث!','حيوانات!','جليد!','ضباب!','مدرسة!','عكسي!','زيت!']};
  const langDangers = dangers[lang]||dangers.de;
  const cx=100,cy=100,r=82,startDeg=135;
  const toRad=d=>d*Math.PI/180;
  const pt=(deg,rr)=>[cx+rr*Math.cos(toRad(deg)),cy+rr*Math.sin(toRad(deg))];
  let ticks='';
  for(let i=0;i<=26;i++){const ang=startDeg+(i/26)*270;const[x1,y1]=pt(ang,r);const[x2,y2]=pt(ang,r-6);ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i%5===0?'#fff':'rgba(255,255,255,.4)'}" stroke-width="${i%5===0?2:1}"/>`}
  let lastIdx=-1;
  return {title:'🚦 Blitzer v2',html:`<div class="centered"><div style="position:relative;width:280px;height:280px"><svg viewBox="0 0 200 200" style="width:100%;height:100%"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/><defs><linearGradient id="agrad"><stop offset="0%" stop-color="#00e5ff"/><stop offset="50%" stop-color="#b478ff"/><stop offset="100%" stop-color="#ff4466"/></linearGradient></defs><path id="arcProg" fill="none" stroke="url(#agrad)" stroke-width="10" stroke-linecap="round"/>${ticks}<g id="needle" style="transform-origin:100px 100px;transition:transform .12s"><line x1="100" y1="100" x2="${pt(startDeg,r-10)[0]}" y2="${pt(startDeg,r-10)[1]}" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="100" r="8" fill="#fff" stroke="#00e5ff" stroke-width="2"/></g></svg><div style="position:absolute;top:62%;left:50%;transform:translate(-50%,0);text-align:center"><div id="spd" style="font-size:42px;font-weight:800;color:#fff;text-shadow:0 0 12px var(--accent1)">0</div><div class="small" style="font-size:9px">km/h</div></div></div><div style="display:flex;gap:10px;margin-top:12px;align-items:center"><div style="padding:6px 14px;background:#fff;color:#000;border-radius:50%;font-weight:900;font-size:18px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:5px solid #ff2244">${limit}</div><div style="padding:8px 14px;background:#4da8ff;color:#fff;border-radius:10px;font-weight:700;font-size:12px">A7 → Frankfurt</div></div><input type="range" min="0" max="260" value="0" id="spdIn" style="width:100%;margin-top:12px"><div id="warnBox" style="margin-top:12px;padding:12px;background:rgba(0,229,255,.08);border-radius:10px;font-size:13px;min-height:48px;width:100%;text-align:center;border-left:4px solid var(--accent1)">${t('speed')} anpassen</div><div class="small" style="margin-top:8px;font-size:10px">🔊 ${voiceWarn?'KI aktiv':'aus'}</div></div>`,onMount:(w)=>{
    const upd=()=>{const v=+w.querySelector('#spdIn').value;w.querySelector('#spd').textContent=v;const sweep=(v/260)*270;const endDeg=startDeg+sweep;const[sx,sy]=pt(startDeg,r);const[ex,ey]=pt(endDeg,r);const large=sweep>180?1:0;w.querySelector('#arcProg').setAttribute('d',`M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}`);w.querySelector('#needle').style.transform=`rotate(${sweep}deg)`;const wb=w.querySelector('#warnBox');let msg='✓ OK',col='#4dff88';if(v>limit+10){msg=`⚠️ +${v-limit}`;col='#ff4466'}else if(v>limit){msg=`⚡ +${v-limit}`;col='#ffcc00'}const di=Math.floor(v/20);if(v>=100&&di!==lastIdx){lastIdx=di;const d=langDangers[Math.floor(Math.random()*langDangers.length)];msg='🚨 '+d;col='#ff4466';HalDo.voice.beep(880,.15);setTimeout(()=>HalDo.voice.beep(660,.15),180);if(voiceWarn)HalDo.voice.speak(d,lang);wb.style.animation='pulseWarn .6s 2';setTimeout(()=>wb.style.animation='',1200)}else if(v<100)lastIdx=-1;wb.textContent=msg;wb.style.color=col;wb.style.borderLeftColor=col};
    w.querySelector('#spdIn').oninput=upd;upd();
  }};
};

APPS.chat = () => {
  const history = HalDo.store.get('chat_history',[]);
  const lang = HalDo.i18n.langFor('chat');
  return {title:'💬 '+t('chat'),html:`<div id="chatLog" style="overflow-y:auto;padding:8px;height:260px;margin-bottom:8px;background:rgba(0,0,0,.25);border-radius:10px;border:1px solid var(--c-border)"></div><div class="row" style="margin-bottom:6px"><input class="inp" id="chatIn" placeholder="${t('hello')}..." style="margin:0"><button class="win-btn" id="chatMic">🎙</button><button class="btn" id="chatSend" style="padding:8px 14px">➤</button></div><div class="row"><button class="btn ghost" id="chatVoice" style="flex:1;font-size:11px">🔊 <span id="voiceState">${HalDo.store.get('voice_on',true)?'An':'Aus'}</span></button><button class="btn ghost" id="chatClear" style="flex:1;font-size:11px">🗑</button></div>`,onMount:(w)=>{

    w.querySelector('#chatSend').onclick=()=>{const i=w.querySelector('#chatIn');send(i.value);i.value=''};
    w.querySelector('#chatIn').onkeydown=(e)=>{if(e.key==='Enter'){send(e.target.value);e.target.value=''}};
    w.querySelector('#chatMic').onclick=()=>{w.querySelector('#chatMic').textContent='🔴';HalDo.voice.listen(txt=>{send(txt);w.querySelector('#chatMic').textContent='🎙'},lang)};
    w.querySelector('#chatVoice').onclick=()=>{vOn=!vOn;HalDo.store.set('voice_on',vOn);w.querySelector('#voiceState').textContent=vOn?'An':'Aus';if(!vOn)window.speechSynthesis?.cancel()};
    w.querySelector('#chatClear').onclick=()=>{history.length=0;HalDo.store.set('chat_history',[]);render()};
  }};
};
