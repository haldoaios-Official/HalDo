<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="HalDo AI OS — Dein persönliches KI-Betriebssystem">
  <title>🦚 HalDo AI OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦚</text></svg>">

  <!-- ═══════════════════════════════════════════════════════
       GLOBAL STYLES
       ═══════════════════════════════════════════════════════ -->
  <style>
    /* Theme-Variablen (werden von theme.js überschrieben) */
    :root {
      --p1: #00e5ff;
      --p2: #4da8ff;
      --p3: #b478ff;
      --bg: #050810;
      --bg-2: #0a0f1a;
      --card: rgba(255,255,255,.03);
      --text: #e8ecff;
      --text-dim: #a8b0cc;
      --text-mute: #6b7390;
      --border-soft: 1px solid rgba(255,255,255,.08);
      --glow: 0 0 24px rgba(0,229,255,.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background .35s ease, color .35s ease;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }

    /* ═══ APP SHELL ═══ */
    #haldo-root {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #haldo-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,.2);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.05);
      flex-shrink: 0;
      z-index: 100;
    }

    #haldo-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--p1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #haldo-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      padding-bottom: 90px;
      scroll-behavior: smooth;
    }

    #haldo-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--bg-2);
      border-right: 1px solid rgba(255,255,255,.08);
      transform: translateX(-100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 9999;
      overflow-y: auto;
      padding: 16px;
    }

    #haldo-sidebar.open { transform: translateX(0); }

    #haldo-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 9998;
    }
    #haldo-overlay.open { opacity: 1; pointer-events: auto; }

    /* ═══ UI COMPONENTS (für alle Apps) ═══ */
    .card {
      padding: 16px;
      background: var(--card);
      border: var(--border-soft);
      border-radius: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .card h3 {
      font-size: 15px;
      font-weight: 900;
      color: var(--p1);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      font-size: 10.5px;
      color: var(--text-mute);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      display: block;
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      background: rgba(0,0,0,.3);
      border: var(--border-soft);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--p1);
      box-shadow: 0 0 0 3px rgba(0,229,255,.1);
    }

    .btn {
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--p1), var(--p3));
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
    .btn:active { transform: translateY(0); }

    .btn.sec {
      background: rgba(255,255,255,.05);
      color: var(--text);
      border: var(--border-soft);
    }

    .btn.danger {
      background: linear-gradient(135deg, #ff8080, #ff4d4d);
      color: #fff;
    }

    .btn.full { width: 100%; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      padding: 9px 14px;
      background: rgba(255,255,255,.04);
      border: var(--border-soft);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
      font-family: inherit;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--p1), var(--p3));
      color: #000;
      border-color: transparent;
    }

    /* ═══ INIT LOADER ═══ */
    #haldo-loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity .4s;
    }

    #haldo-loader.hide { opacity: 0; pointer-events: none; }

    #haldo-loader .logo {
      font-size: 72px;
      animation: haldoBounce 1.2s infinite;
    }

    #haldo-loader .txt {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-mute);
      font-weight: 800;
      letter-spacing: 2px;
    }

    @keyframes haldoBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    /* ═══ RIPPLE ═══ */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .6; transform: scale(1.15); }
    }
  </style>
</head>
