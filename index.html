<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HalDo AI OS Pro Max</title>
<style>
:root{
  --primary:#00e5ff; --secondary:#4da8ff; --accent:#b478ff; --gold:#ffd700;
  --bg:#03060e; --text:#e0f2ff; --muted:#7a95b8;
  --win-bg:rgba(8,18,36,.72); --win-border:rgba(0,229,255,.4);
  --blur:24px; --glow:0 0 24px rgba(0,229,255,.55);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --fs:14px; --radius:18px;
}
[data-theme="cyborg"]{--primary:#ff78c8;--secondary:#b478ff;--accent:#ff78c8;--win-border:rgba(255,120,200,.5);--glow:0 0 24px rgba(255,120,200,.55)}
[data-theme="gold"]{--primary:#ffd700;--secondary:#ffb300;--accent:#ffe97a;--win-border:rgba(255,215,0,.55);--glow:0 0 24px rgba(255,215,0,.55)}
[data-theme="matrix"]{--primary:#00ff88;--secondary:#00cc66;--accent:#66ffb3;--win-border:rgba(0,255,136,.4);--glow:0 0 24px rgba(0,255,136,.55)}
[data-theme="crimson"]{--primary:#ff3d5a;--secondary:#ff6b81;--accent:#ffa0b0;--win-border:rgba(255,61,90,.45);--glow:0 0 24px rgba(255,61,90,.55)}
[data-theme="sunset"]{--primary:#ff9a3c;--secondary:#ff6a88;--accent:#ffd76a;--win-border:rgba(255,154,60,.45);--glow:0 0 24px rgba(255,154,60,.55)}
[data-theme="ice"]{--primary:#a0e8ff;--secondary:#ccefff;--accent:#ffffff;--win-border:rgba(160,232,255,.5);--glow:0 0 24px rgba(160,232,255,.55)}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:var(--fs);user-select:none;-webkit-user-select:none}

#kosmos{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;background:radial-gradient(ellipse at center,#071530,#03060e 70%);
  transition:opacity .8s ease,visibility .8s}
#splash.hide{opacity:0;visibility:hidden}
#splashLogo{width:140px;height:140px;border-radius:32px;
  background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:64px;
  box-shadow:0 0 60px var(--primary),0 0 120px var(--accent);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 60px var(--primary)}50%{transform:scale(1.06);box-shadow:0 0 90px var(--accent)}}
#splashTitle{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--primary);
  text-shadow:0 0 20px var(--primary);text-align:center;padding:0 20px}
#splashSub{font-size:12px;color:var(--muted);letter-spacing:3px;text-align:center}
#splashGreet{font-size:13px;color:var(--text);opacity:.85;text-align:center;max-width:80vw;
  line-height:1.6;padding:0 20px}
#splashBar{width:60vw;max-width:320px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#splashBarFill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:2px;transition:width .3s;box-shadow:0 0 12px var(--primary)}

/* ===== TOP BAR ===== */
#topbar{position:fixed;top:0;left:0;right:0;height:calc(52px + var(--safe-top));z-index:800;
  padding-top:var(--safe-top);display:flex;align-items:center;justify-content:space-between;
  padding-left:12px;padding-right:12px;background:linear-gradient(180deg,rgba(3,6,14,.92),rgba(3,6,14,.5));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--win-border)}
#logoBtn{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 8px;border-radius:10px;
  transition:background .2s;background:transparent;border:none;color:var(--text)}
#logoBtn:active{background:rgba(0,229,255,.15)}
#logoBox{width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 0 14px var(--primary)}
#logoText{font-weight:800;font-size:15px;letter-spacing:1px;color:var(--primary);text-shadow:0 0 10px var(--primary)}
#topIcons{display:flex;align-items:center;gap:6px}
.topBtn{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:12px;
  background:rgba(0,229,255,.08);border:1px solid var(--win-border);
  color:var(--primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;backdrop-filter:blur(10px)}
.topBtn:active{background:rgba(0,229,255,.25);transform:scale(.94)}
#clockDisplay{font-size:13px;font-weight:600;color:var(--muted);padding:0 10px;font-variant-numeric:tabular-nums}

/* ===== SIDEBAR ===== */
#sidebar{position:fixed;top:calc(52px + var(--safe-top));left:0;bottom:calc(64px + var(--safe-bottom));
  width:76px;z-index:700;background:rgba(3,6,14,.82);backdrop-filter:blur(20px);
  border-right:1px solid var(--win-border);display:flex;flex-direction:column;
  align-items:center;gap:4px;padding:10px 6px;overflow-y:auto;overflow-x:hidden;
  transition:transform .3s;scrollbar-width:none}
#sidebar::-webkit-scrollbar{display:none}
#sidebar.hidden{transform:translateX(-100%)}
.sideBtn{width:60px;min-height:56px;border-radius:14px;background:transparent;border:none;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:9px;cursor:pointer;transition:all .18s;padding:6px 2px;
  font-family:inherit;font-weight:600}
.sideBtn .icon{font-size:22px;line-height:1}
.sideBtn:active,.sideBtn.active{background:rgba(0,229,255,.15);color:var(--primary);
  box-shadow:0 0 14px rgba(0,229,255,.35)}

/* ===== BOTTOM BAR ===== */
#bottombar{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--safe-bottom));
  z-index:800;padding-bottom:var(--safe-bottom);display:flex;align-items:center;justify-content:center;
  gap:8px;background:linear-gradient(0deg,rgba(3,6,14,.92),rgba(3,6,14,.5));
  backdrop-filter:blur(20px);border-top:1px solid var(--win-border);padding-left:12px;padding-right:12px}
.bottomBtn{flex:1;max-width:140px;height:46px;border-radius:14px;
  background:rgba(0,229,255,.08);border:1.5px solid var(--win-border);
  color:var(--text);font-size:13px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all .2s;backdrop-filter:blur(10px);font-family:inherit}
.bottomBtn:active{transform:scale(.96)}
.bottomBtn.b1{color:var(--primary);box-shadow:0 0 14px rgba(0,229,255,.25)}
.bottomBtn.b2{color:var(--accent);box-shadow:0 0 14px rgba(180,120,255,.25)}
.bottomBtn.b3{color:#ff78c8;box-shadow:0 0 14px rgba(255,120,200,.25)}

/* ===== WINDOW ===== */
#winContainer{position:fixed;inset:calc(52px + var(--safe-top)) 0 calc(64px + var(--safe-bottom)) 0;
  z-index:100;pointer-events:none}
.window{position:absolute;pointer-events:auto;min-width:260px;max-width:calc(100vw - 20px);
  max-height:calc(100vh - 140px);background:var(--win-bg);border:1.5px solid var(--win-border);
  border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  box-shadow:var(--glow),0 20px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;overflow:hidden;
  animation:winIn .25s ease}
@keyframes winIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.window.closing{animation:winOut .2s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.9)}}
.winHeader{height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 6px 0 14px;background:rgba(0,229,255,.06);
  border-bottom:1px solid var(--win-border);cursor:move;flex-shrink:0}
.winTitle{font-size:13px;font-weight:800;color:var(--primary);letter-spacing:.5px;
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 8px var(--primary)}
.winActions{display:flex;gap:4px;flex-shrink:0}
.winBtn{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:10px;
  background:transparent;border:none;color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.winBtn:hover,.winBtn:active{background:rgba(255,255,255,.1)}
.winBtn.close:hover,.winBtn.close:active{background:rgba(255,61,90,.35);color:#fff}
.winContent{flex:1;overflow:auto;padding:16px;line-height:1.5;user-select:text;-webkit-user-select:text}
.winContent::-webkit-scrollbar{width:6px}
.winContent::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;opacity:.5}

/* ===== APP STYLES ===== */
.appBtn{padding:10px 16px;border-radius:12px;background:rgba(0,229,255,.15);
  border:1px solid var(--win-border);color:var(--primary);font-weight:700;
  cursor:pointer;font-family:inherit;font-size:13px;transition:all .15s;min-height:40px}
.appBtn:active{transform:scale(.96);background:rgba(0,229,255,.3)}
.appBtn.small{padding:6px 12px;font-size:12px;min-height:34px}
.appInput{width:100%;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.4);
  border:1px solid var(--win-border);color:var(--text);font-family:inherit;font-size:14px;
  outline:none;margin-bottom:10px;min-height:44px;user-select:text;-webkit-user-select:text}
.appInput:focus{border-color:var(--primary);box-shadow:0 0 12px var(--primary)}
.appRow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  margin-bottom:8px;font-size:13px}
.appRow.done{opacity:.45;text-decoration:line-through}
.appChip{display:inline-block;padding:5px 12px;border-radius:20px;font-size:11px;
  background:rgba(0,229,255,.1);border:1px solid var(--win-border);
  color:var(--primary);margin:2px;cursor:pointer;transition:all .15s}
.appChip:active,.appChip.on{background:rgba(0,229,255,.3)}
.appGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin:8px 0}
.appGridItem{aspect-ratio:1;border-radius:14px;background:rgba(0,229,255,.08);
  border:1px solid var(--win-border);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;
  font-size:9px;font-weight:600;color:var(--text);text-align:center;padding:4px;transition:all .15s}
.appGridItem:active{transform:scale(.94);background:rgba(0,229,255,.2)}
.appGridItem .icon{font-size:22px}
.calcDisplay{background:rgba(0,0,0,.5);border:1px solid var(--win-border);border-radius:12px;
  padding:16px;font-size:26px;font-weight:800;text-align:right;margin-bottom:10px;
  min-height:64px;color:var(--primary);font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;user-select:text;-webkit-user-select:text}
.calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calcBtn{aspect-ratio:1;border-radius:14px;background:rgba(0,229,255,.1);
  border:1px solid var(--win-border);color:var(--text);font-size:18px;
  font-weight:700;cursor:pointer;font-family:inherit;transition:all .12s;min-height:44px}
.calcBtn:active{transform:scale(.92);background:rgba(0,229,255,.3)}
.calcBtn.op{background:rgba(180,120,255,.15);color:var(--accent)}
.calcBtn.eq{background:rgba(0,229,255,.25);color:var(--primary);font-weight:900}

/* ===== SETTINGS MODAL ===== */
#settingsModal{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);display:none;align-items:stretch;justify-content:center;padding:var(--safe-top) 0 var(--safe-bottom) 0}
#settingsModal.show{display:flex}
#settingsPanel{width:100%;max-width:720px;background:var(--win-bg);
  border-left:1.5px solid var(--win-border);border-right:1.5px solid var(--win-border);
  backdrop-filter:blur(var(--blur));display:flex;flex-direction:column;overflow:hidden}
#settingsHead{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--win-border);background:rgba(0,229,255,.08)}
#settingsHead h2{font-size:16px;color:var(--primary);text-shadow:0 0 10px var(--primary)}
#settingsBody{flex:1;overflow-y:auto;padding:8px 12px 20px}
#settingsBody::-webkit-scrollbar{width:5px}
#settingsBody::-webkit-scrollbar-thumb{background:var(--primary);border-radius:2px}
.setSection{margin-bottom:6px;border:1px solid var(--win-border);border-radius:12px;
  overflow:hidden;background:rgba(0,229,255,.03)}
.setSectionHead{padding:14px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;font-weight:700;font-size:13px;color:var(--text);transition:background .15s}
.setSectionHead:active{background:rgba(0,229,255,.1)}
.setSectionHead .letter{display:inline-block;width:26px;height:26px;border-radius:8px;
  background:var(--primary);color:var(--bg);font-weight:900;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;margin-right:10px}
.setSectionBody{display:none;padding:0 14px 14px;border-top:1px solid rgba(255,255,255,.06)}
.setSection.open .setSectionBody{display:block}
.setRow{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.setRow:last-child{border-bottom:none}
.setRow label{flex:1;padding-right:12px;color:var(--text)}
.toggle{width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.15);
  position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:var(--primary);box-shadow:0 0 12px var(--primary)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.setSelect{padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.4);
  border:1px solid var(--win-border);color:var(--text);font-family:inherit;font-size:12px;
  cursor:pointer;outline:none;min-height:36px}
.setChips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
.setChip{padding:6px 12px;border-radius:20px;background:rgba(0,229,255,.08);
  border:1px solid var(--win-border);color:var(--muted);font-size:11px;
  cursor:pointer;transition:all .15s;font-family:inherit;font-weight:600}
.setChip.on{background:var(--primary);color:var(--bg);box-shadow:0 0 10px var(--primary)}

/* ===== TOAST ===== */
#toastWrap{position:fixed;left:0;right:0;bottom:calc(80px + var(--safe-bottom));z-index:2000;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{padding:10px 18px;border-radius:14px;background:rgba(0,229,255,.95);
  color:#03060e;font-weight:700;font-size:13px;box-shadow:0 8px 30px rgba(0,229,255,.5);
  animation:toastIn .3s ease;pointer-events:auto;max-width:90vw;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.success{background:rgba(0,255,136,.95);box-shadow:0 8px 30px rgba(0,255,136,.5)}
.toast.error{background:rgba(255,61,90,.95);color:#fff;box-shadow:0 8px 30px rgba(255,61,90,.5)}
.toast.warn{background:rgba(255,180,60,.95);box-shadow:0 8px 30px rgba(255,180,60,.5)}

/* ===== AI CHAT PANEL ===== */
#aiPanel{position:fixed;right:0;top:calc(52px + var(--safe-top));bottom:calc(64px + var(--safe-bottom));
  width:min(380px,100vw);z-index:850;background:var(--win-bg);
  backdrop-filter:blur(var(--blur));border-left:1.5px solid var(--win-border);
  transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
#aiPanel.show{transform:translateX(0)}
#aiPanel .aiHead{padding:14px;border-bottom:1px solid var(--win-border);
  display:flex;align-items:center;justify-content:space-between}
#aiPanel .aiHead h3{font-size:14px;color:var(--primary);text-shadow:0 0 10px var(--primary)}
#aiMessages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;
  user-select:text;-webkit-user-select:text;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:var(--primary);color:#03060e;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.08);
  border:1px solid var(--win-border);color:var(--text);border-bottom-left-radius:4px}
#aiInputWrap{padding:10px;border-top:1px solid var(--win-border);display:flex;gap:6px}
#aiInput{flex:1;padding:10px;border-radius:12px;background:rgba(0,0,0,.4);
  border:1px solid var(--win-border);color:var(--text);font-family:inherit;font-size:13px;
  outline:none;min-height:42px;user-select:text;-webkit-user-select:text}
#aiSend{width:44px;height:44px;border-radius:12px;background:var(--primary);
  border:none;color:#03060e;font-size:18px;cursor:pointer;font-weight:900}
</style>
</head>
<body>

<!-- KOSMOS BACKGROUND -->
<canvas id="kosmos"></canvas>

<!-- SPLASH -->
<div id="splash">
  <div id="splashLogo">🦚</div>
  <div id="splashTitle">HalDo AI OS Pro Max</div>
  <div id="splashSub">PRÄSENTIERT A HALIL DONMA</div>
  <div id="splashGreet">Willkommen a HalDo AI OS Professionelle …<br>Dein lebendiges Betriebssystem erwacht ✨</div>
  <div id="splashBar"><div id="splashBarFill"></div></div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <button id="logoBtn"><div id="logoBox">🦚</div><span id="logoText">HalDo</span></button>
  <div id="topIcons">
    <span id="clockDisplay">--:--</span>
    <button class="topBtn" id="btnSettings" title="Einstellungen">⚙️</button>
  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <button class="sideBtn active" data-nav="home"><span class="icon">🏠</span><span>Home</span></button>
  <button class="sideBtn" data-nav="apps"><span class="icon">📱</span><span>Apps</span></button>
  <button class="sideBtn" data-nav="system"><span class="icon">⚙️</span><span>System</span></button>
  <button class="sideBtn" data-nav="chat"><span class="icon">💬</span><span>Chat</span></button>
  <button class="sideBtn" data-nav="files"><span class="icon">📁</span><span>Files</span></button>
  <button class="sideBtn" data-nav="setup"><span class="icon">🔧</span><span>Setup</span></button>
  <button class="sideBtn" data-nav="info"><span class="icon">ℹ️</span><span>Info</span></button>
</div>

<!-- WINDOWS -->
<div id="winContainer"></div>

<!-- BOTTOM BAR -->
<div id="bottombar">
  <button class="bottomBtn b1" id="btnChat">💬 Chat</button>
  <button class="bottomBtn b2" id="btnAI">🤖 AI</button>
  <button class="bottomBtn b3" id="btnCyborg">⚡ CYBORG</button>
</div>

<!-- AI PANEL -->
<div id="aiPanel">
  <div class="aiHead">
    <h3>🤖 HalDo AI</h3>
    <button class="winBtn close" id="aiClose">✕</button>
  </div>
  <div id="aiMessages">
    <div class="msg bot">Hallo Bruder! Ich bin HalDo AI. Sag „Hi HalDo" und ich antworte dir. 🦚</div>
  </div>
  <div id="aiInputWrap">
    <input id="aiInput" placeholder="Schreib oder sag: Hi HalDo…" />
    <button id="aiSend">➤</button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div id="settingsModal">
  <div id="settingsPanel">
    <div id="settingsHead">
      <h2>⚙️ Einstellungen A–Z</h2>
      <button class="winBtn close" id="setClose">✕</button>
    </div>
    <div id="settingsBody"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toastWrap"></div>

<script>
/* ============================================================
   HALDO AI OS PRO MAX — Phase 1 Foundation
   Clean rebuild. Keine Altlasten.
   ============================================================ */

/* ---------- SOUND LIBRARY (28 Töne, Web Audio API) ---------- */
const HalDoSounds = (() => {
  let ctx;
  const init = () => { if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; };
  const tones = {
    click:    {f:880,  t:.05, w:'sine'},
    tap:      {f:660,  t:.04, w:'sine'},
    open:     {f:520,  t:.18, w:'triangle'},
    close:    {f:340,  t:.15, w:'triangle'},
    success:  {f:880,  t:.25, w:'sine',   seq:[660,880,1100]},
    error:    {f:220,  t:.35, w:'sawtooth',seq:[300,220,180]},
    warning:  {f:440,  t:.3,  w:'square', seq:[440,330,440]},
    notify1:  {f:1200, t:.15, w:'sine'},

    receive:  {f:800,  t:.2,  w:'sine',   seq:[800,600]},
    startup:  {f:440,  t:.6,  w:'sine',   seq:[440,660,880,1100]},
    shutdown: {f:440,  t:.6,  w:'sine',   seq:[1100,880,660,440]},
    sos:      {f:1000, t:.9,  w:'square', seq:[1000,0,1000,0,1000]},
    tick:     {f:2000, t:.03, w:'square'},
    heart:    {f:600,  t:.2,  w:'sine',   seq:[600,800,600]},
    dream:    {f:523,  t:.7,  w:'sine',   seq:[523,659,784,1046]},
    victory:  {f:784,  t:.6,  w:'sine',   seq:[523,659,784,1046,1318]},
    space:    {f:120,  t:.9,  w:'sine'},
    laser:    {f:2000, t:.1,  w:'sawtooth',seq:[2000,200]},
    coin:     {f:1200, t:.2,  w:'square', seq:[1200,1800]}
  };
  const play = (name='click', vol=.15) => {
    try {
      const c = init();
      if(c.state==='suspended') c.resume();
      const T = tones[name] || tones.click;
      const seq = T.seq || [T.f];
      seq.forEach((freq, i) => {
        if(freq===0) return;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = T.w; o.frequency.value = freq;
        const start = c.currentTime + i * (T.t/seq.length);
        const dur = T.t/seq.length;
        g.gain.setValueAtTime(0, start);
        g.gain.linearRampToValueAtTime(vol, start + .01);
        g.gain.exponentialRampToValueAtTime(.001, start + dur);
        o.connect(g); g.connect(c.destination);
        o.start(start); o.stop(start + dur);
      });
    } catch(e){}
  };
  return { play, list:()=>Object.keys(tones) };
})();

/* ---------- WINDOW MANAGER ---------- */
const HalDoWindows = (() => {
  let zBase = 200;
  let idc = 0;
  const container = document.getElementById('winContainer');
  const focused = new Set();

  const open = (appId, options = {}) => {
    const app = HalDoApps.find(appId) || {id:appId, n:options.title||'App', i:options.icon||'📱'};
    // Existierendes Fenster fokussieren
    const existing = document.querySelector(`.window[data-appid="${appId}"]`);
    if(existing){ focus(existing); return; }

    const win = document.createElement('div');
    win.className = 'window';
    win.dataset.appid = appId;
    win.style.zIndex = ++zBase;
    const w = options.width || Math.min(520, window.innerWidth - 20);
    const maxH = window.innerHeight - 130;
    win.style.width = w + 'px';
    win.style.top = '20px';
    win.style.left = Math.max(10, (window.innerWidth - w) / 2) + 'px';

    win.innerHTML = `
      <div class="winHeader">
        <div class="winTitle">${app.i||'📱'} ${app.n}</div>
        <div class="winActions">
          <button class="winBtn" data-act="min" title="Minimieren">—</button>
          <button class="winBtn close" data-act="close" title="Schließen">✕</button>
        </div>
      </div>
      <div class="winContent"></div>`;

    container.appendChild(win);
    const content = win.querySelector('.winContent');

    // App-Content rendern
    const renderer = HalDoAppRenderers[appId] || HalDoAppRenderers._default;
    try { renderer(content, app); } catch(e){
      content.innerHTML = `<div style="color:var(--muted);text-align:center;padding:20px">Fehler beim Laden: ${e.message}</div>`;
    }

    // Buttons
    win.querySelector('[data-act="close"]').onclick = () => close(win);
    win.querySelector('[data-act="min"]').onclick = () => {
      win.style.display = 'none';
      toast('Minimiert: ' + app.n);
    };
    win.addEventListener('pointerdown', () => focus(win));

    // Drag auf Header (nur Mittlere Zone)
    const header = win.querySelector('.winHeader');
    let dragging = false, offX = 0, offY = 0;
    header.addEventListener('pointerdown', e => {
      if(e.target.closest('button')) return;
      const rect = win.getBoundingClientRect();
      const relX = e.clientX - rect.left;
      // Nur mittlere Zone (50px von links/rechts)
      if(relX < 50 || relX > rect.width - 50) return;
      dragging = true;
      offX = e.clientX - rect.left;
      offY = e.clientY - rect.top;
      win.style.zIndex = ++zBase;
      header.setPointerCapture(e.pointerId);
    });
    header.addEventListener('pointermove', e => {
      if(!dragging) return;
      let x = e.clientX - offX;
      let y = e.clientY - offY;
      x = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, x));
      y = Math.max(52, Math.min(window.innerHeight - 100, y));
      win.style.left = x + 'px';
      win.style.top = y + 'px';
    });
    header.addEventListener('pointerup', () => dragging = false);
    header.addEventListener('pointercancel', () => dragging = false);

    // Splash-Welcome sound + toast
    HalDoSounds.play('open');
    setTimeout(() => toast(`Willkommen bei ${app.n} – präsentiert von Halil Donma`), 150);
  };

  const focus = (win) => {
    win.style.zIndex = ++zBase;
  };

  const close = (win) => {
    if(!win) return;
    win.classList.add('closing');
    HalDoSounds.play('close');
    setTimeout(() => win.remove(), 200);
  };

  const closeAll = () => {
    document.querySelectorAll('.window').forEach(w => w.remove());
  };

  return {open, close, closeAll, focus};
})();

/* ---------- TOAST ---------- */
function toast(msg, type = '') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2200);
  setTimeout(() => el.remove(), 2600);
}

    b.className = 'calcBtn ' + cls;

      disp.textContent = expr || '0';
    };

/* TIMER */
HalDoAppRenderers.timer = (el) => {
  let remaining = 0, timerId = null;
  el.innerHTML = `
    <div class="calcDisplay" id="tDisp" style="text-align:center">00:00</div>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      ${[60,300,600,1500].map(s=>`<button class="appBtn small" data-s="${s}">${s/60}min</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px">
      <button class="appBtn" id="tStart" style="flex:1">▶ Start</button>
      <button class="appBtn" id="tReset" style="flex:1">↺ Reset</button>
    </div>`;
  const disp = el.querySelector('#tDisp');
  const upd = () => {
    const m = Math.floor(remaining/60), s = remaining%60;
    disp.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  };
  el.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    remaining = +b.dataset.s; upd(); HalDoSounds.play('tap');
  });
  el.querySelector('#tStart').onclick = () => {
    if(timerId) return;
    if(remaining <= 0) return;
    HalDoSounds.play('notify2');
    timerId = setInterval(() => {
      remaining--;
      if(remaining % 60 === 0 && remaining > 0) HalDoSounds.play('tick');
      upd();
      if(remaining <= 0) {
        clearInterval(timerId); timerId = null;
        HalDoSounds.play('alarm');
        toast('⏰ Timer abgelaufen!', 'success');
      }
    }, 1000);
  };
  el.querySelector('#tReset').onclick = () => {
    clearInterval(timerId); timerId = null; remaining = 0; upd();
    HalDoSounds.play('drop');
  };
};

/* POMODORO */
HalDoAppRenderers.pomodoro = (el) => {
  let phase = 'work', remaining = 25*60, timerId = null;
  el.innerHTML = `
    <div class="calcDisplay" id="pDisp" style="text-align:center">25:00</div>
    <div style="text-align:center;font-size:13px;color:var(--accent);margin-bottom:12px" id="pPhase">Arbeitsphase</div>
    <div style="display:flex;gap:6px">
      <button class="appBtn" id="pStart" style="flex:1">▶</button>

      <button class="appBtn" id="pReset" style="flex:1">↺</button>
    </div>`;
  const disp = el.querySelector('#pDisp'), ph = el.querySelector('#pPhase');
  const upd = () => {
    disp.textContent = String(Math.floor(remaining/60)).padStart(2,'0') + ':' + String(remaining%60).padStart(2,'0');
    ph.textContent = phase === 'work' ? 'Arbeitsphase' : 'Pause';
  };
  el.querySelector('#pStart').onclick = () => {
    if(timerId) return;
    HalDoSounds.play('notify1');
    timerId = setInterval(() => {
      remaining--; upd();
      if(remaining <= 0) {
        clearInterval(timerId); timerId = null;
        HalDoSounds.play('chime');
        toast(phase === 'work' ? '✅ Arbeit fertig! 5 min Pause' : '☕ Pause vorbei! 25 min Arbeit');
        phase = phase === 'work' ? 'break' : 'work';
        remaining = phase === 'work' ? 25*60 : 5*60;
        upd();
      }
    }, 1000);
  };
  el.querySelector('#pStop').onclick = () => { clearInterval(timerId); timerId = null; HalDoSounds.play('tap'); };
  el.querySelector('#pReset').onclick = () => { clearInterval(timerId); timerId = null; phase='work'; remaining=25*60; upd(); HalDoSounds.play('drop'); };

/* PASSWORD */
HalDoAppRenderers.password = (el) => {
  el.innerHTML = `
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <span class="appChip on" data-opt="lower">a-z</span>
      <span class="appChip" data-opt="upper">A-Z</span>
      <span class="appChip" data-opt="num">0-9</span>
      <span class="appChip" data-opt="sym">!@#$</span>
    </div>
    <input type="range" min="4" max="64" value="16" id="pwLen" style="width:100%;margin:10px 0">
    <div style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px">Länge: <span id="pwLenV">16</span></div>
    <div class="calcDisplay" id="pwOut" style="font-size:16px;word-break:break-all;text-align:center">—</div>
    <button class="appBtn" id="pwGen" style="width:100%;margin-top:10px">🔐 Generieren</button>
    <button class="appBtn" id="pwCopy" style="width:100%;margin-top:6px">📋 Kopieren</button>`;
  const opts = new Set(['lower']);
  el.querySelectorAll('[data-opt]').forEach(ch => ch.onclick = () => {
    const o = ch.dataset.opt;
    if(opts.has(o)) opts.delete(o); else opts.add(o);
    ch.classList.toggle('on');
  });
  el.querySelector('#pwLen').oninput = e => el.querySelector('#pwLenV').textContent = e.target.value;
  const gen = () => {
    let chars = '';
    if(opts.has('lower')) chars += 'abcdefghijklmnopqrstuvwxyz';
    if(opts.has('upper')) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if(opts.has('num')) chars += '0123456789';
    if(opts.has('sym')) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if(!chars) chars = 'abcdefghijklmnopqrstuvwxyz';
    const len = +el.querySelector('#pwLen').value;
    let pw = '';
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    for(let i=0;i<len;i++) pw += chars[arr[i] % chars.length];
    el.querySelector('#pwOut').textContent = pw;
    HalDoSounds.play('coin');
  };
  el.querySelector('#pwGen').onclick = gen;
  el.querySelector('#pwCopy').onclick = () => {
    const t = el.querySelector('#pwOut').textContent;
    if(t && t !== '—') { navigator.clipboard?.writeText(t); toast('Kopiert!', 'success'); HalDoSounds.play('success'); }
  };
  gen();
};

HalDoAppRenderers.weather = (el) => {
  el.innerHTML = `
    <input class="appInput" id="wCity" placeholder="Stadt (z.B. Berlin)…" value="Berlin">

      if(!geo.results || !geo.results[0]) throw new Error('Stadt nicht gefunden');
      const {latitude, longitude, name, country} = geo.results[0];
      const wx = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`).then(r=>r.json());
      const cur = wx.current;
      const codeMap = {0:'☀️ Klar',1:'🌤 Überwiegend klar',2:'⛅ Teils bewölkt',3:'☁️ Bewölkt',45:'🌫 Nebel',48:'🌫 Nebel',51:'🌦 Niesel',61:'🌧 Regen',71:'🌨 Schnee',80:'🌧 Schauer',95:'⛈ Gewitter'};
      el.querySelector('#wOut').innerHTML = `
        <div style="font-size:20px;font-weight:800;color:var(--primary)">${name}, ${country}</div>
        <div style="font-size:52px;margin:10px 0">${cur.weather_code === 0 ? '☀️' : cur.weather_code < 4 ? '⛅' : '🌧'}</div>
        <div style="font-size:32px;font-weight:900;color:var(--accent)">${cur.temperature_2m}°C</div>
        <div style="font-size:14px;margin-top:6px">${codeMap[cur.weather_code] || 'Unbekannt'}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px">💨 ${cur.wind_speed_10m} km/h</div>
        <div style="font-size:12px;color:var(--muted);margin-top:8px">
          Heute: ${wx.daily.temperature_2m_min[0]}° – ${wx.daily.temperature_2m_max[0]}°
        </div>`;
      HalDoSounds.play('success');
    } catch(e){
      el.querySelector('#wOut').innerHTML = `<span style="color:#ff6b81">Fehler: ${e.message}</span>`;
      HalDoSounds.play('error');
    }
  };
};

/* BREATHING */
HalDoAppRenderers.breathing = (el) => {
  let active = false, timerId = null, phase = 'in', time = 4;
  const phases = {in:{name:'Einatmen', dur:4, next:'hold'}, hold:{name:'Halten', dur:4, next:'out'}, out:{name:'Ausatmen', dur:6, next:'in'}};
  el.innerHTML = `
    <div style="text-align:center;padding:20px">
      <div id="brCircle" style="width:140px;height:140px;border-radius:50%;margin:0 auto 20px;
        background:radial-gradient(circle,var(--primary),var(--accent));
        box-shadow:0 0 60px var(--primary);transition:transform 1s ease"></div>
      <div id="brText" style="font-size:22px;font-weight:800;color:var(--primary);margin-bottom:6px">Bereit</div>
      <div id="brCount" style="font-size:14px;color:var(--muted);margin-bottom:16px">4 Sekunden</div>
      <button class="appBtn" id="brToggle" style="width:100%">▶ Start</button>
    </div>`;
  const circ = el.querySelector('#brCircle'), txt = el.querySelector('#brText'), cnt = el.querySelector('#brCount');
  const step = () => {
    const p = phases[phase];
    txt.textContent = p.name;
    time = p.dur;
    const scale = phase === 'in' ? 1.4 : phase === 'out' ? .7 : 1.2;
    circ.style.transform = `scale(${scale})`;
    cnt.textContent = time + ' Sekunden';
    const tick = setInterval(() => {
      time--; cnt.textContent = time + ' Sekunden';
      if(time <= 0) {
        clearInterval(tick);
        if(active) { phase = p.next; step(); }
      }
    }, 1000);
  };
  el.querySelector('#brToggle').onclick = () => {
    active = !active;
    if(active) { el.querySelector('#brToggle').textContent = '⏸ Stop'; phase = 'in'; step(); HalDoSounds.play('notify1'); }
    else { el.querySelector('#brToggle').textContent = '▶ Start'; txt.textContent = 'Bereit'; cnt.textContent = '4 Sekunden'; circ.style.transform = 'scale(1)'; HalDoSounds.play('tap'); }
  };
};

/* AI CHAT */
const addAIMsg = (role, text) => {
  const box = document.getElementById('aiMessages');
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  m.textContent = text;
  box.appendChild(m);
  box.scrollTop = box.scrollHeight;
};

const aiRespond = (input) => {
  const lower = input.toLowerCase();
  if(/^(hi|hey|hallo|haldo|servus|moin)/i.test(lower)) {
    const replies = ['Hallo Bruder! 🦚', 'Hi! Wie geht es dir?', 'Hey! HalDo AI ist hier für dich.', 'Hallo! Schön dich zu sehen.'];
    return replies[Math.floor(Math.random()*replies.length)];
  }
  if(lower.includes('wer bist du') || lower.includes('dein name')) return 'Ich bin HalDo AI – dein persönlicher Begleiter im HalDo AI OS Pro Max, präsentiert von Halil Donma. 🦚';
  if(lower.includes('zeit') || lower.includes('uhr')) return 'Es ist ' + new Date().toLocaleTimeString('de') + '.';
  if(lower.includes('datum') || lower.includes('tag')) return 'Heute ist ' + new Date().toLocaleDateString('de', {weekday:'long', day:'numeric', month:'long', year:'numeric'}) + '.';
  if(lower.includes('wetter')) return 'Öffne die Weather-App für Live-Wetter in jeder Stadt. 🌤';
  if(lower.includes('hilfe') || lower.includes('help')) return 'Ich kann: Zeit, Datum, Wetter öffnen, Apps starten (z.B. "öffne Calculator"), Plaudern. Frag einfach!';
  if(lower.match(/öffne?\s+(.+)/)) {
    const target = lower.match(/öffne?\s+(.+)/)[1];
    const app = HalDoApps.all().find(a => a.n.toLowerCase().includes(target) || a.id === target);
    if(app) { setTimeout(()=>HalDoWindows.open(app.id), 300); return '✅ Öffne ' + app.n + '…'; }
    return 'App "' + target + '" nicht gefunden. Probier /registry.';
  }
  return 'Ich bin noch in Phase 1 – ich lerne noch. 🤖 Für volle KI: OpenAI/Gemini API-Key in Settings hinterlegen. Für jetzt kann ich: Zeit, Datum, Apps öffnen.';
};

const sendAI = () => {
  const inp = document.getElementById('aiInput');
  const v = inp.value.trim();
  if(!v) return;
  addAIMsg('user', v);
  inp.value = '';
  HalDoSounds.play('send');
  setTimeout(() => {
    addAIMsg('bot', aiRespond(v));
    HalDoSounds.play('receive');
  }, 400);
};

document.getElementById('aiSend').onclick = sendAI;
document.getElementById('aiInput').addEventListener('keydown', e => { if(e.key === 'Enter') sendAI(); });

/* Speech Recognition für "Hi HalDo" */
const startVoiceWake = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const rec = new SR();
  rec.lang = 'de-DE';
  rec.continuous = false;
  rec.interimResults = false;
  rec.onresult = e => {
    const txt = e.results[0][0].transcript.toLowerCase();
    if(txt.includes('haldo') || txt.includes('hi') || txt.includes('hallo')) {
      document.getElementById('aiPanel').classList.add('show');
      addAIMsg('user', txt);
      setTimeout(() => addAIMsg('bot', 'Ja Bruder, ich höre dich! 🦚'), 300);
      HalDoSounds.play('notify2');
    }
  };
  try { rec.start(); } catch(e) {}
};
// Voice-Wake nur nach erster Interaktion (Browser-Policy)
document.getElementById('btnAI').addEventListener('click', () => {
  if(!window._voiceWake){ window._voiceWake = true; startVoiceWake(); }
}, {once:true});

const renderSettings = () => {
  const body = document.getElementById('settingsBody');
  body.innerHTML = settingsData.map(sec => `
    <div class="setSection" data-letter="${sec.letter}">
      <div class="setSectionHead">
        <span><span class="letter">${sec.letter}</span>${sec.title}</span>
        <span style="color:var(--muted)">▾</span>
      </div>
      <div class="setSectionBody">
        ${sec.items.map((it,i) => {
          const key = sec.letter + i;
          if(it.type === 'toggle') {
            return `<div class="setRow"><label>${it.label}</label>
              <button class="toggle ${it.val?'on':''}" data-toggle="${key}" data-label="${it.label}"></button></div>`;
          } else if(it.type === 'select') {
            return `<div class="setRow"><label>${it.label}</label>
              <select class="setSelect" data-select="${key}">
                ${it.opts.map(o=>`<option ${o===it.val?'selected':''}>${o}</option>`).join('')}
              </select></div>`;
          } else {
            return `<div class="setRow"><label>${it.label}</label>
              <span style="color:var(--primary);font-size:12px">${it.val}</span></div>`;
          }
        }).join('')}
      </div>
    </div>
  `).join('');

  // Toggle handler
  body.querySelectorAll('[data-toggle]').forEach(t => t.onclick = () => {
    t.classList.toggle('on');
    HalDoSounds.play(t.classList.contains('on') ? 'tap' : 'drop');
    const [letter, i] = t.dataset.toggle.match(/([A-Z])(\d+)/).slice(1);
    const sec = settingsData.find(s => s.letter === letter);
    const item = sec?.items[+i];
    if(item?.action) item.action(t.classList.contains('on'));
  });
  // Select handler
  body.querySelectorAll('[data-select]').forEach(s => s.onchange = () => {
    HalDoSounds.play('tap');
    const [letter, i] = s.dataset.select.match(/([A-Z])(\d+)/).slice(1);
    const sec = settingsData.find(x => x.letter === letter);
    const item = sec?.items[+i];
    if(item?.action) item.action(s.value);
    toast('Gespeichert: ' + item?.label);
  });
  // Section collapse
  body.querySelectorAll('.setSectionHead').forEach(h => h.onclick = () => {
    h.parentElement.classList.toggle('open');
    HalDoSounds.play('tap');
  });
};

/* ---------- KOSMOS CANVAS ---------- */
(() => {
  const canvas = document.getElementById('kosmos');
  const ctx = canvas.getContext('2d');
  let W, H;
  const stars = [], planets = [], textRings = [];
  const planetData = [
    {name:'Merkur', r:2.5, orbit:70, speed:.04, color:'#a89a89'},
    {name:'Venus', r:4, orbit:95, speed:.03, color:'#e8b880'},
    {name:'Erde', r:4.5, orbit:125, speed:.025, color:'#4a90d9'},
    {name:'Mars', r:3.5, orbit:155, speed:.02, color:'#d9603a'},
    {name:'Jupiter', r:9, orbit:200, speed:.015, color:'#d4a574'},
    {name:'Saturn', r:7.5, orbit:245, speed:.012, color:'#e8c878', ring:true},
    {name:'Uranus', r:5.5, orbit:285, speed:.009, color:'#7ad4d9'},
    {name:'Neptun', r:5, orbit:320, speed:.007, color:'#3a5dd9'},
    {name:'Pluto', r:2, orbit:350, speed:.005, color:'#a89080'},
    {name:'Eris', r:1.8, orbit:375, speed:.004, color:'#a0b0c0'},
    {name:'Sedna', r:1.5, orbit:395, speed:.003, color:'#8090a0'},
    {name:'Xena', r:1.7, orbit:415, speed:.0035, color:'#b0a0d0'}
  ];
  const texts = [
    ['Êzîdî 🦚','Deutsch','English','Kurdî','Türkçe','العربية','فارسی','עברית'],
    ['Русский','Français','Español','Italiano','中文','日本語','O\'zbek','Latina'],
    ['HalDo AI OS Pro Max','Präsentiert a Halil Donma','Willkommen Bruder','Welcome Brother']
  ];
  let t = 0;
  const resize = () => {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.scale(1, 1);
    initStars();
  };
  const initStars = () => {
    stars.length = 0;
    const count = Math.min(300, Math.floor(W * H / 12000));
    for(let i=0;i<count;i++) {
      stars.push({x:Math.random()*W, y:Math.random()*H,
        r:Math.random()*1.5+.2, p:Math.random()*Math.PI*2, s:Math.random()*.03+.005});
    }
  };
  const draw = () => {
    ctx.clearRect(0,0,W,H);
    const theme = document.documentElement.dataset.theme || 'holo';
    const accent = theme === 'cyborg' ? '#ff78c8' : theme === 'gold' ? '#ffd700' : '#00e5ff';
    // Stars
    stars.forEach(s => {
      s.p += s.s;
      const a = .3 + Math.sin(s.p) * .5;
      ctx.fillStyle = `rgba(255,255,255,${a*.8})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
    const cx = W/2, cy = H*0.55;
    // Sun
    const sunGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
    sunGrad.addColorStop(0, '#fff8b0');
    sunGrad.addColorStop(.3, '#ffcc44');
    sunGrad.addColorStop(.7, 'rgba(255,150,50,.4)');
    sunGrad.addColorStop(1, 'rgba(255,100,30,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI*2); ctx.fill();
    // Planets
    planetData.forEach((p, i) => {
      const ang = t * p.speed + i * Math.PI/6;
      const scale = Math.min(W, H) / 900;
      const orbit = p.orbit * scale;
      const x = cx + Math.cos(ang) * orbit;
      const y = cy + Math.sin(ang) * orbit * 0.45; // ellipse for perspective
      // Orbit ring
      ctx.strokeStyle = `rgba(255,255,255,.06)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, cy, orbit, orbit*0.45, 0, 0, Math.PI*2);
      ctx.stroke();
      // Planet
      const grd = ctx.createRadialGradient(x-p.r, y-p.r, 0, x, y, p.r*scale*1.5);
      grd.addColorStop(0, '#fff');
      grd.addColorStop(.4, p.color);
      grd.addColorStop(1, 'rgba(0,0,0,.3)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, Math.max(1.5, p.r*scale), 0, Math.PI*2); ctx.fill();
      if(p.ring) {
        ctx.strokeStyle = p.color + '88'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(x, y, p.r*scale*2, p.r*scale*.5, 0, 0, Math.PI*2); ctx.stroke();
      }
    });
    // Earth in front with text rings
    const earthR = Math.min(W, H) * 0.09;
    const earthGrad = ctx.createRadialGradient(cx, H*0.88, 0, cx, H*0.88, earthR);
    earthGrad.addColorStop(0, '#5aa8e8');
    earthGrad.addColorStop(.6, '#2a6098');
    earthGrad.addColorStop(1, '#0a2540');
    ctx.fillStyle = earthGrad;
    ctx.beginPath(); ctx.arc(cx, H*0.88, earthR, 0, Math.PI*2); ctx.fill();
    // Text rings (rotating)
    ctx.font = `bold ${Math.max(9, Math.min(14, W/80))}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    texts.forEach((ring, rIdx) => {
      const ringR = earthR * (1.5 + rIdx * 0.35);
      const rot = t * (.15 - rIdx * .03);
      const n = ring.length;
      for(let i=0;i<n;i++) {
        const a = rot + (i/n) * Math.PI * 2;
        const x = cx + Math.cos(a) * ringR;
        const y = H*0.88 + Math.sin(a) * ringR * 0.4;
        const alpha = .3 + Math.sin(a) * .4;
        ctx.fillStyle = `rgba(${theme==='cyborg'?'255,120,200':theme==='gold'?'255,215,0':'0,229,255'},${Math.max(.2, alpha)})`;
        ctx.save();
        ctx.translate(x, y);
        ctx.fillText(ring[i], 0, 0);
        ctx.restore();
      }
    });
    t += 0.01;
    requestAnimationFrame(draw);
  };
  window.addEventListener('resize', resize);
  resize();
  draw();
})();
