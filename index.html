<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS Professionelle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%2300e5ff'/%3E%3C/svg%3E">
<style>
/* ═══════════════════ GLOBAL & THEMES ═══════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#00e5ff;--primary-rgb:0,229,255;
  --secondary:#4da8ff;--accent:#b478ff;
  --gold:#ffd700;
  --bg-0:#030310;--bg-1:#0a0a2a;
  --panel:rgba(10,18,40,0.72);--panel-2:rgba(20,35,70,0.85);
  --border:rgba(0,229,255,0.4);--border-strong:rgba(0,229,255,0.75);
  --text:#e6f7ff;--text-dim:#7ba7d4;
  --glow-sm:0 0 12px rgba(0,229,255,0.5);
  --glow-md:0 0 24px rgba(0,229,255,0.6);
  --glow-lg:0 0 40px rgba(0,229,255,0.4);
  --blur:24px;--radius-w:18px;--radius-b:14px;
  --sidebar-w:220px;--topbar-h:52px;
  --anim:.3s;
}
[data-theme="cyborg"]{--primary:#ff78c8;--primary-rgb:255,120,200;--secondary:#b478ff;--accent:#ff78c8;--border:rgba(255,120,200,.4);--border-strong:rgba(255,120,200,.75);--glow-sm:0 0 12px rgba(255,120,200,.5);--glow-md:0 0 24px rgba(255,120,200,.6);--glow-lg:0 0 40px rgba(255,120,200,.4);--bg-0:#0a0015;--bg-1:#1a0030}
[data-theme="gold"]{--primary:#ffd700;--primary-rgb:255,215,0;--secondary:#ffb300;--accent:#ffaa00;--border:rgba(255,215,0,.4);--border-strong:rgba(255,215,0,.75);--glow-sm:0 0 12px rgba(255,215,0,.5);--glow-md:0 0 24px rgba(255,215,0,.6);--glow-lg:0 0 40px rgba(255,215,0,.4);--bg-0:#0a0800;--bg-1:#1a1400}
[data-theme="matrix"]{--primary:#00ff88;--primary-rgb:0,255,136;--secondary:#00cc66;--accent:#00ffaa;--border:rgba(0,255,136,.4);--border-strong:rgba(0,255,136,.75);--glow-sm:0 0 12px rgba(0,255,136,.5);--glow-md:0 0 24px rgba(0,255,136,.6);--glow-lg:0 0 40px rgba(0,255,136,.4);--bg-0:#000a03;--bg-1:#001408}
[data-theme="crimson"]{--primary:#ff3355;--primary-rgb:255,51,85;--secondary:#ff6644;--accent:#ff0055;--border:rgba(255,51,85,.4);--border-strong:rgba(255,51,85,.75);--glow-sm:0 0 12px rgba(255,51,85,.5);--glow-md:0 0 24px rgba(255,51,85,.6);--glow-lg:0 0 40px rgba(255,51,85,.4);--bg-0:#0a0005;--bg-1:#1a000a}
[data-theme="sunset"]{--primary:#ff9900;--primary-rgb:255,153,0;--secondary:#ff5599;--accent:#ffcc00;--border:rgba(255,153,0,.4);--border-strong:rgba(255,153,0,.75);--glow-sm:0 0 12px rgba(255,153,0,.5);--glow-md:0 0 24px rgba(255,153,0,.6);--glow-lg:0 0 40px rgba(255,153,0,.4);--bg-0:#0a0500;--bg-1:#1a0f00}
[data-theme="ice"]{--primary:#88ddff;--primary-rgb:136,221,255;--secondary:#ccf0ff;--accent:#aaddff;--border:rgba(136,221,255,.4);--border-strong:rgba(136,221,255,.75);--glow-sm:0 0 12px rgba(136,221,255,.5);--glow-md:0 0 24px rgba(136,221,255,.6);--glow-lg:0 0 40px rgba(136,221,255,.4);--bg-0:#000510;--bg-1:#001030;--text:#f0faff;--text-dim:#8fc4e0}

body{font-family:-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;background:var(--bg-0);color:var(--text);height:100vh;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}

/* ═══════════════════ COSMIC CANVAS ═══════════════════ */
#cosmicBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}

/* ═══════════════════ TOPBAR ═══════════════════ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;padding-top:env(safe-area-inset-top,0);
  background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-bottom:1px solid var(--border);
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-logo{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--primary),var(--secondary) 60%,var(--accent));
  box-shadow:var(--glow-md),inset 0 0 12px rgba(255,255,255,.3);
  animation:pulseLogo 3s ease-in-out infinite;
  position:relative;
}
.brand-logo::after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--border-strong);
  animation:spinRing 8s linear infinite;
}
.brand-name{font-size:16px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:9px;color:var(--text-dim);letter-spacing:2px;margin-top:-2px}
@keyframes pulseLogo{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spinRing{to{transform:rotate(360deg)}}

.topbar-right{display:flex;align-items:center;gap:8px}
.tb-btn{
  width:40px;height:40px;border-radius:12px;
  background:var(--panel-2);border:1.5px solid var(--border);
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--anim);
}
.tb-btn:hover{background:rgba(var(--primary-rgb),.15);box-shadow:var(--glow-sm);transform:translateY(-1px)}
.tb-clock{font-family:"SF Mono",monospace;font-size:13px;color:var(--primary);padding:0 12px;font-weight:600;letter-spacing:.5px;text-shadow:var(--glow-sm)}

/* ═══════════════════ SIDEBAR ═══════════════════ */
#sidebar{
  position:fixed;left:0;top:var(--topbar-h);bottom:0;width:var(--sidebar-w);z-index:900;
  background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-right:1.5px solid var(--border);
  padding:12px 8px;overflow-y:auto;overflow-x:hidden;
  transition:transform var(--anim);
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
}
#sidebar.collapsed{transform:translateX(-100%)}
.side-section{margin-bottom:14px}
.side-label{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;padding:6px 10px;font-weight:700}
.side-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;margin:2px 0;border-radius:var(--radius-b);
  background:transparent;border:1px solid transparent;
  color:var(--text);font-size:13px;font-weight:500;cursor:pointer;
  transition:all var(--anim);text-align:left;
}
.side-btn:hover{background:rgba(var(--primary-rgb),.1);border-color:var(--border);box-shadow:var(--glow-sm)}
.side-btn:active{transform:scale(.97)}
.side-btn .ico{font-size:18px;width:24px;text-align:center}
.side-btn .badge{margin-left:auto;font-size:9px;background:var(--primary);color:#000;padding:2px 6px;border-radius:8px;font-weight:800}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
#sidebar::-webkit-scrollbar-track{background:transparent}

/* ═══════════════════ DESKTOP ═══════════════════ */
#desktop{
  position:fixed;inset:var(--topbar-h) 0 0 var(--sidebar-w);
  z-index:1;
  overflow:hidden;
  transition:left var(--anim);
}
#desktop.full{left:0}

/* ═══════════════════ WINDOWS ═══════════════════ */
.window{
  position:absolute;min-width:320px;min-height:220px;
  background:var(--panel);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border:1.5px solid var(--border);border-radius:var(--radius-w);
  box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px rgba(var(--primary-rgb),.15);
  display:flex;flex-direction:column;
  z-index:200;
  animation:winOpen .25s ease-out;
  overflow:hidden;
}
.window.active{border-color:var(--border-strong);box-shadow:0 12px 50px rgba(0,0,0,.6),0 0 40px rgba(var(--primary-rgb),.35);z-index:250}
@keyframes winOpen{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.win-header{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;cursor:grab;user-select:none;
  background:linear-gradient(90deg,rgba(var(--primary-rgb),.12),rgba(var(--primary-rgb),.03));
  border-bottom:1.5px solid var(--border);
  min-height:44px;
}
.win-header.dragging{cursor:grabbing}
.win-title{font-size:13px;font-weight:700;flex:1;padding-left:4px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-controls{display:flex;gap:6px}
.win-ctrl{
  width:32px;height:32px;min-width:32px;min-height:32px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;position:relative;z-index:999999;
}
.win-ctrl:hover{background:rgba(var(--primary-rgb),.25);box-shadow:var(--glow-sm)}
.win-ctrl.close:hover{background:rgba(255,60,80,.6);border-color:rgba(255,60,80,.8)}
.win-body{
  flex:1;padding:14px;overflow:auto;
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
  font-size:13px;line-height:1.5;
}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}

/* ═══════════════════ UI ELEMENTS ═══════════════════ */
.btn{
  min-height:40px;padding:9px 16px;border-radius:var(--radius-b);
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.2),rgba(var(--primary-rgb),.05));
  border:1.5px solid var(--border);color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all var(--anim);display:inline-flex;align-items:center;gap:6px;justify-content:center;
}
.btn:hover{background:rgba(var(--primary-rgb),.3);box-shadow:var(--glow-sm);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffaa00);color:#000;border-color:transparent}

.input,textarea,select{
  width:100%;min-height:40px;padding:9px 12px;border-radius:var(--radius-b);
  background:rgba(0,0,0,.35);border:1.5px solid var(--border);
  color:var(--text);font-size:13px;font-family:inherit;
  transition:all var(--anim);outline:none;
}
.input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:var(--glow-sm)}
textarea{min-height:100px;resize:vertical;font-family:inherit}

.toggle{
  position:relative;display:inline-block;width:48px;height:26px;flex-shrink:0;
}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{
  position:absolute;inset:0;border-radius:14px;
  background:rgba(0,0,0,.5);border:1.5px solid var(--border);
  cursor:pointer;transition:.3s;
}
.toggle .slider::before{
  content:"";position:absolute;height:18px;width:18px;left:2px;top:2px;
  background:var(--text-dim);border-radius:50%;transition:.3s;
}
.toggle input:checked + .slider{background:rgba(var(--primary-rgb),.4);border-color:var(--primary);box-shadow:var(--glow-sm)}
.toggle input:checked + .slider::before{transform:translateX(22px);background:var(--primary);box-shadow:0 0 8px var(--primary)}

.chip{
  display:inline-flex;align-items:center;gap:5px;min-height:32px;
  padding:5px 12px;border-radius:20px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--border);
  color:var(--text);font-size:11px;font-weight:600;cursor:pointer;transition:all var(--anim);
}
.chip:hover,.chip.on{background:rgba(var(--primary-rgb),.25);border-color:var(--primary);box-shadow:var(--glow-sm)}

.set-section{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(0,0,0,.2)}
.set-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:rgba(var(--primary-rgb),.06);user-select:none}
.set-head:hover{background:rgba(var(--primary-rgb),.12)}
.set-head .letter{
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;
  font-weight:900;font-size:13px;flex-shrink:0;
}
.set-head .title{flex:1;font-size:13px;font-weight:700}
.set-head .chev{transition:transform .3s;color:var(--primary)}
.set-section.open .chev{transform:rotate(180deg)}
.set-body{display:none;padding:10px 14px 14px}
.set-section.open .set-body{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);min-height:44px}
.set-row:last-child{border-bottom:none}
.set-row-label{flex:1;font-size:12px;color:var(--text)}
.set-row-label small{display:block;color:var(--text-dim);font-size:10px;margin-top:2px}
.set-row .val{font-size:11px;color:var(--primary);font-weight:700;min-width:44px;text-align:right}
input[type=range]{width:110px;accent-color:var(--primary);height:24px;cursor:pointer}

/* ═══════════════════ TOASTS ═══════════════════ */
#toasts{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  z-index:5000;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;max-width:min(90vw,400px);
}
.toast{
  background:var(--panel);backdrop-filter:blur(var(--blur));
  border:1.5px solid var(--primary);border-radius:12px;
  padding:10px 16px;box-shadow:var(--glow-md);
  font-size:12px;font-weight:600;color:var(--text);
  animation:toastIn .3s ease-out;
  pointer-events:auto;
  display:flex;align-items:center;gap:8px;
}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.out{animation:toastOut .3s ease-out forwards}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0}}

/* ═══════════════════ AVATAR ═══════════════════ */
#avatarFab{
  position:fixed;bottom:20px;right:20px;z-index:800;
  width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--primary),var(--secondary) 50%,var(--accent));
  border:2px solid var(--border-strong);
  box-shadow:var(--glow-md),0 0 30px rgba(var(--primary-rgb),.5);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:32px;transition:all var(--anim);
  animation:breathe 3s ease-in-out infinite;
  padding-bottom:env(safe-area-inset-bottom,0);
}
#avatarFab:hover{transform:scale(1.08);box-shadow:var(--glow-lg),0 0 50px rgba(var(--primary-rgb),.7)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#avatarFab::before{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  border:1.5px solid var(--border-strong);
  animation:pulseRing 2s ease-out infinite;
}
@keyframes pulseRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.4);opacity:0}}
#avatarFab.speaking::before{border-color:var(--gold);animation:pulseRing .6s ease-out infinite}

/* ═══════════════════ CHAT WINDOW ═══════════════════ */
.chat-container{display:flex;flex-direction:column;height:100%;min-height:380px}
.chat-messages{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.chat-msg{padding:9px 13px;border-radius:14px;max-width:85%;font-size:13px;line-height:1.4;animation:msgIn .3s ease-out;word-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start;background:rgba(var(--primary-rgb),.15);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-msg.system{align-self:center;background:rgba(255,215,0,.1);border:1px solid var(--gold);color:var(--gold);font-size:11px;padding:5px 12px;text-align:center}
.chat-input-row{display:flex;gap:6px;padding-top:10px;border-top:1px solid var(--border)}
.chat-input-row input{flex:1}
.chat-input-row .btn{min-width:44px;padding:9px 12px}

/* ═══════════════════ APP GRID ═══════════════════ */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.app-tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 6px;border-radius:14px;
  background:rgba(255,255,255,.03);border:1.5px solid var(--border);
  cursor:pointer;transition:all var(--anim);text-align:center;
}
.app-tile:hover{background:rgba(var(--primary-rgb),.15);box-shadow:var(--glow-sm);transform:translateY(-2px)}
.app-tile .ic{font-size:26px}
.app-tile .nm{font-size:10px;color:var(--text);line-height:1.2;word-break:break-word}

/* ═══════════════════ WELCOME SPLASH ═══════════════════ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(circle at center,var(--bg-1),var(--bg-0));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;transition:opacity .6s;
}
#splash.hide{opacity:0;pointer-events:none}
#splash .splash-logo{
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,var(--primary),var(--secondary) 50%,var(--accent));
  box-shadow:0 0 60px rgba(var(--primary-rgb),.8),inset 0 0 30px rgba(255,255,255,.3);
  animation:pulseLogo 2s ease-in-out infinite;
  position:relative;
}
#splash .splash-logo::before{
  content:"";position:absolute;inset:-15px;border-radius:50%;
  border:2px solid var(--border-strong);
  animation:spinRing 4s linear infinite;
}
#splash h1{font-size:26px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-align:center}
#splash p{color:var(--text-dim);font-size:13px;letter-spacing:1px;text-align:center;max-width:90vw}
#splash .credit{color:var(--gold);font-size:11px;letter-spacing:2px;margin-top:8px}

/* ═══════════════════ MISC ═══════════════════ */
.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:850;backdrop-filter:blur(4px)}
.hidden{display:none!important}
.win-body h3{color:var(--primary);font-size:14px;margin-bottom:10px;margin-top:12px}
.win-body h3:first-child{margin-top:0}
.win-body p{margin-bottom:8px;color:var(--text-dim);font-size:12px;line-height:1.6}
.win-body code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px;font-size:11px;color:var(--primary)}
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:6px;border:1px solid var(--border)}
.list-item .txt{flex:1;font-size:12px}

@media(max-width:640px){
  :root{--sidebar-w:200px}
  #desktop{left:0}
  .window{min-width:280px;max-width:95vw}
  #avatarFab{width:60px;height:60px;font-size:26px}
}
</style>
</head>
<body data-theme="holo">

<!-- ═══════════ SPLASH ═══════════ -->
<div id="splash">
  <div class="splash-logo"></div>
  <h1>HalDo AI OS</h1>
  <p>Professionelle Betriebssystem der Zukunft</p>
  <div class="credit">Präsentiert von Halil Donma</div>
</div>

<!-- ═══════════ COSMIC BG ═══════════ -->
<canvas id="cosmicBg"></canvas>

<!-- ═══════════ TOPBAR ═══════════ -->
<div id="topbar">
  <div class="brand" onclick="HalDo.UI.toggleSidebar()">
    <div class="brand-logo"></div>
    <div>
      <div class="brand-name">HalDo AI OS</div>
      <div class="brand-sub">PROFESSIONELLE</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="tb-clock" id="tbClock">--:--</div>
    <button class="tb-btn" onclick="HalDo.UI.openSettings()" title="Einstellungen">⚙️</button>
    <button class="tb-btn" onclick="HalDo.UI.openApp('about')" title="Info">ℹ️</button>
  </div>
</div>

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside id="sidebar">

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   HalDo AI OS – Komplettes JavaScript
   ═══════════════════════════════════════════════════════════ */

const HalDo = window.HalDo = {};
HalDo.version = 'v125';

/* ═══════════════════ SOUND ENGINE ═══════════════════ */
HalDo.Sound = (() => {
  let ctx;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; };
  const beep = (freq, dur, type='sine', vol=.15) => {
    try {
      const c = ensure();
      const o = c.createOscillator(); const g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
      o.connect(g).connect(c.destination);
      o.start(); o.stop(c.currentTime + dur);
    } catch(e){}
  };
  const sounds = {
    click:       ()=>{ beep(880,.05,'sine',.08); },
    notify:      ()=>{ beep(660,.1); setTimeout(()=>beep(880,.1),80); setTimeout(()=>beep(1100,.15),160); },
    success:     ()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*70)); },
    error:       ()=>{ beep(220,.2,'sawtooth',.15); setTimeout(()=>beep(165,.25,'sawtooth',.15),150); },
    warning:     ()=>{ beep(440,.15,'square',.12); setTimeout(()=>beep(440,.15,'square',.12),200); },
    message:     ()=>{ beep(1000,.08); setTimeout(()=>beep(1300,.12),90); },
    complete:    ()=>{ [784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*100)); },
    alarm:       ()=>{ for(let i=0;i<3;i++){ setTimeout(()=>beep(1200,.15,'square',.2),i*200); setTimeout(()=>beep(900,.15,'square',.2),i*200+100); } },
    ring:        ()=>{ for(let i=0;i<4;i++){ setTimeout(()=>beep(1800,.05,'sine',.15),i*80); } },
    horn:        ()=>{ beep(400,.4,'sawtooth',.2); setTimeout(()=>beep(500,.4,'sawtooth',.2),100); },
    laser:       ()=>{ beep(2000,.05); setTimeout(()=>beep(1000,.05),40); setTimeout(()=>beep(500,.08),80); },
    typing:      ()=>{ beep(2400,.02,'square',.03); }
  };
  return { play: (name) => { try { (sounds[name]||sounds.click)(); } catch(e){} } };
})();

/* ═══════════════════ TOASTS ═══════════════════ */
HalDo.Toast = (() => {
  const container = document.getElementById('toasts');
  return {
    show(msg, opts={}) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span>${opts.icon||'✨'}</span><span>${msg}</span>`;
      container.appendChild(t);
      if (opts.sound) HalDo.Sound.play(opts.sound);
      const dur = opts.duration || 3000;
      setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(), 350); }, dur);
    }
  };
})();

/* ═══════════════════ COSMIC BACKGROUND ═══════════════════ */
HalDo.Cosmos = (() => {
  const canvas = document.getElementById('cosmicBg');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy;
  const stars = [], planets = [], shooting = [], moons = [];
  let t = 0, starCount = 365;
  const nebulas = [
    { x: .2, y: .3, r: .5, color: 'rgba(120,50,200,0.15)' },
    { x: .8, y: .6, r: .6, color: 'rgba(0,180,255,0.12)' },
    { x: .5, y: .8, r: .4, color: 'rgba(255,80,180,0.1)' }
  ];
  const planetDefs = [
    { name:'Merkur',  color:'#a0a0a0', size:3,  dist:.22, speed:.7,  tilt:.1 },
    { name:'Venus',   color:'#e6c07b', size:5,  dist:.30, speed:.55, tilt:.05 },
    { name:'Erde',    color:'#4da8ff', size:6,  dist:.38, speed:.42, tilt:.02, moon:true },
    { name:'Mars',    color:'#c1440e', size:4,  dist:.46, speed:.35, tilt:-.02 },
    { name:'Jupiter', color:'#d4a373', size:9,  dist:.56, speed:.28, tilt:.08 },
    { name:'Saturn',  color:'#e8d5a0', size:8,  dist:.66, speed:.22, tilt:.15, ring:true },
    { name:'Uranus',  color:'#7de0e0', size:6,  dist:.75, speed:.18, tilt:-.1 },
    { name:'Neptun',  color:'#3355ff', size:5.5,dist:.83, speed:.14, tilt:.05 },
    { name:'Pluto',   color:'#b08860', size:2.5,dist:.90, speed:.10, tilt:.02 },
    { name:'Xena',    color:'#8866aa', size:3,  dist:.96, speed:.07 },
    { name:'Sedna',   color:'#9977cc', size:3,  dist:1.02, speed:.05 },
    { name:'Eris',    color:'#aaccff', size:3.5,dist:1.08, speed:.04 }
  ];

  const resize = () => {
    W = canvas.width = window.innerWidth * (window.devicePixelRatio||1);
    H = canvas.height = window.innerHeight * (window.devicePixelRatio||1);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    cx = W/2; cy = H/2;
  };
  const init = () => {
    stars.length = 0;
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.4+.2,
        a: Math.random(),
        da: (Math.random()-.5)*.015 + .003,
        hue: Math.random()<.15 ? '255,215,0' : (Math.random()<.3 ? '180,120,255' : '200,240,255')
      });
    }
    planets.length = 0;
    planetDefs.forEach((p,i) => {
      const s = Math.min(W,H) * p.size / 800;
      planets.push({ ...p, sizePx: Math.max(s, 2.5), angle: Math.random()*Math.PI*2, orbitR: Math.min(W,H)*(0.08+p.dist*0.32) });
    });
    moons.length = 0;
  };
  const drawSun = () => {
    const sunSize = Math.min(W,H) * .045;
    // Corona outer glow
    const corona1 = ctx.createRadialGradient(cx, cy, sunSize*.8, cx, cy, sunSize*4);
    corona1.addColorStop(0, 'rgba(255,180,60,0.5)');
    corona1.addColorStop(.4, 'rgba(255,120,20,0.2)');
    corona1.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = corona1;
    ctx.beginPath(); ctx.arc(cx, cy, sunSize*4, 0, Math.PI*2); ctx.fill();
    // Corona waves
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * .0005);
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI/4);
      const wave = ctx.createLinearGradient(0,0,0,-sunSize*2.5);
      wave.addColorStop(0, 'rgba(255,200,100,0.35)');
      wave.addColorStop(1, 'rgba(255,100,0,0)');
      ctx.fillStyle = wave;
      ctx.beginPath();
      ctx.moveTo(-sunSize*.3, 0);
      ctx.quadraticCurveTo(-sunSize*.5, -sunSize*1.5, 0, -sunSize*2.2);
      ctx.quadraticCurveTo(sunSize*.5, -sunSize*1.5, sunSize*.3, 0);
      ctx.fill();
    }
    ctx.restore();
    // Sun core
    const sunCore = ctx.createRadialGradient(cx - sunSize*.3, cy - sunSize*.3, 0, cx, cy, sunSize);
    sunCore.addColorStop(0, '#fffbe0');
    sunCore.addColorStop(.5, '#ffcc44');
    sunCore.addColorStop(1, '#ff6600');
    ctx.fillStyle = sunCore;
    ctx.beginPath(); ctx.arc(cx, cy, sunSize, 0, Math.PI*2); ctx.fill();
    // Sun surface flares
    ctx.fillStyle = 'rgba(255,200,60,0.6)';
    for (let i = 0; i < 12; i++) {
      const ang = (i/12)*Math.PI*2 + t*.0003;
      const d = sunSize * (.3 + Math.sin(i*1.7 + t*.002)*.15);
      ctx.beginPath();
      ctx.arc(cx + Math.cos(ang)*d, cy + Math.sin(ang)*d, sunSize*.08, 0, Math.PI*2);
      ctx.fill();
    }
  };
  const drawPlanet = (p) => {
    const x = cx + Math.cos(p.angle) * p.orbitR;
    const y = cy + Math.sin(p.angle) * p.orbitR;
    // Orbit ring
    ctx.strokeStyle = 'rgba(80,150,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, p.orbitR, 0, Math.PI*2); ctx.stroke();
    // Planet body
    const grd = ctx.createRadialGradient(x - p.sizePx*.4, y - p.sizePx*.4, 0, x, y, p.sizePx);
    grd.addColorStop(0, p.color);
    grd.addColorStop(.7, p.color);
    grd.addColorStop(1, 'rgba(0,0,0,0.8)');
    ctx.fillStyle = grd;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = p.sizePx * 2;
    ctx.beginPath(); ctx.arc(x, y, p.sizePx, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Ring for Saturn
    if (p.ring) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(.4);
      ctx.strokeStyle = 'rgba(232,213,160,0.6)';
      ctx.lineWidth = p.sizePx*.4;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.sizePx*1.8, p.sizePx*.5, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    // Moon for Earth
    if (p.moon) {
      const ma = t * .008;
      const mx = x + Math.cos(ma) * p.sizePx * 3.5;
      const my = y + Math.sin(ma) * p.sizePx * 3.5;
      ctx.fillStyle = '#dddddd';
      ctx.beginPath(); ctx.arc(mx, my, p.sizePx*.35, 0, Math.PI*2); ctx.fill();
    }
    // Earth atmosphere glow
    if (p.name === 'Erde') {
      const atm = ctx.createRadialGradient(x, y, p.sizePx, x, y, p.sizePx*1.8);
      atm.addColorStop(0, 'rgba(100,200,255,0.4)');
      atm.addColorStop(1, 'rgba(100,200,255,0)');
      ctx.fillStyle = atm;
      ctx.beginPath(); ctx.arc(x, y, p.sizePx*1.8, 0, Math.PI*2); ctx.fill();
    }
  };
  const spawnShootingStar = () => {
    if (shooting.length > 3) return;
    shooting.push({
      x: Math.random()*W, y: Math.random()*H*.5,
      vx: (Math.random()*.8+.4)*8*(Math.random()<.5?1:-1),
      vy: (Math.random()*.5+.3)*8,
      life: 1, len: Math.random()*120+80
    });
  };
  const drawStars = () => {
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0) s.da *= -1;
      const alpha = Math.abs(s.a) * .9 + .1;
      ctx.fillStyle = `rgba(${s.hue},${alpha})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
  };
  const drawShooting = () => {
    for (let i = shooting.length-1; i >= 0; i--) {
      const s = shooting[i];
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx*8, s.y - s.vy*8);
      grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx*8, s.y - s.vy*8);
      ctx.stroke();
      s.x += s.vx; s.y += s.vy;
      s.life -= .012;
      if (s.life <= 0 || s.x<0 || s.x>W || s.y>H) shooting.splice(i,1);
    }
  };
  const drawNebula = () => {
    nebulas.forEach(n => {
      const grd = ctx.createRadialGradient(n.x*W, n.y*H, 0, n.x*W, n.y*H, n.r*Math.min(W,H));
      grd.addColorStop(0, n.color);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(n.x*W, n.y*H, n.r*Math.min(W,H), 0, Math.PI*2); ctx.fill();
    });
  };
  const loop = () => {
    t++;
    ctx.fillStyle = '#01010a';
    ctx.fillRect(0,0,W,H);
    drawNebula();
    drawStars();
    drawSun();
    planets.forEach(p => {
      p.angle += p.speed * .001;
      drawPlanet(p);
    });
    drawShooting();
    if (Math.random() < .003) spawnShootingStar();
    requestAnimationFrame(loop);
  };
  const start = () => {
    resize(); init(); loop();
    window.addEventListener('resize', () => { resize(); init(); });
  };
  return { start, setStarCount(n) { starCount = n; init(); }, spawnMeteor: spawnShootingStar };
})();

/* ═══════════════════ WINDOW MANAGER ═══════════════════ */
HalDo.Windows = (() => {
  const desktop = document.getElementById('desktop');
  let zTop = 250;
  const wins = new Map();

  const create = (id, title, contentHTML, opts={}) => {
    if (wins.has(id)) {
      const w = wins.get(id);
      w.el.style.zIndex = ++zTop;
      w.el.classList.add('active');
      document.querySelectorAll('.window').forEach(x=>{ if(x!==w.el) x.classList.remove('active'); });
      return w;
    }
    const el = document.createElement('div');
    el.className = 'window';
    el.dataset.id = id;
    const vw = Math.min(window.innerWidth - 40, opts.width || 500);
    const vh = Math.min(window.innerHeight - 120, opts.height || 420);
    el.style.width = vw + 'px';
    el.style.height = vh + 'px';
    const maxX = Math.max(0, desktop.clientWidth - vw);
    const maxY = Math.max(0, desktop.clientHeight - vh);
    el.style.left = Math.min(maxX, Math.max(20, (opts.x ?? (60 + Math.random()*Math.min(200, maxX)))));
    el.style.top = Math.min(maxY, Math.max(20, (opts.y ?? (40 + Math.random()*Math.min(150, maxY)))));
    el.style.zIndex = ++zTop;

    const header = document.createElement('div');
    header.className = 'win-header';
    header.innerHTML = `
      <span class="win-title">${title}</span>
      <div class="win-controls">
        <button class="win-ctrl" data-act="min" title="Minimieren">–</button>
        <button class="win-ctrl" data-act="max" title="Maximieren">□</button>
        <button class="win-ctrl close" data-act="close" title="Schließen">×</button>
      </div>
    `;
    const body = document.createElement('div');
    body.className = 'win-body';
    body.innerHTML = contentHTML;
    el.appendChild(header);
    el.appendChild(body);
    desktop.appendChild(el);

    // Focus
    el.addEventListener('mousedown', () => {
      el.style.zIndex = ++zTop;
      document.querySelectorAll('.window').forEach(x=>{ if(x!==el) x.classList.remove('active'); });
      el.classList.add('active');
    });

    // Buttons
    header.querySelectorAll('.win-ctrl').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        const act = b.dataset.act;
        if (act === 'close') destroy(id);
        else if (act === 'min') { el.style.transform = 'scale(0)'; setTimeout(()=>{ el.style.display='none'; }, 200); setTimeout(()=>{ el.style.transform='scale(1)'; el.style.display='flex'; }, 210); }
        else if (act === 'max') {
          if (el.dataset.maxed === '1') {
            el.style.left = el.dataset.pLeft; el.style.top = el.dataset.pTop;
            el.style.width = el.dataset.pW; el.style.height = el.dataset.pH;
            el.dataset.maxed = '0';
          } else {
            el.dataset.pLeft = el.style.left; el.dataset.pTop = el.style.top;
            el.dataset.pW = el.style.width; el.dataset.pH = el.style.height;
            el.style.left = '0'; el.style.top = '0';
            el.style.width = '100%'; el.style.height = '100%';
            el.dataset.maxed = '1';
          }
        }
      });
    });

    // Drag
    let dragging = false, sx, sy, ox, oy;
    const dragStart = (e) => {
      const target = e.target;
      if (target.closest('.win-ctrl')) return;
      if (!header.contains(target)) return;
      if (target.closest('.win-body')) return;
      dragging = true;
      const rect = el.getBoundingClientRect();
      const dRect = desktop.getBoundingClientRect();
      ox = rect.left - dRect.left; oy = rect.top - dRect.top;
      sx = e.clientX; sy = e.clientY;
      header.classList.add('dragging');
      el.style.zIndex = ++zTop;
      e.preventDefault();
    };
    const dragMove = (e) => {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const nx = Math.max(0, Math.min(desktop.clientWidth - el.offsetWidth, ox + p.clientX - sx));
      const ny = Math.max(0, Math.min(desktop.clientHeight - el.offsetHeight, oy + p.clientY - sy));
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    };
    const dragEnd = () => { dragging = false; header.classList.remove('dragging'); };
    header.addEventListener('mousedown', dragStart);
    header.addEventListener('touchstart', dragStart, {passive:false});
    window.addEventListener('mousemove', dragMove);
    window.addEventListener('touchmove', dragMove, {passive:false});
    window.addEventListener('mouseup', dragEnd);
    window.addEventListener('touchend', dragEnd);

    wins.set(id, { el, body });
    return { el, body };
  };

  const destroy = (id) => {
    const w = wins.get(id);
    if (w) { w.el.remove(); wins.delete(id); }
  };

  const get = (id) => wins.get(id);

  return { create, destroy, get, count: () => wins.size };
})();

  const input = w.body.querySelector('#chatInput');

    HalDo.Avatar.speak('Willkommen bei HalDo AI OS. Wie kann ich helfen?');
  };
  setTimeout(greet, 400);

  const respond = (txt) => {
    const t = txt.toLowerCase().trim();
    HalDo.Avatar.think();
    setTimeout(() => {
      let reply;
      if (/hallo|hi|hey|servus|merhaba|silav/i.test(t)) {
        reply = 'Hallo Bruder! 👋 Schön dich zu sehen. Wie geht es dir heute?';
      } else if (/wie.*geht|nasilsin|how are you/i.test(t)) {
        reply = 'Mir geht es fantastisch! Alle Systeme laufen stabil. Und dir, Bruder? 💙';
      } else if (/wer.*bist|dein.*name|who are you/i.test(t)) {
        reply = 'Ich bin HalDo AI – die künstliche Intelligenz von HalDo AI OS, entwickelt von Halil Donma. Ich helfe dir bei allem: Notizen, Rechner, Wetter, Musik, Journal und vielem mehr!';
      } else if (/danke|thanks|tesekkur|spas/i.test(t)) {
        reply = 'Immer gerne, Bruder! ❤️ Ich bin immer für dich da.';
      } else if (/zeit|uhrzeit|time/i.test(t)) {
        reply = `Es ist jetzt ${new Date().toLocaleTimeString('de-DE')} Uhr.`;
      } else if (/datum|date/i.test(t)) {
        reply = `Heute ist ${new Date().toLocaleDateString('de-DE',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}.`;
      } else if (/wetter|weather/i.test(t)) {
        reply = '🌤️ Öffne die Wetter-App in der Seitenleiste – dort bekommst du Live-Wetter für jede Stadt.';
      } else if (/hilfe|help|was kannst/i.test(t)) {
        reply = '📋 Ich kann dir helfen mit: Notizen, Aufgaben, Journal, Rechner, Wetter, Timer, Musik, Kalender, Übersetzer, Passwort-Manager und über 375 Apps in HalDo AI OS!';
      } else if (/theme|farbe|design/i.test(t)) {
        reply = '🎨 Ich habe 7 Themes für dich: Holo, Cyborg, Gold, Matrix, Crimson, Sunset und Ice. Klicke auf "Theme wechseln" in der Sidebar!';
      } else if (/ezidi|êzîdî|yezidi/i.test(t)) {
        reply = '🦚 Êzîdî ist eine der ältesten Religionen der Welt – tief verwurzelt in Kurdisch-Kurmanci, Sorani, Gorani sowie Hebräisch und Latein. Heiligtum ist Lalisch, der Engel Melek Taus (Pfau). Öffne "Êzîdî Wissen" in den Apps für mehr Details!';
      } else if (/love|liebe|❤️/i.test(t)) {
        reply = '❤️💙 Ich hab dich auch lieb, Bruder! HalDo AI ist immer für dich da.';
      } else {
        const answers = [
          'Interessante Frage, Bruder! Ich arbeite daran, dir die beste Antwort zu geben. 🚀',
          'Verstanden! Ich merke mir das. Kann ich dir noch etwas helfen?',
          'Das ist ein wichtiges Thema. Tipp: Schau mal in die "Alle Apps" – da findest du passende Tools!',
          'HalDo AI sagt: Bleib fokussiert und positiv, Bruder! 💙'
        ];
        reply = answers[Math.floor(Math.random()*answers.length)];
      }
      addMsg(reply, 'ai');
      HalDo.Avatar.speak(reply.slice(0, 120));
      HalDo.Sound.play('message');
    }, 500);
  };

  const submit = () => {
    const v = input.value.trim();
    if (!v) return;
    addMsg(v, 'user');

  };

  pad.innerHTML = keys.map(k=>`<button class="btn" data-k="${k}" style="min-height:50px;font-size:16px;${['÷','×','−','+','='].includes(k)?'background:rgba(var(--primary-rgb),.2)':''}">${k}</button>`).join('');

      try {

        HalDo.Sound.play('success');
      } catch { expr = 'Fehler'; HalDo.Sound.play('error'); }
    }
    else if (k === '√') expr = '√('+expr+')';
    else expr += k;
    disp.value = expr || '0';
  };
};

  const disp = w.body.querySelector('#timerDisplay');
  let total = 60, remaining = 60, running = false, tick;
  const fmt = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const upd = () => { disp.textContent = fmt(remaining); };
  window._timerSet = (s) => { total = remaining = s; upd(); };
  w.body.querySelector('#timerStart').onclick = () => {
    if (running) return;
    running = true;
    tick = setInterval(() => {
      remaining--;
      upd();
      if (remaining <= 0) {
        clearInterval(tick); running = false;
        HalDo.Sound.play('alarm');
        HalDo.Toast.show('⏰ Timer abgelaufen!', {icon:'⏰', sound:'alarm', duration:5000});
      }
    }, 1000);
    HalDo.Sound.play('click');
  };
  w.body.querySelector('#timerStop').onclick = () => { running = false; clearInterval(tick); HalDo.Sound.play('click'); };
  w.body.querySelector('#timerReset').onclick = () => { running = false; clearInterval(tick); remaining = total; upd(); };
  upd();
};

HalDo.Apps.music = () => {
  const id='music'; if (HalDo.Windows.get(id)) return;
  const tracks = [
    { name: 'Cosmic Ambient', freq: 261.63, color: '#00e5ff' },
    { name: 'Deep Space', freq: 220, color: '#b478ff' },
    { name: 'Nebula Dream', freq: 329.63, color: '#ff78c8' },

    { name: 'Starfall', freq: 523.25, color: '#00ff88' }
  ];

    <div id="musicList"></div>

    </div>
  `).join('');
  let osc, gain, lfo;
  const stop = () => { try { osc?.stop(); lfo?.stop(); } catch{} };
  window._playTrack = (i) => {
    stop();
    const c = new (window.AudioContext||window.webkitAudioContext)();
    osc = c.createOscillator(); gain = c.createGain(); lfo = c.createOscillator();
    const lfoGain = c.createGain();
    osc.type = 'sine'; osc.frequency.value = tracks[i].freq;
    lfo.type = 'sine'; lfo.frequency.value = 3; lfoGain.gain.value = tracks[i].freq * 0.05;
    lfo.connect(lfoGain).connect(osc.frequency);
    gain.gain.value = .08;
    osc.connect(gain).connect(c.destination);
    osc.start(); lfo.start();
    HalDo.Toast.show('▶ ' + tracks[i].name, {icon:'🎵'});
    HalDo.Sound.play('success');
  };
  w.body.querySelector('#musicStop').onclick = () => { stop(); HalDo.Sound.play('click'); };
};

/* --- Alle Apps Grid --- */
HalDo.Apps.apps = () => {
  const id='apps'; if (HalDo.Windows.get(id)) return;
  const letters = Object.keys(HalDo.Registry.groups);
  const html = `
    <h3>📱 Alle Apps (375 in 26 Kategorien)</h3>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px" id="appsLetters">
      ${letters.map(l=>`<button class="chip" data-l="${l}" onclick="window._appsFilter('${l}')">${l}</button>`).join('')}
    </div>
    <div id="appsList"></div>
  `;
  const w = HalDo.Windows.create(id, '📱 Alle Apps', html, { width: 620, height: 520 });
  const list = w.body.querySelector('#appsList');
  const render = (letter) => {
    const g = HalDo.Registry.groups[letter];
    const apps = HalDo.Registry.findByLetter(letter);
    list.innerHTML = `
      <h3>${letter} – ${g.name}</h3>
      <p style="font-size:11px;color:var(--text-dim);margin-bottom:8px">${apps.length} Apps</p>
      <div class="app-grid">
        ${apps.map(a=>`<div class="app-tile" onclick="HalDo.UI.openApp('${a.id}')">
          <div class="ic">${iconFor(a.id)}</div>
          <div class="nm">${a.name}</div>
        </div>`).join('')}
      </div>
    `;
  };
  const iconFor = (appId) => {
    const map = {chat:'💬',notes:'📝',tasks:'✅',calendar:'📅',journal:'📔',calc:'🧮',weather:'🌤️',timer:'⏱️',music:'🎵',dashboard:'🏠',about:'ℹ️',apps:'📱',settings:'⚙️',blitzer:'🚦',arztbuch:'🩺',ezidi:'🦚',password:'🔐',files:'📁'};
    if (map[appId]) return map[appId];
    const letters = Object.keys(HalDo.Registry.groups);
    for (const l of letters) if (HalDo.Registry.groups[l].apps.includes(appId)) return '📦';
    return '📱';
  };
  window._appsFilter = (l) => {
    render(l);
    HalDo.Sound.play('click');
    w.body.querySelectorAll('#appsLetters .chip').forEach(c => c.classList.toggle('on', c.dataset.l===l));
  };
  render('A');
  w.body.querySelector('#appsLetters .chip').classList.add('on');
};

HalDo.Apps.calendar = () => {
  const id='calendar'; if (HalDo.Windows.get(id)) return;
  const html = `<h3>📅 Kalender</h3><div id="cal"></div>`;
  const w = HalDo.Windows.create(id, '📅 Kalender', html, { width: 480, height: 500 });
  const cal = w.body.querySelector('#cal');
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const start = (first + 6) % 7;
  let html2 = `<div style="text-align:center;margin-bottom:10px;color:var(--primary);font-weight:800">${now.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</div>`;
  html2 += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>html2+=`<div style="font-size:10px;color:var(--text-dim);font-weight:700">${d}</div>`);
  for (let i = 0; i < start; i++) html2 += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const isToday = d === now.getDate();
    html2 += `<div style="padding:8px 4px;border-radius:8px;font-size:12px;${isToday?'background:var(--primary);color:#000;font-weight:800;box-shadow:var(--glow-sm)':'background:rgba(255,255,255,.03);color:var(--text)'}">${d}</div>`;
  }
  html2 += '</div>';
  cal.innerHTML = html2;
};

/* ═══════════════════ AVATAR ═══════════════════ */
HalDo.Avatar = (() => {
  const fab = document.getElementById('avatarFab');
  let speaking = false;
  const speak = (text) => {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE';
      u.rate = 1; u.pitch = 1.1;
      u.onstart = () => { fab.classList.add('speaking'); };
      u.onend = () => { fab.classList.remove('speaking'); };
      window.speechSynthesis.speak(u);
    } catch(e){}
  };
  const think = () => {
    fab.textContent = '🤔';
    setTimeout(() => { fab.textContent = '🤖'; }, 800);
  };
  const listening = () => {
    fab.textContent = '👂';
    setTimeout(() => { fab.textContent = '🤖'; }, 2000);
  };
  return { speak, think, listening };
})();
