function initV127(){
  // Registry-App-Mapping
  if(window.HalDoRegistry){
    const origOpen=window.HalDoRegistry.openApp;
    window.HalDoRegistry.openApp=function(id){
      if(id==='schlaf'){ if(typeof openWin==='function') openWin('sleep-window'); buildSleep(); setTimeout(()=>window.HalDoUI?.closeAllPanels(),100); return; }
      if(id==='fitness'||id==='training'){ if(typeof openWin==='function') openWin('workout-window'); buildWorkout(); setTimeout(()=>window.HalDoUI?.closeAllPanels(),100); return; }
      if(id==='meditation'||id==='atmung'){ if(typeof openWin==='function') openWin('breathing-window'); buildBreathing(); setTimeout(()=>window.HalDoUI?.closeAllPanels(),100); return; }
      if(id==='mental'||id==='stress'||id==='mood'){ if(typeof openWin==='function') openWin('mood-window'); buildMood(); setTimeout(()=>window.HalDoUI?.closeAllPanels(),100); return; }
      return origOpen.apply(this, arguments);
    };
  }
  // Rebuild-Erweiterung
  if(window.HalDoUI){
    const origRebuild=window.HalDoUI.rebuild;
    window.HalDoUI.rebuild=function(id){
      if(id==='sleep-window'){ buildSleep(); return; }
      if(id==='mood-window'){ buildMood(); return; }
      if(id==='workout-window'){ buildWorkout(); return; }
      if(id==='breathing-window'){ buildBreathing(); return; }
      if(origRebuild) origRebuild(id);
    };
  }
  // Apps vorbereiten
  ['sleep-window','mood-window','workout-window','breathing-window'].forEach(id=>{
    const el=$(id);
    if(el && window.prepareWindow) window.prepareWindow(el);
  });
  // Initial bauen
  buildSleep(); buildMood(); buildWorkout(); buildBreathing();
  console.log('%c🚀 v127 – 4 Apps geladen','color:#00ff88;font-weight:bold;font-size:14px');
  console.log('%c✅ Sleep · Mood · Workout · Breathing','color:#4da8ff;font-weight:bold');
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', ()=>setTimeout(initV127,1200));
} else {
  setTimeout(initV127, 1200);
}

})();

<script>
(function(){

const save = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} };
const todayK = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') };

window.HalDoWater={

  add(ml){ const d=this.get(); d.amount=Math.min(5000,d.amount+ml); save(this.key,d); },

window.HalDoPomodoro={
  key:'haldo_pomodoro_v1',
  get(){ const d=store(this.key,{today:0,total:0,minutes:0,lastDate:''}); if(d.lastDate!==todayK()){ d.today=0; d.lastDate=todayK(); save(this.key,d); } return d; },
  complete(){
    const d=this.get();
    d.today++; d.total++; d.minutes+=25;
    save(this.key,d);
  },
  reset(){ save(this.key,{today:0,total:0,minutes:0,lastDate:todayK()}); }
};

const POMO_DURATIONS={work:25*60, break:5*60, long:15*60};
let pomoState={mode:'work', running:false, endTime:0, timer:null, remaining:0};

function buildPomodoro(){
  const w=$('pomodoro-window'); if(!w) return;
  w.dataset.title='Pomodoro'; w.dataset.icon='🍅';
  const stats=HalDoPomodoro.get();
  const dur=POMO_DURATIONS[pomoState.mode];
  const remaining=pomoState.running?Math.max(0,(pomoState.endTime-Date.now())/1000):(pomoState.remaining||dur);
  const totalSec=Math.ceil(remaining);
  const m=Math.floor(totalSec/60), s=totalSec%60;
  const modeLabel={work:'🍅 Arbeit', break:'☕ Pause', long:'🌴 Lange Pause'}[pomoState.mode];
  const pct=Math.round((dur-totalSec)/dur*100);
  w.innerHTML=
    '<div class="card" style="text-align:center;padding:24px 20px">'+
    '<div style="font-size:44px;margin-bottom:10px">'+(pomoState.mode==='work'?'🍅':pomoState.mode==='break'?'☕':'🌴')+'</div>'+

    '<div style="font-size:12px;color:#ff9090;text-transform:uppercase;letter-spacing:2px;font-weight:800;margin:12px 0">'+modeLabel+'</div>'+
    '<div style="height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-bottom:16px;border:1px solid rgba(255,80,80,.2)">'+
    '<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#ff4466,#ff8800);transition:width .5s;box-shadow:0 0 12px rgba(255,80,80,.6)"></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+
    '<button class="os-btn primary" style="padding:14px 30px;font-size:15px" onclick="HalDoPomodoroApp.toggle()">'+(pomoState.running?'⏸ Pause':'▶ Start')+'</button>'+
    '<button class="os-btn danger" onclick="HalDoPomodoroApp.reset()">↺ Reset</button>'+
    '</div></div>'+
    '<div class="grid2" style="margin-bottom:14px">'+

    '<button class="os-btn '+(pomoState.mode==='long'?'primary':'')+'" onclick="HalDoPomodoroApp.setMode(\'long\')">🌴 Lang</button>'+
    '</div></div>';
}

window.HalDoPomodoroApp={
  setMode(m){ if(pomoState.timer) clearInterval(pomoState.timer); pomoState={mode:m,running:false,endTime:0,timer:null,remaining:0}; buildPomodoro(); },
  toggle(){
    if(pomoState.running){
      pomoState.remaining=(pomoState.endTime-Date.now())/1000;
      clearInterval(pomoState.timer);
      pomoState.running=false;
      buildPomodoro();
    } else {
      pomoState.running=true;
      pomoState.endTime=Date.now()+(pomoState.remaining||POMO_DURATIONS[pomoState.mode])*1000;
      pomoState.remaining=0;
      pomoState.timer=setInterval(()=>{
        const rem=Math.max(0,(pomoState.endTime-Date.now())/1000);
        const t=Math.ceil(rem);
        const mm=Math.floor(t/60), ss=t%60;
        const el=$('pomoTime');
        if(el) el.textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
        if(rem<=0){
          clearInterval(pomoState.timer);
          pomoState.timer=null;
          pomoState.running=false;
          HalDoPomodoroApp.finish();
        }
      },200);
      buildPomodoro();
      if(navigator.vibrate) navigator.vibrate(15);
    }
  },
  finish(){
    if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
    try {
      const ctx=new (window.AudioContext||window.webkitAudioContext)();
      const now=ctx.currentTime;
      [0,.3,.6].forEach(o=>{const osc=ctx.createOscillator(),g=ctx.createGain();
        osc.type='square';osc.frequency.setValueAtTime(880,now+o);
        g.gain.setValueAtTime(.001,now+o);g.gain.exponentialRampToValueAtTime(.3,now+o+.02);
        g.gain.exponentialRampToValueAtTime(.001,now+o+.25);
        osc.connect(g).connect(ctx.destination);osc.start(now+o);osc.stop(now+o+.3);});
    } catch(e){}
    if(pomoState.mode==='work'){
      HalDoPomodoro.complete();
      if(window.showToast) showToast('🍅 Arbeit fertig! Pause','success');
      if(window.HalDoMemory) HalDoMemory.remember('🍅 Pomodoro fertig','25 Min Fokus','learn',['pomodoro']);
      pomoState.mode=HalDoPomodoro.get().today%4===0?'long':'break';
    } else {
      if(window.showToast) showToast('☕ Pause vorbei!','success');
      pomoState.mode='work';
    }
    pomoState.remaining=0;
    buildPomodoro();
  },
  reset(){ if(pomoState.timer) clearInterval(pomoState.timer); pomoState={mode:pomoState.mode,running:false,endTime:0,timer:null,remaining:0}; buildPomodoro(); }
};

let statsState={result:null};

function buildStats(){
  const w=$('stats-window'); if(!w) return;

  let resultHtml='';

      '<div style="text-align:center"><div class="big" style="font-size:22px">'+r.min.toFixed(3)+'</div><div class="lbl">Min</div></div>'+
      '<div style="text-align:center"><div class="big" style="font-size:22px">'+r.max.toFixed(3)+'</div><div class="lbl">Max</div></div>'+
      '<div style="text-align:center"><div class="big" style="font-size:22px">'+r.sum.toFixed(3)+'</div><div class="lbl">Summe</div></div>'+
      '<div style="text-align:center"><div class="big" style="font-size:22px">'+r.range.toFixed(3)+'</div><div class="lbl">Spannweite</div></div>'+
      '<div style="text-align:center"><div class="big" style="font-size:22px">'+r.variance.toFixed(3)+'</div><div class="lbl">Varianz</div></div>'+
      '<div style="text-align:center"><div class="big" style="font-size:22px">'+r.stddev.toFixed(3)+'</div><div class="lbl">Std.Abw</div></div>'+
      '</div></div>'+
      '<div class="card"><div class="lbl" style="margin-bottom:8px">📈 Histogramm</div>'+
      '<div style="display:flex;gap:2px;height:100px;align-items:flex-end;padding:8px;background:rgba(0,0,0,.3);border-radius:10px">'+
      r.histogram.map(b=>'<div style="flex:1;min-width:8px;height:'+b.pct+'%;background:linear-gradient(180deg,#b478ff,#ff78c8);border-radius:3px 3px 0 0"></div>').join('')+
      '</div></div>';
  }
  w.innerHTML=
    '<div class="card">'+
    '<div class="lbl" style="margin-bottom:8px">📥 Daten eingeben</div>'+
    '<textarea class="os-textarea" id="stInput" placeholder="Zahlen durch Komma, Leerzeichen oder Zeilenumbruch getrennt&#10;&#10;Beispiel: 12, 15, 18, 22, 25, 28, 30" style="min-height:120px;margin-bottom:8px"></textarea>'+
    '<button class="os-btn primary full" onclick="HalDoStatsApp.calc()">📊 Analysieren</button>'+
    '</div>'+

}

window.HalDoStatsApp={
  calc(){
    const raw=$('stInput').value.trim();
    const nums=raw.split(/[\s,;]+/).map(Number).filter(n=>!isNaN(n));
    if(!nums.length){ if(window.showToast) showToast('⚠️ Keine Zahlen','error'); return; }
    const sorted=nums.slice().sort((a,b)=>a-b);
    const n=nums.length;
    const sum=nums.reduce((a,b)=>a+b,0);
    const mean=sum/n;
    const median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[(n-1)/2];
    const variance=nums.reduce((s,v)=>s+Math.pow(v-mean,2),0)/n;
    const min=sorted[0],max=sorted[n-1];
    // Histogramm
    const binCount=Math.min(15,Math.max(5,Math.ceil(Math.sqrt(n)*2)));
    const range=max-min||1;
    const binSize=range/binCount;
    const bins=Array(binCount).fill(0);
    nums.forEach(v=>{ const i=Math.min(binCount-1,Math.floor((v-min)/binSize)); bins[i]++; });
    const maxBin=Math.max(...bins)||1;
    statsState.result={
      n, sum, mean, median, min, max, range,
      variance, stddev:Math.sqrt(variance),
      histogram:bins.map(b=>({count:b,pct:(b/maxBin)*100}))
    };
    buildStats();
    if(navigator.vibrate) navigator.vibrate(15);
  }
};

    '</div>'+

    '<button class="os-btn '+(sciState.mode==='basic'?'primary':'')+'" style="flex:1;font-size:11px" onclick="HalDoSCCalc.setMode(\'basic\')">Basic</button>'+
    '<button class="os-btn '+(sciState.mode==='scientific'?'primary':'')+'" style="flex:1;font-size:11px" onclick="HalDoSCCalc.setMode(\'scientific\')">Scientific</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat('+cols+',1fr);gap:5px">'+
    keys.map(k=>{
      let cls='os-btn';
      if(k[1]==='eq'||k[1]==='clr') cls+=' primary';
      if(k[1]==='op') cls+='';
      return '<button class="'+cls+'" style="aspect-ratio:1;padding:0;font-size:'+(k[1]==='fn'?12:18)+'px;font-weight:900" onclick="HalDoSCCalc.key(\''+k[0]+'\')">'+k[0]+'</button>';
    }).join('')+
    '</div>';
}

window.HalDoSCCalc={
  setMode(m){ sciState.mode=m; buildSciCalc(); },
  key(k){
    let e=sciState.expr, r=sciState.res;
    if(k==='C'){ e=''; r='0'; }
    else if(k==='⌫'){ e=e.slice(0,-1); }
    else if(k==='='){
      try {
        const s=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')
          .replace(/π/g,'Math.PI').replace(/\^/g,'**')
          .replace(/√\(/g,'Math.sqrt(').replace(/sin\(/g,'Math.sin(')
          .replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')
          .replace(/ln\(/g,'Math.log(').replace(/log\(/g,'Math.log10(');
        const stripped=s.replace(/Math\.(PI|sqrt|sin|cos|tan|log|log10)/g,'X');
        if(!/^[0-9+\-*/().\sXe**]+$/.test(stripped)) throw new Error();
        const fn=new Function('return ('+s+')');
        const v=fn();
        if(!isFinite(v)) throw new Error();
        r=String(Math.round(v*1e10)/1e10);
      } catch(err){ r='Fehler'; }
    }
    else if(k==='±'){ if(e.startsWith('-')) e=e.slice(1); else e='-'+e; }
    else if(k==='%'){ e+='/100'; }
    else if(['sin','cos','tan','ln','log'].includes(k)){ e+=k+'('; }
    else if(k==='√'){ e+='√('; }
    else if(k==='π'){ e+='π'; }
    else e+=k;
    sciState.expr=e; sciState.res=r;
    buildSciCalc();
  }
};

// ═══════════════════════════════════════════════════════════
const UNITS={
  length:{n:'📏 Länge', units:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.344,ft:0.3048,in:0.0254}},
  mass:{n:'⚖️ Gewicht', units:{kg:1,g:0.001,mg:0.000001,t:1000,lb:0.45359237,oz:0.0283495}},
  area:{n:'▦ Fläche', units:{m2:1,km2:1000000,cm2:0.0001,ha:10000,ac:4046.86,ft2:0.092903}},
  volume:{n:'🧪 Volumen', units:{l:1,ml:0.001,m3:1000,gal:3.78541,qt:0.946353,cup:0.236588}},
  temp:{n:'🌡️ Temperatur', units:{c:1,f:1,k:1}},
  speed:{n:'🏎️ Geschwindigkeit', units:{kmh:1,ms:3.6,mph:1.60934,kn:1.852}},
  time:{n:'⏱️ Zeit', units:{s:1,min:60,h:3600,d:86400,w:604800}},
  data:{n:'💾 Daten', units:{b:1,kb:1024,mb:1048576,gb:1073741824,tb:1099511627776}}
};
let unitState={cat:'length', from:'m', to:'km', val:1};

function buildUnitConv(){
  const w=$('unit-conv-window'); if(!w) return;
  w.dataset.title='Einheiten'; w.dataset.icon='📏';
  const cat=UNITS[unitState.cat];
  const unitKeys=Object.keys(cat.units);
  if(!unitKeys.includes(unitState.from)) unitState.from=unitKeys[0];
  if(!unitKeys.includes(unitState.to)) unitState.to=unitKeys[1]||unitKeys[0];
  const result=unitConvert(unitState.cat,unitState.from,unitState.to,unitState.val);
  const cats=Object.entries(UNITS).map(([k,v])=>
    '<button class="os-btn '+(unitState.cat===k?'primary':'')+'" style="padding:8px 12px;font-size:11px;white-space:nowrap" onclick="HalDoUnitConv.setCat(\''+k+'\')">'+v.n+'</button>'
  ).join('');
  const opts=(sel)=>unitKeys.map(k=>'<option value="'+k+'" '+(sel===k?'selected':'')+'>'+k.toUpperCase()+'</option>').join('');
  w.innerHTML=
    '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px">'+cats+'</div>'+
    '<div class="card">'+
    '<input class="os-input" type="number" step="any" value="'+unitState.val+'" oninput="HalDoUnitConv.setVal(this.value)" style="font-size:24px;font-family:monospace;text-align:right;margin-bottom:8px">'+
    '<select class="os-select" onchange="HalDoUnitConv.setFrom(this.value)" style="margin-bottom:14px">'+opts(unitState.from)+'</select>'+
    '<div style="text-align:center;font-size:24px;color:var(--cyan);margin-bottom:14px">⇅</div>'+
    '<div style="padding:14px;background:rgba(0,0,0,.4);border:1.5px solid var(--border);border-radius:12px;text-align:right;font-size:22px;font-weight:900;color:var(--cyan);font-family:monospace;margin-bottom:8px">'+result+'</div>'+
    '<select class="os-select" onchange="HalDoUnitConv.setTo(this.value)">'+opts(unitState.to)+'</select>'+
    '</div>'+
    '<div style="text-align:center;font-size:11px;color:#7ce0ff;padding:8px">1 '+unitState.from.toUpperCase()+' = '+unitConvert(unitState.cat,unitState.from,unitState.to,1)+' '+unitState.to.toUpperCase()+'</div>';
}

function unitConvert(cat,from,to,val){
  const v=parseFloat(val)||0;
  if(cat==='temp'){
    let c;
    if(from==='c') c=v; else if(from==='f') c=(v-32)*5/9; else c=v-273.15;
    let out;
    if(to==='c') out=c; else if(to==='f') out=c*9/5+32; else out=c+273.15;
    return Math.round(out*1000)/1000;
  }
  const f=UNITS[cat].units[from], t=UNITS[cat].units[to];
  const r=v*f/t;
  if(Math.abs(r)<0.001&&r!==0) return r.toExponential(3);
  return Math.round(r*1e8)/1e8;
}

window.HalDoUnitConv={
  setCat(c){ unitState.cat=c; const keys=Object.keys(UNITS[c].units); unitState.from=keys[0]; unitState.to=keys[1]||keys[0]; buildUnitConv(); },
  setVal(v){ unitState.val=v; buildUnitConv(); },
  setFrom(f){ unitState.from=f; buildUnitConv(); },
  setTo(t){ unitState.to=t; buildUnitConv(); }
};

// 6. CURRENCY LIVE
// ═══════════════════════════════════════════════════════════
const CURRENCIES={EUR:'🇪🇺 Euro',USD:'🇺🇸 US-Dollar',GBP:'🇬🇧 Pfund',CHF:'🇨🇭 Franken',JPY:'🇯🇵 Yen',TRY:'🇹🇷 Lira',CNY:'🇨🇳 Yuan',RUB:'🇷🇺 Rubel',PLN:'🇵🇱 Złoty',INR:'🇮🇳 Rupie',BRL:'🇧🇷 Real',CAD:'🇨🇦 Dollar',AUD:'🇦🇺 Dollar',SEK:'🇸🇪 Krone',NOK:'🇳🇴 Krone'};
let currState={from:'EUR',to:'USD',val:100,rates:null,lastFetch:0};

async function fetchRates(base){
  if(currState.rates && Date.now()-currState.lastFetch<1800000) return currState.rates;
  try {
    const res=await fetch('https://api.frankfurter.app/latest?from='+base);
    const d=await res.json();
    currState.rates=d.rates;
    currState.lastFetch=Date.now();
    return d.rates;
  } catch(e){ return null; }
}

function buildCurrency(){
  const w=$('currency-window'); if(!w) return;
  w.dataset.title='Währung'; w.dataset.icon='💱';
  const opts=(sel)=>Object.entries(CURRENCIES).map(([k,v])=>'<option value="'+k+'" '+(sel===k?'selected':'')+'>'+v+'</option>').join('');
  w.innerHTML=
    '<div class="card">'+
    '<input class="os-input" type="number" step="any" value="'+currState.val+'" oninput="HalDoCurrency.setVal(this.value)" style="font-size:24px;font-family:monospace;text-align:right;margin-bottom:8px">'+
    '<select class="os-select" onchange="HalDoCurrency.setFrom(this.value)" style="margin-bottom:14px">'+opts(currState.from)+'</select>'+
    '<div style="text-align:center;font-size:24px;color:var(--cyan);margin-bottom:14px">⇅</div>'+
    '<div id="currResult" style="padding:16px;background:rgba(0,0,0,.4);border:1.5px solid var(--border);border-radius:12px;text-align:right;font-size:24px;font-weight:900;color:var(--cyan);font-family:monospace;margin-bottom:8px">⏳ Lade Kurs...</div>'+
    '<select class="os-select" onchange="HalDoCurrency.setTo(this.value)">'+opts(currState.to)+'</select>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">'+
    '<button class="os-btn" onclick="HalDoCurrency.setFrom(\'EUR\');HalDoCurrency.setTo(\'USD\')">🇪🇺→🇺🇸</button>'+
    '<button class="os-btn" onclick="HalDoCurrency.setFrom(\'USD\');HalDoCurrency.setTo(\'EUR\')">🇺🇸→🇪🇺</button>'+
    '<button class="os-btn" onclick="HalDoCurrency.setFrom(\'EUR\');HalDoCurrency.setTo(\'TRY\')">🇪🇺→🇹🇷</button>'+
    '<button class="os-btn" onclick="HalDoCurrency.setFrom(\'USD\');HalDoCurrency.setTo(\'TRY\')">🇺🇸→🇹🇷</button>'+
    '</div>'+
    '<div style="text-align:center;font-size:10px;color:#5a8ab0;padding:8px">🌐 Live-Kurse von Frankfurter API</div>';
  currUpdate();
}

async function currUpdate(){
  const el=$('currResult');
  if(!el) return;
  if(currState.from===currState.to){
    el.textContent=currState.val.toFixed(2);
    return;
  }
  const rates=await fetchRates(currState.from);
  if(!rates||!rates[currState.to]){
    el.textContent='❌ Nicht verfügbar';
    return;
  }
  const v=parseFloat(currState.val)||0;
  const result=Math.round(v*rates[currState.to]*100)/100;
  el.textContent=result.toFixed(2)+' '+currState.to;
}

window.HalDoCurrency={
  setVal(v){ currState.val=v; currUpdate(); },
  setFrom(f){ currState.from=f; buildCurrency(); },
  setTo(t){ currState.to=t; buildCurrency(); }
};

// 1. TRANSLATOR PRO (30 Sprachen)
// ═══════════════════════════════════════════════════════════
let trState={from:'de', to:'en', text:'', result:'', history:[]};

function trBuildLangOptions(selected){
  return Object.entries(LANGS).map(([k,v])=>
    '<option value="'+k+'" '+(selected===k?'selected':'')+'>'+v.n+'</option>'
  ).join('');
}

function buildTranslatorPro(){
  const w=$('translator-pro-window'); if(!w) return;
  w.dataset.title='Translator Pro'; w.dataset.icon='🌐';
  const history=trState.history.slice(0,10).map((h,i)=>
    '<div class="card" style="padding:8px;cursor:pointer" onclick="HalDoTranslatorPro.load('+i+')">'+
    '<div style="font-size:10px;color:#7ce0ff;margin-bottom:4px">'+LANGS[h.from].n+' → '+LANGS[h.to].n+'</div>'+
    '<div style="font-size:11px;color:#aaddff;margin-bottom:2px">'+esc(h.text.slice(0,80))+'</div>'+
    '<div style="font-size:12px;color:#fff;font-weight:700">'+esc(h.result.slice(0,100))+'</div>'+
    '</div>'
  ).join('');
  w.innerHTML=
    '<div class="card">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
    '<select class="os-select" id="trFrom" onchange="HalDoTranslatorPro.setFrom(this.value)">'+trBuildLangOptions(trState.from)+'</select>'+
    '<select class="os-select" id="trTo" onchange="HalDoTranslatorPro.setTo(this.value)">'+trBuildLangOptions(trState.to)+'</select>'+
    '</div>'+
    '<button class="os-btn" style="width:100%;margin-bottom:10px;padding:8px;font-size:12px" onclick="HalDoTranslatorPro.swap()">⇄ Sprachen tauschen</button>'+
    '<textarea class="os-textarea" id="trInput" placeholder="Text eingeben..." style="min-height:100px;margin-bottom:8px">'+esc(trState.text)+'</textarea>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="os-btn primary" style="flex:1" onclick="HalDoTranslatorPro.translate()">🔄 Übersetzen</button>'+
    '<button class="os-btn" onclick="HalDoTranslatorPro.mic()" title="Mikrofon">🎙️</button>'+
    '<button class="os-btn" onclick="HalDoTranslatorPro.speak()" title="Vorlesen">🔊</button>'+
    '</div>'+
    '</div>'+
    '<div class="card" style="background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(180,120,255,.1));border-color:var(--cyan)">'+
    '<div class="lbl" style="margin-bottom:8px">✨ Übersetzung</div>'+
    '<div id="trResult" style="font-size:15px;color:#fff;line-height:1.6;min-height:60px;font-weight:500">'+(trState.result?esc(trState.result):'<span style="color:#5a8ab0">Ergebnis erscheint hier...</span>')+'</div>'+
    '<div style="display:flex;gap:6px;margin-top:10px">'+
    '<button class="os-btn" style="flex:1;padding:8px;font-size:11px" onclick="HalDoTranslatorPro.copy()">📋 Kopieren</button>'+
    '<button class="os-btn" style="flex:1;padding:8px;font-size:11px" onclick="HalDoTranslatorPro.saveMemory()">💾 Merken</button>'+
    '</div></div>'+
    (history?'<div class="lbl" style="margin:14px 0 8px">📜 Verlauf</div>'+history:'');
}

window.HalDoTranslatorPro={
  setFrom(f){ trState.from=f; },
  setTo(t){ trState.to=t; },
  swap(){ const tmp=trState.from; trState.from=trState.to; trState.to=tmp; if(trState.result){ const tmp2=trState.text; trState.text=trState.result; trState.result=tmp2; } buildTranslatorPro(); },
  async translate(){
    const text=$('trInput').value.trim();
    if(!text){ if(window.showToast) showToast('⚠️ Text eingeben','error'); return; }
    trState.text=text;
    const r=$('trResult');
    r.innerHTML='<span style="color:#7ce0ff">⏳ Übersetze...</span>';
    try {
      const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,500))+'&langpair='+trState.from+'|'+trState.to;
      const res=await fetch(url);
      const d=await res.json();
      const out=(d.responseData&&d.responseData.translatedText)||'Keine Übersetzung';
      trState.result=out;
      trState.history.unshift({from:trState.from,to:trState.to,text,result:out,ts:Date.now()});
      trState.history=trState.history.slice(0,30);
      buildTranslatorPro();
      if(navigator.vibrate) navigator.vibrate(15);
    } catch(e){
      r.innerHTML='<span style="color:#ff8080">❌ Fehler. Internet prüfen.</span>';
    }
  },
  load(i){ const h=trState.history[i]; if(!h) return; trState.from=h.from; trState.to=h.to; trState.text=h.text; trState.result=h.result; buildTranslatorPro(); },
  mic(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ if(window.showToast) showToast('❌ Mikrofon n. verfügbar','error'); return; }
    const r=new SR();
    r.lang=LANGS[trState.from].code;
    r.onresult=e=>{ const t=e.results[0][0].transcript; $('trInput').value=t; trState.text=t; HalDoTranslatorPro.translate(); };
    r.start();
    if(window.showToast) showToast('🎙️ Sprich jetzt...','success');
  },
  speak(){
    const text=trState.result||$('trInput').value;
    if(!text||!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=LANGS[trState.to].code;
    window.speechSynthesis.speak(u);
  },
  copy(){
    if(!trState.result) return;
    if(navigator.clipboard?.writeText){
      navigator.clipboard.writeText(trState.result).then(()=>{ if(window.showToast) showToast('📋 Kopiert','success'); });
    }
  },
  saveMemory(){
    if(!trState.result) return;
    if(window.HalDoMemory) HalDoMemory.remember('🌐 '+trState.text.slice(0,40), trState.result.slice(0,200), 'learn', ['translate']);
    if(window.showToast) showToast('💾 Ins Memory','success');
  }
};

let dictState={word:'', results:null};

function buildDictionary(){
  const w=$('dictionary-window'); if(!w) return;
  w.dataset.title='Wörterbuch'; w.dataset.icon='📖';
  let resultHtml='';
  if(dictState.results && dictState.results.length){
    resultHtml=dictState.results.map(r=>{
      const meanings=(r.meanings||[]).map(m=>
        '<div style="margin-top:8px;padding:10px;background:rgba(0,0,0,.3);border-radius:10px">'+
        '<div style="font-size:11px;color:#7ce0ff;text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:6px">'+esc(m.partOfSpeech||'')+'</div>'+
        (m.definitions||[]).slice(0,3).map((d,i)=>
          '<div style="font-size:13px;color:#fff;margin-bottom:6px">'+(i+1)+'. '+esc(d.definition||'')+
          (d.example?'<div style="font-size:11px;color:#aaddff;font-style:italic;margin-top:2px;padding-left:12px">z.B. "'+esc(d.example)+'"</div>':'')+
          '</div>'
        ).join('')+
        '</div>'
      ).join('');
      return '<div class="card"><div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:4px">'+esc(r.word)+'</div>'+
        (r.phonetic?'<div style="font-size:13px;color:#7ce0ff;margin-bottom:8px">/'+esc(r.phonetic)+'/</div>':'')+
        meanings+'</div>';
    }).join('');
  } else if(dictState.results===null){
    resultHtml='<div class="empty"><div class="ei">📖</div><div class="et">Englisches Wörterbuch</div><div class="es">Gib ein englisches Wort ein</div></div>';
  } else {
    resultHtml='<div class="empty"><div class="ei">❓</div><div class="et">Kein Ergebnis</div><div class="es">Versuche ein anderes Wort</div></div>';
  }
  w.innerHTML=
    '<div class="card">'+
    '<div style="display:flex;gap:6px">'+
    '<input class="os-input" id="dictInput" placeholder="Englisches Wort..." value="'+esc(dictState.word)+'" onkeypress="if(event.key===\'Enter\')HalDoDictionary.search()" style="flex:1">'+
    '<button class="os-btn primary" onclick="HalDoDictionary.search()">🔍</button>'+
    '</div>'+
    '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
    '<button class="os-btn" style="padding:6px 10px;font-size:11px" onclick="HalDoDictionary.quick(\'hello\')">hello</button>'+
    '<button class="os-btn" style="padding:6px 10px;font-size:11px" onclick="HalDoDictionary.quick(\'world\')">world</button>'+
    '<button class="os-btn" style="padding:6px 10px;font-size:11px" onclick="HalDoDictionary.quick(\'love\')">love</button>'+
    '<button class="os-btn" style="padding:6px 10px;font-size:11px" onclick="HalDoDictionary.quick(\'water\')">water</button>'+
    '</div></div>'+
    '<div id="dictResult">'+resultHtml+'</div>';
}

window.HalDoDictionary={
  async search(word){
    const w=(word||$('dictInput').value).trim().toLowerCase();
    if(!w) return;
    dictState.word=w;
    const r=$('dictResult');
    r.innerHTML='<div class="empty"><div class="et">⏳ Suche...</div></div>';
    try {
      const res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));
      if(!res.ok) throw new Error();
      const d=await res.json();
      dictState.results=d;
      buildDictionary();
      if(window.HalDoMemory) HalDoMemory.remember('📖 Wörterbuch: '+w, d[0]?.meanings?.[0]?.definitions?.[0]?.definition||'', 'learn', ['dictionary']);
    } catch(e){
      dictState.results=[];
      buildDictionary();
    }
  },
  quick(w){ $('dictInput').value=w; this.search(w); }
};

window.HalDoVocab={
  key:'haldo_vocab_v1',
  all(){ return store(this.key,[]); },
  add(q, a, lang){
    const v=this.all();
    v.unshift({id:uid('v_'), q, a, lang:lang||'en', seen:false, correct:0, wrong:0, created:Date.now()});
    save(this.key, v.slice(0,1000));
    return v[0].id;
  },
  remove(id){ save(this.key, this.all().filter(v=>v.id!==id)); },
  update(id, correct){
    const v=this.all();
    const x=v.find(i=>i.id===id);
    if(x){ x.seen=true; if(correct) x.correct++; else x.wrong++; save(this.key,v); }
  }
};

let langQuizState={idx:0, score:0, current:null, answered:false};

function buildLangQuiz(){
  const w=$('language-quiz-window'); if(!w) return;
  w.dataset.title='Sprach-Quiz'; w.dataset.icon='🎯';
  if(langQuizState.idx>=10){
    const pct=Math.round(langQuizState.score/langQuizState.idx*100);
    w.innerHTML='<div class="card" style="text-align:center;padding:30px">'+
      '<div style="font-size:64px;margin-bottom:12px">'+(pct>=80?'🏆':'😅')+'</div>'+
      '<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:8px">Quiz beendet!</div>'+
      '<div class="big" style="margin:12px 0">'+langQuizState.score+' / '+langQuizState.idx+'</div>'+
      '<div style="font-size:14px;color:#88ccff;margin-bottom:20px">'+pct+'% richtig</div>'+
      '<button class="os-btn primary" style="padding:14px 30px" onclick="HalDoLangQuiz.restart()">🔄 Nochmal</button></div>';
    return;
  }
  if(!langQuizState.current){
    const shuffled=LANG_QUIZ.slice().sort(()=>Math.random()-.5);
    langQuizState.current=shuffled[0];
  }
  const q=langQuizState.current;
  const answers=q.a.map((a,i)=>{
    let cls='os-btn';
    if(langQuizState.answered){
      if(i===q.k) cls+=' primary';
    }
    return '<button class="'+cls+'" style="width:100%;padding:14px;font-size:14px;text-align:left;justify-content:flex-start;margin-bottom:8px;'+(langQuizState.answered?'pointer-events:none':'')+'" onclick="HalDoLangQuiz.answer('+i+')">'+esc(a)+'</button>';
  }).join('');
  w.innerHTML=
    '<div class="grid2" style="margin-bottom:14px">'+
    '<div class="card" style="text-align:center;padding:10px"><div class="big" style="font-size:18px">'+langQuizState.score+'/'+(langQuizState.idx+1)+'</div><div class="lbl">Punkte</div></div>'+
    '<div class="card" style="text-align:center;padding:10px"><div class="big" style="font-size:18px">'+(10-langQuizState.idx)+'</div><div class="lbl">Übrig</div></div>'+
    '</div>'+
    '<div class="card" style="padding:20px"><div style="font-size:18px;font-weight:900;color:#fff;line-height:1.5;margin-bottom:20px">'+esc(q.q)+'</div>'+answers+'</div>'+
    (langQuizState.answered?'<button class="os-btn primary full" style="margin-top:14px;padding:14px" onclick="HalDoLangQuiz.next()">Weiter →</button>':'');
}

window.HalDoLangQuiz={
  answer(i){
    if(langQuizState.answered) return;
    langQuizState.answered=true;
    if(i===langQuizState.current.k){
      langQuizState.score++;
      if(navigator.vibrate) navigator.vibrate([10,30,10]);
    } else {
      if(navigator.vibrate) navigator.vibrate([50,50,50]);
    }
    buildLangQuiz();
  },
  next(){
    langQuizState.idx++;
    langQuizState.current=null;
    langQuizState.answered=false;
    buildLangQuiz();
  },
  restart(){
    langQuizState={idx:0,score:0,current:null,answered:false};
    buildLangQuiz();
  }
};

  setLang(i){ prState.lang=i; buildPronounce(); },
  speak(i){
    const it=PRONUNCIATION[prState.lang].items[i]; if(!it) return;
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(it[0]);
    const langMap={0:'tr-TR',1:'ar-SA',2:'ku-TR',3:'fr-FR',4:'es-ES',5:'it-IT',6:'ja-JP',7:'zh-CN'};
    u.lang=langMap[prState.lang]||'en';
    u.rate=0.8;
    window.speechSynthesis.speak(u);
  }
};

// ═══════════════════════════════════════════════════════════
// 2. SPRACHEN ZUR BESTEHENDEN LISTE HINZUFÜGEN
// ═══════════════════════════════════════════════════════════
function extendLanguages(){
  // Wenn LANGS existiert, füge die neuen hinzu
  if(typeof LANGS !== 'undefined'){
    Object.assign(LANGS, EXTENDED_LANGS);
  }
  // Auch global verfügbar machen
  window.EXTENDED_LANGS = EXTENDED_LANGS;
  window.KURDISH_PLACES = KURDISH_PLACES;
  window.EZIDI_WORDS = EZIDI_WORDS;
}

// ═══════════════════════════════════════════════════════════
// 3. NAVIGATION MIT KURDISCHEN STÄDTEN
// ═══════════════════════════════════════════════════════════
let navState = { view: 'places', searchQuery: '', selectedPlace: null };

function buildNav(){
  let w = $('navigation-window');
  if(!w){
    w = document.createElement('div');
    w.id = 'navigation-window';
    document.body.appendChild(w);
    if(window.prepareWindow) window.prepareWindow(w);
  }
  w.dataset.title = 'Navigation · Kurdistan & Êzîdxan';
  w.dataset.icon = '🗺️';

  const places = Object.entries(KURDISH_PLACES);
  const filtered = navState.searchQuery
    ? places.filter(([k,p]) =>
        p.de.toLowerCase().includes(navState.searchQuery.toLowerCase()) ||
        (p.ku_kmr||'').toLowerCase().includes(navState.searchQuery.toLowerCase()) ||
        (p.ku_sor||'').toLowerCase().includes(navState.searchQuery.toLowerCase()))
    : places;

  // Tabs
  const tabsHtml = `
    <div style="display:flex;gap:4px;margin-bottom:12px">
      <button class="os-btn ${navState.view==='places'?'primary':''}" style="flex:1;font-size:11px;padding:8px" onclick="HalDoNav.setView('places')">📍 Orte</button>
      <button class="os-btn ${navState.view==='ezidxan'?'primary':''}" style="flex:1;font-size:11px;padding:8px" onclick="HalDoNav.setView('ezidxan')">🦚 Êzîdxan</button>
      <button class="os-btn ${navState.view==='map'?'primary':''}" style="flex:1;font-size:11px;padding:8px" onclick="HalDoNav.setView('map')">🗺️ Karte</button>
    </div>
  `;

  let body = '';

  if(navState.view === 'map'){
    // Einfache Karten-Ansicht mit OpenStreetMap
    body = `
      <div class="card" style="padding:0;overflow:hidden">
        <iframe
          width="100%"
          height="400"
          frameborder="0"
          style="border-radius:14px"
          src="https://www.openstreetmap.org/export/embed.html?bbox=41.0%2C34.0%2C46.0%2C38.0&layer=mapnik&marker=36.1911%2C44.0092">
        </iframe>
      </div>
      <div style="text-align:center;font-size:10px;color:#5a8ab0;margin-top:8px">
        🗺️ Karte: Kurdistan & Êzîdxan Region
      </div>
    `;
  } else {
    // Orte-Listen
    const isEzidxan = navState.view === 'ezidxan';
    const list = filtered.filter(([k,p]) => isEzidxan ? p.ezidi : true);

    body = `
      <div class="card">
        <input class="os-input" id="navSearch" placeholder="🔍 Stadt suchen..." value="${esc(navState.searchQuery)}" oninput="HalDoNav.search(this.value)" style="margin-bottom:8px">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${list.map(([k,p]) => {
          const isEzidi = p.ezidi;
          return `
            <div class="card" style="padding:12px;cursor:pointer;border-left:4px solid ${isEzidi ? '#ffc800' : '#00e5ff'}" onclick="HalDoNav.selectPlace('${k}')">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
                <div style="flex:1;min-width:0">
                  <div style="font-size:14px;font-weight:800;color:#fff">${isEzidi ? '🦚 ' : '📍 '}${esc(p.de)}</div>
                  <div style="font-size:11px;color:#7ce0ff;margin-top:2px">
                    <b>Kurmandschi:</b> ${esc(p.ku_kmr)} &nbsp;·&nbsp; <b>Sorani:</b> ${esc(p.ku_sor)}
                  </div>
                </div>
                ${isEzidi ? '<span style="font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(255,200,0,.2);color:#ffc800;font-weight:800">ÊZÎDXAN</span>' : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
      <div style="text-align:center;font-size:10px;color:#5a8ab0;margin-top:12px">
        📍 ${list.length} Orte · Kurdistan & Êzîdxan
      </div>
    `;
  }

  w.innerHTML = tabsHtml + body;
}

// ═══════════════════════════════════════════════════════════
// 4. ÊZÎDÎ WÖRTERBUCH & PHRASEN
// ═══════════════════════════════════════════════════════════
function buildEzidiPhrases(){
  let w = $('ezidi-language-window');
  if(!w){
    w = document.createElement('div');
    w.id = 'ezidi-language-window';
    document.body.appendChild(w);
    if(window.prepareWindow) window.prepareWindow(w);
  }
  w.dataset.title = 'Êzîdî Sprache';
  w.dataset.icon = '🦚';

  // Tabs
  const tabsHtml = `
    <div style="display:flex;gap:4px;margin-bottom:12px">
      <button class="os-btn ${window.__ezidiTab==='words'||!window.__ezidiTab?'primary':''}" style="flex:1;font-size:11px;padding:8px" onclick="HalDoEzidiLang.setTab('words')">📖 Wörter</button>
      <button class="os-btn ${window.__ezidiTab==='alphabet'?'primary':''}" style="flex:1;font-size:11px;padding:8px" onclick="HalDoEzidiLang.setTab('alphabet')">🔤 Alphabet</button>
      <button class="os-btn ${window.__ezidiTab==='phrases'?'primary':''}" style="flex:1;font-size:11px;padding:8px" onclick="HalDoEzidiLang.setTab('phrases')">💬 Sätze</button>
    </div>
  `;

  let body = '';

  if(window.__ezidiTab === 'alphabet'){
    // Êzîdî Alphabet (basierend auf Unicode-Vorschlag)
    // Das moderne Êzîdî-Alphabet hat ~30 Buchstaben, von rechts nach links
    const alphabet = ['𐺀','𐺁','𐺂','𐺃','𐺄','𐺅','𐺆','𐺇','𐺈','𐺉','𐺊','𐺋','𐺌','𐺍','𐺎','𐺏','𐺐','𐺑','𐺒','𐺓','𐺔','𐺕','𐺖','𐺗','𐺘','𐺙','𐺚','𐺛','𐺜','𐺝'];
    const latinMap = ['A','B','C','Ç','D','E','Ê','F','G','H','I','Î','J','K','L','M','N','O','P','Q','R','S','Ş','T','U','Û','V','W','X','Y','Z'];

    body = `
      <div class="card">
        <div class="lbl" style="margin-bottom:10px">🔤 Êzîdî Alphabet (Rechts nach Links)</div>
        <div style="font-size:11px;color:#aaddff;line-height:1.6;margin-bottom:12px">
          Das Êzîdî-Alphabet wird von rechts nach links geschrieben und dient zum Schreiben der Kurmandschi-Sprache, 
          der liturgischen Sprache der Êzîdî-Religion. Es wurde im 12. Jahrhundert verwendet und 2013 modernisiert.
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;direction:rtl">
          ${alphabet.map((a,i) => `
            <div style="text-align:center;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid rgba(255,200,0,.2)">
              <div style="font-size:26px;font-weight:900;color:#ffc800;font-family:'Noto Sans Yezidi',serif">${a}</div>
              <div style="font-size:11px;color:#7ce0ff;margin-top:4px">${latinMap[i]||'?'}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if(window.__ezidiTab === 'phrases'){
    // Sätze auf Êzîdî
    body = `
      <div class="card">
        <div class="lbl" style="margin-bottom:10px">💬 Êzîdî Sätze (Ezdîkî)</div>
      </div>
      ${EZIDI_WORDS.map(w => `
        <div class="card" style="padding:10px;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:12px;color:#7ce0ff">🇩🇪 ${esc(w.de)}</div>
            <div style="font-size:14px;color:#fff;font-weight:700;margin-top:4px">🦚 ${esc(w.ezidi)}</div>
            <div style="font-size:11px;color:#aaddff;margin-top:2px">🇹🇷 ${esc(w.tr)}</div>
          </div>
          <button class="os-btn" style="padding:8px 12px;font-size:14px" onclick="HalDoEzidiLang.speak('${esc(w.ezidi).replace(/'/g,"\\'")}')">🔊</button>
        </div>
      `).join('')}
    `;
  } else {
    // Wörterbuch
    body = `
      <div class="card">
        <div class="lbl" style="margin-bottom:10px">📖 Êzîdî Wörterbuch (${EZIDI_WORDS.length} Wörter)</div>
        <div style="display:grid;gap:6px">
          ${EZIDI_WORDS.map(w => `
            <div style="padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border-left:3px solid #ffc800">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                <div style="flex:1;min-width:0">
                  <div style="font-size:13px;font-weight:800;color:#fff">${esc(w.ezidi)}</div>
                  <div style="font-size:11px;color:#aaddff;margin-top:2px">🇩🇪 ${esc(w.de)}</div>
                </div>
                <button class="os-btn" style="padding:6px 10px;font-size:12px" onclick="HalDoEzidiLang.speak('${esc(w.ezidi).replace(/'/g,"\\'")}')">🔊</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  w.innerHTML = tabsHtml + body;
}

// ═══════════════════════════════════════════════════════════
// 5. PUBLIC API
// ═══════════════════════════════════════════════════════════
window.HalDoNav = {
  open(){
    buildNav();
    if(typeof openWin === 'function') openWin('navigation-window');
    if(window.HalDoUI?.closeAllPanels) setTimeout(()=>HalDoUI.closeAllPanels(), 150);
  },
  setView(v){ navState.view = v; buildNav(); },
  search(q){ navState.searchQuery = q; buildNav(); },
  selectPlace(key){
    const p = KURDISH_PLACES[key];
    if(!p) return;
    // Öffne OpenStreetMap mit dem Ort
    const url = `https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lng}#map=13/${p.lat}/${p.lng}`;
    if(window.showToast) showToast(`📍 ${p.de} (${p.ku_kmr})`, 'success');
    window.open(url, '_blank');
  }
};

window.HalDoEzidiLang = {
  open(){
    buildEzidiPhrases();
    if(typeof openWin === 'function') openWin('ezidi-language-window');
    if(window.HalDoUI?.closeAllPanels) setTimeout(()=>HalDoUI.closeAllPanels(), 150);
  },
  setTab(t){ window.__ezidiTab = t; buildEzidiPhrases(); },
  speak(text){
    if(!window.speechSynthesis || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ku-TR';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
};

// ═══════════════════════════════════════════════════════════
// 6. REGISTRY-MAPPING ERWEITERN
// ═══════════════════════════════════════════════════════════
function initV130(){
  extendLanguages();

  // Registry-Mapping für die neuen Apps
  if(window.HalDoRegistry){
    const orig = window.HalDoRegistry.openApp;
    window.HalDoRegistry.openApp = function(id){
      if(id === 'navigation' || id === 'maps' || id === 'ezidxan'){
        HalDoNav.open();
        return;
      }
      if(id === 'ezidi' || id === 'ezidi-sprache' || id === 'ezidi-kultur'){
        HalDoEzidiLang.open();
        return;
      }
      return orig.apply(this, arguments);
    };
  }

  // Rebuild-Mapping
  if(window.HalDoUI){
    const orig = window.HalDoUI.rebuild;
    window.HalDoUI.rebuild = function(id){
      if(id === 'navigation-window'){ buildNav(); return; }
      if(id === 'ezidi-language-window'){ buildEzidiPhrases(); return; }
      if(orig) orig(id);
    };
  }

  // Fenster vorbereiten
  ['navigation-window', 'ezidi-language-window'].forEach(id => {
    let el = $(id);
    if(!el){
      el = document.createElement('div');
      el.id = id;
      document.body.appendChild(el);
    }
    if(window.prepareWindow) window.prepareWindow(el);
  });

  console.log('%c🦚 v130 – Êzîdî & Kurdische Sprachen + Navigation geladen', 'color:#ffc800;font-weight:bold;font-size:14px');
  console.log('%c✅ Sprachen: Kurmandschi · Sorani · Gorani · Êzîdî', 'color:#4da8ff;font-weight:bold');
  console.log('%c✅ Navigation: Kurdistan & Êzîdxan mit ' + Object.keys(KURDISH_PLACES).length + ' Orten', 'color:#4da8ff;font-weight:bold');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', () => setTimeout(initV130, 1800));
} else {
  setTimeout(initV130, 1800);
}

})();
</script>
