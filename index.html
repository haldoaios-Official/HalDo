<!DOCTYPE html>

<head>

<style>
:root{--bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--border:#374151;--text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;--gold:#fbbf24;--danger:#ef4444;--success:#10b981;--warn:#f59e0b;--font:'Segoe UI',system-ui,sans-serif;--font-size:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#000;user-select:none;}
body{font-family:var(--font);color:var(--text);font-size:var(--font-size);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
#cosmos-canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;}
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);transition:opacity .5s;}

#welcome h2{font-size:clamp(14px,2vw,20px);color:#e5e7eb;font-weight:400;line-height:1.6;}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;}
#welcome .presented b{color:#fbbf24;}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);color:#fff;transition:transform .2s;}
#welcome .enter-btn:hover{transform:scale(1.05);}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(17,24,39,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 12px;gap:10px;z-index:9997;}
#taskbar.show{display:flex;}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:10px 20px;border-radius:10px;font-weight:bold;display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer;font-size:14px;}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow-x:auto;}
.taskbar-app{background:rgba(55,65,81,.5);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap;}
.taskbar-app:hover{border-color:var(--accent);}
#sys-clock{color:var(--dim);font-size:13px;font-weight:600;}

#start-menu.show{display:flex;}
.sm-drag-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--accent);background:rgba(0,0,0,.2);}
.sm-tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);}
.sm-tab{flex:1;padding:10px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;}
.sm-tab.active{color:var(--accent);background:rgba(6,182,212,.15);border-bottom:2px solid var(--accent);}
.sm-panel{flex:1;overflow-y:auto;padding:12px;display:none;}
.sm-panel.active{display:block;}
.sm-search{padding:8px 10px 10px;}
.sm-search input{background:rgba(0,0,0,.3);padding:8px 12px;border-radius:6px;}
.sm-apps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent;background:rgba(55,65,81,.2);}
.sm-app-card:hover{background:rgba(55,65,81,.6);border-color:var(--accent);transform:translateY(-2px);}
.sm-app-card .ico{font-size:22px;margin-bottom:4px;pointer-events:none;}
.sm-app-card .nm{font-size:9px;text-align:center;line-height:1.2;pointer-events:none;}
.settings-layout{display:flex;height:100%;min-height:480px;}
.settings-nav{width:190px;flex:none;padding:8px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:rgba(0,0,0,.3);}
.settings-nav-item{text-align:left;padding:9px 10px;font-size:12px;border-radius:6px;color:#a0c8e0;cursor:pointer;background:transparent;border:1px solid transparent;}
.settings-nav-item:hover{background:rgba(55,65,81,.5);color:#fff;}
.settings-nav-item.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.settings-content{flex:1;padding:16px;overflow-y:auto;}

.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(55,65,81,.5);gap:12px;}

.toggle{position:relative;width:44px;height:24px;background:rgba(55,65,81,.8);border-radius:12px;cursor:pointer;transition:background .2s;display:inline-block;}

.toggle.on::after{transform:translateX(20px);}
.window{position:fixed;background:rgba(10,14,26,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.7);min-width:380px;min-height:280px;}

#app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%,rgba(6,182,212,.2) 0%,rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px);}

.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.app-sidebar{width:180px;flex:none;padding:10px 8px;background:rgba(0,10,20,.6);border-right:1px solid rgba(55,65,81,.5);display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.side-btn{text-align:left;padding:9px 12px;font-size:12px;background:transparent;border:1px solid transparent;color:#a0c8e0;cursor:pointer;border-radius:8px;}
.side-btn:hover{background:rgba(55,65,81,.5);color:#fff;}
.side-btn.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.app-content{flex:1;padding:18px;overflow-y:auto;min-width:0;}

.app-content button{padding:9px 16px;margin:4px 4px 4px 0;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.app-content button:hover{background:var(--accent2);}

.list-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:6px;}
.list-row:hover{background:rgba(55,65,81,.6);border-color:var(--accent);}
.list-row .meta{color:var(--dim);font-size:11px;margin-left:auto;}
.muted{color:var(--dim);}
.chat-box{display:flex;flex-direction:column;height:100%;}
.chat-log{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid var(--border);margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}

.music-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);flex-wrap:wrap;}
.music-tab{padding:8px 14px;font-size:12px;border-radius:6px;cursor:pointer;color:#a0c8e0;border:1px solid transparent;}
.music-tab:hover{background:rgba(55,65,81,.5);color:#fff;}
.music-tab.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.music-content{flex:1;overflow-y:auto;padding:18px;}
.music-gen-form{background:rgba(31,41,55,.5);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.chip{padding:6px 12px;font-size:11px;border-radius:16px;background:rgba(55,65,81,.6);border:1px solid var(--border);cursor:pointer;color:#fff;}
.chip.active{background:rgba(6,182,212,.35);border-color:var(--accent);box-shadow:0 0 8px rgba(6,182,212,.4);}
.music-track{background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.music-track .actions{display:flex;gap:6px;flex-wrap:wrap;}
.tacho{position:relative;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at center,#1a1a2e 0%,#0a0a15 100%);border:6px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.tacho-inner{display:flex;flex-direction:column;align-items:center;z-index:1;}
.tacho-speed{font-size:56px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--accent);}
.tacho-unit{font-size:14px;color:var(--dim);letter-spacing:2px;}
.tacho-needle{position:absolute;width:6px;height:120px;background:linear-gradient(to top,#ef4444,transparent);top:30px;left:50%;transform-origin:bottom center;transform:translateX(-50%) rotate(0deg);transition:transform .1s;z-index:2;}
.konto-setup{max-width:500px;margin:20px auto;padding:24px;background:rgba(31,41,55,.6);border:1px solid var(--accent);border-radius:12px;}
.mail-layout{display:flex;height:100%;width:100%;}
.mail-list-panel{width:320px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;}
.mail-folder{padding:8px 14px;cursor:pointer;color:#a0c8e0;}
.mail-folder.active{background:rgba(6,182,212,.2);color:#fff;}
.mail-detail{flex:1;display:flex;flex-direction:column;}
.mail-compose{padding:20px;flex:1;overflow-y:auto;}
.mail-ai-bar{background:rgba(6,182,212,.15);border:1px solid var(--accent);border-radius:8px;padding:10px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;}
.holo-map{position:relative;width:100%;height:420px;background:radial-gradient(circle at center,#0a1a2e,#000);border-radius:12px;overflow:hidden;border:1px solid var(--accent);}
.klassen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:12px;}
.klasse-btn{background:rgba(55,65,81,.5);border:2px solid var(--border);border-radius:10px;padding:14px 8px;cursor:pointer;text-align:center;}
.klasse-btn.active{border-color:var(--accent);background:rgba(6,182,212,.25);}
.simulator{background:radial-gradient(circle at center,#0a2a3a,#000);border-radius:12px;padding:20px;text-align:center;margin-top:12px;}
.sim-answer{background:rgba(55,65,81,.6);border:2px solid var(--border);color:#fff;padding:14px;border-radius:10px;margin-bottom:8px;cursor:pointer;text-align:left;}
.sim-answer.correct{border-color:#10b981;background:rgba(16,185,129,.25);}
.sim-answer.wrong{border-color:#ef4444;background:rgba(239,68,68,.25);}
</style>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==================== DATEN & SETUP ==================== */
const GENRES = {'Kurdisch':['Dengbêjî','Stran','Lawik','Dîlok','Evînî','Şeybendî','Govend','Qewal','Êzidî-Hymnen','Kurdisch-Pop'],'Türkisch':['Arabesk','Türk Halk Müziği','Türk Sanat Müziği','Anadolu Rock','Özgün Müzik','Türküler'],'Arabisch':['Maqām','Tarab','Muwashshaḥ','Raï','Khaliji','Arabisch-Pop'],'Persisch':['Radif','Dastgāh','Persisch-Pop'],'Griechisch':['Rebetiko','Laïko','Entechno'],'Indisch':['Hindustani','Carnatic','Bollywood','Bhangra'],'Westlich':['Pop','Rock','Hip-Hop','R&B','Jazz','Klassik','Electronic','Ambient','Lo-Fi','Trailer/Epic','Country','Folk','Metal','Blues','Reggae','Funk','Soul','Indie'],'Latein':['Salsa','Bachata','Reggaeton','Bossa Nova'],'Afrikanisch':['Afrobeat','Highlife','Soukous'],'Sonstige':['Keltisch','Flamenco','Balkan','Klezmer','Gospel']};
const INSTRUMENTE = {'Tasten':['Klavier','Synthesizer','Orgel','Akkordeon'],'Saiten':['Gitarre (akustisch)','Gitarre (elektrisch)','Bass','Saz','Tembûr','Oud','Kanun','Kemençe','Violine','Cello'],'Bläser':['Flöte','Bilûr','Dûdûk','Zurna','Ney','Klarinette','Saxophon','Trompete'],'Drums':['Schlagzeug','Darbuka','Dehol','Bendir','Tumbalak'],'Elektronisch':['Synth-Lead','Synth-Pad']};
const STIMMUNGEN = ['Happy','Traurig','Romantisch','Episch','Dunkel','Chill','Hype','Nostalgisch','Melancholisch','Verträumt','Aggressiv','Entspannt','Feierlich','Hoffnungsvoll','Dramatisch'];
const STIMMTYPEN = ['Weiblich (Sopran)','Weiblich (Alt)','Männlich (Tenor)','Männlich (Bass)','Dengbêj-Stimme','Chor','Rap','Eigene geklonte Stimme'];
const MAIL_VORLAGEN = [{icon:'📄',title:'Anschreiben',body:'Sehr geehrte Damen und Herren,\n\nhiermit bewerbe ich mich um die Stelle.\n\nMit freundlichen Grüßen\nHalil Donma'},{icon:'📋',title:'Rechnung',body:'Rechnung Nr. [NR]\n\nLeistung: [Beschreibung]\nBetrag: [Betrag] €'},{icon:'✉️',title:'Kündigung',body:'Sehr geehrte Damen und Herren,\n\nhiermit kündige ich meinen Vertrag.\n\nMit freundlichen Grüßen\nHalil Donma'},{icon:'📝',title:'Antrag',body:'Antrag\n\nHiermit beantrage ich [was].\n\nMit freundlichen Grüßen\nHalil Donma'},{icon:'⚖️',title:'Vollmacht',body:'Vollmacht\n\nHiermit bevollmächtige ich [Name], [was] zu erledigen.'},{icon:'🎉',title:'Einladung',body:'Einladung\n\nLiebe/r [Name],\n\nhiermit lade ich dich zu [Anlass] ein.'}];
const SOUND_LIST=[{id:'beep',name:'Piepton'},{id:'siren',name:'Sirene'},{id:'bell',name:'Glocke'},{id:'alarm',name:'Alarm'},{id:'danger',name:'Gefahr'},{id:'chime',name:'Klingel'},{id:'silent',name:'Stumm'}];

const LANGCODES={de:'de-DE',en:'en-US',ku:'tr-TR',ar:'ar-SA',tr:'tr-TR'};
const LANGNAMES={de:'🇩🇪 Deutsch',en:'🇬🇧 English',ku:'☀️ Kurdî',ar:'🇸🇦 العربية',tr:'🇹🇷 Türkçe'};
let currentLang=localStorage.getItem('haldo_lang')||'de';
const store=(k,d)=>{try{const v=localStorage.getItem('haldo_'+k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>localStorage.setItem('haldo_'+k,JSON.stringify(v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ==================== TTS & SOUND ==================== */
let allVoices=[];
function loadVoices(){if(!('speechSynthesis'in window))return;allVoices=speechSynthesis.getVoices();}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function speak(text,voiceType='default',langCode=null,specificVoiceName=null){
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang=langCode||LANGCODES[currentLang]||'de-DE';
  if(!allVoices.length)allVoices=speechSynthesis.getVoices();
  let sv=null;
  if(specificVoiceName)sv=allVoices.find(v=>v.name===specificVoiceName);
  else if(voiceType==='male')sv=allVoices.find(v=>/male|mann|hans|stefan|david|mark/i.test(v.name));
  else if(voiceType==='female')sv=allVoices.find(v=>/female|frau|anna|marlene|zira|samantha|hedda|google/i.test(v.name));
  if(sv)u.voice=sv; speechSynthesis.speak(u);
}
function playGlassSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(1200,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(1800,ctx.currentTime+.1);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.5);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1.5);}catch(e){}}

const viewMusic=function(body){
  body.style.cssText='display:flex;height:100%;flex-direction:column;';const tabs=document.createElement('div');tabs.className='music-tabs';const content=document.createElement('div');content.className='music-content';body.appendChild(tabs);body.appendChild(content);
  let active='studio';let tracks=store('music_tracks',[]);
  let defaultSettings={prompt:'',bpm:120,key:'C',duration:15,lyrics:'',instrumental:false,genres:['Pop'],instrumente:['Klavier','Bass','Schlagzeug'],stimmungen:['Happy'],stimme:'Weiblich (Sopran)',langCode:'de'};
  let loaded=store('music_settings',{});let settings=Object.assign({},defaultSettings,loaded);
  if(!Array.isArray(settings.genres))settings.genres=['Pop'];if(!Array.isArray(settings.instrumente))settings.instrumente=['Klavier','Bass','Schlagzeug'];if(!Array.isArray(settings.stimmungen))settings.stimmungen=['Happy'];
  const persistTracks=()=>save('music_tracks',tracks);const persistSettings=()=>save('music_settings',settings);let generating=false;
  speak('Willkommen im HalDo Musik Studio.');
  function chipsGroup(items,activeItems,onToggle){let arr=Array.isArray(activeItems)?activeItems:[];const g=document.createElement('div');g.className='chip-group';items.forEach(it=>{const c=document.createElement('div');c.className='chip'+(arr.includes(it)?' active':'');c.textContent=it;c.onclick=()=>{if(c.classList.contains('active')){c.classList.remove('active');const i=arr.indexOf(it);if(i>-1)arr.splice(i,1);}else{c.classList.add('active');arr.push(it);}onToggle&&onToggle();};g.appendChild(c);});return g;}
  function render(){tabs.innerHTML='';[['studio','🎛️ Studio'],['lyrics','✍️ Songtext'],['voice','🎤 Stimme'],['library','📚 Bibliothek']].forEach(([id,label])=>{const t=document.createElement('button');t.className='music-tab'+(active===id?' active':'');t.textContent=label;t.onclick=()=>{active=id;render();};tabs.appendChild(t);});content.innerHTML='';if(active==='studio')renderStudio();else if(active==='lyrics')renderLyrics();else if(active==='voice')renderVoice();else renderLibrary();}
  function renderStudio(){
    content.innerHTML='<h3>🎛️ Musik generieren</h3>';
    content.innerHTML+='<div class="music-gen-form"><h4>📝 Beschreibe deine Musik</h4><textarea id="mu-prompt" placeholder="z.B. Ein fröhlicher Popsong">'+esc(settings.prompt)+'</textarea></div>';
    const gT=document.createElement('h4');gT.textContent='🎼 Genres';content.appendChild(gT);
    Object.keys(GENRES).forEach(k=>{const l=document.createElement('div');l.style.cssText='font-size:11px;color:var(--dim);margin:6px 0 2px;';l.textContent=k;content.appendChild(l);content.appendChild(chipsGroup(GENRES[k],settings.genres,persistSettings));});
    const iT=document.createElement('h4');iT.textContent='🎹 Instrumente';content.appendChild(iT);
    Object.keys(INSTRUMENTE).forEach(k=>{const l=document.createElement('div');l.style.cssText='font-size:11px;color:var(--dim);margin:6px 0 2px;';l.textContent=k;content.appendChild(l);content.appendChild(chipsGroup(INSTRUMENTE[k],settings.instrumente,persistSettings));});
    const mT=document.createElement('h4');mT.textContent='🎭 Stimmungen';content.appendChild(mT);
    content.appendChild(chipsGroup(STIMMUNGEN,settings.stimmungen,persistSettings));
    const params=document.createElement('div');params.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:12px;';
    params.innerHTML='<div><label style="font-size:11px;color:var(--dim);">BPM</label><input type="number" id="mu-bpm" value="'+settings.bpm+'"></div><div><label style="font-size:11px;color:var(--dim);">Key</label><select id="mu-key">'+['C','D','E','F','G','A','B'].map(k=>'<option'+(settings.key===k?' selected':'')+'>'+k+'</option>').join('')+'</select></div><div><label style="font-size:11px;color:var(--dim);">Dauer (s)</label><input type="number" id="mu-dur" value="'+settings.duration+'" min="5" max="60"></div><div><label style="font-size:11px;color:var(--dim);">Instr.</label><br><span class="toggle '+(settings.instrumental?'on':'')+'" id="mu-inst"></span></div>';
    content.appendChild(params);setTimeout(()=>{const el=document.getElementById('mu-inst');if(el)el.onclick=(e)=>{e.stopPropagation();el.classList.toggle('on');};},0);
    const statusDiv=document.createElement('div');statusDiv.id='mu-status';content.appendChild(statusDiv);
    const genBtn=document.createElement('button');genBtn.id='mu-gen';genBtn.textContent=generating?'⏳ Generiere...':'🎼 Song generieren';genBtn.style.cssText='margin-top:16px;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:700;border-radius:10px;border:none;width:100%;cursor:pointer;';genBtn.disabled=generating;
    genBtn.onclick=async()=>{
      if(generating)return;settings.prompt=document.getElementById('mu-prompt').value;settings.bpm=parseInt(document.getElementById('mu-bpm').value)||120;settings.key=document.getElementById('mu-key').value;settings.duration=Math.max(5,Math.min(60,parseInt(document.getElementById('mu-dur').value)||15));settings.instrumental=document.getElementById('mu-inst').classList.contains('on');persistSettings();
      if(settings.genres.length===0)settings.genres=['Pop'];if(settings.instrumente.length===0)settings.instrumente=['Klavier','Bass','Schlagzeug'];if(settings.stimmungen.length===0)settings.stimmungen=['Happy'];
      generating=true;genBtn.textContent='⏳ Generiere...';genBtn.disabled=true;const st=document.getElementById('mu-status');if(st){st.className='status-msg';st.textContent='🎵 Komponiere...';}speak('Generiere Musik.');
      try{await new Promise(r=>setTimeout(r,50));const buffer=await generateSong({bpm:settings.bpm,key:settings.key,duration:settings.duration,genres:settings.genres,instrumente:settings.instrumente,stimmungen:settings.stimmungen});const trackId=Date.now();audioBufferStore.set(trackId,buffer);tracks.unshift({id:trackId,title:settings.prompt.substring(0,60)||'Song',genres:[...settings.genres],stimmungen:[...settings.stimmungen],bpm:settings.bpm,key:settings.key,duration:settings.duration,lyrics:settings.lyrics});persistTracks();generating=false;if(st){st.className='status-msg success';st.textContent='✅ Fertig! Wechsle zu Bibliothek.';}playAlarm('chime',2);speak('Song fertig!');setTimeout(()=>{active='library';render();},500);}catch(e){generating=false;if(st){st.className='status-msg error';st.textContent='❌ Fehler: '+e.message;}genBtn.textContent='🎼 Song generieren';genBtn.disabled=false;console.error(e);}
    };content.appendChild(genBtn);
  }
  function renderLyrics(){
    content.innerHTML='<h3>✍️ Songtext</h3>';
    content.innerHTML+='<div class="music-gen-form"><h4>📝 Thema</h4><textarea id="ly-topic" placeholder="z.B. Liebeslied"></textarea></div>';
    const genBtn=document.createElement('button');genBtn.textContent='🤖 Songtext generieren';genBtn.onclick=()=>{const topic=document.getElementById('ly-topic').value;if(!topic){alert('Bitte Thema.');return;}const lines=topic.split(' ').slice(0,3).join(' ');const lyrics='[Verse 1]\nIn der Nacht, wenn Sterne funkeln,\n'+lines+', so fern und nah.\n\n[Chorus]\nHalDo AI, mein Freund im Licht,\nführt mich durch die Dunkelheit.';document.getElementById('ly-editor').value=lyrics;settings.lyrics=lyrics;persistSettings();speak('Generiert.');};content.appendChild(genBtn);
    const edT=document.createElement('h4');edT.textContent='📝 Editor';content.appendChild(edT);
    const ed=document.createElement('textarea');ed.id='ly-editor';ed.value=settings.lyrics;ed.style.cssText='min-height:300px;font-family:monospace;';ed.oninput=()=>{settings.lyrics=ed.value;persistSettings();};content.appendChild(ed);
  }
  function renderVoice(){content.innerHTML='<h3>🎤 Stimme</h3>';content.innerHTML+='<div class="voice-recorder"><div class="pulse" onclick="alert(\'Demo: Mikrofon-Aufnahme gestartet\')">🎙️</div><p style="font-size:12px;color:var(--dim);">Eigene Stimme klonen (Demo)</p></div>';}
  function renderLibrary(){
    content.innerHTML='<h3>📚 Bibliothek ('+tracks.length+')</h3>';if(!tracks.length){content.innerHTML+='<p class="muted">Keine Songs.</p>';return;}
    tracks.forEach(t=>{const el=document.createElement('div');el.className='music-track';const gStr=Array.isArray(t.genres)?t.genres.join(', '):'';el.innerHTML='<div class="track-title">🎵 '+esc(t.title)+'</div><div class="track-meta">'+gStr+' · '+t.bpm+' BPM</div>';const acts=document.createElement('div');acts.className='actions';const buf=audioBufferStore.get(t.id);if(buf){const playBtn=document.createElement('button');playBtn.textContent='▶ Abspielen';playBtn.onclick=()=>{speak('Spiele '+t.title);playAudioBuffer(buf);if(settings.lyrics&&'speechSynthesis'in window){setTimeout(()=>{const words=settings.lyrics.replace(/\[.*?\]/g,'').split(/\s+/).filter(w=>w.length>0);let i=0;const sing=()=>{if(i>=words.length)return;const u=new SpeechSynthesisUtterance(words[i]);u.lang='de-DE';u.rate=0.8;u.onend=()=>{i++;setTimeout(sing,80);};speechSynthesis.speak(u);};sing();},500);}};acts.appendChild(playBtn);const dl=document.createElement('button');dl.textContent='💾 WAV';dl.className='ghost';dl.onclick=()=>{const wav=audioBufferToWav(buf);const url=URL.createObjectURL(wav);const a=document.createElement('a');a.href=url;a.download=(t.title||'song').replace(/[^a-z0-9]/gi,'_')+'.wav';a.click();URL.revokeObjectURL(url);};acts.appendChild(dl);}else{acts.innerHTML='<span class="muted">Audio im Speicher abgelaufen</span>';}const del=document.createElement('button');del.textContent='🗑';del.className='danger';del.onclick=()=>{if(confirm('Löschen?')){tracks=tracks.filter(x=>x.id!==t.id);audioBufferStore.delete(t.id);persistTracks();render();}};acts.appendChild(del);el.appendChild(acts);content.appendChild(el);});
  }
  render();
};

const viewEmail=function(body){

/* ==================== WINDOW MANAGER ==================== */
const openWindows={};let zCounter=20;const nextZ=()=>zCounter++;
const REGISTRY=[
  {id:'A',ico:'🧠',nm:'HalDo AI',fn:viewAI},{id:'E',ico:'✉️',nm:'HalDo Mail',fn:viewEmail},{id:'N',ico:'🗺️',nm:'Navigation',fn:viewNavigation},{id:'BL',ico:'🚨',nm:'Blitzer',fn:viewBlitzerApp},{id:'MS',ico:'🎵',nm:'Musik Studio',fn:viewMusic},{id:'VD',ico:'🎬',nm:'Video Studio',fn:viewVideo},{id:'BD',ico:'🖼️',nm:'Bild Studio',fn:viewBild},{id:'FS',ico:'🚗',nm:'Fahrschule',fn:viewFahrschuleApp},{id:'B',ico:'🌐',nm:'Browser',fn:viewBrowser},{id:'C',ico:'📅',nm:'Calendar',fn:viewCalendar},{id:'D',ico:'📄',nm:'Documents',fn:viewDocuments},{id:'F',ico:'📂',nm:'Files',fn:viewFiles},{id:'G',ico:'🖼️',nm:'Gallery',fn:viewGallery},{id:'H',ico:'🩺',nm:'Health',fn:viewHealth},{id:'I',ico:'🌍',nm:'Internet',fn:viewInternet},{id:'J',ico:'📖',nm:'Journal',fn:viewJournal},{id:'K',ico:'⌨️',nm:'Keyboard',fn:viewKeyboard},{id:'L',ico:'🎓',nm:'Learning',fn:viewLearning},{id:'O',ico:'📊',nm:'Office',fn:viewOffice},{id:'P',ico:'📷',nm:'Photos',fn:viewPhotos},{id:'Q',ico:'🛠️',nm:'Quick Tools',fn:viewQuickTools},{id:'R',ico:'🎙️',nm:'Recorder',fn:viewRecorder},{id:'S',ico:'🛡️',nm:'Security',fn:viewSecurity},{id:'T',ico:'✅',nm:'Tasks',fn:viewTasks},{id:'U',ico:'🔄',nm:'Updates',fn:viewUpdates},{id:'W',ico:'🌤️',nm:'Weather',fn:viewWeather},{id:'X',ico:'🎨',nm:'eXperience',fn:viewExperience},{id:'Y',ico:'🏠',nm:'Your Life',fn:viewYourLife},{id:'Z',ico:'⚙️',nm:'System',fn:viewSystemCenter},{id:'AU',ico:'🚙',nm:'Auto',fn:viewAutoApp},{id:'KO',ico:'👥',nm:'Kontakte',fn:viewKontakte},{id:'NO',ico:'📝',nm:'Notizen',fn:viewNotizen},{id:'PW',ico:'🔑',nm:'Passwörter',fn:viewPasswort},{id:'FI',ico:'💰',nm:'Finanzen',fn:viewFinanzen},{id:'FT',ico:'💪',nm:'Fitness',fn:viewFitness},{id:'GE',ico:'🔁',nm:'Gewohnheiten',fn:viewGewohnheiten},{id:'WA',ico:'💧',nm:'Wasser',fn:viewWasser},{id:'ST',ico:'😊',nm:'Stimmung',fn:viewStimmung},{id:'RE',ico:'🍳',nm:'Rezepte',fn:viewRezepte},{id:'EI',ico:'🛒',nm:'Einkauf',fn:viewEinkauf},{id:'RS',ico:'✈️',nm:'Reisen',fn:viewReisen},{id:'VO',ico:'📚',nm:'Vokabeln',fn:viewVokabeln},{id:'FL',ico:'🎴',nm:'Flashcards',fn:viewFlashcards},{id:'NF',ico:'🚨',nm:'Notfall',fn:viewNotfall}
];
function populateStartMenu(){const grid=document.getElementById('sm-apps');if(!grid)return;grid.innerHTML='';REGISTRY.forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});}
function filterStartMenu(q){const grid=document.getElementById('sm-apps');if(!grid)return;const filt=REGISTRY.filter(a=>a.nm.toLowerCase().includes(q.toLowerCase()));grid.innerHTML='';filt.forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});}
document.querySelectorAll('.sm-tab').forEach(tab=>{tab.onclick=(e)=>{e.stopPropagation();document.querySelectorAll('.sm-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.sm-panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('sm-panel-'+tab.dataset.tab).classList.add('active');if(tab.dataset.tab==='settings')renderSettingsPanel();};});
function toggleStartMenu(e){if(e){e.stopPropagation();e.preventDefault();}const sm=document.getElementById('start-menu');if(sm.classList.contains('show'))sm.classList.remove('show');else{sm.classList.add('show');renderSettingsPanel();}}
document.addEventListener('click',function(e){const sm=document.getElementById('start-menu');if(!sm||!sm.classList.contains('show'))return;if(!e.target||!e.target.isConnected)return;if(sm.contains(e.target))return;if(e.target.closest('.start-btn'))return;sm.classList.remove('show');},false);

const SECTIONS=[{id:'haldocore',icon:'🌌',label:'HalDo Core'},{id:'general',icon:'🔧',label:'Allgemein'},{id:'display',icon:'🎨',label:'Anzeige'},{id:'language',icon:'🌐',label:'Sprache'},{id:'about',icon:'ℹ️',label:'Über'}];
let activeSetting='haldocore';
function renderSettingsPanel(){const nav=document.getElementById('settings-nav');const c=document.getElementById('settings-content');if(!nav||!c)return;nav.innerHTML='';SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='settings-nav-item'+(activeSetting===s.id?' active':'');b.textContent=s.icon+' '+s.label;b.onclick=(e)=>{e.stopPropagation();activeSetting=s.id;renderSettingsPanel();};nav.appendChild(b);});c.innerHTML='';const s=activeSetting;if(s==='haldocore')rHC(c);else if(s==='general')rG(c);else if(s==='display')rD(c);else if(s==='language')rL(c);else rA(c);}
function row(lbl,sub,ctrl){return '<div class="settings-row"><div><div class="lbl">'+lbl+'</div><div class="sub">'+sub+'</div></div><div class="ctrl">'+ctrl+'</div></div>';}
function rHC(c){c.innerHTML='<h3>🌌 HalDo Core</h3><div class="qt-panel" style="margin-bottom:16px;"><h4>Zentrale API (optional)</h4><p style="font-size:12px;color:var(--dim);">Für professionellen Gesang (Suno) und Videogenerierung. Musik-Synthese funktioniert <b>auch ohne API-Key</b> komplett offline.</p></div>';c.innerHTML+=row('🔑 API-Key','Optional','<input type="password" id="core-key" value="'+(localStorage.getItem('haldo_core_key')||'')+'">');const sv=document.createElement('button');sv.textContent='💾 Speichern';sv.style.marginTop='16px';sv.onclick=()=>{localStorage.setItem('haldo_core_key',document.getElementById('core-key').value);alert('✓');};c.appendChild(sv);}
function rG(c){c.innerHTML='<h3>🔧 Allgemein</h3>';c.innerHTML+=row('Gerätename','','<input value="'+(localStorage.getItem('haldo_device_name')||'HalDo AI OS')+'" oninput="localStorage.setItem(\'haldo_device_name\',this.value)">');}
function rD(c){c.innerHTML='<h3>🎨 Anzeige</h3>';const cur=localStorage.getItem('haldo_theme')||'#06b6d4';const btns=['#06b6d4','#b478ff','#10b981','#f59e0b','#ef4444','#ec4899'].map(col=>'<button style="background:'+col+';width:26px;height:26px;border-radius:50%;border:'+(col===cur?'3px solid #fff':'2px solid transparent')+';cursor:pointer;" onclick="document.documentElement.style.setProperty(\'--accent\',\''+col+'\');document.documentElement.style.setProperty(\'--accent2\',\''+col+'\');localStorage.setItem(\'haldo_theme\',\''+col+'\')"></button>').join('');c.innerHTML+=row('Akzentfarbe','',btns);}
function rL(c){c.innerHTML='<h3>🌐 Sprache</h3>';const sel='<select onchange="setLanguage(this.value)">'+Object.keys(LANGNAMES).map(k=>'<option value="'+k+'"'+(k===currentLang?' selected':'')+'>'+LANGNAMES[k]+'</option>').join('')+'</select>';c.innerHTML+=row('Systemsprache','',sel);}
function rA(c){c.innerHTML='<h3>ℹ️ Über</h3><div class="qt-panel"><h4>HalDo AI OS Pro Max</h4><p>v3.0.0 (Final)</p><p>Von Halil Donma</p><p>'+REGISTRY.length+' Apps</p><p>E-Mail: halil@haldo.ai</p></div>';}
function setLanguage(lang){currentLang=lang;localStorage.setItem('haldo_lang',lang);populateStartMenu();renderSettingsPanel();}

function openApp(id){const def=REGISTRY.find(a=>a.id===id);if(!def)return;const splash=document.getElementById('app-splash');if(splash){splash.querySelector('.splash-icon').textContent=def.ico;splash.querySelector('.splash-name').textContent=def.nm;splash.classList.add('show');setTimeout(()=>splash.classList.remove('show'),600);}document.getElementById('start-menu').classList.remove('show');if(openWindows[id]){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}return;}const win=document.createElement('div');win.className='window';win.id='win-'+id;win.style.width=id==='E'?'1000px':(id==='MS'||id==='VD'||id==='BD'?'950px':'880px');win.style.height=id==='E'?'640px':'600px';win.style.left=(60+Object.keys(openWindows).length*25)+'px';win.style.top=(40+Object.keys(openWindows).length*25)+'px';win.style.zIndex=nextZ();win.innerHTML='<div class="window-header" onmousedown="startDrag(event,\''+id+'\')"><div class="window-title">'+def.ico+' '+def.nm+'</div><div class="window-controls"><button class="win-btn" onclick="event.stopPropagation();minimizeApp(\''+id+'\')">—</button><button class="win-btn" onclick="event.stopPropagation();maximizeApp(\''+id+'\')">▢</button><button class="win-btn close" onclick="event.stopPropagation();closeApp(\''+id+'\')">✕</button></div></div><div class="window-body" id="body-'+id+'" style="display:flex;flex-direction:column;"></div>';document.body.appendChild(win);openWindows[id]=true;document.getElementById('taskbar-apps').innerHTML+='<div class="taskbar-app" id="tb-'+id+'" onclick="focusApp(\''+id+'\')">'+def.ico+' '+def.nm+'</div>';setTimeout(()=>{try{def.fn(document.getElementById('body-'+id));}catch(e){console.error(e);document.getElementById('body-'+id).innerHTML='<p style="color:#f77;padding:20px;">Fehler: '+e.message+'</p>';}},60);}
function closeApp(id){const w=document.getElementById('win-'+id);if(w)w.remove();const tb=document.getElementById('tb-'+id);if(tb)tb.remove();delete openWindows[id];}
function focusApp(id){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}}
function minimizeApp(id){const w=document.getElementById('win-'+id);if(w)w.classList.toggle('minimized');}
function maximizeApp(id){const w=document.getElementById('win-'+id);if(!w)return;if(w.dataset.max==='1'){w.style.left=w.dataset.l;w.style.top=w.dataset.t;w.style.width=w.dataset.wd;w.style.height=w.dataset.ht;w.dataset.max='0';}else{w.dataset.l=w.style.left;w.dataset.t=w.style.top;w.dataset.wd=w.style.width;w.dataset.ht=w.style.height;w.style.left='0';w.style.top='0';w.style.width='100vw';w.style.height='calc(100vh - 50px)';w.dataset.max='1';}}
let dragState=null;
function startDrag(e,id){if(e.target.closest('.win-btn'))return;const w=document.getElementById('win-'+id);if(!w)return;dragState={id,sx:e.clientX,sy:e.clientY,wx:w.offsetLeft,wy:w.offsetTop};w.style.zIndex=nextZ();}
addEventListener('mousemove',e=>{if(!dragState)return;const w=document.getElementById('win-'+dragState.id);if(!w||w.dataset.max==='1')return;w.style.left=(dragState.wx+e.clientX-dragState.sx)+'px';w.style.top=Math.max(0,dragState.wy+e.clientY-dragState.sy)+'px';});
addEventListener('mouseup',()=>{dragState=null;});

function enterApp(){document.getElementById('welcome').classList.add('hide');document.getElementById('taskbar').classList.add('show');populateStartMenu();renderSettingsPanel();playGlassSound();}
function startClock(){const c=document.getElementById('sys-clock');const tick=()=>c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000);}
document.addEventListener('DOMContentLoaded',()=>{initCosmos();startClock();populateStartMenu();renderSettingsPanel();const t2=localStorage.getItem('haldo_theme');if(t2){document.documentElement.style.setProperty('--accent',t2);document.documentElement.style.setProperty('--accent2',t2);}});
</script>
