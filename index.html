<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HalDo Arztbuch - 3D Anatomie Pro</title>
<style>
/* ============================================================
   BASIS & THEME (Wie gehabt)
============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070b12; --bg2:#0d1420;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);
  --accent:#00d4ff; --accent-2:#00ffa3;
  --danger:#ff4d6d; --warn:#ffb703;
  --text:#e8f1ff; --muted:#7e91ab;
  --r:16px;
}
html,body{height:100%;}
body{
  background: #000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

/* 3D Hintergrund */
#bg-canvas {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; z-index: 0; pointer-events: none;
}

/* ============================================================
   APP SHELL
============================================================ */
#app{display:none;height:100vh;height:100dvh;grid-template-columns:260px 1fr; position:relative; z-index:1;}
#app.ready{display:grid;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  background:rgba(10,16,26,.72); backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-right:1px solid var(--border); padding:22px 14px;
  display:flex;flex-direction:column;gap:4px; overflow-y:auto;z-index:50;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;}
.brand-logo{font-size:24px;font-weight:800;letter-spacing:-1px;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:-2px;}
.nav-section{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:14px 12px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px; padding:10px 12px;border-radius:12px;
  border:1px solid transparent; background:transparent;color:#c3d1e6;
  font-size:13.5px;font-weight:500;cursor:pointer; text-align:left;width:100%;font-family:inherit;
  transition:all .18s ease;
}
.nav-item:hover{background:var(--glass);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,rgba(0,212,255,.18),rgba(0,255,163,.06));border-color:rgba(0,212,255,.3);color:#fff;box-shadow:0 0 20px rgba(0,212,255,.12);}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0;}

/* ---------- MAIN ---------- */
#main{position:relative;overflow:hidden;padding:22px 26px;display:flex;flex-direction:column;height:100vh;height:100dvh;}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding-right:4px;}
.view.active{display:block;}
.view.active.col{display:flex;flex-direction:column;overflow:hidden;}

/* Mobile Menu */
#menuBtn{display:none;position:fixed;top:14px;left:14px;z-index:60;width:42px;height:42px;border-radius:12px;background:rgba(10,16,26,.85);backdrop-filter:blur(12px);border:1px solid var(--border);color:#fff;font-size:19px;cursor:pointer;align-items:center;justify-content:center;}
#backdrop{display:none;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);}
#backdrop.show{display:block;}

/* ============================================================
   CARDS & UI
============================================================ */
.view-head{margin-bottom:20px;}
.view-head h1{font-size:26px;font-weight:700;letter-spacing:-.5px;}
.view-head .sub{color:var(--muted);font-size:13px;margin-top:4px;}
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);}
.card-label{font-size:11px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:12px;font-weight:600;}

/* ============================================================
   ANATOMIE
============================================================ */
.anatomy-wrap{display:flex;flex-direction:column;flex:1;min-height:0;gap:14px;}
.anatomy-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.layer-btn{padding:8px 16px;border-radius:11px;border:1px solid var(--border);background:var(--glass);color:#c3d1e6;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s;display:flex;align-items:center;gap:7px;}
.layer-btn:hover{background:var(--glass-2);color:#fff;}
.layer-btn.active{background:linear-gradient(90deg,rgba(0,212,255,.22),rgba(0,255,163,.08));border-color:var(--accent);color:#fff;box-shadow:0 0 18px rgba(0,212,255,.2);}
.spacer{flex:1;}
#anatomy-canvas{flex:1;min-height:320px;border-radius:var(--r);border:1px solid var(--border);background:radial-gradient(circle at 50% 40%,rgba(0,212,255,.06),transparent 65%),rgba(6,10,16,.55);overflow:hidden;position:relative;}
#anatomy-canvas canvas{display:block;width:100%!important;height:100%!important;}
.anatomy-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(0,0,0,.5);padding:6px 14px;border-radius:99px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;}

/* NEU: Anatomie Auswahl-Leiste */
.type-selector {
  display: flex; gap: 10px; padding: 10px; background: rgba(0,0,0,0.4);
  border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px;
  overflow-x: auto; white-space: nowrap; align-items: center;
}
.type-btn {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--glass); color: #fff; cursor: pointer; font-size: 13px;
  transition: 0.2s; font-family: inherit; font-weight: 600;
}
.type-btn.active {
  background: var(--accent); color: #000; border-color: var(--accent);
}
.type-btn:hover:not(.active) { background: var(--glass-2); }

/* ============================================================
   MODAL
============================================================ */
#modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,10,.72);backdrop-filter:blur(6px);}
#modal.show{display:flex;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{width:100%;max-width:480px;max-height:80vh;overflow-y:auto;background:linear-gradient(160deg,rgba(20,30,44,.98),rgba(12,18,28,.98));border:1px solid rgba(0,212,255,.28);border-radius:20px;padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(0,212,255,.1);animation:slideUp .28s cubic-bezier(.4,0,.2,1);}
@keyframes slideUp{from{transform:translateY(18px);opacity:0;}to{transform:none;opacity:1;}}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:#fff;font-size:18px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,77,109,.25);}
.modal-box h2{font-size:21px;margin-bottom:4px;letter-spacing:-.3px;}
.modal-box p{font-size:13.5px;line-height:1.72;color:#c3d1e6;margin-top:14px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:none;color:#04121a;padding:10px 18px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;transition:.18s;}

/* Responsive */
@media (max-width:860px){
  #app{grid-template-columns:1fr;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;transform:translateX(-100%);}
  #sidebar.open{transform:none;}
  #main{padding:66px 16px 16px;}
  #menuBtn{display:flex;}
  .view-head h1{font-size:21px;}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<canvas id="bg-canvas"></canvas>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div>
        <div class="brand-logo">HalDo</div>
        <div class="brand-sub">Arztbuch Pro</div>
      </div>
    </div>
    <div class="nav-section">Übersicht</div>
    <button class="nav-item active" data-view="anatomie"><span class="ico">🧍</span> Anatomie 3D</button>
    <button class="nav-item" data-view="dashboard"><span class="ico">📊</span> Dashboard</button>
    <!-- Weitere Menüpunkte hier... -->
  </aside>

  <div id="backdrop"></div>
  <button id="menuBtn">☰</button>

  <main id="main">
    <!-- ============ ANATOMIE ============ -->
    <section id="view-anatomie" class="view active col">
      <div class="view-head">
        <h1>Anatomie 3D Pro</h1>
        <p class="sub">Morphing-System · Mensch & Tier · 4 Ebenen</p>
      </div>
      
      <div class="anatomy-wrap">
        <!-- Neue Auswahl-Leiste -->
        <div class="type-selector" id="type-selector">
          <button class="type-btn active" data-type="male">Männlich</button>
          <button class="type-btn" data-type="female">Weiblich</button>
          <button class="type-btn" data-type="child">Kind (M)</button>
          <button class="type-btn" data-type="baby">Baby</button>
          <button class="type-btn" data-type="wolf">Wolf (Tier)</button>
        </div>

        <div class="anatomy-toolbar">
          <button class="layer-btn" data-layer="haut">🫥 Haut</button>
          <button class="layer-btn" data-layer="muskeln">💪 Muskeln</button>
          <button class="layer-btn" data-layer="skelett">🦴 Skelett</button>
          <button class="layer-btn active" data-layer="organe">🫀 Organe</button>
          <div class="spacer"></div>
          <button class="layer-btn" id="resetCam">🔄 Kamera</button>
        </div>

        <div id="anatomy-canvas">
          <div class="anatomy-hint">Ziehen = Drehen · Scrollen = Zoom · Organ anklicken</div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ================= MODAL ================= -->
<div id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="btn-primary" id="modalSpeak">🔊 Vorlesen</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   HINTERGRUND (Erde)
============================================================ */
function initBackground() {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 2.8;

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 3, 5);
  scene.add(dirLight);

  const geometry = new THREE.SphereGeometry(1, 64, 64);
  const textureLoader = new THREE.TextureLoader();
  const earthMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
  const material = new THREE.MeshPhongMaterial({ map: earthMap });
  const earth = new THREE.Mesh(geometry, material);
  earth.rotation.y = 2.5;
  scene.add(earth);

  const clock = new THREE.Clock();
  function animateBg() {
    requestAnimationFrame(animateBg);
    const delta = clock.getDelta();
    earth.rotation.y += delta * 0.05;
    renderer.render(scene, camera);
  }
  animateBg();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
}
initBackground();

/* ============================================================
   3D ANATOMIE MORPHING SYSTEM
============================================================ */
let scene, camera, renderer, controls, raycaster, pointer;
let bodyRoot, currentAnatomy = 'male', currentLayer = 'organe';
const layers = {};
let organMeshes = [];

// Proportionen für das Morphing
const PROPORTIONS = {
  male:   { headScale: 1.0, torsoWidth: 1.0, torsoHeight: 1.0, legLength: 1.0, armLength: 1.0, yOffset: 1.0 },
  female: { headScale: 1.0, torsoWidth: 0.85, torsoHeight: 1.0, legLength: 1.0, armLength: 0.95, yOffset: 1.0 },
  child:  { headScale: 1.4, torsoWidth: 0.7, torsoHeight: 0.7, legLength: 0.6, armLength: 0.7, yOffset: 0.7 },
  baby:   { headScale: 1.8, torsoWidth: 0.6, torsoHeight: 0.5, legLength: 0.4, armLength: 0.5, yOffset: 0.5 }
};

function initAnatomy() {
  const host = document.getElementById('anatomy-canvas');
  const w = host.clientWidth, h = host.clientHeight;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
  camera.position.set(0, 1.15, 3.1);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  host.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.0, 0);
  controls.enableDamping = true;
  controls.minDistance = 1.0;
  controls.maxDistance = 5.5;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const key = new THREE.DirectionalLight(0xbfe9ff, 1.5); key.position.set(2.5, 3.5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xff5ea8, 0.85); rim.position.set(-3, 2, -3); scene.add(rim);

  // Bodenring
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.34, 0.42, 64), new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.32, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.005;
  scene.add(ring);

  bodyRoot = new THREE.Group();
  scene.add(bodyRoot);

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', onPointerDown);

  rebuildBody('male');
  
  const ro = new ResizeObserver(() => {
    const w = host.clientWidth, h = host.clientHeight;
    if(!w || !h) return;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  ro.observe(host);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   MORPHING BUILD LOGIC
============================================================ */
function rebuildBody(type) {
  currentAnatomy = type;
  // Altes Modell löschen
  while(bodyRoot.children.length > 0){ bodyRoot.remove(bodyRoot.children[0]); }
  layers.haut = new THREE.Group(); layers.muskeln = new THREE.Group(); layers.skelett = new THREE.Group(); layers.organe = new THREE.Group();
  organMeshes = [];

  if (type === 'wolf') {
    buildAnimalWolf();
  } else {
    const p = PROPORTIONS[type] || PROPORTIONS.male;
    buildHuman(p);
  }

  bodyRoot.add(layers.haut, layers.muskeln, layers.skelett, layers.organe);
  setLayer(currentLayer);
}

function buildHuman(p) {
  // MATERIALIEN
  const skinM = new THREE.MeshStandardMaterial({ color: 0x2fa8d8, emissive: 0x0a4a66, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false });
  const muscleM = new THREE.MeshStandardMaterial({ color: 0xa83232, roughness: 0.68 });
  const boneM = new THREE.MeshStandardMaterial({ color: 0xf2efe2, roughness: 0.55 });
  
  // Helper
  const add = (group, geo, mat, pos, scl) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(pos[0], pos[1], pos[2]);
    if(scl) m.scale.set(scl[0], scl[1], scl[2]);
    group.add(m); return m;
  };

  const yBase = 0.8 * p.yOffset; // Basis-Höhe für Beine

  // --- HAUT ---
  // Kopf (kind hat größeren Kopf)
  add(layers.haut, new THREE.SphereGeometry(0.115 * p.headScale, 24, 20), skinM, [0, yBase + 0.8 * p.torsoHeight + 0.1, 0], [1, 1.1, 0.95]);
  // Torso
  add(layers.haut, new THREE.CapsuleGeometry(0.155 * p.torsoWidth, 0.2 * p.torsoHeight, 8, 20), skinM, [0, yBase + 0.5 * p.torsoHeight, 0], [1.2, 1, 0.8]);
  // Beine
  for (const s of [1, -1]) {
    add(layers.haut, new THREE.CapsuleGeometry(0.08, 0.35 * p.legLength, 8, 16), skinM, [s*0.1, yBase - 0.1 * p.legLength, 0]);
    add(layers.haut, new THREE.CapsuleGeometry(0.06, 0.3 * p.legLength, 8, 16), skinM, [s*0.1, yBase - 0.35 * p.legLength, 0]);
  }
  // Arme
  for (const s of [1, -1]) {
    add(layers.haut, new THREE.CapsuleGeometry(0.05, 0.3 * p.armLength, 8, 16), skinM, [s*0.25 * p.torsoWidth, yBase + 0.5 * p.torsoHeight, 0]);
    add(layers.haut, new THREE.CapsuleGeometry(0.04, 0.25 * p.armLength, 8, 16), skinM, [s*0.28 * p.torsoWidth, yBase + 0.2 * p.torsoHeight, 0]);
  }

  // --- MUSKELN ---
  if (currentAnatomy !== 'baby') { // Babys haben keine ausgeprägten Muskeln
    add(layers.muskeln, new THREE.SphereGeometry(0.1, 16, 16), muscleM, [0.08, yBase + 0.6 * p.torsoHeight, 0.05], [1, 0.8, 0.5]); // Brust
    add(layers.muskeln, new THREE.SphereGeometry(0.1, 16, 16), muscleM, [-0.08, yBase + 0.6 * p.torsoHeight, 0.05], [1, 0.8, 0.5]);
    add(layers.muskeln, new THREE.BoxGeometry(0.12, 0.15, 0.05), muscleM, [0, yBase + 0.4 * p.torsoHeight, 0.06]); // Bauch
  }

  // --- SKELETT ---
  add(layers.skelett, new THREE.SphereGeometry(0.08 * p.headScale, 16, 16), boneM, [0, yBase + 0.8 * p.torsoHeight + 0.1, 0]); // Schädel
  add(layers.skelett, new THREE.CylinderGeometry(0.02, 0.02, 0.4 * p.torsoHeight, 8), boneM, [0, yBase + 0.4 * p.torsoHeight, 0]); // Wirbelsäule
  for(let i=0; i<4; i++) {
    const rib = new THREE.Mesh(new THREE.TorusGeometry(0.12 * p.torsoWidth, 0.01, 6, 20), boneM);
    rib.position.set(0, yBase + (0.3 + i*0.08) * p.torsoHeight, 0);
    rib.rotation.x = Math.PI / 2;
    layers.skelett.add(rib);
  }

  // --- ORGANE (Nur beim Menschen) ---
  const addOrgan = (geo, pos, color, key, scl) => {
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, emissive: color, emissiveIntensity: 0.3 });
    const m = add(layers.organe, geo, mat, pos, scl);
    m.userData.organ = key;
    organMeshes.push(m);
  };

  addOrgan(new THREE.SphereGeometry(0.06, 16, 16), [0, yBase + 0.8 * p.torsoHeight + 0.1, 0], '#f2a0c0', 'brain'); // Gehirn
  addOrgan(new THREE.SphereGeometry(0.05, 16, 16), [-0.03, yBase + 0.6 * p.torsoHeight, 0.02], '#e63946', 'heart', [1, 1.2, 1]); // Herz
  addOrgan(new THREE.SphereGeometry(0.06, 16, 16), [0.06, yBase + 0.6 * p.torsoHeight, 0], '#f4a6b8', 'lunge', [0.8, 1.4, 0.8]); // Lunge R
  addOrgan(new THREE.SphereGeometry(0.06, 16, 16), [-0.06, yBase + 0.6 * p.torsoHeight, 0], '#f4a6b8', 'lunge', [0.8, 1.4, 0.8]); // Lunge L
  addOrgan(new THREE.SphereGeometry(0.06, 16, 16), [0.05, yBase + 0.45 * p.torsoHeight, 0], '#8b2e2e', 'liver', [1.2, 0.6, 0.8]); // Leber
}

function buildAnimalWolf() {
  // Ein prozeduraler Wolf (vereinfacht)
  const furM = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
  const add = (group, geo, mat, pos, rot, scl) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(pos[0], pos[1], pos[2]);
    if(rot) m.rotation.set(rot[0], rot[1], rot[2]);
    if(scl) m.scale.set(scl[0], scl[1], scl[2]);
    group.add(m); return m;
  };

  // Körper (horizontal)
  add(layers.haut, new THREE.CapsuleGeometry(0.15, 0.4, 8, 16), furM, [0, 0.6, 0], [Math.PI/2, 0, 0]);
  // Kopf
  add(layers.haut, new THREE.SphereGeometry(0.12, 16, 16), furM, [0, 0.7, 0.3]);
  add(layers.haut, new THREE.ConeGeometry(0.06, 0.15, 8), furM, [0, 0.68, 0.45], [Math.PI/2, 0, 0]); // Schnauze
  // Ohren
  add(layers.haut, new THREE.ConeGeometry(0.04, 0.1, 4), furM, [0.08, 0.85, 0.25]);
  add(layers.haut, new THREE.ConeGeometry(0.04, 0.1, 4), furM, [-0.08, 0.85, 0.25]);
  // Beine
  for (const s of [1, -1]) {
    for (const z of [0.15, -0.15]) {
      add(layers.haut, new THREE.CylinderGeometry(0.03, 0.02, 0.5, 8), furM, [s*0.12, 0.25, z]);
    }
  }
  // Schwanz
  add(layers.haut, new THREE.ConeGeometry(0.05, 0.3, 8), furM, [0, 0.65, -0.25], [-Math.PI/4, 0, 0]);

  // Ebenen für Wolf (leer, um Fehler zu vermeiden)
  // In einem echten Tier-Anatomie-Modul würden wir hier Knochen und Organe hinzufügen.
}

/* ============================================================
   INTERAKTION & UI
============================================================ */
function setLayer(name) {
  currentLayer = name;
  for (const k in layers) if(layers[k]) layers[k].visible = (k === name);
  document.querySelectorAll('.layer-btn[data-layer]').forEach(b => b.classList.toggle('active', b.dataset.layer === name));
}

document.querySelectorAll('.layer-btn[data-layer]').forEach(b => b.addEventListener('click', () => setLayer(b.dataset.layer)));
document.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', (e) => {
  document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
  e.target.classList.add('active');
  rebuildBody(e.target.dataset.type);
}));

document.getElementById('resetCam').addEventListener('click', () => {
  camera.position.set(0, 1.15, 3.1);
  controls.target.set(0, 1.0, 0);
  controls.update();
});

function onPointerDown(e) {
  if (!layers.organe || !layers.organe.visible || organMeshes.length === 0) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(organMeshes, false);
  if (hits.length) openOrganModal(hits[0].object.userData.organ);
}

const ORGAN_INFO = {
  brain: { name: 'Gehirn', color: '#f2a0c0', text: 'Das Gehirn steuert alle Körperfunktionen. Bei Babys ist es im Verhältnis zum Körper besonders groß.' },
  heart: { name: 'Herz', color: '#e63946', text: 'Das Herz pumpt Blut durch den Körper. Es schlägt bei Kindern schneller als bei Erwachsenen.' },
  lunge: { name: 'Lunge', color: '#f4a6b8', text: 'Die Lunge versorgt das Blut mit Sauerstoff.' },
  liver: { name: 'Leber', color: '#8b2e2e', text: 'Die Leber ist das zentrale Stoffwechselorgan.' }
};

const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');

function openOrganModal(key) {
  const info = ORGAN_INFO[key];
  if (!info) return;
  modalTitle.innerHTML = `<span style="color:${info.color}">⬤</span> ${info.name}`;
  modalText.textContent = info.text;
  modal.classList.add('show');
  // TTS (vereinfacht)
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(info.name + '. ' + info.text);
    u.lang = 'de-DE';
    speechSynthesis.speak(u);
  }
}
document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

// Menü-Logik
const navItems = document.querySelectorAll('.nav-item');
const views = document.querySelectorAll('.view');
navItems.forEach(b => b.addEventListener('click', () => {
  navItems.forEach(n => n.classList.remove('active'));
  b.classList.add('active');
  views.forEach(v => v.classList.toggle('active', v.id === 'view-' + b.dataset.view));
}));

document.getElementById('menuBtn').addEventListener('click', () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('backdrop').classList.add('show'); });
document.getElementById('backdrop').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.remove('show'); });

setTimeout(() => {
  document.getElementById('app').classList.add('ready');
  initAnatomy();
}, 500);
</script>
