<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>HalDo AI OS · v142</title>
<style>
:root{--c1:#00e5ff;--c2:#4da8ff;--c3:#b478ff;--bg:#05060f;--panel:rgba(10,14,32,.72);--panel2:rgba(18,22,44,.85);--line:rgba(0,229,255,.28);--line2:rgba(255,255,255,.08);--txt:#e9edff;--dim:#8a95bd;--glow:0 0 12px rgba(0,229,255,.45),0 0 32px rgba(0,229,255,.15);--sh:0 26px 70px rgba(0,0,0,.6);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
body.cyborg{--c1:#ff78c8;--c2:#b478ff;--c3:#d484ff;--line:rgba(255,120,200,.32);--glow:0 0 12px rgba(255,120,200,.5),0 0 32px rgba(180,120,255,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
#cosmos{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(ellipse at 68% 14%,#101a3a 0%,#070a1c 45%,#03040c 100%)}
#stars{position:absolute;inset:0;display:block}
.sun{position:absolute;left:50%;top:52%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff8c8,var(--c1) 42%,var(--c3) 68%,rgba(0,0,0,0) 72%);box-shadow:0 0 70px 26px rgba(0,229,255,.32),0 0 200px 90px rgba(180,120,255,.15);animation:sunPulse 8s ease-in-out infinite}
@keyframes sunPulse{50%{transform:scale(1.06)}}
.orbit{position:absolute;left:50%;top:52%;border:1px solid rgba(255,255,255,.05);border-radius:50%;transform:translate(-50%,-50%);animation:spin linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.planet{position:absolute;left:50%;top:0;border-radius:50%;transform:translate(-50%,-50%)}
#topbar{position:fixed;top:var(--safe-t);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1.5px solid var(--line)}
#menuBtn{display:none}
.iconbtn{background:rgba(255,255,255,.06);border:1.5px solid var(--line);color:var(--txt);width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.iconbtn:hover{background:rgba(0,229,255,.12);box-shadow:var(--glow)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:800;color:#fff;flex:0 0 auto;background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 0 14px rgba(0,229,255,.5)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:13.5px;letter-spacing:.4px;white-space:nowrap}
.sm{font-size:11px}.dim{color:var(--dim)}.spacer{flex:1}
#search{width:220px;max-width:42vw;height:40px;border-radius:12px;padding:0 12px;background:rgba(255,255,255,.06);border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13px}
#search:focus{border-color:var(--c1);box-shadow:var(--glow)}
#clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);white-space:nowrap}
#sidebar{position:fixed;top:calc(var(--safe-t) + 56px);bottom:calc(var(--safe-b) + 56px);left:var(--safe-l);width:236px;z-index:8000;padding:14px 10px;background:var(--panel);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-right:1.5px solid var(--line);overflow-y:auto;transition:transform .28s cubic-bezier(.4,0,.2,1)}
#sidebar h4{margin:8px 4px;font-size:10.5px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;font-weight:700}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;margin-bottom:3px;background:transparent;border:1.5px solid transparent;border-radius:12px;color:var(--txt);cursor:pointer;font-size:13px;text-align:left;transition:.15s}
.catbtn:hover{background:rgba(0,229,255,.08);border-color:var(--line)}
.catbtn.active{background:rgba(0,229,255,.14);border-color:var(--c1);box-shadow:var(--glow)}
.catbtn .ico{font-size:16px;width:22px;text-align:center;flex:0 0 auto}
.catbtn .n{margin-left:auto;font-size:10.5px;color:var(--dim);padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.06)}
#desktop{position:fixed;top:calc(var(--safe-t) + 56px);left:calc(var(--safe-l) + 236px);right:var(--safe-r);bottom:calc(var(--safe-b) + 56px);z-index:1;overflow-y:auto;padding:18px 18px 40px}
#desktop h3{margin:22px 0 12px;font-size:14px;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--txt);font-weight:700}
#desktop h3:first-child{margin-top:0}
#desktop h3 .ico{font-size:18px}
#desktop h3 .n{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto;background:rgba(255,255,255,.06);padding:3px 9px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 5px;border-radius:15px;cursor:pointer;text-align:center;transition:.18s;border:1.5px solid transparent;user-select:none}
.app:hover{background:rgba(0,229,255,.06);border-color:var(--line);transform:translateY(-2px)}
.app:active{transform:scale(.95)}
.app .ic{font-size:26px;width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(150deg,rgba(0,229,255,.14),rgba(180,120,255,.08));border:1.5px solid var(--line);transition:.18s}
.app.ready:hover .ic{box-shadow:var(--glow)}
.app.soon .ic{opacity:.4}
.app .nm{font-size:11px;color:var(--dim);line-height:1.25;word-break:break-word;padding:0 2px}
.app.ready .nm{color:var(--txt);font-weight:500}
.window{position:fixed;z-index:200;display:flex;flex-direction:column;overflow:hidden;background:var(--panel2);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--sh),var(--glow);animation:winIn .2s}
@keyframes winIn{from{opacity:0;transform:scale(.95) translateY(12px)}}
.window.maxed{left:8px!important;top:64px!important;right:8px;bottom:8px;width:auto!important;height:auto!important;border-radius:14px}
.window.dragging{transition:none!important}
.win-head{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1.5px solid var(--line);user-select:none;touch-action:none;position:relative}
.win-head::before{content:'';position:absolute;left:100px;right:100px;top:0;bottom:0;cursor:grab}
.wic{font-size:16px;flex:0 0 auto}
.wtitle{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtns{display:flex;gap:5px;position:relative;z-index:999999}
.wb{width:40px;height:40px;border-radius:11px;border:1.5px solid transparent;background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;font-size:14px;display:grid;place-items:center;z-index:999999}
.wb:hover{background:rgba(0,229,255,.15);color:var(--txt)}
.wb.close:hover{background:#e03b5a;color:#fff}
.win-body{flex:1;overflow:auto;padding:16px;position:relative}
#bottomBar{position:fixed;bottom:var(--safe-b);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;background:var(--panel);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-top:1.5px solid var(--line)}
.bbtn{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500;transition:.15s}
.bbtn:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow)}
.bbtn.on{background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;border-color:var(--c1)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.big{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.05}
.big2{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{padding:9px 15px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500;transition:.15s;font-family:inherit}
.btn:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#fff;font-weight:600}
.btn.danger{background:rgba(224,59,90,.16);border-color:rgba(224,59,90,.5);color:#ff9db1}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.card{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.045);border:1.5px solid var(--line);font-size:13px}
.inp,.ta{width:100%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.055);border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13.5px;font-family:inherit;transition:.15s}
.inp:focus,.ta:focus{border-color:var(--c1);box-shadow:var(--glow)}
.ta{min-height:150px;resize:vertical;line-height:1.5}
.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:4px;display:block}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.045);border:1.5px solid var(--line2);font-size:13px}
.item .x{margin-left:auto;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.item .x:hover{background:rgba(224,59,90,.2);color:#ff9db1}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:22px 10px;font-style:italic}
.calc{max-width:340px;margin:0 auto}
.calc-disp{font-size:30px;font-weight:700;text-align:right;padding:16px 14px;border-radius:14px;background:rgba(0,0,0,.25);border:1.5px solid var(--line);margin-bottom:10px;min-height:66px;font-variant-numeric:tabular-nums}
.calc-disp .prev{font-size:12px;color:var(--dim);height:14px;overflow:hidden}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{padding:15px 0;border-radius:13px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);font-size:17px;cursor:pointer;font-weight:500}
.ck:hover{background:rgba(0,229,255,.14)}
.ck:active{transform:scale(.94)}
.ck.op{background:rgba(180,120,255,.12)}
.ck.wide{grid-column:span 2}
.ck.eq{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#fff;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal-h{text-align:center;font-size:11px;color:var(--dim);padding:4px 0;font-weight:600}
.cal-d{text-align:center;padding:9px 0;border-radius:10px;background:rgba(255,255,255,.04);font-size:13px}
.cal-d.today{background:var(--c1);color:#fff;font-weight:700;box-shadow:var(--glow)}
.cal-d.empty{background:transparent}
.ttt{display:grid;grid-template-columns:repeat(3,86px);gap:8px;margin:0 auto}
.tttc{height:86px;display:grid;place-items:center;font-size:36px;font-weight:800;border-radius:14px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);cursor:pointer;color:var(--txt)}
.tttc.x{color:var(--c1)}.tttc.o{color:var(--c3)}
.mem{display:grid;grid-template-columns:repeat(4,66px);gap:8px;margin:0 auto}
.mc{height:66px;display:grid;place-items:center;font-size:28px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);border:1.5px solid var(--line);user-select:none}
.mc.open{background:rgba(0,229,255,.24);border-color:var(--c1)}
.mc.done{background:rgba(180,120,255,.12);opacity:.55}
.g2048{display:grid;grid-template-columns:repeat(4,72px);gap:8px;padding:10px;border-radius:16px;background:rgba(0,0,0,.22);border:1.5px solid var(--line);margin:0 auto;width:fit-content}
.g2048 .t{height:72px;display:grid;place-items:center;font-size:22px;font-weight:800;border-radius:10px;color:#fff}
.snake-cv{display:block;margin:0 auto;background:#04050f;border:1.5px solid var(--line);border-radius:14px;max-width:100%;touch-action:none}
.hang-keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px;max-width:460px}
.hk{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:13px;font-weight:600}
.hk:disabled{opacity:.35}
.hk.bad{background:rgba(224,59,90,.32);border-color:#e03b5a}
.hk.good{background:rgba(0,229,255,.32);border-color:var(--c1)}
.piano{display:flex;justify-content:center;gap:3px;margin-top:12px;user-select:none}
.pk{width:52px;height:150px;border-radius:0 0 10px 10px;border:1.5px solid var(--line);background:linear-gradient(180deg,#fff,#dde3f5);color:#1a1d2e;font-weight:700;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:13px}
.pk:active,.pk.on{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translate(-50%,140%);z-index:9999;padding:11px 18px;border-radius:13px;background:rgba(10,14,32,.96);border:1.5px solid var(--line);font-size:13px;transition:transform .3s;max-width:88vw;text-align:center;box-shadow:var(--sh),var(--glow)}
#toast.on{transform:translate(-50%,0)}
#searchRes{position:fixed;top:calc(var(--safe-t) + 60px);left:50%;transform:translateX(-50%);width:min(90vw,420px);max-height:60vh;overflow-y:auto;z-index:9500;padding:8px;background:var(--panel2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--sh),var(--glow);display:none}
#searchRes.on{display:block}
#searchRes .sr{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;font-size:13px}
#searchRes .sr:hover{background:rgba(0,229,255,.1)}
@media(max-width:820px){
#menuBtn{display:grid}
#sidebar{transform:translateX(-105%)}
#sidebar.open{transform:translateX(0);box-shadow:14px 0 40px rgba(0,0,0,.55)}
#desktop{left:var(--safe-l);padding:14px 12px 30px}
.brand{display:none}
#search{width:auto;flex:1;max-width:none}
#clock{display:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.app .ic{width:48px;height:48px;font-size:24px}
.window{border-radius:0!important}
.window.maxed{left:0!important;top:56px!important;right:0;bottom:56px;border-radius:0!important}
.mem{grid-template-columns:repeat(4,1fr);width:100%;max-width:340px}
.mc{height:auto;aspect-ratio:1}
.ttt{grid-template-columns:repeat(3,1fr);width:100%;max-width:300px}
.tttc{height:auto;aspect-ratio:1}
.g2048{grid-template-columns:repeat(4,1fr);width:100%;max-width:340px}
.g2048 .t{height:auto;aspect-ratio:1;font-size:18px}
.pk{width:40px;height:130px}
#bottomBar{gap:5px;padding:0 8px}
.bbtn{padding:9px 10px;font-size:12px}
.bbtn span.lbl-txt{display:none}
.calc{max-width:100%}
}
</style>
</head>
<body class="holo">
<div id="cosmos"><canvas id="stars"></canvas></div>
<header id="topbar">
<button id="menuBtn" class="iconbtn">☰</button>
<div class="logo" id="logoBtn">🦚</div>
<div class="brand"><b>HalDo AI OS</b><span id="ver" class="dim sm">v142</span></div>
<div class="spacer"></div>
<input id="search" placeholder="Apps suchen…" autocomplete="off" autocapitalize="off">
<div id="clock" class="dim"></div>
<button class="iconbtn" id="themeBtn">⚡</button>
</header>
<aside id="sidebar"></aside>
<main id="desktop"></main>
<div id="bottomBar">
<button class="bbtn" data-act="chat">💬 <span class="lbl-txt">Chat</span></button>
<button class="bbtn" data-act="ai">🤖 <span class="lbl-txt">AI</span></button>
<button class="bbtn cyborg" data-act="cyborg">⚡ <span class="lbl-txt">CYBORG</span></button>
</div>
<div id="searchRes"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s=>String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const uid = ()=>Math.random().toString(36).slice(2,10);
const pad = (n,l=2)=>String(n).padStart(l,'0');
const fmt = n=>(Math.round(n*100)/100).toLocaleString('de-DE');
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf = a=>[...a].sort(()=>Math.random()-.5);
const store = {k:n=>'haldo_'+n+'_v1',get(n,d){try{const v=localStorage.getItem(this.k(n));return v==null?d:JSON.parse(v)}catch(e){return d}},set(n,v){try{localStorage.setItem(this.k(n),JSON.stringify(v))}catch(e){}}};
let toastT; const toast = m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)};

/* ---- KOSMOS ---- */
(function(){
  const cv=$('#stars'),ctx=cv.getContext('2d');let dpr=Math.min(devicePixelRatio||1,2);
  function draw(){const w=cv.width=Math.floor(innerWidth*dpr),h=cv.height=Math.floor(innerHeight*dpr);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.clearRect(0,0,w,h);
    for(let i=0;i<260;i++){const x=Math.random()*w,y=Math.random()*h,r=(Math.random()*1.3+.3)*dpr;ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.7+.2)+')';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
    for(let i=0;i<12;i++){const x=Math.random()*w,y=Math.random()*h,r=(Math.random()*2+1.2)*dpr;const g=ctx.createRadialGradient(x,y,0,x,y,r*6);g.addColorStop(0,'rgba(160,220,255,.5)');g.addColorStop(1,'rgba(160,220,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*6,0,7);ctx.fill()}}
  draw();addEventListener('resize',()=>{dpr=Math.min(devicePixelRatio||1,2);draw()},{passive:true});
  const cos=$('#cosmos');cos.appendChild(el('div','sun'));
  [['#a9c8ff',168,12,22],['#ffd18a',250,17,34],['#8ad4ff',348,19,50],['#ff8ea3',440,16,66],['#e0b4ff',545,24,90],['#7de3c7',650,21,118],['#9fd7ff',760,20,148],['#c1a3ff',875,18,184],['#ffbfa3',990,15,224],['#a3ffd1',1095,14,266],['#ffa3c9',1200,13,314],['#d1c9ff',1305,12,360]].forEach(([c,d,s,sec])=>{
    const o=el('div','orbit');o.style.width=o.style.height=d+'px';o.style.animationDuration=sec+'s';
    const p=el('div','planet');p.style.width=p.style.height=s+'px';p.style.background='radial-gradient(circle at 34% 30%,#fff,'+c+' 58%,rgba(0,0,0,.62))';p.style.boxShadow='0 0 16px '+c+',0 0 40px '+c+'44';o.appendChild(p);cos.appendChild(o)});

const body=$('.win-body',win);
try{const html=(typeof app.render==='function')?app.render(win,body):(app.render||'');if(html!=null)body.innerHTML=html;if(typeof app.init==='function')app.init(win,body)}catch(err){body.innerHTML='<div class="empty">Fehler: '+esc(err.message)+'</div>';console.error(app,err)}
this.wins.set(wid,{el:win,appId:id});this.focus(wid);return win},
close(wid){const w=this.wins.get(wid);if(!w)return;w.el.remove();this.wins.delete(wid)},
focus(wid){const w=this.wins.get(wid);if(!w)return;w.el.style.zIndex=++this.zTop;this.focused=wid},
drag(e,wid){const w=this.wins.get(wid);if(!w)return;const win=w.el;if(win.classList.contains('maxed'))return;
const r=win.getBoundingClientRect();const sx=e.clientX,sy=e.clientY,sl=r.left,st=r.top;win.classList.add('dragging');
const mv=ev=>{let nl=sl+ev.clientX-sx,nt=st+ev.clientY-sy;nl=Math.min(innerWidth-60,Math.max(-r.width+60,nl));nt=Math.min(innerHeight-60,Math.max(56,nt));win.style.left=nl+'px';win.style.top=nt+'px';ev.preventDefault()};
const up=()=>{win.classList.remove('dragging');document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up)};
document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up)}};

function updCount(){const t=REGISTRY.reduce((a,r)=>a+r.apps.length,0);$('#appcount').textContent=t+' Apps · '+Object.keys(APPS).length+' aktiv'}

function openInfo(){if(document.getElementById('infoWin'))return;const w=el('section','window');w.id='infoWin';w.style.cssText='left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,440px);height:auto;z-index:99999';
w.innerHTML='<div class="win-head"><span class="wic">ℹ️</span><div class="wtitle">Über HalDo AI OS</div><div class="wbtns"><button class="wb close">✕</button></div></div><div class="win-body"><div class="col"><div class="big2">🦚 HalDo AI OS</div><div class="dim">Version v142 · Komplett-Neubau</div><div class="card">375 Apps im Registry · '+Object.keys(APPS).length+' aktiv. Kosmos, Avatar AI, CYBORG-Modus.</div><button class="btn primary" onclick="this.closest(\'.window\').remove()">Schließen</button></div></div>';
document.body.appendChild(w);w.querySelector('.wb.close').onclick=()=>w.remove()}

/* ---- SEARCH ---- */
const SR=$('#searchRes');
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){SR.classList.remove('on');return}
const hits=[];REGISTRY.forEach(r=>{r.apps.forEach(name=>{if(name.toLowerCase().includes(q))hits.push({name,cat:r.k,ico:r.ico,id:findId(name)})})});
if(!hits.length){SR.classList.remove('on');return}
SR.innerHTML=hits.slice(0,20).map(h=>'<div class="sr" data-id="'+(h.id||'')+'" data-n="'+esc(h.name)+'"><span style="font-size:18px;width:24px;text-align:center">'+h.ico+'</span><span>'+esc(h.name)+'</span><span class="dim" style="margin-left:auto;font-size:11px">'+h.cat+'</span></div>').join('');
SR.classList.add('on');
SR.querySelectorAll('.sr').forEach(s=>s.onclick=()=>{const id=s.dataset.id;if(id)WM.open(id);else toast('Kommt bald');SR.classList.remove('on');$('#search').value=''})});
document.addEventListener('click',e=>{if(!e.target.closest('#search')&&!e.target.closest('#searchRes'))SR.classList.remove('on')});

/* ---- CLOCK ---- */
function tk(){const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())}
tk();setInterval(tk,15000);

/* ---- LOGO/MENU/BOTTOM ---- */
$('#logoBtn').onclick=()=>renderHome();
$('#menuBtn').onclick=()=>SIDEBAR.classList.toggle('open');
$$('#bottomBar .bbtn').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='chat')WM.open('chat',{w:480,h:560});else if(a==='ai')WM.open('haldo-ai',{w:520,h:640});else if(a==='cyborg')$('#themeBtn').click()});

/* ---- INIT ---- */
buildSidebar();renderHome();updCount();
setTimeout(()=>toast('Willkommen bei HalDo AI OS v142 🚀'),800);
console.log('%c🚀 HalDo AI OS v142','background:linear-gradient(90deg,#00e5ff,#b478ff);color:#fff;padding:4px 10px;border-radius:6px;font-weight:800');
console.log('Aktive Apps:',Object.keys(APPS).length,'/ 375');
})();
</script>
</body>
