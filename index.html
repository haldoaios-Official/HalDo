<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦚 HalDo AI OS v2</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --primary:#00d4b8;
    --primary-2:#7c3aed;
    --accent:#f5c542;
    --bg:#0a0e17;
    --bg-2:#111827;
    --panel:rgba(255,255,255,0.04);
    --panel-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.09);
    --text:#e8eef7;
    --text-dim:#8fa3bf;
    --success:#22c55e;
    --danger:#ef4444;
    --radius:14px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:
      radial-gradient(1200px 800px at 15% -10%,rgba(0,212,184,.14),transparent 60%),
      radial-gradient(1000px 700px at 110% 10%,rgba(124,58,237,.16),transparent 55%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* ===== BOOT SPLASH ===== */
  #boot{
    position:fixed;inset:0;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:9999;transition:opacity .4s ease;
  }
  #boot img{width:110px;height:110px;object-fit:contain;animation:pulse 1.2s ease-in-out infinite}
  #boot h1{margin-top:18px;font-size:20px;letter-spacing:3px;color:var(--text-dim);font-weight:500}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
  #boot.hide{opacity:0;pointer-events:none}

  /* ===== TOPBAR ===== */
  #topbar{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;gap:14px;
    padding:12px 20px;
    background:rgba(10,14,23,.72);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  #topbar .brand{display:flex;align-items:center;gap:12px}
  #topbar .brand img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(0,212,184,.4))}
  #topbar .brand h1{font-size:17px;font-weight:600;letter-spacing:.4px}
  #topbar .brand h1 span{color:var(--primary)}
  #topbar .spacer{flex:1}
  #topbar .pill{
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;border-radius:20px;
    background:var(--panel);border:1px solid var(--border);
    font-size:12px;color:var(--text-dim);
  }
  #topbar .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}

  /* ===== MAIN NAV ===== */
  #mainnav{
    display:flex;gap:6px;
    padding:10px 14px;
    background:rgba(10,14,23,.55);
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #mainnav::-webkit-scrollbar{display:none}
  #mainnav button{
    display:flex;align-items:center;gap:9px;
    padding:10px 16px;border-radius:11px;
    background:transparent;border:1px solid transparent;
    color:var(--text-dim);font-size:14px;font-weight:500;
    cursor:pointer;white-space:nowrap;
    transition:all .18s ease;
    font-family:inherit;
  }
  #mainnav button img{width:20px;height:20px;object-fit:contain}
  #mainnav button .emoji{font-size:17px;line-height:1}
  #mainnav button:hover{color:var(--text);background:var(--panel)}
  #mainnav button.active{
    color:var(--text);
    background:linear-gradient(135deg,rgba(0,212,184,.18),rgba(124,58,237,.18));
    border-color:rgba(0,212,184,.35);
    box-shadow:0 0 20px rgba(0,212,184,.12);
  }

  /* ===== VIEW CONTAINER ===== */
  #view{
    max-width:1180px;margin:0 auto;
    padding:26px 20px 80px;
    animation:fadeUp .3s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== CARDS / SECTIONS ===== */
  .hero{
    display:flex;align-items:center;gap:20px;
    padding:24px;border-radius:var(--radius);
    background:linear-gradient(135deg,rgba(0,212,184,.10),rgba(124,58,237,.10));
    border:1px solid var(--border);
    margin-bottom:24px;
  }
  .hero img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(0,212,184,.4))}
  .hero .h-text h2{font-size:22px;margin-bottom:4px}
  .hero .h-text p{color:var(--text-dim);font-size:13.5px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
  .stat{
    padding:18px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);
    transition:all .18s;
  }
  .stat:hover{background:var(--panel-2);transform:translateY(-2px)}
  .stat .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .stat .value{font-size:26px;font-weight:700;color:var(--primary)}
  .stat .sub{font-size:12px;color:var(--text-dim);margin-top:4px}

  .section-title{
    display:flex;align-items:center;gap:10px;
    margin:8px 0 14px;font-size:16px;font-weight:600;
  }
  .section-title .emoji{font-size:19px}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .app-card{
    padding:16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    cursor:pointer;transition:all .18s;
    display:flex;flex-direction:column;gap:8px;
    text-align:left;
    font-family:inherit;color:var(--text);
  }
  .app-card:hover{background:var(--panel-2);border-color:rgba(0,212,184,.4);transform:translateY(-2px)}
  .app-card .icon{font-size:26px}
  .app-card .name{font-size:13.5px;font-weight:600}
  .app-card .desc{font-size:11.5px;color:var(--text-dim);line-height:1.4}

  .placeholder{
    padding:40px 24px;border-radius:var(--radius);
    background:var(--panel);border:1px dashed var(--border);
    text-align:center;color:var(--text-dim);
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .placeholder img{width:56px;opacity:.7}
  .placeholder h3{color:var(--text);font-size:15px}
  .placeholder p{font-size:13px;max-width:440px;line-height:1.5}

  .badge{
    display:inline-block;padding:3px 9px;border-radius:20px;
    background:rgba(0,212,184,.15);color:var(--primary);
    font-size:11px;font-weight:600;
    border:1px solid rgba(0,212,184,.3);
  }

  footer{
    text-align:center;padding:24px 20px;
    color:var(--text-dim);font-size:12px;
    border-top:1px solid var(--border);margin-top:20px;
  }
  footer img{width:16px;vertical-align:middle;margin-right:6px;opacity:.7}
</style>
</head>
<body>

<!-- ============ BOOT SPLASH ============ -->
<div id="boot">
  <img src="logo.png" alt="HalDo">
  <h1>HALDO AI OS</h1>
</div>

<!-- ============ TOPBAR ============ -->
<header id="topbar">
  <div class="brand">
    <img src="logo.png" alt="Logo">
    <h1>HalDo <span>AI OS</span></h1>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="clock-pill"><span class="dot"></span><span id="clock">--:--</span></div>
</header>

<!-- ============ MAIN NAV ============ -->
<nav id="mainnav"></nav>

<!-- ============ VIEW ============ -->
<main id="view"></main>

<!-- ============ FOOTER ============ -->
<footer>
  <img src="logo.png" alt="Logo">
  HalDo AI OS v2 · Phase 1 (Fundament)
</footer>

<script>
/* ============================================================
   HalDo AI OS v2 — Kern
   Module: Storage · Bus · Registry · Router
   ============================================================ */
(function(){
  "use strict";

  /* ---------- STORAGE ---------- */
  const Storage = {
    prefix: "haldo_v2_",
    get(key, def = null){
      try{
        const raw = localStorage.getItem(this.prefix + key);
        return raw === null ? def : JSON.parse(raw);
      }catch(e){ return def; }
    },
    set(key, val){
      try{ localStorage.setItem(this.prefix + key, JSON.stringify(val)); return true; }
      catch(e){ console.warn("Storage full", e); return false; }
    },
    del(key){ localStorage.removeItem(this.prefix + key); },
    keys(){
      const out = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k.startsWith(this.prefix)) out.push(k.slice(this.prefix.length));
      }
      return out;
    },
    sizeKB(){
      let bytes = 0;
      this.keys().forEach(k=>{
        const v = localStorage.getItem(this.prefix + k) || "";
        bytes += k.length + v.length;
      });
      return (bytes / 1024).toFixed(1);
    }
  };

  /* ---------- EVENT BUS ---------- */
  const Bus = {
    _h: {},
    on(evt, fn){ (this._h[evt] = this._h[evt] || []).push(fn); },
    emit(evt, data){ (this._h[evt] || []).forEach(fn=>{ try{fn(data);}catch(e){console.warn(e);} }); }
  };

  /* ---------- APP REGISTRY ---------- */
  const Registry = {
    apps: [],
    register(app){
      if(!app.id || !app.name){ console.warn("App braucht id + name"); return; }
      if(this.apps.find(a=>a.id===app.id)){ console.warn("App doppelt:", app.id); return; }
      this.apps.push(Object.assign({
        icon:"📦", desc:"", category:"System", status:"ready", mount:null
      }, app));
      Bus.emit("registry:change", this.apps);
    },
    get(id){ return this.apps.find(a=>a.id===id); },
    byCategory(){
      const map = {};
      this.apps.forEach(a=>{ (map[a.category] = map[a.category] || []).push(a); });
      return map;
    },
    count(){ return this.apps.length; }
  };

  /* ---------- ROUTER ---------- */
  const Router = {
    routes: {},
    current: null,
    add(path, handler){ this.routes[path] = handler; },
    go(path){
      if(!this.routes[path]) path = "home";
      this.current = path;
      Storage.set("last_route", path);
      document.querySelectorAll("#mainnav button").forEach(b=>{
        b.classList.toggle("active", b.dataset.route === path);
      });
      const view = document.getElementById("view");
      view.innerHTML = "";
      this.routes[path](view);
      Bus.emit("route:change", path);
      window.scrollTo({top:0, behavior:"instant"});
    },
    start(){
      const last = Storage.get("last_route", "home");
      this.go(last);
    }
  };

  /* ---------- UTIL ---------- */
  const U = {
    el(tag, attrs = {}, ...children){
      const n = document.createElement(tag);
      for(const k in attrs){
        if(k === "class") n.className = attrs[k];
        else if(k === "html") n.innerHTML = attrs[k];
        else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
        else n.setAttribute(k, attrs[k]);
      }
      children.forEach(c=>{
        if(c == null) return;
        n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      });
      return n;
    },
    escape(s){ return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
  };

  /* ============================================================
     NAVIGATION (5 Hauptmenüs)
     ============================================================ */
  const NAV_ITEMS = [
    { route:"home",    label:"Home",         emoji:"🏠" },
    { route:"apps",    label:"Apps",         emoji:"📱" },
    { route:"avatar",  label:"Avatar",       emoji:"🦚" },
    { route:"settings",label:"Einstellungen",emoji:"⚙️" },
    { route:"wissen",  label:"Wissen",       emoji:"📚" }
  ];

  function buildNav(){
    const nav = document.getElementById("mainnav");
    nav.innerHTML = "";
    NAV_ITEMS.forEach(item=>{
      const btn = U.el("button",
        { "data-route":item.route, onclick:()=>Router.go(item.route) },
        U.el("img", { src:"logo.png", alt:"" }),
        U.el("span", { class:"emoji" }, item.emoji),
        U.el("span", {}, item.label)
      );
      nav.appendChild(btn);
    });
  }

  /* ============================================================
     VIEWS
     ============================================================ */

  /* ----- HOME (Dashboard) ----- */
  function viewHome(root){
    const installedApps = Registry.count();
    const daysUsed = Storage.get("days_used", 1);
    const storageKB = Storage.sizeKB();
    const today = new Date().toLocaleDateString("de-DE", { weekday:"long", day:"2-digit", month:"long" });

    // Hero
    root.appendChild(U.el("div", { class:"hero" },
      U.el("img", { src:"logo.png", alt:"Logo" }),
      U.el("div", { class:"h-text" },
        U.el("h2", {}, "Willkommen zurück 🦚"),
        U.el("p", {}, `Heute ist ${today}. System läuft stabil — Phase 1 (Fundament) aktiv.`)
      )
    ));

    // Stats
    const stats = U.el("div", { class:"grid" },
      statCard("Apps registriert", installedApps, "Registry aktiv"),
      statCard("Speicher belegt", storageKB + " KB", "localStorage"),
      statCard("Tage genutzt", daysUsed, "seit Installation"),
      statCard("Version", "v2.0", "Phase 1")
    );
    root.appendChild(stats);

    // Schnellstart
    root.appendChild(U.el("div", { class:"section-title" },
      U.el("span", { class:"emoji" }, "⚡"),
      U.el("span", {}, "Schnellstart")
    ));
    const quick = U.el("div", { class:"card-grid" },
      quickCard("⚙️","Einstellungen","Alles steuern","settings"),
      quickCard("📱","Apps","Alle Apps ansehen","apps"),
      quickCard("🦚","Avatar","Chat + Sprache","avatar"),
      quickCard("📚","Wissen","Lexika & Info","wissen")
    );
    root.appendChild(quick);

    // Status
    root.appendChild(U.el("div", { class:"section-title" },
      U.el("span", { class:"emoji" }, "📊"),
      U.el("span", {}, "System-Status")
    ));
    root.appendChild(U.el("div", { class:"placeholder" },
      U.el("img", { src:"logo.png", alt:"" }),
      U.el("h3", {}, "Fundament steht"),
      U.el("p", {}, "Kern-System läuft. Registry bereit für Apps. Einstellungen, Avatar und App-Module kommen in den nächsten Phasen.")
    ));

    function statCard(label, value, sub){
      return U.el("div", { class:"stat" },
        U.el("div", { class:"label" }, label),
        U.el("div", { class:"value" }, String(value)),
        U.el("div", { class:"sub" }, sub)
      );
    }
    function quickCard(icon, name, desc, route){
      return U.el("button", { class:"app-card", onclick:()=>Router.go(route) },
        U.el("div", { class:"icon" }, icon),
        U.el("div", { class:"name" }, name),
        U.el("div", { class:"desc" }, desc)
      );
    }
  }

  /* ----- APPS ----- */
  function viewApps(root){
    root.appendChild(U.el("div", { class:"section-title" },
      U.el("span", { class:"emoji" }, "📱"),
      U.el("span", {}, "Apps"),
      U.el("span", { class:"badge", style:"margin-left:auto" }, Registry.count() + " registriert")
    ));

    if(Registry.count() === 0){
      root.appendChild(U.el("div", { class:"placeholder" },
        U.el("img", { src:"logo.png", alt:"" }),
        U.el("h3", {}, "Noch keine Apps registriert"),
        U.el("p", {}, "Der Container ist bereit. In Phase 4-10 kommen die Apps in 7 Prioritäten hinzu. Jede wird voll funktionsfähig — kein Anzeige-Müll.")
      ));
      return;
    }

    const byCat = Registry.byCategory();
    for(const cat in byCat){
      root.appendChild(U.el("div", { class:"section-title" },
        U.el("span", {}, cat)
      ));
      const grid = U.el("div", { class:"card-grid" });
      byCat[cat].forEach(app=>{
        grid.appendChild(U.el("button", {
          class:"app-card",
          onclick:()=>{
            if(typeof app.mount === "function"){
              document.getElementById("view").innerHTML = "";
              app.mount(document.getElementById("view"));
            } else {
              alert(`App "${app.name}" hat noch keine Funktion.`);
            }
          }
        },
          U.el("div", { class:"icon" }, app.icon),
          U.el("div", { class:"name" }, app.name),
          U.el("div", { class:"desc" }, app.desc || "")
        ));
      });
      root.appendChild(grid);
    }
  }

  /* ----- AVATAR ----- */
  function viewAvatar(root){
    root.appendChild(U.el("div", { class:"section-title" },
      U.el("span", { class:"emoji" }, "🦚"),
      U.el("span", {}, "Avatar")
    ));
    root.appendChild(U.el("div", { class:"placeholder" },
      U.el("img", { src:"logo.png", alt:"", style:"width:120px" }),
      U.el("h3", {}, "Avatar-System — Phase 3"),
      U.el("p", {}, "Hier entsteht dein lebendiger Avatar: 3 Modi (Human/Cyborg/Hologram), Spracheingabe, Sprachausgabe, Gemini-Konversation und Wake-Word. Kommt in Phase 3.")
    ));
  }

  /* ----- EINSTELLUNGEN ----- */
  function viewSettings(root){
    root.appendChild(U.el("div", { class:"section-title" },
      U.el("span", { class:"emoji" }, "⚙️"),
      U.el("span", {}, "Einstellungen")
    ));

    const cats = [
      ["Allgemein","Name, Sprache, Startseite"],
      ["Darstellung","Farben, Themes, Schrift"],
      ["Avatar","Modus, Größe, Persönlichkeit"],
      ["Stimme","TTS, Spracheingabe, Wake-Word"],
      ["KI & Gemini","API-Key, Modell, Prompt"],
      ["Apps","Favoriten, Verstecken, Sortierung"],
      ["Benachrichtigungen","Erinnerungen, Sound"],
      ["Netzwerk","Status, Peer-ID, Offline"],
      ["Speicher","localStorage, Cache"],
      ["Bedienung","Shortcuts, Gesten"],
      ["Sicherheit","PIN, Sperren"],
      ["Backup","Export, Import, Reset"],
      ["Statistiken","Nutzung, Speicher"],
      ["Info","Version, Credits"]
    ];

    root.appendChild(U.el("div", { class:"placeholder", style:"padding:20px 24px" },
      U.el("p", {}, "14 Kategorien werden in Phase 2 gebaut. Jede Einstellung wird WIRKLICH alles steuern — keine Anzeige-Felder.")
    ));

    const grid = U.el("div", { class:"card-grid" });
    cats.forEach(([name, desc])=>{
      grid.appendChild(U.el("div", { class:"app-card", style:"cursor:not-allowed;opacity:.55" },
        U.el("div", { class:"name" }, name),
        U.el("div", { class:"desc" }, desc)
      ));
    });
    root.appendChild(grid);
  }

  /* ----- WISSEN ----- */
  function viewWissen(root){
    root.appendChild(U.el("div", { class:"section-title" },
      U.el("span", { class:"emoji" }, "📚"),
      U.el("span", {}, "Wissen")
    ));
    root.appendChild(U.el("div", { class:"placeholder" },
      U.el("img", { src:"logo.png", alt:"" }),
      U.el("h3", {}, "Wissens-Lexika — Phase 5-8"),
      U.el("p", {}, "Länder, Edelsteine, Greifvögel, Blumen, Pilze, Astronomie, Vulkane und mehr — alles mit echten Daten, Suche und Filtern. Kommt mit den App-Phasen.")
    ));
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot(){
    // Tage-Nutzung hochzählen
    const lastDate = Storage.get("last_date", "");
    const todayStr = new Date().toDateString();
    if(lastDate !== todayStr){
      Storage.set("days_used", (Storage.get("days_used", 0) || 0) + 1);
      Storage.set("last_date", todayStr);
    }

    // Uhr starten
    function tick(){
      const el = document.getElementById("clock");
      if(el) el.textContent = new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
    }
    tick();
    setInterval(tick, 15000);

    // Nav bauen + Routen registrieren
    buildNav();
    Router.add("home",     viewHome);
    Router.add("apps",     viewApps);
    Router.add("avatar",   viewAvatar);
    Router.add("settings", viewSettings);
    Router.add("wissen",   viewWissen);

    // Splash weg
    setTimeout(()=>{
      const b = document.getElementById("boot");
      b.classList.add("hide");
      setTimeout(()=>b.remove(), 500);
    }, 300);

    // Router starten
    Router.start();

    // Globale API (für Apps später)
    window.HalDo = {
      Storage, Bus, Registry, Router, U,
      version: "2.0",
      phase: 1
    };

    console.log("%c🦚 HalDo AI OS v2 geladen — Phase 1", "color:#00d4b8;font-weight:bold;font-size:14px");
    console.log("Apps registriert:", Registry.count());
    console.log("Storage KB:", Storage.sizeKB());
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
