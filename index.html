<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS v150</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="css.css">
<script src="beep-notify.js"></script>
</head>
<body>

<!-- ══════════ BOOT SCREEN ══════════ -->
<div id="bootScreen">
  <div class="boot-logo">
    <img src="logo.png" alt="HalDo" class="boot-logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div class="boot-logo-fallback">🦚</div>
  </div>
  <div class="boot-title">HalDo AI OS</div>
  <div class="boot-version">v150 · Cosmic Edition</div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootBarFill"></div></div>
  <div class="boot-status" id="bootStatus">Boot Detection…</div>
  <div class="boot-hud">
    <div class="boot-ring boot-ring-1"></div>
    <div class="boot-ring boot-ring-2"></div>
    <div class="boot-ring boot-ring-3"></div>
  </div>
</div>

<!-- ══════════ COSMIC WORLD (Hintergrund) ══════════ -->
<div id="bgLayer"><canvas id="bgCanvas"></canvas></div>

<!-- ══════════ DESKTOP HINT ══════════ -->
<div class="hint" id="hint">☀️ Sonne = Chat · 🪐 Planeten = Apps</div>

<!-- ══════════ TOPBAR ══════════ -->
<header id="topbar">
  <div class="logo" id="logoBtn">
    <img src="logo.png" alt="HalDo" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span class="peacock" style="display:none">🦚</span>
    <div class="txt"><span class="t1">HalDo</span><span class="t2">AI OS v150</span></div>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="sidebarBtn" title="Menü">☰</button>
  <button class="icon-btn" id="voiceBtn" title="HalDoVoice">🔊</button>
  <button class="icon-btn" id="themeToggle" title="Theme">🎨</button>
  <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙️</button>
</header>

<aside id="sidebar"></aside>
<main id="desktop"></main>

<footer id="bottombar">
  <button class="bbtn" id="bbChat"><span class="ico">💬</span>Chat</button>
  <button class="bbtn" id="bbVoice"><span class="ico">🔊</span>Voice</button>
  <button class="bbtn cyborg" id="bbCyborg"><span class="ico">⚡</span>CYBORG</button>
</footer>

<!-- ══════════ MODALS ══════════ -->
<div id="settings" class="modal"><div class="panel-box"><div class="phead"><span class="ico">⚙️</span><h2>Allgemeine Einstellungen</h2><button class="close" id="settingsClose">✕</button></div><div class="pbody" id="settingsBody"></div></div></div>
<div id="appSettings" class="modal"><div class="panel-box"><div class="phead"><span class="ico" id="appSetIco">⚙️</span><h2 id="appSetTitle">App-Einstellungen</h2><button class="close" id="appSetClose">✕</button></div><div class="pbody" id="appSetBody"></div></div></div>
<div id="voicePanel" class="modal"><div class="panel-box"><div class="phead"><span class="ico">🔊</span><h2>HalDoVoice</h2><button class="close" id="voicePanelClose">✕</button></div><div class="pbody" id="voicePanelBody"></div></div></div>
<div id="aiWindow" class="modal"><div class="panel-box ai-panel"><div class="phead"><span class="ico">🦚</span><h2>HalDo AI</h2><button class="close" id="aiWindowClose">✕</button></div><div class="pbody" id="aiWindowBody"></div></div></div>
<div id="toast"></div>

<!-- ══════════ KERNEL — Reihenfolge KRITISCH! ══════════ -->
<!-- PHASE 1: Kernel / Core -->
<script src="kernel.js"></script>
<script src="config.js"></script>
<script src="storage.js"></script>

<!-- PHASE 2: Security / Registry -->
<script src="security.js"></script>
<script src="registry.js"></script>

<!-- PHASE 3: App Manager / Runtime / Router -->
<script src="app-manager.js"></script>
<script src="runtime.js"></script>
<script src="router.js"></script>

<!-- PHASE 4: Window / Display / Desktop -->
<script src="window-manager.js"></script>
<script src="display.js"></script>
<script src="desktop.js"></script>

<!-- PHASE 5: Cosmic World -->
<script src="cosmic-world.js"></script>

<!-- PHASE 6: Voice / Language / Memory -->
<script src="voice.js"></script>
<script src="language.js"></script>
<script src="memory.js"></script>

<!-- PHASE 7: AI Layer -->
<script src="ai-core.js"></script>
<script src="ai-avatar.js"></script>

<!-- PHASE 8: Menus -->
<script src="menu-system.js"></script>

<!-- PHASE 9: Apps -->
<script src="chat.js"></script>
<script src="ezidi.js"></script>
<script src="welt.js"></script>
<script src="wissen.js"></script>
<script src="games.js"></script>
<script src="kreativ.js"></script>
<script src="lernen.js"></script>
<script src="produktiv.js"></script>
<script src="finanzen.js"></script>
<script src="werkzeuge.js"></script>
<script src="verkehr.js"></script>
<script src="comm.js"></script>
<script src="dokumente.js"></script>
<script src="medien.js"></script>
<script src="fitness.js"></script>
<script src="kueche.js"></script>
<script src="zuhause.js"></script>
<script src="aufnahme.js"></script>
<script src="system-center.js"></script>

<!-- PHASE 10: Updates / Backup / Diagnostics -->
<script src="update.js"></script>
<script src="backup.js"></script>
<script src="recovery.js"></script>
<script src="diagnostics.js"></script>

<!-- PHASE 11: Init — MUSS ZULETZT KOMMEN! -->
<script src="init.js"></script>

</body>
</html>
