<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HalDo AI OS v123</title>
<style>
/* ============================================================
   VARIABLEN & THEME
============================================================ */
:root {
  --cyan: #00e5ff;
  --blue: #4da8ff;
  --purple: #b478ff;
  --pink: #ff78c8;
  --violet: #b478ff;
  
  --primary: var(--cyan);
  --secondary: var(--blue);
  --accent: var(--purple);
  
  --bg-glass: rgba(255, 255, 255, 0.05);
  --bg-glass-hover: rgba(255, 255, 255, 0.1);
  --border-glass: rgba(255, 255, 255, 0.15);
  --text-main: #ffffff;
  --text-muted: #a0b0c0;
  
  --blur: blur(24px);
  --radius: 16px;
  --safe-top: env(safe-area-inset-top, 20px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

[data-theme="cyborg"] {
  --primary: var(--pink);
  --secondary: var(--violet);
  --accent: #ff9ef0;
  --bg-glass: rgba(255, 120, 200, 0.08);
  --border-glass: rgba(255, 120, 200, 0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #000;
  color: var(--text-main);
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
  transition: background 0.5s ease;
}

/* ============================================================
   HINTERGRÜNDE
============================================================ */
#bg-layer {
  position: fixed; inset: 0; z-index: -1;
  transition: opacity 0.5s ease;
  background-size: cover; background-position: center;
}
/* 1. Kosmos */
.bg-space {
  background: radial-gradient(circle at 50% 50%, #0a0a2a 0%, #000000 100%);
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 50px 160px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 160px 120px, #fff, rgba(0,0,0,0));
  background-repeat: repeat;
  background-size: 200px 200px;
}
/* 2. Erde */
.bg-earth {
  background: linear-gradient(135deg, #001a33 0%, #003366 50%, #000000 100%);
  background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  filter: brightness(0.4);
}
/* 3. Holo */
.bg-holo {
  background: linear-gradient(45deg, #000 0%, #001a1a 100%);
  background-image: 
    linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* ============================================================
   UI BASIS
============================================================ */
button {
  min-width: 40px; min-height: 40px;
  font-family: inherit;
  border: none; background: none; color: inherit;
  cursor: pointer; outline: none;
}

.glass {
  background: var(--bg-glass);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

/* ============================================================
   TOP BAR
============================================================ */
#top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  padding: calc(var(--safe-top) + 10px) 20px 10px 20px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 1000;
  pointer-events: none;
}
.top-left, .top-right {
  display: flex; gap: 12px; align-items: center; pointer-events: auto;
}
#clock {
  font-size: 18px; font-weight: 700; letter-spacing: 1px;
  text-shadow: 0 0 10px var(--primary);
}
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; transition: 0.2s;
}
.icon-btn:hover { background: var(--bg-glass-hover); transform: scale(1.05); }

/* ============================================================
   APP GRID (Desktop)
============================================================ */
#desktop {
  position: absolute; inset: 0;
  padding: calc(var(--safe-top) + 80px) 20px calc(var(--safe-bottom) + 40px) 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 20px;
  align-content: start;
  justify-content: center;
  overflow-y: auto;
  z-index: 10;
}
.app-icon {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; cursor: pointer; transition: transform 0.2s;
}
.app-icon:hover { transform: scale(1.1); }
.app-icon .icon-box {
  width: 60px; height: 60px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  background: var(--bg-glass);
  backdrop-filter: var(--blur);
  border: 1px solid var(--border-glass);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.app-icon .icon-label {
  font-size: 11px; font-weight: 500; text-align: center;
  text-shadow: 0 1px 3px #000;
}

/* ============================================================
   FENSTER-SYSTEM
============================================================ */
#window-layer {
  position: absolute; inset: 0; z-index: 100;
  pointer-events: none; /* Click-through layer */
}
.window {
  position: absolute;
  width: 320px; height: 400px;
  min-width: 250px; min-height: 200px;
  display: flex; flex-direction: column;
  pointer-events: auto;
  resize: both; overflow: hidden;
  transition: opacity 0.2s, transform 0.2s;
  animation: windowOpen 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes windowOpen {
  from { opacity: 0; transform: scale(0.9) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.window.closing {
  opacity: 0; transform: scale(0.9); pointer-events: none;
}
.window-header {
  height: 40px; display: flex; justify-content: space-between; align-items: center;
  padding: 0 10px 0 16px;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border-glass);
  cursor: grab; border-radius: var(--radius) var(--radius) 0 0;
}
.window-header:active { cursor: grabbing; }
.window-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.window-controls { display: flex; gap: 8px; }
.win-btn {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: bold;
}
.win-btn.close { background: rgba(255, 60, 60, 0.2); color: #ff5c5c; }
.win-btn.close:hover { background: rgba(255, 60, 60, 0.4); }
.win-btn.min { background: rgba(255, 200, 0, 0.2); color: #ffca28; }
.win-btn.min:hover { background: rgba(255, 200, 0, 0.4); }
.window-content {
  flex: 1; padding: 16px; overflow-y: auto; position: relative;
}

/* ============================================================
   SPIELE / APPS INHALT
============================================================ */
/* TicTacToe */
.ttt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 240px; margin: 0 auto; }
.ttt-cell {
  aspect-ratio: 1; background: var(--bg-glass); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; cursor: pointer; transition: 0.2s;
}
.ttt-cell:hover { background: var(--bg-glass-hover); }
.ttt-status { text-align: center; margin-bottom: 16px; font-size: 16px; font-weight: bold; color: var(--primary); }

/* Memory */
.mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 300px; margin: 0 auto; }
.mem-card {
  aspect-ratio: 1; perspective: 600px; cursor: pointer;
}
.mem-inner {
  width: 100%; height: 100%; position: relative; transition: transform 0.4s;
  transform-style: preserve-3d;
}
.mem-card.flipped .mem-inner { transform: rotateY(180deg); }
.mem-front, .mem-back {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; border: 1px solid var(--border-glass);
}
.mem-front { background: var(--bg-glass); }
.mem-back { background: rgba(0, 229, 255, 0.15); transform: rotateY(180deg); }

/* Snake */
#snake-canvas {
  display: block; margin: 0 auto; background: rgba(0,0,0,0.5);
  border: 2px solid var(--border-glass); border-radius: 8px;
}
.snake-controls {
  display: flex; justify-content: center; gap: 8px; margin-top: 12px;
}

/* ============================================================
   SETTINGS MODAL
============================================================ */
#settings-panel {
  position: absolute; top: calc(var(--safe-top) + 60px); right: 20px;
  width: 280px; padding: 16px;
  display: none; flex-direction: column; gap: 16px;
  z-index: 2000;
}
#settings-panel.show { display: flex; }
.set-row { display: flex; justify-content: space-between; align-items: center; }
.set-label { font-size: 13px; color: var(--text-muted); }
.set-options { display: flex; gap: 6px; }
.set-btn {
  padding: 6px 12px; border-radius: 8px; font-size: 12px;
  background: rgba(255,255,255,0.05); border: 1px solid transparent;
}
.set-btn.active { background: var(--primary); color: #000; font-weight: bold; border-color: var(--primary); }

/* Utils */
.hidden { display: none !important; }
.text-center { text-align: center; }
.btn {
  padding: 10px 16px; border-radius: 8px; font-weight: 600;
  background: var(--bg-glass); border: 1px solid var(--border-glass);
  transition: 0.2s;
}
.btn:hover { background: var(--bg-glass-hover); }
.btn-primary { background: var(--primary); color: #000; border: none; }
.btn-primary:hover { filter: brightness(1.2); }
</style>
</head>
<body data-theme="dark">

<div id="bg-layer" class="bg-space"></div>

<!-- TOP BAR -->
<div id="top-bar">
  <div class="top-left glass" style="padding: 0 16px; height: 44px; border-radius: 22px; display: flex; align-items: center;">
    <span id="clock">12:00</span>
  </div>
  <div class="top-right">
    <button class="icon-btn glass" id="btn-settings">⚙️</button>

</div>

<!-- SETTINGS PANEL -->
<div id="settings-panel" class="glass">
  <div class="set-row">
    <span class="set-label">Hintergrund</span>
    <div class="set-options">
      <button class="set-btn active" data-bg="bg-space">Kosmos</button>

<!-- DESKTOP (19 APPS) -->
<div id="desktop">
  <!-- Die 19 Mega-Apps -->
  <div class="app-icon" data-app="welt"><div class="icon-box">🌍</div><div class="icon-label">Welt</div></div>
  <div class="app-icon" data-app="comm"><div class="icon-box">📧</div><div class="icon-label">Comm</div></div>
  <div class="app-icon" data-app="wissen"><div class="icon-box">🔬</div><div class="icon-label">Wissen</div></div>
  <div class="app-icon" data-app="games"><div class="icon-box">🎮</div><div class="icon-label">Games</div></div>
  <div class="app-icon" data-app="verkehr"><div class="icon-box">🚦</div><div class="icon-label">Verkehr</div></div>
  <div class="app-icon" data-app="kreativ"><div class="icon-box">🎨</div><div class="icon-label">Kreativ</div></div>
  <div class="app-icon" data-app="medien"><div class="icon-box">🎵</div><div class="icon-label">Medien</div></div>
  <div class="app-icon" data-app="lernen"><div class="icon-box">📚</div><div class="icon-label">Lernen</div></div>
  <div class="app-icon" data-app="werkzeuge"><div class="icon-box">⏱️</div><div class="icon-label">Tools</div></div>
  <div class="app-icon" data-app="finanzen"><div class="icon-box">💰</div><div class="icon-label">Finanzen</div></div>
  <div class="app-icon" data-app="fitness"><div class="icon-box">🏋️</div><div class="icon-label">Fitness</div></div>
  <div class="app-icon" data-app="kueche"><div class="icon-box">🍳</div><div class="icon-label">Küche</div></div>

  <div class="app-icon" data-app="produktiv"><div class="icon-box">🎯</div><div class="icon-label">Produktiv</div></div>
  <div class="app-icon" data-app="aufnahme"><div class="icon-box">🎙️</div><div class="icon-label">Aufnahme</div></div>
  <div class="app-icon" data-app="dokumente"><div class="icon-box">📄</div><div class="icon-label">Docs</div></div>
  <div class="app-icon" data-app="ai"><div class="icon-box">🤖</div><div class="icon-label">HalDo AI</div></div>
  <div class="app-icon" data-app="system"><div class="icon-box">⚙️</div><div class="icon-label">System</div></div>
</div>

<!-- FENSTER LAYER -->
<div id="window-layer"></div>

<script>
/* ============================================================
   STATE & INIT
============================================================ */
const OS = {
  theme: 'dark',
  bg: 'bg-space',
  zIndex: 100,
  apps: {
    welt: { title: '🌍 Welt', icon: '🌍', content: '<div class="text-center"><h2>Welt</h2><p>Länder, Wetter, Navigation (Phase 2)</p></div>' },
    comm: { title: '📧 Comm', icon: '📧', content: '<div class="text-center"><h2>Kommunikation</h2><p>Phone, Video, Chat (Phase 2)</p></div>' },
    wissen: { title: '🔬 Wissen', icon: '🔬', content: '<div class="text-center"><h2>Wissen</h2><p>13 Themen (Phase 2)</p></div>' },
    games: { title: '🎮 Games', icon: '🎮', content: `
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="OS.loadGame('ttt')">TicTacToe</button>
        <button class="btn btn-primary" onclick="OS.loadGame('memory')">Memory</button>
        <button class="btn btn-primary" onclick="OS.loadGame('snake')">Snake</button>
      </div>
      <div id="game-container" style="margin-top:20px;"></div>
    `},
    verkehr: { title: '🚦 Verkehr Pro', icon: '🚦', content: '<div class="text-center"><h2>Verkehr</h2><p>Routen, Stau (Phase 2)</p></div>' },
    kreativ: { title: '🎨 Kreativ', icon: '🎨', content: '<div class="text-center"><h2>Kreativ</h2><p>Bild, Video, Kunst (Phase 2)</p></div>' },
    medien: { title: '🎵 Medien', icon: '🎵', content: '<div class="text-center"><h2>Medien</h2><p>Musik, Radio, Galerie (Phase 2)</p></div>' },
    lernen: { title: '📚 Lernen', icon: '📚', content: '<div class="text-center"><h2>Lernen</h2><p>Vokabeln, Formeln (Phase 2)</p></div>' },
    werkzeuge: { title: '⏱️ Werkzeuge', icon: '⏱️', content: '<div class="text-center"><h2>Werkzeuge</h2><p>Einheiten, QR (Phase 2)</p></div>' },
    finanzen: { title: '💰 Finanzen', icon: '💰', content: '<div class="text-center"><h2>Finanzen</h2><p>Budget, Ausgaben (Phase 2)</p></div>' },
    fitness: { title: '🏋️ Fitness', icon: '🏋️', content: '<div class="text-center"><h2>Fitness</h2><p>Training, Health (Phase 2)</p></div>' },
    kueche: { title: '🍳 Küche', icon: '🍳', content: '<div class="text-center"><h2>Küche</h2><p>Kochbuch, Einkauf (Phase 2)</p></div>' },
    zuhause: { title: '🏠 Zuhause', icon: '🏠', content: '<div class="text-center"><h2>Zuhause</h2><p>Habits, Garten (Phase 2)</p></div>' },
    produktiv: { title: '🎯 Produktiv', icon: '🎯', content: '<div class="text-center"><h2>Produktivität</h2><p>Notizen, Projekte (Phase 2)</p></div>' },
    aufnahme: { title: '🎙️ Aufnahme', icon: '🎙️', content: '<div class="text-center"><h2>Aufnahme</h2><p>Sprachnotizen (Phase 2)</p></div>' },
    dokumente: { title: '📄 Dokumente', icon: '📄', content: '<div class="text-center"><h2>Dokumente</h2><p>PDF, Text (Phase 2)</p></div>' },
    ai: { title: '🤖 HalDo AI', icon: '🤖', content: '<div class="text-center"><h2>HalDo AI</h2><p>Chat-Assistent (Phase 2)</p></div>' },
    system: { title: '⚙️ System', icon: '⚙️', content: `
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn" onclick="OS.resetOS()">Daten zurücksetzen</button>
        <p style="font-size:12px; color:var(--text-muted); text-align:center;">HalDo AI OS v123</p>
      </div>
    `}
  }
};

/* ============================================================
   UHR
============================================================ */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').innerText = `${h}:${m}`;
}
setInterval(updateClock, 1000);
updateClock();

/* ============================================================
   SETTINGS LOGIK
============================================================ */
const settingsPanel = document.getElementById('settings-panel');
document.getElementById('btn-settings').onclick = () => {
  settingsPanel.classList.toggle('show');
};

// Background wechseln
document.querySelectorAll('[data-bg]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const bgLayer = document.getElementById('bg-layer');
    bgLayer.className = btn.dataset.bg;
  };
});

// Theme wechseln
document.querySelectorAll('[data-theme]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.dataset.theme = btn.dataset.theme;
  };
});

/* ============================================================
   FENSTER-SYSTEM (Drag & Drop)
============================================================ */
const windowLayer = document.getElementById('window-layer');
let activeWindow = null;
let isDragging = false;
let startX, startY, startLeft, startTop;

function createWindow(appId) {
  const app = OS.apps[appId];
  if (!app) return;

  // Prüfen ob schon offen
  const existing = document.getElementById(`win-${appId}`);
  if (existing) {
    existing.style.zIndex = ++OS.zIndex;
    return;
  }

  const win = document.createElement('div');
  win.className = 'window glass';
  win.id = `win-${appId}`;
  win.style.zIndex = ++OS.zIndex;
  
  // Random position slightly off-center
  const offset = (OS.zIndex % 10) * 20;
  win.style.left = `calc(50% - 160px + ${offset}px)`;
  win.style.top = `calc(50% - 200px + ${offset}px)`;

  win.innerHTML = `
    <div class="window-header">
      <div class="window-title">${app.title}</div>
      <div class="window-controls">
        <button class="win-btn min" onclick="OS.minimizeWindow('${appId}')">_</button>
        <button class="win-btn close" onclick="OS.closeWindow('${appId}')">×</button>
      </div>
    </div>
    <div class="window-content" id="content-${appId}">
      ${app.content}
    </div>
  `;

  windowLayer.appendChild(win);
  makeDraggable(win);
  
  // Klick nach vorne holen
  win.addEventListener('mousedown', () => {
    win.style.zIndex = ++OS.zIndex;
  });
  win.addEventListener('touchstart', () => {
    win.style.zIndex = ++OS.zIndex;
  }, {passive: true});

  return win;
}

function makeDraggable(win) {
  const header = win.querySelector('.window-header');
  
  const onDragStart = (e) => {
    if (e.target.closest('.window-controls')) return;
    isDragging = true;
    activeWindow = win;
    
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    
    startX = clientX;
    startY = clientY;
    
    const rect = win.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    
    // Convert right/bottom to left/top for smooth dragging
    win.style.left = rect.left + 'px';
    win.style.top = rect.top + 'px';
    win.style.transform = 'none';
  };

  const onDragMove = (e) => {
    if (!isDragging || activeWindow !== win) return;
    e.preventDefault();
    
    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    
    const dx = clientX - startX;
    const dy = clientY - startY;
    
    win.style.left = `${startLeft + dx}px`;
    win.style.top = `${startTop + dy}px`;
  };

  const onDragEnd = () => {
    isDragging = false;
    activeWindow = null;
  };

  header.addEventListener('mousedown', onDragStart);
  header.addEventListener('touchstart', onDragStart, {passive: false});
  
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchmove', onDragMove, {passive: false});
  
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchend', onDragEnd);
}

/* ============================================================
   OS API
============================================================ */
OS.closeWindow = (appId) => {
  const win = document.getElementById(`win-${appId}`);
  if (win) {
    win.classList.add('closing');
    setTimeout(() => win.remove(), 200);
    
    // Cleanup games if necessary
    if (appId === 'games' && window.snakeInterval) clearInterval(window.snakeInterval);
  }
};

OS.minimizeWindow = (appId) => {
  const win = document.getElementById(`win-${appId}`);
  if (win) {
    win.style.display = 'none';
  }
};

// Desktop Icons Click
document.querySelectorAll('.app-icon').forEach(icon => {
  icon.addEventListener('click', () => {
    createWindow(icon.dataset.app);
  });
});

/* ============================================================
   GAMES IMPLEMENTIERUNG
============================================================ */
OS.loadGame = (game) => {
  const container = document.getElementById('game-container');
  if (!container) return;
  container.innerHTML = ''; // Reset
  
  if (game === 'ttt') initTTT(container);
  if (game === 'memory') initMemory(container);
  if (game === 'snake') initSnake(container);
};

// --- TicTacToe ---
function initTTT(container) {
  let state = ['', '', '', '', '', '', '', '', ''];
  let currentPlayer = 'X';
  let active = true;
  
  container.innerHTML = `
    <div class="ttt-status" id="ttt-status">X ist am Zug</div>
    <div class="ttt-grid" id="ttt-grid"></div>
    <div style="text-align:center; margin-top:16px;">
      <button class="btn" onclick="OS.loadGame('ttt')">Neu starten</button>
    </div>
  `;
  
  const grid = container.querySelector('#ttt-grid');
  const status = container.querySelector('#ttt-status');
  
  function checkWin() {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
      if (state[w[0]] && state[w[0]] === state[w[1]] && state[w[1]] === state[w[2]]) return state[w[0]];
    }
    return state.includes('') ? null : 'Draw';
  }
  
  function render() {
    grid.innerHTML = '';
    state.forEach((val, i) => {
      const cell = document.createElement('div');
      cell.className = 'ttt-cell';
      cell.textContent = val;
      cell.style.color = val === 'X' ? 'var(--primary)' : 'var(--accent)';
      cell.onclick = () => {
        if (!active || state[i]) return;
        state[i] = currentPlayer;
        render();
        const win = checkWin();
        if (win) {
          active = false;
          status.textContent = win === 'Draw' ? 'Unentschieden!' : `${win} gewinnt!`;
        } else {
          currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
          status.textContent = `${currentPlayer} ist am Zug`;
        }
      };
      grid.appendChild(cell);
    });
  }
  render();
}

// --- Memory ---
function initMemory(container) {
  const emojis = ['🚀','👽','🪐','🌍','🌟','🔥','💧','🌪️'];
  let cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
  let flipped = [];
  let matched = 0;
  let lock = false;

  container.innerHTML = `
    <div class="mem-grid" id="mem-grid"></div>
    <div style="text-align:center; margin-top:16px;">
      <button class="btn" onclick="OS.loadGame('memory')">Neu starten</button>
    </div>
  `;
  
  const grid = container.querySelector('#mem-grid');
  
  cards.forEach((emoji, index) => {
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.innerHTML = `
      <div class="mem-inner">
        <div class="mem-front">?</div>
        <div class="mem-back">${emoji}</div>
      </div>
    `;
    card.onclick = () => {
      if (lock || card.classList.contains('flipped')) return;
      card.classList.add('flipped');
      flipped.push({ card, emoji });
      
      if (flipped.length === 2) {
        lock = true;
        if (flipped[0].emoji === flipped[1].emoji) {
          matched++;
          flipped = [];
          lock = false;
          if (matched === 8) setTimeout(() => alert('Gewonnen!'), 300);
        } else {
          setTimeout(() => {
            flipped.forEach(f => f.card.classList.remove('flipped'));
            flipped = [];
            lock = false;
          }, 1000);
        }
      }
    };
    grid.appendChild(card);
  });
}

// --- Snake ---
function initSnake(container) {
  container.innerHTML = `
    <canvas id="snake-canvas" width="280" height="280"></canvas>
    <div class="snake-controls">
      <button class="btn" onclick="snakeDir(-1,0)">⬅️</button>
      <button class="btn" onclick="snakeDir(0,-1)">⬆️</button>
      <button class="btn" onclick="snakeDir(0,1)">⬇️</button>
      <button class="btn" onclick="snakeDir(1,0)">➡️</button>
    </div>
    <div style="text-align:center; margin-top:8px;">
      <button class="btn" onclick="OS.loadGame('snake')">Neu starten</button>
    </div>
  `;
  
  const canvas = container.querySelector('#snake-canvas');
  const ctx = canvas.getContext('2d');
  const box = 14;
  let snake = [{x: 10, y: 10}];
  let direction = {x: 1, y: 0};
  let food = {x: 5, y: 5};
  let score = 0;
  
  if (window.snakeInterval) clearInterval(window.snakeInterval);
  
  window.snakeDir = (x, y) => {
    if (direction.x !== -x && direction.y !== -y) direction = {x, y};
  };
  
  document.onkeydown = (e) => {
    if (e.key === 'ArrowUp' && direction.y === 0) direction = {x: 0, y: -1};
    if (e.key === 'ArrowDown' && direction.y === 0) direction = {x: 0, y: 1};
    if (e.key === 'ArrowLeft' && direction.x === 0) direction = {x: -1, y: 0};
    if (e.key === 'ArrowRight' && direction.x === 0) direction = {x: 1, y: 0};
  };
  
  window.snakeInterval = setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 280, 280);
    
    // Move snake
    let head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
    
    // Wrap or Die
    if (head.x < 0 || head.x >= 280/box || head.y < 0 || head.y >= 280/box) {
      clearInterval(window.snakeInterval);
      alert('Game Over! Score: ' + score);
      return;
    }
    
    // Self collision
    for (let segment of snake) {
      if (head.x === segment.x && head.y === segment.y) {
        clearInterval(window.snakeInterval);
        alert('Game Over! Score: ' + score);
        return;
      }
    }
    
    snake.unshift(head);
    
    // Eat food
    if (head.x === food.x && head.y === food.y) {
      score++;
      food = {
        x: Math.floor(Math.random() * (280/box)),
        y: Math.floor(Math.random() * (280/box))
      };
    } else {
      snake.pop();
    }
    
    // Draw Food
    ctx.fillStyle = '#ff78c8';
    ctx.beginPath();
    ctx.arc(food.x * box + box/2, food.y * box + box/2, box/2 - 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw Snake
    snake.forEach((segment, i) => {
      ctx.fillStyle = i === 0 ? '#00e5ff' : '#4da8ff';
      ctx.fillRect(segment.x * box + 1, segment.y * box + 1, box - 2, box - 2);
    });
  }, 150);
}

/* ============================================================
   RESET
============================================================ */
OS.resetOS = () => {
  if (confirm('Alle offenen Fenster schließen und zurücksetzen?')) {
    windowLayer.innerHTML = '';
    if (window.snakeInterval) clearInterval(window.snakeInterval);
  }
};
