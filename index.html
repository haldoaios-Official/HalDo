<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000510">
<title>HalDo AI OS</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--cyan:#00e5ff;--blue:#4da8ff;--purple:#b478ff;--pink:#ff78c8;
--success:#00ff88;--warning:#ffc800;--danger:#ff4466;
--sys:var(--cyan);--sys2:var(--blue);--glow:rgba(0,229,255,.5);
--border:rgba(0,229,255,.35);--border-soft:rgba(0,229,255,.15);
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
}
html,body{width:100%;height:100%;overflow:hidden;background:#000510;color:#e6f4ff;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;
line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:rgba(0,20,50,.3);border-radius:3px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:3px}

/* KOSMOS */
#kosmos{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 50%,#0a1832 0%,#050c1e 40%,#000510 100%);overflow:hidden;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}
#sun{position:absolute;top:50%;left:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;
background:radial-gradient(circle at 35% 35%,#fff8d0 0%,#ffcc44 30%,#ff8833 60%,#cc4400 100%);
box-shadow:0 0 60px 20px rgba(255,180,60,.6),0 0 120px 40px rgba(255,120,40,.4),0 0 200px 80px rgba(255,80,20,.2);
animation:sunP 4s ease-in-out infinite}
@keyframes sunP{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.orbit{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(0,229,255,.1);transform-origin:center;animation:orb linear infinite;pointer-events:none}
@keyframes orb{to{transform:rotate(360deg)}}
.planet{position:absolute;top:50%;left:0;border-radius:50%;box-shadow:0 0 12px currentColor}

/* TOP-BAR */
#topBar{position:fixed;top:0;left:0;right:0;height:calc(60px + var(--safe-top));
padding:var(--safe-top) calc(12px + var(--safe-right)) 0 calc(12px + var(--safe-left));
display:flex;align-items:center;justify-content:space-between;z-index:500;
background:linear-gradient(180deg,rgba(0,15,40,.95),rgba(0,10,30,.7));
backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
border-bottom:1px solid var(--border-soft)}
.tb-brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.tb-logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));
border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:20px;
box-shadow:0 0 20px var(--glow);overflow:hidden;flex-shrink:0}
.tb-logo img{width:100%;height:100%;object-fit:cover}
.tb-name{font-size:14px;font-weight:900;color:#fff;letter-spacing:.3px}
.tb-version{display:block;font-size:9px;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;font-weight:800;margin-top:1px}
.tb-actions{display:flex;gap:6px;align-items:center}
.tb-btn{width:42px;height:42px;border-radius:12px;background:rgba(0,40,80,.5);border:1.5px solid var(--border);
color:var(--cyan);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
transition:all .2s;position:relative}
.tb-btn:hover{background:rgba(0,229,255,.2);transform:scale(1.05);box-shadow:0 0 16px var(--glow)}
.tb-btn:active{transform:scale(.94)}
.tb-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
background:var(--danger);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;
justify-content:center;border:2px solid #000510}

/* SIDEBAR */
#sidebar{position:fixed;top:calc(70px + var(--safe-top));left:calc(8px + var(--safe-left));
bottom:calc(70px + var(--safe-bottom));width:64px;z-index:400;display:flex;flex-direction:column;gap:6px;
padding:8px 6px;border-radius:22px;background:linear-gradient(180deg,rgba(0,25,55,.92),rgba(0,12,35,.98));
backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
border:1.5px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,.7),0 0 40px var(--glow);
overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
#sidebar::-webkit-scrollbar{display:none}
#sidebar.collapsed{transform:translateX(-82px)}
.sb-logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--cyan),var(--purple));
border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:22px;
box-shadow:0 0 18px var(--glow);cursor:pointer;transition:all .2s;flex-shrink:0;overflow:hidden;position:relative}
.sb-logo img{width:100%;height:100%;object-fit:cover;border-radius:12px;position:relative;z-index:1}
.sb-logo:hover{transform:scale(1.08);box-shadow:0 0 28px var(--glow)}
.sb-div{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:3px 2px;flex-shrink:0}
.sb-btn{width:46px;height:46px;border-radius:14px;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:1px;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);
background:rgba(0,40,80,.45);border:1.5px solid var(--border-soft);color:#e6f4ff;flex-shrink:0;position:relative}
.sb-btn .i{font-size:20px;line-height:1}
.sb-btn .l{font-size:7px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;opacity:.8;line-height:1}
.sb-btn:hover{background:rgba(0,229,255,.2);border-color:var(--cyan);transform:translateX(4px) scale(1.06);box-shadow:0 0 20px var(--glow)}
.sb-btn:active{transform:translateX(2px) scale(.96)}
.sb-btn.active{background:linear-gradient(135deg,var(--cyan),var(--blue));border-color:#fff;color:#001018;box-shadow:0 0 24px var(--glow)}
.sb-avatar{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0%,rgba(0,255,255,.7) 30%,rgba(77,168,255,.8) 60%,rgba(180,120,255,.9) 100%);
border:2px solid rgba(255,255,255,.9);box-shadow:0 0 18px var(--glow),inset 0 0 18px rgba(255,255,255,.5);
cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
transition:all .2s;position:relative;animation:sbP 3s ease-in-out infinite}
@keyframes sbP{0%,100%{box-shadow:0 0 18px var(--glow),inset 0 0 18px rgba(255,255,255,.5)}50%{box-shadow:0 0 30px var(--glow),inset 0 0 24px rgba(255,255,255,.7)}}
.sb-avatar:hover{transform:scale(1.1)}
.sb-avatar:active{transform:scale(.94)}
.sb-avatar.cyborg{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0%,rgba(255,120,220,.7) 30%,rgba(200,80,255,.8) 60%,rgba(150,100,255,.9) 100%)}
#sidebarToggle{position:fixed;top:calc(76px + var(--safe-top));left:calc(78px + var(--safe-left));
width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--blue));
border:2px solid #fff;color:#001018;font-size:11px;font-weight:900;cursor:pointer;display:flex;
align-items:center;justify-content:center;z-index:401;box-shadow:0 0 14px var(--glow);transition:all .2s}
#sidebarToggle:hover{transform:scale(1.15)}
#sidebarToggle:active{transform:scale(.9)}

/* BOTTOM-BAR */
#bottomBar{position:fixed;bottom:0;left:0;right:0;height:calc(60px + var(--safe-bottom));
padding:0 calc(12px + var(--safe-right)) var(--safe-bottom) calc(12px + var(--safe-left));
display:flex;align-items:center;justify-content:center;gap:10px;z-index:500;
background:linear-gradient(0deg,rgba(0,15,40,.95),rgba(0,10,30,.7));
backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
border-top:1px solid var(--border-soft)}
.bb-btn{min-width:52px;height:44px;padding:0 14px;border-radius:14px;background:rgba(0,40,80,.6);
border:1.5px solid var(--border);color:#e6f4ff;font-size:12px;font-weight:800;display:flex;
align-items:center;justify-content:center;gap:5px;cursor:pointer;
transition:all .2s cubic-bezier(.34,1.56,.64,1);font-family:inherit}
.bb-btn .i{font-size:16px}
.bb-btn:hover{background:rgba(0,229,255,.2);border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 8px 20px var(--glow)}
.bb-btn:active{transform:translateY(0) scale(.95)}
.bb-btn.main{background:linear-gradient(135deg,var(--cyan),var(--blue));border-color:#fff;color:#001018;box-shadow:0 0 24px var(--glow)}
.bb-btn.cyborg{background:linear-gradient(135deg,var(--pink),var(--purple));border-color:#fff;color:#fff;box-shadow:0 0 24px rgba(255,120,200,.6)}

/* FENSTER */
.os-window{position:fixed;display:none;flex-direction:column;min-width:300px;min-height:200px;
max-width:96vw;max-height:90vh;border-radius:18px;border:1.5px solid var(--border);
background:linear-gradient(180deg,rgba(0,25,55,.96),rgba(0,12,35,.99));
backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 50px var(--glow),inset 0 1px 0 rgba(255,255,255,.1);
z-index:200;overflow:hidden;transition:box-shadow .2s}
.os-window.show{display:flex;animation:wOpen .3s cubic-bezier(.34,1.56,.64,1)}
.os-window.active{z-index:250;box-shadow:0 35px 100px rgba(0,0,0,.85),0 0 70px var(--glow),inset 0 1px 0 rgba(255,255,255,.15)}
.os-window.dragging,.os-window.resizing{transition:none!important}
@keyframes wOpen{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.win-header{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:54px;
background:linear-gradient(180deg,rgba(0,40,80,.6),rgba(0,20,50,.8));
border-bottom:1px solid var(--border-soft);cursor:grab;user-select:none;-webkit-user-select:none;
touch-action:none;flex-shrink:0;position:relative;z-index:10}
.win-header:active{cursor:grabbing}
.win-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.2));
border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.win-title{flex:1;min-width:0;font-size:13px;font-weight:800;color:#fff;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap;letter-spacing:.3px}
.win-buttons{display:flex;gap:5px;flex-shrink:0;align-items:center}
.win-btn{width:36px;height:36px;border-radius:10px;background:rgba(0,40,80,.6);border:1.5px solid var(--border);
color:var(--cyan);font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;
justify-content:center;transition:all .15s;position:relative;z-index:999999;pointer-events:auto;
touch-action:manipulation;-webkit-tap-highlight-color:transparent;flex-shrink:0;font-family:inherit}
.win-btn:hover{background:rgba(0,229,255,.25);transform:scale(1.08);box-shadow:0 0 14px var(--glow)}
.win-btn:active{transform:scale(.92)}
.win-btn.min{color:var(--warning);border-color:rgba(255,200,0,.4)}
.win-btn.flt{color:var(--purple);border-color:rgba(180,120,255,.4)}
.win-btn.full{color:var(--success);border-color:rgba(0,255,136,.4)}
.win-btn.close{color:var(--danger);border-color:rgba(255,68,102,.4)}
.win-btn.close:hover{background:rgba(255,68,102,.25);color:#fff;box-shadow:0 0 14px rgba(255,68,102,.6)}
.win-btn.flt.active{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff}
.win-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;min-height:0}
.win-resize{position:absolute;z-index:50;touch-action:none;background:transparent}
.win-resize.e{right:0;top:60px;bottom:24px;width:12px;cursor:e-resize}
.win-resize.s{left:40px;right:40px;bottom:0;height:12px;cursor:s-resize}
.win-resize.se{right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize}
.win-resize.se::before{content:'';position:absolute;right:5px;bottom:5px;width:12px;height:12px;
border-right:2.5px solid var(--cyan);border-bottom:2.5px solid var(--cyan);border-radius:0 0 6px 0}
.win-resize.w{left:0;top:60px;bottom:24px;width:12px;cursor:w-resize}
.win-resize.n{top:54px;left:20px;right:20px;height:8px;cursor:n-resize}
.os-window.fullscreen{top:0!important;left:0!important;right:0!important;bottom:0!important;
width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;
border-radius:0!important;border:none!important}
.os-window.floating{border-radius:14px}
.os-window.minimized{display:none}

/* PANELS (schwebend, verschiebbar) */
.holo-panel{position:fixed;z-index:900;background:linear-gradient(180deg,rgba(0,25,55,.96),rgba(0,12,35,.99));
backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
border:1.5px solid var(--border);border-radius:18px;
box-shadow:0 25px 70px rgba(0,0,0,.75),0 0 50px var(--glow),inset 0 1px 0 rgba(255,255,255,.1);
display:none;flex-direction:column;min-width:260px;max-width:380px;max-height:70vh;overflow:hidden}
.holo-panel.show{display:flex;animation:pIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes pIn{from{opacity:0;transform:scale(.9) translateY(-10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.holo-panel-head{display:flex;align-items:center;gap:10px;padding:10px 12px;
border-bottom:1px solid var(--border-soft);
background:linear-gradient(180deg,rgba(0,40,80,.5),rgba(0,20,50,.7));
cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;flex-shrink:0}
.holo-panel-head:active{cursor:grabbing}
.hph-grip{font-size:14px;color:rgba(0,229,255,.7);font-weight:900;letter-spacing:1px;flex-shrink:0}
.hph-logo{width:22px;height:22px;border-radius:6px;object-fit:cover;border:1.5px solid var(--border);flex-shrink:0}
.hph-title{flex:1;font-size:13px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hph-close{width:30px;height:30px;border-radius:9px;background:rgba(255,60,60,.15);
border:1px solid rgba(255,80,80,.4);color:#ff9090;font-size:14px;font-weight:900;cursor:pointer;
display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:999999;
pointer-events:auto;touch-action:manipulation;font-family:inherit}
.hph-close:hover{background:rgba(255,60,60,.3);transform:scale(1.1)}
.holo-panel-body{flex:1;overflow-y:auto;padding:10px}
.holo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
background:rgba(0,40,80,.35);border:1.5px solid var(--border-soft);margin-bottom:6px;
cursor:pointer;transition:all .2s}
.holo-item:hover{background:rgba(0,229,255,.15);border-color:var(--cyan);transform:translateX(4px)}
.hi-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(180,120,255,.25));
border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hi-main{flex:1;min-width:0}
.hi-title{font-size:13px;font-weight:800;color:#fff;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi-sub{font-size:10px;color:#88ccff;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* MODAL */
.os-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;
background:rgba(0,0,0,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1100}
.os-modal.show{display:flex;animation:mFade .25s}
@keyframes mFade{from{opacity:0}to{opacity:1}}
.os-modal-box{background:linear-gradient(180deg,rgba(0,25,55,.98),rgba(0,12,35,.99));
border:2px solid var(--border);border-radius:20px;padding:20px;max-width:520px;width:100%;
max-height:90vh;overflow-y:auto;box-shadow:0 25px 80px rgba(0,0,0,.8),0 0 60px var(--glow);
animation:mPop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes mPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.os-modal-box h2{font-size:18px;margin-bottom:14px;color:#fff;font-weight:800}

/* FORM */
.os-input,.os-select,.os-textarea{width:100%;padding:12px 14px;border-radius:12px;
background:rgba(0,0,0,.5);border:1.5px solid var(--border);color:#fff;font-size:14px;
font-family:inherit;outline:none;transition:all .15s;box-sizing:border-box}
.os-input:focus,.os-select:focus,.os-textarea:focus{border-color:var(--cyan);box-shadow:0 0 20px var(--glow)}
.os-textarea{min-height:100px;resize:vertical;line-height:1.5}
.os-select{cursor:pointer;-webkit-appearance:none;padding-right:36px;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300e5ff'><path d='M7 10l5 5 5-5z'/></svg>");
background-repeat:no-repeat;background-position:right 10px center;background-size:20px}
.os-select option{background:#001028;color:#fff}
.os-label{display:block;font-size:11px;color:var(--cyan);font-weight:800;text-transform:uppercase;
letter-spacing:1px;margin-bottom:6px}
.os-row{margin-bottom:12px}
.os-btn{padding:12px 18px;border-radius:12px;background:rgba(0,40,80,.6);border:1.5px solid var(--border);
color:#e6f4ff;font-size:14px;font-weight:800;cursor:pointer;transition:all .15s;
display:inline-flex;align-items:center;justify-content:center;gap:6px;
-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:inherit}
.os-btn:hover{background:rgba(0,229,255,.2);transform:translateY(-2px);box-shadow:0 8px 20px var(--glow)}
.os-btn:active{transform:translateY(0) scale(.95)}
.os-btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));border-color:#fff;color:#001018}
.os-btn.danger{background:rgba(255,68,102,.15);border-color:rgba(255,68,102,.5);color:var(--danger)}
.os-btn.danger:hover{background:rgba(255,68,102,.3);color:#fff}
.os-btn.full{width:100%}

/* TOAST */
#toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;
transform:translateX(-50%) translateY(20px);padding:11px 20px;border-radius:14px;
background:linear-gradient(135deg,var(--cyan),var(--blue));color:#001018;font-size:13px;font-weight:800;
opacity:0;pointer-events:none;transition:all .3s;z-index:1000;box-shadow:0 10px 40px var(--glow);
white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{background:linear-gradient(135deg,var(--danger),var(--pink));color:#fff}
#toast.success{background:linear-gradient(135deg,var(--success),var(--cyan))}

/* Hilfsklassen */
.empty{text-align:center;padding:40px 20px;color:#5a8ab0}
.empty .ei{font-size:56px;opacity:.5;margin-bottom:12px}
.empty .et{font-size:14px;color:#88ccff}
.empty .es{font-size:12px;margin-top:4px;opacity:.7}
.card{padding:14px;border-radius:14px;background:linear-gradient(160deg,rgba(0,60,120,.4),rgba(0,15,40,.85));
border:1.5px solid var(--border-soft);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:32px;font-weight:900;color:var(--cyan)}
.lbl{font-size:10px;color:#88ccff;text-transform:uppercase;letter-spacing:1.2px;font-weight:800}

@media(max-width:500px){
  #sidebar{top:calc(66px + var(--safe-top));width:58px;padding:6px 5px;border-radius:18px;
    bottom:calc(66px + var(--safe-bottom))}
  .sb-logo,.sb-btn,.sb-avatar{width:42px;height:42px;border-radius:12px}
  .sb-btn .i{font-size:18px}.sb-btn .l{font-size:6px}
  #sidebarToggle{top:calc(70px + var(--safe-top));left:calc(70px + var(--safe-left))}
  .bb-btn{height:42px;padding:0 10px;font-size:11px}
  .bb-btn .i{font-size:15px}
  .win-btn{width:34px;height:34px;font-size:14px}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function showToast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='';
  if(type)el.classList.add(type);
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2500);
}

// ═══════════════════════════════════════════════════════════
// STERNE + PLANETEN
// ═══════════════════════════════════════════════════════════
function makeStars(){
  const s=document.getElementById('stars');
  s.innerHTML='';
  for(let i=0;i<150;i++){
    const d=document.createElement('div');
    d.className='star';
    d.style.left=Math.random()*100+'%';
    d.style.top=Math.random()*100+'%';
    const sz=Math.random()*2+.5;
    d.style.width=sz+'px';d.style.height=sz+'px';
    d.style.animationDelay=(Math.random()*3)+'s';
    d.style.opacity=Math.random()*.7+.3;
    s.appendChild(d);
  }
}
function makePlanets(){
  const k=document.getElementById('kosmos');
  k.querySelectorAll('.orbit').forEach(o=>o.remove());
  const ps=[
    ['#a0a0a0',6,90,8],['#ffcc88',10,120,12],['#4da8ff',10,150,16],['#ff6644',8,180,20],
    ['#dd9966',18,220,26],['#ddbb77',16,260,32],['#88dddd',12,300,40],['#6688dd',12,340,48],
    ['#ccaa99',5,375,58],['#998877',4,400,68],['#cccccc',6,430,80],['#aabbcc',5,455,95]
  ];
  ps.forEach((p,i)=>{
    const o=document.createElement('div');
    o.className='orbit';
    o.style.width=(p[2]*2)+'px';o.style.height=(p[2]*2)+'px';
    o.style.marginLeft=-p[2]+'px';o.style.marginTop=-p[2]+'px';
    o.style.animationDuration=p[3]+'s';
    o.style.animationDelay=(-i*2)+'s';
    const pl=document.createElement('div');
    pl.className='planet';
    pl.style.width=p[1]+'px';pl.style.height=p[1]+'px';
    pl.style.marginTop=-(p[1]/2)+'px';pl.style.marginLeft=-(p[1]/2)+'px';
    pl.style.background=p[0];pl.style.color=p[0];
    o.appendChild(pl);
    k.appendChild(o);
  });
}

// ═══════════════════════════════════════════════════════════
// WINDOW MANAGER
// ═══════════════════════════════════════════════════════════
let zTop=200;
const openWins=new Set();

function prepareWindow(win){
  if(win.dataset.ready)return;
  win.dataset.ready='1';
  win.classList.add('os-window');

  // Header
  let header=win.querySelector('.win-header');
  if(!header){
    const oldH=win.querySelector('.header');
    if(oldH){
      header=oldH;
      header.classList.add('win-header');
      header.classList.remove('header');
    }
  }
  if(!header){
    header=document.createElement('div');
    header.className='win-header';
    const title=win.dataset.title||win.id.replace(/-window$/,'').replace(/-/g,' ');
    const icon=win.dataset.icon||'📱';
    header.innerHTML='<div class="win-icon">'+icon+'</div><div class="win-title">'+
      (title.charAt(0).toUpperCase()+title.slice(1))+'</div>'+
      '<div class="win-buttons">'+
      '<button class="win-btn min" title="Min">─</button>'+
      '<button class="win-btn flt" title="Float">⇲</button>'+
      '<button class="win-btn full" title="Full">⛶</button>'+
      '<button class="win-btn close" title="Close">✕</button></div>';
    win.insertBefore(header,win.firstChild);
  }

  // Buttons sicherstellen
  let btnC=header.querySelector('.win-buttons');
  if(!btnC){
    btnC=document.createElement('div');
    btnC.className='win-buttons';
    btnC.innerHTML='<button class="win-btn min">─</button><button class="win-btn flt">⇲</button><button class="win-btn full">⛶</button><button class="win-btn close">✕</button>';
    header.appendChild(btnC);
  }

  // Body
  let body=win.querySelector('.win-body');
  if(!body){
    const kids=Array.from(win.children).filter(c=>c!==header);
    body=document.createElement('div');
    body.className='win-body';
    kids.forEach(c=>body.appendChild(c));
    win.appendChild(body);
  }

  // Resize handles
  ['e','s','se','w','n'].forEach(d=>{
    const h=document.createElement('div');
    h.className='win-resize '+d;
    h.dataset.dir=d;
    win.appendChild(h);
    enableResize(win,h);
  });

  // Buttons
  btnC.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();closeWin(win)});
  btnC.querySelector('.min').addEventListener('click',e=>{
    e.stopPropagation();win.classList.add('minimized');
    setTimeout(()=>{win.classList.remove('show');win.style.display='none';openWins.delete(win.id)},200);
  });
  btnC.querySelector('.full').addEventListener('click',e=>{e.stopPropagation();win.classList.toggle('fullscreen')});
  btnC.querySelector('.flt').addEventListener('click',e=>{
    e.stopPropagation();
    const b=e.currentTarget;
    win.classList.toggle('floating');
    b.classList.toggle('active');
    if(win.classList.contains('floating')){
      const vw=innerWidth,vh=innerHeight;
      const w=Math.min(420,vw-40),h=Math.min(620,vh-140);
      win.style.left=Math.round((vw-w)/2)+'px';
      win.style.top='80px';
      win.style.width=w+'px';
      win.style.height=h+'px';
    }
  });

  // Drag
  enableDrag(win,header);

  // Bring to front
  win.addEventListener('mousedown',()=>bringFront(win));
  win.addEventListener('touchstart',()=>bringFront(win),{passive:true});
}

function enableDrag(win,header){
  let d=null;
  const start=e=>{
    if(e.target.closest('button,.win-btn,input,textarea,select'))return;
    const t=e.touches?e.touches[0]:e;
    const r=win.getBoundingClientRect();
    d={x:t.clientX,y:t.clientY,l:r.left,t:r.top,moved:false};
    win.classList.add('dragging');
    bringFront(win);
    if(e.cancelable)e.preventDefault();
  };
  const move=e=>{
    if(!d)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-d.x,dy=t.clientY-d.y;
    if(!d.moved&&(Math.abs(dx)>3||Math.abs(dy)>3))d.moved=true;
    if(!d.moved)return;
    const vw=innerWidth,vh=innerHeight,w=win.offsetWidth,h=win.offsetHeight;
    win.style.left=Math.max(2,Math.min(vw-w-2,d.l+dx))+'px';
    win.style.top=Math.max(2,Math.min(vh-h-2,d.t+dy))+'px';
    if(e.cancelable)e.preventDefault();
  };
  const end=()=>{if(!d)return;win.classList.remove('dragging');d=null};
  header.addEventListener('touchstart',start,{passive:false});
  header.addEventListener('touchmove',move,{passive:false});
  header.addEventListener('touchend',end);
  header.addEventListener('touchcancel',end);
  header.addEventListener('mousedown',e=>{
    start(e);
    const mm=ev=>move(ev),mu=()=>{end();removeEventListener('mousemove',mm);removeEventListener('mouseup',mu)};
    addEventListener('mousemove',mm);addEventListener('mouseup',mu);
  });
}

function enableResize(win,handle){
  let s=null;
  const start=e=>{
    const t=e.touches?e.touches[0]:e;
    const r=win.getBoundingClientRect();
    s={x:t.clientX,y:t.clientY,w:r.width,h:r.height,l:r.left,t:r.top,dir:handle.dataset.dir};
    win.classList.add('resizing');
    if(e.cancelable)e.preventDefault();e.stopPropagation();
  };
  const move=e=>{
    if(!s)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-s.x,dy=t.clientY-s.y,dir=s.dir;
    let nW=s.w,nH=s.h,nL=s.l,nT=s.t;
    if(dir.includes('e'))nW=Math.max(280,s.w+dx);
    if(dir.includes('s'))nH=Math.max(200,s.h+dy);
    if(dir.includes('w')){nW=Math.max(280,s.w-dx);nL=s.l+(s.w-nW)}
    if(dir.includes('n')){nH=Math.max(200,s.h-dy);nT=s.t+(s.h-nH)}
    win.style.width=nW+'px';win.style.height=nH+'px';
    win.style.left=nL+'px';win.style.top=nT+'px';
    if(e.cancelable)e.preventDefault();
  };
  const end=()=>{if(!s)return;win.classList.remove('resizing');s=null};
  handle.addEventListener('touchstart',start,{passive:false});
  handle.addEventListener('touchmove',move,{passive:false});
  handle.addEventListener('touchend',end);
  handle.addEventListener('touchcancel',end);
  handle.addEventListener('mousedown',e=>{
    start(e);
    const mm=ev=>move(ev),mu=()=>{end();removeEventListener('mousemove',mm);removeEventListener('mouseup',mu)};
    addEventListener('mousemove',mm);addEventListener('mouseup',mu);
  });
}

function positionWin(win){
  const vw=innerWidth,vh=innerHeight;
  const isM=vw<700;
  let w,h;
  if(isM){w=Math.round(vw*.94);h=Math.round(vh*.62)}
  else{w=Math.min(560,vw-200);h=Math.min(680,vh-200)}
  const off=openWins.size;
  const left=Math.max(20,Math.round((vw-w)/2)+(off*25)-50);
  const top=Math.max(80,Math.round((vh-h)/2)+(off*15)-30);
  win.style.width=w+'px';win.style.height=h+'px';
  win.style.left=Math.min(left,vw-w-20)+'px';
  win.style.top=top+'px';
}

function bringFront(win){
  zTop++;
  win.style.zIndex=zTop;
  document.querySelectorAll('.os-window.active').forEach(w=>{if(w!==win)w.classList.remove('active')});
  win.classList.add('active');
}

function openWin(id){
  const win=document.getElementById(id);
  if(!win){showToast('⚠️ "'+id+'" nicht gefunden','error');return null}
  prepareWindow(win);
  if(!win.dataset.pos){
    positionWin(win);
    win.dataset.pos='1';
  }
  win.classList.add('show');
  win.style.display='flex';
  bringFront(win);
  openWins.add(id);
  if(navigator.vibrate)navigator.vibrate(10);
  return win;
}

function closeWin(id){
  const win=typeof id==='string'?document.getElementById(id):id;
  if(!win)return;
  win.classList.remove('show','active','floating','fullscreen');
  win.style.display='none';
  openWins.delete(win.id);
}

const panelPos={};

function openPanel(name){
  const p=document.getElementById('hp-'+name);
  if(!p)return;
  if(p.classList.contains('show')){closePanel(name);return}
  // Position aus Storage oder Default
  const saved=panelPos[name];
  if(saved){
    p.style.left=saved.l+'px';
    p.style.top=saved.t+'px';
  }else{
    // Kaskadierend
    const open=document.querySelectorAll('.holo-panel.show').length;
    const vw=innerWidth;
    const sidebar=document.getElementById('sidebar');
    const base=sidebar?(sidebar.offsetWidth+20):80;
    p.style.left=Math.min(base+(open*20),vw-300)+'px';
    p.style.top=(100+open*25)+'px';
  }
  p.classList.add('show');
  bindPanelDrag(p);
  if(navigator.vibrate)navigator.vibrate(8);
}

function closePanel(name){
  const p=document.getElementById('hp-'+name);
  if(p)p.classList.remove('show');
}

function closeAllPanels(){
  document.querySelectorAll('.holo-panel.show').forEach(p=>p.classList.remove('show'));
}

function bindPanelDrag(panel){
  const head=panel.querySelector('.holo-panel-head');
  if(!head||head.dataset.drag)return;
  head.dataset.drag='1';
  let d=null;
  const start=e=>{
    if(e.target.closest('button,.hph-close'))return;
    const t=e.touches?e.touches[0]:e;
    const r=panel.getBoundingClientRect();
    d={x:t.clientX,y:t.clientY,l:r.left,t:r.top,moved:false};
    panel.style.zIndex='1000';
    if(e.cancelable)e.preventDefault();
  };
  const move=e=>{
    if(!d)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-d.x,dy=t.clientY-d.y;
    if(!d.moved&&(Math.abs(dx)>3||Math.abs(dy)>3))d.moved=true;
    if(!d.moved)return;
    const vw=innerWidth,vh=innerHeight,w=panel.offsetWidth,h=panel.offsetHeight;
    const nl=Math.max(4,Math.min(vw-w-4,d.l+dx));
    const nt=Math.max(4,Math.min(vh-h-4,d.t+dy));
    panel.style.left=nl+'px';
    panel.style.top=nt+'px';
    if(e.cancelable)e.preventDefault();
  };
  const end=()=>{
    if(!d)return;
    panel.style.zIndex='900';
    if(d.moved){
      const name=panel.id.replace('hp-','');
      panelPos[name]={l:panel.offsetLeft,t:panel.offsetTop};
      try{localStorage.setItem('haldo_panels',JSON.stringify(panelPos))}catch(e){}
      if(navigator.vibrate)navigator.vibrate(6);
    }
    d=null;
  };
  head.addEventListener('touchstart',start,{passive:false});
  head.addEventListener('touchmove',move,{passive:false});
  head.addEventListener('touchend',end);
  head.addEventListener('touchcancel',end);
  head.addEventListener('mousedown',e=>{
    start(e);
    const mm=ev=>move(ev),mu=()=>{end();removeEventListener('mousemove',mm);removeEventListener('mouseup',mu)};
    addEventListener('mousemove',mm);addEventListener('mouseup',mu);
  });
}

function launch(id){
  if(typeof openWin==='function'){
    openWin(id);
    setTimeout(closeAllPanels,150);
  }
  if(navigator.vibrate)navigator.vibrate(10);
}

function launchAvatar(mode){
  setTheme(mode==='cyborg'?'cyborg':'ai');
  showToast((mode==='cyborg'?'⚡ CYBORG':'🤖 HalDo AI')+' Modus aktiviert','success');
  if(window.HalDoAvatar&&typeof window.HalDoAvatar.open==='function'){
    window.HalDoAvatar.open();
  }else{
    showToast('🤖 Avatar wird in künftiger Version aktiviert','success');
  }

}

// ═══════════════════════════════════════════════════════════
function store(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function saveStore(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// ─── AI MEMORY ───
window.HalDoMemory={
  key:'haldo_memory_v1',
  all(){return store(this.key,[])},
  remember(title,content,cat,tags){
    const m=this.all();
    m.unshift({id:uid('m_'),title:title||'',content:content||'',cat:cat||'other',tags:tags||[],created:Date.now()});
    saveStore(this.key,m.slice(0,500));
    return m[0].id;
  },
  recall(q){
    const lc=(q||'').toLowerCase();
    return this.all().filter(m=>(m.title||'').toLowerCase().includes(lc)||(m.content||'').toLowerCase().includes(lc));
  },
  forget(id){
    saveStore(this.key,this.all().filter(m=>m.id!==id));
  },
  count(){return this.all().length}
};

// ─── JOURNAL ───
window.HalDoJournal={
  key:'haldo_journal_v1',
  all(){return store(this.key,[])},
  write(title,content,mood,tags){
    const e=this.all();
    e.unshift({id:uid('j_'),title:title||'',content:content||'',mood:mood||'okay',tags:tags||[],created:Date.now()});
    saveStore(this.key,e.slice(0,500));
    return e[0].id;
  },
  count(){return this.all().length}
};

// ─── TASKS ───
window.HalDoTasks={
  key:'haldo_tasks_v1',
  all(){return store(this.key,[])},
  add(title,opts){
    const t=this.all();
    t.unshift({id:uid('t_'),title,cat:(opts&&opts.cat)||'personal',prio:(opts&&opts.prio)||'mid',due:(opts&&opts.due)||'',done:false,created:Date.now()});
    saveStore(this.key,t);
    return t[0].id;
  },
  complete(id){
    const t=this.all();
    const x=t.find(v=>v.id===id);
    if(x){x.done=true;saveStore(this.key,t)}
  },
  count(){return this.all().length},
  open(){return this.all().filter(t=>!t.done)}
};

// ─── HABITS ───
window.HalDoHabits={
  key:'haldo_habits_v1',
  all(){return store(this.key,[])},
  add(name,opts){
    const h=this.all();
    h.unshift({id:uid('h_'),name,emoji:(opts&&opts.emoji)||'🎯',color:(opts&&opts.color)||'#00e5ff',log:{},created:Date.now()});
    saveStore(this.key,h);
    return h[0].id;
  },
  checkIn(id){
    const h=this.all();
    const x=h.find(v=>v.id===id);
    if(x){
      const d=new Date();
      const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      x.log[k]=true;
      saveStore(this.key,h);
    }
  },
  count(){return this.all().length}
};

function rebuild(id){
  switch(id){
    case 'dashboard-window':buildDashboard();break;
    case 'memory-window':buildMemory();break;
    case 'journal-window':buildJournal();break;
    case 'tasks-window':buildTasks();break;
    case 'habits-window':buildHabits();break;
    case 'goals-window':buildGoals();break;
    case 'calendar-window':buildCalendar();break;
    case 'weather-window':buildWeather();break;
  }
}

// ═══════════════════════════════════════════════════════════
document.addEventListener('click',e=>{
  const item=e.target.closest('.holo-item');
  if(!item)return;
  const title=item.querySelector('.hi-title');
  if(!title)return;
  const t=title.textContent;
  if(t==='Design wechseln'){
    const cur=localStorage.getItem('haldo_theme')||'ai';
    setTheme(cur==='ai'?'cyborg':'ai');
    showToast('🎨 Design: '+localStorage.getItem('haldo_theme').toUpperCase(),'success');
  }else if(t==='Sidebar zurücksetzen'){
    localStorage.removeItem('haldo_panels');
    document.querySelectorAll('.holo-panel').forEach(p=>{p.style.left='';p.style.top=''});
    showToast('🔄 Positionen zurückgesetzt','success');
  }else if(t==='Backup exportieren'){
    const data={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('haldo_'))data[k]=localStorage.getItem(k);
    }
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='haldo-backup-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('📤 Backup exportiert','success');
  }
});

}else{

}

})();

};

window.HalDoClipboard = {
  key:'haldo_clipboard_v1',
  all(){ return store(this.key,[]); },
  add(text){
    if(!text) return null;
    const l=this.all();
    const exist=l.find(i=>i.text===text);
    if(exist){ exist.created=Date.now(); saveStore(this.key,l); return exist.id; }
    l.unshift({ id:uid('cl_'), text, created:Date.now() });
    saveStore(this.key, l.slice(0,200));
    return l[0].id;
  },
  remove(id){ saveStore(this.key, this.all().filter(i=>i.id!==id)); },
  count(){ return this.all().length; }
};

    '<div style="display:flex;gap:6px">'+
    '<button class="os-btn" style="padding:4px 10px;font-size:10px" onclick="navigator.clipboard.writeText(\''+esc(c.text).replace(/\n/g,'\\n').replace(/'/g,"\\'")+'\').then(()=>showToast(\'📋 Kopiert\',\'success\'))">📋</button>'+

window.HalDoMood = {
  key:'haldo_mood_v1',
  all(){ return store(this.key,[]); },
  save(value, note){
    const l=this.all();
    const d=todayK();
    const idx=l.findIndex(x=>x.date===d);
    if(idx>=0){ l[idx]={date:d,value,note:note||''}; }
    else { l.unshift({date:d,value,note:note||''}); }
    saveStore(this.key, l.slice(0,365));
  },
  today(){ const d=todayK(); return this.all().find(x=>x.date===d); },
  avg(){ if(!this.all().length) return 0; const l=this.all().slice(0,30); return l.reduce((s,e)=>s+e.value,0)/l.length; },
  count(){ return this.all().length; }
};

function buildMood(){
  const w=$('mood-window'); if(!w) return;
  w.dataset.title='Stimmung'; w.dataset.icon='😊';
  const today=HalDoMood.today();
  const cur=today?today.value:3;
  const moods=[{v:1,e:'😢',n:'Traurig',c:'#6699ff'},{v:2,e:'😕',n:'Niedrig',c:'#88aadd'},{v:3,e:'😐',n:'Neutral',c:'#ffc864'},{v:4,e:'🙂',n:'Gut',c:'#88dd88'},{v:5,e:'😄',n:'Super',c:'#ff8838'}];
  const grid=moods.map(m=>
    '<div style="text-align:center;padding:14px 6px;border-radius:14px;background:rgba(0,40,80,.4);border:2px solid '+(cur===m.v?m.c:'rgba(0,229,255,.15)')+';cursor:pointer;transition:all .2s;'+(cur===m.v?'transform:scale(1.06)':'')+'" onclick="HalDoUI.setMood('+m.v+')">'+
    '<div style="font-size:32px">'+m.e+'</div>'+
    '<div style="font-size:9px;color:'+m.c+';font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">'+m.n+'</div>'+
    '</div>'
  ).join('');
  const entries=HalDoMood.all().slice(0,14);
  const chart=entries.length?entries.reverse().map(e=>{
    const mo=moods.find(x=>x.v===e.value)||moods[2];
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:14px">'+
    '<div style="width:100%;height:'+(e.value*18)+'%;background:'+mo.c+';border-radius:4px 4px 0 0;box-shadow:0 0 8px '+mo.c+'"></div>'+
    '<div style="font-size:8px;color:#88ccff;font-weight:700">'+new Date(e.date+'T12:00:00').getDate()+'</div>'+
    '</div>';
  }).join(''):'<div style="text-align:center;color:#5a8ab0;padding:20px;font-size:12px;width:100%">Noch keine Einträge</div>';
  w.innerHTML=
    '<div class="card"><div class="lbl" style="margin-bottom:10px">'+(today?'✏️ Heute bearbeiten':'➕ Wie fühlst du dich heute?')+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">'+grid+'</div>'+
    '<textarea class="os-textarea" id="moNote" placeholder="Notiz (optional)..." style="min-height:70px;margin-top:10px">'+(today?esc(today.note||''):'')+'</textarea>'+
    '<button class="os-btn primary full" style="margin-top:8px" onclick="HalDoUI.saveMood()">💾 Speichern</button></div>'+
    '<div class="card"><div class="lbl" style="margin-bottom:8px">📊 Letzte 14 Tage</div>'+
    '<div style="display:flex;gap:4px;height:110px;align-items:flex-end;padding:8px;background:rgba(0,0,0,.3);border-radius:10px">'+chart+'</div></div>';
}

window.HalDoUI.calcKey = function(k){
  const w=$('calc-window');
  if(!w) return;
  let e=w._expr||'', r=w._res||'0';
  if(k==='C'){ e=''; r='0'; }
  else if(k==='⌫'){ e=e.slice(0,-1); }
  else if(k==='='){
    try {
      const s=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if(!/^[0-9+\-*/().]+$/.test(s)) throw new Error();
      const res=Function('return ('+s+')')();
      if(!isFinite(res)) throw new Error();
      r=String(Math.round(res*1e10)/1e10);
    } catch(err){ r='Fehler'; }
  }
  else if(k==='±'){ if(e.startsWith('-')) e=e.slice(1); else e='-'+e; }
  else if(k==='%'){ e+='/100'; }
  else { e+=k; }
  w._expr=e; w._res=r;
  const eEl=$('caExpr'), rEl=$('caRes');
  if(eEl) eEl.textContent=e||'';
  if(rEl) rEl.textContent=r;
};

window.HalDoUI.timerToggle = function(){
  const btn=$('tmBtn'), lbl=$('tmLbl'), timeEl=$('tmTime');
  if(!btn||!timeEl) return;
  if(_timerState.running){
    clearInterval(_timerState.interval);
    _timerState.running=false;
    btn.textContent='▶ Start';
    lbl.textContent='Pausiert';
  } else {
    _timerState.running=true;
    _timerState.endTime=Date.now()+_timerState.remaining;
    btn.textContent='⏸ Stop';
    lbl.textContent='Läuft...';
    _timerState.interval=setInterval(()=>{
      const rem=Math.max(0,_timerState.endTime-Date.now());
      _timerState.remaining=rem;
      const s=Math.ceil(rem/1000);
      const m=Math.floor(s/60), sec=s%60;
      timeEl.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
      if(rem<=0){
        clearInterval(_timerState.interval);
        _timerState.running=false;
        _timerState.remaining=0;
        btn.textContent='▶ Start';
        lbl.textContent='Fertig!';
        if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
        try {
          const ctx=new (window.AudioContext||window.webkitAudioContext)();
          const now=ctx.currentTime;
          [0,.3,.6].forEach(o=>{const osc=ctx.createOscillator(),g=ctx.createGain();
            osc.frequency.setValueAtTime(880,now+o);g.gain.setValueAtTime(.001,now+o);
            g.gain.exponentialRampToValueAtTime(.3,now+o+.02);g.gain.exponentialRampToValueAtTime(.001,now+o+.25);
            osc.connect(g).connect(ctx.destination);osc.start(now+o);osc.stop(now+o+.3);});
        } catch(e){}
        showToast('⏰ Zeit abgelaufen!','error');
      }
    },100);
  }
};
window.HalDoUI.timerReset = function(){
  clearInterval(_timerState.interval);
  _timerState={running:false, endTime:0, interval:null, remaining:0};
  const t=$('tmTime'), b=$('tmBtn'), l=$('tmLbl');
  if(t) t.textContent='00:00';
  if(b) b.textContent='▶ Start';
  if(l) l.textContent='Stoppuhr';
};
window.HalDoUI.startCountdown = function(){
  const h=parseInt($('tmH').value)||0, m=parseInt($('tmM').value)||0, s=parseInt($('tmS').value)||0;
  const total=(h*3600+m*60+s)*1000;
  if(total<=0){ showToast('⚠️ Zeit eingeben','error'); return; }
  clearInterval(_timerState.interval);
  _timerState.running=true;
  _timerState.endTime=Date.now()+total;
  _timerState.remaining=total;
  const btn=$('tmBtn'), lbl=$('tmLbl'), timeEl=$('tmTime');
  btn.textContent='⏸ Stop';
  lbl.textContent='Countdown läuft';
  _timerState.interval=setInterval(()=>{
    const rem=Math.max(0,_timerState.endTime-Date.now());
    _timerState.remaining=rem;
    const sec=Math.ceil(rem/1000);
    const mm=Math.floor(sec/60), ss=sec%60;
    timeEl.textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    if(rem<=0){
      clearInterval(_timerState.interval);
      _timerState.running=false;
      btn.textContent='▶ Start';
      lbl.textContent='Fertig!';
      if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);
      showToast('⏰ Countdown abgelaufen!','error');
    }
  },100);
};

window.HalDoUI.translate = async function(){
  const t=$('trIn').value.trim();
  if(!t){ showToast('⚠️ Text eingeben','error'); return; }
  const from=$('trFrom').value, to=$('trTo').value;
  if(from===to){ $('trOut').textContent=t; return; }
  $('trOut').innerHTML='<span style="color:#7ce0ff">⏳ Übersetze...</span>';
  try {
    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(t.slice(0,500))+'&langpair='+from+'|'+to;
    const res=await fetch(url);
    const d=await res.json();
    const out=(d.responseData&&d.responseData.translatedText)||'Keine Übersetzung';
    $('trOut').innerHTML='<div style="font-size:15px;color:#fff">'+esc(out)+'</div>';
    showToast('🌐 Übersetzt','success');
  } catch(e){ $('trOut').innerHTML='<span style="color:#ff8080">❌ Fehler</span>'; }
};

};
window.HalDoUI.qrDown = async function(){
  const t=$('qrIn').value.trim();
  if(!t){ showToast('⚠️ Text eingeben','error'); return; }
  try {
    const url='https://api.qrserver.com/v1/create-qr-code/?size=600x600&data='+encodeURIComponent(t);
    const res=await fetch(url);
    const blob=await res.blob();
    const u=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=u; a.download='qr-'+Date.now()+'.png';
    a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
    showToast('💾 Download gestartet','success');
  } catch(e){ showToast('❌ Fehler','error'); }
};

window.HalDoUI.pwGen = function(){
  const len=parseInt($('pwLen').value)||20;
  let pool='';
  if($('pwUp').checked) pool+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if($('pwLo').checked) pool+='abcdefghijklmnopqrstuvwxyz';
  if($('pwNu').checked) pool+='0123456789';
  if($('pwSy').checked) pool+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!pool) pool='abcdefghijklmnopqrstuvwxyz';
  let pw='';
  for(let i=0;i<len;i++) pw+=pool[Math.floor(Math.random()*pool.length)];
  $('pwOut').textContent=pw;
  showToast('🔐 Passwort generiert','success');
};
window.HalDoUI.pwCopy = function(){
  const pw=$('pwOut').textContent;
  if(!pw||pw==='Klicke "Neu"'){ showToast('⚠️ Erst generieren','error'); return; }
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(pw).then(()=>showToast('📋 Kopiert','success'));
  }
};

window.HalDoUI.loadMusic = function(input){
  const files=Array.from(input.files||[]);

    const url=URL.createObjectURL(f);

    '<div style="font-size:13px;font-weight:800;color:#fff;margin-bottom:6px">🎵 '+esc(name)+'</div>'+
    '<audio controls style="width:100%" src="'+url+'"></audio>'+
    '</div>';

  showToast('🎵 '+files.length+' Tracks geladen','success');
};

// STATISTIK
// ═══════════════════════════════════════════════════════════
function getStats(){
  let total=0, built=0;
  for(const k in APPS_375){
    for(const app of APPS_375[k].apps){
      total++;
      if(app[3]==='built') built++;
    }
  }
  return { total, built, planned: total-built };
}

function showComingSoon(app){
  const [id, icon, name, status, subtitle] = app;
  const modal = document.createElement('div');
  modal.className = 'os-modal show';
  modal.style.zIndex = '99999';
  modal.innerHTML =
    '<div class="os-modal-box" style="text-align:center;max-width:420px">' +
    '<div style="font-size:72px;margin-bottom:12px;filter:drop-shadow(0 0 20px var(--glow))">'+icon+'</div>' +
    '<h2 style="font-size:22px;margin-bottom:6px">'+esc(name)+'</h2>' +
    '<div style="font-size:11px;color:#7ce0ff;text-transform:uppercase;letter-spacing:2px;margin-bottom:14px">'+esc(subtitle)+'</div>' +
    '<div style="padding:8px 14px;background:rgba(255,200,0,.15);border:1px solid rgba(255,200,0,.4);border-radius:20px;display:inline-block;font-size:12px;color:#ffc800;font-weight:800;margin-bottom:16px">🚧 IN PLANUNG</div>' +
    '<div style="font-size:13px;color:#aaddff;line-height:1.6;padding:14px;background:rgba(0,0,0,.3);border-radius:12px;margin-bottom:16px">Diese App ist im HalDo AI OS Plan und wird in einer zukünftigen Version aktiviert.</div>' +
    '<button class="os-btn primary full" onclick="this.closest(\'.os-modal\').remove()">Verstanden</button>' +
    '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', e => {
    if(e.target === modal) modal.remove();
  });
}

// ═══════════════════════════════════════════════════════════
// APP ÖFFNEN
// ═══════════════════════════════════════════════════════════
function openApp(id){
  // Suche App
  let found = null;
  for(const letter in APPS_375){
    const app = APPS_375[letter].apps.find(a => a[0] === id);
    if(app){ found = app; break; }
  }
  if(!found){ showToast('⚠️ App nicht gefunden','error'); return; }

  const [aid, icon, name, status, subtitle] = found;

  if(status === 'built'){
    // Prüfe ob Fenster existiert
    const winId = mapToWindow(aid);
    if(winId && document.getElementById(winId)){
      openWin(winId);
      closeAllPanels();
    } else {
      // Suche passendes Fenster
      showToast(icon+' '+name+' wird geladen...','success');
      // Fallback: Coming Soon
      setTimeout(()=>showComingSoon(found), 500);
    }
  } else {
    showComingSoon(found);
  }
  if(navigator.vibrate) navigator.vibrate(10);
}

// ═══════════════════════════════════════════════════════════
function buildRegistry(){
  let win = document.getElementById('registry-window');
  if(!win){
    win = document.createElement('div');
    win.id = 'registry-window';
    document.body.appendChild(win);
  }
  win.dataset.title = 'App Registry';
  win.dataset.icon = '📋';

  const stats = getStats();
  const letters = Object.keys(APPS_375).sort();
  let html = '';
  // Statistik
  html += '<div class="card" style="text-align:center"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">'+
    '<div><div class="big" style="font-size:24px">'+stats.total+'</div><div class="lbl">Gesamt</div></div>'+
    '<div><div class="big" style="font-size:24px;color:#00ff88">'+stats.built+'</div><div class="lbl">Gebaut</div></div>'+
    '<div><div class="big" style="font-size:24px;color:#ffc800">'+stats.planned+'</div><div class="lbl">Geplant</div></div>'+
    '</div></div>';
  // Buchstaben
  html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">';
  html += '<button class="os-btn" style="padding:6px 10px;font-size:11px" onclick="HalDoRegistry.filterLetter(\'all\')">Alle</button>';
  letters.forEach(l=>{
    html += '<button class="os-btn" style="padding:6px 10px;font-size:11px" onclick="HalDoRegistry.filterLetter(\''+l+'\')">'+l+'</button>';
  });
  html += '</div>';
  // Kategorien
  letters.forEach(letter=>{
    const cat = APPS_375[letter];
    const builtCount = cat.apps.filter(a=>a[3]==='built').length;
    html += '<div class="registry-cat" data-letter="'+letter+'" style="margin-bottom:16px">';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-left:4px">'+
      '<span style="font-size:24px">'+cat.icon+'</span>'+
      '<div style="flex:1"><div style="font-size:14px;font-weight:800;color:#fff">'+letter+' · '+cat.name+'</div>'+
      '<div style="font-size:10px;color:#88ccff">'+builtCount+'/'+cat.apps.length+' gebaut</div></div></div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px">';
    cat.apps.forEach(a=>{
      const st = a[3]==='built' ? '✅' : '🚧';
      const bg = a[3]==='built' ? 'rgba(0,255,136,.1)' : 'rgba(255,200,0,.08)';
      const bd = a[3]==='built' ? 'rgba(0,255,136,.3)' : 'rgba(255,200,0,.2)';
      html += '<div onclick="HalDoRegistry.openApp(\''+a[0]+'\')" style="padding:10px;background:'+bg+';border:1.5px solid '+bd+';border-radius:12px;cursor:pointer;position:relative;transition:all .15s">'+

    if(what && window.HalDoTasks){ HalDoTasks.add(what,{cat:'personal',prio:'mid'}); return '✅ Aufgabe angelegt: '+what; }
  }
  const facts=['Wusstest du, dass Oktopusse drei Herzen haben?','Das Sonnenlicht braucht 8 Min zur Erde.','Ein Blitz ist 30.000°C heiß.'];
  if(/erzähl/.test(lc)) return facts[Math.floor(Math.random()*facts.length)];
  return 'Das habe ich nicht verstanden. Frag mich z.B. "Was steht heute an?"';
}

function buildFahrschule(){
  const w=$('fahrschule-window'); if(!w) return;
  w.dataset.title='Fahrschule'; w.dataset.icon='🚗';
  const st=store('haldo_fs_stats',{answered:0,correct:0});
  const tabs=['quiz','exam','zeichen','stats'];
  let html='<div class="fs-tabs">'+
    '<button class="fs-tab '+(fsState.currentTab==='quiz'?'active':'')+'" onclick="HalDoFS.setTab(\'quiz\')">📝 Quiz</button>'+
    '<button class="fs-tab '+(fsState.currentTab==='exam'?'active':'')+'" onclick="HalDoFS.setTab(\'exam\')">🎓 Prüfung</button>'+
    '<button class="fs-tab '+(fsState.currentTab==='zeichen'?'active':'')+'" onclick="HalDoFS.setTab(\'zeichen\')">🚦 Zeichen</button>'+
    '<button class="fs-tab '+(fsState.currentTab==='stats'?'active':'')+'" onclick="HalDoFS.setTab(\'stats\')">📊 Stats</button>'+
    '</div>';
  if(fsState.currentTab==='quiz' || fsState.currentTab==='exam'){
    const pool=fsState.currentTab==='exam'?fsState.examQuestions:FS_QUESTIONS;

      fsState.examQuestions=FS_QUESTIONS.slice().sort(()=>Math.random()-.5).slice(0,20);
      fsState.qIndex=0; fsState.score=0; fsState.answers=[];
    }
    if(fsState.qIndex>=pool.length){
      const pct=Math.round(fsState.score/fsState.qIndex*100);
      html+='<div class="fs-quiz-card" style="text-align:center">'+
        '<div style="font-size:64px;margin-bottom:12px">'+(pct>=80?'🏆':'😅')+'</div>'+
        '<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:8px">Quiz beendet!</div>'+
        '<div style="font-size:36px;font-weight:900;color:#00e5ff;margin-bottom:12px">'+fsState.score+' / '+fsState.qIndex+'</div>'+
        '<div style="font-size:14px;color:#88ccff;margin-bottom:16px">'+pct+'% richtig</div>'+
        '<button class="os-btn primary full" onclick="HalDoFS.restart()">🔄 Neue Runde</button></div>';
    } else {
      html+=fsBuildQuestion(pool[fsState.qIndex]);
    }
  } else if(fsState.currentTab==='zeichen'){
    const signs=[
      ['🛑','Stopp','Vorfahrt gewähren'],
      ['⛔','Verbot Einfahrt','Verbot'],
      ['🚫','Verbot allgemein','Verbot'],
      ['⚠️','Warnung','Warnschild'],
      ['🚸','Kinder','Warnung'],
      ['🦌','Wildwechsel','Warnung'],
      ['🚧','Baustelle','Warnung'],
      ['🛣️','Autobahn','Hinweis'],
      ['🅿️','Parkplatz','Hinweis'],
      ['⛽','Tankstelle','Hinweis'],
      ['↗️','Vorgeschrieben rechts','Vorschrift'],
      ['⬆️','Geradeaus','Vorschrift'],
      ['🔄','Kreisverkehr','Vorschrift'],
      ['30','Tempo 30','Tempolimit'],
      ['50','Tempo 50','Tempolimit'],
      ['🚦','Ampel','Vorschrift'],
      ['↔️','Begegnung','Vorschrift'],
      ['⏸️','Vorfahrt gewähren','Vorschrift'],
      ['🔀','Vorfahrtstraße','Vorschrift']

      '</div>').join('')+'</div>';
  } else {
    html+='<div class="fs-quiz-card"><div style="text-align:center">'+
      '<div style="font-size:13px;color:#88ccff;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px">📊 Deine Statistik</div>'+

window.HalDoFS={
  setTab(t){ fsState.currentTab=t; fsState.qIndex=0; fsState.score=0; buildFahrschule(); },
  answer(i){
    const pool=fsState.currentTab==='exam'?fsState.examQuestions:FS_QUESTIONS;
    const q=pool[fsState.qIndex];
    if(!q) return;
    const correct=q.k;
    const isRight=i===correct;
    document.querySelectorAll('.fs-ans').forEach((el,idx)=>{
      el.style.pointerEvents='none';
      if(idx===correct) el.classList.add('correct');
      else if(idx===i && !isRight) el.classList.add('wrong');
    });
    const fb=$('fsFb');
    if(fb){
      fb.classList.add('show', isRight?'correct':'wrong');
      fb.querySelector('.fs-feedback-title').textContent=isRight?'✅ Richtig!':'❌ Leider falsch';
      fb.querySelector('div:last-child').textContent=q.i;
    }
    $('fsNext').style.display='flex';
    if(isRight) fsState.score++;
    fsState.qIndex++;
    // Statistik
    const st=store('haldo_fs_stats',{answered:0,correct:0});
    st.answered++; if(isRight) st.correct++;
    save('haldo_fs_stats',st);
    if(navigator.vibrate) navigator.vibrate(isRight?20:[30,50,30]);
  },
  next(){ buildFahrschule(); },
  restart(){ fsState.qIndex=0; fsState.score=0; fsState.examQuestions=[]; fsState.answers=[]; buildFahrschule(); },
  rebuild(){ buildFahrschule(); }
};

  w.dataset.title='Verkehrswarnungen'; w.dataset.icon='🚨';
  const items=tfLoad().filter(t=>!t.expired).sort((a,b)=>b.created-a.created);
  const active=items.filter(t=>(Date.now()-t.created)<4*3600*1000);
  const typeGrid=Object.entries(TF_TYPES).map(([k,v])=>
    '<div class="tf-type '+(tfState.selected===k?'active':'')+'" onclick="HalDoTraffic.setType(\''+k+'\')">'+
    '<span class="tf-type-emoji">'+v.i+'</span>'+
    '<span class="tf-type-name">'+v.n+'</span></div>'
  ).join('');
  const list=active.length?active.slice(0,20).map(t=>{
    const tp=TF_TYPES[t.type]||TF_TYPES.warnung;
    const mins=Math.floor((Date.now()-t.created)/60000);
    const timeStr=mins<60?mins+' Min':Math.floor(mins/60)+' Std';
    return '<div class="tf-item">'+
      '<div class="tf-item-icon">'+tp.i+'</div>'+
      '<div class="tf-item-body">'+
      '<div class="tf-item-title">'+esc(t.title)+'</div>'+
      '<div class="tf-item-meta">'+
      '<span>⏱ '+timeStr+'</span>'+
      (t.road?'<span>🛣 '+esc(t.road)+'</span>':'')+
      (t.speed?'<span>🚦 '+t.speed+'</span>':'')+
      (t.confirms?'<span>👍 '+t.confirms+'</span>':'')+
      '</div>'+
      '<div class="tf-vote">'+
      '<button onclick="HalDoTraffic.confirm(\''+t.id+'\')">👍 Bestätigen</button>'+
      '<button onclick="HalDoTraffic.remove(\''+t.id+'\')">👎 Falsch</button>'+
      '</div></div></div>';
  }).join(''):'<div class="empty"><div class="ei">✅</div><div class="et">Keine Warnungen gerade</div></div>';
  w.innerHTML=
    '<div class="card" style="background:linear-gradient(160deg,rgba(255,120,200,.15),rgba(20,5,10,.85));border-color:rgba(255,120,200,.4)">'+
    '<div class="lbl" style="color:#ff78c8;margin-bottom:10px">⚠️ Verkehrswarnung melden</div>'+
    '<div class="tf-type-grid">'+typeGrid+'</div>'+
    '<input class="os-input" id="tfTitle" placeholder="z.B. Blitzer A3 Köln" style="margin-bottom:8px">'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
    '<input class="os-input" id="tfRoad" placeholder="Straße (A3, B8...)">'+
    '<input class="os-input" id="tfSpeed" type="number" placeholder="km/h (optional)">'+
    '</div>'+
    '<button class="os-btn primary full" style="background:linear-gradient(135deg,#ff78c8,#b478ff);border-color:#fff;color:#fff" onclick="HalDoTraffic.add()">📢 Warnung melden</button>'+
    '</div>'+
    '<div class="lbl" style="margin:14px 0 8px">'+active.length+' aktive Meldungen</div>'+
    list;
}

window.HalDoTraffic={
  setType(t){ tfState.selected=t; buildTraffic(); },
  add(){
    const title=$('tfTitle').value.trim();
    if(!title){ if(window.showToast) showToast('⚠️ Titel eingeben','error'); return; }
    const items=tfLoad();
    items.unshift({
      id:uid('tf_'), type:tfState.selected, title,
      road:$('tfRoad').value.trim(),
      speed:parseInt($('tfSpeed').value)||null,
      confirms:0, created:Date.now()
    });
    tfSave(items.slice(0,200));
    if(navigator.vibrate) navigator.vibrate([10,30,10]);
    if(window.showToast) showToast('📢 Meldung eingetragen','success');
    buildTraffic();
  },
  confirm(id){
    const items=tfLoad();
    const x=items.find(t=>t.id===id);
    if(x){ x.confirms=(x.confirms||0)+1; tfSave(items); }
    if(window.showToast) showToast('👍 Danke!','success');
    buildTraffic();
  },
  remove(id){
    if(!confirm('Meldung entfernen?')) return;
    tfSave(tfLoad().filter(t=>t.id!==id));
    buildTraffic();
  }
};

// 4. HEALTH / GESUNDHEITSAKTE
// ═══════════════════════════════════════════════════════════
function hlLoad(){ return store('haldo_health_v1',{vitals:[],appointments:[],meds:[],notes:''}); }
function hlSave(v){ save('haldo_health_v1',v); }

let hlState={tab:'vitals'};

function buildHealth(){
  const w=$('health-window'); if(!w) return;
  w.dataset.title='Gesundheit'; w.dataset.icon='❤️';
  const d=hlLoad();
  const tabsHtml='<div class="hl-tabs">'+
    ['vitals','appointments','meds','notes'].map(t=>{
      const labels={vitals:'📊 Vitalwerte',appointments:'📅 Arzttermine',meds:'💊 Medikamente',notes:'📝 Notizen'};
      return '<button class="hl-tab '+(hlState.tab===t?'active':'')+'" onclick="HalDoHealth.setTab(\''+t+'\')">'+labels[t]+'</button>';
    }).join('')+'</div>';
  let body='';
  if(hlState.tab==='vitals'){
    const v=d.vitals;
    body='<div class="hl-card"><div class="lbl" style="margin-bottom:10px">Neuer Wert</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px">'+
      '<select class="os-select" id="hvType"><option value="bd">Blutdruck</option><option value="hr">Puls</option><option value="temp">Temperatur</option><option value="weight">Gewicht</option></select>'+
      '<input class="os-input" id="hvVal" placeholder="Wert (z.B. 120/80)">'+
      '<button class="os-btn primary" onclick="HalDoHealth.addVital()">✚</button>'+
      '</div></div>'+
      (v.length?'<div class="hl-vital">'+v.slice(0,12).map(x=>'<div class="hl-vital-item">'+
        '<div class="hl-vital-num" style="font-size:16px">'+esc(x.val)+'</div>'+
        '<div class="hl-vital-lbl">'+esc(x.type)+'</div></div>').join('')+'</div>':'<div class="empty"><div class="ei">📊</div><div class="et">Noch keine Werte</div></div>');
  } else if(hlState.tab==='appointments'){
    const a=d.appointments;
    body='<div class="hl-card">'+
      '<input class="os-input" id="haTitle" placeholder="Arzt / Termin" style="margin-bottom:8px">'+
      '<input class="os-input" id="haDate" type="date" style="margin-bottom:8px">'+
      '<input class="os-input" id="haTime" type="time" value="09:00" style="margin-bottom:8px">'+
      '<button class="os-btn primary full" onclick="HalDoHealth.addAppt()">✚ Termin speichern</button></div>'+
      (a.length?a.map(x=>'<div class="hl-card" style="display:flex;justify-content:space-between;align-items:center">'+
        '<div><div style="font-size:13px;font-weight:800;color:#fff">'+esc(x.title)+'</div>'+
        '<div style="font-size:11px;color:#ffaabb;margin-top:3px">📅 '+x.date+' · 🕐 '+x.time+'</div></div>'+
        '<button class="os-btn danger" style="padding:6px 10px;font-size:11px" onclick="HalDoHealth.delAppt(\''+x.id+'\')">✕</button></div>').join(''):'<div class="empty"><div class="ei">📅</div><div class="et">Keine Termine</div></div>');
  } else if(hlState.tab==='meds'){
    const m=d.meds;
    body='<div class="hl-card">'+
      '<input class="os-input" id="hmName" placeholder="Medikament" style="margin-bottom:8px">'+
      '<input class="os-input" id="hmDose" placeholder="Dosierung (z.B. 1x täglich)" style="margin-bottom:8px">'+
      '<button class="os-btn primary full" onclick="HalDoHealth.addMed()">✚ Medikament speichern</button></div>'+
      (m.length?m.map(x=>'<div class="hl-card" style="display:flex;justify-content:space-between;align-items:center">'+
        '<div><div style="font-size:13px;font-weight:800;color:#fff">💊 '+esc(x.name)+'</div>'+
        '<div style="font-size:11px;color:#ffaabb;margin-top:3px">'+esc(x.dose)+'</div></div>'+
        '<button class="os-btn danger" style="padding:6px 10px;font-size:11px" onclick="HalDoHealth.delMed(\''+x.id+'\')">✕</button></div>').join(''):'<div class="empty"><div class="ei">💊</div><div class="et">Keine Medikamente</div></div>');
  } else {
    body='<div class="hl-card">'+
      '<div class="lbl" style="margin-bottom:8px">📝 Persönliche Notizen</div>'+
      '<textarea class="os-textarea" id="hnText" placeholder="Allergien, Vorerkrankungen..." style="min-height:150px;margin-bottom:8px">'+esc(d.notes||'')+'</textarea>'+
      '<button class="os-btn primary full" onclick="HalDoHealth.saveNotes()">💾 Speichern</button></div>';
  }
  w.innerHTML=tabsHtml+body;
}

window.HalDoHealth={
  setTab(t){ hlState.tab=t; buildHealth(); },
  addVital(){
    const type=$('hvType').value, val=$('hvVal').value.trim();
    if(!val) return;
    const d=hlLoad();
    d.vitals.unshift({type, val, ts:Date.now()});
    d.vitals=d.vitals.slice(0,100);
    hlSave(d); buildHealth();
    if(window.showToast) showToast('📊 Wert gespeichert','success');
  },
  addAppt(){
    const t=$('haTitle').value.trim(); if(!t) return;
    const d=hlLoad();
    d.appointments.unshift({id:uid('a_'), title:t, date:$('haDate').value||todayK(), time:$('haTime').value});
    hlSave(d); buildHealth();
    if(window.showToast) showToast('📅 Termin gespeichert','success');
  },
  delAppt(id){ const d=hlLoad(); d.appointments=d.appointments.filter(a=>a.id!==id); hlSave(d); buildHealth(); },
  addMed(){
    const n=$('hmName').value.trim(); if(!n) return;
    const d=hlLoad();
    d.meds.unshift({id:uid('m_'), name:n, dose:$('hmDose').value});
    hlSave(d); buildHealth();
    if(window.showToast) showToast('💊 Medikament gespeichert','success');
  },
  delMed(id){ const d=hlLoad(); d.meds=d.meds.filter(m=>m.id!==id); hlSave(d); buildHealth(); },
  saveNotes(){
    const d=hlLoad();
    d.notes=$('hnText').value;
    hlSave(d);
    if(window.showToast) showToast('💾 Notizen gespeichert','success');
  }
};

function initV126(){
  // Map-Bridge für Registry
  if(window.HalDoRegistry){
    const origOpen=window.HalDoRegistry.openApp;
    window.HalDoRegistry.openApp=function(id){
      if(id==='fahrschule'||id==='theoriepruefung'){

        setTimeout(()=>window.HalDoUI?.closeAllPanels(),100);

        buildTraffic();
        setTimeout(()=>window.HalDoUI?.closeAllPanels(),100);
        return;
      }
      if(id==='health'){
        if(typeof openWin==='function') openWin('health-window');
        buildHealth();
        setTimeout(()=>window.HalDoUI?.closeAllPanels(),100);
        return;
      }
      if(id==='haldo-ai'||id==='ai-chat'){

      }
      return origOpen.apply(this, arguments);
    };

}

<script>
(function(){
"use strict";
if(window.__v127) return;
window.__v127 = true;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const store = (k,def) => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def }catch(e){ return def } };
const save = (k,v) => { try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} };
const todayK = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') };

// ═══════════════════════════════════════════════════════════
// 1. SLEEP TRACKER
// ═══════════════════════════════════════════════════════════
window.HalDoSleep={
  key:'haldo_sleep_v1',
  all(){ return store(this.key,[]); },
  add(bed, wake, quality, note){
    const l=this.all();
    const d=todayK();
    // Berechne Dauer
    const [bh,bm]=bed.split(':').map(Number);
    const [wh,wm]=wake.split(':').map(Number);
    let bedMin=bh*60+bm, wakeMin=wh*60+wm;
    if(wakeMin<=bedMin) wakeMin+=1440;
    const dur=(wakeMin-bedMin)/60;
    const idx=l.findIndex(x=>x.date===d);
    const entry={date:d, bed, wake, dur, quality, note:note||''};
    if(idx>=0) l[idx]=entry; else l.unshift(entry);
    save(this.key, l.slice(0,180));
    return entry;
  },
  remove(i){ const l=this.all(); l.splice(i,1); save(this.key,l); },
  avg(){ const l=this.all().slice(0,7); return l.length ? l.reduce((s,e)=>s+e.dur,0)/l.length : 0; },
  today(){ return this.all().find(e=>e.date===todayK()); }
};

let slState={quality:3};

function buildSleep(){
  const w=$('sleep-window'); if(!w) return;
  w.dataset.title='Schlaf'; w.dataset.icon='😴';
  const l=HalDoSleep.all();
  const avg=HalDoSleep.avg();
  const today=HalDoSleep.today();
  const qEmojis=['😫','😕','😐','🙂','😴'];
  const qGrid=qEmojis.map((e,i)=>
    '<button class="os-btn '+(slState.quality===i+1?'primary':'')+'" style="flex:1;padding:14px 6px;font-size:22px" onclick="HalDoSleepApp.setQ('+(i+1)+')">'+e+'</button>'
  ).join('');
  const list=l.slice(0,15).map((e,i)=>{
    const dt=new Date(e.date+'T12:00:00');
    return '<div class="hl-card" style="display:flex;gap:10px;align-items:center">'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:12px;color:#88ccff;font-weight:800;text-transform:uppercase;letter-spacing:1px">'+dt.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'})+'</div>'+
      '<div style="font-size:13px;color:#fff;font-weight:700;margin-top:2px">'+e.bed+' → '+e.wake+' · '+qEmojis[e.quality-1]+'</div>'+
      (e.note?'<div style="font-size:11px;color:#aaddff;margin-top:3px">'+esc(e.note.slice(0,60))+'</div>':'')+
      '</div>'+
      '<div style="font-size:22px;font-weight:900;color:#6c78ff;font-family:monospace">'+e.dur.toFixed(1)+'h</div>'+
      '<button class="os-btn danger" style="padding:6px 8px;font-size:10px" onclick="HalDoSleep.remove('+i+');HalDoUI.rebuild(\'sleep-window\')">✕</button>'+
      '</div>';
  }).join('');
  w.innerHTML=
    '<div class="card" style="text-align:center">'+
    '<div class="big" style="color:#6c78ff">'+avg.toFixed(1)+'<span style="font-size:18px;color:#a8b8ff">h</span></div>'+
    '<div class="lbl">Ø Letzte 7 Nächte</div></div>'+
    '<div class="card">'+
    '<div class="lbl" style="margin-bottom:8px">'+(today?'✏️ Heute bearbeiten':'➕ Neue Nacht eintragen')+'</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
    '<div><div class="lbl" style="font-size:9px">Eingeschlafen</div><input class="os-input" id="slBed" type="time" value="'+(today?today.bed:'23:00')+'"></div>'+
    '<div><div class="lbl" style="font-size:9px">Aufgewacht</div><input class="os-input" id="slWake" type="time" value="'+(today?today.wake:'07:00')+'"></div>'+
    '</div>'+
    '<div class="lbl" style="margin-bottom:6px">Qualität</div>'+
    '<div style="display:flex;gap:6px;margin-bottom:10px">'+qGrid+'</div>'+
    '<textarea class="os-textarea" id="slNote" placeholder="Notiz (optional)..." style="min-height:60px;margin-bottom:8px">'+(today?esc(today.note||''):'')+'</textarea>'+
    '<button class="os-btn primary full" onclick="HalDoSleepApp.save()">💾 Speichern</button>'+
    '</div>'+
    (l.length?'<div class="lbl" style="margin:14px 0 8px">📜 Verlauf ('+l.length+')</div>'+list:'');
}

window.HalDoSleepApp={
  setQ(q){ slState.quality=q; buildSleep(); },
  save(){
    const bed=$('slBed').value, wake=$('slWake').value, note=$('slNote').value.trim();
    if(!bed||!wake) return;
    const e=HalDoSleep.add(bed, wake, slState.quality, note);
    if(window.showToast) showToast('😴 Gespeichert: '+e.dur.toFixed(1)+'h','success');
    if(navigator.vibrate) navigator.vibrate(15);
    if(window.HalDoMemory) HalDoMemory.remember('😴 Schlaf: '+e.dur.toFixed(1)+'h', 'Qualität: '+e.quality+'/5', 'health', ['sleep']);
    buildSleep();
  }
};

// ═══════════════════════════════════════════════════════════
// 2. MOOD TRACKER
// ═══════════════════════════════════════════════════════════
window.HalDoMood={
  key:'haldo_mood_v1',
  all(){ return store(this.key,[]); },
  save(value, note){
    const l=this.all();
    const d=todayK();
    const idx=l.findIndex(x=>x.date===d);
    const entry={date:d, value, note:note||''};
    if(idx>=0) l[idx]=entry; else l.unshift(entry);
    save(this.key, l.slice(0,365));
  },
  today(){ return this.all().find(x=>x.date===todayK()); },
  avg(){ const l=this.all().slice(0,30); return l.length ? l.reduce((s,e)=>s+e.value,0)/l.length : 0; }
};

const MOODS=[
  {v:1,e:'😢',n:'Traurig',c:'#6699ff'},
  {v:2,e:'😕',n:'Niedrig',c:'#88aadd'},
  {v:3,e:'😐',n:'Neutral',c:'#ffc864'},
  {v:4,e:'🙂',n:'Gut',c:'#88dd88'},
  {v:5,e:'😄',n:'Super',c:'#ff8838'}
];

function buildMood(){
  const w=$('mood-window'); if(!w) return;
  w.dataset.title='Stimmung'; w.dataset.icon='😊';
  const today=HalDoMood.today();
  const cur=today?today.value:3;
  const grid=MOODS.map(m=>
    '<div style="text-align:center;padding:14px 6px;border-radius:14px;background:rgba(0,40,80,.4);border:2px solid '+(cur===m.v?m.c:'rgba(0,229,255,.15)')+';cursor:pointer;'+(cur===m.v?'transform:scale(1.08)':'')+'" onclick="HalDoMoodApp.setMood('+m.v+')">'+
    '<div style="font-size:34px">'+m.e+'</div>'+
    '<div style="font-size:9px;color:'+m.c+';font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:4px">'+m.n+'</div>'+
    '</div>'
  ).join('');
  // Chart 14 Tage
  const days=[];
  for(let i=13;i>=0;i--){
    const dt=new Date(); dt.setDate(dt.getDate()-i);
    const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const e=HalDoMood.all().find(x=>x.date===k);
    days.push({d:dt, v:e?e.value:0});
  }
  const chart=days.map(d=>{
    const m=MOODS.find(x=>x.v===d.v);
    const h=d.v?d.v*18:4;
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:14px">'+
    '<div style="width:100%;height:'+h+'px;background:'+(m?m.c:'rgba(0,229,255,.1)')+';border-radius:3px;'+(m?'box-shadow:0 0 8px '+m.c:'')+'"></div>'+
    '<div style="font-size:8px;color:#88ccff;font-weight:700">'+d.d.getDate()+'</div>'+
    '</div>';
  }).join('');
  // Verlauf
  const recent=HalDoMood.all().slice(0,10).map((e,i)=>{
    const m=MOODS.find(x=>x.v===e.value)||MOODS[2];
    const dt=new Date(e.date+'T12:00:00');
    return '<div class="hl-card" style="display:flex;gap:10px;align-items:center;padding:10px">'+
      '<div style="font-size:28px">'+m.e+'</div>'+
      '<div style="flex:1;min-width:0">'+
      '<div style="font-size:12px;color:#fff;font-weight:700">'+dt.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'})+' · '+m.n+'</div>'+
      (e.note?'<div style="font-size:11px;color:#aaddff;margin-top:2px">'+esc(e.note.slice(0,60))+'</div>':'')+
      '</div></div>';
  }).join('');
  w.innerHTML=

window.HalDoWorkout={
  key:'haldo_workout_v1',
  all(){ return store(this.key,{}); },
  toggle(exId){
    const d=this.all();
    const t=todayK();
    if(!d[t]) d[t]=[];
    const i=d[t].indexOf(exId);
    if(i>=0) d[t].splice(i,1);
    else d[t].push(exId);
    save(this.key,d);
  },
  isDoneToday(exId){ const d=this.all(); return (d[todayK()]||[]).includes(exId); },
  todayCount(){ return (this.all()[todayK()]||[]).length; },
  streak(){
    const d=this.all();
    let s=0; const now=new Date();
    for(let i=0;i<365;i++){
      const dt=new Date(now); dt.setDate(dt.getDate()-i);
      const k=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      if(d[k]&&d[k].length) s++;
      else if(i>0) break;
    }
    return s;
  }
};

const BREATH_PATTERNS={
  '478':{n:'4-7-8', desc:'Beruhigend', phases:[['Einatmen',4],['Halten',7],['Ausatmen',8]]},
  'box':{n:'Box', desc:'Fokus', phases:[['Einatmen',4],['Halten',4],['Ausatmen',4],['Halten',4]]},
  'calm':{n:'Calm', desc:'Sanft', phases:[['Einatmen',4],['Ausatmen',6]]},
  'sleep':{n:'Sleep', desc:'Einschlafen', phases:[['Einatmen',4],['Halten',7],['Ausatmen',8],['Halten',2]]}
};

let brState={pattern:'478', running:false, phaseIdx:0, count:0, interval:null, cycles:0};

function buildBreathing(){
  const w=$('breathing-window'); if(!w) return;
  w.dataset.title='Atmung'; w.dataset.icon='🧘';
  const p=BREATH_PATTERNS[brState.pattern];
  const phase=p.phases[brState.phaseIdx];
  const scale=phase[0]==='Einatmen'?'scale(1.25)':(phase[0]==='Ausatmen'?'scale(0.85)':'scale(1)');
  const buttons=Object.entries(BREATH_PATTERNS).map(([k,v])=>
    '<button class="os-btn '+(brState.pattern===k?'primary':'')+'" style="padding:10px 14px;font-size:12px;font-weight:800" onclick="HalDoBreathApp.setPattern(\''+k+'\')">'+v.n+'</button>'
  ).join('');
  w.innerHTML=
    '<div style="text-align:center;padding:20px 0">'+
    '<div id="brCircle" style="width:220px;height:220px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,rgba(180,120,255,.5),rgba(180,120,255,.15));border:3px solid rgba(180,120,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 4s ease-in-out;box-shadow:0 0 60px rgba(180,120,255,.5),inset 0 0 40px rgba(180,120,255,.3);transform:'+scale+'">'+
    '<div id="brPhase" style="font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(180,120,255,.7)">'+(brState.running?phase[0]:'Bereit')+'</div>'+
    '<div id="brCount" style="font-size:44px;font-weight:200;color:#fff;font-family:monospace">'+(brState.running?brState.count:'–')+'</div>'+
    '</div>'+
    '<div style="font-size:12px;color:#d4a8ff;margin-bottom:16px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800">'+p.n+' · '+p.desc+'</div>'+
    '<button class="os-btn primary" style="padding:16px 40px;font-size:16px" onclick="HalDoBreathApp.toggle()">'+(brState.running?'⏸ Stop':'▶ Start')+'</button>'+
    '</div>'+
    '<div class="card"><div class="lbl" style="margin-bottom:10px">🎯 Muster wählen</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap">'+buttons+'</div></div>'+
    (brState.cycles?'<div class="card" style="text-align:center"><div class="big">'+brState.cycles+'</div><div class="lbl">Zyklen absolviert</div></div>':'');
}

window.HalDoBreathApp={
  setPattern(p){
    if(brState.interval){ clearInterval(brState.interval); brState.interval=null; }
    brState.pattern=p; brState.running=false; brState.phaseIdx=0; brState.count=0;
    buildBreathing();
  },
  toggle(){
    if(brState.running){
      brState.running=false;
      if(brState.interval) clearInterval(brState.interval);
      brState.interval=null;
      buildBreathing();
    } else {
      brState.running=true;
      brState.phaseIdx=0;
      brState.count=BREATH_PATTERNS[brState.pattern].phases[0][1];
      brState.cycles=0;
      brState.interval=setInterval(()=>{
        brState.count--;
        if(brState.count<=0){
          brState.phaseIdx=(brState.phaseIdx+1)%BREATH_PATTERNS[brState.pattern].phases.length;
          if(brState.phaseIdx===0){
            brState.cycles++;
            if(navigator.vibrate) navigator.vibrate(10);
          }
          brState.count=BREATH_PATTERNS[brState.pattern].phases[brState.phaseIdx][1];
        }
        buildBreathing();
      },1000);
      buildBreathing();
      if(navigator.vibrate) navigator.vibrate([10,30,10]);
    }
  }
};
