<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<style>
:root{--bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--border:#374151;--text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;--gold:#fbbf24;--danger:#ef4444;--success:#10b981;--warn:#f59e0b;--font:'Segoe UI',system-ui,sans-serif;--font-size:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#000;user-select:none;}
body{font-family:var(--font);color:var(--text);font-size:var(--font-size);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
#cosmos-canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;}
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);transition:opacity .5s;}
#welcome.hide{opacity:0;pointer-events:none;}
#welcome .logo-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 30px rgba(6,182,212,.9));animation:floatLogo 3s ease-in-out infinite;}
@keyframes floatLogo{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
#welcome h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(251,191,36,.8);}
#welcome h2{font-size:clamp(14px,2vw,20px);color:#e5e7eb;font-weight:400;line-height:1.6;}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;}
#welcome .presented b{color:#fbbf24;}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);color:#fff;}
#welcome .enter-btn:hover{transform:scale(1.05);}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(17,24,39,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 12px;gap:10px;z-index:9997;}
#taskbar.show{display:flex;}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:10px 20px;border-radius:10px;font-weight:bold;display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer;font-size:14px;box-shadow:0 0 15px rgba(6,182,212,.4);}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow-x:auto;}
.taskbar-app{background:rgba(55,65,81,.5);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap;}
.taskbar-app:hover{border-color:var(--accent);}
#sys-clock{color:var(--dim);font-size:13px;font-weight:600;}
#start-menu{position:fixed;bottom:60px;left:10px;width:720px;max-height:85vh;background:rgba(17,24,39,.98);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;z-index:9998;box-shadow:0 -10px 40px rgba(0,0,0,.8);}
#start-menu.show{display:flex;}
.sm-drag-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--accent);background:rgba(0,0,0,.2);}
.sm-tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);}
.sm-tab{flex:1;padding:10px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;}
.sm-tab.active{color:var(--accent);background:rgba(6,182,212,.15);border-bottom:2px solid var(--accent);}
.sm-panel{flex:1;overflow-y:auto;padding:12px;display:none;}
.sm-panel.active{display:block;}
.sm-search{padding:8px 10px 10px;}
.sm-search input{background:rgba(0,0,0,.3);padding:8px 12px;border-radius:6px;}
.sm-apps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent;background:rgba(55,65,81,.2);}
.sm-app-card:hover{background:rgba(55,65,81,.6);border-color:var(--accent);transform:translateY(-2px);}
.sm-app-card .ico{font-size:22px;margin-bottom:4px;pointer-events:none;}
.sm-app-card .nm{font-size:9px;text-align:center;line-height:1.2;pointer-events:none;}
.settings-layout{display:flex;height:100%;min-height:480px;}
.settings-nav{width:190px;flex:none;padding:8px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:rgba(0,0,0,.3);}
.settings-nav-item{text-align:left;padding:9px 10px;font-size:12px;border-radius:6px;color:#a0c8e0;cursor:pointer;background:transparent;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.settings-nav-item:hover{background:rgba(55,65,81,.5);color:#fff;}
.settings-nav-item.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.settings-content{flex:1;padding:16px;overflow-y:auto;}
.settings-content h3{color:var(--accent);font-size:15px;margin-bottom:12px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(55,65,81,.5);gap:12px;}
.settings-row:last-child{border:none;}
.settings-row .lbl{font-size:13px;font-weight:600;}
.settings-row .sub{font-size:11px;color:var(--dim);margin-top:2px;}
.settings-row .ctrl{flex-shrink:0;min-width:160px;max-width:280px;}
.toggle{position:relative;width:44px;height:24px;background:rgba(55,65,81,.8);border-radius:12px;cursor:pointer;transition:background .2s;display:inline-block;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}
.window{position:fixed;background:rgba(10,14,26,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.7);min-width:380px;min-height:280px;}
.window.minimized{display:none;}
.window-header{padding:12px 16px;background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;}
.window-title{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:10px;font-size:13px;}
.window-controls{display:flex;gap:6px;}
.win-btn{width:28px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);font-size:14px;}
.win-btn:hover{background:rgba(255,255,255,.2);}
.win-btn.close:hover{background:var(--danger);}
.window-body{flex:1;overflow:hidden;display:flex;}
#app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%,rgba(6,182,212,.2) 0%,rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px);}
#app-splash.show{display:flex;}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.app-sidebar{width:180px;flex:none;padding:10px 8px;background:rgba(0,10,20,.6);border-right:1px solid rgba(55,65,81,.5);display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.side-btn{text-align:left;padding:9px 12px;font-size:12px;background:transparent;border:1px solid transparent;color:#a0c8e0;cursor:pointer;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-btn:hover{background:rgba(55,65,81,.5);color:#fff;}
.side-btn.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.side-btn.speak-btn{margin-top:auto;color:var(--accent);}
.app-content{flex:1;padding:18px;overflow-y:auto;min-width:0;}
.app-content h3{margin-bottom:12px;color:var(--accent);font-size:16px;}
.app-content h4{margin:14px 0 8px;color:var(--accent);font-size:13px;}
.app-content input,.app-content select,.app-content textarea{margin-bottom:8px;}
.app-content button{padding:9px 16px;margin:4px 4px 4px 0;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.app-content button:hover{background:var(--accent2);}
.app-content button.danger{background:var(--danger);border-color:var(--danger);}
.app-content button.ghost{background:transparent;color:var(--text);border-color:var(--border);}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:6px;}
.list-row:hover{background:rgba(55,65,81,.6);border-color:var(--accent);}
.list-row .meta{color:var(--dim);font-size:11px;margin-left:auto;}
.muted{color:var(--dim);}
.qt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.qt-panel{background:rgba(31,41,55,.5);padding:14px;border-radius:10px;border:1px solid var(--border);}
.qt-panel h4{margin-bottom:8px;font-size:12px;color:var(--accent);}
.chat-box{display:flex;flex-direction:column;height:100%;}
.chat-log{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid var(--border);margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;max-width:85%;line-height:1.5;}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
.msg.ai{align-self:flex-start;background:rgba(31,41,55,.9);border:1px solid var(--border);}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;margin:0;}
.chat-input button{margin:0;}
#click-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(6,182,212,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:99;pointer-events:none;transition:opacity .5s;}
.holo-map{position:relative;width:100%;height:420px;background:radial-gradient(circle at center,#0a1a2e,#000);border-radius:12px;overflow:hidden;border:1px solid var(--accent);}
.tacho-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px;}
.tacho{position:relative;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle at center,#1a1a2e 0%,#0a0a15 100%);border:6px solid var(--accent);display:flex;align-items:center;justify-content:center;}
.tacho-needle{position:absolute;width:6px;height:160px;background:linear-gradient(to top,#ef4444,transparent);top:40px;left:50%;transform-origin:bottom center;transform:translateX(-50%) rotate(0deg);transition:transform .1s;z-index:2;border-radius:3px;}
.tacho-center{position:absolute;top:50%;left:50%;width:30px;height:30px;background:var(--accent);border-radius:50%;transform:translate(-50%,-50%);z-index:3;}
.tacho-inner{position:absolute;bottom:100px;display:flex;flex-direction:column;align-items:center;z-index:1;}
.tacho-speed{font-size:56px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--accent);}
.tacho-unit{font-size:14px;color:var(--dim);letter-spacing:2px;}
.tacho-header{display:flex;align-items:center;gap:16px;padding:12px 16px;background:rgba(0,0,0,.5);border-radius:12px;border:1px solid rgba(55,65,81,.5);width:100%;max-width:480px;margin-bottom:12px;}
.tacho-header .header-info{flex:1;}
.tacho-header .header-title{font-size:11px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;}
.tacho-header .header-limit{font-size:24px;font-weight:900;color:#fff;}
.traffic-sign-display{position:relative;width:65px;height:65px;border-radius:50%;background:#fff;border:7px solid #ef4444;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.traffic-sign-display .num{font-size:26px;font-weight:900;color:#000;line-height:1;}
.traffic-sign-display.unlimited{border-color:#444;}
.traffic-sign-display.exceeded{animation:signPulse .5s infinite;border-color:#dc2626;}
@keyframes signPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.speed-limits{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:12px;width:100%;}
.speed-btn{background:rgba(55,65,81,.6);border:2px solid var(--border);color:#fff;border-radius:8px;padding:10px 4px;cursor:pointer;text-align:center;font-size:13px;font-weight:700;}
.speed-btn:hover{border-color:var(--accent);}
.speed-btn.active{border-color:var(--accent);background:rgba(6,182,212,.3);}
.speed-btn small{display:block;font-size:9px;color:var(--dim);font-weight:400;margin-top:2px;}
.danger-log{max-height:240px;overflow-y:auto;background:rgba(0,0,0,.4);border-radius:10px;border:1px solid var(--border);padding:10px;margin-top:12px;}
.danger-entry{display:flex;gap:8px;padding:8px;border-bottom:1px solid rgba(55,65,81,.3);font-size:12px;align-items:center;}
.danger-entry:last-child{border-bottom:none;}
.danger-entry .icon{font-size:20px;}
.danger-entry .info{flex:1;}
.danger-entry .time{color:var(--dim);font-size:10px;}
.klassen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:12px;}
.klasse-btn{background:rgba(55,65,81,.5);border:2px solid var(--border);border-radius:10px;padding:14px 8px;cursor:pointer;text-align:center;}
.klasse-btn:hover{border-color:var(--accent);}
.klasse-btn.active{border-color:var(--accent);background:rgba(6,182,212,.25);}
.klasse-btn .kl-ico{font-size:26px;margin-bottom:4px;}
.klasse-btn .kl-code{font-size:18px;font-weight:900;color:var(--accent);}
.klasse-btn .kl-desc{font-size:10px;color:var(--dim);margin-top:2px;}
.simulator{background:radial-gradient(circle at center,#0a2a3a,#000);border-radius:12px;padding:20px;text-align:center;margin-top:12px;}
.sim-question{font-size:18px;margin:16px 0;line-height:1.5;color:#fff;}
.sim-answers{display:flex;flex-direction:column;gap:10px;max-width:500px;margin:0 auto;}
.sim-answer{background:rgba(55,65,81,.6);border:2px solid var(--border);color:#fff;padding:14px 18px;border-radius:10px;text-align:left;font-size:14px;cursor:pointer;}
.sim-answer:hover{border-color:var(--accent);}
.sim-answer.correct{border-color:#10b981;background:rgba(16,185,129,.25);}
.sim-answer.wrong{border-color:#ef4444;background:rgba(239,68,68,.25);}
.arrow-colors{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.arrow-color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.2);}
.arrow-color-swatch.active{border-color:#fff;box-shadow:0 0 12px currentColor;}
.cat-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;}
.cat-table th{text-align:left;padding:8px 6px;color:var(--accent);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.cat-table td{padding:6px;border-bottom:1px solid rgba(55,65,81,.3);vertical-align:middle;}
.cat-table select{padding:5px 8px;font-size:11px;margin:0;min-width:110px;}
.cat-table .cat-label{display:flex;align-items:center;gap:6px;font-weight:600;}
.cat-table .cat-label .ico{font-size:16px;}
.live-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(16,185,129,.3);color:#10b981;margin-left:8px;}
.live-badge.off{background:rgba(107,114,128,.3);color:#9ca3af;}
.traffic-event{position:absolute;font-size:28px;filter:drop-shadow(0 0 8px currentColor);pointer-events:none;z-index:5;}
/* Mail */
.mail-layout{display:flex;height:100%;width:100%;}
.mail-list-panel{width:320px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(0,10,20,.4);}
.mail-toolbar{padding:10px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;}
.mail-toolbar button{padding:6px 10px;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;border:none;}
.mail-toolbar button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.mail-search{padding:8px 10px;}
.mail-search input{font-size:12px;padding:8px;background:rgba(0,0,0,.3);}
.mail-folders{padding:6px 0;border-bottom:1px solid var(--border);}
.mail-folder{padding:8px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#a0c8e0;}
.mail-folder:hover{background:rgba(55,65,81,.5);}
.mail-folder.active{background:rgba(6,182,212,.2);color:#fff;border-left:3px solid var(--accent);}
.mail-folder .count{margin-left:auto;font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:10px;}
.mail-items{flex:1;overflow-y:auto;}
.mail-item{padding:10px 14px;border-bottom:1px solid rgba(55,65,81,.3);cursor:pointer;font-size:12px;}
.mail-item:hover{background:rgba(55,65,81,.4);}
.mail-item.active{background:rgba(6,182,212,.15);border-left:3px solid var(--accent);}
.mail-item.unread{font-weight:700;}
.mail-item .from{color:var(--accent);font-size:11px;margin-bottom:2px;}
.mail-item .subj{color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mail-item .preview{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mail-item .time{color:var(--dim);font-size:10px;float:right;}
.mail-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.mail-detail-header{padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);}
.mail-detail-header h2{font-size:18px;color:#fff;margin-bottom:8px;}
.mail-detail-header .meta{font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;}
.mail-detail-body{flex:1;overflow-y:auto;padding:18px;line-height:1.6;font-size:14px;white-space:pre-wrap;}
.mail-detail-actions{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;}
.mail-compose{padding:20px;flex:1;overflow-y:auto;}
.mail-compose .field{margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.mail-compose .field label{width:80px;font-size:12px;color:var(--dim);flex-shrink:0;}
.mail-compose textarea{min-height:200px;font-family:inherit;resize:vertical;}
.mail-ai-bar{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(59,130,246,.15));border:1px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap;}
.mail-ai-bar button{padding:5px 10px;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;border:none;}
/* Musik */
.music-layout{display:flex;height:100%;flex-direction:column;}
.music-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);flex-wrap:wrap;}
.music-tab{padding:8px 14px;font-size:12px;border-radius:6px;cursor:pointer;color:#a0c8e0;border:1px solid transparent;}
.music-tab:hover{background:rgba(55,65,81,.5);color:#fff;}
.music-tab.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.music-content{flex:1;overflow-y:auto;padding:18px;}
.music-player{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(168,85,247,.15));border:1px solid var(--accent);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:16px;}
.music-player .cover{width:70px;height:70px;border-radius:8px;background:linear-gradient(135deg,#06b6d4,#a855f7);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.music-player .info{flex:1;}
.music-player .info .title{font-weight:700;font-size:14px;}
.music-player .info .artist{color:var(--dim);font-size:12px;margin-top:2px;}
.music-player .controls{display:flex;gap:8px;}
.music-player .controls button{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;border:none;}
.music-gen-form{background:rgba(31,41,55,.5);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.music-gen-form h4{color:var(--accent);margin-bottom:10px;font-size:13px;}

/* ==================== TTS ==================== */
let allVoices=[];
function loadVoices(){if(!('speechSynthesis'in window))return;allVoices=speechSynthesis.getVoices();}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function speak(text,voiceType='default',langCode=null,specificVoiceName=null){
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang=langCode||LANGCODES[currentLang]||'de-DE';
  u.rate=parseFloat(localStorage.getItem('haldo_voice_rate')||1);
  u.pitch=parseFloat(localStorage.getItem('haldo_voice_pitch')||1);
  if(!allVoices.length)allVoices=speechSynthesis.getVoices();
  let sv=null;
  if(specificVoiceName)sv=allVoices.find(v=>v.name===specificVoiceName);
  else if(voiceType==='male')sv=allVoices.find(v=>/male|mann|hans|stefan|david|mark/i.test(v.name));
  else if(voiceType==='female')sv=allVoices.find(v=>/female|frau|anna|marlene|zira|samantha|hedda|google/i.test(v.name));
  if(sv)u.voice=sv;
  speechSynthesis.speak(u);
}

/* ==================== SOUNDS ==================== */
function playGlassSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(1200,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(1800,ctx.currentTime+.1);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.5);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1.5);}catch(e){}}
function playAlarm(type='beep',duration=3){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();const master=ctx.createGain();master.gain.value=.3;master.connect(ctx.destination);
    const now=ctx.currentTime;const stopAt=now+duration;
    function tone(freq,wave,start,dur,vol=.2){const o=ctx.createOscillator();const g=ctx.createGain();o.type=wave;o.frequency.value=freq;o.connect(g);g.connect(master);g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.001,start+dur);o.start(start);o.stop(start+dur);}
    function pulse(freq,wave,count,vol=.2){const interval=duration/count;for(let i=0;i<count;i++)tone(freq,wave,now+i*interval,interval*.7,vol);}
    switch(type){
      case 'siren':{const o=ctx.createOscillator();o.type='sawtooth';const lfo=ctx.createOscillator();lfo.frequency.value=2;const lg=ctx.createGain();lg.gain.value=300;lfo.connect(lg);lg.connect(o.frequency);o.frequency.value=800;const g=ctx.createGain();g.gain.value=.25;o.connect(g);g.connect(master);o.start(now);o.stop(stopAt);lfo.start(now);lfo.stop(stopAt);break;}
      case 'bell':[523,659,784,1047].forEach((f,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.15,now+i*.1);g.gain.exponentialRampToValueAtTime(.001,stopAt);o.connect(g);g.connect(master);o.start(now+i*.1);o.stop(stopAt);});break;
      case 'beep':pulse(880,'square',Math.min(duration*3,15),.25);break;
      case 'danger':pulse(440,'sawtooth',Math.min(duration*3,15),.3);break;
      case 'radar':for(let i=0;i<Math.min(duration*4,20);i++)tone(1500,'sine',now+i*.25,.1,.1);break;
      case 'martinshorn':for(let i=0;i<Math.floor(duration);i++){tone(660,'sawtooth',now+i*.5,.4,.3);tone(880,'sawtooth',now+i*.5+.25,.2,.3);}break;
      case 'horn':tone(400,'square',now,duration*.5,.3);tone(500,'square',now,duration*.5,.2);break;
      case 'chime':[784,988,1175].forEach((f,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.15,now+i*.15);g.gain.exponentialRampToValueAtTime(.001,now+i*.15+.4);o.connect(g);g.connect(master);o.start(now+i*.15);o.stop(now+i*.15+.4);});break;
      case 'buzzer':{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sawtooth';o.frequency.value=150;g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(master);o.start(now);o.stop(now+duration);break;}
      case 'whistle':{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(2000,now);o.frequency.linearRampToValueAtTime(3000,now+duration*.5);o.frequency.linearRampToValueAtTime(2000,now+duration);g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(master);o.start(now);o.stop(now+duration);break;}
      case 'police':for(let i=0;i<Math.floor(duration*2);i++){tone(800,'sawtooth',now+i*.5,.25,.3);tone(1200,'sawtooth',now+i*.5+.25,.25,.3);}break;
      case 'ambulance':for(let i=0;i<Math.floor(duration*2);i++){tone(600,'sine',now+i*.5,.4,.3);tone(900,'sine',now+i*.5,.4,.2);}break;
      case 'fire':for(let i=0;i<Math.floor(duration*2);i++){tone(500,'sawtooth',now+i*.5,.3,.3);tone(700,'sawtooth',now+i*.5+.2,.3,.3);}break;
      case 'train':tone(200,'sawtooth',now,duration,.2);tone(250,'sawtooth',now,duration,.15);break;
      case 'laser':{const o=ctx.createOscillator();const g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(2000,now);o.frequency.exponentialRampToValueAtTime(200,now+.5);g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.001,now+.5);o.connect(g);g.connect(master);o.start(now);o.stop(now+.5);break;}
      case 'sonar':for(let i=0;i<3;i++)tone(1200,'sine',now+i*.5,.3,.3);break;
      case 'heartbeat':for(let i=0;i<Math.floor(duration*2);i++){tone(60,'sine',now+i*.5,.15,.4);tone(80,'sine',now+i*.5+.2,.15,.3);}break;
      case 'ufo':{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(400,now);o.frequency.linearRampToValueAtTime(1200,now+duration*.5);o.frequency.linearRampToValueAtTime(400,now+duration);g.gain.setValueAtTime(.2,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(master);o.start(now);o.stop(now+duration);break;}
      case 'explosion':{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(100,now);o.frequency.exponentialRampToValueAtTime(20,now+duration);g.gain.setValueAtTime(.4,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(master);o.start(now);o.stop(now+duration);break;}
      case 'geiger':for(let i=0;i<Math.floor(duration*10);i++)if(Math.random()>.5)tone(1500,'square',now+i*.1,.02,.1);break;
      case 'bird':for(let i=0;i<Math.floor(duration*4);i++){const f=1500+Math.random()*1500;tone(f,'sine',now+i*.25,.1,.15);}break;
      case 'dog':for(let i=0;i<3;i++){tone(200,'sawtooth',now+i*.3,.15,.3);tone(300,'sawtooth',now+i*.3+.1,.1,.2);}break;

  if(/mail|email/.test(q)){setTimeout(()=>openApp('E'),400);return '✓ Ich öffne dein HalDo Mail.';}
  if(/musik|song/.test(q)){setTimeout(()=>openApp('MS'),400);return '✓ Ich öffne dein Musik Studio.';}
  if(/video/.test(q)){setTimeout(()=>openApp('VD'),400);return '✓ Ich öffne dein Video Studio.';}
  if(/bild|foto/.test(q)){setTimeout(()=>openApp('BD'),400);return '✓ Ich öffne dein Bild Studio.';}
  if(/navi|route/.test(q)){setTimeout(()=>openApp('N'),400);return '✓ Ich öffne deine Navigation.';}
  if(/blitzer/.test(q)){setTimeout(()=>openApp('BL'),400);return '✓ Ich öffne die Blitzer-Zentrale.';}
  if(/zeit|uhr/.test(q))return '🕐 Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.';
  if(/datum/.test(q))return '📅 '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

}

/* ==================== HALDO NAVIGATION (ERWEITERT) ==================== */
const viewNavigation=function(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';body.appendChild(sb);body.appendChild(ct);
  let active='map';let arrowColor=localStorage.getItem('haldo_arrow_color')||'#fbbf24';let arrowStyle=localStorage.getItem('haldo_arrow_style')||'straight';

  const persistRoute=()=>save('nav_route',route);const persistSaved=()=>save('nav_saved',savedDest);const persistLive=()=>save('nav_live',liveTraffic);const persistEvents=()=>save('nav_events',trafficEvents);const persistNavSettings=()=>save('nav_settings',navSettings);
  const TRAFFIC_CATS=[{id:'stau',label:'Stau',icon:'🚗',color:'#ef4444',sound:'bell'},{id:'unfall',label:'Unfall',icon:'💥',color:'#f97316',sound:'danger'},{id:'baustelle',label:'Baustelle',icon:'🚧',color:'#f59e0b',sound:'warning'},{id:'blitzer',label:'Blitzer',icon:'📸',color:'#a855f7',sound:'siren'},{id:'polizei',label:'Polizei',icon:'🚔',color:'#3b82f6',sound:'police'},{id:'gefahr',label:'Gefahr',icon:'⚠️',color:'#eab308',sound:'alarm'},{id:'umleitung',label:'Umleitung',icon:'↩️',color:'#06b6d4',sound:'chime'}];
  function startTraffic(){if(trafficInterval)clearInterval(trafficInterval);if(!liveTraffic)return;trafficInterval=setInterval(()=>{if(!liveTraffic)return;const cat=TRAFFIC_CATS[Math.floor(Math.random()*TRAFFIC_CATS.length)];if(navSettings.categoryEnabled&&navSettings.categoryEnabled[cat.id]===false)return;const x=15+Math.random()*70,y=15+Math.random()*70;trafficEvents.unshift({id:Date.now(),cat:cat.id,label:cat.label,icon:cat.icon,color:cat.color,x,y,time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})});if(trafficEvents.length>10)trafficEvents=trafficEvents.slice(0,10);persistEvents();const s=navSettings.categorySounds[cat.id]||cat.sound;playAlarm(s,2);speak('Achtung! '+cat.label+' auf deiner Route.',navSettings.voice,LANGCODES[navSettings.lang]||'de-DE');if(active==='map')renderMap();},8000);}
  function stopTraffic(){if(trafficInterval){clearInterval(trafficInterval);trafficInterval=null;}}
  function renderMap(){
    ct.innerHTML='<h3>🗺️ HalDo Navigation '+(liveTraffic?'<span class="live-badge">● LIVE</span>':'<span class="live-badge off">● AUS</span>')+'</h3>';
    const bar=document.createElement('div');bar.className='nav-search-bar';
    const iF=document.createElement('input');iF.placeholder='📍 Von (Adresse)';iF.value=route.from;
    const iT=document.createElement('input');iT.placeholder='🎯 Nach (Adresse)';iT.value=route.to;
    const bG=document.createElement('button');bG.textContent='🚀 Route';
    bG.onclick=()=>{route.from=iF.value;route.to=iT.value;if(!route.from||!route.to){alert('Bitte Von/Nach eingeben.');return;}const d=Math.round(Math.random()*200+20);route.distance=d;route.duration=Math.round(d*1.2+10);persistRoute();speak('Route berechnet: '+d+' Kilometer');renderMap();};
    bar.appendChild(iF);bar.appendChild(iT);bar.appendChild(bG);ct.appendChild(bar);
    const holo=document.createElement('div');holo.className='holo-map';

    if(arrowStyle==='straight')arrowSVG=`<svg viewBox="0 0 100 100" style="width:100px;height:100px;filter:drop-shadow(0 0 20px ${arrowColor})">${grad}<path d="M50 10 L90 40 L65 40 L65 90 L35 90 L35 40 L10 40 Z" fill="url(#gg)" stroke="${arrowColor}" stroke-width="2"/></svg>`;

    else arrowSVG=`<svg viewBox="0 0 100 100" style="width:100px;height:100px;filter:drop-shadow(0 0 20px ${arrowColor})">${grad}<path d="M80 80 Q80 40 40 40 L40 20 L10 50 L40 80 L40 60 Q60 60 60 80 Z" fill="url(#gg)" stroke="${arrowColor}" stroke-width="2"/></svg>`;
    holo.innerHTML=`<div style="position:absolute;top:30%;left:50%;transform:translateX(-50%);">${arrowSVG}</div>`;
    const lane=document.createElement('div');lane.className='lane-guidance';lane.style.position='absolute';lane.style.bottom='10px';lane.style.left='10px';lane.style.right='10px';lane.innerHTML='<div class="lane">⬅</div><div class="lane">⬆</div><div class="lane active">⬆</div><div class="lane">➡</div>';holo.appendChild(lane);
    trafficEvents.forEach(ev=>{const el=document.createElement('div');el.className='traffic-event';el.style.cssText='left:'+ev.x+'%;top:'+ev.y+'%;color:'+ev.color+';';el.textContent=ev.icon;holo.appendChild(el);});

  }
  function renderSettings(){
    ct.innerHTML='<h3>⚙ Navigation-Einstellungen</h3>';
    ct.innerHTML+='<div class="settings-row"><div><div class="lbl">🚗 Fahrzeug</div></div><div class="ctrl"><select id="n-v"><option value="car">PKW</option><option value="motorcycle">Motorrad</option><option value="truck">LKW</option><option value="ev">E-Auto</option></select></div></div>';

  {id:'A',ico:'🧠',nm:'HalDo AI',fn:viewAI},{id:'E',ico:'✉️',nm:'HalDo Mail',fn:viewEmail},{id:'N',ico:'🗺️',nm:'Navigation',fn:viewNavigation},{id:'BL',ico:'🚨',nm:'Blitzer',fn:viewBlitzerApp},{id:'MS',ico:'🎵',nm:'Musik Studio',fn:viewMusic},{id:'VD',ico:'🎬',nm:'Video Studio',fn:viewVideo},{id:'BD',ico:'🖼️',nm:'Bild Studio',fn:viewBild},{id:'B',ico:'🌐',nm:'Browser',fn:viewBrowser},{id:'C',ico:'📅',nm:'Calendar',fn:viewCalendar},{id:'D',ico:'📄',nm:'Documents',fn:viewDocuments},{id:'F',ico:'📂',nm:'Files',fn:viewFiles},{id:'G',ico:'🖼️',nm:'Gallery',fn:viewGallery},{id:'H',ico:'🩺',nm:'Health',fn:viewHealth},{id:'I',ico:'🌍',nm:'Internet',fn:viewInternet},{id:'J',ico:'📖',nm:'Journal',fn:viewJournal},{id:'K',ico:'⌨️',nm:'Keyboard',fn:viewKeyboard},{id:'L',ico:'🎓',nm:'Learning',fn:viewLearning},{id:'O',ico:'📊',nm:'Office',fn:viewOffice},{id:'P',ico:'📷',nm:'Photos',fn:viewPhotos},{id:'Q',ico:'🛠️',nm:'Quick Tools',fn:viewQuickTools},{id:'R',ico:'🎙️',nm:'Recorder',fn:viewRecorder},{id:'S',ico:'🛡️',nm:'Security',fn:viewSecurity},{id:'T',ico:'✅',nm:'Tasks',fn:viewTasks},{id:'U',ico:'🔄',nm:'Updates',fn:viewUpdates},{id:'W',ico:'🌤️',nm:'Weather',fn:viewWeather},{id:'X',ico:'🎨',nm:'eXperience',fn:viewExperience},{id:'Y',ico:'🏠',nm:'Your Life',fn:viewYourLife},{id:'Z',ico:'⚙️',nm:'System',fn:viewSystemCenter},{id:'FS',ico:'🚗',nm:'Fahrschule',fn:viewFahrschuleApp},{id:'AU',ico:'🚙',nm:'Auto',fn:viewAutoApp},{id:'KO',ico:'👥',nm:'Kontakte',fn:viewKontakte},{id:'NO',ico:'📝',nm:'Notizen',fn:viewNotizen},{id:'PW',ico:'🔑',nm:'Passwörter',fn:viewPasswort},{id:'FI',ico:'💰',nm:'Finanzen',fn:viewFinanzen},{id:'FT',ico:'💪',nm:'Fitness',fn:viewFitness},{id:'GE',ico:'🔁',nm:'Gewohnheiten',fn:viewGewohnheiten},{id:'WA',ico:'💧',nm:'Wasser',fn:viewWasser},{id:'ST',ico:'😊',nm:'Stimmung',fn:viewStimmung},{id:'RE',ico:'🍳',nm:'Rezepte',fn:viewRezepte},{id:'EI',ico:'🛒',nm:'Einkauf',fn:viewEinkauf},{id:'RS',ico:'✈️',nm:'Reisen',fn:viewReisen},{id:'VO',ico:'📚',nm:'Vokabeln',fn:viewVokabeln},{id:'FL',ico:'🎴',nm:'Flashcards',fn:viewFlashcards},{id:'NF',ico:'🚨',nm:'Notfall',fn:viewNotfall}
];
function orderedRegistry(){return REGISTRY;}
function populateStartMenu(){const grid=document.getElementById('sm-apps');if(!grid)return;grid.innerHTML='';orderedRegistry().forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});}
function filterStartMenu(q){const grid=document.getElementById('sm-apps');if(!grid)return;const filt=orderedRegistry().filter(a=>a.nm.toLowerCase().includes(q.toLowerCase()));grid.innerHTML='';filt.forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});}
document.querySelectorAll('.sm-tab').forEach(tab=>{tab.onclick=(e)=>{e.stopPropagation();document.querySelectorAll('.sm-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.sm-panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('sm-panel-'+tab.dataset.tab).classList.add('active');if(tab.dataset.tab==='settings')renderSettingsPanel();};});

/* ==================== STARTMENÜ ==================== */
function toggleStartMenu(e){if(e){e.stopPropagation();e.preventDefault();}const sm=document.getElementById('start-menu');if(sm.classList.contains('show'))sm.classList.remove('show');else{sm.classList.add('show');renderSettingsPanel();}}
document.addEventListener('click',function(e){const sm=document.getElementById('start-menu');if(!sm||!sm.classList.contains('show'))return;if(!e.target||!e.target.isConnected)return;if(sm.contains(e.target))return;if(e.target.closest('.start-btn'))return;sm.classList.remove('show');},false);

/* ==================== SETTINGS ==================== */
const SETTINGS_SECTIONS=[{id:'haldocore',icon:'🌌',label:'HalDo Core'},{id:'general',icon:'🔧',label:'Allgemein'},{id:'display',icon:'🎨',label:'Anzeige'},{id:'kosmos',icon:'🌌',label:'Kosmos'},{id:'voice',icon:'🎤',label:'Stimme'},{id:'language',icon:'🌐',label:'Sprache'},{id:'about',icon:'ℹ️',label:'Über'}];
let activeSetting='haldocore';
function renderSettingsPanel(){const nav=document.getElementById('settings-nav');const c=document.getElementById('settings-content');if(!nav||!c)return;nav.innerHTML='';SETTINGS_SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='settings-nav-item'+(activeSetting===s.id?' active':'');b.textContent=s.icon+' '+s.label;b.onclick=(e)=>{e.stopPropagation();activeSetting=s.id;renderSettingsPanel();};nav.appendChild(b);});c.innerHTML='';const s=activeSetting;if(s==='haldocore')renderHalDoCore(c);else if(s==='general')renderGeneral(c);else if(s==='display')renderDisplay(c);else if(s==='kosmos')renderKosmos(c);else if(s==='voice')renderVoice(c);else if(s==='language')renderLanguage(c);else renderAbout(c);}
function rowHTML(label,sub,ctrl){return '<div class="settings-row"><div><div class="lbl">'+label+'</div><div class="sub">'+sub+'</div></div><div class="ctrl">'+ctrl+'</div></div>';}
function toggleHTML(id,on){return '<span class="toggle '+(on?'on':'')+'" data-toggle="'+id+'"></span>';}
function renderHalDoCore(c){
  c.innerHTML='<h3>🌌 HalDo Core – Zentrale KI-API</h3>';
  c.innerHTML+='<div class="qt-panel" style="margin-bottom:16px;"><h4>Was ist der HalDo Core?</h4><p style="font-size:12px;line-height:1.6;color:var(--dim);">Deine <b>eigene zentrale API</b>. Ein Schlüssel für alle Apps: Mail, Musik, Video, Bild, AI, Navigation.</p></div>';
  c.innerHTML+=rowHTML('🔑 HalDo API-Key','Zentraler Schlüssel','<input type="password" id="core-key" value="'+(localStorage.getItem('haldo_core_key')||'')+'" placeholder="sk-haldo-...">');
  c.innerHTML+=rowHTML('🌐 Core-Endpoint','Server-URL','<input id="core-endpoint" value="'+(localStorage.getItem('haldo_core_endpoint')||'https://api.haldo.ai/v1')+'">');
  c.innerHTML+=rowHTML('🤖 KI-Modell','Standard','<select><option>HalDo-1</option><option>HalDo-1-Pro</option><option>HalDo-1-Max</option></select>');
  c.innerHTML+=rowHTML('🎵 Musik-Modell','Standard','<select><option>HalDo-Music-1</option><option>HalDo-Music-Pro</option></select>');
  c.innerHTML+=rowHTML('🎬 Video-Modell','Standard','<select><option>HalDo-Video-1</option><option>HalDo-Video-Pro</option></select>');
  c.innerHTML+=rowHTML('🖼️ Bild-Modell','Standard','<select><option>HalDo-Image-1</option><option>HalDo-Image-Pro</option></select>');
  c.innerHTML+=rowHTML('🔊 TTS-Modell','Standard','<select><option>HalDo-Voice-1</option><option>HalDo-Voice-Klon</option></select>');
  const sv=document.createElement('button');sv.textContent='💾 Speichern';sv.style.marginTop='16px';sv.onclick=()=>{localStorage.setItem('haldo_core_key',document.getElementById('core-key').value);localStorage.setItem('haldo_core_endpoint',document.getElementById('core-endpoint').value);alert('✓ Gespeichert');};c.appendChild(sv);
  const tb=document.createElement('button');tb.textContent='🔌 Verbindung testen';tb.style.marginTop='8px';tb.onclick=()=>{const k=localStorage.getItem('haldo_core_key');if(!k){alert('Bitte API-Key eingeben.');return;}speak('Verbinde mit HalDo Core...');setTimeout(()=>{speak('Verbindung erfolgreich.');alert('✓ HalDo Core verbunden!');},1500);};c.appendChild(tb);
}
function renderGeneral(c){c.innerHTML='<h3>🔧 Allgemein</h3>';c.innerHTML+=rowHTML('Gerätename','Name','<input value="'+(localStorage.getItem('haldo_device_name')||'HalDo AI OS')+'" oninput="localStorage.setItem(\'haldo_device_name\',this.value)">');}
function renderDisplay(c){c.innerHTML='<h3>🎨 Anzeige</h3>';const cur=localStorage.getItem('haldo_theme')||'#06b6d4';const btns=['#06b6d4','#b478ff','#10b981','#f59e0b','#ef4444','#ec4899'].map(col=>'<button style="background:'+col+';width:26px;height:26px;border-radius:50%;border:'+(col===cur?'3px solid #fff':'2px solid transparent')+';cursor:pointer;" onclick="document.documentElement.style.setProperty(\'--accent\',\''+col+'\');document.documentElement.style.setProperty(\'--accent2\',\''+col+'\');localStorage.setItem(\'haldo_theme\',\''+col+'\')"></button>').join('');c.innerHTML+=rowHTML('Akzentfarbe','Design',btns);c.innerHTML+=rowHTML('Schriftgröße','12–18px','<input type="range" min="12" max="18" value="'+(localStorage.getItem('haldo_font_size')||14)+'" oninput="document.documentElement.style.setProperty(\'--font-size\',this.value+\'px\');localStorage.setItem(\'haldo_font_size\',this.value)">');}
function renderKosmos(c){c.innerHTML='<h3>🌌 Kosmos</h3>';const cfg=cosmosState.config;[['kosmos_sun','☀️ Sonne','sun'],['kosmos_earth','🌍 Erde','earth'],['kosmos_moon','🌙 Mond','moon'],['kosmos_mars','🔴 Mars','mars'],['kosmos_jupiter','🟠 Jupiter','jupiter'],['kosmos_saturn','🪐 Saturn','saturn'],['kosmos_neptune','🔵 Neptun','neptune']].forEach(([id,lbl,key])=>{c.innerHTML+=rowHTML(lbl,'',toggleHTML(id,cfg[key]!==false));});setTimeout(()=>{document.querySelectorAll('[data-toggle]').forEach(t=>{t.onclick=(e)=>{e.stopPropagation();t.classList.toggle('on');const key=t.dataset.toggle.replace('kosmos_','');cosmosState.config[key]=t.classList.contains('on');applyKosmosConfig();};});},0);}
function renderVoice(c){c.innerHTML='<h3>🎤 Stimme</h3>';const voiceOpts=allVoices.map(v=>'<option value="'+v.name+'">'+v.name+' ('+v.lang+')</option>').join('');c.innerHTML+=rowHTML('System-Stimme','Für alle Apps',`<select id="gv">${voiceOpts}</select>`);c.innerHTML+=rowHTML('Test','','<button onclick="speak(\'Hallo! Ich bin HalDo AI.\', \'\', null, document.getElementById(\'gv\').value)">🔊 Test</button>');}
function renderLanguage(c){c.innerHTML='<h3>🌐 Sprache</h3>';const sel='<select onchange="setLanguage(this.value)">'+Object.keys(LANGNAMES).map(k=>'<option value="'+k+'"'+(k===currentLang?' selected':'')+'>'+LANGNAMES[k]+'</option>').join('')+'</select>';c.innerHTML+=rowHTML('Systemsprache','',sel);}
function renderAbout(c){c.innerHTML='<h3>ℹ️ Über</h3><div class="qt-panel"><h4>HalDo AI OS Pro Max</h4><p>Version 2.0.0</p><p>Von Halil Donma</p><p>'+REGISTRY.length+' Apps</p><p style="margin-top:8px;font-size:11px;color:var(--dim);">E-Mail: halil@haldo.ai</p></div>';}
function setLanguage(lang){currentLang=lang;localStorage.setItem('haldo_lang',lang);populateStartMenu();renderSettingsPanel();}

/* ==================== WINDOW ==================== */
function openApp(id){const def=REGISTRY.find(a=>a.id===id);if(!def)return;const splash=document.getElementById('app-splash');if(splash){splash.querySelector('.splash-icon').textContent=def.ico;splash.querySelector('.splash-name').textContent=def.nm;splash.classList.add('show');setTimeout(()=>splash.classList.remove('show'),700);}document.getElementById('start-menu').classList.remove('show');if(openWindows[id]){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}return;}const win=document.createElement('div');win.className='window';win.id='win-'+id;win.style.width=id==='E'?'1000px':(id==='MS'||id==='VD'||id==='BD'?'950px':'880px');win.style.height=id==='E'?'640px':'600px';win.style.left=(60+Object.keys(openWindows).length*25)+'px';win.style.top=(40+Object.keys(openWindows).length*25)+'px';win.style.zIndex=nextZ();win.innerHTML='<div class="window-header" onmousedown="startDrag(event,\''+id+'\')"><div class="window-title">'+def.ico+' '+def.nm+'</div><div class="window-controls"><button class="win-btn" onclick="event.stopPropagation();minimizeApp(\''+id+'\')">—</button><button class="win-btn" onclick="event.stopPropagation();maximizeApp(\''+id+'\')">▢</button><button class="win-btn close" onclick="event.stopPropagation();closeApp(\''+id+'\')">✕</button></div></div><div class="window-body" id="body-'+id+'"></div>';document.body.appendChild(win);openWindows[id]=true;document.getElementById('taskbar-apps').innerHTML+='<div class="taskbar-app" id="tb-'+id+'" onclick="focusApp(\''+id+'\')">'+def.ico+' '+def.nm+'</div>';setTimeout(()=>{try{def.fn(document.getElementById('body-'+id));}catch(e){console.error(e);document.getElementById('body-'+id).innerHTML='<p style="color:#f77;padding:20px">Fehler: '+e.message+'</p>';}},60);}
function closeApp(id){const w=document.getElementById('win-'+id);if(w)w.remove();const tb=document.getElementById('tb-'+id);if(tb)tb.remove();delete openWindows[id];}
function focusApp(id){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}}
function minimizeApp(id){const w=document.getElementById('win-'+id);if(w)w.classList.toggle('minimized');}
function maximizeApp(id){const w=document.getElementById('win-'+id);if(!w)return;if(w.dataset.max==='1'){w.style.left=w.dataset.l;w.style.top=w.dataset.t;w.style.width=w.dataset.wd;w.style.height=w.dataset.ht;w.dataset.max='0';}else{w.dataset.l=w.style.left;w.dataset.t=w.style.top;w.dataset.wd=w.style.width;w.dataset.ht=w.style.height;w.style.left='0';w.style.top='0';w.style.width='100vw';w.style.height='calc(100vh - 50px)';w.dataset.max='1';}}
let dragState=null;
function startDrag(e,id){if(e.target.closest('.win-btn'))return;const w=document.getElementById('win-'+id);if(!w)return;dragState={id,sx:e.clientX,sy:e.clientY,wx:w.offsetLeft,wy:w.offsetTop};w.style.zIndex=nextZ();}
addEventListener('mousemove',e=>{if(!dragState)return;const w=document.getElementById('win-'+dragState.id);if(!w||w.dataset.max==='1')return;w.style.left=(dragState.wx+e.clientX-dragState.sx)+'px';w.style.top=Math.max(0,dragState.wy+e.clientY-dragState.sy)+'px';});
addEventListener('mouseup',()=>{dragState=null;});

/* ==================== BOOT ==================== */
function enterApp(){document.getElementById('welcome').classList.add('hide');document.getElementById('taskbar').classList.add('show');populateStartMenu();renderSettingsPanel();playGlassSound();const h=document.getElementById('click-hint');if(h)setTimeout(()=>{h.style.opacity='0';},8000);}
function startClock(){const c=document.getElementById('sys-clock');const tick=()=>c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000);}
document.addEventListener('DOMContentLoaded',()=>{initCosmos();startClock();populateStartMenu();renderSettingsPanel();const t2=localStorage.getItem('haldo_theme');if(t2){document.documentElement.style.setProperty('--accent',t2);document.documentElement.style.setProperty('--accent2',t2);}const f=localStorage.getItem('haldo_font_size');if(f)document.documentElement.style.setProperty('--font-size',f+'px');});
</script>
</body>
</html>
