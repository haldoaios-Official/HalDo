<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
:root{
  --bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ===== 3D HINTERGRUND ===== */
#cosmos-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
#cyborg-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* ===== DASHBOARD ===== */
#dashboard{position:fixed;inset:0;z-index:2;overflow-y:auto;padding:80px 40px 40px 100px;pointer-events:none}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;pointer-events:auto;max-width:1200px;margin:0 auto}
.app-card{background:rgba(17,24,39,.7);border:1px solid rgba(55,65,81,.5);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .2s;text-align:center;backdrop-filter:blur(10px)}
.app-card:hover{background:rgba(31,41,55,.95);border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(6,182,212,.2)}
.app-card .ico{font-size:32px}
.app-card .nm{font-size:12px;font-weight:600;color:#e5e7eb}

/* ===== WELCOME ===== */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9998;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px)}
#welcome h1{font-size:clamp(32px,5.5vw,64px);font-weight:900;letter-spacing:4px;animation:fadeUp 1s ease-out;
  background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(251,191,36,.8),0 0 60px rgba(245,158,11,.5);
}
#welcome h2{font-size:clamp(16px,2vw,22px);color:#e5e7eb;font-weight:400;line-height:1.6;animation:fadeUp 1s ease-out .2s both;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;animation:fadeUp 1s ease-out .4s both;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#welcome .presented b{color:#fbbf24;font-weight:700}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s;animation:fadeUp 1s ease-out .6s both}
#welcome .enter-btn:hover{transform:scale(1.05);box-shadow:0 0 60px rgba(6,182,212,.9)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== FLOATING MENU ===== */
#floating-menu{position:fixed;top:20px;left:20px;z-index:100;display:flex;flex-direction:column;gap:10px;cursor:grab}
#floating-menu:active{cursor:grabbing}
.menu-btn{background:rgba(17,24,39,.95);border:1px solid var(--accent);border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 20px rgba(6,182,212,.4);transition:transform .2s;pointer-events:auto}
.menu-btn:hover{transform:scale(1.1)}
#main-sidebar{background:rgba(17,24,39,.95);border:1px solid var(--border);border-radius:12px;width:280px;max-height:80vh;display:none;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px);pointer-events:auto}
#main-sidebar.show{display:flex}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);font-weight:700;color:var(--accent);display:flex;align-items:center;gap:10px}
.sidebar-content{flex:1;overflow-y:auto;padding:10px}
.nav-category{font-size:11px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px 10px;font-weight:700;letter-spacing:1px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:all .2s;color:var(--text);width:100%;text-align:left;pointer-events:auto}
.nav-btn:hover{background:var(--bg3);color:var(--accent)}
.nav-btn .icon{font-size:18px;width:24px;text-align:center}

/* ===== APP OVERLAY ===== */
#app-content{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:600px;z-index:50;background:rgba(10,14,26,.95);backdrop-filter:blur(15px);border-left:1px solid var(--border);display:none;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .3s ease}
#app-content.show{display:flex;transform:translateX(0)}
.app-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.app-header h2{font-size:18px;color:var(--accent);display:flex;align-items:center;gap:10px}
.close-btn{background:var(--bg3);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s}
.close-btn:hover{background:var(--danger)}
.app-body{flex:1;overflow-y:auto;padding:24px}

/* ===== SPLASH ===== */
#app-splash{position:fixed;inset:0;z-index:9997;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%, rgba(6,182,212,.2) 0%, rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px)}
#app-splash.show{display:flex;animation:splashIn .3s ease-out}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);animation:starGlow 1.2s ease-out}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.splash-presented{font-size:12px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-top:10px}
.splash-presented b{color:#fbbf24}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg)}50%{transform:scale(1.2) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}

/* ===== UI ELEMENTE ===== */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.panel .desc{color:var(--dim);font-size:13px;margin-bottom:12px}
.btn{padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.list-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.list-item:hover{background:rgba(31,41,55,.95);border-color:var(--accent)}
.list-item .title{font-weight:600;margin-bottom:4px}
.list-item .meta{color:var(--dim);font-size:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info{flex:1}
.settings-row .info .lbl{font-weight:600;margin-bottom:4px}
.settings-row .ctrl{flex-shrink:0;margin-left:16px;min-width:200px}
.calc-display{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;font-size:32px;text-align:right;font-weight:600;margin-bottom:12px;min-height:70px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{padding:18px;font-size:18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-weight:600}
.calc-grid button.op{color:var(--accent)}
.calc-grid button.eq{background:var(--accent);color:#fff}
.emergency-btn{display:flex;align-items:center;justify-content:center;width:100%;height:200px;background:linear-gradient(135deg,#dc2626,#ef4444);border-radius:20px;font-size:48px;font-weight:900;color:#fff;letter-spacing:4px;box-shadow:0 0 40px rgba(239,68,68,.4);cursor:pointer}
#glb-uploader{position:fixed;bottom:20px;right:20px;z-index:100;background:rgba(0,0,0,0.8);padding:12px;border-radius:12px;border:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:12px}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ================= 3D KOSMOS (SONNE, ERDE, MOND) ================= */
function initCosmos() {
  try {
    const canvas = document.getElementById('cosmos-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 15);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Sterne
    const starGeo = new THREE.BufferGeometry();
    const starCount = 3000;
    const posArray = new Float32Array(starCount * 3);
    for(let i=0; i<starCount*3; i++) posArray[i] = (Math.random() - 0.5) * 200;
    starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 })));

    // SONNE (Gigantischer Glow + Pulsieren)
    const sunGeo = new THREE.SphereGeometry(3, 64, 64);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.position.set(12, 8, -15);
    scene.add(sun);
    
    const createGlow = (color) => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.2, `rgba(${color[0]},${color[1]},${color[2]},1)`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
      return new THREE.CanvasTexture(c);
    };
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: createGlow([255,220,0]), transparent: true, blending: THREE.AdditiveBlending }));
    sunGlow.scale.set(28, 28, 1);
    sunGlow.position.copy(sun.position);
    scene.add(sunGlow);

    // MOND
    const moonGeo = new THREE.SphereGeometry(1.2, 64, 64);
    const moonTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
    const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1 });
    const moon = new THREE.Mesh(moonGeo, moonMat);
    moon.position.set(-10, 6, -8);
    scene.add(moon);

    // ERDE (Heller und Komplett sichtbar)
    const earthGeo = new THREE.SphereGeometry(4, 64, 64);
    const earthTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthMat = new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.6, emissive: 0x112244, emissiveIntensity: 0.5 });
    const earth = new THREE.Mesh(earthGeo, earthMat);
    earth.position.set(0, -3, 0); // Etwas nach oben, damit der Ring sichtbar ist
    scene.add(earth);

    // Atmosphäre
    const atmGeo = new THREE.SphereGeometry(4.15, 64, 64);
    const atmMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.2, side: THREE.BackSide });
    const atm = new THREE.Mesh(atmGeo, atmMat);
    atm.position.copy(earth.position);
    scene.add(atm);

    // Drehender Ring
    const ringGeo = new THREE.TorusGeometry(5, 0.05, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(earth.position);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    // LICHT (Sehr hell für die Erde)
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sunLight = new THREE.DirectionalLight(0xfff8e1, 2.5);
    sunLight.position.copy(sun.position);
    scene.add(sunLight);
    const fillLight = new THREE.DirectionalLight(0x3b82f6, 1.0);
    fillLight.position.set(-10, -5, 10);
    scene.add(fillLight);

    function animate() {
      requestAnimationFrame(animate);
      earth.rotation.y += 0.001;
      moon.rotation.y += 0.002;
      ring.rotation.z += 0.005;
      sunGlow.scale.x = 28 + Math.sin(Date.now() * 0.002) * 2;
      sunGlow.scale.y = 28 + Math.sin(Date.now() * 0.002) * 2;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  } catch (e) { console.error("Kosmos Fehler:", e); }
}

/* ================= 3D MENSCH (CYBORG) ================= */
let A = {scene:null, cam:null, ren:null, ctrl:null, current:null};
function initCyborg() {
  try {
    const canvas = document.getElementById('cyborg-canvas');
    A.scene = new THREE.Scene();
    A.cam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    A.cam.position.set(0, 1.2, 4);
    
    A.ren = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    A.ren.setSize(window.innerWidth, window.innerHeight);
    A.ren.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    A.ren.setClearColor(0x000000, 0);
    
    A.ctrl = new THREE.OrbitControls(A.cam, A.ren.domElement);
    A.ctrl.enableDamping = true;
    A.ctrl.enablePan = false;
    A.ctrl.enableZoom = true;
    A.ctrl.minDistance = 1.5;
    A.ctrl.maxDistance = 8;

    A.scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(3, 4, 5); A.scene.add(d1);
    const d2 = new THREE.DirectionalLight(0x06b6d4, 1.5); d2.position.set(-3, 2, -5); A.scene.add(d2);

    const loader = new THREE.GLTFLoader();

    function loadModel(url, isManual = false) {
      loader.load(url, (gltf) => {
        if(A.current) A.scene.remove(A.current);
        
        const m = gltf.scene;
        m.traverse(o => { if(o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
        A.scene.add(m);
        A.current = m;
        
        const box = new THREE.Box3().setFromObject(m);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        
        m.position.x = -center.x;
        m.position.y = -box.min.y;
        m.position.z = -center.z;
        
        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = A.cam.fov * (Math.PI / 180);
        let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.2;
        
        A.cam.position.set(0, size.y / 2, cameraZ);
        A.ctrl.target.set(0, size.y / 2, 0);
        A.ctrl.update();
        
        document.getElementById('glb-uploader').style.display = 'none'; 
      }, undefined, (err) => {
        if (!isManual && url === './male_base.glb') {
          document.getElementById('glb-uploader').style.borderColor = 'var(--danger)';
          document.getElementById('glb-uploader').style.boxShadow = '0 0 15px rgba(239,68,68,0.5)';
          
          const geo = new THREE.CapsuleGeometry(0.3, 1.2, 16, 32);
          const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true, transparent: true, opacity: 0.5 });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.y = 0.9;
          A.scene.add(mesh);
          A.cam.position.set(0, 1, 3);
          A.ctrl.target.set(0, 1, 0);
        }
      });
    }

    loadModel('./male_base.glb');

    document.getElementById('manual-glb').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      loadModel(URL.createObjectURL(file), true);
    });

    (function loop() {
      requestAnimationFrame(loop);
      A.ctrl.update();
      A.ren.render(A.scene, A.cam);
    })();

    window.addEventListener('resize', () => {
      A.cam.aspect = window.innerWidth / window.innerHeight;
      A.cam.updateProjectionMatrix();
      A.ren.setSize(window.innerWidth, window.innerHeight);
    });
  } catch (e) { console.error("Cyborg Fehler:", e); }
}

/* ================= TÖNE & SPLASH ================= */
let audioCtx = null;
function playTone(type) {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const patterns = {
      glass: [{f:1760,t:'sine',d:0.6},{f:2637,t:'sine',d:0.6}],
      chime: [{f:880,t:'sine',d:0.4},{f:1320,t:'sine',d:0.4}],
      epic: [{f:440,t:'triangle',d:0.8},{f:554,t:'triangle',d:0.8},{f:659,t:'triangle',d:0.8}]
    };
    const notes = patterns[type] || patterns.glass;
    let t = 0;
    notes.forEach(n => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = n.f; o.type = n.t;
      const st = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.2, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + n.d);
      o.start(st); o.stop(st + n.d + 0.1);
      t += 0.1;
    });
  } catch(e) {}
}

function showAppSplash(icon, name) {
  const el = document.getElementById('app-splash');
  el.querySelector('.splash-icon').textContent = icon;
  el.querySelector('.splash-name').textContent = name;
  el.classList.add('show');
  playTone(localStorage.getItem('haldo_tone') || 'glass');
  setTimeout(() => el.classList.remove('show'), 1500);
}

/* ================= APPS DATENBANK ================= */
const APPS = [
  {id:'dashboard',ico:'📊',nm:'Dashboard'},
  {id:'anatomy', ico:'🦴',nm:'Anatomie 3D'},
  {id:'ai',      ico:'🤖',nm:'HalDo KI'},
  {id:'diseases',ico:'🦠',nm:'Krankheiten'},
  {id:'meds',    ico:'💊',nm:'Medikamente'},
  {id:'labs',    ico:'🧪',nm:'Laborwerte'},
  {id:'care',    ico:'🧑‍⚕️',nm:'Pflege'},
  {id:'emergency',ico:'🚨',nm:'Notfall'},
  {id:'contracts',ico:'📝',nm:'Verträge'},
  {id:'notes',   ico:'📝',nm:'Notizen'},
  {id:'calendar',ico:'📅',nm:'Kalender'},

/* ================= LOGIK ================= */
function enterApp() {
  document.getElementById('welcome').style.display = 'none';
  document.querySelector('.menu-btn').style.display = 'flex';
}
document.querySelector('.menu-btn').style.display = 'none';

function toggleMenu(e) {
  e.stopPropagation();
  document.getElementById('main-sidebar').classList.toggle('show');
}

function closeApp() {
  document.getElementById('app-content').classList.remove('show');
  setTimeout(() => { document.getElementById('app-content').style.display = 'none'; }, 300);
  document.getElementById('main-sidebar').classList.remove('show');
}

function openApp(id) {
  const app = APPS.find(a => a.id === id) || (id === 'settings' ? {ico:'⚙️', nm:'Einstellungen'} : null);
  if(!app) return;
  
  showAppSplash(app.ico, app.nm);
  
  const overlay = document.getElementById('app-content');
  const title = document.getElementById('app-title');
  const body = document.getElementById('app-body');
  
  title.innerHTML = `<span>${app.ico}</span> ${app.nm}`;
  body.innerHTML = '';
  overlay.style.display = 'flex';
  setTimeout(() => overlay.classList.add('show'), 50);
  
  document.getElementById('main-sidebar').classList.remove('show');
  
  const renderFn = RENDERERS[id];
  if (renderFn) {
    renderFn(body);
  } else {
    // Stub render, falls keine Funktion existiert
    body.innerHTML = `
      <div class="panel">
        <h3>${app.ico} ${app.nm}</h3>
        <p class="desc">Dieses Modul befindet sich im Aufbau. Alle zukünftigen Funktionen werden hier integriert.</p>
      </div>
    `;
  }
}

/* ================= DRAG & DROP MENÜ ================= */
let isDragging = false, dragStartX, dragStartY, menuStartX, menuStartY;
const menu = document.getElementById('floating-menu');

menu.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  const rect = menu.getBoundingClientRect();
  menuStartX = rect.left;
  menuStartY = rect.top;
});

window.addEventListener('mousemove', (e) => {
  if(!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  menu.style.left = `${menuStartX + dx}px`;
  menu.style.top = `${menuStartY + dy}px`;
});

window.addEventListener('mouseup', () => isDragging = false);

    </div>
  `;
}
function resetCyborgCam() {
  if(A.current) {
    const box = new THREE.Box3().setFromObject(A.current);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = A.cam.fov * (Math.PI / 180);
    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.2;
    A.cam.position.set(0, size.y / 2, cameraZ);
    A.ctrl.target.set(0, size.y / 2, 0);
    A.ctrl.update();
  }
}

function aiSend(){
  const inp = document.getElementById('ai-input');
  const log = document.getElementById('chat-log');
  const q = inp.value.trim(); if(!q) return;
  log.insertAdjacentHTML('beforeend', `<div class="list-item" style="background:var(--accent);color:#fff">${q}</div>`);
  inp.value = '';
  setTimeout(() => {
    log.insertAdjacentHTML('beforeend', `<div class="list-item">Dazu habe ich noch keine gesicherte Kurzinfo. Bitte konsultiere für Diagnosen immer einen Arzt.<div style="margin-top:8px;color:var(--accent);cursor:pointer;font-size:11px" onclick="speak('Dazu habe ich noch keine gesicherte Kurzinfo.')">🔊 Vorlesen</div></div>`);
    log.scrollTop = log.scrollHeight;
  }, 300);
}

function speak(text){
  if(!('speechSynthesis' in window)) return alert('TTS nicht verfügbar.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 1.0; u.pitch = 1.0;
  speechSynthesis.speak(u);
}

let calcBuf = '';
function viewCalc(c){ c.innerHTML = `<div class="panel" style="max-width:360px"><h3>🧮 Rechner</h3><div class="calc-display" id="calc-d">0</div><div class="calc-grid"><button onclick="calcIn('C')">C</button><button onclick="calcIn('/')">÷</button><button onclick="calcIn('*')">×</button><button onclick="calcIn('-')">−</button><button onclick="calcIn('7')">7</button><button onclick="calcIn('8')">8</button><button onclick="calcIn('9')">9</button><button class="op" onclick="calcIn('+')">+</button><button onclick="calcIn('4')">4</button><button onclick="calcIn('5')">5</button><button onclick="calcIn('6')">6</button><button onclick="calcIn('1')">1</button><button onclick="calcIn('2')">2</button><button onclick="calcIn('3')">3</button><button onclick="calcIn('0')">0</button><button onclick="calcIn('.')">.</button><button class="eq" onclick="calcIn('=')">=</button></div></div>`; }
function calcIn(t){ const d = document.getElementById('calc-d'); if(t === 'C') calcBuf = ''; else if(t === '='){ try{ calcBuf = String(eval(calcBuf || '0')); }catch{ calcBuf = 'ERR'; } } else calcBuf += t; d.textContent = calcBuf || '0'; }
