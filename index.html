/* ================================================================
   3) BLITZER PRO 📸 — Realistischer Tacho 0-260 km/h
   ================================================================ */
HalDo.Blitzer = (() => {
  let canvas, ctx, raf, currentSpeed = 0, targetSpeed = 0, interval1, interval2;
  const warnings = {
    baustelle: { label: '🚧 Baustelle', on: true,  sound: 'alarm' },
    blitzer:   { label: '📸 Blitzer',   on: true,  sound: 'error' },
    stau:      { label: '🚗 Stau',      on: false, sound: 'notify' },
    unfall:    { label: '💥 Unfall',    on: false, sound: 'error' },
    nebel:     { label: '🌫 Nebel',     on: false, sound: 'notify' },
    glaette:   { label: '❄️ Glätte',    on: false, sound: 'bell' }
  };

  const drawGauge = (speed) => {
    if (!ctx) return;
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H * 0.55, r = Math.min(W, H) * 0.38;
    ctx.clearRect(0, 0, W, H);

    // Outer decorative ring
    ctx.strokeStyle = 'rgba(0,229,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 18, 0, Math.PI * 2);
    ctx.stroke();

    const startA = Math.PI * 0.75;
    const endA = Math.PI * 2.25;
    const range = endA - startA;

    // Colored zones
    const zones = [
      { p1: 0,    p2: 0.5,  col: '#00e5ff' },
      { p1: 0.5,  p2: 0.75, col: '#ffaa00' },
      { p1: 0.75, p2: 1,    col: '#ff3366' }
    ];
    zones.forEach(z => {
      ctx.strokeStyle = z.col;
      ctx.lineWidth = 20;
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.arc(cx, cy, r, startA + range * z.p1, startA + range * z.p2);
      ctx.stroke();
    });

    // Ticks
    for (let i = 0; i <= 260; i += 20) {
      const a = startA + range * (i / 260);
      const major = (i % 40 === 0);
      const r1 = r - 14;
      const r2 = r - (major ? 28 : 22);
      ctx.strokeStyle = 'rgba(230,247,255,0.8)';
      ctx.lineWidth = major ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      ctx.stroke();
      if (major) {
        const lx = cx + Math.cos(a) * (r - 42);
        const ly = cy + Math.sin(a) * (r - 42);
        ctx.fillStyle = '#e6f7ff';
        ctx.font = 'bold 11px -apple-system,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i, lx, ly);
      }
    }

    // Needle
    const nA = startA + range * Math.min(1, Math.max(0, speed / 260));
    const nx = cx + Math.cos(nA) * (r - 16);
    const ny = cy + Math.sin(nA) * (r - 16);
    const bx = cx - Math.cos(nA) * 16;
    const by = cy - Math.sin(nA) * 16;
    ctx.strokeStyle = '#ff2040';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#ff2040';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Hub
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.arc(cx, cy, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#001a2a';
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fill();

    // Digital display
    ctx.fillStyle = '#00e5ff';
    ctx.font = 'bold 38px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 20;
    ctx.fillText(Math.round(speed), cx, cy + r * 0.5);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(230,247,255,0.7)';
    ctx.font = '11px sans-serif';
    ctx.fillText('km/h', cx, cy + r * 0.5 + 26);
  };

  const animate = () => {
    currentSpeed += (targetSpeed - currentSpeed) * 0.08;
    if (Math.abs(currentSpeed - targetSpeed) < 0.2) currentSpeed = targetSpeed;
    drawGauge(currentSpeed);
    raf = requestAnimationFrame(animate);
  };

  const triggerWarning = () => {
    const active = Object.entries(warnings).filter(([k, w]) => w.on);
    if (!active.length) return;
    const [k, w] = active[Math.floor(Math.random() * active.length)];
    HalDo.Sound.play(w.sound);
    HalDo.Toast.show('⚠ ' + w.label, 2500, w.sound);
    if ('speechSynthesis' in window) {
      try {
        const u = new SpeechSynthesisUtterance('Achtung ' + w.label.replace(/[^\w\säöüÄÖÜß]/g, '').trim());
        u.lang = 'de-DE'; u.rate = 1.1;
        window.speechSynthesis.speak(u);
      } catch(e) {}
    }
  };

  const openApp = () => {
    const html = `
      <div style="padding:4px">
        <canvas id="bz-canvas" style="display:block;margin:0 auto;max-width:100%"></canvas>
        <div style="text-align:center;margin:10px 0;font-size:12px;opacity:.8">
          📍 A7 · Frankfurt · Fahrtrichtung Nord
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
          ${Object.entries(warnings).map(([k, w]) => `
            <div data-warning="${k}" style="padding:10px;border-radius:10px;border:1.5px solid ${w.on ? 'var(--accent)' : 'rgba(0,229,255,.2)'};background:${w.on ? 'rgba(0,229,255,.15)' : 'rgba(0,229,255,.05)'};cursor:pointer;text-align:center;font-size:12px;transition:all .15s;min-height:40px;display:flex;align-items:center;justify-content:center">${w.label}</div>
          `).join('')}
        </div>
      </div>
    `;
    HalDo.Win.open('📸 HalDo Blitzer Pro', html, { w: 400, h: 620 });

    setTimeout(() => {
      canvas = document.getElementById('bz-canvas');
      if (!canvas) return;
      canvas.width = 340;
      canvas.height = 340;
      ctx = canvas.getContext('2d');

      // Simulated speed changes
      targetSpeed = 80;
      interval1 = setInterval(() => {
        targetSpeed = 20 + Math.random() * 220;
      }, 3200);

      // Random warnings
      interval2 = setInterval(triggerWarning, 7000);

      if (raf) cancelAnimationFrame(raf);
      animate();

      // Toggle warnings
      document.querySelectorAll('[data-warning]').forEach(el => el.onclick = () => {
        const k = el.dataset.warning;
        warnings[k].on = !warnings[k].on;
        el.style.borderColor = warnings[k].on ? 'var(--accent)' : 'rgba(0,229,255,.2)';
        el.style.background = warnings[k].on ? 'rgba(0,229,255,.15)' : 'rgba(0,229,255,.05)';
        HalDo.Sound.play('tap');
      });
    }, 100);
  };

  const stop = () => {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (interval1) clearInterval(interval1);
    if (interval2) clearInterval(interval2);
  };

  return { open: openApp, stop };
})();

    { re: /danke|thanks|spas/i, r: () => pick(['Gerne, Bruder! 💙', 'Immer wieder! 🦚', 'Kein Problem!']) },
    { re: /tschüss|auf wiedersehen|bye|bi xatirê/i, r: 'Bis bald, Bruder! Ich bin hier wenn du mich brauchst. 👋' },
    { re: /hilfe|help|was kannst du/i, r: 'Ich kann helfen bei: 🦚 Êzîdî-Wissen · 🌤 Wetter · 🕐 Zeit · 🧮 Rechnen · 🚗 Fahrschule · 📸 Blitzer · 🧭 Navigation · 💬 Smalltalk. Frag einfach drauflos!' },
    { re: /zeit|uhrzeit/i, r: () => 'Es ist ' + new Date().toLocaleTimeString('de-DE') + ' Uhr. 🕐' },
    { re: /datum|welcher tag/i, r: () => 'Heute ist ' + new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) },
    { re: /wie spät/i, r: () => 'Es ist ' + new Date().toLocaleTimeString('de-DE') + ' Uhr.' }
  ];
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const handleWeather = async (text) => {
    const cityMatch = text.match(/(?:in|für)\s+([a-zäöüß\-\s]+?)(?:\?|$|\.)/i);
    const city = cityMatch ? cityMatch[1].trim() : 'Berlin';
    try {
      const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=de`).then(r => r.json());
      if (!geo.results || !geo.results[0]) return `Konnte "${city}" nicht finden. Versuch eine andere Stadt.`;
      const loc = geo.results[0];
      const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto`).then(r => r.json());
      const c = w.current;
      return `In ${loc.name} sind es aktuell ${Math.round(c.temperature_2m)}°C, Luftfeuchte ${c.relative_humidity_2m}%, Wind ${c.wind_speed_10m} km/h. 🌤`;
    } catch(e) { return 'Konnte das Wetter gerade nicht laden. Versuch es nochmal.'; }
  };

  const getReply = async (text) => {
    const t = text.toLowerCase().trim();
    for (const p of PATTERNS) {
      if (p.re.test(t)) {
        const r = typeof p.r === 'function' ? p.r() : p.r;
        if (r === 'WETTER') return await handleWeather(text);
        if (r === 'FAHRSCHULE') { setTimeout(() => HalDo.Fahrschule.open(), 700); return 'Ich öffne die Fahrschule für dich! 🚗'; }
        if (r === 'BLITZER') { setTimeout(() => HalDo.Blitzer.open(), 700); return 'Blitzer-Warnung aktiviert! 📸'; }
        if (r === 'NAVIGATION') { setTimeout(() => HalDo.Navigation.open(), 700); return 'Navigation wird geöffnet! 🧭'; }
        if (r === 'EZIDI') { setTimeout(() => HalDo.Ezidi.open(), 700); return 'Êzîdî-Wissen wird geladen! 🦚'; }
        return r;
      }
    }
    // Math
    const math = t.match(/(-?\d+(?:\.\d+)?)\s*([-+*/])\s*(-?\d+(?:\.\d+)?)/);
    if (math) {
      try { return `${math[1]} ${math[2]} ${math[3]} = ${eval(math[0])} 🧮`; } catch(e) {}
    }
    return pick([
      'Interessant, Bruder! 🤔 Ich lerne noch. Frag mich z.B. "Wie ist das Wetter?", "Erzähl über Melek Taus", "Wie spät ist es?" oder "Fahrschule".',
      'Das kann ich noch nicht — aber schau mal in die Apps! 📱',
      'Hmm, dazu weiß ich noch nicht genug. Frag mich über Êzîdî, Wetter, oder Rechnen! 🦚'
    ]);
  };

  let currentWindowId = null;
  const speak = (text) => {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE';
      u.rate = 0.95; u.pitch = 1.05;
      u.onstart = () => { try { HalDo.Avatar.setState('speaking'); } catch(e) {} };
      u.onend = () => { try { HalDo.Avatar.setState('idle'); } catch(e) {} };
      window.speechSynthesis.speak(u);
    } catch(e) {}
  };

  const open = () => {
    const html = `
      <div style="display:flex;flex-direction:column;height:100%;gap:6px">
        <canvas id="avatar-canvas" width="240" height="320" style="width:120px;height:160px;display:block;margin:0 auto;border-radius:20px"></canvas>
        <div style="text-align:center">
          <div id="avatar-mode-btn" style="display:inline-block;cursor:pointer;font-size:11px;padding:5px 12px;border-radius:20px;background:rgba(0,229,255,.15);border:1px solid var(--border)">🤖 Human-Modus</div>
        </div>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input">
          <input id="chat-input" placeholder="Sag Hi HalDo, Hey HalDo…" />
          <button id="chat-mic" title="Sprechen">🎤</button>
          <button id="chat-send">➤</button>
        </div>
      </div>
    `;
    HalDo.Win.open('🤖 HalDo AI', html, { w: 420, h: 620 });
    setTimeout(() => {
      const c = document.getElementById('avatar-canvas');
      if (c && HalDo.Avatar) HalDo.Avatar.init(c);

      const modeBtn = document.getElementById('avatar-mode-btn');
      if (modeBtn) {
        modeBtn.onclick = () => {
          const m = HalDo.Avatar.getMode ? HalDo.Avatar.getMode() : 'human';
          if (HalDo.Avatar.setMode) HalDo.Avatar.setMode(m === 'human' ? 'cyborg' : 'human');
          modeBtn.textContent = m === 'human' ? '⚡ Cyborg-Modus' : '🤖 Human-Modus';
          HalDo.Sound.play('whoosh');
        };
      }

      const log = document.getElementById('chat-log');
      const input = document.getElementById('chat-input');
      const send = document.getElementById('chat-send');
      const mic = document.getElementById('chat-mic');

      const addMsg = (text, who) => {
        const m = document.createElement('div');
        m.className = 'msg ' + who;
        m.textContent = text;
        log.appendChild(m);
        log.scrollTop = log.scrollHeight;
      };

      addMsg('Hallo Bruder! Ich bin HalDo AI. Frag mich über Êzîdî, Wetter, Fahrschule, Blitzer, Navigation, oder sag einfach "Hi HalDo". 🦚', 'ai');
      setTimeout(() => speak('Hallo Bruder. Ich bin HalDo AI. Wie kann ich dir helfen?'), 400);

      const handleSend = async () => {
        const t = input.value.trim();
        if (!t) return;
        addMsg(t, 'user');
        input.value = '';
        HalDo.Sound.play('chat');
        try { HalDo.Avatar.setState('thinking'); } catch(e) {}
        const r = await getReply(t);
        addMsg(r, 'ai');
        try { HalDo.Avatar.setState('idle'); } catch(e) {}
        speak(r);
      };

      send.onclick = handleSend;
      input.onkeydown = e => { if (e.key === 'Enter') handleSend(); };

      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        try {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SR();
          rec.lang = 'de-DE'; rec.continuous = false; rec.interimResults = false;
          rec.onresult = e => { input.value = e.results[0][0].transcript; handleSend(); };
          rec.onerror = () => HalDo.Toast.show('🎤 Erkennung fehlgeschlagen', 1500, 'error');
          mic.onclick = () => {
            try {
              rec.start();
              HalDo.Toast.show('🎤 Höre zu…', 1500, 'tap');
              try { HalDo.Avatar.setState('listening'); } catch(e) {}
            } catch(e) {}
          };
        } catch(e) {}
      }
    }, 100);
  };

  return { open, speak };
})();

<script>
/* ================================================================
   ▶ 1) WINDOW-MANAGER v2 — schieben, minimieren, maximieren, RESIZE
   ================================================================ */
HalDo.Win = (() => {
  let zCounter = 200;
  const layer = () => document.getElementById('winLayer');
  const focus = (w) => {
    document.querySelectorAll('.window').forEach(x => x.classList.remove('active'));
    w.classList.add('active'); w.style.zIndex = ++zCounter;
  };
  const open = (title, contentHTML, opts = {}) => {
    const id = 'w_' + Date.now() + Math.random().toString(36).slice(2, 6);
    const w = document.createElement('div');
    w.className = 'window'; w.id = id;
    const vw = window.innerWidth, vh = window.innerHeight;
    const wid = opts.w || Math.min(520, vw - 30);
    const hgt = opts.h || Math.min(620, vh - 160);
    w.style.width = wid + 'px'; w.style.height = hgt + 'px';
    w.style.left = Math.max(10, (vw - wid) / 2 + (Math.random() * 40 - 20)) + 'px';
    w.style.top = Math.max(70, (vh - hgt) / 2 + (Math.random() * 40 - 20)) + 'px';
    w.innerHTML = `
      <div class="win-header">
        <div class="win-title">${title}</div>
        <div class="win-btn" data-act="min" title="Minimieren">–</div>
        <div class="win-btn" data-act="max" title="Maximieren">⛶</div>
        <div class="win-btn" data-act="close" style="z-index:999999" title="Schließen">✕</div>
      </div>
      <div class="win-body">${contentHTML}</div>
      <div class="win-resize" style="position:absolute;bottom:0;right:0;width:22px;height:22px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--accent) 50%);opacity:.55;border-bottom-right-radius:18px;z-index:5"></div>
    `;
    layer().appendChild(w);
    w.style.zIndex = ++zCounter;
    focus(w);

    // Drag (header middle zone)
    const h = w.querySelector('.win-header');
    const startDrag = (e) => {
      if (w.dataset.maxed === '1') return;
      e.preventDefault();
      const isT = e.type.startsWith('touch');
      const p = isT ? e.touches[0] : e;
      const r = w.getBoundingClientRect();
      const sx = p.clientX, sy = p.clientY, sl = r.left, st = r.top;
      const move = (ev) => {
        const q = isT ? ev.touches[0] : ev;
        w.style.left = Math.max(0, Math.min(window.innerWidth - r.width, sl + q.clientX - sx)) + 'px';
        w.style.top = Math.max(60, Math.min(window.innerHeight - 90, st + q.clientY - sy)) + 'px';
      };
      const up = () => {
        window.removeEventListener('mousemove', move); window.removeEventListener('touchmove', move);
        window.removeEventListener('mouseup', up); window.removeEventListener('touchend', up);
      };
      window.addEventListener('mousemove', move); window.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('mouseup', up); window.addEventListener('touchend', up);
    };
    h.addEventListener('mousedown', startDrag);
    h.addEventListener('touchstart', startDrag, { passive: false });
    w.addEventListener('mousedown', () => focus(w));
    w.addEventListener('touchstart', () => focus(w), { passive: true });

    // Resize
    const rs = w.querySelector('.win-resize');
    const startResize = (e) => {
      if (w.dataset.maxed === '1') return;
      e.preventDefault(); e.stopPropagation();
      const isT = e.type.startsWith('touch');
      const p = isT ? e.touches[0] : e;
      const r = w.getBoundingClientRect();
      const sx = p.clientX, sy = p.clientY, sw = r.width, sh = r.height;
      const move = (ev) => {
        const q = isT ? ev.touches[0] : ev;
        w.style.width = Math.max(280, sw + q.clientX - sx) + 'px';
        w.style.height = Math.max(200, sh + q.clientY - sy) + 'px';
      };
      const up = () => {
        window.removeEventListener('mousemove', move); window.removeEventListener('touchmove', move);
        window.removeEventListener('mouseup', up); window.removeEventListener('touchend', up);
      };
      window.addEventListener('mousemove', move); window.addEventListener('touchmove', move, { passive: false });
      window.addEventListener('mouseup', up); window.addEventListener('touchend', up);
    };
    rs.addEventListener('mousedown', startResize);
    rs.addEventListener('touchstart', startResize, { passive: false });

    // Min / Max / Close
    w.querySelector('[data-act="close"]').onclick = (e) => { e.stopPropagation(); close(id); };
    w.querySelector('[data-act="min"]').onclick = (e) => { e.stopPropagation(); w.style.display = 'none'; w.dataset.min = '1'; };
    w.querySelector('[data-act="max"]').onclick = (e) => {
      e.stopPropagation();
      if (w.dataset.maxed === '1') {
        w.style.left = w.dataset.ol; w.style.top = w.dataset.ot;
        w.style.width = w.dataset.ow; w.style.height = w.dataset.oh;
        w.dataset.maxed = '0';
      } else {
        w.dataset.ol = w.style.left; w.dataset.ot = w.style.top;
        w.dataset.ow = w.style.width; w.dataset.oh = w.style.height;
        w.style.left = '0px'; w.style.top = 'calc(56px + var(--safe-t))';
        w.style.width = '100vw';
        w.style.height = 'calc(100vh - 56px - 72px - var(--safe-t) - var(--safe-b))';
        w.dataset.maxed = '1';
      }
    };
    HalDo.Sound.play('whoosh');
    return id;
  };
  const close = (id) => {
    const w = document.getElementById(id);
    if (w) {
      w.style.transition = 'opacity .2s,transform .2s';
      w.style.opacity = '0'; w.style.transform = 'scale(.9)';
      setTimeout(() => w.remove(), 220);
      HalDo.Sound.play('tap');
    }
  };
  return { open, close, focus };
})();

          ['Berlin', 'Europe/Berlin'], ['London', 'Europe/London'], ['New York', 'America/New_York'],
          ['Tokyo', 'Asia/Tokyo'], ['Istanbul', 'Europe/Istanbul'], ['Erbil', 'Asia/Baghdad']
        ];
        let html = '<div style="padding:8px">';
        zones.forEach(([n, z]) => {
          html += `<div style="padding:10px;background:rgba(0,229,255,.08);border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between"><span>${n}</span><span style="color:var(--accent)">${new Date().toLocaleTimeString('de-DE', { timeZone: z })}</span></div>`;
        });
        html += '</div>';

  ];

  const renderRow = (row) => {
    const id = 'set_' + Math.random().toString(36).slice(2, 8);
    const saved = get(row.label, row.def);
    if (row.type === 'toggle') {
      return `<div class="set-row"><label>${row.label}</label>
        <div class="toggle ${saved ? 'on' : ''}" data-set="${row.label}" data-type="toggle"></div></div>`;
    }
    if (row.type === 'slider') {
      return `<div class="set-row"><label>${row.label}</label>
        <input type="range" min="${row.min || 0}" max="${row.max || 100}" value="${saved || row.def}" data-set="${row.label}" data-type="slider" style="width:110px;accent-color:var(--accent)">
        <span style="font-size:11px;min-width:32px;text-align:right;color:var(--accent)" id="${id}_val">${saved || row.def}</span></div>`;
    }
    if (row.type === 'select') {
      return `<div class="set-row"><label>${row.label}</label>
        <select data-set="${row.label}" data-type="select" style="padding:6px 10px;border-radius:10px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:12px;max-width:130px">
          ${(row.options || []).map(o => `<option ${saved === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select></div>`;
    }
    if (row.type === 'chips') {
      return `<div class="set-row"><label>${row.label}</label>
        <div class="chip-group">${(row.options || []).map(o => `<div class="chip ${saved === o ? 'active' : ''}" data-set="${row.label}" data-type="chip" data-val="${o}">${o}</div>`).join('')}</div></div>`;
    }
    if (row.type === 'color') {
      return `<div class="set-row"><label>${row.label}</label>
        <input type="color" value="${saved || row.def}" data-set="${row.label}" data-type="color" style="width:44px;height:32px;border:none;background:none;cursor:pointer"></div>`;
    }
    if (row.type === 'info') {
      return `<div class="set-row"><label>${row.label}</label><span style="font-size:12px;opacity:.7">${row.def}</span></div>`;
    }
    if (row.type === 'button') {
      return `<div class="set-row"><label>${row.label}</label>
        <button class="chip" data-act-btn="${row.label}">Öffnen</button></div>`;
    }
    if (row.type === 'text') {
      return `<div class="set-row"><label>${row.label}</label>
        <input value="${saved || row.def}" data-set="${row.label}" data-type="text" style="padding:6px 10px;border-radius:10px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:12px;max-width:130px"></div>`;
    }
    return '';
  };

  const bindRow = (row, root) => {
    const el = root.querySelector(`[data-set="${CSS.escape(row.label)}"]`);
    if (!el) return;
    if (row.type === 'toggle') {
      el.onclick = () => {
        el.classList.toggle('on');
        const v = el.classList.contains('on');
        save({ [row.label]: v });
        if (row.onSet) row.onSet(v);
        HalDo.Sound.play('tap');
      };
    } else if (row.type === 'slider') {
      el.oninput = () => {
        const v = parseInt(el.value);
        const valSpan = root.querySelector('#' + el.id + '_val') || el.nextElementSibling;
        if (valSpan && valSpan.textContent !== undefined) valSpan.textContent = v;
        save({ [row.label]: v });
        if (row.onSet) row.onSet(v);
      };
    } else if (row.type === 'select') {
      el.onchange = () => { save({ [row.label]: el.value }); if (row.onSet) row.onSet(el.value); HalDo.Sound.play('tap'); };
    } else if (row.type === 'color') {
      el.oninput = () => { save({ [row.label]: el.value }); if (row.onSet) row.onSet(el.value); };
    } else if (row.type === 'text') {
      el.onchange = () => { save({ [row.label]: el.value }); if (row.onSet) row.onSet(el.value); };
    }
    const chips = root.querySelectorAll(`[data-set="${CSS.escape(row.label)}"][data-type="chip"]`);
    chips.forEach(c => c.onclick = () => {
      chips.forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      save({ [row.label]: c.dataset.val });
      if (row.onSet) row.onSet(c.dataset.val);
      HalDo.Sound.play('tap');
    });
    if (row.type === 'button' && row.action) {
      const btn = root.querySelector(`[data-act-btn="${CSS.escape(row.label)}"]`);
      if (btn) btn.onclick = () => { row.action(); HalDo.Sound.play('tap'); };
    }
  };

  const open = () => {
    const html = `
      <div style="padding:4px">
        <div style="padding:10px 12px;background:rgba(0,229,255,.08);border-radius:12px;margin-bottom:12px;font-size:12px;text-align:center">
          ⚙️ <strong style="color:var(--accent)">HalDo AI OS — Einstellungen A–Z</strong><br>
          <span style="opacity:.7">Alle Funktionen sind sofort aktiv</span>
        </div>
        ${SECTIONS.map(s => `
          <div class="set-section" data-key="${s.key}">
            <div class="set-head">${s.title}<span>▾</span></div>
            <div class="set-body">${s.rows.map(renderRow).join('')}</div>
          </div>
        `).join('')}
      </div>
    `;
    HalDo.Win.open('⚙️ Einstellungen A–Z', html, { w: 540, h: 660 });
    setTimeout(() => {
      SECTIONS.forEach(s => {
        const sec = document.querySelector(`.set-section[data-key="${s.key}"]`);
        if (!sec) return;
        sec.querySelector('.set-head').onclick = () => sec.classList.toggle('open');
        s.rows.forEach(r => bindRow(r, sec));
      });
    }, 100);
  };
  return { open };
})();

HalDo.Calc = {
  open() {
    let scientific = false;
    const html = `
      <div style="padding:8px">
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <div class="chip active" data-calc-mode="std" style="flex:1;text-align:center">Standard</div>
          <div class="chip" data-calc-mode="sci" style="flex:1;text-align:center">Wissenschaftlich</div>
        </div>
        <input id="calc-input" placeholder="z.B. 2+2*3" style="width:100%;padding:14px;border-radius:12px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:22px;margin-bottom:8px;text-align:right;font-family:monospace">
        <div id="calc-result" style="text-align:right;font-size:18px;color:var(--accent);min-height:28px;margin-bottom:10px;font-family:monospace"></div>
        <div id="calc-history" style="text-align:right;font-size:11px;opacity:.5;min-height:20px;margin-bottom:8px;max-height:60px;overflow-y:auto"></div>
        <div id="calc-pad-std" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
          ${['C','⌫','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','='].map(k => `<button class="chip calc-btn" data-k="${k}" style="height:52px;font-size:16px">${k}</button>`).join('')}
        </div>
        <div id="calc-pad-sci" style="display:none;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px">
          ${['sin','cos','tan','log','ln','√','x²','π','e','!','(' ,')'].map(k => `<button class="chip calc-btn" data-k="${k}" style="height:40px;font-size:12px">${k}</button>`).join('')}
        </div>
      </div>
    `;
    HalDo.Win.open('🧮 Calculator Pro', html, { w: 380, h: 620 });
    setTimeout(() => {
      const inp = document.getElementById('calc-input');
      const res = document.getElementById('calc-result');
      const hist = document.getElementById('calc-history');
      const historyList = [];
      const evalExpr = () => {
        try {
          let v = inp.value.replace(/[^0-9+\-*/.() ]/g, '');
          if (!v) { res.textContent = ''; return; }
          v = v.replace(/sin/g, 'Math.sin').replace(/cos/g, 'Math.cos').replace(/tan/g, 'Math.tan')
               .replace(/log/g, 'Math.log10').replace(/ln/g, 'Math.log')
               .replace(/√/g, 'Math.sqrt').replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E');
          const r = Function('"use strict"; return (' + v + ')')();
          res.textContent = '= ' + (Math.round(r * 1e10) / 1e10);
        } catch(e) { res.textContent = ''; }
      };
      inp.oninput = evalExpr;
      document.querySelectorAll('[data-calc-mode]').forEach(el => el.onclick = () => {
        document.querySelectorAll('[data-calc-mode]').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        scientific = el.dataset.calcMode === 'sci';
        document.getElementById('calc-pad-sci').style.display = scientific ? 'grid' : 'none';
      });
      document.querySelectorAll('.calc-btn').forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        HalDo.Sound.play('tap');
        if (k === 'C') { inp.value = ''; res.textContent = ''; }
        else if (k === '⌫') { inp.value = inp.value.slice(0, -1); evalExpr(); }
        else if (k === '=') {
          evalExpr();
          if (res.textContent) {
            historyList.unshift(inp.value + ' ' + res.textContent);
            hist.innerHTML = historyList.slice(0, 5).map(h => `<div>${h}</div>`).join('');
          }
        }
        else if (k === '√') { inp.value += '√('; }
        else if (k === 'x²') { inp.value += '²'; }
        else if (k === '!') { inp.value += '!'; }
        else if (k === 'π' || k === 'e') { inp.value += k; }
        else { inp.value += k; evalExpr(); }
      });
    }, 100);
  }
};

    ];
    const html = `
      <div style="padding:6px">
        <div style="display:flex;gap:6px;margin-bottom:10px">
          <select id="tr-from" style="flex:1;padding:10px;border-radius:10px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:13px">

          <select id="tr-to" style="flex:1;padding:10px;border-radius:10px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:13px">
            ${LANGS.slice(1).map(([c, n]) => `<option value="${c}" ${c === 'en' ? 'selected' : ''}>${n}</option>`).join('')}
          </select>
        </div>
        <textarea id="tr-input" placeholder="Text eingeben…" style="width:100%;height:100px;padding:12px;border-radius:12px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:14px;resize:none;font-family:inherit;margin-bottom:8px"></textarea>
        <button id="tr-go" class="chip active" style="width:100%;padding:12px;margin-bottom:8px">🌐 Übersetzen</button>
        <div id="tr-out" style="padding:14px;background:rgba(0,229,255,.08);border-radius:12px;border:1.5px solid var(--border);min-height:80px;font-size:14px;line-height:1.6;margin-bottom:8px">Ergebnis erscheint hier…</div>
        <div style="display:flex;gap:6px">
          <button id="tr-speak" class="chip" style="flex:1;padding:10px">🔊 Vorlesen</button>
          <button id="tr-copy" class="chip" style="flex:1;padding:10px">📋 Kopieren</button>
        </div>
        <div style="margin-top:12px;padding:10px;background:rgba(255,180,60,.1);border-radius:10px;border:1px solid rgba(255,180,60,.3);font-size:11px;line-height:1.5">
          💡 Nutzt MyMemory API (kostenlos, keine Anmeldung)
        </div>
      </div>
    `;
    HalDo.Win.open('🌐 HalDo Translator Pro', html, { w: 440, h: 640 });
    setTimeout(() => {
      const from = document.getElementById('tr-from');
      const to = document.getElementById('tr-to');
      const inp = document.getElementById('tr-input');
      const out = document.getElementById('tr-out');
      const doTranslate = async () => {
        const text = inp.value.trim();
        if (!text) return;
        out.textContent = 'Übersetze…';
        try {
          const fromLang = from.value === 'auto' ? 'de' : from.value;
          const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromLang}|${to.value}`;
          const data = await fetch(url).then(r => r.json());
          if (data.responseData) {
            out.textContent = data.responseData.translatedText;
            HalDo.Sound.play('success');
          } else out.textContent = 'Fehler bei Übersetzung';
        } catch(e) { out.textContent = 'Netzwerkfehler'; }
      };
      document.getElementById('tr-go').onclick = doTranslate;
      document.getElementById('tr-swap').onclick = () => {
        const a = from.value, b = to.value;
        if (a !== 'auto') from.value = b; to.value = a === 'auto' ? 'de' : a;
      };
      document.getElementById('tr-speak').onclick = () => {
        const text = out.textContent;
        if (!text || text === 'Ergebnis erscheint hier…') return;
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = { de:'de-DE', en:'en-US', ar:'ar-SA', tr:'tr-TR', ru:'ru-RU', fr:'fr-FR', es:'es-ES', it:'it-IT', zh:'zh-CN', ja:'ja-JP', he:'he-IL', fa:'fa-IR' }[to.value] || 'en-US';
          window.speechSynthesis.speak(u);
        } catch(e) {}
      };
      document.getElementById('tr-copy').onclick = () => {
        navigator.clipboard.writeText(out.textContent).then(() => HalDo.Toast.show('📋 Kopiert', 1200, 'success'));
      };
    }, 100);
  }
};

    const doDrag = (startE, isTouch) => {
      if (w.classList.contains('maximized')) return;
      if (startE.target.closest('button')) return;
      const p = isTouch ? startE.touches[0] : startE;
      const r = w.getBoundingClientRect();
      const sx = p.clientX, sy = p.clientY, sl = r.left, st = r.top;
      const move = (ev) => {
        const q = isTouch ? ev.touches[0] : ev;
        w.style.left = Math.max(-r.width + 100, Math.min(vw - 100, sl + q.clientX - sx)) + 'px';
        w.style.top = Math.max(56, Math.min(vh - 80, st + q.clientY - sy)) + 'px';
      };
      const up = () => {
        document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
        document.removeEventListener('touchmove', move); document.removeEventListener('touchend', up);
      };
      if (isTouch) { document.addEventListener('touchmove', move, { passive: true }); document.addEventListener('touchend', up); }
      else { document.addEventListener('mousemove', move); document.addEventListener('mouseup', up); }
    };
    h.addEventListener('mousedown', (e) => { e.preventDefault(); doDrag(e, false); });
    h.addEventListener('touchstart', (e) => doDrag(e, true), { passive: true });
    h.addEventListener('dblclick', (e) => { if (!e.target.closest('button')) toggleMax(w); });

    // Resize handles
    w.querySelectorAll('.rs').forEach(handle => {
      const dir = handle.dataset.rs;
      handle.addEventListener('mousedown', (e) => {
        if (w.classList.contains('maximized')) return;
        e.preventDefault(); e.stopPropagation();
        const r = w.getBoundingClientRect();
        const sx = e.clientX, sy = e.clientY;
        const move = (ev) => {
          const dx = ev.clientX - sx, dy = ev.clientY - sy;
          let nl = r.left, nt = r.top, nw2 = r.width, nh = r.height;
          if (dir.includes('e')) nw2 = Math.max(320, r.width + dx);
          if (dir.includes('s')) nh = Math.max(240, r.height + dy);
          if (dir.includes('w')) { nw2 = Math.max(320, r.width - dx); nl = r.left + (r.width - nw2); }
          if (dir.includes('n')) { nh = Math.max(240, r.height - dy); nt = r.top + (r.height - nh); }
          w.style.left = nl + 'px'; w.style.top = nt + 'px';
          w.style.width = nw2 + 'px'; w.style.height = nh + 'px';
        };
        const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
        document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
      });
    });

    w.querySelector('.wc-close').onclick = (e) => { e.stopPropagation(); close(id); };
    w.querySelector('.wc-min').onclick = (e) => {
      e.stopPropagation();
      w.style.transition = 'transform .25s, opacity .25s';
      w.style.transform = 'scale(.4) translateY(200px)';
      w.style.opacity = '0';
      setTimeout(() => { w.style.display = 'none'; w.style.transform = ''; w.style.opacity = ''; showMin(id, title); }, 250);
    };
    w.querySelector('.wc-max').onclick = (e) => { e.stopPropagation(); toggleMax(w); };
    w.addEventListener('mousedown', () => focus(w));
    try { HalDo.Sound.play('whoosh'); } catch(e) {}
    return id;
  };
  HalDo.Win = { open, close, focus };
  console.log('✅ Win PRO: 8 Resize-Griffe · Maximize · Minimize-Dock');
})();

            else { isBreak = false; remain = workMin * 60; modeEl.textContent = 'FOKUS'; modeEl.style.color = 'var(--accent)'; }
            HalDo.Sound.play('alarm');
            HalDo.Toast.show(isBreak ? '☕ Pause!' : '🎯 Fokus!', 3000, 'alarm');

          update();
        }, 1000);
      };
      document.getElementById('pm-reset').onclick = () => {

      });

        if (!keys.length) { list.innerHTML = '<p style="text-align:center;opacity:.5;padding:20px">Keine Dateien</p>'; return; }
        list.innerHTML = keys.map(k => {
          const size = (localStorage.getItem(k) || '').length;
          return `<div style="padding:10px;background:rgba(0,229,255,.06);border-radius:10px;margin-bottom:6px;border:1px solid rgba(0,229,255,.2);display:flex;justify-content:space-between;align-items:center;font-size:12px">

          const f = e.target.files[0]; if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              Object.entries(data).forEach(([k, v]) => { if (k.startsWith('haldo_')) localStorage.setItem(k, v); });
              HalDo.Toast.show('📥 Importiert', 1500, 'success');
              render();
            } catch(err) { HalDo.Toast.show('Fehler beim Import', 1500, 'error'); }
          };
          reader.readAsText(f);
        };
        inp.click();
      };
    }, 100);
  }
};

HalDo.VoiceMemos = {
  open() {
    const KEY = 'haldo_voicememos_v1';
    const all = () => HalDo.Store.get(KEY, []);
    const save = (arr) => HalDo.Store.set(KEY, arr);
    const render = (root) => {
      const memos = all();
      root.innerHTML = `
        <div style="padding:8px">
          <div style="text-align:center;margin-bottom:14px">
            <button id="vm-rec" class="chip active" style="padding:16px 28px;font-size:16px">🎤 Aufnahme starten</button>
            <div id="vm-status" style="font-size:11px;opacity:.6;margin-top:8px">Bereit</div>
          </div>
          <div style="max-height:380px;overflow-y:auto">
            ${memos.length === 0 ? '<p style="text-align:center;opacity:.5;padding:20px">Noch keine Memos</p>' :
              memos.map((m, i) => `<div style="padding:10px;background:rgba(0,229,255,.06);border-radius:10px;margin-bottom:6px;border:1px solid rgba(0,229,255,.2);font-size:12px;display:flex;justify-content:space-between;align-items:center">
                <div>
                  <div style="color:var(--accent);font-weight:600">Memo #${memos.length - i}</div>
                  <div style="opacity:.6;margin-top:2px">${new Date(m.ts).toLocaleString('de-DE')} · ${m.dur}s</div>
                </div>
                <div style="display:flex;gap:4px">
                  <button data-play="${i}" class="chip" style="font-size:11px">▶</button>
                  <button data-del="${i}" class="chip" style="font-size:11px">🗑</button>
                </div>
              </div>`).join('')}
          </div>
        </div>
      `;
      let recorder = null, chunks = [], startTime = null, isRecording = false;
      root.querySelector('#vm-rec').onclick = async () => {
        if (isRecording) {
          recorder.stop(); isRecording = false;
          root.querySelector('#vm-rec').textContent = '🎤 Aufnahme starten';
          root.querySelector('#vm-status').textContent = 'Bereit';
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recorder = new MediaRecorder(stream);
          chunks = [];
          startTime = Date.now();
          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = () => {
            const dur = Math.round((Date.now() - startTime) / 1000);
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onload = () => {
              const arr = all();
              arr.unshift({ data: reader.result, dur, ts: Date.now() });
              save(arr); render(root);
            };
            reader.readAsDataURL(blob);
            stream.getTracks().forEach(t => t.stop());
          };
          recorder.start();
          isRecording = true;
          root.querySelector('#vm-rec').textContent = '⏹ Stoppen';
          root.querySelector('#vm-status').textContent = '🔴 Aufnahme läuft...';
        } catch(e) { HalDo.Toast.show('Mikrofon verweigert', 2000, 'error'); }
      };
      root.querySelectorAll('[data-play]').forEach(el => el.onclick = () => {
        const m = memos[parseInt(el.dataset.play)];
        if (!m) return;
        const a = new Audio(m.data); a.play();
      });
      root.querySelectorAll('[data-del]').forEach(el => el.onclick = () => {
        const arr = all(); arr.splice(parseInt(el.dataset.del), 1); save(arr); render(root);
      });
    };
    HalDo.Win.open('🎙 Voice Memos', '<div id="vm-root"></div>', { w: 420, h: 560 });
    setTimeout(() => render(document.getElementById('vm-root')), 80);
  }
};

HalDo.FahrschuleSim = {

    const html = `
      <div style="padding:8px;text-align:center">

          <div style="font-size:11px;line-height:1.7;margin-top:6px;text-align:left;opacity:.85">
            ✓ Keine Rückmeldung während der Prüfung<br>
            ✓ Antworten werden am Ende ausgewertet<br>
            ✓ Timer läuft die ganze Zeit
          </div>
        </div>
        <button id="fs-start" class="chip active" style="padding:14px 28px;font-size:14px">🎯 Prüfung starten</button>
      </div>
    `;
    HalDo.Win.open('🚗 Fahrschule Prüfung', html, { w: 460, h: 560 });
    setTimeout(() => {
      document.getElementById('fs-start').onclick = () => {
        let idx = 0, answers = [], startTime = Date.now(), timerInterval;
        const totalTime = 15 * 60 * 1000;
        const renderQ = () => {
          const w = document.querySelector('.win-pro.active');
          if (!w) return;
          const body = w.querySelector('.win-body-pro');
          if (idx >= Q.length) {
            clearInterval(timerInterval);
            const correct = answers.filter((a, i) => a === Q[i].c).length;
            const pct = Math.round((correct / Q.length) * 100);
            const time = Math.round((Date.now() - startTime) / 1000);
            body.innerHTML = `
              <div style="padding:20px;text-align:center">
                <div style="font-size:64px">${pct >= 80 ? '🎉' : '📚'}</div>
                <h2 style="font-size:26px;color:${pct >= 80 ? '#00ff88' : '#ff8800'};margin:8px 0">${pct}%</h2>
                <p style="opacity:.8">${correct} von ${Q.length} richtig · ${time}s</p>
                <p style="margin-top:6px;font-size:13px;${pct >= 80 ? 'color:#00ff88' : 'color:#ff8800'}">${pct >= 80 ? '🎉 BESTANDEN!' : 'Nicht bestanden — nochmal üben!'}</p>
                <div style="margin-top:16px;max-height:200px;overflow-y:auto;text-align:left">
                  ${Q.map((q, i) => {
                    const ok = answers[i] === q.c;
                    return `<div style="padding:6px;background:${ok ? 'rgba(0,255,136,.08)' : 'rgba(255,80,80,.08)'};border-radius:8px;margin-bottom:4px;font-size:11px;border-left:3px solid ${ok ? '#00ff88' : '#ff5050'}">
                      ${ok ? '✓' : '✗'} ${q.q.slice(0, 60)}${q.q.length > 60 ? '…' : ''}
                    </div>`;
                  }).join('')}
                </div>
                <button id="fs-again" class="chip active" style="margin-top:14px;padding:12px 24px">🔄 Nochmal</button>
              </div>
            `;
            body.querySelector('#fs-again').onclick = () => HalDo.FahrschuleSim.open();
            return;
          }
          const q = Q[idx];
          body.innerHTML = `
            <div style="padding:6px">
              <div style="display:flex;justify-content:space-between;font-size:11px;opacity:.7;margin-bottom:8px">
                <span>${idx + 1}/${Q.length}</span>
                <span id="fs-timer" style="color:var(--accent)"></span>
              </div>
              <div style="height:4px;background:rgba(0,0,0,.4);border-radius:2px;overflow:hidden;margin-bottom:14px">
                <div style="width:${((idx+1)/Q.length)*100}%;height:100%;background:var(--accent)"></div>
              </div>
              <h3 style="font-size:14px;line-height:1.4;margin-bottom:14px">${q.q}</h3>
              <div style="display:flex;flex-direction:column;gap:6px">
                ${q.a.map((opt, i) => `<button data-ans="${i}" style="padding:11px 14px;text-align:left;border-radius:10px;background:rgba(0,229,255,.08);border:1.5px solid rgba(0,229,255,.25);color:var(--text);font-size:13px;cursor:pointer;min-height:44px">${opt}</button>`).join('')}
              </div>
            </div>
          `;
          body.querySelectorAll('[data-ans]').forEach(btn => btn.onclick = () => {
            answers.push(parseInt(btn.dataset.ans));
            idx++;
            HalDo.Sound.play('tap');
            renderQ();
          });
        };
        renderQ();
        timerInterval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const remain = Math.max(0, totalTime - elapsed);
          const m = Math.floor(remain / 60000), s = Math.floor((remain % 60000) / 1000);
          const el = document.getElementById('fs-timer');
          if (el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
          if (remain <= 0) { clearInterval(timerInterval); idx = Q.length; renderQ(); }
        }, 500);
      };
    }, 100);
  }
};

          <input id="ms-input" placeholder="z.B. 2x + 5 = 15" style="width:100%;padding:12px;border-radius:12px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);font-size:16px;font-family:monospace">
        </div>
        <button id="ms-solve" class="chip active" style="width:100%;padding:12px;margin-bottom:12px">🔍 Lösen</button>
        <div id="ms-result" style="padding:14px;background:rgba(0,20,40,.6);border-radius:12px;border:1.5px solid var(--border);min-height:100px;font-size:14px;font-family:monospace"></div>
        <div style="margin-top:14px;font-size:11px;opacity:.6;line-height:1.6">
          Unterstützt:<br>
          • Lineare: 2x + 5 = 15<br>
          • Quadratisch: x² + 3x + 2 = 0<br>
          • Ausdrücke: 2 + 3 * 4
        </div>
      </div>
    `;
    HalDo.Win.open('✖️ Math Solver', html, { w: 420, h: 560 });
    setTimeout(() => {
      document.getElementById('ms-solve').onclick = () => {
        const inp = document.getElementById('ms-input').value.trim();
        const res = document.getElementById('ms-result');
        if (!inp) { res.textContent = 'Gib eine Gleichung ein'; return; }
        try {
          // Quadratic: ax² + bx + c = 0
          const quadMatch = inp.match(/(-?\d*)x²\s*([+-]\s*\d*)x\s*([+-]\s*\d+)\s*=\s*0?/i);
          if (quadMatch) {
            const a = parseFloat(quadMatch[1]) || 1;
            const b = parseFloat(quadMatch[2].replace(/\s/g, '')) || 0;
            const c = parseFloat(quadMatch[3].replace(/\s/g, '')) || 0;
            const disc = b*b - 4*a*c;
            if (disc < 0) res.innerHTML = `<span style="color:var(--accent)">D = ${disc} < 0</span><br>Keine reellen Lösungen`;
            else {
              const x1 = (-b + Math.sqrt(disc)) / (2*a);
              const x2 = (-b - Math.sqrt(disc)) / (2*a);
              res.innerHTML = `<span style="color:var(--accent)">D = ${disc}</span><br>x₁ = ${x1.toFixed(3)}<br>x₂ = ${x2.toFixed(3)}`;
            }
            return;
          }
          // Linear: ax + b = c
          const linMatch = inp.match(/(-?\d*\.?\d*)x\s*([+-]\s*\d+\.?\d*)?\s*=\s*(-?\d+\.?\d*)/i);
          if (linMatch) {
            const a = parseFloat(linMatch[1]) || 1;
            const b = linMatch[2] ? parseFloat(linMatch[2].replace(/\s/g, '')) : 0;
            const c = parseFloat(linMatch[3]);
            const x = (c - b) / a;
            res.innerHTML = `<span style="color:var(--accent)">x = ${x.toFixed(4)}</span><br>(${a}x + ${b} = ${c})`;
            return;
          }
          // General expression
          const v = inp.replace(/[^0-9+\-*/.() ]/g, '');
          const result = Function('"use strict"; return (' + v + ')')();
          res.innerHTML = `<span style="color:var(--accent)">= ${result}</span>`;
        } catch(e) { res.textContent = 'Fehler beim Lösen'; }
      };
    }, 100);
  }
};

    setTimeout(() => {
      document.getElementById('st-calc').onclick = () => {
        const inp = document.getElementById('st-input').value.trim();
        const nums = inp.split(/[,\s]+/).map(x => parseFloat(x)).filter(x => !isNaN(x));
        const out = document.getElementById('st-out');
        if (nums.length < 1) { out.textContent = 'Gib mindestens eine Zahl ein'; return; }
        nums.sort((a,b) => a-b);
        const n = nums.length;
        const sum = nums.reduce((s,v) => s+v, 0);
        const mean = sum / n;
        const median = n % 2 ? nums[Math.floor(n/2)] : (nums[n/2-1] + nums[n/2]) / 2;
        const freq = {}; nums.forEach(v => freq[v] = (freq[v] || 0) + 1);
        const maxFreq = Math.max(...Object.values(freq));
        const mode = maxFreq > 1 ? Object.keys(freq).filter(k => freq[k] === maxFreq).join(', ') : '—';
        const variance = nums.reduce((s,v) => s + (v-mean)**2, 0) / n;
        const std = Math.sqrt(variance);
        out.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div>Anzahl: <span style="color:var(--accent)">${n}</span></div>
            <div>Summe: <span style="color:var(--accent)">${sum}</span></div>
            <div>Mittelwert: <span style="color:var(--accent)">${mean.toFixed(2)}</span></div>
            <div>Median: <span style="color:var(--accent)">${median.toFixed(2)}</span></div>
            <div>Modus: <span style="color:var(--accent)">${mode}</span></div>
            <div>Std-Abw: <span style="color:var(--accent)">${std.toFixed(2)}</span></div>
            <div>Min: <span style="color:var(--accent)">${nums[0]}</span></div>
            <div>Max: <span style="color:var(--accent)">${nums[n-1]}</span></div>
          </div>
        `;
        HalDo.Sound.play('success');
      };
    }, 100);
  }
};

(function(){
  // Erzeuge Mond-Textur direkt im Browser (nicht herunterladbar, immer verfügbar)
  function makeMoonTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    // Grundfarbe
    ctx.fillStyle = '#8a8a8a'; ctx.fillRect(0, 0, 1024, 512);
    // Dunkle "Maria" (Mondmeere)
    for (let i = 0; i < 20; i++) {
      ctx.fillStyle = `rgba(70,70,70,${0.4 + Math.random()*0.3})`;
      ctx.beginPath();
      ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*120+40, Math.random()*80+30, Math.random()*Math.PI, 0, Math.PI*2);
      ctx.fill();
    }
    // Krater
    for (let i = 0; i < 500; i++) {
      const x = Math.random()*1024, y = Math.random()*512, r = Math.random()*22+2;
      const g = ctx.createRadialGradient(x-r*0.4, y-r*0.4, r*0.1, x, y, r);
      g.addColorStop(0, 'rgba(45,45,45,0.85)');
      g.addColorStop(0.55, 'rgba(110,110,110,0.45)');
      g.addColorStop(0.9, 'rgba(180,180,180,0.15)');
      g.addColorStop(1, 'rgba(160,160,160,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    return c.toDataURL('image/png');
  }
  function makeCloudsTexture() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, 1024, 512);
    for (let i = 0; i < 60; i++) {
      const x = Math.random()*1024, y = Math.random()*512;
      const rx = Math.random()*120+40, ry = Math.random()*40+15;
      const g = ctx.createRadialGradient(x, y, 0, x, y, rx);
      g.addColorStop(0, `rgba(255,255,255,${0.35 + Math.random()*0.3})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, Math.random()*Math.PI, 0, Math.PI*2); ctx.fill();
    }
    return c.toDataURL('image/png');
  }

  const MOON = makeMoonTexture();
  const CLOUDS = makeCloudsTexture();

  if (window.THREE && THREE.TextureLoader) {
    const origLoad = THREE.TextureLoader.prototype.load;
    THREE.TextureLoader.prototype.load = function(url, onLoad, onProgress, onError) {
      if (typeof url === 'string') {
        // Cloud + Moon: komplett durch Canvas-Data-URLs ersetzen (keine Netzwerk-Calls)
        if (url.includes('moon')) url = MOON;
        else if (url.includes('clouds')) url = CLOUDS;
        else url = url.replace('unpkg.com/three-globe', 'cdn.jsdelivr.net/npm/three-globe');
      }
      return origLoad.call(this, url, onLoad, onProgress, onError);
    };
    console.log('✅ Mond + Wolken: 100% Canvas, keine externen URLs mehr');
  }
})();

    {q:'Vor dem Losfahren: Was prüfen?',a:['Spiegel, Gurt, Umfeld','Nur Radio','Nur Handy','Nur Navi'],c:0,cat:'behavior',ex:'Spiegel, Gurt, Umfeld, Sitzposition.'},

    {q:'Kinder unter 12 Jahren: Wo sitzen?',a:['Vorne','Hinten mit Rückhalte','Vorne ohne','Egal'],c:1,cat:'behavior',ex:'Kinder unter 12 (und <150cm): Rückhalte, hinten.'}
  ];

  // ── STATE ──
  let state = { lang: 'de', count: 30, cat: 'all', questions: [], idx: 0, score: 0,
    answers: [], startTime: 0, timer: null, mode: 'exam' };

  const t = (k) => getUI(state.lang)[k] || k;

  // ── SETUP ──
  const renderSetup = (root) => {
    const u = getUI(state.lang);
    root.innerHTML = `

          <div style="font-size:12px;opacity:.7;margin-bottom:6px">🌐 ${u.lang}</div>

        <div style="margin-top:16px;padding:12px;background:rgba(255,180,60,.1);border-radius:12px;border:1px solid rgba(255,180,60,.3);font-size:11px;line-height:1.6">

    root.querySelectorAll('[data-count]').forEach(el => el.onclick = () => { state.count = parseInt(el.dataset.count); renderSetup(root); });
    root.querySelector('#fs-start').onclick = () => startQuiz(root);
  };

  // ── START QUIZ ──
  const startQuiz = (root) => {
    let pool = state.cat === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.cat === state.cat);
    // Mischen
    pool = [...pool].sort(() => Math.random() - 0.5);
    const limit = Math.min(state.count, pool.length);
    state.questions = pool.slice(0, limit);
    state.idx = 0;
    state.score = 0;
    state.answers = [];
    state.startTime = Date.now();
    HalDo.Sound.play('whoosh');
    renderQuestion(root);
  };

  // ── QUESTION ──
  const renderQuestion = (root) => {
    if (state.idx >= state.questions.length) { renderResult(root); return; }
    const q = state.questions[state.idx];
    const u = getUI(state.lang);
    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const mm = String(Math.floor(elapsed/60)).padStart(2,'0');
    const ss = String(elapsed%60).padStart(2,'0');
    const pct = ((state.idx) / state.questions.length) * 100;

    root.innerHTML = `
      <div style="padding:6px">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.85;margin-bottom:8px">
          <span>📝 ${u.question} ${state.idx+1}/${state.questions.length}</span>
          <span style="color:var(--accent)">⏱ ${mm}:${ss}</span>
        </div>
        <div style="height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-bottom:14px">
          <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .3s;box-shadow:0 0 10px var(--accent)"></div>
        </div>

        <div style="padding:14px;background:rgba(0,229,255,.1);border-radius:14px;border:1.5px solid var(--accent);margin-bottom:14px">

          </div>
        </div>

        </div>
      </div>

      speak(q.q + '. ' + q.a.map((a,i) => String.fromCharCode(65+i) + ': ' + a).join('. '));
    };
    root.querySelector('#fs-ai').onclick = () => openAIHelper(q);

    root.querySelectorAll('[data-ans]').forEach(btn => btn.onclick = () => {
      const chosen = parseInt(btn.dataset.ans);
      const correct = chosen === q.c;
      state.answers.push({ chosen, correct });
      if (correct) state.score++;

      // Feedback
      root.querySelectorAll('[data-ans]').forEach((b, i) => {
        b.style.pointerEvents = 'none';
        if (i === q.c) { b.style.background = 'rgba(0,255,136,.3)'; b.style.borderColor = '#00ff88'; }

      });

      HalDo.Sound.play(correct ? 'success' : 'error');
      HalDo.Toast.show(correct ? u.correct : `${u.wrong} → ${q.a[q.c]}`, 2200, correct ? 'success' : 'error');

      nextBtn.className = 'chip active';
      nextBtn.style.cssText = 'width:100%;padding:14px;margin-top:10px;font-size:14px';
      nextBtn.textContent = state.idx + 1 >= state.questions.length ? '🎯 ' + u.finish : '➡ ' + u.next;

      root.appendChild(nextBtn);
    });
  };

  // ── RESULT ──
  const renderResult = (root) => {
    const u = getUI(state.lang);
    const total = state.questions.length;

    const elapsed = Math.floor((Date.now() - state.startTime) / 1000);

      <div style="padding:20px;text-align:center">
        <div style="font-size:72px">${passed ? '🎉' : '📚'}</div>

        <p style="font-size:16px;opacity:.9">${state.score} / ${total} ${u.points}</p>
        <p style="font-size:12px;opacity:.7;margin-top:4px">⏱ ${Math.floor(elapsed/60)} Min ${elapsed%60} Sek</p>
        <p style="margin-top:12px;font-size:15px;font-weight:600;color:${passed?'#00ff88':'#ff8800'}">${passed ? u.passed : u.failed}</p>

            const ok = a && a.correct;
            return `<div style="padding:6px 8px;margin-bottom:4px;border-radius:8px;background:${ok?'rgba(0,255,136,.08)':'rgba(255,80,80,.08)'};border-left:3px solid ${ok?'#00ff88':'#ff5050'};font-size:11px">

            </div>`;
          }).join('')}

          <button id="fs-setup" class="chip" style="padding:12px 20px">⚙️ ${u.setup}</button>
        </div>
      </div>
    `;
    root.querySelector('#fs-again').onclick = () => startQuiz(root);
    root.querySelector('#fs-setup').onclick = () => renderSetup(root);
  };

  // ── TTS ──
  const speak = (text) => {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = getUI(state.lang).tts;
      u.rate = 0.92;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    } catch(e) {}
  };

          <button class="chip" data-ai="answer" style="font-size:11px">✅ ${u.correctAnswer}</button>

          <em style="opacity:.6">Wähle eine Option oben…</em>

        const action = btn.dataset.ai;

            weather:'Wetter ändert alles: Bremsweg, Sicht, Grip. Passe dich an die Bedingungen an.',

    count: 20,
    lang: 'de',
    mode: 'learn', // 'learn' | 'exam'
    questions: [],
    current: 0,
    answers: [],
    startTime: 0,
    timerInterval: null
  };

  /* ---------- TTS ---------- */
  const speak = (text, langCode) => {
    if (!('speechSynthesis' in window)) {
      HalDo.Toast.show('Sprachausgabe nicht verfügbar', 1500, 'error');
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const lang = LANGS.find(l => l.code === langCode);
      u.lang = lang ? lang.tts : 'de-DE';
      u.rate = 0.9;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
      HalDo.Sound.play('tap');
    } catch(e) {}
  };

  const stopSpeak = () => {
    try { window.speechSynthesis.cancel(); } catch(e) {}
  };

  /* ---------- RENDER: Haupt-Menü ---------- */
  const renderMenu = (root) => {
    stopSpeak();
    root.innerHTML = `
      <div style="padding:4px">
        <div style="text-align:center;padding:16px;background:radial-gradient(circle,rgba(0,229,255,.15),transparent);border-radius:16px;margin-bottom:14px">
          <div style="font-size:52px">🚗</div>
          <h2 style="color:var(--accent);font-size:18px;margin-top:6px;text-shadow:0 0 20px var(--accent)">HalDo Fahrschule Pro MAX</h2>
          <p style="font-size:11px;opacity:.7;margin-top:4px">Alle Klassen · Mehrsprachig · KI-Erklärungen</p>
        </div>

        <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--accent)">1️⃣ Führerscheinklasse wählen</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:6px;margin-bottom:16px">
          ${CLASSES.map(c => `
            <div data-cls="${c.id}" style="padding:10px 6px;border-radius:12px;cursor:pointer;text-align:center;
              background:rgba(0,229,255,.06);border:1.5px solid ${state.selectedClass === c.id ? 'var(--accent)' : 'rgba(0,229,255,.25)'};
              ${state.selectedClass === c.id ? 'box-shadow:0 0 14px var(--accent);background:rgba(0,229,255,.2)' : ''};
              transition:all .15s;min-height:74px">
              <div style="font-size:22px">${c.icon}</div>
              <div style="font-weight:700;font-size:14px;color:${state.selectedClass === c.id ? 'var(--accent)' : 'var(--text)'};margin-top:2px">${c.name}</div>
              <div style="font-size:9px;opacity:.65;line-height:1.2;margin-top:2px">${c.full}</div>
            </div>
          `).join('')}
        </div>

        <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--accent)">2️⃣ Anzahl Fragen</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
          ${COUNTS.map(n => `<div class="chip ${state.count === n ? 'active' : ''}" data-count="${n}" style="min-width:52px;justify-content:center;padding:10px 14px;font-size:13px">${n}</div>`).join('')}
        </div>

        <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--accent)">3️⃣ Sprache</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
          ${LANGS.map(l => `<div class="chip ${state.lang === l.code ? 'active' : ''}" data-lang="${l.code}" style="font-size:11px;padding:6px 10px">${l.flag} ${l.name}</div>`).join('')}
        </div>

        <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--accent)">4️⃣ Modus</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
          <div data-mode="learn" style="padding:12px;border-radius:12px;cursor:pointer;text-align:center;
            background:${state.mode === 'learn' ? 'rgba(0,229,255,.2)' : 'rgba(0,229,255,.06)'};
            border:1.5px solid ${state.mode === 'learn' ? 'var(--accent)' : 'rgba(0,229,255,.25)'}">
            <div style="font-size:24px">📖</div>
            <div style="font-size:12px;font-weight:600;margin-top:4px">Lernmodus</div>
            <div style="font-size:10px;opacity:.7">Mit Erklärung</div>
          </div>
          <div data-mode="exam" style="padding:12px;border-radius:12px;cursor:pointer;text-align:center;
            background:${state.mode === 'exam' ? 'rgba(0,229,255,.2)' : 'rgba(0,229,255,.06)'};
            border:1.5px solid ${state.mode === 'exam' ? 'var(--accent)' : 'rgba(0,229,255,.25)'}">
            <div style="font-size:24px">📝</div>
            <div style="font-size:12px;font-weight:600;margin-top:4px">Prüfung</div>
            <div style="font-size:10px;opacity:.7">Am Ende bewerten</div>
          </div>
        </div>

        <button id="fs-start" class="chip active" style="width:100%;padding:16px;font-size:15px;font-weight:600;${!state.selectedClass ? 'opacity:.5;pointer-events:none' : ''}">
          ${state.selectedClass ? `▶ Starten (${state.selectedClass} · ${state.count} Fragen)` : '⬆ Wähle eine Klasse'}
        </button>

        <div style="margin-top:14px;padding:10px;background:rgba(255,180,60,.1);border-radius:10px;border:1px solid rgba(255,180,60,.3);font-size:10px;line-height:1.6">
          💡 <strong>Tipp:</strong> Lernmodus = sofortige Rückmeldung + Erklärung. Prüfungsmodus = Auswertung am Ende mit Timer.<br>
          🔊 Vorlesen in 10 Sprachen · 🧠 KI-Erklärungen zu jeder Frage
        </div>
      </div>
    `;

    root.querySelectorAll('[data-cls]').forEach(el => el.onclick = () => {
      state.selectedClass = el.dataset.cls;
      HalDo.Sound.play('tap');
      renderMenu(root);
    });
    root.querySelectorAll('[data-count]').forEach(el => el.onclick = () => {
      state.count = parseInt(el.dataset.count);
      HalDo.Sound.play('tap');
      renderMenu(root);
    });
    root.querySelectorAll('[data-lang]').forEach(el => el.onclick = () => {
      state.lang = el.dataset.lang;
      HalDo.Sound.play('tap');
      renderMenu(root);
    });
    root.querySelectorAll('[data-mode]').forEach(el => el.onclick = () => {
      state.mode = el.dataset.mode;
      HalDo.Sound.play('tap');
      renderMenu(root);
    });
    const startBtn = root.querySelector('#fs-start');
    if (startBtn) startBtn.onclick = () => startQuiz(root);
  };

  /* ---------- START QUIZ ---------- */
  const startQuiz = (root) => {
    const pool = Q.filter(q => q.cls.includes(state.selectedClass));
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    state.questions = shuffled.slice(0, Math.min(state.count, shuffled.length));
    state.current = 0;
    state.answers = [];
    state.startTime = Date.now();
    if (state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      const t = document.getElementById('fs-timer-top');
      if (t) {
        const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        const m = Math.floor(elapsed / 60), s = elapsed % 60;
        t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
    }, 500);
    renderQuestion(root);
  };

  /* ---------- RENDER QUESTION ---------- */
  const renderQuestion = (root) => {
    stopSpeak();
    if (state.current >= state.questions.length) return renderResult(root);

    const q = state.questions[state.current];
    const idx = state.current;
    const total = state.questions.length;
    const answered = state.mode === 'learn' && state.answers[idx] !== undefined;
    const lastAns = state.answers[idx];

    root.innerHTML = `
      <div style="padding:4px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px">
          <span style="opacity:.7">Frage ${idx+1}/${total}</span>
          <span style="display:flex;gap:10px">
            <span style="color:#00ff88">✓ ${state.answers.filter((a,i) => a === state.questions[i].c).length}</span>
            ${state.mode === 'exam' ? `<span id="fs-timer-top" style="color:var(--accent)">00:00</span>` : ''}
          </span>
        </div>
        <div style="height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;margin-bottom:16px">
          <div style="width:${((idx) / total) * 100}%;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .3s;box-shadow:0 0 10px var(--accent)"></div>
        </div>

        <div style="padding:16px;background:rgba(0,229,255,.08);border-radius:14px;border:1.5px solid var(--border);margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:8px">
            <div style="font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:1px">Klasse ${state.selectedClass} · Frage ${idx+1}</div>
            <button id="fs-speak" class="chip" style="padding:6px 10px;font-size:11px">🔊 Vorlesen</button>
          </div>
          <h3 style="font-size:15px;line-height:1.5">${q.q}</h3>
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">
          ${q.a.map((opt, i) => {
            let bg = 'rgba(0,229,255,.06)', border = 'rgba(0,229,255,.25)', txt = 'var(--text)';
            if (answered) {
              if (i === q.c) { bg = 'rgba(0,255,136,.2)'; border = '#00ff88'; txt = '#00ff88'; }
              else if (i === lastAns && lastAns !== q.c) { bg = 'rgba(255,80,80,.2)'; border = '#ff5050'; txt = '#ff5050'; }
            }
            return `<button data-ans="${i}" style="padding:12px 16px;text-align:left;border-radius:12px;background:${bg};border:1.5px solid ${border};color:${txt};font-size:13px;cursor:${answered ? 'default' : 'pointer'};min-height:48px;transition:all .15s;font-weight:${answered && i === q.c ? '600' : '400'}">
              <strong style="opacity:.6;margin-right:8px">${String.fromCharCode(65+i)}</strong>${opt}
            </button>`;
          }).join('')}
        </div>

        ${answered && state.mode === 'learn' ? `
          <div style="padding:14px;background:rgba(180,120,255,.12);border-radius:12px;border:1.5px solid var(--accent3);margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
              <div style="flex:1">
                <strong style="color:var(--accent3);font-size:13px">🧠 KI-Erklärung</strong>
                <p style="font-size:12px;line-height:1.6;margin-top:6px;opacity:.9">${q.e}</p>
              </div>
              <button id="fs-exp-speak" class="chip" style="padding:6px 10px;font-size:11px;min-width:40px">🔊</button>
            </div>
          </div>
          <button id="fs-next" class="chip active" style="width:100%;padding:14px;font-size:14px;font-weight:600">
            ${idx+1 >= total ? '🎉 Auswertung' : 'Weiter ➜'}
          </button>
        ` : ''}

        ${state.mode === 'exam' && !answered ? `
          <div style="font-size:11px;opacity:.6;text-align:center;padding:8px">
            Prüfungsmodus — Auswertung am Ende
          </div>
        ` : ''}
      </div>
    `;

    // Vorlesen-Buttons
    const speakBtn = root.querySelector('#fs-speak');
    if (speakBtn) speakBtn.onclick = () => speak(q.q, state.lang);
    const expSpeak = root.querySelector('#fs-exp-speak');
    if (expSpeak) expSpeak.onclick = () => speak(q.e, state.lang);

    // Antworten
    if (!answered) {
      root.querySelectorAll('[data-ans]').forEach(btn => btn.onclick = () => {
        const pick = parseInt(btn.dataset.ans);
        state.answers[idx] = pick;
        HalDo.Sound.play(pick === q.c ? 'success' : 'error');
        if (state.mode === 'exam') {
          // Prüfungsmodus: direkt weiter
          state.current++;
          renderQuestion(root);
        } else {
          renderQuestion(root);
        }
      });
    }

    // Weiter
    const nextBtn = root.querySelector('#fs-next');
    if (nextBtn) nextBtn.onclick = () => {
      stopSpeak();
      state.current++;
      renderQuestion(root);
    };
  };

  /* ---------- RENDER RESULT ---------- */
  const renderResult = (root) => {
    stopSpeak();
    if (state.timerInterval) clearInterval(state.timerInterval);
    const correct = state.answers.filter((a, i) => a === state.questions[i].c).length;
    const pct = Math.round((correct / state.questions.length) * 100);
    const passed = pct >= 80;
    const elapsed = Math.round((Date.now() - state.startTime) / 1000);

    root.innerHTML = `
      <div style="padding:8px">
        <div style="text-align:center;padding:20px;background:radial-gradient(circle,${passed ? 'rgba(0,255,136,.15)' : 'rgba(255,80,80,.15)'},transparent);border-radius:16px;margin-bottom:14px">
          <div style="font-size:64px">${passed ? '🎉' : '📚'}</div>
          <h2 style="font-size:32px;font-weight:700;color:${passed ? '#00ff88' : '#ff8800'};margin:8px 0;text-shadow:0 0 20px ${passed ? '#00ff88' : '#ff8800'}">${pct}%</h2>
          <p style="font-size:14px;opacity:.85">${correct} von ${state.questions.length} richtig</p>
          <p style="font-size:12px;opacity:.6;margin-top:4px">⏱ ${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')} Min · Klasse ${state.selectedClass}</p>
          <p style="font-size:13px;margin-top:12px;${passed ? 'color:#00ff88' : 'color:#ff8800'};font-weight:600">${passed ? '✅ BESTANDEN!' : '❌ Nicht bestanden'}</p>
          <p style="font-size:11px;opacity:.6;margin-top:4px">${passed ? 'Bereit für die echte Prüfung!' : 'Noch etwas üben — du schaffst das!'}</p>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
          <button id="fs-restart" class="chip active" style="padding:12px;font-size:13px">🔄 Nochmal</button>
          <button id="fs-menu" class="chip" style="padding:12px;font-size:13px">📋 Menü</button>
        </div>

        <div style="font-size:12px;font-weight:600;margin-bottom:8px">📊 Auswertung</div>
        <div style="max-height:300px;overflow-y:auto">
          ${state.questions.map((q, i) => {
            const ok = state.answers[i] === q.c;
            return `<div style="padding:10px;background:${ok ? 'rgba(0,255,136,.08)' : 'rgba(255,80,80,.08)'};border-radius:10px;margin-bottom:6px;border-left:3px solid ${ok ? '#00ff88' : '#ff5050'};font-size:12px">
              <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
                <div style="flex:1"><strong>${ok ? '✓' : '✗'} Frage ${i+1}:</strong> ${q.q}</div>
              </div>
              <div style="font-size:11px;opacity:.75;margin-top:4px">
                Deine Antwort: <span style="color:${ok ? '#00ff88' : '#ff5050'}">${q.a[state.answers[i]] || '—'}</span>
                ${!ok ? `<br>Richtig: <span style="color:#00ff88">${q.a[q.c]}</span>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `;

    root.querySelector('#fs-restart').onclick = () => startQuiz(root);
    root.querySelector('#fs-menu').onclick = () => renderMenu(root);
  };

  /* ---------- OPEN ---------- */
  const open = () => {
    const html = `<div id="fs-root"></div>`;
    HalDo.Win.open('🚗 HalDo Fahrschule Pro MAX', html, { w: 520, h: 680 });
    setTimeout(() => {
      const root = document.getElementById('fs-root');
      renderMenu(root);
    }, 100);
  };

  return { open, CLASSES, COUNTS, LANGS, QUESTIONS: Q };
})();

          <option value="1">Steuerklasse I</option>
          <option value="2">Steuerklasse II</option>
          <option value="3">Steuerklasse III</option>
          <option value="4">Steuerklasse IV</option>
          <option value="5">Steuerklasse V</option>
          <option value="6">Steuerklasse VI</option>
        </select>
        <button id="tx-go" class="chip active" style="width:100%;padding:12px">📊 Berechnen</button>
        <div id="tx-out" style="padding:14px;background:rgba(0,20,40,.6);border-radius:12px;border:1px solid var(--border);margin-top:12px;font-size:13px;line-height:1.8"></div>
        <p style="font-size:10px;opacity:.5;margin-top:12px;text-align:center">Vereinfachte Berechnung · ohne Soli/Kirchensteuer</p>
      </div>
    `, 400, 560);
    setTimeout(() => {
      document.getElementById('tx-go').onclick = () => {
        const br = +document.getElementById('tx-br').value;
        const cls = +document.getElementById('tx-cls').value;
        if (!br) return;
        const grund = 11604;
        const zvE = Math.max(0, br - grund);
        let tax = 0;
        if (zvE <= 17005) tax = (979.18 * (zvE/10000) + 1400) * (zvE/10000);
        else if (zvE <= 66760) tax = (181.19 * (zvE-17005)/10000 + 2397) * (zvE-17005)/10000 + 1025.28;
        else if (zvE <= 277825) tax = 0.42 * zvE - 10602.13;
        else tax = 0.45 * zvE - 18936.88;
        if (cls === 3) tax *= 0.65;
        if (cls === 5) tax *= 1.15;
        const netto = br - tax;
        document.getElementById('tx-out').innerHTML = `
          <div>Brutto: <span style="color:var(--accent)">${br.toFixed(2)} €</span></div>
          <div>Steuer: <span style="color:#ff5050">-${tax.toFixed(2)} €</span></div>
          <div style="padding-top:8px;border-top:1px solid var(--border);margin-top:8px;font-size:15px;font-weight:bold">Netto: <span style="color:#00ff88">${netto.toFixed(2)} €</span></div>
          <div style="font-size:11px;opacity:.6;margin-top:6px">Effektiver Steuersatz: ${((tax/br)*100).toFixed(1)}%</div>
        `;
        HalDo.Sound.play('success');
      };
    }, 100);
  }
};

    setTimeout(() => {
      const inp = document.getElementById('term-in');
      const out = document.getElementById('term-out');
      const write = (text, color) => {
        const d = document.createElement('div');
        d.style.color = color || '#00ff88';
        d.textContent = text;
        out.appendChild(d);
        out.scrollTop = out.scrollHeight;
      };
      const cmds = {
        help: () => write('Befehle: help, ls, date, echo <text>, calc <expr>, clear, whoami, version, apps, theme <name>, reload'),
        ls: () => write('haldo_settings_v1\nhaldo_tasks_v1\nhaldo_notes_v1\nhaldo_journal_v1\nhaldo_water_v1'),
        date: () => write(new Date().toString()),
        whoami: () => write('HalDo-User (Browser-Session)'),
        version: () => write('HalDo AI OS v134'),
        apps: () => write('375+ Apps verfügbar · siehe App-Registry'),
        clear: () => { out.innerHTML = ''; },
        reload: () => location.reload(),
        echo: (args) => write(args.join(' ')),
        calc: (args) => {
          try { write('= ' + Function('"use strict"; return (' + args.join(' ') + ')')()); }
          catch(e) { write('Fehler: ' + e.message, '#ff5050'); }
        },
        theme: (args) => {
          if (args[0] && ['holo','cyborg','gold','matrix','crimson','sunset','ice'].includes(args[0])) { HalDo.Theme.set(args[0]); write('Theme: ' + args[0]); }
          else write('Verfügbar: holo, cyborg, gold, matrix, crimson, sunset, ice');
        }
      };
      inp.onkeydown = (e) => {
        if (e.key !== 'Enter') return;
        const line = inp.value.trim();
        if (!line) return;
        write('$ ' + line, '#ffd700');
        inp.value = '';
        const [cmd, ...args] = line.split(' ');
        if (cmds[cmd]) cmds[cmd](args);
        else write('Unbekannt: ' + cmd + ' — tippe "help"', '#ff5050');
      };
    }, 100);
  }
};

<script>
