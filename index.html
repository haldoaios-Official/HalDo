<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000208">
<title>HalDo AI OS Pro Max</title>
<style>
:root{
  --accent:#00e5ff; --accent2:#4da8ff; --accent3:#b478ff;
  --gold:#ffd700; --bg:#000208;
  --glass:rgba(0,20,40,0.55); --glass2:rgba(10,30,60,0.65);
  --border:rgba(0,229,255,0.4); --text:#e6f7ff;
  --blur:24px; --radius:18px; --radius-btn:14px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --glow:0 0 20px var(--accent);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro',system-ui,sans-serif;
  font-size:14px;user-select:none}
#cosmosBg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;flex-direction:column;gap:20px;z-index:10000;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
#loader-logo{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:56px;
  background:radial-gradient(circle,rgba(0,229,255,.35),transparent 70%);
  box-shadow:0 0 60px var(--accent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 60px var(--accent)}
  50%{transform:scale(1.08);box-shadow:0 0 90px var(--accent)}}
#loader-text{font-size:16px;letter-spacing:2px;color:var(--accent);
  text-shadow:0 0 20px var(--accent)}
/* --- Top Bar --- */
#topbar{position:fixed;top:0;left:0;right:0;height:calc(56px + var(--safe-t));
  padding-top:var(--safe-t);display:flex;align-items:center;justify-content:space-between;
  padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r));
  background:linear-gradient(180deg,rgba(0,10,25,.85),rgba(0,10,25,.4));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);z-index:200}
#logo-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:26px;cursor:pointer;
  background:radial-gradient(circle,rgba(0,229,255,.2),transparent);
  border:1.5px solid var(--border);box-shadow:var(--glow)}
#topbar-title{font-size:15px;font-weight:600;letter-spacing:1px;
  text-shadow:0 0 12px var(--accent)}
#topbar-actions{display:flex;gap:8px}
.top-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:20px;cursor:pointer;
  background:rgba(0,229,255,.08);border:1.5px solid var(--border);
  transition:all .2s}
.top-icon:hover,.top-icon:active{background:rgba(0,229,255,.2);transform:scale(1.05)}
/* --- Sidebar --- */
#sidebar{position:fixed;top:calc(56px + var(--safe-t));left:0;bottom:calc(80px + var(--safe-b));
  width:220px;padding:12px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(90deg,rgba(0,10,25,.85),rgba(0,10,25,.5));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1.5px solid var(--border);overflow-y:auto;z-index:150;
  transition:transform .3s;scrollbar-width:thin}
#sidebar.collapsed{transform:translateX(-100%)}
.side-item{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-radius:var(--radius-btn);cursor:pointer;
  background:rgba(0,229,255,.06);border:1.5px solid rgba(0,229,255,.2);
  transition:all .2s;font-size:14px;font-weight:500;min-height:44px}
.side-item:hover,.side-item:active{background:rgba(0,229,255,.18);
  border-color:var(--accent);transform:translateX(4px);
  box-shadow:0 0 15px rgba(0,229,255,.3)}
.side-item .icon{font-size:20px;width:28px;text-align:center}
/* --- Window layer --- */
#winLayer{position:fixed;inset:0;z-index:100;pointer-events:none}
.window{position:absolute;pointer-events:auto;
  min-width:280px;min-height:200px;max-width:calc(100vw - 20px);
  background:var(--glass2);backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  border-radius:var(--radius);display:flex;flex-direction:column;
  border:2px solid var(--gold);box-shadow:0 0 30px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(77,168,255,.35),var(--glow);
  overflow:hidden;animation:winIn .25s ease-out;z-index:200}
@keyframes winIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.window.active{border-color:#ffd700;z-index:250;
  box-shadow:0 0 40px rgba(255,215,0,.4),inset 0 0 0 1px var(--accent),
    var(--glow)}
.win-header{display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:linear-gradient(90deg,rgba(0,229,255,.15),rgba(180,120,255,.08));
  border-bottom:1px solid var(--border);cursor:move;min-height:46px}
.win-title{flex:1;font-size:14px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.win-btn{width:40px;height:40px;min-width:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px;
  cursor:pointer;background:rgba(255,255,255,.08);border:1px solid var(--border);
  transition:all .15s;z-index:999999}
.win-btn:hover,.win-btn:active{background:rgba(255,80,80,.3);transform:scale(1.05)}
.win-body{flex:1;padding:14px;overflow-y:auto;font-size:14px;line-height:1.5}
/* --- Splash greeting --- */
.splash{display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:30px 20px;text-align:center}
.splash-logo{width:80px;height:80px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:42px;
  background:radial-gradient(circle,rgba(0,229,255,.4),transparent 70%);
  box-shadow:0 0 30px var(--accent);animation:pulse 2s infinite}
.splash h2{font-size:20px;color:var(--accent);text-shadow:0 0 15px var(--accent)}
.splash p{font-size:13px;opacity:.85;line-height:1.6;max-width:320px}
.coming{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:20px;
  background:rgba(180,120,255,.15);border:1px solid var(--accent3);
  font-size:12px;color:var(--accent3);letter-spacing:1px}
/* --- Bottom bar --- */
#bottombar{position:fixed;bottom:0;left:0;right:0;height:calc(72px + var(--safe-b));
  padding-bottom:var(--safe-b);padding-left:calc(12px + var(--safe-l));
  padding-right:calc(12px + var(--safe-r));display:flex;align-items:center;
  justify-content:center;gap:10px;
  background:linear-gradient(0deg,rgba(0,10,25,.9),rgba(0,10,25,.4));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);z-index:200}
.bottom-btn{flex:1;max-width:160px;height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);
  background:rgba(0,229,255,.1);transition:all .2s;color:var(--text);
  min-width:40px}
.bottom-btn:hover,.bottom-btn:active{background:rgba(0,229,255,.25);
  transform:translateY(-2px);box-shadow:0 0 20px var(--accent)}
.bottom-btn.cyborg{background:rgba(255,120,200,.12);
  border-color:rgba(255,120,200,.5)}
.bottom-btn.cyborg:hover{background:rgba(255,120,200,.28);
  box-shadow:0 0 20px rgba(255,120,200,.7)}
/* --- App Grid --- */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:12px;padding:8px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 6px;border-radius:14px;cursor:pointer;
  background:rgba(0,229,255,.06);border:1.5px solid rgba(0,229,255,.2);
  transition:all .2s;min-height:82px}
.app-tile:hover,.app-tile:active{background:rgba(0,229,255,.2);
  transform:translateY(-3px);box-shadow:0 0 18px rgba(0,229,255,.4);
  border-color:var(--accent)}
.app-tile .ico{font-size:32px}
.app-tile .nm{font-size:11px;text-align:center;line-height:1.2;
  word-break:break-word}
/* --- Toast --- */
#toasts{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;
  transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;
  z-index:1000;pointer-events:none;width:calc(100% - 24px);max-width:420px}
.toast{padding:12px 18px;border-radius:14px;background:var(--glass2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--border);box-shadow:var(--glow);
  font-size:13px;text-align:center;animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}}
/* --- Avatar face --- */
.face-canvas{display:block;margin:0 auto;border-radius:50%;
  box-shadow:0 0 30px var(--accent),inset 0 0 20px rgba(0,229,255,.3)}
/* --- Chat --- */
.chat-log{flex:1;overflow-y:auto;padding:10px;display:flex;
  flex-direction:column;gap:8px;max-height:340px;min-height:200px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;
  line-height:1.5;word-wrap:break-word}
.msg.user{align-self:flex-end;background:rgba(0,229,255,.25);
  border:1px solid var(--accent)}
.msg.ai{align-self:flex-start;background:rgba(180,120,255,.2);
  border:1px solid var(--accent3)}
.chat-input{display:flex;gap:6px;padding:8px}
.chat-input input{flex:1;padding:10px 14px;border-radius:12px;
  background:rgba(0,20,40,.6);border:1.5px solid var(--border);
  color:var(--text);font-size:14px;outline:none}
.chat-input input:focus{border-color:var(--accent);box-shadow:0 0 12px var(--accent)}
.chat-input button{width:44px;height:44px;border-radius:12px;
  background:rgba(0,229,255,.2);border:1.5px solid var(--accent);
  color:var(--text);font-size:18px;cursor:pointer;min-width:44px}
/* --- Settings --- */
.set-section{border:1.5px solid var(--border);border-radius:14px;
  margin-bottom:10px;overflow:hidden;background:rgba(0,20,40,.4)}
.set-head{padding:14px;display:flex;align-items:center;
  justify-content:space-between;cursor:pointer;font-weight:600;
  background:rgba(0,229,255,.08);min-height:48px}
.set-head:hover{background:rgba(0,229,255,.15)}
.set-body{max-height:0;overflow:hidden;transition:max-height .3s;
  padding:0 14px}
.set-section.open .set-body{max-height:3000px;padding:10px 14px 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid rgba(0,229,255,.1);gap:10px;
  font-size:13px}
.set-row:last-child{border-bottom:none}
.set-row label{flex:1}
.toggle{width:50px;height:28px;border-radius:14px;background:rgba(0,0,0,.5);
  border:1.5px solid var(--border);cursor:pointer;position:relative;
  transition:all .2s;min-width:50px;min-height:28px}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;
  height:22px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px var(--accent);transition:transform .2s}
.toggle.on{background:rgba(0,229,255,.3)}
.toggle.on::after{transform:translateX(22px)}
.chip-group{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;
  background:rgba(0,229,255,.1);border:1.5px solid var(--border);min-height:30px}
.chip.active{background:rgba(0,229,255,.4);border-color:var(--accent);
  box-shadow:0 0 10px var(--accent)}
/* --- Themes --- */
body.cyborg{--accent:#ff78c8;--accent2:#b478ff;--accent3:#ff78c8;
  --border:rgba(255,120,200,.5);--glow:0 0 20px #ff78c8}
body.gold{--accent:#ffd700;--accent2:#ffa500;--accent3:#ffd700;
  --border:rgba(255,215,0,.5);--glow:0 0 20px #ffd700}
body.matrix{--accent:#00ff88;--accent2:#00cc66;--accent3:#00ff88;
  --border:rgba(0,255,136,.5);--glow:0 0 20px #00ff88}
body.crimson{--accent:#ff3366;--accent2:#cc0033;--accent3:#ff3366;
  --border:rgba(255,51,102,.5);--glow:0 0 20px #ff3366}
body.sunset{--accent:#ff8844;--accent2:#ff4488;--accent3:#ffaa00;
  --border:rgba(255,136,68,.5);--glow:0 0 20px #ff8844}
body.ice{--accent:#a0e0ff;--accent2:#e0f0ff;--accent3:#a0e0ff;
  --border:rgba(160,224,255,.5);--glow:0 0 20px #a0e0ff}
@media (max-width:600px){
  #sidebar{width:180px}
  .app-tile{min-height:76px}
  .app-tile .ico{font-size:28px}
  .app-tile .nm{font-size:10px}
}
</style>
</head>
<body>
<canvas id="cosmosBg"></canvas>
<div id="loader">
  <div id="loader-logo">🦚</div>
  <div id="loader-text">HalDo AI OS Pro Max</div>
  <div style="font-size:12px;opacity:.6;letter-spacing:1px">Lädt Kosmos…</div>
</div>

<div id="topbar">
  <div id="logo-btn" title="Menü">🦚</div>
  <div id="topbar-title">HalDo AI OS</div>
  <div id="topbar-actions">
    <div class="top-icon" id="btn-theme" title="Theme">🎨</div>
    <div class="top-icon" id="btn-settings" title="Einstellungen">⚙️</div>
  </div>
</div>

<div id="sidebar">
  <div class="side-item" data-nav="home"><span class="icon">🏠</span><span>Home</span></div>
  <div class="side-item" data-nav="apps"><span class="icon">📱</span><span>Apps</span></div>
  <div class="side-item" data-nav="system"><span class="icon">⚙️</span><span>System</span></div>
  <div class="side-item" data-nav="chat"><span class="icon">💬</span><span>Chat</span></div>
  <div class="side-item" data-nav="files"><span class="icon">📁</span><span>Files</span></div>
  <div class="side-item" data-nav="setup"><span class="icon">🔧</span><span>Setup</span></div>
  <div class="side-item" data-nav="info"><span class="icon">ℹ️</span><span>Info</span></div>
</div>

<div id="winLayer"></div>
<div id="toasts"></div>

<div id="bottombar">
  <button class="bottom-btn" id="bb-chat">💬 Chat</button>
  <button class="bottom-btn" id="bb-ai">🤖 AI</button>
  <button class="bottom-btn cyborg" id="bb-cyborg">⚡ CYBORG</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================================================================
   HALDO AI OS PRO MAX — v126 FOUNDATION
   Präsentiert von Halil Donma
   ================================================================ */
const HalDo = window.HalDo = {};

/* ---------- STORE ---------- */
HalDo.Store = {
  get(k, d) { try { const v = localStorage.getItem('haldo_' + k); return v ? JSON.parse(v) : d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem('haldo_' + k, JSON.stringify(v)); } catch(e) {} },
  remove(k) { try { localStorage.removeItem('haldo_' + k); } catch(e) {} }
};

/* ---------- SOUND (Web Audio, kein File nötig) ---------- */
HalDo.Sound = (() => {
  let ac, enabled = true;
  const ensure = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; };
  const tone = (freq, dur = 0.15, type = 'sine', vol = 0.12) => {
    if (!enabled) return;
    try {
      const a = ensure(), o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, a.currentTime);
      g.gain.linearRampToValueAtTime(vol, a.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    } catch(e) {}
  };
  const TONES = {
    tap: () => { tone(880, 0.04, 'sine', 0.06); },
    click: () => { tone(1200, 0.03, 'square', 0.05); },
    success: () => { [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.18), i * 70)); },
    error: () => { tone(220, 0.3, 'sawtooth', 0.1); },
    notify: () => { [800, 1000, 1200].forEach((f, i) => setTimeout(() => tone(f, 0.12), i * 90)); },
    alarm: () => { [400, 800, 400, 800].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'square', 0.1), i * 140)); },
    message: () => { [660, 880].forEach((f, i) => setTimeout(() => tone(f, 0.1), i * 100)); },
    chat: () => { tone(600, 0.08); setTimeout(() => tone(900, 0.1), 100); },
    bell: () => { [1568, 1976].forEach((f, i) => setTimeout(() => tone(f, 0.3), i * 200)); },
    chime: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.35), i * 140)); },
    whoosh: () => {
      if (!enabled) return;
      try {
        const a = ensure(), o = a.createOscillator(), g = a.createGain();
        o.frequency.setValueAtTime(200, a.currentTime);
        o.frequency.exponentialRampToValueAtTime(2000, a.currentTime + 0.3);
        g.gain.setValueAtTime(0.08, a.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.3);
        o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + 0.3);
      } catch(e) {}
    },
    cosmic: () => { [261, 329, 392, 523].forEach((f, i) => setTimeout(() => tone(f, 0.6, 'sine', 0.08), i * 180)); }
  };
  return {
    play(name) { try { (TONES[name] || TONES.tap)(); } catch(e) {} },
    beep(f, d, t, v) { tone(f, d, t, v); },
    setEnabled(v) { enabled = v; },
    list() { return Object.keys(TONES); }
  };
})();

/* ---------- TOAST ---------- */
HalDo.Toast = {
  show(msg, ms = 2800, sound = 'notify') {
    const c = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    c.appendChild(t);
    HalDo.Sound.play(sound);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 350); }, ms);
  }
};

/* ---------- THEME ---------- */
HalDo.Theme = {
  current: HalDo.Store.get('theme', 'holo'),
  set(name) {
    document.body.className = name === 'holo' ? '' : name;
    this.current = name;
    HalDo.Store.set('theme', name);
    HalDo.Toast.show('Theme: ' + name.toUpperCase(), 1500, 'success');
    const names = ['holo','cyborg','gold','matrix','crimson','sunset','ice'];
    const next = names[(names.indexOf(name) + 1) % names.length];
    setTimeout(() => { const b = document.getElementById('btn-theme'); if (b) b.title = 'Nächstes: ' + next; }, 100);
  },
  cycle() { const names = ['holo','cyborg','gold','matrix','crimson','sunset','ice']; const i = names.indexOf(this.current); this.set(names[(i + 1) % names.length]); }
};

/* ---------- WINDOW MANAGER ---------- */
HalDo.Win = (() => {
  let zCounter = 200;
  const layer = () => document.getElementById('winLayer');
  const open = (title, contentHTML, opts = {}) => {
    const id = 'w_' + Date.now() + Math.random().toString(36).slice(2, 6);
    const w = document.createElement('div');
    w.className = 'window';
    w.id = id;
    const vw = window.innerWidth, vh = window.innerHeight;
    const wid = opts.w || Math.min(520, vw - 30);
    const hgt = opts.h || Math.min(600, vh - 160);
    w.style.width = wid + 'px';
    w.style.height = hgt + 'px';
    w.style.left = Math.max(10, (vw - wid) / 2 + (Math.random() * 40 - 20)) + 'px';
    w.style.top = Math.max(70, (vh - hgt) / 2 + (Math.random() * 40 - 20)) + 'px';
    w.innerHTML = `
      <div class="win-header">
        <div class="win-title">${title}</div>
        <div class="win-btn" data-act="min" title="Minimieren">–</div>
        <div class="win-btn" data-act="close" title="Schließen" style="z-index:999999">✕</div>
      </div>
      <div class="win-body">${contentHTML}</div>
    `;
    layer().appendChild(w);
    w.style.zIndex = ++zCounter;
    focus(w);
    // Drag from header (only middle zone)
    const h = w.querySelector('.win-header');
    h.addEventListener('mousedown', e => startDrag(e, w));
    h.addEventListener('touchstart', e => startDrag(e, w), { passive: false });
    w.addEventListener('mousedown', () => focus(w));
    w.addEventListener('touchstart', () => focus(w), { passive: true });
    w.querySelector('[data-act="close"]').addEventListener('click', e => { e.stopPropagation(); close(id); });
    w.querySelector('[data-act="min"]').addEventListener('click', e => { e.stopPropagation(); w.style.display = 'none'; });
    HalDo.Sound.play('whoosh');
    return id;
  };
  const focus = w => { document.querySelectorAll('.window').forEach(x => x.classList.remove('active')); w.classList.add('active'); w.style.zIndex = ++zCounter; };
  const close = id => { const w = document.getElementById(id); if (w) { w.style.transition = 'opacity .2s,transform .2s'; w.style.opacity = '0'; w.style.transform = 'scale(.9)'; setTimeout(() => w.remove(), 220); HalDo.Sound.play('tap'); } };
  const startDrag = (e, w) => {
    e.preventDefault();
    const isTouch = e.type.startsWith('touch');
    const p = isTouch ? e.touches[0] : e;
    const rect = w.getBoundingClientRect();
    const startX = p.clientX, startY = p.clientY;
    const startLeft = rect.left, startTop = rect.top;
    // Drag zone: middle 100px from edges
    const move = ev => {
      const q = isTouch ? ev.touches[0] : ev;
      const dx = q.clientX - startX, dy = q.clientY - startY;
      w.style.left = Math.max(0, Math.min(window.innerWidth - rect.width, startLeft + dx)) + 'px';
      w.style.top = Math.max(60, Math.min(window.innerHeight - 90, startTop + dy)) + 'px';
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchend', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, { passive: false });
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  };
  return { open, close, focus };
})();

/* ---------- COSMOS (Three.js) ---------- */
HalDo.Cosmos = (() => {
  let scene, camera, renderer, clock;
  let sunMesh, sunCorona, sunCorona2, sunCorona3;
  let earthMesh, earthClouds, earthNight, earthAtmo;
  let planets = [], starsSmall, starsBig;
  let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
  const TEX = {
    earthDay: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
    earthNight: 'https://unpkg.com/three-globe/example/img/earth-night.jpg',
    earthTopology: 'https://unpkg.com/three-globe/example/img/earth-topology.png',
    earthWater: 'https://unpkg.com/three-globe/example/img/earth-water.png',
    earthClouds: 'https://unpkg.com/three-globe/example/img/clouds.png',
    moon: 'https://unpkg.com/three-globe/example/img/moon.jpg'
  };
  const textures = {};
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';
  const loadTex = (k) => loader.load(TEX[k], t => textures[k] = t, undefined, () => {});
  const makeProcedural = (color, color2, type) => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, 256, 128);
    if (type === 'bands') {
      for (let i = 0; i < 12; i++) { x.fillStyle = i % 2 ? color : color2; x.globalAlpha = .5 + Math.random() * .3; x.fillRect(0, i * 128 / 12, 256, 128 / 12); }
      x.globalAlpha = 1;
    } else if (type === 'crater') {
      for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(0,0,0,${.15 + Math.random() * .3})`; x.beginPath(); x.arc(Math.random() * 256, Math.random() * 128, Math.random() * 8 + 2, 0, Math.PI * 2); x.fill(); }
    } else if (type === 'cloud') {
      for (let i = 0; i < 30; i++) { x.fillStyle = `rgba(255,255,255,${.1 + Math.random() * .2})`; x.beginPath(); x.ellipse(Math.random() * 256, Math.random() * 128, Math.random() * 30 + 10, Math.random() * 10 + 3, Math.random() * Math.PI, 0, Math.PI * 2); x.fill(); }
    } else if (type === 'sun') {
      const g = x.createRadialGradient(128, 64, 0, 128, 64, 128);
      g.addColorStop(0, '#fff5a0'); g.addColorStop(.4, '#ffcc00'); g.addColorStop(.7, '#ff9900'); g.addColorStop(1, '#ff4400');
      x.fillStyle = g; x.fillRect(0, 0, 256, 128);
      for (let i = 0; i < 250; i++) { x.fillStyle = Math.random() > .5 ? 'rgba(255,255,220,.5)' : 'rgba(200,50,0,.35)'; x.beginPath(); x.arc(Math.random() * 256, Math.random() * 128, Math.random() * 4, 0, Math.PI * 2); x.fill(); }
    }
    return new THREE.CanvasTexture(c);
  };
  const createStars = (count, size, opacity) => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 400 + Math.random() * 700;
      const t = Math.random() * Math.PI * 2, phi = Math.acos(2 * Math.random() - 1);
      pos[i*3] = r * Math.sin(phi) * Math.cos(t);
      pos[i*3+1] = r * Math.sin(phi) * Math.sin(t);
      pos[i*3+2] = r * Math.cos(phi);
      const c = Math.random();
      if (c < .65) { col[i*3] = 1; col[i*3+1] = 1; col[i*3+2] = 1; }
      else if (c < .82) { col[i*3] = .65; col[i*3+1] = .82; col[i*3+2] = 1; }
      else if (c < .94) { col[i*3] = 1; col[i*3+1] = .9; col[i*3+2] = .55; }
      else { col[i*3] = 1; col[i*3+1] = .65; col[i*3+2] = .65; }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size, vertexColors: true, transparent: true, opacity, sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending });
    return new THREE.Points(geo, mat);
  };
  const makeGlow = (size, c1, c2) => {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(256, 256, 20, 256, 256, 256);
    g.addColorStop(0, c1); g.addColorStop(.5, c2); g.addColorStop(1, 'rgba(255,60,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.scale.set(size, size, 1); return s;
  };
  const init = () => {
    const canvas = document.getElementById('cosmosBg');
    scene = new THREE.Scene(); scene.background = new THREE.Color(0x000208);
    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, .1, 3000);
    camera.position.set(0, 10, 42); camera.lookAt(0, 0, 0);
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    clock = new THREE.Clock();
    Object.keys(TEX).forEach(loadTex);
    starsSmall = createStars(5000, 1.0, .75); scene.add(starsSmall);
    starsBig = createStars(900, 2.4, .95); scene.add(starsBig);
    // Sun with logo eyes
    const sunGeo = new THREE.SphereGeometry(4, 64, 64);
    sunMesh = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ map: makeProcedural('#ffcc00', '#ff4400', 'sun') }));
    scene.add(sunMesh);
    scene.add(new THREE.PointLight(0xfff5d0, 3.5, 0, 1));
    scene.add(new THREE.AmbientLight(0x505070, .45));
    sunCorona = makeGlow(28, 'rgba(255,240,150,.95)', 'rgba(255,180,60,.5)');
    sunCorona2 = makeGlow(45, 'rgba(255,200,100,.5)', 'rgba(255,120,30,.2)');
    sunCorona3 = makeGlow(75, 'rgba(255,150,60,.2)', 'rgba(255,60,0,.05)');
    scene.add(sunCorona); scene.add(sunCorona2); scene.add(sunCorona3);

    const defs = [
      { name:'Merkur', c1:'#8a7d6b', c2:'#5a4f42', s:1.2, d:11, sp:.7, t:'crater' },
      { name:'Venus', c1:'#e8c88a', c2:'#a88040', s:1.7, d:15, sp:.55, t:'cloud' },
      { name:'Erde', c1:'#4da8ff', c2:'#1a5599', s:5.0, d:26, sp:.42, t:'earth' },
      { name:'Mars', c1:'#c1440e', c2:'#8a2f0a', s:1.4, d:34, sp:.35, t:'crater' },
      { name:'Jupiter', c1:'#d4a373', c2:'#a08050', s:4.2, d:44, sp:.25, t:'bands' },
      { name:'Saturn', c1:'#e8d5a0', c2:'#a07840', s:3.7, d:55, sp:.20, t:'bands', ring:true },
      { name:'Uranus', c1:'#7de0e0', c2:'#3a8080', s:2.4, d:64, sp:.15, t:'bands' },
      { name:'Neptun', c1:'#3355ee', c2:'#0a1a6a', s:2.2, d:72, sp:.12, t:'bands' },
      { name:'Pluto', c1:'#b08860', c2:'#5a4020', s:.9, d:80, sp:.09, t:'crater' },
      { name:'Xena', c1:'#8866aa', c2:'#4a2a6a', s:1.0, d:88, sp:.07, t:'crater' },
      { name:'Sedna', c1:'#9977cc', c2:'#4a3a7a', s:1.05, d:96, sp:.05, t:'crater' },
      { name:'Eris', c1:'#aaccff', c2:'#5070a0', s:1.1, d:104, sp:.04, t:'crater' }
    ];
    planets = [];
    defs.forEach(def => {
      const geo = new THREE.SphereGeometry(def.s, 32, 32);
      let mat;
      if (def.t === 'earth') {
        mat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 15, specular: new THREE.Color(0x333333) });
        earthMesh = new THREE.Mesh(geo, mat);
        earthMesh.position.set(def.d, 0, 0);
        earthMesh.userData = { speed: def.sp, dist: def.d, planet: true };
        scene.add(earthMesh);
        // Apply textures when loaded
        const applyEarth = () => {
          if (textures.earthDay) { mat.map = textures.earthDay; mat.needsUpdate = true; }
          if (textures.earthTopology) { mat.bumpMap = textures.earthTopology; mat.bumpScale = .08; mat.needsUpdate = true; }
          if (textures.earthWater) { mat.specularMap = textures.earthWater; mat.specular = new THREE.Color(0x556677); mat.needsUpdate = true; }
          if (textures.earthDay && textures.earthNight && !earthNight) {
            const ng = new THREE.SphereGeometry(def.s * 1.002, 32, 32);
            const nm = new THREE.MeshBasicMaterial({ map: textures.earthNight, blending: THREE.AdditiveBlending, transparent: true, opacity: .85, depthWrite: false });
            earthNight = new THREE.Mesh(ng, nm);
            earthMesh.add(earthNight);
          }
        };
        setTimeout(applyEarth, 500);
        setTimeout(applyEarth, 2000);
        planets.push({ mesh: earthMesh, def });
      } else {
        mat = new THREE.MeshPhongMaterial({ map: makeProcedural(def.c1, def.c2, def.t), shininess: 8 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(def.d, 0, 0);
        mesh.userData = { speed: def.sp, dist: def.d, planet: true };
        scene.add(mesh);
        if (def.ring) {
          const ringGeo = new THREE.RingGeometry(def.s * 1.3, def.s * 2, 64);
          const ringMat = new THREE.MeshBasicMaterial({ color: 0xc0a060, side: THREE.DoubleSide, transparent: true, opacity: .6 });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.rotation.x = Math.PI / 2.2;
          mesh.add(ring);
        }
        planets.push({ mesh, def });
      }
    });
    // Earth click → open chat
    window.addEventListener('pointerdown', e => {
      const r = renderer.domElement.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 2 - 1;
      const y = -((e.clientY - r.top) / r.height) * 2 + 1;
      const ray = new THREE.Raycaster();
      ray.setFromCamera({ x, y }, camera);
      const hits = ray.intersectObject(sunMesh);
      if (hits.length) { HalDo.Chat.open(); HalDo.Sound.play('cosmic'); }
    });
    window.addEventListener('resize', onResize);
    document.addEventListener('mousemove', e => { targetMouseX = (e.clientX / window.innerWidth - .5) * 2; targetMouseY = (e.clientY / window.innerHeight - .5) * 2; });
    animate();
    setTimeout(() => { const l = document.getElementById('loader'); if (l) { l.classList.add('hide'); setTimeout(() => l.remove(), 700); } }, 1400);
  };
  const onResize = () => {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  const animate = () => {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    mouseX += (targetMouseX - mouseX) * .05;
    mouseY += (targetMouseY - mouseY) * .05;
    // Sun rotation + corona pulse
    if (sunMesh) sunMesh.rotation.y = t * .05;
    const pulse = 1 + Math.sin(t * 1.5) * .04;
    if (sunCorona) sunCorona.scale.set(28 * pulse, 28 * pulse, 1);
    if (sunCorona2) sunCorona2.scale.set(45 * (1 + Math.sin(t * 1.2) * .05), 45 * (1 + Math.sin(t * 1.2) * .05), 1);
    if (sunCorona3) sunCorona3.scale.set(75 * (1 + Math.sin(t * .8) * .06), 75 * (1 + Math.sin(t * .8) * .06), 1);
    // Planets orbit
    planets.forEach(p => {
      const a = t * p.def.sp * .15;
      p.mesh.position.x = Math.cos(a) * p.def.d;
      p.mesh.position.z = -Math.sin(a) * p.def.d;
      p.mesh.rotation.y = t * .2;
    });
    // Camera parallax
    camera.position.x = mouseX * 4;
    camera.position.y = 10 + mouseY * 3;
    camera.lookAt(0, 0, 0);
    if (starsSmall) starsSmall.rotation.y = t * .005;
    if (starsBig) starsBig.rotation.y = t * .003;
    renderer.render(scene, camera);
  };
  return { init };
})();

/* ---------- AVATAR (canvas face) ---------- */
HalDo.Avatar = (() => {
  let ctx, canvas, state = 'idle', blinkTimer = 0, breathTimer = 0, lastT = 0;
  const init = (c) => {
    canvas = c; canvas.width = 240; canvas.height = 240;
    ctx = canvas.getContext('2d');
    drawLoop(0);
  };
  const drawLoop = (t) => {
    if (!ctx) return;
    const dt = lastT ? t - lastT : 16; lastT = t;
    blinkTimer += dt; breathTimer += dt;
    const blink = blinkTimer > 4500;
    if (blink && blinkTimer > 4700) blinkTimer = 0;
    const breath = Math.sin(t / 1200) * 4;
    const isCyborg = document.body.classList.contains('cyborg') || HalDo.Theme.current === 'cyborg';
    const skin = isCyborg ? '#ffb0d8' : '#f0c9a8';
    const skinDark = isCyborg ? '#d480b0' : '#d4a888';
    const hair = isCyborg ? '#c060a0' : '#5a3a2a';
    const accent = isCyborg ? '#ff78c8' : '#00e5ff';
    // Background
    ctx.clearRect(0, 0, 240, 240);
    // Head
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.ellipse(120, 130 + breath * .3, 76, 92, 0, 0, Math.PI * 2);
    ctx.fill();
    // Hair top
    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.ellipse(120, 70 + breath * .3, 82, 60, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(120, 100 + breath * .3, 82, 40, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    // Eyes whites
    const eyeY = 125 + breath * .3;
    const eyeL = 90, eyeR = 150;
    const blinkFactor = blink && blinkTimer > 4500 && blinkTimer < 4700 ? 0.1 : 1;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(eyeL, eyeY, 16, 16 * blinkFactor, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(eyeR, eyeY, 16, 16 * blinkFactor, 0, 0, Math.PI * 2); ctx.fill();
    // Iris
    const look = Math.sin(t / 1500) * 4;
    ctx.fillStyle = isCyborg ? '#b478ff' : '#4a7a5a';
    ctx.beginPath(); ctx.arc(eyeL + look, eyeY, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeR + look, eyeY, 8, 0, Math.PI * 2); ctx.fill();
    // Pupil
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(eyeL + look, eyeY, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeR + look, eyeY, 4, 0, Math.PI * 2); ctx.fill();
    // Eyebrows
    ctx.strokeStyle = hair; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(eyeL - 18, eyeY - 22); ctx.quadraticCurveTo(eyeL, eyeY - 28, eyeL + 18, eyeY - 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(eyeR - 18, eyeY - 22); ctx.quadraticCurveTo(eyeR, eyeY - 28, eyeR + 18, eyeY - 22); ctx.stroke();
    // Nose
    ctx.strokeStyle = skinDark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(120, eyeY + 5); ctx.lineTo(115, eyeY + 30); ctx.quadraticCurveTo(120, eyeY + 35, 125, eyeY + 30); ctx.stroke();
    // Mouth
    const mouthY = eyeY + 55;
    ctx.fillStyle = '#8a3a4a';
    let mouthHeight = 4;
    if (state === 'speaking') mouthHeight = 6 + Math.abs(Math.sin(t / 80)) * 14;
    ctx.beginPath(); ctx.ellipse(120, mouthY, 20, mouthHeight / 2 + 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = skinDark; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(120, mouthY, 20, mouthHeight / 2 + 3, 0, 0, Math.PI * 2); ctx.stroke();
    // Blush
    ctx.fillStyle = isCyborg ? 'rgba(255,120,200,.35)' : 'rgba(255,150,150,.3)';
    ctx.beginPath(); ctx.ellipse(70, eyeY + 30, 18, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(170, eyeY + 30, 18, 10, 0, 0, Math.PI * 2); ctx.fill();
    // Holographic rings (if not cyborg)
    if (!isCyborg) {
      ctx.strokeStyle = 'rgba(0,229,255,' + (0.3 + Math.sin(t / 500) * 0.15) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(120, 130, 100, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(120, 130, 110, 0, Math.PI * 2); ctx.stroke();
    }
    requestAnimationFrame(drawLoop);
  };
  const setState = s => { state = s; };
  return { init, setState };
})();

HalDo.Chat = (() => {
  const responses = {
    'hi': 'Hallo Bruder! 👋 Ich bin HalDo AI. Wie kann ich dir helfen?',
    'hey': 'Hey! Schön dich zu sehen. Was brauchst du?',
    'hallo': 'Hallo! Ich bin da. Frag mich was!',
    'haldo': 'Ja, ich höre dich! 🤖 Was möchtest du?',
    'wie geht': 'Mir geht es super, danke der Nachfrage! Und dir?',
    'wer bist du': 'Ich bin HalDo AI – dein persönlicher KI-Assistent von HalDo AI OS Pro Max. Präsentiert von Halil Donma. 🦚',
    'ezidi': 'Êzîdî ist eine sehr alte Religion, Bruder. Die Êzîdî glauben an Melek Taus (den Pfauengel), Gott und die Wiedergeburt. Die heilige Stadt ist Laliş mit dem Tempel von Şêxadî. Ich kann dir mehr über die Mishefa Reş (Schwarzbuch), die Gemeinschaft, Sprache und Kultur erzählen – frag mich einfach! 🦚',
    'wetter': 'Für Live-Wetter nutze bitte die Weather-App. Ich kann dir das Wetter für jede Stadt zeigen!',
    'zeit': 'Die aktuelle Zeit ist ' + new Date().toLocaleTimeString('de-DE') + ' Uhr.',
    'datum': 'Heute ist ' + new Date().toLocaleDateString('de-DE') + '.',
    'hilfe': 'Ich kann dir helfen mit: Wetter, Zeit, Rechnungen, Notizen, Êzîdî-Wissen, Übersetzungen, und mehr. Sag einfach was du brauchst!',
    'danke': 'Gerne, Bruder! 💙',
    'tschüss': 'Bis bald! Ich bin hier wenn du mich brauchst. 👋'
  };
  const reply = (text) => {
    const t = text.toLowerCase();
    for (const key in responses) {
      if (t.includes(key)) return responses[key];
    }
    if (t.match(/\d+\s*[-+*/]\s*\d+/)) {
      try {
        const expr = t.match(/[\d.]+(?:\s*[-+*/]\s*[\d.]+)+/)[0];
        const result = eval(expr);
        return `Ergebnis: ${expr} = ${result}`;
      } catch(e) {}
    }
    return 'Interessante Frage, Bruder! 🤔 Ich bin noch in der Entwicklung, aber ich lerne schnell. Aktuell kann ich: Wetter, Zeit, Rechnungen, Êzîdî-Wissen, Übersetzungen. Frag mich z.B. "Wie ist das Wetter?" oder "Erzähl über Êzîdî".';
  };
  const speak = (text) => {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE';
      u.rate = 0.95;
      u.pitch = 1.05;
      u.onstart = () => HalDo.Avatar.setState('speaking');
      u.onend = () => HalDo.Avatar.setState('idle');
      window.speechSynthesis.speak(u);
    } catch(e) {}
  };
  const open = () => {
    const html = `
      <div style="display:flex;flex-direction:column;height:100%;gap:6px">
        <canvas id="avatar-canvas" class="face-canvas" width="240" height="240" style="width:140px;height:140px;margin:0 auto"></canvas>
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input">
          <input id="chat-input" placeholder="Sag Hi HalDo, Hey HalDo…" />
          <button id="chat-mic" title="Sprechen">🎤</button>
          <button id="chat-send">➤</button>
        </div>
      </div>
    `;
    const id = HalDo.Win.open('🤖 HalDo AI', html, { w: 400, h: 560 });
    setTimeout(() => {
      const c = document.getElementById('avatar-canvas');
      if (c) HalDo.Avatar.init(c);
      const log = document.getElementById('chat-log');
      const input = document.getElementById('chat-input');
      const send = document.getElementById('chat-send');
      const mic = document.getElementById('chat-mic');
      const addMsg = (text, who) => {
        const m = document.createElement('div');
        m.className = 'msg ' + who;
        m.textContent = text;
        log.appendChild(m);
        log.scrollTop = log.scrollHeight;
      };
      addMsg('Hallo Bruder! Ich bin HalDo AI. Sag "Hi HalDo", "Hey HalDo" oder frag mich was. 🦚', 'ai');
      setTimeout(() => speak('Hallo Bruder. Ich bin HalDo AI. Wie kann ich dir helfen?'), 400);
      const handleSend = () => {
        const t = input.value.trim();
        if (!t) return;
        addMsg(t, 'user');
        input.value = '';
        HalDo.Sound.play('chat');
        setTimeout(() => {
          const r = reply(t);
          addMsg(r, 'ai');
          speak(r);
        }, 400);
      };
      send.addEventListener('click', handleSend);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });
      // Speech Recognition
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SR();
        rec.lang = 'de-DE'; rec.continuous = false; rec.interimResults = false;
        rec.onresult = e => { input.value = e.results[0][0].transcript; handleSend(); };
        mic.addEventListener('click', () => { try { rec.start(); HalDo.Avatar.setState('listening'); HalDo.Toast.show('🎤 Höre zu…', 1500, 'tap'); } catch(e) {} });
      }
    }, 100);
  };
  return { open, speak };
})();

        </div>
      </div>
    `;
    HalDo.Win.open('🧮 Calculator', html, { w: 340, h: 480 });
    setTimeout(() => {
      const inp = document.getElementById('calc-input'), res = document.getElementById('calc-result');
      const evalExpr = () => {
        try {
          const v = inp.value.replace(/[^0-9+\-*/.() ]/g, '');
          if (!v) { res.textContent = ''; return; }
          const r = Function('"use strict"; return (' + v + ')')();
          res.textContent = '= ' + r;
        } catch(e) { res.textContent = ''; }
      };
      inp.addEventListener('input', evalExpr);
      document.querySelectorAll('.calc-btn').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.k;
        if (k === 'C') { inp.value = ''; res.textContent = ''; }
        else if (k === '⌫') { inp.value = inp.value.slice(0, -1); evalExpr(); }
        else if (k === '=') { evalExpr(); }
        else { inp.value += k; evalExpr(); }
        HalDo.Sound.play('tap');
      }));
    }, 100);
  }
};

HalDo.TimerApp = {
  open() {
    const html = `
      <div style="padding:16px;text-align:center">
        <div id="timer-display" style="font-size:56px;font-weight:700;color:var(--accent);text-shadow:0 0 30px var(--accent);margin-bottom:16px">00:00</div>
        <div style="display:flex;gap:6px;justify-content:center;margin-bottom:16px">
          <input id="timer-min" type="number" value="5" min="0" style="width:70px;padding:10px;border-radius:10px;background:rgba(0,20,40,.6);border:1.5px solid var(--border);color:var(--text);text-align:center;font-size:16px">
          <span style="align-self:center;opacity:.7">Min</span>
        </div>
        <div style="display:flex;gap:8px">
          <button id="timer-start" class="chip active" style="flex:1;padding:12px">▶ Start</button>
          <button id="timer-stop" class="chip" style="flex:1;padding:12px">⏸ Stop</button>
          <button id="timer-reset" class="chip" style="flex:1;padding:12px">↺ Reset</button>
        </div>
      </div>
    `;
    HalDo.Win.open('⏱ Timer Pro', html, { w: 340, h: 380 });
    setTimeout(() => {
      let interval, remain = 0;
      const disp = document.getElementById('timer-display');
      const update = () => {
        const m = Math.floor(remain / 60), s = remain % 60;
        disp.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      };
      document.getElementById('timer-start').addEventListener('click', () => {
        clearInterval(interval);
        remain = parseInt(document.getElementById('timer-min').value) * 60;
        interval = setInterval(() => {
          remain--; update();
          if (remain <= 0) { clearInterval(interval); HalDo.Sound.play('alarm'); HalDo.Toast.show('⏱ Timer abgelaufen!', 3000, 'alarm'); }
        }, 1000);
      });
      document.getElementById('timer-stop').addEventListener('click', () => clearInterval(interval));
      document.getElementById('timer-reset').addEventListener('click', () => { clearInterval(interval); remain = 0; update(); });
    }, 100);
  }
};

HalDo.PassGen = {
  open() {
    const html = `
      <div style="padding:16px">
        <div style="font-size:22px;font-family:monospace;word-break:break-all;padding:14px;background:rgba(0,20,40,.6);border-radius:12px;border:1.5px solid var(--border);min-height:60px;text-align:center;margin-bottom:12px" id="pw-out">Klicke Generieren</div>
        <button id="pw-gen" class="chip active" style="width:100%;padding:12px;margin-bottom:12px">🔐 Generieren</button>
        <div class="set-row"><label>Länge</label><input type="range" id="pw-len" min="8" max="64" value="20" style="width:100px;accent-color:var(--accent)"></div>
        <div class="set-row"><label>Symbole</label><div class="toggle on" id="pw-sym"></div></div>
        <div class="set-row"><label>Zahlen</label><div class="toggle on" id="pw-num"></div></div>
      </div>
    `;
    HalDo.Win.open('🔑 Password Pro', html, { w: 380, h: 380 });
    setTimeout(() => {
      const out = document.getElementById('pw-out');
      const gen = () => {
        const len = parseInt(document.getElementById('pw-len').value);
        let chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (document.getElementById('pw-num').classList.contains('on')) chars += '0123456789';
        if (document.getElementById('pw-sym').classList.contains('on')) chars += '!@#$%^&*()_+-=[]{}';
        let p = '';
        for (let i = 0; i < len; i++) p += chars[Math.floor(Math.random() * chars.length)];
        out.textContent = p;
      };
      document.getElementById('pw-gen').addEventListener('click', gen);
    }, 100);
  }
};
