<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HalDo AI OS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="HalDo AI OS — Halil Donma App · KI-betriebenes Betriebssystem im Browser">
  <title>🦚 HalDo AI OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦚</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050810'/><text x='50' y='50' text-anchor='middle' dominant-baseline='central' font-size='70'>🦚</text></svg>">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --p1: #00e5ff; --p2: #4da8ff; --p3: #b478ff;
      --bg: #050810; --bg-2: #0a0f1a;
      --card: rgba(255,255,255,.03);
      --text: #e8ecff; --text-dim: #a8b0cc; --text-mute: #6b7390;
      --border-soft: 1px solid rgba(255,255,255,.08);
      --glow: 0 0 24px rgba(0,229,255,.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .35s ease;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

    #haldo-root { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 1; }
    #haldo-header {
      padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,.2); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.05);
      flex-shrink: 0; z-index: 900; height: 56px;
    }
    #haldo-title { font-size: 16px; font-weight: 900; color: var(--p1); }
    #haldo-content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px; padding-bottom: 90px;
      scroll-behavior: smooth;
    }
    #haldo-sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
      background: var(--bg-2); border-right: 1px solid rgba(255,255,255,.08);
      transform: translateX(-100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 9999; overflow-y: auto; padding: 16px;
    }
    #haldo-sidebar.open { transform: translateX(0); }
    #haldo-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9998;
    }
    #haldo-overlay.open { opacity: 1; pointer-events: auto; }

    .card { padding: 16px; background: var(--card); border: var(--border-soft); border-radius: 14px; margin-bottom: 12px; backdrop-filter: blur(8px); }
    .card h3 { font-size: 15px; font-weight: 900; color: var(--p1); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 10.5px; color: var(--text-mute); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px; background: rgba(0,0,0,.3);
      border: var(--border-soft); border-radius: 10px; color: var(--text);
      font-size: 13px; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--p1); box-shadow: 0 0 0 3px rgba(0,229,255,.1);
    }
    .btn {
      padding: 12px 18px; background: linear-gradient(135deg, var(--p1), var(--p3));
      border: none; border-radius: 10px; color: #000; font-size: 13px;
      font-weight: 900; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
      font-family: inherit; transition: transform .15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
    .btn.sec { background: rgba(255,255,255,.05); color: var(--text); border: var(--border-soft); }
    .btn.danger { background: linear-gradient(135deg, #ff8080, #ff4d4d); color: #fff; }
    .btn.full { width: 100%; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 9px 14px; background: rgba(255,255,255,.04);
      border: var(--border-soft); border-radius: 10px;
      color: var(--text-dim); font-size: 11.5px; font-weight: 800;
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    .tab.active { background: linear-gradient(135deg, var(--p1), var(--p3)); color: #000; border-color: transparent; }

    /* ═══════════════════════════════════════════
       LOADER v3 (schneller, cleaner)
       ═══════════════════════════════════════════ */
    #haldo-loader {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, #0a0f1a 0%, #050810 60%, #000 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999; transition: opacity .35s; padding: 20px;
    }
    #haldo-loader.hide { opacity: 0; pointer-events: none; }
    #haldo-loader .logo { font-size: 72px; animation: haldoBounce 1.2s infinite; }
    #haldo-loader .title { margin-top: 8px; font-size: 22px; font-weight: 900; color: var(--p1); letter-spacing: 1px; }
    #haldo-loader .subtitle { margin-top: 2px; font-size: 11px; color: var(--text-mute); letter-spacing: 3px; font-weight: 800; text-transform: uppercase; }
    #haldo-loader .bar-wrap { margin-top: 24px; width: min(280px, 80vw); height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
    #haldo-loader .bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--p1), var(--p3)); border-radius: 2px; transition: width .2s; box-shadow: 0 0 12px var(--p1); }
    #haldo-loader .status { margin-top: 14px; font-size: 10.5px; color: var(--text-mute); font-weight: 700; letter-spacing: .5px; min-height: 16px; text-align: center; max-width: 80vw; }
    #haldo-loader .count { margin-top: 6px; font-size: 10px; color: var(--text-mute); opacity: .6; }
    @keyframes haldoBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.05); } }

    /* ═══════════════════════════════════════════
       APP WELCOME OVERLAY (Pfau + Sonne + Gold)
       ═══════════════════════════════════════════ */
    #haldo-app-welcome {
      position: fixed; inset: 0; z-index: 99990;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; pointer-events: none;
      opacity: 0; transition: opacity .35s ease;
      --gold-1: #ffd54f;
      --gold-2: #fff8c0;
      --gold-3: #ffb300;
      --gold-4: #ff8f00;
    }
    #haldo-app-welcome.show { display: flex; pointer-events: auto; opacity: 1; cursor: pointer; }
    #haldo-app-welcome.out { opacity: 0; }

    .haw-backdrop {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(255,180,50,.25) 0%, rgba(10,15,26,.96) 45%, rgba(5,8,16,.99) 100%);
      backdrop-filter: blur(6px);
      z-index: 0;
    }

    .haw-scene {
      position: relative;
      width: min(420px, 82vw);
      height: min(420px, 82vw);
      margin-bottom: -40px;
      z-index: 1;
      display: flex; align-items: center; justify-content: center;
    }

    /* Peacock behind sun (ghost) */
    .haw-peacock-bg {
      position: absolute;
      top: 50%; left: 50%;
      font-size: 220px;
      line-height: 1;
      transform: translate(-50%, -50%) scale(0.85);
      opacity: 0;
      filter: blur(3px) drop-shadow(0 0 40px rgba(255,200,50,.8));
      z-index: 1;
      animation: peacockBg 2.4s ease-out forwards;
    }
    @keyframes peacockBg {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6) rotate(-8deg); }
      35%  { opacity: 0.55; }
      100% { opacity: 0.28; transform: translate(-50%, -50%) scale(1.35) rotate(0deg); }
    }

    /* Golden rays behind sun */
    .haw-rays {
      position: absolute;
      top: 50%; left: 50%;
      width: 380px; height: 380px;
      transform: translate(-50%, -50%);
      background:
        conic-gradient(from 0deg,
          rgba(255,213,79,.28) 0deg, transparent 20deg,
          rgba(255,213,79,.28) 40deg, transparent 60deg,
          rgba(255,213,79,.28) 80deg, transparent 100deg,
          rgba(255,213,79,.28) 120deg, transparent 140deg,
          rgba(255,213,79,.28) 160deg, transparent 180deg,
          rgba(255,213,79,.28) 200deg, transparent 220deg,
          rgba(255,213,79,.28) 240deg, transparent 260deg,
          rgba(255,213,79,.28) 280deg, transparent 300deg,
          rgba(255,213,79,.28) 320deg, transparent 340deg);
      border-radius: 50%;
      z-index: 2;
      opacity: 0;
      animation: raysFadeIn 1.2s ease-out .1s forwards, raysRotate 20s linear infinite;
      mask-image: radial-gradient(circle, transparent 80px, black 130px, transparent 190px);
      -webkit-mask-image: radial-gradient(circle, transparent 80px, black 130px, transparent 190px);
    }
    @keyframes raysFadeIn { to { opacity: 0.85; } }
    @keyframes raysRotate { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* The Sun */
    .haw-sun {
      position: absolute;
      top: 50%; left: 50%;
      width: 200px; height: 200px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 45% 40%,
        #fff8c0 0%, #ffe082 22%, #ffd54f 42%,
        #ffb300 68%, #ff8f00 88%, #e65100 100%);
      box-shadow:
        0 0 60px rgba(255,200,50,.85),
        0 0 120px rgba(255,180,40,.55),
        0 0 200px rgba(255,150,30,.3),
        inset -18px -18px 40px rgba(200,100,0,.35),
        inset 10px 10px 30px rgba(255,255,200,.4);
      z-index: 3;
      opacity: 0;
      animation: sunAppear 1s ease-out forwards, sunPulse 2.5s ease-in-out 1s infinite;
    }
    @keyframes sunAppear {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes sunPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.06); }
    }

    /* Wings (2 peacocks flying outward = wings opening) */
    .haw-wing {
      position: absolute;
      top: 50%; left: 50%;
      font-size: 88px;
      line-height: 1;
      z-index: 4;
      opacity: 0;
      filter: drop-shadow(0 0 24px rgba(255,200,50,.95)) drop-shadow(0 0 8px rgba(255,255,200,.7));
      pointer-events: none;
    }
    .haw-wing-l { animation: wingL 1.6s cubic-bezier(.16,1,.3,1) .15s forwards; }
    .haw-wing-r { animation: wingR 1.6s cubic-bezier(.16,1,.3,1) .15s forwards; transform: scaleX(-1); }

    @keyframes wingL {
      0%   { transform: translate(-50%, -50%) scale(0.2) rotate(-100deg); opacity: 0; }
      20%  { opacity: 1; }
      65%  { transform: translate(-190%, -50%) scale(1.05) rotate(-28deg); opacity: 1; }
      100% { transform: translate(-260%, -50%) scale(1.25) rotate(-18deg); opacity: 0.92; }
    }
    @keyframes wingR {
      0%   { transform: translate(-50%, -50%) scale(0.2) rotate(-100deg) scaleX(-1); opacity: 0; }
      20%  { opacity: 1; }
      65%  { transform: translate(90%, -50%) scale(1.05) rotate(-28deg) scaleX(-1); opacity: 1; }
      100% { transform: translate(160%, -50%) scale(1.25) rotate(-18deg) scaleX(-1); opacity: 0.92; }
    }

    /* Text content */
    .haw-content {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 0 20px;
      display: flex; flex-direction: column; align-items: center;
      gap: 6px;
      animation: contentFadeIn 1s ease-out .4s both;
    }
    @keyframes contentFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .haw-brand {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--gold-1);
      text-transform: uppercase;
      filter: drop-shadow(0 0 12px rgba(255,200,50,.8));
    }
    .haw-presents {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255,213,79,.72);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .haw-divider {
      width: 80px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-1), transparent);
      margin: 8px 0 10px;
      box-shadow: 0 0 10px var(--gold-1);
    }
    .haw-welcome-text {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255,213,79,.85);
      letter-spacing: 1px;
    }
    .haw-app-name {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 900;
      letter-spacing: 1px;
      margin: 4px 0;
      background: linear-gradient(90deg,
        var(--gold-1) 0%,
        var(--gold-2) 20%,
        var(--gold-3) 40%,
        var(--gold-2) 60%,
        var(--gold-1) 80%,
        var(--gold-2) 100%);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: goldShimmer 3s linear infinite;
      filter: drop-shadow(0 0 20px rgba(255,200,50,.7));
      line-height: 1.15;
    }
    @keyframes goldShimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 300% center; }
    }
    .haw-by {
      font-size: 11.5px;
      font-weight: 600;
      color: rgba(255,213,79,.68);
      letter-spacing: 1.5px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .haw-wing, .haw-sun, .haw-peacock-bg, .haw-rays, .haw-content, .haw-app-name {
        animation-duration: .01s !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* ─── MISSING APPS BANNER ─── */
    #haldo-missing-banner {
      position: fixed; bottom: max(20px, env(safe-area-inset-bottom, 0px) + 20px); left: 20px; right: 20px;
      background: rgba(255,183,0,.15); border: 1px solid rgba(255,183,0,.4);
      border-radius: 12px; padding: 12px 14px;
      color: #ffd54f; font-size: 11.5px; font-weight: 700;
      z-index: 9998; display: none; align-items: center; gap: 10px;
      animation: haldoFadeIn .3s;
    }
    #haldo-missing-banner.show { display: flex; }
    #haldo-missing-banner .x { margin-left: auto; background: transparent; border: none; color: #ffd54f; font-size: 16px; cursor: pointer; padding: 0; }
    @keyframes haldoFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ─── DIAGNOSTIC PANEL ─── */
    #haldo-diag {
      position: fixed; inset: 0; z-index: 100000;
      background: rgba(5,8,16,.97);
      padding: 20px; overflow-y: auto;
      display: none;
    }
    #haldo-diag.show { display: block; }
    #haldo-diag h2 { color: var(--p1); font-size: 18px; margin-bottom: 12px; }
    #haldo-diag h3 { color: var(--text-dim); font-size: 13px; margin: 16px 0 6px; }
    #haldo-diag pre { font-size: 10.5px; color: var(--text-mute); line-height: 1.6; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    #haldo-diag .close { position: sticky; top: 0; float: right; background: var(--p1); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 900; cursor: pointer; font-family: inherit; }
    #haldo-diag .ok { color: #4ade80; }
    #haldo-diag .fail { color: #ff8080; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════
       LOADER
       ═══════════════════════════════════════════ -->
  <div id="haldo-loader">
    <div class="logo">🦚</div>
    <div class="title">HalDo AI OS</div>
    <div class="subtitle">Halil Donma App</div>
    <div class="bar-wrap"><div class="bar" id="haldo-bar"></div></div>
    <div class="status" id="haldo-status">System startet...</div>
    <div class="count" id="haldo-count">0 / 0</div>
  </div>

  <!-- ═══════════════════════════════════════════
       APP WELCOME OVERLAY (Pfau + Sonne + Gold)
       ═══════════════════════════════════════════ -->
  <div id="haldo-app-welcome" aria-hidden="true">
    <div class="haw-backdrop"></div>
    <div class="haw-scene">
      <div class="haw-peacock-bg">🦚</div>
      <div class="haw-rays"></div>
      <div class="haw-sun"></div>
      <div class="haw-wing haw-wing-l">🦚</div>
      <div class="haw-wing haw-wing-r">🦚</div>
    </div>
    <div class="haw-content">
      <div class="haw-brand">🦚 HalDo AI OS</div>
      <div class="haw-presents">HalDo AI präsentiert</div>
      <div class="haw-divider"></div>
      <div class="haw-welcome-text">Willkommen in</div>
      <div class="haw-app-name" id="haw-app-name">HalDo App</div>
      <div class="haw-by">Einer App von Halil Donma</div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       MISSING BANNER
       ═══════════════════════════════════════════ -->
  <div id="haldo-missing-banner">
    <span>⚠️</span>
    <span id="haldo-missing-text">—</span>
    <button class="x" id="haldo-missing-close">✕</button>
  </div>

  <!-- ═══════════════════════════════════════════
       DIAGNOSTIC
       ═══════════════════════════════════════════ -->
  <div id="haldo-diag">
    <button class="close" id="haldo-diag-close">✕ Schließen</button>
    <h2>🦚 HalDo Diagnostics</h2>
    <div id="haldo-diag-content"></div>
  </div>

  <!-- ═══════════════════════════════════════════
       APP
       ═══════════════════════════════════════════ -->
  <div id="haldo-overlay"></div>
  <nav id="haldo-sidebar"></nav>

  <div id="haldo-root">
    <header id="haldo-header">
      <button id="haldo-menu" style="background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px">☰</button>
      <div id="haldo-title">🦚 HalDo AI OS</div>
      <button id="haldo-diag-btn" style="background:transparent;border:none;color:var(--text-mute);font-size:16px;cursor:pointer;padding:4px 8px" title="Diagnostics">⚙</button>
    </header>
    <main id="haldo-content"></main>
  </div>

  <div id="haldo-desk"></div>
  <div id="haldo-taskbar"></div>

  <script>
  /* ═══════════════════════════════════════════════════════════
     HALDO AI OS — BOOT v3.0
     · Schnelleres paralleles Laden (async=false, ordered execution)
     · Welcome-Greeting bei jeder App (Pfau + Sonne + Gold-Schimmer)
     · 4 Trigger-Hooks für maximale Zuverlässigkeit
     ═══════════════════════════════════════════════════════════ */
  (function(){
    "use strict";

    /* ═══════════════════════════════════════════════
       APP-MANIFEST (A-Z) — unverändert
       ═══════════════════════════════════════════════ */
    var SCRIPTS = [
      /* ─── CORE ─── */
      "runtime.js",
      "store.js",
      "voice.js",
      "notify.js",
      "theme.js",
      "apps.js",

      /* ─── KI-ENGINES ─── */
      "ai-engine.js",
      "haldo-ai.js",

      /* ─── DESKPANE · AVATAR · SHELL ─── */
      "deskpane.js",
      "avatar.js",
      "shell.js",

      /* ─── SYSTEM ─── */
      "settings.js",
      "system-center.js",
      "update.js",
      "backup.js",
      "recovery.js",
      "diagnostics.js",
      "appstore.js",
      "analytics.js",
      "dashboard.js",

      /* ─── KOMMUNIKATION ─── */
      "chat.js",
      "ai.js",
      "email.js",
      "posteingang.js",
      "kontakte.js",
      "aufnahme.js",
      "phone.js",
      "videocall.js",
      "voicememos.js",

      /* ─── PRODUKTIVITÄT ─── */
      "tasks.js",
      "todo.js",
      "notes.js",
      "kalender.js",
      "projekte.js",
      "arbeitszeit.js",
      "dokumente.js",
      "links.js",
      "passwort.js",
      "clipboard.js",
      "filemanager.js",

      /* ─── GESUNDHEIT ─── */
      "fitness.js",
      "gesundheit.js",
      "stimmung.js",
      "gewohnheiten.js",
      "schlaf.js",
      "atem.js",
      "wasser.js",

      /* ─── LIFESTYLE ─── */
      "kueche.js",
      "rezept.js",
      "einkauf.js",
      "zuhause.js",
      "finanzen.js",
      "reisen.js",
      "auto.js",
      "musik.js",
      "photos.js",
      "video.js",
      "bild.js",

      /* ─── WERKZEUGE ─── */
      "wetter.js",
      "rechner.js",
      "wissenschaftlich.js",
      "umrechner.js",
      "waehrung.js",
      "timer.js",
      "pomodoro.js",
      "uebersetzer.js",
      "woerterbuch.js",
      "vokabeln.js",
      "flashcards.js",
      "lerne.js",
      "notfall.js",
      "bewertung.js",
      "spiele.js",
      "sprachen.js",

      /* ─── BILDUNG ─── */
      "fahrschule.js",
      "blitzer.js",
      "periodensystem.js",
      "mathe.js",
      "geo-quiz.js",
      "ezidi.js",
      "wissen.js",

      /* ─── UTILITIES ─── */
      "qr.js",
      "barcode.js",
      "random.js",
      "text-analyse.js",
      "datum-rechner.js",
      "netzwerk-info.js",
      "geraete-info.js",
      "weltuhr.js",
      "kamera.js",
      "spiegel.js",
      "taschenlampe.js",
      "lupe.js",

      /* ─── FINANZEN ─── */
      "kredit.js",
      "bmi.js",
      "statistik.js",
      "labor.js",

      /* ─── BÜCHER & MEDIEN ─── */
      "bookmarks.js",
      "leseliste.js",
      "sticky-notes.js",

      /* ─── HEATMAPS ─── */
      "heatmap.js",

      /* ─── I18N · VOICE ─── */
      "i18n.js",
      "voice-kurdisch.js",

      /* ─── HOME (zuletzt) ─── */
      "home.js",

      /* ─── PATCHES (nach home.js) ─── */
      "home-patch.js",

      /* ─── SPLASH (ganz zuletzt) ─── */
      "splash.js"
    ];

    var loaded = [];
    var missing = [];
    var bootComplete = false;

    /* ═══════════════════════════════════════════════
       1) WELCOME OVERLAY — Hook #1: console.log intercept
       (erkennt "Fenster geöffnet: XXX" von deskpane.js)
       ═══════════════════════════════════════════════ */
    var _origLog = console.log.bind(console);
    var WINDOW_OPEN_PATTERN = /Fenster geöffnet:\s*(.+?)\s*$/;

    console.log = function() {
      if (bootComplete && window.HalDoWelcome && !window.__suppressWelcome) {
        try {
          var joined = Array.prototype.slice.call(arguments)
            .filter(function(a){ return typeof a === "string"; })
            .join(" ");
          var m = joined.match(WINDOW_OPEN_PATTERN);
          if (m && m[1] && m[1].length >= 2 && m[1].length < 60) {
            window.HalDoWelcome.show(m[1]);
          }
        } catch (e) { /* silent */ }
      }
      return _origLog.apply(null, arguments);
    };

    /* ═══════════════════════════════════════════════
       WELCOME SHOW FUNCTION
       ═══════════════════════════════════════════════ */
    var welcomeTimeout = null;
    var lastShownApp = null;
    var lastShownTime = 0;

    function formatAppName(name) {
      if (!name) return "HalDo App";
      var t = String(name).trim();
      // Entferne führende HalDo-Varianten damit kein "HalDo HalDo" entsteht
      t = t.replace(/^HalDo\s+/i, "").replace(/^HalDoAIOS\s*/i, "");
      return "HalDo " + t;
    }

    function showWelcome(appName) {
      if (!bootComplete) return;
      var formatted = formatAppName(appName);

      // Dedupe: wenn dieselbe App innerhalb 600ms → skip
      var now = Date.now();
      if (formatted === lastShownApp && (now - lastShownTime) < 600) return;
      lastShownApp = formatted;
      lastShownTime = now;

      var overlay = document.getElementById("haldo-app-welcome");
      if (!overlay) return;

      var nameEl = document.getElementById("haw-app-name");
      if (nameEl) nameEl.textContent = formatted;

      // Overlay einblenden
      overlay.classList.remove("out");
      overlay.classList.add("show");

      // Animationen neu starten (damit bei jedem Aufruf alles frisch abspielt)
      var animated = overlay.querySelectorAll(
        ".haw-peacock-bg, .haw-rays, .haw-sun, .haw-wing, .haw-content, .haw-app-name"
      );
      animated.forEach(function(el) {
        el.style.animation = "none";
        // reflow
        void el.offsetWidth;
        el.style.animation = "";
      });

      // Auto-hide nach 2.2s
      clearTimeout(welcomeTimeout);
      welcomeTimeout = setTimeout(hideWelcome, 2200);
    }

    function hideWelcome() {
      var overlay = document.getElementById("haldo-app-welcome");
      if (!overlay) return;
      overlay.classList.add("out");
      setTimeout(function() {
        overlay.classList.remove("show", "out");
      }, 400);
    }

    // Click-to-skip
    document.addEventListener("DOMContentLoaded", function() {
      var overlay = document.getElementById("haldo-app-welcome");
      if (overlay) {
        overlay.addEventListener("click", function() {
          clearTimeout(welcomeTimeout);
          hideWelcome();
        });
      }
    });

    // Global exposen
    window.HalDoWelcome = {
      show: showWelcome,
      hide: hideWelcome,
      formatAppName: formatAppName
    };

    /* ═══════════════════════════════════════════════
       2) SCHNELLERES LADEN — alle Skripte parallel,
          aber Execution bleibt geordnet (async=false)
       ═══════════════════════════════════════════════ */
    function updateProgress(current, total, label) {
      var bar = document.getElementById("haldo-bar");
      var status = document.getElementById("haldo-status");
      var count = document.getElementById("haldo-count");
      if (bar) bar.style.width = Math.round((current / total) * 100) + "%";
      if (status) status.textContent = label || "";
      if (count) count.textContent = current + " / " + total;
    }

    function loadAllScripts() {
      return new Promise(function(resolve) {
        var total = SCRIPTS.length;
        var done = 0;
        updateProgress(0, total, "Lade " + total + " Apps parallel...");

        if (!window.__haldoLoadedScripts) window.__haldoLoadedScripts = {};

        SCRIPTS.forEach(function(src) {
          // Duplikat-Check
          if (window.__haldoLoadedScripts[src]) {
            loaded.push(src);
            done++;
            return;
          }

          var s = document.createElement("script");
          s.src = src;
          s.async = false;  // ← ORDER bleibt erhalten, Downloads parallel!
          s.onload = function() {
            window.__haldoLoadedScripts[src] = true;
            loaded.push(src);
            done++;
            updateProgress(done, total, "Geladen: " + done + " / " + total);
            if (done >= total) resolve();
          };
          s.onerror = function() {
            missing.push(src);
            done++;
            updateProgress(done, total, "Fehlt: " + done + " / " + total);
            if (done >= total) resolve();
          };
          document.head.appendChild(s);
        });

        // Fallback falls SCRIPTS leer
        if (total === 0) resolve();
      });
    }

    /* ═══════════════════════════════════════════════
       BOOT SEQUENCE
       ═══════════════════════════════════════════════ */
    (async function() {
      var tStart = performance.now();

      await loadAllScripts();

      var tLoad = performance.now() - tStart;
      updateProgress(SCRIPTS.length, SCRIPTS.length, "✅ System bereit (" + Math.round(tLoad) + "ms)");

      // Loader SOFORT ausblenden — keine extra Wartezeit
      var loader = document.getElementById("haldo-loader");
      if (loader) {
        loader.classList.add("hide");
        setTimeout(function() { loader.remove(); }, 400);
      }

      // Boot complete → Welcome-System scharf schalten
      bootComplete = true;

      // Shell initialisieren
      setTimeout(function() {
        if (window.HalDo && HalDo.Shell && HalDo.Shell.init) {
          try { HalDo.Shell.init(); } catch(e) { console.warn("[HalDo] Shell.init:", e); }
        }
      }, 100);

      // Zusätzliche Hooks nach Script-Load
      setTimeout(setupAdditionalHooks, 250);

      // Fehlende Apps melden
      reportMissing();

      // Console-Report
      console.log("");
      console.log("╔══════════════════════════════════════════╗");
      console.log("║  🦚 HALDO AI OS — BOOT REPORT v3.0       ║");
      console.log("╠══════════════════════════════════════════╣");
      console.log("║  ✅ Geladen:  " + String(loaded.length).padStart(3, " ") + " Dateien              ║");
      console.log("║  ⚠️  Fehlend: " + String(missing.length).padStart(3, " ") + " Dateien              ║");
      console.log("║  ⚡ Ladezeit: " + String(Math.round(tLoad)).padStart(3, " ") + " ms                  ║");
      console.log("╚══════════════════════════════════════════╝");
      if (missing.length) {
        console.log("");
        console.log("📋 FEHLENDE DATEIEN (in Ordner anlegen):");
        missing.forEach(function(m) { console.log("  · " + m); });
      }
      console.log("");
      console.log("💡 Welcome-System: HalDoWelcome.show('Blitzer') testen");
    })();

    /* ═══════════════════════════════════════════════
       3) ZUSÄTZLICHE WELCOME-HOOKS (nach Script-Load)
       Hook #2: Monkey-Patch auf HalDo.Deskpane
       Hook #3: DOM MutationObserver
       Hook #4: Global verfügbar via window.HalDoWelcome
       ═══════════════════════════════════════════════ */
    function setupAdditionalHooks() {
      // ─── Hook #2: Deskpane API patchen ───
      if (window.HalDo && HalDo.Deskpane) {
        var dp = HalDo.Deskpane;
        ["openWindow", "openApp", "open", "launchApp"].forEach(function(method) {
          if (typeof dp[method] === "function" && !dp["__welcomePatched_" + method]) {
            var orig = dp[method];
            dp[method] = function() {
              try {
                var args = Array.prototype.slice.call(arguments);
                var name = extractAppNameFromArgs(args);
                if (name) window.HalDoWelcome.show(name);
              } catch (e) {}
              return orig.apply(this, arguments);
            };
            dp["__welcomePatched_" + method] = true;
          }
        });
      }

      // ─── Hook #3: DOM MutationObserver ───
      observeDeskForWindows();
    }

    function extractAppNameFromArgs(args) {
      if (!args || !args.length) return null;
      var a = args[0];
      if (typeof a === "string") return a;
      if (a && typeof a === "object") {
        return a.title || a.name || a.appName || a.label || a.id || null;
      }
      return null;
    }

    function observeDeskForWindows() {
      var desk = document.getElementById("haldo-desk");
      if (!desk || !window.MutationObserver) return;

      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.nodeType !== 1) return;
            var title = extractWindowTitle(node);
            if (title) window.HalDoWelcome.show(title);
          });
        });
      });

      observer.observe(desk, { childList: true, subtree: true });
    }

    function extractWindowTitle(node) {
      if (!node.classList) return null;
      var cls = String(node.className || "");
      // Heuristik: sieht aus wie ein Fenster?
      var isWindow = /(^|\s)(window|win|desk-window|app-window|haldo-window|hp-window|hw-window)/i.test(cls);
      if (!isWindow && !node.hasAttribute("data-window") && !node.hasAttribute("data-app-window")) {
        return null;
      }

      var t = node.getAttribute("data-title") || node.getAttribute("data-app-name");
      if (t) return t.trim();

      var titleEl = node.querySelector(
        ".window-title, .win-title, .hp-window-title, .hw-window-title, .title"
      );
      if (titleEl && titleEl.textContent) return titleEl.textContent.trim();

      var h = node.querySelector("h1, h2, h3, header .title");
      if (h && h.textContent && h.textContent.length < 60) return h.textContent.trim();

      return null;
    }

    /* ═══════════════════════════════════════════════
       MISSING REPORT
       ═══════════════════════════════════════════════ */
    function reportMissing() {
      if (!missing.length) return;
      var banner = document.getElementById("haldo-missing-banner");
      var text = document.getElementById("haldo-missing-text");
      if (!banner || !text) return;
      text.textContent = missing.length + " Apps fehlen — zum Diagnose-Modus siehe ⚙-Button oben";
      banner.classList.add("show");

      var close = document.getElementById("haldo-missing-close");
      if (close) close.addEventListener("click", function() {
        banner.classList.remove("show");
      });
    }

    /* ═══════════════════════════════════════════════
       DIAGNOSTICS PANEL
       ═══════════════════════════════════════════════ */
    function openDiagnostics() {
      var panel = document.getElementById("haldo-diag");
      var content = document.getElementById("haldo-diag-content");
      if (!panel || !content) return;

      var html = "";
      html += "<h3>📊 Boot-Zusammenfassung</h3>";
      html += "<pre>Geladen:  " + loaded.length + " Dateien ✅\n";
      html += "Fehlend:  " + missing.length + " Dateien ⚠️\n";
      html += "Welcome:  " + (window.HalDoWelcome ? "aktiv" : "inaktiv") + "\n";
      html += "Runtime:  " + (window.HalDo && HalDo.Runtime ? "aktiv" : "inaktiv") + "\n";
      html += "Apps:     " + (window.HalDo && HalDo.Apps && HalDo.Apps.listInstalled ? HalDo.Apps.listInstalled().length : 0) + "\n";
      html += "Home:     " + (document.getElementById("haldoHomeRoot") ? "gerendert" : "nicht gerendert") + "\n";
      html += "Splash:   " + (window.__haldoSplashDone ? "ausgeführt" : "nicht ausgeführt") + "</pre>";

      html += "<h3>🦚 Welcome-Test</h3>";
      html += "<pre>Öffne die Console und tippe:\n  HalDoWelcome.show('Blitzer')\n  HalDoWelcome.show('Fahrschule')\n  HalDoWelcome.show('Gesundheit')</pre>";

      if (missing.length) {
        html += "<h3>⚠️ Fehlende Dateien (" + missing.length + ")</h3><pre class=\"fail\">";
        missing.forEach(function(m) { html += "  · " + m + "\n"; });
        html += "</pre>";
      } else {
        html += "<h3>✅ Alle Dateien vorhanden</h3>";
      }

      if (loaded.length) {
        html += "<h3>✅ Geladene Dateien (" + loaded.length + ")</h3><pre class=\"ok\">";
        loaded.forEach(function(l) { html += "  · " + l + "\n"; });
        html += "</pre>";
      }

      content.innerHTML = html;
      panel.classList.add("show");
    }

    document.addEventListener("DOMContentLoaded", function() {
      var btn = document.getElementById("haldo-diag-btn");
      if (btn) btn.addEventListener("click", openDiagnostics);

      var closeBtn = document.getElementById("haldo-diag-close");
      if (closeBtn) closeBtn.addEventListener("click", function() {
        document.getElementById("haldo-diag").classList.remove("show");
      });

      // Sidebar-Menü
      var menu = document.getElementById("haldo-menu");
      var sidebar = document.getElementById("haldo-sidebar");
      var overlay = document.getElementById("haldo-overlay");
      if (menu && sidebar && overlay) {
        menu.addEventListener("click", function() {
          sidebar.classList.add("open");
          overlay.classList.add("open");
        });
        overlay.addEventListener("click", function() {
          sidebar.classList.remove("open");
          overlay.classList.remove("open");
        });
      }
    });

    /* ═══════════════════════════════════════════════
       HARD-TIMEOUT: Loader max 25s
       ═══════════════════════════════════════════════ */
    setTimeout(function() {
      var loader = document.getElementById("haldo-loader");
      if (loader && !loader.classList.contains("hide")) {
        var status = document.getElementById("haldo-status");
        if (status) status.textContent = "⚠️ Timeout — starte mit verfügbaren Apps...";
        setTimeout(function() {
          loader.classList.add("hide");
          setTimeout(function() { loader.remove(); }, 400);
        }, 600);
        bootComplete = true;
      }
    }, 25000);

    /* ═══════════════════════════════════════════════
       GLOBAL ERROR HANDLER
       ═══════════════════════════════════════════════ */
    window.addEventListener("error", function(e) {
      if (e && e.message && e.message.indexOf("Script error") === -1) {
        console.warn("[HalDo Boot] Fehler:", e.message, "bei", e.filename, ":", e.lineno);
      }
    });

    /* ═══════════════════════════════════════════════
       SERVICE WORKER (PWA)
       ═══════════════════════════════════════════════ */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("sw.js").catch(function() {
          // sw.js existiert noch nicht → kein Problem
        });
      });
    }
  })();
  </script>
