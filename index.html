<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<style>
:root{
  --bg:#0a0e1a;--bg2:#111827;--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ===== COSMOS BACKGROUND ===== */
#cosmos{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 30%, #1a0b2e 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, #0d1b2a 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, #0f172a 0%, transparent 70%),
    linear-gradient(180deg,#050810 0%,#0a0e1a 60%,#0d1528 100%);
}
#stars-canvas{position:absolute;inset:0;width:100%;height:100%}
.sun{position:absolute;top:8%;right:12%;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,#fff7ed 0%,#fde68a 25%,#fbbf24 50%,#f97316 75%,transparent 100%);
  box-shadow:0 0 60px #f59e0b,0 0 120px #f97316,0 0 200px rgba(249,115,22,.4);
  animation:sunPulse 4s ease-in-out infinite;
}
.moon{position:absolute;top:22%;left:10%;width:85px;height:85px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f8fafc,#e2e8f0 50%,#94a3b8 90%,#64748b 100%);
  box-shadow:inset -12px -12px 24px rgba(0,0,0,.5),0 0 50px rgba(226,232,240,.6);
  animation:moonFloat 8s ease-in-out infinite;
}
.earth{position:absolute;bottom:-160px;left:50%;transform:translateX(-50%);
  width:420px;height:420px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 35%, #93c5fd 0%, #3b82f6 20%, #1d4ed8 45%, #1e3a8a 70%, #0c1e3a 95%);
  box-shadow:0 0 120px rgba(59,130,246,.7),0 0 240px rgba(37,99,235,.3),inset -40px -40px 80px rgba(0,0,0,.6);
  animation:earthFloat 10s ease-in-out infinite;
}
.galaxy{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);
  width:900px;height:180px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(139,92,246,.35) 0%,rgba(6,182,212,.2) 30%,rgba(236,72,153,.1) 60%,transparent 100%);
  filter:blur(30px);opacity:.7;
}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes earthFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px)}}

/* ===== LOADING ===== */
#loading{position:fixed;inset:0;background:rgba(5,8,16,.92);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:20px}
.loader-ring{width:80px;height:80px;border:4px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--dim);letter-spacing:3px;font-size:12px}

/* ===== WELCOME ===== */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9998;gap:22px;padding:40px;text-align:center}
#welcome h1{font-size:clamp(30px,5.5vw,64px);background:linear-gradient(90deg,#06b6d4,#3b82f6,#8b5cf6,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px;font-weight:800;animation:fadeUp 1s ease-out}
#welcome h2{font-size:clamp(16px,2vw,22px);color:#e5e7eb;font-weight:400;line-height:1.6;animation:fadeUp 1s ease-out .2s both}
#welcome .presented{font-size:13px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;animation:fadeUp 1s ease-out .4s both}
#welcome .presented b{color:#fbbf24;font-weight:700}
#welcome .haldo-orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#67e8f9,#06b6d4 40%,#1e3a8a 100%);box-shadow:0 0 60px rgba(6,182,212,.7),0 0 120px rgba(59,130,246,.4);animation:pulse 2s ease-in-out infinite;position:relative}
#welcome .haldo-orb::after{content:'';position:absolute;inset:-15px;border-radius:50%;border:2px solid rgba(6,182,212,.4);animation:orbRing 3s ease-out infinite}
@keyframes orbRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s;animation:fadeUp 1s ease-out .6s both}
#welcome .enter-btn:hover{transform:scale(1.05);box-shadow:0 0 60px rgba(6,182,212,.9)}

/* ===== APP SPLASH ===== */
#app-splash{position:fixed;inset:0;z-index:9997;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;
  background:radial-gradient(circle at 50% 50%, rgba(6,182,212,.18) 0%, rgba(5,8,16,.97) 75%);
  backdrop-filter:blur(10px);
}
#app-splash.show{display:flex;animation:splashIn .3s ease-out}
.splash-icon{font-size:130px;filter:drop-shadow(0 0 50px #06b6d4);animation:starGlow 1.2s ease-out}
.splash-name{font-size:34px;font-weight:800;background:linear-gradient(90deg,#06b6d4,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px;animation:fadeUp .4s ease-out}
.splash-sub{color:var(--dim);font-size:12px;letter-spacing:4px;text-transform:uppercase;animation:fadeUp .6s ease-out}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg);filter:drop-shadow(0 0 0)}50%{transform:scale(1.3) rotate(180deg);filter:drop-shadow(0 0 100px #06b6d4)}100%{transform:scale(1) rotate(360deg);filter:drop-shadow(0 0 50px #06b6d4)}}

/* ===== APP SHELL ===== */
#app{display:none;height:100vh;width:100vw;background:rgba(10,14,26,.88)}
#app.active{display:flex}
#sidebar{width:80px;background:rgba(17,24,39,.95);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:10px;transition:width .25s;backdrop-filter:blur(10px)}
#sidebar.expanded{width:260px;align-items:stretch;padding:16px}
#logo-wrap{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:10px;transition:background .2s}
#logo-wrap:hover{background:var(--bg3)}
#logo-img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;flex-shrink:0;overflow:hidden}
#logo-img img{width:100%;height:100%;object-fit:cover;border-radius:12px}
#logo-text{font-weight:700;font-size:16px;letter-spacing:1px;white-space:nowrap;overflow:hidden}
#sidebar:not(.expanded) #logo-text{display:none}
#sidebar-nav{flex:1;display:flex;flex-direction:column;gap:6px;width:100%;margin-top:20px}
.nav-btn{display:flex;align-items:center;gap:14px;padding:12px;border-radius:10px;transition:all .2s;color:var(--dim);text-align:left;width:100%}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:linear-gradient(90deg,rgba(6,182,212,.2),rgba(59,130,246,.1));color:var(--accent);border-left:3px solid var(--accent)}
.nav-btn .icon{font-size:20px;flex-shrink:0}
.nav-btn .label{white-space:nowrap;overflow:hidden}
#sidebar:not(.expanded) .nav-btn{justify-content:center;padding:14px}
#sidebar:not(.expanded) .nav-btn .label{display:none}
#sidebar:not(.expanded) .nav-btn.active{border-left:none;border-bottom:2px solid var(--accent)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:60px;background:rgba(17,24,39,.9);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;backdrop-filter:blur(10px)}
#topbar h2{font-size:16px;font-weight:600}
#topbar .spacer{flex:1}
#topbar .clock{color:var(--dim);font-size:13px}
#content{flex:1;overflow-y:auto;padding:24px}

/* ===== APP LAUNCHER ===== */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.app-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all .2s;text-align:center}
.app-card:hover{background:var(--bg3);border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(6,182,212,.2)}
.app-card .ico{font-size:36px}
.app-card .nm{font-size:13px;font-weight:500}

/* ===== PANELS ===== */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:12px;color:var(--accent)}
.panel .desc{color:var(--dim);font-size:13px;margin-bottom:12px}
.btn{padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3);color:var(--text)}
.btn.ghost:hover{background:var(--border)}
.btn.danger{background:var(--danger)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ===== DASHBOARD ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-card .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-card .val{font-size:28px;font-weight:700;color:var(--accent)}
.stat-card .unit{font-size:13px;color:var(--dim);margin-left:4px}

/* ===== ANATOMY ===== */
#anatomy-canvas-wrap{position:relative;width:100%;height:calc(100vh - 240px);min-height:400px;background:radial-gradient(circle at 50% 50%,#0f2233 0%,#0a0e1a 100%);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
#anatomy-canvas-wrap canvas{display:block}
.anatomy-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);font-size:13px;transition:all .2s}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:hover:not(.active){border-color:var(--accent);color:var(--accent)}
#anatomy-status{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(0,0,0,.75);padding:8px 12px;border-radius:8px;font-size:12px;color:var(--dim);z-index:5}

/* ===== LISTS ===== */
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.search-bar input{flex:1}
.list-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.list-item:hover{background:var(--bg3);border-color:var(--accent)}
.list-item .title{font-weight:600;margin-bottom:4px}
.list-item .meta{color:var(--dim);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.green{background:rgba(16,185,129,.2);color:var(--success)}
.badge.yellow{background:rgba(245,158,11,.2);color:var(--warn)}
.badge.red{background:rgba(239,68,68,.2);color:var(--danger)}
.badge.blue{background:rgba(6,182,212,.2);color:var(--accent)}

/* ===== CHAT ===== */
#chat-log{display:flex;flex-direction:column;gap:12px;height:calc(100vh - 320px);min-height:300px;overflow-y:auto;padding:16px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px}
.msg{padding:12px 16px;border-radius:12px;max-width:80%;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.msg.bot{align-self:flex-start;background:var(--bg2);border:1px solid var(--border)}
.msg.bot .tts-btn{margin-top:8px;font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline}

/* ===== SETTINGS ===== */
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info{flex:1}
.settings-row .info .lbl{font-weight:600;margin-bottom:4px}
.settings-row .info .sub{color:var(--dim);font-size:12px}
.settings-row .ctrl{flex-shrink:0;margin-left:16px;min-width:200px}
.settings-row .ctrl input,.settings-row .ctrl select{width:auto;min-width:200px}

/* ===== CALC ===== */
.calc-display{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;font-size:32px;text-align:right;font-weight:600;margin-bottom:12px;min-height:70px;overflow:hidden}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{padding:18px;font-size:18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-weight:600;transition:all .15s}
.calc-grid button:hover{background:var(--bg3)}
.calc-grid button.op{color:var(--accent)}
.calc-grid button.eq{background:var(--accent);color:#fff}
.calc-grid button.eq:hover{background:var(--accent2)}

/* ===== EMERGENCY ===== */
.emergency-btn{display:flex;align-items:center;justify-content:center;width:100%;height:200px;background:linear-gradient(135deg,#dc2626,#ef4444);border-radius:20px;font-size:48px;font-weight:900;color:#fff;letter-spacing:4px;box-shadow:0 0 40px rgba(239,68,68,.4);cursor:pointer;transition:transform .1s}
.emergency-btn:active{transform:scale(.98)}

.hint{color:var(--dim);font-size:12px;margin-top:8px;font-style:italic}
.empty{color:var(--dim);text-align:center;padding:40px;font-style:italic}
</style>
</head>

<script>
/* =====================================================
   HALDO AI OS PRO MAX
   ===================================================== */

// ============ STERNE-CANVAS ============
function initStars(){
  const cv = document.getElementById('stars-canvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  let W, H;
  function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const stars = [];
  for(let i=0;i<220;i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+0.3, a:Math.random(), da:(Math.random()-0.5)*0.015});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.a += s.da;
      if(s.a > 1 || s.a < 0.15) s.da *= -1;
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
}
initStars();

// ============ APP LISTE (A-Z) ============
const APPS = [
  {id:'dashboard',ico:'📊',nm:'Dashboard',      fn:viewDashboard},
  {id:'anatomy',  ico:'🦴',nm:'Anatomie 3D',    fn:viewAnatomy},

  {id:'diseases', ico:'🦠',nm:'Krankheiten A-Z', fn:viewDiseases},

  {id:'labs',     ico:'🧪',nm:'Laborwerte A-Z',  fn:viewLabs},
  {id:'contracts',ico:'📝',nm:'Patientenverträge',fn:viewContracts},
  {id:'care',     ico:'🧑‍⚕️',nm:'Pflege & Betreuung',fn:viewCare},
  {id:'emergency',ico:'🚨',nm:'Notfall',          fn:viewEmergency},
  {id:'iot',      ico:'📡',nm:'IoT & Hotspot',    fn:viewIot},
  {id:'hardware', ico:'🖨️',nm:'Hardware & Kasse', fn:viewHardware},

  {id:'calendar', ico:'📅',nm:'Kalender',         fn:viewCalendar},
  {id:'calc',     ico:'🧮',nm:'Rechner',          fn:viewCalc},
  {id:'timer',    ico:'⏱️',nm:'Timer',           fn:viewTimer},
  {id:'finance',  ico:'💰',nm:'Finanzen',         fn:viewFinance},

  {id:'cook',     ico:'🍳',nm:'Kochbuch',         fn:viewCook},

  {id:'shopping', ico:'🛒',nm:'Einkaufsliste',    fn:viewShopping},
  {id:'research', ico:'🔍',nm:'Recherche',        fn:viewResearch},
  {id:'translator',ico:'🌐',nm:'Übersetzer',      fn:viewTranslator},
  {id:'passwords',ico:'🔐',nm:'Passwort-Safe',    fn:viewPasswords},
  {id:'contacts', ico:'👥',nm:'Kontakte',         fn:viewContacts},
  {id:'voice',    ico:'🎙️',nm:'Sprachnotizen',   fn:viewVoice},
];

// ============ BOOT ============
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('welcome').style.display = 'flex';
  }, 900);
});

function enterApp(){
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('app').classList.add('active');
  showView('home');
  startClock();

// ============ TÖNE (Web Audio) ============
function playTone(type){
  if(type === 'silent') return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const patterns = {
      chime:   [{f:880,t:'sine'},{f:1320,t:'sine'}],
      beep:    [{f:1000,t:'square'}],
      bell:    [{f:660,t:'triangle'},{f:990,t:'triangle'},{f:1320,t:'triangle'}],
      soft:    [{f:520,t:'sine'},{f:780,t:'sine'}],
      digital: [{f:1200,t:'square'},{f:800,t:'square'},{f:1600,t:'square'}],
      epic:    [{f:440,t:'sine'},{f:660,t:'sine'},{f:880,t:'sine'},{f:1320,t:'sine'}]
    };
    const notes = patterns[type] || patterns.chime;
    let t = 0;
    notes.forEach(n => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = n.f;
      o.type = n.t;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.28);
      o.start(ctx.currentTime + t);
      o.stop(ctx.currentTime + t + 0.32);
      t += 0.14;
    });
  }catch(e){ console.warn('Ton-Fehler', e); }
}

  `;

function initAnatomyScene(){
  const wrap = document.getElementById('anatomy-canvas-wrap');
  if(!wrap || !window.THREE) return;
  if(A.init){ // existiert schon – nur Größe neu setzen
    const w2 = wrap.clientWidth, h2 = wrap.clientHeight;
    wrap.appendChild(A.ren.domElement);
    A.ren.setSize(w2, h2);
    A.cam.aspect = w2/h2; A.cam.updateProjectionMatrix();
    return;
  }
  A.init = true;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  A.scene = new THREE.Scene();
  A.cam = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
  A.cam.position.set(0, 1.2, 4);
  A.ren = new THREE.WebGLRenderer({antialias:true, alpha:true});
  A.ren.setSize(w, h);
  A.ren.setPixelRatio(window.devicePixelRatio);
  A.ren.setClearColor(0x000000, 0);
  wrap.appendChild(A.ren.domElement);
  A.ctrl = new THREE.OrbitControls(A.cam, A.ren.domElement);
  A.ctrl.target.set(0, 1, 0);
  A.ctrl.enableDamping = true;
  A.scene.add(new THREE.AmbientLight(0xffffff, .7));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.2); d1.position.set(3, 4, 3); A.scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x06b6d4, .8); d2.position.set(-3, -2, -2); A.scene.add(d2);
  const grid = new THREE.GridHelper(6, 12, 0x1f2937, 0x111827);
  A.scene.add(grid);
  A.loader = new THREE.GLTFLoader();
  loadAnatomy('male');
  (function loop(){ requestAnimationFrame(loop); A.ctrl.update(); A.ren.render(A.scene, A.cam); })();
  window.addEventListener('resize', () => {
    const w2 = wrap.clientWidth, h2 = wrap.clientHeight;
    if(A.cam && A.ren){ A.cam.aspect = w2/h2; A.cam.updateProjectionMatrix(); A.ren.setSize(w2, h2); }
  });
}

function clearCurrent(){
  if(A.current){
    A.scene.remove(A.current);
    A.current.traverse(o => { if(o.isMesh){ if(o.geometry) o.geometry.dispose(); if(o.material){ if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose()); else o.material.dispose(); } } });
    A.current = null;
  }
}

function loadAnatomy(sex){
  A.currentSex = sex;
  document.querySelectorAll('.anatomy-toolbar .chip').forEach((b, i) => {
    if(i < 3) b.classList.toggle('active', ['male','female','baby'][i] === sex);
  });
  const status = document.getElementById('anatomy-status');
  if(!A.scene){ setTimeout(() => loadAnatomy(sex), 100); return; }
  clearCurrent();

  // Fallback-Pfade pro Geschlecht
  const pathMap = {
    male:   ['adult_male/male_base.glb', 'male_base.glb', 'models/adult_male/male_base.glb'],
    female: ['adult_female/female_base.glb', 'female_base.glb', 'models/adult_female/female_base.glb'],
    baby:   ['neonate/neonate_base.glb', 'baby_base.glb', 'infant/infant_base.glb', 'models/neonate/neonate_base.glb']
  };
  const paths = pathMap[sex] || [];
  let idx = 0;

  function tryNext(){
    if(idx >= paths.length){
      status.innerHTML = `❌ Keine Datei gefunden für <b>${sex}</b>.<br>Lege die GLB in <code>adult_male/</code> bzw. <code>adult_female/</code> oder nutze <b>📁 Knochen-Ordner</b>.`;
      return;
    }
    const p = paths[idx++];
    status.textContent = `Lade ${p} …`;
    A.loader.load(p, onLoaded, onProgress, () => tryNext());
  }

  function onProgress(xhr){
    if(xhr.total){
      const p = paths[idx-1];
      status.textContent = `Lade ${p} … ${Math.round(xhr.loaded/xhr.total*100)}%`;
    }
  }

  function onLoaded(gltf){
    const m = gltf.scene;
    const box = new THREE.Box3().setFromObject(m);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    m.position.sub(center);
    m.position.y += size.y/2;
    m.scale.setScalar(1.75 / size.y);
    m.traverse(o => {
      if(o.isMesh){
        o.castShadow = true; o.receiveShadow = true;
        if(o.material) o.material.side = THREE.DoubleSide;
      }
    });
    A.scene.add(m); A.current = m;
    status.innerHTML = `✅ <b>${paths[idx-1]}</b> geladen (${size.y.toFixed(2)} m Originalskala).`;
    A.cam.position.set(0, 1.2, 4);
    A.ctrl.target.set(0, 1, 0);
  }
  tryNext();
}

// Ordner-Auswahl für Osteo3D-Knochen
function pickBoneFolder(){
  const picker = document.getElementById('bones-picker');
  picker.onchange = handleBoneFiles;
  picker.click();
}

async function handleBoneFiles(e){
  const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.glb'));
  if(!files.length){ alert('Keine GLB-Dateien im Ordner gefunden.'); return; }
  const status = document.getElementById('anatomy-status');
  if(!A.scene){ await new Promise(r => setTimeout(r, 300)); }
  clearCurrent();
  status.textContent = `Lade ${files.length} Knochen …`;
  const group = new THREE.Group();
  let ok = 0, fail = 0;
  for(const f of files){
    const url = URL.createObjectURL(f);
    try{
      const gltf = await new Promise((res, rej) => A.loader.load(url, res, undefined, rej));
      group.add(gltf.scene);
      ok++;
    }catch(err){ fail++; console.warn('Fehler bei', f.name, err); }
    URL.revokeObjectURL(url);
    status.textContent = `Lade Knochen … ${ok+fail}/${files.length}`;
  }
  // Gesamtes Skelett zentrieren und skalieren
  const box = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  group.position.sub(center);
  group.position.y += size.y/2;
  if(size.y > 0) group.scale.setScalar(1.75 / size.y);
  group.traverse(o => {
    if(o.isMesh){
      if(o.material) o.material.side = THREE.DoubleSide;
    }
  });
  A.scene.add(group);
  A.current = group;
  status.innerHTML = `✅ <b>${ok}</b> Knochen geladen${fail?`, <span style="color:#f59e0b">${fail} fehlgeschlagen</span>`:''}.`;
  A.cam.position.set(0, 1.2, 4);
  A.ctrl.target.set(0, 1, 0);
}

function resetAnatomyCam(){
  if(!A.ctrl) return;
  A.cam.position.set(0, 1.2, 4);
  A.ctrl.target.set(0, 1, 0);
  A.ctrl.update();
}

    <div class="list-item" onclick="speak('${l.n}. Referenz: ${l.ref}')">

      <div class="meta"><span class="badge red">↓ ${l.low}</span> <span class="badge yellow">↑ ${l.high}</span></div>

}

// ============ NOTFALL ============
let emergTimer = null, emergSec = 0;
function viewEmergency(c){
  c.innerHTML = `
    <div class="panel">
      <h3>🚨 Notfall – 112</h3>
      <button class="emergency-btn" onclick="window.location.href='tel:112'">112</button>
      <p class="hint">Bei akuter Lebensgefahr: sofort anrufen. Diese App ersetzt keinen Notruf.</p>
    </div>
    <div class="panel"><h3>⏱️ Erste-Hilfe-Timer</h3>
      <div class="btn-row"><button class="btn" onclick="startEmerg()">Start</button><button class="btn ghost" onclick="resetEmerg()">Reset</button></div>
      <div style="font-size:32px;font-weight:700;color:var(--accent);margin-top:12px" id="emerg-clock">00:00</div>
    </div>
  `;
}
function startEmerg(){
  if(emergTimer) return;
  emergTimer = setInterval(() => { emergSec++; document.getElementById('emerg-clock').textContent = fmtTime(emergSec); }, 1000);
}
function resetEmerg(){ clearInterval(emergTimer); emergTimer = null; emergSec = 0; document.getElementById('emerg-clock').textContent = '00:00'; }
function fmtTime(s){ const m = Math.floor(s/60), ss = s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }

function renderStub(c, title, desc, actionsHtml=''){
  c.innerHTML = `<div class="panel"><h3>${title}</h3><p class="desc">${desc}</p>${actionsHtml}</div>`;
}
function viewContracts(c){ renderStub(c,'📝 Patientenverträge','Behandlungs- und Betreuungsverträge – Vorlagen folgen.','<button class="btn" onclick="alert(\'Vorlage wird geladen…\')">Muster ansehen</button>'); }
function viewCare(c){ renderStub(c,'🧑‍⚕️ Pflege & Betreuung','Pflegedokumentation und Medikamentenplan.','<textarea placeholder="Notiz zur Pflege…" style="height:120px;margin-top:8px"></textarea>'); }

  renderStub(c,'🌤️ Wetter','Vorhersage für deinen Standort.',
    '<div id="wx">Lade Wetter…</div><button class="btn" onclick="loadWeather()">Aktualisieren</button>');
  setTimeout(loadWeather, 50);
}
function loadWeather(){
  const el = document.getElementById('wx'); if(!el) return;
  if(!navigator.geolocation){ el.textContent='GPS nicht verfügbar.'; return; }
  navigator.geolocation.getCurrentPosition(async p => {
    try{
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code`);
      const j = await r.json();
      el.innerHTML = `<div style="font-size:32px;font-weight:700;color:var(--accent)">${j.current.temperature_2m} °C</div><div class="hint">Code: ${j.current.weather_code}</div>`;
    }catch(e){ el.textContent='Fehler beim Laden.'; }
  }, () => { el.textContent='GPS verweigert.'; });
}

    <textarea id="notes-txt" style="height:60vh;font-family:var(--font);font-size:14px" placeholder="Deine Notizen…">${localStorage.getItem('haldo_notes')||''}</textarea>

  </div>`;
}
function viewCalendar(c){
  const now = new Date(); const m = now.getMonth(); const y = now.getFullYear();
  const first = new Date(y, m, 1).getDay(); const days = new Date(y, m+1, 0).getDate();
  let cells = ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<div class="meta" style="text-align:center;font-weight:600">${d}</div>`).join('');
  const offset = (first+6)%7;
  for(let i=0;i<offset;i++) cells += '<div></div>';
  for(let d=1; d<=days; d++){
    const isToday = d === now.getDate();
    cells += `<div style="padding:10px;text-align:center;border:1px solid var(--border);border-radius:8px;${isToday?'background:var(--accent);color:#fff;font-weight:700':''}">${d}</div>`;
  }
  renderStub(c,'📅 Kalender', now.toLocaleString('de-DE',{month:'long',year:'numeric'}),
    `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px">${cells}</div>`);
}
function viewCalc(c){
  c.innerHTML = `<div class="panel" style="max-width:360px">
    <h3>🧮 Rechner</h3>
    <div class="calc-display" id="calc-d">0</div>
    <div class="calc-grid">
      <button onclick="calcIn('C')">C</button><button onclick="calcIn('(')">(</button><button onclick="calcIn(')')">)</button><button class="op" onclick="calcIn('/')">÷</button>
      <button onclick="calcIn('7')">7</button><button onclick="calcIn('8')">8</button><button onclick="calcIn('9')">9</button><button class="op" onclick="calcIn('*')">×</button>
      <button onclick="calcIn('4')">4</button><button onclick="calcIn('5')">5</button><button onclick="calcIn('6')">6</button><button class="op" onclick="calcIn('-')">−</button>
      <button onclick="calcIn('1')">1</button><button onclick="calcIn('2')">2</button><button onclick="calcIn('3')">3</button><button class="op" onclick="calcIn('+')">+</button>
      <button onclick="calcIn('0')">0</button><button onclick="calcIn('.')">.</button><button onclick="calcIn('⌫')">⌫</button><button class="eq" onclick="calcIn('=')">=</button>
    </div>
  </div>`;
}
let calcBuf = '';
function calcIn(t){
  const d = document.getElementById('calc-d');
  if(t === 'C') calcBuf = '';
  else if(t === '⌫') calcBuf = calcBuf.slice(0, -1);
  else if(t === '='){ try{ calcBuf = String(eval(calcBuf || '0')); }catch{ calcBuf = 'ERR'; } }
  else calcBuf += t;
  d.textContent = calcBuf || '0';
}
let timerInt = null;
function viewTimer(c){
  c.innerHTML = `<div class="panel" style="max-width:400px">
    <h3>⏱️ Timer</h3>
    <input id="timer-min" type="number" min="1" value="5" placeholder="Minuten">
    <div class="btn-row"><button class="btn" onclick="startTimerApp()">Start</button><button class="btn ghost" onclick="stopTimerApp()">Stop</button></div>
    <div style="font-size:48px;font-weight:800;color:var(--accent);text-align:center;margin-top:16px" id="timer-show">00:00</div>
  </div>`;
}
function startTimerApp(){
  stopTimerApp();
  let total = (parseInt(document.getElementById('timer-min').value) || 5) * 60;
  const show = document.getElementById('timer-show');
  const tick = () => { if(total <= 0){ clearInterval(timerInt); speak('Zeit abgelaufen.'); return; } total--; show.textContent = fmtTime(total); };
  tick();
  timerInt = setInterval(tick, 1000);
}
function stopTimerApp(){ clearInterval(timerInt); }

function delShop(i){
  const it = JSON.parse(localStorage.getItem('haldo_shop') || '[]'); it.splice(i, 1);

function addContact(){
  const n = document.getElementById('c-name').value.trim();
