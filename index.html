<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>🦚 HalDo AI OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦚</text></svg>">

  <style>
    :root {
      --p1: #00e5ff; --p2: #4da8ff; --p3: #b478ff;
      --bg: #050810; --bg-2: #0a0f1a;
      --card: rgba(255,255,255,.03);
      --text: #e8ecff; --text-dim: #a8b0cc; --text-mute: #6b7390;
      --border-soft: 1px solid rgba(255,255,255,.08);
      --glow: 0 0 24px rgba(0,229,255,.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .35s ease;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

    #haldo-root { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #haldo-header {
      padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,.2); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.05);
      flex-shrink: 0; z-index: 900; height: 56px;
    }
    #haldo-title { font-size: 16px; font-weight: 900; color: var(--p1); }
    #haldo-content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px; padding-bottom: 90px;
      scroll-behavior: smooth;
    }
    #haldo-sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
      background: var(--bg-2); border-right: 1px solid rgba(255,255,255,.08);
      transform: translateX(-100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 9999; overflow-y: auto; padding: 16px;
    }
    #haldo-sidebar.open { transform: translateX(0); }
    #haldo-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9998;
    }
    #haldo-overlay.open { opacity: 1; pointer-events: auto; }

    .card { padding: 16px; background: var(--card); border: var(--border-soft); border-radius: 14px; margin-bottom: 12px; backdrop-filter: blur(8px); }
    .card h3 { font-size: 15px; font-weight: 900; color: var(--p1); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 10.5px; color: var(--text-mute); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px; background: rgba(0,0,0,.3);
      border: var(--border-soft); border-radius: 10px; color: var(--text);
      font-size: 13px; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--p1); box-shadow: 0 0 0 3px rgba(0,229,255,.1);
    }
    .btn {
      padding: 12px 18px; background: linear-gradient(135deg, var(--p1), var(--p3));
      border: none; border-radius: 10px; color: #000; font-size: 13px;
      font-weight: 900; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
      font-family: inherit; transition: transform .15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
    .btn.sec { background: rgba(255,255,255,.05); color: var(--text); border: var(--border-soft); }
    .btn.danger { background: linear-gradient(135deg, #ff8080, #ff4d4d); color: #fff; }
    .btn.full { width: 100%; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 9px 14px; background: rgba(255,255,255,.04);
      border: var(--border-soft); border-radius: 10px;
      color: var(--text-dim); font-size: 11.5px; font-weight: 800;
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    .tab.active { background: linear-gradient(135deg, var(--p1), var(--p3)); color: #000; border-color: transparent; }

    #haldo-loader {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999; transition: opacity .4s;
    }
    #haldo-loader.hide { opacity: 0; pointer-events: none; }
    #haldo-loader .logo { font-size: 72px; animation: haldoBounce 1.2s infinite; }
    #haldo-loader .txt { margin-top: 16px; font-size: 13px; color: var(--text-mute); font-weight: 800; letter-spacing: 2px; }
    @keyframes haldoBounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.05); } }
  </style>
</head>
<body>

  <div id="haldo-loader">
    <div class="logo">🦚</div>
    <div class="txt">HALDO AI OS LÄDT...</div>
  </div>

  <div id="haldo-overlay"></div>
  <nav id="haldo-sidebar"></nav>

  <div id="haldo-root">
    <header id="haldo-header">
      <button id="haldo-menu" style="background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px">☰</button>
      <div id="haldo-title">🦚 HalDo AI OS</div>
      <div style="width:32px"></div>
    </header>
    <main id="haldo-content"></main>
  </div>

  <div id="haldo-desk"></div>
  <div id="haldo-taskbar"></div>

  <script>
  (function(){
    var SCRIPTS = [
      /* CORE */
      "runtime.js", "store.js", "voice.js", "notify.js", "theme.js", "apps.js",
      /* DESKPANE + AVATAR + SHELL */
      "deskpane.js", "avatar.js", "shell.js",
      /* SYSTEM */
      "settings.js", "system-center.js", "update.js", "backup.js", "recovery.js", "diagnostics.js", "appstore.js", "analytics.js",
      /* KOMMUNIKATION */
      "chat.js", "ai.js", "email.js", "posteingang.js", "kontakte.js", "aufnahme.js", "phone.js", "videocall.js",
      /* PRODUKTIVITÄT */
      "tasks.js", "notes.js", "kalender.js", "projekte.js", "arbeitszeit.js", "dokumente.js", "links.js", "passwort.js",
      /* GESUNDHEIT */
      "fitness.js", "gesundheit.js", "stimmung.js", "gewohnheiten.js",
      /* LIFESTYLE */
      "kueche.js", "zuhause.js", "finanzen.js", "reisen.js", "auto.js", "musik.js", "photos.js", "video.js", "bild.js",
      /* WERKZEUGE */
      "wetter.js", "rechner.js", "timer.js", "uebersetzer.js", "woerterbuch.js", "lerne.js", "notfall.js", "bewertung.js", "spiele.js", "sprachen.js",
      /* I18N + VOICE */
      "i18n.js", "voice-kurdisch.js",
      /* HOME */
      "home.js"
    ];

    function loadScript(src){
      return new Promise(function(resolve){
        var s = document.createElement("script");
        s.src = src;
        s.async = false;
        s.onload = function(){ resolve(true); };
        s.onerror = function(){ resolve(false); };
        document.head.appendChild(s);
      });
    }

    (async function(){
      for(var i = 0; i < SCRIPTS.length; i++){
        await loadScript(SCRIPTS[i]);
      }

      var loader = document.getElementById("haldo-loader");
      if(loader){
        setTimeout(function(){
          loader.classList.add("hide");
          setTimeout(function(){ loader.remove(); }, 500);
        }, 400);
      }

      setTimeout(function(){
        if(window.HalDo && HalDo.Shell && HalDo.Shell.init){
          try { HalDo.Shell.init(); } catch(e){ console.warn(e); }
        }
      }, 200);
    })();

    setTimeout(function(){
      var loader = document.getElementById("haldo-loader");
      if(loader && !loader.classList.contains("hide")){
        loader.classList.add("hide");
        setTimeout(function(){ loader.remove(); }, 500);
      }
    }, 8000);
  })();
  </script>

</body>
</html>
