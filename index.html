<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000208">
<title>HalDo AI OS Pro Max</title>
<link rel="icon" href="logo.png">
<style>
/* ==========================================================
   HalDo AI OS Pro Max — Foundation v1.0
   Architektur: TopBar / Sidebar / Desktop / BottomBar
   Keine Altlasten. Keine überlappenden Elemente.
   ========================================================== */
:root{
  --bg:#000208; --fg:#e0f0ff;
  --gold:#d4af37; --gold2:#b8941e;
  --blue:#4da8ff; --cyan:#00e5ff; --purple:#b478ff; --pink:#ff78c8;
  --accent:#00e5ff; --accent2:#4da8ff;
  --glass:rgba(10,25,45,.55); --glass-hi:rgba(25,50,85,.7);
  --blur:22px; --radius:18px; --radius-sm:14px;
  --font-size:14px; --glow:1; --anim:1;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --topbar-h:56px; --bottombar-h:64px; --sidebar-w:76px;
}
[data-theme="cyborg"]{--accent:#ff78c8;--accent2:#b478ff;--gold:#ff78c8;--blue:#b478ff;--cyan:#ff78c8;}
[data-theme="gold"]{--accent:#ffd700;--accent2:#ffb347;--gold:#ffd700;--blue:#ffb347;--cyan:#ffd700;}
[data-theme="matrix"]{--accent:#00ff88;--accent2:#00cc66;--gold:#00ff88;--blue:#00cc66;--cyan:#00ff88;}
[data-theme="crimson"]{--accent:#ff4466;--accent2:#cc0044;--gold:#ff4466;--blue:#ff0066;--cyan:#ff4466;}
[data-theme="sunset"]{--accent:#ff9944;--accent2:#ff6688;--gold:#ffaa55;--blue:#ff6688;--cyan:#ffaa55;}
[data-theme="ice"]{--accent:#aae0ff;--accent2:#66aaff;--gold:#cceeff;--blue:#6699ff;--cyan:#cceeff;}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',Roboto,sans-serif;
  font-size:var(--font-size);user-select:none;-webkit-user-select:none;touch-action:manipulation;}
body{position:fixed;inset:0;}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--fg);}

#cosmosBg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}

/* ============ LOADER (nur beim ersten Start) ============ */
#loader{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 50%,#041225,#000208 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .6s ease,visibility .6s;padding:20px;}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none;}
#loader img{width:96px;height:96px;filter:drop-shadow(0 0 24px var(--accent));animation:pulseLogo 2s ease-in-out infinite;}
@keyframes pulseLogo{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px var(--accent));}
  50%{transform:scale(1.08);filter:drop-shadow(0 0 40px var(--accent));}}
#loader h1{font-size:22px;font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}
#loader p{font-size:12px;color:rgba(224,240,255,.6);text-align:center;max-width:280px;line-height:1.5;}
#loader .bar{width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
#loader .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--cyan),var(--purple));
  border-radius:3px;animation:loadBar 1.4s ease-in-out infinite;}
@keyframes loadBar{0%{margin-left:-30%}100%{margin-left:100%}}

/* ============ TOP BAR ============ */
#topBar{position:fixed;top:0;left:0;right:0;height:calc(var(--topbar-h) + var(--safe-t));
  padding-top:var(--safe-t);z-index:500;display:flex;align-items:center;justify-content:space-between;
  padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r));
  background:linear-gradient(180deg,rgba(0,4,10,.85),rgba(0,4,10,.4));
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-bottom:1px solid rgba(0,229,255,.18);}
#topBar .brand{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 8px;border-radius:12px;transition:background .2s;}
#topBar .brand:hover{background:rgba(0,229,255,.08);}
#topBar .brand img{width:34px;height:34px;filter:drop-shadow(0 0 8px var(--accent));}
#topBar .brand b{font-size:14px;background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;letter-spacing:.3px;}
#topBar .brand small{display:block;font-size:9px;color:rgba(224,240,255,.5);font-weight:400;}
#topBar .sysinfo{display:flex;align-items:center;gap:12px;font-size:12px;color:rgba(224,240,255,.75);}
#topBar .sysinfo span{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:10px;
  background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.18);}
#topBar .theme-btn{width:38px;height:38px;border-radius:12px;background:rgba(0,229,255,.1);
  border:1px solid rgba(0,229,255,.3);display:grid;place-items:center;font-size:16px;transition:.2s;}
#topBar .theme-btn:hover{background:rgba(0,229,255,.2);transform:scale(1.05);}

/* ============ SIDEBAR ============ */
#sidebar{position:fixed;left:0;top:calc(var(--topbar-h) + var(--safe-t));
  bottom:calc(var(--bottombar-h) + var(--safe-b));
  width:var(--sidebar-w);padding:10px 6px 10px calc(6px + var(--safe-l));
  z-index:400;display:flex;flex-direction:column;gap:6px;overflow-y:auto;
  background:linear-gradient(90deg,rgba(0,4,10,.7),rgba(0,4,10,.3));
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-right:1px solid rgba(0,229,255,.18);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);}
#sidebar.hidden{transform:translateX(-100%);}
#sidebar::-webkit-scrollbar{width:4px;}
#sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:4px;}
.sb-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:100%;padding:10px 4px;border-radius:12px;background:transparent;
  color:rgba(224,240,255,.7);font-size:9px;font-weight:500;
  border:1px solid transparent;transition:all .2s;min-height:56px;cursor:pointer;}
.sb-item .ic{font-size:22px;line-height:1;filter:drop-shadow(0 0 6px rgba(0,229,255,.4));transition:.2s;}
.sb-item:hover,.sb-item.active{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.35);color:#fff;}
.sb-item:hover .ic,.sb-item.active .ic{transform:scale(1.15);}
.sb-divider{height:1px;background:rgba(0,229,255,.15);margin:6px 4px;}

/* ============ DESKTOP ============ */
#desktop{position:fixed;left:var(--sidebar-w);right:0;top:calc(var(--topbar-h) + var(--safe-t));
  bottom:calc(var(--bottombar-h) + var(--safe-b));z-index:10;overflow:hidden;}
#desktop.no-sidebar{left:0;}

/* ============ FENSTER ============ */
.win{position:absolute;min-width:280px;min-height:200px;border-radius:var(--radius);
  background:var(--glass);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border:2px solid var(--gold);box-shadow:0 0 0 1px rgba(77,168,255,.5) inset,
  0 10px 40px rgba(0,0,0,.6),0 0 calc(30px * var(--glow)) rgba(212,175,55,.25);
  display:flex;flex-direction:column;overflow:hidden;z-index:200;
  transition:box-shadow .2s,transform .15s;}
.win.active{z-index:250;box-shadow:0 0 0 1.5px rgba(0,229,255,.8) inset,
  0 14px 60px rgba(0,0,0,.7),0 0 calc(50px * var(--glow)) rgba(0,229,255,.35);}
.win.maximized{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;}
.win.minimized{display:none;}
.win-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;
  background:linear-gradient(180deg,rgba(0,229,255,.12),rgba(0,229,255,.03));
  border-bottom:1px solid rgba(0,229,255,.25);cursor:move;touch-action:none;flex-shrink:0;gap:8px;}
.win-title{font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;
  pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.win-title .ic{font-size:16px;}
.win-ctrls{display:flex;gap:6px;flex-shrink:0;}
.win-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:16px;
  background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:#fff;
  transition:.15s;z-index:999999;cursor:pointer;flex-shrink:0;}
.win-btn:hover{background:rgba(0,229,255,.25);transform:scale(1.06);}
.win-btn.close{background:rgba(255,80,100,.2);border-color:rgba(255,80,100,.5);}
.win-btn.close:hover{background:rgba(255,80,100,.4);}
.win-body{flex:1;overflow:auto;padding:14px;position:relative;}
.win-body::-webkit-scrollbar{width:6px;height:6px;}
.win-body::-webkit-scrollbar-thumb{background:rgba(0,229,255,.35);border-radius:3px;}
.win-body::-webkit-scrollbar-track{background:rgba(0,0,0,.2);}
.win-resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:5;
  background:linear-gradient(135deg,transparent 50%,rgba(0,229,255,.4) 50%,rgba(0,229,255,.4) 60%,transparent 60%,transparent 70%,rgba(0,229,255,.4) 70%,rgba(0,229,255,.4) 80%,transparent 80%);}

/* ============ BOTTOM BAR ============ */
#bottomBar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bottombar-h) + var(--safe-b));
  padding-bottom:var(--safe-b);z-index:500;display:flex;align-items:center;justify-content:center;
  gap:10px;padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r));
  background:linear-gradient(0deg,rgba(0,4,10,.9),rgba(0,4,10,.5));
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-top:1px solid rgba(0,229,255,.18);}
.bb-btn{flex:1;max-width:180px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:13px;font-weight:600;color:#fff;background:var(--glass-hi);
  border:1.5px solid rgba(0,229,255,.4);transition:.2s;cursor:pointer;white-space:nowrap;}
.bb-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,229,255,.3);background:rgba(0,229,255,.2);}
.bb-btn.cyborg{border-color:var(--pink);background:rgba(255,120,200,.12);}
.bb-btn.cyborg:hover{box-shadow:0 6px 20px rgba(255,120,200,.4);}
.bb-btn .ic{font-size:18px;}

/* ============ TOASTS ============ */
#toastStack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottombar-h) + var(--safe-b) + 20px);
  z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:92vw;}
.toast{background:rgba(10,25,45,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1.5px solid var(--accent);border-radius:14px;padding:12px 18px;font-size:13px;
  color:#fff;box-shadow:0 8px 30px rgba(0,229,255,.3);max-width:420px;
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1);pointer-events:auto;
  display:flex;align-items:center;gap:10px;}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast.out{animation:toastOut .3s forwards;}
@keyframes toastOut{to{opacity:0;transform:translateY(20px) scale(.9)}}

/* ============ APP SPLASH ============ */
#appSplash{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(0,40,80,.95),rgba(0,4,10,.98) 70%);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:20px;text-align:center;flex-direction:column;gap:16px;}
#appSplash.show{display:flex;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#appSplash img{width:88px;height:88px;filter:drop-shadow(0 0 30px var(--accent));animation:pulseLogo 2s ease-in-out infinite;}
#appSplash h2{font-size:22px;font-weight:700;color:#fff;letter-spacing:.4px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;}
#appSplash .sub{font-size:13px;color:rgba(224,240,255,.7);}
#appSplash .by{font-size:11px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}
#appSplash .spinner{width:36px;height:36px;border:3px solid rgba(0,229,255,.2);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;margin-top:8px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ WELCOME OVERLAY ============ */
#welcome{position:fixed;inset:0;z-index:20000;background:radial-gradient(circle at 50% 45%,#0a1e35,#000208 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;
  text-align:center;transition:opacity .8s,visibility .8s;}
#welcome.hide{opacity:0;visibility:hidden;pointer-events:none;}
#welcome img{width:120px;height:120px;filter:drop-shadow(0 0 40px var(--accent));
  animation:pulseLogo 2.5s ease-in-out infinite;}
#welcome h1{font-size:32px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#welcome p{font-size:14px;color:rgba(224,240,255,.8);max-width:400px;line-height:1.6;}
#welcome .by{font-size:12px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-weight:600;}
#welcome button{margin-top:16px;padding:14px 32px;border-radius:16px;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--cyan),var(--purple));color:#000;border:none;
  box-shadow:0 8px 30px rgba(0,229,255,.4);transition:.2s;cursor:pointer;}
#welcome button:hover{transform:scale(1.05);box-shadow:0 12px 40px rgba(0,229,255,.6);}

/* ============ SETTINGS / COMMON UI ============ */
.set-section{margin-bottom:14px;background:rgba(0,229,255,.05);border:1px solid rgba(0,229,255,.2);
  border-radius:14px;overflow:hidden;}
.set-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  background:rgba(0,229,255,.08);font-weight:600;font-size:13px;transition:.2s;}
.set-head:hover{background:rgba(0,229,255,.14);}
.set-head .arrow{transition:transform .25s;}
.set-section.open .arrow{transform:rotate(90deg);}
.set-body{display:none;padding:10px 14px 14px;}
.set-section.open .set-body{display:block;}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid rgba(0,229,255,.1);font-size:13px;}
.set-row:last-child{border-bottom:none;}
.set-row small{color:rgba(224,240,255,.55);font-size:11px;display:block;margin-top:2px;}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;cursor:pointer;}
.toggle input{display:none;}
.toggle span{position:absolute;inset:0;background:rgba(255,255,255,.15);border-radius:14px;transition:.2s;}
.toggle span::before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.toggle input:checked + span{background:var(--accent);}
.toggle input:checked + span::before{transform:translateX(20px);}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:6px 12px;border-radius:10px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);
  font-size:12px;color:var(--fg);cursor:pointer;transition:.15s;white-space:nowrap;}
.chip:hover{background:rgba(0,229,255,.2);}
.chip.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600;}
.btn{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(0,229,255,.15);
  border:1px solid rgba(0,229,255,.4);color:#fff;cursor:pointer;transition:.2s;}
.btn:hover{background:rgba(0,229,255,.3);transform:translateY(-1px);}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--purple));border:none;color:#000;}
.btn.danger{background:rgba(255,80,100,.2);border-color:rgba(255,80,100,.5);}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border-radius:10px;
  background:rgba(0,0,0,.35);border:1px solid rgba(0,229,255,.3);color:#fff;font-size:13px;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:80px;}

/* App grid (Launcher) */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px;padding:8px;}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;
  background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);cursor:pointer;transition:.2s;text-align:center;}
.app-tile:hover{background:rgba(0,229,255,.2);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,229,255,.3);}
.app-tile .ic{font-size:28px;}
.app-tile .nm{font-size:10px;color:#fff;font-weight:500;line-height:1.2;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}

/* Calendar widget */
.widget{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.25);border-radius:14px;
  padding:14px;margin-bottom:12px;}
.widget h3{font-size:13px;margin-bottom:8px;color:var(--cyan);text-transform:uppercase;letter-spacing:.5px;}
.widget .big{font-size:32px;font-weight:800;color:#fff;}
.widget .small{font-size:11px;color:rgba(224,240,255,.6);}

/* Responsive */
@media(max-width:600px){
  :root{--sidebar-w:64px;--topbar-h:52px;}
  .sb-item .ic{font-size:20px;}
  .sb-item{font-size:8px;min-height:52px;}
  #topBar .brand b{font-size:12px;}
  #topBar .sysinfo span.hide-mobile{display:none;}
  .bb-btn{font-size:11px;gap:4px;height:42px;}
  #welcome h1{font-size:24px;}
}
</style>
</head>
<body>

<!-- COSMOS CANVAS -->
<canvas id="cosmosBg"></canvas>

<!-- LOADER -->
<div id="loader">
  <img src="logo.png" alt="HalDo">
  <h1>HalDo AI OS Pro Max</h1>
  <div class="bar"><i></i></div>
  <p>System startet… Kosmos wird geladen</p>
</div>

<!-- WELCOME OVERLAY -->
<div id="welcome" class="hide">
  <img src="logo.png" alt="HalDo">
  <h1>HalDo AI OS Pro Max</h1>
  <p>Willkommen bei HalDo AI OS Pro Max — eine professionelle, lebendige Betriebssystem-Umgebung.</p>
  <div class="by">Präsentiert von Halil Donma</div>
  <button id="welcomeBtn">🚀 System starten</button>
</div>

<!-- TOP BAR -->
<header id="topBar">
  <div class="brand" id="brandBtn">
    <img src="logo.png" alt="HalDo">
    <div>
      <b>HalDo AI OS</b>
      <small>Pro Max v1.0</small>
    </div>
  </div>
  <div class="sysinfo">
    <span id="clockDisplay">--:--</span>
    <span class="hide-mobile" id="batteryDisplay">🔋 --%</span>
    <span class="hide-mobile" id="wifiDisplay">📶</span>
    <button class="theme-btn" id="themeBtn" title="Theme wechseln">🎨</button>
  </div>
</header>

<!-- SIDEBAR -->
<aside id="sidebar">
  <button class="sb-item active" data-nav="home"><span class="ic">🏠</span><span>Home</span></button>
  <button class="sb-item" data-nav="apps"><span class="ic">📱</span><span>Apps</span></button>
  <button class="sb-item" data-nav="system"><span class="ic">⚙️</span><span>System</span></button>
  <div class="sb-divider"></div>
  <button class="sb-item" data-nav="chat"><span class="ic">💬</span><span>Chat</span></button>
  <button class="sb-item" data-nav="ai"><span class="ic">🤖</span><span>AI</span></button>
  <button class="sb-item" data-nav="files"><span class="ic">📁</span><span>Files</span></button>
  <div class="sb-divider"></div>
  <button class="sb-item" data-nav="setup"><span class="ic">🔧</span><span>Setup</span></button>
  <button class="sb-item" data-nav="info"><span class="ic">ℹ️</span><span>Info</span></button>
</aside>

<!-- DESKTOP -->
<main id="desktop"></main>

<!-- BOTTOM BAR -->
<footer id="bottomBar">
  <button class="bb-btn" data-bb="chat"><span class="ic">💬</span>Chat</button>

<script>
/* ==========================================================
   HalDo AI OS Pro Max — Core JS
   Modular, sauber, keine globalen Altlasten
   ========================================================== */
window.HalDo = window.HalDo || {};

/* ---------- 1. STORE (LocalStorage Wrapper) ---------- */
HalDo.Store = (() => {
  const PREFIX = 'haldo_';
  const get = (k, def = null) => {
    try { const v = localStorage.getItem(PREFIX + k); return v == null ? def : JSON.parse(v); }
    catch (e) { return def; }
  };
  const set = (k, v) => {
    try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; }
    catch (e) { console.warn('Store write failed', e); return false; }
  };
  const del = (k) => { try { localStorage.removeItem(PREFIX + k); } catch (e) {} };
  const all = () => {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(PREFIX)) {
        try { out[k.slice(PREFIX.length)] = JSON.parse(localStorage.getItem(k)); }
        catch (e) {}
      }
    }
    return out;
  };
  const clearAll = () => {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(PREFIX)) keys.push(k);
    }
    keys.forEach(k => localStorage.removeItem(k));
  };
  return { get, set, del, all, clearAll };
})();

/* ---------- 2. SOUND (Web Audio, 8 verschiedene Töne) ---------- */
HalDo.Sound = (() => {
  let ctx = null;
  const getCtx = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  const playTone = (freq, dur, type = 'sine', vol = 0.15, delay = 0) => {
    const c = getCtx(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(c.destination);
    const t0 = c.currentTime + delay;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.start(t0); o.stop(t0 + dur);
  };
  const sounds = {
    click:    () => playTone(880, .06, 'sine', .08),
    tap:      () => playTone(660, .05, 'triangle', .06),
    notify1:  () => { playTone(1200, .12, 'sine', .18); },
    notify2:  () => { playTone(880, .1, 'sine', .16, 0); playTone(1320, .14, 'sine', .16, .12); },
    notify3:  () => { playTone(523, .1, 'sine', .15, 0); playTone(659, .1, 'sine', .15, .1); playTone(784, .16, 'sine', .15, .2); },
    notify4:  () => { playTone(1568, .08, 'sine', .14, 0); playTone(1047, .14, 'sine', .14, .1); },
    alarm:    () => { [0,.15,.3,.45,.6].forEach(d => playTone(1200, .1, 'square', .18, d)); },
    welcome:  () => { [523,659,784,1047].forEach((f,i) => playTone(f, .2, 'sine', .14, i*.12)); },
    error:    () => { playTone(200, .25, 'sawtooth', .18); playTone(150, .3, 'sawtooth', .18, .15); },
    success:  () => { playTone(784, .1, 'sine', .16, 0); playTone(1047, .18, 'sine', .16, .1); },
    unlock:   () => { playTone(440, .08, 'sine', .14); playTone(660, .1, 'sine', .14, .08); playTone(880, .14, 'sine', .14, .18); },
  };
  const play = (name) => {
    const pref = HalDo.Store.get('settings', {}).soundName || 'notify3';
    if (!HalDo.Store.get('settings', {}).soundOn) {
      const c = getCtx(); if (c && c.state === 'suspended') c.resume();
      return;
    }
    const fn = sounds[name] || sounds[pref] || sounds.notify3;
    fn();
  };
  return { play, sounds };
})();

/* ---------- 3. THEME ---------- */
HalDo.Theme = (() => {
  const themes = ['holo','cyborg','gold','matrix','crimson','sunset','ice'];
  const names  = { holo:'🌌 Holo', cyborg:'⚡ Cyborg', gold:'👑 Gold', matrix:'💚 Matrix',
                   crimson:'🔴 Crimson', sunset:'🌅 Sunset', ice:'❄️ Ice' };
  const apply = (theme) => {
    if (!themes.includes(theme)) theme = 'holo';
    document.documentElement.setAttribute('data-theme', theme === 'holo' ? '' : theme);
    document.body.setAttribute('data-theme', theme);
    HalDo.Store.set('theme', theme);
  };
  const next = () => {
    const cur = HalDo.Store.get('theme', 'holo');
    const idx = (themes.indexOf(cur) + 1) % themes.length;
    apply(themes[idx]);
    HalDo.Toast.show(`${names[themes[idx]]} aktiv`);
    HalDo.Sound.play('tap');
  };
  const init = () => {
    const saved = HalDo.Store.get('theme', 'holo');
    apply(saved);
  };
  return { apply, next, init, themes, names };
})();

/* ---------- 4. TOAST ---------- */
HalDo.Toast = (() => {
  const stack = () => document.getElementById('toastStack');
  const show = (msg, dur = 3200) => {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    stack().appendChild(el);
    setTimeout(() => {
      el.classList.add('out');
      setTimeout(() => el.remove(), 300);
    }, dur);
  };
  return { show };
})();

/* ---------- 5. SPLASH ---------- */
HalDo.Splash = (() => {
  let timer = null;
  const show = (title, sub) => {
    const el = document.getElementById('appSplash');
    document.getElementById('splashTitle').textContent = title || 'HalDo';
    document.getElementById('splashSub').textContent = sub || 'Willkommen…';
    el.classList.add('show');
  };
  const hide = () => {
    document.getElementById('appSplash').classList.remove('show');
    if (timer) clearTimeout(timer);
  };
  const flash = (title, sub, delay = 1100) => {
    show(title, sub);
    if (timer) clearTimeout(timer);
    timer = setTimeout(hide, delay);
  };
  return { show, hide, flash };
})();

/* ---------- 6. WELCOME (TTS Begrüßung) ---------- */
HalDo.Welcome = (() => {
  const speak = (text) => {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; u.rate = 0.95; u.pitch = 1.05; u.volume = 0.9;
      const voices = speechSynthesis.getVoices();
      const de = voices.find(v => v.lang && v.lang.startsWith('de'));
      if (de) u.voice = de;
      speechSynthesis.speak(u);
    } catch (e) {}
  };
  const appGreet = (appName) => {
    const text = `Willkommen bei ${appName}. Präsentiert von Halil Donma.`;
    speak(text);
  };
  const systemGreet = () => {
    const text = 'Willkommen bei HalDo AI OS Pro Max. Eine professionelle Betriebssystem-Umgebung, präsentiert von Halil Donma.';
    speak(text);
  };
  return { speak, appGreet, systemGreet };
})();

/* ---------- 7. WINDOW MANAGER ---------- */
HalDo.Win = (() => {
  let zCounter = 200;
  const desktop = () => document.getElementById('desktop');
  const wins = new Map();

  const bringFront = (id) => {
    wins.forEach((w, wid) => {
      w.el.classList.toggle('active', wid === id);
      w.el.style.zIndex = wid === id ? 260 : 200;
    });
  };

  const open = (opts) => {
    const { id, title, icon = '📱', width = 480, height = 420, body = '', onMount = null } = opts;
    if (wins.has(id)) {
      const existing = wins.get(id);
      existing.el.classList.remove('minimized');
      bringFront(id);
      HalDo.Sound.play('tap');
      return existing;
    }
    const el = document.createElement('div');
    el.className = 'win active';
    el.style.width = width + 'px';
    el.style.height = height + 'px';
    el.style.left = Math.max(20, (window.innerWidth - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w')) || 76) - width) / 2) + 'px';
    el.style.top = Math.max(20, (window.innerHeight - height) / 2 - 30) + 'px';
    el.dataset.winId = id;
    el.style.zIndex = ++zCounter;

    el.innerHTML = `
      <div class="win-head">
        <div class="win-title"><span class="ic">${icon}</span><span>${title}</span></div>
        <div class="win-ctrls">
          <button class="win-btn min" title="Minimieren">–</button>
          <button class="win-btn max" title="Maximieren">⤢</button>
          <button class="win-btn close" title="Schließen">✕</button>
        </div>
      </div>
      <div class="win-body">${body}</div>
      <div class="win-resize"></div>
    `;
    desktop().appendChild(el);

    const win = { id, el, title, icon };

    // Window-Buttons
    el.querySelector('.close').addEventListener('click', (e) => {
      e.stopPropagation();
      HalDo.Sound.play('tap');
      close(id);
    });
    el.querySelector('.max').addEventListener('click', (e) => {
      e.stopPropagation();
      HalDo.Sound.play('tap');
      el.classList.toggle('maximized');
    });
    el.querySelector('.min').addEventListener('click', (e) => {
      e.stopPropagation();
      HalDo.Sound.play('tap');
      el.classList.add('minimized');
    });

    // Focus on click
    el.addEventListener('mousedown', () => bringFront(id), true);
    el.addEventListener('touchstart', () => bringFront(id), { passive: true });

    // Drag (nur über Head)
    const head = el.querySelector('.win-head');
    let drag = null;
    const startDrag = (e) => {
      if (e.target.closest('.win-btn')) return;
      const p = e.touches ? e.touches[0] : e;
      drag = { x: p.clientX, y: p.clientY, l: el.offsetLeft, t: el.offsetTop };
      el.style.transition = 'none';
      document.addEventListener('mousemove', onDrag);
      document.addEventListener('touchmove', onDrag, { passive: false });
      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);
    };
    const onDrag = (e) => {
      if (!drag) return;
      if (e.cancelable) e.preventDefault();
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - drag.x, dy = p.clientY - drag.y;
      el.style.left = Math.max(-el.offsetWidth + 100, Math.min(window.innerWidth - 100, drag.l + dx)) + 'px';
      el.style.top  = Math.max(0, Math.min(window.innerHeight - 60, drag.t + dy)) + 'px';
    };
    const endDrag = () => {
      drag = null;
      el.style.transition = '';
      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('touchmove', onDrag);
      document.removeEventListener('mouseup', endDrag);
      document.removeEventListener('touchend', endDrag);
    };
    head.addEventListener('mousedown', startDrag);
    head.addEventListener('touchstart', startDrag, { passive: true });

    // Resize (nur über Ecke)
    const resizer = el.querySelector('.win-resize');
    let rs = null;
    const startResize = (e) => {
      e.stopPropagation();
      const p = e.touches ? e.touches[0] : e;
      rs = { x: p.clientX, y: p.clientY, w: el.offsetWidth, h: el.offsetHeight };
      document.addEventListener('mousemove', onResize);
      document.addEventListener('touchmove', onResize, { passive: false });
      document.addEventListener('mouseup', endResize);
      document.addEventListener('touchend', endResize);
    };
    const onResize = (e) => {
      if (!rs) return;
      if (e.cancelable) e.preventDefault();
      const p = e.touches ? e.touches[0] : e;
      el.style.width  = Math.max(280, rs.w + (p.clientX - rs.x)) + 'px';
      el.style.height = Math.max(200, rs.h + (p.clientY - rs.y)) + 'px';
    };
    const endResize = () => {
      rs = null;
      document.removeEventListener('mousemove', onResize);
      document.removeEventListener('touchmove', onResize);
      document.removeEventListener('mouseup', endResize);
      document.removeEventListener('touchend', endResize);
    };
    resizer.addEventListener('mousedown', startResize);
    resizer.addEventListener('touchstart', startResize, { passive: true });

    wins.set(id, win);
    if (onMount) { try { onMount(el.querySelector('.win-body'), el); } catch (e) { console.error('onMount', e); } }
    return win;
  };

  const close = (id) => {
    const w = wins.get(id);
    if (!w) return;
    w.el.style.transition = 'opacity .15s, transform .15s';
    w.el.style.opacity = '0';
    w.el.style.transform = 'scale(.95)';
    setTimeout(() => { w.el.remove(); wins.delete(id); }, 160);
  };

  const closeAll = () => [...wins.keys()].forEach(close);
  return { open, close, closeAll, wins };
})();

/* ---------- 8. COSMOS (Three.js) ---------- */
HalDo.Cosmos = (() => {
  let scene, camera, renderer, sunMesh, sunFace, sunCorona, sunCorona2, sunCorona3;
  let planets = [], starsSmall, starsBig, moonMesh;
  let clock, raycaster, pointer;
  let targetMouseX = 0, targetMouseY = 0, mouseX = 0, mouseY = 0;
  let earthMesh, earthClouds, earthNight, earthAtmo;
  let isRunning = false;
  const textures = {};
  const loader = new THREE.TextureLoader(); loader.crossOrigin = 'anonymous';
  const TEX_URLS = {
    earthDay:'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
    earthNight:'https://unpkg.com/three-globe/example/img/earth-night.jpg',
    earthTopology:'https://unpkg.com/three-globe/example/img/earth-topology.png',
    earthWater:'https://unpkg.com/three-globe/example/img/earth-water.png',
    earthClouds:'https://unpkg.com/three-globe/example/img/clouds.png',
    moon:'https://unpkg.com/three-globe/example/img/moon.jpg',
    logo:'logo.png'
  };

  const makeProcedural = (c1, c2, type) => {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
    const ctx = cv.getContext('2d'); ctx.fillStyle = c1; ctx.fillRect(0,0,256,128);
    if (type === 'bands') {
      for (let i = 0; i < 12; i++) { ctx.fillStyle = i%2===0?c1:c2; ctx.globalAlpha = .5+Math.random()*.3; ctx.fillRect(0, i*128/12, 256, 128/12); }
      ctx.globalAlpha = 1;
    } else if (type === 'crater') {
      for (let i = 0; i < 50; i++) { ctx.fillStyle = `rgba(0,0,0,${.12+Math.random()*.28})`; ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*128,Math.random()*8+2,0,Math.PI*2); ctx.fill(); }
    } else if (type === 'cloud') {
      for (let i = 0; i < 30; i++) { ctx.fillStyle = `rgba(255,255,255,${.08+Math.random()*.18})`; ctx.beginPath(); ctx.ellipse(Math.random()*256,Math.random()*128,Math.random()*30+10,Math.random()*10+3,Math.random()*Math.PI,0,Math.PI*2); ctx.fill(); }
    } else if (type === 'sun') {
      const g = ctx.createRadialGradient(128,64,0,128,64,128);
      g.addColorStop(0,'#fff5a0'); g.addColorStop(.35,'#ffcc00'); g.addColorStop(.65,'#ff9900'); g.addColorStop(1,'#ff4400');
      ctx.fillStyle = g; ctx.fillRect(0,0,256,128);
      for (let i = 0; i < 300; i++) { ctx.fillStyle = Math.random()>.5?'rgba(255,255,220,.5)':'rgba(200,50,0,.35)'; ctx.beginPath(); ctx.arc(Math.random()*256,Math.random()*128,Math.random()*4,0,Math.PI*2); ctx.fill(); }
    }
    return new THREE.CanvasTexture(cv);
  };

  const loadTex = (key, url) => {
    return new Promise(resolve => {
      loader.load(url,
        tex => { textures[key] = tex; resolve(); },
        undefined,
        () => { resolve(); }
      );
    });
  };

  const createStars = (count, size, opacity) => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count*3), colors = new Float32Array(count*3);
    for (let i = 0; i < count; i++) {
      const r = 400 + Math.random()*700;
      const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
      pos[i*3+2] = r*Math.cos(ph);
      const c = Math.random();
      if (c < .65) { colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1; }
      else if (c < .82) { colors[i*3]=.65; colors[i*3+1]=.82; colors[i*3+2]=1; }
      else if (c < .94) { colors[i*3]=1; colors[i*3+1]=.9; colors[i*3+2]=.55; }
      else { colors[i*3]=1; colors[i*3+1]=.65; colors[i*3+2]=.65; }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
    const mat = new THREE.PointsMaterial({ size, vertexColors:true, transparent:true, opacity,
      sizeAttenuation:true, depthWrite:false, blending:THREE.AdditiveBlending });
    return new THREE.Points(geo, mat);
  };

  const makeGlow = (size, c1, c2) => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 512;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(256,256,20,256,256,256);
    g.addColorStop(0, c1); g.addColorStop(.5, c2); g.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,512,512);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map:new THREE.CanvasTexture(cv), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
    s.scale.set(size, size, 1); return s;
  };

  const PLANETS = [
    { name:'Merkur', color:'#8a7d6b', color2:'#5a4f42', size:1.2, dist:11, speed:.7, type:'crater' },
    { name:'Venus',  color:'#e8c88a', color2:'#a88040', size:1.7, dist:15, speed:.55, type:'cloud' },
    { name:'Erde',   color:'#4da8ff', color2:'#1a5599', size:4.5, dist:26, speed:.42, type:'earth' },
    { name:'Mars',   color:'#c1440e', color2:'#8a2f0a', size:1.4, dist:34, speed:.35, type:'crater' },
    { name:'Jupiter',color:'#d4a373', color2:'#a08050', size:3.8, dist:44, speed:.25, type:'bands' },
    { name:'Saturn', color:'#e8d5a0', color2:'#a07840', size:3.3, dist:55, speed:.20, type:'bands', ring:true },
    { name:'Uranus', color:'#7de0e0', color2:'#3a8080', size:2.2, dist:64, speed:.15, type:'bands' },
    { name:'Neptun', color:'#3355ee', color2:'#0a1a6a', size:2.0, dist:72, speed:.12, type:'bands' },
    { name:'Pluto',  color:'#b08860', color2:'#5a4020', size:.9,  dist:80, speed:.09, type:'crater' },
    { name:'Xena',   color:'#8866aa', color2:'#4a2a6a', size:1.0, dist:88, speed:.07, type:'crater' },
    { name:'Sedna',  color:'#9977cc', color2:'#4a3a7a', size:1.05,dist:96, speed:.05, type:'crater' },
    { name:'Eris',   color:'#aaccff', color2:'#5070a0', size:1.1, dist:104,speed:.04, type:'crater' }
  ];

  const init = async () => {
    const canvas = document.getElementById('cosmosBg');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000208);
    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, .1, 3000);
    camera.position.set(0, 12, 55);
    camera.lookAt(0,0,0);
    renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    clock = new THREE.Clock();
    raycaster = new THREE.Raycaster();
    pointer = new THREE.Vector2();

    // Texturen laden (parallel, nicht blockierend)
    Promise.all(['earthDay','earthNight','earthTopology','earthWater','earthClouds','moon','logo']
      .map(k => loadTex(k, TEX_URLS[k]))).catch(()=>{});

    // Sterne
    starsSmall = createStars(5000, 1.0, .75); scene.add(starsSmall);
    starsBig = createStars(900, 2.4, .95); scene.add(starsBig);

    // Sonne
    sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(4, 64, 64),
      new THREE.MeshBasicMaterial({ map: makeProcedural('#ffcc00','#ff4400','sun') })
    );
    scene.add(sunMesh);

    // Sonnen-Face (logo.png als overlay — 2 Augen)
    sunFace = new THREE.Sprite(new THREE.SpriteMaterial({
      map: textures.logo || makeProcedural('#00e5ff','#00e5ff','sun'),
      transparent:true, opacity:.85, depthWrite:false, blending:THREE.NormalBlending
    }));
    sunFace.scale.set(7, 7, 1);
    sunFace.position.set(0, 0, 4.05);
    scene.add(sunFace);

    // Lichter
    scene.add(new THREE.PointLight(0xfff5d0, 3.5, 0, 1));
    scene.add(new THREE.AmbientLight(0x505070, .45));

    // Corona
    sunCorona  = makeGlow(28, 'rgba(255,240,150,.95)', 'rgba(255,180,60,.5)');
    sunCorona2 = makeGlow(45, 'rgba(255,200,100,.5)',  'rgba(255,120,30,.2)');
    sunCorona3 = makeGlow(75, 'rgba(255,150,60,.2)',   'rgba(255,60,0,.05)');
    scene.add(sunCorona, sunCorona2, sunCorona3);

    // Planeten
    PLANETS.forEach((def, idx) => {
      const geo = new THREE.SphereGeometry(def.size, 48, 48);
      const mat = new THREE.MeshPhongMaterial({ color:0xffffff, shininess:15 });
      if (def.type !== 'earth') {
        const tex = makeProcedural(def.color, def.color2, def.type);
        mat.map = tex;
      }
      const mesh = new THREE.Mesh(geo, mat);
      const orbit = new THREE.Group();
      orbit.add(mesh);
      mesh.position.x = def.dist;

      // Umlaufbahn-Ring
      const ringGeo = new THREE.BufferGeometry();
      const pts = [];
      for (let a = 0; a <= 64; a++) {
        const ang = (a/64) * Math.PI * 2;
        pts.push(Math.cos(ang) * def.dist, 0, Math.sin(ang) * def.dist);
      }
      ringGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const orbitRing = new THREE.Line(ringGeo, new THREE.LineBasicMaterial({ color:0x00e5ff, transparent:true, opacity:.15 }));
      scene.add(orbitRing);
      scene.add(orbit);

      // Erde spezial
      if (def.name === 'Erde') {
        earthMesh = mesh;
        const applyEarth = () => {
          if (textures.earthDay)  { mat.map = textures.earthDay; mat.needsUpdate = true; }
          if (textures.earthTopology) { mat.bumpMap = textures.earthTopology; mat.bumpScale = .08; mat.needsUpdate = true; }
          if (textures.earthWater) { mat.specularMap = textures.earthWater; mat.specular = new THREE.Color(0x556677); mat.shininess = 25; mat.needsUpdate = true; }
          if (textures.earthClouds && !earthClouds) {
            earthClouds = new THREE.Mesh(
              new THREE.SphereGeometry(def.size*1.015, 48, 48),
              new THREE.MeshPhongMaterial({ map:textures.earthClouds, transparent:true, opacity:.5, depthWrite:false })
            );
            mesh.add(earthClouds);
          }
        };
        // Nach dem Laden anwenden
        const tryApply = setInterval(() => {
          if (textures.earthDay && textures.earthNight) { clearInterval(tryApply); applyEarth(); }
        }, 300);
        setTimeout(() => clearInterval(tryApply), 8000);
        // Mond
        moonMesh = new THREE.Mesh(
          new THREE.SphereGeometry(def.size * 0.27, 24, 24),
          new THREE.MeshPhongMaterial({ color:0xdddddd })
        );
        mesh.add(moonMesh);
        moonMesh.position.set(def.size + 1.8, 0, 0);
        // Nacht-Textur
        setTimeout(() => {
          if (textures.earthNight) {
            earthNight = new THREE.Mesh(
              new THREE.SphereGeometry(def.size * 1.002, 48, 48),
              new THREE.MeshBasicMaterial({ map:textures.earthNight, blending:THREE.AdditiveBlending, transparent:true, opacity:.65, depthWrite:false })
            );
            mesh.add(earthNight);
          }
        }, 1500);
      }

      // Saturn-Ring
      if (def.ring) {
        const ringGeo = new THREE.RingGeometry(def.size*1.4, def.size*2.2, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color:0xddccaa, side:THREE.DoubleSide, transparent:true, opacity:.6 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.4;
        mesh.add(ring);
      }

      planets.push({ mesh, orbit, def, angle: Math.random() * Math.PI * 2 });
    });

    // Klick-Handler (Sonne → Chat)
    canvas.addEventListener('click', onCanvasClick);
    canvas.addEventListener('touchstart', onCanvasClick, { passive: true });
    canvas.style.cursor = 'pointer';

    // Parallax
    window.addEventListener('mousemove', (e) => {
      targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
      targetMouseY = (e.clientY / window.innerHeight) * 2 - 1;
    });

    window.addEventListener('resize', onResize);

    isRunning = true;
    animate();
    // Loader ausblenden
    setTimeout(() => {
      document.getElementById('loader').classList.add('hide');
      setTimeout(() => document.getElementById('loader').remove(), 700);
      document.getElementById('welcome').classList.remove('hide');
    }, 1200);
  };

  const onCanvasClick = (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    pointer.x = ((p.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((p.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects([sunMesh, sunFace], true);
    if (hits.length > 0) {
      HalDo.Sound.play('success');
      openAIApp();
    }
  };

  const openAIApp = () => {
    HalDo.Splash.flash('HalDo AI', 'Sonne angetippt — Chat öffnet…', 900);
    setTimeout(() => {
      HalDo.Apps.open('chat-haldo');
    }, 950);
  };

  const onResize = () => {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };

  const animate = () => {
    if (!isRunning) return;
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    // Parallax
    mouseX += (targetMouseX - mouseX) * 0.03;
    mouseY += (targetMouseY - mouseY) * 0.03;
    // Sterne rotieren
    if (starsSmall) starsSmall.rotation.y = t * 0.01;
    if (starsBig) starsBig.rotation.y = -t * 0.008;
    // Sonne
    if (sunMesh) sunMesh.rotation.y = t * 0.05;
    if (sunCorona) { const s = 1 + Math.sin(t*1.5)*.06; sunCorona.scale.set(28*s,28*s,1); }
    if (sunCorona2) { const s = 1 + Math.sin(t*1.1+1)*.08; sunCorona2.scale.set(45*s,45*s,1); }
    if (sunCorona3) { const s = 1 + Math.sin(t*0.7+2)*.05; sunCorona3.scale.set(75*s,75*s,1); }
    if (sunFace) sunFace.lookAt(camera.position);
    // Planeten
    planets.forEach(p => {
      p.angle += p.def.speed * 0.003;
      p.mesh.position.x = Math.cos(p.angle) * p.def.dist;
      p.mesh.position.z = Math.sin(p.angle) * p.def.dist;
      p.mesh.rotation.y = t * 0.3;
    });
    // Erde
    if (earthClouds) earthClouds.rotation.y = t * 0.06;
    if (earthNight) earthNight.rotation.y = t * 0.02;
    if (moonMesh) moonMesh.position.x = (earthMesh?.geometry?.parameters?.radius || 4.5) * 1.4;
    if (moonMesh && earthMesh) {
      moonMesh.position.set(
        Math.cos(t * 0.5) * 8,
        Math.sin(t * 0.3) * 1.5,
        Math.sin(t * 0.5) * 8
      );
    }
    // Kamera
    camera.position.x = mouseX * 6;
    camera.position.y = 12 + mouseY * 3;
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  };

  const start = () => init().catch(e => console.error('Cosmos init:', e));
  const stop = () => { isRunning = false; };
  return { start, stop };
})();

/* ---------- 9. APP REGISTRY ---------- */
HalDo.Apps = (() => {
  // Definierte Apps: { id, name, icon, cat, build(body, winEl) }
  const registry = {};

  const register = (app) => { registry[app.id] = app; };
  const get = (id) => registry[id];

  const open = (id) => {
    const app = registry[id];
    if (!app) {
      HalDo.Toast.show(`App "${id}" nicht gefunden`);
      return;
    }
    HalDo.Sound.play('success');
    HalDo.Splash.flash(app.name, 'wird geladen…', 900);
    setTimeout(() => {
      HalDo.Welcome.appGreet(app.name);
      HalDo.Win.open({
        id: app.id,
        title: app.name,
        icon: app.icon,
        width: app.width || 480,
        height: app.height || 460,
        body: '',
        onMount: (body) => {
          if (app.build) app.build(body);
        }
      });
    }, 950);
  };

  const all = () => Object.values(registry);
  const byCategory = (cat) => all().filter(a => a.cat === cat);

  return { register, get, open, all, byCategory };
})();

/* ---------- 10. THEME + CLOCK + BATTERY UPDATERS ---------- */
const startClock = () => {
  const el = document.getElementById('clockDisplay');
  const tick = () => {
    const d = new Date();
    el.textContent = d.toLocaleTimeString('de-DE', { hour:'2-digit', minute:'2-digit' });
  };
  tick(); setInterval(tick, 30000);
};

const startBattery = async () => {
  const el = document.getElementById('batteryDisplay');
  try {
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      const update = () => { el.textContent = `🔋 ${Math.round(b.level*100)}%`; };
      update();
      b.addEventListener('levelchange', update);
    } else el.textContent = '🔋 --';
  } catch (e) { el.textContent = '🔋 --'; }
};

const startWifi = () => {
  const el = document.getElementById('wifiDisplay');
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (conn) {
    const type = conn.effectiveType || '—';
    el.textContent = `📶 ${type.toUpperCase()}`;
  } else el.textContent = '📶';
};

/* ---------- 11. INIT ---------- */
const initHalDo = () => {
  HalDo.Theme.init();
  HalDo.Cosmos.start();
  startClock();
  startBattery();
  startWifi();

  // Welcome-Button
  document.getElementById('welcomeBtn').addEventListener('click', () => {
    HalDo.Sound.play('welcome');
    document.getElementById('welcome').classList.add('hide');
    HalDo.Welcome.systemGreet();
    setTimeout(() => {
      HalDo.Toast.show('Willkommen bei HalDo AI OS Pro Max');
    }, 1200);
  });

  // Theme-Button
  document.getElementById('themeBtn').addEventListener('click', HalDo.Theme.next);

  // Brand → Sidebar toggle
  document.getElementById('brandBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('hidden');
    document.getElementById('desktop').classList.toggle('no-sidebar');
    HalDo.Sound.play('tap');
  });

  // Sidebar Navigation
  document.querySelectorAll('.sb-item').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      HalDo.Sound.play('tap');
      const nav = btn.dataset.nav;
      if (nav === 'home') HalDo.Apps.open('dashboard');
      else if (nav === 'apps') HalDo.Apps.open('launcher');
      else if (nav === 'system') HalDo.Apps.open('settings');
      else if (nav === 'chat') HalDo.Apps.open('chat-haldo');
      else if (nav === 'ai') HalDo.Apps.open('avatar');
      else if (nav === 'files') HalDo.Apps.open('files');
      else if (nav === 'setup') HalDo.Apps.open('setup');
      else if (nav === 'info') HalDo.Apps.open('about');
    });
  });

  // Bottom bar
  document.querySelectorAll('.bb-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      HalDo.Sound.play('tap');
      const b = btn.dataset.bb;
      if (b === 'chat') HalDo.Apps.open('chat-haldo');
      else if (b === 'ai') HalDo.Apps.open('avatar');
      else if (b === 'cyborg') {
        HalDo.Theme.apply('cyborg');
        HalDo.Toast.show('⚡ CYBORG-Modus aktiviert');
        HalDo.Sound.play('notify4');
      }
    });
  });

  // Settings default
  HalDo.Store.set('settings', Object.assign({
    soundOn: true, soundName: 'notify3',
    language: 'de',
    theme: 'holo',
    splashOn: true, ttsOn: true
  }, HalDo.Store.get('settings', {})));
};

HalDo.Apps.register({
  id:'chat-haldo', name:'HalDo AI', icon:'💬', cat:'ai', width:520, height:560,
  build: (body) => {
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;height:100%;min-height:420px">
        <div id="chatLog" style="flex:1;overflow-y:auto;padding:8px;background:rgba(0,0,0,.2);border-radius:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px"></div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="chatInput" type="text" placeholder="Schreibe eine Nachricht…" style="flex:1">
          <button class="btn primary" id="chatSend" style="min-width:52px">➤</button>
        </div>
        <div class="chip-group" style="margin-top:8px">
          <div class="chip" data-cmd="Hallo HalDo">Hallo</div>
          <div class="chip" data-cmd="Wie geht es dir?">Wie geht's?</div>
          <div class="chip" data-cmd="Wer bist du?">Wer bist du?</div>
          <div class="chip" data-cmd="Erzähl mir über Ezidi">Ezidi</div>
        </div>
      </div>
    `;
    const log = body.querySelector('#chatLog');
    const input = body.querySelector('#chatInput');
    const sendBtn = body.querySelector('#chatSend');

    const addMsg = (text, who) => {
      const m = document.createElement('div');
      m.style.cssText = `padding:8px 12px;border-radius:12px;max-width:80%;font-size:13px;line-height:1.4;
        ${who === 'ai'
          ? 'background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.35);align-self:flex-start;'
          : 'background:rgba(180,120,255,.2);border:1px solid rgba(180,120,255,.4);align-self:flex-end;'}
        color:#fff`;
      m.textContent = text;
      log.appendChild(m);
      log.scrollTop = log.scrollHeight;
    };

    const reply = (text) => {
      const t = text.toLowerCase();
      if (/hallo|hi|hey/.test(t)) return 'Hallo Bruder! 👋 Ich bin HalDo AI. Wie kann ich dir helfen?';
      if (/wer bist du|dein name/.test(t)) return 'Ich bin HalDo AI — dein intelligenter Assistent in HalDo AI OS Pro Max, präsentiert von Halil Donma.';
      if (/ezidi|êzîdî/.test(t)) return 'Êzîdîtum ist eine der ältesten Religionen der Welt. Melek Taus (der Pfauengel) ist zentral. Heilige Stätten: Laliş, Şingal. Sprache: Kurmandschi. Ich kann dir mehr in der Êzîdî-Wissen-App zeigen.';
      if (/wie geht/.test(t)) return 'Mir geht es bestens! Ich bin bereit, dir zu helfen. 🌌';
      if (/danke/.test(t)) return 'Gern geschehen, Bruder! 💙';
      if (/wetter/.test(t)) return 'Öffne die Wetter-App für Live-Daten (Open-Meteo). 🌤️';
      return 'Verstanden, Bruder. Ich lerne noch — mehr Fähigkeiten kommen in Phase 2 (API-Anbindung). Aktuell kann ich dich zu Apps führen.';
    };

    const send = () => {
      const v = input.value.trim();
      if (!v) return;
      addMsg(v, 'user');
      input.value = '';
      HalDo.Sound.play('tap');
      setTimeout(() => {
        const r = reply(v);
        addMsg(r, 'ai');
        HalDo.Welcome.speak(r);
      }, 500);
    };

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    body.querySelectorAll('[data-cmd]').forEach(c => {
      c.addEventListener('click', () => { input.value = c.dataset.cmd; send(); });
    });

    addMsg('Willkommen bei HalDo AI! Ich bin bereit. Frag mich etwas. 🌌', 'ai');
  }
});

HalDo.Apps.register({
  id:'calculator', name:'Rechner', icon:'🧮', cat:'tools', width:340, height:480,
  build: (body) => {
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;height:100%;gap:8px">
        <div id="calcDisp" style="background:rgba(0,0,0,.4);padding:16px;border-radius:12px;
          text-align:right;font-size:26px;font-weight:700;min-height:64px;color:var(--cyan)">0</div>
        <div id="calcGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1"></div>
      </div>
    `;
    const disp = body.querySelector('#calcDisp');
    const grid = body.querySelector('#calcGrid');
    const keys = ['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=','='];
    let expr = '0';
    const upd = () => { disp.textContent = expr; };
    keys.forEach(k => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = k;
      b.style.cssText = 'font-size:18px;font-weight:600;padding:12px;min-height:50px;';
      if (k === '=') b.classList.add('primary');
      if (['÷','×','−','+','=','C'].includes(k)) b.style.background = 'rgba(0,229,255,.2)';
      b.addEventListener('click', () => {
        HalDo.Sound.play('tap');
        if (k === 'C') { expr = '0'; upd(); return; }
        if (k === '=') {
          try {
            const safe = expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100*');
            const v = Function('"use strict"; return (' + safe + ')')();
            expr = String(v); upd();
          } catch (e) { disp.textContent = 'Error'; }
          return;
        }
        if (k === '±') { expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr; upd(); return; }
        if (expr === '0' && /[0-9.]/.test(k)) expr = k;
        else expr += k;
        upd();
      });
      grid.appendChild(b);
    });
  }
});

/* --- 9. WEATHER (LIVE Open-Meteo) --- */
HalDo.Apps.register({
  id:'weather', name:'Wetter', icon:'🌤️', cat:'tools', width:520, height:480,
  build: (body) => {
    body.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <input id="wCity" placeholder="Stadt (z.B. Berlin)" value="Berlin" style="flex:1">
        <button class="btn primary" id="wGo">🔍</button>
      </div>
      <div id="wResult" style="text-align:center;padding:20px">
        <div style="font-size:40px">🌤️</div>
        <div style="color:rgba(224,240,255,.6);margin-top:8px">Stadt eingeben und suchen</div>
      </div>
    `;
    const result = body.querySelector('#wResult');
    const go = async () => {
      const city = body.querySelector('#wCity').value.trim() || 'Berlin';
      result.innerHTML = '<div class="spinner" style="margin:20px auto"></div>';
      try {
        const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=de`).then(r => r.json());
        if (!geo.results || !geo.results[0]) throw new Error('Stadt nicht gefunden');
        const { latitude, longitude, name, country } = geo.results[0];
        const wx = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto`).then(r => r.json());
        const c = wx.current;
        result.innerHTML = `
          <div style="font-size:36px;margin-bottom:8px">${iconFor(c.weather_code)}</div>
          <div style="font-size:32px;font-weight:800;color:var(--cyan)">${Math.round(c.temperature_2m)}°C</div>
          <div style="font-size:14px;color:#fff;margin-top:4px">${name}, ${country}</div>
          <div style="display:flex;justify-content:center;gap:16px;margin-top:16px;font-size:12px;color:rgba(224,240,255,.8)">
            <span>💨 ${c.wind_speed_10m} km/h</span>
            <span>💧 ${c.relative_humidity_2m}%</span>
          </div>
        `;
        HalDo.Sound.play('success');
      } catch (e) {
        result.innerHTML = `<div style="color:#ff7788">❌ ${e.message}</div>`;
      }
    };
    const iconFor = (code) => {
      if (code === 0) return '☀️';
      if (code < 4) return '🌤️';
      if (code < 50) return '🌥️';
      if (code < 70) return '🌧️';
      if (code < 80) return '🌨️';
      return '⛈️';
    };
    body.querySelector('#wGo').addEventListener('click', go);
    body.querySelector('#wCity').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  }
});

      body.querySelector('#mpArtist').textContent = currentTrack.artist;

      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
      if (audioCtx.state === 'suspended') audioCtx.resume();

          o.start(now); o.stop(now + 1.3);

      };
      loop();
      iv = setInterval(loop, currentTrack.tempo * 1000);
      HalDo.Sound.play('success');
    };
    const stop = () => {
      stopFlag = true;
      if (iv) { clearInterval(iv); iv = null; }
      body.querySelector('#mpPlay').textContent = '▶';

    body.querySelectorAll('.mp-track').forEach(el => {
      el.addEventListener('click', () => play(parseInt(el.dataset.i)));
    });
    body.querySelector('#mpPlay').addEventListener('click', () => {
      if (iv) { stop(); }
      else if (currentTrack) { stopFlag = false; play(tracks.indexOf(currentTrack)); }
      else { stopFlag = false; play(0); }
    });
    body.querySelector('#mpStop').addEventListener('click', stop);
    window.addEventListener('beforeunload', stop);
  }
});

      { name:'Künefe', cat:'🍮 Dessert', time:'40 min', ing:['Engelshaar-Teig','Käse (ungezuckert)','Butter','Zuckersirup','Pistazien'], steps:['Teig mit Butter schichten','Käse in die Mitte','Backen bis goldbraun','Mit Sirup übergießen','Pistazien drüber'] },

    ];
    body.innerHTML = `
      <input id="rcSearch" type="text" placeholder="🔍 Rezept suchen…" style="margin-bottom:12px">
      <div id="rcList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px"></div>
      <div id="rcDetail" style="display:none;position:absolute;inset:14px;background:rgba(5,15,30,.98);backdrop-filter:blur(20px);border-radius:14px;padding:16px;overflow-y:auto;z-index:10">
        <button class="btn" id="rcBack" style="margin-bottom:12px">← Zurück</button>
        <div id="rcContent"></div>
      </div>
    `;
    const render = () => {
      const q = (body.querySelector('#rcSearch').value || '').toLowerCase();
      const list = body.querySelector('#rcList');
      list.innerHTML = recipes
        .map((r, i) => ({ r, i }))
        .filter(({ r }) => !q || r.name.toLowerCase().includes(q))
        .map(({ r, i }) => `
          <div data-rc="${i}" style="background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);
            padding:12px;border-radius:10px;cursor:pointer;transition:.15s;text-align:center">
            <div style="font-size:24px">${r.cat.split(' ')[0]}</div>

        el.addEventListener('click', () => showDetail(parseInt(el.dataset.rc)));

      const r = recipes[idx];
      const det = body.querySelector('#rcDetail');
      body.querySelector('#rcContent').innerHTML = `
        <div style="text-align:center;margin-bottom:14px">
          <div style="font-size:48px">${r.cat.split(' ')[0]}</div>
          <div style="font-size:20px;font-weight:700;margin-top:6px">${r.name}</div>
          <div style="font-size:11px;color:var(--cyan)">${r.cat} · ${r.time}</div>
        </div>
        <h4 style="color:var(--cyan);margin:14px 0 8px;font-size:13px">🛒 Zutaten</h4>
        <ul style="padding-left:18px;font-size:13px;line-height:1.7">${r.ing.map(i => `<li>${i}</li>`).join('')}</ul>
        <h4 style="color:var(--cyan);margin:14px 0 8px;font-size:13px">👨‍🍳 Zubereitung</h4>
        <ol style="padding-left:18px;font-size:13px;line-height:1.7">${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
        <button class="btn primary" id="rcSpeak" style="margin-top:16px;width:100%">🔊 Vorlesen</button>
      `;
      det.style.display = 'block';
      body.querySelector('#rcSpeak').addEventListener('click', () => {
        HalDo.Welcome.speak(r.name + '. Zutaten: ' + r.ing.join(', ') + '. Zubereitung: ' + r.steps.join('. '));
      });
      HalDo.Sound.play('tap');
    };
    body.querySelector('#rcBack').addEventListener('click', () => {
      body.querySelector('#rcDetail').style.display = 'none';
    });
    body.querySelector('#rcSearch').addEventListener('input', render);
    render();
  }
});

/* --- 4. SHOPPING LIST PRO --- */
HalDo.Apps.register({
  id:'shopping', name:'Einkauf', icon:'🛒', cat:'life', width:480, height:520,
  build: (body) => {
    const KEY = 'shopping_v1';
    const get = () => HalDo.Store.get(KEY, []);
    const set = (v) => HalDo.Store.set(KEY, v);
    const cats = ['🥩 Fleisch','🥬 Gemüse','🍎 Obst','🥛 Milchprodukte','🍞 Backwaren','🧴 Haushalt','📦 Sonstiges'];
    body.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="shIn" placeholder="Was einkaufen?" style="flex:1">
        <select id="shCat" style="flex:0 0 120px">
          ${cats.map(c => `<option>${c}</option>`).join('')}
        </select>
        <button class="btn primary" id="shAdd">+</button>
      </div>
      <div id="shStats" style="font-size:11px;color:rgba(224,240,255,.6);margin-bottom:10px;text-align:center"></div>
      <div id="shList" style="display:flex;flex-direction:column;gap:6px"></div>
      <button class="btn danger" id="shClear" style="width:100%;margin-top:12px;display:none">🗑️ Erledigte löschen</button>
    `;
    const render = () => {
      const items = get();
      const list = body.querySelector('#shList');
      const done = items.filter(i => i.done).length;
      body.querySelector('#shStats').textContent = `${items.length} Artikel · ${done} erledigt`;
      body.querySelector('#shClear').style.display = done > 0 ? 'block' : 'none';
      list.innerHTML = items.length
        ? items.map((it, i) => `
          <div style="display:flex;align-items:center;gap:10px;background:rgba(0,229,255,.06);
            border:1px solid rgba(0,229,255,.2);padding:10px 12px;border-radius:10px;font-size:13px;
            ${it.done ? 'opacity:.5;' : ''}">
            <input type="checkbox" ${it.done?'checked':''} data-ck="${i}" style="width:20px;height:20px">
            <div style="flex:1;${it.done?'text-decoration:line-through':''}">
              <div style="font-weight:600">${it.name}</div>
              <div style="font-size:10px;color:rgba(224,240,255,.5)">${it.cat}</div>
            </div>
            <button class="btn danger" style="padding:4px 8px;font-size:11px" data-del="${i}">✕</button>
          </div>`).join('')
        : '<div style="text-align:center;padding:24px;color:rgba(224,240,255,.5);font-size:12px">Einkaufsliste leer.</div>';
      list.querySelectorAll('[data-ck]').forEach(cb => cb.addEventListener('change', () => {
        const it = get(); it[parseInt(cb.dataset.ck)].done = cb.checked; set(it); HalDo.Sound.play('tap'); render();
      }));
      list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        const it = get(); it.splice(parseInt(b.dataset.del), 1); set(it); render();
      }));
    };
    body.querySelector('#shAdd').addEventListener('click', () => {
      const v = body.querySelector('#shIn').value.trim(); if (!v) return;
      const it = get(); it.unshift({ name:v, cat: body.querySelector('#shCat').value, done:false }); set(it);
      body.querySelector('#shIn').value = ''; HalDo.Sound.play('success'); render();
    });
    body.querySelector('#shIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') body.querySelector('#shAdd').click(); });
    body.querySelector('#shClear').addEventListener('click', () => {
      set(get().filter(i => !i.done)); render(); HalDo.Sound.play('tap');
    });
    render();
  }
});

HalDo.Apps.register({
  id:'contacts', name:'Kontakte', icon:'👥', cat:'tools', width:500, height:540,
  build: (body) => {
    const KEY = 'contacts_v1';
    const get = () => HalDo.Store.get(KEY, []);
    const set = (v) => HalDo.Store.set(KEY, v);
    body.innerHTML = `
      <input id="ctSearch" type="text" placeholder="🔍 Kontakt suchen…" style="margin-bottom:12px">
      <button class="btn primary" id="ctNew" style="width:100%;margin-bottom:12px">+ Neuer Kontakt</button>
      <div id="ctList" style="display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto"></div>
      <div id="ctModal" style="display:none;position:absolute;inset:14px;background:rgba(5,15,30,.98);
        backdrop-filter:blur(20px);border-radius:14px;padding:16px;z-index:10;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="font-size:15px;color:var(--cyan)">Kontakt</h3>
          <button class="btn" id="ctCancel">✕</button>
        </div>
        <input id="ctName" placeholder="Name *" style="padding:10px">
        <input id="ctPhone" placeholder="Telefon" type="tel" style="padding:10px">
        <input id="ctMail" placeholder="E-Mail" type="email" style="padding:10px">
        <input id="ctNote" placeholder="Notiz" style="padding:10px">
        <button class="btn primary" id="ctSave" style="margin-top:8px">💾 Speichern</button>
      </div>
    `;
    const render = () => {
      const q = (body.querySelector('#ctSearch').value || '').toLowerCase();
      const list = body.querySelector('#ctList');
      const items = get().filter(c => !q || c.name.toLowerCase().includes(q));
      list.innerHTML = items.length
        ? items.map((c, i) => {
          const realIdx = get().findIndex(x => x === c);
          return `<div style="background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);
            padding:12px;border-radius:10px;display:flex;align-items:center;gap:10px">
            <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));
              display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;font-size:16px">
              ${c.name.charAt(0).toUpperCase()}
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</div>
              <div style="font-size:11px;color:rgba(224,240,255,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                ${c.phone ? '📞 '+c.phone+' ' : ''}${c.mail ? '✉️ '+c.mail : ''}
              </div>
            </div>
            ${c.phone ? `<a href="tel:${c.phone}" class="btn" style="padding:6px 10px;font-size:12px;text-decoration:none">📞</a>` : ''}
            <button class="btn danger" style="padding:6px 10px;font-size:11px" data-del="${realIdx}">✕</button>
          </div>`;
        }).join('')
        : '<div style="text-align:center;padding:20px;color:rgba(224,240,255,.5);font-size:12px">Keine Kontakte.</div>';
      list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        if (confirm('Kontakt löschen?')) {
          const it = get(); it.splice(parseInt(b.dataset.del), 1); set(it); render();
        }
      }));
    };
    body.querySelector('#ctNew').addEventListener('click', () => {
      body.querySelector('#ctName').value = '';
      body.querySelector('#ctPhone').value = '';
      body.querySelector('#ctMail').value = '';
      body.querySelector('#ctNote').value = '';
      body.querySelector('#ctModal').style.display = 'flex';
    });
    body.querySelector('#ctCancel').addEventListener('click', () => {
      body.querySelector('#ctModal').style.display = 'none';
    });
    body.querySelector('#ctSave').addEventListener('click', () => {
      const name = body.querySelector('#ctName').value.trim();
      if (!name) { HalDo.Toast.show('⚠️ Name eingeben'); return; }
      const items = get();
      items.unshift({
        name,
        phone: body.querySelector('#ctPhone').value.trim(),
        mail: body.querySelector('#ctMail').value.trim(),
        note: body.querySelector('#ctNote').value.trim(),
        date: new Date().toLocaleDateString('de-DE')
      });
      set(items);
      body.querySelector('#ctModal').style.display = 'none';
      HalDo.Sound.play('success');
      render();
    });
    body.querySelector('#ctSearch').addEventListener('input', render);
    render();
  }
});
