<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦚 HalDo AI OS v2</title>
<link rel="icon" href="logo.png">
<style>
  :root{--primary:#00d4b8;--primary-2:#7c3aed;--accent:#f5c542;--bg:#0a0e17;--bg-2:#111827;--panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.07);--border:rgba(255,255,255,.09);--text:#e8eef7;--text-dim:#8fa3bf;--success:#22c55e;--danger:#ef4444;--radius:14px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body.light-mode{--bg:#f4f6fb;--bg-2:#fff;--panel:rgba(0,0,0,.03);--panel-2:rgba(0,0,0,.06);--border:rgba(0,0,0,.10);--text:#0e1420;--text-dim:#5a6b85}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:radial-gradient(1200px 800px at 15% -10%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 60%),radial-gradient(1000px 700px at 110% 10%,color-mix(in srgb,var(--primary-2) 16%,transparent),transparent 55%),var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s}
  body.no-anim *{animation:none!important;transition:none!important}
  #boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
  #boot img{width:110px;height:110px;object-fit:contain;animation:pulse 1.2s ease-in-out infinite}
  #boot h1{margin-top:18px;font-size:20px;letter-spacing:3px;color:var(--text-dim);font-weight:500}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
  #boot.hide{opacity:0;pointer-events:none}
  #topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  #topbar .brand{display:flex;align-items:center;gap:12px}
  #topbar .brand img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--primary) 40%,transparent))}
  #topbar .brand h1{font-size:17px;font-weight:600}
  #topbar .brand h1 span{color:var(--primary)}
  #topbar .spacer{flex:1}
  #topbar .pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--border);font-size:12px;color:var(--text-dim)}
  #topbar .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}
  #mainnav{display:flex;gap:6px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 65%,transparent);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  #mainnav::-webkit-scrollbar{display:none}
  #mainnav button{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:11px;background:transparent;border:1px solid transparent;color:var(--text-dim);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .18s;font-family:inherit}
  #mainnav button img{width:20px;height:20px;object-fit:contain}
  #mainnav button .emoji{font-size:17px}
  #mainnav button:hover{color:var(--text);background:var(--panel)}
  #mainnav button.active{color:var(--text);background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,transparent),color-mix(in srgb,var(--primary-2) 18%,transparent));border-color:color-mix(in srgb,var(--primary) 40%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--primary) 12%,transparent)}
  #view{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
  body:not(.no-anim) #view{animation:fadeUp .3s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hero{display:flex;align-items:center;gap:20px;padding:24px;border-radius:var(--radius);background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 10%,transparent),color-mix(in srgb,var(--primary-2) 10%,transparent));border:1px solid var(--border);margin-bottom:24px}
  .hero img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--primary) 40%,transparent))}
  .hero .h-text h2{font-size:22px;margin-bottom:4px}
  .hero .h-text p{color:var(--text-dim);font-size:13.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:24px}
  .stat{padding:18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--border);transition:all .18s}
  .stat:hover{background:var(--panel-2);transform:translateY(-2px)}
  .stat .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .stat .value{font-size:26px;font-weight:700;color:var(--primary)}
  .stat .sub{font-size:12px;color:var(--text-dim);margin-top:4px}
  .section-title{display:flex;align-items:center;gap:10px;margin:8px 0 14px;font-size:16px;font-weight:600}
  .section-title .emoji{font-size:19px}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .app-card{padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--border);cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:8px;text-align:left;font-family:inherit;color:var(--text)}
  .app-card:hover{background:var(--panel-2);border-color:color-mix(in srgb,var(--primary) 40%,transparent);transform:translateY(-2px)}
  .app-card .icon{font-size:26px}
  .app-card .name{font-size:13.5px;font-weight:600}
  .app-card .desc{font-size:11.5px;color:var(--text-dim);line-height:1.4}
  .placeholder{padding:40px 24px;border-radius:var(--radius);background:var(--panel);border:1px dashed var(--border);text-align:center;color:var(--text-dim);display:flex;flex-direction:column;align-items:center;gap:12px}
  .placeholder img{width:56px;opacity:.7}
  .placeholder h3{color:var(--text);font-size:15px}
  .placeholder p{font-size:13px;max-width:440px;line-height:1.5}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary);font-size:11px;font-weight:600;border:1px solid color-mix(in srgb,var(--primary) 30%,transparent)}
  .settings-wrap{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
  @media(max-width:720px){.settings-wrap{grid-template-columns:1fr}}
  .settings-nav{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px;position:sticky;top:100px;max-height:calc(100vh - 130px);overflow-y:auto}
  @media(max-width:720px){.settings-nav{position:static;max-height:none}}
  .settings-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:9px;background:transparent;border:none;color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
  .settings-nav button:hover{background:var(--panel-2);color:var(--text)}
  .settings-nav button.active{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,transparent),color-mix(in srgb,var(--primary-2) 18%,transparent));color:var(--text);border-left:2px solid var(--primary)}
  .settings-nav .ico{font-size:16px;width:20px;text-align:center}
  .settings-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px;min-height:400px}
  .settings-panel h2{font-size:18px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .settings-panel .panel-desc{color:var(--text-dim);font-size:13px;margin-bottom:18px;line-height:1.5}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
  .setting-row:last-child{border-bottom:none}
  .setting-row .info{flex:1;min-width:0}
  .setting-row .info .lbl{font-size:14px;font-weight:500;margin-bottom:3px}
  .setting-row .info .hint{font-size:12px;color:var(--text-dim);line-height:1.4}
  .setting-row input[type="text"],.setting-row input[type="number"],.setting-row input[type="password"],.setting-row input[type="date"],.setting-row input[type="time"],.setting-row select,.setting-row textarea{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;min-width:160px;outline:none}
  .setting-row input:focus,.setting-row select:focus,.setting-row textarea:focus{border-color:var(--primary)}
  .setting-row input[type="color"]{width:52px;height:38px;padding:2px;border-radius:9px;border:1px solid var(--border);background:var(--bg-2);cursor:pointer}
  .setting-row input[type="range"]{width:180px;accent-color:var(--primary)}
  .setting-row textarea{min-width:280px;min-height:70px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}
  .toggle{position:relative;width:46px;height:26px;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .2s;flex-shrink:0}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:all .2s}
  .toggle.on{background:color-mix(in srgb,var(--primary) 30%,transparent);border-color:var(--primary)}
  .toggle.on::after{left:22px;background:var(--primary);box-shadow:0 0 8px var(--primary)}
  .btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
  .btn:hover{background:var(--panel);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border:none;color:#fff}
  .btn.danger{background:color-mix(in srgb,var(--danger) 18%,transparent);border-color:var(--danger);color:var(--danger)}
  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
  .theme-btn{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-family:inherit;color:var(--text);display:flex;flex-direction:column;gap:8px;align-items:center}
  .theme-btn .swatch{width:100%;height:26px;border-radius:6px;display:flex}
  .theme-btn .swatch span{flex:1}
  .theme-btn .tname{font-size:12px;font-weight:500}
  .storage-list{max-height:220px;overflow-y:auto;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .storage-list .key{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);gap:10px}
  .storage-list .key:last-child{border-bottom:none}
  .storage-list .key .k{color:var(--primary);flex-shrink:0}
  .storage-list .key .v{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:820px){.av-wrap{grid-template-columns:1fr}}
  .av-stage{background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 6%,transparent),color-mix(in srgb,var(--primary-2) 8%,transparent));border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden}
  .av-stage::before{content:"";position:absolute;inset:0;background:radial-gradient(400px 300px at 50% 30%,color-mix(in srgb,var(--primary) 18%,transparent),transparent 70%);pointer-events:none}
  #avatarCanvas{position:relative;z-index:1;border-radius:16px;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--bg-2) 80%,transparent),var(--bg));cursor:crosshair}
  .av-modes{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px;position:relative;z-index:1}
  .av-modes button{padding:7px 14px;border-radius:8px;background:transparent;border:none;color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
  .av-modes button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--primary) 40%,transparent)}
  .av-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
  .av-mic{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 22px color-mix(in srgb,var(--primary) 40%,transparent);transition:all .2s}
  .av-mic:hover{transform:scale(1.05)}
  .av-mic.listening{animation:micPulse 1s ease-in-out infinite;background:linear-gradient(135deg,var(--danger),#f97316)}
  .av-mic.speaking{background:linear-gradient(135deg,var(--primary-2),#ec4899)}
  @keyframes micPulse{0%,100%{box-shadow:0 6px 22px color-mix(in srgb,var(--danger) 40%,transparent);transform:scale(1)}50%{box-shadow:0 6px 40px var(--danger);transform:scale(1.08)}}
  .av-status{font-size:12.5px;color:var(--text-dim);text-align:center;min-height:18px;position:relative;z-index:1}
  .av-status .live{color:var(--primary);font-weight:600}
  .av-chat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;height:620px;max-height:75vh}
  .av-chat h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .av-chat h3 .badge{margin-left:auto}
  .av-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:6px;margin-bottom:12px}
  .av-log::-webkit-scrollbar{width:6px}
  .av-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .msg{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;max-width:85%;word-wrap:break-word;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 25%,transparent),color-mix(in srgb,var(--primary-2) 25%,transparent));border:1px solid color-mix(in srgb,var(--primary) 35%,transparent)}
  .msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--border)}
  .msg.sys{align-self:center;font-size:11.5px;color:var(--text-dim);background:transparent;padding:4px}
  .msg .who{font-size:10.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
  .msg.user .who{color:var(--primary)}
  .av-input-row{display:flex;gap:8px}
  .av-input-row input{flex:1;background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-family:inherit;font-size:13.5px;outline:none}
  .av-input-row input:focus{border-color:var(--primary)}
  .av-input-row button{padding:0 18px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));border:none;color:#fff;font-size:16px;cursor:pointer;font-family:inherit}
  .av-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .av-quick button{padding:5px 10px;border-radius:14px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-size:11.5px;cursor:pointer;font-family:inherit}
  .av-quick button:hover{color:var(--text);border-color:color-mix(in srgb,var(--primary) 40%,transparent)}
  .api-warning{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--accent);color:var(--accent);padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:10px;line-height:1.5}
  .app-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .app-header h2{font-size:20px;display:flex;align-items:center;gap:10px}
  .app-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .app-toolbar input[type="text"],.app-toolbar input[type="search"],.app-toolbar select{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:10px;font-family:inherit;font-size:13.5px;outline:none;flex:1;min-width:180px}
  .app-toolbar input:focus,.app-toolbar select:focus{border-color:var(--primary)}
  .app-toolbar select{flex:0 0 auto;min-width:130px}
  .icon-btn{background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:15px;transition:all .15s}
  .icon-btn:hover{background:var(--panel-2);color:var(--text)}
  .notes-list{display:flex;flex-direction:column;gap:10px}
  .note-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:all .15s}
  .note-item:hover{border-color:color-mix(in srgb,var(--primary) 40%,transparent);background:var(--panel-2)}
  .note-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .note-title{font-size:15px;font-weight:600;word-break:break-word}
  .note-actions{display:flex;gap:2px;flex-shrink:0}
  .note-body{color:var(--text-dim);font-size:13px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .note-meta{margin-top:8px;font-size:11px;color:var(--text-dim);opacity:.7}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;animation:fadeIn .15s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-header h3{font-size:16px}
  .modal-title{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;outline:none}
  .modal-title:focus{border-color:var(--primary)}
  .modal-body{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:10px;font-family:inherit;font-size:13.5px;line-height:1.6;outline:none;min-height:240px;resize:vertical}
  .modal-body:focus{border-color:var(--primary)}
  .modal-footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tasks-list{display:flex;flex-direction:column;gap:8px}
  .task-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:11px;transition:all .15s}
  .task-item:hover{background:var(--panel-2)}
  .task-item.done{opacity:.55}
  .task-item.done .task-title{text-decoration:line-through}
  .task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s;margin-top:1px}
  .task-check:hover{border-color:var(--primary)}
  .task-item.done .task-check{background:var(--primary);border-color:var(--primary);color:#fff}
  .task-body{flex:1;min-width:0}
  .task-title{font-size:14px;font-weight:500;margin-bottom:3px;word-break:break-word}
  .task-meta{font-size:11.5px;color:var(--text-dim);display:flex;gap:10px;flex-wrap:wrap}
  .prio{padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
  .prio.low{background:rgba(34,197,94,.15);color:#22c55e}
  .prio.med{background:rgba(245,197,66,.15);color:#f5c542}
  .prio.high{background:rgba(239,68,68,.15);color:#ef4444}
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .cal-head h3{font-size:17px;font-weight:600;min-width:200px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
  .cal-dow{text-align:center;font-size:11.5px;font-weight:600;color:var(--text-dim);padding:6px 0;text-transform:uppercase;letter-spacing:1px}
  .cal-day{aspect-ratio:1;border-radius:10px;background:var(--bg-2);border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 4px;font-size:13px;color:var(--text);transition:all .15s;position:relative;font-family:inherit}
  .cal-day:hover{border-color:color-mix(in srgb,var(--primary) 40%,transparent);background:var(--panel-2)}
  .cal-day.other{opacity:.35}
  .cal-day.today{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 25%,transparent),color-mix(in srgb,var(--primary-2) 25%,transparent));border-color:var(--primary);font-weight:700}
  .cal-day.selected{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 40%,transparent)}
  .cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
  .cal-day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .cal-events{margin-top:20px}
  .cal-events h3{font-size:15px;margin-bottom:10px}
  .event-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
  .event-time{font-weight:600;color:var(--primary);font-size:13px;min-width:52px}
  .event-title{flex:1;font-size:13.5px;word-break:break-word}
  footer{text-align:center;padding:24px 20px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--border);margin-top:20px}
  footer img{width:16px;vertical-align:middle;margin-right:6px;opacity:.7}
</style>
</head>
<body>

<div id="boot">
  <img src="logo.png" alt="HalDo">
  <h1>HALDO AI OS</h1>
</div>

<header id="topbar">
  <div class="brand">
    <img src="logo.png" alt="Logo">
    <h1>HalDo <span>AI OS</span></h1>
  </div>
  <div class="spacer"></div>
  <div class="pill" id="clock-pill"><span class="dot"></span><span id="clock">--:--</span></div>
</header>

<nav id="mainnav"></nav>
<main id="view"></main>

<footer>
  <img src="logo.png" alt="Logo">
  HalDo AI OS v2 · Phase 4+ (Realistischer Avatar · 3 Apps)
</footer>

<script>
(function(){
  "use strict";

  /* ================= STORAGE ================= */
  const Storage = {
    prefix:"haldo_v2_",
    get(k,d=null){try{const r=localStorage.getItem(this.prefix+k);return r===null?d:JSON.parse(r);}catch(e){return d;}},
    set(k,v){try{localStorage.setItem(this.prefix+k,JSON.stringify(v));return true;}catch(e){console.warn("Storage voll",e);return false;}},
    del(k){localStorage.removeItem(this.prefix+k);},
    keys(){const o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(this.prefix))o.push(k.slice(this.prefix.length));}return o;},
    sizeKB(){let b=0;this.keys().forEach(k=>{const v=localStorage.getItem(this.prefix+k)||"";b+=k.length+v.length;});return (b/1024).toFixed(1);},
    rawKB(){let b=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);b+=k.length+(localStorage.getItem(k)||"").length;}return (b/1024).toFixed(1);}
  };
  const Bus = {_h:{},on(e,f){(this._h[e]=this._h[e]||[]).push(f);},emit(e,d){(this._h[e]||[]).forEach(f=>{try{f(d);}catch(x){console.warn(x);}});}};
  const Registry = {
    apps:[],
    register(a){if(!a.id||!a.name){console.warn("App braucht id+name");return;}if(this.apps.find(x=>x.id===a.id)){console.warn("doppelt:",a.id);return;}this.apps.push(Object.assign({icon:"📦",desc:"",category:"System",mount:null},a));Bus.emit("registry:change",this.apps);},
    get(id){return this.apps.find(a=>a.id===id);},
    byCategory(){const m={};this.apps.forEach(a=>{(m[a.category]=m[a.category]||[]).push(a);});return m;},
    count(){return this.apps.length;}
  };
  const Router = {
    routes:{},current:null,
    add(p,h){this.routes[p]=h;},
    go(p){
      if(!this.routes[p])p="home";
      if(this.current==="avatar"&&p!=="avatar")Avatar.stop();
      this.current=p;Storage.set("last_route",p);
      document.querySelectorAll("#mainnav button").forEach(b=>b.classList.toggle("active",b.dataset.route===p));
      const v=document.getElementById("view");v.innerHTML="";
      this.routes[p](v);Bus.emit("route:change",p);
      window.scrollTo({top:0,behavior:"instant"});
    },
    start(){this.go(Storage.get("last_route","home"));}
  };
  const U = {
    el(t,a={},...c){
      const n=document.createElement(t);
      for(const k in a){
        if(k==="class")n.className=a[k];
        else if(k==="html")n.innerHTML=a[k];
        else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);
        else if(k==="style"&&typeof a[k]==="object")Object.assign(n.style,a[k]);
        else n.setAttribute(k,a[k]);
      }
      c.forEach(x=>{if(x==null)return;n.appendChild(typeof x==="string"?document.createTextNode(x):x);});
      return n;
    }
  };
  function downloadTxt(text,filename){
    const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  /* ================= SETTINGS ================= */
  const THEMES = {
    "haldo":{primary:"#00d4b8",primary2:"#7c3aed",accent:"#f5c542"},
    "aurora":{primary:"#22c55e",primary2:"#ec4899",accent:"#a855f7"},
    "sunset":{primary:"#f97316",primary2:"#ec4899",accent:"#facc15"},
    "ocean":{primary:"#0ea5e9",primary2:"#06b6d4",accent:"#38bdf8"},
    "forest":{primary:"#10b981",primary2:"#059669",accent:"#84cc16"},
    "royal":{primary:"#8b5cf6",primary2:"#eab308",accent:"#f472b6"},
    "cyber":{primary:"#06b6d4",primary2:"#ec4899",accent:"#a855f7"},
    "mono":{primary:"#94a3b8",primary2:"#cbd5e1",accent:"#e2e8f0"},
    "fire":{primary:"#ef4444",primary2:"#f97316",accent:"#facc15"}
  };
  const Settings = {
    defaults:{
      general:{name:"Bruder",lang:"de",startPage:"home",splash:true},
      appearance:{primary:"#00d4b8",primary2:"#7c3aed",accent:"#f5c542",fontSize:100,animations:true,glow:true,mode:"dark"},
      avatar:{mode:"human",size:260,personality:"freundlich",autoSpeak:true,skin:"#e8c39e",hair:"#3a2418",eye:"#5b8a72"},
      voice:{tts:true,rate:1.0,pitch:1.0,stt:true,wakeWord:false,wakeWords:"hallo haldo,silav,merhaba"},
      ai:{apiKey:"",model:"gemini-1.5-flash",temperature:0.7,systemPrompt:"Du bist HalDo, ein freundlicher, hilfsbereiter KI-Assistent. Antworte kurz, warm und auf Deutsch, außer der Nutzer schreibt in einer anderen Sprache."},
      apps:{sort:"az"},
      notifications:{browser:false,sound:true,vibration:true},
      network:{offlineMode:false},
      security:{pin:"",lockAfter:0,analytics:false},
      backup:{autoBackup:false}
    },
    state:{},
    load(){
      this.state=JSON.parse(JSON.stringify(this.defaults));
      for(const cat in this.defaults){const s=Storage.get("set_"+cat,null);if(s&&typeof s==="object")Object.assign(this.state[cat],s);}
      this.apply();
    },
    save(cat){Storage.set("set_"+cat,this.state[cat]);this.apply();Bus.emit("settings:change",{cat,state:this.state});},
    get(cat,key){return key?this.state[cat]?.[key]:this.state[cat];},
    set(cat,key,val){this.state[cat][key]=val;this.save(cat);},
    apply(){
      const a=this.state.appearance;
      const r=document.documentElement.style;
      r.setProperty("--primary",a.primary);r.setProperty("--primary-2",a.primary2);r.setProperty("--accent",a.accent);
      document.body.style.fontSize=((a.fontSize||100)/100*16)+"px";
      document.body.classList.toggle("no-anim",!a.animations);
      document.body.classList.toggle("light-mode",a.mode==="light");
      const b=document.querySelector("#topbar .brand img");
      if(b)b.style.filter=a.glow?`drop-shadow(0 0 8px color-mix(in srgb, ${a.primary} 40%, transparent))`:"none";
    }
  };

  /* ================= VOICE ================= */
  const Voice = {
    _synth:window.speechSynthesis,_rec:null,_listening:false,
    speak(text,onEnd){
      if(!Settings.get("voice","tts")){if(onEnd)onEnd();return;}
      try{
        this._synth.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.rate=Settings.get("voice","rate")||1.0;u.pitch=Settings.get("voice","pitch")||1.0;u.lang="de-DE";
        u.onend=()=>onEnd&&onEnd();u.onerror=()=>onEnd&&onEnd();
        this._synth.speak(u);Bus.emit("voice:speak:start");
      }catch(e){console.warn(e);if(onEnd)onEnd();}
    },
    stop(){try{this._synth.cancel();}catch(e){}Bus.emit("voice:speak:end");},
    isSpeaking(){return this._synth.speaking;},
    initRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const r=new SR();r.lang="de-DE";r.interimResults=false;r.continuous=false;r.maxAlternatives=1;return r;},
    listen({onResult,onError,onEnd}={}){
      const r=this.initRec();
      if(!r){onError&&onError("Spracherkennung nicht verfügbar.");return false;}
      if(this._listening)this.stopListen();
      this._rec=r;this._listening=true;
      r.onresult=(e)=>{const txt=e.results[0][0].transcript;onResult&&onResult(txt);};
      r.onerror=(e)=>{this._listening=false;onError&&onError(e.error||"Fehler");};
      r.onend=()=>{this._listening=false;onEnd&&onEnd();Bus.emit("voice:listen:end");};
      try{r.start();Bus.emit("voice:listen:start");return true;}catch(e){this._listening=false;onError&&onError(String(e));return false;}
    },
    stopListen(){try{this._rec&&this._rec.stop();}catch(e){}this._listening=false;},
    isListening(){return this._listening;}
  };

  /* ================= AI ================= */
  const AI = {
    async send(history,userText){
      const key=Settings.get("ai","apiKey");
      if(!key)throw new Error("Kein API-Key. Einstellungen → KI & Gemini.");
      const model=Settings.get("ai","model")||"gemini-1.5-flash";
      const sys=Settings.get("ai","systemPrompt")||"";
      const temp=Settings.get("ai","temperature")??0.7;
      const contents=[];
      history.forEach(m=>{contents.push({role:m.role==="user"?"user":"model",parts:[{text:m.text}]});});
      contents.push({role:"user",parts:[{text:userText}]});
      const body={contents,generationConfig:{temperature:temp}};
      if(sys)body.systemInstruction={parts:[{text:sys}]};
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!res.ok){const err=await res.text();throw new Error("Gemini "+res.status+": "+err.slice(0,180));}
      const data=await res.json();
      return (data?.candidates?.[0]?.content?.parts?.map(p=>p.text).filter(Boolean).join("\n")||"(keine Antwort)").trim();
    },
    hasKey(){return !!Settings.get("ai","apiKey");}
  };

  /* ================= AVATAR (REALISTISCH) ================= */
  const Avatar = {
    canvas:null,ctx:null,raf:null,
    t:0,blink:0,nextBlink:0,
    speaking:false,listening:false,
    mouthOpen:0,mouthTarget:0,
    mode:"human",
    color1:"#00d4b8",color2:"#7c3aed",
    skin:"#e8c39e",hair:"#3a2418",eye:"#5b8a72",
    mouseX:0,mouseY:0,

    getSize(){return Math.min(320,Math.max(200,Settings.get("avatar","size")||260));},

    init(canvas){
      this.canvas=canvas;this.ctx=canvas.getContext("2d");
      this.updateTheme();
      const s=this.getSize();
      canvas.width=s*2;canvas.height=s*2;
      canvas.style.width=s+"px";canvas.style.height=s+"px";
      canvas.addEventListener("mousemove",(e)=>{
        const r=canvas.getBoundingClientRect();
        this.mouseX=((e.clientX-r.left)/r.width-0.5)*2;
        this.mouseY=((e.clientY-r.top)/r.height-0.5)*2;
      });
      canvas.addEventListener("mouseleave",()=>{this.mouseX=0;this.mouseY=0;});
      this.loop();
    },
    updateTheme(){
      this.mode=Settings.get("avatar","mode")||"human";
      this.color1=Settings.get("appearance","primary");
      this.color2=Settings.get("appearance","primary2");
      this.skin=Settings.get("avatar","skin")||"#e8c39e";
      this.hair=Settings.get("avatar","hair")||"#3a2418";
      this.eye=Settings.get("avatar","eye")||"#5b8a72";
    },
    setSpeaking(v){this.speaking=v;},
    setListening(v){this.listening=v;},
    stop(){if(this.raf){cancelAnimationFrame(this.raf);this.raf=null;}},

    loop(){
      this.t+=1;
      if(this.t>this.nextBlink){this.blink=12;this.nextBlink=this.t+80+Math.random()*100;}
      if(this.blink>0)this.blink--;
      if(this.speaking)this.mouthTarget=0.5+Math.abs(Math.sin(this.t*0.4))*0.5;
      else this.mouthTarget=0.05+Math.abs(Math.sin(this.t*0.04))*0.02;
      this.mouthOpen+=(this.mouthTarget-this.mouthOpen)*0.3;
      this.draw();
      this.raf=requestAnimationFrame(()=>this.loop());
    },

    draw(){
      const c=this.ctx;
      const W=this.canvas.width,H=this.canvas.height;
      const cx=W/2,cy=H/2;
      c.clearRect(0,0,W,H);
      const headSway=Math.sin(this.t*0.015)*4;
      const breathe=Math.sin(this.t*0.025)*3;
      const R=Math.min(W,H)*0.36;

      c.save();
      const shadow=c.createRadialGradient(cx,cy+headSway,R*0.5,cx,cy+headSway,R*1.4);
      shadow.addColorStop(0,"rgba(0,0,0,0.35)");
      shadow.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=shadow;
      c.beginPath();c.arc(cx,cy+headSway,R*1.4,0,Math.PI*2);c.fill();
      c.restore();

      if(this.mode==="cyborg")this.drawCyborg(c,cx+headSway,cy+breathe,R);
      else if(this.mode==="hologram")this.drawHologram(c,cx+headSway,cy+breathe,R);
      else this.drawHuman(c,cx+headSway,cy+breathe,R);

      if(this.listening){
        c.save();
        const pulse=1+Math.sin(this.t*0.15)*0.06;
        c.strokeStyle=this.color1;c.globalAlpha=0.5;c.lineWidth=3;
        c.beginPath();c.arc(cx,cy+breathe,R*1.35*pulse,0,Math.PI*2);c.stroke();
        c.globalAlpha=0.2;
        c.beginPath();c.arc(cx,cy+breathe,R*1.5*pulse,0,Math.PI*2);c.stroke();
        c.restore();
      }
    },

    shade(hex,amount){
      let h=hex.replace("#","");
      if(h.length===3)h=h.split("").map(x=>x+x).join("");
      let r=parseInt(h.slice(0,2),16);
      let g=parseInt(h.slice(2,4),16);
      let b=parseInt(h.slice(4,6),16);
      r=Math.max(0,Math.min(255,r+amount));
      g=Math.max(0,Math.min(255,g+amount));
      b=Math.max(0,Math.min(255,b+amount));
      return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
    },

    drawHuman(c,cx,cy,R){
      const skin=this.skin;
      const skinDark=this.shade(skin,-30);
      const skinDarker=this.shade(skin,-55);
      const skinLight=this.shade(skin,25);
      const hairColor=this.hair;
      const hairDark=this.shade(hairColor,-30);
      const eyeColor=this.eye;
      const headW=R*0.82;
      const headH=R*1.0;

      // Hinterkopf-Haare
      c.save();
      c.fillStyle=hairDark;
      c.beginPath();
      c.ellipse(cx,cy-headH*0.15,headW*1.02,headH*0.85,0,Math.PI,0);
      c.fill();
      c.restore();

      // Seitensträhnen
      c.save();
      c.fillStyle=hairDark;
      c.beginPath();
      c.ellipse(cx-headW*0.88,cy-headH*0.05,headW*0.22,headH*0.55,-0.15,0,Math.PI*2);
      c.fill();
      c.beginPath();
      c.ellipse(cx+headW*0.88,cy-headH*0.05,headW*0.22,headH*0.55,0.15,0,Math.PI*2);
      c.fill();
      c.restore();

      // Hals
      c.save();
      const neckW=R*0.38;
      const neckTop=cy+R*0.78;
      const neckBot=cy+R*1.55;
      const neckGrad=c.createLinearGradient(cx-neckW,0,cx+neckW,0);
      neckGrad.addColorStop(0,skinDark);
      neckGrad.addColorStop(0.35,skin);
      neckGrad.addColorStop(0.65,skin);
      neckGrad.addColorStop(1,skinDark);
      c.fillStyle=neckGrad;
      c.beginPath();
      c.moveTo(cx-neckW,neckTop);
      c.lineTo(cx-neckW*1.1,neckBot);
      c.lineTo(cx+neckW*1.1,neckBot);
      c.lineTo(cx+neckW,neckTop);
      c.closePath();
      c.fill();
      c.fillStyle="rgba(0,0,0,0.18)";
      c.beginPath();
      c.ellipse(cx,neckTop+R*0.06,neckW*0.95,R*0.14,0,0,Math.PI);
      c.fill();
      c.restore();

      // Schultern / T-Shirt
      c.save();
      const shoulderY=cy+R*1.42;
      const shoulderW=R*1.55;
      const shirtGrad=c.createLinearGradient(cx-shoulderW,shoulderY,cx+shoulderW,shoulderY);
      shirtGrad.addColorStop(0,"#1f2937");
      shirtGrad.addColorStop(0.5,"#374151");
      shirtGrad.addColorStop(1,"#1f2937");
      c.fillStyle=shirtGrad;
      c.beginPath();
      c.moveTo(cx-shoulderW,this.canvas.height);
      c.quadraticCurveTo(cx-shoulderW*0.95,shoulderY,cx-neckW*1.1,shoulderY-R*0.1);
      c.lineTo(cx+neckW*1.1,shoulderY-R*0.1);
      c.quadraticCurveTo(cx+shoulderW*0.95,shoulderY,cx+shoulderW,this.canvas.height);
      c.closePath();
      c.fill();
      c.strokeStyle="rgba(255,255,255,0.08)";
      c.lineWidth=2;
      c.beginPath();
      c.moveTo(cx-neckW*1.1,shoulderY-R*0.1);
      c.quadraticCurveTo(cx,shoulderY+R*0.05,cx+neckW*1.1,shoulderY-R*0.1);
      c.stroke();
      c.restore();

      // Ohren
      const earY=cy;
      const earX=R*0.86;
      [cx-earX,cx+earX].forEach((ex,i)=>{
        c.save();
        const eg=c.createRadialGradient(ex,earY,2,ex,earY,R*0.14);
        eg.addColorStop(0,skinLight);
        eg.addColorStop(0.6,skin);
        eg.addColorStop(1,skinDark);
        c.fillStyle=eg;
        c.beginPath();
        c.ellipse(ex,earY,R*0.075,R*0.15,0,0,Math.PI*2);
        c.fill();
        c.fillStyle=skinDarker;
        c.globalAlpha=0.5;
        c.beginPath();
        c.ellipse(ex+(i===0?R*0.015:-R*0.015),earY,R*0.03,R*0.08,0,0,Math.PI*2);
        c.fill();
        c.restore();
      });

      // Gesicht
      c.save();
      const faceGrad=c.createRadialGradient(cx-headW*0.3,cy-headH*0.35,R*0.15,cx,cy,headH*1.05);
      faceGrad.addColorStop(0,skinLight);
      faceGrad.addColorStop(0.4,skin);
      faceGrad.addColorStop(0.85,skinDark);
      faceGrad.addColorStop(1,skinDarker);
      c.fillStyle=faceGrad;
      c.beginPath();
      c.moveTo(cx-headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx-headW*1.0,cy-headH*0.9,cx+headW*1.0,cy-headH*0.9,cx+headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx+headW*0.98,cy+headH*0.15,cx+headW*0.7,cy+headH*0.55,cx+headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx+headW*0.15,cy+headH*0.98,cx-headW*0.15,cy+headH*0.98,cx-headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx-headW*0.7,cy+headH*0.55,cx-headW*0.98,cy+headH*0.15,cx-headW*0.9,cy-headH*0.2);
      c.closePath();
      c.fill();
      c.restore();

      // Vorderhaar
      c.save();
      const hairGrad=c.createLinearGradient(cx,cy-headH,cx,cy+headH*0.1);
      hairGrad.addColorStop(0,this.shade(hairColor,20));
      hairGrad.addColorStop(0.5,hairColor);
      hairGrad.addColorStop(1,hairDark);
      c.fillStyle=hairGrad;
      c.beginPath();
      c.moveTo(cx-headW*0.94,cy-headH*0.15);
      c.bezierCurveTo(cx-headW*1.05,cy-headH*0.95,cx+headW*1.05,cy-headH*0.95,cx+headW*0.94,cy-headH*0.15);
      c.bezierCurveTo(cx+headW*0.98,cy-headH*0.05,cx+headW*0.9,cy-headH*0.05,cx+headW*0.82,cy-headH*0.05);
      c.bezierCurveTo(cx+headW*0.5,cy-headH*0.4,cx+headW*0.2,cy-headH*0.5,cx,cy-headH*0.42);
      c.bezierCurveTo(cx-headW*0.25,cy-headH*0.5,cx-headW*0.55,cy-headH*0.35,cx-headW*0.82,cy-headH*0.05);
      c.bezierCurveTo(cx-headW*0.9,cy-headH*0.05,cx-headW*0.98,cy-headH*0.05,cx-headW*0.94,cy-headH*0.15);
      c.closePath();
      c.fill();
      c.strokeStyle=this.shade(hairColor,50);
      c.lineWidth=R*0.012;
      c.globalAlpha=0.35;
      for(let i=0;i<6;i++){
        c.beginPath();
        const sx=cx-headW*0.6+i*headW*0.25;
        c.moveTo(sx,cy-headH*0.75);
        c.quadraticCurveTo(sx+headW*0.05,cy-headH*0.5,sx+headW*0.02,cy-headH*0.15);
        c.stroke();
      }
      c.restore();

      // Augenbrauen
      const browY=cy-headH*0.12;
      const browW=R*0.26;
      const browThickness=R*0.045;
      const eyeSpan=R*0.34;
      [cx-eyeSpan,cx+eyeSpan].forEach((bx,i)=>{
        c.save();
        const dir=i===0?1:-1;
        c.strokeStyle=this.shade(hairColor,-15);
        c.lineWidth=browThickness;
        c.lineCap="round";
        c.beginPath();
        c.moveTo(bx-browW*0.9,browY+browThickness*0.6);
        c.quadraticCurveTo(bx+browW*0.05*dir,browY-browThickness*1.0,bx+browW*0.95,browY+browThickness*0.1);
        c.stroke();
        c.restore();
      });

      // Augen
      const eyeY=cy+headH*0.02;
      const eyeW=R*0.17;
      const eyeH=R*0.11;
      const blinkAmount=this.blink>0?Math.max(0,1-this.blink/6):1;
      [cx-eyeSpan,cx+eyeSpan].forEach(ex=>{
        c.save();
        c.fillStyle="rgba(0,0,0,0.08)";
        c.beginPath();
        c.ellipse(ex,eyeY-eyeH*0.15,eyeW*1.15,eyeH*1.5,0,0,Math.PI*2);
        c.fill();

        c.fillStyle="#f8f6f2";
        c.beginPath();
        c.moveTo(ex-eyeW,eyeY);
        c.quadraticCurveTo(ex-eyeW*0.5,eyeY-eyeH*1.4,ex,eyeY-eyeH*1.1);
        c.quadraticCurveTo(ex+eyeW*0.5,eyeY-eyeH*1.4,ex+eyeW,eyeY);
        c.quadraticCurveTo(ex+eyeW*0.5,eyeY+eyeH*1.2,ex,eyeY+eyeH*0.95);
        c.quadraticCurveTo(ex-eyeW*0.5,eyeY+eyeH*1.2,ex-eyeW,eyeY);
        c.closePath();
        c.fill();

        if(blinkAmount>0.05){
          const irisR=eyeH*0.85;
          const lookX=ex+this.mouseX*eyeW*0.25;
          const lookY=eyeY+this.mouseY*eyeH*0.25;
          const irisGrad=c.createRadialGradient(lookX-irisR*0.3,lookY-irisR*0.3,irisR*0.1,lookX,lookY,irisR);
          irisGrad.addColorStop(0,this.shade(eyeColor,30));
          irisGrad.addColorStop(0.7,eyeColor);
          irisGrad.addColorStop(1,this.shade(eyeColor,-40));
          c.fillStyle=irisGrad;
          c.beginPath();
          c.ellipse(lookX,lookY,irisR,irisR*blinkAmount,0,0,Math.PI*2);
          c.fill();

          c.strokeStyle=this.shade(eyeColor,-60);
          c.lineWidth=R*0.006;
          c.globalAlpha=0.5;
          for(let a=0;a<8;a++){
            const ang=(a/8)*Math.PI*2;
            c.beginPath();
            c.moveTo(lookX+Math.cos(ang)*irisR*0.4,lookY+Math.sin(ang)*irisR*0.4*blinkAmount);
            c.lineTo(lookX+Math.cos(ang)*irisR*0.9,lookY+Math.sin(ang)*irisR*0.9*blinkAmount);
            c.stroke();
          }
          c.globalAlpha=1;

          c.fillStyle="#000";
          c.beginPath();
          c.ellipse(lookX,lookY,irisR*0.42,irisR*0.42*blinkAmount,0,0,Math.PI*2);
          c.fill();

          c.fillStyle="rgba(255,255,255,0.85)";
          c.beginPath();
          c.arc(lookX-irisR*0.35,lookY-irisR*0.4,irisR*0.22,0,Math.PI*2);
          c.fill();
          c.fillStyle="rgba(255,255,255,0.4)";
          c.beginPath();
          c.arc(lookX+irisR*0.3,lookY+irisR*0.35,irisR*0.1,0,Math.PI*2);
          c.fill();
        }

        c.fillStyle=skin;
        c.beginPath();
        c.moveTo(ex-eyeW*1.05,eyeY-eyeH*0.4);
        c.quadraticCurveTo(ex,eyeY-eyeH*(1.1+(1-blinkAmount)*1.5),ex+eyeW*1.05,eyeY-eyeH*0.4);
        c.quadraticCurveTo(ex,eyeY-eyeH*(0.9-(1-blinkAmount)*0.5),ex-eyeW*1.05,eyeY-eyeH*0.4);
        c.closePath();
        c.fill();
        c.strokeStyle="#1a0f0a";
        c.lineWidth=R*0.014;
        c.lineCap="round";
        c.beginPath();
        const lidY=eyeY-eyeH*(1.1-blinkAmount*0.9);
        c.moveTo(ex-eyeW*0.95,eyeY-eyeH*0.15);
        c.quadraticCurveTo(ex,lidY-eyeH*0.15,ex+eyeW*0.95,eyeY-eyeH*0.15);
        c.stroke();
        c.restore();
      });

      // Nase
      const noseTop=cy+headH*0.05;
      const noseTip=cy+headH*0.24;
      c.save();
      c.strokeStyle=this.shade(skin,-35);
      c.lineWidth=R*0.02;
      c.lineCap="round";
      c.globalAlpha=0.5;
      c.beginPath();
      c.moveTo(cx-R*0.02,noseTop);
      c.quadraticCurveTo(cx-R*0.06,noseTip-R*0.05,cx-R*0.09,noseTip);
      c.stroke();
      c.strokeStyle=this.shade(skin,20);
      c.lineWidth=R*0.028;
      c.globalAlpha=0.4;
      c.beginPath();
      c.moveTo(cx+R*0.01,noseTop);
      c.quadraticCurveTo(cx+R*0.02,noseTip-R*0.05,cx+R*0.02,noseTip-R*0.01);
      c.stroke();
      c.fillStyle=this.shade(skin,-60);
      c.globalAlpha=0.75;
      c.beginPath();
      c.ellipse(cx-R*0.075,noseTip+R*0.005,R*0.022,R*0.014,-0.3,0,Math.PI*2);
      c.fill();
      c.beginPath();
      c.ellipse(cx+R*0.075,noseTip+R*0.005,R*0.022,R*0.014,0.3,0,Math.PI*2);
      c.fill();
      c.globalAlpha=1;
      c.restore();

      // Mund
      const mouthY=cy+headH*0.45;
      const mouthW=R*0.24;
      const lipColor=this.shade(skin,-45);
      const lipTop=this.shade(skin,-25);
      c.save();
      const upperH=R*0.028;
      c.fillStyle=lipColor;
      c.beginPath();
      c.moveTo(cx-mouthW,mouthY);
      c.quadraticCurveTo(cx-mouthW*0.6,mouthY-upperH*1.3,cx-mouthW*0.15,mouthY-upperH*0.8);
      c.quadraticCurveTo(cx,mouthY-upperH*1.6,cx+mouthW*0.15,mouthY-upperH*0.8);
      c.quadraticCurveTo(cx+mouthW*0.6,mouthY-upperH*1.3,cx+mouthW,mouthY);
      c.quadraticCurveTo(cx,mouthY+upperH*0.3,cx-mouthW,mouthY);
      c.closePath();
      c.fill();

      const lowerH=R*0.045;
      const openAmount=this.mouthOpen*R*0.15;
      c.fillStyle=this.shade(lipColor,15);
      c.beginPath();
      c.moveTo(cx-mouthW,mouthY+openAmount*0.1);
      c.quadraticCurveTo(cx,mouthY+lowerH*1.1+openAmount,cx+mouthW,mouthY+openAmount*0.1);
      c.quadraticCurveTo(cx,mouthY+openAmount*0.2,cx-mouthW,mouthY+openAmount*0.1);
      c.closePath();
      c.fill();

      if(openAmount>0.5){
        c.fillStyle="#3a1210";
        c.beginPath();
        c.moveTo(cx-mouthW*0.95,mouthY);
        c.quadraticCurveTo(cx,mouthY+openAmount*0.9,cx+mouthW*0.95,mouthY);
        c.quadraticCurveTo(cx,mouthY+openAmount*0.3,cx-mouthW*0.95,mouthY);
        c.closePath();
        c.fill();
        c.fillStyle="rgba(240,238,232,0.9)";
        c.beginPath();
        c.moveTo(cx-mouthW*0.85,mouthY);
        c.lineTo(cx+mouthW*0.85,mouthY);
        c.lineTo(cx+mouthW*0.8,mouthY+openAmount*0.25);
        c.lineTo(cx-mouthW*0.8,mouthY+openAmount*0.25);
        c.closePath();
        c.fill();
        if(openAmount>R*0.08){
          c.fillStyle="rgba(200,90,90,0.7)";
          c.beginPath();
          c.ellipse(cx,mouthY+openAmount*0.65,mouthW*0.5,openAmount*0.25,0,0,Math.PI*2);
          c.fill();
        }
      }

      c.fillStyle="rgba(255,255,255,0.15)";
      c.beginPath();
      c.ellipse(cx,mouthY+lowerH*0.3,mouthW*0.4,lowerH*0.3,0,0,Math.PI*2);
      c.fill();
      c.restore();

      // Wangen
      c.save();
      c.fillStyle=this.shade(skin,-15);
      c.globalAlpha=0.2;
      c.beginPath();
      c.ellipse(cx-R*0.35,cy+R*0.15,R*0.12,R*0.08,0,0,Math.PI*2);
      c.fill();
      c.beginPath();
      c.ellipse(cx+R*0.35,cy+R*0.15,R*0.12,R*0.08,0,0,Math.PI*2);
      c.fill();
      c.restore();

      // Stirn-Glanz
      c.save();
      c.fillStyle="rgba(255,255,255,0.10)";
      c.beginPath();
      c.ellipse(cx-headW*0.15,cy-headH*0.45,headW*0.35,headH*0.18,0,0,Math.PI*2);
      c.fill();
      c.restore();
    },

    drawCyborg(c,cx,cy,R){
      const metal="#8aa0b8";
      const metalDark="#3a4a5e";
      const metalLight="#c0d0e0";
      const headW=R*0.82;
      const headH=R*1.0;

      c.save();
      const neckW=R*0.38;
      const neckTop=cy+R*0.78;
      const neckBot=cy+R*1.55;
      const ng=c.createLinearGradient(cx-neckW,0,cx+neckW,0);
      ng.addColorStop(0,metalDark);ng.addColorStop(0.5,metal);ng.addColorStop(1,metalDark);
      c.fillStyle=ng;
      c.beginPath();
      c.moveTo(cx-neckW,neckTop);
      c.lineTo(cx-neckW*1.1,neckBot);
      c.lineTo(cx+neckW*1.1,neckBot);
      c.lineTo(cx+neckW,neckTop);
      c.closePath();
      c.fill();
      c.restore();

      c.save();
      const shoulderY=cy+R*1.42;
      const shoulderW=R*1.55;
      c.fillStyle="#1a2332";
      c.beginPath();
      c.moveTo(cx-shoulderW,this.canvas.height);
      c.quadraticCurveTo(cx-shoulderW*0.95,shoulderY,cx-neckW*1.1,shoulderY-R*0.1);
      c.lineTo(cx+neckW*1.1,shoulderY-R*0.1);
      c.quadraticCurveTo(cx+shoulderW*0.95,shoulderY,cx+shoulderW,this.canvas.height);
      c.closePath();
      c.fill();
      c.strokeStyle=this.color1;c.lineWidth=2;c.globalAlpha=0.7;
      c.beginPath();c.moveTo(cx-shoulderW*0.8,shoulderY+R*0.3);c.lineTo(cx-shoulderW*0.5,shoulderY+R*0.1);c.lineTo(cx-neckW*1.1,shoulderY-R*0.05);c.stroke();
      c.beginPath();c.moveTo(cx+shoulderW*0.8,shoulderY+R*0.3);c.lineTo(cx+shoulderW*0.5,shoulderY+R*0.1);c.lineTo(cx+neckW*1.1,shoulderY-R*0.05);c.stroke();
      c.restore();

      c.save();
      const fg=c.createRadialGradient(cx-headW*0.3,cy-headH*0.4,R*0.1,cx,cy,headH*1.1);
      fg.addColorStop(0,metalLight);
      fg.addColorStop(0.5,metal);
      fg.addColorStop(1,metalDark);
      c.fillStyle=fg;
      c.beginPath();
      c.moveTo(cx-headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx-headW*1.0,cy-headH*0.9,cx+headW*1.0,cy-headH*0.9,cx+headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx+headW*0.98,cy+headH*0.15,cx+headW*0.7,cy+headH*0.55,cx+headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx+headW*0.15,cy+headH*0.98,cx-headW*0.15,cy+headH*0.98,cx-headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx-headW*0.7,cy+headH*0.55,cx-headW*0.98,cy+headH*0.15,cx-headW*0.9,cy-headH*0.2);
      c.closePath();
      c.fill();
      c.strokeStyle=metalDark;c.lineWidth=R*0.012;c.globalAlpha=0.7;
      c.beginPath();c.moveTo(cx-headW*0.6,cy-headH*0.4);c.lineTo(cx+headW*0.6,cy-headH*0.4);c.stroke();
      c.beginPath();c.moveTo(cx,cy-headH*0.5);c.lineTo(cx,cy+headH*0.7);c.stroke();
      c.globalAlpha=1;
      c.restore();

      const eyeY=cy+headH*0.02;
      const eyeSpan=R*0.34;
      const blinkAmount=this.blink>0?Math.max(0,1-this.blink/6):1;
      [cx-eyeSpan,cx+eyeSpan].forEach(ex=>{
        c.save();
        c.fillStyle="#000";
        c.beginPath();c.ellipse(ex,eyeY,R*0.16,R*0.09*blinkAmount,0,0,Math.PI*2);c.fill();
        if(blinkAmount>0.3){
          c.shadowColor=this.color1;c.shadowBlur=20;
          c.fillStyle=this.color1;
          c.beginPath();c.arc(ex,eyeY,R*0.055*blinkAmount,0,Math.PI*2);c.fill();
          c.shadowBlur=0;
          c.fillStyle="#fff";
          c.beginPath();c.arc(ex,eyeY,R*0.02*blinkAmount,0,Math.PI*2);c.fill();
        }
        c.restore();
      });

      const mouthY=cy+headH*0.45;
      const bars=13;
      const totalW=R*0.5;
      const bw=totalW/bars;
      c.save();
      for(let i=0;i<bars;i++){
        const center=Math.abs(i-(bars-1)/2)/((bars-1)/2);
        const h=(0.25+Math.sin(this.t*0.25+i*0.5)*0.08+this.mouthOpen*0.7)*R*0.14*(1-center*0.3);
        const x=cx-totalW/2+i*bw+bw*0.2;
        c.fillStyle=i%2===0?this.color1:this.color2;
        c.shadowColor=c.fillStyle;c.shadowBlur=8;
        c.fillRect(x,mouthY-h/2,bw*0.6,h);
      }
      c.shadowBlur=0;
      c.restore();
    },

    drawHologram(c,cx,cy,R){
      const c1=this.color1,c2=this.color2;
      const headW=R*0.82;
      const headH=R*1.0;
      const neckW=R*0.38;
      c.save();
      c.globalAlpha=0.65+Math.sin(this.t*0.08)*0.05;

      c.strokeStyle=c1;c.globalAlpha=0.1;c.lineWidth=1;
      for(let i=0;i<=10;i++){const y=(i/10)*this.canvas.height;c.beginPath();c.moveTo(0,y);c.lineTo(this.canvas.width,y);c.stroke();}

      c.globalAlpha=0.35;
      c.fillStyle=c1;
      const neckTop=cy+R*0.78;
      const neckBot=cy+R*1.55;
      c.beginPath();
      c.moveTo(cx-neckW,neckTop);
      c.lineTo(cx-neckW*1.1,neckBot);
      c.lineTo(cx+neckW*1.1,neckBot);
      c.lineTo(cx+neckW,neckTop);
      c.closePath();
      c.fill();

      const shoulderY=cy+R*1.42;
      const shoulderW=R*1.55;
      c.beginPath();
      c.moveTo(cx-shoulderW,this.canvas.height);
      c.quadraticCurveTo(cx-shoulderW*0.95,shoulderY,cx-neckW*1.1,shoulderY-R*0.1);
      c.lineTo(cx+neckW*1.1,shoulderY-R*0.1);
      c.quadraticCurveTo(cx+shoulderW*0.95,shoulderY,cx+shoulderW,this.canvas.height);
      c.closePath();
      c.fill();

      const hg=c.createRadialGradient(cx-headW*0.3,cy-headH*0.4,R*0.1,cx,cy,headH*1.1);
      hg.addColorStop(0,c1);hg.addColorStop(1,c2);
      c.globalAlpha=0.75;
      c.fillStyle=hg;
      c.beginPath();
      c.moveTo(cx-headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx-headW*1.0,cy-headH*0.9,cx+headW*1.0,cy-headH*0.9,cx+headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx+headW*0.98,cy+headH*0.15,cx+headW*0.7,cy+headH*0.55,cx+headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx+headW*0.15,cy+headH*0.98,cx-headW*0.15,cy+headH*0.98,cx-headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx-headW*0.7,cy+headH*0.55,cx-headW*0.98,cy+headH*0.15,cx-headW*0.9,cy-headH*0.2);
      c.closePath();
      c.fill();

      c.strokeStyle="rgba(255,255,255,0.5)";c.lineWidth=1.5;c.globalAlpha=0.6;
      c.beginPath();
      c.moveTo(cx-headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx-headW*1.0,cy-headH*0.9,cx+headW*1.0,cy-headH*0.9,cx+headW*0.9,cy-headH*0.2);
      c.bezierCurveTo(cx+headW*0.98,cy+headH*0.15,cx+headW*0.7,cy+headH*0.55,cx+headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx+headW*0.15,cy+headH*0.98,cx-headW*0.15,cy+headH*0.98,cx-headW*0.35,cy+headH*0.82);
      c.bezierCurveTo(cx-headW*0.7,cy+headH*0.55,cx-headW*0.98,cy+headH*0.15,cx-headW*0.9,cy-headH*0.2);
      c.closePath();
      c.stroke();
      for(let i=1;i<5;i++){
        const yy=cy-headH*0.8+(headH*1.7)*(i/5);
        const t2=(yy-cy)/headH;
        const w=Math.sqrt(Math.max(0,1-t2*t2))*headW*0.85;
        c.beginPath();c.moveTo(cx-w,yy);c.lineTo(cx+w,yy);c.stroke();
      }
      c.globalAlpha=0.75;

      const eyeY=cy+headH*0.02;
      const eyeSpan=R*0.34;
      const blinkAmount=this.blink>0?Math.max(0,1-this.blink/6):1;
      [cx-eyeSpan,cx+eyeSpan].forEach(ex=>{
        c.save();
        c.strokeStyle="rgba(255,255,255,0.85)";c.lineWidth=2;
        c.beginPath();c.ellipse(ex,eyeY,R*0.13,R*0.075*blinkAmount,0,0,Math.PI*2);c.stroke();
        if(blinkAmount>0.3){
          c.shadowColor=c1;c.shadowBlur=15;
          c.fillStyle="#fff";
          c.beginPath();c.arc(ex,eyeY,R*0.035*blinkAmount,0,Math.PI*2);c.fill();
          c.shadowBlur=0;
        }
        c.restore();
      });

      const mouthY=cy+headH*0.45;
      c.save();
      c.strokeStyle="rgba(255,255,255,0.9)";c.lineWidth=R*0.02;
      c.beginPath();
      const mouthW=R*0.25;
      for(let i=0;i<=32;i++){
        const p=i/32;
        const x=cx-mouthW+p*mouthW*2;
        const amp=(0.03+this.mouthOpen*0.6)*R*0.15;
        const y=mouthY+Math.sin(p*8+this.t*0.3)*amp;
        if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
      }
      c.stroke();
      c.restore();

      c.globalAlpha=0.10;c.fillStyle="#000";
      for(let y=0;y<this.canvas.height;y+=4)c.fillRect(0,y,this.canvas.width,2);

      c.globalAlpha=0.85+Math.sin(this.t*0.9)*0.08;
      c.restore();
    }
  };

  /* ================= WAKE WORD ================= */
  const WakeWord = {
    _rec:null,_active:false,
    start(onDetect){
      if(this._active)return;
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){console.warn("Wake: nicht verfügbar");return;}
      const r=new SR();r.lang="de-DE";r.continuous=true;r.interimResults=true;
      r.onresult=(e)=>{
        const last=e.results[e.results.length-1];
        const txt=(last[0].transcript||"").toLowerCase().trim();
        const words=(Settings.get("voice","wakeWords")||"").split(",").map(w=>w.trim().toLowerCase()).filter(Boolean);
        if(words.some(w=>txt.includes(w)))onDetect&&onDetect(txt);
      };
      r.onerror=()=>{};
      r.onend=()=>{if(this._active){try{r.start();}catch(e){}}};
      try{r.start();this._active=true;this._rec=r;Bus.emit("wake:on");}catch(e){console.warn(e);}
    },
    stop(){this._active=false;try{this._rec&&this._rec.stop();}catch(e){}this._rec=null;Bus.emit("wake:off");},
    isActive(){return this._active;}
  };

  /* ================= APP 1 · NOTIZEN ================= */
  const NotesDB = {
    key:"notes",
    all(){return Storage.get(this.key,[]);},
    save(l){Storage.set(this.key,l);},
    add(n){const l=this.all();l.unshift(n);this.save(l);},
    update(id,patch){const l=this.all();const i=l.findIndex(n=>n.id===id);if(i>=0){Object.assign(l[i],patch);l[i].updated=Date.now();this.save(l);}},
    del(id){this.save(this.all().filter(n=>n.id!==id));}
  };
  function mountNotes(root){
    const searchInput = U.el("input",{type:"text",placeholder:"🔍 Notizen durchsuchen…",oninput:()=>renderList()});
    const newBtn = U.el("button",{class:"btn primary",onclick:()=>openEditor(null)},"+ Neue Notiz");
    const exportAllBtn = U.el("button",{class:"btn",onclick:()=>{
      const all=NotesDB.all();
      if(!all.length){alert("Keine Notizen.");return;}
      downloadTxt(all.map(n=>`=== ${n.title} ===\n${n.body}\n`).join("\n\n"),"haldo-notizen-"+new Date().toISOString().slice(0,10)+".txt");
    }},"⬇️ Alle exportieren");

    root.appendChild(U.el("div",{class:"app-header"},
      U.el("button",{class:"btn",onclick:()=>Router.go("apps")},"← Zurück"),
      U.el("h2",{},"📝 Notizen Pro"),
      U.el("div",{style:{flex:1}}),

  /* ================= APP 2 · AUFGABEN ================= */
  const TasksDB = {
    key:"tasks",
    all(){return Storage.get(this.key,[]);},
    save(l){Storage.set(this.key,l);},
    add(t){const l=this.all();l.unshift(t);this.save(l);},
    update(id,patch){const l=this.all();const i=l.findIndex(t=>t.id===id);if(i>=0){Object.assign(l[i],patch);this.save(l);}},
    del(id){this.save(this.all().filter(t=>t.id!==id));}
  };
  function mountTasks(root){
    let filter="all";
    const filterSel=U.el("select",{onchange:(e)=>{filter=e.target.value;render();}},
      U.el("option",{value:"all"},"Alle"),
      U.el("option",{value:"open"},"Offen"),
      U.el("option",{value:"done"},"Erledigt")
    );
    const sortSel=U.el("select",{onchange:()=>render()},
      U.el("option",{value:"new"},"Neueste"),
      U.el("option",{value:"prio"},"Priorität"),
      U.el("option",{value:"due"},"Fälligkeit")
    );
    const newBtn=U.el("button",{class:"btn primary",onclick:()=>openEditor(null)},"+ Neue Aufgabe");

    root.appendChild(U.el("div",{class:"app-header"},
      U.el("button",{class:"btn",onclick:()=>Router.go("apps")},"← Zurück"),
      U.el("h2",{},"✅ Aufgaben"),
      U.el("div",{style:{flex:1}}),
      newBtn
    ));
    root.appendChild(U.el("div",{class:"app-toolbar"},
      filterSel,sortSel,
      U.el("span",{class:"badge",id:"taskCount",style:{flexShrink:0,marginLeft:"auto"}})
    ));
    const listEl=U.el("div",{class:"tasks-list",id:"tasksList"});
    root.appendChild(listEl);

    function render(){
      let items=TasksDB.all();
      if(filter==="open")items=items.filter(t=>!t.done);
      else if(filter==="done")items=items.filter(t=>t.done);
      const sort=sortSel.value;
      items.sort((a,b)=>{
        if(sort==="prio"){const w={high:0,med:1,low:2};return (w[a.prio]??1)-(w[b.prio]??1);}
        if(sort==="due"){if(!a.due)return 1;if(!b.due)return -1;return a.due.localeCompare(b.due);}
        return (b.created||0)-(a.created||0);
      });
      listEl.innerHTML="";
      const open=TasksDB.all().filter(t=>!t.done).length;
      document.getElementById("taskCount").textContent=open+" offen / "+TasksDB.all().length+" gesamt";
      if(!items.length){
        listEl.appendChild(U.el("div",{class:"placeholder",style:{marginTop:"10px"}},
          U.el("img",{src:"logo.png",alt:""}),
          U.el("h3",{},"Keine Aufgaben"),
          U.el("p",{},"Erstelle deine erste Aufgabe mit „+ Neue Aufgabe“.")
        ));
        return;
      }
      const prioLabel={low:"Niedrig",med:"Mittel",high:"Hoch"};
      items.forEach(t=>{
        const dueStr=t.due?new Date(t.due).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
        listEl.appendChild(U.el("div",{class:"task-item"+(t.done?" done":"")},
          U.el("div",{class:"task-check",onclick:()=>{TasksDB.update(t.id,{done:!t.done});render();}},t.done?"✓":""),
          U.el("div",{class:"task-body"},
            U.el("div",{class:"task-title"},t.title),
            U.el("div",{class:"task-meta"},
              U.el("span",{class:"prio "+t.prio},prioLabel[t.prio]||"Mittel"),
              dueStr?U.el("span",{},"📅 "+dueStr):null
            )
          ),
          U.el("div",{class:"note-actions"},
            U.el("button",{class:"icon-btn",title:"Bearbeiten",onclick:()=>openEditor(t)},"✏️"),
            U.el("button",{class:"icon-btn",title:"Löschen",onclick:()=>{if(confirm("Aufgabe löschen?")){TasksDB.del(t.id);render();}}},"🗑️")
          )
        ));
      });
    }

    function openEditor(task){
      const isNew=!task;
      const t=task||{id:"t_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),title:"",prio:"med",due:"",done:false,created:Date.now()};
      const overlay=U.el("div",{class:"modal-overlay"});
      const titleInp=U.el("input",{type:"text",placeholder:"Was zu tun?",value:t.title,class:"modal-title"});
      const prioSel=U.el("select",{style:{background:"var(--panel)",border:"1px solid var(--border)",color:"var(--text)",padding:"10px 14px",borderRadius:"10px",fontFamily:"inherit",fontSize:"13.5px",outline:"none"}},

        U.el("option",{value:"med"},"🟡 Mittel"),
        U.el("option",{value:"high"},"🔴 Hoch")
      );

      const dueInp=U.el("input",{type:"date",value:t.due||"",style:{background:"var(--panel)",border:"1px solid var(--border)",color:"var(--text)",padding:"10px 14px",borderRadius:"10px",fontFamily:"inherit",fontSize:"13.5px",outline:"none"}});
      const saveBtn=U.el("button",{class:"btn primary",onclick:()=>{

      }},"💾 Speichern");

      const modal=U.el("div",{class:"modal"},

        U.el("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap"}},prioSel,dueInp),
        U.el("div",{class:"modal-footer"},U.el("div",{style:{flex:1}}),cancelBtn,saveBtn)
      );

      document.body.appendChild(overlay);
      setTimeout(()=>titleInp.focus(),50);

    render();

  /* ================= APP 3 · KALENDER ================= */
  const EventsDB = {
    key:"events",
    all(){return Storage.get(this.key,[]);},
    save(l){Storage.set(this.key,l);},
    add(e){const l=this.all();l.push(e);this.save(l);},
    del(id){this.save(this.all().filter(e=>e.id!==id));},
    forDate(d){return this.all().filter(e=>e.date===d).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));}
  };
  function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

  function mountCalendar(root){
    let viewYear,viewMonth;
    const today=new Date();
    viewYear=today.getFullYear();viewMonth=today.getMonth();
    let selectedDate=dateKey(today);

    const prevBtn=U.el("button",{class:"btn",onclick:()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--;}render();}},"‹");
    const nextBtn=U.el("button",{class:"btn",onclick:()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++;}render();}},"›");
    const todayBtn=U.el("button",{class:"btn",onclick:()=>{viewYear=today.getFullYear();viewMonth=today.getMonth();selectedDate=dateKey(today);render();}},"Heute");
    const titleEl=U.el("h3",{},"");

    root.appendChild(U.el("div",{class:"app-header"},
      U.el("button",{class:"btn",onclick:()=>Router.go("apps")},"← Zurück"),
      U.el("h2",{},"📅 Kalender Pro"),
      U.el("div",{style:{flex:1}}),
      U.el("span",{class:"badge",id:"evCount"})
    ));
    root.appendChild(U.el("div",{class:"cal-head"},
      prevBtn,titleEl,nextBtn,todayBtn,
      U.el("div",{style:{flex:1}}),
      U.el("button",{class:"btn primary",onclick:()=>openEditor()},"+ Termin")
    ));
    const gridEl=U.el("div",{class:"cal-grid"});
    root.appendChild(gridEl);
    const eventsWrap=U.el("div",{class:"cal-events"});
    root.appendChild(eventsWrap);

    function render(){
      const monthNames=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
      titleEl.textContent=monthNames[viewMonth]+" "+viewYear;
      gridEl.innerHTML="";
      ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(d=>gridEl.appendChild(U.el("div",{class:"cal-dow"},d)));
      const first=new Date(viewYear,viewMonth,1);
      const startDow=(first.getDay()+6)%7;
      const start=new Date(viewYear,viewMonth,1-startDow);
      const todayKey=dateKey(today);
      for(let i=0;i<42;i++){
        const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
        const key=dateKey(d);
        const isOther=d.getMonth()!==viewMonth;
        const isToday=key===todayKey;
        const isSelected=key===selectedDate;
        const hasEvents=EventsDB.forDate(key).length;
        const cls="cal-day"+(isOther?" other":"")+(isToday?" today":"")+(isSelected?" selected":"");
        gridEl.appendChild(U.el("button",{class:cls,onclick:()=>{selectedDate=key;render();}},
          U.el("span",{},String(d.getDate())),
          hasEvents?U.el("div",{class:"dots"},...Array(Math.min(hasEvents,4)).fill(0).map(()=>U.el("span",{class:"dot"}))):null
        ));
      }
      eventsWrap.innerHTML="";
      const events=EventsDB.forDate(selectedDate);
      const selDate=new Date(selectedDate+"T00:00:00");
      const selLabel=selDate.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
      eventsWrap.appendChild(U.el("h3",{},"📌 "+selLabel));
      document.getElementById("evCount").textContent=EventsDB.all().length+" Termine";
      if(!events.length){
        eventsWrap.appendChild(U.el("div",{style:{color:"var(--text-dim)",fontSize:"13px",padding:"14px",textAlign:"center",background:"var(--panel)",borderRadius:"10px",border:"1px dashed var(--border)"}},"Keine Termine an diesem Tag."));
      }else{
        events.forEach(ev=>{
          eventsWrap.appendChild(U.el("div",{class:"event-item"},
            U.el("div",{class:"event-time"},ev.time||"–"),
            U.el("div",{class:"event-title"},ev.title),
            U.el("button",{class:"icon-btn",title:"Löschen",onclick:()=>{if(confirm("Termin löschen?")){EventsDB.del(ev.id);render();}}},"🗑️")
          ));
        });
      }
    }
    function openEditor(){
      const overlay=U.el("div",{class:"modal-overlay"});
      const titleInp=U.el("input",{type:"text",placeholder:"Termin-Titel…",class:"modal-title"});
      const dateInp=U.el("input",{type:"date",value:selectedDate,style:{background:"var(--panel)",border:"1px solid var(--border)",color:"var(--text)",padding:"10px 14px",borderRadius:"10px",fontFamily:"inherit",fontSize:"13.5px",outline:"none"}});
      const timeInp=U.el("input",{type:"time",value:"09:00",style:{background:"var(--panel)",border:"1px solid var(--border)",color:"var(--text)",padding:"10px 14px",borderRadius:"10px",fontFamily:"inherit",fontSize:"13.5px",outline:"none"}});
      const saveBtn=U.el("button",{class:"btn primary",onclick:()=>{
        const title=titleInp.value.trim();
        if(!title){alert("Titel eingeben.");return;}
        const date=dateInp.value;
        if(!date){alert("Datum wählen.");return;}
        EventsDB.add({id:"e_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),title,date,time:timeInp.value||""});
        overlay.remove();selectedDate=date;render();
      }},"💾 Speichern");
      const cancelBtn=U.el("button",{class:"btn",onclick:()=>overlay.remove()},"Abbrechen");
      const modal=U.el("div",{class:"modal"},
        U.el("div",{class:"modal-header"},U.el("h3",{},"📅 Neuer Termin")),
        titleInp,
        U.el("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap"}},dateInp,timeInp),
        U.el("div",{class:"modal-footer"},U.el("div",{style:{flex:1}}),cancelBtn,saveBtn)
      );
      overlay.appendChild(modal);
      overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
      document.body.appendChild(overlay);
      setTimeout(()=>titleInp.focus(),50);
    }
    render();
  }

  async function handleUserMessage(text){
    addMessage("user",text);
    const lower=text.toLowerCase().trim();
    if(/^(hallo|hi|hey|servus|merhaba|silav|guten (morgen|tag|abend))/.test(lower)){
      const h=new Date().getHours();
      const greet=h<6?"Gute Nacht":h<12?"Guten Morgen":h<18?"Guten Tag":"Guten Abend";
      const name=Settings.get("general","name")||"";
      const reply=`${greet}${name?", "+name:""}! Was kann ich tun?`;
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    if(/uhrzeit|wie spät/.test(lower)){
      const t=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
      const reply="Es ist "+t+" Uhr.";
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    if(/datum|welcher tag/.test(lower)){
      const d=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
      const reply="Heute ist "+d+".";
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    if(!AI.hasKey()){
      const reply="Ich habe keinen API-Key. Einstellungen → KI & Gemini.";
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    avStatus&&(avStatus.innerHTML='<span class="live">🤖 denke nach …</span>');
    try{
      const reply=await AI.send(chatHistory.slice(0,-1).slice(-10),text);
      addMessage("bot",reply);speakAndAnimate(reply);
      avStatus&&(avStatus.textContent="Bereit.");
    }catch(e){
      addMessage("sys","Fehler: "+(e.message||e));
      avStatus&&(avStatus.textContent="⚠️ Fehler");
      console.warn(e);
    }
  }

  function exportBackup(){
    const data={};Storage.keys().forEach(k=>{data[k]=Storage.get(k);});
    const payload={app:"HalDo AI OS",version:"2.0",phase:5,exported:new Date().toISOString(),data};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="haldo-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

  function importBackup(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const payload=JSON.parse(ev.target.result);
        if(!payload.data){alert("❌ Ungültiges Format");return;}
        if(!confirm("Import? Aktuelle Daten werden überschrieben."))return;
        for(const k in payload.data)Storage.set(k,payload.data[k]);
        alert("✅ Importiert!");location.reload();
      }catch(err){alert("❌ "+err.message);}
    };
    reader.readAsText(file);
  }

    const pin=Settings.get("security","pin");

      const t=U.el("div",{class:"toggle"+(pin?" on":""),onclick:()=>{
        if(Settings.get("security","pin")){Settings.set("security","pin","");viewSettings(document.getElementById("view"));}
        else{const v=prompt("Neue PIN (4-8 Ziffern):");if(v&&/^\d{4,8}$/.test(v)){Settings.set("security","pin",v);viewSettings(document.getElementById("view"));}else if(v)alert("❌ 4-8 Ziffern");}
      }});return t;
    })()));
    p.appendChild(settingRow("Analytics","Lokale Statistik",makeToggle("security","analytics")));
  }
  function renderInfo(p){
    p.appendChild(U.el("h2",{},"ℹ️"," ","Info"));
    p.appendChild(U.el("p",{class:"panel-desc"},"Über HalDo AI OS"));
    p.appendChild(U.el("div",{class:"hero",style:{marginTop:"14px"}},
      U.el("img",{src:"logo.png",alt:""}),
      U.el("div",{class:"h-text"},U.el("h2",{},"HalDo AI OS"),U.el("p",{},"Version 2.0 · Realistischer Avatar + 3 Apps"))
    ));
    [["Version","2.0"],["Phase","5 / 11"],["Apps aktiv",Registry.count()+" Apps (3 echte + Fundament)"],["Avatar","✅ Realistischer Human + Cyborg + Hologram"],["Sprache","✅ TTS + STT"],["KI","✅ Gemini"],["Ziel","70 Apps voll funktionsfähig"]].forEach(([k,v])=>{
      p.appendChild(settingRow(k,null,U.el("span",{style:{color:"var(--primary)",fontWeight:"600"}},v)));
    });
  }

  /* ================= BOOT ================= */
  function boot(){
    const lastDate=Storage.get("last_date","");
    const todayStr=new Date().toDateString();
    if(!Storage.get("first_use",null))Storage.set("first_use",Date.now());
    if(lastDate!==todayStr){
      Storage.set("days_used",(Storage.get("days_used",0)||0)+1);
      Storage.set("last_date",todayStr);
    }
    function tick(){const el=document.getElementById("clock");if(el)el.textContent=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}
    tick();setInterval(tick,15000);

    Settings.load();
    buildNav();
    Router.add("home",viewHome);
    Router.add("apps",viewApps);
    Router.add("avatar",viewAvatar);
    Router.add("settings",viewSettings);
    Router.add("wissen",viewWissen);

    registerApps();

    if(Settings.get("general","splash")){
      setTimeout(()=>{const b=document.getElementById("boot");if(b){b.classList.add("hide");setTimeout(()=>b.remove(),500);}},300);
    }else{const b=document.getElementById("boot");if(b)b.remove();}

    if(Settings.get("voice","wakeWord"))setTimeout(()=>WakeWord.start(onWakeWord),1500);

    Router.go(Settings.get("general","startPage")||"home");

    window.HalDo={Storage,Bus,Registry,Router,U,Settings,Voice,AI,Avatar,WakeWord,NotesDB,TasksDB,EventsDB,version:"2.0",phase:5};
    console.log("%c🦚 HalDo AI OS v2 — Realistischer Avatar + 3 Apps","color:#00d4b8;font-weight:bold;font-size:14px");
    console.log("Apps:",Registry.count());
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
</body>
</html>
