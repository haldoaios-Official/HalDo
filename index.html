<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS v128</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='82'%3E🦚%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#02040a;color:#dff6ff;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
:root{
  --p1:#00e5ff;--p2:#4da8ff;--p3:#b478ff;
  --bg-panel:rgba(10,20,40,.72);--bg-card:rgba(15,25,50,.85);
  --border:1.5px solid rgba(0,229,255,.4);
  --border-soft:1px solid rgba(0,229,255,.18);
  --text:#dff6ff;--text-dim:#7a9bb8;--text-mute:#4a6b88;
  --radius:18px;--shadow:0 10px 40px rgba(0,229,255,.15);
  --glow:0 0 20px rgba(0,229,255,.5);
  --topbar-h:56px;--bottombar-h:66px;
}
body.cyborg{--p1:#ff78c8;--p2:#b478ff;--p3:#ff5cae;--border:1.5px solid rgba(255,120,200,.5);--border-soft:1px solid rgba(255,120,200,.2);--glow:0 0 20px rgba(255,120,200,.6)}
#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 20% 30%,#0a1a3a,#02040a 70%)}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top);background:var(--bg-panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:var(--border-soft);flex-wrap:nowrap}
#topbar .logo{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 6px;border-radius:10px;flex-shrink:0}
#topbar .logo:hover{background:rgba(0,229,255,.08)}
#topbar .logo .peacock{font-size:22px;filter:drop-shadow(0 0 8px var(--p1))}
#topbar .logo .txt{display:flex;flex-direction:column;line-height:1.05}
#topbar .logo .txt .t1{font-size:12px;font-weight:800;color:var(--p1)}
#topbar .logo .txt .t2{font-size:8px;color:var(--text-mute);letter-spacing:1.5px}
#topbar .spacer{flex:1}
#topbar .icon-btn{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--p1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
#topbar .icon-btn:hover{background:rgba(0,229,255,.15);box-shadow:var(--glow)}
@media(max-width:380px){#topbar .icon-btn{width:34px;height:34px;font-size:14px}#topbar .logo .txt{display:none}}
#sidebar{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));left:0;width:245px;max-width:78vw;z-index:45;padding:10px 8px;background:var(--bg-panel);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-right:var(--border-soft);overflow-y:auto;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#sidebar.open{transform:translateX(0)}
#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
#sidebar .group{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:12px 8px 6px}
#sidebar .item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;width:100%;text-align:left}
#sidebar .item:hover{background:rgba(0,229,255,.1)}
#sidebar .item.active{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.15));border:1px solid rgba(0,229,255,.4)}
#sidebar .item .ico{font-size:18px;flex-shrink:0}
#sidebar .item .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar .sep{height:1px;background:var(--border-soft);margin:8px 6px;border:none}
#desktop{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));left:0;right:0;bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));z-index:20;overflow:hidden}
#sidebar.open ~ #desktop{left:245px}
@media(max-width:700px){#sidebar.open ~ #desktop{left:0}}
#homescreen{position:absolute;inset:0;overflow-y:auto;padding:14px;padding-bottom:24px}
#homescreen::-webkit-scrollbar{width:6px}#homescreen::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.welcome{padding:16px;margin-bottom:12px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(180,120,255,.1));border:var(--border);box-shadow:var(--shadow);text-align:center;max-width:760px;margin-left:auto;margin-right:auto}
.welcome .hello{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;font-weight:800}
.welcome .name{font-size:20px;font-weight:900;color:var(--p1);margin-top:4px;text-shadow:0 0 20px var(--p1)}
.welcome .sub{font-size:11px;color:var(--text-dim);margin-top:6px}
.search-row{max-width:760px;margin:0 auto 12px;position:relative}
.search-row input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;background:rgba(0,0,0,.45);border:var(--border-soft);color:var(--text);font-size:13px;outline:none}
.search-row input:focus{border-color:var(--p1);box-shadow:0 0 20px rgba(0,229,255,.2)}
.search-row::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.filter-row{max-width:760px;margin:0 auto 14px;display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:7px 12px;border-radius:14px;border:var(--border-soft);background:rgba(0,0,0,.3);color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.filter-chip.active{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(180,120,255,.2));border-color:var(--p1);color:var(--text);box-shadow:var(--glow)}
.cat-section{max-width:760px;margin:0 auto 18px}
.cat-title{font-size:10.5px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cat-title .count{font-size:9px;padding:2px 8px;background:rgba(0,229,255,.15);color:var(--p1);border-radius:10px;font-weight:800}
.cat-title .toggle{margin-left:auto;font-size:14px;opacity:.5;cursor:pointer;padding:0 8px}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app-grid.collapsed{display:none}
.tile{padding:12px 6px;border-radius:14px;background:var(--bg-card);backdrop-filter:blur(20px);border:var(--border-soft);cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;position:relative;user-select:none}
.tile:hover{border-color:var(--p1);background:rgba(0,229,255,.1);transform:translateY(-2px);box-shadow:var(--glow)}
.tile.dragging{opacity:.4}
.tile.drag-over{border-color:var(--p1);background:rgba(0,229,255,.2);transform:scale(1.05)}
.tile .ico{font-size:30px;line-height:1;filter:drop-shadow(0 0 10px rgba(0,229,255,.4));pointer-events:none}
.tile .name{font-size:11px;font-weight:700;line-height:1.2;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.tile .cat{font-size:8.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.5px;font-weight:700;pointer-events:none}
.tile .star{position:absolute;top:5px;right:5px;font-size:12px;opacity:0;transition:.15s;cursor:pointer}
.tile:hover .star,.tile.starred .star{opacity:1}
.tile .drag-handle{position:absolute;top:5px;left:5px;font-size:11px;opacity:0;cursor:grab}
.tile:hover .drag-handle{opacity:.5}
@media(max-width:400px){.app-grid{grid-template-columns:repeat(3,1fr)}}
.window{position:absolute;background:var(--bg-card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:100;min-width:260px;min-height:200px}
.window.focused{box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px rgba(0,229,255,.25);border-color:var(--p1);z-index:999}
.window.minimized{display:none}
.window.maximized{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(0,229,255,.1),transparent);border-bottom:var(--border-soft);cursor:move;flex-shrink:0;user-select:none;touch-action:none}
.titlebar .ico{font-size:18px;pointer-events:none}
.titlebar .title{flex:1;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.wbtns{display:flex;gap:5px}
.wbtn{width:38px;height:38px;min-width:38px;border-radius:10px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s}
.wbtn:hover{background:rgba(0,229,255,.25)}
.wbtn.close{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#ff8080}
.wbtn.set{background:rgba(180,120,255,.15);border-color:rgba(180,120,255,.5);color:#c084fc}
.wbtn.max{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:#4ade80}
.wbtn.voice{background:rgba(255,200,60,.15);border-color:rgba(255,200,60,.5);color:#fbbf24}
.wbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch}
.wbody::-webkit-scrollbar{width:6px}.wbody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.resizer{position:absolute;width:18px;height:18px;bottom:0;right:0;cursor:nwse-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;bottom:4px;right:4px;width:10px;height:10px;border-right:2px solid var(--p1);border-bottom:2px solid var(--p1);opacity:.4}
#bottombar{position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);z-index:50;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;padding-bottom:env(safe-area-inset-bottom);background:var(--bg-panel);backdrop-filter:blur(24px);border-top:var(--border-soft)}
.bbtn{min-width:82px;padding:8px 14px;border-radius:12px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.bbtn:hover{background:rgba(0,229,255,.2);transform:translateY(-2px)}
.bbtn .ico{font-size:18px;line-height:1}
.bbtn.cyborg{background:rgba(255,120,200,.15);border-color:rgba(255,120,200,.5);color:#ff78c8}
@media(max-width:400px){.bbtn{min-width:70px;padding:6px 10px;font-size:10px}.bbtn .ico{font-size:16px}}
.modal{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.8);display:none;align-items:flex-start;justify-content:center;padding:14px;padding-top:calc(var(--topbar-h) + 14px);padding-bottom:calc(var(--bottombar-h) + 14px);backdrop-filter:blur(8px);overflow-y:auto}
.modal.show{display:flex}
.panel-box{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:auto 0}
.panel-box::-webkit-scrollbar{width:6px}.panel-box::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg-card);backdrop-filter:blur(28px);border-bottom:var(--border-soft);z-index:2}
.phead .ico{font-size:20px}
.phead h2{font-size:13.5px;font-weight:900;color:var(--p1);flex:1}
.phead .close{width:40px;height:40px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.pbody{padding:14px 16px 18px}
.group{margin-bottom:14px;padding:12px;background:rgba(0,0,0,.2);border-radius:12px;border:var(--border-soft)}
.group h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--p1);font-weight:800;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:10px}
.row:last-child{border-bottom:none}
.row .lbl{font-size:12px;font-weight:700;flex:1;min-width:0}
.row .lbl small{display:block;font-size:10px;color:var(--text-mute);font-weight:600;margin-top:2px}
.row input[type=text],.row input[type=password]{padding:8px 10px;background:rgba(0,0,0,.4);border:var(--border-soft);border-radius:8px;font-size:12px;min-width:120px;max-width:60%;outline:none;color:inherit}
.sw{width:46px;height:24px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#7a9bb8;transition:.2s}
.sw.on{background:rgba(0,229,255,.3);border-color:var(--p1)}
.sw.on::after{left:22px;background:var(--p1);box-shadow:0 0 10px var(--p1)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-card{padding:10px 6px;border-radius:12px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.theme-card.active{border-color:var(--p1);box-shadow:var(--glow)}
.theme-card .preview{height:44px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
.theme-card .preview.kosmos{background:radial-gradient(circle at 30% 40%,#ff9028,#0a1a3a 60%,#02040a)}
.theme-card .preview.erde{background:radial-gradient(circle at 40% 40%,#4a8fd8,#1a4a8a 50%,#02040a)}
.theme-card .preview.holo{background:linear-gradient(135deg,#0a1a3a,#1a2a5a);box-shadow:inset 0 0 30px rgba(0,229,255,.3)}
.theme-card .name{font-size:10px;font-weight:800}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.speed-row input[type=range]{flex:1;accent-color:var(--p1);height:6px}
.speed-row .sv{font-size:11px;font-weight:800;color:var(--p1);min-width:50px;text-align:right;font-family:ui-monospace,monospace}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lang-card{padding:9px;border-radius:10px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.lang-card.active{border-color:var(--p1);background:rgba(0,229,255,.12)}
.lang-card .flag{font-size:20px;display:block;margin-bottom:3px}
.lang-card .name{font-size:10.5px;font-weight:800}
.voice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.voice-card{padding:11px 8px;border-radius:11px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center;transition:.15s}
.voice-card:hover{transform:translateY(-2px)}
.voice-card.active{border-color:var(--p1);background:rgba(0,229,255,.15);box-shadow:var(--glow)}
.voice-card .emoji{font-size:28px;display:block;margin-bottom:4px}
.voice-card .n{font-size:11.5px;font-weight:800}
.voice-card .d{font-size:9.5px;color:var(--text-mute);margin-top:2px}
@media(max-width:420px){.voice-grid{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(var(--bottombar-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);padding:10px 18px;background:var(--bg-card);border:var(--border);border-radius:22px;font-size:12px;font-weight:700;color:var(--p1);z-index:500;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);box-shadow:var(--glow)}
#toast.ok{border-color:#22c55e;color:#4ade80}
#toast.err{border-color:#ef4444;color:#ff8080}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:11px;border:var(--border-soft);background:rgba(0,0,0,.3);color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.25));border-color:var(--p1);color:var(--text)}
.card{padding:13px;background:rgba(0,0,0,.2);border-radius:13px;border:var(--border-soft);margin-bottom:10px}
.card h3{font-size:11.5px;font-weight:900;color:var(--p1);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.btn{padding:10px 15px;border-radius:11px;border:none;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.15s;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;box-shadow:0 4px 15px rgba(0,229,255,.3)}
.btn.sec{background:rgba(0,229,255,.1);color:var(--p1);border:var(--border-soft);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn.full{width:100%}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.3);border:var(--border-soft);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.placeholder{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:12px;line-height:1.6}
.placeholder .big{font-size:52px;margin-bottom:12px;opacity:.5}
.msg{max-width:82%;padding:10px 14px;border-radius:15px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;font-weight:600;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(0,229,255,.1);border:var(--border-soft);border-bottom-left-radius:4px}
.chat-quick{display:flex;gap:6px;padding:6px 0 8px;overflow-x:auto;scrollbar-width:none}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{padding:6px 11px;background:rgba(0,229,255,.1);border:var(--border-soft);border-radius:14px;color:var(--text-dim);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chat-input-row{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.chat-input-row textarea{flex:1;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--text);padding:10px 14px;border-radius:20px;font-family:inherit;font-size:13px;outline:none;resize:none;line-height:1.4;min-height:42px;max-height:120px}
.chat-input-row textarea:focus{border-color:var(--p1);box-shadow:0 0 12px rgba(0,229,255,.2)}
.chat-input-row .ibtn{width:42px;height:42px;border-radius:50%;border:var(--border-soft);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,229,255,.1);color:var(--p1)}
.chat-input-row .ibtn.send{background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;border:none}
.chat-input-row .ibtn.mic.on{background:rgba(239,68,68,.25);border-color:#ef4444;color:#ff8080}
.badge-info{padding:8px 10px;background:rgba(0,229,255,.08);border:1px dashed rgba(0,229,255,.3);border-radius:8px;font-size:10.5px;color:var(--text-dim);line-height:1.5;margin-top:6px}
</style>
</head>
<body>

<div id="bgLayer"><canvas id="bgCanvas"></canvas></div>

<header id="topbar">

];

/* ============ ELEVENLABS API ============ */
var ElevenLabs={
  baseUrl:"https://api.elevenlabs.io/v1",
  getKey:function(){return Storage.get("eleven_api","");},
  setKey:function(k){Storage.set("eleven_api",k);},
  hasKey:function(){var k=this.getKey();return k&&k.length>10;},
  /* Text to Speech — direkter Stream als Audio */
  speak:function(text,voiceId,onDone){
    var key=this.getKey();
    if(!key)return Promise.reject(new Error("Kein ElevenLabs Key"));
    if(!voiceId)return Promise.reject(new Error("Keine Voice-ID"));
    var url=this.baseUrl+"/text-to-speech/"+voiceId+"?output_format=mp3_44100_128";
    return fetch(url,{
      method:"POST",
      headers:{"xi-api-key":key,"Content-Type":"application/json","Accept":"audio/mpeg"},
      body:JSON.stringify({
        text:text,
        model_id:"eleven_multilingual_v2",
        voice_settings:{stability:0.5,similarity_boost:0.75,style:0.0,use_speaker_boost:true}
      })
    }).then(function(r){
      if(!r.ok){
        return r.text().then(function(txt){
          throw new Error("ElevenLabs HTTP "+r.status+(txt?" — "+txt.substring(0,100):""));
        });
      }
      return r.blob();
    }).then(function(blob){
      if(!blob||blob.size<100)throw new Error("Leere Audio-Antwort");
      var url2=URL.createObjectURL(blob);
      var audio=new Audio(url2);
      audio.volume=1;
      audio.onended=function(){URL.revokeObjectURL(url2);if(onDone)onDone();};
      audio.onerror=function(){URL.revokeObjectURL(url2);};
      audio.play().catch(function(e){throw new Error("Play-Fehler: "+e.message);});
      return audio;
    });
  }
};

/* ============ VOICE ENGINE ============ */
var Voice={
  _voices:[],
  _currentAudio:null,
  load:function(){
    if(!window.speechSynthesis)return;
    var self=this;
    function grab(){self._voices=speechSynthesis.getVoices()||[];}
    grab();
    speechSynthesis.onvoiceschanged=grab;
  },
  findBestVoice:function(char){
    if(!this._voices.length)return null;
    var lang=char.lang||"de-DE";
    var langPrefix=lang.split("-")[0];
    var matches=this._voices.filter(function(v){return v.lang&&v.lang.indexOf(langPrefix)===0;});
    if(!matches.length)matches=this._voices;
    return matches[0];
  },
  speak:function(text,charId){
    if(!text)return;
    var cid=charId||Settings.get("voiceChar")||"haldo_ai";
    var char=HALDO_VOICES.find(function(v){return v.id===cid;})||HALDO_VOICES[0];

    /* ElevenLabs-Stimme gewählt? */
    if(char.engine==="eleven"&&char.voiceId){
      if(ElevenLabs.hasKey()){
        if(this._currentAudio){try{this._currentAudio.pause();}catch(e){}}
        var self=this;
        ElevenLabs.speak(text,char.voiceId).then(function(audio){
          self._currentAudio=audio;
        }).catch(function(e){
          console.warn("[ElevenLabs] Fallback auf System-TTS:",e.message);
          Voice._systemSpeak(text,char);
        });
        return;
      }
      /* Kein Key → Fallback auf HalDo AI System-Stimme */
      var fallback=HALDO_VOICES[0];
      this._systemSpeak(text,fallback);
      return;
    }
    /* System-TTS */
    this._systemSpeak(text,char);
  },
  _systemSpeak:function(text,char){
    if(!window.speechSynthesis||!text)return;
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.pitch=char.pitch;
      u.rate=char.rate*(Settings.get("ttsRate")||1);
      u.volume=1;
      var lang=Settings.get("lang")||"de";
      var langMap={de:"de-DE",ku:"tr-TR",ez:"tr-TR",ar:"ar-SA",tr:"tr-TR",en:"en-US",fa:"fa-IR",ru:"ru-RU",fr:"fr-FR",es:"es-ES",it:"it-IT",zh:"zh-CN"};
      u.lang=langMap[lang]||"de-DE";
      var best=this.findBestVoice(char);
      if(best)u.voice=best;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  /* Wird global nach Aktionen aufgerufen — nur wenn autoSpeak aktiv */
  auto:function(text){
    if(Settings.get("autoSpeak"))this.speak(text);
  }
};

MODULES.games={render:function(el){
  var tab="ttt";
  function build(){
    if(tab==="ttt")buildTTT();
    else buildSnake();
  }
  function tabsHtml(){return '<div class="tabs">'
    +'<button class="tab'+(tab==="ttt"?" active":"")+'" data-g="ttt">🎯 TicTacToe</button>'
    +'<button class="tab'+(tab==="snake"?" active":"")+'" data-g="snake">🐍 Snake</button>'
    +'</div>';}
  function bindTabs(){
    el.querySelectorAll("[data-g]").forEach(function(b){
      b.addEventListener("click",function(){tab=b.dataset.g;build();});
    });
  }
  function buildTTT(){
    el.innerHTML=tabsHtml()+'<div id="tttBody"></div>';
    bindTabs();
    var board=["","","","","","","","",""],player="X",over=false;
    function draw(){
      var body=el.querySelector("#tttBody");
      body.innerHTML='<div style="text-align:center;margin-bottom:12px;font-size:13px;font-weight:800;color:var(--p1)">'+(over?"Beendet":"Spieler "+player+" dran")+'</div>'
        +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto">'
        +board.map(function(v,i){
          return '<button data-ttt="'+i+'" style="aspect-ratio:1;background:rgba(0,0,0,.3);border:1px solid rgba(0,229,255,.3);border-radius:12px;font-size:34px;font-weight:900;color:'+(v==="X"?"#ff8080":"#4ade80")+';cursor:pointer;font-family:inherit">'+(v||"")+'</button>';
        }).join("")+'</div>'
        +'<button class="btn full" id="ttt_reset" style="margin-top:14px;max-width:260px;display:block;margin-left:auto;margin-right:auto">🔄 Neu</button>';
      body.querySelectorAll("[data-ttt]").forEach(function(b){
        b.addEventListener("click",function(){play(parseInt(b.dataset.ttt));});
      });
      body.querySelector("#ttt_reset").addEventListener("click",function(){
        board=["","","","","","","","",""];player="X";over=false;draw();
      });
    }
    function check(){
      var w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for(var i=0;i<w.length;i++){var x=w[i];if(board[x[0]]&&board[x[0]]===board[x[1]]&&board[x[1]]===board[x[2]])return board[x[0]];}
      return board.indexOf("")<0?"D":null;
    }
    function play(i){
      if(over||board[i])return;
      board[i]=player;
      var r=check();
      if(r){
        over=true;
        var msg=r==="D"?"🤝 Unentschieden":"🎉 Spieler "+r+" gewinnt!";
        toast(msg,r==="D"?"":"ok");
        Voice.auto(msg);
      }else{player=player==="X"?"O":"X";}
      draw();
    }
    draw();
  }
  function buildSnake(){
    el.innerHTML=tabsHtml()+'<div style="text-align:center;padding:40px;color:var(--text-dim)">🐍 Snake kommt bald</div>';
    bindTabs();
  }
  build();
}};

/* ============ SETTINGS ============ */
var Settings={
  _cache:null,
  defaults:{theme:"kosmos",cyborg:false,lang:"de",userName:"Bruder",speed:2,voiceChar:"haldo_ai",autoSpeak:false,ttsRate:0.95},
  load:function(){this._cache=Object.assign({},this.defaults,Storage.get("settings",{}));return this._cache;},
  get:function(k){if(!this._cache)this.load();return this._cache[k];},
  set:function(k,v){if(!this._cache)this.load();this._cache[k]=v;Storage.set("settings",this._cache);this.apply();},
  apply:function(){
    var s=this._cache;
    document.body.classList.toggle("cyborg",!!s.cyborg);
    document.body.setAttribute("dir",(LANGS[s.lang]&&LANGS[s.lang].rtl)?"rtl":"ltr");
    document.documentElement.setAttribute("lang",s.lang);

    document.querySelectorAll("[data-lang]").forEach(function(t){t.classList.toggle("active",t.dataset.lang===s.lang);});

    var csw=$("cyborgSw");if(csw)csw.classList.toggle("on",!!s.cyborg);

    {d:95,speed:0.20,size:3,colors:["#8b8075","#a89b8f","#4a4238"],hasRing:false},

    {d:540,speed:0.018,size:4,colors:["#a080ff","#c0a0ff","#8060d0"],hasRing:false,glow:"rgba(160,128,255,.4)"},
    {d:600,speed:0.014,size:5,colors:["#ff78c8","#ff98d8","#d058a8"],hasRing:false,glow:"rgba(255,120,200,.4)"},
    {d:660,speed:0.010,size:6,colors:["#78ffc8","#98ffd8","#58d8a8"],hasRing:false,glow:"rgba(120,255,200,.4)"}
  ];
  var angles=planets.map(function(_,i){return i*0.5;});
  var t=0,stars=[];
  function initStars(){stars=[];for(var i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random(),size:Math.random()*1.5+0.3,tw:Math.random()*Math.PI*2});}
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  function drawPlanet(x,y,r,pl,angle){
    if(pl.glow){var g=ctx.createRadialGradient(x,y,r*0.5,x,y,r*3);g.addColorStop(0,pl.glow);g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,Math.PI*2);ctx.fill();}
    var grad=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    grad.addColorStop(0,pl.colors[1]||pl.colors[0]);grad.addColorStop(0.5,pl.colors[0]);grad.addColorStop(1,pl.colors[2]||pl.colors[0]);
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    if(pl.hasBands){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.translate(x,y);ctx.rotate(angle*0.5);for(var b=-2;b<=2;b++){ctx.fillStyle=pl.colors[(b+2)%pl.colors.length];ctx.globalAlpha=0.4;ctx.fillRect(-r,b*r*0.35,r*2,r*0.15);}ctx.globalAlpha=1;ctx.restore();}
    if(pl.hasLand){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();var rot=angle*0.7;for(var k=0;k<4;k++){var lx=x+Math.cos(rot+k*1.5)*r*0.5;var ly=y+Math.sin(k*1.2)*r*0.4;ctx.fillStyle="rgba(60,140,80,.7)";ctx.beginPath();ctx.ellipse(lx,ly,r*0.3,r*0.2,rot+k,0,Math.PI*2);ctx.fill();}ctx.restore();}
    if(pl.hasRing){ctx.save();ctx.translate(x,y);ctx.rotate(-0.4);ctx.strokeStyle="rgba(216,180,120,.6)";ctx.lineWidth=r*0.35;ctx.beginPath();ctx.ellipse(0,0,r*1.8,r*0.5,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="rgba(240,216,160,.8)";ctx.lineWidth=r*0.15;ctx.beginPath();ctx.ellipse(0,0,r*1.9,r*0.55,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
    ctx.fillStyle="rgba(255,255,255,.25)";ctx.beginPath();ctx.arc(x-r*0.35,y-r*0.35,r*0.2,0,Math.PI*2);ctx.fill();
  }
  function drawKosmos(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){var s=stars[i],alpha=0.4+Math.sin(t*0.02+s.tw)*0.4;ctx.fillStyle="rgba(180,220,255,"+alpha+")";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();}
    var cx=w/2,cy=h/2,scale=Math.min(1.4,Math.max(0.5,Math.min(w,h)/900)),sunR=65*scale;
    var sunG=ctx.createRadialGradient(cx,cy,0,cx,cy,sunR*2);
    sunG.addColorStop(0,"#fff5d0");sunG.addColorStop(0.15,"#ffc050");sunG.addColorStop(0.5,"rgba(255,140,40,.5)");sunG.addColorStop(1,"transparent");
    ctx.fillStyle=sunG;ctx.beginPath();ctx.arc(cx,cy,sunR*2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ffcc60";ctx.beginPath();ctx.arc(cx,cy,sunR,0,Math.PI*2);ctx.fill();
    for(var p=0;p<planets.length;p++){
      var pl=planets[p],orbitR=pl.d*scale;
      ctx.strokeStyle="rgba(0,229,255,.05)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,orbitR,0,Math.PI*2);ctx.stroke();
      var px=cx+Math.cos(angles[p])*orbitR,py=cy+Math.sin(angles[p])*orbitR;
      drawPlanet(px,py,pl.size*scale*0.85,pl,angles[p]);
      angles[p]+=pl.speed*speedFactor*0.012;
    }
    t+=1;
  }
  function drawErde(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){var s=stars[i];ctx.fillStyle="rgba(180,220,255,.5)";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();}
    var cx=w/2,cy=h/2,R=Math.min(w,h)*0.32;
    var atm=ctx.createRadialGradient(cx,cy,R*0.8,cx,cy,R*1.3);atm.addColorStop(0,"rgba(100,180,255,.4)");atm.addColorStop(1,"transparent");
    ctx.fillStyle=atm;ctx.beginPath();ctx.arc(cx,cy,R*1.3,0,Math.PI*2);ctx.fill();
    var globe=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
    globe.addColorStop(0,"#6fa8dc");globe.addColorStop(0.5,"#2c5f8a");globe.addColorStop(1,"#0a2540");
    ctx.fillStyle=globe;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    var rot=t*0.0004*speedFactor;
    for(var k=0;k<6;k++){var ang=k*(Math.PI*2/6)+rot,dx=Math.cos(ang);if(dx<-0.2)continue;var px=cx+Math.sin(ang)*R*0.7,py=cy+(Math.sin(k*1.7)*0.3)*R,size=R*0.15;ctx.fillStyle="rgba(60,120,60,.7)";ctx.beginPath();ctx.ellipse(px,py,size,size*0.7,0,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle="rgba(100,180,255,.6)";ctx.lineWidth=2;ctx.shadowBlur=30;ctx.shadowColor="#4da8ff";ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    t+=1;
  }
  function drawHolo(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){var s=stars[i],alpha=0.3+Math.sin(t*0.03+i)*0.3;ctx.fillStyle="rgba(0,229,255,"+alpha+")";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size*0.7,0,Math.PI*2);ctx.fill();}
    t+=1;
  }
  function loop(){
    if(theme==="kosmos")drawKosmos();else if(theme==="erde")drawErde();else drawHolo();
    animId=requestAnimationFrame(loop);
  }
  return{
    init:function(){canvas=$("bgCanvas");ctx=canvas.getContext("2d");resize();initStars();window.addEventListener("resize",resize);if(animId)cancelAnimationFrame(animId);loop();},
    setTheme:function(th,spd){theme=th;speedFactor=0.008+(spd-1)*0.018;}
  };
})();

var Chat={
  history:[],
  _el:null,
  responses:{
    "hallo":"Silav, Bruder! 🦚 Wie kann ich helfen?",
    "hi":"Silav! 🦚 Was gibt's?",
    "wie geht es dir":"Mir geht's super! Und dir? 😊",
    "wie geht's":"Alles bestens! Und dir? 😊",

    "eziden":"Die Eziden (Êzidî) sind eine kurdischsprachige Religionsgemeinschaft. Zentrum: Laliş. Pfauengel: Tawûsî Melek. 🦚",
    "ezidi":"Die Eziden sind ein altes Volk mit eigener Religion. Heilige Schrift: Mushaf Reş. 🦚",
    "kurdistan":"Kurdistan ist die Heimat der Kurden — aufgeteilt auf Türkei, Irak, Iran, Syrien. 🟨",
    "kurden":"Die Kurden sind eines der größten Völker ohne eigenen Staat. ~40 Mio. 🟨",
    "danke":"Spas! 🦚",
    "spas":"Bi xêr hatî! 😊"
  },
  open:function(){Windows.open("chat");},
  attach:function(el){
    this._el=el;
    if(!this.history.length)this.history.push({r:"bot",t:"Silav, Bruder! 🦚 Frag mich was!"});
    this.render();
    var self=this;
    el.querySelector("#chatSend").addEventListener("click",function(){self.send(el);});
    el.querySelector("#chatInput").addEventListener("keydown",function(e){
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();self.send(el);}
    });
    el.querySelector("#chatInput").addEventListener("input",function(){
      this.style.height="42px";
      this.style.height=Math.min(120,this.scrollHeight)+"px";
    });
    el.querySelector("#chatMic").addEventListener("click",function(){
      var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){toast("⚠️ Spracherkennung n/a","err");return;}
      var rec=new SR();
      rec.lang={de:"de-DE",ku:"tr-TR",ez:"tr-TR",ar:"ar-SA",tr:"tr-TR",en:"en-US"}[Settings.get("lang")]||"de-DE";
      var btn=this;btn.classList.add("on");
      rec.onresult=function(e){self.send(el,e.results[0][0].transcript);};
      rec.onend=function(){btn.classList.remove("on");};
      rec.onerror=function(){btn.classList.remove("on");};
      rec.start();
    });
    el.querySelectorAll("[data-quick]").forEach(function(b){
      b.addEventListener("click",function(){self.send(el,b.dataset.quick);});
    });
  },
  addBot:function(t){
    this.history.push({r:"bot",t:t});
    this.render();
    Voice.auto(t);
  },
  addUser:function(t){this.history.push({r:"user",t:t});this.render();},
  render:function(){
    var el=this._el?this._el.querySelector("#chatBody"):null;
    if(!el)return;
    el.innerHTML=this.history.map(function(m){
      return '<div class="msg '+(m.r==="user"?"user":"bot")+'">'+esc(m.t)+'</div>';
    }).join("");
    setTimeout(function(){el.scrollTop=el.scrollHeight;},50);
  },
  respond:function(msg){
    var q=msg.toLowerCase().trim();
    for(var k in this.responses){if(q.indexOf(k)>=0)return this.responses[k];}
    var m=q.match(/^(übersetze|translate)\s+(.+)/);
    if(m){
      var word=m[2].replace(/[?.!]/g,"").trim();
      for(var k2 in I18N_DATA){
        if(k2===word||I18N_DATA[k2].de===word){
          return word+" auf Ezidi: 🦚 "+I18N_DATA[k2].ez+"\nAuf Kurdisch: 🟨 "+I18N_DATA[k2].ku+"\nAuf Arabisch: 🇸🇦 "+I18N_DATA[k2].ar;
        }
      }
      return "Das Wort kenne ich nicht. Versuch: „übersetze wasser\"";
    }
    var defaults=[
      "Interessant, Bruder! 🦚 Erzähl mehr.",
      "Gute Frage! Was genau willst du wissen?",
      "Verstehe. Frag mich über Ezidi, Länder oder Sprachen!",
      "Klick links auf eine App — da gibt's mehr! 💙",
      "Hmm, das weiß ich noch nicht. Aber ich lerne jeden Tag! 🚀"
    ];
    return defaults[Math.floor(Math.random()*defaults.length)];
  },
  send:function(el,text){
    if(!el)el=this._el;
    if(!el)return;
    var t=(text||el.querySelector("#chatInput").value||"").trim();
    if(!t)return;
    el.querySelector("#chatInput").value="";
    el.querySelector("#chatInput").style.height="42px";
    this.addUser(t);
    var self=this;
    setTimeout(function(){self.addBot(self.respond(t));},400);
  }
};

/* ============ WINDOWS ============ */
var Windows={
  zIndexBase:100,
  openCount:0,
  open:function(appId){
    var app=APPS.find(function(a){return a.id===appId;});
    if(!app)return;
    var existing=document.querySelector('.window[data-app="'+appId+'"]');
    if(existing){this.focus(existing);return;}
    var desktop=$("desktop");
    var dRect=desktop.getBoundingClientRect();
    var isMobile=window.innerWidth<600;
    var ww,wh;
    if(isMobile){ww=dRect.width-8;wh=dRect.height-8;}
    else{ww=Math.min(dRect.width-40,560);wh=Math.min(dRect.height-40,620);}
    var offset=(this.openCount%6)*22;
    var cx=Math.max(8,(dRect.width-ww)/2+offset-40);
    var cy=Math.max(8,(dRect.height-wh)/2+offset-40);
    if(cx+ww>dRect.width-8)cx=dRect.width-ww-8;
    if(cy+wh>dRect.height-8)cy=dRect.height-wh-8;
    var win=document.createElement("div");
    win.className="window focused";
    win.dataset.app=appId;
    win.style.width=ww+"px";win.style.height=wh+"px";
    win.style.left=cx+"px";win.style.top=cy+"px";
    win.style.zIndex=++this.zIndexBase;
    this.openCount++;
    win.innerHTML='<div class="titlebar"><span class="ico">'+app.ico+'</span><span class="title">'+esc(app.name)+'</span>'
      +'<div class="wbtns">'
      +'<button class="wbtn voice" data-wbtn="voice" title="Stimme">🔊</button>'
      +'<button class="wbtn set" data-wbtn="settings" title="App-Einstellungen">⚙️</button>'
      +'<button class="wbtn max" data-wbtn="max" title="Maximieren">□</button>'
      +'<button class="wbtn" data-wbtn="min" title="Minimieren">—</button>'
      +'<button class="wbtn close" data-wbtn="close" title="Schließen">✕</button>'
      +'</div></div>'
      +'<div class="wbody"></div><div class="resizer"></div>';
    desktop.appendChild(win);
    var body=win.querySelector(".wbody");
    try{getModule(appId).render(body,app);}catch(e){body.innerHTML='<div class="placeholder">❌ '+esc(e.message)+'</div>';}
    this.bindWindow(win);
    AppSettings.applyToWindow(appId);
    return win;
  },
  bindWindow:function(win){
    var self=this;
    var desktop=$("desktop");
    win.addEventListener("mousedown",function(){self.focus(win);});
    win.addEventListener("touchstart",function(){self.focus(win);},{passive:true});
    win.querySelectorAll("[data-wbtn]").forEach(function(b){
      b.addEventListener("click",function(e){
        e.stopPropagation();
        var a=b.dataset.wbtn;
        if(a==="close")self.close(win);
        else if(a==="min")self.minimize(win);
        else if(a==="max")self.maximize(win);
        else if(a==="settings")AppSettings.open(win.dataset.app);
        else if(a==="voice"){renderVoicePanel();$("voicePanel").classList.add("show");}
      });
    });
    var tb=win.querySelector(".titlebar");
    var dragging=false,sx=0,sy=0,ox=0,oy=0;
    function startDrag(e){
      if(e.target.closest(".wbtn"))return;
      dragging=true;
      var p=e.touches?e.touches[0]:e;
      sx=p.clientX;sy=p.clientY;
      var wRect=win.getBoundingClientRect();
      var dRect=desktop.getBoundingClientRect();
      ox=wRect.left-dRect.left;oy=wRect.top-dRect.top;
      win.style.left=ox+"px";win.style.top=oy+"px";
      self.focus(win);e.preventDefault();
    }
    function moveDrag(e){
      if(!dragging)return;
      var p=e.touches?e.touches[0]:e;
      var dx=p.clientX-sx,dy=p.clientY-sy;
      var dRect=desktop.getBoundingClientRect();
      var ww=win.offsetWidth,wh=win.offsetHeight;
      win.style.left=Math.max(-ww*0.4,Math.min(dRect.width-ww*0.6,ox+dx))+"px";
      win.style.top=Math.max(-10,Math.min(dRect.height-50,oy+dy))+"px";
    }
    function endDrag(){dragging=false;}
    tb.addEventListener("mousedown",startDrag);
    tb.addEventListener("touchstart",startDrag,{passive:false});
    document.addEventListener("mousemove",moveDrag);
    document.addEventListener("touchmove",moveDrag,{passive:false});
    document.addEventListener("mouseup",endDrag);
    document.addEventListener("touchend",endDrag);
    var rs=win.querySelector(".resizer");
    if(rs){
      var resizing=false,rsx=0,rsy=0,rw=0,rh=0;
      function startResize(e){
        resizing=true;
        var p=e.touches?e.touches[0]:e;
        rsx=p.clientX;rsy=p.clientY;
        rw=win.offsetWidth;rh=win.offsetHeight;
        e.preventDefault();
      }
      function moveResize(e){
        if(!resizing)return;
        var p=e.touches?e.touches[0]:e;
        var dRect=desktop.getBoundingClientRect();
        var wRect=win.getBoundingClientRect();
        win.style.width=Math.max(260,Math.min(dRect.width-(wRect.left-dRect.left)+8,rw+(p.clientX-rsx)))+"px";
        win.style.height=Math.max(200,Math.min(dRect.height-(wRect.top-dRect.top)+8,rh+(p.clientY-rsy)))+"px";
      }
      function endResize(){resizing=false;}
      rs.addEventListener("mousedown",startResize);
      rs.addEventListener("touchstart",startResize,{passive:false});
      document.addEventListener("mousemove",moveResize);
      document.addEventListener("touchmove",moveResize,{passive:false});
      document.addEventListener("mouseup",endResize);
      document.addEventListener("touchend",endResize);
    }
  },
  focus:function(win){
    document.querySelectorAll(".window").forEach(function(w){w.classList.remove("focused");});
    win.classList.add("focused");win.classList.remove("minimized");
    win.style.zIndex=++this.zIndexBase;
  },
  minimize:function(win){win.classList.add("minimized");},
  maximize:function(win){win.classList.toggle("maximized");},
  close:function(win){win.remove();}
};

/* ============ HOMESCREEN ============ */
var HomeState={
  search:"",cat:"all",
  collapsed:Storage.get("home_collapsed",{}),
  order:Storage.get("home_order",[]),
  favs:Storage.get("home_favs",[])
};

function renderApps(){
  var c=$("appCategories");if(!c)return;
  var list=APPS.slice();
  if(HomeState.search){
    var q=HomeState.search.toLowerCase();
    list=list.filter(function(a){return a.name.toLowerCase().indexOf(q)>=0||a.cat.toLowerCase().indexOf(q)>=0||a.desc.toLowerCase().indexOf(q)>=0;});
  }
  if(HomeState.cat!=="all"&&HomeState.cat!=="favs")list=list.filter(function(a){return a.cat===HomeState.cat;});
  if(HomeState.cat==="favs")list=list.filter(function(a){return HomeState.favs.indexOf(a.id)>=0;});
  list.sort(function(a,b){
    var ai=HomeState.order.indexOf(a.id),bi=HomeState.order.indexOf(b.id);
    if(ai<0&&bi<0)return a.name.localeCompare(b.name);
    if(ai<0)return 1;if(bi<0)return -1;
    return ai-bi;
  });
  if(!list.length){c.innerHTML='<div class="placeholder">Keine Apps gefunden.</div>';return;}
  var byCat={};
  list.forEach(function(a){if(!byCat[a.cat])byCat[a.cat]=[];byCat[a.cat].push(a);});
  var cats=Object.keys(byCat).sort();
  c.innerHTML=cats.map(function(cat){
    var apps=byCat[cat],collapsed=HomeState.collapsed[cat]?" collapsed":"";
    return '<div class="cat-section"><div class="cat-title">'+esc(cat)+'<span class="count">'+apps.length+'</span>'
      +'<span class="toggle" data-toggle-cat="'+cat+'">'+(HomeState.collapsed[cat]?"▶":"▼")+'</span></div>'
      +'<div class="app-grid'+collapsed+'">'
      +apps.map(function(a){
        var isFav=HomeState.favs.indexOf(a.id)>=0;
        return '<div class="tile'+(isFav?" starred":"")+'" data-tile-id="'+a.id+'" draggable="true">'
          +'<span class="drag-handle">⋮⋮</span>'
          +'<span class="star" data-star="'+a.id+'">'+(isFav?"⭐":"☆")+'</span>'
          +'<span class="ico">'+a.ico+'</span>'
          +'<span class="name">'+esc(a.name)+'</span>'
          +'<span class="cat">'+esc(a.cat)+'</span>'
          +'</div>';
      }).join("")
      +'</div></div>';
  }).join("");
  bindTiles();
  bindCatToggles();
}
function bindCatToggles(){
  document.querySelectorAll("[data-toggle-cat]").forEach(function(t){
    t.addEventListener("click",function(e){
      e.stopPropagation();
      var cat=t.dataset.toggleCat;
      HomeState.collapsed[cat]=!HomeState.collapsed[cat];
      Storage.set("home_collapsed",HomeState.collapsed);
      renderApps();
    });
  });
}
function bindTiles(){
  document.querySelectorAll("[data-tile-id]").forEach(function(tile){
    tile.addEventListener("click",function(e){
      if(e.target.closest("[data-star]"))return;
      Windows.open(tile.dataset.tileId);
      if(window.innerWidth<700)$("sidebar").classList.remove("open");
    });
    var star=tile.querySelector("[data-star]");
    if(star)star.addEventListener("click",function(e){
      e.stopPropagation();
      var id=star.dataset.star;
      var idx=HomeState.favs.indexOf(id);
      if(idx>=0)HomeState.favs.splice(idx,1);else HomeState.favs.push(id);
      Storage.set("home_favs",HomeState.favs);
      renderApps();
    });
    tile.addEventListener("dragstart",function(e){
      e.dataTransfer.setData("text/plain",tile.dataset.tileId);
      tile.classList.add("dragging");
    });
    tile.addEventListener("dragend",function(){
      tile.classList.remove("dragging");
      document.querySelectorAll(".tile").forEach(function(t){t.classList.remove("drag-over");});
    });
    tile.addEventListener("dragover",function(e){e.preventDefault();tile.classList.add("drag-over");});
    tile.addEventListener("dragleave",function(){tile.classList.remove("drag-over");});
    tile.addEventListener("drop",function(e){
      e.preventDefault();
      tile.classList.remove("drag-over");
      var fromId=e.dataTransfer.getData("text/plain"),toId=tile.dataset.tileId;
      if(fromId===toId)return;
      var all=APPS.map(function(a){return a.id;});
      if(!HomeState.order.length)HomeState.order=all.slice();
      var fromIdx=HomeState.order.indexOf(fromId);
      if(fromIdx<0)HomeState.order.push(fromId);
      fromIdx=HomeState.order.indexOf(fromId);
      var toIdx=HomeState.order.indexOf(toId);
      HomeState.order.splice(fromIdx,1);
      HomeState.order.splice(toIdx,0,fromId);
      Storage.set("home_order",HomeState.order);
      renderApps();
    });
  });
}
function renderFilters(){
  var cats={};

/* ══════════════ WELT-APP MODUL ══════════════ */
var WeltApp={
  _tab:"countries",
  _search:"",
  _selectedCountry:null,
  _weatherCache:{},
  _weatherCity:"Berlin",
  _weatherData:null,
  _currencyFrom:"EUR",
  _currencyTo:"USD",
  _currencyAmount:100,
  _currencyData:null,
  _clockInterval:null,
  _favCities:Storage.get("welt_favs",["Berlin","Stenbol","Hewlêr","Nû York"]),

  render:function(el){
    var self=this;
    var tabs=[
      {k:"countries",i:"🌍",n:"Länder"},
      {k:"cities",i:"🏙️",n:"Städte"},
      {k:"weather",i:"🌤️",n:"Wetter"},
      {k:"clock",i:"🕐",n:"Weltzeiten"},
      {k:"currency",i:"💱",n:"Währung"}
    ];
    var tabsHtml=tabs.map(function(t){
      return '<button class="tab'+(self._tab===t.k?" active":"")+'" data-welt-tab="'+t.k+'">'+t.i+' '+t.n+'</button>';
    }).join("");
    el.innerHTML='<div class="tabs">'+tabsHtml+'</div><div id="weltBody"></div>';
    el.querySelectorAll("[data-welt-tab]").forEach(function(b){
      b.addEventListener("click",function(){
        self._tab=b.dataset.weltTab;
        self.render(el);
      });
    });
    this.renderTab(el);

    /* Interval für Uhr */
    if(this._clockInterval)clearInterval(this._clockInterval);
    if(this._tab==="clock"){
      this._clockInterval=setInterval(function(){self.tickClocks();},1000);
    }
  },

  renderTab:function(el){
    var body=el.querySelector("#weltBody");
    if(!body)return;
    if(this._tab==="countries")this.renderCountries(body);
    else if(this._tab==="cities")this.renderCities(body);
    else if(this._tab==="weather")this.renderWeather(body);
    else if(this._tab==="clock")this.renderClock(body);
    else if(this._tab==="currency")this.renderCurrency(body);
  },

  /* ═══ Länder ═══ */
  renderCountries:function(body){
    var self=this;
    var q=this._search.toLowerCase();
    var list=COUNTRIES.filter(function(c){
      return !q||c.de.toLowerCase().indexOf(q)>=0||c.ku.toLowerCase().indexOf(q)>=0||c.cont.toLowerCase().indexOf(q)>=0;
    });
    var byCont={};
    list.forEach(function(c){
      if(!byCont[c.cont])byCont[c.cont]=[];
      byCont[c.cont].push(c);
    });
    body.innerHTML='<div class="field"><input type="text" id="weltSearch" placeholder="🔍 Land suchen (DE / KU)…" value="'+esc(this._search)+'"></div>'
      +'<div style="font-size:10px;color:var(--text-mute);margin-bottom:8px">'+list.length+' Länder · 🟨 = Kurdische Namen</div>'
      +Object.keys(byCont).map(function(cont){
        return '<div style="margin-bottom:14px"><div style="font-size:11px;font-weight:900;color:var(--p1);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">📍 '+esc(cont)+' ('+byCont[cont].length+')</div>'
          +byCont[cont].map(function(c){
            return '<div data-country-id="'+esc(c.de)+'" style="padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px;cursor:pointer;display:flex;gap:10px;align-items:center">'
              +'<div style="font-size:28px">'+c.flag+'</div>'
              +'<div style="flex:1;min-width:0">'
              +'<div style="font-size:13px;font-weight:800">'+esc(c.de)+'</div>'
              +'<div style="font-size:11px;color:#c084fc;font-weight:700;margin-top:2px">🟨 '+esc(c.ku)+'</div>'
              +'<div style="font-size:10px;color:var(--text-mute);margin-top:2px">🏛️ '+esc(c.cap)+' · 👥 '+(c.pop/1000000).toFixed(1)+'M</div>'
              +'</div>'
              +'<div style="font-size:18px;color:var(--text-mute)">›</div></div>';
          }).join("")
          +'</div>';
      }).join("");
    var search=$("weltSearch");
    if(search)search.addEventListener("input",function(){
      self._search=this.value;
      self.renderTab(body.parentElement);
    });
    body.querySelectorAll("[data-country-id]").forEach(function(b){
      b.addEventListener("click",function(){
        var c=COUNTRIES.find(function(x){return x.de===b.dataset.countryId;});
        if(c)self.showCountry(c);
      });
    });
  },

  showCountry:function(c){
    var flagMap={};
    var html='<div style="position:fixed;inset:0;background:rgba(2,4,10,.85);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:14px;padding-top:80px;overflow-y:auto" id="weltCountryModal">'
      +'<div style="width:100%;max-width:520px;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);padding:18px">'
      +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'
      +'<div style="font-size:48px">'+c.flag+'</div>'
      +'<div style="flex:1"><div style="font-size:17px;font-weight:900;color:var(--p1)">'+esc(c.de)+'</div>'
      +'<div style="font-size:13px;color:#c084fc;font-weight:700;margin-top:2px">🟨 '+esc(c.ku)+'</div></div>'
      +'<button id="weltCountryClose" style="width:38px;height:38px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:15px">✕</button>'
      +'</div>'
      +'<div style="display:grid;gap:6px;font-size:12px">'
      +this.detailRow("🏛️ Hauptstadt", c.cap+" (🟨 "+c.capKu+")")
      +this.detailRow("👥 Bevölkerung", (c.pop/1000000).toFixed(1)+" Mio.")
      +this.detailRow("📐 Fläche", c.area.toLocaleString("de-DE")+" km²")
      +this.detailRow("🗣️ Sprache", c.lang)
      +this.detailRow("💰 Währung", c.curr)
      +this.detailRow("🌍 Kontinent", c.cont)
      +this.detailRow("🕐 Zeitzone", c.tz)
      +this.detailRow("📍 Koordinaten", c.lat.toFixed(2)+"° N, "+c.lng.toFixed(2)+"° E")
      +'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px">'
      +'<button class="btn sec" data-action="speak">🔊 Vorlesen</button>'
      +'<button class="btn sec" data-action="weather">🌤️ Wetter</button>'
      +'<button class="btn sec" data-action="clock">🕐 Zeit</button>'
      +'<button class="btn sec" data-action="map">🗺️ Karte</button>'
      +'</div>'
      +'</div></div>';
    var div=document.createElement("div");
    div.innerHTML=html;
    document.body.appendChild(div.firstChild);
    var modal=$("weltCountryModal");
    $("weltCountryClose").addEventListener("click",function(){modal.remove();});
    modal.addEventListener("click",function(e){if(e.target===modal)modal.remove();});
    modal.querySelectorAll("[data-action]").forEach(function(b){
      b.addEventListener("click",function(){
        var a=b.dataset.action;
        if(a==="speak"){
          Voice.speak(c.de+". Kurdisch: "+c.ku+". Hauptstadt: "+c.cap+". Bevölkerung: "+(c.pop/1000000).toFixed(1)+" Millionen.");
        }else if(a==="weather"){
          modal.remove();
          WeltApp._weatherCity=c.cap;
          WeltApp._tab="weather";
          var el=document.querySelector(".window[data-app='welt'] .wbody");
          if(el)WeltApp.render(el);
        }else if(a==="clock"){
          modal.remove();
          WeltApp._tab="clock";
          var el2=document.querySelector(".window[data-app='welt'] .wbody");
          if(el2)WeltApp.render(el2);
        }else if(a==="map"){
          window.open("https://www.google.com/maps/search/"+encodeURIComponent(c.de)," _blank");
        }
      });
    });
  },

  detailRow:function(k,v){
    return '<div style="display:flex;justify-content:space-between;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px">'
      +'<span style="color:var(--text-dim);font-weight:700">'+k+'</span>'
      +'<span style="color:var(--text);font-weight:700;text-align:right;max-width:60%">'+esc(v)+'</span></div>';
  },

  /* ═══ Städte ═══ */
  renderCities:function(body){
    var self=this;
    var q=this._search.toLowerCase();
    var list=CITIES.filter(function(c){
      return !q||c.de.toLowerCase().indexOf(q)>=0||c.ku.toLowerCase().indexOf(q)>=0||c.country.toLowerCase().indexOf(q)>=0;
    });
    body.innerHTML='<div class="field"><input type="text" id="weltSearch" placeholder="🔍 Stadt suchen…" value="'+esc(this._search)+'"></div>'
      +'<div style="font-size:10px;color:var(--text-mute);margin-bottom:8px">'+list.length+' Städte</div>'
      +list.map(function(c){
        return '<div data-city-id="'+esc(c.de)+'" style="padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px;cursor:pointer;display:flex;gap:10px;align-items:center">'
          +'<div style="font-size:24px">'+c.flag+'</div>'
          +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:13px;font-weight:800">'+esc(c.de)+'</div>'
          +'<div style="font-size:11px;color:#c084fc;font-weight:700;margin-top:2px">🟨 '+esc(c.ku)+'</div>'
          +'<div style="font-size:10px;color:var(--text-mute);margin-top:2px">📍 '+esc(c.country)+' · '+c.lat.toFixed(2)+', '+c.lng.toFixed(2)+'</div>'
          +'</div>'
          +'<button class="btn sec" style="padding:6px 10px;font-size:10px" data-fav="'+esc(c.de)+'">'+(self._favCities.indexOf(c.de)>=0?"⭐":"☆")+'</button>'
          +'</div>';
      }).join("");
    var search=$("weltSearch");
    if(search)search.addEventListener("input",function(){
      self._search=this.value;
      self.renderTab(body.parentElement);
    });
    body.querySelectorAll("[data-city-id]").forEach(function(b){
      b.addEventListener("click",function(e){
        if(e.target.dataset.fav)return;
        var c=CITIES.find(function(x){return x.de===b.dataset.cityId;});
        if(c)self.showCity(c);
      });
    });
    body.querySelectorAll("[data-fav]").forEach(function(b){
      b.addEventListener("click",function(e){
        e.stopPropagation();
        var id=b.dataset.fav;
        var idx=self._favCities.indexOf(id);
        if(idx>=0)self._favCities.splice(idx,1);
        else self._favCities.push(id);

  loadWeather:function(city,cb){
    var self=this;
    var url="https://api.open-meteo.com/v1/forecast?latitude="+city.lat+"&longitude="+city.lng+"&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&timezone=auto";
    fetch(url).then(function(r){return r.json();}).then(function(d){
      if(!d.current){cb(null);return;}
      var code=d.current.weather_code;
      var icon="🌤️";
      if(code===0)icon="☀️";else if(code<=3)icon="⛅";else if(code<=48)icon="🌫️";
      else if(code<=67)icon="🌧️";else if(code<=77)icon="❄️";else if(code<=82)icon="🌧️";
      else if(code<=86)icon="❄️";else icon="⛈️";
      var desc="Unbekannt";
      if(code===0)desc="Klarer Himmel";else if(code<=3)desc="Teilweise bewölkt";
      else if(code<=48)desc="Neblig";else if(code<=67)desc="Regnerisch";
      else if(code<=77)desc="Schnee";else if(code<=82)desc="Schauer";
      else if(code<=86)desc="Schneeschauer";else desc="Gewitter";
      var data={temp:Math.round(d.current.temperature_2m),icon:icon,desc:desc,wind:Math.round(d.current.wind_speed_10m),humidity:d.current.relative_humidity_2m};
      self._weatherCache["w_"+city.de]=data;
      cb(data);
    }).catch(function(){cb(null);});
  },

  /* ═══ Wetter-Tab ═══ */
  renderWeather:function(body){

      +'</select></div>'
      +'<div id="weltWeatherCard" style="padding:20px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(180,120,255,.1));border-radius:14px;text-align:center;margin-bottom:10px;min-height:140px">'
      +(cached?'<div style="font-size:60px">'+cached.icon+'</div><div style="font-size:48px;font-weight:900;color:var(--p1)">'+cached.temp+'°C</div><div style="font-size:14px;color:var(--text-dim);text-transform:capitalize;margin-top:4px">'+esc(cached.desc)+'</div><div style="font-size:11px;color:var(--text-mute);margin-top:8px">💨 '+cached.wind+' km/h · 💧 '+cached.humidity+'%</div>':'<div style="color:var(--text-mute);padding:40px">⏳ Lade Wetter…</div>')

      +'<button class="btn sec" id="weltWeatherSpeak" style="flex:1">🔊 Vorlesen</button>'
      +'<button class="btn sec" id="weltWeatherMap" style="flex:1">🗺️ Karte</button>'
      +'</div>'
      +'<div style="font-size:11px;color:var(--text-mute);line-height:1.5;padding:10px;background:rgba(0,0,0,.2);border-radius:8px">'
      +'💡 Wetter von <b>Open-Meteo</b> (kostenlos, kein Key). Koordinaten: '+city.lat.toFixed(2)+', '+city.lng.toFixed(2)+' · Zeitzone: '+esc(city.tz)

    });

      delete self._weatherCache["w_"+city.de];

    });

      var d=self._weatherCache["w_"+city.de];
      if(!d)return;
      Voice.speak("Wetter in "+city.de+": "+d.desc+", "+d.temp+" Grad Celsius, Wind "+d.wind+" Kilometer pro Stunde");
    });
    var mp=$("weltWeatherMap");
    if(mp)mp.addEventListener("click",function(){
      window.open("https://www.google.com/maps?q="+city.lat+","+city.lng,"_blank");
    });
    /* Laden */
    this.loadWeather(city,function(data){
      var card=$("weltWeatherCard");
      if(!card)return;
      if(!data){card.innerHTML='<div style="color:#ff8080;padding:20px">❌ Fehler beim Laden. Kein Internet?</div>';return;}
      card.innerHTML='<div style="font-size:60px">'+data.icon+'</div><div style="font-size:48px;font-weight:900;color:var(--p1)">'+data.temp+'°C</div><div style="font-size:14px;color:var(--text-dim);text-transform:capitalize;margin-top:4px">'+esc(data.desc)+'</div><div style="font-size:11px;color:var(--text-mute);margin-top:8px">💨 '+data.wind+' km/h · 💧 '+data.humidity+'%</div>';
    });
  },

  /* ═══ Weltzeiten ═══ */
  renderClock:function(body){
    var self=this;
    var favs=this._favCities.map(function(id){
      return CITIES.find(function(c){return c.de===id;})||null;
    }).filter(Boolean);
    body.innerHTML='<div style="font-size:10px;color:var(--text-mute);margin-bottom:8px">Live-Weltzeiten deiner Favoriten (⭐ in Städte-Tab)</div>'
      +(favs.length?favs.map(function(c){
        return '<div style="padding:14px;background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(180,120,255,.08));border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px">'
          +'<div style="font-size:32px">'+c.flag+'</div>'
          +'<div style="flex:1;min-width:0">'
          +'<div style="font-size:14px;font-weight:800">'+esc(c.de)+'</div>'
          +'<div style="font-size:11px;color:#c084fc;font-weight:700">🟨 '+esc(c.ku)+'</div>'
          +'<div style="font-size:10px;color:var(--text-mute);margin-top:2px">'+esc(c.tz)+'</div>'
          +'</div>'
          +'<div style="text-align:right">'
          +'<div data-clock-city="'+esc(c.de)+'" style="font-size:24px;font-weight:900;color:var(--p1);font-family:ui-monospace,monospace">--:--:--</div>'
          +'<div data-clock-day="'+esc(c.de)+'" style="font-size:10px;color:var(--text-mute);margin-top:2px">—</div>'
          +'</div>'
          +'</div>';
      }).join(""):'<div style="padding:40px;text-align:center;color:var(--text-mute)">Keine Favoriten.<br>Gehe zu <b>Städte</b> und markiere mit ⭐</div>')
      +'<div style="font-size:10px;color:var(--text-mute);margin-top:14px;text-align:center">🕐 '+new Date().toLocaleString("de-DE")+'</div>';

  tickClocks:function(){
    var now=new Date();
    document.querySelectorAll("[data-clock-city]").forEach(function(el){

  /* ═══ Währung ═══ */
  renderCurrency:function(body){
    var self=this;
    var currencies=["EUR","USD","TRY","GBP","CHF","JPY","CNY","RUB","INR","SAR","AED","IQD","IRR","CAD","AUD"];
    var symbols={EUR:"€",USD:"$",TRY:"₺",GBP:"£",CHF:"Fr",JPY:"¥",CNY:"¥",RUB:"₽",INR:"₹",SAR:"﷼",AED:"د.إ",IQD:"ع.د",IRR:"﷼",CAD:"C$",AUD:"A$"};
    body.innerHTML='<div class="field"><label>Betrag</label><input type="number" id="weltCurrAmt" value="'+this._currencyAmount+'" step="1" inputmode="decimal"></div>'
      +'<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-bottom:12px">'
      +'<div class="field" style="margin:0"><label>Von</label><select id="weltCurrFrom">'+currencies.map(function(c){return '<option value="'+c+'"'+(self._currencyFrom===c?" selected":"")+'>'+c+' '+(symbols[c]||"")+'</option>';}).join("")+'</select></div>'
      +'<button class="btn sec" id="weltCurrSwap" style="height:42px;padding:0 12px">⇄</button>'
      +'<div class="field" style="margin:0"><label>Nach</label><select id="weltCurrTo">'+currencies.map(function(c){return '<option value="'+c+'"'+(self._currencyTo===c?" selected":"")+'>'+c+' '+(symbols[c]||"")+'</option>';}).join("")+'</select></div>'
      +'</div>'
      +'<div id="weltCurrResult" style="padding:20px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(180,120,255,.1));border-radius:14px;text-align:center;margin-bottom:10px;min-height:100px">'
      +'<div style="color:var(--text-mute);padding:30px">⏳ Lade Kurs…</div>'
      +'</div>'
      +'<button class="btn sec full" id="weltCurrReload">🔄 Kurs aktualisieren</button>'
      +'<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px" id="weltCurrQuick"></div>'
      +'<div style="font-size:10px;color:var(--text-mute);margin-top:10px;text-align:center;padding:8px;background:rgba(0,0,0,.2);border-radius:8px">💱 Live-Kurse von <b>Frankfurter API</b> (kostenlos, kein Key)</div>';

    var amtInput=$("weltCurrAmt");
    if(amtInput)amtInput.addEventListener("input",function(){self._currencyAmount=parseFloat(this.value)||0;self.loadCurrency();});
    var fromSel=$("weltCurrFrom");
    if(fromSel)fromSel.addEventListener("change",function(){self._currencyFrom=this.value;self.loadCurrency();});
    var toSel=$("weltCurrTo");
    if(toSel)toSel.addEventListener("change",function(){self._currencyTo=this.value;self.loadCurrency();});
    var swap=$("weltCurrSwap");
    if(swap)swap.addEventListener("click",function(){var t=self._currencyFrom;self._currencyFrom=self._currencyTo;self._currencyTo=t;self.renderTab(body.parentElement);});
    var reload=$("weltCurrReload");
    if(reload)reload.addEventListener("click",function(){self._currencyData=null;self.loadCurrency();});

    /* Quick-Choices */
    var quick=$("weltCurrQuick");
    if(quick){
      var quickPairs=[["EUR","USD"],["EUR","TRY"],["USD","EUR"],["EUR","GBP"],["EUR","IQD"],["TRY","EUR"]];
      quick.innerHTML=quickPairs.map(function(p){
        return '<button class="btn sec" data-pair="'+p[0]+'-'+p[1]+'">'+p[0]+' → '+p[1]+'</button>';
      }).join("");
      quick.querySelectorAll("[data-pair]").forEach(function(b){
        b.addEventListener("click",function(){
          var parts=b.dataset.pair.split("-");
          self._currencyFrom=parts[0];self._currencyTo=parts[1];
          self.renderTab(body.parentElement);
        });
      });
    }

    this.loadCurrency();
  },

  loadCurrency:function(){
    var self=this;
    var from=this._currencyFrom,to=this._currencyTo,amt=this._currencyAmount;
    var result=$("weltCurrResult");
    if(!result)return;
    var url="https://api.frankfurter.app/latest?from="+from+"&to="+to;
    fetch(url).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(d){
      if(!d.rates||!d.rates[to])throw new Error("Kein Kurs");
      var rate=d.rates[to];
      self._currencyData={rate:rate,date:d.date};
      var converted=amt*rate;
      var symbols={EUR:"€",USD:"$",TRY:"₺",GBP:"£",CHF:"Fr",JPY:"¥",CNY:"¥",RUB:"₽",INR:"₹",SAR:"﷼",AED:"د.إ",IQD:"ع.د",IRR:"﷼",CAD:"C$",AUD:"A$"};
      result.innerHTML='<div style="font-size:12px;color:var(--text-dim)">'+amt.toFixed(2)+' '+from+' '+symbols[from]+'</div>'
        +'<div style="font-size:36px;font-weight:900;color:var(--p1);margin:6px 0">'+converted.toFixed(2)+' '+symbols[to]+'</div>'
        +'<div style="font-size:11px;color:var(--text-mute)">1 '+from+' = '+rate.toFixed(4)+' '+to+' · '+d.date+'</div>';
    }).catch(function(e){
      /* Fallback: USD als Basis */
      fetch("https://api.frankfurter.app/latest?from=USD&to="+to).then(function(r){return r.json();}).then(function(d2){
        if(d2.rates&&d2.rates[to]){
          var rateUSD=d2.rates[to];
          var converted=amt*(rateUSD/Math.max(0.01,rateUSD));
          result.innerHTML='<div style="color:#fbbf24;padding:20px;font-size:12px">⚠️ '+e.message+'.<br>Versuch mit einer anderen Währung.</div>';
        }else throw new Error("Keine Kurs-Daten");
      }).catch(function(e2){
        result.innerHTML='<div style="color:#ff8080;padding:20px;font-size:12px">❌ Fehler: '+esc(e.message)+'<br><br>Mögliche Ursache: Kein Internet oder zu viele Anfragen.</div>';
      });
    });
  }
};
