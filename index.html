<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05080f">
<title>HalDo AI OS Pro Max</title>
<style>
:root{
  --primary:#00e5ff;--secondary:#4da8ff;--accent:#b478ff;
  --glow:rgba(0,229,255,.5);
  --bg1:#04060c;--bg2:#080f1e;
  --glass:rgba(10,25,45,.55);
  --border:rgba(0,229,255,.4);--gold:#ffd700;
  --text:#e8f4ff;--muted:#8fb3d9;
  --font-scale:1;--blur:24px;--glow-str:1;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:calc(14px * var(--font-scale));
  background:radial-gradient(ellipse at 50% 30%,var(--bg2) 0%,var(--bg1) 70%);
  color:var(--text);padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;font-size:calc(14px * var(--font-scale))}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;opacity:.5}

/* ══════════ COSMOS ══════════ */
#cosmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#cosmos.hide-stars .star{display:none}
#cosmos.hide-sun #sun{display:none}
#cosmos.hide-planets .orbit-body{display:none}
#cosmos.hide-moon .moon{display:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite;box-shadow:0 0 3px #fff}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}

#sun{
  position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;
  border-radius:50%;
  background:radial-gradient(circle at 45% 45%,#fffae0 0%,#ffe680 15%,#ffcc33 35%,#ff8800 60%,#ff5500 80%,#aa2200 100%);
  box-shadow:
    0 0 calc(90px * var(--glow-str)) calc(30px * var(--glow-str)) rgba(255,180,0,.55),
    0 0 calc(180px * var(--glow-str)) calc(70px * var(--glow-str)) rgba(255,100,0,.3),
    0 0 calc(300px * var(--glow-str)) calc(120px * var(--glow-str)) rgba(255,50,0,.15);
  animation:sunPulse 4s ease-in-out infinite;
}
#sun::before{
  content:'';position:absolute;inset:-20px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,220,100,.4),transparent 70%);
  animation:sunPulse 4s ease-in-out infinite;
}
#sun::after{
  content:'';position:absolute;inset:-45px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,0,.15),transparent 60%);
  animation:sunPulse 4s ease-in-out infinite reverse;
}
@keyframes sunPulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.2)}
}

.orbit{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid rgba(0,229,255,.06);transform:translate(-50%,-50%);pointer-events:none}
.orbit-body{
  position:absolute;left:50%;top:50%;border-radius:50%;
  animation:orbit linear infinite;
  transform:translate(-50%,-50%) rotate(0) translateX(var(--r));
}
@keyframes orbit{
  from{transform:translate(-50%,-50%) rotate(0) translateX(var(--r)) rotate(0)}
  to{transform:translate(-50%,-50%) rotate(360deg) translateX(var(--r)) rotate(-360deg)}
}
.planet{
  position:relative;border-radius:50%;width:100%;height:100%;
  box-shadow:inset -3px -3px 8px rgba(0,0,0,.6),0 0 12px var(--pglow,rgba(0,229,255,.4));
}
/* Merkur */
.p-mercury{background:radial-gradient(circle at 35% 30%,#b8a888,#8c7853 45%,#5a4a30);--pglow:rgba(184,168,136,.4)}
/* Venus */
.p-venus{background:radial-gradient(circle at 35% 30%,#ffe8a8,#e8b05c 45%,#a07020);--pglow:rgba(232,176,92,.5)}
/* Erde */
.p-earth{
  background:
    radial-gradient(circle at 30% 30%,rgba(120,200,120,.9) 0%,transparent 25%),
    radial-gradient(circle at 65% 60%,rgba(90,180,90,.85) 0%,transparent 20%),
    radial-gradient(circle at 40% 75%,rgba(150,210,120,.7) 0%,transparent 18%),
    radial-gradient(circle at 35% 35%,#5cb8ff,#2878cc 50%,#0a3a80);
  --pglow:rgba(77,168,255,.7);
  box-shadow:inset -4px -4px 10px rgba(0,0,0,.7),inset 2px 2px 8px rgba(140,220,255,.3),0 0 18px var(--pglow);
}
/* Mars */
.p-mars{background:radial-gradient(circle at 35% 30%,#ff9878,#e26b4a 45%,#8a2a10);--pglow:rgba(226,107,74,.5)}
/* Jupiter */
.p-jupiter{
  background:
    repeating-linear-gradient(0deg,#d4a574 0,#d4a574 3px,#c99460 3px,#c99460 5px,#e0b884 5px,#e0b884 8px,#b88050 8px,#b88050 10px);
  --pglow:rgba(212,165,116,.5);
}
/* Saturn */
.p-saturn{
  background:radial-gradient(circle at 35% 30%,#ffe8a8,#e8c87a 45%,#a08040);
  --pglow:rgba(232,200,122,.5);
}
.p-saturn::after{
  content:'';position:absolute;
  left:-30%;top:38%;
  width:160%;height:24%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(232,200,122,.5) 0%,transparent 70%);
  border:2px solid rgba(232,200,122,.6);
  transform:rotate(-15deg);
  box-shadow:0 0 8px rgba(232,200,122,.4);
}
/* Uranus */
.p-uranus{background:radial-gradient(circle at 35% 30%,#c8f8f8,#7de8e8 45%,#3aa8b8);--pglow:rgba(125,232,232,.5)}
/* Neptun */
.p-neptun{background:radial-gradient(circle at 35% 30%,#98b8ff,#5a7ce8 45%,#2a3a90);--pglow:rgba(90,124,232,.5)}

/* Mond um Erde */
.moon{
  position:absolute;left:50%;top:50%;
  width:5px;height:5px;margin:-2.5px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#e8e8e8,#a0a0a0 60%,#606060);
  box-shadow:0 0 6px rgba(200,200,200,.6);
  animation:moonOrbit 4s linear infinite;
}
@keyframes moonOrbit{
  from{transform:translate(-50%,-50%) rotate(0) translateX(16px)}
  to{transform:translate(-50%,-50%) rotate(360deg) translateX(16px)}
}

/* ══════════ TOP BAR ══════════ */
#topbar{
  position:fixed;top:var(--safe-t);left:0;right:0;height:58px;z-index:150;
  display:flex;align-items:center;padding:0 14px;gap:10px;
  background:linear-gradient(180deg,rgba(5,10,20,.95),rgba(5,10,20,.5));
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-bottom:1.5px solid var(--border);
  box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 30px var(--glow);
}
#topbar .logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;flex-shrink:0;
  box-shadow:0 0 20px var(--glow),0 0 40px rgba(180,120,255,.3);
  transition:transform .2s;overflow:hidden;position:relative;
}
#topbar .logo:active{transform:scale(.94)}
#topbar .logo img{width:100%;height:100%;object-fit:cover}
#topbar .title{font-size:15px;font-weight:800;letter-spacing:.4px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#topbar .subtitle{font-size:10px;color:var(--muted);margin-top:1px}
#topbar .spacer{flex:1}
.icon-btn{
  min-width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,229,255,.08);border:1.5px solid var(--border);
  font-size:18px;transition:all .2s;
}
.icon-btn:active{background:rgba(0,229,255,.25);transform:scale(.94)}

/* ══════════ SIDEBAR ══════════ */
#sidebar{
  position:fixed;top:calc(var(--safe-t) + 58px);left:0;bottom:calc(var(--safe-b) + 62px);
  width:82px;z-index:140;padding:14px 6px;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(180deg,rgba(10,25,45,.85),rgba(5,12,22,.9));
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
  border-right:1.5px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
  transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:6px 0 24px rgba(0,0,0,.4);
}
#sidebar.hidden{transform:translateX(-100%)}
.nav-btn{
  width:70px;height:64px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(0,229,255,.05);border:1.5px solid rgba(0,229,255,.18);
  font-size:22px;transition:all .2s;flex-shrink:0;
}
.nav-btn:active{background:rgba(0,229,255,.25);transform:scale(.95)}
.nav-btn.active{background:rgba(0,229,255,.2);border-color:var(--primary);box-shadow:0 0 16px var(--glow)}
.nav-btn .lbl{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.nav-btn.active .lbl{color:var(--primary)}

/* ══════════ WINDOWS ══════════ */
#winLayer{position:fixed;inset:0;z-index:200;pointer-events:none;
  padding-top:calc(var(--safe-t) + 58px);padding-left:82px}
.win{
  position:absolute;pointer-events:auto;
  min-width:320px;min-height:220px;
  max-width:calc(100vw - 100px);max-height:calc(100vh - 130px);
  background:linear-gradient(160deg,rgba(10,25,45,.94),rgba(8,18,35,.97));
  backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1.5px solid var(--border);border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px var(--glow);
  display:flex;flex-direction:column;overflow:hidden;z-index:200;
  transition:box-shadow .2s;
}
.win.active{z-index:250;box-shadow:0 25px 80px rgba(0,0,0,.8),0 0 60px var(--glow)}
.win-head{
  height:48px;display:flex;align-items:center;padding:0 10px 0 16px;gap:8px;
  background:linear-gradient(180deg,rgba(0,229,255,.12),rgba(0,229,255,.03));
  border-bottom:1.5px solid var(--border);flex-shrink:0;cursor:grab;
}
.win-head:active{cursor:grabbing}
.win-head .wtitle{flex:1;font-size:13px;font-weight:800;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;padding:0 100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-btn{
  min-width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;background:rgba(0,229,255,.1);border:1.5px solid var(--border);
  position:relative;z-index:999999;
}
.win-btn.close:hover,.win-btn.close:active{background:rgba(255,80,80,.4);border-color:#ff5050}
.win-body{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.6}

/* ══════════ BOTTOM ══════════ */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;height:62px;z-index:150;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 12px var(--safe-b);padding-bottom:calc(var(--safe-b) + 8px);
  background:linear-gradient(0deg,rgba(5,10,20,.95),rgba(5,10,20,.5));
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:1.5px solid var(--border);
}
.bb-btn{
  height:44px;padding:0 16px;border-radius:14px;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.1));
  border:1.5px solid var(--border);
  font-size:14px;font-weight:700;
  box-shadow:0 4px 16px rgba(0,229,255,.2);transition:all .2s;
}
.bb-btn:active{transform:scale(.95);background:linear-gradient(135deg,rgba(0,229,255,.35),rgba(180,120,255,.25))}
.bb-btn.pink{border-color:rgba(255,120,200,.5);background:linear-gradient(135deg,rgba(255,120,200,.2),rgba(180,120,255,.15))}

/* ══════════ TOASTS ══════════ */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 100px);z-index:1000;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100vw - 40px);max-width:380px;
}
.toast{
  background:linear-gradient(135deg,rgba(0,229,255,.95),rgba(180,120,255,.95));
  color:#001;padding:12px 20px;border-radius:14px;
  font-size:13px;font-weight:800;text-align:center;
  box-shadow:0 8px 32px rgba(0,229,255,.5);
  animation:toastIn .3s ease-out;max-width:100%;
  border:1.5px solid rgba(255,255,255,.3);
}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.out{animation:toastOut .3s ease-in forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

/* ══════════ WELCOME ══════════ */
#welcomeBanner{
  position:fixed;top:calc(var(--safe-t) + 70px);left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:1100;padding:14px 24px;border-radius:16px;
  background:linear-gradient(135deg,rgba(0,229,255,.95),rgba(180,120,255,.95));
  color:#001;font-size:14px;font-weight:800;text-align:center;
  box-shadow:0 12px 40px rgba(0,229,255,.6),0 0 60px rgba(180,120,255,.4);
  border:2px solid var(--gold);opacity:0;pointer-events:none;
  transition:all .4s cubic-bezier(.2,.9,.3,1);max-width:calc(100vw - 40px);
}
#welcomeBanner.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════ MODAL ══════════ */
#modalLayer{
  position:fixed;inset:0;z-index:1100;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
}
#modalLayer.show{display:flex}
.modal{
  background:linear-gradient(160deg,rgba(10,25,45,.98),rgba(8,18,35,.99));
  border:1.5px solid var(--border);border-radius:18px;
  max-width:460px;width:100%;max-height:80vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 60px var(--glow);padding:22px;
}
.modal h2{margin-bottom:14px;font-size:18px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ══════════ UTILS ══════════ */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{padding:10px 16px;border-radius:12px;background:rgba(0,229,255,.12);
  border:1.5px solid var(--border);font-weight:600;font-size:13px;
  transition:all .2s;min-height:40px}
.btn:active{background:rgba(0,229,255,.3);transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#001;border:none;box-shadow:0 4px 16px var(--glow)}
.btn.danger{background:rgba(255,80,80,.2);border-color:rgba(255,80,80,.5)}
.inp{width:100%;padding:10px 14px;border-radius:12px;
  background:rgba(0,229,255,.08);border:1.5px solid rgba(0,229,255,.3);
  font-size:14px;outline:none;transition:all .2s;margin-bottom:10px}
.inp:focus{border-color:var(--primary);box-shadow:0 0 12px var(--glow)}
.card{background:linear-gradient(160deg,rgba(0,229,255,.06),rgba(180,120,255,.03));
  border:1.5px solid rgba(0,229,255,.2);
  border-radius:14px;padding:14px;margin-bottom:10px}
.card:hover{border-color:var(--primary);box-shadow:0 0 16px var(--glow)}
.list-item{padding:12px 14px;border-radius:12px;background:rgba(0,229,255,.06);
  border:1.5px solid rgba(0,229,255,.15);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
.grad-text{background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* App Grid */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;margin-top:10px}
.app-tile{
  aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.1));
  border:1.5px solid rgba(0,229,255,.3);font-size:22px;
  transition:all .2s;cursor:pointer;padding:6px;
}
.app-tile:active{transform:scale(.92);background:linear-gradient(135deg,rgba(0,229,255,.4),rgba(180,120,255,.3))}
.app-tile.soon{opacity:.55}
.app-tile .app-name{font-size:9px;font-weight:600;text-align:center;color:var(--muted);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* Avatar */
.avatar-stage{display:flex;flex-direction:column;align-items:center;padding:20px 0}
.avatar-face{width:160px;height:160px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 40%,rgba(0,229,255,.3),rgba(0,50,100,.6));
  border:2px solid var(--primary);box-shadow:0 0 60px var(--glow),inset 0 0 40px rgba(0,229,255,.2);
  display:flex;align-items:center;justify-content:center;font-size:70px}
.avatar-face.speaking{animation:speakPulse 1s ease-in-out infinite}
@keyframes speakPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.avatar-ring{position:absolute;inset:-20px;border-radius:50%;border:2px dashed var(--primary);
  animation:spin 8s linear infinite;opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}

/* Settings */
.set-section{margin-bottom:24px}
.set-title{font-weight:800;color:var(--primary);font-size:14px;margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.settings-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(0,229,255,.12);gap:10px;flex-wrap:wrap}
.settings-row .lbl{font-size:13px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:10px;font-size:12px;font-weight:600;
  background:rgba(0,229,255,.08);border:1.5px solid rgba(0,229,255,.2);
  transition:all .2s;cursor:pointer}
.chip:active{transform:scale(.94)}
.chip.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#001;
  border-color:transparent;box-shadow:0 0 12px var(--glow)}
.toggle{position:relative;width:52px;height:30px;border-radius:15px;
  background:rgba(0,229,255,.15);border:1.5px solid var(--border);transition:all .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;
  border-radius:50%;background:var(--muted);transition:all .25s}
.toggle.on{background:linear-gradient(135deg,var(--primary),var(--accent));border-color:transparent}
.toggle.on::after{left:24px;background:#fff;box-shadow:0 0 10px #fff}

/* Registry */
.reg-cat{padding:12px 14px;border-radius:14px;margin-bottom:8px;
  background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(180,120,255,.04));
  border:1.5px solid rgba(0,229,255,.2);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:12px}
.reg-cat:active{transform:scale(.98);background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(180,120,255,.15))}
.reg-cat .letter{width:34px;height:34px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#001;
  box-shadow:0 0 10px var(--glow)}
.reg-cat .info{flex:1}
.reg-cat .name{font-weight:700;font-size:13px;color:var(--text)}
.reg-cat .meta{font-size:11px;color:var(--muted);margin-top:2px}

@media (max-width:480px){
  #sidebar{width:70px;padding:10px 4px}
  .nav-btn{width:58px;height:56px;font-size:18px}
  .nav-btn .lbl{font-size:8px}
  #winLayer{padding-left:70px}
  .win-head .wtitle{padding:0 60px;font-size:12px}
}
</style>
</head>
<body>

<div id="cosmos"></div>

<div id="topbar">
  <div class="logo" id="logoBtn">🦚</div>
  <div>
    <div class="title">HalDo AI OS</div>
    <div class="subtitle">Pro Max v124</div>
  </div>
  <div class="spacer"></div>

};

/* PREFS — alle Einstellungen */
HalDo.prefs = {
  get(k, d){ return HalDo.store.get('pref_'+k, d); },

      cos.classList.toggle('hide-stars', !this.get('showStars', true));

};

/* THEME */

  current: 'holo',

    holo:{ primary:'#00e5ff', secondary:'#4da8ff', accent:'#b478ff', name:'Holo', emoji:'💠' },
    cyborg:{ primary:'#ff78c8', secondary:'#b478ff', accent:'#ff4488', name:'Cyborg', emoji:'⚡' },

/* WIN */
HalDo.win = {
  zTop: 200,
  open(id, opts){
    opts = opts || {};
    if (document.getElementById('win-'+id)) { this.focus(id); return document.getElementById('win-'+id); }
    const layer = document.getElementById('winLayer');
    const w = document.createElement('div');
    w.className = 'win active'; w.id = 'win-'+id;
    const isMobile = window.innerWidth < 700;
    const W = Math.min(opts.w || (isMobile ? window.innerWidth - 96 : 520), window.innerWidth - 100);
    const H = Math.min(opts.h || (isMobile ? window.innerHeight - 220 : 560), window.innerHeight - 130);
    const offset = (this.zTop - 200) % 8 * 24;
    w.style.width = W + 'px'; w.style.height = H + 'px';
    w.style.left = Math.max(90, (window.innerWidth - W) / 2 + offset - 40) + 'px';
    w.style.top = Math.max(70, (window.innerHeight - H) / 2 + offset - 30) + 'px';
    w.innerHTML = `
      <div class="win-head" data-drag="1">
        <button class="win-btn close">✕</button>
        <div class="wtitle">${opts.title || 'Fenster'}</div>
        <button class="win-btn min">▁</button>
      </div>
      <div class="win-body"></div>`;
    layer.appendChild(w);
    this.zTop++; w.style.zIndex = this.zTop;
    w.querySelector('.close').onclick = e => { e.stopPropagation(); this.close(id); };
    w.querySelector('.min').onclick = e => { e.stopPropagation(); w.style.display = 'none'; setTimeout(() => this.close(id), 100); };
    w.addEventListener('mousedown', () => this.focus(id));
    w.addEventListener('touchstart', () => this.focus(id), { passive: true });
    this.drag(w, w.querySelector('.win-head'));
    return w;
  },
  focus(id){
    document.querySelectorAll('.win').forEach(w => w.classList.remove('active'));
    const w = document.getElementById('win-'+id);
    if (w) { w.classList.add('active'); this.zTop++; w.style.zIndex = this.zTop; }
  },
  close(id){ const w = document.getElementById('win-'+id); if (w) w.remove(); },
  body(id){ const w = document.getElementById('win-'+id); return w ? w.querySelector('.win-body') : null; },
  drag(win, handle){
    let sx, sy, ox, oy, dragging = false;
    const start = (e) => {
      const t = e.touches ? e.touches[0] : e;
      const rect = handle.getBoundingClientRect();
      const x = t.clientX - rect.left;
      if (x < 100 || x > rect.width - 100) return;
      dragging = true; sx = t.clientX; sy = t.clientY;
      ox = win.offsetLeft; oy = win.offsetTop;
      if (e.cancelable) e.preventDefault();
    };
    const move = (e) => {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      let nx = ox + (t.clientX - sx), ny = oy + (t.clientY - sy);
      nx = Math.max(85, Math.min(nx, window.innerWidth - 100));
      ny = Math.max(62, Math.min(ny, window.innerHeight - 80));
      win.style.left = nx + 'px'; win.style.top = ny + 'px';
      if (e.cancelable) e.preventDefault();
    };
    const end = () => { dragging = false; };
    handle.addEventListener('mousedown', start);
    handle.addEventListener('touchstart', start, { passive: false });
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }
};

HalDo.apps.aiChat = {
  open(){
    const w = HalDo.win.open('aiChat', { title:'💬 HalDo AI Chat', w: 540, h: 620 });
    HalDo.welcome('HalDo AI Chat');
    const b = HalDo.win.body('aiChat');
    const history = HalDo.store.get('chat', []);
    b.innerHTML = `
      <div id="chatLog" style="height:calc(100% - 60px);overflow-y:auto;padding-right:6px;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px">
        <input class="inp" id="chatInput" placeholder="Schreib etwas..." style="margin:0;flex:1">
        <button class="btn primary" id="chatSend" style="min-width:60px">➤</button>
      </div>`;
    const log = b.querySelector('#chatLog');
    const addMsg = (role, text) => {
      const d = document.createElement('div');
      const isUser = role === 'user';
      d.style.cssText = `margin-bottom:10px;padding:10px 14px;border-radius:14px;max-width:80%;font-size:13px;line-height:1.5;${isUser ? 'background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.2));margin-left:auto;border:1.5px solid rgba(0,229,255,.4)' : 'background:rgba(180,120,255,.15);border:1.5px solid rgba(180,120,255,.3)'}`;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    };
    history.forEach(m => addMsg(m.role, m.text));
    const send = () => {
      const inp = b.querySelector('#chatInput');
      const text = inp.value.trim();
      if (!text) return;
      addMsg('user', text);
      history.push({ role:'user', text });
      inp.value = '';
      setTimeout(() => {
        let reply = '🤖 Ich verstehe dich, Bruder. Diese Funktion ist in Phase 4 (AI-Anbindung) verfügbar.';
        const t = text.toLowerCase();
        if (/\b(hi|hallo|hey|haldo)\b/.test(t)) reply = '👋 Hallo Bruder! Willkommen bei HalDo AI OS Professional. Wie kann ich dir helfen?';
        else if (t.includes('zeit')) reply = '🕐 ' + new Date().toLocaleTimeString('de-DE');
        else if (t.includes('datum')) reply = '📅 ' + new Date().toLocaleDateString('de-DE', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
        else if (t.includes('theme')) reply = '🎨 Aktuelles Theme: ' + HalDo.theme.presets[HalDo.theme.current].name;
        else if (t.includes('app')) reply = '📱 Öffne die App-Registry (375 Apps in 26 Kategorien A–Z).';
        addMsg('assistant', reply);
        history.push({ role:'assistant', text: reply });
        HalDo.store.set('chat', history.slice(-50));
      }, 400);
    };
    b.querySelector('#chatSend').onclick = send;
    b.querySelector('#chatInput').onkeydown = e => { if (e.key === 'Enter') send(); };
    b.querySelector('#chatInput').focus();
  }
};

    const list = HalDo.store.get('habits', []);
    list.push({ id: Date.now(), name: t, checks: [] });
    HalDo.store.set('habits', list);
    inp.value = ''; this.render();
  },
  check(id){
    const list = HalDo.store.get('habits', []);
    const today = new Date().toISOString().split('T')[0];
    list.forEach(h => { if (h.id === id) { if (!h.checks.includes(today)) h.checks.push(today); } });
    HalDo.store.set('habits', list); this.render();
  },
  streak(h){ 
    const days = [...h.checks].sort().reverse();
    let s = 0, d = new Date();
    for (let i = 0; i < 365; i++) {
      const key = d.toISOString().split('T')[0];
      if (days.includes(key)) { s++; d.setDate(d.getDate() - 1); } else break;
    }
    return s;
  },
  render(){
    const el = document.getElementById('habitsList'); if (!el) return;
    const list = HalDo.store.get('habits', []);
    const today = new Date().toISOString().split('T')[0];
    el.innerHTML = list.length ? list.map(h => `

    if (!chars) return HalDo.toast('❌ Option wählen');
    let pw = '';
    for (let i = 0; i < len; i++) pw += chars[Math.floor(Math.random() * chars.length)];
    document.getElementById('pwOut').textContent = pw;
    navigator.clipboard && navigator.clipboard.writeText(pw);
    HalDo.toast('✅ Passwort kopiert');
  }
};

      </div>
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="HalDo.apps.music.tone('C')">C</button>
        <button class="btn" onclick="HalDo.apps.music.tone('D')">D</button>
        <button class="btn" onclick="HalDo.apps.music.tone('E')">E</button>
        <button class="btn" onclick="HalDo.apps.music.tone('F')">F</button>
        <button class="btn" onclick="HalDo.apps.music.tone('G')">G</button>
        <button class="btn" onclick="HalDo.apps.music.tone('A')">A</button>
        <button class="btn" onclick="HalDo.apps.music.tone('B')">B</button>
      </div>`;
  },
  ctx: null,
  tone(n){
    const freqs = { C:261.63, D:293.66, E:329.63, F:349.23, G:392.00, A:440.00, B:493.88 };
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.frequency.value = freqs[n];
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
    osc.start(); osc.stop(this.ctx.currentTime + 0.4);
    document.getElementById('mNow').textContent = '🎵 ' + n + ' Note';
  }
};

  secs: 1500, int: null,
  start(){
    if (this.int) return;

  stop(){ if (this.int) clearInterval(this.int); this.int = null; },
  reset(){ this.stop(); this.secs = 1500; this.render(); },
  render(){
    const d = document.getElementById('pomoDisp'); if (!d) return;
    const m = Math.floor(this.secs / 60), s = this.secs % 60;
    d.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  stream: null,
  start(){
    navigator.mediaDevices?.getUserMedia({ video: true })

      .catch(e => HalDo.toast('❌ Kamera: ' + e.message));

  stop(){
    if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }

    c.getContext('2d').drawImage(v, 0, 0);

    img.style.cssText = 'width:60px;height:60px;border-radius:8px;margin-right:6px;border:1.5px solid var(--border)';

(function init(){
  const cos = document.getElementById('cosmos');
  // Sterne
  for (let i = 0; i < 220; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 0.4;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    if (Math.random() > 0.9) s.style.background = ['#ffe8b0','#b0e8ff','#ffb0e8'][Math.floor(Math.random()*3)];
    cos.appendChild(s);
  }
  // Sonne
  const sun = document.createElement('div');
  sun.id = 'sun';
  cos.appendChild(sun);
  // Orbits + Planeten
  const planets = [
    { class:'p-mercury', r:95,  s:8,  t:8  },
    { class:'p-venus',   r:130, s:11, t:14 },
    { class:'p-earth',   r:170, s:12, t:20, hasMoon:true },
    { class:'p-mars',    r:210, s:9,  t:26 },
    { class:'p-jupiter', r:255, s:20, t:38 },
    { class:'p-saturn',  r:300, s:17, t:52 },
    { class:'p-uranus',  r:345, s:13, t:68 },
    { class:'p-neptun',  r:385, s:12, t:82 }
  ];
  planets.forEach(p => {
    // Orbit-Ring
    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    orbit.style.width = (p.r * 2) + 'px';
    orbit.style.height = (p.r * 2) + 'px';
    cos.appendChild(orbit);
    // Planet-Body (bewegt)
    const body = document.createElement('div');
    body.className = 'orbit-body';
    body.style.width = p.s + 'px';
    body.style.height = p.s + 'px';
    body.style.marginLeft = '-' + (p.s/2) + 'px';
    body.style.marginTop = '-' + (p.s/2) + 'px';
    body.style.setProperty('--r', p.r + 'px');
    body.style.animationDuration = p.t + 's';
    // Planet
    const pl = document.createElement('div');
    pl.className = 'planet ' + p.class;
    pl.style.width = p.s + 'px';
    pl.style.height = p.s + 'px';
    body.appendChild(pl);
    // Mond um Erde
    if (p.hasMoon) {
      const moon = document.createElement('div');
      moon.className = 'moon';
      pl.appendChild(moon);
    }
    cos.appendChild(body);
  });
  // Logo
  document.getElementById('logoBtn').onclick = () => document.getElementById('sidebar').classList.toggle('hidden');
  // Prefs initial
  HalDo.prefs.apply();
  // Theme
  HalDo.theme.init();
  // Welcome
  if (HalDo.prefs.get('welcome', true)) setTimeout(() => HalDo.welcome('HalDo AI OS Professional'), 600);
  // Dashboard nach 1.2s
  setTimeout(() => HalDo.apps.dashboard.open(), 1500);
  // ESC
  document.addEventListener('keydown', e => { if (e.key === 'Escape') HalDo.closeModal(); });
  console.log('%c🦚 HalDo AI OS Pro Max v124 — bereit', 'color:#00e5ff;font-size:14px;font-weight:bold');
})();
</script>
