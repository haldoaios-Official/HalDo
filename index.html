<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>HalDo AI OS v123</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='82'%3E🦚%3C/text%3E%3C/svg%3E">
<style>
/* ═══════════════ RESET ═══════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#02040a;color:#dff6ff;font-size:13px}
button,input,textarea,select{font-family:inherit;color:inherit}

/* ═══════════════ THEME VARIABLES ═══════════════ */
:root{
  --p1:#00e5ff; --p2:#4da8ff; --p3:#b478ff;
  --bg-dark:#02040a; --bg-panel:rgba(10,20,40,.55); --bg-card:rgba(15,25,50,.65);
  --border:1.5px solid rgba(0,229,255,.4);
  --border-soft:1px solid rgba(0,229,255,.18);
  --text:#dff6ff; --text-dim:#7a9bb8; --text-mute:#4a6b88;
  --radius:18px; --radius-sm:14px; --radius-xs:10px;
  --shadow:0 10px 40px rgba(0,229,255,.15);
  --glow:0 0 20px rgba(0,229,255,.5);
}
body.cyborg{
  --p1:#ff78c8; --p2:#b478ff; --p3:#ff5cae;
  --border:1.5px solid rgba(255,120,200,.5);
  --border-soft:1px solid rgba(255,120,200,.2);
  --shadow:0 10px 40px rgba(255,120,200,.2);
  --glow:0 0 20px rgba(255,120,200,.6);
}
body.holo-off{
  --bg-panel:rgba(10,20,40,.85);
  --bg-card:rgba(15,25,50,.9);
}

/* ═══════════════ BACKGROUND LAYER ═══════════════ */
#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 20% 30%,#0a1a3a,#02040a 70%)}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bgLayer.mode-holo::before{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px) 0 0/40px 40px,
    radial-gradient(ellipse at 50% 50%,rgba(0,229,255,.15),transparent 60%);
  animation:holoPulse 8s ease-in-out infinite;
}
@keyframes holoPulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ═══════════════ TOP BAR ═══════════════ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:54px;z-index:50;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  padding-top:env(safe-area-inset-top);
  background:var(--bg-panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:var(--border-soft);
}
body.cyborg #topbar{border-bottom:1.5px solid rgba(255,120,200,.3)}
#topbar .logo{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px;border-radius:12px;transition:.2s}
#topbar .logo:hover{background:rgba(0,229,255,.08)}
#topbar .logo .peacock{font-size:26px;filter:drop-shadow(0 0 8px var(--p1))}
#topbar .logo .txt{display:flex;flex-direction:column;line-height:1.05}
#topbar .logo .txt .t1{font-size:14px;font-weight:800;color:var(--p1);letter-spacing:.5px}
#topbar .logo .txt .t2{font-size:9px;color:var(--text-mute);letter-spacing:2px}
#topbar .spacer{flex:1}
#topbar .status-chip{
  display:flex;align-items:center;gap:6px;padding:6px 12px;
  background:rgba(0,0,0,.35);border:var(--border-soft);border-radius:20px;
  font-size:10px;color:var(--text-dim);font-weight:600;
}
#topbar .status-chip .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
#topbar .icon-btn{
  width:42px;height:42px;border-radius:12px;
  background:rgba(0,0,0,.35);border:var(--border-soft);
  color:var(--p1);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
#topbar .icon-btn:hover{background:rgba(0,229,255,.15);border-color:var(--p1);box-shadow:var(--glow)}

/* ═══════════════ SIDEBAR ═══════════════ */
#sidebar{
  position:fixed;top:54px;bottom:0;left:0;width:230px;z-index:40;
  padding:12px 10px;padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--bg-panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:var(--border-soft);
  overflow-y:auto;
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#sidebar.open{transform:translateX(0)}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
#sidebar .group{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:14px 8px 6px}
#sidebar .item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:.2s;width:100%;text-align:left;
}
#sidebar .item:hover{background:rgba(0,229,255,.1)}
#sidebar .item.active{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.15));border:1px solid rgba(0,229,255,.4);box-shadow:0 0 20px rgba(0,229,255,.2)}
#sidebar .item .ico{font-size:18px;flex-shrink:0}
#sidebar .item .badge{margin-left:auto;font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(0,229,255,.2);color:var(--p1)}
#sidebar .sep{height:1px;background:var(--border-soft);margin:10px 6px;border:none}

/* ═══════════════ DESKTOP (Fenster-Bereich) ═══════════════ */
#desktop{position:fixed;top:54px;left:0;right:0;bottom:64px;z-index:20;overflow:hidden;padding:14px}
#sidebar.open ~ #desktop{left:230px}
@media(max-width:600px){
  #sidebar.open ~ #desktop{left:0}
  #sidebar{box-shadow:20px 0 60px rgba(0,0,0,.6)}
}

/* App-Grid (Homescreen) */
#homescreen{padding:8px 4px;overflow-y:auto;height:100%}
#homescreen .welcome{padding:20px 16px;margin-bottom:16px;border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.12));
  border:var(--border);box-shadow:var(--shadow);text-align:center}
#homescreen .welcome .hello{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;font-weight:800}
#homescreen .welcome .name{font-size:22px;font-weight:900;color:var(--p1);margin-top:4px;text-shadow:0 0 20px var(--p1)}
#homescreen .welcome .sub{font-size:11px;color:var(--text-dim);margin-top:6px}
#homescreen .app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
#homescreen .tile{
  padding:14px 6px;border-radius:16px;background:var(--bg-card);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:var(--border-soft);cursor:pointer;transition:.25s;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;
}
#homescreen .tile:hover{border-color:var(--p1);background:rgba(0,229,255,.1);transform:translateY(-3px);box-shadow:var(--glow)}
#homescreen .tile .ico{font-size:32px;line-height:1;filter:drop-shadow(0 0 10px rgba(0,229,255,.4))}
#homescreen .tile .name{font-size:11px;font-weight:700;color:var(--text);line-height:1.2}
#homescreen .tile .cat{font-size:8.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.5px;font-weight:700}

/* ═══════════════ FENSTER ═══════════════ */
.window{
  position:absolute;min-width:280px;min-height:220px;max-width:95vw;max-height:88vh;
  background:var(--bg-card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow),0 0 40px rgba(0,229,255,.1);
  display:flex;flex-direction:column;overflow:hidden;z-index:100;
}
.window.focused{box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 50px rgba(0,229,255,.25);border-color:var(--p1)}
.window.minimized{display:none}
.window .titlebar{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:linear-gradient(180deg,rgba(0,229,255,.1),transparent);
  border-bottom:var(--border-soft);cursor:move;flex-shrink:0;
  user-select:none;touch-action:none;
}
.window .titlebar .ico{font-size:18px;filter:drop-shadow(0 0 6px var(--p1))}
.window .titlebar .title{flex:1;font-size:12.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.window .titlebar .wbtns{display:flex;gap:6px}
.window .titlebar .wbtn{
  width:40px;height:40px;min-width:40px;border-radius:10px;
  background:rgba(0,229,255,.1);border:var(--border-soft);
  color:var(--p1);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:999999;transition:.15s;
}
.window .titlebar .wbtn:hover{background:rgba(0,229,255,.25)}
.window .titlebar .wbtn.close{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#ff8080}
.window .titlebar .wbtn.close:hover{background:rgba(239,68,68,.35)}
.window .wbody{flex:1;overflow-y:auto;padding:14px;position:relative}
.window .wbody::-webkit-scrollbar{width:6px}
.window .wbody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.window .resizer{position:absolute;width:16px;height:16px;bottom:0;right:0;cursor:nwse-resize;z-index:5}
.window .resizer::after{content:"";position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-right:2px solid var(--p1);border-bottom:2px solid var(--p1);opacity:.4}

/* ═══════════════ BOTTOM BAR ═══════════════ */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;height:64px;z-index:50;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:0 14px;padding-bottom:env(safe-area-inset-bottom);
  background:var(--bg-panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:var(--border-soft);
}
body.cyborg #bottombar{border-top:1.5px solid rgba(255,120,200,.3)}
#bottombar .bbtn{
  min-width:90px;padding:10px 18px;border-radius:14px;
  background:rgba(0,229,255,.1);border:var(--border-soft);
  color:var(--p1);font-family:inherit;font-size:12px;font-weight:800;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s;
}
#bottombar .bbtn:hover{background:rgba(0,229,255,.2);box-shadow:var(--glow);transform:translateY(-2px)}
#bottombar .bbtn.cyborg{background:rgba(255,120,200,.15);border-color:rgba(255,120,200,.5);color:#ff78c8}
#bottombar .bbtn .ico{font-size:20px;line-height:1}

/* ═══════════════ SETTINGS PANEL ═══════════════ */
#settings{
  position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.75);
  display:none;align-items:center;justify-content:center;padding:16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
#settings.show{display:flex}
#settings .panel{
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  background:var(--bg-card);backdrop-filter:blur(28px);
  border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
}
#settings .panel::-webkit-scrollbar{width:6px}
#settings .panel::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
#settings .phead{
  display:flex;align-items:center;gap:10px;padding:16px;position:sticky;top:0;
  background:var(--bg-card);backdrop-filter:blur(28px);
  border-bottom:var(--border-soft);z-index:2;
}
#settings .phead h2{font-size:14px;font-weight:900;color:var(--p1);flex:1}
#settings .phead .close{
  width:40px;height:40px;border-radius:10px;background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
}
#settings .pbody{padding:16px}
#settings .group{margin-bottom:16px;padding:14px;background:rgba(0,0,0,.2);border-radius:14px;border:var(--border-soft)}
#settings .group h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--p1);font-weight:800;margin-bottom:12px}
#settings .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:10px}
#settings .row:last-child{border-bottom:none}
#settings .row .lbl{font-size:12px;font-weight:700;flex:1}
#settings .row .lbl small{display:block;font-size:10px;color:var(--text-mute);font-weight:600;margin-top:2px}
#settings .sw{
  width:48px;height:26px;border-radius:13px;background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.15);position:relative;cursor:pointer;flex-shrink:0;transition:.2s;
}
#settings .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#7a9bb8;transition:.2s}
#settings .sw.on{background:rgba(0,229,255,.3);border-color:var(--p1)}
#settings .sw.on::after{left:24px;background:var(--p1);box-shadow:0 0 10px var(--p1)}
#settings .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#settings .theme-card{
  padding:12px 8px;border-radius:12px;background:rgba(0,0,0,.25);
  border:var(--border-soft);cursor:pointer;text-align:center;transition:.2s;
}
#settings .theme-card.active{border-color:var(--p1);box-shadow:var(--glow)}
#settings .theme-card .preview{height:56px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
#settings .theme-card .preview.kosmos{background:radial-gradient(circle at 30% 40%,#ff9028,#0a1a3a 60%,#02040a)}
#settings .theme-card .preview.erde{background:radial-gradient(circle at 40% 40%,#4a8fd8,#1a4a8a 50%,#02040a)}
#settings .theme-card .preview.holo{background:linear-gradient(135deg,#0a1a3a,#1a2a5a);box-shadow:inset 0 0 30px rgba(0,229,255,.3)}
#settings .theme-card .name{font-size:10.5px;font-weight:800}

/* ═══════════════ TOAST ═══════════════ */
#toast{
  position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);
  padding:10px 18px;background:var(--bg-card);border:var(--border);border-radius:22px;
  font-size:12px;font-weight:700;color:var(--p1);z-index:500;opacity:0;pointer-events:none;
  transition:.3s;backdrop-filter:blur(20px);white-space:nowrap;max-width:90vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);box-shadow:var(--glow)}
#toast.ok{border-color:#22c55e;color:#4ade80}
#toast.err{border-color:#ef4444;color:#ff8080}

/* ═══════════════ SHARED COMPONENTS ═══════════════ */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;border-radius:12px;border:var(--border-soft);
  background:rgba(0,0,0,.3);color:var(--text-dim);font-family:inherit;
  font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s;
}
.tab.active{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.25));border-color:var(--p1);color:var(--text);box-shadow:var(--glow)}
.card{padding:14px;background:rgba(0,0,0,.2);border-radius:14px;border:var(--border-soft);margin-bottom:10px}
.card h3{font-size:12px;font-weight:900;color:var(--p1);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.btn{
  padding:11px 16px;border-radius:12px;border:none;font-family:inherit;
  font-size:12px;font-weight:800;cursor:pointer;transition:.15s;
  background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;
  box-shadow:0 4px 15px rgba(0,229,255,.3);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,229,255,.5)}
.btn.sec{background:rgba(0,229,255,.1);color:var(--p1);border:var(--border-soft);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 15px rgba(239,68,68,.3)}
.btn.full{width:100%}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:10px;
  background:rgba(0,0,0,.3);border:var(--border-soft);color:var(--text);
  font-size:13px;outline:none;font-family:inherit;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p1);box-shadow:0 0 15px rgba(0,229,255,.2)}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.placeholder{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:12px;line-height:1.6}
.placeholder .big{font-size:52px;margin-bottom:12px;opacity:.5}
</style>
</head>
<body>

<!-- ═══════════════ HINTERGRUND ═══════════════ -->
<div id="bgLayer" class="mode-kosmos">
  <canvas id="bgCanvas"></canvas>
</div>

<!-- ═══════════════ TOP BAR ═══════════════ -->
<header id="topbar">
  <div class="logo" id="logoBtn">
    <span class="peacock">🦚</span>
    <div class="txt">
      <span class="t1">HalDo</span>
      <span class="t2">AI OS v123</span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="status-chip"><span class="dot"></span><span id="netStatus">Online</span></div>
  <button class="icon-btn" id="themeToggle" title="Theme wechseln">🎨</button>
  <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙️</button>
</header>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside id="sidebar">
  <div class="group">Hauptmenü</div>
  <button class="item active" data-side="home"><span class="ico">🏠</span>Home</button>
  <button class="item" data-side="apps"><span class="ico">📱</span>Alle Apps</button>
  <button class="item" data-side="favorites"><span class="ico">⭐</span>Favoriten</button>

  <hr class="sep">

  <div class="group">Schnellzugriff</div>
  <button class="item" data-open-app="welt"><span class="ico">🌍</span>Welt</button>
  <button class="item" data-open-app="comm"><span class="ico">📧</span>HalDo Comm</button>
  <button class="item" data-open-app="wissen"><span class="ico">🔬</span>Wissen</button>
  <button class="item" data-open-app="games"><span class="ico">🎮</span>Games</button>
  <button class="item" data-open-app="verkehr"><span class="ico">🚦</span>Verkehr</button>
  <button class="item" data-open-app="kreativ"><span class="ico">🎨</span>Kreativ</button>
  <button class="item" data-open-app="medien"><span class="ico">🎵</span>Medien</button>
  <button class="item" data-open-app="lernen"><span class="ico">📚</span>Lernen</button>
  <button class="item" data-open-app="werkzeuge"><span class="ico">⏱️</span>Werkzeuge</button>
  <button class="item" data-open-app="finanzen"><span class="ico">💰</span>Finanzen</button>
  <button class="item" data-open-app="fitness"><span class="ico">🏋️</span>Fitness</button>
  <button class="item" data-open-app="kueche"><span class="ico">🍳</span>Küche</button>
  <button class="item" data-open-app="zuhause"><span class="ico">🏠</span>Zuhause</button>
  <button class="item" data-open-app="produktiv"><span class="ico">🎯</span>Produktivität</button>
  <button class="item" data-open-app="aufnahme"><span class="ico">🎙️</span>Aufnahme</button>
  <button class="item" data-open-app="dokumente"><span class="ico">📄</span>Dokumente</button>
  <button class="item" data-open-app="haldoAI"><span class="ico">🤖</span>HalDo AI</button>

  <hr class="sep">

  <div class="group">System</div>
  <button class="item" data-open-app="system"><span class="ico">⚙️</span>System</button>
  <button class="item" data-side="about"><span class="ico">ℹ️</span>Über HalDo</button>
</aside>

<!-- ═══════════════ DESKTOP ═══════════════ -->
<main id="desktop">
  <div id="homescreen">
    <div class="welcome">
      <div class="hello" id="greeting">Willkommen</div>
      <div class="name" id="userName">Bruder</div>
      <div class="sub" id="heroSub">19 Mega-Apps · Alle Werkzeuge an einem Ort</div>
    </div>
    <div class="app-grid" id="appGrid"></div>
  </div>
</main>

<!-- ═══════════════ BOTTOM BAR ═══════════════ -->

<!-- ═══════════════ TOAST ═══════════════ -->
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ═══════════════ STORAGE ═══════════════ */
var Storage = {
  prefix: "haldo_v123_",
  get: function(k, f){
    try{ var r = localStorage.getItem(this.prefix+k); return r===null ? f : JSON.parse(r); }
    catch(e){ return f; }
  },
  set: function(k, v){
    try{ localStorage.setItem(this.prefix+k, JSON.stringify(v)); return true; }
    catch(e){ return false; }
  },
  remove: function(k){ localStorage.removeItem(this.prefix+k); },
  keys: function(){
    var arr = [];
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(this.prefix)===0) arr.push(k.substring(this.prefix.length));
    }
    return arr;
  },
  clearAll: function(){
    var self = this;
    this.keys().forEach(function(k){ self.remove(k); });
  }
};

/* ═══════════════ HELPERS ═══════════════ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toast(msg, type){
  var t = $("toast");
  t.textContent = msg;
  t.className = "show" + (type ? " "+type : "");
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.className = ""; }, 2400);
}

/* ═══════════════ APP REGISTRY — 19 Mega-Apps ═══════════════ */
var APPS = [
  { id:"home",         ico:"🏠", name:"Home",            cat:"Haupt",       desc:"Dashboard, Journal, Kalender",        primary:true },
  { id:"welt",         ico:"🌍", name:"Welt",            cat:"Wissen",      desc:"Länder, Städte, Navigation, Wetter, Weltzeiten" },
  { id:"comm",         ico:"📧", name:"HalDo Comm",      cat:"Kommunikation",desc:"Phone, Video, Chat, E-Mail, Kontakte" },
  { id:"wissen",       ico:"🔬", name:"Wissen",          cat:"Wissen",      desc:"Pilze, Dinos, Edelsteine, Astronomie, DNA +8" },
  { id:"games",        ico:"🎮", name:"Games",           cat:"Spiele",      desc:"Snake, Schach, Sudoku, 2048 +8" },
  { id:"verkehr",      ico:"🚦", name:"Verkehr",         cat:"Auto",        desc:"GPS, Blitzer, Fahrschule, Auto" },
  { id:"kreativ",      ico:"🎨", name:"Kreativ",         cat:"Kreativ",     desc:"Bild, Video, Pixel-Art, Kunst-KI, Story" },
  { id:"medien",       ico:"🎵", name:"Medien",          cat:"Medien",      desc:"Musik, Radio, Podcast, Galerie, Kamera" },
  { id:"lernen",       ico:"📚", name:"Lernen",          cat:"Lernen",      desc:"Vokabeln, Übersetzer, Formeln, Mathe" },
  { id:"werkzeuge",    ico:"⏱️", name:"Werkzeuge",       cat:"Werkzeuge",   desc:"Einheiten, QR, Kompass, Passwort, Metronom" },
  { id:"finanzen",     ico:"💰", name:"Finanzen",        cat:"Finanzen",    desc:"Budget, Ausgaben, Sparziele, Rechnungen" },
  { id:"fitness",      ico:"🏋️", name:"Fitness",         cat:"Gesundheit",  desc:"Training, Health, Workout, Sleep" },
  { id:"kueche",       ico:"🍳", name:"Küche",           cat:"Zuhause",     desc:"Rezepte, Einkauf, Vorrat" },
  { id:"zuhause",      ico:"🏠", name:"Zuhause",         cat:"Zuhause",     desc:"Habits, Haushalt, Garten, Haustiere" },
  { id:"produktiv",    ico:"🎯", name:"Produktivität",   cat:"Arbeit",      desc:"Notizen, Recherche, Projekte, Tasks" },
  { id:"aufnahme",     ico:"🎙️", name:"Aufnahme",        cat:"Medien",      desc:"Sprachnotizen, Rechner, Timer" },
  { id:"dokumente",    ico:"📄", name:"Dokumente",       cat:"Arbeit",      desc:"Dokumente, Vorlagen, Export" },
  { id:"haldoAI",      ico:"🤖", name:"HalDo AI",        cat:"KI",          desc:"Chat, Voice, Vision, Übersetzer" },
  { id:"system",       ico:"⚙️", name:"System",          cat:"System",      desc:"Einstellungen, Dateien, Backup" }
];

/* ═══════════════ APP MODULE (Registry) ═══════════════ */
var MODULES = {
  /* Alle Module folgen gleich: { render(container) } */
  /* Wir bauen in den nächsten Runden alle aus — hier sind erst 3 Test-Apps */

  games: {
    render: function(el){
      var tabs = ["🎯 TicTacToe","🐍 Snake","🧩 Memory"];
      el.innerHTML = '<div class="tabs">'+tabs.map(function(t,i){return '<button class="tab'+(i===0?' active':'')+'" data-game-tab="'+i+'">'+t+'</button>';}).join("")+'</div><div id="gameBody"></div>';
      el.querySelectorAll("[data-game-tab]").forEach(function(b){
        b.addEventListener("click", function(){
          el.querySelectorAll("[data-game-tab]").forEach(function(x){x.classList.remove("active");});
          b.classList.add("active");
          renderGameTab(parseInt(b.dataset.gameTab));
        });
      });
      function renderGameTab(n){
        var body = el.querySelector("#gameBody");
        if(n===0) renderTicTacToe(body);
        else if(n===1) renderSnake(body);
        else renderMemory(body);
      }
      renderGameTab(0);
    }
  },

  finanzen: {
    render: function(el){
      var trans = Storage.get("fin_trans", []);
      var income = 0, expense = 0;
      trans.forEach(function(t){ if(t.type==="in") income += t.amount; else expense += t.amount; });
      var balance = income - expense;

      el.innerHTML = '<div class="card"><h3>💰 Übersicht</h3>'
        +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">'
        +'<div style="padding:12px;background:rgba(34,197,94,.1);border-radius:10px;text-align:center;border:1px solid rgba(34,197,94,.3)"><div style="font-size:18px;font-weight:900;color:#4ade80">'+income.toFixed(2)+'€</div><div style="font-size:9px;color:var(--text-mute);text-transform:uppercase;font-weight:800;margin-top:3px">Einnahmen</div></div>'
        +'<div style="padding:12px;background:rgba(239,68,68,.1);border-radius:10px;text-align:center;border:1px solid rgba(239,68,68,.3)"><div style="font-size:18px;font-weight:900;color:#ff8080">'+expense.toFixed(2)+'€</div><div style="font-size:9px;color:var(--text-mute);text-transform:uppercase;font-weight:800;margin-top:3px">Ausgaben</div></div>'
        +'<div style="padding:12px;background:rgba(0,229,255,.1);border-radius:10px;text-align:center;border:1px solid rgba(0,229,255,.4)"><div style="font-size:18px;font-weight:900;color:var(--p1)">'+balance.toFixed(2)+'€</div><div style="font-size:9px;color:var(--text-mute);text-transform:uppercase;font-weight:800;margin-top:3px">Saldo</div></div>'
        +'</div>'
        +'<div class="field"><label>Beschreibung</label><input type="text" id="fin_desc" placeholder="z.B. Wocheneinkauf"></div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
        +'<div class="field"><label>Betrag (€)</label><input type="number" id="fin_amt" step="0.01" placeholder="0.00"></div>'
        +'<div class="field"><label>Typ</label><select id="fin_type"><option value="in">📥 Einnahme</option><option value="out" selected>📤 Ausgabe</option></select></div>'
        +'</div>'
        +'<button class="btn full" id="fin_add">➕ Buchung speichern</button>'
        +'</div>'
        +'<div class="card"><h3>📋 Letzte Buchungen</h3>'
        +'<div id="fin_list"></div>'
        +'</div>';

      function renderList(){
        var t = Storage.get("fin_trans", []);
        var list = el.querySelector("#fin_list");
        if(!t.length){ list.innerHTML = '<div class="placeholder">Noch keine Buchungen.</div>'; return; }
        list.innerHTML = t.slice(-20).reverse().map(function(x){
          var color = x.type==="in" ? "#4ade80" : "#ff8080";
          var sign = x.type==="in" ? "+" : "−";
          return '<div style="display:flex;justify-content:space-between;padding:9px 11px;background:rgba(0,0,0,.2);border-radius:9px;margin-bottom:5px">'
            +'<div><div style="font-size:12px;font-weight:700">'+esc(x.desc||"Buchung")+'</div><div style="font-size:9.5px;color:var(--text-mute);margin-top:2px">'+esc(x.date||"")+'</div></div>'
            +'<div style="font-weight:900;color:'+color+';font-family:ui-monospace,monospace">'+sign+' '+x.amount.toFixed(2)+'€</div>'
            +'</div>';
        }).join("");
      }
      renderList();

      el.querySelector("#fin_add").addEventListener("click", function(){
        var desc = el.querySelector("#fin_desc").value.trim();
        var amt = parseFloat(el.querySelector("#fin_amt").value);
        var type = el.querySelector("#fin_type").value;
        if(!desc || isNaN(amt) || amt<=0){ toast("⚠️ Beschreibung und Betrag nötig","err"); return; }
        var t = Storage.get("fin_trans", []);
        var d = new Date();
        t.push({ desc:desc, amount:amt, type:type, date:d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear(), t:Date.now() });
        Storage.set("fin_trans", t);
        toast("💾 Buchung gespeichert","ok");
        MODULES.finanzen.render(el);
      });
    }
  },

  /* Platzhalter für alle anderen 17 Apps — werden später ausgebaut */
  _placeholder: {
    render: function(el, app){
      el.innerHTML = '<div class="placeholder">'
        +'<div class="big">'+app.ico+'</div>'
        +'<div style="font-size:14px;font-weight:800;color:var(--p1);margin-bottom:6px">'+esc(app.name)+'</div>'
        +'<div style="margin-bottom:14px">'+esc(app.desc)+'</div>'
        +'<div style="font-size:10px;color:var(--text-mute)">🚧 Wird in einer der nächsten Runden ausgebaut</div>'
        +'</div>';
    }
  }
};

function getModule(appId){
  return MODULES[appId] || MODULES._placeholder;
}

/* ═══════════════ SETTINGS ENGINE ═══════════════ */
var Settings = {
  _cache: null,
  defaults: {
    theme: "kosmos",
    cyborg: false,
    lang: "de",
    userName: "Bruder"
  },
  load: function(){
    var d = this.defaults;
    var s = Storage.get("settings", {});
    this._cache = Object.assign({}, d, s);
    return this._cache;
  },
  get: function(k){ if(!this._cache) this.load(); return this._cache[k]; },
  set: function(k, v){
    if(!this._cache) this.load();
    this._cache[k] = v;
    Storage.set("settings", this._cache);
    this.apply();
  },
  apply: function(){
    var s = this._cache;
    /* Theme */
    var bg = $("bgLayer");
    bg.classList.remove("mode-kosmos","mode-erde","mode-holo");
    bg.classList.add("mode-"+s.theme);
    document.body.classList.toggle("cyborg", !!s.cyborg);
    document.body.classList.toggle("holo-off", s.theme==="holo");
    /* Theme-Switcher im Settings-Panel markieren */
    document.querySelectorAll("[data-theme]").forEach(function(t){
      t.classList.toggle("active", t.dataset.theme===s.theme);
    });
    var csw = $("cyborgSw");
    if(csw) csw.classList.toggle("on", !!s.cyborg);
    var ls = $("langSel");
    if(ls) ls.value = s.lang;
    var un = $("userName");
    if(un) un.textContent = s.userName;
    /* Background Engine neu starten */
    if(window.BG) window.BG.setTheme(s.theme);
  }
};

/* ═══════════════ BACKGROUND ENGINE ═══════════════ */
var BG = (function(){
  var canvas, ctx, w, h, animId;
  var theme = "kosmos";

  /* Kosmos: Sonne + 12 Planeten */
  var planets = [
    {r:40, d:100, speed:0.008, size:4, color:"#a87c5a"},       // Merkur
    {r:60, d:140, speed:0.006, size:6, color:"#e8c888"},       // Venus
    {r:80, d:180, speed:0.005, size:7, color:"#4a8fd8"},       // Erde
    {r:100, d:220, speed:0.004, size:6, color:"#c1440e"},      // Mars
    {r:130, d:280, speed:0.003, size:12, color:"#c88b4a"},     // Jupiter
    {r:160, d:340, speed:0.0025, size:10, color:"#d8b478"},    // Saturn
    {r:190, d:400, speed:0.002, size:9, color:"#78c8d8"},      // Uranus
    {r:220, d:460, speed:0.0018, size:9, color:"#4a7cc8"},     // Neptun
    {r:250, d:520, speed:0.0015, size:4, color:"#b8b8b8"},     // Pluto
    {r:280, d:580, speed:0.0012, size:11, color:"#7c5aff"},    // Planet X
    {r:310, d:640, speed:0.001, size:8, color:"#ff78c8"},      // Halo
    {r:340, d:700, speed:0.0008, size:6, color:"#78ffc8"}      // Nova
  ];
  var t = 0;
  var stars = [];

  function initStars(){
    stars = [];
    for(var i=0;i<120;i++){
      stars.push({
        x: Math.random(), y: Math.random(),
        size: Math.random()*1.5+0.3,
        speed: Math.random()*0.0003+0.0001
      });
    }
  }

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function drawKosmos(){
    ctx.fillStyle = "#02040a";
    ctx.fillRect(0,0,w,h);

    /* Sterne */
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      s.x += s.speed;
      if(s.x>1) s.x = 0;
      var alpha = 0.5 + Math.sin(t*2 + i)*0.5;
      ctx.fillStyle = "rgba(180,220,255,"+alpha+")";
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.size, 0, Math.PI*2);
      ctx.fill();
    }

    /* Sonne in der Mitte */
    var cx = w/2, cy = h/2;
    var sunGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,90);
    sunGrad.addColorStop(0,"#fff5d0");
    sunGrad.addColorStop(0.3,"#ffc050");
    sunGrad.addColorStop(0.7,"rgba(255,140,40,.4)");
    sunGrad.addColorStop(1,"transparent");
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(cx,cy,90,0,Math.PI*2);
    ctx.fill();

    /* Planeten */
    for(var p=0;p<planets.length;p++){
      var pl = planets[p];
      var ang = t * pl.speed * 60 + p * 0.5;
      var scale = Math.min(1, Math.min(w,h)/900);
      var orbitR = pl.d * scale;
      var px = cx + Math.cos(ang) * orbitR;
      var py = cy + Math.sin(ang) * orbitR;

      /* Orbit-Spur */
      ctx.strokeStyle = "rgba(0,229,255,.05)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx,cy,orbitR,0,Math.PI*2);
      ctx.stroke();

      /* Planet */
      ctx.fillStyle = pl.color;
      ctx.shadowBlur = 12;
      ctx.shadowColor = pl.color;
      ctx.beginPath();
      ctx.arc(px, py, pl.size * scale, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    t += 1;
  }

  function drawErde(){
    ctx.fillStyle = "#02040a";
    ctx.fillRect(0,0,w,h);

    /* Sterne */
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      ctx.fillStyle = "rgba(180,220,255,0.6)";
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.size, 0, Math.PI*2);
      ctx.fill();
    }

    /* Erde in der Mitte */
    var cx = w/2, cy = h/2;
    var R = Math.min(w,h)*0.35;

    /* Atmosphäre */
    var atm = ctx.createRadialGradient(cx,cy,R*0.8,cx,cy,R*1.3);
    atm.addColorStop(0,"rgba(100,180,255,.4)");
    atm.addColorStop(1,"transparent");
    ctx.fillStyle = atm;
    ctx.beginPath();
    ctx.arc(cx,cy,R*1.3,0,Math.PI*2);
    ctx.fill();

    /* Globus */
    var globe = ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
    globe.addColorStop(0,"#6fa8dc");
    globe.addColorStop(0.5,"#2c5f8a");
    globe.addColorStop(1,"#0a2540");
    ctx.fillStyle = globe;
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fill();

    /* Kontinente (vereinfacht, rotierend) */
    var rot = t * 0.005;
    for(var k=0;k<6;k++){
      var ang = k * (Math.PI*2/6) + rot;
      var dx = Math.cos(ang);
      if(dx < -0.2) continue; /* nur sichtbare Seite */
      var px = cx + Math.sin(ang) * R * 0.7;
      var py = cy + (Math.sin(k*1.7)*0.3) * R;
      var size = R * 0.15;
      ctx.fillStyle = "rgba(60,120,60,.7)";
      ctx.beginPath();
      ctx.ellipse(px, py, size, size*0.7, 0, 0, Math.PI*2);
      ctx.fill();
    }

    /* Glow-Rand */
    ctx.strokeStyle = "rgba(100,180,255,.6)";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 30;
    ctx.shadowColor = "#4da8ff";
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur = 0;

    t += 1;
  }

  function drawHolo(){
    /* Nur Sterne + Grid (CSS macht den Rest) */
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var alpha = 0.3 + Math.sin(t*3 + i)*0.3;
      ctx.fillStyle = "rgba(0,229,255,"+alpha+")";
      ctx.beginPath();
      ctx.arc(s.x*w, s.y*h, s.size*0.7, 0, Math.PI*2);
      ctx.fill();
    }
    t += 1;
  }

  function loop(){
    if(theme==="kosmos") drawKosmos();
    else if(theme==="erde") drawErde();
    else drawHolo();
    animId = requestAnimationFrame(loop);
  }

  return {
    init: function(){
      canvas = $("bgCanvas");
      ctx = canvas.getContext("2d");
      resize();
      initStars();
      window.addEventListener("resize", resize);
      if(animId) cancelAnimationFrame(animId);
      loop();
    },
    setTheme: function(th){ theme = th; }
  };
})();

/* ═══════════════ WINDOW MANAGER ═══════════════ */
var Windows = {
  zIndexBase: 100,
  active: null,
  open: function(appId){
    var app = APPS.find(function(a){ return a.id===appId; });
    if(!app) return;
    /* Schon offen? Nach vorne holen */
    var existing = document.querySelector('.window[data-app="'+appId+'"]');
    if(existing){
      this.focus(existing);
      return;
    }
    /* Fenster erstellen */
    var win = document.createElement("div");
    win.className = "window focused";
    win.dataset.app = appId;
    win.style.width = Math.min(window.innerWidth-40, 480)+"px";
    win.style.height = Math.min(window.innerHeight-140, 560)+"px";
    win.style.left = Math.max(20, (window.innerWidth - 480)/2 + (Math.random()*40-20))+"px";
    win.style.top = Math.max(70, 80 + (Math.random()*30-15))+"px";
    win.style.zIndex = ++this.zIndexBase;

    win.innerHTML =
      '<div class="titlebar">'
        +'<span class="ico">'+app.ico+'</span>'
        +'<span class="title">'+esc(app.name)+'</span>'
        +'<div class="wbtns">'
          +'<button class="wbtn" data-wbtn="min" title="Minimieren">—</button>'
          +'<button class="wbtn close" data-wbtn="close" title="Schließen">✕</button>'
        +'</div>'
      +'</div>'
      +'<div class="wbody" id="wbody_'+appId+'"></div>'
      +'<div class="resizer"></div>';

    $("desktop").appendChild(win);

    /* Modul rendern */
    var body = win.querySelector(".wbody");
    var mod = getModule(appId);
    try{ mod.render(body, app); }
    catch(e){ body.innerHTML = '<div class="placeholder">❌ Fehler: '+esc(e.message)+'</div>'; }

    this.bindWindow(win);
    this.focus(win);
    return win;
  },

  bindWindow: function(win){
    var self = this;
    /* Focus bei Klick */
    win.addEventListener("mousedown", function(){ self.focus(win); });
    win.addEventListener("touchstart", function(){ self.focus(win); }, {passive:true});

    /* Buttons */
    win.querySelectorAll("[data-wbtn]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        if(b.dataset.wbtn==="close") self.close(win);
        if(b.dataset.wbtn==="min") self.minimize(win);
      });
    });

    /* Drag */
    var tb = win.querySelector(".titlebar");
    var dragging = false, sx=0, sy=0, ox=0, oy=0;
    function startDrag(e){
      if(e.target.closest(".wbtn")) return;
      dragging = true;
      var p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY;
      ox = parseInt(win.style.left) || 0;
      oy = parseInt(win.style.top) || 0;
      self.focus(win);
      e.preventDefault();
    }
    function moveDrag(e){
      if(!dragging) return;
      var p = e.touches ? e.touches[0] : e;
      var dx = p.clientX - sx, dy = p.clientY - sy;
      var nx = Math.max(-100, Math.min(window.innerWidth-100, ox+dx));
      var ny = Math.max(56, Math.min(window.innerHeight-100, oy+dy));
      win.style.left = nx+"px";
      win.style.top = ny+"px";
    }
    function endDrag(){ dragging = false; }
    tb.addEventListener("mousedown", startDrag);
    tb.addEventListener("touchstart", startDrag, {passive:false});
    document.addEventListener("mousemove", moveDrag);
    document.addEventListener("touchmove", moveDrag, {passive:false});
    document.addEventListener("mouseup", endDrag);
    document.addEventListener("touchend", endDrag);

    /* Resize */
    var rs = win.querySelector(".resizer");
    var resizing = false, rsx=0, rsy=0, rw=0, rh=0;
    rs.addEventListener("mousedown", function(e){
      resizing = true;
      rsx = e.clientX; rsy = e.clientY;
      rw = win.offsetWidth; rh = win.offsetHeight;
      e.preventDefault();
    });
    rs.addEventListener("touchstart", function(e){
      resizing = true;
      var p = e.touches[0];
      rsx = p.clientX; rsy = p.clientY;
      rw = win.offsetWidth; rh = win.offsetHeight;
      e.preventDefault();
    }, {passive:false});
    function moveResize(e){
      if(!resizing) return;
      var p = e.touches ? e.touches[0] : e;
      var nw = Math.max(280, rw + (p.clientX - rsx));
      var nh = Math.max(220, rh + (p.clientY - rsy));
      win.style.width = nw+"px";
      win.style.height = nh+"px";
    }
    function endResize(){ resizing = false; }
    document.addEventListener("mousemove", moveResize);
    document.addEventListener("touchmove", moveResize, {passive:false});
    document.addEventListener("mouseup", endResize);
    document.addEventListener("touchend", endResize);
  },

  focus: function(win){
    document.querySelectorAll(".window").forEach(function(w){ w.classList.remove("focused"); });
    win.classList.add("focused");
    win.classList.remove("minimized");
    win.style.zIndex = ++this.zIndexBase;
    this.active = win;
  },

  minimize: function(win){
    win.classList.add("minimized");
  },

  close: function(win){
    win.remove();
  },

  closeAll: function(){
    document.querySelectorAll(".window").forEach(function(w){ w.remove(); });
  }
};

/* ═══════════════ HOMESCREEN / APP GRID ═══════════════ */
function renderApps(filter){
  var grid = $("appGrid");
  if(!grid) return;
  var list = APPS.filter(function(a){ return !a.primary; });
  if(filter === "favorites"){
    var favs = Storage.get("favorites", []);
    list = list.filter(function(a){ return favs.indexOf(a.id)>=0; });
  }
  grid.innerHTML = list.map(function(a){
    return '<div class="tile" data-open-app="'+a.id+'">'
      +'<span class="ico">'+a.ico+'</span>'
      +'<span class="name">'+esc(a.name)+'</span>'
      +'<span class="cat">'+esc(a.cat)+'</span>'
      +'</div>';
  }).join("");
}

/* ═══════════════ INITIALISIERUNG ═══════════════ */
function boot(){
  Settings.load();
  Settings.apply();
  BG.init();
  renderApps();

  /* Greeting nach Uhrzeit */
  var h = new Date().getHours();
  var g = h<6?"Gute Nacht":h<11?"Guten Morgen":h<17?"Guten Tag":h<22?"Guten Abend":"Gute Nacht";
  $("greeting").textContent = g;

  /* Top-Bar */
  $("logoBtn").addEventListener("click", function(){
    $("sidebar").classList.toggle("open");
  });
  $("settingsBtn").addEventListener("click", function(){
    $("settings").classList.add("show");
  });
  $("settingsClose").addEventListener("click", function(){
    $("settings").classList.remove("show");
  });
  $("settings").addEventListener("click", function(e){
    if(e.target === this) this.classList.remove("show");
  });
  $("themeToggle").addEventListener("click", function(){
    var order = ["kosmos","erde","holo"];
    var cur = Settings.get("theme");
    var next = order[(order.indexOf(cur)+1) % order.length];
    Settings.set("theme", next);
    toast("🎨 " + (next==="kosmos"?"Kosmos":next==="erde"?"Erde":"Holo-Blau"), "ok");
  });

  /* Sidebar-Items */
  document.querySelectorAll("[data-side]").forEach(function(b){
    b.addEventListener("click", function(){
      var s = b.dataset.side;
      document.querySelectorAll("[data-side]").forEach(function(x){ x.classList.remove("active"); });
      b.classList.add("active");
      if(s==="home" || s==="apps"){ renderApps(); }
      else if(s==="favorites"){ renderApps("favorites"); }
      else if(s==="about"){
        toast("🦚 HalDo AI OS v123 — von Bruder für Bruder", "ok");
      }
      /* Sidebar auf Handy einklappen */
      if(window.innerWidth < 700) $("sidebar").classList.remove("open");
    });
  });

  /* Alle data-open-app Elemente (Kacheln + Sidebar) */
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-open-app]");
    if(el){
      var id = el.dataset.openApp;
      Windows.open(id);
      if(window.innerWidth < 700) $("sidebar").classList.remove("open");
    }
  });

  /* Settings - Theme-Karten */
  document.querySelectorAll("[data-theme]").forEach(function(el){
    el.addEventListener("click", function(){
      Settings.set("theme", el.dataset.theme);
      toast("🎨 " + el.dataset.theme, "ok");
    });
  });

  /* Cyborg-Schalter */
  $("cyborgSw").addEventListener("click", function(){
    Settings.set("cyborg", !Settings.get("cyborg"));
    toast(Settings.get("cyborg") ? "⚡ CYBORG aktiv" : "🤖 AI-Modus aktiv", "ok");
  });

  /* Sprache */
  $("langSel").addEventListener("change", function(){
    Settings.set("lang", this.value);
    toast("🌐 Sprache: " + this.value, "ok");
  });

  /* Bottom Bar */
  $("bbChat").addEventListener("click", function(){ toast("💬 Chat folgt in Runde 2"); });
  $("bbAI").addEventListener("click", function(){ Windows.open("haldoAI"); });
  $("bbCyborg").addEventListener("click", function(){
    Settings.set("cyborg", !Settings.get("cyborg"));
  });

  /* Backup / Reset */
  $("exportBtn").addEventListener("click", function(){
    var data = {};
    Storage.keys().forEach(function(k){ data[k] = Storage.get(k); });
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "haldo_backup_"+Date.now()+".json";
    a.click();
    toast("📤 Backup heruntergeladen", "ok");
  });
  $("resetBtn").addEventListener("click", function(){
    if(!confirm("Wirklich ALLES zurücksetzen?")) return;
    Storage.clearAll();
    location.reload();
  });

  /* Netzwerk-Status */
  function updNet(){
    $("netStatus").textContent = navigator.onLine ? "Online" : "Offline";
  }
  window.addEventListener("online", updNet);
  window.addEventListener("offline", updNet);
  updNet();

  /* Global API für spätere Module */
  window.HalDo = {
    Storage: Storage,
    Settings: Settings,
    Windows: Windows,
    APPS: APPS,
    MODULES: MODULES,
    toast: toast,
    version: "v123"
  };

  console.log("🦚 HalDo AI OS v123 gestartet");
}

/* ═══════════════ GAME-MODULE (Test) ═══════════════ */
function renderTicTacToe(el){
  var board = ["","","","","","","","",""];
  var player = "X", over = false;
  function draw(){
    el.innerHTML = '<div style="text-align:center;margin-bottom:12px;font-size:14px;font-weight:800;color:var(--p1)">'+(over?"Spiel beendet":"Spieler "+player+" ist dran")+'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto">'
      +board.map(function(v,i){
        return '<button data-ttt="'+i+'" style="aspect-ratio:1;background:rgba(0,0,0,.3);border:1px solid rgba(0,229,255,.3);border-radius:12px;font-size:36px;font-weight:900;color:'+(v==="X"?"#ff8080":"#4ade80")+';cursor:pointer;font-family:inherit">'+(v||"")+'</button>';
      }).join("")
      +'</div>'
      +'<button class="btn full" id="ttt_reset" style="margin-top:14px;max-width:300px;display:block;margin-left:auto;margin-right:auto">🔄 Neu</button>';
    el.querySelectorAll("[data-ttt]").forEach(function(b){
      b.addEventListener("click", function(){ play(parseInt(b.dataset.ttt)); });
    });
    var r = el.querySelector("#ttt_reset");
    if(r) r.addEventListener("click", function(){
      board = ["","","","","","","","",""]; player = "X"; over = false; draw();
    });
  }
  function check(){
    var wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(var i=0;i<wins.length;i++){
      var w = wins[i];
      if(board[w[0]] && board[w[0]]===board[w[1]] && board[w[1]]===board[w[2]]) return board[w[0]];
    }
    return board.indexOf("")<0 ? "D" : null;
  }
  function play(i){
    if(over || board[i]) return;
    board[i] = player;
    var r = check();
    if(r){
      over = true;
      toast(r==="D" ? "🤝 Unentschieden" : "🎉 "+r+" gewinnt!", r==="D"?"":"ok");
    } else {
      player = player==="X" ? "O" : "X";
    }
    draw();
  }
  draw();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

})();
