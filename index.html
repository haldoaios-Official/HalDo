<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<style>
:root{
  --bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050810}
body{font-family:var(--font);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ===== COSMOS ===== */
#cosmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 30%, #1a0b2e 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, #0d1b2a 0%, transparent 50%),
    radial-gradient(ellipse at 50% 100%, #0f172a 0%, transparent 70%),
    linear-gradient(180deg,#050810 0%,#0a0e1a 60%,#0d1528 100%);
}
#stars-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sun{position:absolute;top:10%;right:12%;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,#fff7ed 0%,#fde68a 20%,#fbbf24 50%,#f97316 80%,transparent 100%);
  box-shadow:0 0 80px #f59e0b,0 0 160px #f97316,0 0 300px rgba(249,115,22,.6);
  animation:sunPulse 4s ease-in-out infinite;z-index:2;
}
.moon{position:absolute;top:25%;left:12%;width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#f8fafc,#e2e8f0 50%,#94a3b8 90%,#64748b 100%);
  box-shadow:inset -15px -15px 30px rgba(0,0,0,.6),0 0 60px rgba(226,232,240,.7);
  animation:moonFloat 8s ease-in-out infinite;z-index:2;
}
.galaxy{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);
  width:900px;height:180px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(139,92,246,.35) 0%,rgba(6,182,212,.2) 30%,rgba(236,72,153,.1) 60%,transparent 100%);
  filter:blur(30px);opacity:.7;z-index:1;
  animation:galaxyDrift 20s ease-in-out infinite alternate;
}
#earth-canvas{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
  width:min(500px,70vw);height:min(500px,70vw);z-index:3;
  filter:drop-shadow(0 0 80px rgba(59,130,246,.8)) drop-shadow(0 0 200px rgba(37,99,235,.4));
}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes galaxyDrift{from{transform:translate(-50%,-50%) rotate(-15deg) scale(1)}to{transform:translate(-50%,-50%) rotate(-10deg) scale(1.1)}}

/* ===== WELCOME ===== */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9998;gap:22px;padding:40px;text-align:center;background:rgba(5,8,16,.3)}
#welcome h1{font-size:clamp(30px,5.5vw,64px);font-weight:900;letter-spacing:4px;animation:fadeUp 1s ease-out;
  background:linear-gradient(90deg,#fbbf24,#f59e0b,#fde047,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 20px rgba(251,191,36,.6),0 0 40px rgba(245,158,11,.4);
}
#welcome h2{font-size:clamp(16px,2vw,22px);color:#e5e7eb;font-weight:400;line-height:1.6;animation:fadeUp 1s ease-out .2s both;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;animation:fadeUp 1s ease-out .4s both;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#welcome .presented b{color:#fbbf24;font-weight:700}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s;animation:fadeUp 1s ease-out .6s both}
#welcome .enter-btn:hover{transform:scale(1.05);box-shadow:0 0 60px rgba(6,182,212,.9)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== APP SHELL ===== */
#app{display:none;position:relative;z-index:1;height:100vh;width:100vw;background:rgba(10,14,26,.85);backdrop-filter:blur(10px)}
#app.active{display:flex}
#sidebar{width:80px;background:rgba(17,24,39,.95);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:10px;transition:width .25s;backdrop-filter:blur(10px)}
#sidebar.expanded{width:260px;align-items:stretch;padding:16px}
#logo-wrap{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:10px;transition:background .2s}
#logo-wrap:hover{background:var(--bg3)}
#logo-img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;flex-shrink:0;overflow:hidden}
#logo-img img{width:100%;height:100%;object-fit:cover;border-radius:12px}
#logo-text{font-weight:700;font-size:16px;letter-spacing:1px;white-space:nowrap;overflow:hidden}
#sidebar:not(.expanded) #logo-text{display:none}
#sidebar-nav{flex:1;display:flex;flex-direction:column;gap:6px;width:100%;margin-top:20px;overflow-y:auto}
.nav-btn{display:flex;align-items:center;gap:14px;padding:12px;border-radius:10px;transition:all .2s;color:var(--dim);text-align:left;width:100%}
.nav-btn:hover{background:var(--bg3);color:var(--text)}
.nav-btn.active{background:linear-gradient(90deg,rgba(6,182,212,.2),rgba(59,130,246,.1));color:var(--accent);border-left:3px solid var(--accent)}
.nav-btn .icon{font-size:20px;flex-shrink:0}
.nav-btn .label{white-space:nowrap;overflow:hidden}
#sidebar:not(.expanded) .nav-btn{justify-content:center;padding:14px}
#sidebar:not(.expanded) .nav-btn .label{display:none}
#sidebar:not(.expanded) .nav-btn.active{border-left:none;border-bottom:2px solid var(--accent)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:60px;background:rgba(17,24,39,.9);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px}
#topbar h2{font-size:16px;font-weight:600}
#topbar .spacer{flex:1}
#topbar .clock{color:var(--dim);font-size:13px}
#content{flex:1;overflow-y:auto;padding:24px}

/* ===== KATEGORIEN (Hauptmenü) ===== */
.category-title{font-size:16px;color:var(--accent);margin:20px 0 12px 0;font-weight:600;display:flex;align-items:center;gap:10px}
.category-title::after{content:'';flex:1;height:1px;background:var(--border)}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.app-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:all .2s;text-align:center;backdrop-filter:blur(5px)}
.app-card:hover{background:rgba(31,41,55,.95);border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(6,182,212,.2)}
.app-card .ico{font-size:32px}
.app-card .nm{font-size:12px;font-weight:500}

/* ===== ANATOMY ===== */
#anatomy-canvas-wrap{position:relative;width:100%;height:calc(100vh - 240px);min-height:400px;background:radial-gradient(circle at 50% 50%,#0f2233 0%,#0a0e1a 100%);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
#anatomy-canvas-wrap canvas{display:block}
.anatomy-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);font-size:13px;transition:all .2s;color:var(--text)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:hover:not(.active){border-color:var(--accent);color:var(--accent)}
#anatomy-status{position:absolute;top:12px;left:12px;right:12px;background:rgba(0,0,0,.85);padding:10px 14px;border-radius:8px;font-size:13px;color:var(--accent);z-index:5;border:1px solid rgba(6,182,212,.3);display:none}
#anatomy-status.show{display:block}
.load-folder-btn{background:linear-gradient(90deg,var(--success),#059669);color:#fff;font-weight:700;padding:12px 24px;border-radius:30px;font-size:14px;box-shadow:0 4px 15px rgba(16,185,129,.4);transition:transform .2s;margin:20px 0}
.load-folder-btn:hover{transform:scale(1.05)}

/* ===== LISTS / PANELS ===== */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;backdrop-filter:blur(5px)}
.panel h3{font-size:15px;margin-bottom:12px;color:var(--accent)}
.panel .desc{color:var(--dim);font-size:13px;margin-bottom:12px}
.panel .desc code{background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;color:var(--accent);font-family:monospace;font-size:12px}
.btn{padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3);color:var(--text)}
.btn.ghost:hover{background:var(--border)}
.btn.danger{background:var(--danger)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.list-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.list-item:hover{background:rgba(31,41,55,.95);border-color:var(--accent)}
.list-item .title{font-weight:600;margin-bottom:4px}
.list-item .meta{color:var(--dim);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.blue{background:rgba(6,182,212,.2);color:var(--accent)}

/* ===== SETTINGS ===== */
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info{flex:1}
.settings-row .info .lbl{font-weight:600;margin-bottom:4px}
.settings-row .info .sub{color:var(--dim);font-size:12px}
.settings-row .ctrl{flex-shrink:0;margin-left:16px;min-width:200px}
.settings-row .ctrl input,.settings-row .ctrl select{width:auto;min-width:200px}

/* ===== DASHBOARD ===== */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-card .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-card .val{font-size:28px;font-weight:700;color:var(--accent)}
.stat-card .unit{font-size:13px;color:var(--dim);margin-left:4px}
.calc-display{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;font-size:32px;text-align:right;font-weight:600;margin-bottom:12px;min-height:70px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{padding:18px;font-size:18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-weight:600}
.calc-grid button.op{color:var(--accent)}
.calc-grid button.eq{background:var(--accent);color:#fff}
.emergency-btn{display:flex;align-items:center;justify-content:center;width:100%;height:200px;background:linear-gradient(135deg,#dc2626,#ef4444);border-radius:20px;font-size:48px;font-weight:900;color:#fff;letter-spacing:4px;box-shadow:0 0 40px rgba(239,68,68,.4);cursor:pointer}
.hint{color:var(--dim);font-size:12px;margin-top:8px;font-style:italic}
.empty{color:var(--dim);text-align:center;padding:40px;font-style:italic}

/* ===== APP SPLASH ===== */
#app-splash{position:fixed;inset:0;z-index:9997;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;background:radial-gradient(circle at 50% 50%, rgba(6,182,212,.18) 0%, rgba(5,8,16,.95) 75%);backdrop-filter:blur(8px)}
#app-splash.show{display:flex;animation:splashIn .3s ease-out}
.splash-icon{font-size:130px;filter:drop-shadow(0 0 50px #06b6d4);animation:starGlow 1.2s ease-out}
.splash-name{font-size:34px;font-weight:800;background:linear-gradient(90deg,#06b6d4,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:3px}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg)}50%{transform:scale(1.3) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
</style>
</head>

<script>
/* ================= STERNE ================= */
function initStars(){
  const cv = document.getElementById('stars-canvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  let W, H;
  function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const stars = [];
  for(let i = 0; i < 300; i++){
    stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.8+0.5, a:Math.random(), da:(Math.random()-0.5)*0.02});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.a += s.da; if(s.a > 1 || s.a < 0.1) s.da *= -1;
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
}
initStars();

/* ================= 3D ERDE ================= */
function initWelcomeEarth(){
  const canvas = document.getElementById('earth-canvas');
  if(!canvas || !window.THREE) return;
  const size = Math.min(500, window.innerWidth * 0.7);
  canvas.width = size; canvas.height = size;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  cam.position.set(0, 0, 3.2);
  const ren = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true});
  ren.setSize(size, size); ren.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const geo = new THREE.SphereGeometry(1, 64, 64);
  const mat = new THREE.MeshPhongMaterial({color:0x3b82f6, emissive:0x0a1e3a, emissiveIntensity:0.4, shininess:10});
  const earth = new THREE.Mesh(geo, mat);
  earth.rotation.z = 0.41;
  scene.add(earth);

  const texLoader = new THREE.TextureLoader();
  texLoader.setCrossOrigin('anonymous');
  texLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
    tex => { mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true; },
    undefined,
    () => {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const cx = c.getContext('2d');
      const g = cx.createLinearGradient(0, 0, 0, 512);
      g.addColorStop(0, '#1e40af'); g.addColorStop(0.5, '#3b82f6'); g.addColorStop(1, '#1e40af');
      cx.fillStyle = g; cx.fillRect(0, 0, 1024, 512);
      cx.fillStyle = '#16a34a';
      for(let i = 0; i < 30; i++){
        cx.beginPath(); cx.ellipse(Math.random()*1024, Math.random()*512, 40+Math.random()*120, 25+Math.random()*70, Math.random()*Math.PI, 0, Math.PI*2); cx.fill();
      }
      mat.map = new THREE.CanvasTexture(c); mat.color.set(0xffffff); mat.needsUpdate = true;
    }
  );

  const atmGeo = new THREE.SphereGeometry(1.06, 64, 64);
  const atmMat = new THREE.MeshBasicMaterial({color:0x60a5fa, transparent:true, opacity:0.15, side:THREE.BackSide});
  scene.add(new THREE.Mesh(atmGeo, atmMat));

  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const sunLight = new THREE.DirectionalLight(0xfff8e1, 1.8); sunLight.position.set(5, 3, 5); scene.add(sunLight);
  const fillLight = new THREE.DirectionalLight(0x3b82f6, 0.3); fillLight.position.set(-5, -3, -5); scene.add(fillLight);

  (function anim(){ requestAnimationFrame(anim); earth.rotation.y += 0.003; ren.render(scene, cam); })();
}
initWelcomeEarth();

function viewAnatomy(c){
  c.innerHTML = `

  `;

function initAnatomyScene(){
  const wrap = document.getElementById('anatomy-canvas-wrap');
  if(!wrap || !window.THREE) return;
  if(A.init){
    const w2 = wrap.clientWidth, h2 = wrap.clientHeight;
    wrap.appendChild(A.ren.domElement);
    A.ren.setSize(w2, h2);
    A.cam.aspect = w2/h2; A.cam.updateProjectionMatrix();
    return;
  }
  A.init = true;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  A.scene = new THREE.Scene();
  A.cam = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
  A.cam.position.set(0, 1.2, 4);
  A.ren = new THREE.WebGLRenderer({antialias:true, alpha:true});
  A.ren.setSize(w, h);
  A.ren.setPixelRatio(window.devicePixelRatio);
  A.ren.setClearColor(0x000000, 0);
  wrap.appendChild(A.ren.domElement);
  A.ctrl = new THREE.OrbitControls(A.cam, A.ren.domElement);
  A.ctrl.target.set(0, 1, 0);
  A.ctrl.enableDamping = true;
  A.scene.add(new THREE.AmbientLight(0xffffff, .7));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.2); d1.position.set(3, 4, 3); A.scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x06b6d4, .8); d2.position.set(-3, -2, -2); A.scene.add(d2);
  const grid = new THREE.GridHelper(6, 12, 0x1f2937, 0x111827);
  A.scene.add(grid);
  A.loader = new THREE.GLTFLoader();
  (function loop(){ requestAnimationFrame(loop); A.ctrl.update(); A.ren.render(A.scene, A.cam); })();
  window.addEventListener('resize', () => {
    const w2 = wrap.clientWidth, h2 = wrap.clientHeight;
    if(A.cam && A.ren){ A.cam.aspect = w2/h2; A.cam.updateProjectionMatrix(); A.ren.setSize(w2, h2); }
  });
}

function clearCurrent(){
  if(A.current){
    A.scene.remove(A.current);
    A.current.traverse(o => { if(o.isMesh){ if(o.geometry) o.geometry.dispose(); if(o.material){ if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose()); else o.material.dispose(); } } });
    A.current = null;
  }
}

function pickBoneFolder(){
  const picker = document.getElementById('bones-picker');
  picker.onchange = handleBoneFiles;
  picker.click();
}

async function handleBoneFiles(e){
  const files = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.glb'));
  if(!files.length){ alert('Keine GLB-Dateien im Ordner gefunden.'); return; }
  const status = document.getElementById('anatomy-status');
  status.classList.add('show');
  if(!A.scene){ await new Promise(r => setTimeout(r, 300)); }
  clearCurrent();
  status.textContent = `Lade ${files.length} Knochen …`;
  const group = new THREE.Group();
  let ok = 0, fail = 0, processed = 0;
  const BATCH = 10;
  
  for(let i = 0; i < files.length; i += BATCH){
    const batch = files.slice(i, i + BATCH);
    await Promise.all(batch.map(async f => {
      const url = URL.createObjectURL(f);
      try{
        const gltf = await new Promise((res, rej) => A.loader.load(url, res, undefined, rej));
        group.add(gltf.scene);
        ok++;
      }catch(err){ fail++; }
      URL.revokeObjectURL(url);
      processed++;
    }));
    status.textContent = `Lade Knochen … ${processed}/${files.length}`;
  }
  
  // Gesamtes Skelett zentrieren und skalieren
  const box = new THREE.Box3().setFromObject(group);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  group.position.sub(center); group.position.y += size.y/2;
  if(size.y > 0) group.scale.setScalar(1.75 / size.y);
  group.traverse(o => { if(o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
  
  A.scene.add(group);
  A.current = group;
  status.innerHTML = `✅ <b>${ok}</b> Knochen geladen${fail?`, <span style="color:#f59e0b">${fail} fehlgeschlagen</span>`:''}.`;
  A.cam.position.set(0, 1.2, 4);
  A.ctrl.target.set(0, 1, 0);
}

// Fallback: Falls der Nutzer nur kurz testen will, laden wir ein Standard-Modell aus dem Netz
function loadFallbackAnatomy(){
  const status = document.getElementById('anatomy-status');
  status.classList.add('show');
  status.textContent = 'Lade Fallback-Testmodell…';
  clearCurrent();
  // Xbot von Three.js (bekanntes Testmodell)
  A.loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', (gltf) => {
    const m = gltf.scene;
    const box = new THREE.Box3().setFromObject(m);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    m.position.sub(center); m.position.y += size.y/2;
    m.scale.setScalar(1.75 / size.y);
    m.traverse(o => { if(o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
    A.scene.add(m); A.current = m;
    status.textContent = '✅ Fallback-Modell (Xbot) geladen. (Das ist nur ein Test, um die 3D-Ansicht zu prüfen.)';
    A.cam.position.set(0, 1.2, 4); A.ctrl.target.set(0, 1, 0);
  }, undefined, () => {
    status.textContent = '❌ Fallback-Modell konnte nicht geladen werden.';
  });
}

function resetAnatomyCam(){

}

/* ================= SPLASH & TÖNE ================= */
let audioCtx = null;
function playTone(type){
  if(type === 'silent') return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const patterns = {
      chime: [{f:880,t:'sine'},{f:1320,t:'sine'}],
      beep: [{f:1000,t:'square'}],
      bell: [{f:660,t:'triangle'},{f:990,t:'triangle'},{f:1320,t:'triangle'}]
    };
    const notes = patterns[type] || patterns.chime;
    let t = 0;
    notes.forEach(n => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = n.f; o.type = n.t;
      const st = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.14, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.28);
      o.start(st); o.stop(st + 0.32);
      t += 0.14;
    });
  }catch(e){}
}
