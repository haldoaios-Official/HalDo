<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="HalDo AI OS — Dein persönliches KI-Betriebssystem">
  <title>🦚 HalDo AI OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦚</text></svg>">

  <!-- ═══════════════════════════════════════════════════════
       GLOBAL STYLES
       ═══════════════════════════════════════════════════════ -->
  <style>
    :root {
      --p1: #00e5ff;
      --p2: #4da8ff;
      --p3: #b478ff;
      --bg: #050810;
      --bg-2: #0a0f1a;
      --card: rgba(255,255,255,.03);
      --text: #e8ecff;
      --text-dim: #a8b0cc;
      --text-mute: #6b7390;
      --border-soft: 1px solid rgba(255,255,255,.08);
      --glow: 0 0 24px rgba(0,229,255,.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .35s ease, color .35s ease;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.2); }

    #haldo-root {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #haldo-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,.2);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.05);
      flex-shrink: 0;
      z-index: 100;
    }

    #haldo-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--p1);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #haldo-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      padding-bottom: 90px;
      scroll-behavior: smooth;
    }

    #haldo-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: var(--bg-2);
      border-right: 1px solid rgba(255,255,255,.08);
      transform: translateX(-100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 9999;
      overflow-y: auto;
      padding: 16px;
    }

    #haldo-sidebar.open { transform: translateX(0); }

    #haldo-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 9998;
    }
    #haldo-overlay.open { opacity: 1; pointer-events: auto; }

    .card {
      padding: 16px;
      background: var(--card);
      border: var(--border-soft);
      border-radius: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .card h3 {
      font-size: 15px;
      font-weight: 900;
      color: var(--p1);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field { margin-bottom: 12px; }

    .field label {
      font-size: 10.5px;
      color: var(--text-mute);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      display: block;
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 11px 12px;
      background: rgba(0,0,0,.3);
      border: var(--border-soft);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--p1);
      box-shadow: 0 0 0 3px rgba(0,229,255,.1);
    }

    .btn {
      padding: 12px 18px;
      background: linear-gradient(135deg, var(--p1), var(--p3));
      border: none;
      border-radius: 10px;
      color: #000;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
    .btn:active { transform: translateY(0); }

    .btn.sec {
      background: rgba(255,255,255,.05);
      color: var(--text);
      border: var(--border-soft);
    }

    .btn.danger {
      background: linear-gradient(135deg, #ff8080, #ff4d4d);
      color: #fff;
    }

    .btn.full { width: 100%; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      padding: 9px 14px;
      background: rgba(255,255,255,.04);
      border: var(--border-soft);
      border-radius: 10px;
      color: var(--text-dim);
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
      font-family: inherit;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--p1), var(--p3));
      color: #000;
      border-color: transparent;
    }

    #haldo-loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity .4s;
    }

    #haldo-loader.hide { opacity: 0; pointer-events: none; }

    #haldo-loader .logo {
      font-size: 72px;
      animation: haldoBounce 1.2s infinite;
    }

    #haldo-loader .txt {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-mute);
      font-weight: 800;
      letter-spacing: 2px;
    }

    @keyframes haldoBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .6; transform: scale(1.15); }
    }

    #haldo-status {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      padding: 8px 14px;
      background: rgba(0,0,0,.85);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      font-size: 10.5px;
      color: var(--text-mute);
      font-family: monospace;
      z-index: 99997;
      display: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
    }
    #haldo-status.show { display: block; }
    #haldo-status .ok { color: #4ade80; }
    #haldo-status .miss { color: #ff8080; }
  </style>
</head>
<body>

  <div id="haldo-loader">
    <div class="logo">🦚</div>
    <div class="txt">HALDO AI OS LÄDT...</div>
  </div>

  <div id="haldo-overlay"></div>
  <nav id="haldo-sidebar"></nav>

  <div id="haldo-root">
    <header id="haldo-header">
      <button id="haldo-menu" style="background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px">☰</button>
      <div id="haldo-title">🦚 HalDo AI OS</div>
      <div id="haldo-header-actions" style="display:flex;gap:8px"></div>
    </header>
    <main id="haldo-content"></main>
  </div>

  <div id="haldo-status"></div>

  <!-- ═══════════════════════════════════════════════════════
       DYNAMISCHER SCRIPT-LOADER
       Lädt alle Dateien — 404er werden ignoriert, Boot läuft trotzdem
       ═══════════════════════════════════════════════════════ -->
  <script>
  (function(){
    /* Alle Skripte in Lade-Reihenfolge */
    var SCRIPTS = [
      /* ▸ CORE */
      "runtime.js",
      "store.js",
      "voice.js",
      "notify.js",
      "apps.js",

      /* ▸ THEME (früh!) */
      "theme.js",

      /* ▸ SHELL */
      "shell.js",
      "router.js",

      /* ▸ SYSTEM-APPS */
      "settings.js",
      "system-center.js",
      "update.js",
      "backup.js",
      "recovery.js",
      "diagnostics.js",

      /* ▸ USER-APPS */
      "home.js",
      "chat.js",
      "notes.js",
      "notizen.js",
      "tasks.js",
      "kalender.js",
      "fitness.js",
      "kueche.js",
      "zuhause.js",
      "aufnahme.js",
      "kontakte.js",
      "finanzen.js",
      "wetter.js",
      "rechner.js",
      "timer.js",
      "uebersetzer.js",
      "woerterbuch.js",
      "musik.js",
      "photos.js",
      "lerne.js",
      "gesundheit.js",
      "reisen.js",
      "auto.js",
      "arbeitszeit.js",
      "posteingang.js",
      "dokumente.js",
      "passwort.js",
      "notfall.js",
      "ai.js",
      "stimmung.js",
      "bewertung.js",
      "projekte.js",
      "gewohnheiten.js",
      "links.js",
      "spiele.js",

      /* ▸ BOOT */
      "boot.js"
    ];

    var status = document.getElementById("haldo-status");
    var log = [];

    function showStatus(){
      status.classList.add("show");
      status.innerHTML = log.join("<br>");
    }

    function loadScript(src){
      return new Promise(function(resolve){
        var s = document.createElement("script");
        s.src = src;
        s.async = false;
        s.onload = function(){
          log.push('<span class="ok">✅ ' + src + '</span>');
          resolve(true);
        };
        s.onerror = function(){
          log.push('<span class="miss">⏭️ ' + src + ' (fehlt)</span>');
          resolve(false);
        };
        document.head.appendChild(s);
      });
    }

    (async function(){
      var okCount = 0, missCount = 0;

      for(var i = 0; i < SCRIPTS.length; i++){
        var ok = await loadScript(SCRIPTS[i]);
        if(ok) okCount++;
        else missCount++;
      }

      log.push('<br><b>📊 ' + okCount + ' geladen · ' + missCount + ' fehlen</b>');

      /* Loader verstecken — spätestens jetzt! */
      var loader = document.getElementById("haldo-loader");
      if(loader){
        setTimeout(function(){
          loader.classList.add("hide");
          setTimeout(function(){ loader.remove(); }, 500);
        }, 300);
      }

      /* Status-Anzeige: kurz zeigen falls was fehlt */
      if(missCount > 0){
        showStatus();
        setTimeout(function(){ status.classList.remove("show"); }, 8000);
      }

      /* Falls Boot nicht gestartet ist — manuell starten */
      setTimeout(function(){
        if(!window._haldoBooted && window.HalDo && HalDo.Apps && HalDo.Apps.open){
          try {
            console.log("🦚 Manueller Boot...");
            if(HalDo.Apps.list){
              var apps = HalDo.Apps.list();
              console.log("📱 " + apps.length + " Apps registriert");
              if(apps.length && apps[0].id){
                HalDo.Apps.open(apps[0].id);
              }
            }
          } catch(e){ console.warn("Manueller Boot fehlgeschlagen:", e); }
        }
      }, 1000);
    })();

    /* Failsafe: Loader nach 6s IMMER verstecken */
    setTimeout(function(){
      var loader = document.getElementById("haldo-loader");
      if(loader && !loader.classList.contains("hide")){
        console.warn("⚠️ Failsafe: Loader nach Timeout versteckt");
        loader.classList.add("hide");
        setTimeout(function(){ loader.remove(); }, 500);
      }
    }, 6000);
  })();
  </script>

</body>
</html>
