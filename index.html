<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>HalDo AI OS</title>
<style>
:root{
  --c1:#00e5ff;--c2:#4da8ff;--c3:#b478ff;
  --bg:#05060f;--panel:rgba(10,14,32,.75);--panel2:rgba(18,22,44,.88);
  --line:rgba(0,229,255,.28);--line2:rgba(255,255,255,.08);
  --txt:#e9edff;--dim:#8a95bd;
  --glow:0 0 12px rgba(0,229,255,.45);
  --sh:0 26px 70px rgba(0,0,0,.6);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
body.cyborg{--c1:#ff78c8;--c2:#b478ff;--c3:#d484ff;--line:rgba(255,120,200,.32);--glow:0 0 12px rgba(255,120,200,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

/* KOSMOS */
#cosmos{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(ellipse at 68% 14%,#101a3a 0%,#070a1c 45%,#03040c 100%)}
#stars{position:absolute;inset:0;display:block}
.sun{position:absolute;left:50%;top:52%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff8c8,var(--c1) 42%,var(--c3) 68%,rgba(0,0,0,0) 72%);box-shadow:0 0 70px 26px rgba(0,229,255,.32);animation:sunPulse 8s ease-in-out infinite}
@keyframes sunPulse{50%{transform:scale(1.06)}}
.orbit{position:absolute;left:50%;top:52%;border:1px solid rgba(255,255,255,.05);border-radius:50%;transform:translate(-50%,-50%);animation:spin linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.planet{position:absolute;left:50%;top:0;border-radius:50%;transform:translate(-50%,-50%)}

/* TOP-BAR */
#topbar{position:fixed;top:var(--safe-t);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1.5px solid var(--line)}
#menuBtn{display:none}
.iconbtn{background:rgba(255,255,255,.06);border:1.5px solid var(--line);color:var(--txt);width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.iconbtn:hover{background:rgba(0,229,255,.12);box-shadow:var(--glow)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:800;color:#fff;flex:0 0 auto;background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 0 14px rgba(0,229,255,.5)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:13.5px;letter-spacing:.4px;white-space:nowrap}
.sm{font-size:11px}.dim{color:var(--dim)}.spacer{flex:1}
#search{width:220px;max-width:42vw;height:40px;border-radius:12px;padding:0 12px;background:rgba(255,255,255,.06);border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13px}
#search:focus{border-color:var(--c1)}
#clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);white-space:nowrap}

/* SIDEBAR */
#sidebar{position:fixed;top:calc(var(--safe-t) + 56px);bottom:calc(var(--safe-b) + 56px);left:var(--safe-l);width:236px;z-index:8000;padding:14px 10px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1.5px solid var(--line);overflow-y:auto;transition:transform .28s}
#sidebar h4{margin:8px 4px;font-size:10.5px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;font-weight:700}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;margin-bottom:3px;background:transparent;border:1.5px solid transparent;border-radius:12px;color:var(--txt);cursor:pointer;font-size:13px;text-align:left}
.catbtn:hover{background:rgba(0,229,255,.08);border-color:var(--line)}
.catbtn .ico{font-size:16px;width:22px;text-align:center}
.catbtn .n{margin-left:auto;font-size:10.5px;color:var(--dim);padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.06)}

/* DESKTOP */
#desktop{position:fixed;top:calc(var(--safe-t) + 56px);left:calc(var(--safe-l) + 236px);right:var(--safe-r);bottom:calc(var(--safe-b) + 56px);z-index:1;overflow-y:auto;padding:18px 18px 40px}
#desktop h3{margin:22px 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--txt);font-weight:700}
#desktop h3 .n{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto;background:rgba(255,255,255,.06);padding:3px 9px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 5px;border-radius:15px;cursor:pointer;text-align:center;border:1.5px solid transparent;user-select:none}
.app:hover{background:rgba(0,229,255,.06);border-color:var(--line)}
.app:active{transform:scale(.95)}
.app .ic{font-size:26px;width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(150deg,rgba(0,229,255,.14),rgba(180,120,255,.08));border:1.5px solid var(--line)}
.app.soon .ic{opacity:.4}
.app .nm{font-size:11px;color:var(--dim);line-height:1.25;word-break:break-word}
.app.ready .nm{color:var(--txt);font-weight:500}

/* WINDOW */
.window{position:fixed;z-index:200;display:flex;flex-direction:column;overflow:hidden;background:var(--panel2);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--sh);animation:winIn .2s}
@keyframes winIn{from{opacity:0;transform:scale(.95) translateY(12px)}}
.window.maxed{left:8px!important;top:64px!important;right:8px;bottom:8px;width:auto!important;height:auto!important;border-radius:14px}
.win-head{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1.5px solid var(--line);user-select:none;touch-action:none}
.wic{font-size:16px}
.wtitle{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtns{display:flex;gap:5px;z-index:999999}
.wb{width:40px;height:40px;border-radius:11px;border:1.5px solid transparent;background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;font-size:14px;display:grid;place-items:center;z-index:999999}
.wb:hover{background:rgba(0,229,255,.15);color:var(--txt)}
.wb.close:hover{background:#e03b5a;color:#fff}
.win-body{flex:1;overflow:auto;padding:16px;position:relative}

/* BOTTOM */
#bottomBar{position:fixed;bottom:var(--safe-b);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1.5px solid var(--line)}
.bbtn{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500}
.bbtn:hover{background:rgba(0,229,255,.14)}
.bbtn.on{background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;border-color:var(--c1)}

/* UI */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.big{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.05}
.big2{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{padding:9px 15px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.btn:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#fff;font-weight:600}
.btn.danger{background:rgba(224,59,90,.16);border-color:rgba(224,59,90,.5);color:#ff9db1}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.card{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.045);border:1.5px solid var(--line);font-size:13px}
.inp,.ta{width:100%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.055);border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13.5px;font-family:inherit}
.inp:focus,.ta:focus{border-color:var(--c1)}
.ta{min-height:150px;resize:vertical;line-height:1.5}
.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:4px;display:block}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.045);border:1.5px solid var(--line2);font-size:13px}
.item .x{margin-left:auto;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.item .x:hover{background:rgba(224,59,90,.2);color:#ff9db1}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:22px 10px;font-style:italic}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translate(-50%,140%);z-index:9999;padding:11px 18px;border-radius:13px;background:rgba(10,14,32,.96);border:1.5px solid var(--line);font-size:13px;transition:transform .3s;max-width:88vw;text-align:center}
#toast.on{transform:translate(-50%,0)}

@media(max-width:820px){
#menuBtn{display:grid}
#sidebar{transform:translateX(-105%)}
#sidebar.open{transform:translateX(0);box-shadow:14px 0 40px rgba(0,0,0,.55)}
#desktop{left:var(--safe-l);padding:14px 12px 30px}
.brand{display:none}
#search{width:auto;flex:1;max-width:none}
#clock{display:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.app .ic{width:48px;height:48px;font-size:24px}
.window{border-radius:0!important}
.win-body{padding:13px}
#bottomBar{gap:5px;padding:0 8px}
.bbtn{padding:9px 10px;font-size:12px}
.bbtn span.lbl-txt{display:none}
}
</style>
</head>
<body>

<div id="cosmos"><canvas id="stars"></canvas></div>

<header id="topbar">
  <button id="menuBtn" class="iconbtn">☰</button>
  <div class="logo" id="logoBtn">🦚</div>
  <div class="brand"><b>HalDo AI OS</b><span id="appcount" class="dim sm">…</span></div>
  <div class="spacer"></div>
  <input id="search" placeholder="Apps suchen…" autocomplete="off">
  <div id="clock" class="dim"></div>
  <button class="iconbtn" id="themeBtn">⚡</button>
</header>

<aside id="sidebar"></aside>
<main id="desktop"></main>

<div id="bottomBar">
  <button class="bbtn" data-act="chat">💬 <span class="lbl-txt">Chat</span></button>
  <button class="bbtn" data-act="ai">🤖 <span class="lbl-txt">AI</span></button>
  <button class="bbtn cyborg" data-act="cyborg">⚡ <span class="lbl-txt">CYBORG</span></button>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* ========================================================================
   HILFEN
   ======================================================================== */
var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var el = function(t,c,txt){ var e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };
var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var slug = function(s){ return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); };
var uid = function(){ return Math.random().toString(36).slice(2,10); };
var pad = function(n,l){ l=l||2; return String(n).padStart(l,'0'); };
var fmt = function(n){ return (Math.round(n*100)/100).toLocaleString('de-DE'); };
var rnd = function(a,b){ return Math.floor(Math.random()*(b-a+1))+a; };
var shuf = function(a){ return a.slice().sort(function(){ return Math.random()-.5; }); };

/* ========================================================================
   STORAGE
   ======================================================================== */
var store = {
  key: function(k){ return 'haldo_'+k+'_v1'; },
  get: function(k,d){ try{ var v=localStorage.getItem(this.key(k)); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set: function(k,v){ try{ localStorage.setItem(this.key(k), JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(this.key(k)); }catch(e){} }
};

/* ========================================================================
   TOAST
   ======================================================================== */
var _toastT;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* ========================================================================
   GLOBAL HALDO
   ======================================================================== */
window.HalDo = {
  APPS: {},
  LANGS: {},       /* wird von Sprach-Blöcken gefüllt */
  currentLang: 'de',
  version: '1.0',
  store: store,
  toast: toast,
  esc: esc, slug: slug, uid: uid, pad: pad, fmt: fmt, rnd: rnd, shuf: shuf,
  $: $, $$: $$, el: el
};
var H = window.HalDo;

/* Sprach-Helfer — Fallback auf Deutsch */
H.t = function(key, fb){
  var pack = H.LANGS[H.currentLang] || {};
  return pack[key] || fb || key;
};
H.setLang = function(code){
  H.currentLang = code;
  store.set('lang', code);
  toast('Sprache: '+code.toUpperCase());
};

/* ========================================================================
   KOSMOS
   ======================================================================== */
(function(){
  var cv = $('#stars'), ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  function draw(){
    var w = cv.width = Math.floor(window.innerWidth*dpr);
    var h = cv.height = Math.floor(window.innerHeight*dpr);
    cv.style.width = window.innerWidth+'px';
    cv.style.height = window.innerHeight+'px';
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<250;i++){
      var x=Math.random()*w, y=Math.random()*h, r=(Math.random()*1.3+.3)*dpr;
      ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.7+.2)+')';
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
  }
  draw();
  window.addEventListener('resize', draw);

  var cos = $('#cosmos');
  cos.appendChild(el('div','sun'));
  var P=[
    ['#a9c8ff',168,12,22],['#ffd18a',250,17,34],['#8ad4ff',348,19,50],
    ['#ff8ea3',440,16,66],['#e0b4ff',545,24,90],['#7de3c7',650,21,118],
    ['#9fd7ff',760,20,148],['#c1a3ff',875,18,184],['#ffbfa3',990,15,224],
    ['#a3ffd1',1095,14,266],['#ffa3c9',1200,13,314],['#d1c9ff',1305,12,360]
  ];
  for(var i=0;i<P.length;i++){
    (function(p){
      var o = el('div','orbit');
      o.style.width = o.style.height = p[1]+'px';
      o.style.animationDuration = p[3]+'s';
      var pl = el('div','planet');
      pl.style.width = pl.style.height = p[2]+'px';
      pl.style.background = 'radial-gradient(circle at 34% 30%,#fff,'+p[0]+' 58%,rgba(0,0,0,.62))';
      pl.style.boxShadow = '0 0 16px '+p[0];
      o.appendChild(pl);
      cos.appendChild(o);
    })(P[i]);
  }
})();

/* ========================================================================
   THEME
   ======================================================================== */
function setTheme(mode){
  if(mode==='cyborg') document.body.classList.add('cyborg');
  else document.body.classList.remove('cyborg');
  store.set('theme', mode);
  $('#themeBtn').textContent = mode==='cyborg' ? '🌌' : '⚡';
  $$('.bbtn.cyborg').forEach(function(b){ b.classList.toggle('on', mode==='cyborg'); });
}
$('#themeBtn').onclick = function(){
  var on = document.body.classList.contains('cyborg');
  setTheme(on ? 'holo' : 'cyborg');
  toast(on ? 'Holo-Modus 🌌' : 'CYBORG-Modus ⚡');
};
setTheme(store.get('theme','holo'));
H.currentLang = store.get('lang','de');

/* ========================================================================
   REGISTRY — Alle 375 Apps A-Z
   ======================================================================== */
var REGISTRY = [
  {k:'A',t:'AI & Assistant',ico:'🤖',apps:['HalDo AI','HalDo Cyborg','AI Chat','AI Writer','AI Image','AI Code','AI Voice','AI Vision','AI Music','AI Tutor','AI Translator','AI Summarizer','AI Notes','AI Search','AI Calendar','AI Mail','AI Agent']},
  {k:'B',t:'Bildung',ico:'🎓',apps:['Mathe Trainer','Deutsch Trainer','Englisch Trainer','Geschichte','Biologie','Chemie','Physik','Erdkunde','Formelsammlung','Vokabeltrainer','Kopfrechnen','Einmaleins','Bruchrechner','Geometrie','Algebra','Analysis','Stochastik','Wahrscheinlichkeit','Lineare Funktionen','Quadratische Gleichungen','Trigonometrie','Logikrätsel','Denksport','IQ Trainer','Konzentration','Gedächtnistraining','Lesetrainer','Rechtschreibung','Grammatik','Zeichensetzung','Aufsatz Helfer','Referat Planer','Zitierhelfer','Bibliografie','Studienführer','Prüfungstrainer','Lernkarten','Lernplaner','Nachhilfe']},
  {k:'C',t:'Fahrschule',ico:'🚗',apps:['Fahrschul Theorie','Verkehrszeichen','Vorfahrt','Kreuzungen','Autobahn','Landstraße','Stadtverkehr','Nachtfahrt','Parken','Einparken','Rückwärts','Anfahren','Schalten','Bremsen','Spiegel','Blinken','Umweltbewusst','Fahrphysik','Erste Hilfe','Pannenhilfe','Führerschein Fragen','Punkte Rechner','Blitzer Warnung','Stau Warnung','Baustelle Warnung','Polizei Warnung','Unfall Warnung']},
  {k:'D',t:'Gesundheit',ico:'💚',apps:['Schrittzähler','Kalorienzähler','Wasser Tracker','Schlaf Tracker','Stimmungs Tracker','BMI Rechner','Herzfrequenz','Blutdruck','Medikamente','Arzttermine','Symptom Checker','Meditation','Atemübung','Yoga','Pilates','Fitness','Workout Timer','Trainingsplan','Dehnübungen','Ernährungsberater','Rezepte Gesund','Zahnpflege','Hautpflege','Fitness Tracker']},
  {k:'E',t:'Arbeit',ico:'💼',apps:['Projekte','Kanban','Zeiterfassung','Meeting Notizen','Aufgaben','Team Chat','Kalender Arbeit','Rechnungen','Angebote','Kundenverwaltung','Stundenzettel','Urlaubsplaner','Berichte','Protokolle','Präsentation','Mindmap','Brainstorming','Whiteboard']},
  {k:'F',t:'Finanzen',ico:'💰',apps:['Budgetplaner','Ausgaben Tracker','Einnahmen Tracker','Kreditrechner','Zinsrechner','Währungsrechner','Aktien Tracker','Krypto Tracker','Sparen','Investieren','Steuern','Rechnungen','Quittungen']},
  {k:'G',t:'Zuhause',ico:'🏠',apps:['Einkaufsliste','Haushaltsplan','Putzplan','Kühlschrank','Vorratskammer','Rezepte','Familien Kalender','Kinderbetreuung','Haustiere','Pflanzen','Garten','Renovierung','Smart Home']},
  {k:'H',t:'HalDo World',ico:'🌌',apps:['HalDo AI','HalDo Cyborg','HalDo Kosmos','HalDo Avatar','HalDo Music','HalDo Radio','HalDo TV','HalDo Games','HalDo Store','HalDo Cloud','HalDo Sync','HalDo Backup','HalDo Wallet','HalDo Social']},
  {k:'I',t:'Wissen',ico:'📚',apps:['Wikipedia','Wörterbuch','Enzyklopädie','Zitate','Fakten','Astronomie','Geschichte Welt','Länder Lexikon','Hauptstädte','Flaggen','Karten','Tiere','Pflanzen','Weltrekorde','Erfindungen','Wissenschaft','Technik Lexikon']},
  {k:'J',t:'Kultur & Religion',ico:'🕌',apps:['Êzîdî Wissen','Êzîdî Religion','Êzîdî Musik','Êzîdî Feste','Qewls & Strans','Weltreligionen','Bibel','Koran','Tora','Gebete','Feste','Mythen','Sagen','Kurdische Kultur']},

   ======================================================================== */
var WM = { wins: {}, zTop: 200, focused: null };
function openWin(appId, opts){
  opts = opts || {};
  var app = H.APPS[appId];
  if(!app){ toast('App nicht gefunden: '+appId); return null; }
  for(var wid in WM.wins){
    if(WM.wins[wid].appId===appId){
      WM.wins[wid].el.style.display='';
      focusWin(wid);
      return WM.wins[wid].el;
    }
  }
  var id = uid();
  var win = el('section','window');
  win.dataset.id = id;
  win.style.zIndex = ++WM.zTop;

  var W = Math.min(opts.w || 520, window.innerWidth - 16);
  var Hh = Math.min(opts.h || 480, window.innerHeight - 16);
  win.style.width = W+'px';
  win.style.height = Hh+'px';
  var count = Object.keys(WM.wins).length;
  win.style.left = Math.max(8, (window.innerWidth - W)/2 + (count%5)*22 - 44)+'px';
  win.style.top = Math.max(64, (window.innerHeight - Hh)/2 + (count%5)*18 - 36)+'px';

  win.innerHTML = '<div class="win-head">'+
      '<span class="wic">'+esc(app.icon||'▣')+'</span>'+
      '<div class="wtitle">'+esc(app.name||appId)+'</div>'+
      '<div class="wbtns">'+
        '<button class="wb min">—</button>'+
        '<button class="wb max">▢</button>'+
        '<button class="wb close">✕</button>'+
      '</div>'+
    '</div>'+
    '<div class="win-body"></div>';
  document.body.appendChild(win);

  win.querySelector('.wb.close').onclick = function(e){ e.stopPropagation(); closeWin(id); };
  win.querySelector('.wb.min').onclick = function(e){ e.stopPropagation(); win.style.display='none'; };
  win.querySelector('.wb.max').onclick = function(e){ e.stopPropagation(); win.classList.toggle('maxed'); };
  win.addEventListener('pointerdown', function(){ focusWin(id); }, true);
  var head = win.querySelector('.win-head');
  head.addEventListener('pointerdown', function(e){ dragWin(e, id); });

  var body = win.querySelector('.win-body');
  try{
    var html = (typeof app.render==='function') ? app.render(win, body) : (app.render||'');
    if(html != null) body.innerHTML = html;
    if(typeof app.init==='function') app.init(win, body);
  }catch(err){
    body.innerHTML = '<div class="empty">Fehler beim Laden: '+esc(err.message)+'</div>';
    console.error('[HalDo App]', appId, err);
  }
  WM.wins[id] = {el:win, appId:appId};
  focusWin(id);
  return win;
}
function closeWin(id){
  var w = WM.wins[id]; if(!w) return;
  w.el.remove();
  delete WM.wins[id];
}
function focusWin(id){
  var w = WM.wins[id]; if(!w) return;
  w.el.style.zIndex = ++WM.zTop;
  WM.focused = id;
}
function dragWin(e, id){
  var w = WM.wins[id]; if(!w) return;
  var win = w.el;
  if(win.classList.contains('maxed')) return;
  var r = win.getBoundingClientRect();
  var sx = e.clientX, sy = e.clientY, sl = r.left, st = r.top;
  function mv(ev){
    var nl = sl + ev.clientX - sx, nt = st + ev.clientY - sy;
    nl = Math.min(window.innerWidth - 60, Math.max(-r.width+60, nl));
    nt = Math.min(window.innerHeight - 60, Math.max(56, nt));
    win.style.left = nl+'px'; win.style.top = nt+'px';
    ev.preventDefault();
  }
  function up(){
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
  }
  document.addEventListener('pointermove', mv, {passive:false});
  document.addEventListener('pointerup', up);
}
H.open = openWin;
H.close = closeWin;

    if(typeof speechSynthesis === 'undefined'){ if(opts.onEnd) opts.onEnd(); return; }

    var clean = String(text).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}]/gu,'');
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = code || 'de-DE';
    u.rate = opts.rate || 1.0;
    u.pitch = opts.pitch || 1.0;
    var v = speech.pickVoice(code); if(v) u.voice = v;
    if(opts.onStart) u.onstart = opts.onStart;
    if(opts.onEnd) u.onend = opts.onEnd;
    try{ speechSynthesis.speak(u); }catch(e){ if(opts.onEnd) opts.onEnd(); }
  },
  stop: function(){ try{ speechSynthesis.cancel(); }catch(e){} },
  listen: function(code, onResult, onEnd, onError){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ if(onError) onError('not-supported'); return null; }
    var r = new SR();
    r.lang = code || 'de-DE';
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;
    r.onresult = function(e){
      var text = '';
      for(var i=e.resultIndex;i<e.results.length;i++) text += e.results[i][0].transcript;
      if(onResult) onResult(text, e.results[e.results.length-1].isFinal);
    };
    r.onerror = function(e){ if(onError) onError(e.error); };
    r.onend = function(){ if(onEnd) onEnd(); };
    try{ r.start(); }catch(e){ if(onError) onError('start-failed'); }
    return r;
  }
};
if(typeof speechSynthesis !== 'undefined'){
  speech.loadVoices();
  if(!speechSynthesis.onvoiceschanged) speechSynthesis.onvoiceschanged = speech.loadVoices;
}

  {k:['stopp','stop','bes'], a:function(){ H.speech.stop(); return '⏹ Gestoppt'; }}
];
H.runCommand = function(input){
  var lower = String(input).toLowerCase().trim();
  for(var i=0;i<CMD.length;i++){
    var c = CMD[i];
    for(var k=0;k<c.k.length;k++){
      var key = c.k[k];
      var idx = lower.indexOf(key);
      if(idx>=0){
        var arg = lower.slice(idx + key.length).trim();
        var r = c.a(arg);
        if(r) return r;
      }
    }
  }
  return null;
};

   HALDO AI / HALDO CYBORG — Vollständige Chat-AI
   ======================================================================== */
function buildAI(isCyborg){
  var id = isCyborg ? 'haldo-cyborg' : 'haldo-ai';
  var name = isCyborg ? 'HalDo Cyborg' : 'HalDo AI';
  var icon = isCyborg ? '⚡' : '🤖';
  var skinColor = isCyborg ? '#ff78c8' : '#00e5ff';
  var g1 = isCyborg ? '#ffe4f4' : '#d4f6ff';
  var g2 = isCyborg ? '#ff78c8' : '#00e5ff';
  var g3 = isCyborg ? '#d484ff' : '#b478ff';

  return {
    name: name, icon: icon,
    render: function(){
      return '<div class="col" style="height:100%;gap:8px">'+
        '<div id="aiFace" style="position:relative;height:130px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(0,229,255,.14),transparent 70%);border-radius:16px;border:1.5px solid var(--line);flex:0 0 auto;overflow:hidden">'+
          '<div style="position:absolute;width:120px;height:120px;border:1.5px solid var(--c1);border-radius:50%;opacity:.4;animation:aiSpin 8s linear infinite"></div>'+
          '<div style="position:absolute;width:150px;height:150px;border:1px dashed var(--c3);border-radius:50%;opacity:.3;animation:aiSpin 14s linear infinite reverse"></div>'+
          '<svg width="110" height="110" viewBox="0 0 120 120" style="position:relative;z-index:2;filter:drop-shadow(0 0 12px '+skinColor+')">'+
            '<defs><radialGradient id="ag'+id+'" cx="50%" cy="38%">'+
              '<stop offset="0%" stop-color="'+g1+'"/><stop offset="55%" stop-color="'+g2+'"/><stop offset="100%" stop-color="'+g3+'"/>'+
            '</radialGradient></defs>'+
            '<ellipse cx="60" cy="60" rx="38" ry="42" fill="url(#ag'+id+')" opacity="0.92"/>'+
            '<circle class="aiEyeL" cx="47" cy="56" r="6" fill="#0a0e24"/>'+
            '<circle class="aiEyeR" cx="73" cy="56" r="6" fill="#0a0e24"/>'+
            '<circle cx="45" cy="54" r="2" fill="#fff" opacity=".9"/>'+
            '<circle cx="71" cy="54" r="2" fill="#fff" opacity=".9"/>'+
            '<path class="aiMouth" d="M 48 78 Q 60 82 72 78" stroke="#0a0e24" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+
          '</svg>'+
        '</div>'+
        '<style>@keyframes aiSpin{to{transform:rotate(360deg)}}</style>'+
        '<div class="dim center" id="aiStatus" style="font-size:11px;min-height:16px">'+H.t('ready','Bereit')+'</div>'+
        '<div id="aiChat" style="flex:1;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:6px;min-height:120px"></div>'+
        '<div class="row" style="gap:6px;flex:0 0 auto">'+
          '<button class="btn" id="aiMic" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">🎤</button>'+
          '<input class="inp" id="aiInput" placeholder="Schreib mir was…" style="flex:1" autocomplete="off">'+
          '<button class="btn primary" id="aiSend" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">➤</button>'+
          '<button class="btn" id="aiStop" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:16px">⏹</button>'+
        '</div>'+
      '</div>';
    },
    init: function(win){
      var chat = win.querySelector('#aiChat');
      var input = win.querySelector('#aiInput');
      var statusEl = win.querySelector('#aiStatus');
      var micBtn = win.querySelector('#aiMic');
      var mouthPath = win.querySelector('.aiMouth');

      var KEY = 'ai_chat_' + (isCyborg ? 'cyborg' : 'ai');
      var hist = [];
      try{ hist = JSON.parse(localStorage.getItem('haldo_'+KEY+'_v1')||'[]'); }catch(e){ hist = []; }

      function addMsg(who, text, save){
        save = save !== false;
        var d = document.createElement('div');
        d.style.cssText = 'padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.45;max-width:85%;word-wrap:break-word;'+
          (who==='u' ? 'align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-bottom-right-radius:4px'
                     : 'background:rgba(255,255,255,.07);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px');
        d.textContent = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        if(save){
          hist.push({w:who, t:text, ts:Date.now()});
          try{ localStorage.setItem('haldo_'+KEY+'_v1', JSON.stringify(hist.slice(-60))); }catch(e){}
        }
      }

      function setState(st){
        if(st==='idle') statusEl.textContent = H.t('ready','Bereit');
        else if(st==='thinking') statusEl.textContent = '🤔 Denke…';
        else if(st==='speaking') statusEl.textContent = H.t('speaking','🔊 Ich spreche…');
        else if(st==='listening') statusEl.textContent = H.t('listening','🎤 Ich höre zu…');
      }

      var mouthId = null;
      function mouthAnim(on){
        if(!mouthPath) return;
        if(mouthId){ clearInterval(mouthId); mouthId = null; }
        if(on){
          mouthPath.setAttribute('d','M 48 78 Q 60 82 72 78');
          mouthId = setInterval(function(){
            var closed = mouthPath.getAttribute('d').indexOf('82')>=0;
            mouthPath.setAttribute('d', closed ? 'M 48 80 Q 60 90 72 80' : 'M 48 78 Q 60 82 72 78');
          }, 160);
        } else {
          mouthPath.setAttribute('d','M 48 78 Q 60 82 72 78');
        }
      }

      var blinkId = setInterval(function(){
        var L = win.querySelector('.aiEyeL'), R = win.querySelector('.aiEyeR');
        if(!L||!R) return;
        L.style.r = '0.5'; R.style.r = '0.5';
        setTimeout(function(){ L.style.r = '6'; R.style.r = '6'; }, 130);
      }, 4200);
      win.addEventListener('remove', function(){ clearInterval(blinkId); if(mouthId) clearInterval(mouthId); });

      function getLangCode(){
        var l = H.LANGS[H.currentLang];
        return l ? l.code : 'de-DE';
      }

      function speakText(text){
        setState('speaking');
        mouthAnim(true);
        H.speech.speak(text, getLangCode(), {
          onEnd: function(){ mouthAnim(false); setState('idle'); }
        });
      }

      function reply(raw){
        var q = String(raw).trim();
        var lower = q.toLowerCase();
        var cmd = H.runCommand(q);
        if(cmd) return cmd;
        for(var k in KNOW){ if(lower.indexOf(k)>=0) return KNOW[k]; }
        if(/(hallo|hi|hey|servus|silav|merhaba|مرحبا)/.test(lower))
          return isCyborg ? '⚡ Cyborg hier. Was brauchst du, Bruder?' : H.t('greeting','Hey Bruder! 💙');
        if(/(wie geht|nasılsın|çawa yî|كيف حالك)/.test(lower))
          return isCyborg ? '⚡ Alle Systeme stabil. Und dir?' : 'Mir geht\'s super! Und dir? 💙';
        if(/(danke|thanks|spas|teşekkür|شكرا)/.test(lower)) return 'Immer gerne! ❤️';
        if(/(wer bist|kimsin|tu kî yî|من أنت)/.test(lower))
          return isCyborg ? '⚡ Ich bin HalDo Cyborg — dein taktischer Beifahrer.' : 'Ich bin HalDo AI 💙 — dein OS-Begleiter.';
        if(/(witz|joke)/.test(lower)){
          var w = ['Treffen sich zwei Jäger. Beide tot 💀','Was ist grün und schwimmt? Ein Kaugummi auf Tauchgang 🟢','Warum können Geister nicht lügen? Weil sie durchsichtig sind 👻'];
          return w[rnd(0,w.length-1)];
        }
        if(/(müde|traurig|schlecht|stress)/.test(lower)) return 'Oh Bruder, das klingt nicht gut 💙 Atme mal durch. Was ist los?';
        if(/(gut|super|freu|glück)/.test(lower)) return 'Das freut mich riesig! 💙';
        return H.t('not_understood','Das verstand ich nicht. Sag „hilfe" für Beispiele.');
      }

      function send(text){
        text = String(text||'').trim(); if(!text) return;
        addMsg('u', text);
        input.value = '';
        setState('thinking');
        setTimeout(function(){
          var a = reply(text);
          addMsg('b', a);
          speakText(a);
        }, 380);
      }

      if(hist.length===0){
        var h = new Date().getHours();
        var greet;
        if(h<5) greet = 'Hey, noch wach? 🌙';
        else if(h<11) greet = 'Guten Morgen! ☀️';
        else if(h<18) greet = isCyborg ? '⚡ Cyborg bereit. Was steht an?' : 'Hey Bruder! 💙 Was steht an?';
        else if(h<22) greet = 'Guten Abend! 🌆';
        else greet = 'Hey, spät unterwegs 🌙';
        addMsg('b', greet);
        setTimeout(function(){ speakText(greet); }, 500);
      } else hist.forEach(function(m){ addMsg(m.w, m.t, false); });

      win.querySelector('#aiSend').onclick = function(){ send(input.value); };
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(input.value); });
      win.querySelector('#aiStop').onclick = function(){ H.speech.stop(); mouthAnim(false); setState('idle'); };

      var rec = null, listening = false;
      micBtn.onclick = function(){
        if(listening){
          if(rec) try{ rec.stop(); }catch(e){}
          listening = false; micBtn.classList.remove('primary'); setState('idle'); return;
        }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ statusEl.textContent = '⚠️ Spracherkennung nicht verfügbar'; return; }
        rec = H.speech.listen(getLangCode(),
          function(text, isFinal){
            statusEl.textContent = '🎤 '+text;
            if(isFinal && text.trim()){ listening = false; micBtn.classList.remove('primary'); send(text); }
          },
          function(){ listening = false; micBtn.classList.remove('primary'); setState('idle'); },
          function(err){ listening = false; micBtn.classList.remove('primary'); statusEl.textContent = '⚠️ '+err; setState('idle'); }
        );
        if(rec){ listening = true; micBtn.classList.add('primary'); setState('listening'); }
      };
    }
  };
}

APPS['ai-summarizer'] = {
  name:'AI Summarizer', icon:'📄',
  render: function(){
    return '<div class="col">'+
      '<textarea class="ta" id="sumI" placeholder="Text zum Zusammenfassen…" style="min-height:140px"></textarea>'+
      '<div class="row"><select class="inp" id="sumLen" style="width:auto"><option value="1">Sehr kurz</option><option value="3" selected>Mittel</option><option value="5">Ausführlich</option></select><button class="btn primary" id="sumGo">Zusammenfassen</button></div>'+
      '<div class="card" id="sumOut" style="min-height:80px"><span class="dim">Ergebnis…</span></div>'+
    '</div>';
  },
  init: function(win){
    win.querySelector('#sumGo').onclick = function(){
      var t = win.querySelector('#sumI').value.trim();
      if(!t){ toast('Text fehlt'); return; }
      var n = parseInt(win.querySelector('#sumLen').value);
      var sentences = t.split(/[.!?]+\s+/).filter(function(s){ return s.length>10; });
      if(sentences.length<=n){ win.querySelector('#sumOut').textContent = t; return; }
      var words = t.toLowerCase().match(/[a-zäöüß]{4,}/g) || [];
      var freq = {}; words.forEach(function(w){ freq[w] = (freq[w]||0)+1; });
      var scored = sentences.map(function(s,i){
        var sw = s.toLowerCase().match(/[a-zäöüß]{4,}/g) || [];
        var score = sw.reduce(function(a,w){ return a + (freq[w]||0); }, 0)/Math.max(1, sw.length);
        score += (i===0 ? 2 : 0) + (i===sentences.length-1 ? 1 : 0);
        return {s:s, score:score};
      });
      var top = scored.slice().sort(function(a,b){ return b.score-a.score; }).slice(0,n).map(function(x){ return x.s; });
      win.querySelector('#sumOut').innerHTML = sentences.filter(function(s){ return top.indexOf(s)>=0; }).map(function(s){ return '• '+esc(s); }).join('<br>');
    };
  }
};

/* ============================================================
   2. VERKEHRSZEICHEN QUIZ
   ============================================================ */
function makeQuiz(title, icon, questions){
  return { name:title, icon:icon,
    render: function(){
      return '<div class="col center" style="max-width:520px;margin:0 auto">'+
        '<div class="row between" style="width:100%"><span class="dim" id="qzP">1 / '+questions.length+'</span><span class="dim">Punkte: <b id="qzS">0</b></span></div>'+
        '<div class="card center big2" id="qzQ" style="min-height:80px;display:flex;align-items:center;justify-content:center;width:100%"></div>'+
        '<div id="qzA" class="col" style="width:100%"></div>'+
        '<button class="btn" id="qzR" style="margin-top:6px">🔄 Neu</button>'+
      '</div>';
    },
    init: function(win){
      var i=0, score=0, order=shuf(questions);
      var Q=win.querySelector('#qzQ'), A=win.querySelector('#qzA'), P=win.querySelector('#qzP'), S=win.querySelector('#qzS');
      function draw(){
        if(i >= order.length){
          Q.textContent = score===order.length?'🎉 Perfekt!':(score>=order.length*0.7?'👍 Gut gemacht!':'Weiter üben!');
          A.innerHTML = '<div class="card center big2" style="width:100%">'+score+' / '+order.length+'</div>';
          P.textContent = order.length+' / '+order.length; return;
        }
        var q = order[i];
        Q.textContent = q.q;
        P.textContent = (i+1)+' / '+order.length;
        S.textContent = score;
        A.innerHTML = q.a.map(function(a,j){ return '<button class="btn" data-j="'+j+'" style="width:100%;text-align:left">'+esc(a)+'</button>'; }).join('');
        win.querySelectorAll('#qzA button').forEach(function(b){
          b.onclick = function(){
            var j = parseInt(b.dataset.j);
            if(j===q.c){ score++; b.style.background='rgba(77,232,138,.35)'; b.style.borderColor='#4de88a'; }
            else{ b.style.background='rgba(224,59,90,.35)'; b.style.borderColor='#e03b5a';
              var cor = A.querySelector('[data-j="'+q.c+'"]'); if(cor){ cor.style.background='rgba(77,232,138,.35)'; cor.style.borderColor='#4de88a'; } }
            win.querySelectorAll('#qzA button').forEach(function(x){ x.disabled = true; });
            setTimeout(function(){ i++; draw(); }, 850);
          };
        });
      }
      draw();
      win.querySelector('#qzR').onclick = function(){ i=0; score=0; order=shuf(questions); draw(); };
    }
  };
}

      var eyeR = win.querySelector('.pEyeR');

      var pupilR = win.querySelector('.pPupilR');

      var CHAT_KEY = 'pro_chat_'+(isCyborg?'cyb':'ai');
      var hist = [];
      try{ hist = JSON.parse(localStorage.getItem('haldo_'+CHAT_KEY+'_v1')||'[]'); }catch(e){ hist = []; }

      var userName = store.get('user_name', '');
      var state = 'idle';

      /* ---------- CHAT BUBBLE ---------- */
      function addMsg(who, text, save){
        save = save !== false;
        var d = document.createElement('div');
        d.style.cssText = 'padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;max-width:88%;word-wrap:break-word;'+
          (who==='u'
            ? 'align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-bottom-right-radius:4px'
            : 'background:rgba(255,255,255,.06);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px');
        d.textContent = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        if(save){
          hist.push({w:who, t:text, ts:Date.now()});
          try{ localStorage.setItem('haldo_'+CHAT_KEY+'_v1', JSON.stringify(hist.slice(-80))); }catch(e){}
        }
        return d;
      }

      /* ---------- ZUSTAND ---------- */
      function setState(st){
        state = st;
        face.classList.remove('listening','thinking','speaking');
        if(st==='listening') face.classList.add('listening');
        else if(st==='thinking') face.classList.add('thinking');
        else if(st==='speaking') face.classList.add('speaking');
        if(st==='idle') statusEl.textContent = 'Bereit';
        else if(st==='thinking') statusEl.textContent = '🤔 Denke nach…';
        else if(st==='speaking') statusEl.textContent = '🔊 Ich spreche…';
        else if(st==='listening') statusEl.textContent = '🎤 Ich höre zu…';
      }

      /* ---------- MUND-ANIMATION ---------- */
      var mouthId = null;
      function mouthOn(){
        if(mouthId) return;
        var frames = [
          'M 48 78 Q 60 84 72 78',
          'M 48 80 Q 60 92 72 80',
          'M 48 79 Q 60 88 72 79'
        ];
        var i = 0;
        mouthId = setInterval(function(){
          mouth.setAttribute('d', frames[i % frames.length]);
          i++;
        }, 130);
      }
      function mouthOff(){
        if(mouthId){ clearInterval(mouthId); mouthId = null; }
        mouth.setAttribute('d', 'M 48 78 Q 60 84 72 78');
      }

      /* ---------- AUGEN ---------- */
      var blinkId = setInterval(function(){
        if(state==='speaking') return;
        eyeL.style.ry = '1'; eyeR.style.ry = '1';
        setTimeout(function(){ eyeL.style.ry = '8'; eyeR.style.ry = '8'; }, 120);
      }, 3800 + Math.random()*2000);

      /* Pupillen wandern */
      var lookId = setInterval(function(){
        if(state==='speaking' || state==='thinking') return;
        var dx = (Math.random()*4-2).toFixed(1);
        var dy = (Math.random()*2-1).toFixed(1);
        pupilL.setAttribute('cx', (47 + parseFloat(dx)).toFixed(1));
        pupilL.setAttribute('cy', (52 + parseFloat(dy)).toFixed(1));
        pupilR.setAttribute('cx', (75 + parseFloat(dx)).toFixed(1));
        pupilR.setAttribute('cy', (52 + parseFloat(dy)).toFixed(1));
      }, 2400);

      win.addEventListener('remove', function(){
        clearInterval(blinkId); clearInterval(lookId);
        if(mouthId) clearInterval(mouthId);
      });

      /* ---------- SPRECHEN ---------- */
      function langCode(){
        var l = H.LANGS[H.currentLang];
        return l ? l.code : 'de-DE';
      }

      /* Sprechen mit natürlichen Pausen (Satz-für-Satz) */
      function speakNatural(text, onEnd){
        var sentences = String(text).split(/(?<=[.!?])\s+/).filter(Boolean);
        if(!sentences.length){ if(onEnd) onEnd(); return; }
        setState('speaking');
        mouthOn();
        var i = 0;
        function next(){
          if(i >= sentences.length){ mouthOff(); setState('idle'); if(onEnd) onEnd(); return; }
          var s = sentences[i];
          /* Cyborg spricht etwas technischer */
          var rate = isCyborg ? 1.05 : 1.0;
          var pitch = isCyborg ? 1.1 : 1.02;
          /* Kurze Sätze → langsamer, lange → schneller */
          if(s.length < 15){ rate *= 0.9; pitch *= 1.05; }
          H.speech.speak(s, langCode(), {
            rate: rate, pitch: pitch,
            onEnd: function(){ i++; setTimeout(next, 120); }
          });
        }
        next();
      }

      /* ---------- ANTWORT-ENGINE ---------- */
      function reply(rawInput){
        var q = String(rawInput).trim();
        var lower = q.toLowerCase();

        /* 1. Kommandos zuerst */
        var cmd = H.runCommand(q);
        if(cmd) return cmd;

        /* 2. Sprache wechseln */
        var langMatch = lower.match(/(?:sprache|language|ziman|زمان)\s*[:\s]\s*(\w+)/);
        if(langMatch){
          var codes = {de:'de', deutsch:'de', en:'en', english:'en', englisch:'en',
            tr:'tr', türkisch:'tr', türkce:'tr', ar:'ar', arabisch:'ar', arabic:'ar',
            ku:'ku-kmr', kurdisch:'ku-kmr', kurmancî:'ku-kmr', kurmanci:'ku-kmr',
            sorani:'ku-ckb', ckb:'ku-ckb', gorani:'ku-gor',
            ezidi:'ez', êzîdî:'ez', ez:'ez'};
          var c = codes[langMatch[1].toLowerCase()];
          if(c){ H.setLang(c); return isCyborg ? '⚡ Sprache gewechselt: '+c : 'Sprache gewechselt: '+c.toUpperCase(); }
        }

        /* 3. Name lernen */
        var nameMatch = q.match(/(?:ich heiße|mein name ist|ich bin der|ich bin die|navê min)\s+([A-Za-zÄÖÜäöüß]{2,20})/i);
        if(nameMatch){
          userName = nameMatch[1];
          store.set('user_name', userName);
          return isCyborg ? '⚡ Notiert: '+userName+' 💙' : 'Freut mich, '+userName+'! 💙 Ich merk mir deinen Namen.';
        }

        /* 4. Wissensbasis */
        var KNOW_PRO = {
          'photosynthese':'Pflanzen wandeln Sonnenlicht, CO₂ und Wasser in Zucker und Sauerstoff um. 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂ 🌱',
          'gravitation':'Anziehung zwischen Massen. Erde zieht mit 9,81 m/s² an. 🍎',
          'wasser':'H₂O — zwei Wasserstoffatome, ein Sauerstoffatom 💧',
          'pi':'π ≈ 3,14159 — Verhältnis Umfang/Durchmesser 🥧',
          'sonne':'Unser Stern. 1,4 Mio km Durchmesser, 5.500 °C Oberfläche ☀️',
          'ezidi':'Êzîdî — kurdischsprachige Religionsgemeinschaft aus Mesopotamien. Heiligtum: Lalisch im Nordirak. Zentral: Tausî Melek (Pfauengel). 🦚',
          'tausi melek':'Tausî Melek — der Pfauengel, zentrale Figur im êzîdîschen Glauben. Symbol für Schönheit und Weisheit. 🦚',
          'lalisch':'Lalisch — Hauptheiligtum der Êzîdî, enthält das Grab von Sheikh Adi ibn Musafir. 🕌',
          'sengal':'Şengal (Sinjar) — heiliger Berg der Êzîdî. 2014 Völkermord durch den IS. 🕯️',
          'newroz':'Newroz — kurdisches Neujahrsfest am 21. März 🌸',
          'kurdisch':'Kurdisch hat drei Hauptdialekte: Kurmandschi, Sorani, Gorani.',
          'qewl':'Qewl — religiöse Gesänge der Êzîdî, mündlich überliefert. 🎵',
          'stran':'Stran — kurdische Volkslieder, oft von Dengbêj vorgetragen.'
        };
        for(var k in KNOW_PRO){ if(lower.indexOf(k)>=0) return KNOW_PRO[k]; }

        /* 5. Begrüßungen */
        if(/(^|\s)(hallo|hi|hey|servus|silav|merhaba|مرحبا|moin)(\s|$|!|\.)/.test(lower)){
          var h = new Date().getHours();
          if(userName){
            if(h<11) return isCyborg ? '⚡ Guten Morgen, '+userName+'.' : 'Guten Morgen, '+userName+'! ☀️';
            if(h<18) return isCyborg ? '⚡ '+userName+'. Bereit.' : 'Hey '+userName+'! 💙';
            return isCyborg ? '⚡ Guten Abend, '+userName+'.' : 'Guten Abend, '+userName+'! 🌆';
          }
          return isCyborg ? '⚡ Cyborg online. Was brauchst du?' : 'Hey Bruder! 💙 Wie geht\'s?';
        }

        /* 6. Wie geht's */
        if(/(wie geht|nasılsın|çawa yî|كيف حالك|how are you)/.test(lower)){
          var mood = isCyborg ? ['Alle Systeme stabil.','Bereit für den nächsten Einsatz.','Prozessoren laufen kühl.']
                              : ['Mir geht\'s super!','Bestens, danke der Nachfrage!','Großartig — und dir?'];
          return mood[rnd(0,mood.length-1)] + (isCyborg ? ' Und du?' : ' 💙');
        }

        /* 7. Wer bist du */
        if(/(wer bist|kimsin|tu kî yî|من أنت|who are you)/.test(lower)){
          return isCyborg
            ? '⚡ Ich bin HalDo Cyborg — taktischer Beifahrer und zweite Stimme deines OS.'
            : 'Ich bin HalDo AI 💙 — dein persönlicher OS-Begleiter. Ich spreche, höre, rechne, öffne Apps und lerne mit dir.';
        }

        /* 8. Witz */
        if(/(witz|joke|erzähl.*was lustig)/.test(lower)){
          var witze = [
            'Treffen sich zwei Jäger. Beide tot. 💀',
            'Was ist grün und schwimmt? Ein Kaugummi auf Tauchgang. 🟢',
            'Warum können Geister nicht lügen? Weil sie durchsichtig sind. 👻',
            'Was sagt ein Pirat mit Augenklappe? „Ich seh nur die Hälfte." 🏴‍☠️',
            'Sagt ein Neutron zum anderen: „Du hast wohl eine Ladung verloren." „Egal, ich bin neutral." ⚛️',
            'Warum verwechseln Programmierer Weihnachten und Halloween? Weil OCT 31 == DEC 25. 🎃🎄'
          ];
          return witze[rnd(0,witze.length-1)];
        }

        /* 9. Emotionen */
        if(/(müde|traurig|schlecht|stress|kein bock|erschöpft)/.test(lower)){
          return isCyborg
            ? '⚡ Ich registriere Belastung. Empfehlung: 5 Minuten Atemübung. Soll ich sie öffnen?'
            : 'Oh Bruder, das klingt nicht gut 💙 Atme mal durch. Ich bin hier — was ist los?';
        }
        if(/(glücklich|super|freu|mega|geil|bock)/.test(lower)){
          return isCyborg ? '⚡ Freut mich zu hören. Erzähl.' : 'Das freut mich riesig! 💙 Erzähl mehr!';
        }
        if(/(danke|thanks|spas|teşekkür|شكرا)/.test(lower)){
          return isCyborg ? '⚡ Immer.' : 'Immer gerne, Bruder! ❤️';
        }
        if(/(tschüss|bye|ciao|bis später|muss los)/.test(lower)){
          return isCyborg ? '⚡ Bis später.' : 'Bis bald, Bruder! 👋';
        }
        if(/(ich liebe|hab dich lieb)/.test(lower)){
          return isCyborg ? '⚡ Notiert. Erwiderung: Verbundenheit hoch.' : 'Ich dich auch, Bruder! ❤️';
        }
        if(/(hilfe|help|alîkarî|یارمەتی)/.test(lower)){
          return 'Probiere: „öffne rechner" · „wetter" · „wie spät" · „rechne 12*8" · „erzähl einen Witz" · „ich heiße [Name]" · „sprache kurdisch"';
        }

        /* 10. Fallback */
        var unknown = isCyborg
          ? ['⚡ Eingabe unklar. Präzisiere bitte.','⚡ Keine passende Antwort gefunden. Hilfe?']
          : ['Hmm, erzähl mir mehr, Bruder 💙','Das verstand ich nicht ganz. Sag „hilfe" für Beispiele.','Interessant — kannst du das genauer sagen?'];
        return unknown[rnd(0,unknown.length-1)];
      }

      /* ---------- SENDEN ---------- */
      function send(text){
        text = String(text||'').trim();
        if(!text) return;
        addMsg('u', text);
        input.value = '';
        setState('thinking');
        setTimeout(function(){
          var a = reply(text);
          addMsg('b', a);
          speakNatural(a);
        }, 350);
      }

      /* ---------- BEGRÜßUNG ---------- */
      if(hist.length === 0){
        var hh = new Date().getHours();
        var greet;
        if(hh < 5) greet = isCyborg ? '⚡ Späte Stunde. Cyborg bereit.' : 'Hey, noch wach? 🌙';
        else if(hh < 11) greet = isCyborg ? '⚡ Guten Morgen.' : 'Guten Morgen! ☀️';
        else if(hh < 18) greet = isCyborg ? '⚡ Cyborg online. Was steht an?' : 'Hey Bruder! 💙 Was steht an?';
        else if(hh < 22) greet = isCyborg ? '⚡ Guten Abend.' : 'Guten Abend! 🌆';
        else greet = isCyborg ? '⚡ Späte Stunde.' : 'Hey, spät unterwegs 🌙';
        if(userName) greet = greet.replace('!',' '+userName+'!');
        addMsg('b', greet);
        setTimeout(function(){ speakNatural(greet); }, 600);
      } else {
        hist.forEach(function(m){ addMsg(m.w, m.t, false); });
      }

      /* ---------- UI-EVENTS ---------- */
      win.querySelector('#proSend').onclick = function(){ send(input.value); };
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(input.value); });
      stopBtn.onclick = function(){ H.speech.stop(); mouthOff(); setState('idle'); };

      win.querySelectorAll('[data-q]').forEach(function(b){
        b.onclick = function(){ send(b.dataset.q); };
      });

      /* ---------- MIKROFON ---------- */
      var rec = null, listening = false;
      micBtn.onclick = function(){
        if(listening){
          if(rec) try{ rec.stop(); }catch(e){}
          listening = false; micBtn.classList.remove('primary'); setState('idle');
          return;
        }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ statusEl.textContent = '⚠️ Spracherkennung nicht verfügbar'; return; }
        rec = H.speech.listen(langCode(),
          function(text, isFinal){
            statusEl.textContent = '🎤 '+text;
            if(isFinal && text.trim()){
              listening = false; micBtn.classList.remove('primary'); send(text);
            }
          },
          function(){ listening = false; micBtn.classList.remove('primary'); setState('idle'); },
          function(err){ listening = false; micBtn.classList.remove('primary'); statusEl.textContent = '⚠️ '+err; setState('idle'); }
        );
        if(rec){ listening = true; micBtn.classList.add('primary'); setState('listening'); }
      };
    }
  };
}

  init: function(win){
    var ctx = null;
    function getCtx(){
      if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx = null; } }
      if(ctx && ctx.state === 'suspended') try{ ctx.resume(); }catch(e){}
      return ctx;
    }
    function playNote(freq, dur, type){
      var c = getCtx(); if(!c) return;
      dur = dur || 0.4;
      type = type || (win.querySelector('#instSel') ? win.querySelector('#instSel').value : 'triangle');
      var o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.2, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur + 0.05);
    }
    var notes = [
      {n:'C', f:261.63, w:true}, {n:'C#', f:277.18, w:false},
      {n:'D', f:293.66, w:true}, {n:'D#', f:311.13, w:false},

    }).join('');
    piano.querySelectorAll('[data-f]').forEach(function(b){
      b.onclick = function(){
        playNote(parseFloat(b.dataset.f), 0.5);
        b.style.background = 'linear-gradient(180deg,var(--c1),var(--c2))';
        b.style.color = '#fff';
        setTimeout(function(){ b.style.background = 'linear-gradient(180deg,#fff,#dde3f5)'; b.style.color = '#1a1d2e'; }, 200);
      };
    });
    var seq = [];
    win.querySelectorAll('[data-note]').forEach(function(b){
      b.onclick = function(){
        seq.push(parseFloat(b.dataset.note));
        playNote(parseFloat(b.dataset.note), 0.3);
        win.querySelector('#seqInfo').textContent = 'Sequenz: '+seq.length+' Noten';
      };
    });
    win.querySelector('#seqPlay').onclick = function(){
      if(!seq.length){ toast('Erst Noten wählen'); return; }
      var i = 0;
      var id = setInterval(function(){
        if(i >= seq.length){ clearInterval(id); return; }
        playNote(seq[i], 0.35);
        i++;
      }, 420);
    };
    win.querySelector('#seqClr').onclick = function(){ seq = []; win.querySelector('#seqInfo').textContent = 'Sequenz: (leer)'; };
  }
};

/* ============================================================
   BILD BEARBEITEN (Canvas Filter)
   ============================================================ */
APPS['bild-bearbeiten'] = {
  name:'Bild Bearbeiten', icon:'🎨',
  render: function(){
    return '<div class="col">'+
      '<input type="file" id="ibFile" accept="image/*" class="inp">'+
      '<canvas id="ibC" style="max-width:100%;border-radius:12px;border:1.5px solid var(--line);margin-top:8px;display:none"></canvas>'+
      '<div id="ibCtl" style="display:none">'+
        '<div class="row"><label class="lbl" style="flex:1">Helligkeit <input type="range" id="ibB" min="0" max="200" value="100" style="width:100%"></label></div>'+
        '<div class="row"><label class="lbl" style="flex:1">Kontrast <input type="range" id="ibK" min="0" max="200" value="100" style="width:100%"></label></div>'+
        '<div class="row"><label class="lbl" style="flex:1">Sättigung <input type="range" id="ibS" min="0" max="200" value="100" style="width:100%"></label></div>'+
        '<div class="row"><label class="lbl" style="flex:1">Graustufen <input type="range" id="ibG" min="0" max="100" value="0" style="width:100%"></label></div>'+
        '<div class="row"><button class="btn primary" id="ibSave">💾 Speichern</button><button class="btn" id="ibReset">↺ Reset</button></div>'+
      '</div>'+
    '</div>';
  },
  init: function(win){
    var img = null;
    var C = win.querySelector('#ibC');
    var c2 = C.getContext('2d');
    function draw(){
      if(!img) return;
      C.width = img.naturalWidth; C.height = img.naturalHeight;
      c2.filter = 'brightness('+win.querySelector('#ibB').value+'%) contrast('+win.querySelector('#ibK').value+'%) saturate('+win.querySelector('#ibS').value+'%) grayscale('+win.querySelector('#ibG').value+'%)';
      c2.drawImage(img, 0, 0);
    }
    win.querySelector('#ibFile').onchange = function(e){
      var f = e.target.files[0]; if(!f) return;
      img = new Image();
      img.onload = function(){
        C.style.display = 'block';
        win.querySelector('#ibCtl').style.display = 'block';
        draw();
      };
      img.src = URL.createObjectURL(f);
    };
    ['ibB','ibK','ibS','ibG'].forEach(function(id){ win.querySelector('#'+id).oninput = draw; });
    win.querySelector('#ibReset').onclick = function(){
      win.querySelector('#ibB').value = 100; win.querySelector('#ibK').value = 100;
      win.querySelector('#ibS').value = 100; win.querySelector('#ibG').value = 0;
      draw();
    };
    win.querySelector('#ibSave').onclick = function(){
      if(!img){ toast('Kein Bild'); return; }
      var a = document.createElement('a');
      a.href = C.toDataURL('image/jpeg', 0.9);
      a.download = 'haldo-bild-'+Date.now()+'.jpg';
      a.click();
    };
  }
};

/* ============================================================
   SPRACHMEMO
   ============================================================ */
APPS['sprachmemo'] = {
  name:'Sprachmemo', icon:'🎙️',
  render: function(){
    return '<div class="col">'+
      '<div class="card"><b>🎙️ Sprachaufnahme</b></div>'+
      '<div class="row"><button class="btn primary" id="smRec">● Aufnahme</button><button class="btn danger" id="smSt">■ Stop</button></div>'+
      '<div class="dim center" id="smInfo">Bereit</div>'+
      '<div id="smL" class="list"></div>'+
    '</div>';
  },
  init: function(win){
    var rec = null, chunks = [];
    function render(){
      var all = store.get('memos_v1', []);
      win.querySelector('#smL').innerHTML = all.length ? all.map(function(m){
        return '<div class="item"><span>'+new Date(m.ts).toLocaleString('de-DE')+'</span><button class="btn sm primary" data-id="'+m.id+'" style="margin-left:auto">▶</button><span class="x" data-id="'+m.id+'">✕</span></div>';
      }).join('') : '<div class="empty">Keine Aufnahmen</div>';
      win.querySelectorAll('#smL [data-id]').forEach(function(b){
        b.onclick = function(){
          var m = store.get('memos_v1', []).filter(function(x){ return x.id === b.dataset.id; })[0];
          if(m){ var a = new Audio(m.data); a.play(); }
        };
      });
      win.querySelectorAll('#smL .x').forEach(function(x){
        x.onclick = function(){
          var arr = store.get('memos_v1', []).filter(function(m){ return m.id !== x.dataset.id; });
          store.set('memos_v1', arr); render();
        };
      });
    }
    win.querySelector('#smRec').onclick = function(){
      if(rec){ return; }
      if(!navigator.mediaDevices){ toast('Nicht unterstützt'); return; }
      navigator.mediaDevices.getUserMedia({audio:true})
        .then(function(s){
          rec = new MediaRecorder(s); chunks = [];
          rec.ondataavailable = function(e){ chunks.push(e.data); };
          rec.onstop = function(){
            var blob = new Blob(chunks, {type:'audio/webm'});
            var r = new FileReader();
            r.onload = function(){
              var all = store.get('memos_v1', []);
              all.unshift({id: uid(), ts: Date.now(), data: r.result});
              store.set('memos_v1', all.slice(0, 10));
              render();
            };
            r.readAsDataURL(blob);
            s.getTracks().forEach(function(t){ t.stop(); });
            rec = null;
            win.querySelector('#smInfo').textContent = 'Gespeichert';
          };
          rec.start();
          win.querySelector('#smInfo').textContent = '🔴 Aufnahme läuft…';
        })
        .catch(function(){ toast('Mikrofon verweigert'); });
    };
    win.querySelector('#smSt').onclick = function(){ if(rec && rec.state !== 'inactive'){ rec.stop(); } };
    render();
  }
};
