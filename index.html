<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HalDo AI OS - Professional Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: white; }
        #earth-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 110vw; height: 110vh; object-fit: cover; z-index: 1; filter: brightness(0.6); animation: slowZoom 60s infinite linear; }
        @keyframes slowZoom { 0% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(1.1); } }
        #universe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #cyborg { position: absolute; bottom: 0; right: 0; height: 95vh; z-index: 5; filter: drop-shadow(0 0 40px rgba(0, 170, 255, 0.8)); pointer-events: none; }
        
        .os-window { position: absolute; background: rgba(0, 15, 40, 0.75); backdrop-filter: blur(12px); border: 2px solid #00aaff; border-radius: 12px; box-shadow: 0 0 30px rgba(0,170,255,0.5); z-index: 10; cursor: grab; user-select: none; }
        .os-window:active { cursor: grabbing; }
        #chat-window { bottom: 30px; left: 30px; width: 380px; height: 320px; }
        #file-window { top: 20px; left: 20px; width: 300px; }
        #sun-window { top: 20px; right: 20px; width: 300px; display: none; }
        #header { padding: 12px; background: rgba(0, 40, 100, 0.8); border-bottom: 1px solid #00aaff; display: flex; justify-content: space-between; cursor: move; border-radius: 12px 12px 0 0; }
        .control-btn { width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer; font-size: 12px; color: white; line-height: 20px; }
        #btn-x { background: #ff0000; } #btn-min { background: #ffaa00; }
        #chat-body { padding: 15px; height: 170px; overflow-y: auto; font-size: 15px; }
        input { width: 90%; margin: 10px; padding: 10px; background: rgba(0,0,0,0.8); border: 1px solid #00aaff; border-radius: 8px; color: white; }
        
        #status-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 10px; background: rgba(0, 10, 30, 0.9); padding: 10px 15px; border-radius: 30px; border: 1px solid #00aaff; }
        .dot { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; }
        #btn-close { background: #ff0000; } #btn-mic { background: #00ff00; } #btn-spk { background: #00aaff; }
        #btn-files { background: #ff00ff; } #btn-sun { background: #ffaa00; } #btn-update { background: #ffff00; }
    </style>
</head>
<body>
    <img id="earth-bg" src="earth.png" onerror="this.style.display='none'">
    <canvas id="universe"></canvas>
    <img id="cyborg" src="cyborg.png" onerror="this.style.display='none'">

    <div id="status-bar">
        <div class="dot" id="btn-close" onclick="closeAll()"></div>
        <div class="dot" id="btn-mic" onclick="activateMic()"></div>
        <div class="dot" id="btn-spk" onclick="activateSpeaker()"></div>
        <div class="dot" id="btn-files" onclick="toggle('file-window')"></div>
        <div class="dot" id="btn-sun" onclick="toggle('sun-window')"></div>
        <div class="dot" id="btn-update" onclick="checkUpdate()"></div>
    </div>

    <div id="chat-window" class="os-window">
        <div id="header">💬 HalDo AI Chat <div><button class="control-btn" id="btn-x" onclick="close('chat-window')">X</button><button class="control-btn" id="btn-min" onclick="minimize('chat-window')">–</button></div></div>
        <div id="chat-body"><img src="logo.png" style="width:40px; border-radius:50%; margin-right:10px; vertical-align:middle;" onerror="this.style.display='none'"> Willkommen Bruder! Das System läuft!</div>
        <input id="chat-input" type="text" placeholder="Sag was..." onkeydown="if(event.key==='Enter') sendMsg()">
    </div>

    <div id="file-window" class="os-window">
        <div id="header">🗂️ Innere Systeme & Daten <div><button class="control-btn" id="btn-x" onclick="close('file-window')">X</button></div></div>
        <div style="padding: 15px;">
            <div onclick="alert('Dokumente geöffnet')">📁 Dokumente</div><br>
            <div onclick="alert('Musik läuft')">🎵 Musik</div><br>
            <div onclick="alert('Video startet')">🎬 Videos</div><br>
            <div onclick="alert('Datenbank online')">📊 Datenbank</div>
        </div>
    </div>

    <div id="sun-window" class="os-window">
        <div id="header">☀️ Sonnenkern <div><button class="control-btn" id="btn-x" onclick="close('sun-window')">X</button></div></div>
        <div style="padding: 20px; text-align: center;">
            <h2 style="color: #ffaa00; text-shadow: 0 0 20px #ffaa00;">ENERGIE AKTIV</h2>
            <p>Die Sonne strahlt im Zentrum.</p>
            <button onclick="alert('Energie freigesetzt!')" style="background: #ffaa00; color: black; border: none; padding: 10px; cursor: pointer;">Energie</button>
        </div>
    </div>

    <script>
        document.querySelectorAll('#header').forEach(header => {
            header.addEventListener('mousedown', (e) => {
                const win = header.parentElement;
                let x = e.clientX - win.getBoundingClientRect().left;
                let y = e.clientY - win.getBoundingClientRect().top;
                function move(e) { win.style.left = (e.clientX - x) + 'px'; win.style.top = (e.clientY - y) + 'px'; }
                function up() { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); }
                document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            });
        });
        function close(id) { document.getElementById(id).style.display = 'none'; }
        function closeAll() { close('chat-window'); close('file-window'); close('sun-window'); }
        function minimize(id) { document.getElementById(id).style.transform = 'scale(0)'; setTimeout(() => { document.getElementById(id).style.transform = 'scale(1)'; close(id); }, 300); }
        function toggle(id) { const el = document.getElementById(id); el.style.display = (el.style.display === 'none') ? 'block' : 'none'; }
        function activateSpeaker() { const u = new SpeechSynthesisUtterance('Systeme sind bereit, Bruder!'); u.lang = 'de-DE'; speechSynthesis.speak(u); }
        function activateMic() { const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); rec.lang = 'de-DE'; rec.start(); rec.onresult = (e) => { document.getElementById('chat-input').value = e.results[0][0].transcript; sendMsg(); }; }
        function sendMsg() { const input = document.getElementById('chat-input'); const msg = input.value; if(!msg) return; document.getElementById('chat-body').innerHTML += `<br><b>Bruder:</b> ${msg}`; input.value = ""; setTimeout(() => { document.getElementById('chat-body').innerHTML += `<br><b>HalDo:</b> Befehl verstanden!`; }, 1000); }
        function checkUpdate() { alert("System ist auf dem neuesten Stand!"); }

        const canvas = document.getElementById('universe'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const sun = { x: canvas.width / 2, y: canvas.height / 2 };
        const planets = [
            { r: 30, size: 6, color: "#b0b0b0", speed: 0.0005, offset: 0 }, { r: 55, size: 10, color: "#FFD700", speed: 0.0004, offset: 1.5 },
            { r: 80, size: 12, color: "#4B90C2", speed: 0.00035, offset: 2.8 }, { r: 110, size: 9, color: "#C1440E", speed: 0.0003, offset: 4.0 },
            { r: 150, size: 25, color: "#D8CA9D", speed: 0.00025, offset: 5.2 }, { r: 190, size: 22, color: "#EEDC82", speed: 0.0002, offset: 6.4, ring: true },
            { r: 230, size: 14, color: "#00FFFF", speed: 0.00018, offset: 7.6 }, { r: 270, size: 14, color: "#4169E1", speed: 0.00015, offset: 8.8 },
            { r: 310, size: 5, color: "#F5F5DC", speed: 0.00012, offset: 10.0 }, { r: 350, size: 5, color: "#8A2BE2", speed: 0.0001, offset: 11.2 },
            { r: 390, size: 4, color: "#FFFFFF", speed: 0.00008, offset: 12.4 }, { r: 430, size: 6, color: "#FFB6C1", speed: 0.00006, offset: 13.6 }
        ];
        let t = 0;
        function drawUniverse() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let glow = 1 + Math.sin(t * 0.05) * 0.1;
            let gradient = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 180 * glow);
            gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(0.4, '#ffaa00'); gradient.addColorStop(1, 'rgba(255, 51, 0, 0)');
            ctx.beginPath(); ctx.arc(sun.x, sun.y, 120 * glow, 0, Math.PI * 2); ctx.fillStyle = gradient; ctx.fill();
            planets.forEach(p => {
                let angle = (t * p.speed) + p.offset; let x = sun.x + Math.cos(angle) * p.r; let y = sun.y + Math.sin(angle) * p.r;
                ctx.beginPath(); ctx.ellipse(sun.x, sun.y, p.r, p.r * 0.8, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(0,170,255,0.4)'; ctx.lineWidth = 1; ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 15; ctx.fill(); ctx.shadowBlur = 0;
                if (p.ring) { ctx.beginPath(); ctx.ellipse(x, y, p.size * 2, p.size * 0.5, 0.3, 0, Math.PI * 2); ctx.strokeStyle = '#EEDC82'; ctx.lineWidth = 3; ctx.stroke(); }
            });
            t += 1; requestAnimationFrame(drawUniverse);
        }
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; sun.x = canvas.width / 2; sun.y = canvas.height / 2; });
        drawUniverse();
    </script>
</body>
</html>
