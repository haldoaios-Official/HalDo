<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00e5ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦚</text></svg>">
<title>HalDo AI OS Pro Max v129</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --gold: #ffd700;
  --gold-dark: #d4af37;
  --blue-core: #0088ff;
  --blue-dark: #003366;
  --cyan: #00e5ff;
  --pink: #ff78c8;
  --purple: #b478ff;
  --bg: #02040a;
  --text: #e8f6ff;
  --dim: rgba(232, 246, 255, 0.6);
  --glass: rgba(8, 18, 38, 0.7);
  --glass-gold: rgba(255, 215, 0, 0.1);
  
  --sb-w: 72px;
  --tb-h: 56px;
  --bb-h: 64px;
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
}

[data-theme="cyborg"] {
  --gold: #ff78c8;
  --blue-core: #b478ff;
  --cyan: #ff78c8;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); user-select: none; }
button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
input, textarea, select { font-family: inherit; color: inherit; font-size: 16px; outline: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

/* COSMOS BACKGROUND */
#cosmos { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(circle at 50% 50%, #0a1530 0%, #02040a 100%); }
#cosmos canvas { display: block; }

/* TOP BAR */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; height: calc(var(--tb-h) + var(--sa-t));
  padding: var(--sa-t) calc(12px + var(--sa-r)) 0 calc(var(--sb-w) + 12px + var(--sa-l));
  display: flex; align-items: center; justify-content: space-between; z-index: 100;
  background: linear-gradient(180deg, rgba(2,4,10,0.9), transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.actions { display: flex; gap: 8px; }
.tb-btn {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--glass); border: 1.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s;
}
.tb-btn:hover { background: var(--glass-gold); box-shadow: 0 0 20px rgba(255,215,0,0.4); }

/* SIDEBAR */
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sb-w);
  padding: calc(var(--tb-h) + var(--sa-t) + 8px) 0 calc(var(--bb-h) + var(--sa-b) + 8px) 0;
  display: flex; flex-direction: column; gap: 8px;
  background: linear-gradient(90deg, rgba(2,4,10,0.95), rgba(2,4,10,0.5));
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-right: 1.5px solid var(--gold); z-index: 90; padding-left: var(--sa-l); overflow-y: auto;
}
.sb-btn {
  width: 56px; height: 56px; margin: 0 auto; border-radius: 14px;
  background: var(--glass); border: 1.5px solid var(--gold-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 18px; transition: all 0.2s; flex-shrink: 0;
}
.sb-btn .lbl { font-size: 8px; color: var(--dim); text-transform: uppercase; }
.sb-btn:hover { background: var(--glass-gold); box-shadow: 0 0 20px rgba(255,215,0,0.4); transform: translateX(2px); }

/* DESKTOP & WINDOWS */
#desktop { position: fixed; top: calc(var(--tb-h) + var(--sa-t)); left: calc(var(--sb-w) + var(--sa-l)); right: var(--sa-r); bottom: calc(var(--bb-h) + var(--sa-b)); z-index: 50; overflow: hidden; pointer-events: none; }

.win {
  position: absolute; width: 520px; height: 620px; min-width: 280px; min-height: 200px;
  background: linear-gradient(135deg, rgba(0,100,255,0.15), rgba(8,18,38,0.85), rgba(255,215,0,0.05));
  border: 2px solid var(--gold);
  border-radius: 18px;
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 30px rgba(255,215,0,0.2), inset 0 0 20px rgba(0,136,255,0.2);
  display: flex; flex-direction: column; pointer-events: auto; overflow: hidden;
  animation: winIn 0.3s ease;
}
@keyframes winIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.win-head {
  height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px 0 16px;
  background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent, rgba(0,136,255,0.15));
  border-bottom: 1.5px solid var(--gold); cursor: move; touch-action: none;
}
.win-head .title { flex: 1; font-weight: 700; font-size: 14px; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win-head .app-tools { display: flex; gap: 4px; margin-right: 6px; }
.win-head .app-tools button { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,215,0,0.1); border: 1px solid var(--gold-dark); font-size: 14px; transition: 0.2s; }
.win-head .app-tools button:hover { background: var(--gold); color: #000; }

.win-ctrls { display: flex; gap: 6px; z-index: 999999; }
.win-btn { width: 40px; height: 40px; min-width: 40px; border-radius: 10px; background: rgba(255,215,0,0.1); border: 1px solid var(--gold-dark); display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 999999; }
.win-btn:hover { background: var(--gold); color: #000; }
.win-btn.close:hover { background: #ff2244; color: #fff; border-color: #ff2244; }

.win-body { flex: 1; overflow-y: auto; padding: 16px; font-size: 14px; line-height: 1.5; }
.win-resize { position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--gold) 50%); border-bottom-right-radius: 16px; }

@media(max-width: 700px) {
  .win { width: calc(100vw - var(--sb-w) - 20px); height: calc(100vh - var(--tb-h) - var(--bb-h) - 40px); left: 10px !important; top: 10px !important; }
}

/* BOTTOM BAR */
#bottombar {
  position: fixed; bottom: 0; left: calc(var(--sb-w) + var(--sa-l)); right: var(--sa-r); height: calc(var(--bb-h) + var(--sa-b));
  padding: 0 12px var(--sa-b) 12px; display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(0deg, rgba(2,4,10,0.95), transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 95;
}
.bb-btn {
  flex: 1; max-width: 160px; height: 48px; border-radius: 14px;
  background: var(--glass); border: 1.5px solid var(--gold);
  display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 700; transition: all 0.2s;
}
.bb-btn:hover { background: var(--glass-gold); box-shadow: 0 0 20px rgba(255,215,0,0.5); transform: translateY(-2px); }
.bb-btn.cyborg { background: linear-gradient(135deg, rgba(255,120,200,0.2), rgba(180,120,255,0.2)); border-color: var(--pink); }

/* AVATAR */
#avatar { position: fixed; right: 20px; bottom: calc(var(--bb-h) + var(--sa-b) + 20px); width: 100px; height: 100px; z-index: 80; pointer-events: none; }
#avatar svg { width: 100%; height: 100%; filter: drop-shadow(0 0 15px var(--gold)); }
.eye { animation: blink 4s infinite; transform-origin: center; }
@keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
.mouth { animation: speak 0.3s infinite alternate; }
@keyframes speak { from { transform: scaleY(1); } to { transform: scaleY(0.5); } }

/* TOASTS */
#toasts { position: fixed; left: 50%; bottom: calc(var(--bb-h) + var(--sa-b) + 100px); transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: calc(100% - 40px); max-width: 400px; }
.toast { padding: 12px 18px; background: var(--glass); border: 1.5px solid var(--gold); border-radius: 14px; backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(255,215,0,0.3); font-size: 13px; text-align: center; animation: toastIn 0.3s ease; pointer-events: auto; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* DRAWER */
#appDrawer { position: fixed; top: calc(var(--tb-h) + var(--sa-t)); right: 0; bottom: calc(var(--bb-h) + var(--sa-b)); width: 340px; max-width: 90vw; background: var(--glass); border-left: 1.5px solid var(--gold); backdrop-filter: blur(24px); z-index: 900; transform: translateX(100%); transition: transform 0.3s; display: flex; flex-direction: column; }
#appDrawer.open { transform: translateX(0); }
.dr-head { padding: 14px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--gold); }
.dr-body { flex: 1; overflow-y: auto; padding: 14px; }

/* SHARED UI */
.card { background: rgba(0, 136, 255, 0.05); border: 1.5px solid var(--gold); border-radius: 14px; padding: 14px; margin-bottom: 12px; transition: all 0.2s; }
.card:hover { background: var(--glass-gold); box-shadow: 0 0 15px rgba(255,215,0,0.2); }
.card h4 { font-size: 14px; margin-bottom: 6px; color: var(--gold); }
.btn { padding: 10px 16px; min-height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #02040a; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--gold); transition: all 0.15s; }
.btn:hover { filter: brightness(1.2); box-shadow: 0 0 20px rgba(255,215,0,0.6); }
.btn.ghost { background: var(--glass); color: var(--gold); }
.btn.ghost:hover { background: var(--glass-gold); color: #fff; }
.inp { width: 100%; padding: 10px 14px; min-height: 40px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1.5px solid var(--gold-dark); color: #fff; font-size: 14px; margin-bottom: 8px; }
.inp:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(255,215,0,0.2); font-size: 12px; }
.kv .v { color: var(--gold); font-weight: 600; }
.empty { text-align: center; padding: 30px 10px; color: var(--dim); font-size: 12px; }
.centered { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 180px; gap: 12px; text-align: center; }
.big-icon { font-size: 48px; filter: drop-shadow(0 0 15px var(--gold)); }
.small { font-size: 11px; color: var(--dim); }
.progress { height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; border: 1px solid var(--gold-dark); }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-dark)); transition: width 0.3s; }
h3 { margin-bottom: 12px; font-size: 16px; color: var(--gold); }
h4 { font-size: 13px; margin: 12px 0 8px; color: var(--gold); }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
.menu-tile { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--glass); border: 1.5px solid var(--gold-dark); border-radius: 12px; font-size: 24px; padding: 6px; cursor: pointer; transition: 0.2s; }
.menu-tile:hover { background: var(--glass-gold); border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
.menu-tile .lbl { font-size: 10px; color: var(--dim); }
</style>
</head>
<body data-theme="normal">

<div id="cosmos"></div>

<div id="topbar">
  <div class="brand"><span class="dot"></span><span>HalDo AI OS</span><span style="font-size:10px;color:var(--dim);font-weight:400">v129 Gold</span></div>
  <div class="actions">
    <button class="tb-btn" id="langBtn" title="Sprache">🌐</button>
    <button class="tb-btn" id="themeBtn" title="Theme">🌗</button>
    <button class="tb-btn" id="settingsBtn" title="Einstellungen">⚙️</button>
  </div>
</div>

<aside id="sidebar"></aside>

<main id="desktop"></main>

<div id="bottombar">
  <button class="bb-btn" onclick="HalDo.apps.open('chat')">💬 Chat</button>
  <button class="bb-btn" onclick="HalDo.apps.open('avatar')">🤖 AI</button>
  <button class="bb-btn cyborg" onclick="HalDo.theme.toggle()">⚡ CYBORG</button>
</div>

<div id="toasts"></div>

<div id="avatar">
  <svg viewBox="0 0 100 100">
    <defs><radialGradient id="ag"><stop offset="0%" stop-color="var(--gold)" stop-opacity=".4"/><stop offset="100%" stop-color="var(--blue-core)" stop-opacity=".1"/></radialGradient></defs>
    <circle cx="50" cy="50" r="45" fill="url(#ag)" stroke="var(--gold)" stroke-width="2" opacity=".8"/>
    <circle cx="35" cy="45" r="6" fill="var(--gold)" class="eye"/>
    <circle cx="65" cy="45" r="6" fill="var(--gold)" class="eye"/>
    <rect x="40" y="65" width="20" height="4" rx="2" fill="var(--gold)" class="mouth"/>
  </svg>
</div>

<div id="appDrawer">
  <div class="dr-head"><span id="drTitle">Einstellungen</span><button class="win-btn close" id="drClose">✕</button></div>
  <div class="dr-body" id="drBody"></div>
</div>

<script>
/* =========================================================
   HALDO AI OS PRO MAX v129 - GOLD EDITION
   ========================================================= */

const HalDo = {
  apps: {},
  win: {},
  theme: {},
  store: {},
  util: {},
  i18n: {},
  voice: {},
  ai: {},
  avatar: {}
};

// --- STORE & UTILS ---
HalDo.store.get = (k, d) => {
  try { const v = localStorage.getItem('haldo_' + k + '_v1'); return v ? JSON.parse(v) : d; }
  catch (e) { return d; }
};
HalDo.store.set = (k, v) => {
  try { localStorage.setItem('haldo_' + k + '_v1', JSON.stringify(v)); }
  catch (e) {}
};
HalDo.util.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
HalDo.util.esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
HalDo.util.today = () => new Date().toISOString().slice(0, 10);
HalDo.util.toast = (msg) => {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 2500);
};

// --- SPRACHEN ---
const LANGS = {
  de: { name: 'Deutsch', flag: '🇩🇪', speech: 'de-DE', dir: 'ltr' },
  en: { name: 'English', flag: '🇬🇧', speech: 'en-US', dir: 'ltr' },
  tr: { name: 'Türkçe', flag: '🇹🇷', speech: 'tr-TR', dir: 'ltr' },
  ku: { name: 'Kurmancî', flag: '🟨', speech: 'tr-TR', dir: 'ltr' },
  ar: { name: 'العربية', flag: '🇸🇦', speech: 'ar-SA', dir: 'rtl' }
};

const STR = {
  de: { app_name: 'HalDo AI', home: 'Start', apps: 'Apps', settings: 'Einstellungen', chat: 'Chat', add: 'Hinzufügen', save: 'Speichern', delete: 'Löschen', search: 'Suchen', loading: 'Lade...', empty: 'Leer', ready: 'Bereit', ai: 'KI', theme: 'Theme', language: 'Sprache', total: 'Gesamt', ask_ai: 'KI fragen', class: 'Klasse', again: 'Nochmal', back: 'Zurück', speed: 'Geschwindigkeit', destination: 'Ziel', start_nav: 'Navigation starten', files: 'Dateien', setup: 'Setup', info: 'Info' },
  en: { app_name: 'HalDo AI', home: 'Home', apps: 'Apps', settings: 'Settings', chat: 'Chat', add: 'Add', save: 'Save', delete: 'Delete', search: 'Search', loading: 'Loading...', empty: 'Empty', ready: 'Ready', ai: 'AI', theme: 'Theme', language: 'Language', total: 'Total', ask_ai: 'Ask AI', class: 'Class', again: 'Again', back: 'Back', speed: 'Speed', destination: 'Destination', start_nav: 'Start nav', files: 'Files', setup: 'Setup', info: 'Info' },
  tr: { app_name: 'HalDo AI', home: 'Ana Sayfa', apps: 'Uygulamalar', settings: 'Ayarlar', chat: 'Sohbet', add: 'Ekle', save: 'Kaydet', delete: 'Sil', search: 'Ara', loading: 'Yükleniyor...', empty: 'Boş', ready: 'Hazır', ai: 'YZ', theme: 'Tema', language: 'Dil', total: 'Toplam', ask_ai: 'YZ Sor', class: 'Sınıf', again: 'Tekrar', back: 'Geri', speed: 'Hız', destination: 'Hedef', start_nav: 'Navigasyon', files: 'Dosyalar', setup: 'Kurulum', info: 'Bilgi' },
  ku: { app_name: 'HalDo AI', home: 'Mal', apps: 'Serlêdan', settings: 'Mîheng', chat: 'Axaftin', add: 'Zêde bike', save: 'Tomar', delete: 'Jê bibe', search: 'Bigere', loading: 'Tê barkirin...', empty: 'Vala', ready: 'Amade', ai: 'AI', theme: 'Mijar', language: 'Ziman', total: 'Hemî', ask_ai: 'Ji AI pirs', class: 'Çîn', again: 'Dîsa', back: 'Paşve', speed: 'Lez', destination: 'Armanc', start_nav: 'Dest pê bike', files: 'Pel', setup: 'Sazkirin', info: 'Agahî' },
  ar: { app_name: 'HalDo AI', home: 'الرئيسية', apps: 'تطبيقات', settings: 'إعدادات', chat: 'محادثة', add: 'إضافة', save: 'حفظ', delete: 'حذف', search: 'بحث', loading: 'جار التحميل...', empty: 'فارغ', ready: 'جاهز', ai: 'ذكاء', theme: 'المظهر', language: 'اللغة', total: 'المجموع', ask_ai: 'اسأل الذكاء', class: 'فئة', again: 'مرة أخرى', back: 'رجوع', speed: 'السرعة', destination: 'الوجهة', start_nav: 'ابدأ التنقل', files: 'ملفات', setup: 'إعداد', info: 'معلومات' }
};

HalDo.i18n.current = () => HalDo.store.get('lang', 'de');
HalDo.i18n.t = (k) => {
  const l = HalDo.i18n.current();
  return (STR[l] && STR[l][k]) || STR['de'][k] || k;
};
HalDo.i18n.set = (lang) => {
  if (!LANGS[lang]) lang = 'de';
  HalDo.store.set('lang', lang);
  document.documentElement.dir = LANGS[lang].dir;
  document.documentElement.lang = lang;
  HalDo.util.toast('🌐 ' + LANGS[lang].flag + ' ' + LANGS[lang].name);
  renderSidebar();
  document.querySelectorAll('.win').forEach(w => {
    const id = w.id.replace('win-', '');
    if (HalDo.apps.open && typeof HalDo.apps[id] === 'function') {
      const app = HalDo.apps[id]();
      w.querySelector('.win-body').innerHTML = app.html;
      if (app.onMount) app.onMount(w);
    }
  });
};
HalDo.i18n.langFor = (id) => HalDo.store.get('app_lang_' + id, null) || HalDo.i18n.current();
HalDo.i18n.setApp = (id, lang) => {
  HalDo.store.set('app_lang_' + id, lang);
  const w = document.getElementById('win-' + id);
  if (w && typeof HalDo.apps[id] === 'function') {
    const app = HalDo.apps[id]();
    w.querySelector('.win-body').innerHTML = app.html;
    if (app.onMount) app.onMount(w);
  }
};

// --- VOICE ---
HalDo.voice.speak = (text, langOverride) => {
  if (!('speechSynthesis' in window)) return;
  if (!HalDo.store.get('voice_on', true)) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = langOverride || HalDo.i18n.current();
    u.lang = LANGS[lang] ? LANGS[lang].speech : 'de-DE';
    u.rate = 1.05;
    u.pitch = 1.1;
    window.speechSynthesis.speak(u);
    const av = document.getElementById('avatar');
    if (av) av.classList.add('speaking');
    u.onend = () => { if (av) av.classList.remove('speaking'); };
  } catch (e) {}
};
HalDo.voice.listen = (cb, langOverride) => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { HalDo.util.toast('❌ Spracherkennung nicht verfügbar'); return; }
  const r = new SR();
  r.lang = LANGS[langOverride || HalDo.i18n.current()]?.speech || 'de-DE';
  r.interimResults = false;
  r.onresult = (e) => { cb(e.results[0][0].transcript); };
  r.onerror = () => { HalDo.util.toast('❌ Fehler bei Spracheingabe'); };
  try { r.start(); } catch (e) {}
};
HalDo.voice.beep = (freq, dur) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch (e) {}
};

// --- AI ---
HalDo.ai.ask = (msg, ctx) => {
  const lang = HalDo.i18n.current();
  const m = msg.toLowerCase().trim();
  if (m.includes('hallo') || m.includes('hi')) return { text: 'Hallo Bruder! 👋 Wie kann ich helfen?', lang };
  if (m.includes('zeit')) return { text: 'Es ist ' + new Date().toLocaleTimeString('de-DE'), lang };
  if (m.includes('datum')) return { text: 'Heute ist ' + new Date().toLocaleDateString('de-DE'), lang };
  return { text: 'Verstanden: "' + msg + '". Ich lerne noch! 💾', lang };
};

// --- WINDOW MANAGER ---
let zTop = 250;
HalDo.win.open = (id, title, html, opts = {}) => {
  const existing = document.getElementById('win-' + id);
  if (existing) { HalDo.win.focus(id); return existing; }
  
  const w = document.createElement('div');
  w.className = 'win'; w.id = 'win-' + id;
  const cnt = Object.keys(HalDo.win.open._c || {}).length;
  w.style.left = Math.max(10, (60 + (cnt * 20) % 200)) + 'px';
  w.style.top = Math.max(10, (40 + (cnt * 20) % 120)) + 'px';
  
  w.innerHTML = `
    <div class="win-head">
      <div class="title">${HalDo.util.esc(title)}</div>
      <div class="app-tools">
        <button data-tool="lang">🌐</button>
        <button data-tool="settings">⚙️</button>
        <button data-tool="ai">🤖</button>
      </div>
      <div class="win-ctrls">
        <button class="win-btn" data-act="min">—</button>
        <button class="win-btn close" data-act="close">✕</button>
      </div>
    </div>
    <div class="win-body">${html}</div>
    <div class="win-resize"></div>
  `;
  
  document.getElementById('desktop').appendChild(w);
  
  // Drag
  const head = w.querySelector('.win-head');
  let dx = 0, dy = 0, dr = false;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-btn') || e.target.closest('[data-tool]')) return;
    dr = true; HalDo.win.focus(id);
    dx = e.clientX - w.offsetLeft; dy = e.clientY - w.offsetTop;
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!dr) return;
    w.style.left = Math.max(0, Math.min(window.innerWidth - 100, e.clientX - dx)) + 'px';
    w.style.top = Math.max(0, Math.min(window.innerHeight - 100, e.clientY - dy)) + 'px';
  });
  head.addEventListener('pointerup', () => dr = false);
  head.addEventListener('pointercancel', () => dr = false);
  
  // Resize
  const rz = w.querySelector('.win-resize');
  let rs = false, rw = 0, rh = 0, rx = 0, ry = 0;
  rz.addEventListener('pointerdown', e => {
    rs = true; rw = w.offsetWidth; rh = w.offsetHeight;
    rx = e.clientX; ry = e.clientY;
    rz.setPointerCapture(e.pointerId);
    e.stopPropagation();
  });
  rz.addEventListener('pointermove', e => {
    if (!rs) return;
    w.style.width = Math.max(280, rw + (e.clientX - rx)) + 'px';
    w.style.height = Math.max(200, rh + (e.clientY - ry)) + 'px';
  });
  rz.addEventListener('pointerup', () => rs = false);
  
  // Controls
  w.querySelector('[data-act="close"]').onclick = () => {
    w.remove(); delete HalDo.win.open._c?.[id]; closeDrawer();
  };
  w.querySelector('[data-act="min"]').onclick = () => w.classList.toggle('min');
  w.querySelector('[data-tool="lang"]').onclick = () => openLangDrawer(id);
  w.querySelector('[data-tool="settings"]').onclick = () => openAppSettingsDrawer(id);
  w.querySelector('[data-tool="ai"]').onclick = () => openAIDrawer(id);
  
  w.addEventListener('pointerdown', () => HalDo.win.focus(id));
  HalDo.win.focus(id);
  HalDo.win.open._c = HalDo.win.open._c || {};
  HalDo.win.open._c[id] = 1;
  
  if (opts.onMount) setTimeout(() => opts.onMount(w), 0);
  return w;
};
HalDo.win.focus = (id) => {
  document.querySelectorAll('.win').forEach(x => x.classList.remove('active'));
  const w = document.getElementById('win-' + id);
  if (w) { w.style.zIndex = ++zTop; w.classList.add('active'); }
};

// --- 3D COSMOS ---
function init3DCosmos() {
  if (typeof THREE === 'undefined') return;
  const c = document.getElementById('cosmos');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  c.appendChild(renderer.domElement);

  // Sun
  const sunGeo = new THREE.SphereGeometry(8, 64, 64);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  scene.add(sun);
  
  // Lights
  scene.add(new THREE.PointLight(0xffffff, 2, 0, 0));
  scene.add(new THREE.AmbientLight(0x222233, 0.6));

  // Planets
  const planets = [
    { size: 0.8, dist: 15, color: 0x8c7853 },
    { size: 1.2, dist: 20, color: 0xffc649 },
    { size: 1.3, dist: 26, color: 0x4da8ff },
    { size: 1.0, dist: 32, color: 0xc1440e },
    { size: 3.0, dist: 42, color: 0xd8ca9d },
    { size: 2.5, dist: 52, color: 0xead6b8 },
    { size: 1.8, dist: 62, color: 0xa8e8ff },
    { size: 1.7, dist: 72, color: 0x5b9bd5 }
  ];

  const planetMeshes = [];
  planets.forEach(p => {
    const geo = new THREE.SphereGeometry(p.size, 32, 32);
    const mat = new THREE.MeshPhongMaterial({ color: p.color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData = { angle: Math.random() * Math.PI * 2, speed: 0.02 / p.size, dist: p.dist };
    scene.add(mesh);
    planetMeshes.push(mesh);
  });

  // Stars
  const starGeo = new THREE.BufferGeometry();
  const starCount = 1500;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i += 3) {
    starPos[i] = (Math.random() - 0.5) * 1000;
    starPos[i+1] = (Math.random() - 0.5) * 1000;
    starPos[i+2] = (Math.random() - 0.5) * 1000;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.2 }));

  scene.add(stars);
  camera.position.set(0, 25, 60);
  camera.lookAt(0, 0, 0);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    planetMeshes.forEach(p => {
      p.userData.angle += p.userData.speed * 0.01;
      p.position.x = Math.cos(p.userData.angle) * p.userData.dist;
      p.position.z = Math.sin(p.userData.angle) * p.userData.dist;
      p.rotation.y += 0.01;
    });
    stars.rotation.y += 0.0002;
    renderer.render(scene, camera);
  }
  animate();
}

APPS.chat = () => {

      </div>
    `,
    onMount: (w) => {
      const log = w.querySelector('#chatLog');
      const inp = w.querySelector('#chatIn');
      
      const render = () => {
        log.innerHTML = history.length ? history.map(h => `
          <div style="margin-bottom:8px;text-align:${h.role === 'user' ? 'right' : 'left'};">
            <div style="display:inline-block;padding:8px 12px;border-radius:14px;background:${h.role === 'user' ? 'rgba(0,136,255,0.3)' : 'rgba(255,215,0,0.2)'};border:1px solid ${h.role === 'user' ? 'var(--blue-core)' : 'var(--gold)'};max-width:85%;font-size:13px;">${HalDo.util.esc(h.text)}</div>
          </div>
        `).join('') : '<div class="empty">Schreib etwas!</div>';
        log.scrollTop = log.scrollHeight;
      };
      
      const send = (msg) => {
        if (!msg.trim()) return;
        history.push({ role: 'user', text: msg });

          HalDo.voice.speak(r.text, r.lang);
        }, 500);
      };
      
      w.querySelector('#chatSend').onclick = () => { send(inp.value); inp.value = ''; };
      inp.onkeydown = (e) => { if (e.key === 'Enter') { send(inp.value); inp.value = ''; } };

  };
