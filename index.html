<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>HalDo AI OS v140</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='82'%3E🦚%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#02040a;color:#dff6ff;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
:root{--p1:#00e5ff;--p2:#4da8ff;--p3:#b478ff;--bg-card:rgba(15,25,50,.85);--border:1.5px solid rgba(0,229,255,.4);--border-soft:1px solid rgba(0,229,255,.18);--text:#dff6ff;--text-dim:#7a9bb8;--text-mute:#4a6b88;--radius:18px;--shadow:0 10px 40px rgba(0,229,255,.15);--glow:0 0 20px rgba(0,229,255,.5);--topbar-h:56px;--bottombar-h:60px}
body.cyborg{--p1:#ff78c8;--p2:#b478ff;--p3:#ff5cae;--border:1.5px solid rgba(255,120,200,.5);--border-soft:1px solid rgba(255,120,200,.2);--glow:0 0 20px rgba(255,120,200,.6)}
#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0a1a3a,#02040a 70%)}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top);background:rgba(10,20,40,.4);backdrop-filter:blur(18px);border-bottom:var(--border-soft)}
#topbar .logo{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 6px;border-radius:10px}
#topbar .logo .peacock{font-size:22px;filter:drop-shadow(0 0 8px var(--p1))}
#topbar .logo .txt{display:flex;flex-direction:column;line-height:1.05}
#topbar .logo .txt .t1{font-size:12px;font-weight:800;color:var(--p1)}
#topbar .logo .txt .t2{font-size:8px;color:var(--text-mute);letter-spacing:1.5px}
#topbar .spacer{flex:1}
#topbar .icon-btn{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.4);border:var(--border-soft);color:var(--p1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#topbar .icon-btn:hover{background:rgba(0,229,255,.15);box-shadow:var(--glow)}
@media(max-width:380px){#topbar .icon-btn{width:34px;height:34px}#topbar .logo .txt{display:none}}
#sidebar{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));left:0;width:260px;max-width:80vw;z-index:45;padding:10px 8px;background:rgba(10,20,40,.92);backdrop-filter:blur(28px);border-right:var(--border-soft);overflow-y:auto;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#sidebar.open{transform:translateX(0)}
#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
#sidebar .group{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:12px 8px 6px}
#sidebar .item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;width:100%;text-align:left;margin-bottom:2px}
#sidebar .item:hover{background:rgba(0,229,255,.1)}
#sidebar .item .ico{font-size:20px;flex-shrink:0;width:26px;text-align:center}
#sidebar .item .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar .item .sub{font-size:9.5px;color:var(--text-mute);font-weight:600}
#sidebar .sep{height:1px;background:var(--border-soft);margin:8px 6px;border:none}
#desktop{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));left:0;right:0;bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));z-index:20;overflow:hidden;pointer-events:none}
#desktop .window{pointer-events:auto}
.window{position:absolute;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:100;min-width:260px;min-height:200px;animation:winOpen .25s ease}
@keyframes winOpen{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.window.focused{box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px rgba(0,229,255,.25);border-color:var(--p1);z-index:999}
.window.minimized{display:none}
.window.maximized{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(0,229,255,.1),transparent);border-bottom:var(--border-soft);cursor:move;flex-shrink:0;user-select:none;touch-action:none}
.titlebar .ico{font-size:18px;pointer-events:none}
.titlebar .title{flex:1;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.wbtns{display:flex;gap:5px}
.wbtn{width:36px;height:36px;min-width:36px;border-radius:9px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
.wbtn:hover{background:rgba(0,229,255,.25)}
.wbtn.close{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#ff8080}
.wbtn.set{background:rgba(180,120,255,.15);border-color:rgba(180,120,255,.5);color:#c084fc}
.wbtn.max{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:#4ade80}
.wbtn.voice{background:rgba(255,200,60,.15);border-color:rgba(255,200,60,.5);color:#fbbf24}
.wbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch}
.wbody::-webkit-scrollbar{width:6px}.wbody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.resizer{position:absolute;width:18px;height:18px;bottom:0;right:0;cursor:nwse-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;bottom:4px;right:4px;width:10px;height:10px;border-right:2px solid var(--p1);border-bottom:2px solid var(--p1);opacity:.4}
#bottombar{position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);z-index:50;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;padding-bottom:env(safe-area-inset-bottom);background:rgba(10,20,40,.4);backdrop-filter:blur(18px);border-top:var(--border-soft)}
.bbtn{min-width:80px;padding:8px 14px;border-radius:12px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bbtn:hover{background:rgba(0,229,255,.2);transform:translateY(-2px)}
.bbtn .ico{font-size:18px;line-height:1}
.bbtn.cyborg{background:rgba(255,120,200,.15);border-color:rgba(255,120,200,.5);color:#ff78c8}
@media(max-width:400px){.bbtn{min-width:66px;padding:6px 8px;font-size:10px}.bbtn .ico{font-size:16px}}
.modal{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.8);display:none;align-items:flex-start;justify-content:center;padding:14px;padding-top:calc(var(--topbar-h) + 14px);padding-bottom:calc(var(--bottombar-h) + 14px);backdrop-filter:blur(8px);overflow-y:auto}
.modal.show{display:flex}
.panel-box{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:auto 0}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg-card);backdrop-filter:blur(28px);border-bottom:var(--border-soft);z-index:2}
.phead .ico{font-size:20px}
.phead h2{font-size:13.5px;font-weight:900;color:var(--p1);flex:1}
.phead .close{width:38px;height:38px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.pbody{padding:14px 16px 18px}
.group{margin-bottom:14px;padding:12px;background:rgba(0,0,0,.2);border-radius:12px;border:var(--border-soft)}
.group h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--p1);font-weight:800;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:10px}
.row:last-child{border-bottom:none}
.row .lbl{font-size:12px;font-weight:700;flex:1;min-width:0}
.row .lbl small{display:block;font-size:10px;color:var(--text-mute);font-weight:600;margin-top:2px}
.row input[type=text],.row input[type=password]{padding:8px 10px;background:rgba(0,0,0,.4);border:var(--border-soft);border-radius:8px;font-size:12px;min-width:120px;max-width:60%;outline:none;color:inherit}
.sw{width:46px;height:24px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#7a9bb8;transition:.2s}
.sw.on{background:rgba(0,229,255,.3);border-color:var(--p1)}
.sw.on::after{left:22px;background:var(--p1);box-shadow:0 0 10px var(--p1)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-card{padding:10px 6px;border-radius:12px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.theme-card.active{border-color:var(--p1);box-shadow:var(--glow)}
.theme-card .preview{height:44px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
.theme-card .preview.kosmos{background:radial-gradient(circle at 50% 50%,#ff9028,#0a1a3a 60%,#02040a)}
.theme-card .preview.erde{background:radial-gradient(circle at 40% 40%,#4a8fd8,#1a4a8a 50%,#02040a)}
.theme-card .preview.holo{background:linear-gradient(135deg,#0a1a3a,#1a2a5a);box-shadow:inset 0 0 30px rgba(0,229,255,.3)}
.theme-card .name{font-size:10px;font-weight:800}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.speed-row input[type=range]{flex:1;accent-color:var(--p1);height:6px}
.speed-row .sv{font-size:11px;font-weight:800;color:var(--p1);min-width:50px;text-align:right;font-family:ui-monospace}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lang-card{padding:9px;border-radius:10px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.lang-card.active{border-color:var(--p1);background:rgba(0,229,255,.12)}
.lang-card .flag{font-size:20px;display:block;margin-bottom:3px}
.lang-card .name{font-size:10.5px;font-weight:800}
.voice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.voice-card{padding:11px 8px;border-radius:11px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.voice-card.active{border-color:var(--p1);background:rgba(0,229,255,.15);box-shadow:var(--glow)}
.voice-card .emoji{font-size:28px;display:block;margin-bottom:4px}
.voice-card .n{font-size:11.5px;font-weight:800}
.voice-card .d{font-size:9.5px;color:var(--text-mute);margin-top:2px}
@media(max-width:420px){.voice-grid{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(var(--bottombar-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);padding:10px 18px;background:var(--bg-card);border:var(--border);border-radius:22px;font-size:12px;font-weight:700;color:var(--p1);z-index:500;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:calc(100vw - 32px);box-shadow:var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:#22c55e;color:#4ade80}
#toast.err{border-color:#ef4444;color:#ff8080}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:11px;border:var(--border-soft);background:rgba(0,0,0,.3);color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.25));border-color:var(--p1);color:var(--text)}
.card{padding:13px;background:rgba(0,0,0,.2);border-radius:13px;border:var(--border-soft);margin-bottom:10px}
.card h3{font-size:11.5px;font-weight:900;color:var(--p1);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.btn{padding:10px 15px;border-radius:11px;border:none;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;box-shadow:0 4px 15px rgba(0,229,255,.3)}
.btn.sec{background:rgba(0,229,255,.1);color:var(--p1);border:var(--border-soft);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn.full{width:100%}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.3);border:var(--border-soft);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.placeholder{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:12px;line-height:1.6}
.msg{max-width:82%;padding:10px 14px;border-radius:15px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;font-weight:600;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(0,229,255,.1);border:var(--border-soft);border-bottom-left-radius:4px}
.chat-quick{display:flex;gap:6px;padding:6px 0 8px;overflow-x:auto;scrollbar-width:none}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{padding:6px 11px;background:rgba(0,229,255,.1);border:var(--border-soft);border-radius:14px;color:var(--text-dim);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chat-input-row{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.chat-input-row textarea{flex:1;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--text);padding:10px 14px;border-radius:20px;font-family:inherit;font-size:13px;outline:none;resize:none;line-height:1.4;min-height:42px;max-height:120px}
.chat-input-row .ibtn{width:42px;height:42px;border-radius:50%;border:var(--border-soft);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,229,255,.1);color:var(--p1)}
.chat-input-row .ibtn.send{background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;border:none}
.badge-info{padding:8px 10px;background:rgba(0,229,255,.08);border:1px dashed rgba(0,229,255,.3);border-radius:8px;font-size:10.5px;color:var(--text-dim);line-height:1.5;margin-top:6px}
.hint{position:fixed;bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-mute);background:rgba(0,0,0,.5);padding:6px 14px;border-radius:16px;z-index:15;pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;transition:opacity .3s}
.hint.hide{opacity:0}
.ez-engel{padding:14px;background:linear-gradient(135deg,rgba(216,180,120,.12),rgba(0,229,255,.08));border-radius:12px;margin-bottom:10px;border-left:3px solid #d8b478}
.ez-engel .n{font-size:14px;font-weight:900;color:#e8ca9a}
.ez-engel .sub{font-size:10.5px;color:#c084fc;font-weight:700;margin-top:2px}
.ez-engel .d{font-size:11.5px;line-height:1.6;color:var(--text-dim);margin-top:6px}
.ez-qewl{padding:14px;background:linear-gradient(135deg,rgba(180,120,255,.1),rgba(0,229,255,.08));border-radius:12px;margin-bottom:10px;border-left:3px solid var(--p3)}
.ez-qewl .t{font-size:13px;font-weight:900;color:var(--p3)}
.ez-qewl .tr{font-size:10.5px;color:#c084fc;margin-top:2px;font-style:italic}
.ez-qewl .txt{font-size:12px;line-height:1.75;color:var(--text-dim);margin-top:8px;font-style:italic}
.ez-timeline{padding:14px;background:rgba(0,0,0,.2);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--p1)}
.ez-timeline .y{font-size:10px;color:#c084fc;font-weight:800;letter-spacing:1px}
.ez-timeline .n{font-size:13px;font-weight:900;color:var(--p1);margin-top:4px}
.ez-timeline .d{font-size:11.5px;line-height:1.65;color:var(--text-dim);margin-top:6px}
.alpha-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.alpha-cell{padding:10px 4px;background:rgba(0,0,0,.2);border-radius:8px;text-align:center;border:1px solid rgba(0,229,255,.2);cursor:pointer}
.alpha-cell .ch{font-size:18px;font-weight:900;color:var(--p1)}
.alpha-cell:hover{background:rgba(0,229,255,.15)}
.contact-item{display:flex;align-items:center;gap:12px;padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px}
.contact-item .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p3));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#001428;flex-shrink:0}
.contact-item .info{flex:1;min-width:0}
.contact-item .info .nm{font-size:13px;font-weight:800}
.contact-item .info .ph{font-size:10.5px;color:var(--text-mute)}
.contact-item .actions{display:flex;gap:5px}
.contact-item .actions button{width:34px;height:34px;border-radius:50%;border:var(--border-soft);background:rgba(0,229,255,.1);color:var(--p1);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.radio-item{display:flex;align-items:center;gap:12px;padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px;cursor:pointer}
.radio-item.active{background:rgba(0,229,255,.15);border:1px solid var(--p1)}
.radio-item .logo{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.radio-item .info{flex:1;min-width:0}
.radio-item .info .nm{font-size:13px;font-weight:800}
.radio-item .info .gn{font-size:10.5px;color:var(--text-mute)}
.doc-item{display:flex;align-items:center;gap:12px;padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px;cursor:pointer}
.doc-item:hover{background:rgba(0,229,255,.1)}
.doc-item .ico{font-size:24px;flex-shrink:0}
.doc-item .info{flex:1;min-width:0}
.doc-item .info .nm{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item .info .dt{font-size:10px;color:var(--text-mute)}
.pdf-viewer{width:100%;height:100%;border:none;border-radius:10px;background:#fff}
.camera-video{width:100%;max-width:480px;border-radius:12px;background:#000;border:1px solid var(--p1)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.gallery-item{aspect-ratio:1;background:rgba(0,0,0,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;border:var(--border-soft);cursor:pointer;overflow:hidden}
.gallery-item img{width:100%;height:100%;object-fit:cover}

    for(var i=0;i<stars.length;i++){var s=stars[i];ctx.fillStyle="rgba(180,220,255,.5)";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();}
    var cx=w/2,cy=h/2,R=Math.min(w,h)*0.28;sunScreenPos={x:cx,y:cy,r:0};
    var atm=ctx.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.3);atm.addColorStop(0,"rgba(100,180,255,.45)");atm.addColorStop(1,"transparent");ctx.fillStyle=atm;ctx.beginPath();ctx.arc(cx,cy,R*1.3,0,Math.PI*2);ctx.fill();
    var g=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);g.addColorStop(0,"#6fa8dc");g.addColorStop(0.5,"#2c5f8a");g.addColorStop(1,"#0a2540");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    t+=1;
  }
  function drawHolo(){ctx.clearRect(0,0,w,h);for(var i=0;i<stars.length;i++){var s=stars[i],a=0.3+Math.sin(t*0.03+i)*0.3;ctx.fillStyle="rgba(0,229,255,"+a+")";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size*0.7,0,Math.PI*2);ctx.fill();}sunScreenPos={x:0,y:0,r:0};planetScreenPos=[];t+=1;}
  function loop(){if(theme==="kosmos")drawKosmos();else if(theme==="erde")drawErde();else drawHolo();animId=requestAnimationFrame(loop);}
  return{
    init:function(){
      canvas=$("bgCanvas");ctx=canvas.getContext("2d");resize();initStars();
      window.addEventListener("resize",resize);
      canvas.addEventListener("click",function(e){
        var rect=canvas.getBoundingClientRect();var x=e.clientX-rect.left,y=e.clientY-rect.top;
        for(var i=0;i<planetScreenPos.length;i++){var p=planetScreenPos[i];var dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<=p.r*p.r){if(p.app)Windows.open(p.app);return;}}
        if(theme==="kosmos"){var dx2=x-sunScreenPos.x,dy2=y-sunScreenPos.y;if(dx2*dx2+dy2*dy2<=(sunScreenPos.r*1.7)*(sunScreenPos.r*1.7))Windows.open("chat");}
      });
      canvas.addEventListener("mousemove",function(e){
        var rect=canvas.getBoundingClientRect();var x=e.clientX-rect.left,y=e.clientY-rect.top;var hover=false;
        if(theme==="kosmos"){var dx2=x-sunScreenPos.x,dy2=y-sunScreenPos.y;if(dx2*dx2+dy2*dy2<=(sunScreenPos.r*1.7)*(sunScreenPos.r*1.7))hover=true;}
        for(var i=0;i<planetScreenPos.length;i++){var p=planetScreenPos[i];var dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<=p.r*p.r)hover=true;}
        sunHover=hover;canvas.style.cursor=hover?"pointer":"crosshair";
      });
      if(animId)cancelAnimationFrame(animId);loop();
    },
    setTheme:function(th,spd,ck){theme=th;speedFactor=(spd||5)*0.05;if(ck!==undefined)clockOn=ck;}
  };
})();

/* ══════════════════ WINDOW MANAGER ══════════════════ */
var Windows={
  zIndexBase:100,openCount:0,
  open:function(appId){
    var app=APPS.find(function(a){return a.id===appId;});if(!app)return;
    var ex=document.querySelector('.window[data-app="'+appId+'"]');if(ex){this.focus(ex);return;}
    var desktop=$("desktop");var dRect=desktop.getBoundingClientRect();
    var isMobile=window.innerWidth<600;var ww,wh;
    if(isMobile){ww=dRect.width-8;wh=dRect.height-8;}else{ww=Math.min(dRect.width-40,700);wh=Math.min(dRect.height-40,720);}
    var off=(this.openCount%6)*22;var cx=Math.max(8,(dRect.width-ww)/2+off-40);var cy=Math.max(8,(dRect.height-wh)/2+off-40);
    if(cx+ww>dRect.width-8)cx=dRect.width-ww-8;if(cy+wh>dRect.height-8)cy=dRect.height-wh-8;
    var win=document.createElement("div");win.className="window focused";win.dataset.app=appId;
    win.style.width=ww+"px";win.style.height=wh+"px";win.style.left=cx+"px";win.style.top=cy+"px";
    win.style.zIndex=++this.zIndexBase;this.openCount++;
    win.innerHTML='<div class="titlebar"><span class="ico">'+app.ico+'</span><span class="title">'+esc(app.name)+'</span><div class="wbtns">'
      +'<button class="wbtn voice" data-wbtn="voice">🔊</button><button class="wbtn set" data-wbtn="settings">⚙️</button>'
      +'<button class="wbtn max" data-wbtn="max">□</button><button class="wbtn" data-wbtn="min">—</button>'
      +'<button class="wbtn close" data-wbtn="close">✕</button></div></div><div class="wbody"></div><div class="resizer"></div>';
    desktop.appendChild(win);
    var hn=$("hint");if(hn)hn.classList.add("hide");
    var body=win.querySelector(".wbody");
    try{if(MODULES[appId])MODULES[appId].render(body,app);else body.innerHTML='<div class="placeholder">📦 '+esc(app.name)+'</div>';}catch(e){body.innerHTML='<div class="placeholder">❌ '+esc(e.message)+'</div>';}
    this.bindWindow(win);AppSettings.applyToWindow(appId);return win;
  },
  bindWindow:function(win){
    var self=this,desktop=$("desktop");
    win.addEventListener("mousedown",function(){self.focus(win);});win.addEventListener("touchstart",function(){self.focus(win);},{passive:true});
    win.querySelectorAll("[data-wbtn]").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();var a=b.dataset.wbtn;
      if(a==="close")self.close(win);else if(a==="min")self.minimize(win);else if(a==="max")self.maximize(win);
      else if(a==="settings")AppSettings.open(win.dataset.app);else if(a==="voice"){renderVoicePanel();$("voicePanel").classList.add("show");}
    });});
    var tb=win.querySelector(".titlebar");var drag=false,sx=0,sy=0,ox=0,oy=0;
    function sd(e){if(e.target.closest(".wbtn"))return;drag=true;var p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;var wr=win.getBoundingClientRect(),dr=desktop.getBoundingClientRect();ox=wr.left-dr.left;oy=wr.top-dr.top;win.style.left=ox+"px";win.style.top=oy+"px";self.focus(win);e.preventDefault();}
    function md(e){if(!drag)return;var p=e.touches?e.touches[0]:e;var dx=p.clientX-sx,dy=p.clientY-sy;var dr=desktop.getBoundingClientRect(),ww=win.offsetWidth,wh=win.offsetHeight;win.style.left=Math.max(-ww*0.4,Math.min(dr.width-ww*0.6,ox+dx))+"px";win.style.top=Math.max(-10,Math.min(dr.height-50,oy+dy))+"px";}
    function ed(){drag=false;}
    tb.addEventListener("mousedown",sd);tb.addEventListener("touchstart",sd,{passive:false});
    document.addEventListener("mousemove",md);document.addEventListener("touchmove",md,{passive:false});
    document.addEventListener("mouseup",ed);document.addEventListener("touchend",ed);
    var rs=win.querySelector(".resizer");
    if(rs){var rz=false,rsx=0,rsy=0,rw=0,rh=0;
      function sr(e){rz=true;var p=e.touches?e.touches[0]:e;rsx=p.clientX;rsy=p.clientY;rw=win.offsetWidth;rh=win.offsetHeight;e.preventDefault();}
      function mr(e){if(!rz)return;var p=e.touches?e.touches[0]:e;var dr=desktop.getBoundingClientRect(),wr=win.getBoundingClientRect();win.style.width=Math.max(260,Math.min(dr.width-(wr.left-dr.left)+8,rw+(p.clientX-rsx)))+"px";win.style.height=Math.max(200,Math.min(dr.height-(wr.top-dr.top)+8,rh+(p.clientY-rsy)))+"px";}
      function er(){rz=false;}
      rs.addEventListener("mousedown",sr);rs.addEventListener("touchstart",sr,{passive:false});
      document.addEventListener("mousemove",mr);document.addEventListener("touchmove",mr,{passive:false});
      document.addEventListener("mouseup",er);document.addEventListener("touchend",er);
    }
  },
  focus:function(win){document.querySelectorAll(".window").forEach(function(w){w.classList.remove("focused");});win.classList.add("focused");win.classList.remove("minimized");win.style.zIndex=++this.zIndexBase;},
  minimize:function(win){win.classList.add("minimized");},
  maximize:function(win){win.classList.toggle("maximized");},
  close:function(win){win.remove();if(!document.querySelector(".window")){var hn=$("hint");if(hn)hn.classList.remove("hide");}}
};

MODULES.haldoai={render:function(el){

    $("aiSaveKey").addEventListener("click",function(){S.set("ai_key_"+prov,$("aiKey").value.trim());S.set("ai_model_"+prov,$("aiModel").value.trim());toast("💾 Key gespeichert","ok");build();});

      if(prov==="openai"){model=model||"gpt-4o-mini";return fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"},body:JSON.stringify({model:model,messages:[{role:"user",content:prompt}]})}).then(function(r){return r.json();}).then(function(d){if(d.error)throw new Error(d.error.message);return d.choices[0].message.content;});}
      if(prov==="claude"){model=model||"claude-3-5-haiku-20241022";return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true","Content-Type":"application/json"},body:JSON.stringify({model:model,max_tokens:1024,messages:[{role:"user",content:prompt}]})}).then(function(r){return r.json();}).then(function(d){if(d.error)throw new Error(d.error.message);return d.content[0].text;});}
      return Promise.reject(new Error("Provider unbekannt"));
    }
  }
  build();
}};

    el.querySelectorAll("[data-dokt]").forEach(function(x){x.addEventListener("click",function(){tab=x.dataset.dokt;build();});});
    if(tab==="text"){$("dtS").addEventListener("click",function(){var t=$("dtT").value.trim()||"Unbenannt";docs.push({title:t,body:$("dtB").value,type:"txt",date:new Date().toLocaleDateString("de-DE")});S.set("docs_items",docs);toast("💾","ok");build();});$("dtE").addEventListener("click",function(){var t=$("dtT").value.trim()||"dok";var b=new Blob([$("dtB").value],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=t+".txt";a.click();});}
    if(tab==="tabellen"){$("tbS").addEventListener("click",function(){var rows=[];for(var r=0;r<8;r++){var row=[];for(var c=0;c<5;c++){var i=el.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');row.push(i?i.value:"");}rows.push(row);}docs.push({title:"Tabelle_"+Date.now(),body:JSON.stringify(rows),type:"csv",date:new Date().toLocaleDateString("de-DE")});S.set("docs_items",docs);toast("💾","ok");});$("tbE").addEventListener("click",function(){var csv=[];for(var r=0;r<8;r++){var row=[];for(var c=0;c<5;c++){var i=el.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');row.push(i?i.value.replace(/,/g,";"):"");}csv.push(row.join(","));}var b=new Blob([csv.join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="tabelle.csv";a.click();});}
    if(tab==="pdf"){$("pdfL").addEventListener("click",function(){var u=$("pdfU").value.trim();if(!u)return;$("pdfR").innerHTML='<iframe src="'+esc(u)+'" class="pdf-viewer" style="height:400px"></iframe>';});}
    if(tab==="liste"){el.querySelectorAll("[data-di]").forEach(function(x){x.addEventListener("click",function(){var d=docs[parseInt(x.dataset.di)];if(!d)return;if(d.type==="txt"){tab="text";build();$("dtT").value=d.title;$("dtB").value=d.body;}});});el.querySelectorAll("[data-dd]").forEach(function(x){x.addEventListener("click",function(e){e.stopPropagation();docs.splice(parseInt(x.dataset.dd),1);S.set("docs_items",docs);build();});});}
  }
  build();
}};

/* ══════════════════ MEDIEN ══════════════════ */
MODULES.medien={render:function(el){
  var tab="radio";
  var RADIOS=[{n:"1LIVE",g:"Pop",e:"🎵",u:"https://wdrhf.akamaized.net/hls/live/2027955/1live/192/seglist.m3u8"},{n:"WDR 2",g:"Pop",e:"🎤",u:"https://wdrhf.akamaized.net/hls/live/2027970/wdr2rheinruhr/192/seglist.m3u8"},{n:"WDR 3",g:"Klassik",e:"🎻",u:"https://wdrhf.akamaized.net/hls/live/2027994/wdr3/192/seglist.m3u8"},{n:"WDR 4",g:"Schlager",e:"🎶",u:"https://wdrhf.akamaized.net/hls/live/2027995/wdr4/192/seglist.m3u8"},{n:"COSMO",g:"Weltmusik",e:"🌍",u:"https://wdrhf.akamaized.net/hls/live/2027997/cosmo/192/seglist.m3u8"},{n:"1LIVE diGGi",g:"Diggi",e:"🎧",u:"https://wdrhf.akamaized.net/hls/live/2027963/1livediggi/192/seglist.m3u8"}];

  function build(){
    var b='';
    if(tab==="radio")b='<div class="card"><h3>📻 Radio</h3><div id="rn" style="padding:14px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(180,120,255,.1));border-radius:12px;margin-bottom:12px;text-align:center"><div style="font-size:14px;font-weight:900;color:var(--p1)">'+(_c>=0?RADIOS[_c].n:"— Kein Sender —")+'</div><div style="font-size:10px;color:var(--text-mute);margin-top:4px" id="rs">Bereit</div></div>'+RADIOS.map(function(r,i){return '<div class="radio-item'+(_c===i?" active":"")+'" data-radio="'+i+'"><div class="logo" style="background:linear-gradient(135deg,var(--p1),var(--p3));color:#001428">'+r.e+'</div><div class="info"><div class="nm">'+esc(r.n)+'</div><div class="gn">'+esc(r.g)+'</div></div><div style="font-size:18px;color:var(--p1)">'+(_c===i?"🔊":"▶")+'</div></div>';}).join("")+'</div>';
    else if(tab==="podcast")b='<div class="card"><h3>🎧 Podcast (ARD)</h3><div class="field"><label>ARD-Audiothek URL</label><input type="text" id="podU" placeholder="https://www.ardaudiothek.de/sendung/..."></div><button class="btn full" id="podL">🎧 Anzeigen</button><div id="podR" style="margin-top:14px"></div></div>';
    else if(tab==="galerie"){var g=S.get("med_gallery",[]);b='<div class="card"><h3>🖼️ Galerie ('+g.length+')</h3><input type="file" id="gu" accept="image/*" multiple style="display:none"><button class="btn full" id="guB">📷 Hochladen</button><div class="gallery-grid" style="margin-top:12px">'+g.map(function(x,i){return '<div class="gallery-item"><img src="'+x.data+'"></div>';}).join("")+'</div></div>';}
    else if(tab==="kamera")b='<div class="card"><h3>📷 Kamera</h3><video id="cv" class="camera-video" autoplay playsinline></video><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="cs" style="flex:1">📷 Start</button><button class="btn sec" id="cx" style="flex:1">⏹ Stop</button></div><button class="btn full" id="cS" style="margin-top:8px">📸 Foto</button><canvas id="cc" style="display:none"></canvas><div id="cr" style="margin-top:12px"></div></div>';
    el.innerHTML='<div class="tabs"><button class="tab'+(tab==="radio"?" active":"")+'" data-met="radio">📻 Radio</button><button class="tab'+(tab==="podcast"?" active":"")+'" data-met="podcast">🎧 Podcast</button><button class="tab'+(tab==="galerie"?" active":"")+'" data-met="galerie">🖼️ Galerie</button><button class="tab'+(tab==="kamera"?" active":"")+'" data-met="kamera">📷 Kamera</button></div>'+b;
    el.querySelectorAll("[data-met]").forEach(function(x){x.addEventListener("click",function(){tab=x.dataset.met;build();});});
    if(tab==="radio"){el.querySelectorAll("[data-radio]").forEach(function(x){x.addEventListener("click",function(){var i=parseInt(x.dataset.radio);var r=RADIOS[i];if(_a){try{_a.pause();}catch(e){}_a=null;}if(_c===i){_c=-1;build();return;}_c=i;_a=new Audio(r.u);$("rs").textContent="⏳ Lade…";_a.play().then(function(){$("rs").textContent="🔴 Live";}).catch(function(e){$("rs").textContent="❌ "+e.message;});build();});});}
    if(tab==="podcast"){$("podL").addEventListener("click",function(){var u=$("podU").value.trim();if(!u)return;var rss=u.replace("www.ardaudiothek.de","ard2rss.mauamy.de");$("podR").innerHTML='<div style="text-align:center;padding:14px">⏳…</div>';fetch(rss).then(function(r){return r.text();}).then(function(x){var p=new DOMParser();var d=p.parseFromString(x,"text/xml");var items=d.querySelectorAll("item");if(!items.length){$("podR").innerHTML='<div style="color:var(--text-mute);padding:14px">Keine</div>';return;}var h='<div class="card"><h3>🎧 '+items.length+' Episoden</h3>';for(var i=0;i<Math.min(items.length,15);i++){var it=items[i],t=it.querySelector("title")?it.querySelector("title").textContent:"?",e=it.querySelector("enclosure"),url=e?e.getAttribute("url"):"";h+='<div class="doc-item" data-pu="'+esc(url)+'"><span class="ico">🎧</span><div class="info"><div class="nm">'+esc(t)+'</div></div><div style="color:var(--p1)">▶</div></div>';}h+='</div>';$("podR").innerHTML=h;$("podR").querySelectorAll("[data-pu]").forEach(function(b){b.addEventListener("click",function(){var u=b.dataset.pu;if(!u)return;if(_a){try{_a.pause();}catch(e){}}_a=new Audio(u);_a.play();toast("▶","ok");});});}).catch(function(e){$("podR").innerHTML='<div style="color:#ff8080;padding:14px">❌ '+esc(e.message)+'</div>';});});}
    if(tab==="galerie"){$("guB").addEventListener("click",function(){$("gu").click();});$("gu").addEventListener("change",function(e){var fs=e.target.files;if(!fs.length)return;Array.from(fs).slice(0,5).forEach(function(f){var r=new FileReader();r.onload=function(ev){if(ev.target.result.length>1500000){toast("Bild zu groß","err");return;}var g=S.get("med_gallery",[]);g.push({data:ev.target.result,name:f.name});S.set("med_gallery",g);build();};r.readAsDataURL(f);});});}
    if(tab==="kamera"){var st=null;$("cs").addEventListener("click",function(){navigator.mediaDevices.getUserMedia({video:true}).then(function(s){st=s;$("cv").srcObject=s;toast("📷 Aktiv","ok");}).catch(function(e){toast("❌ "+e.message,"err");});});$("cx").addEventListener("click",function(){if(st){st.getTracks().forEach(function(t){t.stop();});st=null;$("cv").srcObject=null;}});$("cS").addEventListener("click",function(){var v=$("cv"),c=$("cc");if(!v.srcObject){toast("Kamera nicht aktiv","err");return;}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);var data=c.toDataURL("image/jpeg",0.7);var g=S.get("med_gallery",[]);g.push({data:data,name:"foto_"+Date.now()});S.set("med_gallery",g);$("cr").innerHTML='<img src="'+data+'" style="max-width:100%;border-radius:10px;border:2px solid var(--p1)">';toast("📸","ok");});}
  }
  build();
}};

/* ══════════════════ INIT ══════════════════ */
function init(){
  Settings.load();Settings.apply();
  Voice.load();
  BG.init();
  renderSidebar();
  $("logoBtn").addEventListener("click",function(){Windows.open("chat");});
  $("sidebarBtn").addEventListener("click",function(){$("sidebar").classList.toggle("open");});
  $("voiceBtn").addEventListener("click",function(){renderVoicePanel();$("voicePanel").classList.add("show");});
  $("themeToggle").addEventListener("click",function(){var t=["kosmos","erde","holo"];var i=(t.indexOf(Settings.get("theme"))+1)%t.length;Settings.set("theme",t[i]);toast("🎨 "+t[i],"ok");});
  $("settingsBtn").addEventListener("click",function(){renderSettingsPanel();$("settings").classList.add("show");});
  $("bbChat").addEventListener("click",function(){Windows.open("chat");});
  $("bbVoice").addEventListener("click",function(){renderVoicePanel();$("voicePanel").classList.add("show");});
  $("bbCyborg").addEventListener("click",function(){Settings.set("cyborg",!Settings.get("cyborg"));toast(Settings.get("cyborg")?"⚡ CYBORG":"🎨 Normal","ok");});
  $("settingsClose").addEventListener("click",function(){$("settings").classList.remove("show");});
  $("appSetClose").addEventListener("click",function(){AppSettings.close();});
  $("voicePanelClose").addEventListener("click",function(){$("voicePanel").classList.remove("show");});
  document.querySelectorAll(".modal").forEach(function(m){m.addEventListener("click",function(e){if(e.target===m)m.classList.remove("show");});});
  setTimeout(function(){toast("🦚 Silav, "+Settings.get("userName")+"! v140 geladen","ok");},600);
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();

})();
