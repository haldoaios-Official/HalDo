<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HalDo AI OS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="HalDo AI OS — Halil Donma App · KI-betriebenes Betriebssystem im Browser">
  <title>🦚 HalDo AI OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦚</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050810'/><text x='50' y='50' text-anchor='middle' dominant-baseline='central' font-size='70'>🦚</text></svg>">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --p1: #00e5ff; --p2: #4da8ff; --p3: #b478ff;
      --bg: #050810; --bg-2: #0a0f1a;
      --card: rgba(255,255,255,.03);
      --text: #e8ecff; --text-dim: #a8b0cc; --text-mute: #6b7390;
      --border-soft: 1px solid rgba(255,255,255,.08);
      --glow: 0 0 24px rgba(0,229,255,.35);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .35s ease;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

    #haldo-root { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 1; }
    #haldo-header {
      padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,.2); backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.05);
      flex-shrink: 0; z-index: 900; height: 56px;
    }
    #haldo-title { font-size: 16px; font-weight: 900; color: var(--p1); }
    #haldo-content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px; padding-bottom: 90px;
      scroll-behavior: smooth;
    }
    #haldo-sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
      background: var(--bg-2); border-right: 1px solid rgba(255,255,255,.08);
      transform: translateX(-100%); transition: transform .3s cubic-bezier(.4,0,.2,1);
      z-index: 9999; overflow-y: auto; padding: 16px;
    }
    #haldo-sidebar.open { transform: translateX(0); }
    #haldo-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9998;
    }
    #haldo-overlay.open { opacity: 1; pointer-events: auto; }

    .card { padding: 16px; background: var(--card); border: var(--border-soft); border-radius: 14px; margin-bottom: 12px; backdrop-filter: blur(8px); }
    .card h3 { font-size: 15px; font-weight: 900; color: var(--p1); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 10.5px; color: var(--text-mute); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px; background: rgba(0,0,0,.3);
      border: var(--border-soft); border-radius: 10px; color: var(--text);
      font-size: 13px; font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--p1); box-shadow: 0 0 0 3px rgba(0,229,255,.1);
    }
    .btn {
      padding: 12px 18px; background: linear-gradient(135deg, var(--p1), var(--p3));
      border: none; border-radius: 10px; color: #000; font-size: 13px;
      font-weight: 900; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
      font-family: inherit; transition: transform .15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
    .btn.sec { background: rgba(255,255,255,.05); color: var(--text); border: var(--border-soft); }
    .btn.danger { background: linear-gradient(135deg, #ff8080, #ff4d4d); color: #fff; }
    .btn.full { width: 100%; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 9px 14px; background: rgba(255,255,255,.04);
      border: var(--border-soft); border-radius: 10px;
      color: var(--text-dim); font-size: 11.5px; font-weight: 800;
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    .tab.active { background: linear-gradient(135deg, var(--p1), var(--p3)); color: #000; border-color: transparent; }

    /* ═══════════════════════════════════════════════════════
       HALDO LOADER v3 — PEACOCK · SUN · GOLD WELCOME
       ═══════════════════════════════════════════════════════ */
    #haldo-loader {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255,220,120,.18) 0%, rgba(255,170,80,.08) 25%, transparent 55%),
        radial-gradient(ellipse at 50% 42%, #1a1208 0%, #0a0f1a 45%, #050810 75%, #000 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999; transition: opacity .6s ease;
      padding: 20px; overflow: hidden;
    }
    #haldo-loader.hide { opacity: 0; pointer-events: none; }

    /* SUN — big warm glow behind peacock */
    #haldo-loader .sun-glow {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vmax;
      height: 90vmax;
      background: radial-gradient(circle,
        rgba(255,220,90,.55) 0%,
        rgba(255,180,70,.30) 12%,
        rgba(255,140,50,.15) 25%,
        rgba(255,100,50,.05) 40%,
        transparent 65%);
      animation: haldoSunPulse 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes haldoSunPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .95; }
      50%      { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    }

    /* SUN RAYS — subtle rotating light */
    #haldo-loader .sun-rays {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120vmax;
      height: 120vmax;
      background: conic-gradient(from 0deg,
        transparent 0deg, rgba(255,215,0,.06) 8deg, transparent 16deg,
        transparent 30deg, rgba(255,215,0,.05) 38deg, transparent 46deg,
        transparent 60deg, rgba(255,215,0,.06) 68deg, transparent 76deg,
        transparent 90deg, rgba(255,215,0,.05) 98deg, transparent 106deg,
        transparent 120deg, rgba(255,215,0,.06) 128deg, transparent 136deg,
        transparent 150deg, rgba(255,215,0,.05) 158deg, transparent 166deg,
        transparent 180deg, rgba(255,215,0,.06) 188deg, transparent 196deg,
        transparent 210deg, rgba(255,215,0,.05) 218deg, transparent 226deg,
        transparent 240deg, rgba(255,215,0,.06) 248deg, transparent 256deg,
        transparent 270deg, rgba(255,215,0,.05) 278deg, transparent 286deg,
        transparent 300deg, rgba(255,215,0,.06) 308deg, transparent 316deg,
        transparent 330deg, rgba(255,215,0,.05) 338deg, transparent 346deg,
        transparent 360deg);
      animation: haldoSunRotate 40s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: .9;
    }
    @keyframes haldoSunRotate {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* INNER */
    #haldo-loader .loader-inner {
      position: relative;
      z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }

    /* PEACOCK — wings opening */
    #haldo-loader .peacock {
      font-size: clamp(80px, 16vw, 120px);
      line-height: 1;
      animation: haldoPeacockWings 3.6s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(255,215,0,.85))
              drop-shadow(0 0 60px rgba(255,180,50,.5));
      margin-bottom: 14px;
    }
    @keyframes haldoPeacockWings {
      0%, 100% { transform: scaleX(1)    scaleY(1)    rotate(0deg); }
      35%      { transform: scaleX(1.22) scaleY(1.04) rotate(-2deg); }
      65%      { transform: scaleX(1.22) scaleY(1.04) rotate(2deg); }
    }

    /* WELCOME TEXT — gold shimmer */
    #haldo-loader .welcome {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      position: relative; z-index: 3;
    }
    #haldo-loader .gold-text {
      background: linear-gradient(90deg,
        #c89a2a 0%, #ffd700 18%, #fff8b0 32%,
        #ffd700 48%, #b8860b 62%, #ffd700 78%,
        #fff8b0 88%, #c89a2a 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: haldoGoldShine 4s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255,215,0,.55))
              drop-shadow(0 0 14px rgba(255,180,50,.3));
      font-weight: 900;
    }
    @keyframes haldoGoldShine {
      to { background-position: 250% center; }
    }
    #haldo-loader .w-small   { font-size: clamp(11px, 2.4vw, 13px); letter-spacing: 4px; text-transform: uppercase; opacity: .95; }
    #haldo-loader .w-big     { font-size: clamp(26px, 6vw, 40px); letter-spacing: 3px; margin: 2px 0; }
    #haldo-loader .w-medium  { font-size: clamp(15px, 3.4vw, 20px); letter-spacing: 2px; }
    #haldo-loader .w-divider {
      font-size: 14px; margin: 10px 0 8px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      opacity: .9;
      letter-spacing: 8px;
    }
    #haldo-loader .welcome-bottom {
      margin-top: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      opacity: 0;
      animation: haldoWelcomeFade 1.2s ease 0.8s forwards;
    }
    @keyframes haldoWelcomeFade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* PROGRESS BAR */
    #haldo-loader .loader-progress {
      position: absolute;
      bottom: max(28px, env(safe-area-inset-bottom, 0px) + 28px);
      left: 50%; transform: translateX(-50%);
      width: min(300px, 82vw);
      z-index: 4;
      text-align: center;
    }
    #haldo-loader .bar-wrap {
      width: 100%; height: 3px;
      background: rgba(255,215,0,.12);
      border-radius: 2px; overflow: hidden;
      box-shadow: 0 0 8px rgba(255,215,0,.15);
    }
    #haldo-loader .bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #b8860b, #ffd700, #fff8b0, #ffd700);
      background-size: 200% 100%;
      border-radius: 2px;
      transition: width .25s ease;
      box-shadow: 0 0 14px rgba(255,215,0,.85);
      animation: haldoBarShine 2s linear infinite;
    }
    @keyframes haldoBarShine {
      to { background-position: 200% 0; }
    }
    #haldo-loader .status {
      margin-top: 10px;
      font-size: 10px;
      color: rgba(255,215,0,.65);
      font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase;
      min-height: 14px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%;
    }
    #haldo-loader .count {
      margin-top: 4px;
      font-size: 9px;
      color: rgba(255,215,0,.4);
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* ─── MISSING APPS BANNER ─── */
    #haldo-missing-banner {
      position: fixed; bottom: max(20px, env(safe-area-inset-bottom, 0px) + 20px); left: 20px; right: 20px;
      background: rgba(255,183,0,.15); border: 1px solid rgba(255,183,0,.4);
      border-radius: 12px; padding: 12px 14px;
      color: #ffd54f; font-size: 11.5px; font-weight: 700;
      z-index: 9998; display: none; align-items: center; gap: 10px;
      animation: haldoFadeIn .3s;
    }
    #haldo-missing-banner.show { display: flex; }
    #haldo-missing-banner .x { margin-left: auto; background: transparent; border: none; color: #ffd54f; font-size: 16px; cursor: pointer; padding: 0; }
    @keyframes haldoFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ─── DIAGNOSTIC PANEL ─── */
    #haldo-diag {
      position: fixed; inset: 0; z-index: 100000;
      background: rgba(5,8,16,.97);
      padding: 20px; overflow-y: auto;
      display: none;
    }
    #haldo-diag.show { display: block; }
    #haldo-diag h2 { color: var(--p1); font-size: 18px; margin-bottom: 12px; }
    #haldo-diag h3 { color: var(--text-dim); font-size: 13px; margin: 16px 0 6px; }
    #haldo-diag pre { font-size: 10.5px; color: var(--text-mute); line-height: 1.6; font-family: monospace; white-space: pre-wrap; word-break: break-all; }
    #haldo-diag .close { position: sticky; top: 0; float: right; background: var(--p1); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 900; cursor: pointer; font-family: inherit; }
    #haldo-diag .ok { color: #4ade80; }
    #haldo-diag .fail { color: #ff8080; }
  </style>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       HALDO LOADER v3 — Sonne + Pfau + Gold Willkommen
       ═══════════════════════════════════════════════════════ -->
  <div id="haldo-loader">
    <div class="sun-glow"></div>
    <div class="sun-rays"></div>

    <div class="loader-inner">
      <div class="peacock">🦚</div>
      <div class="welcome">
        <div class="w-small gold-text">Willkommen</div>
        <div class="w-big   gold-text">HalDo AI OS</div>
        <div class="w-divider">✦ ◆ ✦</div>
        <div class="w-small gold-text">HalDo AI präsentiert</div>
        <div class="welcome-bottom">
          <div class="w-medium gold-text">Willkommen in</div>
          <div class="w-big   gold-text">HalDo Blitzer</div>
          <div class="w-small gold-text">von Halil Donma</div>
        </div>
      </div>
    </div>

    <div class="loader-progress">
      <div class="bar-wrap"><div class="bar" id="haldo-bar"></div></div>
      <div class="status" id="haldo-status">System startet...</div>
      <div class="count" id="haldo-count">0 / 0</div>
    </div>
  </div>

  <!-- MISSING BANNER -->
  <div id="haldo-missing-banner">
    <span>⚠️</span>
    <span id="haldo-missing-text">—</span>

  <!-- DIAGNOSTIC -->
  <div id="haldo-diag">

  </div>

  <!-- APP -->
  <div id="haldo-overlay"></div>
  <nav id="haldo-sidebar"></nav>

  <div id="haldo-root">
    <header id="haldo-header">
      <button id="haldo-menu" style="background:transparent;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 8px">☰</button>
      <div id="haldo-title">🦚 HalDo AI OS</div>
      <button id="haldo-diag-btn" style="background:transparent;border:none;color:var(--text-mute);font-size:16px;cursor:pointer;padding:4px 8px" title="Diagnostics">⚙</button>
    </header>
    <main id="haldo-content"></main>
  </div>

  <div id="haldo-desk"></div>
  <div id="haldo-taskbar"></div>

  <script>
  /* ═══════════════════════════════════════════════════════════
     HALDO AI OS — BOOT v3.0
     · Paralleles Laden (Blitzschnell)
     · haldo-audio.js integriert
     · Goldener Willkommens-Bildschirm
     ═══════════════════════════════════════════════════════════ */
  (function(){
    "use strict";

    /* ─── APP-MANIFEST (A-Z Plan · 107 Dateien) ─── */
    var SCRIPTS = [
      /* ─── CORE ─── */
      "runtime.js",
      "store.js",
      "haldo-audio.js",       /* ★ NEU — Sound Engine */
      "voice.js",

      "apps.js",

      /* ─── KI-ENGINES ─── */

      /* ─── SYSTEM ─── */

      /* ─── KOMMUNIKATION ─── */

      /* ─── PRODUKTIVITÄT ─── */
      "tasks.js",

      "arbeitszeit.js",

      /* ─── GESUNDHEIT ─── */
      "fitness.js",

      "schlaf.js",
      "atem.js",
      "wasser.js",

      /* ─── LIFESTYLE ─── */
      "kueche.js",
      "rezept.js",
      "einkauf.js",
      "zuhause.js",
      "finanzen.js",
      "reisen.js",
      "auto.js",

      "bild.js",

      /* ─── WERKZEUGE ─── */
      "wetter.js",

      "woerterbuch.js",

      "flashcards.js",
      "lerne.js",
      "notfall.js",
      "bewertung.js",
      "spiele.js",
      "sprachen.js",

      /* ─── BILDUNG ─── */
      "fahrschule.js",
      "blitzer.js",
      "periodensystem.js",
      "mathe.js",
      "geo-quiz.js",
      "ezidi.js",
      "wissen.js",

      /* ─── UTILITIES ─── */
      "qr.js",
      "barcode.js",
      "random.js",
      "text-analyse.js",
      "datum-rechner.js",
      "netzwerk-info.js",
      "geraete-info.js",
      "weltuhr.js",
      "kamera.js",
      "spiegel.js",
      "taschenlampe.js",
      "lupe.js",

      /* ─── FINANZEN ─── */
      "kredit.js",
      "bmi.js",
      "statistik.js",
      "labor.js",

      /* ─── BÜCHER & MEDIEN ─── */
      "bookmarks.js",
      "leseliste.js",
      "sticky-notes.js",

      /* ─── HEATMAPS ─── */
      "heatmap.js",

      /* ─── I18N · VOICE ─── */
      "i18n.js",
      "voice-kurdisch.js",

      /* ─── HOME (zuletzt) ─── */
      "home.js",

      /* ─── PATCHES (nach home.js) ─── */
      "home-patch.js",

      /* ─── SPLASH (ganz zuletzt) ─── */
      "splash.js"
    ];

    var TOTAL = SCRIPTS.length;
    var MIN_DISPLAY_MS = 2400;  /* Mindest-Anzeigezeit für Willkommens-Bildschirm */

    var loaded = [];
    var missing = [];
    var completed = 0;

    /* ─── Progress-Update ─── */
    function updateProgress(current, total, label){
      var bar    = document.getElementById("haldo-bar");
      var status = document.getElementById("haldo-status");
      var count  = document.getElementById("haldo-count");
      if(bar)    bar.style.width = Math.round((current / total) * 100) + "%";
      if(status) status.textContent = label || "";
      if(count)  count.textContent = current + " / " + total;
    }

    /* ═══════════════════════════════════════════════════════
       PARALLEL LOADER — Download läuft gleichzeitig,
       Ausführung bleibt in Reihenfolge (async=false).
       Speed: ~5s → ~0.3s
       ═══════════════════════════════════════════════════════ */
    function loadAllScripts(){
      return Promise.all(SCRIPTS.map(function(src){
        return new Promise(function(resolve){
          /* Duplikat-Check */
          if(window.__haldoLoadedScripts && window.__haldoLoadedScripts[src]){
            handleResult(src, "cached");
            resolve();
            return;
          }
          if(!window.__haldoLoadedScripts) window.__haldoLoadedScripts = {};

          var s = document.createElement("script");
          s.src = src;
          s.async = false;   /* Reihenfolge beibehalten */
          s.onload = function(){
            window.__haldoLoadedScripts[src] = true;
            handleResult(src, "ok");
            resolve();
          };
          s.onerror = function(){
            handleResult(src, "fail");
            resolve();
          };
          document.head.appendChild(s);
        });
      }));
    }

    function handleResult(src, status){
      if(status === "ok" || status === "cached"){
        if(status === "ok") loaded.push(src);
      } else if(status === "fail"){
        missing.push(src);
      }
      completed++;
      var label = (status === "fail") ? ("Fehlt: " + src) : ("Lade: " + src);
      updateProgress(completed, TOTAL, label);
    }

    /* ═══════════════════════════════════════════════════════
       BOOT
       ═══════════════════════════════════════════════════════ */
    (async function(){
      var startTime = Date.now();

      updateProgress(0, TOTAL, "Initialisiere...");

      /* 1. Alle Skripte PARALLEL laden */
      await loadAllScripts();

      updateProgress(TOTAL, TOTAL, "Starte System...");

      /* 2. Mindest-Anzeigezeit für Willkommens-Bildschirm */
      var elapsed = Date.now() - startTime;
      if(elapsed < MIN_DISPLAY_MS){
        await new Promise(function(r){ setTimeout(r, MIN_DISPLAY_MS - elapsed); });
      }

      /* 3. Loader ausblenden */
      var loader = document.getElementById("haldo-loader");
      if(loader){
        loader.classList.add("hide");
        setTimeout(function(){ if(loader.parentNode) loader.remove(); }, 700);
      }

      /* 4. Shell initialisieren */
      setTimeout(function(){
        if(window.HalDo && HalDo.Shell && HalDo.Shell.init){
          try { HalDo.Shell.init(); } catch(e){ console.warn("[HalDo] Shell.init:", e); }
        }
      }, 200);

      /* 5. Fehlende Apps melden */
      reportMissing();

      /* 6. Console-Report */
      console.log("");
      console.log("╔══════════════════════════════════════════╗");
      console.log("║  🦚 HALDO AI OS — BOOT REPORT v3.0       ║");
      console.log("╠══════════════════════════════════════════╣");
      console.log("║  ✅ Geladen:  " + String(loaded.length).padStart(3, " ") + " Dateien              ║");
      console.log("║  ⚠️  Fehlend: " + String(missing.length).padStart(3, " ") + " Dateien              ║");
      console.log("║  ⚡ Boot-Zeit: " + (Date.now() - startTime) + " ms" +
                  String(Math.max(0, 25 - String(Date.now() - startTime).length - 2)).replace(/\d/g, " ") + "║");
      console.log("╚══════════════════════════════════════════╝");
      if(missing.length){
        console.log("");
        console.log("📋 FEHLENDE DATEIEN (in Ordner anlegen):");
        missing.forEach(function(m){ console.log("  · " + m); });
      }
      console.log("");
    })();

    /* ─── Missing-Report ─── */
    function reportMissing(){
      if(!missing.length) return;
      var banner = document.getElementById("haldo-missing-banner");
      var text = document.getElementById("haldo-missing-text");
      if(!banner || !text) return;
      text.textContent = missing.length + " Apps fehlen — zum Diagnose-Modus siehe ⚙-Button oben";
      banner.classList.add("show");

      var closeBtn = document.getElementById("haldo-missing-close");
      if(closeBtn) closeBtn.addEventListener("click", function(){
        banner.classList.remove("show");
      });
    }

    /* ─── Diagnostics ─── */
    function openDiagnostics(){
      var panel = document.getElementById("haldo-diag");
      var content = document.getElementById("haldo-diag-content");
      if(!panel || !content) return;

      var html = '';
      html += '<h3>📊 Boot-Zusammenfassung</h3>';
      html += '<pre>Geladen:  ' + loaded.length + ' Dateien ✅\n';
      html += 'Fehlend:  ' + missing.length + ' Dateien ⚠️\n';
      html += 'Runtime:  ' + (window.HalDo && HalDo.Runtime ? "aktiv" : "inaktiv") + '\n';
      html += 'Apps:     ' + (window.HalDo && HalDo.Apps && HalDo.Apps.listInstalled ? HalDo.Apps.listInstalled().length : 0) + '\n';
      html += 'Audio:    ' + (window.HalDoAudio ? "aktiv" : "inaktiv") + '\n';
      html += 'Settings: ' + (window.HalDo && HalDo.settings ? "v" + HalDo.settings.VERSION : "nicht geladen") + '\n';
      html += 'Home:     ' + (document.getElementById("haldoHomeRoot") ? "gerendert" : "nicht gerendert") + '\n';
      html += 'Splash:   ' + (window.__haldoSplashDone ? "ausgeführt" : "nicht ausgeführt") + '</pre>';

      if(missing.length){
        html += '<h3>⚠️ Fehlende Dateien (' + missing.length + ')</h3>';
        html += '<pre class="fail">';
        missing.forEach(function(m){ html += "  · " + m + "\n"; });
        html += '</pre>';
      } else {
        html += '<h3>✅ Alle Dateien vorhanden</h3>';
      }

      if(loaded.length){
        html += '<h3>✅ Geladene Dateien (' + loaded.length + ')</h3>';
        html += '<pre class="ok">';
        loaded.forEach(function(l){ html += "  · " + l + "\n"; });
        html += '</pre>';
      }

      content.innerHTML = html;
      panel.classList.add("show");
    }

    document.addEventListener("DOMContentLoaded", function(){
      var btn = document.getElementById("haldo-diag-btn");
      if(btn) btn.addEventListener("click", openDiagnostics);

      var closeBtn = document.getElementById("haldo-diag-close");
      if(closeBtn) closeBtn.addEventListener("click", function(){
        document.getElementById("haldo-diag").classList.remove("show");
      });

      /* Sidebar-Menü (Fallback, falls Shell sie nicht füllt) */
      var menu = document.getElementById("haldo-menu");
      var sidebar = document.getElementById("haldo-sidebar");
      var overlay = document.getElementById("haldo-overlay");
      if(menu && sidebar && overlay){
        menu.addEventListener("click", function(){
          sidebar.classList.add("open");
          overlay.classList.add("open");
        });
        overlay.addEventListener("click", function(){
          sidebar.classList.remove("open");
          overlay.classList.remove("open");
        });
      }
    });

    /* ─── Hard-Timeout: Loader nie länger als 12s (vorher 20s) ─── */
    setTimeout(function(){
      var loader = document.getElementById("haldo-loader");
      if(loader && !loader.classList.contains("hide")){
        var status = document.getElementById("haldo-status");
        if(status) status.textContent = "⚠️ Timeout — starte mit verfügbaren Apps...";
        setTimeout(function(){
          loader.classList.add("hide");
          setTimeout(function(){ if(loader.parentNode) loader.remove(); }, 700);
        }, 800);
      }
    }, 12000);

    /* ─── Globaler Error-Handler ─── */
    window.addEventListener("error", function(e){
      if(e && e.message && e.message.indexOf("Script error") === -1){
        console.warn("[HalDo Boot] Fehler:", e.message, "bei", e.filename, ":", e.lineno);
      }
    });

    /* ─── Service Worker (PWA) ─── */
    if("serviceWorker" in navigator){
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("sw.js").catch(function(){
          /* sw.js existiert noch nicht → kein Problem */
        });
      });
    }
  })();
  </script>
