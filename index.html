        '</div>'+

        /* Chat */
        '<div id="haiChat" style="flex:1;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:6px;min-height:120px"></div>'+

        /* Controls */
        '<div class="row" style="gap:6px;flex:0 0 auto">'+
          '<button class="btn" id="haiMic" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">🎤</button>'+
          '<input class="inp" id="haiInput" placeholder="Schreib mir was…" style="flex:1;min-width:0" autocomplete="off">'+
          '<button class="btn primary" id="haiSend" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">➤</button>'+
          '<button class="btn" id="haiStop" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:16px">⏹</button>'+
        '</div>'+

        /* Quick */
        '<div class="row" style="gap:5px;flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px">'+
          '<button class="btn sm" data-q="Wetter">⛅ Wetter</button>'+
          '<button class="btn sm" data-q="Wie spät ist es?">🕐 Zeit</button>'+
          '<button class="btn sm" data-q="Erzähl einen Witz">😂 Witz</button>'+
          '<button class="btn sm" data-q="Öffne Rechner">🧮 Rechner</button>'+
          '<button class="btn sm" data-q="Öffne Notizen">📝 Notizen</button>'+
          '<button class="btn sm" data-q="Wer bist du?">❓ Wer</button>'+
          '<button class="btn sm" data-q="Wer sind die Êzîdî?">🦚 Êzîdî</button>'+
        '</div>'+

        '</div>';
    },
    init: function(win){
      var chat = win.querySelector('#haiChat');
      var input = win.querySelector('#haiInput');
      var statusEl = win.querySelector('#haiStatus');
      var wakeEl = win.querySelector('#haiWake');
      var svg = win.querySelector('#haiFace svg');
      var memEl = win.querySelector('#haiMem');
      var modeShow = win.querySelector('#haiModeShow');
      var langShow = win.querySelector('#haiLangShow');
      var langSel = win.querySelector('#haiLangSel');
      var voiceSel = win.querySelector('#haiVoiceSel');

      var userName = store.get('user_name', '');
      var state = 'idle';
      var currentMode = store.get(modeKey, 'human');
      var currentLang = store.get(langKey, 'de-DE');
      var currentVoiceURI = store.get(voiceKey, null);

      /* ============ SPRACHEN ============ */
      langSel.innerHTML = LANGUAGES.map(function(l){
        return '<option value="'+l.code+'"'+(l.code===currentLang?' selected':'')+'>'+l.name+'</option>';
      }).join('');
      langSel.onchange = function(){
        currentLang = langSel.value;
        store.set(langKey, currentLang);
        var l = LANGUAGES.find(function(x){ return x.code===currentLang; });
        langShow.textContent = (l ? l.name.split(' ')[0] : currentLang).toUpperCase();
        loadVoices();
        toast('Sprache: '+(l ? l.name : currentLang));
      };

      /* ============ STIMMEN ============ */
      function loadVoices(){
        var vs = speechSynthesis.getVoices() || [];
        var prefix = currentLang.split('-')[0];
        var filtered = vs.filter(function(v){ return v.lang.toLowerCase().indexOf(prefix)===0; });
        if(!filtered.length) filtered = vs;

        var opt = '<option value="">🎙️ Auto</option>';
        filtered.forEach(function(v){
          var sel = (v.voiceURI === currentVoiceURI) ? ' selected' : '';
          opt += '<option value="'+v.voiceURI+'"'+sel+'>'+v.name+' ('+v.lang+')</option>';
        });
        voiceSel.innerHTML = opt;

        var found = filtered.some(function(v){ return v.voiceURI === currentVoiceURI; });
        if(!found && filtered.length){
          currentVoiceURI = filtered[0].voiceURI;
          store.set(voiceKey, currentVoiceURI);
          voiceSel.value = currentVoiceURI;
        }
      }
      voiceSel.onchange = function(){
        currentVoiceURI = voiceSel.value || null;
        store.set(voiceKey, currentVoiceURI);
        var v = (speechSynthesis.getVoices()||[]).find(function(x){ return x.voiceURI===currentVoiceURI; });
        toast('Stimme: '+(v ? v.name : 'Auto'));
      };
      if(typeof speechSynthesis !== 'undefined'){
        loadVoices();
        speechSynthesis.onvoiceschanged = loadVoices;
      }

      /* ============ MODE ============ */
      function setMode(m){
        currentMode = m;
        store.set(modeKey, m);
        svg.innerHTML = (m === 'robot') ? robotFace(id, accent) : humanFace(id, accent);
        modeShow.textContent = (m === 'robot') ? 'ROBOT' : 'HUMAN';
        win.querySelectorAll('[data-mode]').forEach(function(b){ b.classList.toggle('on', b.dataset.mode === m); });
      }
      win.querySelectorAll('[data-mode]').forEach(function(b){
        b.onclick = function(){ setMode(b.dataset.mode); };
      });
      setMode(currentMode);

      /* ============ CHAT ============ */
      var hist = [];
      try{ hist = JSON.parse(localStorage.getItem(chatKey)||'[]'); }catch(e){ hist = []; }

      function addMsg(who, text, save){
        save = save !== false;
        var d = document.createElement('div');
        d.style.cssText = 'padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;max-width:88%;word-wrap:break-word;'+
          (who==='u' ? 'align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#02101e;border-bottom-right-radius:4px;font-weight:500'
                     : 'background:rgba(0,229,255,.08);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px');
        d.textContent = text;
        chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
        if(save){ hist.push({w:who, t:text, ts:Date.now()}); try{ localStorage.setItem(chatKey, JSON.stringify(hist.slice(-60))); }catch(e){} }
      }

      function setStatus(s){
        state = s;
        if(s==='idle') statusEl.textContent = '● BEREIT';
        else if(s==='thinking') statusEl.textContent = '◆ DENKE…';
        else if(s==='speaking') statusEl.textContent = '🔊 SPRECHE…';
        else if(s==='listening') statusEl.textContent = '🎤 HÖRE ZU…';
      }

      /* ============ MUND ============ */
      var mouthId = null;
      function mouthOn(){
        if(mouthId) return;
        var m = win.querySelector('.hai-mouth');
        var mr = win.querySelector('.hai-mouth-robot rect');
        if(!m && !mr) return;
        var i = 0;
        mouthId = setInterval(function(){
          if(m){
            var frames = [
              'M 84 146 Q 92 140 100 143 Q 108 140 116 146 Q 108 148 100 148 Q 92 148 84 146 Z',
              'M 84 144 Q 92 142 100 142 Q 108 142 116 144 Q 108 152 100 152 Q 92 152 84 144 Z',
              'M 84 146 Q 92 138 100 142 Q 108 138 116 146 Q 108 150 100 150 Q 92 150 84 146 Z'
            ];
            m.setAttribute('d', frames[i%3]);
          }
          if(mr) mr.setAttribute('height', (i%2===0)?13:8);
          i++;
        }, 130);
      }
      function mouthOff(){
        if(mouthId){ clearInterval(mouthId); mouthId = null; }
        var m = win.querySelector('.hai-mouth');
        if(m) m.setAttribute('d','M 84 146 Q 92 140 100 143 Q 108 140 116 146 Q 108 148 100 148 Q 92 148 84 146 Z');
        var mr = win.querySelector('.hai-mouth-robot rect');
        if(mr) mr.setAttribute('height', 11);
      }

      /* ============ SPRECHEN ============ */
      function speak(text){
        var sentences = String(text).split(/(?<=[.!?])\s+/).filter(Boolean);
        if(!sentences.length) return;
        setStatus('speaking');
        mouthOn();
        var i = 0;
        function next(){
          if(i >= sentences.length){ mouthOff(); setStatus('idle'); return; }
          var s = sentences[i];
          try{
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));
            u.lang = currentLang;
            u.rate = 1.0;
            u.pitch = isCyborg ? 1.12 : (currentMode==='robot' ? 0.85 : 1.03);
            var vs = speechSynthesis.getVoices();
            if(currentVoiceURI){
              var v = vs.find(function(x){ return x.voiceURI===currentVoiceURI; });
              if(v) u.voice = v;
            } else {
              var prefix = currentLang.split('-')[0];
              var v2 = vs.find(function(x){ return x.lang.toLowerCase().indexOf(prefix)===0; });
              if(v2) u.voice = v2;
            }
            u.onend = function(){ i++; setTimeout(next, 130); };
            speechSynthesis.speak(u);
          }catch(e){ i++; next(); }
        }
        next();
      }

      /* ============ ANTWORT ============ */
      function reply(q){
        q = String(q).toLowerCase();
        var cmd = H.runCommand ? H.runCommand(q) : null;
        if(cmd) return cmd;

        var greetMatch = /(^|\s)(hallo|hi|hey|servus|silav|merhaba|haldo)(\s|$|!|\.|,)/.test(q);
        if(greetMatch){
          var h = new Date().getHours();
          if(userName){
            if(h<11) return 'Guten Morgen '+userName+', willkommen zurück! ☀️';
            if(h<18) return 'Hallo '+userName+', willkommen! 💙 Wie geht es dir?';
            if(h<22) return 'Guten Abend '+userName+'! 🌆 Schön dich zu sehen.';
            return 'Hey '+userName+', spät unterwegs? 🌙';
          }
          if(h<11) return 'Guten Morgen! ☀️ Ich bin HalDo.';
          if(h<18) return 'Hey Bruder! 💙 Ich bin HalDo. Wie heißt du?';
          if(h<22) return 'Guten Abend! 🌆 Ich bin HalDo.';
          return 'Hey, noch wach? 🌙';
        }

        var nm = q.match(/(?:ich heiße|mein name ist|ich bin der|ich bin die|navê min)\s+([a-zäöüß]{2,20})/i);
        if(nm){ userName = nm[1].charAt(0).toUpperCase()+nm[1].slice(1); store.set('user_name', userName); return 'Freut mich, '+userName+'! 💙 Ich merke mir deinen Namen.'; }

        if(/(wie geht|nasılsın|çawa yî)/.test(q)) return userName ? 'Mir geht\'s super, danke '+userName+'! Und dir? 💙' : 'Mir geht\'s super! Und dir? 💙';
        if(/(wer bist|wer du)/.test(q)) return isCyborg ? '⚡ Ich bin HalDo Cyborg — dein taktischer Begleiter.' : 'Ich bin HalDo AI 💙 — dein holografischer OS-Begleiter. Frag mich was!';
        if(/(danke|thanks|spas|teşekkür)/.test(q)) return 'Immer gerne, Bruder! ❤️';
        if(/(witz|joke)/.test(q)){ var w=['Treffen sich zwei Jäger. Beide tot 💀','Was ist grün und schwimmt? Ein Kaugummi auf Tauchgang 🟢','Warum können Geister nicht lügen? Weil sie durchsichtig sind 👻']; return w[H.rnd(0,w.length-1)]; }
        if(/(zeit|uhr|spät)/.test(q)) return '🕐 Es ist '+new Date().toLocaleTimeString('de-DE');
        if(/(datum|welcher tag)/.test(q)) return '📅 '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        if(/rechne|berechne/.test(q)){ var m=q.match(/[\d+\-*/().\s]+/); if(m){ try{ return '🧮 = '+Function('return('+m[0]+')')(); }catch(e){} } }
        if(/(öffne|starte)/.test(q)){
          if(/rechner/.test(q)){ H.open('rechner'); return '🧮 Rechner geöffnet'; }
          if(/notiz/.test(q)){ H.open('notizen'); return '📝 Notizen geöffnet'; }
          if(/aufgabe/.test(q)){ H.open('aufgaben'); return '✅ Aufgaben geöffnet'; }
          if(/kalender/.test(q)){ H.open('kalender'); return '📅 Kalender geöffnet'; }
          if(/wetter/.test(q)){ H.open('wetter'); return '⛅ Wetter geöffnet'; }
          if(/navigation/.test(q)){ H.open('navigation-pro'); return '🧭 Navigation geöffnet'; }
          if(/blitzer/.test(q)){ H.open('blitzer-pro'); return '📸 Blitzer geöffnet'; }
        }
        if(/ezidi|êzîdî|lalisch|sengal|şengal|tausi/.test(q)) return '🦚 Êzîdî — uralte kurdischsprachige Gemeinschaft aus Mesopotamien. Heiligtum Lalisch. Zentrum: Tausî Melek (Pfauengel).';
        if(/(müde|traurig|schlecht|stress)/.test(q)) return 'Oh Bruder, das klingt nicht gut 💙 Atme mal durch. Was ist los?';
        if(/(gut|super|freu)/.test(q)) return 'Das freut mich riesig! 💙';
        if(/(hilfe|help)/.test(q)) return 'Probiere: „Hallo HalDo" · „Öffne Rechner" · „Wie spät" · „Rechne 12*8" · „Erzähl einen Witz"';
        return userName ? 'Hmm '+userName+', erzähl mir mehr 💙' : 'Hmm, erzähl mir mehr 💙';
      }

      /* ============ SENDEN ============ */
      function send(text){
        text = String(text||'').trim(); if(!text) return;
        addMsg('u', text); input.value = ''; setStatus('thinking');
        setTimeout(function(){ var a = reply(text); addMsg('b', a); speak(a); }, 380);
      }

      /* ============ BEGRÜßUNG ============ */
      if(hist.length === 0){
        var h = new Date().getHours();
        var g;
        if(userName){
          if(h<11) g = 'Guten Morgen '+userName+', willkommen! ☀️';
          else if(h<18) g = 'Hallo '+userName+', willkommen zurück! 💙';
          else if(h<22) g = 'Guten Abend '+userName+'! 🌆';
          else g = 'Hey '+userName+', spät unterwegs 🌙';
        } else {
          if(h<5) g = 'Hey, noch wach? 🌙 Ich bin HalDo.';
          else if(h<11) g = 'Guten Morgen! ☀️ Ich bin HalDo. Wie heißt du?';
          else if(h<18) g = isCyborg ? '⚡ Cyborg online. Bereit.' : 'Hey Bruder! 💙 Ich bin HalDo. Wie heißt du?';
          else if(h<22) g = 'Guten Abend! 🌆 Ich bin HalDo.';
          else g = 'Hey, spät unterwegs 🌙';
        }
        addMsg('b', g);
        setTimeout(function(){ speak(g); }, 900);
      } else hist.forEach(function(m){ addMsg(m.w, m.t, false); });

      /* ============ EVENTS ============ */
      win.querySelector('#haiSend').onclick = function(){ send(input.value); };
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(input.value); });
      win.querySelector('#haiStop').onclick = function(){ try{ speechSynthesis.cancel(); }catch(e){} mouthOff(); setStatus('idle'); };
      win.querySelectorAll('[data-q]').forEach(function(b){ b.onclick = function(){ send(b.dataset.q); }; });

      /* ============ WAKE WORD ============ */
      var wakeRec = null, wakeActive = false, restartT = null;
      function startWake(){
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ wakeEl.textContent = '⚠️ Wake n. unterstützt'; return; }
        if(wakeActive) return;
        wakeRec = new SR();
        wakeRec.lang = currentLang;
        wakeRec.continuous = true;
        wakeRec.interimResults = true;
        wakeRec.onresult = function(e){
          var t = '';
          for(var i=e.resultIndex; i<e.results.length; i++) t += e.results[i][0].transcript;
          var lower = t.toLowerCase();
          if(/hallo\s*haldo|hi\s*haldo|hey\s*haldo|haldo\s+(bist|kannst|hilf|öffne|wie|wer)/.test(lower)){
            wakeEl.textContent = '🎤 AKTIV — SPRICH JETZT';
            wakeEl.classList.add('on');
            var after = lower.replace(/.*?haldo\s*/i, '').trim();
            try{ wakeRec.stop(); wakeActive = false; }catch(e){}
            setTimeout(function(){
              wakeEl.classList.remove('on');
              wakeEl.textContent = '🎤 SAG: „HALLO HALDO"';
              if(after && after.length > 2){ send(after); }
              else { send('hallo'); }
              setTimeout(startWake, 3000);
            }, 200);
          }
        };
        wakeRec.onerror = function(e){
          if(e.error==='not-allowed'){ wakeEl.textContent = '⚠️ Mikro verweigert'; }
        };
        wakeRec.onend = function(){
          wakeActive = false;
          if(wakeEl.textContent.indexOf('⚠️')<0){ restartT = setTimeout(startWake, 900); }
        };
        try{ wakeRec.start(); wakeActive = true; }catch(e){}
      }
      function stopWake(){
        if(restartT) clearTimeout(restartT);
        if(wakeRec){ try{ wakeRec.stop(); }catch(e){} wakeRec=null; }
        wakeActive = false;
        wakeEl.textContent = '🎤 Wake-Word aus (Klick = an)';
      }
      wakeEl.onclick = function(){
        if(wakeActive){ stopWake(); }
        else { wakeEl.textContent = '🎤 SAG: „HALLO HALDO"'; startWake(); }
      };
      setTimeout(function(){ try{ startWake(); }catch(e){} }, 1500);

      /* ============ MIKRO BUTTON ============ */
      var rec = null, lis = false;
      win.querySelector('#haiMic').onclick = function(){
        if(lis){ if(rec) try{ rec.stop(); }catch(e){} lis=false; win.querySelector('#haiMic').classList.remove('primary'); setStatus('idle'); return; }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ setStatus('⚠️ n. unterstützt'); return; }
        rec = new SR(); rec.lang = currentLang; rec.interimResults = false;
        rec.onresult = function(e){ lis=false; win.querySelector('#haiMic').classList.remove('primary'); send(e.results[0][0].transcript); };
        rec.onerror = function(e){ lis=false; win.querySelector('#haiMic').classList.remove('primary'); statusEl.textContent = '⚠️ '+e.error; };
        rec.onend = function(){ lis=false; win.querySelector('#haiMic').classList.remove('primary'); };
        try{ rec.start(); lis=true; win.querySelector('#haiMic').classList.add('primary'); setStatus('listening'); }catch(e){}
      };

      /* ============ MEMORY ============ */
      function updMem(){
        var n = hist.length + Object.keys(store.get('notes',[])).length + Object.keys(store.get('tasks',[])).length + Object.keys(store.get('habits',[])).length;
        memEl.textContent = n;
      }
      updMem(); setInterval(updMem, 3000);

      /* ============ CLEANUP ============ */
      win.addEventListener('remove', function(){
        mouthOff();
        try{ speechSynthesis.cancel(); }catch(e){}
        if(wakeRec){ try{ wakeRec.stop(); }catch(e){} }
        if(restartT) clearTimeout(restartT);
      });
    }
  };
}

APPS['haldo-ai'] = buildLivingAI(false);
APPS['haldo-cyborg'] = buildLivingAI(true);

})();
</script>

/* ============ BUILDER ============ */
function buildLivingAI(isCyborg){
  var id = isCyborg ? 'haldo-cyborg' : 'haldo-ai';
  var name = isCyborg ? 'HalDo Cyborg' : 'HalDo AI';
  var icon = isCyborg ? '⚡' : '🤖';

  var accent = isCyborg ? '#ff78c8' : '#00e5ff';
  var chatKey = 'living3_' + (isCyborg ? 'cyb' : 'ai') + '_v1';
  var modeKey = 'avatar_mode3_' + (isCyborg ? 'cyb' : 'ai');
  var voiceKey = 'voice_pick3_' + (isCyborg ? 'cyb' : 'ai');
  var langKey = 'voice_lang3_' + (isCyborg ? 'cyb' : 'ai');

  var LANGUAGES = [
    {code:'de-DE', name:'🇩🇪 Deutsch'},
    {code:'en-US', name:'🇬🇧 English US'},
    {code:'en-GB', name:'🇬🇧 English UK'},
    {code:'tr-TR', name:'🇹🇷 Türkçe'},
    {code:'ar-SA', name:'🇸🇦 العربية'},
    {code:'fa-IR', name:'🇮🇷 فارسی'},
    {code:'ku',    name:'🟡 Kurdî'},
    {code:'ckb',   name:'🟢 Soranî'},
    {code:'fr-FR', name:'🇫🇷 Français'},
    {code:'es-ES', name:'🇪🇸 Español'},
    {code:'it-IT', name:'🇮🇹 Italiano'},
    {code:'ru-RU', name:'🇷🇺 Русский'},
    {code:'nl-NL', name:'🇳🇱 Nederlands'},
    {code:'pl-PL', name:'🇵🇱 Polski'},
    {code:'el-GR', name:'🇬🇷 Ελληνικά'},
    {code:'he-IL', name:'🇮🇱 עברית'},
    {code:'hi-IN', name:'🇮🇳 हिन्दी'},
    {code:'ja-JP', name:'🇯🇵 日本語'},
    {code:'zh-CN', name:'🇨🇳 中文'},
    {code:'ko-KR', name:'🇰🇷 한국어'}
  ];

  return {
    name: name, icon: icon,
    render: function(){
      return '<div class="col" style="height:100%;gap:8px">'+
        '<div class="hai-stage '+(isCyborg?'hai-cyb':'')+'" id="haiStage" style="flex:0 0 auto;height:520px">'+
          '<div class="hai-grid"></div>'+
          '<div class="hai-vig"></div>'+
          '<div class="hai-mode-toggle">'+
            '<button data-mode="human">🧑 MENSCH</button>'+
            '<button data-mode="robot">🤖 ROBOT</button>'+
            '<button data-mode="logo">🖼️ LOGO</button>'+
          '</div>'+
          '<div class="hai-voice-bar">'+
            '<span class="ic">🗣️</span><select id="haiLangSel"></select>'+
            '<span class="ic">🔊</span><select id="haiVoiceSel"></select>'+
          '</div>'+
          '<div class="hai-logo-badge">'+
            '<img src="logo.png" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\';this.parentNode.textContent=\'🦚\';">'+
          '</div>'+
          '<div class="hai-floor"><div class="r"></div><div class="r"></div><div class="r"></div><div class="core"></div></div>'+
          '<div class="hai-hud hai-l1"><b>SYSTEM</b><span class="v">AKTIV</span></div>'+
          '<div class="hai-hud hai-l2"><b>STIMMUNG</b><span class="v">98%</span></div>'+
          '<div class="hai-hud hai-l3"><b>CPU</b><span class="bar" style="width:14px"></span><span class="bar" style="width:14px"></span><span class="bar" style="width:6px;opacity:.5"></span></div>'+
          '<div class="hai-hud hai-l4"><b>SPRACHE</b><span class="v" id="haiLangShow" style="font-size:11px">DE</span></div>'+
          '<div class="hai-hud hai-r1"><b>NETZWERK</b><span class="v">● LIVE</span></div>'+
          '<div class="hai-hud hai-r2"><b>MEMORY</b><span class="v" id="haiMem">0</span></div>'+
          '<div class="hai-hud hai-r3"><b>SIGNAL</b><span class="bar" style="width:6px"></span><span class="bar" style="width:12px"></span><span class="bar" style="width:18px"></span></div>'+
          '<div class="hai-hud hai-r4"><b>MODUS</b><span class="v" id="haiModeShow" style="font-size:11px">HUMAN</span></div>'+
          '<div class="hai-hud hai-t"><b>◆ '+short+' AI CORE ◆</b><span style="font-size:8px;opacity:.75">v3.0 · ONLINE</span></div>'+
          '<div class="hai-hud hai-b" id="haiStatus">● BEREIT</div>'+
          '<div class="hai-wave">'+
            '<span></span><span></span><span></span><span></span><span></span><span></span><span></span>'+
            '<span></span><span></span><span></span><span></span><span></span><span></span><span></span>'+
          '</div>'+
          '<div class="hai-scan"></div>'+
          '<div class="hai-avatar" id="haiFace"><svg viewBox="0 0 200 320" xmlns="http://www.w3.org/2000/svg"></svg></div>'+
          '<div class="hai-logo-wrap" id="haiLogoWrap" style="display:none"></div>'+
          '<div class="hai-wake" id="haiWake">🎤 SAG: „HALLO HALDO"</div>'+
        '</div>'+
        '<div id="haiChat" style="flex:1;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:6px;min-height:120px"></div>'+
        '<div class="row" style="gap:6px;flex:0 0 auto">'+
          '<button class="btn" id="haiMic" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">🎤</button>'+
          '<input class="inp" id="haiInput" placeholder="Schreib mir was…" style="flex:1;min-width:0" autocomplete="off">'+
          '<button class="btn primary" id="haiSend" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:18px">➤</button>'+
          '<button class="btn" id="haiStop" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:16px">⏹</button>'+
        '</div>'+
        '<div class="row" style="gap:5px;flex:0 0 auto;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px">'+
          '<button class="btn sm" data-q="Wetter">⛅ Wetter</button>'+
          '<button class="btn sm" data-q="Wie spät ist es?">🕐 Zeit</button>'+
          '<button class="btn sm" data-q="Erzähl einen Witz">😂 Witz</button>'+
          '<button class="btn sm" data-q="Öffne Rechner">🧮 Rechner</button>'+
          '<button class="btn sm" data-q="Öffne Notizen">📝 Notizen</button>'+
          '<button class="btn sm" data-q="Wer bist du?">❓ Wer</button>'+
          '<button class="btn sm" data-q="Wer sind die Êzîdî?">🦚 Êzîdî</button>'+
        '</div>'+
        '</div>';
    },
    init: function(win){
      var chat = win.querySelector('#haiChat');
      var input = win.querySelector('#haiInput');
      var statusEl = win.querySelector('#haiStatus');
      var wakeEl = win.querySelector('#haiWake');
      var svg = win.querySelector('#haiFace svg');
      var svgWrap = win.querySelector('#haiFace');
      var logoWrap = win.querySelector('#haiLogoWrap');
      var memEl = win.querySelector('#haiMem');
      var modeShow = win.querySelector('#haiModeShow');
      var langShow = win.querySelector('#haiLangShow');
      var langSel = win.querySelector('#haiLangSel');
      var voiceSel = win.querySelector('#haiVoiceSel');
      var stage = win.querySelector('#haiStage');

      var userName = store.get('user_name', '');
      var state = 'idle';
      var currentMode = store.get(modeKey, 'human');
      var currentLang = store.get(langKey, 'de-DE');
      var currentVoiceURI = store.get(voiceKey, null);

      langSel.innerHTML = LANGUAGES.map(function(l){
        return '<option value="'+l.code+'"'+(l.code===currentLang?' selected':'')+'>'+l.name+'</option>';
      }).join('');
      langSel.onchange = function(){
        currentLang = langSel.value;
        store.set(langKey, currentLang);
        var l = LANGUAGES.find(function(x){ return x.code===currentLang; });
        langShow.textContent = (l ? l.name.split(' ')[0] : currentLang).toUpperCase();
        loadVoices();
        toast('Sprache: '+(l ? l.name : currentLang));
      };

      function loadVoices(){
        var vs = speechSynthesis.getVoices() || [];
        var prefix = currentLang.split('-')[0];
        var filtered = vs.filter(function(v){ return v.lang.toLowerCase().indexOf(prefix)===0; });
        if(!filtered.length) filtered = vs;
        var opt = '<option value="">🎙️ Auto</option>';
        filtered.forEach(function(v){
          opt += '<option value="'+v.voiceURI+'"'+(v.voiceURI===currentVoiceURI?' selected':'')+'>'+v.name+'</option>';
        });
        voiceSel.innerHTML = opt;
      }
      voiceSel.onchange = function(){
        currentVoiceURI = voiceSel.value || null;
        store.set(voiceKey, currentVoiceURI);
      };
      if(typeof speechSynthesis !== 'undefined'){
        loadVoices();
        speechSynthesis.onvoiceschanged = loadVoices;
      }

      /* ============ MODE ============ */
      function setMode(m){
        currentMode = m;
        store.set(modeKey, m);
        if(m === 'robot'){
          svg.innerHTML = robotFace(id, accent);
          svgWrap.style.display = '';
          logoWrap.style.display = 'none';
          modeShow.textContent = 'ROBOT';
        } else if(m === 'logo'){
          logoWrap.innerHTML = logoMarkup(accent);
          svgWrap.style.display = 'none';
          logoWrap.style.display = 'grid';
          modeShow.textContent = 'LOGO';
        } else {
          svg.innerHTML = humanFace(id, accent);
          svgWrap.style.display = '';
          logoWrap.style.display = 'none';
          modeShow.textContent = 'HUMAN';
        }
        win.querySelectorAll('[data-mode]').forEach(function(b){ b.classList.toggle('on', b.dataset.mode === m); });
      }
      win.querySelectorAll('[data-mode]').forEach(function(b){
        b.onclick = function(){ setMode(b.dataset.mode); };
      });
      setMode(currentMode);

      /* ============ CHAT ============ */
      var hist = [];
      try{ hist = JSON.parse(localStorage.getItem(chatKey)||'[]'); }catch(e){ hist = []; }

      function addMsg(who, text, save){
        save = save !== false;
        var d = document.createElement('div');
        d.style.cssText = 'padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;max-width:88%;word-wrap:break-word;'+
          (who==='u' ? 'align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#02101e;border-bottom-right-radius:4px;font-weight:500'
                     : 'background:rgba(0,229,255,.08);border:1.5px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px');
        d.textContent = text;
        chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
        if(save){ hist.push({w:who, t:text, ts:Date.now()}); try{ localStorage.setItem(chatKey, JSON.stringify(hist.slice(-60))); }catch(e){} }
      }

      function setStatus(s){
        state = s;
        if(s==='idle') statusEl.textContent = '● BEREIT';
        else if(s==='thinking') statusEl.textContent = '◆ DENKE…';
        else if(s==='speaking') statusEl.textContent = '🔊 SPRECHE…';
        else if(s==='listening') statusEl.textContent = '🎤 HÖRE ZU…';
        /* Logo-Speaking-Klasse */
        if(s === 'speaking'){ logoWrap.classList.add('hai-speaking'); }
        else { logoWrap.classList.remove('hai-speaking'); }
      }

      /* ============ MUND ============ */
      var mouthId = null;
      function mouthOn(){
        if(mouthId) return;
        var m = win.querySelector('.hai-mouth');
        var mr = win.querySelector('.hai-mouth-robot rect');
        if(!m && !mr) return;
        var i = 0;
        mouthId = setInterval(function(){
          if(m){
            var frames = [
              'M 84 146 Q 92 139 100 142 Q 108 139 116 146 Q 108 149 100 149 Q 92 149 84 146 Z',
              'M 84 143 Q 92 141 100 141 Q 108 141 116 143 Q 108 153 100 153 Q 92 153 84 143 Z',
              'M 84 146 Q 92 137 100 141 Q 108 137 116 146 Q 108 151 100 151 Q 92 151 84 146 Z'
            ];
            m.setAttribute('d', frames[i%3]);
          }
          if(mr) mr.setAttribute('height', (i%2===0)?13:8);
          i++;
        }, 130);
      }
      function mouthOff(){
        if(mouthId){ clearInterval(mouthId); mouthId = null; }
        var m = win.querySelector('.hai-mouth');
        if(m) m.setAttribute('d','M 84 146 Q 92 139 100 142 Q 108 139 116 146 Q 108 149 100 149 Q 92 149 84 146 Z');
        var mr = win.querySelector('.hai-mouth-robot rect');
        if(mr) mr.setAttribute('height', 11);
      }

      /* ============ SPRECHEN ============ */
      function speak(text){
        var sentences = String(text).split(/(?<=[.!?])\s+/).filter(Boolean);
        if(!sentences.length) return;
        setStatus('speaking');
        mouthOn();
        var i = 0;
        function next(){
          if(i >= sentences.length){ mouthOff(); setStatus('idle'); return; }
          var s = sentences[i];
          try{
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''));
            u.lang = currentLang;
            u.rate = 1.0;
            u.pitch = isCyborg ? 1.12 : (currentMode==='robot' ? 0.85 : 1.03);
            var vs = speechSynthesis.getVoices();
            if(currentVoiceURI){
              var v = vs.find(function(x){ return x.voiceURI===currentVoiceURI; });
              if(v) u.voice = v;
            } else {
              var prefix = currentLang.split('-')[0];
              var v2 = vs.find(function(x){ return x.lang.toLowerCase().indexOf(prefix)===0; });
              if(v2) u.voice = v2;
            }
            u.onend = function(){ i++; setTimeout(next, 130); };
            speechSynthesis.speak(u);
          }catch(e){ i++; next(); }
        }
        next();
      }

      /* ============ ANTWORT ============ */
      function reply(q){
        q = String(q).toLowerCase();
        var cmd = H.runCommand ? H.runCommand(q) : null;
        if(cmd) return cmd;

        var greetMatch = /(^|\s)(hallo|hi|hey|servus|silav|merhaba|haldo)(\s|$|!|\.|,)/.test(q);
        if(greetMatch){
          var h = new Date().getHours();
          if(userName){
            if(h<11) return 'Guten Morgen '+userName+', willkommen zurück! ☀️';
            if(h<18) return 'Hallo '+userName+', willkommen! 💙 Wie geht es dir?';
            if(h<22) return 'Guten Abend '+userName+'! 🌆 Schön dich zu sehen.';
            return 'Hey '+userName+', spät unterwegs? 🌙';
          }
          if(h<11) return 'Guten Morgen! ☀️ Ich bin HalDo.';
          if(h<18) return 'Hey Bruder! 💙 Ich bin HalDo. Wie heißt du?';
          if(h<22) return 'Guten Abend! 🌆 Ich bin HalDo.';
          return 'Hey, noch wach? 🌙';
        }

        var nm = q.match(/(?:ich heiße|mein name ist|ich bin der|ich bin die|navê min)\s+([a-zäöüß]{2,20})/i);
        if(nm){ userName = nm[1].charAt(0).toUpperCase()+nm[1].slice(1); store.set('user_name', userName); return 'Freut mich, '+userName+'! 💙 Ich merke mir deinen Namen.'; }

        if(/(wie geht|nasılsın|çawa yî)/.test(q)) return userName ? 'Mir geht\'s super, danke '+userName+'! Und dir? 💙' : 'Mir geht\'s super! Und dir? 💙';
        if(/(wer bist|wer du)/.test(q)) return isCyborg ? '⚡ Ich bin HalDo Cyborg.' : 'Ich bin HalDo AI 💙 — dein OS-Begleiter.';
        if(/(danke|thanks|spas|teşekkür)/.test(q)) return 'Immer gerne, Bruder! ❤️';
        if(/(witz|joke)/.test(q)){ var w=['Treffen sich zwei Jäger. Beide tot 💀','Was ist grün und schwimmt? Ein Kaugummi auf Tauchgang 🟢','Warum können Geister nicht lügen? Weil sie durchsichtig sind 👻']; return w[H.rnd(0,w.length-1)]; }
        if(/(zeit|uhr|spät)/.test(q)) return '🕐 Es ist '+new Date().toLocaleTimeString('de-DE');
        if(/(datum|welcher tag)/.test(q)) return '📅 '+new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        if(/rechne|berechne/.test(q)){ var m=q.match(/[\d+\-*/().\s]+/); if(m){ try{ return '🧮 = '+Function('return('+m[0]+')')(); }catch(e){} } }
        if(/(öffne|starte)/.test(q)){
          if(/rechner/.test(q)){ H.open('rechner'); return '🧮 Rechner geöffnet'; }
          if(/notiz/.test(q)){ H.open('notizen'); return '📝 Notizen geöffnet'; }
          if(/aufgabe/.test(q)){ H.open('aufgaben'); return '✅ Aufgaben geöffnet'; }
          if(/kalender/.test(q)){ H.open('kalender'); return '📅 Kalender geöffnet'; }
          if(/wetter/.test(q)){ H.open('wetter'); return '⛅ Wetter geöffnet'; }
          if(/navigation/.test(q)){ H.open('navigation-pro'); return '🧭 Navigation geöffnet'; }
          if(/blitzer/.test(q)){ H.open('blitzer-pro'); return '📸 Blitzer geöffnet'; }
        }
        if(/ezidi|êzîdî|lalisch|sengal|şengal|tausi/.test(q)) return '🦚 Êzîdî — uralte kurdischsprachige Gemeinschaft. Heiligtum Lalisch. Zentrum: Tausî Melek.';
        if(/(müde|traurig|schlecht|stress)/.test(q)) return 'Oh Bruder, das klingt nicht gut 💙 Atme mal durch.';
        if(/(gut|super|freu)/.test(q)) return 'Das freut mich riesig! 💙';
        if(/(hilfe|help)/.test(q)) return 'Probiere: „Hallo HalDo" · „Öffne Rechner" · „Wie spät" · „Rechne 12*8"';
        return userName ? 'Hmm '+userName+', erzähl mir mehr 💙' : 'Hmm, erzähl mir mehr 💙';
      }

      function send(text){
        text = String(text||'').trim(); if(!text) return;
        addMsg('u', text); input.value = ''; setStatus('thinking');
        setTimeout(function(){ var a = reply(text); addMsg('b', a); speak(a); }, 380);
      }

      /* ============ BEGRÜßUNG ============ */
      if(hist.length === 0){
        var h = new Date().getHours();
        var g;
        if(userName){
          if(h<11) g = 'Guten Morgen '+userName+', willkommen! ☀️';
          else if(h<18) g = 'Hallo '+userName+', willkommen zurück! 💙';
          else if(h<22) g = 'Guten Abend '+userName+'! 🌆';
          else g = 'Hey '+userName+', spät unterwegs 🌙';
        } else {
          if(h<5) g = 'Hey, noch wach? 🌙';
          else if(h<11) g = 'Guten Morgen! ☀️ Ich bin HalDo.';
          else if(h<18) g = isCyborg ? '⚡ Cyborg online.' : 'Hey Bruder! 💙 Ich bin HalDo. Wie heißt du?';
          else if(h<22) g = 'Guten Abend! 🌆';
          else g = 'Hey, spät unterwegs 🌙';
        }
        addMsg('b', g);
        setTimeout(function(){ speak(g); }, 900);
      } else hist.forEach(function(m){ addMsg(m.w, m.t, false); });

      /* ============ UI ============ */
      win.querySelector('#haiSend').onclick = function(){ send(input.value); };
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') send(input.value); });
      win.querySelector('#haiStop').onclick = function(){ try{ speechSynthesis.cancel(); }catch(e){} mouthOff(); setStatus('idle'); };
      win.querySelectorAll('[data-q]').forEach(function(b){ b.onclick = function(){ send(b.dataset.q); }; });

      /* ============ WAKE ============ */
      var wakeRec = null, wakeActive = false, restartT = null;
      function startWake(){
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ wakeEl.textContent = '⚠️ Wake n. unterstützt'; return; }
        if(wakeActive) return;
        wakeRec = new SR();
        wakeRec.lang = currentLang;
        wakeRec.continuous = true;
        wakeRec.interimResults = true;
        wakeRec.onresult = function(e){
          var t = '';
          for(var i=e.resultIndex; i<e.results.length; i++) t += e.results[i][0].transcript;
          var lower = t.toLowerCase();
          if(/hallo\s*haldo|hi\s*haldo|hey\s*haldo|haldo\s+(bist|kannst|hilf|öffne|wie|wer)/.test(lower)){
            wakeEl.textContent = '🎤 AKTIV — SPRICH JETZT';
            wakeEl.classList.add('on');
            var after = lower.replace(/.*?haldo\s*/i, '').trim();
            try{ wakeRec.stop(); wakeActive = false; }catch(e){}
            setTimeout(function(){
              wakeEl.classList.remove('on');
              wakeEl.textContent = '🎤 SAG: „HALLO HALDO"';
              if(after && after.length > 2){ send(after); } else { send('hallo'); }
              setTimeout(startWake, 3000);
            }, 200);
          }
        };
        wakeRec.onerror = function(e){ if(e.error==='not-allowed'){ wakeEl.textContent = '⚠️ Mikro verweigert'; } };
        wakeRec.onend = function(){
          wakeActive = false;
          if(wakeEl.textContent.indexOf('⚠️')<0){ restartT = setTimeout(startWake, 900); }
        };
        try{ wakeRec.start(); wakeActive = true; }catch(e){}
      }
      function stopWake(){
        if(restartT) clearTimeout(restartT);
        if(wakeRec){ try{ wakeRec.stop(); }catch(e){} wakeRec=null; }
        wakeActive = false;
        wakeEl.textContent = '🎤 Wake aus (Klick = an)';
      }
      wakeEl.onclick = function(){
        if(wakeActive){ stopWake(); }
        else { wakeEl.textContent = '🎤 SAG: „HALLO HALDO"'; startWake(); }
      };
      setTimeout(function(){ try{ startWake(); }catch(e){} }, 1500);

      /* ============ MIC ============ */
      var rec = null, lis = false;
      win.querySelector('#haiMic').onclick = function(){
        if(lis){ if(rec) try{ rec.stop(); }catch(e){} lis=false; win.querySelector('#haiMic').classList.remove('primary'); setStatus('idle'); return; }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR){ setStatus('⚠️ n. unterstützt'); return; }
        rec = new SR(); rec.lang = currentLang; rec.interimResults = false;
        rec.onresult = function(e){ lis=false; win.querySelector('#haiMic').classList.remove('primary'); send(e.results[0][0].transcript); };
        rec.onerror = function(e){ lis=false; win.querySelector('#haiMic').classList.remove('primary'); statusEl.textContent = '⚠️ '+e.error; };
        rec.onend = function(){ lis=false; win.querySelector('#haiMic').classList.remove('primary'); };
        try{ rec.start(); lis=true; win.querySelector('#haiMic').classList.add('primary'); setStatus('listening'); }catch(e){}
      };

      /* ============ MEMORY ============ */
      function updMem(){
        var n = hist.length + Object.keys(store.get('notes',[])).length + Object.keys(store.get('tasks',[])).length;
        memEl.textContent = n;
      }
      updMem(); setInterval(updMem, 3000);

      win.addEventListener('remove', function(){
        mouthOff();
        try{ speechSynthesis.cancel(); }catch(e){}
        if(wakeRec){ try{ wakeRec.stop(); }catch(e){} }
        if(restartT) clearTimeout(restartT);
      });
    }
  };
}

     HalDo AI OS · Block 5 · Hände + App-Zeigen + Sprachsteuerung
     Animierter Charakter mit Armen und Händen

<script>
(function(){
'use strict';
var H = window.HalDo;
if(!H || !H.APPS){ console.error('[Block 5] Foundation fehlt'); return; }
var APPS = H.APPS;
var $=H.$, $$=H.$$, el=H.el, esc=H.esc, uid=H.uid, store=H.store, toast=H.toast;

/* ============================================================
   1. APP-POSITIONEN auf dem Bildschirm
   ============================================================ */
var APP_POSITIONS = [
  {id:'rechner',     x:15, y:25, icon:'🧮'},
  {id:'notizen',     x:50, y:15, icon:'📝'},
  {id:'aufgaben',    x:85, y:25, icon:'✅'},
  {id:'kalender',    x:15, y:55, icon:'📅'},
  {id:'wetter',      x:85, y:55, icon:'⛅'},
  {id:'navigation-pro', x:50, y:75, icon:'🧭'}
];

/* ============================================================
   2. AVATAR-MODUL — Arm + Hand Steuerung
   ============================================================ */
var AvatarHands = {
  canvas: null,
  ctx: null,
  leftArm: {x1:0, y1:0, x2:0, y2:0, handX:0, handY:0},
  rightArm: {x1:0, y1:0, x2:0, y2:0, handX:0, handY:0},
  pointing: null,  /* aktuell zeigende App */

  init: function(canvas){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', this.resize.bind(this));
  },

  resize: function(){
    if(!this.canvas) return;
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
    this.canvas.style.width = window.innerWidth+'px';
    this.canvas.style.height = window.innerHeight+'px';
  },

  /* Zeige auf eine App */
  pointAt: function(appId){
    var app = APP_POSITIONS.find(function(a){ return a.id === appId; });
    if(!app) return;
    this.pointing = app;
    toast('👉 '+app.icon+' '+appId);
  },

  /* Zeichne Arme + Hände */
  draw: function(){
    if(!this.ctx) return;
    var ctx = this.ctx;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    var cx = this.canvas.width / 2;
    var cy = this.canvas.height * 0.65;
    var shoulderY = cy - 80;

    /* Linker Arm (schwingt mit) */
    var t = Date.now() / 1000;
    var leftHandX = cx - 90 + Math.sin(t * 1.5) * 15;
    var leftHandY = shoulderY + 120 + Math.cos(t * 1.3) * 10;

    /* Rechter Arm — zeigt auf App wenn pointing */
    var rightHandX, rightHandY;
    if(this.pointing){
      var targetX = this.canvas.width * (this.pointing.x / 100);
      var targetY = this.canvas.height * (this.pointing.y / 100);
      rightHandX = cx + (targetX - cx) * 0.75 + Math.sin(t * 2) * 5;
      rightHandY = shoulderY + (targetY - shoulderY) * 0.75 + Math.cos(t * 2) * 5;
    } else {
      rightHandX = cx + 90 + Math.sin(t * 1.7 + 1) * 15;
      rightHandY = shoulderY + 120 + Math.cos(t * 1.5 + 1) * 10;
    }

    /* Arme zeichnen */
    this.drawArm(ctx, cx - 40, shoulderY, leftHandX, leftHandY, '#f0c8a4');
    this.drawArm(ctx, cx + 40, shoulderY, rightHandX, rightHandY, '#f0c8a4');

    /* Hände zeichnen */
    this.drawHand(ctx, leftHandX, leftHandY, 0, '#f0c8a4');
    this.drawHand(ctx, rightHandX, rightHandY, this.pointing ? -0.4 : 0, '#f0c8a4');
  },

  /* Arm als Linie mit Gelenk */
  drawArm: function(ctx, x1, y1, x2, y2, color){
    var mx = (x1 + x2) / 2 + (y2 - y1) * 0.15;
    var my = (y1 + y2) / 2 + (x1 - x2) * 0.1;

    /* Oberarm */
    ctx.strokeStyle = color;
    ctx.lineWidth = 16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(mx, my, x2, y2);
    ctx.stroke();

    /* Glow */
    ctx.strokeStyle = 'rgba(0,229,255,.15)';
    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(mx, my, x2, y2);
    ctx.stroke();

    /* Ellbogen-Punkt */
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(mx, my, 9, 0, 7);
    ctx.fill();
  },

  /* Hand mit Fingern */
  drawHand: function(ctx, x, y, rotation, color){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);

    /* Handfläche */
    ctx.fillStyle = color;
    ctx.strokeStyle = '#d9a17b';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 14, 0, 0, 7);
    ctx.fill();
    ctx.stroke();

    /* Finger */
    var fingers = [
      {x:-6, y:-14, w:3, h:12},
      {x:-1, y:-16, w:3, h:14},
      {x:4, y:-15, w:3, h:13},
      {x:9, y:-12, w:2.5, h:10}
    ];
    ctx.fillStyle = color;
    fingers.forEach(function(f){
      ctx.beginPath();
      ctx.ellipse(f.x, f.y, f.w, f.h/2, 0, 0, 7);
      ctx.fill();
      ctx.stroke();
    });

    /* Daumen */
    ctx.beginPath();
    ctx.ellipse(-10, 2, 2.5, 7, -0.5, 0, 7);
    ctx.fill();
    ctx.stroke();

    /* Glow um Hand */
    ctx.shadowColor = 'rgba(0,229,255,.5)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 14, 0, 0, 7);
    ctx.strokeStyle = 'rgba(0,229,255,.3)';
    ctx.stroke();

    ctx.restore();
  }
};

/* ============================================================
   3. ERWEITERE HALDO AI um Hand-Animation
   ============================================================ */

<!-- ============================================================
     HalDo AI OS · Block 5 · MediaPipe Handgesten-Steuerung
     Echte Hand vor Kamera = Maus + Klick
     ============================================================ -->
<script>
(function(){
'use strict';
var H = window.HalDo;
if(!H || !H.APPS){ console.error('[Block 5] Foundation fehlt'); return; }

/* ============================================================
   1. GESTURE CONTROLLER — MediaPipe HandLandmarker
   ============================================================ */
var GestureController = {
  video: null,
  canvas: null,
  ctx: null,
  landmarker: null,
  running: false,
  lastVideoTime: -1,
  cursor: {x: 0.5, y: 0.5},
  pinchActive: false,
  pinchStart: 0,
  smoothX: 0.5,
  smoothY: 0.5,
  onAction: null,
  hoverEl: null,
  hoverStart: 0,

  async init(videoEl, canvasEl){
    this.video = videoEl;
    this.canvas = canvasEl;
    this.ctx = canvasEl.getContext('2d');

    try {
      /* 1. MediaPipe WASM laden */
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );

      /* 2. HandLandmarker erstellen */
      this.landmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      /* 3. Webcam starten */
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' }
      });
      this.video.srcObject = stream;
      await this.video.play();

      /* 4. Canvas-Größe anpassen */
      this.canvas.width = 640;
      this.canvas.height = 480;

      this.running = true;
      this.detectLoop();
      H.toast('✋ Handsteuerung aktiv');

    } catch(err) {
      console.error('[Gestures]', err);
      H.toast('⚠️ Handsteuerung nicht verfügbar');
    }
  },

  stop(){
    this.running = false;
    if(this.video && this.video.srcObject){
      this.video.srcObject.getTracks().forEach(t => t.stop());
    }
    if(this.landmarker){ try{ this.landmarker.close(); }catch(e){} }
  },

  /* Hauptschleife */
  detectLoop(){
    if(!this.running) return;

    const v = this.video;
    if(v.readyState >= 2){
      const now = performance.now();
      if(this.lastVideoTime !== v.currentTime){
        this.lastVideoTime = v.currentTime;

        try {
          const result = this.landmarker.detectForVideo(v, now);
          this.drawOverlay(v, result);
          this.processHand(result);
        } catch(e) {}
      }
    }
    requestAnimationFrame(() => this.detectLoop());
  },

  /* Hand → Cursor */
  processHand(result){
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    if(!result || !result.landmarks || !result.landmarks.length){
      this.pinchActive = false;
      this.hoverEl = null;
      return;
    }

    const lm = result.landmarks[0]; // 21 Punkte

    /* Zeigefinger-Spitze = Punkt 8, Daumen-Spitze = Punkt 4 */
    const indexTip = lm[8];
    const thumbTip = lm[4];

    /* Bildschirm-Koordinaten (spiegelverkehrt für Selfie-Modus) */
    this.cursor.x = 1 - indexTip.x;
    this.cursor.y = indexTip.y;

    /* Smoothing (One-Euro-ähnlich) */
    this.smoothX += (this.cursor.x - this.smoothX) * 0.35;
    this.smoothY += (this.cursor.y - this.smoothY) * 0.35;

    /* Pinch-Erkennung */
    const dx = indexTip.x - thumbTip.x;
    const dy = indexTip.y - thumbTip.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    /* Pinch-Schwelle */
    const PINCH_THRESHOLD = 0.045;

    if(dist < PINCH_THRESHOLD){
      if(!this.pinchActive){
        this.pinchActive = true;
        this.pinchStart = Date.now();
        this.onPinch();
      }
    } else {
      this.pinchActive = false;
    }

    /* Cursor zeichnen */
    const cx = (1 - this.smoothX) * this.canvas.width;
    const cy = this.smoothY * this.canvas.height;

    /* Cursor-Ring */
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, 7);
    ctx.strokeStyle = this.pinchActive ? '#4de88a' : 'rgba(0,229,255,.85)';
    ctx.lineWidth = 3;
    ctx.stroke();

    /* Innerer Punkt */
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, 7);
    ctx.fillStyle = this.pinchActive ? '#4de88a' : '#00e5ff';
    ctx.fill();

    /* Hand-Skelett zeichnen */
    this.drawSkeleton(lm);
  },

  /* Hand-Skelett über Video */
  drawSkeleton(lm){
    const ctx = this.ctx;
    const W = this.canvas.width, Hh = this.canvas.height;
    const conns = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

    ctx.strokeStyle = 'rgba(0,229,255,.65)';
    ctx.lineWidth = 2;
    conns.forEach(([a,b]) => {
      ctx.beginPath();
      ctx.moveTo((1-lm[a].x)*W, lm[a].y*Hh);
      ctx.lineTo((1-lm[b].x)*W, lm[b].y*Hh);
      ctx.stroke();
    });

    lm.forEach((p, i) => {
      const isTip = [4,8,12,16,20].includes(i);
      ctx.beginPath();
      ctx.arc((1-p.x)*W, p.y*Hh, isTip ? 5 : 3, 0, 7);
      ctx.fillStyle = isTip ? '#ff78c8' : 'rgba(0,229,255,.9)';
      ctx.fill();
    });
  },

  /* Overlay zeichnen (Video) */
  drawOverlay(v, result){
    const ctx = this.ctx;
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(v, -this.canvas.width, 0, this.canvas.width, this.canvas.height);
    ctx.restore();
    ctx.fillStyle = 'rgba(4,10,32,.15)';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  },

  /* PINCH = Klick */
  onPinch(){
    const x = window.innerWidth * (1 - this.smoothX);
    const y = window.innerHeight * this.smoothY;

    /* Finde Element an dieser Position */
    const el = document.elementFromPoint(x, y);
    if(!el) return;

    /* Klickbar? */
    const clickable = el.closest('[data-app-id]') || el.closest('.app.ready') || el.closest('button') || el.closest('.btn');
    if(!clickable) return;

    /* Visuelles Feedback */
    clickable.style.transition = 'transform .15s';
    clickable.style.transform = 'scale(.92)';
    setTimeout(() => { clickable.style.transform = ''; }, 200);

    /* Klick auslösen */
    clickable.click();
    H.toast('👆 Klick!');
  },

  /* Virtueller Cursor (visuell) */
  renderCursor(){
    if(!this.cursorEl){
      this.cursorEl = document.createElement('div');
      this.cursorEl.style.cssText = 'position:fixed;width:36px;height:36px;border:2.5px solid #00e5ff;border-radius:50%;pointer-events:none;z-index:99999;transition:transform .12s, background .12s;box-shadow:0 0 16px #00e5ff, inset 0 0 12px rgba(0,229,255,.35);transform:translate(-50%,-50%);mix-blend-mode:screen';
      this.cursorEl.innerHTML = '<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:#00e5ff;border-radius:50%;box-shadow:0 0 8px #00e5ff"></div>';
      document.body.appendChild(this.cursorEl);
    }
    this.cursorEl.style.left = (window.innerWidth * (1 - this.smoothX)) + 'px';
    this.cursorEl.style.top = (window.innerHeight * this.smoothY) + 'px';
    this.cursorEl.style.background = this.pinchActive ? 'rgba(77,232,138,.35)' : 'rgba(0,229,255,.15)';
    this.cursorEl.style.borderColor = this.pinchActive ? '#4de88a' : '#00e5ff';

    if(this.running) requestAnimationFrame(() => this.renderCursor());
  },

  destroy(){
    this.stop();
    if(this.cursorEl) this.cursorEl.remove();
  }
};

/* ============================================================
   2. HANDGESTEN-STEUERUNG — App-Fenster
   ============================================================ */
H.APPS['handgesten'] = {
  name:'Handgesten', icon:'✋',
  render: function(){
    return '<div class="col" style="height:100%;gap:10px">'+
      '<div class="card" style="background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.08));border-color:var(--c1)">'+

  unread: 0,
  perms: null,

  init: function(){
    /* Settings laden */
    this.perms = store.get('notif_perms', {
      enabled: true,
      sound: false,
      browser: false,
      traffic: true,
      blitzer: true,
      weather: true,
      calendar: true,
      reminders: true
    });

    /* Stack erstellen */
    this.stack = document.createElement('div');
    this.stack.className = 'v7-notif-stack';
    document.body.appendChild(this.stack);

    /* Center erstellen */
    this.center = document.createElement('div');
    this.center.id = 'v7-center';
    this.center.innerHTML =
      '<div class="head">'+
        '<b>🔔 Benachrichtigungen</b>'+
        '<span class="count" id="v7-ncount">0</span>'+
        '<span class="clr" id="v7-nclr">Alle löschen</span>'+
      '</div>'+
      '<div class="body" id="v7-nbody"><div class="empty">Keine Benachrichtigungen</div></div>';
    document.body.appendChild(this.center);

    /* Events */
    document.getElementById('v7-nclr').onclick = function(e){
      e.stopPropagation();
      Notif.clear();
    };

    /* Bell in Topbar einfügen */
    var topbar = document.querySelector('#topbar');
    if(topbar && !document.getElementById('v7-bellBtn')){
      var bell = document.createElement('button');
      bell.id = 'v7-bellBtn';
      bell.className = 'iconbtn v7-bell';
      bell.innerHTML = '<span class="iconbtn-icon">🔔</span>';
      var themeBtn = topbar.querySelector('#themeBtn');
      if(themeBtn) topbar.insertBefore(bell, themeBtn);
      else topbar.appendChild(bell);
      bell.onclick = function(e){
        e.stopPropagation();
        Notif.toggleCenter();
      };
    }

    /* Klick außerhalb schließt */
    document.addEventListener('click', function(e){
      if(Notif.center && Notif.center.classList.contains('on')){
        if(!e.target.closest('#v7-center') && !e.target.closest('#v7-bellBtn')){
          Notif.center.classList.remove('on');
        }
      }
    });

    /* Gespeicherte laden */
    this.items = store.get('notif_items', []);
    this.updateBadge();
    this.renderCenter();
  },

  toggleCenter: function(){
    if(!this.center) return;
    var on = this.center.classList.toggle('on');
    if(on){
      this.unread = 0;
      this.updateBadge();
    }
  },

  /* Sende Notification */
  send: function(opts){
    if(!this.perms || !this.perms.enabled) return;

    var o = Object.assign({
      icon:'🔔',
      title:'Benachrichtigung',
      msg:'',
      type:'info',
      timeout: 5000,
      persist: false,
      action: null
    }, opts || {});

    /* Filtern nach Typ */
    if(o.type === 'traffic' && !this.perms.traffic) return;
    if(o.type === 'blitzer' && !this.perms.blitzer) return;
    if(o.type === 'weather' && !this.perms.weather) return;
    if(o.type === 'reminder' && !this.perms.reminders) return;
    if(o.type === 'calendar' && !this.perms.calendar) return;

    /* Speichern */
    var item = {
      id: uid(),
      icon: o.icon,
      title: o.title,
      msg: o.msg,
      type: o.type,
      ts: Date.now()
    };
    this.items.unshift(item);
    if(this.items.length > 50) this.items = this.items.slice(0, 50);
    store.set('notif_items', this.items);

    this.unread++;
    this.updateBadge();
    this.renderCenter();

    /* Popup anzeigen */
    this.showPopup(item, o.timeout, o.action);

    /* Sound */
    if(this.perms.sound){
      try{
        var ctx = new (window.AudioContext||window.webkitAudioContext)();
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = o.type === 'danger' ? 440 : 660;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
      }catch(e){}
    }

    /* Browser-Notification */
    if(this.perms.browser && 'Notification' in window && Notification.permission === 'granted'){
      try{
        new Notification(o.title, { body: o.msg, icon: '' });
      }catch(e){}
    }
  },

  showPopup: function(item, timeout, action){
    if(!this.stack) return;
    var el2 = document.createElement('div');
    el2.className = 'v7-notif ' + (item.type === 'danger' ? 'danger' : item.type === 'warn' ? 'warn' : item.type === 'success' ? 'success' : '');

    var typeIcons = { danger:'🚨', warn:'⚠️', success:'✅', info:'ℹ️', traffic:'🚗', blitzer:'📸', weather:'⛅', reminder:'⏰', calendar:'📅' };
    var ico = item.icon || typeIcons[item.type] || '🔔';

    el2.innerHTML =
      '<div class="icon">'+ico+'</div>'+
      '<div class="close">✕</div>'+
      '<div class="title">'+esc(item.title)+'</div>'+
      (item.msg ? '<div class="msg">'+esc(item.msg)+'</div>' : '')+
      '<div class="time">'+new Date(item.ts).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</div>'+
      (timeout > 0 ? '<div class="progress"></div>' : '');

    this.stack.appendChild(el2);

    el2.querySelector('.close').onclick = function(e){
      e.stopPropagation();
      Notif.dismiss(el2);
    };

    el2.onclick = function(){
      if(typeof action === 'function'){ try{ action(); }catch(e){} }
      Notif.dismiss(el2);
    };

    if(timeout > 0){
      setTimeout(function(){ Notif.dismiss(el2); }, timeout);
    }
  },

  dismiss: function(el2){
    if(!el2 || el2.classList.contains('out')) return;
    el2.classList.add('out');
    setTimeout(function(){ el2.remove(); }, 300);
  },

  updateBadge: function(){
    var b = document.querySelector('#v7-bellBtn .badge');
    if(this.unread <= 0){
      if(b) b.remove();
      return;
    }
    if(!b){
      b = document.createElement('span');
      b.className = 'badge';
      document.querySelector('#v7-bellBtn').appendChild(b);
    }
    b.textContent = this.unread > 9 ? '9+' : this.unread;
  },

  renderCenter: function(){
    var body = document.querySelector('#v7-nbody');
    var count = document.querySelector('#v7-ncount');
    if(!body) return;
    count.textContent = this.items.length;
    if(!this.items.length){
      body.innerHTML = '<div class="empty">Keine Benachrichtigungen</div>';
      return;
    }
    body.innerHTML = this.items.map(function(it){
      var typeIcons = { danger:'🚨', warn:'⚠️', success:'✅', info:'ℹ️', traffic:'🚗', blitzer:'📸', weather:'⛅', reminder:'⏰', calendar:'📅' };
      var ico = it.icon || typeIcons[it.type] || '🔔';
      return '<div class="nitem '+(it.type||'')+'" data-id="'+it.id+'">'+
        '<div class="ic">'+ico+'</div>'+
        '<div class="content">'+
          '<div class="title">'+esc(it.title)+'</div>'+
          (it.msg ? '<div class="msg">'+esc(it.msg)+'</div>' : '')+
          '<div class="when">'+new Date(it.ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div>'+
        '</div>'+
      '</div>';
    }).join('');
  },

  clear: function(){
    this.items = [];
    store.set('notif_items', []);
    this.unread = 0;
    this.updateBadge();
    this.renderCenter();
    toast('Alle gelöscht');
  },

  getPerm: function(key){ return this.perms[key]; },
  setPerm: function(key, val){
    this.perms[key] = val;
    store.set('notif_perms', this.perms);
  }
};

/* ============================================================
   WÄCHTER — Verkehr + Blitzer im Hintergrund
   ============================================================ */
var Watcher = {
  trafficTimer: null,
  blitzerTimer: null,

  start: function(){
    /* Verkehr alle 3 Min prüfen */
    if(Notif.getPerm('traffic')){
      this.trafficTimer = setInterval(this.checkTraffic.bind(this), 3 * 60 * 1000);
      setTimeout(this.checkTraffic.bind(this), 8000);
    }
    /* Blitzer alle 5 Min prüfen */
    if(Notif.getPerm('blitzer')){
      this.blitzerTimer = setInterval(this.checkBlitzer.bind(this), 5 * 60 * 1000);
      setTimeout(this.checkBlitzer.bind(this), 15000);
    }
  },

  checkTraffic: async function(){
    try{
      var r = await fetch('https://verkehr.autobahn.de/o/autobahn/A1/services/warning');
      var j = await r.json();
      var ws = (j.warning || []).filter(function(w){ return /stau|stockend|verzögerung/i.test(w.title||''); });
      if(ws.length){
        var w = ws[0];
        Notif.send({
          icon:'🚗',
          title:'🚗 Verkehrswarnung A1',
          msg: (w.title || 'Stau gemeldet').slice(0, 120),
          type:'traffic',
          timeout: 8000
        });
      }
    }catch(e){}
  },

  checkBlitzer: async function(){
    /* Demo-Hinweis — echte Blitzer-API bräuchte externe Quelle */
    var hour = new Date().getHours();
    if(hour >= 6 && hour <= 22){
      if(Math.random() < 0.15){
        Notif.send({
          icon:'📸',
          title:'📸 Blitzer-Warnung',
          msg:'Aktive Kontrollen in deiner Region gemeldet (Demo).',
          type:'blitzer',
          timeout: 7000
        });
      }
    }
  },

  stop: function(){
    if(this.trafficTimer) clearInterval(this.trafficTimer);
    if(this.blitzerTimer) clearInterval(this.blitzerTimer);
  }
};

      var monthly = parseFloat(win.querySelector('#v7-ivM').value)||0;
      var rate = (parseFloat(win.querySelector('#v7-ivZ').value)||7)/100/12;
      var years = parseInt(win.querySelector('#v7-ivJ').value)||20;
      var months = years*12;
      var data = [], bal = start, inv = start;
      data.push({m:0, bal:bal, inv:inv});
      for(var i=1;i<=months;i++){
        bal = bal*(1+rate) + monthly;
        inv += monthly;
        if(i%12 === 0 || i === months) data.push({m:i/12, bal:bal, inv:inv});
      }
      var gain = bal - inv;
      var C = win.querySelector('#v7-ivC'), ctx = C.getContext('2d');
      ctx.clearRect(0,0,C.width,C.height);
      var maxB = Math.max.apply(null, data.map(function(d){ return d.bal; }));
      /* Grid */
      ctx.strokeStyle = 'rgba(255,255,255,.08)';
      for(var g=0;g<=4;g++){ ctx.beginPath(); ctx.moveTo(0, g*70); ctx.lineTo(C.width, g*70); ctx.stroke(); }

      /* Inv-Linie */
      ctx.strokeStyle = '#b478ff'; ctx.setLineDash([4,4]); ctx.beginPath();
      data.forEach(function(d, i){ var x = i/(data.length-1)*580+10, y = 270 - d.inv/maxB*250; if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
      ctx.stroke(); ctx.setLineDash([]);
      win.querySelector('#v7-ivO').innerHTML =
        '<div class="v7-stat"><div class="v">€ '+H.fmt(bal)+'</div><div class="l">Endkapital</div></div>'+

    };
    win.querySelector('#v7-ivG').click();
  }
};

      fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(f.u))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j.items){ L.innerHTML = '<div class="empty">Fehler</div>'; return; }
          L.innerHTML = '<h3>' + esc(f.n) + '</h3>' + j.items.slice(0, 12).map(function(it){
            return '<a href="'+esc(it.link)+'" target="_blank" style="text-decoration:none;color:inherit"><div class="v9-card" style="padding:12px 14px"><b>'+esc(it.title)+'</b><div class="dim sm" style="margin-top:4px">'+esc((it.description||'').replace(/<[^>]+>/g,'').slice(0,120))+'…</div></div></a>';
          }).join('');
        })
        .catch(function(){ L.innerHTML = '<div class="empty">Fehler</div>'; });
    }
    win.querySelector('#v9-rsA').onclick = function(){
      var u = win.querySelector('#v9-rsU').value.trim(); if(!u) return;
      var a = feeds(); a.push({id:uid(), n:u.replace(/^https?:\/\//,'').split('/')[0], u:u}); store.set('rss3', a);
      win.querySelector('#v9-rsU').value = ''; renderFeeds();
    };
    renderFeeds();
  }
};

        else u = 'https://duckduckgo.com/?q=' + encodeURIComponent(u);
      }
      win.querySelector('#v9-brU').value = u;
      win.querySelector('#v9-brF').src = u;
    }
    win.querySelector('#v9-brGo').onclick = function(){ go(win.querySelector('#v9-brU').value.trim()); };
    win.querySelector('#v9-brU').addEventListener('keydown', function(e){ if(e.key === 'Enter') go(win.querySelector('#v9-brU').value.trim()); });
    win.querySelectorAll('[data-q]').forEach(function(b){ b.onclick = function(){ go(b.dataset.q); }; });
  }
};
