<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HalDo AI OS Pro Max v2.1</title>
<style>
:root{
  --bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;
  --accent:#00e5ff;--accent2:#4da8ff;--accent3:#b478ff;
  --cyborg1:#ff78c8;--cyborg2:#b478ff;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:18px;--radius-sm:14px;--font:'Segoe UI',system-ui,sans-serif;--font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;user-select:none;font-family:var(--font);color:var(--text);font-size:var(--font-size);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;background:rgba(17,24,39,.6);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;width:100%;outline:none;font-size:14px;backdrop-filter:blur(24px);}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,.15);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:4px;}
#cosmos-canvas{position:fixed;inset:0;z-index:0;pointer-events:auto;width:100%;height:100%;display:block;}

/* Welcome */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,0.7);backdrop-filter:blur(12px);transition:opacity .5s;}
#welcome.hide{opacity:0;pointer-events:none;}
#welcome .logo-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 30px rgba(0,229,255,.9));animation:floatLogo 3s ease-in-out infinite;}
@keyframes floatLogo{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
#welcome h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fff,#00e5ff,#b478ff,#4da8ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(0,229,255,.8);}
#welcome h2{font-size:clamp(14px,2vw,20px);color:#e5e7eb;font-weight:400;line-height:1.6;}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;}
#welcome .presented b{color:#00e5ff;}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent3));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(0,229,255,.6);transition:transform .2s;color:#fff;}
#welcome .enter-btn:hover{transform:scale(1.05);}

/* Taskbar */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:54px;background:rgba(10,14,26,.92);backdrop-filter:blur(24px);border-top:1.5px solid rgba(0,229,255,.4);display:none;align-items:center;padding:0 12px;gap:10px;z-index:9997;padding-bottom:env(safe-area-inset-bottom);}
#taskbar.show{display:flex;}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent3));padding:10px 20px;border-radius:12px;font-weight:bold;display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;box-shadow:0 0 15px rgba(0,229,255,.4);}
.start-btn:hover{filter:brightness(1.15);}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;}
.taskbar-app{background:rgba(55,65,81,.4);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap;transition:all .2s;}
.taskbar-app:hover{border-color:var(--accent);background:rgba(31,41,55,.8);}
#sys-clock{color:var(--accent);font-size:13px;font-weight:700;text-shadow:0 0 10px var(--accent);}

/* Start Menu */
#start-menu{position:fixed;bottom:64px;left:10px;width:min(760px,calc(100vw - 20px));max-height:82vh;background:rgba(10,14,26,.96);backdrop-filter:blur(24px);border:1.5px solid rgba(0,229,255,.4);border-radius:18px;display:none;flex-direction:column;overflow:hidden;z-index:9998;box-shadow:0 -10px 60px rgba(0,229,255,.3);}
#start-menu.show{display:flex;}
.sm-drag-header{padding:14px 16px;border-bottom:1px solid rgba(0,229,255,.2);display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--accent);background:rgba(0,0,0,.3);}
.sm-tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid rgba(0,229,255,.2);}
.sm-tab{flex:1;padding:10px;border-radius:10px 10px 0 0;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;transition:all .2s;}
.sm-tab.active{color:var(--accent);background:rgba(0,229,255,.15);border-bottom:2px solid var(--accent);}
.sm-panel{flex:1;overflow-y:auto;padding:12px;display:none;min-height:0;}
.sm-panel.active{display:block;}
.sm-search{padding:8px 10px 10px;}
.sm-search input{background:rgba(0,0,0,.4);border:1px solid rgba(0,229,255,.3);padding:10px 14px;border-radius:10px;}
.sm-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:12px;cursor:pointer;transition:all .2s;border:1.5px solid transparent;background:rgba(55,65,81,.2);}
.sm-app-card:hover{background:rgba(0,229,255,.15);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 0 20px rgba(0,229,255,.3);}
.sm-app-card .ico{font-size:26px;margin-bottom:6px;pointer-events:none;}
.sm-app-card .nm{font-size:10px;text-align:center;line-height:1.2;pointer-events:none;}

/* Settings */
.settings-layout{display:flex;height:100%;min-height:400px;max-height:65vh;}
.settings-nav{width:200px;flex:none;padding:8px;border-right:1px solid rgba(0,229,255,.2);display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:rgba(0,0,0,.3);}
.settings-nav-item{text-align:left;padding:9px 10px;font-size:12px;border-radius:8px;color:#a0c8e0;background:transparent;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s;}
.settings-nav-item:hover{background:rgba(0,229,255,.15);color:#fff;}
.settings-nav-item.active{background:rgba(0,229,255,.2);border-color:var(--accent);color:#fff;box-shadow:0 0 15px rgba(0,229,255,.3);}
.settings-content{flex:1;padding:16px;overflow-y:auto;min-width:0;}
.settings-content h3{color:var(--accent);font-size:15px;margin-bottom:12px;text-shadow:0 0 10px rgba(0,229,255,.5);}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(55,65,81,.5);gap:12px;}
.settings-row:last-child{border:none;}
.settings-row .lbl{font-size:13px;font-weight:600;}
.settings-row .sub{font-size:11px;color:var(--dim);margin-top:2px;}
.settings-row .ctrl{flex-shrink:0;min-width:160px;max-width:240px;}
.settings-row .ctrl button{padding:8px 14px;background:var(--accent);color:#000;border-radius:8px;font-size:12px;font-weight:700;}
.toggle{position:relative;width:44px;height:24px;background:rgba(55,65,81,.8);border-radius:12px;cursor:pointer;transition:background .2s;display:inline-block;}
.toggle.on{background:var(--accent);box-shadow:0 0 12px var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}

/* Windows */
.window{position:fixed;background:rgba(10,14,26,.95);backdrop-filter:blur(24px);border:1.5px solid rgba(0,229,255,.4);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 40px rgba(0,229,255,.15);min-width:340px;min-height:280px;}
.window.minimized{display:none;}
.window-header{padding:12px 16px;background:rgba(0,0,0,0.5);border-bottom:1px solid rgba(0,229,255,.2);display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;}
.window-title{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:10px;font-size:13px;text-shadow:0 0 8px rgba(0,229,255,.5);}
.window-controls{display:flex;gap:6px;position:relative;z-index:999999;}
.win-btn{min-width:40px;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);font-size:16px;transition:all .2s;}
.win-btn:hover{background:rgba(0,229,255,.3);}
.win-btn.close:hover{background:var(--danger);}
.window-body{flex:1;overflow:hidden;display:flex;}

/* Splash */
#app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%,rgba(0,229,255,.2) 0%,rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px);}
#app-splash.show{display:flex;animation:splashIn .3s;}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #00e5ff);animation:starGlow 1.2s ease-out;}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#00e5ff,#b478ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.splash-presented{font-size:12px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;}
.splash-presented b{color:#00e5ff;}
@keyframes splashIn{from{opacity:0;}to{opacity:1;}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg);}50%{transform:scale(1.2) rotate(180deg);}100%{transform:scale(1) rotate(360deg);}}

/* App UI */
.app-sidebar{width:180px;flex:none;padding:10px 8px;background:rgba(0,10,20,.6);border-right:1px solid rgba(0,229,255,.2);display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.side-btn{text-align:left;padding:9px 12px;font-size:12px;background:transparent;border:1px solid transparent;color:#a0c8e0;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s;}
.side-btn:hover{background:rgba(0,229,255,.15);color:#fff;}
.side-btn.active{background:rgba(0,229,255,.2);border-color:var(--accent);color:#fff;box-shadow:0 0 12px rgba(0,229,255,.3);}
.side-btn.speak-btn{margin-top:auto;color:var(--accent);}
.app-content{flex:1;padding:18px;overflow-y:auto;min-width:0;}
.app-content h3{margin-bottom:12px;color:var(--accent);font-size:16px;text-shadow:0 0 10px rgba(0,229,255,.4);}
.app-content input,.app-content select,.app-content textarea{margin-bottom:8px;}
.app-content button{padding:9px 16px;margin:4px 4px 4px 0;background:var(--accent);border:1px solid var(--accent);color:#000;border-radius:10px;font-size:12px;font-weight:700;transition:all .2s;}
.app-content button:hover{background:var(--accent3);border-color:var(--accent3);box-shadow:0 0 15px rgba(180,120,255,.5);}
.app-content button.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.app-content button.ghost{background:transparent;color:var(--text);border-color:var(--border);}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;margin-bottom:6px;transition:all .2s;}
.list-row:hover{background:rgba(0,229,255,.15);border-color:var(--accent);}
.list-row .meta{color:var(--dim);font-size:11px;margin-left:auto;}
.muted{color:var(--dim);}
.qt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.qt-panel{background:rgba(31,41,55,.5);padding:14px;border-radius:12px;border:1px solid rgba(0,229,255,.2);backdrop-filter:blur(24px);}
.qt-panel h4{margin-bottom:8px;font-size:12px;color:var(--accent);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;margin-top:10px;}
.cal-cell{min-height:56px;padding:3px;background:rgba(55,65,81,.4);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .2s;}
.cal-cell:hover{background:rgba(0,229,255,.15);border-color:var(--accent);}
.cal-cell .day{color:var(--accent);font-weight:700;font-size:10px;}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 8px rgba(0,229,255,.5);}
.cal-head{color:var(--accent);text-align:center;padding:3px;font-weight:700;font-size:10px;}
.chat-box{display:flex;flex-direction:column;height:100%;}
.chat-log{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,.4);border-radius:12px;border:1px solid rgba(0,229,255,.2);margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.msg{padding:8px 12px;border-radius:12px;font-size:13px;max-width:85%;line-height:1.5;word-wrap:break-word;}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:600;}
.msg.ai{align-self:flex-start;background:rgba(31,41,55,.9);border:1px solid rgba(0,229,255,.3);}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;margin:0;}
.chat-input button{margin:0;}
.q-badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;background:rgba(0,229,255,.3);color:#a0f0ff;}
.q-badge.richtig{background:rgba(16,185,129,.3);color:#6ee7b7;}
.q-badge.falsch{background:rgba(239,68,68,.3);color:#fca5a5;}
#click-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,229,255,.9);color:#000;padding:8px 20px;border-radius:20px;font-size:12px;font-weight:600;z-index:99;animation:pulse 2s infinite;pointer-events:none;transition:opacity .5s;box-shadow:0 0 20px rgba(0,229,255,.7);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,.7);}50%{box-shadow:0 0 0 15px rgba(0,229,255,0);}}

/* Music Studio */
.music-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:12px;}
.inst-btn{padding:12px 8px;background:rgba(31,41,55,.5);border:1.5px solid var(--border);border-radius:10px;text-align:center;font-size:11px;cursor:pointer;transition:all .2s;}
.inst-btn:hover{border-color:var(--accent);background:rgba(0,229,255,.15);}
.inst-btn.active{background:rgba(0,229,255,.3);border-color:var(--accent);color:#fff;box-shadow:0 0 15px rgba(0,229,255,.4);}
.btn-sm{padding:6px 12px!important;font-size:11px!important;margin:0!important;border-radius:8px!important;}

/* Blitzer Tacho */
.tacho-wrap{position:relative;width:220px;height:220px;margin:0 auto 12px;}
.tacho-svg{width:100%;height:100%;filter:drop-shadow(0 0 20px rgba(0,229,255,.4));}
.tacho-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.tacho-speed{font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 20px var(--accent);}
.tacho-unit{font-size:12px;color:var(--accent);letter-spacing:3px;}
.tacho-needle{transform-origin:100px 100px;transition:transform .5s cubic-bezier(.4,2,.5,1);}

/* Blitzer Card */
.blitzer-card{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(31,41,55,.7));border:1.5px solid rgba(239,68,68,.5);padding:12px;border-radius:12px;margin-bottom:8px;box-shadow:0 0 25px rgba(239,68,68,.25);}
.blitzer-card .dist{font-size:24px;font-weight:800;color:#ef4444;margin-bottom:4px;text-shadow:0 0 15px rgba(239,68,68,.7);}
.alarm-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:8px;}
.alarm-tile{padding:10px 6px;background:rgba(31,41,55,.5);border:1.5px solid var(--border);border-radius:10px;text-align:center;font-size:11px;cursor:pointer;transition:all .2s;}
.alarm-tile:hover{border-color:var(--accent);}
.alarm-tile.active{background:rgba(0,229,255,.3);border-color:var(--accent);color:#fff;box-shadow:0 0 15px rgba(0,229,255,.5);}

/* Traffic sign */
.traffic-sign{width:60px;height:60px;display:inline-flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 60%,#e60000 62%,#fff 66%,#e60000 68%);border-radius:50%;font-weight:900;font-size:20px;color:#e60000;box-shadow:0 0 15px rgba(230,0,0,.4);}
.traffic-sign.blue{background:radial-gradient(circle,#4da8ff 60%,#fff 62%,#4da8ff 66%,#fff 68%);color:#fff;}

/* Xbot Anatomy */
.anatomy-wrap{width:100%;height:calc(100% - 5px);min-height:380px;border:1px solid rgba(0,229,255,.3);border-radius:12px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 50%,#001a2a 0%,#000 100%);}

/* Nav Arrow */
.nav-arrow{font-size:60px;text-align:center;color:var(--accent);animation:navFloat 1.5s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--accent));}
@keyframes navFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-10px) rotate(-3deg);}}

/* Safe area */
@supports(padding:max(0px)){
  #taskbar{padding-bottom:max(12px,env(safe-area-inset-bottom));height:auto;min-height:54px;}
}
</style>
</head>
<body>
<canvas id="cosmos-canvas"></canvas>

<div id="welcome">
  <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
  <div style="font-size:80px;display:none;filter:drop-shadow(0 0 30px #00e5ff)">🤖</div>
  <h1>HALDO AI OS PRO MAX</h1>
  <h2>Willkommen zurück, Bruder 💙<br>Dein Universum aus Medizin, Alltag und Intelligenz.</h2>
  <div class="presented">Präsentiert von <b>Halil Donma</b></div>
  <button class="enter-btn" onclick="enterApp()">JETZT STARTEN →</button>
</div>

<div id="app-splash"><div class="splash-icon" id="splash-icon">🤖</div><div class="splash-name" id="splash-name">HalDo AI OS</div><div class="splash-presented">Präsentiert von <b>Halil Donma</b></div></div>

<div id="taskbar">
  <div class="start-btn" onclick="toggleStartMenu(event)"><span>⊞</span> <span>Start</span></div>
  <div class="taskbar-apps" id="taskbar-apps"></div>
  <div id="sys-clock">--:--</div>
</div>

<div id="start-menu">
  <div class="sm-drag-header" id="sm-drag-handle"><span>🚀 HalDo AI OS Pro Max v2.1</span><span style="font-size:11px;color:var(--dim)">≡ ziehen</span></div>
  <div class="sm-tabs">
    <button class="sm-tab active" data-tab="apps">📱 Apps A–Z</button>
    <button class="sm-tab" data-tab="settings">⚙️ Einstellungen</button>
  </div>
  <div class="sm-panel active" id="sm-panel-apps">
    <div class="sm-search"><input type="text" id="sm-search-input" placeholder="Apps durchsuchen…" oninput="filterStartMenu(this.value)"></div>
    <div class="sm-apps" id="sm-apps"></div>
  </div>
  <div class="sm-panel" id="sm-panel-settings">
    <div class="settings-layout"><div class="settings-nav" id="settings-nav"></div><div class="settings-content" id="settings-content"></div></div>
  </div>
</div>

<div id="click-hint">👆 Klicke auf die Erde, um mit HalDo AI zu sprechen</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* ==================== i18n (16 Sprachen) ==================== */
const I18N={
  de:{start:'Start',create:'Erstellen',edit:'Bearbeiten',select:'Auswählen',settings:'Einstellungen',delete:'Löschen',save:'Speichern',speak:'Vorlesen',add:'Hinzufügen',search:'Suchen',noEntries:'Keine Einträge',total:'Gesamt',confirm:'Wirklich löschen?',send:'Senden',welcome:'Willkommen'},
  en:{start:'Start',create:'Create',edit:'Edit',select:'Select',settings:'Settings',delete:'Delete',save:'Save',speak:'Speak',add:'Add',search:'Search',noEntries:'No entries',total:'Total',confirm:'Really delete?',send:'Send',welcome:'Welcome'},
  ku:{start:'Destpêk',create:'Çêkirin',edit:'Sererast',select:'Hilbijartin',settings:'Mîheng',delete:'Jêbirin',save:'Tomar',speak:'Xwendin',add:'Zêde',search:'Lêgerîn',noEntries:'Tu tişt tune',total:'Giştî',confirm:'Jê bibe?',send:'Bipeşîne',welcome:'Bi xêr hatî'},

/* ==================== Speech ==================== */
function speak(text,voiceType='default',lang=currentLang){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang=LANGCODES[lang]||'de-DE';
  u.rate=parseFloat(localStorage.getItem('haldo_voice_rate')||1);
  u.pitch=parseFloat(localStorage.getItem('haldo_voice_pitch')||1);
  const voices=speechSynthesis.getVoices();
  let v=null;
  if(voiceType==='male')v=voices.find(x=>/male|mann|hans|stefan|david|mark/i.test(x.name));
  else if(voiceType==='female')v=voices.find(x=>/female|frau|anna|marlene|zira|samantha/i.test(x.name));
  else if(voiceType==='robot'){u.rate=0.7;u.pitch=0.5;v=voices.find(x=>/robot|machine/i.test(x.name));}
  else if(voiceType==='child'){u.pitch=1.8;v=voices.find(x=>/child|kind|junior/i.test(x.name));}
  else if(voiceType==='old'){u.rate=0.8;u.pitch=0.8;v=voices.find(x=>/old|senior/i.test(x.name));}
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ==================== Alarm Engine ==================== */
const ALARM_TYPES={
  beep:'🔔 Piepton',siren:'🚨 Sirene',bell:'🔕 Glocke',bird:'🐦 Vogel',chime:'🎵 Glockenspiel',
  buzzer:'📢 Summer',horn:'📯 Hupe',whistle:'💨 Pfeife',warble:'🎶 Triller',pulse:'💓 Puls',
  bell2:'🔔 Glocke 2',beep2:'📻 Doppel-Piep'
};
function playAlarm(type='beep',duration=3,volume=0.5){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const master=ctx.createGain();master.gain.value=volume;master.connect(ctx.destination);
    const t=ctx.currentTime;
    const mk=(freq,typeOsc,dur,startOffset=0)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.type=typeOsc;o.frequency.value=freq;o.connect(g);g.connect(master);const tt=t+startOffset;g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(0.3,tt+0.02);g.gain.exponentialRampToValueAtTime(0.001,tt+dur);o.start(tt);o.stop(tt+dur+0.05);};
    if(type==='beep'){for(let i=0;i<duration*2;i++)mk(1000,'square',0.15,i*0.5);}
    else if(type==='beep2'){for(let i=0;i<duration*2;i++){mk(1000,'square',0.1,i*0.5);mk(1400,'square',0.1,i*0.5+0.15);}}
    else if(type==='siren'){const o=ctx.createOscillator();const g=ctx.createGain();o.type='sawtooth';o.connect(g);g.connect(master);g.gain.value=0.2;for(let i=0;i<duration*8;i++){o.frequency.linearRampToValueAtTime(800,t+i*0.125);o.frequency.linearRampToValueAtTime(1200,t+i*0.125+0.0625);}o.start(t);o.stop(t+duration);}
    else if(type==='bell'){mk(1000,'sine',duration);mk(1500,'sine',duration*0.8,0.1);}
    else if(type==='bell2'){mk(800,'sine',duration);mk(1200,'sine',duration);}
    else if(type==='bird'){for(let i=0;i<duration*4;i++){const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(2000,t+i*0.25);o.frequency.exponentialRampToValueAtTime(3000,t+i*0.25+0.1);g.gain.value=0.15;o.connect(g);g.connect(master);o.start(t+i*0.25);o.stop(t+i*0.25+0.1);}}
    else if(type==='chime'){[523,659,784,1047].forEach((f,i)=>mk(f,'sine',0.6,i*0.15));}
    else if(type==='buzzer')mk(200,'square',duration);
    else if(type==='horn'){mk(150,'sawtooth',duration*0.8);mk(180,'sawtooth',duration*0.6,0.2);}
    else if(type==='whistle'){const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(2000,t);o.frequency.exponentialRampToValueAtTime(3000,t+0.2);o.frequency.exponentialRampToValueAtTime(2000,t+0.4);o.connect(g);g.connect(master);g.gain.value=0.2;o.start(t);o.stop(t+Math.min(duration,0.5));}
    else if(type==='warble'){for(let i=0;i<duration*8;i++)mk(i%2?1200:800,'sine',0.12,i*0.125);}
    else if(type==='pulse'){for(let i=0;i<duration*2;i++)mk(600,'sine',0.2,i*0.5);}
    else mk(800,'sine',duration);
  }catch(e){console.warn('Alarm:',e);}
}

let cosmosState={scene:null,camera:null,renderer:null,raycaster:null,mouse:null,sun:null,earth:null,moon:null,planets:{},orbits:[],earthTextRings:[],config:JSON.parse(localStorage.getItem('haldo_kosmos')||'{"sun":true,"mercury":true,"venus":true,"earth":true,"moon":true,"mars":true,"jupiter":true,"saturn":true,"neptune":true,"orbits":true,"textRings":true,"speed":1,"brightness":1}')};

function makeSunTexture(){

  return new THREE.TextureLoader().load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/sun.jpg');
}
function makeGlowSprite(size,color){const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d');const g=ctx.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,color);g.addColorStop(0.3,color.replace(/[\d.]+\)$/,'0.6)'));g.addColorStop(0.6,color.replace(/[\d.]+\)$/,'0.2)'));g.addColorStop(1,color.replace(/[\d.]+\)$/,'0)'));ctx.fillStyle=g;ctx.fillRect(0,0,256,256);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));s.scale.set(size,size,1);return s;}
function makePlanetTexture(baseColor){const c=document.createElement('canvas');c.width=512;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle=baseColor;ctx.fillRect(0,0,512,256);for(let i=0;i<3000;i++){const x=Math.random()*512,y=Math.random()*256,r=Math.random()*8+1;ctx.fillStyle='rgba(255,255,255,'+(0.05+Math.random()*0.15)+')';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}return new THREE.CanvasTexture(c);}
function createSaturnRing(scale){const c=document.createElement('canvas');c.width=512;c.height=64;const ctx=c.getContext('2d');for(let x=0;x<512;x++){const a=0.4+Math.sin(x*0.1)*0.3;ctx.fillStyle='rgba(230,210,170,'+a+')';ctx.fillRect(x,0,1,64);}const t=new THREE.CanvasTexture(c);const geo=new THREE.RingGeometry(1.5*scale,2.6*scale,64,1);const mat=new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide,transparent:true,opacity:0.8});const r=new THREE.Mesh(geo,mat);r.rotation.x=Math.PI/2;return r;}

// Text-Ring: 3 Zeilen um die Erde (Gold)
function makeTextRingTexture(lines){
  const c=document.createElement('canvas');c.width=2048;c.height=256;const ctx=c.getContext('2d');
  ctx.clearRect(0,0,2048,256);
  const lineHeight=70;const startY=60;
  lines.forEach((line,i)=>{
    ctx.save();
    ctx.font='bold 40px "Segoe UI", Arial, sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const y=startY+i*lineHeight;
    // Gold mit Glow
    ctx.shadowColor='#ffcc00';ctx.shadowBlur=20;
    ctx.fillStyle='#ffdd44';
    ctx.fillText(line,1024,y);
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff5b0';
    ctx.fillText(line,1024,y);
    ctx.restore();
  });
  const t=new THREE.CanvasTexture(c);
  t.needsUpdate=true;
  return t;
}
function createTextRing(lines,radius,tilt){
  const tex=makeTextRingTexture(lines);
  const geo=new THREE.CylinderGeometry(radius,radius,radius*0.3,64,1,true);
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,opacity:0.9,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.rotation.x=Math.PI/2+tilt;
  return mesh;
}

function applyKosmosConfig(){

  ['mercury','venus','earth','mars','jupiter','saturn','neptune'].forEach(id=>{if(cosmosState.planets[id])cosmosState.planets[id].visible=c[id]!==false;});

  if(cosmosState.earthTextRings)cosmosState.earthTextRings.forEach(r=>r.visible=c.textRings!==false);
  if(cosmosState.ambient)cosmosState.ambient.intensity=2.2*(c.brightness||1);
  localStorage.setItem('haldo_kosmos',JSON.stringify(c));
}

    else if(active==='emergency'){ct.innerHTML='<h3>🚨 NOTFALL</h3><p>Notruf: <b style="color:#ef4444;font-size:28px">112</b></p><button class="danger" onclick="window.location.href=\'tel:112\'">📞 112</button>';}
    else if(active==='info'){ct.innerHTML='<h3>🫀 Organe</h3><div class="qt-grid"><div class="qt-panel"><h4>🫀 Herz</h4><p class="muted">4 Kammern, 60-100 bpm</p></div><div class="qt-panel"><h4>🫁 Lunge</h4><p class="muted">12-20/min</p></div><div class="qt-panel"><h4>🧠 Gehirn</h4><p class="muted">Steuerzentrum</p></div><div class="qt-panel"><h4>🩸 Blut</h4><p class="muted">5L, 4-6L/min</p></div></div>';}
    else{ct.innerHTML='<h3>⚙ Einstellungen</h3><p>Anatomie-Modell: Xbot (GLTF)</p>';}
  }
  function initXbotAnatomy(){
    const wrap=document.createElement('div');wrap.className='anatomy-wrap';ct.appendChild(wrap);
    if(typeof THREE==='undefined'){wrap.innerHTML='<p style="padding:20px;color:#f88">Three.js fehlt.</p>';return;}
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setSize(wrap.clientWidth,wrap.clientHeight);renderer.setClearColor(0x000000,0);
    wrap.appendChild(renderer.domElement);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(45,wrap.clientWidth/wrap.clientHeight,0.1,100);
    camera.position.set(0,1.2,4);camera.lookAt(0,1,0);
    scene.add(new THREE.AmbientLight(0xffffff,0.9));
    const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(2,4,3);scene.add(dl);
    const dl2=new THREE.DirectionalLight(0x00e5ff,0.8);dl2.position.set(-2,2,-2);scene.add(dl2);
    // Boden
    const ground=new THREE.Mesh(new THREE.CircleGeometry(2,32),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
    // Xbot laden
    const loader=new THREE.GLTFLoader();
    loader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Xbot.glb',
      (gltf)=>{
        const model=gltf.scene;
        // Skalierung 0.01 (User-Vorgabe)
        model.scale.set(0.01,0.01,0.01);
        model.position.y=0;
        // Farbe/Cyan
        model.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({color:0x4da8ff,emissive:0x00e5ff,emissiveIntensity:0.15,roughness:0.4,metalness:0.6});}});
        scene.add(model);
        // Atem-Animation
        let lastT=Date.now();
        (function breathe(){
          requestAnimationFrame(breathe);
          const t=Date.now()*0.001;
          model.position.y=Math.sin(t*1.2)*0.01;
          renderer.render(scene,camera);
        })();
      },
      (xhr)=>{},
      (err)=>{wrap.innerHTML='<p style="padding:20px;color:#f88">Xbot konnte nicht geladen werden.</p>';}
    );
    // Fallback: Skelett wenn Xbot fehlt
    setTimeout(()=>{
      if(scene.children.length<2){
        const bm=new THREE.MeshStandardMaterial({color:0xeeeecc,roughness:0.6});
        const skel=new THREE.Group();
        skel.add(new THREE.Mesh(new THREE.SphereGeometry(0.22,24,24),bm));
        for(let i=0;i<8;i++){const v=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.09,12),bm);v.position.y=1.2-i*0.11;skel.add(v);}
        scene.add(skel);
        (function breathe(){requestAnimationFrame(breathe);skel.rotation.y=Date.now()*0.0003;renderer.render(scene,camera);})();
      }
    },3000);
    const ro=new ResizeObserver(()=>{const w=wrap.clientWidth,h=wrap.clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}});ro.observe(wrap);
    cleanup=()=>{ro.disconnect();renderer.dispose();};
  }
  render();
};

function cyAddMessage(role,text){const log=document.getElementById('cy-log');if(!log)return;const d=document.createElement('div');d.className='msg '+role;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function cySend(){const inp=document.getElementById('cy-input');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';cyAddMessage('user',q);setTimeout(()=>{const r=processHalDoCommand(q);cyAddMessage('ai',r);speak(r);},400);}
function processHalDoCommand(input){
  const ql=input.toLowerCase().trim();
  for(const v of ['öffne ','starte ','open ','zeige ']){if(ql.startsWith(v)){const t=ql.substring(v.length).trim();const app=REGISTRY.find(a=>a.nm.toLowerCase().includes(t)||a.id.toLowerCase()===t);if(app){setTimeout(()=>openApp(app.id),500);return '✓ Öffne '+app.nm+'…';}}}
  if(/mail|email|e-mail/.test(ql)){setTimeout(()=>openApp('MAIL'),300);return '✉️ Öffne HalDo Mail…';}
  if(/blitzer/.test(ql)){setTimeout(()=>openApp('BL'),300);return '🚨 Öffne Blitzer…';}
  if(/fahrschule|führerschein/.test(ql)){setTimeout(()=>openApp('FS'),300);return '🚗 Öffne Fahrschule…';}
  if(/musik|music/.test(ql)){setTimeout(()=>openApp('MS'),300);return '🎵 Öffne Music Studio…';}
  if(/anatomie|health|gesundheit/.test(ql)){setTimeout(()=>openApp('H'),300);return '🩺 Öffne Health…';}
  if(/navigation|navi/.test(ql)){setTimeout(()=>openApp('NAV'),300);return '🗺️ Öffne Navigation…';}
  if(/bild/.test(ql)){setTimeout(()=>openApp('IMG'),300);return '🖼️ Öffne Bild Studio…';}
  if(/video/.test(ql)){setTimeout(()=>openApp('VID'),300);return '🎬 Öffne Video Studio…';}
  if(/wetter/.test(ql)){setTimeout(()=>openApp('W'),300);return '🌤️ Öffne Wetter…';}
  if(/zeit|time/.test(ql))return '🕐 '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.';
  if(/hallo|hi|hey/.test(ql))return 'Hallo Bruder! 💙 Wie kann ich helfen?';
  return '🤖 Verstanden: "'+input+'". Befehle: "mail", "blitzer", "fahrschule", "musik", "anatomie".';
}

const INSTRUMENTS={piano:'🎹 Klavier',guitar:'🎸 Gitarre',bass:'🎸 Bass',drums:'🥁 Drums',strings:'🎻 Streicher',synth:'🎛 Synth',flute:'🪈 Flöte',trumpet:'🎺 Trompete',saxophone:'🎷 Saxophon',violin:'🎻 Violine',cello:'🎼 Cello',organ:'⛪ Orgel',harp:'🪕 Harfe',xylophone:'🎵 Xylophon',bell:'🔔 Glocke'};
const GENRES={pop:'Pop',rock:'Rock',hiphop:'Hip-Hop',electronic:'Electronic',jazz:'Jazz',classical:'Klassik',metal:'Metal',folk:'Folk'};
const MOODS={happy:'😊 Fröhlich',sad:'😢 Traurig',epic:'🔥 Episch',chill:'😌 Chill',dark:'🌑 Dunkel'};
const PROGRESSIONS={happy:[0,4,5,3],sad:[5,3,0,4],epic:[0,5,3,4],chill:[0,3,5,4],dark:[0,1,5,4]};
const CHORDS=[[261.63,329.63,392.00],[293.66,349.23,440.00],[329.63,392.00,493.88],[349.23,440.00,523.25],[392.00,493.88,587.33],[440.00,523.25,659.25],[493.88,587.33,739.99]];
let audioCtx=null;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playNote(freq,dur,inst='piano',vol=0.15,when=0){const ctx=getCtx();const o=ctx.createOscillator();const g=ctx.createGain();const waves={piano:'triangle',guitar:'sawtooth',bass:'sine',strings:'sawtooth',synth:'square',flute:'sine',violin:'sawtooth',cello:'triangle',organ:'sine',bell:'sine',trumpet:'square',saxophone:'sawtooth'};o.type=waves[inst]||'sine';o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);return o;}
function playDrum(type='kick',when=0,vol=0.3){const ctx=getCtx();const t=ctx.currentTime+when;if(type==='kick'){const o=ctx.createOscillator();const g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+0.1);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.2);}else if(type==='snare'){const bs=ctx.sampleRate*0.15;const buf=ctx.createBuffer(1,bs,ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<bs;i++)data[i]=Math.random()*2-1;const src=ctx.createBufferSource();const g=ctx.createGain();src.buffer=buf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);src.connect(g);g.connect(ctx.destination);src.start(t);}else if(type==='hihat'){const bs=ctx.sampleRate*0.05;const buf=ctx.createBuffer(1,bs,ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<bs;i++)data[i]=Math.random()*2-1;const src=ctx.createBufferSource();const g=ctx.createGain();src.buffer=buf;g.gain.setValueAtTime(vol*0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);src.connect(g);g.connect(ctx.destination);src.start(t);}}
const viewMusicStudio = function(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';
  body.appendChild(sb);body.appendChild(ct);
  let active='studio';
  let studio=store('music_studio',{genres:['pop'],instruments:['piano','drums','bass'],moods:['happy'],bpm:120,lyrics:'Ich bin ein Stern im Universum,\nleuchte hell wie die Sonne,\nfliege durch die Galaxie,\nmeine Träume sind unendlich.',voice:'female'});
  let playing=false;
  function playPattern(){
    if(playing)return;playing=true;
    const bpm=studio.bpm;const beat=60/bpm;
    const chord=CHORDS[PROGRESSIONS[studio.moods[0]||'happy'][0]];
    if(studio.instruments.includes('drums')){for(let i=0;i<8;i++){setTimeout(()=>{if(!playing)return;playDrum('kick',0,0.25);},i*beat);if(i%2===1)setTimeout(()=>{if(!playing)return;playDrum('snare',0,0.2);},i*beat);setTimeout(()=>{if(!playing)return;playDrum('hihat',0,0.1);},i*beat+beat/2);}}
    const inst=studio.instruments.find(i=>['piano','guitar','synth','strings','flute','bell','organ'].includes(i))||'piano';
    chord.forEach((f,i)=>{for(let r=0;r<4;r++){setTimeout(()=>{if(!playing)return;playNote(f*2,beat*0.8,inst,0.08);},r*beat*2+i*0.02);}});
    if(studio.instruments.includes('bass')){for(let r=0;r<4;r++){setTimeout(()=>{if(!playing)return;playNote(chord[0]/2,beat*0.7,'bass',0.15);},r*beat*2);}}
    const totalDur=8*beat*1000;setTimeout(()=>{playing=false;},totalDur+500);
  }
  function stopAll(){playing=false;}
  function exportWav(){
    const sr=44100;const dur=8;const offline=new OfflineAudioContext(2,sr*dur,sr);
    const beat=60/studio.bpm;const chord=CHORDS[PROGRESSIONS[studio.moods[0]||'happy'][0]];
    chord.forEach(f=>{for(let r=0;r<4;r++){const t=r*beat*2;const o=offline.createOscillator();const g=offline.createGain();o.type='triangle';o.frequency.value=f*2;o.connect(g);g.connect(offline.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+beat*0.8);o.start(t);o.stop(t+beat*0.8+0.05);}});
    offline.startRendering().then(buffer=>{const wav=bufferToWav(buffer);const blob=new Blob([wav],{type:'audio/wav'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='haldo-song-'+Date.now()+'.wav';a.click();alert('✓ WAV exportiert!');});
  }
  function bufferToWav(buffer){const numCh=buffer.numberOfChannels;const len=buffer.length*numCh*2+44;const ab=new ArrayBuffer(len);const view=new DataView(ab);const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};writeStr(0,'RIFF');view.setUint32(4,len-8,true);writeStr(8,'WAVE');writeStr(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,numCh,true);view.setUint32(24,buffer.sampleRate,true);view.setUint32(28,buffer.sampleRate*numCh*2,true);view.setUint16(32,numCh*2,true);view.setUint16(34,16,true);writeStr(36,'data');view.setUint32(40,len-44,true);let off=44;for(let i=0;i<buffer.length;i++){for(let ch=0;ch<numCh;ch++){const s=Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]));view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}}return ab;}
  function render(){
    sb.innerHTML='';
    [['studio','🎛 Studio'],['library','📚 Bibliothek'],['lyrics','✍ Songtext'],['settings','⚙ Einstellungen']].forEach(([id,label])=>{const b=document.createElement('button');b.className='side-btn'+(active===id?' active':'');b.textContent=label;b.onclick=()=>{active=id;render();};sb.appendChild(b);});

      Object.entries(GENRES).forEach(([k,v])=>{const b=document.createElement('button');b.className='btn-sm'+(studio.genres.includes(k)?'':' ghost');b.textContent=v;b.onclick=()=>{if(studio.genres.includes(k))studio.genres=studio.genres.filter(x=>x!==k);else studio.genres.push(k);save('music_studio',studio);render();};ggrid.appendChild(b);});ct.appendChild(ggrid);
      ct.innerHTML+='<div style="font-size:12px;color:var(--dim);margin-bottom:4px;">Instrumente:</div>';

      Object.entries(INSTRUMENTS).forEach(([k,v])=>{const b=document.createElement('div');b.className='inst-btn'+(studio.instruments.includes(k)?' active':'');b.textContent=v;b.onclick=()=>{if(studio.instruments.includes(k))studio.instruments=studio.instruments.filter(x=>x!==k);else studio.instruments.push(k);save('music_studio',studio);render();};igrid.appendChild(b);});ct.appendChild(igrid);
      ct.innerHTML+='<div style="font-size:12px;color:var(--dim);margin-bottom:4px;">Stimmung:</div>';
      const mgrid=document.createElement('div');mgrid.style.cssText='display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;';
      Object.entries(MOODS).forEach(([k,v])=>{const b=document.createElement('button');b.className='btn-sm'+(studio.moods.includes(k)?'':' ghost');b.textContent=v;b.onclick=()=>{studio.moods=[k];save('music_studio',studio);render();};mgrid.appendChild(b);});ct.appendChild(mgrid);
      const bpmRow=document.createElement('div');bpmRow.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:12px;';bpmRow.innerHTML='<span>BPM:</span><input type="range" min="60" max="180" value="'+studio.bpm+'" style="flex:1;" oninput="this.nextElementSibling.textContent=this.value"><span style="min-width:40px;">'+studio.bpm+'</span>';bpmRow.querySelector('input').onchange=(e)=>{studio.bpm=parseInt(e.target.value);save('music_studio',studio);};ct.appendChild(bpmRow);
      const playBar=document.createElement('div');playBar.style.cssText='display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;';
      const play=document.createElement('button');play.textContent='▶️ Play';play.style.background='#10b981';play.onclick=()=>{playPattern();};

      const singBtn=document.createElement('button');singBtn.textContent='🎤 Singen';singBtn.onclick=()=>{const words=studio.lyrics.split(/[\s,]+/).filter(w=>w);let i=0;const beat=60/studio.bpm;const iv=setInterval(()=>{if(i>=words.length){clearInterval(iv);return;}speak(words[i],studio.voice);i++;},beat*1000);};ct.appendChild(singBtn);

      ct.innerHTML='<h3>➡ Hologramm-Pfeil</h3><div class="nav-arrow">⬆</div><p style="text-align:center;margin-top:20px;color:var(--accent);">Folge dem Pfeil</p>';
    }else if(active==='routes'){
      ct.innerHTML='<h3>📋 Routen</h3>';
      routes.forEach(r=>{const row=document.createElement('div');row.className='list-row';row.innerHTML='<span>'+esc(r.from)+' → '+esc(r.to)+'</span><span class="meta">'+esc(r.time||'')+'</span>';ct.appendChild(row);});
      const f=document.createElement('form');
      const fr=document.createElement('input');fr.placeholder='Von';f.appendChild(fr);
      const to=document.createElement('input');to.placeholder='Nach';f.appendChild(to);
      const b=document.createElement('button');b.textContent='➕ Route';f.appendChild(b);
      f.onsubmit=e=>{e.preventDefault();routes.push({id:Date.now(),from:fr.value,to:to.value,time:'--'});save('nav_routes',routes);f.reset();render();};ct.appendChild(f);
    }else{ct.innerHTML='<h3>⚙</h3><p>Live-Verkehr: Stau, Maut, Blitzer-Warnung</p>';}
  }
  render();
};

/* ==================== WEATHER ==================== */
const viewWeather = function(body){
  body.style.cssText='padding:18px;';
  body.innerHTML='<h3>🌤 Wetter</h3>';
  const out=document.createElement('div');out.style.cssText='font-size:18px;margin:20px 0;';body.appendChild(out);
  const btn=document.createElement('button');btn.textContent='📍 Standort';btn.onclick=()=>{if(!navigator.geolocation){out.textContent='GPS fehlt';return;}out.textContent='Lade…';navigator.geolocation.getCurrentPosition(async p=>{try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&current=temperature_2m,weather_code');const j=await r.json();out.innerHTML='<div style="font-size:48px;font-weight:800;color:var(--accent);">'+j.current.temperature_2m+'°C</div>';speak(Math.round(j.current.temperature_2m)+' Grad.');}catch(e){out.textContent='Fehler.';}},()=>{out.textContent='GPS verweigert.';});};body.appendChild(btn);
};

/* ==================== QUICK TOOLS ==================== */
const viewQuickTools = function(body){
  body.style.cssText='padding:18px;overflow-y:auto;';
  body.innerHTML='<h3>🛠 Quick Tools</h3>';
  const grid=document.createElement('div');grid.className='qt-grid';
  const calc=document.createElement('div');calc.className='qt-panel';calc.innerHTML='<h4>🧮 Rechner</h4>';
  const ci=document.createElement('input');ci.placeholder='z.B. 2+2*3';
  const cr=document.createElement('div');cr.style.cssText='margin-top:6px;color:var(--accent);font-size:16px;font-weight:700;';
  ci.oninput=()=>{try{cr.textContent='= '+Function('"use strict";return('+ci.value.replace(/[^0-9+\-*/(). ]/g,'')+')')();}catch(e){cr.textContent='';}};
  calc.appendChild(ci);calc.appendChild(cr);grid.appendChild(calc);
  const tm=document.createElement('div');tm.className='qt-panel';tm.innerHTML='<h4>⏱ Timer</h4>';
  const ti=document.createElement('input');ti.type='number';ti.value=60;
  const tb=document.createElement('button');tb.textContent='Start';
  const to=document.createElement('div');to.style.cssText='margin-top:6px;color:var(--accent);font-size:16px;font-weight:700;';
  tb.onclick=()=>{let s=parseInt(ti.value)||0;to.textContent=s+'s';const iv=setInterval(()=>{s--;to.textContent=s+'s';if(s<=0){clearInterval(iv);to.textContent='⏰ Fertig!';speak('Timer beendet');}},1000);};
  tm.appendChild(ti);tm.appendChild(tb);tm.appendChild(to);grid.appendChild(tm);
  const pw=document.createElement('div');pw.className='qt-panel';pw.innerHTML='<h4>🔑 Passwort</h4>';
  const pwb=document.createElement('button');pwb.textContent='Generieren';
  const pwo=document.createElement('div');pwo.style.cssText='margin-top:6px;color:var(--accent);font-family:monospace;word-break:break-all;';
  pwb.onclick=()=>{const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';let p='';for(let i=0;i<20;i++)p+=c[Math.floor(Math.random()*c.length)];pwo.textContent=p;};
  pw.appendChild(pwb);pw.appendChild(pwo);grid.appendChild(pw);
  body.appendChild(grid);
};

/* ==================== TASKS ==================== */
const viewTasks = function(body){
  body.style.cssText='display:flex;height:100%;';
  let tasks=store('tasks',[]);const persist=()=>save('tasks',tasks);
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';
  body.appendChild(sb);body.appendChild(ct);
  let active='select';
  function render(){
    sb.innerHTML='';
    [['select','✅ Aufgaben'],['create','➕ Neu'],['delete','🗑 Löschen']].forEach(([id,label])=>{const b=document.createElement('button');b.className='side-btn'+(active===id?' active':'');b.textContent=label;b.onclick=()=>{active=id;render();};sb.appendChild(b);});
    ct.innerHTML='';
    if(active==='select'){ct.innerHTML='<h3>✅ Aufgaben ('+tasks.filter(x=>!x.done).length+' offen)</h3>';if(!tasks.length){ct.innerHTML+='<p class="muted">Keine Einträge</p>';return;}tasks.forEach(tk=>{const row=document.createElement('div');row.className='list-row';const cb=document.createElement('input');cb.type='checkbox';cb.checked=tk.done;cb.style.width='auto';cb.style.margin='0';cb.onchange=()=>{tk.done=cb.checked;persist();render();};const span=document.createElement('span');span.textContent=tk.text;if(tk.done)span.style.textDecoration='line-through';row.appendChild(cb);row.appendChild(span);ct.appendChild(row);});}
    else if(active==='create'){ct.innerHTML='<h3>➕ Neue Aufgabe</h3>';const f=document.createElement('form');const i=document.createElement('input');i.placeholder='Aufgabe';f.appendChild(i);const b=document.createElement('button');b.textContent='Speichern';f.appendChild(b);f.onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),text:i.value,done:false});persist();i.value='';render();};ct.appendChild(f);}
    else{ct.innerHTML='<h3>🗑 Löschen</h3>';tasks.forEach(tk=>{const row=document.createElement('div');row.className='list-row';row.innerHTML='<span>'+esc(tk.text)+'</span>';const d=document.createElement('button');d.className='danger';d.textContent='✕';d.onclick=()=>{if(confirm('Löschen?')){tasks=tasks.filter(x=>x.id!==tk.id);persist();render();}};row.appendChild(d);ct.appendChild(row);});}
  }
  render();
};

/* ==================== REGISTRY ==================== */
const openWindows={};let zCounter=20;const nextZ=()=>zCounter++;
const REGISTRY=[
  {id:'MAIL',ico:'✉️',nm:'HalDo Mail',fn:viewMail},
  {id:'A',ico:'🧠',nm:'HalDo AI',fn:function(b){b.style.cssText='display:flex;height:100%;padding:18px;flex-direction:column;';b.innerHTML='<h3>🧠 HalDo AI</h3><div class="chat-log" id="ai-log" style="flex:1;"></div><div class="chat-input"><input id="ai-inp" placeholder="Frage…"><button onclick="aiSend()">➤</button></div>';const log=document.getElementById('ai-log');let h=store('ai_classic',[{role:'ai',text:'Hallo! Ich bin HalDo AI.'}]);h.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.text;log.appendChild(d);});window.aiSend=()=>{const inp=document.getElementById('ai-inp');const q=inp.value.trim();if(!q)return;inp.value='';h.push({role:'user',text:q});const d=document.createElement('div');d.className='msg user';d.textContent=q;log.appendChild(d);setTimeout(()=>{const r=processHalDoCommand(q);h.push({role:'ai',text:r});const da=document.createElement('div');da.className='msg ai';da.textContent=r;log.appendChild(da);log.scrollTop=log.scrollHeight;save('ai_classic',h);speak(r);},400);};}},
  {id:'FS',ico:'🚗',nm:'Fahrschule',fn:viewFahrschule},
  {id:'BL',ico:'🚨',nm:'Blitzer',fn:viewBlitzer},
  {id:'MS',ico:'🎵',nm:'Musik Studio',fn:viewMusicStudio},
  {id:'IMG',ico:'🖼️',nm:'Bild Studio',fn:viewImageStudio},
  {id:'VID',ico:'🎬',nm:'Video Studio',fn:viewVideoStudio},
  {id:'NAV',ico:'🗺️',nm:'Navigation',fn:viewNavigation},
  {id:'H',ico:'🩺',nm:'Health',fn:viewHealth},
  {id:'T',ico:'✅',nm:'Tasks',fn:viewTasks},
  {id:'W',ico:'🌤️',nm:'Weather',fn:viewWeather},
  {id:'Q',ico:'🛠️',nm:'Quick Tools',fn:viewQuickTools}
];

/* ==================== START MENU ==================== */
function populateStartMenu(){
  const grid=document.getElementById('sm-apps');if(!grid)return;
  grid.innerHTML='';
  REGISTRY.forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});
}
function filterStartMenu(q){
  const grid=document.getElementById('sm-apps');if(!grid)return;
  grid.innerHTML='';
  REGISTRY.filter(a=>a.nm.toLowerCase().includes(q.toLowerCase())).forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});
}
document.querySelectorAll('.sm-tab').forEach(tab=>{tab.onclick=()=>{document.querySelectorAll('.sm-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.sm-panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('sm-panel-'+tab.dataset.tab).classList.add('active');if(tab.dataset.tab==='settings')renderSettingsPanel();};});
function toggleStartMenu(e){if(e)e.stopPropagation();document.getElementById('start-menu').classList.toggle('show');}
document.addEventListener('DOMContentLoaded',()=>{
  const settingsPanel=document.getElementById('sm-panel-settings');
  if(settingsPanel)settingsPanel.addEventListener('click',e=>e.stopPropagation());
  document.addEventListener('click',e=>{const sm=document.getElementById('start-menu');if(!sm.classList.contains('show'))return;if(e.target.closest('#start-menu'))return;if(e.target.closest('.start-btn'))return;sm.classList.remove('show');});
});

/* ==================== SETTINGS ==================== */
const SETTINGS_SECTIONS=[
  {id:'general',icon:'🔧',label:'Allgemein'},
  {id:'display',icon:'🎨',label:'Anzeige'},
  {id:'kosmos',icon:'🌌',label:'Kosmos'},
  {id:'voice',icon:'🎤',label:'Stimme'},
  {id:'language',icon:'🌐',label:'Sprache'},
  {id:'blitzer',icon:'🚨',label:'Blitzer'},
  {id:'about',icon:'ℹ️',label:'Über'}
];
let activeSetting='general';
function renderSettingsPanel(){
  const nav=document.getElementById('settings-nav'),c=document.getElementById('settings-content');
  if(!nav||!c)return;
  nav.innerHTML='';
  SETTINGS_SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='settings-nav-item'+(activeSetting===s.id?' active':'');b.textContent=s.icon+' '+s.label;b.onclick=(e)=>{e.stopPropagation();activeSetting=s.id;renderSettingsPanel();};nav.appendChild(b);});
  c.innerHTML='';
  const s=activeSetting;
  if(s==='general')renderGeneral(c);
  else if(s==='display')renderDisplay(c);
  else if(s==='kosmos')renderKosmos(c);
  else if(s==='voice')renderVoice(c);
  else if(s==='language')renderLanguage(c);
  else if(s==='blitzer')renderBlitzerSettings(c);
  else if(s==='about')renderAbout(c);
}
function rowHTML(label,sub,ctrl){return `<div class="settings-row"><div><div class="lbl">${label}</div><div class="sub">${sub}</div></div><div class="ctrl">${ctrl}</div></div>`;}
function toggleHTML(id,on){return `<span class="toggle ${on?'on':''}" onclick="this.classList.toggle('on');localStorage.setItem('haldo_set_${id}',this.classList.contains('on')?'1':'0');event.stopPropagation();"></span>`;}
function getToggle(id,def=true){const v=localStorage.getItem('haldo_set_'+id);if(v===null)return def;return v==='1';}
function renderGeneral(c){c.innerHTML='<h3>🔧 Allgemein</h3>';c.innerHTML+=rowHTML('Gerätename','Name deines Systems',`<input value="${localStorage.getItem('haldo_device_name')||'HalDo AI OS'}" oninput="localStorage.setItem('haldo_device_name',this.value);event.stopPropagation();">`);c.innerHTML+=rowHTML('Auto-Speichern','Änderungen sofort sichern',toggleHTML('auto_save',getToggle('auto_save',true)));c.innerHTML+=rowHTML('Daten zurücksetzen','Alle Einstellungen löschen',`<button onclick="if(confirm('Alle Daten löschen?')){Object.keys(localStorage).filter(k=>k.startsWith('haldo_')).forEach(k=>localStorage.removeItem(k));location.reload();}">Reset</button>`);}
function renderDisplay(c){c.innerHTML='<h3>🎨 Anzeige</h3>';const cur=localStorage.getItem('haldo_theme')||'#00e5ff';const btns=['#00e5ff','#b478ff','#10b981','#f59e0b','#ef4444','#ec4899'].map(col=>`<button style="background:${col};width:28px;height:28px;border-radius:50%;border:${col===cur?'3px solid #fff':'2px solid transparent'};" onclick="event.stopPropagation();setAccent('${col}')"></button>`).join('');c.innerHTML+=rowHTML('Akzentfarbe','Design',btns);c.innerHTML+=rowHTML('Schriftgröße','12–18px',`<input type="range" min="12" max="18" value="${localStorage.getItem('haldo_font_size')||14}" oninput="setFontSize(this.value);event.stopPropagation();">`);}
function setAccent(c){document.documentElement.style.setProperty('--accent',c);localStorage.setItem('haldo_theme',c);renderDisplay(document.getElementById('settings-content'));}
function setFontSize(v){document.documentElement.style.setProperty('--font-size',v+'px');localStorage.setItem('haldo_font_size',v);}
function renderKosmos(c){c.innerHTML='<h3>🌌 Kosmos</h3>';const cfg=cosmosState.config;[['sun','☀️ Sonne'],['mercury','⚪ Merkur'],['venus','🟡 Venus'],['earth','🌍 Erde'],['moon','🌙 Mond'],['mars','🔴 Mars'],['jupiter','🟠 Jupiter'],['saturn','🪐 Saturn'],['neptune','🔵 Neptun'],['orbits','🛸 Umlaufbahnen'],['textRings','📝 Text-Ringe']].forEach(([id,lbl])=>{c.innerHTML+=rowHTML(lbl,'Sichtbarkeit',toggleHTML('kosmos_'+id,cfg[id]!==false));});c.innerHTML+=rowHTML('Geschwindigkeit','Umlauf',`<input type="range" min="0" max="3" step="0.1" value="${cfg.speed||1}" oninput="cosmosState.config.speed=parseFloat(this.value);applyKosmosConfig();event.stopPropagation();">`);c.innerHTML+=rowHTML('Helligkeit','Sonnensystem',`<input type="range" min="0.5" max="2" step="0.1" value="${cfg.brightness||1}" oninput="cosmosState.config.brightness=parseFloat(this.value);applyKosmosConfig();event.stopPropagation();">`);}
function renderVoice(c){c.innerHTML='<h3>🎤 Stimme</h3>';c.innerHTML+=rowHTML('Geschwindigkeit','Rate',`<input type="range" min="0.5" max="2" step="0.1" value="${localStorage.getItem('haldo_voice_rate')||1}" oninput="localStorage.setItem('haldo_voice_rate',this.value);event.stopPropagation();">`);c.innerHTML+=rowHTML('Tonhöhe','Pitch',`<input type="range" min="0.5" max="2" step="0.1" value="${localStorage.getItem('haldo_voice_pitch')||1}" oninput="localStorage.setItem('haldo_voice_pitch',this.value);event.stopPropagation();">`);c.innerHTML+=rowHTML('Test','TTS',`<button onclick="event.stopPropagation();speak('Hallo Bruder! Ich bin HalDo AI.')">🔊 Test</button>`);}
function renderLanguage(c){c.innerHTML='<h3>🌐 Sprache</h3>';const sel=`<select onchange="currentLang=this.value;localStorage.setItem('haldo_lang',this.value);event.stopPropagation();">${Object.keys(LANGNAMES).map(k=>`<option value="${k}" ${k===currentLang?'selected':''}>${LANGNAMES[k]}</option>`).join('')}</select>`;c.innerHTML+=rowHTML('Systemsprache','16 Sprachen',sel);}
function renderBlitzerSettings(c){c.innerHTML='<h3>🚨 Blitzer</h3>';const bs=store('blitzer_settings',{lang:'de',voice:'female',alarm:'siren',duration:5,volume:70});const langOpts=Object.keys(LANGNAMES).map(k=>`<option value="${k}" ${bs.lang===k?'selected':''}>${LANGNAMES[k]}</option>`).join('');c.innerHTML+=rowHTML('Sprache','Warnsprache',`<select onchange="const s=JSON.parse(localStorage.getItem('haldo_blitzer_settings'));s.lang=this.value;localStorage.setItem('haldo_blitzer_settings',JSON.stringify(s));event.stopPropagation();">${langOpts}</select>`);c.innerHTML+=rowHTML('Stimme','Sprecher',`<select onchange="const s=JSON.parse(localStorage.getItem('haldo_blitzer_settings'));s.voice=this.value;localStorage.setItem('haldo_blitzer_settings',JSON.stringify(s));event.stopPropagation();"><option value="female" ${bs.voice==='female'?'selected':''}>👩 Weiblich</option><option value="male" ${bs.voice==='male'?'selected':''}>👨 Männlich</option><option value="robot" ${bs.voice==='robot'?'selected':''}>🤖 Roboter</option><option value="child" ${bs.voice==='child'?'selected':''}>👦 Kind</option><option value="old" ${bs.voice==='old'?'selected':''}>👴 Älterer</option></select>`);c.innerHTML+=rowHTML('Test','Alarm testen',`<button onclick="event.stopPropagation();playAlarm('siren',3,0.7)">🔊 Sirene</button>`);c.innerHTML+=rowHTML('Blitzer-App','Direkt öffnen',`<button onclick="event.stopPropagation();openApp('BL');document.getElementById('start-menu').classList.remove('show');">🚨 Öffnen</button>`);}
function renderAbout(c){c.innerHTML='<h3>ℹ️ Über</h3><div class="qt-panel"><h4>HalDo AI OS Pro Max</h4><p>Version 2.1.0</p><p>Von Halil Donma</p><p>'+REGISTRY.length+' Apps · 16 Sprachen</p><p class="muted" style="margin-top:8px;">Three.js · Web Audio · Speech Synthesis</p></div>';}

/* ==================== OPEN APP ==================== */
function openApp(id){
  const def=REGISTRY.find(a=>a.id===id);if(!def)return;
  const splash=document.getElementById('app-splash');
  if(splash){splash.querySelector('.splash-icon').textContent=def.ico;splash.querySelector('.splash-name').textContent=def.nm;splash.classList.add('show');setTimeout(()=>splash.classList.remove('show'),700);}
  document.getElementById('start-menu').classList.remove('show');
  if(openWindows[id]){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}return;}
  const win=document.createElement('div');win.className='window';win.id='win-'+id;
  win.style.width='min(920px,96vw)';win.style.height='min(640px,82vh)';
  win.style.left=Math.max(10,(innerWidth-920)/2+Object.keys(openWindows).length*20)+'px';
  win.style.top=Math.max(10,(innerHeight-640)/2+Object.keys(openWindows).length*20)+'px';
  win.style.zIndex=nextZ();
  win.innerHTML=`<div class="window-header" onmousedown="startDrag(event,'${id}')"><div class="window-title">${def.ico} ${def.nm}</div><div class="window-controls"><button class="win-btn" onclick="event.stopPropagation();minimizeApp('${id}')">—</button><button class="win-btn" onclick="event.stopPropagation();maximizeApp('${id}')">▢</button><button class="win-btn close" onclick="event.stopPropagation();closeApp('${id}')">✕</button></div></div><div class="window-body" id="body-${id}"></div>`;
  document.body.appendChild(win);openWindows[id]=true;
  document.getElementById('taskbar-apps').innerHTML+=`<div class="taskbar-app" id="tb-${id}" onclick="focusApp('${id}')">${def.ico} ${def.nm}</div>`;
  setTimeout(()=>{try{def.fn(document.getElementById('body-'+id));}catch(e){console.error(e);document.getElementById('body-'+id).innerHTML='<p style="color:#f77;padding:20px">Fehler: '+e.message+'</p>';}},60);
}
function closeApp(id){const w=document.getElementById('win-'+id);if(w)w.remove();const tb=document.getElementById('tb-'+id);if(tb)tb.remove();delete openWindows[id];}
function focusApp(id){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}}
function minimizeApp(id){const w=document.getElementById('win-'+id);if(w)w.classList.toggle('minimized');}
function maximizeApp(id){const w=document.getElementById('win-'+id);if(!w)return;if(w.dataset.max==='1'){w.style.left=w.dataset.l;w.style.top=w.dataset.t;w.style.width=w.dataset.wd;w.style.height=w.dataset.ht;w.dataset.max='0';}else{w.dataset.l=w.style.left;w.dataset.t=w.style.top;w.dataset.wd=w.style.width;w.dataset.ht=w.style.height;w.style.left='0';w.style.top='0';w.style.width='100vw';w.style.height='calc(100vh - 54px)';w.dataset.max='1';}}
let dragState=null;
function startDrag(e,id){if(e.target.closest('.win-btn'))return;const w=document.getElementById('win-'+id);if(!w)return;dragState={id,sx:e.clientX,sy:e.clientY,wx:w.offsetLeft,wy:w.offsetTop};w.style.zIndex=nextZ();}
addEventListener('mousemove',e=>{if(!dragState)return;const w=document.getElementById('win-'+dragState.id);if(!w||w.dataset.max==='1')return;w.style.left=(dragState.wx+e.clientX-dragState.sx)+'px';w.style.top=Math.max(0,dragState.wy+e.clientY-dragState.sy)+'px';});
addEventListener('mouseup',()=>{dragState=null;});

/* ==================== BOOT ==================== */
function enterApp(){document.getElementById('welcome').classList.add('hide');document.getElementById('taskbar').classList.add('show');populateStartMenu();renderSettingsPanel();const h=document.getElementById('click-hint');if(h)setTimeout(()=>{h.style.opacity='0';},8000);}
function startClock(){const c=document.getElementById('sys-clock');const tick=()=>c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000);}
document.addEventListener('DOMContentLoaded',()=>{initCosmos();startClock();populateStartMenu();renderSettingsPanel();const t2=localStorage.getItem('haldo_theme');if(t2){document.documentElement.style.setProperty('--accent',t2);document.documentElement.style.setProperty('--accent2',t2);}const f=localStorage.getItem('haldo_font_size');if(f)document.documentElement.style.setProperty('--font-size',f+'px');});
</script>
