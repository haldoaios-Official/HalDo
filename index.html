<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e2a">
<title>HalDo AI OS Pro Max v122</title>
<style>
:root {
  --cyan: #00e5ff;
  --blue: #4da8ff;
  --purple: #b478ff;
  --pink: #ff78c8;
  --accent: var(--cyan);
  --accent2: var(--blue);
  --accent3: var(--purple);
  --bg-glass: rgba(10, 20, 40, 0.55);
  --border: 1.5px solid rgba(0, 229, 255, 0.4);
  --glow: 0 0 20px rgba(0, 229, 255, 0.4);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
body.cyborg {
  --accent: var(--pink);
  --accent2: var(--purple);
  --accent3: var(--pink);
  --border: 1.5px solid rgba(255, 120, 200, 0.4);
  --glow: 0 0 20px rgba(255, 120, 200, 0.5);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  color: #e8f4ff; background: #02030d;
  user-select: none; -webkit-user-select: none;
  overscroll-behavior: none;
}
#cosmosCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* TOP BAR */
#topBar {
  position: fixed;
  top: calc(8px + var(--safe-top));
  left: calc(8px + var(--safe-left));
  right: calc(8px + var(--safe-right));
  height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
  background: var(--bg-glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: var(--border); border-radius: 18px;
  box-shadow: var(--glow), 0 8px 32px rgba(0,0,0,0.5);
  z-index: 100;
}
#logoBtn {
  height: 38px; min-width: 38px; cursor: pointer;
  filter: drop-shadow(0 0 10px var(--accent));
  transition: transform 0.2s;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; letter-spacing: 1px; color: var(--accent);
  font-size: 16px;
}
#logoBtn:active { transform: scale(0.92); }
.topRight { display: flex; gap: 6px; }

.iconBtn {
  width: 40px; height: 40px; min-width: 40px; min-height: 40px;
  border-radius: 14px;
  background: rgba(0, 229, 255, 0.08);
  border: var(--border); color: #fff;
  font-size: 18px; cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  font-family: inherit;
}
.iconBtn:active { background: rgba(0, 229, 255, 0.25); transform: scale(0.94); }
body.cyborg .iconBtn { background: rgba(255, 120, 200, 0.08); }
body.cyborg .iconBtn:active { background: rgba(255, 120, 200, 0.25); }

/* SIDEBAR */
#sidebar {
  position: fixed;
  top: calc(74px + var(--safe-top));
  left: calc(8px + var(--safe-left));
  width: 190px;
  max-height: calc(100vh - 74px - 90px - var(--safe-top) - var(--safe-bottom));
  padding: 10px;
  background: var(--bg-glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: var(--border); border-radius: 18px;
  box-shadow: var(--glow), 0 8px 32px rgba(0,0,0,0.5);
  z-index: 90;
  overflow-y: auto;
  transition: transform 0.3s ease, opacity 0.3s ease;
}
#sidebar.hidden {
  transform: translateX(-220px);
  opacity: 0;
  pointer-events: none;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }
.sidebar-title {
  font-size: 10px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin: 10px 4px 4px;
  opacity: 0.7;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; min-height: 44px;
  padding: 8px 10px; margin: 2px 0;
  border-radius: 12px;
  background: transparent;
  border: 1px solid transparent;
  color: #cce6ff; font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left; font-family: inherit;
}
.sidebar-item:hover, .sidebar-item:active {
  background: rgba(0, 229, 255, 0.1);
  border-color: rgba(0, 229, 255, 0.3);
  color: #fff;
}
body.cyborg .sidebar-item:hover, body.cyborg .sidebar-item:active {
  background: rgba(255, 120, 200, 0.12);
  border-color: rgba(255, 120, 200, 0.35);
}
.sidebar-item .ico {
  font-size: 17px; min-width: 22px;
  filter: drop-shadow(0 0 6px var(--accent));
}

/* WINDOWS */
#windows { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
.win {
  position: absolute;
  min-width: 280px;
  min-height: 180px;
  max-width: calc(100vw - 20px);
  max-height: calc(100vh - 120px);
  background: var(--bg-glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: var(--border); border-radius: 18px;
  box-shadow: var(--glow), 0 20px 60px rgba(0,0,0,0.7);
  pointer-events: auto;
  display: flex; flex-direction: column;
  overflow: hidden;
  z-index: 200;
  animation: winIn 0.25s ease;
}
.win.active { z-index: 250; }
@keyframes winIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.win-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 8px;
  background: rgba(0, 229, 255, 0.06);
  border-bottom: 1px solid rgba(0, 229, 255, 0.2);
  flex-shrink: 0;
  touch-action: none;
}
body.cyborg .win-header {
  background: rgba(255, 120, 200, 0.06);
  border-bottom-color: rgba(255, 120, 200, 0.2);
}
.win-title {
  font-size: 13px; font-weight: 600; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
  text-shadow: 0 0 10px var(--accent);
  padding: 0 6px;
}
.win-drag {
  flex: 1; height: 44px; cursor: grab;
  touch-action: none;
}
.win-drag:active { cursor: grabbing; }
.win-btns { display: flex; gap: 4px; }
.win-btn {
  width: 40px; height: 40px; min-width: 40px; min-height: 40px;
  border-radius: 12px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(0, 229, 255, 0.4);
  color: #fff; font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 999999; position: relative;
  transition: all 0.2s;
  font-family: inherit;
}
.win-btn:active { transform: scale(0.9); }
.win-btn.close { color: #ff8888; border-color: rgba(255, 100, 100, 0.6); }
.win-btn.close:active { background: rgba(255, 80, 80, 0.3); }

.win-body {
  flex: 1; overflow-y: auto;
  padding: 14px; color: #dde8f5; font-size: 13px;
  user-select: text; -webkit-user-select: text;
}
.win-body::-webkit-scrollbar { width: 6px; }
.win-body::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* BOTTOM BAR */
#bottomBar {
  position: fixed;
  bottom: calc(8px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px;
  padding: 6px;
  background: var(--bg-glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: var(--border); border-radius: 18px;
  box-shadow: var(--glow), 0 8px 32px rgba(0,0,0,0.5);
  z-index: 95;
  white-space: nowrap;
}
.bottomBtn {
  min-height: 44px; padding: 8px 14px;
  border-radius: 14px;
  background: rgba(0, 229, 255, 0.08);
  border: 1px solid rgba(0, 229, 255, 0.3);
  color: #fff; font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.bottomBtn:active { transform: scale(0.94); background: rgba(0, 229, 255, 0.2); }
body.cyborg .bottomBtn { border-color: rgba(255, 120, 200, 0.4); }
body.cyborg .bottomBtn:active { background: rgba(255, 120, 200, 0.2); }

/* TOASTS */
#toastContainer {
  position: fixed;
  bottom: calc(100px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  z-index: 1000; pointer-events: none;
  width: calc(100% - 40px); max-width: 400px;
}
.toast {
  padding: 12px 18px;
  background: var(--bg-glass);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: var(--border); border-radius: 14px;
  color: #fff; font-size: 14px;
  box-shadow: var(--glow);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  pointer-events: auto;
  max-width: 100%;
}
@keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes toastOut { to { transform: translateY(20px); opacity: 0; } }

/* APP COMMON */
.app-content { display: flex; flex-direction: column; gap: 10px; }
.app-input, .app-textarea, .app-select {
  width: 100%; padding: 10px 12px;
  border-radius: 12px;
  background: rgba(0,0,0,0.3);
  border: 1.5px solid rgba(0, 229, 255, 0.3);
  color: #fff; font-size: 13px;
  font-family: inherit; outline: none;
  transition: border-color 0.2s;
}
.app-input:focus, .app-textarea:focus, .app-select:focus { border-color: var(--accent); }
.app-textarea { min-height: 80px; resize: vertical; }
.app-btn {
  min-height: 44px; padding: 10px 16px;
  border-radius: 14px;
  background: rgba(0, 229, 255, 0.15);
  border: 1.5px solid rgba(0, 229, 255, 0.4);
  color: #fff; font-size: 13px;
  cursor: pointer; transition: all 0.2s;
  font-family: inherit; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.app-btn:active { transform: scale(0.95); background: rgba(0, 229, 255, 0.3); }
.app-btn.primary { background: linear-gradient(135deg, rgba(0,229,255,0.4), rgba(180,120,255,0.4)); }
.app-btn.danger { border-color: rgba(255, 100, 100, 0.5); color: #ffaaaa; }
body.cyborg .app-btn { border-color: rgba(255,120,200,0.4); background: rgba(255,120,200,0.15); }
body.cyborg .app-btn:active { background: rgba(255,120,200,0.3); }
.app-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px; border-radius: 12px;
  background: rgba(0, 229, 255, 0.05);
  border: 1px solid rgba(0, 229, 255, 0.15);
  margin-bottom: 6px; font-size: 12px;
}
.app-row .del {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(255,100,100,0.15);
  border: 1px solid rgba(255,100,100,0.4);
  color: #ffaaaa; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-left: auto;
}
.app-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.app-tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 8px; border-radius: 14px;
  background: rgba(0, 229, 255, 0.06);
  border: 1px solid rgba(0, 229, 255, 0.2);
  cursor: pointer; transition: all 0.2s; text-align: center;
}
.app-tile:active { transform: scale(0.94); background: rgba(0, 229, 255, 0.15); }
.app-tile .tico { font-size: 24px; filter: drop-shadow(0 0 8px var(--accent)); }
.app-tile .tname { font-size: 10px; color: #cce6ff; line-height: 1.2; }

/* AVATAR */
.avatar-wrap {
  display: flex; flex-direction: column;
  align-items: center; gap: 14px; padding: 10px 0;
}
.avatar-stage {
  position: relative;
  width: 200px; height: 200px;
  display: flex; align-items: center; justify-content: center;
}
.avatar-holo-ring {
  position: absolute; border-radius: 50%;
  border: 1.5px solid var(--accent);
  pointer-events: none;
}
.avatar-holo-ring.r1 { width: 200px; height: 200px; opacity: 0.25; animation: ringPulse 3s ease-in-out infinite; }
.avatar-holo-ring.r2 { width: 180px; height: 180px; opacity: 0.35; animation: ringPulse 3s ease-in-out infinite 0.5s; }
.avatar-holo-ring.r3 { width: 160px; height: 160px; opacity: 0.5; animation: ringPulse 3s ease-in-out infinite 1s; }
@keyframes ringPulse {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.08); opacity: 0.6; }
}
.avatar-svg {
  width: 150px; height: 150px;
  filter: drop-shadow(0 0 24px var(--accent));
  position: relative; z-index: 5;
}
.avatar-svg .eye { animation: blink 4s infinite; }
@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}
.avatar-svg .mouth { transform-origin: center; }
.avatar-svg.speaking .mouth { animation: talk 0.3s ease-in-out infinite; }
@keyframes talk {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.4); }
}
.avatar-svg .pupil { animation: pupilMove 6s ease-in-out infinite; }
@keyframes pupilMove {
  0%, 100% { transform: translate(0,0); }
  25% { transform: translate(-2px, -1px); }
  50% { transform: translate(2px, 0); }
  75% { transform: translate(0, 1px); }
}
.avatar-name { color: var(--accent); font-size: 14px; font-weight: 600; letter-spacing: 1px; }
.avatar-status { color: #aaccee; font-size: 11px; opacity: 0.8; }

/* EARTH / KOSMOS */
.earth-container {
  display: flex; align-items: center; justify-content: center;
  position: relative; width: 100%; height: 380px; overflow: hidden;
}
.earth-globe {
  width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #6ec8ff, #2a6cbf 45%, #0a2040 85%);
  box-shadow:
    0 0 30px rgba(77, 168, 255, 0.9),
    0 0 80px rgba(77, 168, 255, 0.4),
    inset -12px -12px 32px rgba(0,0,0,0.7),
    inset 12px 12px 24px rgba(120, 200, 255, 0.35);
  position: absolute; z-index: 10;
}
.earth-globe::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 60% 40%, rgba(80, 200, 120, 0.5) 0%, transparent 40%),
    radial-gradient(circle at 35% 65%, rgba(80, 200, 120, 0.4) 0%, transparent 35%),
    radial-gradient(circle at 75% 70%, rgba(80, 200, 120, 0.3) 0%, transparent 30%);
}
.ring-svg {
  position: absolute; top: 50%; left: 50%;
  transform-origin: center;
  pointer-events: none;
  animation: ringSpin 50s linear infinite;
}
.ring-svg.r2 { animation-duration: 70s; animation-direction: reverse; }
.ring-svg.r3 { animation-duration: 90s; }
@keyframes ringSpin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}
.ring-svg text {
  fill: var(--accent);
  font-size: 9px;
  font-family: inherit;
  letter-spacing: 2.5px;
  opacity: 0.85;
}
body.cyborg .ring-svg text { fill: var(--pink); }
</style>
</head>
<body>
<canvas id="cosmosCanvas"></canvas>

<div id="topBar">
  <div id="logoBtn">🦚 HALDO</div>
  <div class="topRight">
    <button class="iconBtn" id="themeToggle" title="CYBORG">⚡</button>
    <button class="iconBtn" id="sidebarToggle" title="Menu">☰</button>
  </div>
</div>

<nav id="sidebar">
  <div class="sidebar-title">Home</div>
  <button class="sidebar-item" data-app="dashboard"><span class="ico">🏠</span>Dashboard</button>
  <button class="sidebar-item" data-app="journal"><span class="ico">📔</span>Journal</button>
  <button class="sidebar-item" data-app="calendar"><span class="ico">📅</span>Kalender</button>
  <button class="sidebar-item" data-app="weather"><span class="ico">🌤️</span>Wetter</button>

  <div class="sidebar-title">Apps</div>
  <button class="sidebar-item" data-app="notes"><span class="ico">📝</span>Notes</button>
  <button class="sidebar-item" data-app="tasks"><span class="ico">✅</span>Tasks</button>
  <button class="sidebar-item" data-app="habits"><span class="ico">🔥</span>Habits</button>
  <button class="sidebar-item" data-app="goals"><span class="ico">🎯</span>Goals</button>
  <button class="sidebar-item" data-app="memory"><span class="ico">🧠</span>Memory</button>
  <button class="sidebar-item" data-app="music"><span class="ico">🎵</span>Music</button>

  <div class="sidebar-title">System</div>
  <button class="sidebar-item" data-app="settings"><span class="ico">⚙️</span>Settings</button>
  <button class="sidebar-item" data-app="files"><span class="ico">📁</span>Files</button>
  <button class="sidebar-item" data-app="password"><span class="ico">🔑</span>Password</button>
  <button class="sidebar-item" data-app="clipboard"><span class="ico">📋</span>Clipboard</button>

  <div class="sidebar-title">Chat</div>
  <button class="sidebar-item" data-app="chat"><span class="ico">💬</span>HalDo AI</button>
  <button class="sidebar-item" data-app="avatar"><span class="ico">🤖</span>Avatar</button>

  <div class="sidebar-title">Tools</div>
  <button class="sidebar-item" data-app="calculator"><span class="ico">🧮</span>Calculator</button>
  <button class="sidebar-item" data-app="timer"><span class="ico">⏱️</span>Timer</button>
  <button class="sidebar-item" data-app="translator"><span class="ico">🌐</span>Translator</button>
  <button class="sidebar-item" data-app="contacts"><span class="ico">👥</span>Contacts</button>

  <div class="sidebar-title">Weltraum</div>
  <button class="sidebar-item" data-app="kosmos"><span class="ico">🌌</span>Kosmos</button>
  <button class="sidebar-item" data-app="blitzer"><span class="ico">🚦</span>Blitzer</button>
</nav>

<div id="windows"></div>

<div id="bottomBar">
  <button class="bottomBtn" data-app="chat">💬 Chat</button>
  <button class="bottomBtn" data-app="avatar">🤖 AI</button>
  <button class="bottomBtn" id="cyborgBottomBtn">⚡ CYBORG</button>
</div>

<div id="toastContainer"></div>

<script>
/* ========== COSMOS BACKGROUND ========== */
(function() {
  const canvas = document.getElementById('cosmosCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = [];
  for (let i = 0; i < 350; i++) {
    stars.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      r: Math.random() * 1.4 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 1.5 + 0.4,
      hue: Math.random() < 0.3 ? 200 : (Math.random() < 0.5 ? 180 : 260)
    });
  }

  const planetColors = [
    '#b8b8c8', '#e8d8a0', '#4da8ff', '#ff7070',
    '#ffb060', '#f0d090', '#80e0ff', '#5080ff',
    '#ff90c0', '#a0a0b0', '#e0e0f0', '#d0c0a0'
  ];
  const planets = planetColors.map((c, i) => ({
    color: c,
    size: 4 + (i % 3) * 2.5 + Math.random() * 2,
    orbit: 90 + i * 42,
    speed: 0.15 / (1 + i * 0.3),
    phase: Math.random() * Math.PI * 2,
    angle: (i / 12) * Math.PI * 2,
    hasRing: i === 5
  }));

  let shootingStars = [];
  function spawnShootingStar() {
    shootingStars.push({
      x: Math.random() * W,
      y: -20,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 3 + 3,
      life: 0,
      maxLife: 90,
      len: 60 + Math.random() * 80
    });
  }
  setInterval(() => {
    if (Math.random() < 0.6) spawnShootingStar();
  }, 2200);

  let t0 = performance.now();
  function frame(t) {
    const dt = Math.min(t - t0, 50);
    t0 = t;

    // Background
    const bg = ctx.createRadialGradient(W*0.7, H*0.35, 0, W*0.5, H*0.5, Math.max(W,H));
    bg.addColorStop(0, '#0f1638');
    bg.addColorStop(0.4, '#070a20');
    bg.addColorStop(1, '#02030d');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Nebula
    ctx.globalCompositeOperation = 'lighter';
    const nebulas = [
      { x: W*0.15, y: H*0.2, r: 280, c: 'rgba(120, 60, 200, 0.12)' },
      { x: W*0.85, y: H*0.75, r: 320, c: 'rgba(0, 180, 255, 0.08)' },
      { x: W*0.5, y: H*0.9, r: 400, c: 'rgba(180, 60, 200, 0.08)' }
    ];
    nebulas.forEach(n => {
      const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      g.addColorStop(0, n.c);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';

    // Stars
    const tSec = t * 0.001;
    stars.forEach(s => {
      const tw = 0.5 + 0.5 * Math.sin(tSec * s.speed + s.phase);
      const x = (s.x / 2000) * W;
      const y = (s.y / 2000) * H;
      ctx.fillStyle = `hsla(${s.hue}, 80%, 75%, ${0.4 + tw * 0.6})`;
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Shooting stars
    shootingStars = shootingStars.filter(s => s.life < s.maxLife);
    shootingStars.forEach(s => {
      s.x += s.vx;
      s.y += s.vy;
      s.life++;
      const a = 1 - s.life / s.maxLife;
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 20, s.y - s.vy * 20);
      g.addColorStop(0, `rgba(180, 220, 255, ${a})`);
      g.addColorStop(1, 'transparent');
      ctx.strokeStyle = g;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 20, s.y - s.vy * 20);
      ctx.stroke();
    });

    // Sun
    const sunX = W * 0.82, sunY = H * 0.28;
    const sunR = 55;
    for (let i = 4; i >= 1; i--) {
      const cg = ctx.createRadialGradient(sunX, sunY, sunR * 0.4 * i, sunX, sunY, sunR * (1 + i * 0.8));
      const alpha = 0.08 / i;
      cg.addColorStop(0, `rgba(255, 200, 100, ${alpha})`);
      cg.addColorStop(0.5, `rgba(255, 150, 60, ${alpha * 0.6})`);
      cg.addColorStop(1, 'transparent');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunR * (1 + i * 0.8), 0, Math.PI * 2);
      ctx.fill();
    }
    const sunGrad = ctx.createRadialGradient(sunX - 10, sunY - 10, 0, sunX, sunY, sunR);
    sunGrad.addColorStop(0, '#ffffff');
    sunGrad.addColorStop(0.4, '#ffe080');
    sunGrad.addColorStop(0.8, '#ff9944');
    sunGrad.addColorStop(1, '#ff5533');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    ctx.fill();

    // Planets
    planets.forEach(p => {
      p.angle += p.speed * dt * 0.001 * 6;
      const px = sunX + Math.cos(p.angle + p.phase) * p.orbit;
      const py = sunY + Math.sin(p.angle + p.phase) * p.orbit * 0.55;

      // Orbit trail
      ctx.strokeStyle = 'rgba(120, 180, 255, 0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(sunX, sunY, p.orbit, p.orbit * 0.55, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Planet glow
      const pg = ctx.createRadialGradient(px, py, 0, px, py, p.size * 4);
      pg.addColorStop(0, p.color + '88');
      pg.addColorStop(1, 'transparent');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(px, py, p.size * 4, 0, Math.PI * 2);
      ctx.fill();

      // Planet body
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, Math.PI * 2);
      ctx.fill();

      // Ring (Saturn)
      if (p.hasRing) {
        ctx.strokeStyle = 'rgba(240, 220, 160, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(px, py, p.size * 2.2, p.size * 0.7, -0.4, 0, Math.PI * 2);
        ctx.stroke();
      }
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ========== TOAST ========== */
function toast(msg, ms = 3000) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

function setTheme(mode) {
  document.body.classList.toggle('cyborg', mode === 'cyborg');
  localStorage.setItem('haldo_theme_v1', mode);
  toast(mode === 'cyborg' ? '⚡ CYBORG-Modus aktiv' : '🤖 HalDo AI Modus aktiv');
}
function toggleTheme() {
  const cur = document.body.classList.contains('cyborg') ? 'cyborg' : 'ai';
  setTheme(cur === 'cyborg' ? 'ai' : 'cyborg');
}

/* ========== WINDOW MANAGER ========== */
const WM = {
  wins: {},
  zTop: 200,
  open(id, title, contentHTML, opts = {}) {
    if (this.wins[id]) { this.focus(id); return this.wins[id]; }
    const win = document.createElement('div');
    win.className = 'win';
    win.dataset.id = id;
    const w = opts.width || 360;
    const h = opts.height || 420;
    const x = Math.max(10, (window.innerWidth - w) / 2 + (Math.random() - 0.5) * 60);
    const y = Math.max(90, (window.innerHeight - h) / 2 - 40 + (Math.random() - 0.5) * 40);
    win.style.left = x + 'px';
    win.style.top = y + 'px';
    win.style.width = Math.min(w, window.innerWidth - 20) + 'px';
    win.style.height = Math.min(h, window.innerHeight - 120) + 'px';

    win.innerHTML = `
      <div class="win-header">
        <div class="win-title">${title}</div>
        <div class="win-drag"></div>
        <div class="win-btns">
          <button class="win-btn close" data-close="${id}">✕</button>
        </div>
      </div>
      <div class="win-body">${contentHTML}</div>
    `;
    document.getElementById('windows').appendChild(win);
    this.wins[id] = win;

    win.querySelector('[data-close]').addEventListener('click', (e) => {
      e.stopPropagation();
      this.close(id);
    });

    const drag = win.querySelector('.win-drag');
    this.makeDraggable(win, drag);

    win.addEventListener('pointerdown', () => this.focus(id));

    this.focus(id);
    if (opts.onMount) opts.onMount(win.querySelector('.win-body'));
    return win;
  },
  makeDraggable(win, handle) {
    let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false;
    handle.addEventListener('pointerdown', e => {
      dragging = true;
      sx = e.clientX; sy = e.clientY;
      ox = win.offsetLeft; oy = win.offsetTop;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', e => {
      if (!dragging) return;
      const nx = ox + (e.clientX - sx);
      const ny = oy + (e.clientY - sy);
      const maxX = window.innerWidth - win.offsetWidth;
      const maxY = window.innerHeight - win.offsetHeight - 10;
      win.style.left = Math.max(0, Math.min(nx, maxX)) + 'px';
      win.style.top = Math.max(70, Math.min(ny, maxY)) + 'px';
    });
    handle.addEventListener('pointerup', e => {
      dragging = false;
      try { handle.releasePointerCapture(e.pointerId); } catch(_) {}
    });
  },
  focus(id) {
    Object.values(this.wins).forEach(w => w.classList.remove('active'));
    if (this.wins[id]) {
      this.wins[id].classList.add('active');
      this.wins[id].style.zIndex = ++this.zTop + 100;
    }
  },
  close(id) {
    if (this.wins[id]) {
      this.wins[id].remove();
      delete this.wins[id];
    }
  }
};

/* ========== STORAGE HELPERS ========== */
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(_) {} }
function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch(_) { return def; } }

        return streak;

  calculator: {
    title: '🧮 Calculator',
    width: 320, height: 440,
    render() {
      const btns = ['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='];
      return `
        <div class="app-content" style="gap:6px">
          <input class="app-input" id="calcDisplay" readonly style="text-align:right;font-size:22px;font-family:monospace;height:56px" value="0">
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
            ${btns.map(b => `<button class="app-btn" data-k="${b}" style="min-height:48px;font-size:16px;padding:0">${b}</button>`).join('')}
          </div>
        </div>
      `;
    },
    mount(root) {
      let cur = '0', prev = null, op = null;
      const disp = root.querySelector('#calcDisplay');
      const upd = () => disp.value = cur;
      const compute = (a, b, o) => {
        a = +a; b = +b;
        if (o === '+') return a + b;
        if (o === '−') return a - b;
        if (o === '×') return a * b;
        if (o === '÷') return b === 0 ? 'Err' : a / b;
        return b;
      };
      root.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (k === 'C') { cur = '0'; prev = null; op = null; }
        else if (k === '±') cur = String(-parseFloat(cur));
        else if (k === '%') cur = String(parseFloat(cur) / 100);
        else if (k === '⌫') cur = cur.length > 1 ? cur.slice(0, -1) : '0';
        else if (['+','−','×','÷'].includes(k)) {
          if (prev !== null && op) prev = compute(prev, cur, op); else prev = cur;
          op = k; cur = '0';
        }
        else if (k === '=') {
          if (prev !== null && op) { cur = String(compute(prev, cur, op)); prev = null; op = null; }
        }
        else {
          if (k === '.' && cur.includes('.')) return;
          cur = cur === '0' && k !== '.' ? k : cur + k;
        }
        upd();
      });
    }
  },

      const l2 = 'BIXER HATÎ · BI XÊR TÊ · BILINGUAL · BEM-VINDO · VÍTEJ · BIENVENIDO · TERVETULOA · VÄLKOMMEN · HOŞ GELDİN · ';
      const l3 = 'ÊZÎDÎ · KURDÎ · LATINA · עברית · DEUTSCH · TÜRKÇE · ENGLISH · 中文 · 日本語 · O\'ZBEK · РУССКИЙ · ';
      return `
        <div class="earth-container">
          <svg class="ring-svg r1" width="360" height="360" viewBox="0 0 360 360">
            <defs><path id="rp1" d="M 180,180 m -170,0 a 170,170 0 1,1 340,0 a 170,170 0 1,1 -340,0" fill="none"/></defs>
            <text><textPath href="#rp1">${l1}${l1}</textPath></text>
          </svg>
          <svg class="ring-svg r2" width="280" height="280" viewBox="0 0 280 280">
            <defs><path id="rp2" d="M 140,140 m -130,0 a 130,130 0 1,1 260,0 a 130,130 0 1,1 -260,0" fill="none"/></defs>
            <text><textPath href="#rp2">${l2}${l2}</textPath></text>
          </svg>
          <svg class="ring-svg r3" width="200" height="200" viewBox="0 0 200 200">
            <defs><path id="rp3" d="M 100,100 m -92,0 a 92,92 0 1,1 184,0 a 92,92 0 1,1 -184,0" fill="none"/></defs>
            <text><textPath href="#rp3">${l3}${l3}</textPath></text>
          </svg>
          <div class="earth-globe"></div>
        </div>
        <div style="text-align:center;font-size:12px;opacity:0.7;margin-top:8px">
          Sonne · 12 Planeten · 350 Sterne · 16 Sprachen im Orbit
        </div>
      `;
    }
  },
  blitzer: {
    title: '🚦 Blitzer',
    width: 360, height: 440,
    render() {
      return `
        <div class="app-content" style="text-align:center">
          <div style="font-size:64px;margin:10px 0" id="bIcon">🛣️</div>
          <div style="color:var(--accent);font-size:14px" id="bSign">A7 · Frankfurt</div>
          <div style="font-size:44px;font-family:monospace;color:#fff;margin:10px 0" id="bSpeed">0 km/h</div>
          <div style="display:flex;gap:6px;justify-content:center;margin:8px 0">
            <div style="width:8px;height:8px;border-radius:50%;background:#5f5" id="bLed1"></div>
            <div style="width:8px;height:8px;border-radius:50%;background:#ff5" id="bLed2"></div>
            <div style="width:8px;height:8px;border-radius:50%;background:#f55" id="bLed3"></div>
          </div>
          <button class="app-btn primary" id="bStart">▶ Fahrt starten</button>
          <div id="bWarn" style="margin-top:10px;font-size:12px;opacity:0.8"></div>
        </div>
      `;
    },
    mount(root) {
      let interval = null, speed = 0;
      const warns = ['50er Zone', 'Baustelle', 'Stau voraus', 'Blitzer!', 'Achtung Regen', 'Glätte', 'Wildwechsel', 'Unfall', 'Geisterfahrer', 'Sturm'];
      root.querySelector('#bStart').onclick = () => {
        if (interval) { clearInterval(interval); interval = null; root.querySelector('#bStart').textContent = '▶ Fahrt starten'; return; }
        root.querySelector('#bStart').textContent = '⏸ Stop';
        interval = setInterval(() => {
          speed = Math.min(260, speed + Math.random() * 15);
          if (Math.random() < 0.2) speed -= 20;
          root.querySelector('#bSpeed').textContent = Math.round(speed) + ' km/h';
          if (Math.random() < 0.3) {
            const w = warns[Math.floor(Math.random() * warns.length)];
            root.querySelector('#bWarn').textContent = '⚠️ ' + w;
            speak(w);
          }
        }, 800);
      };
    }
  }
};

function openApp(id) {
  const app = APPS[id];
  if (!app) { toast('App ' + id + ' kommt in v123+'); return; }
  const win = WM.open(id, app.title, app.render(), { width: app.width, height: app.height, onMount: app.mount });
}

/* ========== SPEECH ========== */
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 1;
  u.pitch = document.body.classList.contains('cyborg') ? 0.7 : 1;
  speechSynthesis.speak(u);
}

/* ========== SIDEBAR / EVENTS ========== */
document.querySelectorAll('[data-app]').forEach(btn => {
  btn.onclick = () => openApp(btn.dataset.app);
});
document.getElementById('logoBtn').onclick = () => {
  document.getElementById('sidebar').classList.toggle('hidden');
};
document.getElementById('sidebarToggle').onclick = () => {
  document.getElementById('sidebar').classList.toggle('hidden');
};
document.getElementById('themeToggle').onclick = toggleTheme;
document.getElementById('cyborgBottomBtn').onclick = toggleTheme;

/* ========== GLOBAL API (für Kompatibilität) ========== */
window.HalDo = {
  version: 'v122',
  toast,
  speak,
  open: openApp,
  close: (id) => WM.close(id),
  theme: setTheme,
  Kosmos: { open: () => openApp('kosmos') },
  Notes: {
    add: (title, body) => { const a = load('haldo_notes_v1', []); a.unshift({ title, body }); store('haldo_notes_v1', a); },
    all: () => load('haldo_notes_v1', [])
  },
  Tasks: {
    add: (title) => { const a = load('haldo_tasks_v1', []); a.push({ title, done: false }); store('haldo_tasks_v1', a); },
    all: () => load('haldo_tasks_v1', []),
    complete: (i) => { const a = load('haldo_tasks_v1', []); a[i].done = true; store('haldo_tasks_v1', a); }
  },
  Journal: {
    write: (title, body, mood) => { const a = load('haldo_journal_v1', []); a.unshift({ title, body, mood, date: new Date().toISOString() }); store('haldo_journal_v1', a); },
    all: () => load('haldo_journal_v1', [])
  },
  Memory: {
    remember: (title, body) => { const a = load('haldo_memory_v1', []); a.unshift({ title, body }); store('haldo_memory_v1', a); },
    all: () => load('haldo_memory_v1', [])
  },
  Habits: {
    add: (name) => { const a = load('haldo_habits_v1', []); a.push({ name, dates: [] }); store('haldo_habits_v1', a); },
    all: () => load('haldo_habits_v1', [])
  },
  Goals: {
    add: (title) => { const a = load('haldo_goals_v1', []); a.push({ title, done: false }); store('haldo_goals_v1', a); },
    all: () => load('haldo_goals_v1', [])
  },
  Password: {
    generate(len = 20) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=';
      let out = ''; const arr = new Uint32Array(len); crypto.getRandomValues(arr);
      for (let i = 0; i < len; i++) out += chars[arr[i] % chars.length];
      return out;
    }
  }
};

/* ========== WELCOME ========== */
setTimeout(() => {
  toast('🤖 HalDo AI OS v122 – bereit, Bruder 💙');
}, 600);
setTimeout(() => {
  speak('Hallo Bruder, HalDo System online.');
}, 1200);
</script>
