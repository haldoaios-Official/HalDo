<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>HalDo AI OS v125</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='82'%3E🦚%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#02040a;color:#dff6ff;font-size:13px}
button,input,textarea,select{font-family:inherit;color:inherit}

:root{
  --p1:#00e5ff;--p2:#4da8ff;--p3:#b478ff;
  --bg-panel:rgba(10,20,40,.55);--bg-card:rgba(15,25,50,.7);
  --border:1.5px solid rgba(0,229,255,.4);
  --border-soft:1px solid rgba(0,229,255,.18);
  --text:#dff6ff;--text-dim:#7a9bb8;--text-mute:#4a6b88;
  --radius:18px;--radius-sm:14px;
  --shadow:0 10px 40px rgba(0,229,255,.15);
  --glow:0 0 20px rgba(0,229,255,.5);
}
body.cyborg{--p1:#ff78c8;--p2:#b478ff;--p3:#ff5cae;--border:1.5px solid rgba(255,120,200,.5);--border-soft:1px solid rgba(255,120,200,.2);--glow:0 0 20px rgba(255,120,200,.6)}

#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 20% 30%,#0a1a3a,#02040a 70%)}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;height:56px;z-index:50;display:flex;align-items:center;gap:8px;padding:0 12px;padding-top:env(safe-area-inset-top);background:var(--bg-panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:var(--border-soft)}
#topbar .logo{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 10px;border-radius:12px;transition:.2s}
#topbar .logo:hover{background:rgba(0,229,255,.08)}
#topbar .logo .peacock{font-size:26px;filter:drop-shadow(0 0 8px var(--p1))}
#topbar .logo .txt{display:flex;flex-direction:column;line-height:1.05}
#topbar .logo .txt .t1{font-size:14px;font-weight:800;color:var(--p1)}
#topbar .logo .txt .t2{font-size:9px;color:var(--text-mute);letter-spacing:2px}
#topbar .spacer{flex:1}
#topbar .icon-btn{width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--p1);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
#topbar .icon-btn:hover{background:rgba(0,229,255,.15);box-shadow:var(--glow)}

/* SIDEBAR */
#sidebar{position:fixed;top:56px;bottom:70px;left:0;width:240px;z-index:40;padding:12px 10px;background:var(--bg-panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:var(--border-soft);overflow-y:auto;transform:translateX(-100%);transition:transform .3s}
#sidebar.open{transform:translateX(0)}
#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
#sidebar .group{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:14px 8px 6px}
#sidebar .item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;width:100%;text-align:left}
#sidebar .item:hover{background:rgba(0,229,255,.1)}
#sidebar .item .ico{font-size:18px;flex-shrink:0}

/* DESKTOP */
#desktop{position:fixed;top:56px;left:0;right:0;bottom:70px;z-index:20;overflow:hidden;padding:12px}
#sidebar.open ~ #desktop{left:240px}
@media(max-width:700px){#sidebar.open ~ #desktop{left:0}#sidebar{box-shadow:20px 0 60px rgba(0,0,0,.6)}}

#homescreen{padding:8px 4px;overflow-y:auto;height:100%;padding-bottom:20px}
#homescreen::-webkit-scrollbar{width:6px}#homescreen::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.welcome{padding:18px 16px;margin-bottom:14px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(180,120,255,.1));border:var(--border);box-shadow:var(--shadow);text-align:center;max-width:720px;margin-left:auto;margin-right:auto}
.welcome .hello{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;font-weight:800}
.welcome .name{font-size:20px;font-weight:900;color:var(--p1);margin-top:4px;text-shadow:0 0 20px var(--p1)}
.welcome .sub{font-size:11px;color:var(--text-dim);margin-top:6px}
.search-row{max-width:720px;margin:0 auto 16px;padding:0 4px}
.search-row input{width:100%;padding:12px 16px;border-radius:14px;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--text);font-size:13px;outline:none}
.search-row input:focus{border-color:var(--p1);box-shadow:0 0 20px rgba(0,229,255,.2)}
.cat-section{max-width:720px;margin:0 auto 16px;padding:0 4px}
.cat-title{font-size:10.5px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;padding-left:4px;display:flex;align-items:center;gap:8px}
.cat-title .count{font-size:9px;padding:2px 8px;background:rgba(0,229,255,.15);color:var(--p1);border-radius:10px;font-weight:800}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tile{padding:14px 6px;border-radius:16px;background:var(--bg-card);backdrop-filter:blur(20px);border:var(--border-soft);cursor:pointer;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tile:hover{border-color:var(--p1);background:rgba(0,229,255,.1);transform:translateY(-3px);box-shadow:var(--glow)}
.tile .ico{font-size:32px;line-height:1;filter:drop-shadow(0 0 10px rgba(0,229,255,.4))}
.tile .name{font-size:11px;font-weight:700;color:var(--text);line-height:1.2}
.tile .cat{font-size:8.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.5px;font-weight:700}

/* FENSTER */
.window{position:absolute;min-width:300px;min-height:260px;max-width:95vw;max-height:88vh;background:var(--bg-card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:100;transition:box-shadow .2s}
.window.focused{box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px rgba(0,229,255,.25);border-color:var(--p1)}
.window.minimized{display:none}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(0,229,255,.1),transparent);border-bottom:var(--border-soft);cursor:move;flex-shrink:0;user-select:none;touch-action:none}
.titlebar .ico{font-size:18px}
.titlebar .title{flex:1;font-size:12.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtns{display:flex;gap:6px}
.wbtn{width:40px;height:40px;min-width:40px;border-radius:10px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s}
.wbtn:hover{background:rgba(0,229,255,.25)}
.wbtn.close{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#ff8080}
.wbtn.close:hover{background:rgba(239,68,68,.35)}
.wbtn.set{background:rgba(180,120,255,.15);border-color:rgba(180,120,255,.5);color:#c084fc}
.wbtn.set:hover{background:rgba(180,120,255,.35)}
.wbody{flex:1;overflow-y:auto;padding:14px}
.wbody::-webkit-scrollbar{width:6px}.wbody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.resizer{position:absolute;width:16px;height:16px;bottom:0;right:0;cursor:nwse-resize;z-index:5}
.resizer::after{content:"";position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-right:2px solid var(--p1);border-bottom:2px solid var(--p1);opacity:.4}

/* CHAT PANEL */
#chatPanel{position:fixed;left:0;right:0;bottom:70px;height:60vh;max-height:600px;z-index:150;background:var(--bg-panel);backdrop-filter:blur(28px);border-top:var(--border);border-left:var(--border-soft);border-right:var(--border-soft);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(110%);transition:transform .35s cubic-bezier(.4,0,.2,1);max-width:700px;margin:0 auto;box-shadow:0 -20px 60px rgba(0,229,255,.15)}
#chatPanel.show{transform:translateY(0)}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:var(--border-soft);flex-shrink:0}
.chat-head .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p3));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 20px var(--p1);flex-shrink:0}
.chat-head .meta{flex:1;min-width:0}
.chat-head .meta .name{font-size:14px;font-weight:900;color:var(--p1)}
.chat-head .meta .status{font-size:10px;color:var(--text-mute);font-weight:700}
.chat-head .btn{width:38px;height:38px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
#chatBody{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#chatBody::-webkit-scrollbar{width:6px}#chatBody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.msg{max-width:82%;padding:11px 15px;border-radius:16px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;font-weight:600;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(0,229,255,.1);border:var(--border-soft);border-bottom-left-radius:4px;color:var(--text)}
.chat-quick{display:flex;gap:6px;padding:6px 14px;overflow-x:auto;flex-shrink:0}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{padding:7px 12px;background:rgba(0,229,255,.1);border:var(--border-soft);border-radius:14px;color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
.chat-quick button:hover{background:rgba(0,229,255,.2);color:var(--text)}
.chat-input-row{display:flex;gap:8px;padding:10px 12px 14px;border-top:var(--border-soft);flex-shrink:0;align-items:flex-end}
.chat-input-row textarea{flex:1;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--text);padding:11px 14px;border-radius:22px;font-family:inherit;font-size:13px;outline:none;resize:none;line-height:1.4;min-height:44px;max-height:120px}
.chat-input-row textarea:focus{border-color:var(--p1);box-shadow:0 0 15px rgba(0,229,255,.2)}
.chat-input-row .send{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));border:none;color:#001428;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 15px rgba(0,229,255,.4)}
.chat-input-row .send:hover{transform:scale(1.05)}
.chat-input-row .mic{width:46px;height:46px;border-radius:50%;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-input-row .mic.on{background:rgba(239,68,68,.25);border-color:#ef4444;color:#ff8080}

/* BOTTOM BAR */
#bottombar{position:fixed;bottom:0;left:0;right:0;height:70px;z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px;padding-bottom:env(safe-area-inset-bottom);background:var(--bg-panel);backdrop-filter:blur(24px);border-top:var(--border-soft)}
.bbtn{min-width:90px;padding:10px 18px;border-radius:14px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
.bbtn:hover{background:rgba(0,229,255,.2);box-shadow:var(--glow);transform:translateY(-2px)}
.bbtn .ico{font-size:20px;line-height:1}
.bbtn.cyborg{background:rgba(255,120,200,.15);border-color:rgba(255,120,200,.5);color:#ff78c8}

/* SETTINGS */
#settings{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.8);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
#settings.show{display:flex}
.panel-box{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-box::-webkit-scrollbar{width:6px}.panel-box::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.phead{display:flex;align-items:center;gap:10px;padding:16px;position:sticky;top:0;background:var(--bg-card);backdrop-filter:blur(28px);border-bottom:var(--border-soft);z-index:2}
.phead h2{font-size:14px;font-weight:900;color:var(--p1);flex:1}
.phead .close{width:40px;height:40px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.pbody{padding:16px}
.group{margin-bottom:14px;padding:14px;background:rgba(0,0,0,.2);border-radius:14px;border:var(--border-soft)}
.group h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--p1);font-weight:800;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:10px}
.row:last-child{border-bottom:none}
.row .lbl{font-size:12px;font-weight:700;flex:1}
.row .lbl small{display:block;font-size:10px;color:var(--text-mute);font-weight:600;margin-top:2px}
.sw{width:48px;height:26px;border-radius:13px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#7a9bb8;transition:.2s}
.sw.on{background:rgba(0,229,255,.3);border-color:var(--p1)}
.sw.on::after{left:24px;background:var(--p1);box-shadow:0 0 10px var(--p1)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-card{padding:12px 8px;border-radius:12px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center;transition:.2s}
.theme-card.active{border-color:var(--p1);box-shadow:var(--glow)}
.theme-card .preview{height:50px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
.theme-card .preview.kosmos{background:radial-gradient(circle at 30% 40%,#ff9028,#0a1a3a 60%,#02040a)}
.theme-card .preview.erde{background:radial-gradient(circle at 40% 40%,#4a8fd8,#1a4a8a 50%,#02040a)}
.theme-card .preview.holo{background:linear-gradient(135deg,#0a1a3a,#1a2a5a);box-shadow:inset 0 0 30px rgba(0,229,255,.3)}
.theme-card .name{font-size:10.5px;font-weight:800}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.speed-row input[type=range]{flex:1;accent-color:var(--p1)}

/* TOAST */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);padding:10px 18px;background:var(--bg-card);border:var(--border);border-radius:22px;font-size:12px;font-weight:700;color:var(--p1);z-index:500;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:90vw;box-shadow:var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:#22c55e;color:#4ade80}
#toast.err{border-color:#ef4444;color:#ff8080}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:12px;border:var(--border-soft);background:rgba(0,0,0,.3);color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.active{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.25));border-color:var(--p1);color:var(--text);box-shadow:var(--glow)}
.card{padding:14px;background:rgba(0,0,0,.2);border-radius:14px;border:var(--border-soft);margin-bottom:10px}
.card h3{font-size:12px;font-weight:900;color:var(--p1);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.btn{padding:11px 16px;border-radius:12px;border:none;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.15s;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;box-shadow:0 4px 15px rgba(0,229,255,.3)}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:rgba(0,229,255,.1);color:var(--p1);border:var(--border-soft);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn.full{width:100%}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;background:rgba(0,0,0,.3);border:var(--border-soft);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.placeholder{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:12px;line-height:1.6}
.placeholder .big{font-size:52px;margin-bottom:12px;opacity:.5}
</style>
</head>
<body>

<div id="bgLayer"><canvas id="bgCanvas"></canvas></div>

<header id="topbar">
  <div class="logo" id="logoBtn"><span class="peacock">🦚</span><div class="txt"><span class="t1">HalDo</span><span class="t2">AI OS v125</span></div></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="langBtn" title="Sprache">🌐</button>
  <button class="icon-btn" id="themeToggle" title="Hintergrund">🎨</button>
  <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙️</button>
</header>

<aside id="sidebar">
  <div class="group">Hauptmenü</div>
  <button class="item active" data-side="home"><span class="ico">🏠</span><span data-i18n="home">Home</span></button>
  <button class="item" data-side="apps"><span class="ico">📱</span><span data-i18n="apps">Alle Apps</span></button>
  <hr style="height:1px;background:var(--border-soft);margin:10px 6px;border:none">
  <div class="group">Apps</div>
  <button class="item" data-open-app="chat"><span class="ico">💬</span><span data-i18n="chat">Chat</span></button>
  <button class="item" data-open-app="uebersetzer"><span class="ico">🌐</span><span data-i18n="translator">Übersetzer</span></button>
  <button class="item" data-open-app="ezidi"><span class="ico">🦚</span><span>Ezidi</span></button>
  <button class="item" data-open-app="laender"><span class="ico">🌍</span><span data-i18n="countries">Länder</span></button>
  <button class="item" data-open-app="games"><span class="ico">🎮</span><span data-i18n="games">Games</span></button>
  <button class="item" data-open-app="finanzen"><span class="ico">💰</span><span data-i18n="finance">Finanzen</span></button>
  <button class="item" data-open-app="werkzeuge"><span class="ico">⏱️</span><span data-i18n="tools">Werkzeuge</span></button>
  <hr style="height:1px;background:var(--border-soft);margin:10px 6px;border:none">
  <div class="group">System</div>
  <button class="item" data-open-app="system"><span class="ico">⚙️</span><span data-i18n="system">System</span></button>
</aside>

<main id="desktop">
  <div id="homescreen">
    <div class="welcome">
      <div class="hello" id="greeting">Willkommen</div>
      <div class="name" id="userName">Bruder</div>
      <div class="sub" id="heroSub">Chat · Übersetzer · Ezidi · Länder · Games</div>
    </div>
    <div class="search-row"><input type="text" id="appSearch" placeholder="🔍 App suchen…"></div>
    <div id="appCategories"></div>
  </div>
</main>

<footer id="bottombar">
  <button class="bbtn" id="bbChat"><span class="ico">💬</span><span data-i18n="chat">Chat</span></button>

/* ────── ÜBERSETZER ────── */
MODULES.uebersetzer={
  render:function(el){
    var langs=["de","ku","ez","ar","tr","en"];
    var from="de", to="ez";
    function build(){
      el.innerHTML='<div class="card"><h3>🌐 Übersetzer</h3>'
        +'<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-bottom:12px">'
        +'<div class="field" style="margin:0"><label>Von</label><select id="trans_from">'+langs.map(function(l){return '<option value="'+l+'"'+(from===l?" selected":"")+'>'+LANGS[l].flag+' '+LANGS[l].name+'</option>';}).join("")+'</select></div>'
        +'<button class="btn sec" id="trans_swap" style="height:44px;padding:0 12px">⇄</button>'
        +'<div class="field" style="margin:0"><label>Nach</label><select id="trans_to">'+langs.map(function(l){return '<option value="'+l+'"'+(to===l?" selected":"")+'>'+LANGS[l].flag+' '+LANGS[l].name+'</option>';}).join("")+'</select></div>'
        +'</div>'
        +'<div class="field"><label>Text</label><textarea id="trans_in" placeholder="Text eingeben…" style="min-height:100px">'+esc(el._input||"")+'</textarea></div>'
        +'<button class="btn full" id="trans_go">🌐 Übersetzen</button>'
        +'<div id="trans_out" style="margin-top:12px;padding:14px;background:rgba(0,229,255,.08);border-radius:12px;border:1px dashed rgba(0,229,255,.4);min-height:70px;font-size:14px;line-height:1.5">'+(el._output?esc(el._output):'<span style="color:var(--text-mute);font-size:12px">Ergebnis erscheint hier…</span>')+'</div>'
        +'</div>'
        +'<div class="card"><h3>📚 Kernbegriffe</h3>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'
        +Object.keys(I18N_DATA).slice(0,12).map(function(w){
          var d=I18N_DATA[w];
          return '<div style="padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px;font-size:11px"><div style="color:var(--text-mute);font-weight:700">'+esc(d.de)+'</div><div style="color:var(--p1);font-weight:800;margin-top:3px">'+esc(d[to]||d.de)+'</div></div>';
        }).join("")
        +'</div></div>';
      el.querySelector("#trans_from").addEventListener("change",function(){from=this.value;build();});
      el.querySelector("#trans_to").addEventListener("change",function(){to=this.value;build();});
      el.querySelector("#trans_swap").addEventListener("click",function(){var t=from;from=to;to=t;build();});
      el.querySelector("#trans_in").addEventListener("input",function(){el._input=this.value;});
      el.querySelector("#trans_go").addEventListener("click",function(){
        var txt=(el.querySelector("#trans_in").value||"").trim().toLowerCase();
        if(!txt){toast("⚠️ Text fehlt","err");return;}
        var result="";
        /* Erst Datenbank suchen */
        for(var k in I18N_DATA){
          if(k===txt || I18N_DATA[k].de===txt){
            result=I18N_DATA[k][to]||I18N_DATA[k].de;
            break;
          }
        }
        if(!result){
          /* Einzelwörter ersetzen */
          var words=txt.split(/\s+/);
          result=words.map(function(w){
            for(var k2 in I18N_DATA){
              if(k2===w || I18N_DATA[k2].de===w) return I18N_DATA[k2][to]||w;
            }
            return w;
          }).join(" ");
        }
        el._output=result;
        build();
        toast("✅ Übersetzt","ok");
      });
    }
    build();
  }
};

      el.innerHTML='<div class="tabs">'

MODULES.games={
  render:function(el){

      else buildMemory();
      el.querySelectorAll("[data-g]").forEach(function(b){
        b.addEventListener("click",function(){tab=b.dataset.g;build();});
      });
    }
    function tabsHtml(){return '<div class="tabs">'
      +'<button class="tab'+(tab==="ttt"?" active":"")+'" data-g="ttt">🎯 TicTacToe</button>'
      +'<button class="tab'+(tab==="snake"?" active":"")+'" data-g="snake">🐍 Snake</button>'
      +'<button class="tab'+(tab==="memory"?" active":"")+'" data-g="memory">🧩 Memory</button>'
      +'</div>';}
    function buildTTT(){
      el.innerHTML=tabsHtml()+'<div id="tttBody"></div>';
      var board=["","","","","","","","",""];
      var player="X",over=false;
      function draw(){
        var body=el.querySelector("#tttBody");
        body.innerHTML='<div style="text-align:center;margin-bottom:12px;font-size:14px;font-weight:800;color:var(--p1)">'+(over?"Beendet":"Spieler "+player+" ist dran")+'</div>'
          +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto">'
          +board.map(function(v,i){
            return '<button data-ttt="'+i+'" style="aspect-ratio:1;background:rgba(0,0,0,.3);border:1px solid rgba(0,229,255,.3);border-radius:12px;font-size:36px;font-weight:900;color:'+(v==="X"?"#ff8080":"#4ade80")+';cursor:pointer;font-family:inherit">'+(v||"")+'</button>';
          }).join("")+'</div>'
          +'<button class="btn full" id="ttt_reset" style="margin-top:14px;max-width:280px;display:block;margin-left:auto;margin-right:auto">🔄 Neu</button>';
        body.querySelectorAll("[data-ttt]").forEach(function(b){
          b.addEventListener("click",function(){play(parseInt(b.dataset.ttt));});
        });
        body.querySelector("#ttt_reset").addEventListener("click",function(){
          board=["","","","","","","","",""];player="X";over=false;draw();
        });
      }
      function check(){
        var w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(var i=0;i<w.length;i++){var x=w[i];if(board[x[0]]&&board[x[0]]===board[x[1]]&&board[x[1]]===board[x[2]])return board[x[0]];}
        return board.indexOf("")<0?"D":null;
      }
      function play(i){
        if(over||board[i])return;
        board[i]=player;
        var r=check();
        if(r){over=true;toast(r==="D"?"🤝 Unentschieden":"🎉 "+r+" gewinnt!",r==="D"?"":"ok");}
        else{player=player==="X"?"O":"X";}
        draw();
      }
      draw();
    }
    function buildSnake(){
      el.innerHTML=tabsHtml()+'<div style="text-align:center;padding:40px;color:var(--text-dim)">🐍 Snake kommt in einer späteren Runde</div>';
    }
    function buildMemory(){
      el.innerHTML=tabsHtml()+'<div style="text-align:center;padding:40px;color:var(--text-dim)">🧩 Memory kommt in einer späteren Runde</div>';
    }
    build();
  }
};

          +'</div>';

var Settings={
  _cache:null,
  defaults:{theme:"kosmos",cyborg:false,lang:"de",userName:"Bruder",speed:3},
  load:function(){this._cache=Object.assign({},this.defaults,Storage.get("settings",{}));return this._cache;},
  get:function(k){if(!this._cache)this.load();return this._cache[k];},
  set:function(k,v){if(!this._cache)this.load();this._cache[k]=v;Storage.set("settings",this._cache);this.apply();},
  apply:function(){
    var s=this._cache;
    document.body.classList.toggle("cyborg",!!s.cyborg);
    document.body.setAttribute("dir",(LANGS[s.lang]&&LANGS[s.lang].rtl)?"rtl":"ltr");
    document.querySelectorAll("[data-theme]").forEach(function(t){t.classList.toggle("active",t.dataset.theme===s.theme);});
    var csw=$("cyborgSw");if(csw)csw.classList.toggle("on",!!s.cyborg);
    var ls=$("langSel");if(ls)ls.value=s.lang;
    var ll=$("langLbl");if(ll&&LANGS[s.lang])ll.textContent=LANGS[s.lang].flag+" "+LANGS[s.lang].name;
    var un=$("userName");if(un)un.textContent=s.userName;
    var gs=$("globalSpeed");if(gs)gs.value=s.speed||3;
    /* Übersetzungen anwenden */
    var t=LANGS[s.lang]?LANGS[s.lang].t:{};
    document.querySelectorAll("[data-i18n]").forEach(function(e){
      var key=e.dataset.i18n;
      if(t[key])e.textContent=t[key];
    });
    if(window.BG)BG.setTheme(s.theme,s.speed||3);
  }
};

/* ═══════════════ BACKGROUND — LANGSAM ═══════════════ */
var BG=(function(){
  var canvas,ctx,w,h,animId;
  var theme="kosmos";
  var speedFactor=0.15;
  var planets=[
    {d:100,speed:0.15,size:4,color:"#a87c5a"},{d:140,speed:0.11,size:6,color:"#e8c888"},
    {d:180,speed:0.09,size:7,color:"#4a8fd8"},{d:220,speed:0.075,size:6,color:"#c1440e"},
    {d:280,speed:0.055,size:12,color:"#c88b4a"},{d:340,speed:0.042,size:10,color:"#d8b478"},
    {d:400,speed:0.032,size:9,color:"#78c8d8"},{d:460,speed:0.025,size:9,color:"#4a7cc8"},
    {d:520,speed:0.02,size:4,color:"#b8b8b8"},{d:580,speed:0.015,size:11,color:"#7c5aff"},
    {d:640,speed:0.012,size:8,color:"#ff78c8"},{d:700,speed:0.01,size:6,color:"#78ffc8"}
  ];
  var angles=planets.map(function(_,i){return i*0.5;});
  var t=0;
  var stars=[];
  function initStars(){
    stars=[];
    for(var i=0;i<140;i++)stars.push({x:Math.random(),y:Math.random(),size:Math.random()*1.5+0.3,tw:Math.random()*Math.PI*2});
  }
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  function drawKosmos(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],alpha=0.4+Math.sin(t*0.02+s.tw)*0.4;
      ctx.fillStyle="rgba(180,220,255,"+alpha+")";
      ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();
    }
    var cx=w/2,cy=h/2;
    var scale=Math.min(1.4,Math.max(0.6,Math.min(w,h)/900));
    var sunGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,80*scale);
    sunGrad.addColorStop(0,"#fff5d0");sunGrad.addColorStop(0.3,"#ffc050");
    sunGrad.addColorStop(0.7,"rgba(255,140,40,.4)");sunGrad.addColorStop(1,"transparent");
    ctx.fillStyle=sunGrad;ctx.beginPath();ctx.arc(cx,cy,80*scale,0,Math.PI*2);ctx.fill();
    for(var p=0;p<planets.length;p++){
      var pl=planets[p],orbitR=pl.d*scale;
      var px=cx+Math.cos(angles[p])*orbitR,py=cy+Math.sin(angles[p])*orbitR;
      ctx.strokeStyle="rgba(0,229,255,.06)";ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cx,cy,orbitR,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=pl.color;ctx.shadowBlur=14;ctx.shadowColor=pl.color;
      ctx.beginPath();ctx.arc(px,py,pl.size*scale*0.8,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      angles[p]+=pl.speed*speedFactor*0.01;
    }
    t+=1;
  }
  function drawErde(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      ctx.fillStyle="rgba(180,220,255,.5)";
      ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();
    }
    var cx=w/2,cy=h/2,R=Math.min(w,h)*0.35;
    var atm=ctx.createRadialGradient(cx,cy,R*0.8,cx,cy,R*1.3);
    atm.addColorStop(0,"rgba(100,180,255,.4)");atm.addColorStop(1,"transparent");
    ctx.fillStyle=atm;ctx.beginPath();ctx.arc(cx,cy,R*1.3,0,Math.PI*2);ctx.fill();
    var globe=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
    globe.addColorStop(0,"#6fa8dc");globe.addColorStop(0.5,"#2c5f8a");globe.addColorStop(1,"#0a2540");
    ctx.fillStyle=globe;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    var rot=t*0.0008*speedFactor;
    for(var k=0;k<6;k++){
      var ang=k*(Math.PI*2/6)+rot,dx=Math.cos(ang);
      if(dx<-0.2)continue;
      var px=cx+Math.sin(ang)*R*0.7,py=cy+(Math.sin(k*1.7)*0.3)*R,size=R*0.15;
      ctx.fillStyle="rgba(60,120,60,.7)";
      ctx.beginPath();ctx.ellipse(px,py,size,size*0.7,0,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle="rgba(100,180,255,.6)";ctx.lineWidth=2;ctx.shadowBlur=30;ctx.shadowColor="#4da8ff";
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    t+=1;
  }
  function drawHolo(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],alpha=0.3+Math.sin(t*0.03+i)*0.3;
      ctx.fillStyle="rgba(0,229,255,"+alpha+")";
      ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size*0.7,0,Math.PI*2);ctx.fill();
    }
    t+=1;
  }
  function loop(){
    if(theme==="kosmos")drawKosmos();
    else if(theme==="erde")drawErde();
    else drawHolo();
    animId=requestAnimationFrame(loop);
  }
  return{
    init:function(){canvas=$("bgCanvas");ctx=canvas.getContext("2d");resize();initStars();
      window.addEventListener("resize",resize);if(animId)cancelAnimationFrame(animId);loop();},
    setTheme:function(th,spd){theme=th;speedFactor=0.02+((spd||3)-1)*0.06;}
  };
})();

    $("bbChat").style.opacity="1";
  },
  addBot:function(t){
    this.history.push({r:"bot",t:t});
    this.render();
  },
  addUser:function(t){
    this.history.push({r:"user",t:t});
    this.render();
  },
  render:function(){
    var el=$("chatBody");if(!el)return;
    el.innerHTML=this.history.map(function(m){
      return '<div class="msg '+(m.r==="user"?"user":"bot")+'">'+esc(m.t)+'</div>';
    }).join("");
    setTimeout(function(){el.scrollTop=el.scrollHeight;},50);
  },
  respond:function(msg){
    var q=msg.toLowerCase().trim();
    var self=this;
    /* Suche direkte Antwort */
    for(var k in this.responses){
      if(q.indexOf(k)>=0){return this.responses[k];}
    }
    /* Suche nach Übersetzung */
    if(q.startsWith("übersetze ") || q.startsWith("translate ")){
      var word=q.replace(/^(übersetze|translate)\s+/,"").replace(/[?.!]/g,"");
      for(var k2 in I18N_DATA){
        if(k2===word || I18N_DATA[k2].de===word){
          return word+" auf Ezidi ist: 🦚 "+I18N_DATA[k2].ez+"\nAuf Kurdisch: 🟨 "+I18N_DATA[k2].ku;
        }
      }
      return "Das Wort kenne ich noch nicht. Schreib mir: \"übersetze wasser\" und ich zeige die Übersetzung.";
    }
    /* Standard */
    var defaults=[
      "Interessant, Bruder! 🦚 Erzähl mir mehr.",
      "Das ist eine gute Frage. Was genau möchtest du wissen?",
      "Ich verstehe. Willst du mehr über Ezidi, Länder oder Übersetzung wissen?",
      "Klick mich auf einen anderen Tab — da gibt's noch mehr zu entdecken! 💙",
      "Hmm, darüber weiß ich noch nicht viel. Aber ich lerne jeden Tag dazu! 🚀"
    ];
    return defaults[Math.floor(Math.random()*defaults.length)];
  },
  send:function(text){
    var t=(text||$("chatInput").value||"").trim();
    if(!t)return;
    $("chatInput").value="";
    $("chatInput").style.height="44px";
    this.addUser(t);
    var self=this;
    $("chatStatus").textContent="Schreibt…";
    setTimeout(function(){
      var reply=self.respond(t);
      self.addBot(reply);
      $("chatStatus").textContent="Bereit zum Chatten";
    },400);
  }
};

/* ═══════════════ WINDOWS ═══════════════ */
var Windows={
  zIndexBase:100,
  openCount:0,
  open:function(appId){
    var app=APPS.find(function(a){return a.id===appId;});
    if(!app)return;
    var existing=document.querySelector('.window[data-app="'+appId+'"]');
    if(existing){this.focus(existing);return;}
    var win=document.createElement("div");
    win.className="window focused";
    win.dataset.app=appId;
    var ww=Math.min(window.innerWidth-40,500),wh=Math.min(window.innerHeight-160,600);
    /* Mittig mit leichtem Versatz */
    var offsetX=(this.openCount%5)*20;
    var offsetY=(this.openCount%5)*20;
    var cx=Math.max(20,(window.innerWidth-ww)/2+offsetX-40);
    var cy=Math.max(70,(window.innerHeight-wh)/2+offsetY-40);
    win.style.width=ww+"px";
    win.style.height=wh+"px";
    win.style.left=cx+"px";
    win.style.top=cy+"px";
    win.style.zIndex=++this.zIndexBase;
    this.openCount++;
    win.innerHTML='<div class="titlebar"><span class="ico">'+app.ico+'</span><span class="title">'+esc(app.name)+'</span>'
      +'<div class="wbtns">'
      +'<button class="wbtn set" data-wbtn="settings" title="Einstellungen">⚙️</button>'
      +'<button class="wbtn" data-wbtn="min" title="Minimieren">—</button>'
      +'<button class="wbtn close" data-wbtn="close" title="Schließen">✕</button>'
      +'</div></div>'
      +'<div class="wbody"></div><div class="resizer"></div>';
    $("desktop").appendChild(win);
    var body=win.querySelector(".wbody");
    try{getModule(appId).render(body,app);}catch(e){body.innerHTML='<div class="placeholder">❌ '+esc(e.message)+'</div>';}
    this.bindWindow(win);
    AppSettings.applyToWindow(appId);
    return win;
  },
  bindWindow:function(win){
    var self=this;
    win.addEventListener("mousedown",function(){self.focus(win);});
    win.addEventListener("touchstart",function(){self.focus(win);},{passive:true});
    win.querySelectorAll("[data-wbtn]").forEach(function(b){
      b.addEventListener("click",function(e){
        e.stopPropagation();
        var a=b.dataset.wbtn;
        if(a==="close")self.close(win);
        else if(a==="min")self.minimize(win);
        else if(a==="settings")AppSettings.open(win.dataset.app);
      });
    });
    var tb=win.querySelector(".titlebar");
    var dragging=false,sx=0,sy=0,ox=0,oy=0;
    function startDrag(e){
      if(e.target.closest(".wbtn"))return;
      dragging=true;
      var p=e.touches?e.touches[0]:e;
      sx=p.clientX;sy=p.clientY;
      var rect=win.getBoundingClientRect();
      ox=rect.left;oy=rect.top;
      win.style.left=ox+"px";win.style.top=oy+"px";
      win.style.right="auto";win.style.bottom="auto";
      self.focus(win);
      e.preventDefault();
    }
    function moveDrag(e){
      if(!dragging)return;
      var p=e.touches?e.touches[0]:e;
      var dx=p.clientX-sx,dy=p.clientY-sy;
      win.style.left=Math.max(0,Math.min(window.innerWidth-100,ox+dx))+"px";
      win.style.top=Math.max(56,Math.min(window.innerHeight-100,oy+dy))+"px";
    }
    function endDrag(){dragging=false;}
    tb.addEventListener("mousedown",startDrag);
    tb.addEventListener("touchstart",startDrag,{passive:false});
    document.addEventListener("mousemove",moveDrag);
    document.addEventListener("touchmove",moveDrag,{passive:false});
    document.addEventListener("mouseup",endDrag);
    document.addEventListener("touchend",endDrag);
    var rs=win.querySelector(".resizer");
    var resizing=false,rsx=0,rsy=0,rw=0,rh=0;
    function startResize(e){
      resizing=true;
      var p=e.touches?e.touches[0]:e;
      rsx=p.clientX;rsy=p.clientY;
      rw=win.offsetWidth;rh=win.offsetHeight;
      e.preventDefault();
    }
    function moveResize(e){
      if(!resizing)return;
      var p=e.touches?e.touches[0]:e;
      win.style.width=Math.max(300,rw+(p.clientX-rsx))+"px";
      win.style.height=Math.max(260,rh+(p.clientY-rsy))+"px";
    }
    function endResize(){resizing=false;}
    rs.addEventListener("mousedown",startResize);
    rs.addEventListener("touchstart",startResize,{passive:false});
    document.addEventListener("mousemove",moveResize);
    document.addEventListener("touchmove",moveResize,{passive:false});
    document.addEventListener("mouseup",endResize);
    document.addEventListener("touchend",endResize);
  },
  focus:function(win){
    document.querySelectorAll(".window").forEach(function(w){w.classList.remove("focused");});
    win.classList.add("focused");
    win.classList.remove("minimized");
    win.style.zIndex=++this.zIndexBase;
  },
  minimize:function(win){win.classList.add("minimized");},
  close:function(win){win.remove();}
};

/* ═══════════════ APP SETTINGS ═══════════════ */
var AppSettings={
  currentApp:null,
  defaults:{color:"global"},
  get:function(appId){return Object.assign({},this.defaults,Storage.get("appset_"+appId,{}));},
  save:function(appId,s){Storage.set("appset_"+appId,s);},
  open:function(appId){
    this.currentApp=appId;
    var app=APPS.find(function(a){return a.id===appId;});
    if(!app)return;
    var s=this.get(appId);
    $("appSetIco").textContent=app.ico;
    $("appSetTitle").textContent=app.name;
    var colors=[
      {k:"global",n:"Global",g:"linear-gradient(135deg,#00e5ff,#4da8ff)"},
      {k:"cyan",n:"Cyan",g:"linear-gradient(135deg,#00e5ff,#4da8ff)"},
      {k:"cyborg",n:"Cyborg",g:"linear-gradient(135deg,#ff78c8,#b478ff)"},
      {k:"green",n:"Grün",g:"linear-gradient(135deg,#22c55e,#10b981)"},
      {k:"orange",n:"Orange",g:"linear-gradient(135deg,#f59e0b,#ef4444)"},
      {k:"purple",n:"Lila",g:"linear-gradient(135deg,#8b5cf6,#a855f7)"},
      {k:"pink",n:"Rosa",g:"linear-gradient(135deg,#ec4899,#f43f5e)"},
      {k:"dark",n:"Dark",g:"linear-gradient(135deg,#4a4a4a,#1a1a1a)"}
    ];
    $("appSetBody").innerHTML='<div class="group"><h3>🎨 App-Farbe</h3>'
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'
      +colors.map(function(c){
        return '<div data-color="'+c.k+'" style="padding:12px 6px;background:rgba(0,0,0,.25);border-radius:10px;border:2px solid '+(s.color===c.k?"#fff":"transparent")+';cursor:pointer;text-align:center;font-size:10px;font-weight:800;box-shadow:0 0 12px '+(s.color===c.k?"currentColor":"transparent")+'">'
          +'<div style="height:24px;border-radius:6px;background:'+c.g+';margin-bottom:5px"></div>'+c.n+'</div>';
      }).join("")
      +'</div></div>'
      +'<button class="btn full" id="as_save">💾 Speichern</button>'
      +'<button class="btn sec full" id="as_reset" style="margin-top:6px">🔄 Zurücksetzen</button>';
    $("appSetBody").querySelectorAll("[data-color]").forEach(function(b){
      b.addEventListener("click",function(){
        s.color=b.dataset.color;
        $("appSetBody").querySelectorAll("[data-color]").forEach(function(x){
          x.style.borderColor=x===b?"#fff":"transparent";
          x.style.boxShadow=x===b?"0 0 12px currentColor":"none";
        });
      });
    });
    $("appSetBody").querySelector("#as_save").addEventListener("click",function(){
      AppSettings.save(appId,s);
      AppSettings.applyToWindow(appId);
      toast("💾 Gespeichert","ok");
      AppSettings.close();
    });
    $("appSetBody").querySelector("#as_reset").addEventListener("click",function(){
      AppSettings.save(appId,AppSettings.defaults);
      AppSettings.applyToWindow(appId);
      AppSettings.close();
    });
    $("appSettings").classList.add("show");
  },
  close:function(){$("appSettings").classList.remove("show");this.currentApp=null;},
  applyToWindow:function(appId){
    var win=document.querySelector('.window[data-app="'+appId+'"]');
    if(!win)return;
    var s=this.get(appId);
    var map={
      cyan:["#00e5ff","#4da8ff"],cyborg:["#ff78c8","#b478ff"],green:["#22c55e","#10b981"],
      orange:["#f59e0b","#ef4444"],purple:["#8b5cf6","#a855f7"],pink:["#ec4899","#f43f5e"],dark:["#4a4a4a","#1a1a1a"]
    };
    if(s.color&&s.color!=="global"&&map[s.color]){
      var c=map[s.color];
      win.style.setProperty("--p1",c[0]);
      win.style.setProperty("--p2",c[1]);
    }else{
      win.style.removeProperty("--p1");
      win.style.removeProperty("--p2");
    }
  }
};

/* ═══════════════ HOMESCREEN ═══════════════ */
function renderApps(filter,search){
  var c=$("appCategories");if(!c)return;
  var list=APPS.slice();
  if(search){
    var q=search.toLowerCase();
    list=list.filter(function(a){return a.name.toLowerCase().indexOf(q)>=0||a.cat.toLowerCase().indexOf(q)>=0||a.desc.toLowerCase().indexOf(q)>=0;});
  }
  if(!list.length){c.innerHTML='<div class="placeholder">Keine Apps gefunden.</div>';return;}
  var byCat={};
  list.forEach(function(a){if(!byCat[a.cat])byCat[a.cat]=[];byCat[a.cat].push(a);});
  var cats=Object.keys(byCat).sort();
  c.innerHTML=cats.map(function(cat){
    var apps=byCat[cat];
    return '<div class="cat-section"><div class="cat-title">'+esc(cat)+'<span class="count">'+apps.length+'</span></div>'
      +'<div class="app-grid">'+apps.map(function(a){
        return '<div class="tile" data-open-app="'+a.id+'"><span class="ico">'+a.ico+'</span><span class="name">'+esc(a.name)+'</span><span class="cat">'+esc(a.cat)+'</span></div>';
      }).join("")+'</div></div>';
  }).join("");
}

/* ═══════════════ INIT ═══════════════ */
function boot(){
  Settings.load();
  Settings.apply();
  BG.init();
  BG.setTheme(Settings.get("theme"),Settings.get("speed"));
  renderApps();

  var h=new Date().getHours();
  $("greeting").textContent=h<6?"Gute Nacht":h<11?"Guten Morgen":h<17?"Guten Tag":h<22?"Guten Abend":"Gute Nacht";

  $("logoBtn").addEventListener("click",function(){$("sidebar").classList.toggle("open");});
  $("settingsBtn").addEventListener("click",function(){$("settings").classList.add("show");});
  $("settingsClose").addEventListener("click",function(){$("settings").classList.remove("show");});
  $("settings").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show");});
  $("themeToggle").addEventListener("click",function(){
    var o=["kosmos","erde","holo"];
    var cur=Settings.get("theme");
    var n=o[(o.indexOf(cur)+1)%o.length];
    Settings.set("theme",n);
    toast("🎨 "+(n==="kosmos"?"Kosmos":n==="erde"?"Erde":"Holo"),"ok");
  });
  $("langBtn").addEventListener("click",function(){$("settings").classList.add("show");});

  document.querySelectorAll("[data-side]").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll("[data-side]").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      $("appSearch").value="";
      renderApps();
      if(window.innerWidth<700)$("sidebar").classList.remove("open");
    });
  });

  document.addEventListener("click",function(e){
    var el=e.target.closest("[data-open-app]");
    if(el){
      Windows.open(el.dataset.openApp);
      if(window.innerWidth<700)$("sidebar").classList.remove("open");
    }
  });

  $("appSearch").addEventListener("input",function(){renderApps("all",this.value);});
  document.querySelectorAll("[data-theme]").forEach(function(el){
    el.addEventListener("click",function(){Settings.set("theme",el.dataset.theme);toast("🎨 "+el.dataset.theme,"ok");});
  });
  $("cyborgSw").addEventListener("click",function(){
    Settings.set("cyborg",!Settings.get("cyborg"));
    toast(Settings.get("cyborg")?"⚡ CYBORG aktiv":"🤖 AI aktiv","ok");
  });
  $("langSel").addEventListener("change",function(){Settings.set("lang",this.value);toast("🌐 "+LANGS[this.value].name,"ok");});
  $("globalSpeed").addEventListener("input",function(){Settings.set("speed",parseInt(this.value)||3);});
  $("bbChat").addEventListener("click",function(){Chat.open();});
  $("bbAI").addEventListener("click",function(){Windows.open("chat");Chat.open();});
  $("bbCyborg").addEventListener("click",function(){Settings.set("cyborg",!Settings.get("cyborg"));});
  $("appSetClose").addEventListener("click",function(){AppSettings.close();});
  $("appSettings").addEventListener("click",function(e){if(e.target===this)AppSettings.close();});

  /* CHAT */
  $("chatClose").addEventListener("click",function(){Chat.close();});
  $("chatSend").addEventListener("click",function(){Chat.send();});
  $("chatInput").addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();Chat.send();}
  });
  $("chatInput").addEventListener("input",function(){
    this.style.height="44px";
    this.style.height=Math.min(120,this.scrollHeight)+"px";
  });
  $("chatMic").addEventListener("click",function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast("⚠️ Spracherkennung n/a","err");return;}
    var rec=new SR();
    rec.lang=Settings.get("lang")==="de"?"de-DE":"tr-TR";
    var self=this;self.classList.add("on");
    rec.onresult=function(e){Chat.send(e.results[0][0].transcript);};
    rec.onend=function(){self.classList.remove("on");};
    rec.onerror=function(){self.classList.remove("on");};
    rec.start();
  });
  document.querySelectorAll("[data-quick]").forEach(function(b){
    b.addEventListener("click",function(){Chat.send(b.dataset.quick);});
  });

  $("exportBtn").addEventListener("click",function(){
    var data={};Storage.keys().forEach(function(k){data[k]=Storage.get(k);});
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="haldo_backup.json";a.click();
  });
  $("resetBtn").addEventListener("click",function(){
    if(!confirm("Wirklich ALLES zurücksetzen?"))return;
    Storage.clearAll();location.reload();
  });

  window.HalDo={Storage:Storage,Settings:Settings,Windows:Windows,AppSettings:AppSettings,APPS:APPS,MODULES:MODULES,Chat:Chat,LANGS:LANGS,I18N_DATA:I18N_DATA,EZIDI_ALPHABET:EZIDI_ALPHABET,toast:toast,version:"v125"};
  console.log("🦚 HalDo AI OS v125 gestartet");
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();

})();
</script>
