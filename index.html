<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:var(--font);color:var(--text);font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ===== 3D BACKGROUND (COSMOS) ===== */
#cosmos-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}

/* ===== CENTER 3D MODEL (CYBORG) ===== */
#cyborg-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}

/* ===== WELCOME ===== */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9998;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,0.4);backdrop-filter:blur(2px)}
#welcome h1{font-size:clamp(32px,5.5vw,64px);font-weight:900;letter-spacing:4px;animation:fadeUp 1s ease-out;
  background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(251,191,36,.8),0 0 60px rgba(245,158,11,.5);
}
#welcome h2{font-size:clamp(16px,2vw,22px);color:#e5e7eb;font-weight:400;line-height:1.6;animation:fadeUp 1s ease-out .2s both;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;animation:fadeUp 1s ease-out .4s both;text-shadow:0 2px 10px rgba(0,0,0,.9)}
#welcome .presented b{color:#fbbf24;font-weight:700}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s;animation:fadeUp 1s ease-out .6s both}
#welcome .enter-btn:hover{transform:scale(1.05);box-shadow:0 0 60px rgba(6,182,212,.9)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ===== FLOATING DRAGGABLE MENU ===== */
#floating-menu{position:fixed;top:20px;left:20px;z-index:100;display:flex;flex-direction:column;gap:10px;cursor:grab}
#floating-menu:active{cursor:grabbing}
.menu-btn{background:rgba(17,24,39,.95);border:1px solid var(--accent);border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 20px rgba(6,182,212,.4);transition:transform .2s;pointer-events:auto}
.menu-btn:hover{transform:scale(1.1)}
#main-sidebar{background:rgba(17,24,39,.95);border:1px solid var(--border);border-radius:12px;width:280px;max-height:80vh;display:none;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px);pointer-events:auto}
#main-sidebar.show{display:flex}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);font-weight:700;color:var(--accent);display:flex;align-items:center;gap:10px}
.sidebar-content{flex:1;overflow-y:auto;padding:10px}
.nav-category{font-size:11px;text-transform:uppercase;color:var(--dim);margin:14px 0 6px 10px;font-weight:700;letter-spacing:1px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;transition:all .2s;color:var(--text);width:100%;text-align:left;pointer-events:auto}
.nav-btn:hover{background:var(--bg3);color:var(--accent)}
.nav-btn .icon{font-size:18px;width:24px;text-align:center}

/* ===== APP CONTENT OVERLAY ===== */
#app-content{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:800px;z-index:50;background:rgba(10,14,26,.95);backdrop-filter:blur(15px);border-left:1px solid var(--border);display:none;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .3s ease}
#app-content.show{display:flex;transform:translateX(0)}
.app-header{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.app-header h2{font-size:18px;color:var(--accent);display:flex;align-items:center;gap:10px}
.close-btn{background:var(--bg3);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s}
.close-btn:hover{background:var(--danger)}
.app-body{flex:1;overflow-y:auto;padding:24px}

/* ===== SPLASH ===== */
#app-splash{position:fixed;inset:0;z-index:9997;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%, rgba(6,182,212,.2) 0%, rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px)}
#app-splash.show{display:flex;animation:splashIn .3s ease-out}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);animation:starGlow 1.2s ease-out}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.splash-presented{font-size:12px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-top:10px}
.splash-presented b{color:#fbbf24}
@keyframes splashIn{from{opacity:0}to{opacity:1}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg)}50%{transform:scale(1.2) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}

/* ===== PANELS & UI ===== */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:12px;color:var(--accent)}
.panel .desc{color:var(--dim);font-size:13px;margin-bottom:12px}
.btn{padding:10px 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:13px;transition:all .2s}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--bg3);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.list-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .2s}

<script>
/* ================= KOSMOS 3D (HINTERGRUND) ================= */
function initCosmos() {
  const canvas = document.getElementById('cosmos-canvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 0, 15);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Sterne
  const starGeo = new THREE.BufferGeometry();
  const starCount = 3000;
  const posArray = new Float32Array(starCount * 3);
  for(let i=0; i<starCount*3; i++) posArray[i] = (Math.random() - 0.5) * 200;
  starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 }));
  scene.add(stars);

  // Sonne (Realistischer Glow)
  const sunGeo = new THREE.SphereGeometry(2.5, 64, 64);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  sun.position.set(12, 8, -15);
  scene.add(sun);
  
  const createGlow = (color) => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.2, `rgba(${color[0]},${color[1]},${color[2]},1)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  };
  const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: createGlow([255,200,0]), transparent: true, blending: THREE.AdditiveBlending }));
  sunGlow.scale.set(20, 20, 1);
  sunGlow.position.copy(sun.position);
  scene.add(sunGlow);

  // Mond
  const moonGeo = new THREE.SphereGeometry(1.2, 64, 64);
  const moonTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
  const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1 });
  const moon = new THREE.Mesh(moonGeo, moonMat);
  moon.position.set(-10, 6, -8);
  scene.add(moon);

  // Erde (Kleiner & komplett sichtbar)
  const earthGeo = new THREE.SphereGeometry(4.5, 64, 64);
  const earthTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
  const earthMat = new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.8 });
  const earth = new THREE.Mesh(earthGeo, earthMat);
  earth.position.set(0, -4, 0);
  scene.add(earth);

  // Atmosphäre
  const atmGeo = new THREE.SphereGeometry(4.65, 64, 64);
  const atmMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.15, side: THREE.BackSide });
  const atm = new THREE.Mesh(atmGeo, atmMat);
  atm.position.copy(earth.position);
  scene.add(atm);

  // Drehender Ring um die Erde
  const ringGeo = new THREE.TorusGeometry(5.5, 0.05, 16, 100);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.copy(earth.position);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);

  // Licht
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));
  const sunLight = new THREE.DirectionalLight(0xfff8e1, 2);
  sunLight.position.copy(sun.position);
  scene.add(sunLight);

  function animate() {
    requestAnimationFrame(animate);
    earth.rotation.y += 0.001;
    moon.rotation.y += 0.002;
    ring.rotation.z += 0.005;
    stars.rotation.y += 0.0001;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}
initCosmos();

/* ================= 3D MENSCH (CYBORG/ANATOMY) ================= */
let A = {scene:null, cam:null, ren:null, ctrl:null, current:null, init:false};
function initCyborg() {
  const canvas = document.getElementById('cyborg-canvas');
  A.scene = new THREE.Scene();
  A.cam = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  A.cam.position.set(0, 1.2, 4);
  
  A.ren = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  A.ren.setSize(window.innerWidth, window.innerHeight);
  A.ren.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  A.ren.setClearColor(0x000000, 0);
  
  A.ctrl = new THREE.OrbitControls(A.cam, A.ren.domElement);
  A.ctrl.enableDamping = true;
  A.ctrl.enablePan = false;
  A.ctrl.enableZoom = true;
  A.ctrl.minDistance = 2;
  A.ctrl.maxDistance = 8;

  A.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(3, 4, 5); A.scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x06b6d4, 1.0); d2.position.set(-3, 2, -5); A.scene.add(d2);
  const d3 = new THREE.DirectionalLight(0x3b82f6, 0.8); d3.position.set(0, -5, 0); A.scene.add(d3);

  const loader = new THREE.GLTFLoader();
  const status = document.createElement('div');
  status.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#06b6d4;font-size:14px;z-index:10;background:rgba(0,0,0,.8);padding:10px 20px;border-radius:20px;display:none;';
  status.id = 'cyborg-status';
  status.textContent = 'Lade 3D-Modell...';
  document.body.appendChild(status);
  status.style.display = 'block';

  loader.load('./male_base.glb', (gltf) => {
    const m = gltf.scene;
    m.traverse(o => { if(o.isMesh && o.material) o.material.side = THREE.DoubleSide; });
    A.scene.add(m);
    A.current = m;
    
    // Kamera perfekt auf den gesamten Körper anpassen
    const box = new THREE.Box3().setFromObject(m);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    
    m.position.x = -center.x;
    m.position.y = -box.min.y;
    m.position.z = -center.z;
    
    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = A.cam.fov * (Math.PI / 180);
    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
    
    A.cam.position.set(0, size.y / 2, cameraZ);
    A.ctrl.target.set(0, size.y / 2, 0);
    A.ctrl.update();
    
    status.textContent = '✅ 3D-Cyborg geladen.';
    setTimeout(() => status.style.display = 'none', 2000);
  }, undefined, (err) => {
    status.textContent = '⚠️ male_base.glb nicht gefunden. (Bitte Datei prüfen)';
    status.style.color = '#ef4444';
  });

  (function loop() {
    requestAnimationFrame(loop);
    A.ctrl.update();
    A.ren.render(A.scene, A.cam);
  })();

  window.addEventListener('resize', () => {
    A.cam.aspect = window.innerWidth / window.innerHeight;
    A.cam.updateProjectionMatrix();
    A.ren.setSize(window.innerWidth, window.innerHeight);
  });
}
initCyborg();

/* ================= TÖNE & SPLASH ================= */
let audioCtx = null;
function playTone(type) {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    
    // Glasklarer Glockenton (Glass Chime)
    const patterns = {
      glass: [{f:1760,t:'sine',d:0.4},{f:2637,t:'sine',d:0.4}],
      chime: [{f:880,t:'sine',d:0.3},{f:1320,t:'sine',d:0.3}],
      epic: [{f:440,t:'triangle',d:0.5},{f:554,t:'triangle',d:0.5},{f:659,t:'triangle',d:0.5}]
    };
    const notes = patterns[type] || patterns.glass;
    let t = 0;
    notes.forEach(n => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = n.f; o.type = n.t;
      const st = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.2, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + n.d);
      o.start(st); o.stop(st + n.d + 0.1);
      t += 0.1;
    });
  } catch(e) {}
}

function showAppSplash(icon, name) {
  const el = document.getElementById('app-splash');
  el.querySelector('.splash-icon').textContent = icon;
  el.querySelector('.splash-name').textContent = name;
  el.classList.add('show');
  playTone(localStorage.getItem('haldo_tone') || 'glass');
  setTimeout(() => el.classList.remove('show'), 1500);
}

function enterApp() {

function closeApp() {
  document.getElementById('app-content').classList.remove('show');
  setTimeout(() => { document.getElementById('app-content').style.display = 'none'; }, 300);
  document.getElementById('main-sidebar').classList.remove('show');
}

function openApp(id) {
  const app = ALL_APPS.find(a => a.id === id) || (id === 'settings' ? {ico:'⚙️', nm:'Einstellungen', fn:viewSettings} : null);
  if(!app) return;
  
  showAppSplash(app.ico, app.nm);
  
  const overlay = document.getElementById('app-content');
  const title = document.getElementById('app-title');
  const body = document.getElementById('app-body');
  
  title.innerHTML = `<span>${app.ico}</span> ${app.nm}`;
  body.innerHTML = '';
  overlay.style.display = 'flex';
  // Kurze Verzögerung für die Animation
  setTimeout(() => overlay.classList.add('show'), 50);
  
  document.getElementById('main-sidebar').classList.remove('show');
  
  // App-spezifische Logik rendern
  if(id === 'anatomy') {
    body.innerHTML = `
      <div class="panel" style="background:rgba(6,182,212,.1);border-color:var(--accent)">
        <h3>🦴 3D Anatomie</h3>
        <p class="desc">Das 3D-Modell wird im Hintergrund bereits angezeigt. Du kannst es mit der Maus drehen und zoomen.</p>
        <div class="btn-row"><button class="btn" onclick="resetCyborgCam()">🎯 Kamera zurücksetzen</button></div>
      </div>
    `;
  } else {
    app.fn(body);
  }
}

function resetCyborgCam() {
  if(A.current) {
    const box = new THREE.Box3().setFromObject(A.current);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = A.cam.fov * (Math.PI / 180);
    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;
    A.cam.position.set(0, size.y / 2, cameraZ);
    A.ctrl.target.set(0, size.y / 2, 0);
    A.ctrl.update();
  }
}

/* ================= DRAG & DROP MENÜ ================= */
let isDragging = false, dragStartX, dragStartY, menuStartX, menuStartY;
const menu = document.getElementById('floating-menu');

menu.addEventListener('mousedown', (e) => {
  if(e.target.closest('.menu-btn') && e.button === 0) {
    // Nur ziehen, wenn wir nicht auf den Button zum Öffnen klicken, sondern ihn bewegen
  }
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  const rect = menu.getBoundingClientRect();
  menuStartX = rect.left;
  menuStartY = rect.top;
});

window.addEventListener('mousemove', (e) => {
  if(!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  menu.style.left = `${menuStartX + dx}px`;
  menu.style.top = `${menuStartY + dy}px`;
});

window.addEventListener('mouseup', () => isDragging = false);

function aiSend(){
  const inp = document.getElementById('ai-input');
  const log = document.getElementById('chat-log');
  const q = inp.value.trim(); if(!q) return;
  log.insertAdjacentHTML('beforeend', `<div class="list-item" style="background:var(--accent);color:#fff">${q}</div>`);
  inp.value = '';
  setTimeout(() => {
    log.insertAdjacentHTML('beforeend', `<div class="list-item">Dazu habe ich noch keine gesicherte Kurzinfo. Bitte konsultiere für Diagnosen immer eine Ärztin oder einen Arzt.<div style="margin-top:8px;color:var(--accent);cursor:pointer;font-size:11px" onclick="speak('Dazu habe ich noch keine gesicherte Kurzinfo.')">🔊 Vorlesen</div></div>`);

  }, 300);
}

function speak(text){
  if(!('speechSynthesis' in window)) return alert('TTS nicht verfügbar.');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 1.0; u.pitch = 1.0;
  speechSynthesis.speak(u);
}
