<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS v126</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='82'%3E🦚%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#02040a;color:#dff6ff;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}

:root{
  --p1:#00e5ff;--p2:#4da8ff;--p3:#b478ff;
  --bg-panel:rgba(10,20,40,.72);--bg-card:rgba(15,25,50,.82);
  --border:1.5px solid rgba(0,229,255,.4);
  --border-soft:1px solid rgba(0,229,255,.18);
  --text:#dff6ff;--text-dim:#7a9bb8;--text-mute:#4a6b88;
  --radius:18px;--radius-sm:14px;
  --shadow:0 10px 40px rgba(0,229,255,.15);
  --glow:0 0 20px rgba(0,229,255,.5);
  --topbar-h:56px;
  --bottombar-h:66px;
}
body.cyborg{--p1:#ff78c8;--p2:#b478ff;--p3:#ff5cae;--border:1.5px solid rgba(255,120,200,.5);--border-soft:1px solid rgba(255,120,200,.2);--glow:0 0 20px rgba(255,120,200,.6)}
body.holo-off{--bg-panel:rgba(10,20,40,.92);--bg-card:rgba(15,25,50,.95)}

#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 20% 30%,#0a1a3a,#02040a 70%)}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ═══ TOPBAR ═══ */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top);background:var(--bg-panel);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:var(--border-soft);flex-wrap:nowrap}
#topbar .logo{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 6px;border-radius:10px;flex-shrink:0}
#topbar .logo:hover{background:rgba(0,229,255,.08)}
#topbar .logo .peacock{font-size:22px;filter:drop-shadow(0 0 8px var(--p1))}
#topbar .logo .txt{display:flex;flex-direction:column;line-height:1.05}
#topbar .logo .txt .t1{font-size:12px;font-weight:800;color:var(--p1)}
#topbar .logo .txt .t2{font-size:8px;color:var(--text-mute);letter-spacing:1.5px}
#topbar .spacer{flex:1}
#topbar .icon-btn{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--p1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
#topbar .icon-btn:hover{background:rgba(0,229,255,.15);box-shadow:var(--glow)}
@media(max-width:380px){#topbar .icon-btn{width:34px;height:34px;font-size:14px}#topbar .logo .txt{display:none}}

/* ═══ SIDEBAR ═══ */
#sidebar{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));left:0;width:245px;max-width:78vw;z-index:45;padding:10px 8px;background:var(--bg-panel);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-right:var(--border-soft);overflow-y:auto;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#sidebar.open{transform:translateX(0)}
#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
#sidebar .group{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:12px 8px 6px}
#sidebar .item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;width:100%;text-align:left}
#sidebar .item:hover{background:rgba(0,229,255,.1)}
#sidebar .item.active{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.15));border:1px solid rgba(0,229,255,.4)}
#sidebar .item .ico{font-size:18px;flex-shrink:0}
#sidebar .item .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar .sep{height:1px;background:var(--border-soft);margin:8px 6px;border:none}

/* ═══ DESKTOP ═══ */
#desktop{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));left:0;right:0;bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));z-index:20;overflow:hidden;padding:0}
#sidebar.open ~ #desktop{left:245px}
@media(max-width:700px){#sidebar.open ~ #desktop{left:0}}

/* ═══ HOMESCREEN ═══ */
#homescreen{position:absolute;inset:0;overflow-y:auto;padding:14px;padding-bottom:24px}
#homescreen::-webkit-scrollbar{width:6px}#homescreen::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.welcome{padding:16px 16px;margin-bottom:12px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(0,229,255,.12),rgba(180,120,255,.1));border:var(--border);box-shadow:var(--shadow);text-align:center;max-width:760px;margin-left:auto;margin-right:auto}
.welcome .hello{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;font-weight:800}
.welcome .name{font-size:20px;font-weight:900;color:var(--p1);margin-top:4px;text-shadow:0 0 20px var(--p1)}
.welcome .sub{font-size:11px;color:var(--text-dim);margin-top:6px}
.search-row{max-width:760px;margin:0 auto 12px;position:relative}
.search-row input{width:100%;padding:12px 16px 12px 42px;border-radius:14px;background:rgba(0,0,0,.45);border:var(--border-soft);color:var(--text);font-size:13px;outline:none}
.search-row input:focus{border-color:var(--p1);box-shadow:0 0 20px rgba(0,229,255,.2)}
.search-row::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.filter-row{max-width:760px;margin:0 auto 14px;display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:7px 12px;border-radius:14px;border:var(--border-soft);background:rgba(0,0,0,.3);color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.15s}
.filter-chip.active{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(180,120,255,.2));border-color:var(--p1);color:var(--text);box-shadow:var(--glow)}

.cat-section{max-width:760px;margin:0 auto 18px}
.cat-title{font-size:10.5px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cat-title .count{font-size:9px;padding:2px 8px;background:rgba(0,229,255,.15);color:var(--p1);border-radius:10px;font-weight:800}
.cat-title .toggle{margin-left:auto;font-size:14px;opacity:.5;cursor:pointer;transition:.2s}
.cat-title .toggle:hover{opacity:1}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;transition:.2s}
.app-grid.collapsed{display:none}
.tile{padding:12px 6px;border-radius:14px;background:var(--bg-card);backdrop-filter:blur(20px);border:var(--border-soft);cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;position:relative;user-select:none}
.tile:hover{border-color:var(--p1);background:rgba(0,229,255,.1);transform:translateY(-2px);box-shadow:var(--glow)}
.tile.dragging{opacity:.4;transform:scale(.95)}
.tile.drag-over{border-color:var(--p1);background:rgba(0,229,255,.2);transform:scale(1.05)}
.tile .ico{font-size:30px;line-height:1;filter:drop-shadow(0 0 10px rgba(0,229,255,.4));pointer-events:none}
.tile .name{font-size:11px;font-weight:700;color:var(--text);line-height:1.2;pointer-events:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.tile .cat{font-size:8.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.5px;font-weight:700;pointer-events:none}
.tile .star{position:absolute;top:5px;right:5px;font-size:12px;opacity:0;transition:.15s;cursor:pointer}
.tile:hover .star,.tile.starred .star{opacity:1}
.tile.starred .star{filter:drop-shadow(0 0 6px gold)}
.tile .drag-handle{position:absolute;top:5px;left:5px;font-size:11px;opacity:0;transition:.15s;cursor:grab}
.tile:hover .drag-handle{opacity:.6}
@media(max-width:400px){.app-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.app-grid{grid-template-columns:repeat(6,1fr)}}

/* ═══ FENSTER — WICHTIG: position: absolute in #desktop ═══ */
.window{position:absolute;background:var(--bg-card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:100;min-width:280px;min-height:220px}
.window.focused{box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px rgba(0,229,255,.25);border-color:var(--p1);z-index:999}
.window.minimized{display:none}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(0,229,255,.1),transparent);border-bottom:var(--border-soft);cursor:move;flex-shrink:0;user-select:none;touch-action:none}
.titlebar .ico{font-size:18px;pointer-events:none}
.titlebar .title{flex:1;font-size:12.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.wbtns{display:flex;gap:6px}
.wbtn{width:40px;height:40px;min-width:40px;border-radius:10px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s}
.wbtn:hover{background:rgba(0,229,255,.25)}
.wbtn.close{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#ff8080}
.wbtn.set{background:rgba(180,120,255,.15);border-color:rgba(180,120,255,.5);color:#c084fc}
.wbtn.full{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:#4ade80}
.wbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch}
.wbody::-webkit-scrollbar{width:6px}.wbody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.resizer{position:absolute;width:18px;height:18px;bottom:0;right:0;cursor:nwse-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;bottom:4px;right:4px;width:10px;height:10px;border-right:2px solid var(--p1);border-bottom:2px solid var(--p1);opacity:.4}

/* Vollbild-Fenster auf kleinen Geräten */
@media(max-width:600px){
  .window{left:4px!important;right:4px!important;top:4px!important;bottom:4px!important;width:auto!important;height:auto!important;max-width:none!important;max-height:none!important}
  .window.fullscreen-mode{left:4px!important;right:4px!important;top:4px!important;bottom:4px!important;width:auto!important;height:auto!important}
}

/* ═══ CHAT PANEL ═══ */
#chatPanel{position:fixed;left:50%;right:auto;bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom) + 8px);transform:translateX(-50%) translateY(110%);width:min(680px,calc(100vw - 16px));height:min(66vh,600px);z-index:150;background:var(--bg-panel);backdrop-filter:blur(28px);border:var(--border);border-radius:20px;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 -10px 60px rgba(0,229,255,.2)}
#chatPanel.show{transform:translateX(-50%) translateY(0)}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:var(--border-soft);flex-shrink:0}
.chat-head .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p3));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 18px var(--p1);flex-shrink:0}
.chat-head .meta{flex:1;min-width:0}
.chat-head .meta .name{font-size:13.5px;font-weight:900;color:var(--p1)}
.chat-head .meta .status{font-size:10px;color:var(--text-mute);font-weight:700}
.chat-head .hbtn{width:36px;height:36px;border-radius:10px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-head .hbtn.close{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#ff8080}
#chatBody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
#chatBody::-webkit-scrollbar{width:6px}#chatBody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.msg{max-width:82%;padding:10px 14px;border-radius:15px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;font-weight:600;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(0,229,255,.1);border:var(--border-soft);border-bottom-left-radius:4px}
.chat-quick{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{padding:6px 11px;background:rgba(0,229,255,.1);border:var(--border-soft);border-radius:14px;color:var(--text-dim);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chat-quick button:hover{background:rgba(0,229,255,.2);color:var(--text)}
.chat-input-row{display:flex;gap:6px;padding:10px 12px 12px;border-top:var(--border-soft);flex-shrink:0;align-items:flex-end;background:rgba(0,0,0,.15)}
.chat-input-row textarea{flex:1;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--text);padding:10px 14px;border-radius:20px;font-family:inherit;font-size:13px;outline:none;resize:none;line-height:1.4;min-height:42px;max-height:120px}
.chat-input-row textarea:focus{border-color:var(--p1);box-shadow:0 0 12px rgba(0,229,255,.2)}
.chat-input-row .ibtn{width:42px;height:42px;border-radius:50%;border:var(--border-soft);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,229,255,.1);color:var(--p1);transition:.15s}
.chat-input-row .ibtn.send{background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;border:none;box-shadow:0 4px 15px rgba(0,229,255,.4)}
.chat-input-row .ibtn.send:hover{transform:scale(1.06)}
.chat-input-row .ibtn.mic.on{background:rgba(239,68,68,.25);border-color:#ef4444;color:#ff8080}
.chat-input-row .ibtn.speaker.on{background:rgba(34,197,94,.25);border-color:#22c55e;color:#4ade80}

/* ═══ BOTTOM BAR ═══ */
#bottombar{position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);z-index:50;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;padding-bottom:env(safe-area-inset-bottom);background:var(--bg-panel);backdrop-filter:blur(24px);border-top:var(--border-soft)}
.bbtn{min-width:82px;padding:8px 14px;border-radius:12px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.bbtn:hover{background:rgba(0,229,255,.2);transform:translateY(-2px)}
.bbtn .ico{font-size:18px;line-height:1}
.bbtn.cyborg{background:rgba(255,120,200,.15);border-color:rgba(255,120,200,.5);color:#ff78c8}
@media(max-width:400px){.bbtn{min-width:70px;padding:6px 10px;font-size:10px}.bbtn .ico{font-size:16px}}

/* ═══ SETTINGS PANEL ═══ */
.modal{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.8);display:none;align-items:flex-start;justify-content:center;padding:14px;padding-top:calc(var(--topbar-h) + 14px);padding-bottom:calc(var(--bottombar-h) + 14px);backdrop-filter:blur(8px);overflow-y:auto}
.modal.show{display:flex}
.panel-box{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:auto 0}
.panel-box::-webkit-scrollbar{width:6px}.panel-box::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg-card);backdrop-filter:blur(28px);border-bottom:var(--border-soft);z-index:2}
.phead .ico{font-size:20px}
.phead h2{font-size:13.5px;font-weight:900;color:var(--p1);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .close{width:40px;height:40px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pbody{padding:14px 16px 18px}
.group{margin-bottom:14px;padding:12px;background:rgba(0,0,0,.2);border-radius:12px;border:var(--border-soft)}
.group h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--p1);font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:10px}
.row:last-child{border-bottom:none}
.row .lbl{font-size:12px;font-weight:700;flex:1;min-width:0}
.row .lbl small{display:block;font-size:10px;color:var(--text-mute);font-weight:600;margin-top:2px}
.row select,.row input[type=text]{padding:8px 10px;background:rgba(0,0,0,.4);border:var(--border-soft);border-radius:8px;color:inherit;font-size:12px;min-width:120px;max-width:60%;outline:none}
.sw{width:46px;height:24px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#7a9bb8;transition:.2s}
.sw.on{background:rgba(0,229,255,.3);border-color:var(--p1)}
.sw.on::after{left:22px;background:var(--p1);box-shadow:0 0 10px var(--p1)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-card{padding:10px 6px;border-radius:12px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center;transition:.2s}
.theme-card.active{border-color:var(--p1);box-shadow:var(--glow)}
.theme-card .preview{height:44px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
.theme-card .preview.kosmos{background:radial-gradient(circle at 30% 40%,#ff9028,#0a1a3a 60%,#02040a)}
.theme-card .preview.erde{background:radial-gradient(circle at 40% 40%,#4a8fd8,#1a4a8a 50%,#02040a)}
.theme-card .preview.holo{background:linear-gradient(135deg,#0a1a3a,#1a2a5a);box-shadow:inset 0 0 30px rgba(0,229,255,.3)}
.theme-card .name{font-size:10px;font-weight:800}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.speed-row input[type=range]{flex:1;accent-color:var(--p1);height:6px}
.speed-row .sv{font-size:11px;font-weight:800;color:var(--p1);min-width:60px;text-align:right;font-family:ui-monospace,monospace}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lang-card{padding:10px;border-radius:10px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center;transition:.15s}
.lang-card.active{border-color:var(--p1);background:rgba(0,229,255,.12)}
.lang-card .flag{font-size:22px;display:block;margin-bottom:3px}
.lang-card .name{font-size:10.5px;font-weight:800}
.voice-item{display:flex;align-items:center;gap:8px;padding:9px 11px;background:rgba(0,0,0,.25);border:var(--border-soft);border-radius:10px;margin-bottom:6px;cursor:pointer}
.voice-item:hover{border-color:var(--p1)}
.voice-item.active{border-color:var(--p1);background:rgba(0,229,255,.12)}
.voice-item .ico{font-size:18px}

MODULES.uebersetzer={render:function(el){
  var langs=["de","ku","ez","ar","tr","en","fa","ru","fr","es"];
  var from="de",to="ez";
  function build(){
    el.innerHTML='<div class="card"><h3>🌐 Übersetzer</h3>'
      +'<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end;margin-bottom:12px">'

      +'<button class="btn sec" id="trans_swap" style="height:42px;padding:0 12px">⇄</button>'
      +'<div class="field" style="margin:0"><label>Nach</label><select id="trans_to">'+langs.map(function(l){return '<option value="'+l+'"'+(to===l?" selected":"")+'>'+LANGS[l].flag+' '+LANGS[l].name+'</option>';}).join("")+'</select></div>'
      +'</div>'
      +'<div class="field"><label>Text</label><textarea id="trans_in" placeholder="Text eingeben…" style="min-height:80px">'+esc(el._input||"")+'</textarea></div>'
      +'<button class="btn full" id="trans_go">🌐 Übersetzen</button>'
      +'<div id="trans_out" style="margin-top:12px;padding:13px;background:rgba(0,229,255,.08);border-radius:12px;border:1px dashed rgba(0,229,255,.4);min-height:60px;font-size:14px;line-height:1.5">'+(el._output?esc(el._output):'<span style="color:var(--text-mute);font-size:12px">Ergebnis hier…</span>')+'</div>'
      +'</div>'
      +'<div class="card"><h3>📚 Schnellwörter</h3>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px">'
      +Object.keys(I18N_DATA).slice(0,16).map(function(w){
        var d=I18N_DATA[w];
        return '<div style="padding:8px;background:rgba(0,0,0,.2);border-radius:8px;font-size:10.5px;cursor:pointer" data-word="'+w+'"><div style="color:var(--text-mute);font-weight:700;overflow:hidden;text-overflow:ellipsis">'+esc(d.de)+'</div><div style="color:var(--p1);font-weight:800;margin-top:2px;overflow:hidden;text-overflow:ellipsis">'+esc(d[to]||d.de)+'</div></div>';
      }).join("")
      +'</div></div>';
    el.querySelector("#trans_from").addEventListener("change",function(){from=this.value;build();});
    el.querySelector("#trans_to").addEventListener("change",function(){to=this.value;build();});
    el.querySelector("#trans_swap").addEventListener("click",function(){var t=from;from=to;to=t;build();});
    el.querySelector("#trans_in").addEventListener("input",function(){el._input=this.value;});
    el.querySelector("#trans_go").addEventListener("click",function(){
      var txt=(el.querySelector("#trans_in").value||"").trim().toLowerCase();
      if(!txt){toast("⚠️ Text fehlt","err");return;}
      var result="";
      for(var k in I18N_DATA){
        if(k===txt||I18N_DATA[k].de===txt){result=I18N_DATA[k][to]||I18N_DATA[k].de;break;}
      }
      if(!result){
        var words=txt.split(/\s+/);
        result=words.map(function(w){
          for(var k2 in I18N_DATA){
            if(k2===w||I18N_DATA[k2].de===w) return I18N_DATA[k2][to]||w;
          }
          return w;
        }).join(" ");
      }

MODULES.games={render:function(el){
  var tab="ttt";
  function build(){
    if(tab==="ttt")buildTTT();
    else if(tab==="snake")buildSnake();
    else buildMemory();
  }
  function tabsHtml(){return '<div class="tabs">'
    +'<button class="tab'+(tab==="ttt"?" active":"")+'" data-g="ttt">🎯 TicTacToe</button>'
    +'<button class="tab'+(tab==="snake"?" active":"")+'" data-g="snake">🐍 Snake</button>'
    +'<button class="tab'+(tab==="memory"?" active":"")+'" data-g="memory">🧩 Memory</button>'
    +'</div>';}
  function bindTabs(){
    el.querySelectorAll("[data-g]").forEach(function(b){
      b.addEventListener("click",function(){tab=b.dataset.g;build();});
    });
  }
  function buildTTT(){
    el.innerHTML=tabsHtml()+'<div id="tttBody"></div>';
    bindTabs();
    var board=["","","","","","","","",""];
    var player="X",over=false;
    function draw(){
      var body=el.querySelector("#tttBody");
      body.innerHTML='<div style="text-align:center;margin-bottom:12px;font-size:13px;font-weight:800;color:var(--p1)">'+(over?"Beendet":"Spieler "+player+" dran")+'</div>'
        +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto">'
        +board.map(function(v,i){
          return '<button data-ttt="'+i+'" style="aspect-ratio:1;background:rgba(0,0,0,.3);border:1px solid rgba(0,229,255,.3);border-radius:12px;font-size:34px;font-weight:900;color:'+(v==="X"?"#ff8080":"#4ade80")+';cursor:pointer;font-family:inherit">'+(v||"")+'</button>';
        }).join("")+'</div>'
        +'<button class="btn full" id="ttt_reset" style="margin-top:14px;max-width:260px;display:block;margin-left:auto;margin-right:auto">🔄 Neu</button>';
      body.querySelectorAll("[data-ttt]").forEach(function(b){
        b.addEventListener("click",function(){play(parseInt(b.dataset.ttt));});
      });
      body.querySelector("#ttt_reset").addEventListener("click",function(){
        board=["","","","","","","","",""];player="X";over=false;draw();
      });
    }
    function check(){
      var w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for(var i=0;i<w.length;i++){var x=w[i];if(board[x[0]]&&board[x[0]]===board[x[1]]&&board[x[1]]===board[x[2]])return board[x[0]];}
      return board.indexOf("")<0?"D":null;
    }
    function play(i){
      if(over||board[i])return;
      board[i]=player;
      var r=check();
      if(r){over=true;toast(r==="D"?"🤝 Unentschieden":"🎉 "+r+" gewinnt!",r==="D"?"":"ok");}
      else{player=player==="X"?"O":"X";}
      draw();
    }
    draw();
  }
  function buildSnake(){
    el.innerHTML=tabsHtml()+'<div style="text-align:center;padding:40px;color:var(--text-dim);font-size:13px">🐍 Snake kommt in der nächsten Runde</div>';
    bindTabs();
  }
  function buildMemory(){
    el.innerHTML=tabsHtml()+'<div style="text-align:center;padding:40px;color:var(--text-dim);font-size:13px">🧩 Memory kommt in der nächsten Runde</div>';
    bindTabs();
  }
  build();
}};

        +'</div>';
      var remain=0,iv=null;

    }
  }

/* ═══════════ SETTINGS ═══════════ */
var Settings={
  _cache:null,
  defaults:{theme:"kosmos",cyborg:false,lang:"de",userName:"Bruder",speed:2,voice:"",autoSpeak:false,ttsRate:0.95},
  load:function(){this._cache=Object.assign({},this.defaults,Storage.get("settings",{}));return this._cache;},
  get:function(k){if(!this._cache)this.load();return this._cache[k];},
  set:function(k,v){if(!this._cache)this.load();this._cache[k]=v;Storage.set("settings",this._cache);this.apply();},
  apply:function(){
    var s=this._cache;
    document.body.classList.toggle("cyborg",!!s.cyborg);
    document.body.setAttribute("dir",(LANGS[s.lang]&&LANGS[s.lang].rtl)?"rtl":"ltr");
    document.documentElement.setAttribute("lang",s.lang);
    /* Theme markieren */
    document.querySelectorAll("[data-theme]").forEach(function(t){t.classList.toggle("active",t.dataset.theme===s.theme);});
    /* Sprache markieren */
    document.querySelectorAll("[data-lang]").forEach(function(t){t.classList.toggle("active",t.dataset.lang===s.lang);});
    /* Voice markieren */
    document.querySelectorAll("[data-voice]").forEach(function(t){t.classList.toggle("active",t.dataset.voice===(s.voice||""));});
    /* Switches */
    var csw=$("cyborgSw");if(csw)csw.classList.toggle("on",!!s.cyborg);
    var asw=$("autoSpeakSw");if(asw)asw.classList.toggle("on",!!s.autoSpeak);
    /* Speed */
    var gs=$("globalSpeed");if(gs){gs.value=s.speed||2;}
    var sv=$("speedVal");if(sv){sv.textContent=s.speed+"×";}
    /* UI-Texte */
    var t=(LANGS[s.lang]&&LANGS[s.lang].t)||LANGS.de.t;
    document.querySelectorAll("[data-i18n]").forEach(function(e){
      var key=e.dataset.i18n;
      if(t[key])e.textContent=t[key];
    });
    /* User name */
    var un=$("userName");if(un)un.textContent=s.userName;
    /* Placeholder */
    var si=$("appSearch");if(si)si.placeholder=t.search||"App suchen…";
    /* Background */
    if(window.BG)BG.setTheme(s.theme,s.speed||2);
  }
};

    {d:140,speed:0.15,size:6,color:"#e8c888"},
    {d:180,speed:0.12,size:7,color:"#4a8fd8"},
    {d:220,speed:0.10,size:6,color:"#c1440e"},
    {d:280,speed:0.075,size:12,color:"#c88b4a"},
    {d:340,speed:0.055,size:10,color:"#d8b478"},
    {d:400,speed:0.042,size:9,color:"#78c8d8"},
    {d:460,speed:0.032,size:9,color:"#4a7cc8"},
    {d:520,speed:0.024,size:4,color:"#b8b8b8"},
    {d:580,speed:0.018,size:11,color:"#7c5aff"},
    {d:640,speed:0.014,size:8,color:"#ff78c8"},
    {d:700,speed:0.010,size:6,color:"#78ffc8"}
  ];
  var angles=planets.map(function(_,i){return i*0.5;});
  var t=0;
  var stars=[];
  function initStars(){
    stars=[];
    for(var i=0;i<140;i++)stars.push({x:Math.random(),y:Math.random(),size:Math.random()*1.5+0.3,tw:Math.random()*Math.PI*2});
  }
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  function drawKosmos(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],alpha=0.4+Math.sin(t*0.02+s.tw)*0.4;
      ctx.fillStyle="rgba(180,220,255,"+alpha+")";
      ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();
    }
    var cx=w/2,cy=h/2;
    var scale=Math.min(1.4,Math.max(0.55,Math.min(w,h)/900));
    var sunGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,80*scale);
    sunGrad.addColorStop(0,"#fff5d0");sunGrad.addColorStop(0.3,"#ffc050");
    sunGrad.addColorStop(0.7,"rgba(255,140,40,.4)");sunGrad.addColorStop(1,"transparent");
    ctx.fillStyle=sunGrad;ctx.beginPath();ctx.arc(cx,cy,80*scale,0,Math.PI*2);ctx.fill();
    for(var p=0;p<planets.length;p++){
      var pl=planets[p],orbitR=pl.d*scale;
      var px=cx+Math.cos(angles[p])*orbitR,py=cy+Math.sin(angles[p])*orbitR;
      ctx.strokeStyle="rgba(0,229,255,.06)";ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(cx,cy,orbitR,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=pl.color;ctx.shadowBlur=14;ctx.shadowColor=pl.color;
      ctx.beginPath();ctx.arc(px,py,pl.size*scale*0.8,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      angles[p]+=pl.speed*speedFactor*0.008;
    }
    t+=1;
  }
  function drawErde(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      ctx.fillStyle="rgba(180,220,255,.5)";
      ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();
    }
    var cx=w/2,cy=h/2,R=Math.min(w,h)*0.32;
    var atm=ctx.createRadialGradient(cx,cy,R*0.8,cx,cy,R*1.3);
    atm.addColorStop(0,"rgba(100,180,255,.4)");atm.addColorStop(1,"transparent");
    ctx.fillStyle=atm;ctx.beginPath();ctx.arc(cx,cy,R*1.3,0,Math.PI*2);ctx.fill();
    var globe=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
    globe.addColorStop(0,"#6fa8dc");globe.addColorStop(0.5,"#2c5f8a");globe.addColorStop(1,"#0a2540");
    ctx.fillStyle=globe;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    var rot=t*0.0004*speedFactor;
    for(var k=0;k<6;k++){
      var ang=k*(Math.PI*2/6)+rot,dx=Math.cos(ang);
      if(dx<-0.2)continue;
      var px=cx+Math.sin(ang)*R*0.7,py=cy+(Math.sin(k*1.7)*0.3)*R,size=R*0.15;
      ctx.fillStyle="rgba(60,120,60,.7)";
      ctx.beginPath();ctx.ellipse(px,py,size,size*0.7,0,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle="rgba(100,180,255,.6)";ctx.lineWidth=2;ctx.shadowBlur=30;ctx.shadowColor="#4da8ff";
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    t+=1;
  }
  function drawHolo(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){
      var s=stars[i],alpha=0.3+Math.sin(t*0.03+i)*0.3;
      ctx.fillStyle="rgba(0,229,255,"+alpha+")";
      ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size*0.7,0,Math.PI*2);ctx.fill();
    }
    t+=1;
  }
  function loop(){
    if(theme==="kosmos")drawKosmos();
    else if(theme==="erde")drawErde();
    else drawHolo();
    animId=requestAnimationFrame(loop);
  }
  return{
    init:function(){canvas=$("bgCanvas");ctx=canvas.getContext("2d");resize();initStars();
      window.addEventListener("resize",resize);if(animId)cancelAnimationFrame(animId);loop();},
    setTheme:function(th,spd){
      theme=th;
      /* speed 1 = extrem langsam · speed 10 = schnell */
      var s=spd||2;
      speedFactor=0.01+(s-1)*0.06;
    }
  };
})();

var Chat={
  history:[],
  responses:{

    "ezidi":"Die Eziden sind ein altes Volk mit eigener Religion. Heilige Schrift: Mushaf Reş. 🦚",

    "spas":"Bi xêr hatî! 😊"
  },
  open:function(){
    $("chatPanel").classList.add("show");
    if(!this.history.length)this.addBot("Silav, Bruder! 🦚 Frag mich was!");
    setTimeout(function(){$("chatInput").focus();},300);
  },
  close:function(){$("chatPanel").classList.remove("show");},
  addBot:function(t){this.history.push({r:"bot",t:t});this.render();if(Settings.get("autoSpeak"))Voice.speak(t);},
  addUser:function(t){this.history.push({r:"user",t:t});this.render();},
  render:function(){
    var el=$("chatBody");if(!el)return;
    el.innerHTML=this.history.map(function(m){
      return '<div class="msg '+(m.r==="user"?"user":"bot")+'">'+esc(m.t)+'</div>';
    }).join("");
    setTimeout(function(){el.scrollTop=el.scrollHeight;},50);
  },
  respond:function(msg){
    var q=msg.toLowerCase().trim();
    for(var k in this.responses){
      if(q.indexOf(k)>=0)return this.responses[k];
    }
    var m=q.match(/^(übersetze|translate)\s+(.+)/);
    if(m){
      var word=m[2].replace(/[?.!]/g,"").trim();
      for(var k2 in I18N_DATA){
        if(k2===word||I18N_DATA[k2].de===word){
          return word+" auf Ezidi: 🦚 "+I18N_DATA[k2].ez+"\nAuf Kurdisch: 🟨 "+I18N_DATA[k2].ku+"\nAuf Arabisch: 🇸🇦 "+I18N_DATA[k2].ar;
        }
      }
      return "Das Wort kenne ich nicht. Versuch: „übersetze wasser\" oder ähnliche Grundwörter.";
    }
    var defaults=[
      "Interessant, Bruder! 🦚 Erzähl mehr.",
      "Gute Frage! Was genau willst du wissen?",
      "Verstehe. Willst du mehr über Ezidi, Länder oder Sprachen wissen?",
      "Klick links auf eine App — da gibt's mehr zu entdecken! 💙",
      "Hmm, das weiß ich noch nicht. Aber ich lerne jeden Tag! 🚀"
    ];
    return defaults[Math.floor(Math.random()*defaults.length)];
  },
  send:function(text){
    var t=(text||$("chatInput").value||"").trim();
    if(!t)return;
    $("chatInput").value="";
    $("chatInput").style.height="42px";
    this.addUser(t);
    var self=this;
    $("chatStatus").textContent="Schreibt…";
    setTimeout(function(){
      self.addBot(self.respond(t));
      $("chatStatus").textContent="Bereit zum Chatten";
    },400);
  }
};

/* ═══════════ VOICE (TTS) ═══════════ */
var Voice={
  voices:[],
  load:function(){
    if(!window.speechSynthesis)return;
    var self=this;
    function grab(){
      self.voices=speechSynthesis.getVoices()||[];
    }
    grab();
    speechSynthesis.onvoiceschanged=grab;
  },
  speak:function(text){
    if(!window.speechSynthesis||!text)return;
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      var lang=Settings.get("lang")||"de";
      var langMap={de:"de-DE",ku:"tr-TR",ez:"tr-TR",ar:"ar-SA",tr:"tr-TR",en:"en-US",fa:"fa-IR",ru:"ru-RU",fr:"fr-FR",es:"es-ES",it:"it-IT",zh:"zh-CN"};
      u.lang=langMap[lang]||"de-DE";
      u.rate=Settings.get("ttsRate")||0.95;
      var v=Settings.get("voice");
      if(v&&this.voices.length){
        var found=this.voices.find(function(x){return x.name===v;});
        if(found){u.voice=found;u.lang=found.lang;}
      }
      speechSynthesis.speak(u);
    }catch(e){}
  }
};

/* ═══════════ WINDOWS — FIX! ═══════════ */
var Windows={
  zIndexBase:100,
  openCount:0,
  open:function(appId){
    var app=APPS.find(function(a){return a.id===appId;});
    if(!app)return;
    var existing=document.querySelector('.window[data-app="'+appId+'"]');
    if(existing){this.focus(existing);return;}

    var desktop=$("desktop");
    var dRect=desktop.getBoundingClientRect();

    /* Fenster-Größe an Bildschirm anpassen */
    var isMobile=window.innerWidth<600;
    var ww,wh;
    if(isMobile){
      ww=dRect.width-8;
      wh=dRect.height-8;
    } else {
      ww=Math.min(dRect.width-40,560);
      wh=Math.min(dRect.height-40,620);
    }

    /* Zentriert in Desktop */
    var offset=(this.openCount%6)*22;
    var cx=Math.max(8,(dRect.width-ww)/2+offset-40);
    var cy=Math.max(8,(dRect.height-wh)/2+offset-40);
    /* Auf Desktop halten */
    if(cx+ww>dRect.width-8) cx=dRect.width-ww-8;
    if(cy+wh>dRect.height-8) cy=dRect.height-wh-8;

    var win=document.createElement("div");
    win.className="window focused";
    win.dataset.app=appId;
    win.style.width=ww+"px";
    win.style.height=wh+"px";
    win.style.left=cx+"px";
    win.style.top=cy+"px";
    win.style.zIndex=++this.zIndexBase;
    this.openCount++;

    win.innerHTML='<div class="titlebar"><span class="ico">'+app.ico+'</span><span class="title">'+esc(app.name)+'</span>'
      +'<div class="wbtns">'
      +'<button class="wbtn set" data-wbtn="settings" title="Einstellungen">⚙️</button>'
      +'<button class="wbtn" data-wbtn="min" title="Minimieren">—</button>'
      +'<button class="wbtn close" data-wbtn="close" title="Schließen">✕</button>'
      +'</div></div>'
      +'<div class="wbody"></div><div class="resizer"></div>';
    desktop.appendChild(win);

    var body=win.querySelector(".wbody");
    try{getModule(appId).render(body,app);}catch(e){body.innerHTML='<div class="placeholder">❌ '+esc(e.message)+'</div>';}
    this.bindWindow(win);
    AppSettings.applyToWindow(appId);
    return win;
  },
  bindWindow:function(win){
    var self=this;
    var desktop=$("desktop");

    win.addEventListener("mousedown",function(){self.focus(win);});
    win.addEventListener("touchstart",function(){self.focus(win);},{passive:true});

    win.querySelectorAll("[data-wbtn]").forEach(function(b){
      b.addEventListener("click",function(e){
        e.stopPropagation();
        var a=b.dataset.wbtn;
        if(a==="close")self.close(win);
        else if(a==="min")self.minimize(win);
        else if(a==="settings")AppSettings.open(win.dataset.app);
      });
    });

    /* DRAG — gefixt: Koordinaten relativ zu #desktop */
    var tb=win.querySelector(".titlebar");
    var dragging=false,sx=0,sy=0,ox=0,oy=0;
    function startDrag(e){
      if(e.target.closest(".wbtn"))return;
      dragging=true;
      var p=e.touches?e.touches[0]:e;
      sx=p.clientX;sy=p.clientY;
      var wRect=win.getBoundingClientRect();
      var dRect=desktop.getBoundingClientRect();
      ox=wRect.left-dRect.left;
      oy=wRect.top-dRect.top;
      win.style.left=ox+"px";win.style.top=oy+"px";
      win.style.right="auto";win.style.bottom="auto";
      self.focus(win);
      e.preventDefault();
    }
    function moveDrag(e){
      if(!dragging)return;
      var p=e.touches?e.touches[0]:e;
      var dx=p.clientX-sx,dy=p.clientY-sy;
      var ww=win.offsetWidth,wh=win.offsetHeight;
      var dRect=desktop.getBoundingClientRect();
      var nx=Math.max(-ww*0.5,Math.min(dRect.width-ww*0.5,ox+dx));
      var ny=Math.max(-10,Math.min(dRect.height-40,oy+dy));
      win.style.left=nx+"px";
      win.style.top=ny+"px";
    }
    function endDrag(){dragging=false;}
    tb.addEventListener("mousedown",startDrag);
    tb.addEventListener("touchstart",startDrag,{passive:false});
    document.addEventListener("mousemove",moveDrag);
    document.addEventListener("touchmove",moveDrag,{passive:false});
    document.addEventListener("mouseup",endDrag);
    document.addEventListener("touchend",endDrag);

    /* RESIZE */
    var rs=win.querySelector(".resizer");
    if(rs){
      var resizing=false,rsx=0,rsy=0,rw=0,rh=0;
      function startResize(e){
        resizing=true;
        var p=e.touches?e.touches[0]:e;
        rsx=p.clientX;rsy=p.clientY;
        rw=win.offsetWidth;rh=win.offsetHeight;
        e.preventDefault();
      }
      function moveResize(e){
        if(!resizing)return;
        var p=e.touches?e.touches[0]:e;
        var dRect=desktop.getBoundingClientRect();
        var wRect=win.getBoundingClientRect();
        var maxW=dRect.width-wRect.left+dRect.left-8;
        var maxH=dRect.height-wRect.top+dRect.top-8;
        win.style.width=Math.max(260,Math.min(maxW,rw+(p.clientX-rsx)))+"px";
        win.style.height=Math.max(200,Math.min(maxH,rh+(p.clientY-rsy)))+"px";
      }
      function endResize(){resizing=false;}
      rs.addEventListener("mousedown",startResize);
      rs.addEventListener("touchstart",startResize,{passive:false});
      document.addEventListener("mousemove",moveResize);
      document.addEventListener("touchmove",moveResize,{passive:false});
      document.addEventListener("mouseup",endResize);
      document.addEventListener("touchend",endResize);
    }
  },
  focus:function(win){
    document.querySelectorAll(".window").forEach(function(w){w.classList.remove("focused");});
    win.classList.add("focused");
    win.classList.remove("minimized");
    win.style.zIndex=++this.zIndexBase;
  },
  minimize:function(win){win.classList.add("minimized");},
  close:function(win){win.remove();}
};

/* ═══════════ HOMESCREEN ═══════════ */
var HomeState={
  search:"",
  cat:"all",
  collapsed:Storage.get("home_collapsed",{}),
  order:Storage.get("home_order",[]),
  favs:Storage.get("home_favs",[])
};

function renderApps(){
  var c=$("appCategories");if(!c)return;
  var list=APPS.slice();
  /* Suche */
  if(HomeState.search){
    var q=HomeState.search.toLowerCase();
    list=list.filter(function(a){return a.name.toLowerCase().indexOf(q)>=0||a.cat.toLowerCase().indexOf(q)>=0||a.desc.toLowerCase().indexOf(q)>=0;});
  }
  /* Kategorie-Filter */
  if(HomeState.cat!=="all"&&HomeState.cat!=="favs"){
    list=list.filter(function(a){return a.cat===HomeState.cat;});
  }
  if(HomeState.cat==="favs"){
    list=list.filter(function(a){return HomeState.favs.indexOf(a.id)>=0;});
  }
  /* Sortieren nach Custom-Order + Favoriten zuerst */
  list.sort(function(a,b){
    var ai=HomeState.order.indexOf(a.id);
    var bi=HomeState.order.indexOf(b.id);
    if(ai<0&&bi<0)return a.name.localeCompare(b.name);
    if(ai<0)return 1;
    if(bi<0)return -1;
    return ai-bi;
  });

  if(!list.length){c.innerHTML='<div class="placeholder">Keine Apps gefunden.</div>';return;}
  /* Gruppieren */
  var byCat={};
  list.forEach(function(a){if(!byCat[a.cat])byCat[a.cat]=[];byCat[a.cat].push(a);});
  var cats=Object.keys(byCat).sort();
  c.innerHTML=cats.map(function(cat){
    var apps=byCat[cat];
    var collapsed=HomeState.collapsed[cat]?" collapsed":"";
    return '<div class="cat-section"><div class="cat-title">'+esc(cat)+'<span class="count">'+apps.length+'</span>'
      +'<span class="toggle" data-toggle-cat="'+cat+'">'+(HomeState.collapsed[cat]?"▶":"▼")+'</span></div>'
      +'<div class="app-grid'+collapsed+'" data-cat="'+cat+'">'
      +apps.map(function(a){
        var isFav=HomeState.favs.indexOf(a.id)>=0;
        return '<div class="tile'+(isFav?" starred":"")+'" data-tile-id="'+a.id+'" draggable="true">'
          +'<span class="drag-handle">⋮⋮</span>'
          +'<span class="star" data-star="'+a.id+'">'+(isFav?"⭐":"☆")+'</span>'
          +'<span class="ico">'+a.ico+'</span>'
          +'<span class="name">'+esc(a.name)+'</span>'
          +'<span class="cat">'+esc(a.cat)+'</span>'
          +'</div>';
      }).join("")
      +'</div></div>';
  }).join("");
  bindTiles();
  bindCatToggles();
}

function bindCatToggles(){
  document.querySelectorAll("[data-toggle-cat]").forEach(function(t){
    t.addEventListener("click",function(e){
      e.stopPropagation();
      var cat=t.dataset.toggleCat;
      HomeState.collapsed[cat]=!HomeState.collapsed[cat];
      Storage.set("home_collapsed",HomeState.collapsed);
      renderApps();
    });
  });
}

function bindTiles(){
  /* Klick → App öffnen */
  document.querySelectorAll("[data-tile-id]").forEach(function(tile){
    tile.addEventListener("click",function(e){
      if(e.target.closest("[data-star]"))return;
      var id=tile.dataset.tileId;
      Windows.open(id);
      if(window.innerWidth<700)$("sidebar").classList.remove("open");
    });
    /* Stern */
    var star=tile.querySelector("[data-star]");
    if(star){
      star.addEventListener("click",function(e){
        e.stopPropagation();
        var id=star.dataset.star;
        var idx=HomeState.favs.indexOf(id);
        if(idx>=0)HomeState.favs.splice(idx,1);
        else HomeState.favs.push(id);
        Storage.set("home_favs",HomeState.favs);
        renderApps();
      });
    }
    /* Drag & Drop für Reorder */
    tile.addEventListener("dragstart",function(e){
      e.dataTransfer.setData("text/plain",tile.dataset.tileId);
      tile.classList.add("dragging");
    });
    tile.addEventListener("dragend",function(){
      tile.classList.remove("dragging");
      document.querySelectorAll(".tile").forEach(function(t){t.classList.remove("drag-over");});
    });
    tile.addEventListener("dragover",function(e){
      e.preventDefault();
      tile.classList.add("drag-over");
    });
    tile.addEventListener("dragleave",function(){
      tile.classList.remove("drag-over");
    });
    tile.addEventListener("drop",function(e){
      e.preventDefault();
      tile.classList.remove("drag-over");
      var fromId=e.dataTransfer.getData("text/plain");
      var toId=tile.dataset.tileId;
      if(fromId===toId)return;
      var all=APPS.map(function(a){return a.id;});
      var fromIdx=HomeState.order.indexOf(fromId);
      if(fromIdx<0)HomeState.order=all.filter(function(x){return x!==fromId;});
      var toIdx=HomeState.order.indexOf(toId);
      if(fromIdx<0){
        /* neue Reihenfolge anlegen */
        HomeState.order=all.slice();
        fromIdx=HomeState.order.indexOf(fromId);
        toIdx=HomeState.order.indexOf(toId);
      }
      HomeState.order.splice(fromIdx,1);
      HomeState.order.splice(toIdx,0,fromId);
      Storage.set("home_order",HomeState.order);
      renderApps();
      toast("↔️ Verschoben","ok");
    });
  });
}

function renderFilters(){
  var cats={};
  APPS.forEach(function(a){cats[a.cat]=(cats[a.cat]||0)+1;});
  var favCount=HomeState.favs.length;
  var html='<button class="filter-chip'+(HomeState.cat==="all"?" active":"")+'" data-cat-filter="all">🌍 Alle '+APPS.length+'</button>';
  if(favCount>0)html+='<button class="filter-chip'+(HomeState.cat==="favs"?" active":"")+'" data-cat-filter="favs">⭐ Favoriten '+favCount+'</button>';
  Object.keys(cats).sort().forEach(function(c){
    html+='<button class="filter-chip'+(HomeState.cat===c?" active":"")+'" data-cat-filter="'+c+'">'+c+' '+cats[c]+'</button>';
  });
  $("filterRow").innerHTML=html;
  $("filterRow").querySelectorAll("[data-cat-filter]").forEach(function(b){
    b.addEventListener("click",function(){
      HomeState.cat=b.dataset.catFilter;
      renderFilters();
      renderApps();
    });
  });
}

/* ═══════════ SIDEBAR MENU ═══════════ */
function renderSidebar(){
  var html='<div class="group">Hauptmenü</div>'
    +'<button class="item active" data-side="home"><span class="ico">🏠</span><span class="lbl" data-i18n="home">Home</span></button>'
    +'<hr class="sep">'
    +'<div class="group">Apps</div>'
    +APPS.map(function(a){
      return '<button class="item" data-open-app="'+a.id+'"><span class="ico">'+a.ico+'</span><span class="lbl">'+esc(a.name)+'</span></button>';
    }).join("")
    +'<hr class="sep">'
    +'<div class="group">System</div>'
    +'<button class="item" data-open-app="system"><span class="ico">⚙️</span><span class="lbl">System</span></button>';
  $("sidebar").innerHTML=html;
  $("sidebar").querySelectorAll("[data-side]").forEach(function(b){
    b.addEventListener("click",function(){
      $("sidebar").querySelectorAll("[data-side]").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
      HomeState.cat="all";HomeState.search="";
      $("appSearch").value="";
      renderFilters();renderApps();
      if(window.innerWidth<700)$("sidebar").classList.remove("open");
    });
  });
}

/* ═══════════ SETTINGS PANEL RENDER ═══════════ */
function renderSettingsPanel(){
  var s=Settings._cache;
  $("settingsBody").innerHTML=
    /* Hintergrund */
    '<div class="group"><h3>🌌 <span data-i18n="background">Hintergrund</span></h3>'
    +'<div class="theme-grid">'
    +'<div class="theme-card'+(s.theme==="kosmos"?" active":"")+'" data-theme="kosmos"><div class="preview kosmos"></div><div class="name">🌌 Kosmos</div></div>'
    +'<div class="theme-card'+(s.theme==="erde"?" active":"")+'" data-theme="erde"><div class="preview erde"></div><div class="name">🌍 Erde</div></div>'
    +'<div class="theme-card'+(s.theme==="holo"?" active":"")+'" data-theme="holo"><div class="preview holo"></div><div class="name">🔵 Holo</div></div>'
    +'</div>'
    +'<div class="speed-row"><span style="font-size:10px">🐌</span><input type="range" id="globalSpeed" min="1" max="10" value="'+(s.speed||2)+'"><span class="sv" id="speedVal">'+(s.speed||2)+'×</span><span style="font-size:10px">🐇</span></div>'
    +'<div style="font-size:10px;color:var(--text-mute);margin-top:4px;text-align:center">🐌 1 = sehr langsam · 🐇 10 = schnell</div>'
    +'</div>'
    /* Sprache */
    +'<div class="group"><h3>🌐 <span data-i18n="language">Sprache</span></h3>'
    +'<div class="lang-grid">'
    +Object.keys(LANGS).map(function(k){
      return '<div class="lang-card'+(s.lang===k?" active":"")+'" data-lang="'+k+'"><span class="flag">'+LANGS[k].flag+'</span><div class="name">'+esc(LANGS[k].name)+'</div></div>';
    }).join("")
    +'</div></div>'
    /* Voice */
    +'<div class="group"><h3>🔊 <span data-i18n="voice">Stimme</span></h3>'
    +'<div id="voiceList"></div>'
    +'<div class="row"><div class="lbl">Vorlesen bei Antworten <small>AI liest Antworten laut vor</small></div><div class="sw'+(s.autoSpeak?" on":"")+'" id="autoSpeakSw"></div></div>'
    +'<div style="margin-top:8px"><label style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px;display:block">Sprechgeschwindigkeit: <span id="ttsRateVal">'+(s.ttsRate||0.95)+'</span></label><input type="range" id="ttsRate" min="0.5" max="1.5" step="0.05" value="'+(s.ttsRate||0.95)+'" style="width:100%;accent-color:var(--p1)"></div>'
    +'<button class="btn sec full" id="testVoice" style="margin-top:8px">🔊 Stimme testen</button>'
    +'</div>'
    /* CYBORG */
    +'<div class="group"><h3>⚡ CYBORG</h3><div class="row"><div class="lbl">CYBORG Design <small>Pink/Violett</small></div><div class="sw'+(s.cyborg?" on":"")+'" id="cyborgSw"></div></div></div>'
    /* Name */
    +'<div class="group"><h3>👤 Profil</h3><div class="row"><div class="lbl">Dein Name</div><input type="text" id="userNameInput" value="'+esc(s.userName||"Bruder")+'"></div></div>'
    /* Daten */
    +'<div class="group"><h3>💾 <span data-i18n="data">Daten</span></h3>'
    +'<button class="btn sec full" id="exportBtn">📤 Backup exportieren</button>'
    +'<button class="btn danger full" id="resetBtn" style="margin-top:8px">🗑️ Alles zurücksetzen</button>'
    +'</div>';

  /* Bind events */
  $("settingsBody").querySelectorAll("[data-theme]").forEach(function(el){
    el.addEventListener("click",function(){Settings.set("theme",el.dataset.theme);toast("🎨 "+el.dataset.theme,"ok");});
  });
  $("settingsBody").querySelectorAll("[data-lang]").forEach(function(el){
    el.addEventListener("click",function(){Settings.set("lang",el.dataset.lang);toast("🌐 "+LANGS[el.dataset.lang].name,"ok");});
  });
  var gs=$("globalSpeed");
  if(gs)gs.addEventListener("input",function(){
    Settings.set("speed",parseInt(this.value));
    $("speedVal").textContent=this.value+"×";
  });
  var csw=$("cyborgSw");
  if(csw)csw.addEventListener("click",function(){Settings.set("cyborg",!Settings.get("cyborg"));toast(Settings.get("cyborg")?"⚡ CYBORG":"🤖 AI","ok");});
  var asw=$("autoSpeakSw");
  if(asw)asw.addEventListener("click",function(){Settings.set("autoSpeak",!Settings.get("autoSpeak"));asw.classList.toggle("on");});
  var ttsr=$("ttsRate");
  if(ttsr)ttsr.addEventListener("input",function(){
    Settings.set("ttsRate",parseFloat(this.value));
    $("ttsRateVal").textContent=this.value;
  });
  var tv=$("testVoice");
  if(tv)tv.addEventListener("click",function(){Voice.speak("Silav! Ich bin HalDo und spreche in "+LANGS[Settings.get("lang")].name);});
  var ui=$("userNameInput");
  if(ui)ui.addEventListener("input",function(){
    Settings.set("userName",this.value);
  });
  var eb=$("exportBtn");
  if(eb)eb.addEventListener("click",function(){
    var data={};Storage.keys().forEach(function(k){data[k]=Storage.get(k);});
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="haldo_backup.json";a.click();
  });
  var rb=$("resetBtn");
  if(rb)rb.addEventListener("click",function(){
    if(!confirm("Wirklich ALLES zurücksetzen?"))return;
    Storage.clearAll();location.reload();
  });
  renderVoiceList();
}

function renderVoiceList(){
  var list=$("voiceList");if(!list)return;
  if(!window.speechSynthesis||!Voice.voices.length){
    list.innerHTML='<div style="font-size:11px;color:var(--text-mute);padding:8px">Stimmen werden geladen… Klick nochmal auf Einstellungen.</div>';
    return;
  }
  var s=Settings.get("voice")||"";
  var voices=Voice.voices.filter(function(v){return v.lang&&v.lang.indexOf("-")>0;});
  if(voices.length>30)voices=voices.slice(0,30);
  list.innerHTML='<div class="voice-item'+(s===""?" active":"")+'" data-voice="">'
    +'<span class="ico">🌍</span><span class="nm">Automatisch</span><span class="info">Beste für Sprache</span></div>'
    +voices.map(function(v){
      return '<div class="voice-item'+(s===v.name?" active":"")+'" data-voice="'+esc(v.name)+'">'
        +'<span class="ico">'+(v.name.toLowerCase().indexOf("female")>=0?"👩":v.name.toLowerCase().indexOf("male")>=0?"👨":"🔊")+'</span>'
        +'<span class="nm">'+esc(v.name)+'</span><span class="info">'+esc(v.lang)+'</span></div>';
    }).join("");
  list.querySelectorAll("[data-voice]").forEach(function(el){
    el.addEventListener("click",function(){
      Settings.set("voice",el.dataset.voice);
      toast("🔊 Stimme gewählt","ok");
      Voice.speak("Test");
    });
  });
}

/* ═══════════ INIT ═══════════ */
function boot(){
  Settings.load();
  Voice.load();
  Settings.apply();
  BG.init();
  BG.setTheme(Settings.get("theme"),Settings.get("speed"));
  renderSidebar();
  renderFilters();
  renderApps();

  var h=new Date().getHours();
  $("greeting").textContent=h<6?"Gute Nacht":h<11?"Guten Morgen":h<17?"Guten Tag":h<22?"Guten Abend":"Gute Nacht";

  $("logoBtn").addEventListener("click",function(){$("sidebar").classList.toggle("open");});
  $("settingsBtn").addEventListener("click",function(){renderSettingsPanel();$("settings").classList.add("show");});
  $("settingsClose").addEventListener("click",function(){$("settings").classList.remove("show");});
  $("settings").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show");});
  $("themeToggle").addEventListener("click",function(){
    var o=["kosmos","erde","holo"];
    var cur=Settings.get("theme");
    var n=o[(o.indexOf(cur)+1)%o.length];
    Settings.set("theme",n);
    toast("🎨 "+(n==="kosmos"?"Kosmos":n==="erde"?"Erde":"Holo"),"ok");
  });
  $("langBtn").addEventListener("click",function(){renderSettingsPanel();$("settings").classList.add("show");});

  $("appSearch").addEventListener("input",function(){
    HomeState.search=this.value;
    renderApps();
  });

  $("bbChat").addEventListener("click",function(){Chat.open();});
  $("bbAI").addEventListener("click",function(){Windows.open("chat");Chat.open();});
  $("bbCyborg").addEventListener("click",function(){Settings.set("cyborg",!Settings.get("cyborg"));toast(Settings.get("cyborg")?"⚡ CYBORG":"🤖 AI","ok");});

  $("chatClose").addEventListener("click",function(){Chat.close();});
  $("chatSend").addEventListener("click",function(){Chat.send();});
  $("chatInput").addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();Chat.send();}
  });
  $("chatInput").addEventListener("input",function(){
    this.style.height="42px";
    this.style.height=Math.min(120,this.scrollHeight)+"px";
  });
  $("chatMic").addEventListener("click",function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast("⚠️ Spracherkennung n/a","err");return;}
    var rec=new SR();
    rec.lang={de:"de-DE",ku:"tr-TR",ez:"tr-TR",ar:"ar-SA",tr:"tr-TR",en:"en-US"}[Settings.get("lang")]||"de-DE";
    var self=this;self.classList.add("on");
    rec.onresult=function(e){Chat.send(e.results[0][0].transcript);};
    rec.onend=function(){self.classList.remove("on");};
    rec.onerror=function(){self.classList.remove("on");};
    rec.start();
  });
  $("chatSpeaker").addEventListener("click",function(){
    var last=Chat.history.slice().reverse().find(function(m){return m.r==="bot";});
    if(last)Voice.speak(last.t);
    else Voice.speak("Noch keine Antwort.");
  });
  document.querySelectorAll("[data-quick]").forEach(function(b){
    b.addEventListener("click",function(){Chat.send(b.dataset.quick);});
  });

  $("appSetClose").addEventListener("click",function(){AppSettings.close();});
  $("appSettings").addEventListener("click",function(e){if(e.target===this)AppSettings.close();});

  window.HalDo={Storage:Storage,Settings:Settings,Windows:Windows,AppSettings:AppSettings,APPS:APPS,MODULES:MODULES,Chat:Chat,Voice:Voice,LANGS:LANGS,I18N_DATA:I18N_DATA,EZIDI_ALPHABET:EZIDI_ALPHABET,toast:toast,version:"v126"};

  console.log("🦚 HalDo AI OS v126 gestartet");
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();

})();
</script>
