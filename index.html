<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS – Professionelle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.6' stop-color='%2300e5ff'/%3E%3Cstop offset='1' stop-color='%23003366'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='40' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --primary:#00e5ff;--primary-rgb:0,229,255;
  --secondary:#4da8ff;--accent:#b478ff;
  --gold:#ffd700;--gold-rgb:255,215,0;
  --bg-0:#01010a;--bg-1:#050520;
  --panel:rgba(8,15,35,0.68);--panel-2:rgba(15,28,60,0.82);
  --border:rgba(0,229,255,0.35);--border-strong:rgba(0,229,255,0.7);
  --text:#e8f6ff;--text-dim:#7fa5d0;
  --glow-sm:0 0 14px rgba(0,229,255,0.5);
  --glow-md:0 0 28px rgba(0,229,255,0.55);
  --glow-lg:0 0 55px rgba(0,229,255,0.4);
  --blur:28px;--radius-w:20px;--radius-b:14px;
  --sidebar-w:230px;--topbar-h:56px;
  --ease:cubic-bezier(.4,.14,.3,1);
}

/* ═══ THEMES ═══ */
[data-theme="cyborg"]{--primary:#ff78c8;--primary-rgb:255,120,200;--secondary:#b478ff;--accent:#ff78c8;--border:rgba(255,120,200,.4);--border-strong:rgba(255,120,200,.8);--glow-sm:0 0 14px rgba(255,120,200,.55);--glow-md:0 0 28px rgba(255,120,200,.6);--glow-lg:0 0 55px rgba(255,120,200,.45);--bg-0:#0a0015;--bg-1:#1a0030}
[data-theme="gold"]{--primary:#ffd700;--primary-rgb:255,215,0;--secondary:#ffb300;--accent:#ff9500;--border:rgba(255,215,0,.4);--border-strong:rgba(255,215,0,.8);--glow-sm:0 0 14px rgba(255,215,0,.55);--glow-md:0 0 28px rgba(255,215,0,.6);--glow-lg:0 0 55px rgba(255,215,0,.45);--bg-0:#080600;--bg-1:#1a1200}
[data-theme="matrix"]{--primary:#00ff88;--primary-rgb:0,255,136;--secondary:#00cc66;--accent:#00ffaa;--border:rgba(0,255,136,.4);--border-strong:rgba(0,255,136,.8);--glow-sm:0 0 14px rgba(0,255,136,.55);--glow-md:0 0 28px rgba(0,255,136,.6);--glow-lg:0 0 55px rgba(0,255,136,.45);--bg-0:#000600;--bg-1:#001408}
[data-theme="crimson"]{--primary:#ff3355;--primary-rgb:255,51,85;--secondary:#ff6644;--accent:#ff0055;--border:rgba(255,51,85,.4);--border-strong:rgba(255,51,85,.8);--glow-sm:0 0 14px rgba(255,51,85,.55);--glow-md:0 0 28px rgba(255,51,85,.6);--glow-lg:0 0 55px rgba(255,51,85,.45);--bg-0:#0a0005;--bg-1:#200008}
[data-theme="sunset"]{--primary:#ff9900;--primary-rgb:255,153,0;--secondary:#ff5599;--accent:#ffcc00;--border:rgba(255,153,0,.4);--border-strong:rgba(255,153,0,.8);--glow-sm:0 0 14px rgba(255,153,0,.55);--glow-md:0 0 28px rgba(255,153,0,.6);--glow-lg:0 0 55px rgba(255,153,0,.45);--bg-0:#0a0500;--bg-1:#201000}
[data-theme="ice"]{--primary:#aee0ff;--primary-rgb:174,224,255;--secondary:#e6f7ff;--accent:#cceeff;--border:rgba(174,224,255,.45);--border-strong:rgba(174,224,255,.85);--glow-sm:0 0 14px rgba(174,224,255,.55);--glow-md:0 0 28px rgba(174,224,255,.6);--glow-lg:0 0 55px rgba(174,224,255,.45);--bg-0:#000814;--bg-1:#001e3c;--text:#f4fbff;--text-dim:#9ac9e0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  background:var(--bg-0);color:var(--text);height:100vh;overflow:hidden;
  user-select:none;-webkit-font-smoothing:antialiased;letter-spacing:.15px;
}

/* ═══ COSMIC CANVAS ═══ */
#cosmicBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}

/* ═══ TOPBAR ═══ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;padding-top:env(safe-area-inset-top,0);
  background:linear-gradient(180deg,rgba(8,15,35,0.85),rgba(8,15,35,0.6));
  backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border-bottom:1px solid var(--border);
  box-shadow:0 8px 32px rgba(0,0,0,.4);
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .3s var(--ease)}
.brand:active{transform:scale(.96)}
.brand-logo{
  width:38px;height:38px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0%,transparent 40%),
    radial-gradient(circle at 70% 70%,var(--accent),var(--primary) 45%,var(--secondary) 75%,#002040 100%);
  box-shadow:
    0 0 20px rgba(var(--primary-rgb),.7),
    0 0 40px rgba(var(--primary-rgb),.4),
    inset -4px -4px 12px rgba(0,0,0,.5),
    inset 4px 4px 12px rgba(255,255,255,.2);
  animation:logoFloat 4s ease-in-out infinite;
  position:relative;
}
.brand-logo::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1.5px solid transparent;
  border-top-color:var(--primary);border-right-color:var(--accent);
  animation:spinRing 6s linear infinite;
}
.brand-logo::before{
  content:"";position:absolute;inset:-12px;border-radius:50%;
  border:1px dashed rgba(var(--primary-rgb),.4);
  animation:spinRing 12s linear infinite reverse;
}
@keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.04)}}
@keyframes spinRing{to{transform:rotate(360deg)}}

.brand-name{
  font-size:17px;font-weight:800;letter-spacing:.3px;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent),var(--primary));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 6s linear infinite;
}
.brand-sub{font-size:9px;color:var(--text-dim);letter-spacing:3px;margin-top:-1px;font-weight:600}
@keyframes shimmer{to{background-position:-300% 0}}

.topbar-right{display:flex;align-items:center;gap:8px}
.tb-btn{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.08),rgba(var(--primary-rgb),.02));
  border:1.5px solid var(--border);
  color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--ease);position:relative;overflow:hidden;
}
.tb-btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent,rgba(var(--primary-rgb),.2),transparent);
  transform:translateX(-100%);transition:transform .4s;
}
.tb-btn:hover::before{transform:translateX(100%)}
.tb-btn:hover{
  background:rgba(var(--primary-rgb),.15);
  box-shadow:var(--glow-sm),inset 0 0 12px rgba(var(--primary-rgb),.15);
  transform:translateY(-1px);
}
.tb-btn:active{transform:scale(.92)}
.tb-clock{
  font-family:"SF Mono",ui-monospace,monospace;
  font-size:14px;color:var(--primary);padding:0 14px;
  font-weight:700;letter-spacing:1px;
  text-shadow:0 0 10px rgba(var(--primary-rgb),.7);
  background:rgba(var(--primary-rgb),.08);
  border-radius:10px;height:32px;display:flex;align-items:center;
  border:1px solid var(--border);
}

/* ═══ SIDEBAR ═══ */
#sidebar{
  position:fixed;left:0;top:var(--topbar-h);bottom:0;width:var(--sidebar-w);z-index:900;
  background:linear-gradient(180deg,rgba(8,15,35,0.88),rgba(8,15,35,0.72));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border-right:1.5px solid var(--border);
  padding:14px 10px;overflow-y:auto;overflow-x:hidden;
  transition:transform .35s var(--ease);
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
  box-shadow:inset -8px 0 24px rgba(0,0,0,.2);
}
#sidebar.collapsed{transform:translateX(-100%)}
.side-section{margin-bottom:16px}
.side-label{
  font-size:9px;color:var(--text-dim);letter-spacing:2.5px;
  text-transform:uppercase;padding:8px 12px;font-weight:800;
  opacity:.7;
}
.side-btn{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px;margin:2px 0;border-radius:12px;
  background:transparent;border:1px solid transparent;
  color:var(--text);font-size:13px;font-weight:500;cursor:pointer;
  transition:all .25s var(--ease);text-align:left;
  min-height:42px;
}
.side-btn:hover{
  background:linear-gradient(90deg,rgba(var(--primary-rgb),.14),rgba(var(--primary-rgb),.03));
  border-color:var(--border);
  box-shadow:var(--glow-sm),inset 0 0 12px rgba(var(--primary-rgb),.08);
  transform:translateX(2px);
}
.side-btn:active{transform:scale(.97) translateX(2px)}
.side-btn .ico{font-size:17px;width:24px;text-align:center;filter:drop-shadow(0 0 4px rgba(var(--primary-rgb),.4))}
.side-btn .badge{margin-left:auto;font-size:9px;background:var(--primary);color:#000;padding:2px 7px;border-radius:9px;font-weight:800}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}
#sidebar::-webkit-scrollbar-track{background:transparent}

/* ═══ DESKTOP ═══ */
#desktop{
  position:fixed;inset:var(--topbar-h) 0 0 var(--sidebar-w);
  z-index:1;overflow:hidden;transition:left .35s var(--ease);
}
#desktop.full{left:0}

/* ═══ WINDOWS ═══ */
.window{
  position:absolute;min-width:340px;min-height:240px;
  background:linear-gradient(135deg,rgba(8,15,35,0.75),rgba(8,15,35,0.62));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1.5px solid var(--border);border-radius:var(--radius-w);
  box-shadow:
    0 20px 60px rgba(0,0,0,.55),
    0 0 40px rgba(var(--primary-rgb),.12),
    inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;
  z-index:200;overflow:hidden;
  animation:winOpen .35s var(--ease);
}
.window::before{
  content:"";position:absolute;inset:0;border-radius:var(--radius-w);
  padding:1.5px;
  background:linear-gradient(135deg,var(--primary),transparent 40%,transparent 60%,var(--accent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;opacity:.6;
}
.window.active{
  border-color:var(--border-strong);
  box-shadow:
    0 20px 70px rgba(0,0,0,.65),
    0 0 60px rgba(var(--primary-rgb),.35),
    inset 0 1px 0 rgba(255,255,255,.12);
  z-index:250;
}
@keyframes winOpen{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.win-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;cursor:grab;user-select:none;
  background:linear-gradient(90deg,rgba(var(--primary-rgb),.14),rgba(var(--primary-rgb),.02));
  border-bottom:1.5px solid var(--border);
  min-height:46px;
}
.win-header.dragging{cursor:grabbing}
.win-title{font-size:13px;font-weight:700;flex:1;padding-left:4px;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-controls{display:flex;gap:6px}
.win-ctrl{
  width:34px;height:34px;min-width:34px;min-height:34px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--text);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--ease);position:relative;z-index:999999;font-weight:600;
}
.win-ctrl:hover{background:rgba(var(--primary-rgb),.25);box-shadow:var(--glow-sm);transform:scale(1.05)}
.win-ctrl.close:hover{background:rgba(255,60,80,.7);border-color:rgba(255,60,80,.9);box-shadow:0 0 14px rgba(255,60,80,.7)}
.win-body{
  flex:1;padding:16px;overflow:auto;
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
  font-size:13px;line-height:1.55;
}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px;box-shadow:inset 0 0 8px rgba(0,0,0,.3)}

/* ═══ BUTTONS / INPUTS ═══ */
.btn{
  min-height:42px;padding:10px 18px;border-radius:var(--radius-b);
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.2),rgba(var(--primary-rgb),.05));
  border:1.5px solid var(--border);color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .25s var(--ease);
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  letter-spacing:.2px;
}
.btn:hover{
  background:rgba(var(--primary-rgb),.3);
  box-shadow:var(--glow-sm);
  transform:translateY(-1.5px);
  border-color:var(--border-strong);
}
.btn:active{transform:scale(.96)}
.btn.primary{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#000;border-color:transparent;
  box-shadow:0 4px 14px rgba(var(--primary-rgb),.4);
}
.btn.primary:hover{box-shadow:0 6px 20px rgba(var(--primary-rgb),.6);filter:brightness(1.1)}
.btn.gold{
  background:linear-gradient(135deg,var(--gold),#ffaa00);
  color:#000;border-color:transparent;
  box-shadow:0 4px 14px rgba(var(--gold-rgb),.4);
}

.input,textarea,select{
  width:100%;min-height:42px;padding:10px 14px;border-radius:var(--radius-b);
  background:rgba(0,0,0,.35);
  border:1.5px solid var(--border);
  color:var(--text);font-size:13px;font-family:inherit;
  transition:all .25s var(--ease);outline:none;letter-spacing:.1px;
}
.input:focus,textarea:focus,select:focus{
  border-color:var(--primary);
  box-shadow:0 0 20px rgba(var(--primary-rgb),.35),inset 0 0 8px rgba(var(--primary-rgb),.1);
  background:rgba(0,0,0,.5);
}
textarea{min-height:100px;resize:vertical;font-family:inherit}

.toggle{position:relative;display:inline-block;width:50px;height:28px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{
  position:absolute;inset:0;border-radius:14px;
  background:rgba(0,0,0,.55);
  border:1.5px solid var(--border);
  cursor:pointer;transition:.3s var(--ease);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
}
.toggle .slider::before{
  content:"";position:absolute;height:20px;width:20px;left:2px;top:2px;
  background:linear-gradient(135deg,#888,#aaa);
  border-radius:50%;transition:.3s var(--ease);
  box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.toggle input:checked + .slider{
  background:rgba(var(--primary-rgb),.45);
  border-color:var(--primary);
  box-shadow:0 0 18px rgba(var(--primary-rgb),.5),inset 0 0 8px rgba(var(--primary-rgb),.2);
}
.toggle input:checked + .slider::before{
  transform:translateX(22px);
  background:linear-gradient(135deg,var(--primary),#fff);
  box-shadow:0 0 12px var(--primary);
}

.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;
  padding:6px 14px;border-radius:18px;
  background:rgba(255,255,255,.05);
  border:1.5px solid var(--border);
  color:var(--text);font-size:11px;font-weight:600;
  cursor:pointer;transition:all .25s var(--ease);
  letter-spacing:.2px;
}
.chip:hover,.chip.on{
  background:rgba(var(--primary-rgb),.28);
  border-color:var(--primary);
  box-shadow:var(--glow-sm);
  transform:translateY(-1px);
}

/* ═══ SETTINGS ═══ */
.set-section{
  border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;
  background:linear-gradient(135deg,rgba(0,0,0,.25),rgba(var(--primary-rgb),.03));
  transition:all .3s var(--ease);
}
.set-section:hover{border-color:var(--border-strong)}
.set-head{
  display:flex;align-items:center;gap:11px;
  padding:13px 15px;cursor:pointer;user-select:none;
  background:rgba(var(--primary-rgb),.04);
  transition:background .2s;
}
.set-head:hover{background:rgba(var(--primary-rgb),.1)}
.set-head .letter{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#000;font-weight:900;font-size:13px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(var(--primary-rgb),.4);
}
.set-head .title{flex:1;font-size:13px;font-weight:700;letter-spacing:.2px}
.set-head .chev{transition:transform .3s var(--ease);color:var(--primary);font-size:11px}
.set-section.open .chev{transform:rotate(180deg)}
.set-body{display:none;padding:10px 15px 15px}
.set-section.open .set-body{display:block}
.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);min-height:46px;
}
.set-row:last-child{border-bottom:none}
.set-row-label{flex:1;font-size:12px;color:var(--text);font-weight:500}
.set-row-label small{display:block;color:var(--text-dim);font-size:10px;margin-top:3px}
.set-row .val{font-size:11px;color:var(--primary);font-weight:700;min-width:44px;text-align:right}
input[type=range]{width:110px;accent-color:var(--primary);height:24px;cursor:pointer}

/* ═══ TOASTS ═══ */
#toasts{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
  z-index:5000;display:flex;flex-direction:column;gap:9px;align-items:center;
  pointer-events:none;max-width:min(90vw,420px);
}
.toast{
  background:linear-gradient(135deg,rgba(8,15,35,0.9),rgba(8,15,35,0.78));
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1.5px solid var(--primary);border-radius:14px;
  padding:12px 18px;
  box-shadow:var(--glow-md),0 8px 30px rgba(0,0,0,.5);
  font-size:12px;font-weight:600;color:var(--text);
  animation:toastIn .35s var(--ease);
  pointer-events:auto;
  display:flex;align-items:center;gap:10px;
  letter-spacing:.2px;
}
@keyframes toastIn{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.toast.out{animation:toastOut .35s var(--ease) forwards}
@keyframes toastOut{to{transform:translateY(-24px) scale(.9);opacity:0}}

/* ═══ AVATAR FAB ═══ */
#avatarFab{
  position:fixed;bottom:22px;right:22px;z-index:800;
  width:74px;height:74px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 50%),
    radial-gradient(circle,var(--primary) 0%,var(--secondary) 55%,var(--accent) 100%);
  border:2px solid var(--border-strong);
  box-shadow:
    0 0 30px rgba(var(--primary-rgb),.65),
    0 0 60px rgba(var(--primary-rgb),.35),
    inset 0 -4px 12px rgba(0,0,0,.4),
    inset 0 4px 12px rgba(255,255,255,.3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:34px;transition:all .3s var(--ease);
  animation:breathe 3.5s ease-in-out infinite;
  padding-bottom:env(safe-area-inset-bottom,0);
}
#avatarFab:hover{
  transform:scale(1.1);
  box-shadow:0 0 40px rgba(var(--primary-rgb),.85),0 0 80px rgba(var(--primary-rgb),.5);
}
#avatarFab:active{transform:scale(.95)}
#avatarFab::before{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:1.5px solid var(--border-strong);
  animation:pulseRing 2.5s ease-out infinite;
}
#avatarFab::after{
  content:"";position:absolute;inset:-18px;border-radius:50%;
  border:1px dashed rgba(var(--primary-rgb),.4);
  animation:spinRing 10s linear infinite;
}
@keyframes breathe{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.06) translateY(-2px)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}
#avatarFab.speaking::before{border-color:var(--gold);animation:pulseRing .6s ease-out infinite;box-shadow:0 0 20px var(--gold)}

/* ═══ CHAT ═══ */
.chat-container{display:flex;flex-direction:column;height:100%;min-height:380px}
.chat-messages{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin}
.chat-msg{
  padding:10px 14px;border-radius:16px;max-width:85%;
  font-size:13px;line-height:1.5;animation:msgIn .35s var(--ease);
  word-wrap:break-word;letter-spacing:.15px;
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#001;border-bottom-right-radius:6px;
  box-shadow:0 4px 12px rgba(var(--primary-rgb),.3);
  font-weight:500;
}
.chat-msg.ai{
  align-self:flex-start;
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.15),rgba(var(--primary-rgb),.05));
  border:1px solid var(--border);border-bottom-left-radius:6px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.chat-msg.system{
  align-self:center;background:rgba(255,215,0,.1);
  border:1px solid var(--gold);color:var(--gold);
  font-size:11px;padding:6px 14px;text-align:center;font-weight:600;
}
.chat-input-row{
  display:flex;gap:7px;padding-top:12px;
  border-top:1px solid var(--border);
}
.chat-input-row input{flex:1}
.chat-input-row .btn{min-width:46px;padding:10px 13px}

/* ═══ APP GRID ═══ */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:11px}
.app-tile{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:13px 6px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(var(--primary-rgb),.02));
  border:1.5px solid var(--border);
  cursor:pointer;transition:all .3s var(--ease);text-align:center;
}
.app-tile:hover{
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.18),rgba(var(--primary-rgb),.06));
  box-shadow:var(--glow-sm);transform:translateY(-3px) scale(1.02);
  border-color:var(--primary);
}
.app-tile:active{transform:scale(.95)}
.app-tile .ic{font-size:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.app-tile .nm{font-size:10px;color:var(--text);line-height:1.25;word-break:break-word;font-weight:500}

/* ═══ SPLASH ═══ */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(circle at center,#050520,#000008);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;transition:opacity .8s var(--ease);
}
#splash.hide{opacity:0;pointer-events:none}
#splash .orbit-container{
  position:relative;width:180px;height:180px;
  display:flex;align-items:center;justify-content:center;
}
#splash .splash-logo{
  width:110px;height:110px;border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0%,transparent 45%),
    radial-gradient(circle at 70% 70%,var(--accent),var(--primary) 40%,var(--secondary) 75%,#001a3a);
  box-shadow:
    0 0 80px rgba(var(--primary-rgb),.9),
    0 0 140px rgba(var(--primary-rgb),.5),
    inset -8px -8px 24px rgba(0,0,0,.6),
    inset 8px 8px 24px rgba(255,255,255,.25);
  animation:pulseLogo 2.5s ease-in-out infinite;
}
#splash .orbit-container::before,
#splash .orbit-container::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid var(--border-strong);
  animation:spinRing 5s linear infinite;
}
#splash .orbit-container::after{
  inset:-20px;border-style:dashed;opacity:.5;
  animation:spinRing 10s linear infinite reverse;
}
@keyframes pulseLogo{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#splash h1{
  font-size:28px;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent),var(--primary));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:3px;text-align:center;font-weight:900;
  animation:shimmer 4s linear infinite;
}
#splash p{color:var(--text-dim);font-size:13px;letter-spacing:1.5px;text-align:center;max-width:90vw;font-weight:500}
#splash .credit{
  color:var(--gold);font-size:11px;letter-spacing:3px;margin-top:8px;
  font-weight:700;text-shadow:0 0 12px rgba(var(--gold-rgb),.6);
}

/* ═══ MISC ═══ */
.hidden{display:none!important}
.win-body h3{color:var(--primary);font-size:14px;margin-bottom:11px;margin-top:14px;letter-spacing:.4px;font-weight:700}
.win-body h3:first-child{margin-top:0}
.win-body p{margin-bottom:9px;color:var(--text-dim);font-size:12px;line-height:1.65}
.win-body code{background:rgba(0,0,0,.45);padding:2px 7px;border-radius:5px;font-size:11px;color:var(--primary);font-family:"SF Mono",monospace}
.list-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(var(--primary-rgb),.02));
  margin-bottom:7px;border:1px solid var(--border);
  transition:all .2s var(--ease);
}
.list-item:hover{background:rgba(var(--primary-rgb),.1);border-color:var(--border-strong)}
.list-item .txt{flex:1;font-size:12px}

@media(max-width:640px){
  :root{--sidebar-w:210px;--topbar-h:52px}
  #desktop{left:0}
  #desktop:not(.full){left:0}
  .window{min-width:290px;max-width:96vw}
  #avatarFab{width:64px;height:64px;font-size:28px;bottom:18px;right:18px}
  .tb-clock{font-size:12px;padding:0 10px}
}
</style>

<script>
'use strict';
const HalDo = window.HalDo = {};
HalDo.version = 'v126 Premium';

/* ═══════════ SOUND ═══════════ */
HalDo.Sound = (() => {
  let ctx;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; };
  const beep = (freq, dur, type='sine', vol=.15) => {
    try {
      const c = ensure();
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime + dur);
      o.connect(g).connect(c.destination);
      o.start(); o.stop(c.currentTime + dur);
    } catch(e){}
  };
  const S = {
    click:()=>beep(880,.05,'sine',.08),
    notify:()=>{beep(660,.1);setTimeout(()=>beep(880,.1),80);setTimeout(()=>beep(1100,.15),160);},
    success:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*70)),
    error:()=>{beep(220,.2,'sawtooth',.15);setTimeout(()=>beep(165,.25,'sawtooth',.15),150);},
    warning:()=>{beep(440,.15,'square',.12);setTimeout(()=>beep(440,.15,'square',.12),200);},
    message:()=>{beep(1000,.08);setTimeout(()=>beep(1300,.12),90);},
    complete:()=>[784,988,1319].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*100)),
    alarm:()=>{for(let i=0;i<3;i++){setTimeout(()=>beep(1200,.15,'square',.2),i*200);setTimeout(()=>beep(900,.15,'square',.2),i*200+100);}},
    ring:()=>{for(let i=0;i<4;i++)setTimeout(()=>beep(1800,.05,'sine',.15),i*80);},
    horn:()=>{beep(400,.4,'sawtooth',.2);setTimeout(()=>beep(500,.4,'sawtooth',.2),100);},
    laser:()=>{beep(2000,.05);setTimeout(()=>beep(1000,.05),40);setTimeout(()=>beep(500,.08),80);}
  };
  return { play:(n)=>{try{(S[n]||S.click)()}catch(e){}} };
})();

/* ═══════════ TOAST ═══════════ */
HalDo.Toast = (() => {
  const c = document.getElementById('toasts');
  return {
    show(msg, o={}) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span style="font-size:18px">${o.icon||'✨'}</span><span>${msg}</span>`;
      c.appendChild(t);
      if (o.sound) HalDo.Sound.play(o.sound);
      setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(), 350); }, o.duration||3000);
    }
  };
})();

/* ═══════════════════════════════════════════════════════
   REALISTISCHER KOSMOS
   ═══════════════════════════════════════════════════════ */
HalDo.Cosmos = (() => {
  const canvas = document.getElementById('cosmicBg');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W, H, cx, cy, t = 0;
  let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
  
  const stars = [], planets = [], shooting = [];
  const starCount = 365;
  
  // Planeten-Definitionen
  const planetDefs = [
    { name:'Merkur', type:'rocky', color:'#8a7d6b', color2:'#5a4f42', size:3,  dist:0.18, speed:0.65, seed:1 },
    { name:'Venus',  type:'rocky', color:'#e8c88a', color2:'#a88040', size:4.5,dist:0.26, speed:0.5,  seed:2 },
    { name:'Erde',   type:'earth', size:6,  dist:0.34, speed:0.4, seed:3 },
    { name:'Mars',   type:'mars',  color:'#c1440e', color2:'#8a2f0a', size:4, dist:0.42, speed:0.32, seed:4 },
    { name:'Jupiter',type:'gas',   color:'#e0c090', color2:'#8a6040', size:10, dist:0.54, speed:0.22, seed:5 },
    { name:'Saturn', type:'saturn',color:'#e8d5a0', color2:'#a07840', size:8.5,dist:0.65, speed:0.17, ring:true, seed:6 },
    { name:'Uranus', type:'ice',   color:'#7de0e0', color2:'#3a8080', size:6, dist:0.75, speed:0.13, seed:7 },
    { name:'Neptun', type:'ice',   color:'#3355ee', color2:'#0a1a6a', size:5.5,dist:0.83, speed:0.10, seed:8 },
    { name:'Pluto',  type:'rocky', color:'#b08860', color2:'#5a4020', size:2.5,dist:0.90, speed:0.07, seed:9 },
    { name:'Xena',   type:'rocky', color:'#8866aa', color2:'#4a2a6a', size:2.8,dist:0.96, speed:0.05, seed:10 },
    { name:'Sedna',  type:'rocky', color:'#9977cc', color2:'#4a3a7a', size:3,  dist:1.03, speed:0.04, seed:11 },
    { name:'Eris',   type:'rocky', color:'#aaccff', color2:'#5070a0', size:3.2,dist:1.10, speed:0.03, seed:12 }
  ];
  
  const nebulas = [
    { x:.15, y:.25, r:.42, c1:'rgba(180,60,255,0.14)', c2:'rgba(80,0,140,0)' },
    { x:.85, y:.55, r:.5,  c1:'rgba(0,150,255,0.12)', c2:'rgba(0,50,150,0)' },
    { x:.5,  y:.85, r:.38, c1:'rgba(255,60,180,0.10)', c2:'rgba(120,0,80,0)' },
    { x:.7,  y:.15, r:.35, c1:'rgba(255,200,80,0.08)', c2:'rgba(120,80,0,0)' }
  ];
  
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = window.innerWidth * dpr;
    H = canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    cx = W / 2; cy = H / 2;
    ctx.setTransform(1,0,0,1,0,0);
  };
  
  const init = () => {
    stars.length = 0;
    for (let i = 0; i < starCount; i++) {
      const bright = Math.random();
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: (Math.random() * 1.3 + 0.3) * (bright > .9 ? 1.8 : 1),
        a: Math.random(),
        da: (Math.random() * .015 + .002) * (Math.random() < .5 ? 1 : -1),
        bright,
        hue: Math.random() < .1 ? { r:255, g:215, b:0 } :
             Math.random() < .25 ? { r:180, g:140, b:255 } :
             Math.random() < .5 ? { r:200, g:240, b:255 } :
             { r:255, g:255, b:255 }
      });
    }
    
    planets.length = 0;
    const minDim = Math.min(W, H);
    planetDefs.forEach((p, i) => {
      const baseSize = Math.max((minDim / 900) * p.size, 2.2);
      planets.push({
        ...p,
        sizePx: baseSize,
        angle: Math.random() * Math.PI * 2,
        angleSpeed: p.speed * 0.0009,
        orbitR: minDim * (0.08 + p.dist * 0.30),
        rot: Math.random() * Math.PI * 2,
        moons: p.name === 'Erde' ? [{ dist: 3.5, size: .32, speed: .012, angle: 0, color:'#d4d4d4' }] :
               p.name === 'Jupiter' ? [
                 { dist: 1.8, size: .18, speed: .02, angle: Math.random()*6, color:'#e0d0c0' },
                 { dist: 2.2, size: .16, speed: .016, angle: Math.random()*6, color:'#c0c0a0' },
                 { dist: 2.7, size: .19, speed: .012, angle: Math.random()*6, color:'#b0b0a0' },
                 { dist: 3.2, size: .17, speed: .009, angle: Math.random()*6, color:'#a0a090' }
               ] : []
      });
    });
  };
  
  /* ---- Sonne ---- */
  const drawSun = () => {
    const sunSize = Math.min(W, H) * 0.045;
    
    // Outer massive corona
    for (let layer = 5; layer >= 0; layer--) {
      const r = sunSize * (1.6 + layer * 0.9);
      const grd = ctx.createRadialGradient(cx, cy, sunSize * 0.5, cx, cy, r);
      const alpha = 0.06 + (5 - layer) * 0.025;
      grd.addColorStop(0, `rgba(255,200,100,${alpha * 1.8})`);
      grd.addColorStop(0.4, `rgba(255,140,40,${alpha * 1.2})`);
      grd.addColorStop(0.75, `rgba(255,90,10,${alpha * 0.6})`);
      grd.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    }
    
    // Corona-Strahlen (rotierend)
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t * 0.00015);
    for (let i = 0; i < 20; i++) {
      ctx.rotate(Math.PI / 10);
      const len = sunSize * (1.6 + Math.sin(i * 1.7 + t * 0.003) * 0.5);
      const ray = ctx.createLinearGradient(0, 0, 0, -len);
      ray.addColorStop(0, 'rgba(255,220,140,0.55)');
      ray.addColorStop(0.3, 'rgba(255,180,60,0.3)');
      ray.addColorStop(0.7, 'rgba(255,120,20,0.1)');
      ray.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = ray;
      ctx.beginPath();
      ctx.moveTo(-sunSize * 0.35, 0);
      ctx.lineTo(0, -len);
      ctx.lineTo(sunSize * 0.35, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    
    // Sonnen-Prominenzen (Schleifen)
    ctx.strokeStyle = 'rgba(255,150,50,0.4)';
    ctx.lineWidth = sunSize * 0.08;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + t * 0.0004;
      const startX = cx + Math.cos(a) * sunSize;
      const startY = cy + Math.sin(a) * sunSize;
      const endX = cx + Math.cos(a + 0.3) * sunSize;
      const endY = cy + Math.sin(a + 0.3) * sunSize;
      const ctrlX = cx + Math.cos(a + 0.15) * sunSize * 1.5;
      const ctrlY = cy + Math.sin(a + 0.15) * sunSize * 1.5;
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
      ctx.stroke();
    }
    
    // Sonnen-Kern (Kern + Granulation)
    const core = ctx.createRadialGradient(cx - sunSize * 0.3, cy - sunSize * 0.3, 0, cx, cy, sunSize);
    core.addColorStop(0, '#fffef5');
    core.addColorStop(0.25, '#fff5a0');
    core.addColorStop(0.5, '#ffcc33');
    core.addColorStop(0.75, '#ff8800');
    core.addColorStop(1, '#dd3300');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(cx, cy, sunSize, 0, Math.PI*2); ctx.fill();
    
    // Sonnenflecken
    ctx.fillStyle = 'rgba(150,40,0,0.35)';
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + t * 0.0008;
      const d = sunSize * (0.25 + Math.sin(i * 2.3 + t * 0.0005) * 0.35);
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d, sunSize * (0.06 + Math.random() * 0.01), 0, Math.PI*2);
      ctx.fill();
    }
    
    // Bright highlight
    const hi = ctx.createRadialGradient(cx - sunSize * 0.3, cy - sunSize * 0.3, 0, cx - sunSize * 0.2, cy - sunSize * 0.2, sunSize * 0.7);
    hi.addColorStop(0, 'rgba(255,255,240,0.85)');
    hi.addColorStop(1, 'rgba(255,255,200,0)');
    ctx.fillStyle = hi;
    ctx.beginPath(); ctx.arc(cx, cy, sunSize, 0, Math.PI*2); ctx.fill();
  };
  
  /* ---- Erde ---- */
  const drawEarth = (x, y, r, rot) => {
    // Atmosphäre außen
    const atm = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 2.2);
    atm.addColorStop(0, 'rgba(120,200,255,0.5)');
    atm.addColorStop(0.4, 'rgba(80,160,240,0.2)');
    atm.addColorStop(1, 'rgba(60,140,220,0)');
    ctx.fillStyle = atm;
    ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI*2); ctx.fill();
    
    // Ozonschicht (subtiler cyan Ring)
    ctx.strokeStyle = 'rgba(140,220,255,0.4)';
    ctx.lineWidth = r * 0.08;
    ctx.beginPath(); ctx.arc(x, y, r * 1.05, 0, Math.PI*2); ctx.stroke();
    
    // Ozean-Basis
    const ocean = ctx.createRadialGradient(x - r*0.4, y - r*0.4, 0, x, y, r);
    ocean.addColorStop(0, '#6cb4ff');
    ocean.addColorStop(0.4, '#3a85d9');
    ocean.addColorStop(0.75, '#1a5599');
    ocean.addColorStop(1, '#0a2a5a');
    ctx.fillStyle = ocean;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    
    // Kontinente + Eis (rotierend)
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
    
    const rotOffset = (rot * r * 2.5) % (Math.PI * 2);
    
    // Funktion für einen Kontinent
    const drawLand = (angle, size, yOffset, color) => {
      let a = (angle + rotOffset) % (Math.PI * 2);
      if (a < 0) a += Math.PI * 2;
      const px = x + Math.cos(a) * r * 0.8;
      const py = y + yOffset * r;
      const visible = Math.cos(a) > -0.2;
      if (!visible) return;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(px, py, size * r, size * r * 0.85, angle * 0.5, 0, Math.PI*2);
      ctx.fill();
    };
    
    // Landmassen (Afrika, Europa, Asien, Amerika, Australien)
    drawLand(0.0, 0.22, -0.15, '#4a7a3a'); // Europa
    drawLand(0.0, 0.28, 0.25, '#558a40');  // Afrika
    drawLand(0.9, 0.32, -0.1, '#4a8040');  // Asien
    drawLand(0.9, 0.20, 0.35, '#3a7a3a');  // Indien
    drawLand(2.4, 0.30, -0.15, '#4a8050'); // Amerika (Nord)
    drawLand(2.4, 0.22, 0.3, '#3a7050');   // Amerika (Süd)
    drawLand(3.8, 0.18, 0.35, '#4a8040');  // Australien
    
    // Wolken (driften schneller)
    const cloudRot = rot * 1.3;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 7; i++) {
      const ca = (i / 7) * Math.PI * 2 + cloudRot;
      const cpx = x + Math.cos(ca) * r * 0.65;
      const cpy = y + Math.sin(ca * 0.7) * r * 0.7;
      if (Math.cos(ca) > -0.3) {
        ctx.beginPath();
        ctx.ellipse(cpx, cpy, r * 0.22, r * 0.08, ca, 0, Math.PI*2);
        ctx.fill();
      }
    }
    
    // Eis-Kappen
    ctx.fillStyle = 'rgba(240,248,255,0.9)';
    ctx.beginPath(); ctx.ellipse(x, y - r * 0.85, r * 0.5, r * 0.15, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.88, r * 0.4, r * 0.12, 0, 0, Math.PI*2); ctx.fill();
    
    ctx.restore();
    
    // Tag/Nacht-Terminator (Schattierung)
    const shade = ctx.createRadialGradient(x - r*0.5, y - r*0.3, 0, x, y, r * 1.1);
    shade.addColorStop(0, 'rgba(0,0,0,0)');
    shade.addColorStop(0.45, 'rgba(0,0,0,0)');
    shade.addColorStop(0.75, 'rgba(0,0,30,0.4)');
    shade.addColorStop(1, 'rgba(0,0,40,0.9)');
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    
    // Specular Highlight (Ozean-Spiegelung)
    const spec = ctx.createRadialGradient(x - r*0.45, y - r*0.45, 0, x - r*0.4, y - r*0.4, r * 0.7);
    spec.addColorStop(0, 'rgba(255,255,255,0.35)');
    spec.addColorStop(0.5, 'rgba(255,255,255,0.08)');
    spec.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = spec;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  };
  
  /* ---- Jupiter (Gasriese mit Bändern) ---- */
  const drawJupiter = (x, y, r) => {
    // Basis
    const base = ctx.createRadialGradient(x - r*0.4, y - r*0.4, 0, x, y, r);
    base.addColorStop(0, '#f5e0b8');
    base.addColorStop(0.5, '#d4b480');
    base.addColorStop(1, '#8a6040');
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    
    // Bänder
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
    const bands = [
      { y: -0.8, w: 0.15, c: 'rgba(180,140,100,0.5)' },
      { y: -0.55, w: 0.12, c: 'rgba(220,180,140,0.6)' },
      { y: -0.35, w: 0.1, c: 'rgba(160,110,80,0.5)' },
      { y: -0.15, w: 0.15, c: 'rgba(240,210,170,0.55)' },
      { y: 0.1, w: 0.12, c: 'rgba(170,120,90,0.5)' },
      { y: 0.3, w: 0.1, c: 'rgba(220,180,140,0.55)' },
      { y: 0.5, w: 0.15, c: 'rgba(180,130,100,0.5)' },
      { y: 0.75, w: 0.12, c: 'rgba(200,160,120,0.55)' }
    ];
    bands.forEach(b => {
      ctx.fillStyle = b.c;
      ctx.fillRect(x - r, y + b.y * r, r * 2, b.w * r);
    });
    
    // Großer Roter Fleck
    const spotX = x + r * 0.25;
    const spotY = y + r * 0.15;
    ctx.fillStyle = 'rgba(200,80,50,0.8)';
    ctx.beginPath();
    ctx.ellipse(spotX, spotY, r * 0.28, r * 0.16, 0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(150,50,30,0.5)';
    ctx.beginPath();
    ctx.ellipse(spotX, spotY, r * 0.18, r * 0.10, 0.3, 0, Math.PI*2);
    ctx.fill();
    
    ctx.restore();
    
    // Schatten
    const shade = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
    shade.addColorStop(0, 'rgba(255,255,255,0.2)');
    shade.addColorStop(0.6, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  };
  
  /* ---- Saturn mit Ringen ---- */
  const drawSaturn = (x, y, r, rot) => {
    // Ring hinten (halber Ring hinter Planet)
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.35);
    ctx.strokeStyle = 'rgba(232,213,160,0.5)';
    ctx.lineWidth = r * 0.35;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.2, r * 0.6, 0, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(180,150,100,0.35)';
    ctx.lineWidth = r * 0.15;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.5, r * 0.7, 0, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    
    // Planet Basis
    const base = ctx.createRadialGradient(x - r*0.4, y - r*0.4, 0, x, y, r);
    base.addColorStop(0, '#f5e8c0');
    base.addColorStop(0.5, '#d4c090');
    base.addColorStop(1, '#8a7040');
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    
    // Subtile Bänder
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
    ctx.fillStyle = 'rgba(200,170,120,0.4)';
    for (let i = -2; i <= 2; i++) {
      ctx.fillRect(x - r, y + i * r * 0.35, r * 2, r * 0.15);
    }
    ctx.restore();
    
    // Schatten
    const shade = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
    shade.addColorStop(0, 'rgba(255,255,255,0.15)');
    shade.addColorStop(0.7, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    
    // Ring vorne
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.35);
    ctx.strokeStyle = 'rgba(240,220,170,0.7)';
    ctx.lineWidth = r * 0.35;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.2, r * 0.6, 0, 0, Math.PI);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,170,120,0.5)';
    ctx.lineWidth = r * 0.15;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.5, r * 0.7, 0, 0, Math.PI);
    ctx.stroke();
    ctx.restore();
  };
  
  /* ---- Generischer Planet ---- */
  const drawPlanetBody = (p, x, y) => {
    const r = p.sizePx;
    
    if (p.type === 'earth') {
      drawEarth(x, y, r, p.rot);
      return;
    }
    if (p.name === 'Jupiter') {
      drawJupiter(x, y, r);
      return;
    }
    if (p.name === 'Saturn') {
      drawSaturn(x, y, r, p.rot);
      return;
    }
    
    // Standard Planet mit Gradient
    const base = ctx.createRadialGradient(x - r*0.4, y - r*0.4, 0, x, y, r);
    base.addColorStop(0, p.color);
    base.addColorStop(0.6, p.color);
    base.addColorStop(1, p.color2);
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    
    // Banding für Gas/Ice
    if (p.type === 'gas' || p.type === 'ice') {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
      ctx.globalAlpha = 0.3;
      for (let i = -2; i <= 2; i++) {
        ctx.fillStyle = i % 2 === 0 ? p.color : p.color2;
        ctx.fillRect(x - r, y + i * r * 0.4, r * 2, r * 0.2);
      }
      ctx.restore();
    }
    
    // Krater-ähnliche Flecken für felsige Planeten
    if (p.type === 'rocky' || p.type === 'mars') {
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.clip();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      const seedRand = (i) => Math.abs(Math.sin(p.seed * 12.3 + i * 7.7)) * 2 - 1;
      for (let i = 0; i < 6; i++) {
        const px = x + seedRand(i * 2) * r * 0.7;
        const py = y + seedRand(i * 2 + 1) * r * 0.7;
        ctx.beginPath();
        ctx.arc(px, py, r * (0.08 + Math.abs(seedRand(i * 3)) * 0.15), 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    
    // Schatten
    const shade = ctx.createRadialGradient(x - r*0.3, y - r*0.3, 0, x, y, r);
    shade.addColorStop(0, 'rgba(255,255,255,0.18)');
    shade.addColorStop(0.6, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    
    // Atmosphäre für Gas/Ice
    if (p.type === 'ice' || p.type === 'gas') {
      const atm = ctx.createRadialGradient(x, y, r * 0.9, x, y, r * 1.5);
      atm.addColorStop(0, `rgba(255,255,255,0.15)`);
      atm.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = atm;
      ctx.beginPath(); ctx.arc(x, y, r * 1.5, 0, Math.PI*2); ctx.fill();
    }
  };
  
  /* ---- Sterne zeichnen ---- */
  const drawStars = () => {
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0) s.da *= -1;
      const alpha = Math.abs(s.a) * 0.75 + 0.15;
      const px = s.x + mouseX * (s.bright * 4);
      const py = s.y + mouseY * (s.bright * 4);
      
      // Leuchten für helle Sterne
      if (s.bright > 0.85) {
        const glow = ctx.createRadialGradient(px, py, 0, px, py, s.r * 6);
        glow.addColorStop(0, `rgba(${s.hue.r},${s.hue.g},${s.hue.b},${alpha * 0.5})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(px, py, s.r * 6, 0, Math.PI*2); ctx.fill();
      }
      
      ctx.fillStyle = `rgba(${s.hue.r},${s.hue.g},${s.hue.b},${alpha})`;
      ctx.beginPath(); ctx.arc(px, py, s.r, 0, Math.PI*2); ctx.fill();
    });
  };
  
  /* ---- Nebel ---- */
  const drawNebula = () => {
    nebulas.forEach(n => {
      const grd = ctx.createRadialGradient(n.x * W, n.y * H, 0, n.x * W, n.y * H, n.r * Math.min(W, H));
      grd.addColorStop(0, n.c1);
      grd.addColorStop(1, n.c2);
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(n.x * W, n.y * H, n.r * Math.min(W, H), 0, Math.PI*2); ctx.fill();
    });
  };
  
  /* ---- Sternschnuppen ---- */
  const spawnShooting = () => {
    if (shooting.length >= 3) return;
    shooting.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      vx: (Math.random() * 0.6 + 0.4) * 10 * (Math.random() < 0.5 ? 1 : -1),
      vy: (Math.random() * 0.4 + 0.3) * 10,
      life: 1, len: 100 + Math.random() * 80
    });
  };
  const drawShooting = () => {
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i];
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 10, s.y - s.vy * 10);
      grad.addColorStop(0, `rgba(255,255,255,${s.life})`);
      grad.addColorStop(0.3, `rgba(200,240,255,${s.life * 0.8})`);
      grad.addColorStop(1, 'rgba(100,200,255,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 10, s.y - s.vy * 10);
      ctx.stroke();
      // Highlight am Kopf
      ctx.fillStyle = `rgba(255,255,255,${s.life})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, Math.PI*2); ctx.fill();
      
      s.x += s.vx; s.y += s.vy;
      s.life -= 0.012;
      if (s.life <= 0 || s.x < 0 || s.x > W || s.y > H) shooting.splice(i, 1);
    }
  };
  
  /* ---- Umlaufbahnen ---- */
  const drawOrbits = () => {
    planets.forEach(p => {
      ctx.strokeStyle = 'rgba(80,140,220,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, p.orbitR, 0, Math.PI*2);
      ctx.stroke();
    });
  };
  
  /* ---- Haupt-Loop ---- */
  const loop = () => {
    t++;
    mouseX += (targetMouseX - mouseX) * 0.05;
    mouseY += (targetMouseY - mouseY) * 0.05;
    
    // Hintergrund
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bg.addColorStop(0, '#050518');
    bg.addColorStop(0.5, '#02020e');
    bg.addColorStop(1, '#000004');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    
    drawNebula();
    drawStars();
    drawOrbits();
    drawSun();
    
    planets.forEach(p => {
      p.angle += p.angleSpeed;
      p.rot += 0.008;
      const px = cx + Math.cos(p.angle) * p.orbitR;
      const py = cy + Math.sin(p.angle) * p.orbitR;
      
      // Planet-Glow
      const glow = ctx.createRadialGradient(px, py, 0, px, py, p.sizePx * 3);
      glow.addColorStop(0, `rgba(255,255,255,0.1)`);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(px, py, p.sizePx * 3, 0, Math.PI*2); ctx.fill();
      
      // Monde
      p.moons.forEach(m => {
        m.angle += m.speed;
        const mx = px + Math.cos(m.angle) * p.sizePx * m.dist;
        const my = py + Math.sin(m.angle) * p.sizePx * m.dist;
        // Mond-Bahn
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.arc(px, py, p.sizePx * m.dist, 0, Math.PI*2);
        ctx.stroke();
        // Mond-Körper
        ctx.fillStyle = m.color;
        ctx.beginPath(); ctx.arc(mx, my, p.sizePx * m.size, 0, Math.PI*2); ctx.fill();
        // Mond-Schatten
        const mg = ctx.createRadialGradient(mx - p.sizePx*m.size*0.3, my - p.sizePx*m.size*0.3, 0, mx, my, p.sizePx*m.size);
        mg.addColorStop(0, 'rgba(255,255,255,0.3)');
        mg.addColorStop(1, 'rgba(0,0,0,0.4)');
        ctx.fillStyle = mg;
        ctx.beginPath(); ctx.arc(mx, my, p.sizePx * m.size, 0, Math.PI*2); ctx.fill();
      });
      
      // Planeten-Körper
      drawPlanetBody(p, px, py);
    });
    
    drawShooting();
    if (Math.random() < 0.004) spawnShooting();
    
    requestAnimationFrame(loop);
  };
  
  const start = () => {
    resize(); init(); loop();
    window.addEventListener('resize', () => { resize(); init(); });
    window.addEventListener('mousemove', (e) => {
      targetMouseX = (e.clientX / window.innerWidth - 0.5) * 8;
      targetMouseY = (e.clientY / window.innerHeight - 0.5) * 8;
    });
  };
  
  return { start };
})();

    Z:{name:'HalDo Entwickler',apps:['dev','console','api-key-z','github','code','debug','logs-z','performance','testing','deploy','env','secrets','snippets','docs','inspector']}
  };
  const niceNames = {
    chat:'HalDo AI Chat',notes:'Notizen',tasks:'Aufgaben',calendar:'Kalender',journal:'Journal',
    calc:'Rechner',weather:'Wetter',timer:'Timer',music:'Musik',dashboard:'Dashboard',

    periodic:'Periodensystem','math-solver':'Mathe Solver',stats:'Statistik',

    network:'Netzwerk',device:'Geräte-Info',display:'Display',
    power:'Energie',storage:'Speicher',sounds:'Töne',update:'Updates',
    terminal:'Terminal',processes:'Prozesse',files_x:'Datei-Explorer'
  };
  const all = [];
  Object.entries(groups).forEach(([letter, g]) => {
    g.apps.forEach(id => {
      const name = niceNames[id] || (id.charAt(0).toUpperCase() + id.slice(1).replace(/-/g,' '));
      all.push({ id, name, letter, group: g.name });
    });
  });
  return { groups, all, findByLetter: l => all.filter(a => a.letter === l) };
})();

/* ═══════════ WINDOWS ═══════════ */
HalDo.Windows = (() => {
  const desktop = document.getElementById('desktop');
  let zTop = 250;
  const wins = new Map();
  
  const create = (id, title, html, opts = {}) => {
    if (wins.has(id)) {
      const w = wins.get(id);
      w.el.style.zIndex = ++zTop;
      w.el.classList.add('active');
      document.querySelectorAll('.window').forEach(x => { if (x !== w.el) x.classList.remove('active'); });
      return w;
    }
    const el = document.createElement('div');
    el.className = 'window active';
    el.dataset.id = id;
    const vw = Math.min(window.innerWidth - 40, opts.width || 500);
    const vh = Math.min(window.innerHeight - 100, opts.height || 420);
    el.style.width = vw + 'px';
    el.style.height = vh + 'px';
    const maxX = Math.max(0, desktop.clientWidth - vw);
    const maxY = Math.max(0, desktop.clientHeight - vh);
    el.style.left = Math.min(maxX, Math.max(20, opts.x ?? (60 + Math.random() * Math.min(150, maxX))));
    el.style.top = Math.min(maxY, Math.max(20, opts.y ?? (40 + Math.random() * Math.min(120, maxY))));
    el.style.zIndex = ++zTop;
    
    const header = document.createElement('div');
    header.className = 'win-header';
    header.innerHTML = `
      <span class="win-title">${title}</span>
      <div class="win-controls">
        <button class="win-ctrl" data-act="min" title="Minimieren">–</button>
        <button class="win-ctrl" data-act="max" title="Maximieren">□</button>
        <button class="win-ctrl close" data-act="close" title="Schließen">×</button>
      </div>
    `;
    const body = document.createElement('div');
    body.className = 'win-body';
    body.innerHTML = html;
    el.appendChild(header);
    el.appendChild(body);
    desktop.appendChild(el);
    
    el.addEventListener('mousedown', () => {
      el.style.zIndex = ++zTop;
      document.querySelectorAll('.window').forEach(x => { if (x !== el) x.classList.remove('active'); });
      el.classList.add('active');
    });
    
    header.querySelectorAll('.win-ctrl').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        const act = b.dataset.act;
        if (act === 'close') destroy(id);
        else if (act === 'min') { el.style.transform = 'scale(0)'; setTimeout(() => { el.style.display = 'none'; setTimeout(() => { el.style.transform = 'scale(1)'; el.style.display = 'flex'; }, 210); }, 200); }
        else if (act === 'max') {
          if (el.dataset.maxed === '1') {
            el.style.left = el.dataset.pLeft; el.style.top = el.dataset.pTop;
            el.style.width = el.dataset.pW; el.style.height = el.dataset.pH;
            el.dataset.maxed = '0';
          } else {
            el.dataset.pLeft = el.style.left; el.dataset.pTop = el.style.top;
            el.dataset.pW = el.style.width; el.dataset.pH = el.style.height;
            el.style.left = '0'; el.style.top = '0';
            el.style.width = '100%'; el.style.height = '100%';
            el.dataset.maxed = '1';
          }
        }
      });
    });
    
    let dragging = false, sx, sy, ox, oy;
    const dragStart = (e) => {
      if (e.target.closest('.win-ctrl')) return;
      if (!header.contains(e.target)) return;
      if (e.target.closest('.win-body')) return;
      dragging = true;
      const rect = el.getBoundingClientRect();
      const dRect = desktop.getBoundingClientRect();
      ox = rect.left - dRect.left; oy = rect.top - dRect.top;
      sx = e.clientX; sy = e.clientY;
      header.classList.add('dragging');
      el.style.zIndex = ++zTop;
      e.preventDefault();
    };
    const dragMove = (e) => {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const nx = Math.max(0, Math.min(desktop.clientWidth - el.offsetWidth, ox + p.clientX - sx));
      const ny = Math.max(0, Math.min(desktop.clientHeight - el.offsetHeight, oy + p.clientY - sy));
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
    };
    const dragEnd = () => { dragging = false; header.classList.remove('dragging'); };
    header.addEventListener('mousedown', dragStart);
    header.addEventListener('touchstart', dragStart, { passive: false });
    window.addEventListener('mousemove', dragMove);
    window.addEventListener('touchmove', dragMove, { passive: false });
    window.addEventListener('mouseup', dragEnd);
    window.addEventListener('touchend', dragEnd);
    
    wins.set(id, { el, body });
    return { el, body };
  };
  
  const destroy = id => { const w = wins.get(id); if (w) { w.el.remove(); wins.delete(id); } };
  const get = id => wins.get(id);
  return { create, destroy, get };
})();

HalDo.Apps.chat = () => {
  if (HalDo.Windows.get('chat')) return;

      </div>
    </div>`, { width: 540, height: 520 });
  const msgs = w.body.querySelector('#cm');
  const input = w.body.querySelector('#ci');
  const addMsg = (txt, who) => {
    const m = document.createElement('div');
    m.className = 'chat-msg ' + who;
    m.textContent = txt;
    msgs.appendChild(m);
    msgs.scrollTop = msgs.scrollHeight;
  };
  setTimeout(() => addMsg('Willkommen bei HalDo AI OS Professionelle – präsentiert von Halil Donma. Ich bin HalDo AI. Sag "Hallo HalDo" oder stelle eine Frage, Bruder! 🚀', 'ai'), 300);
  const respond = (txt) => {
    const t = txt.toLowerCase().trim();
    HalDo.Avatar.think();
    setTimeout(() => {
      let r;
      if (/hallo|hi|hey|servus|merhaba|silav/i.test(t)) r = 'Hallo Bruder! 👋 Schön dich zu sehen. Wie geht es dir?';
      else if (/wie.*geht/i.test(t)) r = 'Mir geht es fantastisch! Alle Systeme laufen stabil. Und dir, Bruder? 💙';
      else if (/wer.*bist|dein.*name/i.test(t)) r = 'Ich bin HalDo AI – die KI von HalDo AI OS, entwickelt von Halil Donma. Ich helfe dir bei allem!';
      else if (/danke|thanks/i.test(t)) r = 'Immer gerne, Bruder! ❤️';
      else if (/zeit|uhr/i.test(t)) r = `Es ist ${new Date().toLocaleTimeString('de-DE')} Uhr.`;
      else if (/datum/i.test(t)) r = `Heute ist ${new Date().toLocaleDateString('de-DE', { weekday:'long', year:'numeric', month:'long', day:'numeric' })}.`;
      else if (/wetter/i.test(t)) r = '🌤️ Öffne die Wetter-App – dort bekommst du Live-Wetter für jede Stadt!';
      else if (/hilfe|help/i.test(t)) r = '📋 Ich helfe dir mit: Notizen, Aufgaben, Journal, Rechner, Wetter, Timer, Musik, Kalender, Übersetzer, 375+ Apps!';
      else if (/theme|farbe/i.test(t)) r = '🎨 7 Themes: Holo, Cyborg, Gold, Matrix, Crimson, Sunset, Ice – einfach in Einstellungen wechseln!';
      else if (/ezidi|êzîdî/i.test(t)) r = '🦚 Êzîdî ist eine der ältesten Religionen – tief in Kurdisch-Kurmanci, Sorani, Gorani verwurzelt. Heiligtum: Lalisch. Engel: Melek Taus (Pfau). Öffne "Êzîdî Wissen" für Details!';
      else if (/kosmos|planet|stern/i.test(t)) r = '🌌 Ich habe 12 Planeten, echte Erde mit Kontinenten, Sonne mit Corona, 365 Sterne, Nebel und Sternschnuppen – alles Live im Hintergrund!';
      else r = ['Interessante Frage, Bruder! 🚀', 'Verstanden! Merke ich mir.', 'Schau in die "Alle Apps" – da findest du passende Tools!', 'HalDo AI sagt: Bleib fokussiert und positiv! 💙'][Math.floor(Math.random()*4)];
      addMsg(r, 'ai');
      HalDo.Avatar.speak(r.slice(0, 100));
      HalDo.Sound.play('message');
    }, 400);
  };
  const submit = () => {
    const v = input.value.trim();
    if (!v) return;
    addMsg(v, 'user');
    input.value = '';
    respond(v);
  };
  w.body.querySelector('#cs').onclick = submit;
  input.onkeydown = e => { if (e.key === 'Enter') submit(); };
  w.body.querySelector('#cm2').onclick = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return HalDo.Toast.show('Spracherkennung nicht verfügbar', { icon:'⚠️', sound:'error' });
    const rec = new SR();

    rec.onresult = e => { input.value = e.results[0][0].transcript; submit(); };
    rec.start();
    HalDo.Toast.show('🎤 Höre zu...', { icon:'👂' });
  };
  HalDo.Sound.play('success');
};

    <div style="text-align:center;padding:22px;background:linear-gradient(135deg,rgba(var(--primary-rgb),.15),rgba(var(--primary-rgb),.03));border-radius:16px;border:1.5px solid var(--border);margin-bottom:14px">
      <div id="td" style="font-size:52px;font-weight:900;font-family:'SF Mono',monospace;color:var(--primary);text-shadow:0 0 24px rgba(var(--primary-rgb),.8)">00:00</div>
    </div>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:12px">
      ${[30,60,300,600,1800].map(s => `<button class="chip" onclick="window._tS(${s})">${s >= 60 ? s/60 + 'm' : s + 's'}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn primary" id="ts" style="flex:1">▶ Start</button>
      <button class="btn" id="tp" style="flex:1">⏸ Stop</button>
      <button class="btn" id="tr" style="flex:1">↻ Reset</button>
    </div>`, { width: 420, height: 420 });
  const disp = w.body.querySelector('#td');
  let total = 60, remaining = 60, running = false, tick;
  const fmt = s => `${String(Math.floor(s/60)).padStart(2, '0')}:${String(s%60).padStart(2, '0')}`;
  const upd = () => disp.textContent = fmt(remaining);
  window._tS = s => { total = remaining = s; upd(); };
  w.body.querySelector('#ts').onclick = () => {
    if (running) return;
    running = true;
    tick = setInterval(() => {
      remaining--; upd();
      if (remaining <= 0) {
        clearInterval(tick); running = false;
        HalDo.Sound.play('alarm');
        HalDo.Toast.show('⏰ Timer abgelaufen!', { icon: '⏰', sound: 'alarm', duration: 5000 });
      }
    }, 1000);
  };
  w.body.querySelector('#tp').onclick = () => { running = false; clearInterval(tick); };
  w.body.querySelector('#tr').onclick = () => { running = false; clearInterval(tick); remaining = total; upd(); };
  upd();
};

/* --- Music --- */
HalDo.Apps.music = () => {
  if (HalDo.Windows.get('music')) return;
  const tracks = [
    { name: 'Cosmic Ambient', freq: 261.63, color: '#00e5ff' },
    { name: 'Deep Space', freq: 220, color: '#b478ff' },
    { name: 'Nebula Dream', freq: 329.63, color: '#ff78c8' },
    { name: 'Solar Winds', freq: 440, color: '#ffd700' },
    { name: 'Starfall', freq: 523.25, color: '#00ff88' }
  ];
  const w = HalDo.Windows.create('music', '🎵 Musik Studio', `
    <h3>🎵 Musik Studio</h3>
    <p>Klick einen Track:</p>
    <div id="ml"></div>
    <div style="margin-top:14px"><button class="btn" id="ms" style="width:100%">⏹ Stop</button></div>`, { width: 440, height: 440 });
  const list = w.body.querySelector('#ml');
  list.innerHTML = tracks.map((t, i) => `
    <div class="list-item" style="cursor:pointer" onclick="window._mp(${i})">
      <span style="font-size:24px;filter:drop-shadow(0 0 6px ${t.color})">🎵</span>
      <div class="txt"><b>${t.name}</b><br><small style="color:${t.color}">${t.freq.toFixed(0)} Hz</small></div>
      <span style="color:var(--primary);font-size:18px">▶</span>
    </div>`).join('');
  let osc, lfo;
  const stop = () => { try { osc?.stop(); lfo?.stop(); } catch(e){} };
  window._mp = i => {
    stop();
    const c = new (window.AudioContext || window.webkitAudioContext)();
    osc = c.createOscillator(); const gain = c.createGain(); lfo = c.createOscillator();
    const lfoGain = c.createGain();
    osc.type = 'sine'; osc.frequency.value = tracks[i].freq;
    lfo.type = 'sine'; lfo.frequency.value = 3; lfoGain.gain.value = tracks[i].freq * 0.05;
    lfo.connect(lfoGain).connect(osc.frequency);
    gain.gain.value = .08;
    osc.connect(gain).connect(c.destination);
    osc.start(); lfo.start();
    HalDo.Toast.show('▶ ' + tracks[i].name, { icon: '🎵' });
    HalDo.Sound.play('success');
  };
  w.body.querySelector('#ms').onclick = () => { stop(); HalDo.Sound.play('click'); };
};

/* --- Calendar --- */
HalDo.Apps.calendar = () => {
  if (HalDo.Windows.get('calendar')) return;
  const w = HalDo.Windows.create('calendar', '📅 Kalender', `<h3>📅 Kalender</h3><div id="cal"></div>`, { width: 500, height: 520 });
  const cal = w.body.querySelector('#cal');
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const start = (first + 6) % 7;
  let h = `<div style="text-align:center;margin-bottom:14px;color:var(--primary);font-weight:800;font-size:15px;letter-spacing:1px;text-shadow:var(--glow-sm)">${now.toLocaleDateString('de-DE', { month:'long', year:'numeric' }).toUpperCase()}</div>`;
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d => h += `<div style="font-size:10px;color:var(--text-dim);font-weight:800;padding:4px">${d}</div>`);
  for (let i = 0; i < start; i++) h += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const isToday = d === now.getDate();
    h += `<div style="padding:10px 4px;border-radius:10px;font-size:13px;font-weight:600;${isToday ? 'background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;box-shadow:0 0 20px rgba(var(--primary-rgb),.5)' : 'background:rgba(255,255,255,.03);color:var(--text);border:1px solid rgba(255,255,255,.04)'}">${d}</div>`;
  }
  h += '</div>';
  cal.innerHTML = h;
};

HalDo.Avatar = (() => {

      window.speechSynthesis.cancel();

      u.lang = 'de-DE'; u.rate = 1; u.pitch = 1.1;

      u.onend = () => fab.classList.remove('speaking');

    } catch (e) {}
  };
  const think = () => { fab.textContent = '🤔'; setTimeout(() => fab.textContent = '🤖', 800); };
  return { speak, think };
})();
