<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<style>
:root{--bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--border:#374151;--text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;--gold:#fbbf24;--danger:#ef4444;--success:#10b981;--warn:#f59e0b;--font:'Segoe UI',system-ui,sans-serif;--font-size:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#000;user-select:none;}
body{font-family:var(--font);color:var(--text);font-size:var(--font-size);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
#cosmos-canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;}
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);transition:opacity .5s;}
#welcome.hide{opacity:0;pointer-events:none;}
#welcome h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(251,191,36,.8);}
#welcome h2{font-size:clamp(14px,2vw,20px);color:#e5e7eb;font-weight:400;line-height:1.6;}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;}
#welcome .presented b{color:#fbbf24;}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);color:#fff;}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(17,24,39,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 12px;gap:10px;z-index:9997;}
#taskbar.show{display:flex;}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:10px 20px;border-radius:10px;font-weight:bold;display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer;font-size:14px;}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow-x:auto;}
.taskbar-app{background:rgba(55,65,81,.5);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap;}
.taskbar-app:hover{border-color:var(--accent);}
#sys-clock{color:var(--dim);font-size:13px;font-weight:600;}
#start-menu{position:fixed;bottom:60px;left:10px;width:720px;max-height:85vh;background:rgba(17,24,39,.98);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;z-index:9998;box-shadow:0 -10px 40px rgba(0,0,0,.8);}
#start-menu.show{display:flex;}
.sm-drag-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--accent);background:rgba(0,0,0,.2);}
.sm-tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);}
.sm-tab{flex:1;padding:10px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;}
.sm-tab.active{color:var(--accent);background:rgba(6,182,212,.15);border-bottom:2px solid var(--accent);}
.sm-panel{flex:1;overflow-y:auto;padding:12px;display:none;}
.sm-panel.active{display:block;}
.sm-search{padding:8px 10px 10px;}
.sm-search input{background:rgba(0,0,0,.3);padding:8px 12px;border-radius:6px;}
.sm-apps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent;background:rgba(55,65,81,.2);}
.sm-app-card:hover{background:rgba(55,65,81,.6);border-color:var(--accent);transform:translateY(-2px);}
.sm-app-card .ico{font-size:22px;margin-bottom:4px;pointer-events:none;}
.sm-app-card .nm{font-size:9px;text-align:center;line-height:1.2;pointer-events:none;}
.settings-layout{display:flex;height:100%;min-height:480px;}
.settings-nav{width:190px;flex:none;padding:8px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:rgba(0,0,0,.3);}
.settings-nav-item{text-align:left;padding:9px 10px;font-size:12px;border-radius:6px;color:#a0c8e0;cursor:pointer;background:transparent;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.settings-nav-item:hover{background:rgba(55,65,81,.5);color:#fff;}
.settings-nav-item.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.settings-content{flex:1;padding:16px;overflow-y:auto;}
.settings-content h3{color:var(--accent);font-size:15px;margin-bottom:12px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(55,65,81,.5);gap:12px;}
.settings-row:last-child{border:none;}
.settings-row .lbl{font-size:13px;font-weight:600;}
.settings-row .sub{font-size:11px;color:var(--dim);margin-top:2px;}
.settings-row .ctrl{flex-shrink:0;min-width:160px;max-width:280px;}
.toggle{position:relative;width:44px;height:24px;background:rgba(55,65,81,.8);border-radius:12px;cursor:pointer;transition:background .2s;display:inline-block;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}
.window{position:fixed;background:rgba(10,14,26,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.7);min-width:380px;min-height:280px;}
.window.minimized{display:none;}
.window-header{padding:12px 16px;background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;}
.window-title{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:10px;font-size:13px;}
.window-controls{display:flex;gap:6px;}
.win-btn{width:28px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);font-size:14px;}
.win-btn:hover{background:rgba(255,255,255,.2);}
.win-btn.close:hover{background:var(--danger);}
.window-body{flex:1;overflow:hidden;display:flex;}
#app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%,rgba(6,182,212,.2) 0%,rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px);}
#app-splash.show{display:flex;}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.app-sidebar{width:180px;flex:none;padding:10px 8px;background:rgba(0,10,20,.6);border-right:1px solid rgba(55,65,81,.5);display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.side-btn{text-align:left;padding:9px 12px;font-size:12px;background:transparent;border:1px solid transparent;color:#a0c8e0;cursor:pointer;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-btn:hover{background:rgba(55,65,81,.5);color:#fff;}
.side-btn.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.app-content{flex:1;padding:18px;overflow-y:auto;min-width:0;}
.app-content h3{margin-bottom:12px;color:var(--accent);font-size:16px;}
.app-content h4{margin:14px 0 8px;color:var(--accent);font-size:13px;}
.app-content input,.app-content select,.app-content textarea{margin-bottom:8px;}
.app-content button{padding:9px 16px;margin:4px 4px 4px 0;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.app-content button:hover{background:var(--accent2);}
.app-content button.danger{background:var(--danger);border-color:var(--danger);}
.app-content button.ghost{background:transparent;color:var(--text);border-color:var(--border);}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:6px;}
.list-row:hover{background:rgba(55,65,81,.6);border-color:var(--accent);}
.list-row .meta{color:var(--dim);font-size:11px;margin-left:auto;}
.muted{color:var(--dim);}
.qt-panel{background:rgba(31,41,55,.5);padding:14px;border-radius:10px;border:1px solid var(--border);}
.qt-panel h4{margin-bottom:8px;font-size:12px;color:var(--accent);}
.chat-box{display:flex;flex-direction:column;height:100%;}
.chat-log{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid var(--border);margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;max-width:85%;line-height:1.5;}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
.msg.ai{align-self:flex-start;background:rgba(31,41,55,.9);border:1px solid var(--border);}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;margin:0;}
.chat-input button{margin:0;}
#click-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(6,182,212,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:99;pointer-events:none;transition:opacity .5s;}
.holo-map{position:relative;width:100%;height:420px;background:radial-gradient(circle at center,#0a1a2e,#000);border-radius:12px;overflow:hidden;border:1px solid var(--accent);}
.tacho{position:relative;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle at center,#1a1a2e 0%,#0a0a15 100%);border:6px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.tacho-needle{position:absolute;width:6px;height:160px;background:linear-gradient(to top,#ef4444,transparent);top:40px;left:50%;transform-origin:bottom center;transform:translateX(-50%) rotate(0deg);transition:transform .1s;z-index:2;border-radius:3px;}
.tacho-center{position:absolute;top:50%;left:50%;width:30px;height:30px;background:var(--accent);border-radius:50%;transform:translate(-50%,-50%);z-index:3;}
.tacho-inner{position:absolute;bottom:100px;display:flex;flex-direction:column;align-items:center;z-index:1;}
.tacho-speed{font-size:56px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--accent);}
.tacho-unit{font-size:14px;color:var(--dim);letter-spacing:2px;}
.tacho-header{display:flex;align-items:center;gap:16px;padding:12px 16px;background:rgba(0,0,0,.5);border-radius:12px;border:1px solid rgba(55,65,81,.5);width:100%;max-width:480px;margin:0 auto 12px;}
.tacho-header .header-info{flex:1;}
.tacho-header .header-title{font-size:11px;color:#9ca3af;letter-spacing:2px;text-transform:uppercase;}
.tacho-header .header-limit{font-size:24px;font-weight:900;color:#fff;}
.traffic-sign-display{position:relative;width:65px;height:65px;border-radius:50%;background:#fff;border:7px solid #ef4444;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.traffic-sign-display .num{font-size:26px;font-weight:900;color:#000;line-height:1;}
.speed-limits{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:12px;width:100%;max-width:480px;}
.speed-btn{background:rgba(55,65,81,.6);border:2px solid var(--border);color:#fff;border-radius:8px;padding:10px 4px;cursor:pointer;text-align:center;font-size:13px;font-weight:700;}
.speed-btn.active{border-color:var(--accent);background:rgba(6,182,212,.3);}
.speed-btn small{display:block;font-size:9px;color:var(--dim);font-weight:400;margin-top:2px;}
.danger-log{max-height:240px;overflow-y:auto;background:rgba(0,0,0,.4);border-radius:10px;border:1px solid var(--border);padding:10px;margin-top:12px;}
.danger-entry{display:flex;gap:8px;padding:8px;border-bottom:1px solid rgba(55,65,81,.3);font-size:12px;align-items:center;}
.danger-entry .icon{font-size:20px;}
.danger-entry .info{flex:1;}
.danger-entry .time{color:var(--dim);font-size:10px;}
.arrow-colors{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.arrow-color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.2);}
.arrow-color-swatch.active{border-color:#fff;box-shadow:0 0 12px currentColor;}
.cat-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;}
.cat-table th{text-align:left;padding:8px 6px;color:var(--accent);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.cat-table td{padding:6px;border-bottom:1px solid rgba(55,65,81,.3);vertical-align:middle;}
.cat-table select{padding:5px 8px;font-size:11px;margin:0;min-width:110px;}
.cat-table .cat-label{display:flex;align-items:center;gap:6px;font-weight:600;}
.cat-table .cat-label .ico{font-size:16px;}
.live-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;background:rgba(16,185,129,.3);color:#10b981;margin-left:8px;}
.live-badge.off{background:rgba(107,114,128,.3);color:#9ca3af;}
.traffic-event{position:absolute;font-size:28px;filter:drop-shadow(0 0 8px currentColor);pointer-events:none;z-index:5;}
.mail-layout{display:flex;height:100%;width:100%;}
.mail-list-panel{width:320px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;background:rgba(0,10,20,.4);}
.mail-toolbar{padding:10px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;}
.mail-toolbar button{padding:6px 10px;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;border:none;}
.mail-toolbar button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.mail-search{padding:8px 10px;}
.mail-search input{font-size:12px;padding:8px;background:rgba(0,0,0,.3);}
.mail-folders{padding:6px 0;border-bottom:1px solid var(--border);}
.mail-folder{padding:8px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#a0c8e0;}
.mail-folder:hover{background:rgba(55,65,81,.5);}
.mail-folder.active{background:rgba(6,182,212,.2);color:#fff;border-left:3px solid var(--accent);}
.mail-folder .count{margin-left:auto;font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:10px;}
.mail-items{flex:1;overflow-y:auto;}
.mail-item{padding:10px 14px;border-bottom:1px solid rgba(55,65,81,.3);cursor:pointer;font-size:12px;}
.mail-item:hover{background:rgba(55,65,81,.4);}
.mail-item.active{background:rgba(6,182,212,.15);border-left:3px solid var(--accent);}
.mail-item.unread{font-weight:700;}
.mail-item .from{color:var(--accent);font-size:11px;margin-bottom:2px;}
.mail-item .subj{color:#fff;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mail-item .preview{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mail-item .time{color:var(--dim);font-size:10px;float:right;}
.mail-detail{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.mail-detail-header{padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);}
.mail-detail-header h2{font-size:18px;color:#fff;margin-bottom:8px;}
.mail-detail-header .meta{font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;}
.mail-detail-body{flex:1;overflow-y:auto;padding:18px;line-height:1.6;font-size:14px;white-space:pre-wrap;}
.mail-detail-actions{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;}
.mail-compose{padding:20px;flex:1;overflow-y:auto;}
.mail-compose .field{margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.mail-compose .field label{width:80px;font-size:12px;color:var(--dim);flex-shrink:0;}
.mail-compose textarea{min-height:200px;font-family:inherit;resize:vertical;}
.mail-ai-bar{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(59,130,246,.15));border:1px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap;}
.mail-ai-bar button{padding:5px 10px;font-size:11px;background:var(--accent);color:#fff;border-radius:6px;border:none;}
.konto-setup{max-width:500px;margin:20px auto;padding:24px;background:rgba(31,41,55,.6);border:1px solid var(--accent);border-radius:12px;}
.konto-setup h2{color:var(--accent);margin-bottom:16px;}
.konto-setup .step{margin-bottom:16px;}
.konto-setup .step label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;}
.music-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);flex-wrap:wrap;}
.music-tab{padding:8px 14px;font-size:12px;border-radius:6px;cursor:pointer;color:#a0c8e0;border:1px solid transparent;}
.music-tab:hover{background:rgba(55,65,81,.5);color:#fff;}
.music-tab.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.music-content{flex:1;overflow-y:auto;padding:18px;}
.music-gen-form{background:rgba(31,41,55,.5);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.music-gen-form h4{color:var(--accent);margin-bottom:10px;font-size:13px;}
.music-gen-form textarea{min-height:60px;font-family:inherit;resize:vertical;}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.chip{padding:6px 12px;font-size:11px;border-radius:16px;background:rgba(55,65,81,.6);border:1px solid var(--border);cursor:pointer;color:#fff;transition:all .15s;}
.chip:hover{border-color:var(--accent);}
.chip.active{background:rgba(6,182,212,.35);border-color:var(--accent);box-shadow:0 0 8px rgba(6,182,212,.4);}
.music-track-list{display:flex;flex-direction:column;gap:8px;}
.music-track{background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:10px;padding:12px;}
.music-track .track-title{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px;}
.music-track .track-meta{font-size:10px;color:var(--dim);margin-bottom:8px;}
.music-track .actions{display:flex;gap:6px;flex-wrap:wrap;}
.music-track .actions button{padding:6px 12px;font-size:11px;margin:0;}
.voice-recorder{background:rgba(31,41,55,.5);border:1px solid var(--accent);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px;}
.voice-recorder .pulse{display:inline-block;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--danger),#dc2626);font-size:32px;line-height:80px;margin:10px;cursor:pointer;box-shadow:0 0 30px rgba(239,68,68,.5);transition:transform .2s;}
.voice-recorder .pulse.recording{animation:recPulse 1s infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 30px rgba(239,68,68,.5);}50%{box-shadow:0 0 60px rgba(239,68,68,1);}}
.level-meter{height:12px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden;margin:10px auto;max-width:300px;}
.level-meter-fill{height:100%;background:linear-gradient(90deg,#10b981,#f59e0b,#ef4444);width:0%;transition:width .05s;}
.mixer-strip{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(55,65,81,.3);border-radius:8px;margin-bottom:6px;flex-wrap:wrap;}
.mixer-strip .track-label{width:90px;font-size:12px;font-weight:600;}
.mixer-strip input[type="range"]{flex:1;min-width:80px;}
.mixer-strip .val{width:40px;text-align:right;font-size:11px;color:var(--dim);}
.mixer-strip .m-btn{padding:4px 8px;font-size:11px;border-radius:4px;background:rgba(55,65,81,.8);border:1px solid var(--border);color:#fff;cursor:pointer;}
.mixer-strip .m-btn.mute.active{background:var(--danger);border-color:var(--danger);}
.mixer-strip .m-btn.solo.active{background:var(--warn);border-color:var(--warn);color:#000;}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px;}

/* ==================== TTS ==================== */
let allVoices=[];
function loadVoices(){if(!('speechSynthesis'in window))return;allVoices=speechSynthesis.getVoices();}
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function speak(text,voiceType='default',langCode=null,specificVoiceName=null){
  if(!('speechSynthesis'in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang=langCode||LANGCODES[currentLang]||'de-DE';
  u.rate=parseFloat(localStorage.getItem('haldo_voice_rate')||1);
  u.pitch=parseFloat(localStorage.getItem('haldo_voice_pitch')||1);
  if(!allVoices.length)allVoices=speechSynthesis.getVoices();
  let sv=null;
  if(specificVoiceName)sv=allVoices.find(v=>v.name===specificVoiceName);
  else if(voiceType==='male')sv=allVoices.find(v=>/male|mann|hans|stefan|david|mark/i.test(v.name));
  else if(voiceType==='female')sv=allVoices.find(v=>/female|frau|anna|marlene|zira|samantha|hedda|google/i.test(v.name));
  if(sv)u.voice=sv;
  speechSynthesis.speak(u);
}

/* ==================== SOUND ==================== */
function playGlassSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(1200,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(1800,ctx.currentTime+.1);g.gain.setValueAtTime(.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.5);osc.connect(g);g.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1.5);}catch(e){}}
function playAlarm(type='beep',duration=3){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();const master=ctx.createGain();master.gain.value=.3;master.connect(ctx.destination);
    const now=ctx.currentTime;const stopAt=now+duration;
    function tone(freq,wave,start,dur,vol=.2){const o=ctx.createOscillator();const g=ctx.createGain();o.type=wave;o.frequency.value=freq;o.connect(g);g.connect(master);g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.001,start+dur);o.start(start);o.stop(start+dur);}
    if(type==='chime'){[784,988,1175].forEach((f,i)=>tone(f,'sine',now+i*.15,.4,.15));}
    else if(type==='siren'){for(let i=0;i<Math.floor(duration*2);i++){tone(800,'sawtooth',now+i*.5,.25,.3);tone(1200,'sawtooth',now+i*.5+.25,.25,.3);}}
    else if(type==='danger'){for(let i=0;i<Math.floor(duration*3);i++)tone(440,'sawtooth',now+i*.3,.2,.3);}
    else if(type==='silent'){}
    else{tone(880,'square',now,duration,.2);}
  }catch(e){}
}
function playMailSound(id){
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime;const sounds={'mail1':[880,1100],'mail2':[660,880],'mail3':[1200,1500,1800],'mail4':[1047,1319],'mail5':[440,660,880],'mail6':[784,988,1175],'mail7':[1000,1400]};const freqs=sounds[id]||[880,1100];o.type='sine';freqs.forEach((f,i)=>{o.frequency.setValueAtTime(f,t+i*.12);g.gain.setValueAtTime(.2,t+i*.12);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.15);});o.start(t);o.stop(t+freqs.length*.12+.2);}catch(e){}
}

/* ==================== MUSIK-ENGINE (ECHTE SYNTHESE) ==================== */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KEY_TO_SEMITONE = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
const MAJOR = [0,2,4,5,7,9,11];
const MINOR = [0,2,3,5,7,8,10];

function semitoneToFreq(semi, octave){
  const midi = (octave + 1) * 12 + semi;
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function getScale(key, mode){
  const root = KEY_TO_SEMITONE[key] || 0;
  const intervals = mode === 'minor' ? MINOR : MAJOR;
  return intervals.map(i => (root + i) % 12);
}
function getMode(stimmungen){
  if(stimmungen.includes('Traurig') || stimmungen.includes('Melancholisch') || stimmungen.includes('Dunkel') || stimmungen.includes('Depressiv')) return 'minor';
  return 'major';
}
function getProgression(stimmungen){
  const s = stimmungen[0] || 'Happy';
  const P = {
    'Happy':[0,4,5,3],'Traurig':[5,3,0,4],'Romantisch':[0,5,3,4],'Episch':[0,3,4,5],
    'Dunkel':[5,4,3,4],'Chill':[1,4,0,5],'Hype':[0,0,4,4],'Nostalgisch':[0,3,5,4],
    'Melancholisch':[5,2,3,0],'Verträumt':[0,3,5,3],'Aggressiv':[0,4,3,4],
    'Entspannt':[0,3,5,4],'Feierlich':[0,4,5,3],'Hoffnungsvoll':[0,4,5,3],
    'Dramatisch':[5,3,4,4]
  };
  return P[s] || [0,4,5,3];
}

function playKick(ctx, t, dest){
  const o=ctx.createOscillator();const g=ctx.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+0.12);
  g.gain.setValueAtTime(0.7,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+0.3);
}
function playSnare(ctx, t, dest){
  const dur=0.2;
  const bufSize=ctx.sampleRate*dur;
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++)data[i]=Math.random()*2-1;
  const noise=ctx.createBufferSource();noise.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='highpass';filt.frequency.value=1000;
  const g=ctx.createGain();g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  noise.connect(filt);filt.connect(g);g.connect(dest);noise.start(t);noise.stop(t+dur);
}
function playHiHat(ctx, t, dest, vol){
  const dur=0.05;
  const bufSize=ctx.sampleRate*dur;
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++)data[i]=Math.random()*2-1;
  const noise=ctx.createBufferSource();noise.buffer=buf;
  const filt=ctx.createBiquadFilter();filt.type='highpass';filt.frequency.value=7000;
  const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  noise.connect(filt);filt.connect(g);g.connect(dest);noise.start(t);noise.stop(t+dur);
}
function playPiano(ctx, freq, t, dur, dest, reverb){
  const o1=ctx.createOscillator();o1.type='triangle';o1.frequency.value=freq;
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=freq*2;
  const g=ctx.createGain();
  o1.connect(g);o2.connect(g);g.connect(dest);if(reverb)g.connect(reverb);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o1.start(t);o2.start(t);o1.stop(t+dur);o2.stop(t+dur);
}
function playBass(ctx, freq, t, dur, dest){
  const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=freq;
  const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=400;
  const g=ctx.createGain();
  o.connect(filt);filt.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.35,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur);
}
function playGuitar(ctx, freq, t, dur, dest, reverb){
  const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=freq;
  const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=3000;
  const g=ctx.createGain();
  o.connect(filt);filt.connect(g);g.connect(dest);if(reverb)g.connect(reverb);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur);
}
function playStrings(ctx, freq, t, dur, dest, reverb){
  [1,1.002,0.998].forEach(detune=>{
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=freq*detune;
    const g=ctx.createGain();
    o.connect(g);g.connect(dest);if(reverb)g.connect(reverb);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.06,t+0.1);
    g.gain.setValueAtTime(0.06,t+dur-0.1);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t);o.stop(t+dur);
  });
}
function playFlute(ctx, freq, t, dur, dest, reverb){
  const o=ctx.createOscillator();o.type='triangle';o.frequency.value=freq;
  const g=ctx.createGain();
  o.connect(g);g.connect(dest);if(reverb)g.connect(reverb);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.15,t+0.05);
  g.gain.setValueAtTime(0.15,t+dur-0.05);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  const vib=ctx.createOscillator();vib.frequency.value=5;const vibGain=ctx.createGain();vibGain.gain.value=3;
  vib.connect(vibGain);vibGain.connect(o.frequency);
  o.start(t);vib.start(t);o.stop(t+dur);vib.stop(t+dur);
}
function playSynthLead(ctx, freq, t, dur, dest, reverb){
  const o=ctx.createOscillator();o.type='square';o.frequency.value=freq;
  const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=2500;
  const g=ctx.createGain();
  o.connect(filt);filt.connect(g);g.connect(dest);if(reverb)g.connect(reverb);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur);
}
function playSynthPad(ctx, freq, t, dur, dest, reverb){
  const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=freq;
  const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1200;
  const g=ctx.createGain();
  o.connect(filt);filt.connect(g);g.connect(dest);if(reverb)g.connect(reverb);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.08,t+0.3);
  g.gain.setValueAtTime(0.08,t+dur-0.3);g.gain.exponentialRampToValueAtTime(0.001,t+dur);

function createReverbImpulse(ctx, dur, decay){
  const rate=ctx.sampleRate;const length=rate*dur;
  const impulse=ctx.createBuffer(2,length,rate);
  for(let ch=0;ch<2;ch++){const data=impulse.getChannelData(ch);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/length,decay);}
  return impulse;
}

function hasInstr(sel, name){return sel.some(s=>s.toLowerCase().includes(name.toLowerCase()));}
function hasDrumGenre(genres){return genres.some(g=>['Pop','Rock','Hip-Hop','Electronic','R&B','Funk','Soul','Metal','Punk','Indie','Reggaeton','Salsa','Bachata','Afrobeat','Highlife','Soukous','Bhangra','Bollywood','Arabesk','Anadolu Rock','Türk Pop','Kurdisch-Pop','Kurdisch-Rock'].includes(g));}
function hasSoftGenre(genres){return genres.some(g=>['Ambient','Lo-Fi','Klassik','Chill'].includes(g));}

async function generateSong(config){
  const ctx = new OfflineAudioContext(2, 44100 * config.duration, 44100);
  const master = ctx.createGain(); master.gain.value = 0.65; master.connect(ctx.destination);
  const reverb = ctx.createConvolver(); reverb.buffer = createReverbImpulse(ctx, 1.8, 2.5);
  const reverbGain = ctx.createGain(); reverbGain.gain.value = 0.25;
  reverb.connect(reverbGain); reverbGain.connect(master);
  
  const bpm = config.bpm || 120;
  const beatDur = 60 / bpm;
  const barDur = beatDur * 4;
  const totalBars = Math.max(1, Math.ceil(config.duration / barDur));
  const mode = getMode(config.stimmungen);
  const scale = getScale(config.key || 'C', mode);
  const progression = getProgression(config.stimmungen);
  
  const inst = config.instrumente || [];
  const genres = config.genres || [];
  const useDrums = hasDrumGenre(genres) && !hasSoftGenre(genres);
  const isElectronic = genres.includes('Electronic') || genres.includes('Hip-Hop');
  const isRock = genres.includes('Rock') || genres.includes('Metal');
  
  for (let bar = 0; bar < totalBars; bar++){
    const chordIdx = progression[bar % progression.length];
    const chordRoot = scale[chordIdx];
    const barStart = bar * barDur;
    
    // Chords
    if(hasInstr(inst,'Klavier') || hasInstr(inst,'Synthesizer') || hasInstr(inst,'Synth-Pad')){
      [0,4,7].forEach((offset,i)=>{
        const semi = (chordRoot + offset) % 12;
        const freq = semitoneToFreq(semi, 4);
        if(hasInstr(inst,'Klavier')) playPiano(ctx, freq, barStart + i*0.02, beatDur*4*0.95, master, reverb);
        else if(hasInstr(inst,'Synth-Pad')) playSynthPad(ctx, freq, barStart, beatDur*4*0.95, master, reverb);
      });
    }
    
    // Bass
    if(hasInstr(inst,'Bass')){
      const bassFreq = semitoneToFreq(chordRoot, 2);
      playBass(ctx, bassFreq, barStart, beatDur*1.8, master);
      playBass(ctx, bassFreq, barStart + beatDur*2, beatDur*1.8, master);
    }
    
    // Gitarre
    if(hasInstr(inst,'Gitarre (elektrisch)')){
      [0,7].forEach(offset=>{
        const semi = (chordRoot + offset) % 12;
        playGuitar(ctx, semitoneToFreq(semi, 3), barStart, beatDur*4*0.9, master, reverb);
      });
    }
    
    // Streicher
    if(hasInstr(inst,'Violine') || hasInstr(inst,'Cello')){
      [0,4,7].forEach(offset=>{
        const semi = (chordRoot + offset) % 12;
        playStrings(ctx, semitoneToFreq(semi, 4), barStart, beatDur*4*0.95, master, reverb);
      });
    }
    
    // Drums
    if(useDrums){
      for(let beat=0; beat<4; beat++){
        const t = barStart + beat * beatDur;
        if(isElectronic){
          playKick(ctx, t, master);
          playHiHat(ctx, t + beatDur*0.5, master, 0.15);
        } else if(isRock){
          if(beat===0 || beat===2) playKick(ctx, t, master);
          if(beat===1 || beat===3) playSnare(ctx, t, master);
          playHiHat(ctx, t, master, 0.18);
          playHiHat(ctx, t + beatDur*0.5, master, 0.12);
        } else {
          if(beat===0 || beat===2) playKick(ctx, t, master);
          if(beat===1 || beat===3) playSnare(ctx, t, master);
          playHiHat(ctx, t, master, 0.15);
          playHiHat(ctx, t + beatDur*0.5, master, 0.1);
        }
      }
      if(genres.includes('Hip-Hop')) playKick(ctx, barStart + beatDur*2.5, master);
    }
    
    // Melodie (Flöte / Synth-Lead / Gitarre)
    const melInstrument = hasInstr(inst,'Flöte') ? 'flute' : hasInstr(inst,'Synth-Lead') ? 'synth' : hasInstr(inst,'Gitarre (elektrisch)') ? 'guitar' : null;
    if(melInstrument){
      const steps = 8;
      for(let i=0;i<steps;i++){
        if(Math.random() > 0.4){
          const idx = Math.floor(Math.random() * scale.length);
          const semi = (scale[idx] + 12) % 24;
          const freq = semitoneToFreq(semi, 4);
          const t = barStart + i * (barDur / steps);
          const dur = (barDur / steps) * 0.7;
          if(melInstrument === 'flute') playFlute(ctx, freq, t, dur, master, reverb);
          else if(melInstrument === 'synth') playSynthLead(ctx, freq, t, dur, master, reverb);
          else playGuitar(ctx, freq, t, dur, master, reverb);
        }
      }
    }
  }
  
  const buffer = await ctx.startRendering();
  return buffer;
}

function audioBufferToWav(buffer){
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length * numChannels * 2 + 44;
  const arrBuf = new ArrayBuffer(length);
  const view = new DataView(arrBuf);
  let offset = 0;
  function ws(s){for(let i=0;i<s.length;i++)view.setUint8(offset++,s.charCodeAt(i));}
  function w32(v){view.setUint32(offset,v,true);offset+=4;}
  function w16(v){view.setUint16(offset,v,true);offset+=2;}
  ws('RIFF');w32(length-8);ws('WAVE');ws('fmt ');w32(16);w16(1);w16(numChannels);w32(sampleRate);w32(sampleRate*numChannels*2);w16(numChannels*2);w16(16);ws('data');w32(length-offset-4);
  const channels=[];for(let ch=0;ch<numChannels;ch++)channels.push(buffer.getChannelData(ch));
  for(let i=0;i<buffer.length;i++){
    for(let ch=0;ch<numChannels;ch++){
      let s=Math.max(-1,Math.min(1,channels[ch][i]));
      s = s<0 ? s*0x8000 : s*0x7FFF;
      view.setInt16(offset,s,true);offset+=2;
    }
  }
  return new Blob([arrBuf],{type:'audio/wav'});
}

// In-Memory Audio-Buffer-Speicher
const audioBufferStore = new Map();
let currentPlayingBuffer = null;
let currentPlayingSource = null;

function playAudioBuffer(buffer, onProgress){
  if(currentPlayingSource){try{currentPlayingSource.stop();}catch(e){}}
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const src = ac.createBufferSource();
  src.buffer = buffer;
  src.connect(ac.destination);
  src.start(0);
  currentPlayingSource = src;currentPlayingBuffer = buffer;
  if(onProgress){
    const start = ac.currentTime;
    const tick = ()=>{
      const elapsed = ac.currentTime - start;
      onProgress(elapsed / buffer.duration);
      if(elapsed < buffer.duration) requestAnimationFrame(tick);
      else onProgress(1);
    };
    requestAnimationFrame(tick);
  }
  return ac;
}

  const wrap=document.createElement('div');wrap.className='mail-layout';body.appendChild(wrap);
  let account=store('haldo_mail_account',null);
  let mails=store('haldo_mail_inbox',[{id:1,from:'HalDo AI',fromEmail:'ai@haldo.ai',to:'halil@haldo.ai',subject:'Willkommen bei HalDo Mail',body:'Hallo Halil,\n\nwillkommen bei deinem HalDo Mail!\n\nDeine E-Mail: halil@haldo.ai',folder:'inbox',date:new Date().toISOString(),read:false}]);
  let folder='inbox';let currentMailId=null;let composeMode=false;
  let templates=store('haldo_mail_templates',MAIL_VORLAGEN.map((t,i)=>({id:'t'+i,...t})));
  let settings=store('haldo_mail_settings',{signature:'Mit freundlichen Grüßen\nHalil Donma\nhalil@haldo.ai',sound:'mail1'});
  const persist=()=>save('haldo_mail_inbox',mails);const persistSettings=()=>save('haldo_mail_settings',settings);
  speak('Willkommen bei HalDo Mail.');
  if(!account){renderKontoSetup();return;}
  function renderKontoSetup(){
    wrap.innerHTML='';
    const s=document.createElement('div');s.className='konto-setup';
    s.innerHTML='<h2>📧 HalDo Mail Konto</h2>';
    s.innerHTML+='<div class="step"><label>E-Mail</label><input id="acc-email" value="halil@haldo.ai" disabled></div>';
    s.innerHTML+='<div class="step"><label>Anzeigename</label><input id="acc-name" value="Halil Donma"></div>';
    s.innerHTML+='<div class="step"><label>Passwort</label><input id="acc-pass" type="password" placeholder="Min. 8 Zeichen"></div>';
    const btn=document.createElement('button');btn.textContent='✓ Konto erstellen';btn.style.cssText='width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:8px;border:none;font-weight:700;cursor:pointer;';
    btn.onclick=()=>{const p=document.getElementById('acc-pass').value;if(p.length<8){alert('Min. 8 Zeichen');return;}account={email:'halil@haldo.ai',name:document.getElementById('acc-name').value};save('haldo_mail_account',account);speak('Konto erstellt.');renderAll();};
    s.appendChild(btn);wrap.appendChild(s);
  }
  function renderAll(){wrap.innerHTML='';const lp=document.createElement('div');lp.className='mail-list-panel';const dp=document.createElement('div');dp.className='mail-detail';wrap.appendChild(lp);wrap.appendChild(dp);renderList(lp,dp);renderDetail(dp);}
  function renderList(lp,dp){
    lp.innerHTML='';
    const tb=document.createElement('div');tb.className='mail-toolbar';
    const bN=document.createElement('button');bN.textContent='✍ Neu';bN.onclick=()=>{composeMode=true;currentMailId=null;renderDetail(dp);};tb.appendChild(bN);
    lp.appendChild(tb);
    const folders=document.createElement('div');folders.className='mail-folders';
    [{id:'inbox',icon:'📥',name:'Posteingang'},{id:'sent',icon:'📤',name:'Gesendet'},{id:'drafts',icon:'📝',name:'Entwürfe'},{id:'templates',icon:'📋',name:'Vorlagen'},{id:'trash',icon:'🗑',name:'Papierkorb'}].forEach(f=>{const el=document.createElement('div');el.className='mail-folder'+(folder===f.id?' active':'');const cnt=mails.filter(m=>m.folder===f.id).length;el.innerHTML='<span>'+f.icon+'</span><span>'+f.name+'</span>'+(cnt?'<span class="count">'+cnt+'</span>':'');el.onclick=()=>{folder=f.id;composeMode=false;currentMailId=null;renderList(lp,dp);renderDetail(dp);};folders.appendChild(el);});
    lp.appendChild(folders);
    const items=document.createElement('div');items.className='mail-items';lp.appendChild(items);
    if(folder==='templates'){templates.forEach(t=>{const el=document.createElement('div');el.className='mail-item';el.innerHTML='<div class="from">'+t.icon+' '+t.title+'</div><div class="preview">'+t.desc+'</div>';el.onclick=()=>{composeMode=true;currentMailId=null;renderDetail(dp,{subject:t.title,body:t.body});};items.appendChild(el);});return;}
    mails.filter(m=>m.folder===folder).sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(m=>{
      const el=document.createElement('div');el.className='mail-item'+(m.id===currentMailId?' active':'')+(!m.read&&folder==='inbox'?' unread':'');
      el.innerHTML='<div class="from">'+esc(m.from)+'</div><div class="subj">'+esc(m.subject)+'</div><div class="preview">'+esc(m.body.substring(0,60))+'</div>';
      el.onclick=()=>{currentMailId=m.id;m.read=true;persist();composeMode=false;renderList(lp,dp);renderDetail(dp);};
      items.appendChild(el);
    });
    if(!mails.filter(m=>m.folder===folder).length)items.innerHTML='<p class="muted" style="padding:16px;">Keine E-Mails.</p>';
  }
  function renderDetail(dp,preset){
    dp.innerHTML='';
    if(composeMode){
      const c=document.createElement('div');c.className='mail-compose';c.innerHTML='<h3>✍ Neue E-Mail</h3>';
      const ai=document.createElement('div');ai.className='mail-ai-bar';ai.innerHTML='<span>🤖 HalDo AI:</span>';
      ['📝 Formulieren','✏️ Korrigieren','📏 Kürzen','🎩 Formell'].forEach(l=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{const ta=document.getElementById('m-body');if(!ta)return;if(l.includes('Korrigieren'))ta.value=ta.value.replace(/\s+/g,' ').trim();else if(l.includes('Kürzen')){const s=ta.value.split(/[.!?]+/).filter(x=>x.trim());ta.value=s.slice(0,3).join('. ')+'.';}else if(l.includes('Formell'))ta.value='Sehr geehrte Damen und Herren,\n\n'+ta.value+'\n\nMit freundlichen Grüßen\nHalil Donma';else ta.value='Sehr geehrte Damen und Herren,\n\n'+ta.value+'\n\nIch freue mich auf Ihre Rückmeldung.';speak('Text angepasst.');};ai.appendChild(b);});
      c.appendChild(ai);
      const f1=document.createElement('div');f1.className='field';f1.innerHTML='<label>Von:</label><input value="halil@haldo.ai" disabled>';
      const f2=document.createElement('div');f2.className='field';f2.innerHTML='<label>An:</label><input id="m-to" placeholder="empfänger@beispiel.de">';
      const f3=document.createElement('div');f3.className='field';f3.innerHTML='<label>Betreff:</label><input id="m-subj" value="'+(preset?.subject||'')+'">';
      const f4=document.createElement('div');f4.className='field';f4.style.alignItems='flex-start';f4.innerHTML='<label style="margin-top:10px;">Nachricht:</label><textarea id="m-body">'+(preset?.body||'')+'</textarea>';
      c.appendChild(f1);c.appendChild(f2);c.appendChild(f3);c.appendChild(f4);
      const acts=document.createElement('div');acts.style.cssText='display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;';
      const bS=document.createElement('button');bS.textContent='📤 Senden';bS.onclick=()=>{const to=document.getElementById('m-to').value.trim();const subj=document.getElementById('m-subj').value.trim();const bd=document.getElementById('m-body').value.trim();if(!to||!subj){alert('An + Betreff');return;}mails.push({id:Date.now(),from:account.name,fromEmail:account.email,to,subject:subj,body:bd,date:new Date().toISOString(),folder:'sent',read:true});persist();if(settings.sound!=='silent')playMailSound(settings.sound);speak('Gesendet.');composeMode=false;folder='sent';renderList(document.querySelector('.mail-list-panel'),dp);renderDetail(dp);};acts.appendChild(bS);
      const bD=document.createElement('button');bD.textContent='📝 Entwurf';bD.className='ghost';bD.onclick=()=>{const to=document.getElementById('m-to').value.trim();const subj=document.getElementById('m-subj').value.trim()||'(Kein Betreff)';const bd=document.getElementById('m-body').value.trim();mails.push({id:Date.now(),from:account.name,fromEmail:account.email,to,subject:subj,body:bd,date:new Date().toISOString(),folder:'drafts',read:true});persist();composeMode=false;folder='drafts';renderList(document.querySelector('.mail-list-panel'),dp);renderDetail(dp);};acts.appendChild(bD);
      const bC=document.createElement('button');bC.textContent='✕';bC.className='ghost';bC.onclick=()=>{composeMode=false;renderDetail(dp);};acts.appendChild(bC);
      c.appendChild(acts);
      dp.appendChild(c);
      const tl=document.createElement('h4');tl.textContent='📋 Vorlagen';c.appendChild(tl);
      const tlist=document.createElement('div');tlist.className='template-list';
      templates.forEach(t=>{const card=document.createElement('div');card.className='template-card';card.innerHTML='<div class="t-icon">'+t.icon+'</div><div class="t-title">'+t.title+'</div><div class="t-desc">'+t.desc+'</div>';card.onclick=()=>{document.getElementById('m-subj').value=t.title;document.getElementById('m-body').value=t.body;};tlist.appendChild(card);});
      c.appendChild(tlist);return;
    }
    if(!currentMailId){dp.innerHTML='<div style="padding:40px;text-align:center;color:var(--dim);"><div style="font-size:60px;">✉️</div><h3 style="color:var(--accent);">HalDo Mail</h3><p>halil@haldo.ai</p></div>';return;}
    const m=mails.find(x=>x.id===currentMailId);if(!m)return;
    dp.innerHTML='<div class="mail-detail-header"><h2>'+esc(m.subject)+'</h2><div class="meta"><span>👤 '+esc(m.from)+'</span><span>📅 '+new Date(m.date).toLocaleString('de-DE')+'</span></div></div><div class="mail-detail-body">'+esc(m.body)+'</div><div class="mail-detail-actions"><button onclick="event.stopPropagation();this.parentElement.parentElement.querySelector(\'.mail-detail\')">↩ Antworten</button><button class="danger" onclick="(function(){const m=window.__currentMail;if(m){m.folder=\'trash\';localStorage.setItem(\'haldo_haldo_mail_inbox\',JSON.stringify(window.__mails||[]));}})()">🗑 Löschen</button></div>';
    const actions=dp.querySelector('.mail-detail-actions');
    if(actions)actions.innerHTML='<button>↩ Antworten</button><button class="danger">🗑</button>';
  }
  renderAll();
};

/* ==================== HALDO NAVIGATION ==================== */
const viewNavigation=function(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';body.appendChild(sb);body.appendChild(ct);
  let active='map';let arrowColor=localStorage.getItem('haldo_arrow_color')||'#fbbf24';
  let route=store('nav_route',{from:'',to:'',distance:0,duration:0});
  speak('Willkommen bei der Navigation.');
  function render(){
    sb.innerHTML='';[['map','🗺️ Karte']].forEach(([id,label])=>{const b=document.createElement('button');b.className='side-btn active';b.textContent=label;sb.appendChild(b);});
    ct.innerHTML='<h3>🗺️ HalDo Navigation</h3>';
    const bar=document.createElement('div');bar.className='nav-search-bar';
    bar.innerHTML='<input id="nav-from" placeholder="📍 Von" value="'+esc(route.from)+'"><input id="nav-to" placeholder="🎯 Nach" value="'+esc(route.to)+'"><button id="nav-go">🚀 Route</button>';
    ct.appendChild(bar);
    const holo=document.createElement('div');holo.className='holo-map';
    holo.innerHTML='<div style="position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:100px;color:'+arrowColor+';text-shadow:0 0 30px '+arrowColor+';">⬆️</div>';
    if(route.from&&route.to)holo.innerHTML+='<div style="position:absolute;bottom:10px;left:10px;right:10px;background:rgba(0,0,0,.8);border:1px solid '+arrowColor+';border-radius:8px;padding:10px;color:'+arrowColor+';font-size:13px;">➡ '+esc(route.to)+' · '+route.distance+' km · '+route.duration+' min</div>';
    ct.appendChild(holo);
    setTimeout(()=>{const go=document.getElementById('nav-go');if(go)go.onclick=()=>{const f=document.getElementById('nav-from').value;const t=document.getElementById('nav-to').value;if(!f||!t){alert('Von/Nach');return;}route.from=f;route.to=t;route.distance=Math.round(Math.random()*200+20);route.duration=Math.round(route.distance*1.2+10);save('nav_route',route);speak('Route berechnet.');render();};},0);
  }
  render();
};

/* ==================== HALDO BLITZER ==================== */
const viewBlitzerApp=function(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';body.appendChild(sb);body.appendChild(ct);
  let currentSpeed=store('blitzer_speed',50);let speedLimit=store('blitzer_limit',50);
  speak('Willkommen bei HalDo Blitzer.');
  function render(){
    sb.innerHTML='';const b=document.createElement('button');b.className='side-btn active';b.textContent='🏁 Tacho';sb.appendChild(b);
    ct.innerHTML='<h3>🚨 HalDo Blitzer</h3>';
    const h=document.createElement('div');h.className='tacho-header';h.innerHTML='<div class="traffic-sign-display"><div class="num">'+speedLimit+'</div></div><div class="header-info"><div class="header-title">Limit</div><div class="header-limit">'+speedLimit+' km/h</div></div>';ct.appendChild(h);
    const t=document.createElement('div');t.className='tacho';
    const pct=Math.min(currentSpeed/(260),1);const angle=-90+pct*180;
    t.innerHTML='<div class="tacho-needle" style="transform:translateX(-50%) rotate('+angle+'deg);"></div><div class="tacho-center"></div><div class="tacho-inner"><div class="tacho-speed">'+currentSpeed+'</div><div class="tacho-unit">km/h</div></div>';
    ct.appendChild(t);
    const ctr=document.createElement('div');ctr.style.cssText='display:flex;gap:10px;justify-content:center;margin-top:12px;';
    ctr.innerHTML='<button id="b-minus">−</button><button id="b-plus">+</button>';
    ct.appendChild(ctr);
    const lg=document.createElement('div');lg.className='speed-limits';lg.style.margin='12px auto;';[30,50,60,70,80,100,120,130].forEach(l=>{const btn=document.createElement('div');btn.className='speed-btn'+(speedLimit===l?' active':'');btn.innerHTML=l+'<small>km/h</small>';btn.onclick=()=>{speedLimit=l;save('blitzer_limit',l);render();};lg.appendChild(btn);});ct.appendChild(lg);
    setTimeout(()=>{
      const m=document.getElementById('b-minus'),p=document.getElementById('b-plus');
      if(m)m.onclick=()=>{currentSpeed=Math.max(0,currentSpeed-5);save('blitzer_speed',currentSpeed);render();};
      if(p)p.onclick=()=>{currentSpeed=Math.min(300,currentSpeed+5);save('blitzer_speed',currentSpeed);render();};
    },0);
  }
  render();
};

/* ==================== HALDO MUSIK STUDIO (ECHTE SYNTHESE) ==================== */
const viewMusic=function(body){
  body.style.cssText='display:flex;height:100%;flex-direction:column;';
  const tabs=document.createElement('div');tabs.className='music-tabs';
  const content=document.createElement('div');content.className='music-content';
  body.appendChild(tabs);body.appendChild(content);
  let active='studio';
  let tracks=store('music_tracks',[]);
  let settings=store('music_settings',{
    prompt:'',bpm:120,key:'C',duration:15,lyrics:'',instrumental:false,
    genres:['Pop'],instrumente:['Klavier','Bass','Schlagzeug'],stimmungen:['Happy'],stimme:'Weiblich (Sopran)',sprache:'Deutsch',langCode:'de'
  });
  const persistTracks=()=>save('music_tracks',tracks);
  const persistSettings=()=>save('music_settings',settings);
  let generating=false;
  speak('Willkommen im HalDo Musik Studio. Ich kann echte Musik generieren.');
  
  function chipsGroup(items,activeItems,onToggle){
    const g=document.createElement('div');g.className='chip-group';
    items.forEach(it=>{
      const c=document.createElement('div');c.className='chip'+(activeItems.includes(it)?' active':'');c.textContent=it;
      c.onclick=()=>{
        if(c.classList.contains('active')){c.classList.remove('active');const i=activeItems.indexOf(it);if(i>-1)activeItems.splice(i,1);}
        else{c.classList.add('active');activeItems.push(it);}
        onToggle&&onToggle();
      };
      g.appendChild(c);
    });
    return g;
  }
  
  function render(){
    tabs.innerHTML='';
    [['studio','🎛️ Studio'],['lyrics','✍️ Songtext'],['voice','🎤 Stimme'],['mixer','🎚️ Mixer'],['library','📚 Bibliothek'],['settings','⚙ Einstellungen']].forEach(([id,label])=>{
      const t=document.createElement('button');t.className='music-tab'+(active===id?' active':'');t.textContent=label;t.onclick=()=>{active=id;render();};tabs.appendChild(t);
    });
    content.innerHTML='';
    if(active==='studio')renderStudio();
    else if(active==='lyrics')renderLyrics();
    else if(active==='voice')renderVoice();
    else if(active==='mixer')renderMixer();
    else if(active==='library')renderLibrary();
    else renderSettings();
  }
  
  function renderStudio(){
    content.innerHTML='<h3>🎛️ Musik generieren</h3>';
    
    // Prompt
    const promptDiv=document.createElement('div');promptDiv.className='music-gen-form';
    promptDiv.innerHTML='<h4>📝 Beschreibe deine Musik</h4><textarea id="mu-prompt" placeholder="z.B. Ein fröhlicher kurdischer Popsong mit Saz und Klavier">'+esc(settings.prompt)+'</textarea>';
    content.appendChild(promptDiv);
    
    // Genres - Multi
    const gT=document.createElement('h4');gT.textContent='🎼 Genres (Mehrfachauswahl)';content.appendChild(gT);
    Object.keys(GENRES).forEach(k=>{
      const lbl=document.createElement('div');lbl.style.cssText='font-size:11px;color:var(--dim);margin:6px 0 2px;';lbl.textContent=k;content.appendChild(lbl);
      content.appendChild(chipsGroup(GENRES[k],settings.genres,persistSettings));
    });
    
    // Instrumente - Multi
    const iT=document.createElement('h4');iT.textContent='🎹 Instrumente (Mehrfachauswahl)';content.appendChild(iT);
    Object.keys(INSTRUMENTE).forEach(k=>{
      const lbl=document.createElement('div');lbl.style.cssText='font-size:11px;color:var(--dim);margin:6px 0 2px;';lbl.textContent=k;content.appendChild(lbl);
      content.appendChild(chipsGroup(INSTRUMENTE[k],settings.instrumente,persistSettings));
    });
    
    // Stimmungen - Multi
    const mT=document.createElement('h4');mT.textContent='🎭 Stimmungen (Mehrfachauswahl)';content.appendChild(mT);
    content.appendChild(chipsGroup(STIMMUNGEN,settings.stimmungen,persistSettings));
    
    // Parameter
    const params=document.createElement('div');params.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:12px;';
    params.innerHTML='<div><label style="font-size:11px;color:var(--dim);">BPM</label><input type="number" id="mu-bpm" value="'+settings.bpm+'" min="60" max="200"></div><div><label style="font-size:11px;color:var(--dim);">Tonart</label><select id="mu-key">'+['C','D','E','F','G','A','B'].map(k=>'<option'+(settings.key===k?' selected':'')+'>'+k+'</option>').join('')+'</select></div><div><label style="font-size:11px;color:var(--dim);">Dauer (s)</label><input type="number" id="mu-dur" value="'+settings.duration+'" min="5" max="60"></div><div><label style="font-size:11px;color:var(--dim);">Instrumental</label><br><span class="toggle '+(settings.instrumental?'on':'')+'" id="mu-inst"></span></div>';
    content.appendChild(params);
    setTimeout(()=>{const el=document.getElementById('mu-inst');if(el)el.onclick=(e)=>{e.stopPropagation();el.classList.toggle('on');};},0);
    
    // Status
    const statusDiv=document.createElement('div');statusDiv.id='mu-status';content.appendChild(statusDiv);
    
    // Generate button
    const genBtn=document.createElement('button');genBtn.id='mu-gen';
    genBtn.textContent=generating?'⏳ Generiere...':'🎼 Song generieren';
    genBtn.style.cssText='margin-top:16px;padding:16px 32px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:700;border-radius:10px;border:none;width:100%;cursor:pointer;'+(generating?'opacity:.6;':'');
    genBtn.disabled=generating;
    genBtn.onclick=async()=>{
      if(generating)return;
      const prompt=document.getElementById('mu-prompt').value;
      if(!prompt && settings.genres.length===0){alert('Bitte Prompt oder Genre wählen.');return;}
      settings.prompt=prompt;
      settings.bpm=parseInt(document.getElementById('mu-bpm').value)||120;
      settings.key=document.getElementById('mu-key').value;
      settings.duration=Math.max(5,Math.min(60,parseInt(document.getElementById('mu-dur').value)||15));
      settings.instrumental=document.getElementById('mu-inst').classList.contains('on');
      persistSettings();
      if(settings.genres.length===0)settings.genres=['Pop'];
      if(settings.instrumente.length===0)settings.instrumente=['Klavier','Bass','Schlagzeug'];
      if(settings.stimmungen.length===0)settings.stimmungen=['Happy'];
      
      generating=true;genBtn.textContent='⏳ Generiere...';genBtn.disabled=true;genBtn.style.opacity='.6';
      const st=document.getElementById('mu-status');
      if(st){st.className='status-msg';st.textContent='🎵 Komponiere...';}
      speak('Ich generiere deine Musik.');
      
      try{
        await new Promise(r=>setTimeout(r,50));
        const buffer=await generateSong({
          bpm:settings.bpm,key:settings.key,duration:settings.duration,
          genres:settings.genres,instrumente:settings.instrumente,
          stimmungen:settings.stimmungen,instrumental:settings.instrumental,
          lyrics:settings.lyrics
        });
        const trackId=Date.now();
        audioBufferStore.set(trackId,buffer);
        const newTrack={id:trackId,title:settings.prompt.substring(0,60)||'Song '+new Date().toLocaleTimeString('de-DE'),genres:[...settings.genres],instrumente:[...settings.instrumente],stimmungen:[...settings.stimmungen],bpm:settings.bpm,key:settings.key,duration:settings.duration,lyrics:settings.lyrics,created:new Date().toISOString()};
        tracks.unshift(newTrack);persistTracks();
        generating=false;
        if(st){st.className='status-msg success';st.textContent='✅ Song fertig! Wechsle zu 📚 Bibliothek zum Abspielen.';}
        playAlarm('chime',2);speak('Song fertig!');
        setTimeout(()=>{active='library';render();},500);
      }catch(e){
        generating=false;
        const st2=document.getElementById('mu-status');
        if(st2){st2.className='status-msg error';st2.textContent='❌ Fehler: '+e.message;}
        genBtn.textContent='🎼 Song generieren';genBtn.disabled=false;genBtn.style.opacity='1';
        console.error(e);
      }
    };
    content.appendChild(genBtn);
  }
  
  function renderLyrics(){
    content.innerHTML='<h3>✍️ Songtext</h3>';
    const topicDiv=document.createElement('div');topicDiv.className='music-gen-form';
    topicDiv.innerHTML='<h4>📝 Thema</h4><textarea id="ly-topic" placeholder="z.B. Ein Liebeslied über den Sommer"></textarea>';
    content.appendChild(topicDiv);
    const genBtn=document.createElement('button');genBtn.textContent='🤖 Songtext generieren';
    genBtn.onclick=()=>{
      const topic=document.getElementById('ly-topic').value;
      if(!topic){alert('Bitte Thema.');return;}
      const lines=topic.split(' ').slice(0,3).join(' ');
      const lyrics='[Verse 1]\nIn der Nacht, wenn Sterne funkeln,\n'+lines+', so fern und nah.\n\n[Chorus]\nHalDo AI, mein Freund im Licht,\nführt mich durch die Dunkelheit.\n\n[Verse 2]\nMelodien aus alten Zeiten,\ntragen mich durch Raum und Zeit.';
      document.getElementById('ly-editor').value=lyrics;
      settings.lyrics=lyrics;persistSettings();
      speak('Songtext generiert.');
    };
    content.appendChild(genBtn);
    const edT=document.createElement('h4');edT.textContent='📝 Editor';content.appendChild(edT);
    const ed=document.createElement('textarea');ed.id='ly-editor';ed.value=settings.lyrics;ed.style.cssText='min-height:300px;font-family:monospace;';ed.oninput=()=>{settings.lyrics=ed.value;persistSettings();};content.appendChild(ed);
    const btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:8px;flex-wrap:wrap;';

        if(recording){if(mr&&mr.state==='recording')mr.stop();recording=false;btn.classList.remove('recording');btn.textContent='🎙️';return;}
        try{
          const stream=await navigator.mediaDevices.getUserMedia({audio:true});
          mr=new MediaRecorder(stream);chunks=[];
          mr.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
          mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());document.getElementById('v-status').textContent='✅ Aufnahme fertig (Demo – echtes Klonen über API)';};

  function renderLibrary(){
    content.innerHTML='<h3>📚 Bibliothek ('+tracks.length+')</h3>';

      const el=document.createElement('div');el.className='music-track';
      el.innerHTML='<div class="track-title">🎵 '+esc(t.title)+'</div><div class="track-meta">'+(t.genres||[]).join(', ')+' · '+(t.stimmungen||[]).join(', ')+' · '+t.bpm+' BPM · '+t.key+' · '+t.duration+'s</div>';
      const actions=document.createElement('div');actions.className='actions';
      const buf=audioBufferStore.get(t.id);
      if(buf){
        const playBtn=document.createElement('button');playBtn.textContent='▶ Abspielen';
        playBtn.onclick=()=>{
          speak('Spiele '+t.title);
          playAudioBuffer(buf);
          if(settings.lyrics && !settings.instrumental && 'speechSynthesis' in window){
            setTimeout(()=>{
              const words=settings.lyrics.replace(/\[.*?\]/g,'').split(/\s+/).filter(w=>w.length>0);
              let i=0;
              const singNext=()=>{
                if(i>=words.length)return;
                const u=new SpeechSynthesisUtterance(words[i]);
                u.lang=LANGCODES[settings.langCode]||'de-DE';
                u.rate=0.7+Math.random()*0.2;u.pitch=0.9+Math.random()*0.4;
                u.onend=()=>{i++;setTimeout(singNext,80);};
                speechSynthesis.speak(u);
              };
              singNext();
            },500);
          }
        };
        actions.appendChild(playBtn);
        const stopBtn=document.createElement('button');stopBtn.textContent='⏹';stopBtn.className='ghost';
        stopBtn.onclick=()=>{if(currentPlayingSource){try{currentPlayingSource.stop();}catch(e){}speechSynthesis.cancel();}};actions.appendChild(stopBtn);
        const dlBtn=document.createElement('button');dlBtn.textContent='💾 WAV';dlBtn.className='ghost';
        dlBtn.onclick=()=>{const wav=audioBufferToWav(buf);const url=URL.createObjectURL(wav);const a=document.createElement('a');a.href=url;a.download=(t.title||'song').replace(/[^a-z0-9]/gi,'_')+'.wav';a.click();URL.revokeObjectURL(url);speak('Download startet.');};actions.appendChild(dlBtn);
      } else {
        actions.innerHTML='<span class="muted" style="font-size:11px;">Audio nicht mehr im Speicher (bitte neu generieren)</span>';
      }
      const delBtn=document.createElement('button');delBtn.textContent='🗑';delBtn.className='danger';
      delBtn.onclick=()=>{if(confirm('Löschen?')){tracks=tracks.filter(x=>x.id!==t.id);audioBufferStore.delete(t.id);persistTracks();render();}};actions.appendChild(delBtn);
      el.appendChild(actions);
      content.appendChild(el);
    });
  }
  
  function renderSettings(){
    content.innerHTML='<h3>⚙ Musik-Einstellungen</h3>';
    content.innerHTML+='<div class="settings-row"><div><div class="lbl">Standard-Sprache</div><div class="sub">Für Gesang</div></div><div class="ctrl"><select id="ms-lang">'+Object.keys(LANGNAMES).map(k=>'<option value="'+k+'"'+(settings.langCode===k?' selected':'')+'>'+LANGNAMES[k]+'</option>').join('')+'</select></div></div>';

  render();
};

const openWindows={};let zCounter=20;const nextZ=()=>zCounter++;
const REGISTRY=[
  {id:'A',ico:'🧠',nm:'HalDo AI',fn:viewAI},{id:'E',ico:'✉️',nm:'HalDo Mail',fn:viewEmail},{id:'N',ico:'🗺️',nm:'Navigation',fn:viewNavigation},{id:'BL',ico:'🚨',nm:'Blitzer',fn:viewBlitzerApp},{id:'MS',ico:'🎵',nm:'Musik Studio',fn:viewMusic},{id:'VD',ico:'🎬',nm:'Video Studio',fn:viewVideo},{id:'BD',ico:'🖼️',nm:'Bild Studio',fn:viewBild},{id:'B',ico:'🌐',nm:'Browser',fn:viewBrowser},{id:'C',ico:'📅',nm:'Calendar',fn:viewCalendar},{id:'D',ico:'📄',nm:'Documents',fn:viewDocuments},{id:'F',ico:'📂',nm:'Files',fn:viewFiles},{id:'G',ico:'🖼️',nm:'Gallery',fn:viewGallery},{id:'H',ico:'🩺',nm:'Health',fn:viewHealth},{id:'I',ico:'🌍',nm:'Internet',fn:viewInternet},{id:'J',ico:'📖',nm:'Journal',fn:viewJournal},{id:'K',ico:'⌨️',nm:'Keyboard',fn:viewKeyboard},{id:'L',ico:'🎓',nm:'Learning',fn:viewLearning},{id:'O',ico:'📊',nm:'Office',fn:viewOffice},{id:'P',ico:'📷',nm:'Photos',fn:viewPhotos},{id:'Q',ico:'🛠️',nm:'Quick Tools',fn:viewQuickTools},{id:'R',ico:'🎙️',nm:'Recorder',fn:viewRecorder},{id:'S',ico:'🛡️',nm:'Security',fn:viewSecurity},{id:'T',ico:'✅',nm:'Tasks',fn:viewTasks},{id:'U',ico:'🔄',nm:'Updates',fn:viewUpdates},{id:'W',ico:'🌤️',nm:'Weather',fn:viewWeather},{id:'X',ico:'🎨',nm:'eXperience',fn:viewExperience},{id:'Y',ico:'🏠',nm:'Your Life',fn:viewYourLife},{id:'Z',ico:'⚙️',nm:'System',fn:viewSystemCenter},{id:'FS',ico:'🚗',nm:'Fahrschule',fn:viewFahrschuleApp},{id:'AU',ico:'🚙',nm:'Auto',fn:viewAutoApp},{id:'KO',ico:'👥',nm:'Kontakte',fn:viewKontakte},{id:'NO',ico:'📝',nm:'Notizen',fn:viewNotizen},{id:'PW',ico:'🔑',nm:'Passwörter',fn:viewPasswort},{id:'FI',ico:'💰',nm:'Finanzen',fn:viewFinanzen},{id:'FT',ico:'💪',nm:'Fitness',fn:viewFitness},{id:'GE',ico:'🔁',nm:'Gewohnheiten',fn:viewGewohnheiten},{id:'WA',ico:'💧',nm:'Wasser',fn:viewWasser},{id:'ST',ico:'😊',nm:'Stimmung',fn:viewStimmung},{id:'RE',ico:'🍳',nm:'Rezepte',fn:viewRezepte},{id:'EI',ico:'🛒',nm:'Einkauf',fn:viewEinkauf},{id:'RS',ico:'✈️',nm:'Reisen',fn:viewReisen},{id:'VO',ico:'📚',nm:'Vokabeln',fn:viewVokabeln},{id:'FL',ico:'🎴',nm:'Flashcards',fn:viewFlashcards},{id:'NF',ico:'🚨',nm:'Notfall',fn:viewNotfall}
];
function populateStartMenu(){const grid=document.getElementById('sm-apps');if(!grid)return;grid.innerHTML='';REGISTRY.forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});}
function filterStartMenu(q){const grid=document.getElementById('sm-apps');if(!grid)return;const filt=REGISTRY.filter(a=>a.nm.toLowerCase().includes(q.toLowerCase()));grid.innerHTML='';filt.forEach(a=>{const card=document.createElement('div');card.className='sm-app-card';card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';card.onclick=()=>openApp(a.id);grid.appendChild(card);});}
document.querySelectorAll('.sm-tab').forEach(tab=>{tab.onclick=(e)=>{e.stopPropagation();document.querySelectorAll('.sm-tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.sm-panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('sm-panel-'+tab.dataset.tab).classList.add('active');if(tab.dataset.tab==='settings')renderSettingsPanel();};});
function toggleStartMenu(e){if(e){e.stopPropagation();e.preventDefault();}const sm=document.getElementById('start-menu');if(sm.classList.contains('show'))sm.classList.remove('show');else{sm.classList.add('show');renderSettingsPanel();}}
document.addEventListener('click',function(e){const sm=document.getElementById('start-menu');if(!sm||!sm.classList.contains('show'))return;if(!e.target||!e.target.isConnected)return;if(sm.contains(e.target))return;if(e.target.closest('.start-btn'))return;sm.classList.remove('show');},false);

/* ==================== SETTINGS ==================== */
const SECTIONS=[{id:'haldocore',icon:'🌌',label:'HalDo Core'},{id:'general',icon:'🔧',label:'Allgemein'},{id:'display',icon:'🎨',label:'Anzeige'},{id:'language',icon:'🌐',label:'Sprache'},{id:'about',icon:'ℹ️',label:'Über'}];
let activeSetting='haldocore';
function renderSettingsPanel(){const nav=document.getElementById('settings-nav');const c=document.getElementById('settings-content');if(!nav||!c)return;nav.innerHTML='';SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='settings-nav-item'+(activeSetting===s.id?' active':'');b.textContent=s.icon+' '+s.label;b.onclick=(e)=>{e.stopPropagation();activeSetting=s.id;renderSettingsPanel();};nav.appendChild(b);});c.innerHTML='';const s=activeSetting;if(s==='haldocore')rHC(c);else if(s==='general')rG(c);else if(s==='display')rD(c);else if(s==='language')rL(c);else rA(c);}
function row(lbl,sub,ctrl){return '<div class="settings-row"><div><div class="lbl">'+lbl+'</div><div class="sub">'+sub+'</div></div><div class="ctrl">'+ctrl+'</div></div>';}
function rHC(c){
  c.innerHTML='<h3>🌌 HalDo Core</h3>';
  c.innerHTML+='<div class="qt-panel" style="margin-bottom:16px;"><h4>Zentrale API (optional)</h4><p style="font-size:12px;line-height:1.6;color:var(--dim);">Für <b>professionellen Gesang</b> (Suno/ElevenLabs) und Videogenerierung. Musik-Synthese funktioniert <b>auch ohne API-Key</b> komplett offline.</p></div>';
  c.innerHTML+=row('🔑 API-Key','Optional','<input type="password" id="core-key" value="'+(localStorage.getItem('haldo_core_key')||'')+'" placeholder="sk-haldo-...">');
  c.innerHTML+=row('🌐 Endpoint','Optional','<input id="core-endpoint" value="'+(localStorage.getItem('haldo_core_endpoint')||'https://api.haldo.ai/v1')+'">');
  const sv=document.createElement('button');sv.textContent='💾 Speichern';sv.style.marginTop='16px';sv.onclick=()=>{localStorage.setItem('haldo_core_key',document.getElementById('core-key').value);localStorage.setItem('haldo_core_endpoint',document.getElementById('core-endpoint').value);alert('✓');};c.appendChild(sv);
}
function rG(c){c.innerHTML='<h3>🔧 Allgemein</h3>';c.innerHTML+=row('Gerätename','','<input value="'+(localStorage.getItem('haldo_device_name')||'HalDo AI OS')+'" oninput="localStorage.setItem(\'haldo_device_name\',this.value)">');}
function rD(c){c.innerHTML='<h3>🎨 Anzeige</h3>';const cur=localStorage.getItem('haldo_theme')||'#06b6d4';const btns=['#06b6d4','#b478ff','#10b981','#f59e0b','#ef4444','#ec4899'].map(col=>'<button style="background:'+col+';width:26px;height:26px;border-radius:50%;border:'+(col===cur?'3px solid #fff':'2px solid transparent')+';cursor:pointer;" onclick="document.documentElement.style.setProperty(\'--accent\',\''+col+'\');document.documentElement.style.setProperty(\'--accent2\',\''+col+'\');localStorage.setItem(\'haldo_theme\',\''+col+'\')"></button>').join('');c.innerHTML+=row('Akzentfarbe','',btns);}
function rL(c){c.innerHTML='<h3>🌐 Sprache</h3>';const sel='<select onchange="setLanguage(this.value)">'+Object.keys(LANGNAMES).map(k=>'<option value="'+k+'"'+(k===currentLang?' selected':'')+'>'+LANGNAMES[k]+'</option>').join('')+'</select>';c.innerHTML+=row('Systemsprache','',sel);}
function rA(c){c.innerHTML='<h3>ℹ️ Über</h3><div class="qt-panel"><h4>HalDo AI OS Pro Max</h4><p>v2.1.0</p><p>Von Halil Donma</p><p>'+REGISTRY.length+' Apps</p><p style="margin-top:8px;font-size:11px;color:var(--dim);">E-Mail: halil@haldo.ai</p></div>';}
function setLanguage(lang){currentLang=lang;localStorage.setItem('haldo_lang',lang);populateStartMenu();renderSettingsPanel();}

/* ==================== WINDOW ==================== */
function openApp(id){const def=REGISTRY.find(a=>a.id===id);if(!def)return;const splash=document.getElementById('app-splash');if(splash){splash.querySelector('.splash-icon').textContent=def.ico;splash.querySelector('.splash-name').textContent=def.nm;splash.classList.add('show');setTimeout(()=>splash.classList.remove('show'),600);}document.getElementById('start-menu').classList.remove('show');if(openWindows[id]){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}return;}const win=document.createElement('div');win.className='window';win.id='win-'+id;win.style.width=id==='E'?'1000px':(id==='MS'||id==='VD'||id==='BD'?'950px':'880px');win.style.height=id==='E'?'640px':'600px';win.style.left=(60+Object.keys(openWindows).length*25)+'px';win.style.top=(40+Object.keys(openWindows).length*25)+'px';win.style.zIndex=nextZ();win.innerHTML='<div class="window-header" onmousedown="startDrag(event,\''+id+'\')"><div class="window-title">'+def.ico+' '+def.nm+'</div><div class="window-controls"><button class="win-btn" onclick="event.stopPropagation();minimizeApp(\''+id+'\')">—</button><button class="win-btn" onclick="event.stopPropagation();maximizeApp(\''+id+'\')">▢</button><button class="win-btn close" onclick="event.stopPropagation();closeApp(\''+id+'\')">✕</button></div></div><div class="window-body" id="body-'+id+'" style="display:flex;flex-direction:column;"></div>';document.body.appendChild(win);openWindows[id]=true;document.getElementById('taskbar-apps').innerHTML+='<div class="taskbar-app" id="tb-'+id+'" onclick="focusApp(\''+id+'\')">'+def.ico+' '+def.nm+'</div>';setTimeout(()=>{try{def.fn(document.getElementById('body-'+id));}catch(e){console.error(e);document.getElementById('body-'+id).innerHTML='<p style="color:#f77;padding:20px;">Fehler: '+e.message+'</p>';}},60);}
function closeApp(id){const w=document.getElementById('win-'+id);if(w)w.remove();const tb=document.getElementById('tb-'+id);if(tb)tb.remove();delete openWindows[id];}
function focusApp(id){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}}
function minimizeApp(id){const w=document.getElementById('win-'+id);if(w)w.classList.toggle('minimized');}
function maximizeApp(id){const w=document.getElementById('win-'+id);if(!w)return;if(w.dataset.max==='1'){w.style.left=w.dataset.l;w.style.top=w.dataset.t;w.style.width=w.dataset.wd;w.style.height=w.dataset.ht;w.dataset.max='0';}else{w.dataset.l=w.style.left;w.dataset.t=w.style.top;w.dataset.wd=w.style.width;w.dataset.ht=w.style.height;w.style.left='0';w.style.top='0';w.style.width='100vw';w.style.height='calc(100vh - 50px)';w.dataset.max='1';}}
let dragState=null;
function startDrag(e,id){if(e.target.closest('.win-btn'))return;const w=document.getElementById('win-'+id);if(!w)return;dragState={id,sx:e.clientX,sy:e.clientY,wx:w.offsetLeft,wy:w.offsetTop};w.style.zIndex=nextZ();}
addEventListener('mousemove',e=>{if(!dragState)return;const w=document.getElementById('win-'+dragState.id);if(!w||w.dataset.max==='1')return;w.style.left=(dragState.wx+e.clientX-dragState.sx)+'px';w.style.top=Math.max(0,dragState.wy+e.clientY-dragState.sy)+'px';});
addEventListener('mouseup',()=>{dragState=null;});

/* ==================== BOOT ==================== */
function enterApp(){document.getElementById('welcome').classList.add('hide');document.getElementById('taskbar').classList.add('show');populateStartMenu();renderSettingsPanel();playGlassSound();const h=document.getElementById('click-hint');if(h)setTimeout(()=>{h.style.opacity='0';},8000);}
function startClock(){const c=document.getElementById('sys-clock');const tick=()=>c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000);}
document.addEventListener('DOMContentLoaded',()=>{initCosmos();startClock();populateStartMenu();renderSettingsPanel();const t2=localStorage.getItem('haldo_theme');if(t2){document.documentElement.style.setProperty('--accent',t2);document.documentElement.style.setProperty('--accent2',t2);}});
</script>
</body>
</html>
