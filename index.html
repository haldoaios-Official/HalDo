<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HalDo Arztbuch - 3D Anatomie Pro Max</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070b12; --bg2:#0d1420;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);
  --accent:#00d4ff; --accent-2:#00ffa3;
  --danger:#ff4d6d; --warn:#ffb703;
  --text:#e8f1ff; --muted:#7e91ab;
  --r:16px;
}
html,body{height:100%;}
body{background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:260px 1fr;position:relative;z-index:1;opacity:0;transition:opacity 0.5s;}
#app.ready{opacity:1;}
#sidebar{background:rgba(10,16,26,.72);backdrop-filter:blur(22px);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;z-index:50;}
.brand-logo{font-size:24px;font-weight:800;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:#c3d1e6;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:all .18s ease;}
.nav-item:hover{background:var(--glass);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,rgba(0,212,255,.18),rgba(0,255,163,.06));border-color:rgba(0,212,255,.3);color:#fff;box-shadow:0 0 20px rgba(0,212,255,.12);}
.nav-item .ico{font-size:16px;width:20px;text-align:center;}
#main{position:relative;overflow:hidden;padding:22px 26px;display:flex;flex-direction:column;height:100vh;height:100dvh;}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding-right:4px;}
.view.active{display:block;}
.view.active.col{display:flex;flex-direction:column;overflow:hidden;}
.anatomy-wrap{display:flex;flex-direction:column;flex:1;min-height:0;gap:14px;}
.anatomy-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative;z-index:10;}
.layer-btn{padding:8px 16px;border-radius:11px;border:1px solid var(--border);background:var(--glass);color:#c3d1e6;font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px;}
.layer-btn:hover{background:var(--glass-2);color:#fff;}
.layer-btn.active{background:linear-gradient(90deg,rgba(0,212,255,.22),rgba(0,255,163,.08));border-color:var(--accent);color:#fff;box-shadow:0 0 18px rgba(0,212,255,.2);}
.spacer{flex:1;}
#anatomy-canvas{flex:1;min-height:320px;border-radius:var(--r);border:1px solid var(--border);background:transparent;overflow:hidden;position:relative;}
#anatomy-canvas canvas{display:block;width:100%!important;height:100%!important;}
.anatomy-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(0,0,0,.5);padding:6px 14px;border-radius:99px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;}
#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:auto;cursor:grab;}
#bg-canvas:active{cursor:grabbing;}

/* HALDO AI CHAT OVERLAY */
#ai-chat-overlay{position:fixed;bottom:20px;right:20px;width:350px;height:450px;background:rgba(10,16,26,0.85);backdrop-filter:blur(24px);border:1px solid var(--accent);border-radius:var(--r);display:none;flex-direction:column;z-index:1000;box-shadow:0 10px 40px rgba(0,212,255,0.2);animation:slideUp 0.3s ease;}
@keyframes slideUp{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
#ai-chat-overlay.show{display:flex;}
.chat-header{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--accent);}
.chat-close{background:none;border:none;color:var(--danger);font-size:20px;cursor:pointer;}
.chat-body{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:13px;}
.msg-ai{background:rgba(255,255,255,0.05);padding:10px;border-radius:10px 10px 10px 0;align-self:flex-start;max-width:80%;}
.msg-user{background:var(--accent);color:#000;padding:10px;border-radius:10px 10px 0 10px;align-self:flex-end;max-width:80%;font-weight:500;}
.chat-input-area{padding:10px;border-top:1px solid var(--border);display:flex;gap:10px;}
.chat-input-area input{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--border);color:#fff;padding:10px;border-radius:8px;outline:none;}
.chat-input-area button{background:var(--accent);border:none;color:#000;padding:0 15px;border-radius:8px;cursor:pointer;font-weight:bold;}

@media (max-width:860px){
  #app{grid-template-columns:1fr;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;transform:translateX(-100%);}
  #sidebar.open{transform:none;}
  #main{padding:66px 16px 16px;}
  #ai-chat-overlay{width:calc(100% - 40px);right:20px;bottom:20px;}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div id="ai-chat-overlay">
  <div class="chat-header">
    <span>🤖 HalDo KI Chat</span>
    <button class="chat-close" onclick="document.getElementById('ai-chat-overlay').classList.remove('show')">×</button>
  </div>
  <div class="chat-body" id="chat-body">
    <div class="msg-ai">Hallo Bruder! Ich bin die HalDo KI. Du hast mich über die Erde aufgerufen. Wie kann ich helfen?</div>
  </div>
  <div class="chat-input-area">
    <input type="text" id="chat-input" placeholder="Frage die KI..." onkeypress="if(event.key==='Enter') sendChatMessage()">
    <button onclick="sendChatMessage()">Senden</button>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div>
        <div class="brand-logo">HalDo</div>
        <div class="brand-sub">Arztbuch Pro Max</div>
      </div>
    </div>
    <div class="nav-section">Übersicht</div>
    <button class="nav-item active" data-view="anatomie"><span class="ico">🧍</span> Anatomie 3D</button>
  </aside>
  <main id="main">
    <section id="view-anatomie" class="view active col">
      <div class="view-head">
        <h1>Anatomie 3D Pro Max</h1>
        <p class="sub">Prozedural · Fotorealistisch · 4 Ebenen</p>
      </div>
      <div class="anatomy-wrap">
        <div class="anatomy-toolbar">
          <button class="layer-btn" data-layer="haut">🫥 Haut</button>
          <button class="layer-btn" data-layer="muskeln">💪 Muskeln</button>
          <button class="layer-btn" data-layer="skelett">🦴 Skelett</button>
          <button class="layer-btn active" data-layer="organe">🫀 Organe</button>
          <div class="spacer"></div>
          <button class="layer-btn" id="resetCam">🔄 Kamera</button>
        </div>
        <div id="anatomy-canvas">
          <div class="anatomy-hint">Ziehen = Drehen · Scrollen = Zoom · Organ anklicken</div>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. WELTRAUM HINTERGRUND (Sonne, Mond, Sterne, Erde + Interaktion)
   CORS-FIX: Alle Texturen über jsDelivr (CORS-freundlich)
============================================================ */
let bgScene, bgCamera, bgRenderer, earthMesh;
let isDraggingEarth = false;
let previousMousePosition = { x: 0, y: 0 };
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function initBackground() {
  const canvas = document.getElementById('bg-canvas');
  bgRenderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  bgRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  bgRenderer.setSize(window.innerWidth, window.innerHeight);
  bgRenderer.toneMapping = THREE.ACESFilmicToneMapping;

  bgScene = new THREE.Scene();
  bgScene.background = new THREE.Color(0x020205);
  bgCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
  bgCamera.position.set(0, 0, 15);

  // STERNE
  const starGeometry = new THREE.BufferGeometry();
  const starCount = 8000;
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i += 3) {
    starPositions[i] = (Math.random() - 0.5) * 2000;
    starPositions[i+1] = (Math.random() - 0.5) * 2000;
    starPositions[i+2] = (Math.random() - 0.5) * 2000;
  }
  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.8 });
  const stars = new THREE.Points(starGeometry, starMaterial);
  bgScene.add(stars);

  // --- SONNE (Echte Textur von jsDelivr) ---
  const textureLoader = new THREE.TextureLoader();
  // Sonnen-Textur von jsDelivr (CORS-freundlich)
  const sunTex = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/planets/sun.jpg');
  sunTex.crossOrigin = 'anonymous';
  
  const sunGeo = new THREE.SphereGeometry(5, 64, 64);
  const sunMat = new THREE.MeshBasicMaterial({ map: sunTex, color: 0xffdd55 });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  sun.position.set(35, 25, -60);
  bgScene.add(sun);
  
  // Sonnen-Glow (Sprite)
  const canvasSun = document.createElement('canvas');
  canvasSun.width = 256; canvasSun.height = 256;
  const ctx = canvasSun.getContext('2d');
  const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
  gradient.addColorStop(0.3, 'rgba(255, 200, 50, 0.6)');
  gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);
  const sunSpriteMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvasSun), blending: THREE.AdditiveBlending, depthTest: false });
  const sunSprite = new THREE.Sprite(sunSpriteMat);
  sunSprite.scale.set(45, 45, 1);
  sunSprite.position.copy(sun.position);
  bgScene.add(sunSprite);

  // --- ERDE (Höher positioniert, CORS-freundlich) ---
  const earthMap = textureLoader.load('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg');
  earthMap.crossOrigin = 'anonymous';
  const earthGeo = new THREE.SphereGeometry(5, 64, 64);
  const earthMat = new THREE.MeshStandardMaterial({ map: earthMap, roughness: 0.7, metalness: 0.1 });
  earthMesh = new THREE.Mesh(earthGeo, earthMat);
  earthMesh.position.set(-10, 4, -20); // Höher und weiter links
  bgScene.add(earthMesh);

  // --- MOND (CORS-FIX: jsDelivr) ---
  // Mond-Textur von jsDelivr (CORS-freundlich)
  const moonTex = textureLoader.load('https://cdn.jsdelivr.net/gh/homer-jay/solar-system-textures@master/moon.jpg');
  moonTex.crossOrigin = 'anonymous';
  const moonGeo = new THREE.SphereGeometry(1.5, 32, 32);
  const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1.0 });
  const moon = new THREE.Mesh(moonGeo, moonMat);
  moon.position.set(18, 12, -15); // Oben rechts, weit weg von der Sonne
  bgScene.add(moon);

  // Lichter
  const sunLight = new THREE.PointLight(0xffccaa, 5000, 1000);
  sunLight.position.copy(sun.position);
  bgScene.add(sunLight);
  bgScene.add(new THREE.AmbientLight(0x111122, 1));

  // --- INTERAKTION ERDE (KLICKEN & VERSCHIEBEN) ---
  canvas.addEventListener('pointerdown', (e) => {
    isDraggingEarth = true;
    previousMousePosition = { x: e.clientX, y: e.clientY };
    
    // Klick prüfen
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, bgCamera);
    const intersects = raycaster.intersectObject(earthMesh);
    if (intersects.length > 0) {
      document.getElementById('ai-chat-overlay').classList.add('show');
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (isDraggingEarth) {
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;
      earthMesh.position.x += deltaX * 0.05;
      earthMesh.position.y -= deltaY * 0.05;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    }
  });

  canvas.addEventListener('pointerup', () => { isDraggingEarth = false; });
  canvas.addEventListener('pointerleave', () => { isDraggingEarth = false; });

  const clock = new THREE.Clock();
  function animateBg() {
    requestAnimationFrame(animateBg);
    const delta = clock.getDelta();
    earthMesh.rotation.y += delta * 0.03;
    moon.rotation.y += delta * 0.01;
    stars.rotation.y += delta * 0.001;
    bgRenderer.render(bgScene, bgCamera);
  }
  animateBg();

  window.addEventListener('resize', () => {
    bgRenderer.setSize(window.innerWidth, window.innerHeight);
    bgCamera.aspect = window.innerWidth / window.innerHeight;
    bgCamera.updateProjectionMatrix();
  });
}
initBackground();

// Chat Funktion
window.sendChatMessage = function() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  const body = document.getElementById('chat-body');
  
  body.innerHTML += `<div class="msg-user">${text}</div>`;
  input.value = '';
  body.scrollTop = body.scrollHeight;

  setTimeout(() => {
    body.innerHTML += `<div class="msg-ai">Ich bin eine Demo-KI im 3D-Modus. Die echte HalDo KI wird bald hier sein! Deine Nachricht: "${text}"</div>`;
    body.scrollTop = body.scrollHeight;
  }, 1000);
};

/* ============================================================
   2. FOTOREALISTISCHE ANATOMIE (Prozedural Extreme)
============================================================ */
let scene, camera, renderer, controls;
let bodyGroup, currentLayer = 'organe';
const layers = {};
let organMeshes = [];

function initAnatomy() {
  const host = document.getElementById('anatomy-canvas');
  const w = host.clientWidth, h = host.clientHeight;

  scene = new THREE.Scene();
  scene.background = null; 

  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
  camera.position.set(0, 1.15, 3.1);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  host.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.0, 0);
  controls.enableDamping = true;
  controls.minDistance = 1.0;
  controls.maxDistance = 5.5;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  // --- ULTRA REALISTISCHE BELEUCHTUNG ---
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const keyLight = new THREE.DirectionalLight(0xfff0e0, 2.5); 
  keyLight.position.set(2, 3, 4); 
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x00d4ff, 1.0); 
  fillLight.position.set(-3, 1, 2); 
  scene.add(fillLight);
  const rimLight = new THREE.DirectionalLight(0xffffff, 1.5); 
  rimLight.position.set(0, 4, -4); 
  scene.add(rimLight);

  // --- MATERIALIEN (SSS für Haut) ---
  const skinMat = new THREE.MeshPhysicalMaterial({
    color: 0xffdbba, 
    roughness: 0.35, 
    metalness: 0.0,
    clearcoat: 0.2, 
    clearcoatRoughness: 0.3,
    transmission: 0.3, // Subsurface Scattering
    thickness: 1.0, 
    ior: 1.4,
    envMapIntensity: 1.0
  });
  
  const muscleMat = new THREE.MeshStandardMaterial({ color: 0xb32b2b, roughness: 0.65 });
  const boneMat = new THREE.MeshStandardMaterial({ color: 0xf4f0e6, roughness: 0.45 });

  // --- DER KÖRPER (Detailliert) ---
  bodyGroup = new THREE.Group();
  scene.add(bodyGroup);
  
  layers.haut = new THREE.Group();
  layers.muskeln = new THREE.Group();
  layers.skelett = new THREE.Group();
  layers.organe = new THREE.Group();
  bodyGroup.add(layers.haut, layers.muskeln, layers.skelett, layers.organe);

  const add = (group, geo, mat, pos, scl) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(pos[0], pos[1], pos[2]);
    if(scl) m.scale.set(scl[0], scl[1], scl[2]);
    group.add(m); return m;
  };

  // --- HAUT EBENE ---
  add(layers.haut, new THREE.SphereGeometry(0.13, 32, 32), skinMat, [0, 1.7, 0], [1, 1.15, 0.95]); // Kopf
  add(layers.haut, new THREE.CylinderGeometry(0.055, 0.07, 0.15, 32), skinMat, [0, 1.55, 0]); // Nacken
  for (const s of [1, -1]) add(layers.haut, new THREE.CylinderGeometry(0.02, 0.02, 0.25, 16), skinMat, [s*0.12, 1.45, 0.05], [0, 0, Math.PI/2]); // Schlüsselbeine
  
  // Torso
  const torsoPoints = [];
  torsoPoints.push(new THREE.Vector2(0.12, 0.8));   // Hüfte
  torsoPoints.push(new THREE.Vector2(0.16, 1.0));  // Taille
  torsoPoints.push(new THREE.Vector2(0.22, 1.25)); // Brust
  torsoPoints.push(new THREE.Vector2(0.25, 1.42)); // Schultern
  const torsoGeo = new THREE.LatheGeometry(torsoPoints, 32);
  add(layers.haut, torsoGeo, skinMat, [0, 0, 0], [1.2, 1, 0.7]);

  // Arme
  for (const s of [1, -1]) {
    add(layers.haut, new THREE.SphereGeometry(0.09, 32, 32), skinMat, [s*0.28, 1.4, 0], [1, 1.1, 1]); // Schulter
    add(layers.haut, new THREE.CapsuleGeometry(0.07, 0.28, 16, 32), skinMat, [s*0.31, 1.1, 0]); // Bizeps
    add(layers.haut, new THREE.CapsuleGeometry(0.055, 0.25, 16, 32), skinMat, [s*0.33, 0.75, 0]); // Unterarm
    add(layers.haut, new THREE.BoxGeometry(0.07, 0.12, 0.03), skinMat, [s*0.34, 0.55, 0.02]); // Hand
  }

  // Beine
  for (const s of [1, -1]) {
    add(layers.haut, new THREE.CapsuleGeometry(0.11, 0.35, 16, 32), skinMat, [s*0.12, 0.6, 0]); // Oberschenkel
    add(layers.haut, new THREE.CapsuleGeometry(0.08, 0.35, 16, 32), skinMat, [s*0.12, 0.2, 0]); // Unterschenkel
    add(layers.haut, new THREE.BoxGeometry(0.12, 0.08, 0.25), skinMat, [s*0.12, 0.0, 0.06]); // Fuß
  }

  // --- MUSKELN EBENE ---
  for (const s of [1, -1]) {
    add(layers.muskeln, new THREE.SphereGeometry(0.12, 32, 32), muscleMat, [s*0.1, 1.28, 0.09], [1.2, 0.7, 0.5]); // Brust
    for (let i = 0; i < 3; i++) {
      add(layers.muskeln, new THREE.BoxGeometry(0.08, 0.08, 0.06), muscleMat, [s*0.045, 1.15 - i*0.1, 0.11]); // Bauch
    }
    add(layers.muskeln, new THREE.SphereGeometry(0.075, 32, 32), muscleMat, [s*0.31, 1.1, 0.02], [1, 1.6, 1]); // Bizeps
    add(layers.muskeln, new THREE.CapsuleGeometry(0.11, 0.3, 16, 32), muscleMat, [s*0.12, 0.6, 0.02]); // Oberschenkel
  }

  // --- SKELETT EBENE ---
  add(layers.skelett, new THREE.SphereGeometry(0.1, 32, 32), boneMat, [0, 1.7, 0]); // Schädel
  add(layers.skelett, new THREE.CylinderGeometry(0.035, 0.035, 0.7, 16), boneMat, [0, 1.1, -0.02]); // Wirbelsäule
  for (let i = 0; i < 6; i++) {
    const rib = new THREE.Mesh(new THREE.TorusGeometry(0.17 - i*0.018, 0.015, 16, 32), boneMat);
    rib.position.set(0, 1.38 - i*0.08, 0);
    rib.rotation.x = Math.PI / 2;
    rib.scale.set(1, 0.65, 1);
    layers.skelett.add(rib);
  }

  // --- ORGANE EBENE ---
  const addOrgan = (geo, pos, color, key, scl) => {
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, emissive: color, emissiveIntensity: 0.2 });
    const m = add(layers.organe, geo, mat, pos, scl);
    m.userData.organ = key;
    organMeshes.push(m);
  };

  addOrgan(new THREE.SphereGeometry(0.08, 32, 32), [0, 1.7, 0], '#f2a0c0', 'brain'); // Gehirn
  addOrgan(new THREE.SphereGeometry(0.07, 32, 32), [-0.04, 1.28, 0.04], '#e63946', 'heart', [1, 1.3, 1]); // Herz
  addOrgan(new THREE.SphereGeometry(0.09, 32, 32), [0.09, 1.3, 0], '#f4a6b8', 'lunge', [0.8, 1.5, 0.8]); // Lunge R
  addOrgan(new THREE.SphereGeometry(0.09, 32, 32), [-0.09, 1.3, 0], '#f4a6b8', 'lunge', [0.8, 1.5, 0.8]); // Lunge L
  addOrgan(new THREE.SphereGeometry(0.1, 32, 32), [0.08, 1.05, 0.04], '#8b2e2e', 'liver', [1.2, 0.7, 0.9]); // Leber

  setLayer(currentLayer);

  // Raycaster für Klicks
  const rc = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (!layers.organe.visible) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ptr.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    ptr.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    rc.setFromCamera(ptr, camera);
    const hits = rc.intersectObjects(organMeshes, false);
    if (hits.length) {
      alert("Organ angeklickt: " + hits[0].object.userData.organ.toUpperCase());
    }
  });

  const ro = new ResizeObserver(() => {
    const w = host.clientWidth, h = host.clientHeight;
    if(!w || !h) return;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  ro.observe(host);

  animate();
}

function setLayer(name) {
  currentLayer = name;
  for (const k in layers) if(layers[k]) layers[k].visible = (k === name);
  document.querySelectorAll('.layer-btn[data-layer]').forEach(b => b.classList.toggle('active', b.dataset.layer === name));
}

document.querySelectorAll('.layer-btn[data-layer]').forEach(b => b.addEventListener('click', () => setLayer(b.dataset.layer)));

document.getElementById('resetCam').addEventListener('click', () => {
  camera.position.set(0, 1.15, 3.1);
  controls.target.set(0, 1.0, 0);
  controls.update();
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// Start
setTimeout(() => {
  document.getElementById('app').classList.add('ready');
  initAnatomy();
}, 500);
</script>
</body>
</html>
