<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦚 HalDo AI OS</title>
<link rel="icon" href="logo.png">
<style>
  :root{
    --primary:#00d4ff;--primary-2:#7c3aed;--accent:#f5c542;
    --bg:#050810;--bg-2:#0a0f1c;--bg-3:#0f1524;
    --sidebar:#070b15;
    --panel:rgba(255,255,255,.035);--panel-2:rgba(255,255,255,.06);
    --border:rgba(0,212,255,.12);--border-2:rgba(255,255,255,.07);
    --text:#e6f0ff;--text-dim:#7a8ba8;
    --success:#22c55e;--danger:#ef4444;--warn:#f59e0b;
    --radius:14px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --sidebar-w:230px;
  }
  body.light-mode{
    --bg:#eef2f8;--bg-2:#fff;--bg-3:#f8fafc;--sidebar:#fff;
    --panel:rgba(0,0,0,.03);--panel-2:rgba(0,0,0,.06);
    --border:rgba(0,100,150,.15);--border-2:rgba(0,0,0,.08);
    --text:#0a1424;--text-dim:#5a6b85;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);min-height:100vh;overflow-x:hidden;
    transition:background .3s;
  }
  body.light-mode{background:linear-gradient(135deg,#eef2f8 0%,#e0e8f5 100%)}
  body:not(.light-mode){
    background:
      radial-gradient(900px 600px at 20% -10%,rgba(0,212,255,.08),transparent 60%),
      radial-gradient(800px 500px at 100% 0%,rgba(124,58,237,.08),transparent 55%),
      var(--bg);
  }
  body.no-anim *{animation:none!important;transition:none!important}

  #boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
  #boot img{width:110px;height:110px;object-fit:contain;animation:pulse 1.2s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--primary))}
  #boot h1{margin-top:18px;font-size:20px;letter-spacing:4px;color:var(--primary);font-weight:500}
  #boot p{margin-top:8px;font-size:12px;color:var(--text-dim);letter-spacing:2px}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
  #boot.hide{opacity:0;pointer-events:none}

  #shell{display:flex;min-height:100vh}

  #sidebar{
    width:var(--sidebar-w);flex-shrink:0;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    overflow-y:auto;scrollbar-width:thin;
  }
  #sidebar::-webkit-scrollbar{width:5px}
  #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .sb-brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;border-bottom:1px solid var(--border)}
  .sb-brand img{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 8px var(--primary))}
  .sb-brand .nm{font-size:15px;font-weight:700;letter-spacing:.5px}
  .sb-brand .nm span{color:var(--primary)}
  .sb-brand .st{font-size:9.5px;color:var(--text-dim);letter-spacing:1.5px;margin-top:1px}

  .sb-group{padding:14px 12px 6px}
  .sb-group-lbl{font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;padding:0 8px 8px;font-weight:600}

  .sb-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:10px;
    color:var(--text-dim);font-size:13.5px;font-weight:500;
    cursor:pointer;font-family:inherit;
    background:transparent;border:none;
    width:100%;text-align:left;
    transition:all .15s;
  }
  .sb-item img{width:18px;height:18px;object-fit:contain;opacity:.7}
  .sb-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
  .sb-item:hover{background:var(--panel-2);color:var(--text)}
  .sb-item.active{
    background:linear-gradient(90deg,rgba(0,212,255,.15),rgba(124,58,237,.08));
    color:var(--text);
    box-shadow:inset 2px 0 0 var(--primary);
  }
  .sb-item.active img{opacity:1;filter:drop-shadow(0 0 6px var(--primary))}
  .sb-item .badge-m{margin-left:auto;font-size:9.5px;padding:2px 6px;border-radius:8px;background:rgba(0,212,255,.15);color:var(--primary);font-weight:700}

  .sb-sub{padding:2px 0 0 42px}
  .sb-sub .sb-item{font-size:12.5px;padding:7px 10px}

  .sb-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim)}
  .sb-footer .live{display:inline-flex;align-items:center;gap:6px}
  .sb-footer .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}

  #main{flex:1;min-width:0;display:flex;flex-direction:column}

  #topbar{
    position:sticky;top:0;z-index:100;
    display:flex;align-items:center;gap:14px;
    padding:12px 24px;
    background:color-mix(in srgb,var(--bg) 78%,transparent);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  #topbar .page-title{font-size:15px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:9px}
  #topbar .page-title .crumb{color:var(--text-dim);font-weight:400;font-size:13px}
  #topbar .spacer{flex:1}
  #topbar .pill{
    display:flex;align-items:center;gap:8px;
    padding:6px 12px;border-radius:20px;
    background:var(--panel);border:1px solid var(--border);
    font-size:12px;color:var(--text-dim);
  }
  #topbar .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse-dot 2s infinite}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

  #view{flex:1;padding:24px 28px 60px;max-width:1400px;width:100%;margin:0 auto}
  body:not(.no-anim) #view{animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  #menu-toggle{display:none;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:9px;cursor:pointer;font-size:16px}
  @media(max-width:820px){
    #sidebar{position:fixed;left:-260px;z-index:200;transition:left .25s}
    #sidebar.open{left:0;box-shadow:8px 0 40px rgba(0,0,0,.6)}
    #menu-toggle{display:block}
    #view{padding:18px}
  }

  .hero{
    display:flex;align-items:center;gap:22px;
    padding:26px;border-radius:var(--radius);
    background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(124,58,237,.08));
    border:1px solid var(--border);
    margin-bottom:22px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(600px 300px at 100% 50%,rgba(0,212,255,.1),transparent 70%);
    pointer-events:none;
  }
  .hero img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 14px var(--primary))}
  .hero .h-text h2{font-size:21px;margin-bottom:4px}
  .hero .h-text p{color:var(--text-dim);font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
  .stat{
    padding:18px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--border);
    transition:all .18s;position:relative;overflow:hidden;
  }
  .stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--primary),transparent);opacity:0;transition:opacity .2s}
  .stat:hover{background:var(--panel-2);transform:translateY(-2px);border-color:rgba(0,212,255,.3)}
  .stat:hover::before{opacity:1}
  .stat .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.3px;margin-bottom:8px}
  .stat .value{font-size:26px;font-weight:700;color:var(--primary);text-shadow:0 0 20px rgba(0,212,255,.4)}
  .stat .sub{font-size:11.5px;color:var(--text-dim);margin-top:4px}

  .section-title{display:flex;align-items:center;gap:10px;margin:8px 0 14px;font-size:15px;font-weight:600}
  .section-title .emoji{font-size:18px}
  .section-title .badge{margin-left:auto}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .app-card{
    padding:16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    cursor:pointer;transition:all .18s;
    display:flex;flex-direction:column;gap:8px;
    text-align:left;font-family:inherit;color:var(--text);
  }
  .app-card:hover{background:var(--panel-2);border-color:rgba(0,212,255,.4);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,255,.08)}
  .app-card .icon{font-size:24px}
  .app-card .name{font-size:13.5px;font-weight:600}
  .app-card .desc{font-size:11.5px;color:var(--text-dim);line-height:1.4}

  .placeholder{
    padding:40px 24px;border-radius:var(--radius);
    background:var(--panel);border:1px dashed var(--border);
    text-align:center;color:var(--text-dim);
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .placeholder img{width:56px;opacity:.7}
  .placeholder h3{color:var(--text);font-size:15px}
  .placeholder p{font-size:13px;max-width:460px;line-height:1.5}

  .badge{
    display:inline-block;padding:3px 9px;border-radius:20px;
    background:rgba(0,212,255,.12);color:var(--primary);
    font-size:10.5px;font-weight:600;letter-spacing:.3px;
    border:1px solid rgba(0,212,255,.3);
  }

  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    padding:8px 16px;border-radius:8px;background:transparent;border:none;
    color:var(--text-dim);font-size:13px;font-weight:500;cursor:pointer;
    font-family:inherit;transition:all .15s;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
  }
  .tabs button:hover{color:var(--text);background:var(--panel-2)}
  .tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 0 16px rgba(0,212,255,.3)}

  .setting-panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
  .setting-panel h2{font-size:17px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
  .setting-panel .panel-desc{color:var(--text-dim);font-size:13px;margin-bottom:18px;line-height:1.5}

  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border-2)}
  .setting-row:last-child{border-bottom:none}
  .setting-row .info{flex:1;min-width:0}
  .setting-row .info .lbl{font-size:13.5px;font-weight:500;margin-bottom:3px}
  .setting-row .info .hint{font-size:11.5px;color:var(--text-dim);line-height:1.4}
  .setting-row input[type="text"],.setting-row input[type="number"],.setting-row input[type="password"],.setting-row input[type="date"],.setting-row input[type="time"],.setting-row select,.setting-row textarea{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:9px;font-family:inherit;font-size:13px;min-width:160px;outline:none}
  .setting-row input:focus,.setting-row select:focus,.setting-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
  .setting-row input[type="color"]{width:50px;height:36px;padding:2px;border-radius:9px;border:1px solid var(--border);background:var(--bg-2);cursor:pointer}
  .setting-row input[type="range"]{width:180px;accent-color:var(--primary)}
  .setting-row textarea{min-width:280px;min-height:70px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}

  .toggle{position:relative;width:46px;height:26px;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .2s;flex-shrink:0}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:all .2s}
  .toggle.on{background:rgba(0,212,255,.25);border-color:var(--primary)}
  .toggle.on::after{left:22px;background:var(--primary);box-shadow:0 0 10px var(--primary)}

  .btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
  .btn:hover{background:var(--panel);border-color:rgba(0,212,255,.4)}
  .btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border:none;color:#fff;box-shadow:0 4px 16px rgba(0,212,255,.25)}
  .btn.primary:hover{box-shadow:0 6px 24px rgba(0,212,255,.4)}
  .btn.danger{background:rgba(239,68,68,.12);border-color:var(--danger);color:var(--danger)}

  .theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
  .theme-btn{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-family:inherit;color:var(--text);display:flex;flex-direction:column;gap:8px;align-items:center;transition:all .15s}
  .theme-btn:hover{border-color:rgba(0,212,255,.4)}
  .theme-btn .swatch{width:100%;height:24px;border-radius:6px;display:flex;overflow:hidden}
  .theme-btn .swatch span{flex:1}
  .theme-btn .tname{font-size:11.5px;font-weight:500}

  .storage-list{max-height:220px;overflow-y:auto;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .storage-list .key{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-2);gap:10px}
  .storage-list .key:last-child{border-bottom:none}
  .storage-list .key .k{color:var(--primary);flex-shrink:0}
  .storage-list .key .v{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .app-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .app-header h2{font-size:19px;display:flex;align-items:center;gap:10px}
  .app-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .app-toolbar input[type="text"],.app-toolbar input[type="search"],.app-toolbar select{background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:10px;font-family:inherit;font-size:13.5px;outline:none;flex:1;min-width:180px}
  .app-toolbar input:focus,.app-toolbar select:focus{border-color:var(--primary)}
  .app-toolbar select{flex:0 0 auto;min-width:130px}
  .icon-btn{background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:15px;transition:all .15s}
  .icon-btn:hover{background:var(--panel-2);color:var(--text)}

  .notes-list{display:flex;flex-direction:column;gap:10px}
  .note-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:all .15s}
  .note-item:hover{border-color:rgba(0,212,255,.4);background:var(--panel-2)}
  .note-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
  .note-title{font-size:15px;font-weight:600;word-break:break-word}
  .note-actions{display:flex;gap:2px;flex-shrink:0}
  .note-body{color:var(--text-dim);font-size:13px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
  .note-meta{margin-top:8px;font-size:11px;color:var(--text-dim);opacity:.7}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;animation:fadeIn .15s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(0,212,255,.1)}
  .modal-header h3{font-size:16px}
  .modal-title{background:var(--bg-3);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;outline:none}
  .modal-title:focus{border-color:var(--primary)}
  .modal-body{background:var(--bg-3);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:10px;font-family:inherit;font-size:13.5px;line-height:1.6;outline:none;min-height:240px;resize:vertical}
  .modal-body:focus{border-color:var(--primary)}
  .modal-footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .tasks-list{display:flex;flex-direction:column;gap:8px}
  .task-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:11px;transition:all .15s}
  .task-item:hover{background:var(--panel-2)}
  .task-item.done{opacity:.55}
  .task-item.done .task-title{text-decoration:line-through}
  .task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s;margin-top:1px}
  .task-check:hover{border-color:var(--primary)}
  .task-item.done .task-check{background:var(--primary);border-color:var(--primary);color:#000}
  .task-body{flex:1;min-width:0}
  .task-title{font-size:14px;font-weight:500;margin-bottom:3px;word-break:break-word}
  .task-meta{font-size:11.5px;color:var(--text-dim);display:flex;gap:10px;flex-wrap:wrap}
  .prio{padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:600}
  .prio.low{background:rgba(34,197,94,.15);color:#22c55e}
  .prio.med{background:rgba(245,197,66,.15);color:#f5c542}
  .prio.high{background:rgba(239,68,68,.15);color:#ef4444}

  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .cal-head h3{font-size:17px;font-weight:600;min-width:200px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px}
  .cal-dow{text-align:center;font-size:11.5px;font-weight:600;color:var(--text-dim);padding:6px 0;text-transform:uppercase;letter-spacing:1px}
  .cal-day{aspect-ratio:1;border-radius:10px;background:var(--bg-3);border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 4px;font-size:13px;color:var(--text);transition:all .15s;position:relative;font-family:inherit}
  .cal-day:hover{border-color:rgba(0,212,255,.4);background:var(--panel-2)}
  .cal-day.other{opacity:.35}
  .cal-day.today{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(124,58,237,.2));border-color:var(--primary);font-weight:700}
  .cal-day.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,212,255,.4)}
  .cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
  .cal-day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .cal-events{margin-top:20px}
  .cal-events h3{font-size:15px;margin-bottom:10px}
  .event-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:6px}
  .event-time{font-weight:600;color:var(--primary);font-size:13px;min-width:52px}
  .event-title{flex:1;font-size:13.5px;word-break:break-word}

  .av-wrap{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
  @media(max-width:980px){.av-wrap{grid-template-columns:1fr}}

  .av-stage{
    background:linear-gradient(180deg,rgba(0,20,40,.4),rgba(10,15,28,.6));
    border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px;
    position:relative;overflow:hidden;
  }
  .av-stage::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(500px 400px at 50% 30%,rgba(0,212,255,.12),transparent 70%),
      radial-gradient(300px 200px at 50% 100%,rgba(124,58,237,.15),transparent 70%);
    pointer-events:none;
  }
  #avatarCanvas{position:relative;z-index:1;border-radius:16px;cursor:crosshair;background:transparent}

  .av-modes{display:flex;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px;position:relative;z-index:1}
  .av-modes button{padding:7px 14px;border-radius:8px;background:transparent;border:none;color:var(--text-dim);font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
  .av-modes button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 0 14px rgba(0,212,255,.4)}

  .av-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
  .av-mic{
    width:62px;height:62px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));
    border:none;color:#fff;font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 22px rgba(0,212,255,.4);
    transition:all .2s;
  }
  .av-mic:hover{transform:scale(1.05);box-shadow:0 8px 32px rgba(0,212,255,.6)}
  .av-mic.listening{animation:micPulse 1s ease-in-out infinite;background:linear-gradient(135deg,var(--danger),#f97316)}
  .av-mic.speaking{background:linear-gradient(135deg,var(--primary-2),#ec4899)}
  @keyframes micPulse{0%,100%{box-shadow:0 6px 22px rgba(239,68,68,.4);transform:scale(1)}50%{box-shadow:0 8px 44px var(--danger);transform:scale(1.08)}}

  .av-status{font-size:12.5px;color:var(--text-dim);text-align:center;min-height:18px;position:relative;z-index:1}
  .av-status .live{color:var(--primary);font-weight:600}

  .av-chat{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:column;height:620px;max-height:75vh;
    position:relative;overflow:hidden;
  }
  .av-chat::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--primary),transparent);
    opacity:.5;
  }
  .av-chat h3{font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)}
  .av-chat h3 .badge{margin-left:auto;text-transform:none}
  .av-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:6px;margin-bottom:12px}
  .av-log::-webkit-scrollbar{width:6px}
  .av-log::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .msg{padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.5;max-width:85%;word-wrap:break-word;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(124,58,237,.2));border:1px solid rgba(0,212,255,.35)}
  .msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--border)}
  .msg.sys{align-self:center;font-size:11.5px;color:var(--text-dim);background:transparent;padding:4px;text-align:center}
  .msg .who{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .msg.user .who{color:var(--primary)}

  .av-input-row{display:flex;gap:8px}
  .av-input-row input{flex:1;background:var(--bg-2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-family:inherit;font-size:13.5px;outline:none}
  .av-input-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
  .av-input-row button{padding:0 20px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));border:none;color:#fff;font-size:16px;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(0,212,255,.3)}

  .av-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .av-quick button{padding:5px 10px;border-radius:14px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);font-size:11.5px;cursor:pointer;font-family:inherit;transition:all .15s}
  .av-quick button:hover{color:var(--text);border-color:rgba(0,212,255,.4)}

  .api-warning{background:rgba(245,197,66,.08);border:1px solid var(--accent);color:var(--accent);padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:10px;line-height:1.5}

  .emoji-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .emoji-row button{padding:6px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-size:18px;cursor:pointer;transition:all .15s}
  .emoji-row button:hover{border-color:rgba(0,212,255,.4);transform:scale(1.1)}
  .emoji-row button.active{border-color:var(--primary);background:rgba(0,212,255,.15)}

  footer{padding:20px;text-align:center;color:var(--text-dim);font-size:11.5px;border-top:1px solid var(--border);margin-top:20px}
  footer img{width:14px;vertical-align:middle;margin-right:6px;opacity:.6}
</style>
</head>
<body>

<div id="boot">
  <img src="logo.png" alt="HalDo">
  <h1>HALDO AI OS</h1>
  <p>INITIALIZING…</p>
</div>

<div id="shell">
  <aside id="sidebar">
    <div class="sb-brand">
      <img src="logo.png" alt="Logo">
      <div>
        <div class="nm">HalDo <span>AI</span></div>
        <div class="st">OS v2 · PHASE 6.2</div>
      </div>
    </div>
    <div id="sb-nav"></div>
    <div class="sb-footer">
      <div class="live">System Online</div>
      <div style="margin-top:4px;opacity:.7" id="sb-time">--:--</div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="page-title" id="page-title">🏠 Home</div>
      <div class="spacer"></div>
      <div class="pill"><span class="dot"></span><span id="clock">--:--</span></div>
    </header>
    <main id="view"></main>
    <footer>
      <img src="logo.png" alt="">
      HalDo AI OS · Phase 6 Teil 2 — Perfektionierter Avatar
    </footer>
  </div>
</div>

<script>
(function(){
  "use strict";

  const Storage = {
    prefix:"haldo_v2_",
    get(k,d=null){try{const r=localStorage.getItem(this.prefix+k);return r===null?d:JSON.parse(r);}catch(e){return d;}},
    set(k,v){try{localStorage.setItem(this.prefix+k,JSON.stringify(v));return true;}catch(e){console.warn(e);return false;}},
    del(k){localStorage.removeItem(this.prefix+k);},
    keys(){const o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(this.prefix))o.push(k.slice(this.prefix.length));}return o;},
    sizeKB(){let b=0;this.keys().forEach(k=>{const v=localStorage.getItem(this.prefix+k)||"";b+=k.length+v.length;});return (b/1024).toFixed(1);},
    rawKB(){let b=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);b+=k.length+(localStorage.getItem(k)||"").length;}return (b/1024).toFixed(1);}
  };

  const Bus = {_h:{},on(e,f){(this._h[e]=this._h[e]||[]).push(f);},emit(e,d){(this._h[e]||[]).forEach(f=>{try{f(d);}catch(x){console.warn(x);}});}};

  const Registry = {
    apps:[],
    register(a){if(!a.id||!a.name){console.warn("id+name nötig");return;}if(this.apps.find(x=>x.id===a.id)){console.warn("doppelt:",a.id);return;}this.apps.push(Object.assign({icon:"📦",desc:"",category:"System",mount:null},a));Bus.emit("registry:change",this.apps);},
    get(id){return this.apps.find(a=>a.id===id);},
    byCategory(){const m={};this.apps.forEach(a=>{(m[a.category]=m[a.category]||[]).push(a);});return m;},
    count(){return this.apps.length;}
  };

  const Router = {
    routes:{},current:null,sub:{},
    add(p,h){this.routes[p]=h;},
    go(p,sub){
      if(!this.routes[p])p="home";
      if(this.current==="avatar"&&p!=="avatar")Avatar.stop();
      this.current=p;Storage.set("last_route",p);
      if(sub!==undefined)this.sub[p]=sub;
      renderSidebar();
      const v=document.getElementById("view");v.innerHTML="";
      this.routes[p](v,this.sub[p]);
      Bus.emit("route:change",p);
      window.scrollTo({top:0,behavior:"instant"});
    },
    start(){this.go(Storage.get("last_route","home"));}
  };

  const U = {
    el(t,a={},...c){
      const n=document.createElement(t);
      for(const k in a){
        if(k==="class")n.className=a[k];
        else if(k==="html")n.innerHTML=a[k];
        else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);
        else if(k==="style"&&typeof a[k]==="object")Object.assign(n.style,a[k]);
        else n.setAttribute(k,a[k]);
      }
      c.forEach(x=>{if(x==null)return;n.appendChild(typeof x==="string"?document.createTextNode(x):x);});
      return n;
    }
  };

  function downloadTxt(text,filename){
    const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  const THEMES = {
    "haldo":{primary:"#00d4ff",primary2:"#7c3aed",accent:"#f5c542"},
    "aurora":{primary:"#22c55e",primary2:"#ec4899",accent:"#a855f7"},
    "sunset":{primary:"#f97316",primary2:"#ec4899",accent:"#facc15"},
    "ocean":{primary:"#0ea5e9",primary2:"#06b6d4",accent:"#38bdf8"},
    "forest":{primary:"#10b981",primary2:"#059669",accent:"#84cc16"},
    "royal":{primary:"#8b5cf6",primary2:"#eab308",accent:"#f472b6"},
    "cyber":{primary:"#06b6d4",primary2:"#ec4899",accent:"#a855f7"},
    "mono":{primary:"#94a3b8",primary2:"#cbd5e1",accent:"#e2e8f0"},
    "fire":{primary:"#ef4444",primary2:"#f97316",accent:"#facc15"}
  };

  const Settings = {
    defaults:{
      general:{name:"Bruder",lang:"de",startPage:"home",splash:true},
      appearance:{primary:"#00d4ff",primary2:"#7c3aed",accent:"#f5c542",fontSize:100,animations:true,glow:true,mode:"dark"},
      avatar:{mode:"human",size:320,personality:"freundlich",autoSpeak:true,skin:"#e8c19c",hair:"#3d2415",eye:"#6b8aa8",emotion:"neutral"},
      voice:{tts:true,rate:1.0,pitch:1.05,stt:true,wakeWord:false,wakeWords:"hallo haldo,silav,merhaba"},
      ai:{apiKey:"",model:"gemini-1.5-flash",temperature:0.75,systemPrompt:"Du bist HalDo, eine freundliche, warme, intelligente Assistentin. Antworte kurz, natürlich, menschlich und auf Deutsch, außer der Nutzer schreibt in einer anderen Sprache."},
      apps:{sort:"az"},
      notifications:{browser:false,sound:true,vibration:true},
      network:{offlineMode:false},
      security:{pin:"",lockAfter:0,analytics:false},
      backup:{autoBackup:false}
    },
    state:{},
    load(){
      this.state=JSON.parse(JSON.stringify(this.defaults));
      for(const cat in this.defaults){const s=Storage.get("set_"+cat,null);if(s&&typeof s==="object")Object.assign(this.state[cat],s);}
      this.apply();
    },
    save(cat){Storage.set("set_"+cat,this.state[cat]);this.apply();Bus.emit("settings:change",{cat,state:this.state});},
    get(cat,key){return key?this.state[cat]?.[key]:this.state[cat];},
    set(cat,key,val){this.state[cat][key]=val;this.save(cat);},
    apply(){
      const a=this.state.appearance;
      const r=document.documentElement.style;
      r.setProperty("--primary",a.primary);r.setProperty("--primary-2",a.primary2);r.setProperty("--accent",a.accent);
      document.body.style.fontSize=((a.fontSize||100)/100*16)+"px";
      document.body.classList.toggle("no-anim",!a.animations);
      document.body.classList.toggle("light-mode",a.mode==="light");
      const b=document.querySelector("#sidebar .sb-brand img");
      if(b)b.style.filter=a.glow?`drop-shadow(0 0 10px ${a.primary})`:"none";
    }
  };

  const Voice = {
    _synth:window.speechSynthesis,_rec:null,_listening:false,
    speak(text,onEnd){
      if(!Settings.get("voice","tts")){if(onEnd)onEnd();return;}
      try{
        this._synth.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.rate=Settings.get("voice","rate")||1.0;u.pitch=Settings.get("voice","pitch")||1.05;u.lang="de-DE";
        const voices=this._synth.getVoices();
        const pref=voices.find(v=>v.lang.startsWith("de") && /female|frau|anna|marlene|katja|hedda|vicki/i.test(v.name));
        if(pref)u.voice=pref;
        u.onend=()=>onEnd&&onEnd();u.onerror=()=>onEnd&&onEnd();
        this._synth.speak(u);Bus.emit("voice:speak:start");
      }catch(e){console.warn(e);if(onEnd)onEnd();}
    },
    stop(){try{this._synth.cancel();}catch(e){}Bus.emit("voice:speak:end");},
    isSpeaking(){return this._synth.speaking;},
    initRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;const r=new SR();r.lang="de-DE";r.interimResults=false;r.continuous=false;r.maxAlternatives=1;return r;},
    listen({onResult,onError,onEnd}={}){
      const r=this.initRec();
      if(!r){onError&&onError("Spracherkennung nicht verfügbar.");return false;}
      if(this._listening)this.stopListen();
      this._rec=r;this._listening=true;
      r.onresult=(e)=>{const t=e.results[0][0].transcript;onResult&&onResult(t);};
      r.onerror=(e)=>{this._listening=false;onError&&onError(e.error||"Fehler");};
      r.onend=()=>{this._listening=false;onEnd&&onEnd();Bus.emit("voice:listen:end");};
      try{r.start();Bus.emit("voice:listen:start");return true;}catch(e){this._listening=false;onError&&onError(String(e));return false;}
    },
    stopListen(){try{this._rec&&this._rec.stop();}catch(e){}this._listening=false;},
    isListening(){return this._listening;}
  };
  if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=()=>{};

  const AI = {
    async send(history,userText){
      const key=Settings.get("ai","apiKey");
      if(!key)throw new Error("Kein API-Key. Avatar → KI.");
      const model=Settings.get("ai","model")||"gemini-1.5-flash";
      const sys=Settings.get("ai","systemPrompt")||"";
      const temp=Settings.get("ai","temperature")??0.75;
      const contents=[];
      history.forEach(m=>{contents.push({role:m.role==="user"?"user":"model",parts:[{text:m.text}]});});
      contents.push({role:"user",parts:[{text:userText}]});
      const body={contents,generationConfig:{temperature:temp}};
      if(sys)body.systemInstruction={parts:[{text:sys}]};
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!res.ok){const err=await res.text();throw new Error("Gemini "+res.status+": "+err.slice(0,180));}
      const data=await res.json();
      return (data?.candidates?.[0]?.content?.parts?.map(p=>p.text).filter(Boolean).join("\n")||"(keine Antwort)").trim();
    },
    hasKey(){return !!Settings.get("ai","apiKey");}
  };

  /* ============ AVATAR — PHASE 6.2 ============ */
  const Avatar = {
    canvas:null,ctx:null,raf:null,
    t:0,blink:0,nextBlink:0,
    speaking:false,listening:false,
    mouthOpen:0,mouthTarget:0,
    headSway:0,
    mode:"human",
    color1:"#00d4ff",color2:"#7c3aed",
    skin:"#e8c19c",hair:"#3d2415",eye:"#6b8aa8",
    emotion:"neutral",
    mouseX:0,mouseY:0,
    particles:[],
    emotionTransition:0,

    getSize(){return Math.min(400,Math.max(260,Settings.get("avatar","size")||320));},

    init(canvas){
      this.canvas=canvas;this.ctx=canvas.getContext("2d");
      this.updateTheme();
      const s=this.getSize();
      canvas.width=s*2;canvas.height=s*2;
      canvas.style.width=s+"px";canvas.style.height=s+"px";
      canvas.addEventListener("mousemove",(e)=>{
        const r=canvas.getBoundingClientRect();
        this.mouseX=((e.clientX-r.left)/r.width-0.5)*2;
        this.mouseY=((e.clientY-r.top)/r.height-0.5)*2;
      });
      canvas.addEventListener("mouseleave",()=>{this.mouseX=0;this.mouseY=0;});
      this.particles=[];
      for(let i=0;i<50;i++){
        this.particles.push({
          x:Math.random()*canvas.width,
          y:Math.random()*canvas.height,
          r:Math.random()*2.5+0.5,
          a:Math.random()*Math.PI*2,
          sp:0.15+Math.random()*0.5,
          vy:-0.1-Math.random()*0.4
        });
      }
      this.loop();
    },
    updateTheme(){
      this.mode=Settings.get("avatar","mode")||"human";
      this.color1=Settings.get("appearance","primary");
      this.color2=Settings.get("appearance","primary2");
      this.skin=Settings.get("avatar","skin")||"#e8c19c";
      this.hair=Settings.get("avatar","hair")||"#3d2415";
      this.eye=Settings.get("avatar","eye")||"#6b8aa8";
      this.emotion=Settings.get("avatar","emotion")||"neutral";
    },
    setSpeaking(v){this.speaking=v;},
    setListening(v){this.listening=v;},
    setEmotion(e){
      this.emotion=e;
      Settings.set("avatar","emotion",e);
      // Visueller Reset
      this.emotionTransition=0;
    },
    stop(){if(this.raf){cancelAnimationFrame(this.raf);this.raf=null;}},

    loop(){
      this.t+=1;
      if(this.t>this.nextBlink){this.blink=10;this.nextBlink=this.t+80+Math.random()*100;}
      if(this.blink>0)this.blink--;
      if(this.speaking)this.mouthTarget=0.55+Math.abs(Math.sin(this.t*0.45))*0.45;
      else this.mouthTarget=0.05+Math.abs(Math.sin(this.t*0.04))*0.02;
      this.mouthOpen+=(this.mouthTarget-this.mouthOpen)*0.3;
      this.headSway=Math.sin(this.t*0.012)*5;
      this.emotionTransition+=(1-this.emotionTransition)*0.05;
      this.particles.forEach(p=>{
        p.y+=p.vy;
        p.a+=0.02;
        if(p.y<-5)p.y=this.canvas.height+5;
      });
      this.draw();
      this.raf=requestAnimationFrame(()=>this.loop());
    },

    draw(){
      const c=this.ctx;
      const W=this.canvas.width,H=this.canvas.height;
      const cx=W/2,cy=H*0.52;
      c.clearRect(0,0,W,H);
      const R=Math.min(W,H)*0.38;

      c.save();
      const bgGlow=c.createRadialGradient(cx,cy,R*0.3,cx,cy,R*2);
      bgGlow.addColorStop(0,"rgba(0,50,90,0.4)");
      bgGlow.addColorStop(0.5,"rgba(0,30,60,0.15)");
      bgGlow.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=bgGlow;
      c.fillRect(0,0,W,H);
      c.restore();

      this.drawRings(c,cx,cy,R);

      c.save();
      this.particles.forEach(p=>{
        c.globalAlpha=0.3+Math.sin(p.a)*0.3;
        c.fillStyle=this.color1;
        c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();
      });
      c.restore();

      if(this.mode==="cyborg")this.drawCyborg(c,cx,cy,R);
      else if(this.mode==="hologram")this.drawHologram(c,cx,cy,R);
      else this.drawHuman(c,cx,cy,R);

      if(this.listening){
        c.save();
        const pulse=1+Math.sin(this.t*0.15)*0.05;
        c.strokeStyle=this.color1;c.lineWidth=3;
        c.globalAlpha=0.5;
        c.beginPath();c.arc(cx,cy,R*1.55*pulse,0,Math.PI*2);c.stroke();
        c.globalAlpha=0.2;
        c.beginPath();c.arc(cx,cy,R*1.75*pulse,0,Math.PI*2);c.stroke();
        c.restore();
      }
    },

    drawRings(c,cx,cy,R){
      c.save();
      c.translate(cx,cy);
      c.rotate(this.t*0.003);
      c.strokeStyle=this.color1;
      c.globalAlpha=0.18;
      c.lineWidth=1.5;
      c.beginPath();c.arc(0,0,R*1.35,0,Math.PI*2);c.stroke();
      c.beginPath();c.arc(0,0,R*1.55,0,Math.PI*2);c.stroke();
      c.globalAlpha=0.35;
      const segs=36;
      for(let i=0;i<segs;i++){
        if(i%3===0)continue;
        const a1=(i/segs)*Math.PI*2;
        const a2=((i+1)/segs)*Math.PI*2;
        c.beginPath();
        c.arc(0,0,R*1.8,a1,a2);
        c.stroke();
      }
      c.rotate(-this.t*0.006);
      c.globalAlpha=0.15;
      c.beginPath();c.arc(0,0,R*1.42,0,Math.PI*2);c.stroke();
      c.restore();
    },

    shade(hex,amount){
      let h=hex.replace("#","");
      if(h.length===3)h=h.split("").map(x=>x+x).join("");
      let r=parseInt(h.slice(0,2),16);
      let g=parseInt(h.slice(2,4),16);
      let b=parseInt(h.slice(4,6),16);
      r=Math.max(0,Math.min(255,r+amount));
      g=Math.max(0,Math.min(255,g+amount));
      b=Math.max(0,Math.min(255,b+amount));
      return "#"+[r,g,b].map(x=>x.toString(16).padStart(2,"0")).join("");
    },

    /* ============ HUMAN ============ */
    drawHuman(c,cx,cy,R){
      const skin=this.skin;
      const skinShadow=this.shade(skin,-35);
      const skinDeep=this.shade(skin,-70);
      const skinLight=this.shade(skin,20);
      const skinHighlight=this.shade(skin,45);
      const hairColor=this.hair;
      const hairLight=this.shade(hairColor,40);
      const hairDark=this.shade(hairColor,-40);
      const eyeColor=this.eye;
      const lipColor="#b54a4a";
      const lipDark="#8a3535";
      const lipLight="#d96969";

      const headW=R*0.78;
      const headH=R*1.02;
      const sway=this.headSway;
      const baseX=cx+sway;

      // Haare hinten
      c.save();
      const hairBackGrad=c.createLinearGradient(baseX,cy-headH*1.2,baseX,cy+headH*2);
      hairBackGrad.addColorStop(0,hairLight);
      hairBackGrad.addColorStop(0.3,hairColor);
      hairBackGrad.addColorStop(1,hairDark);
      c.fillStyle=hairBackGrad;
      c.beginPath();
      c.moveTo(baseX-headW*1.15,cy-headH*0.6);
      c.bezierCurveTo(baseX-headW*1.5,cy,baseX-headW*1.35,cy+headH*1.3,baseX-headW*1.0,cy+headH*2.2);
      c.lineTo(baseX-headW*0.85,cy+headH*2.2);
      c.bezierCurveTo(baseX-headW*1.05,cy+headH*1.3,baseX-headW*1.05,cy+headH*0.5,baseX-headW*0.95,cy-headH*0.3);
      c.closePath();
      c.fill();
      c.beginPath();
      c.moveTo(baseX+headW*1.15,cy-headH*0.6);
      c.bezierCurveTo(baseX+headW*1.5,cy,baseX+headW*1.35,cy+headH*1.3,baseX+headW*1.0,cy+headH*2.2);
      c.lineTo(baseX+headW*0.85,cy+headH*2.2);
      c.bezierCurveTo(baseX+headW*1.05,cy+headH*1.3,baseX+headW*1.05,cy+headH*0.5,baseX+headW*0.95,cy-headH*0.3);
      c.closePath();
      c.fill();
      c.beginPath();
      c.ellipse(baseX,cy-headH*0.15,headW*1.08,headH*0.85,0,Math.PI,0);
      c.fill();
      c.restore();

      // Schultern
      c.save();
      const shoulderY=cy+R*1.42;
      const shoulderW=R*1.6;
      const outfitGrad=c.createLinearGradient(baseX-shoulderW,shoulderY,baseX+shoulderW,shoulderY);
      outfitGrad.addColorStop(0,"#c8d4e0");
      outfitGrad.addColorStop(0.35,"#e8eef5");
      outfitGrad.addColorStop(0.65,"#e8eef5");
      outfitGrad.addColorStop(1,"#c8d4e0");
      c.fillStyle=outfitGrad;
      c.beginPath();
      c.moveTo(baseX-shoulderW,H);
      c.quadraticCurveTo(baseX-shoulderW*0.95,shoulderY,baseX-R*0.4,shoulderY-R*0.15);
      c.lineTo(baseX+R*0.4,shoulderY-R*0.15);
      c.quadraticCurveTo(baseX+shoulderW*0.95,shoulderY,baseX+shoulderW,H);
      c.closePath();
      c.fill();
      c.strokeStyle=this.color1;
      c.lineWidth=2;
      c.globalAlpha=0.6;
      c.beginPath();
      c.moveTo(baseX-R*0.4,shoulderY-R*0.15);
      c.lineTo(baseX-R*0.5,shoulderY+R*0.3);
      c.stroke();
      c.beginPath();
      c.moveTo(baseX+R*0.4,shoulderY-R*0.15);
      c.lineTo(baseX+R*0.5,shoulderY+R*0.3);
      c.stroke();
      c.globalAlpha=1;
      c.restore();

      // Hals
      c.save();
      const neckW=R*0.36;
      const neckTop=cy+R*0.75;
      const neckBot=cy+R*1.55;
      const neckGrad=c.createLinearGradient(baseX-neckW,0,baseX+neckW,0);
      neckGrad.addColorStop(0,skinShadow);
      neckGrad.addColorStop(0.3,skin);
      neckGrad.addColorStop(0.7,skin);
      neckGrad.addColorStop(1,skinShadow);
      c.fillStyle=neckGrad;
      c.beginPath();
      c.moveTo(baseX-neckW,neckTop);
      c.lineTo(baseX-neckW*1.05,neckBot);
      c.lineTo(baseX+neckW*1.05,neckBot);
      c.lineTo(baseX+neckW,neckTop);
      c.closePath();
      c.fill();
      c.fillStyle="rgba(0,0,0,0.22)";
      c.beginPath();
      c.ellipse(baseX,neckTop+R*0.05,neckW*0.92,R*0.14,0,0,Math.PI);
      c.fill();
      c.restore();

      // Ohren
      const earY=cy+R*0.02;
      const earX=R*0.82;
      [baseX-earX,baseX+earX].forEach((ex,i)=>{
        c.save();
        const eg=c.createRadialGradient(ex,earY,2,ex,earY,R*0.15);
        eg.addColorStop(0,skinLight);
        eg.addColorStop(0.55,skin);
        eg.addColorStop(1,skinShadow);
        c.fillStyle=eg;
        c.beginPath();
        c.ellipse(ex,earY,R*0.075,R*0.145,0,0,Math.PI*2);
        c.fill();
        c.strokeStyle=skinDeep;
        c.globalAlpha=0.4;
        c.lineWidth=1.5;
        c.beginPath();
        c.ellipse(ex+(i===0?R*0.005:-R*0.005),earY,R*0.032,R*0.078,0,0,Math.PI*2);
        c.stroke();
        c.globalAlpha=1;
        c.fillStyle="#f5c542";
        c.shadowColor="#f5c542";c.shadowBlur=8;
        c.beginPath();
        c.arc(ex,earY+R*0.13,R*0.025,0,Math.PI*2);
        c.fill();
        c.shadowBlur=0;
        c.restore();
      });

      // Gesicht
      c.save();
      const faceGrad=c.createRadialGradient(baseX-headW*0.35,cy-headH*0.35,R*0.1,baseX,cy-headH*0.05,headH*1.15);
      faceGrad.addColorStop(0,skinHighlight);
      faceGrad.addColorStop(0.25,skinLight);
      faceGrad.addColorStop(0.55,skin);
      faceGrad.addColorStop(0.85,skinShadow);
      faceGrad.addColorStop(1,skinDeep);
      c.fillStyle=faceGrad;
      c.beginPath();
      c.moveTo(baseX-headW*0.92,cy-headH*0.2);
      c.bezierCurveTo(baseX-headW*1.02,cy-headH*0.85,baseX+headW*1.02,cy-headH*0.85,baseX+headW*0.92,cy-headH*0.2);
      c.bezierCurveTo(baseX+headW*0.98,cy+headH*0.18,baseX+headW*0.72,cy+headH*0.6,baseX+headW*0.38,cy+headH*0.85);
      c.bezierCurveTo(baseX+headW*0.18,cy+headH*1.0,baseX-headW*0.18,cy+headH*1.0,baseX-headW*0.38,cy+headH*0.85);
      c.bezierCurveTo(baseX-headW*0.72,cy+headH*0.6,baseX-headW*0.98,cy+headH*0.18,baseX-headW*0.92,cy-headH*0.2);
      c.closePath();
      c.fill();
      c.restore();

      // Haare vorne
      c.save();
      const hairFrontGrad=c.createLinearGradient(baseX,cy-headH,baseX,cy+headH*0.2);
      hairFrontGrad.addColorStop(0,hairLight);
      hairFrontGrad.addColorStop(0.5,hairColor);
      hairFrontGrad.addColorStop(1,hairDark);
      c.fillStyle=hairFrontGrad;
      c.beginPath();
      c.moveTo(baseX-headW*0.98,cy-headH*0.15);
      c.bezierCurveTo(baseX-headW*1.08,cy-headH*0.95,baseX+headW*1.08,cy-headH*0.95,baseX+headW*0.98,cy-headH*0.15);
      c.bezierCurveTo(baseX+headW*1.02,cy-headH*0.02,baseX+headW*0.95,cy+headH*0.02,baseX+headW*0.82,cy+headH*0.02);
      c.bezierCurveTo(baseX+headW*0.7,cy-headH*0.3,baseX+headW*0.5,cy-headH*0.55,baseX+headW*0.15,cy-headH*0.55);
      c.bezierCurveTo(baseX-headW*0.15,cy-headH*0.55,baseX-headW*0.4,cy-headH*0.5,baseX-headW*0.7,cy-headH*0.25);
      c.bezierCurveTo(baseX-headW*0.88,cy+headH*0.02,baseX-headW*0.98,cy+headH*0.02,baseX-headW*0.98,cy-headH*0.15);
      c.closePath();
      c.fill();
      c.strokeStyle=this.shade(hairColor,60);
      c.lineWidth=R*0.014;
      c.lineCap="round";
      c.globalAlpha=0.4;
      for(let i=0;i<8;i++){
        c.beginPath();
        const sx=baseX-headW*0.7+i*headW*0.2;
        c.moveTo(sx,cy-headH*0.7);
        c.quadraticCurveTo(sx+headW*0.08,cy-headH*0.5,sx+headW*0.03,cy-headH*0.2);
        c.stroke();
      }
      c.globalAlpha=1;
      c.fillStyle=hairColor;
      c.beginPath();
      c.moveTo(baseX-headW*0.95,cy-headH*0.1);
      c.bezierCurveTo(baseX-headW*1.05,cy+headH*0.2,baseX-headW*0.95,cy+headH*0.65,baseX-headW*0.85,cy+headH*0.85);
      c.lineTo(baseX-headW*0.72,cy+headH*0.85);
      c.bezierCurveTo(baseX-headW*0.8,cy+headH*0.6,baseX-headW*0.85,cy+headH*0.2,baseX-headW*0.82,cy-headH*0.1);
      c.closePath();
      c.fill();
      c.beginPath();
      c.moveTo(baseX+headW*0.95,cy-headH*0.1);
      c.bezierCurveTo(baseX+headW*1.05,cy+headH*0.2,baseX+headW*0.95,cy+headH*0.65,baseX+headW*0.85,cy+headH*0.85);
      c.lineTo(baseX+headW*0.72,cy+headH*0.85);
      c.bezierCurveTo(baseX+headW*0.8,cy+headH*0.6,baseX+headW*0.85,cy+headH*0.2,baseX+headW*0.82,cy-headH*0.1);
      c.closePath();
      c.fill();
      c.restore();

      // Augenbrauen — Emotion-abhängig
      const browY=cy-headH*0.12;
      const browSpan=R*0.32;
      const browW=R*0.24;
      const emotionBrow = {
        neutral:0, freundlich:-0.05, überrascht:-0.15, nachdenklich:0.1, traurig:0.15, wütend:0.2
      };
      const browOffset = emotionBrow[this.emotion]||0;
      [baseX-browSpan,baseX+browSpan].forEach((bx,i)=>{
        c.save();
        const dir=i===0?1:-1;
        c.strokeStyle=this.shade(hairColor,-10);
        c.lineWidth=R*0.038;
        c.lineCap="round";
        c.beginPath();
        c.moveTo(bx-browW*0.9,browY+browW*0.18+browOffset*R*0.1);
        c.quadraticCurveTo(bx+browW*0.05*dir,browY-browW*0.28+browOffset*R*0.05,bx+browW*0.95,browY+browW*0.05+browOffset*R*0.12);
        c.stroke();
        c.lineWidth=R*0.012;
        c.globalAlpha=0.5;
        for(let j=0;j<5;j++){
          const px=bx-browW*0.6+j*browW*0.3;
          c.beginPath();
          c.moveTo(px,browY+browW*0.15+browOffset*R*0.1);
          c.lineTo(px-2,browY-browW*0.12+browOffset*R*0.05);
          c.stroke();
        }
        c.restore();
      });

      // Augen
      const eyeY=cy+headH*0.03;
      const eyeSpan=R*0.32;
      const eyeW=R*0.16;
      const eyeH=R*0.105;
      const blinkAmount=this.blink>0?Math.max(0,1-this.blink/5):1;
      const emotionEyeScale = this.emotion==="überrascht"?1.15:this.emotion==="nachdenklich"?0.85:1;
      const eyeSpread = this.emotion==="überrascht"?R*0.35:eyeSpan;

      [baseX-eyeSpread,baseX+eyeSpread].forEach((ex,idx)=>{
        c.save();
        c.fillStyle="rgba(0,0,0,0.14)";
        c.beginPath();
        c.ellipse(ex,eyeY-eyeH*0.12,eyeW*1.18,eyeH*1.6,0,0,Math.PI*2);
        c.fill();

        c.fillStyle="#fbfaf8";
        c.beginPath();
        c.moveTo(ex-eyeW,eyeY);
        c.quadraticCurveTo(ex-eyeW*0.55,eyeY-eyeH*1.5*emotionEyeScale,ex,eyeY-eyeH*1.15*emotionEyeScale);
        c.quadraticCurveTo(ex+eyeW*0.55,eyeY-eyeH*1.5*emotionEyeScale,ex+eyeW,eyeY);
        c.quadraticCurveTo(ex+eyeW*0.55,eyeY+eyeH*1.25*emotionEyeScale,ex,eyeY+eyeH*1.0*emotionEyeScale);
        c.quadraticCurveTo(ex-eyeW*0.55,eyeY+eyeH*1.25*emotionEyeScale,ex-eyeW,eyeY);
        c.closePath();
        c.fill();
        c.fillStyle="rgba(180,120,120,0.15)";
        c.beginPath();
        c.moveTo(ex-eyeW*0.95,eyeY-eyeH*0.3);
        c.quadraticCurveTo(ex,eyeY-eyeH*1.5*emotionEyeScale,ex+eyeW*0.95,eyeY-eyeH*0.3);
        c.quadraticCurveTo(ex,eyeY-eyeH*1.2*emotionEyeScale,ex-eyeW*0.95,eyeY-eyeH*0.3);
        c.closePath();
        c.fill();

        if(blinkAmount>0.05){
          const irisR=eyeH*0.92*emotionEyeScale;
          const lookX=ex+this.mouseX*eyeW*0.22;
          const lookY=eyeY+this.mouseY*eyeH*0.22;
          const irisGrad=c.createRadialGradient(lookX-irisR*0.35,lookY-irisR*0.35,irisR*0.1,lookX,lookY,irisR);
          irisGrad.addColorStop(0,this.shade(eyeColor,60));
          irisGrad.addColorStop(0.4,this.shade(eyeColor,20));
          irisGrad.addColorStop(0.75,eyeColor);
          irisGrad.addColorStop(1,this.shade(eyeColor,-50));
          c.fillStyle=irisGrad;
          c.beginPath();
          c.ellipse(lookX,lookY,irisR,irisR*blinkAmount,0,0,Math.PI*2);
          c.fill();
          c.strokeStyle=this.shade(eyeColor,-60);
          c.lineWidth=R*0.005;
          c.globalAlpha=0.55;
          for(let a=0;a<16;a++){
            const ang=(a/16)*Math.PI*2;
            c.beginPath();
            c.moveTo(lookX+Math.cos(ang)*irisR*0.35,lookY+Math.sin(ang)*irisR*0.35*blinkAmount);
            c.lineTo(lookX+Math.cos(ang)*irisR*0.92,lookY+Math.sin(ang)*irisR*0.92*blinkAmount);
            c.stroke();
          }
          c.globalAlpha=1;
          c.strokeStyle=this.shade(eyeColor,-70);
          c.lineWidth=R*0.008;
          c.beginPath();
          c.ellipse(lookX,lookY,irisR*0.98,irisR*0.98*blinkAmount,0,0,Math.PI*2);
          c.stroke();
          c.fillStyle="#0a0a0a";
          c.beginPath();
          c.ellipse(lookX,lookY,irisR*0.42,irisR*0.42*blinkAmount,0,0,Math.PI*2);
          c.fill();
          c.fillStyle="rgba(255,255,255,0.95)";
          c.beginPath();
          c.arc(lookX-irisR*0.38,lookY-irisR*0.42,irisR*0.24,0,Math.PI*2);
          c.fill();
          c.fillStyle="rgba(255,255,255,0.5)";
          c.beginPath();
          c.arc(lookX+irisR*0.32,lookY+irisR*0.38,irisR*0.12,0,Math.PI*2);
          c.fill();
        }

        c.fillStyle=skin;
        c.beginPath();
        c.moveTo(ex-eyeW*1.08,eyeY-eyeH*0.3);
        c.quadraticCurveTo(ex,eyeY-eyeH*(1.3+(1-blinkAmount)*1.8),ex+eyeW*1.08,eyeY-eyeH*0.3);
        c.quadraticCurveTo(ex,eyeY-eyeH*(1.05-(1-blinkAmount)*0.4),ex-eyeW*1.08,eyeY-eyeH*0.3);
        c.closePath();
        c.fill();
        c.strokeStyle="#1a0a05";
        c.lineWidth=R*0.014;
        c.lineCap="round";
        c.beginPath();
        const lidY=eyeY-eyeH*(1.18-blinkAmount*0.95);
        c.moveTo(ex-eyeW*0.98,eyeY-eyeH*0.15);
        c.quadraticCurveTo(ex,lidY,ex+eyeW*0.98,eyeY-eyeH*0.15);
        c.stroke();
        c.lineWidth=R*0.008;
        for(let w=0;w<7;w++){
          const p=(w/6);
          const wx=ex-eyeW*0.9+p*eyeW*1.8;
          const wy=eyeY-eyeH*(0.9+Math.sin(p*Math.PI)*0.35*blinkAmount);
          c.beginPath();
          c.moveTo(wx,wy);
          c.lineTo(wx+(p-0.5)*R*0.03,wy-R*0.045);
          c.stroke();
        }
        c.strokeStyle=this.shade(skin,-25);
        c.lineWidth=R*0.008;
        c.globalAlpha=0.6;
        c.beginPath();
        c.moveTo(ex-eyeW*0.92,eyeY+eyeH*0.3);
        c.quadraticCurveTo(ex,eyeY+eyeH*1.12,ex+eyeW*0.92,eyeY+eyeH*0.3);
        c.stroke();
        c.globalAlpha=1;
        c.restore();
      });

      // Nase
      const noseTop=cy+headH*0.06;
      const noseTip=cy+headH*0.26;
      c.save();
      c.strokeStyle=skinHighlight;
      c.lineWidth=R*0.03;
      c.globalAlpha=0.35;
      c.lineCap="round";
      c.beginPath();
      c.moveTo(baseX,noseTop);
      c.quadraticCurveTo(baseX-R*0.01,noseTip-R*0.05,baseX-R*0.015,noseTip);
      c.stroke();
      c.strokeStyle=skinShadow;
      c.lineWidth=R*0.02;
      c.globalAlpha=0.5;
      c.beginPath();
      c.moveTo(baseX-R*0.035,noseTop+R*0.02);
      c.quadraticCurveTo(baseX-R*0.07,noseTip-R*0.05,baseX-R*0.08,noseTip-R*0.01);
      c.stroke();
      c.fillStyle=skinDeep;
      c.globalAlpha=0.65;
      c.beginPath();
      c.ellipse(baseX-R*0.065,noseTip+R*0.005,R*0.022,R*0.012,-0.35,0,Math.PI*2);
      c.fill();
      c.beginPath();
      c.ellipse(baseX+R*0.065,noseTip+R*0.005,R*0.022,R*0.012,0.35,0,Math.PI*2);
      c.fill();
      c.globalAlpha=1;
      c.fillStyle=skinHighlight;
      c.globalAlpha=0.3;
      c.beginPath();
      c.ellipse(baseX,noseTip-R*0.02,R*0.03,R*0.015,0,0,Math.PI*2);
      c.fill();
      c.restore();

      // Mund — Emotion-abhängig
      const mouthY=cy+headH*0.48;
      const mouthW=R*0.22;
      const openAmount=this.mouthOpen*R*0.13;
      const emotionMouth = {
        neutral:0, freundlich:-0.08, überrascht:0, nachdenklich:0.05, traurig:0.15, wütend:-0.1
      };
      const mouthCurve = (emotionMouth[this.emotion]||0)*R;

      c.save();
      const upperH=R*0.028;
      c.fillStyle=lipColor;
      c.beginPath();
      c.moveTo(baseX-mouthW,mouthY);
      c.quadraticCurveTo(baseX-mouthW*0.6,mouthY-upperH*1.3,mouthW*0.15,mouthY-upperH*0.8);
      c.quadraticCurveTo(baseX,mouthY-upperH*1.6+mouthCurve*0.5,baseX+mouthW*0.15,mouthY-upperH*0.8);
      c.quadraticCurveTo(baseX+mouthW*0.6,mouthY-upperH*1.3,baseX+mouthW,mouthY);
      c.quadraticCurveTo(baseX,mouthY+upperH*0.3+mouthCurve,baseX-mouthW,mouthY);
      c.closePath();
      c.fill();

      const lowerH=R*0.045;
      c.fillStyle=this.shade(lipColor,15);
      c.beginPath();
      c.moveTo(baseX-mouthW,mouthY+openAmount*0.1);
      c.quadraticCurveTo(baseX,mouthY+lowerH*1.1+openAmount+mouthCurve,baseX+mouthW,mouthY+openAmount*0.1);
      c.quadraticCurveTo(baseX,mouthY+openAmount*0.2+mouthCurve*0.5,baseX-mouthW,mouthY+openAmount*0.1);
      c.closePath();
      c.fill();

      if(openAmount>0.5){
        c.fillStyle="#3a1010";
        c.beginPath();
        c.moveTo(baseX-mouthW*0.95,mouthY);
        c.quadraticCurveTo(baseX,mouthY+openAmount*0.9+mouthCurve,baseX+mouthW*0.95,mouthY);
        c.quadraticCurveTo(baseX,mouthY+openAmount*0.2+mouthCurve*0.5,baseX-mouthW*0.95,mouthY);
        c.closePath();
        c.fill();
        c.fillStyle="rgba(250,248,240,0.92)";
        c.beginPath();
        c.moveTo(baseX-mouthW*0.85,mouthY);
        c.lineTo(baseX+mouthW*0.85,mouthY);
        c.lineTo(baseX+mouthW*0.8,mouthY+openAmount*0.28+mouthCurve*0.3);
        c.lineTo(baseX-mouthW*0.8,mouthY+openAmount*0.28+mouthCurve*0.3);
        c.closePath();
        c.fill();
        c.strokeStyle="rgba(0,0,0,0.15)";
        c.lineWidth=1;
        for(let i=1;i<5;i++){
          const x=baseX-mouthW*0.7+i*mouthW*0.35;
          c.beginPath();c.moveTo(x,mouthY);c.lineTo(x,mouthY+openAmount*0.25+mouthCurve*0.3);c.stroke();
        }
        if(openAmount>R*0.06){
          c.fillStyle="rgba(190,80,80,0.7)";
          c.beginPath();
          c.ellipse(baseX,mouthY+openAmount*0.68+mouthCurve*0.5,mouthW*0.5,openAmount*0.22,0,0,Math.PI*2);
          c.fill();
        }
      }
      c.fillStyle="rgba(255,255,255,0.35)";
      c.beginPath();
      c.ellipse(baseX-mouthW*0.15,mouthY+R*0.045+openAmount*0.3+mouthCurve*0.5,mouthW*0.3,R*0.008,0,0,Math.PI*2);
      c.fill();
      c.restore();

      // Wangen — bei freundlich stärker
      c.save();
      const blushIntensity = this.emotion==="freundlich"?0.45:0.35;
      const blushGrad1=c.createRadialGradient(baseX-R*0.32,cy+R*0.16,R*0.02,baseX-R*0.32,cy+R*0.16,R*0.15);
      blushGrad1.addColorStop(0,"rgba(220,120,120,"+blushIntensity+")");
      blushGrad1.addColorStop(1,"rgba(220,120,120,0)");
      c.fillStyle=blushGrad1;
      c.beginPath();c.arc(baseX-R*0.32,cy+R*0.16,R*0.15,0,Math.PI*2);c.fill();
      const blushGrad2=c.createRadialGradient(baseX+R*0.32,cy+R*0.16,R*0.02,baseX+R*0.32,cy+R*0.16,R*0.15);
      blushGrad2.addColorStop(0,"rgba(220,120,120,"+blushIntensity+")");
      blushGrad2.addColorStop(1,"rgba(220,120,120,0)");
      c.fillStyle=blushGrad2;
      c.beginPath();c.arc(baseX+R*0.32,cy+R*0.16,R*0.15,0,Math.PI*2);c.fill();
      c.restore();

      // Stirn-Licht
      c.save();
      c.fillStyle="rgba(255,255,255,0.14)";
      c.beginPath();
      c.ellipse(baseX-headW*0.12,cy-headH*0.45,headW*0.32,headH*0.14,0,0,Math.PI*2);
      c.fill();
      c.restore();
    },

    /* ============ CYBORG — PHASE 6.2 ============ */
    drawCyborg(c,cx,cy,R){
      const metal="#b8c4d4";
      const metalDark="#2a3a4e";
      const metalLight="#e0e8f0";
      const baseX=cx+this.headSway;
      const headW=R*0.78;
      const headH=R*1.02;

      // Schultern — mehr Details
      c.save();
      const shoulderY=cy+R*1.42;
      const shoulderW=R*1.65;
      c.fillStyle="#1a2332";
      c.beginPath();
      c.moveTo(baseX-shoulderW,this.canvas.height);
      c.quadraticCurveTo(baseX-shoulderW*0.95,shoulderY,baseX-R*0.45,shoulderY-R*0.15);
      c.lineTo(baseX+R*0.45,shoulderY-R*0.15);
      c.quadraticCurveTo(baseX+shoulderW*0.95,shoulderY,baseX+shoulderW,this.canvas.height);
      c.closePath();
      c.fill();
      // Tech-Linien
      c.strokeStyle=this.color1;c.lineWidth=2.5;c.globalAlpha=0.8;
      c.beginPath();c.moveTo(baseX-shoulderW*0.7,shoulderY+R*0.35);c.lineTo(baseX-R*0.55,shoulderY-R*0.05);c.stroke();
      c.beginPath();c.moveTo(baseX+shoulderW*0.7,shoulderY+R*0.35);c.lineTo(baseX+R*0.55,shoulderY-R*0.05);c.stroke();
      // Brust-Reaktor
      const reactorY=shoulderY+R*0.5;
      c.beginPath();c.arc(baseX,reactorY,R*0.15,0,Math.PI*2);
      c.fillStyle="rgba(0,0,0,0.6)";c.fill();
      c.shadowColor=this.color1;c.shadowBlur=25;
      c.strokeStyle=this.color1;c.lineWidth=2;c.stroke();
      c.beginPath();c.arc(baseX,reactorY,R*0.09,0,Math.PI*2);
      c.fillStyle=this.color1;c.fill();
      c.shadowBlur=0;
      // Reaktor rotierender Ring
      c.save();
      c.translate(baseX,reactorY);
      c.rotate(this.t*0.05);
      c.strokeStyle=this.color2;c.lineWidth=1.5;c.globalAlpha=0.7;
      for(let i=0;i<6;i++){
        const a1=(i/6)*Math.PI*2;
        const a2=a1+0.6;
        c.beginPath();c.arc(0,0,R*0.12,a1,a2);c.stroke();
      }
      c.restore();
      c.globalAlpha=1;
      c.restore();

      // Hals
      c.save();
      const neckW=R*0.36;
      const neckTop=cy+R*0.75;
      const ng=c.createLinearGradient(baseX-neckW,0,baseX+neckW,0);
      ng.addColorStop(0,metalDark);ng.addColorStop(0.5,metal);ng.addColorStop(1,metalDark);
      c.fillStyle=ng;
      c.fillRect(baseX-neckW,neckTop,neckW*2,R*0.8);
      // Hals-Rippen
      c.strokeStyle=metalDark;c.lineWidth=1.5;c.globalAlpha=0.6;
      for(let i=0;i<4;i++){
        const y=neckTop+R*0.15+i*R*0.16;
        c.beginPath();c.moveTo(baseX-neckW*0.9,y);c.lineTo(baseX+neckW*0.9,y);c.stroke();
      }
      // Hals-LED
      c.fillStyle=this.color1;c.shadowColor=this.color1;c.shadowBlur=12;
      for(let i=0;i<3;i++){
        c.fillRect(baseX-R*0.03,neckTop+R*0.2+i*R*0.15,R*0.06,R*0.03);
      }
      c.shadowBlur=0;
      c.globalAlpha=1;
      c.restore();

      // Kopf
      c.save();
      const fg=c.createRadialGradient(baseX-headW*0.3,cy-headH*0.4,R*0.1,baseX,cy,headH*1.1);
      fg.addColorStop(0,metalLight);
      fg.addColorStop(0.5,metal);
      fg.addColorStop(1,metalDark);
      c.fillStyle=fg;
      c.beginPath();
      c.moveTo(baseX-headW*0.92,cy-headH*0.2);
      c.bezierCurveTo(baseX-headW*1.02,cy-headH*0.85,baseX+headW*1.02,cy-headH*0.85,baseX+headW*0.92,cy-headH*0.2);
      c.bezierCurveTo(baseX+headW*0.98,cy+headH*0.18,baseX+headW*0.72,cy+headH*0.6,baseX+headW*0.38,cy+headH*0.85);
      c.bezierCurveTo(baseX+headW*0.18,cy+headH*1.0,baseX-headW*0.18,cy+headH*1.0,baseX-headW*0.38,cy+headH*0.85);
      c.bezierCurveTo(baseX-headW*0.72,cy+headH*0.6,baseX-headW*0.98,cy+headH*0.18,baseX-headW*0.92,cy-headH*0.2);
      c.closePath();
      c.fill();
      // Kopf-Nähte
      c.strokeStyle=metalDark;c.lineWidth=R*0.012;c.globalAlpha=0.7;
      c.beginPath();c.moveTo(baseX-headW*0.6,cy-headH*0.4);c.lineTo(baseX+headW*0.6,cy-headH*0.4);c.stroke();
      c.beginPath();c.moveTo(baseX,cy-headH*0.55);c.lineTo(baseX,cy+headH*0.6);c.stroke();
      c.globalAlpha=1;
      c.restore();

      // Headset (wie Bild 1/4)
      c.save();
      const headsetR=R*0.95;
      c.strokeStyle=metalDark;c.lineWidth=R*0.08;c.lineCap="round";
      c.beginPath();c.arc(baseX,cy-headH*0.35,headsetR,Math.PI*0.15,Math.PI*0.85,true);c.stroke();
      c.strokeStyle=this.color1;c.lineWidth=R*0.02;c.globalAlpha=0.8;
      c.beginPath();c.arc(baseX,cy-headH*0.35,headsetR,Math.PI*0.15,Math.PI*0.85,true);c.stroke();
      c.globalAlpha=1;
      // Ohrmuscheln
      [baseX-headW*0.95,baseX+headW*0.95].forEach((hx,i)=>{
        c.beginPath();c.arc(hx,cy,R*0.09,0,Math.PI*2);
        c.fillStyle=metalDark;c.fill();
        c.strokeStyle=this.color1;c.lineWidth=2;c.stroke();
        c.beginPath();c.arc(hx,cy,R*0.035,0,Math.PI*2);
        c.fillStyle=this.color1;c.shadowColor=this.color1;c.shadowBlur=10;c.fill();
        c.shadowBlur=0;
      });
      c.restore();

      // LED-Augen — Emotion-abhängig
      const eyeY=cy+headH*0.03;
      const eyeSpan=R*0.32;
      const blinkAmount=this.blink>0?Math.max(0,1-this.blink/5):1;
      const emotionEyeScale=this.emotion==="überrascht"?1.15:this.emotion==="nachdenklich"?0.85:1;
      [baseX-eyeSpan,baseX+eyeSpan].forEach(ex=>{
        c.save();
        c.fillStyle="#000";
        c.beginPath();c.ellipse(ex,eyeY,R*0.15,R*0.085*blinkAmount*emotionEyeScale,0,0,Math.PI*2);c.fill();
        if(blinkAmount>0.3){
          c.shadowColor=this.color1;c.shadowBlur=22;
          c.fillStyle=this.color1;
          c.beginPath();c.arc(ex,eyeY,R*0.052*blinkAmount*emotionEyeScale,0,Math.PI*2);c.fill();
          c.shadowBlur=0;
          c.fillStyle="#fff";
          c.beginPath();c.arc(ex,eyeY,R*0.018*blinkAmount,0,Math.PI*2);c.fill();
        }
        c.restore();
      });

      // LED-Mund
      const mouthY=cy+headH*0.48;
      const bars=15;
      const totalW=R*0.5;
      const bw=totalW/bars;
      c.save();
      for(let i=0;i<bars;i++){
        const center=Math.abs(i-(bars-1)/2)/((bars-1)/2);
        const h=(0.25+Math.sin(this.t*0.25+i*0.5)*0.08+this.mouthOpen*0.7)*R*0.13*(1-center*0.3);
        const x=baseX-totalW/2+i*bw+bw*0.2;
        c.fillStyle=i%2===0?this.color1:this.color2;
        c.shadowColor=c.fillStyle;c.shadowBlur=10;
        c.fillRect(x,mouthY-h/2,bw*0.6,h);
      }
      c.shadowBlur=0;
      c.restore();
    },

    /* ============ HOLOGRAM ============ */
    drawHologram(c,cx,cy,R){
      const c1=this.color1,c2=this.color2;
      const baseX=cx+this.headSway;
      const headW=R*0.78;
      const headH=R*1.02;
      c.save();
      c.globalAlpha=0.65+Math.sin(this.t*0.08)*0.05;

      c.strokeStyle=c1;c.globalAlpha=0.08;c.lineWidth=1;
      for(let i=0;i<=10;i++){const y=(i/10)*this.canvas.height;c.beginPath();c.moveTo(0,y);c.lineTo(this.canvas.width,y);c.stroke();}

      const neckW=R*0.36;
      const neckTop=cy+R*0.75;
      const shoulderY=cy+R*1.42;
      const shoulderW=R*1.6;
      c.globalAlpha=0.4;c.fillStyle=c1;
      c.beginPath();
      c.moveTo(baseX-neckW,neckTop);
      c.lineTo(baseX-neckW,shoulderY-R*0.15);
      c.lineTo(baseX+neckW,shoulderY-R*0.15);
      c.lineTo(baseX+neckW,neckTop);
      c.closePath();c.fill();
      c.beginPath();
      c.moveTo(baseX-shoulderW,this.canvas.height);
      c.quadraticCurveTo(baseX-shoulderW*0.95,shoulderY,baseX-R*0.4,shoulderY-R*0.15);
      c.lineTo(baseX+R*0.4,shoulderY-R*0.15);
      c.quadraticCurveTo(baseX+shoulderW*0.95,shoulderY,baseX+shoulderW,this.canvas.height);
      c.closePath();c.fill();

      const hg=c.createRadialGradient(baseX-headW*0.3,cy-headH*0.4,R*0.1,baseX,cy,headH*1.1);
      hg.addColorStop(0,c1);hg.addColorStop(1,c2);
      c.globalAlpha=0.75;c.fillStyle=hg;
      c.beginPath();
      c.moveTo(baseX-headW*0.92,cy-headH*0.2);
      c.bezierCurveTo(baseX-headW*1.02,cy-headH*0.85,baseX+headW*1.02,cy-headH*0.85,baseX+headW*0.92,cy-headH*0.2);
      c.bezierCurveTo(baseX+headW*0.98,cy+headH*0.18,baseX+headW*0.72,cy+headH*0.6,baseX+headW*0.38,cy+headH*0.85);
      c.bezierCurveTo(baseX+headW*0.18,cy+headH*1.0,baseX-headW*0.18,cy+headH*1.0,baseX-headW*0.38,cy+headH*0.85);
      c.bezierCurveTo(baseX-headW*0.72,cy+headH*0.6,baseX-headW*0.98,cy+headH*0.18,baseX-headW*0.92,cy-headH*0.2);
      c.closePath();c.fill();

      c.strokeStyle="rgba(255,255,255,0.5)";c.lineWidth=1.5;c.globalAlpha=0.6;
      c.stroke();
      for(let i=1;i<5;i++){
        const yy=cy-headH*0.8+(headH*1.7)*(i/5);
        const t2=(yy-cy)/headH;
        const w=Math.sqrt(Math.max(0,1-t2*t2))*headW*0.85;
        c.beginPath();c.moveTo(baseX-w,yy);c.lineTo(baseX+w,yy);c.stroke();
      }
      c.globalAlpha=0.75;

      const eyeY=cy+headH*0.03;
      const eyeSpan=R*0.32;
      const blinkAmount=this.blink>0?Math.max(0,1-this.blink/5):1;
      [baseX-eyeSpan,baseX+eyeSpan].forEach(ex=>{
        c.save();
        c.strokeStyle="rgba(255,255,255,0.85)";c.lineWidth=2;
        c.beginPath();c.ellipse(ex,eyeY,R*0.12,R*0.07*blinkAmount,0,0,Math.PI*2);c.stroke();
        if(blinkAmount>0.3){
          c.shadowColor=c1;c.shadowBlur=15;c.fillStyle="#fff";
          c.beginPath();c.arc(ex,eyeY,R*0.033*blinkAmount,0,Math.PI*2);c.fill();
          c.shadowBlur=0;
        }
        c.restore();
      });

      const mouthY=cy+headH*0.48;
      c.save();
      c.strokeStyle="rgba(255,255,255,0.9)";c.lineWidth=R*0.018;
      c.beginPath();
      const mouthW=R*0.22;
      for(let i=0;i<=32;i++){
        const p=i/32;
        const x=baseX-mouthW+p*mouthW*2;
        const amp=(0.03+this.mouthOpen*0.6)*R*0.14;
        const y=mouthY+Math.sin(p*8+this.t*0.3)*amp;
        if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
      }
      c.stroke();
      c.restore();

      c.globalAlpha=0.08;c.fillStyle="#000";
      for(let y=0;y<this.canvas.height;y+=4)c.fillRect(0,y,this.canvas.width,2);
      c.restore();
    }
  };

  const WakeWord = {
    _rec:null,_active:false,
    start(onDetect){
      if(this._active)return;
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR){console.warn("Wake nicht verfügbar");return;}
      const r=new SR();r.lang="de-DE";r.continuous=true;r.interimResults=true;
      r.onresult=(e)=>{
        const last=e.results[e.results.length-1];
        const txt=(last[0].transcript||"").toLowerCase().trim();
        const words=(Settings.get("voice","wakeWords")||"").split(",").map(w=>w.trim().toLowerCase()).filter(Boolean);
        if(words.some(w=>txt.includes(w)))onDetect&&onDetect(txt);
      };
      r.onerror=()=>{};
      r.onend=()=>{if(this._active){try{r.start();}catch(e){}}};
      try{r.start();this._active=true;this._rec=r;}catch(e){console.warn(e);}
    },
    stop(){this._active=false;try{this._rec&&this._rec.stop();}catch(e){}this._rec=null;},
    isActive(){return this._active;}
  };

  /* ============ APPS ============ */
  const NotesDB={
    key:"notes",all(){return Storage.get(this.key,[]);},save(l){Storage.set(this.key,l);},
    add(n){const l=this.all();l.unshift(n);this.save(l);},
    update(id,patch){const l=this.all();const i=l.findIndex(n=>n.id===id);if(i>=0){Object.assign(l[i],patch);l[i].updated=Date.now();this.save(l);}},
    del(id){this.save(this.all().filter(n=>n.id!==id));}
  };
  function mountNotes(root){
    const searchInput=U.el("input",{type:"text",placeholder:"🔍 Notizen durchsuchen…",oninput:()=>renderList()});
    const newBtn=U.el("button",{class:"btn primary",onclick:()=>openEditor(null)},"+ Neue Notiz");
    const exportAllBtn=U.el("button",{class:"btn",onclick:()=>{
      const all=NotesDB.all();if(!all.length){alert("Keine Notizen.");return;}
      downloadTxt(all.map(n=>`=== ${n.title} ===\n${n.body}\n`).join("\n\n"),"haldo-notizen-"+new Date().toISOString().slice(0,10)+".txt");
    }},"⬇️ Alle exportieren");
    root.appendChild(U.el("div",{class:"app-header"},
      U.el("button",{class:"btn",onclick:()=>Router.go("apps")},"← Zurück"),
      U.el("h2",{},"📝 Notizen Pro"),
      U.el("div",{style:{flex:1}}),newBtn
    ));
    root.appendChild(U.el("div",{class:"app-toolbar"},searchInput,U.el("span",{class:"badge",id:"notesCount",style:{flexShrink:0}}),exportAllBtn));
    const listEl=U.el("div",{class:"notes-list"});
    root.appendChild(listEl);
    function renderList(){
      const q=searchInput.value.toLowerCase().trim();
      const items=NotesDB.all().filter(n=>!q||(n.title||"").toLowerCase().includes(q)||(n.body||"").toLowerCase().includes(q));
      listEl.innerHTML="";
      document.getElementById("notesCount").textContent=items.length+" / "+NotesDB.all().length;
      if(!items.length){
        listEl.appendChild(U.el("div",{class:"placeholder"},
          U.el("img",{src:"logo.png",alt:""}),
          U.el("h3",{},q?"Keine Treffer":"Noch keine Notizen"),
          U.el("p",{},q?"Versuche anderen Suchbegriff.":"Klicke „+ Neue Notiz“ um loszulegen.")
        ));return;
      }
      items.forEach(n=>{
        const words=(n.body||"").split(/\s+/).filter(Boolean).length;
        listEl.appendChild(U.el("div",{class:"note-item"},
          U.el("div",{class:"note-head"},
            U.el("div",{class:"note-title"},n.title||"(ohne Titel)"),
            U.el("div",{class:"note-actions"},
              U.el("button",{class:"icon-btn",title:"Bearbeiten",onclick:()=>openEditor(n)},"✏️"),
              U.el("button",{class:"icon-btn",title:"Exportieren",onclick:()=>downloadTxt((n.title||"notiz")+"\n\n"+n.body,(n.title||"notiz").replace(/[^\w\-]+/g,"_")+".txt")},"⬇️"),
              U.el("button",{class:"icon-btn",title:"Löschen",onclick:()=>{if(confirm("Notiz löschen?")){NotesDB.del(n.id);renderList();}}},"🗑️")
            )
          ),
          n.body?U.el("div",{class:"note-body"},n.body.length>220?n.body.slice(0,220)+"…":n.body):null,
          U.el("div",{class:"note-meta"},new Date(n.updated||n.created).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})," · "+words+" Wörter")
        ));
      });
    }
    function openEditor(note){
      const isNew=!note;
      const n=note||{id:"n_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),title:"",body:"",created:Date.now(),updated:Date.now()};
      const overlay=U.el("div",{class:"modal-overlay"});
      const titleInp=U.el("input",{type:"text",placeholder:"Titel…",value:n.title,class:"modal-title"});
      const bodyInp=U.el("textarea",{placeholder:"Schreib hier…",class:"modal-body"},n.body);
      const saveBtn=U.el("button",{class:"btn primary",onclick:()=>{
        n.title=titleInp.value.trim()||"(ohne Titel)";n.body=bodyInp.value;
        if(isNew)NotesDB.add(n);else NotesDB.update(n.id,{title:n.title,body:n.body});

  function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function mountCalendar(root){
    let viewYear,viewMonth;
    const today=new Date();
    viewYear=today.getFullYear();viewMonth=today.getMonth();
    let selectedDate=dateKey(today);
    const titleEl=U.el("h3",{});
    root.appendChild(U.el("div",{class:"app-header"},

      U.el("button",{class:"btn",onclick:()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--;}render();}},"‹"),
      titleEl,
      U.el("button",{class:"btn",onclick:()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++;}render();}},"›"),
      U.el("button",{class:"btn",onclick:()=>{viewYear=today.getFullYear();viewMonth=today.getMonth();selectedDate=dateKey(today);render();}},"Heute"),
      U.el("div",{style:{flex:1}}),
      U.el("button",{class:"btn primary",onclick:()=>openEditor()},"+ Termin")
    ));
    const gridEl=U.el("div",{class:"cal-grid"});root.appendChild(gridEl);
    const eventsWrap=U.el("div",{class:"cal-events"});root.appendChild(eventsWrap);
    function render(){
      const monthNames=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
      titleEl.textContent=monthNames[viewMonth]+" "+viewYear;
      gridEl.innerHTML="";
      ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(d=>gridEl.appendChild(U.el("div",{class:"cal-dow"},d)));
      const first=new Date(viewYear,viewMonth,1);
      const startDow=(first.getDay()+6)%7;
      const start=new Date(viewYear,viewMonth,1-startDow);
      const todayKey=dateKey(today);
      for(let i=0;i<42;i++){
        const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
        const key=dateKey(d);
        const isOther=d.getMonth()!==viewMonth,isToday=key===todayKey,isSelected=key===selectedDate;
        const hasEvents=EventsDB.forDate(key).length;
        const cls="cal-day"+(isOther?" other":"")+(isToday?" today":"")+(isSelected?" selected":"");
        gridEl.appendChild(U.el("button",{class:cls,onclick:()=>{selectedDate=key;render();}},
          U.el("span",{},String(d.getDate())),
          hasEvents?U.el("div",{class:"dots"},...Array(Math.min(hasEvents,4)).fill(0).map(()=>U.el("span",{class:"dot"}))):null));
      }
      eventsWrap.innerHTML="";
      const events=EventsDB.forDate(selectedDate);

      eventsWrap.appendChild(U.el("h3",{},"📌 "+selLabel));

      }else events.forEach(ev=>{

          U.el("div",{class:"event-time"},ev.time||"–"),
          U.el("div",{class:"event-title"},ev.title),
          U.el("button",{class:"icon-btn",onclick:()=>{if(confirm("Löschen?")){EventsDB.del(ev.id);render();}}},"🗑️")
        ));
      });
    }

  function speakAndAnimate(text){
    Avatar.setSpeaking(true);

  async function handleUserMessage(text){
    addMessage("user",text);
    const lower=text.toLowerCase().trim();
    if(/^(hallo|hi|hey|servus|merhaba|silav|guten (morgen|tag|abend))/.test(lower)){
      const h=new Date().getHours();
      const greet=h<6?"Gute Nacht":h<12?"Guten Morgen":h<18?"Guten Tag":"Guten Abend";
      const name=Settings.get("general","name")||"";
      const reply=`${greet}${name?", "+name:""}! Was kann ich für dich tun?`;
      Avatar.setEmotion("freundlich");
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    if(/uhrzeit|wie spät/.test(lower)){
      const t=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
      const reply="Es ist "+t+" Uhr.";
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    if(/datum|welcher tag/.test(lower)){
      const d=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
      const reply="Heute ist "+d+".";
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    if(!AI.hasKey()){
      const reply="Ich habe noch keinen API-Key. Wechsle zu 🤖 KI und trag einen ein.";
      addMessage("bot",reply);speakAndAnimate(reply);return;
    }
    avStatus&&(avStatus.innerHTML='<span class="live">🤖 denke nach …</span>');
    try{
      const reply=await AI.send(chatHistory.slice(0,-1).slice(-10),text);
      addMessage("bot",reply);speakAndAnimate(reply);
      avStatus&&(avStatus.textContent="Bereit.");
    }catch(e){
      addMessage("sys","Fehler: "+(e.message||e));
      avStatus&&(avStatus.textContent="⚠️ Fehler");
    }
  }

  function exportBackup(){
    const data={};Storage.keys().forEach(k=>{data[k]=Storage.get(k);});
    const payload={app:"HalDo AI OS",version:"2.0",phase:6.2,exported:new Date().toISOString(),data};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="haldo-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

  function importBackup(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const payload=JSON.parse(ev.target.result);
        if(!payload.data){alert("❌ Ungültiges Format");return;}
        if(!confirm("Import? Aktuelle Daten werden überschrieben."))return;
        for(const k in payload.data)Storage.set(k,payload.data[k]);
        alert("✅ Importiert!");location.reload();
      }catch(err){alert("❌ "+err.message);}
    };
    reader.readAsText(file);
  }

    tick();setInterval(tick,15000);

    Router.add("home",viewHome);
    Router.add("apps",viewApps);
    Router.add("avatar",viewAvatar);

    registerApps();

    if(Settings.get("general","splash")){
      setTimeout(()=>{const b=document.getElementById("boot");if(b){b.classList.add("hide");setTimeout(()=>b.remove(),500);}},700);
    }else{const b=document.getElementById("boot");if(b)b.remove();}

    if(Settings.get("voice","wakeWord"))setTimeout(()=>WakeWord.start(onWakeWord),1500);

    Router.go(Settings.get("general","startPage")||"home");

    window.HalDo={Storage,Bus,Registry,Router,U,Settings,Voice,AI,Avatar,WakeWord,NotesDB,TasksDB,EventsDB,version:"2.0",phase:6.2};
    console.log("%c🦚 HalDo AI OS · Phase 6 Teil 2 — Perfektionierter Avatar","color:#00d4ff;font-weight:bold;font-size:14px");
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
  else boot();
})();
</script>
