<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>HalDo AI OS</title>
<style>
:root{
  --c1:#00e5ff;--c2:#4da8ff;--c3:#b478ff;
  --bg:#05060f;--panel:rgba(10,14,32,.75);--panel2:rgba(18,22,44,.88);
  --line:rgba(0,229,255,.28);--line2:rgba(255,255,255,.08);
  --txt:#e9edff;--dim:#8a95bd;
  --glow:0 0 12px rgba(0,229,255,.45);
  --sh:0 26px 70px rgba(0,0,0,.6);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
body.cyborg{--c1:#ff78c8;--c2:#b478ff;--c3:#d484ff;--line:rgba(255,120,200,.32);--glow:0 0 12px rgba(255,120,200,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}

/* KOSMOS */
#cosmos{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(ellipse at 68% 14%,#101a3a 0%,#070a1c 45%,#03040c 100%)}
#stars{position:absolute;inset:0;display:block}
.sun{position:absolute;left:50%;top:52%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff8c8,var(--c1) 42%,var(--c3) 68%,rgba(0,0,0,0) 72%);box-shadow:0 0 70px 26px rgba(0,229,255,.32);animation:sunPulse 8s ease-in-out infinite}
@keyframes sunPulse{50%{transform:scale(1.06)}}
.orbit{position:absolute;left:50%;top:52%;border:1px solid rgba(255,255,255,.05);border-radius:50%;transform:translate(-50%,-50%);animation:spin linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.planet{position:absolute;left:50%;top:0;border-radius:50%;transform:translate(-50%,-50%)}

/* TOP-BAR */
#topbar{position:fixed;top:var(--safe-t);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1.5px solid var(--line)}
#menuBtn{display:none}
.iconbtn{background:rgba(255,255,255,.06);border:1.5px solid var(--line);color:var(--txt);width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.iconbtn:hover{background:rgba(0,229,255,.12);box-shadow:var(--glow)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:800;color:#fff;flex:0 0 auto;background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 0 14px rgba(0,229,255,.5)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:13.5px;letter-spacing:.4px;white-space:nowrap}
.sm{font-size:11px}.dim{color:var(--dim)}.spacer{flex:1}
#search{width:220px;max-width:42vw;height:40px;border-radius:12px;padding:0 12px;background:rgba(255,255,255,.06);border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13px}
#search:focus{border-color:var(--c1)}
#clock{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--dim);white-space:nowrap}

/* SIDEBAR */
#sidebar{position:fixed;top:calc(var(--safe-t) + 56px);bottom:calc(var(--safe-b) + 56px);left:var(--safe-l);width:236px;z-index:8000;padding:14px 10px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1.5px solid var(--line);overflow-y:auto;transition:transform .28s}
#sidebar h4{margin:8px 4px;font-size:10.5px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;font-weight:700}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;margin-bottom:3px;background:transparent;border:1.5px solid transparent;border-radius:12px;color:var(--txt);cursor:pointer;font-size:13px;text-align:left}
.catbtn:hover{background:rgba(0,229,255,.08);border-color:var(--line)}
.catbtn .ico{font-size:16px;width:22px;text-align:center}
.catbtn .n{margin-left:auto;font-size:10.5px;color:var(--dim);padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.06)}

/* DESKTOP */
#desktop{position:fixed;top:calc(var(--safe-t) + 56px);left:calc(var(--safe-l) + 236px);right:var(--safe-r);bottom:calc(var(--safe-b) + 56px);z-index:1;overflow-y:auto;padding:18px 18px 40px}
#desktop h3{margin:22px 0 12px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--txt);font-weight:700}
#desktop h3 .n{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto;background:rgba(255,255,255,.06);padding:3px 9px;border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 5px;border-radius:15px;cursor:pointer;text-align:center;border:1.5px solid transparent;user-select:none}
.app:hover{background:rgba(0,229,255,.06);border-color:var(--line)}
.app:active{transform:scale(.95)}
.app .ic{font-size:26px;width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(150deg,rgba(0,229,255,.14),rgba(180,120,255,.08));border:1.5px solid var(--line)}
.app.soon .ic{opacity:.4}
.app .nm{font-size:11px;color:var(--dim);line-height:1.25;word-break:break-word}
.app.ready .nm{color:var(--txt);font-weight:500}

/* WINDOW */
.window{position:fixed;z-index:200;display:flex;flex-direction:column;overflow:hidden;background:var(--panel2);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1.5px solid var(--line);border-radius:18px;box-shadow:var(--sh);animation:winIn .2s}
@keyframes winIn{from{opacity:0;transform:scale(.95) translateY(12px)}}
.window.maxed{left:8px!important;top:64px!important;right:8px;bottom:8px;width:auto!important;height:auto!important;border-radius:14px}
.win-head{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;border-bottom:1.5px solid var(--line);user-select:none;touch-action:none}
.wic{font-size:16px}
.wtitle{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wbtns{display:flex;gap:5px;z-index:999999}
.wb{width:40px;height:40px;border-radius:11px;border:1.5px solid transparent;background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;font-size:14px;display:grid;place-items:center;z-index:999999}
.wb:hover{background:rgba(0,229,255,.15);color:var(--txt)}
.wb.close:hover{background:#e03b5a;color:#fff}
.win-body{flex:1;overflow:auto;padding:16px;position:relative}

/* BOTTOM */
#bottomBar{position:fixed;bottom:var(--safe-b);left:var(--safe-l);right:var(--safe-r);height:56px;z-index:9000;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1.5px solid var(--line)}
.bbtn{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500}
.bbtn:hover{background:rgba(0,229,255,.14)}
.bbtn.on{background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;border-color:var(--c1)}

/* UI */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.center{text-align:center}
.big{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.05}
.big2{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{padding:9px 15px;border-radius:12px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.btn:hover{background:rgba(0,229,255,.14);box-shadow:var(--glow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:var(--c1);color:#fff;font-weight:600}
.btn.danger{background:rgba(224,59,90,.16);border-color:rgba(224,59,90,.5);color:#ff9db1}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.card{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.045);border:1.5px solid var(--line);font-size:13px}
.inp,.ta{width:100%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.055);border:1.5px solid var(--line2);color:var(--txt);outline:none;font-size:13.5px;font-family:inherit}
.inp:focus,.ta:focus{border-color:var(--c1)}
.ta{min-height:150px;resize:vertical;line-height:1.5}
.lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:4px;display:block}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.045);border:1.5px solid var(--line2);font-size:13px}
.item .x{margin-left:auto;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:16px;line-height:1}
.item .x:hover{background:rgba(224,59,90,.2);color:#ff9db1}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:22px 10px;font-style:italic}

#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translate(-50%,140%);z-index:9999;padding:11px 18px;border-radius:13px;background:rgba(10,14,32,.96);border:1.5px solid var(--line);font-size:13px;transition:transform .3s;max-width:88vw;text-align:center}
#toast.on{transform:translate(-50%,0)}

@media(max-width:820px){
#menuBtn{display:grid}
#sidebar{transform:translateX(-105%)}
#sidebar.open{transform:translateX(0);box-shadow:14px 0 40px rgba(0,0,0,.55)}
#desktop{left:var(--safe-l);padding:14px 12px 30px}
.brand{display:none}
#search{width:auto;flex:1;max-width:none}
#clock{display:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.app .ic{width:48px;height:48px;font-size:24px}
.window{border-radius:0!important}
.win-body{padding:13px}
#bottomBar{gap:5px;padding:0 8px}
.bbtn{padding:9px 10px;font-size:12px}
.bbtn span.lbl-txt{display:none}
}
</style>
</head>
<body>

<div id="cosmos"><canvas id="stars"></canvas></div>

<header id="topbar">
  <button id="menuBtn" class="iconbtn">☰</button>
  <div class="logo" id="logoBtn">🦚</div>
  <div class="brand"><b>HalDo AI OS</b><span id="appcount" class="dim sm">…</span></div>
  <div class="spacer"></div>
  <input id="search" placeholder="Apps suchen…" autocomplete="off">
  <div id="clock" class="dim"></div>
  <button class="iconbtn" id="themeBtn">⚡</button>
</header>

<aside id="sidebar"></aside>
<main id="desktop"></main>

<div id="bottomBar">
  <button class="bbtn" data-act="chat">💬 <span class="lbl-txt">Chat</span></button>
  <button class="bbtn" data-act="ai">🤖 <span class="lbl-txt">AI</span></button>
  <button class="bbtn cyborg" data-act="cyborg">⚡ <span class="lbl-txt">CYBORG</span></button>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* ========================================================================
   HILFEN
   ======================================================================== */
var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var el = function(t,c,txt){ var e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };
var esc = function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var slug = function(s){ return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); };
var uid = function(){ return Math.random().toString(36).slice(2,10); };
var pad = function(n,l){ l=l||2; return String(n).padStart(l,'0'); };
var fmt = function(n){ return (Math.round(n*100)/100).toLocaleString('de-DE'); };
var rnd = function(a,b){ return Math.floor(Math.random()*(b-a+1))+a; };
var shuf = function(a){ return a.slice().sort(function(){ return Math.random()-.5; }); };

/* ========================================================================
   STORAGE
   ======================================================================== */
var store = {
  key: function(k){ return 'haldo_'+k+'_v1'; },
  get: function(k,d){ try{ var v=localStorage.getItem(this.key(k)); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set: function(k,v){ try{ localStorage.setItem(this.key(k), JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(this.key(k)); }catch(e){} }
};

/* ========================================================================
   TOAST
   ======================================================================== */
var _toastT;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

/* ========================================================================
   GLOBAL HALDO
   ======================================================================== */
window.HalDo = {
  APPS: {},
  LANGS: {},       /* wird von Sprach-Blöcken gefüllt */
  currentLang: 'de',
  version: '1.0',
  store: store,
  toast: toast,
  esc: esc, slug: slug, uid: uid, pad: pad, fmt: fmt, rnd: rnd, shuf: shuf,
  $: $, $$: $$, el: el
};
var H = window.HalDo;

/* Sprach-Helfer — Fallback auf Deutsch */
H.t = function(key, fb){
  var pack = H.LANGS[H.currentLang] || {};
  return pack[key] || fb || key;
};
H.setLang = function(code){
  H.currentLang = code;
  store.set('lang', code);
  toast('Sprache: '+code.toUpperCase());
};

/* ========================================================================
   KOSMOS
   ======================================================================== */
(function(){
  var cv = $('#stars'), ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  function draw(){
    var w = cv.width = Math.floor(window.innerWidth*dpr);
    var h = cv.height = Math.floor(window.innerHeight*dpr);
    cv.style.width = window.innerWidth+'px';
    cv.style.height = window.innerHeight+'px';
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<250;i++){
      var x=Math.random()*w, y=Math.random()*h, r=(Math.random()*1.3+.3)*dpr;
      ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.7+.2)+')';
      ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    }
  }
  draw();
  window.addEventListener('resize', draw);

  var cos = $('#cosmos');
  cos.appendChild(el('div','sun'));
  var P=[
    ['#a9c8ff',168,12,22],['#ffd18a',250,17,34],['#8ad4ff',348,19,50],
    ['#ff8ea3',440,16,66],['#e0b4ff',545,24,90],['#7de3c7',650,21,118],
    ['#9fd7ff',760,20,148],['#c1a3ff',875,18,184],['#ffbfa3',990,15,224],
    ['#a3ffd1',1095,14,266],['#ffa3c9',1200,13,314],['#d1c9ff',1305,12,360]
  ];
  for(var i=0;i<P.length;i++){
    (function(p){
      var o = el('div','orbit');
      o.style.width = o.style.height = p[1]+'px';
      o.style.animationDuration = p[3]+'s';
      var pl = el('div','planet');
      pl.style.width = pl.style.height = p[2]+'px';
      pl.style.background = 'radial-gradient(circle at 34% 30%,#fff,'+p[0]+' 58%,rgba(0,0,0,.62))';
      pl.style.boxShadow = '0 0 16px '+p[0];
      o.appendChild(pl);
      cos.appendChild(o);
    })(P[i]);
  }
})();

/* ========================================================================
   THEME
   ======================================================================== */
function setTheme(mode){
  if(mode==='cyborg') document.body.classList.add('cyborg');
  else document.body.classList.remove('cyborg');
  store.set('theme', mode);
  $('#themeBtn').textContent = mode==='cyborg' ? '🌌' : '⚡';
  $$('.bbtn.cyborg').forEach(function(b){ b.classList.toggle('on', mode==='cyborg'); });
}
$('#themeBtn').onclick = function(){
  var on = document.body.classList.contains('cyborg');
  setTheme(on ? 'holo' : 'cyborg');
  toast(on ? 'Holo-Modus 🌌' : 'CYBORG-Modus ⚡');
};
setTheme(store.get('theme','holo'));
H.currentLang = store.get('lang','de');

/* ========================================================================
   REGISTRY — Alle 375 Apps A-Z
   ======================================================================== */
var REGISTRY = [
  {k:'A',t:'AI & Assistant',ico:'🤖',apps:['HalDo AI','HalDo Cyborg','AI Chat','AI Writer','AI Image','AI Code','AI Voice','AI Vision','AI Music','AI Tutor','AI Translator','AI Summarizer','AI Notes','AI Search','AI Calendar','AI Mail','AI Agent']},
  {k:'B',t:'Bildung',ico:'🎓',apps:['Mathe Trainer','Deutsch Trainer','Englisch Trainer','Geschichte','Biologie','Chemie','Physik','Erdkunde','Formelsammlung','Vokabeltrainer','Kopfrechnen','Einmaleins','Bruchrechner','Geometrie','Algebra','Analysis','Stochastik','Wahrscheinlichkeit','Lineare Funktionen','Quadratische Gleichungen','Trigonometrie','Logikrätsel','Denksport','IQ Trainer','Konzentration','Gedächtnistraining','Lesetrainer','Rechtschreibung','Grammatik','Zeichensetzung','Aufsatz Helfer','Referat Planer','Zitierhelfer','Bibliografie','Studienführer','Prüfungstrainer','Lernkarten','Lernplaner','Nachhilfe']},
  {k:'C',t:'Fahrschule',ico:'🚗',apps:['Fahrschul Theorie','Verkehrszeichen','Vorfahrt','Kreuzungen','Autobahn','Landstraße','Stadtverkehr','Nachtfahrt','Parken','Einparken','Rückwärts','Anfahren','Schalten','Bremsen','Spiegel','Blinken','Umweltbewusst','Fahrphysik','Erste Hilfe','Pannenhilfe','Führerschein Fragen','Punkte Rechner','Blitzer Warnung','Stau Warnung','Baustelle Warnung','Polizei Warnung','Unfall Warnung']},
  {k:'D',t:'Gesundheit',ico:'💚',apps:['Schrittzähler','Kalorienzähler','Wasser Tracker','Schlaf Tracker','Stimmungs Tracker','BMI Rechner','Herzfrequenz','Blutdruck','Medikamente','Arzttermine','Symptom Checker','Meditation','Atemübung','Yoga','Pilates','Fitness','Workout Timer','Trainingsplan','Dehnübungen','Ernährungsberater','Rezepte Gesund','Zahnpflege','Hautpflege','Fitness Tracker']},
  {k:'E',t:'Arbeit',ico:'💼',apps:['Projekte','Kanban','Zeiterfassung','Meeting Notizen','Aufgaben','Team Chat','Kalender Arbeit','Rechnungen','Angebote','Kundenverwaltung','Stundenzettel','Urlaubsplaner','Berichte','Protokolle','Präsentation','Mindmap','Brainstorming','Whiteboard']},
  {k:'F',t:'Finanzen',ico:'💰',apps:['Budgetplaner','Ausgaben Tracker','Einnahmen Tracker','Kreditrechner','Zinsrechner','Währungsrechner','Aktien Tracker','Krypto Tracker','Sparen','Investieren','Steuern','Rechnungen','Quittungen']},
  {k:'G',t:'Zuhause',ico:'🏠',apps:['Einkaufsliste','Haushaltsplan','Putzplan','Kühlschrank','Vorratskammer','Rezepte','Familien Kalender','Kinderbetreuung','Haustiere','Pflanzen','Garten','Renovierung','Smart Home']},
  {k:'H',t:'HalDo World',ico:'🌌',apps:['HalDo AI','HalDo Cyborg','HalDo Kosmos','HalDo Avatar','HalDo Music','HalDo Radio','HalDo TV','HalDo Games','HalDo Store','HalDo Cloud','HalDo Sync','HalDo Backup','HalDo Wallet','HalDo Social']},
  {k:'I',t:'Wissen',ico:'📚',apps:['Wikipedia','Wörterbuch','Enzyklopädie','Zitate','Fakten','Astronomie','Geschichte Welt','Länder Lexikon','Hauptstädte','Flaggen','Karten','Tiere','Pflanzen','Weltrekorde','Erfindungen','Wissenschaft','Technik Lexikon']},
  {k:'J',t:'Kultur & Religion',ico:'🕌',apps:['Êzîdî Wissen','Êzîdî Religion','Êzîdî Musik','Êzîdî Feste','Qewls & Strans','Weltreligionen','Bibel','Koran','Tora','Gebete','Feste','Mythen','Sagen','Kurdische Kultur']},

/* ========================================================================
   FENSTER-MANAGER
   ======================================================================== */
var WM = { wins: {}, zTop: 200, focused: null };
function openWin(appId, opts){
  opts = opts || {};
  var app = H.APPS[appId];
  if(!app){ toast('App nicht gefunden: '+appId); return null; }
  for(var wid in WM.wins){
    if(WM.wins[wid].appId===appId){
      WM.wins[wid].el.style.display='';
      focusWin(wid);
      return WM.wins[wid].el;
    }
  }
  var id = uid();
  var win = el('section','window');
  win.dataset.id = id;
  win.style.zIndex = ++WM.zTop;

  var W = Math.min(opts.w || 520, window.innerWidth - 16);
  var Hh = Math.min(opts.h || 480, window.innerHeight - 16);
  win.style.width = W+'px';
  win.style.height = Hh+'px';
  var count = Object.keys(WM.wins).length;
  win.style.left = Math.max(8, (window.innerWidth - W)/2 + (count%5)*22 - 44)+'px';
  win.style.top = Math.max(64, (window.innerHeight - Hh)/2 + (count%5)*18 - 36)+'px';

  win.innerHTML = '<div class="win-head">'+
      '<span class="wic">'+esc(app.icon||'▣')+'</span>'+
      '<div class="wtitle">'+esc(app.name||appId)+'</div>'+
      '<div class="wbtns">'+
        '<button class="wb min">—</button>'+
        '<button class="wb max">▢</button>'+
        '<button class="wb close">✕</button>'+
      '</div>'+
    '</div>'+
    '<div class="win-body"></div>';
  document.body.appendChild(win);

  win.querySelector('.wb.close').onclick = function(e){ e.stopPropagation(); closeWin(id); };
  win.querySelector('.wb.min').onclick = function(e){ e.stopPropagation(); win.style.display='none'; };
  win.querySelector('.wb.max').onclick = function(e){ e.stopPropagation(); win.classList.toggle('maxed'); };
  win.addEventListener('pointerdown', function(){ focusWin(id); }, true);
  var head = win.querySelector('.win-head');
  head.addEventListener('pointerdown', function(e){ dragWin(e, id); });

  var body = win.querySelector('.win-body');
  try{
    var html = (typeof app.render==='function') ? app.render(win, body) : (app.render||'');
    if(html != null) body.innerHTML = html;
    if(typeof app.init==='function') app.init(win, body);
  }catch(err){
    body.innerHTML = '<div class="empty">Fehler beim Laden: '+esc(err.message)+'</div>';
    console.error('[HalDo App]', appId, err);
  }
  WM.wins[id] = {el:win, appId:appId};
  focusWin(id);
  return win;
}
function closeWin(id){
  var w = WM.wins[id]; if(!w) return;
  w.el.remove();
  delete WM.wins[id];
}
function focusWin(id){
  var w = WM.wins[id]; if(!w) return;
  w.el.style.zIndex = ++WM.zTop;
  WM.focused = id;
}
function dragWin(e, id){
  var w = WM.wins[id]; if(!w) return;
  var win = w.el;
  if(win.classList.contains('maxed')) return;
  var r = win.getBoundingClientRect();
  var sx = e.clientX, sy = e.clientY, sl = r.left, st = r.top;
  function mv(ev){
    var nl = sl + ev.clientX - sx, nt = st + ev.clientY - sy;
    nl = Math.min(window.innerWidth - 60, Math.max(-r.width+60, nl));
    nt = Math.min(window.innerHeight - 60, Math.max(56, nt));
    win.style.left = nl+'px'; win.style.top = nt+'px';
    ev.preventDefault();
  }
  function up(){
    document.removeEventListener('pointermove', mv);
    document.removeEventListener('pointerup', up);
  }
  document.addEventListener('pointermove', mv, {passive:false});
  document.addEventListener('pointerup', up);
}
H.open = openWin;
H.close = closeWin;

$('#search').addEventListener('input', function(e){
  var q = e.target.value.trim().toLowerCase();
  if(!q) return;
});
$('#search').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    var q = e.target.value.trim().toLowerCase();
    if(!q) return;
    for(var i=0;i<REGISTRY.length;i++){
      for(var j=0;j<REGISTRY[i].apps.length;j++){
        var name = REGISTRY[i].apps[j];
        if(name.toLowerCase().indexOf(q)>=0){
          var id = H.findId(name);
          if(id){ openWin(id); e.target.value=''; return; }
        }
      }
    }
    toast('Nichts gefunden: '+q);
  }
});
