<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<style>
:root{--bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;--text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;--success:#10b981;--warn:#f59e0b;--danger:#ef4444;--radius:12px;--font:'Segoe UI',system-ui,sans-serif;--font-size:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#000;user-select:none;}
body{font-family:var(--font);color:var(--text);font-size:var(--font-size);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

#cosmos-canvas{position:fixed;inset:0;z-index:0;pointer-events:auto;width:100%;height:100%;display:block;}

#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,0.65);backdrop-filter:blur(10px);transition:opacity 0.5s;}
#welcome.hide{opacity:0;pointer-events:none;}
#welcome .logo-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 30px rgba(6,182,212,.9));animation:floatLogo 3s ease-in-out infinite;}
@keyframes floatLogo{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
#welcome h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(251,191,36,.8);}
#welcome h2{font-size:clamp(14px,2vw,20px);color:#e5e7eb;font-weight:400;line-height:1.6;}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;}
#welcome .presented b{color:#fbbf24;}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s;color:#fff;}
#welcome .enter-btn:hover{transform:scale(1.05);}

#taskbar{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(17,24,39,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 12px;gap:10px;z-index:9997;}
#taskbar.show{display:flex;}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:10px 20px;border-radius:10px;font-weight:bold;display:flex;align-items:center;gap:8px;color:#fff;cursor:pointer;font-size:14px;box-shadow:0 0 15px rgba(6,182,212,.4);}
.start-btn:hover{filter:brightness(1.15);}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow-x:auto;}
.taskbar-app{background:rgba(55,65,81,.5);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap;}
.taskbar-app:hover{border-color:var(--accent);background:rgba(31,41,55,.8);}
#sys-clock{color:var(--dim);font-size:13px;font-weight:600;}

#start-menu{position:fixed;bottom:60px;left:10px;width:560px;max-height:80vh;background:rgba(17,24,39,.98);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;z-index:9998;box-shadow:0 -10px 40px rgba(0,0,0,.8);}
#start-menu.show{display:flex;}
.sm-drag-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--accent);cursor:move;user-select:none;background:rgba(0,0,0,.2);}
.sm-tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);}
.sm-tab{flex:1;padding:10px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;}
.sm-tab.active{color:var(--accent);background:rgba(6,182,212,.15);border-bottom:2px solid var(--accent);}
.sm-panel{flex:1;overflow-y:auto;padding:12px;display:none;}
.sm-panel.active{display:block;}
.sm-search{padding:8px 10px 10px;}
.sm-search input{background:rgba(0,0,0,.3);border:1px solid var(--border);padding:8px 12px;border-radius:6px;}
.sm-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent;background:rgba(55,65,81,.2);}
.sm-app-card:hover{background:rgba(55,65,81,.6);border-color:var(--accent);transform:translateY(-2px);}
.sm-app-card.dragging{opacity:0.4;border:2px dashed var(--accent);}
.sm-app-card .ico{font-size:26px;margin-bottom:6px;pointer-events:none;}
.sm-app-card .nm{font-size:11px;text-align:center;line-height:1.2;pointer-events:none;}

/* Settings Panel mit A-Z Sidebar */
.settings-layout{display:flex;height:100%;min-height:400px;}
.settings-nav{width:150px;flex:none;padding:8px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:rgba(0,0,0,.3);}
.settings-nav-item{text-align:left;padding:9px 10px;font-size:12px;border-radius:6px;color:#a0c8e0;cursor:pointer;background:transparent;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.settings-nav-item:hover{background:rgba(55,65,81,.5);color:#fff;}
.settings-nav-item.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.settings-content{flex:1;padding:16px;overflow-y:auto;}
.settings-content h3{color:var(--accent);font-size:15px;margin-bottom:12px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(55,65,81,.5);gap:12px;}
.settings-row:last-child{border:none;}
.settings-row .lbl{font-size:13px;font-weight:600;}
.settings-row .sub{font-size:11px;color:var(--dim);margin-top:2px;}
.settings-row .ctrl{flex-shrink:0;min-width:160px;max-width:200px;}
.settings-row .ctrl input[type=range]{width:100%;}
.settings-row .ctrl select{padding:6px 10px;font-size:12px;}
.settings-row .ctrl button{padding:6px 14px;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;font-weight:600;}
.toggle{position:relative;width:44px;height:24px;background:rgba(55,65,81,.8);border-radius:12px;cursor:pointer;transition:background .2s;display:inline-block;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}

/* WINDOW */
.window{position:fixed;background:rgba(10,14,26,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.7);min-width:380px;min-height:280px;}
.window.minimized{display:none;}
.window-header{padding:12px 16px;background:rgba(0,0,0,0.5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;}
.window-title{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:10px;font-size:13px;}
.window-controls{display:flex;gap:6px;}
.win-btn{width:28px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);transition:background .2s;font-size:14px;}
.win-btn:hover{background:rgba(255,255,255,.2);}
.win-btn.close:hover{background:var(--danger);}
.window-body{flex:1;overflow:hidden;display:flex;}

#app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%,rgba(6,182,212,.2) 0%,rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px);}
#app-splash.show{display:flex;animation:splashIn .3s;}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);animation:starGlow 1.2s ease-out;}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.splash-presented{font-size:12px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;}
.splash-presented b{color:#fbbf24;}
@keyframes splashIn{from{opacity:0;}to{opacity:1;}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg);}50%{transform:scale(1.2) rotate(180deg);}100%{transform:scale(1) rotate(360deg);}}

.app-sidebar{width:170px;flex:none;padding:10px 8px;background:rgba(0,10,20,.6);border-right:1px solid rgba(55,65,81,.5);display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.side-btn{text-align:left;padding:9px 12px;font-size:12px;background:transparent;border:1px solid transparent;color:#a0c8e0;cursor:pointer;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-btn:hover{background:rgba(55,65,81,.5);color:#fff;}
.side-btn.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.side-btn.speak-btn{margin-top:auto;color:var(--accent);}
.app-content{flex:1;padding:18px;overflow-y:auto;min-width:0;}
.app-content h3{margin-bottom:12px;color:var(--accent);font-size:16px;}
.app-content input,.app-content select,.app-content textarea{margin-bottom:8px;}
.app-content button{padding:9px 16px;margin:4px 4px 4px 0;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.app-content button:hover{background:var(--accent2);}
.app-content button.danger{background:var(--danger);border-color:var(--danger);}
.app-content button.ghost{background:transparent;color:var(--text);border-color:var(--border);}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:6px;}
.list-row:hover{background:rgba(55,65,81,.6);border-color:var(--accent);}
.list-row .meta{color:var(--dim);font-size:11px;margin-left:auto;}
.muted{color:var(--dim);}
.qt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.qt-panel{background:rgba(31,41,55,.5);padding:14px;border-radius:10px;border:1px solid var(--border);}
.qt-panel h4{margin-bottom:8px;font-size:12px;color:var(--accent);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;margin-top:10px;}
.cal-cell{min-height:56px;padding:3px;background:rgba(55,65,81,.4);border:1px solid var(--border);border-radius:4px;cursor:pointer;}
.cal-cell:hover{background:rgba(55,65,81,.8);}
.cal-cell .day{color:var(--accent);font-weight:700;font-size:10px;}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 6px rgba(6,182,212,.4);}
.cal-head{color:var(--accent);text-align:center;padding:3px;font-weight:700;font-size:10px;}
.chat-box{display:flex;flex-direction:column;height:100%;}
.chat-log{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid var(--border);margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;max-width:85%;line-height:1.5;}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
.msg.ai{align-self:flex-start;background:rgba(31,41,55,.9);border:1px solid var(--border);}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;margin:0;}
.chat-input button{margin:0;}
.anatomy-wrap{width:100%;height:calc(100% - 5px);min-height:380px;border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;background:#001122;}
.layer-toggles{position:absolute;top:10px;left:10px;z-index:2;display:flex;gap:10px;font-size:11px;background:rgba(0,20,40,.8);padding:6px 10px;border:1px solid var(--accent);border-radius:6px;}
.layer-toggles label{display:flex;align-items:center;gap:4px;cursor:pointer;color:#b8e6ff;}
.layer-toggles input{width:auto;margin:0;}
.cyborg-chat{display:flex;flex:1;height:100%;}
.cyborg-3d{width:40%;min-width:280px;background:radial-gradient(circle at center,#0a2a3a 0%,#000 100%);position:relative;border-right:1px solid var(--border);}
.cyborg-3d canvas{display:block;width:100%;height:100%;}
.cyborg-chat-log{flex:1;padding:14px;display:flex;flex-direction:column;}
.cyborg-status{text-align:center;font-size:11px;color:var(--accent);padding:6px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--border);}
#click-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(6,182,212,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:99;animation:pulse 2s infinite;pointer-events:none;transition:opacity .5s;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.7);}50%{box-shadow:0 0 0 15px rgba(6,182,212,0);}}
</style>
</head>
<body>
<canvas id="cosmos-canvas"></canvas>

<div id="welcome">
  <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
  <div style="font-size:80px;display:none;filter:drop-shadow(0 0 30px #06b6d4)">🤖</div>
  <h1>HALDO AI OS PRO MAX</h1>
  <h2>Willkommen zurück, Bruder 💙<br>Dein Universum aus Medizin, Alltag und Intelligenz.</h2>
  <div class="presented">Präsentiert von <b>Halil Donma</b></div>
  <button class="enter-btn" onclick="enterApp()">JETZT STARTEN →</button>
</div>

<div id="app-splash">
  <div class="splash-icon" id="splash-icon">🤖</div>
  <div class="splash-name" id="splash-name">HalDo AI OS</div>
  <div class="splash-presented">Präsentiert von <b>Halil Donma</b></div>
</div>

<div id="taskbar">
  <div class="start-btn" onclick="toggleStartMenu(event)"><span>⊞</span> <span>Start</span></div>
  <div class="taskbar-apps" id="taskbar-apps"></div>
  <div id="sys-clock">--:--</div>
</div>

<div id="start-menu">
  <div class="sm-drag-header" id="sm-drag-handle">
    <span>🚀 HalDo AI OS Pro Max</span>
    <span style="font-size:11px;color:var(--dim)">≡ ziehen</span>
  </div>
  <div class="sm-tabs">
    <button class="sm-tab active" data-tab="apps">📱 Apps (A–Z)</button>
    <button class="sm-tab" data-tab="settings">⚙️ Einstellungen</button>
  </div>
  <div class="sm-panel active" id="sm-panel-apps">
    <div class="sm-search"><input type="text" id="sm-search-input" placeholder="Apps durchsuchen…" oninput="filterStartMenu(this.value)"></div>
    <div class="sm-apps" id="sm-apps"></div>
  </div>
  <div class="sm-panel" id="sm-panel-settings">
    <div class="settings-layout">
      <div class="settings-nav" id="settings-nav"></div>
      <div class="settings-content" id="settings-content"></div>
    </div>
  </div>
</div>

<div id="click-hint">👆 Klicke auf die Erde, um mit HalDo AI zu sprechen</div>

let cosmosState={
  scene:null,camera:null,renderer:null,raycaster:null,mouse:null,
  sun:null,earth:null,moon:null,planets:{},orbits:[],
  config:JSON.parse(localStorage.getItem('haldo_kosmos')||'{"sun":true,"mercury":true,"venus":true,"earth":true,"moon":true,"mars":true,"jupiter":true,"saturn":true,"neptune":true,"orbits":true,"speed":1,"brightness":1}')
};

function makeSunTexture(){
  const c=document.createElement('canvas');c.width=1024;c.height=512;
  const ctx=c.getContext('2d');
  const baseGrad=ctx.createLinearGradient(0,0,0,512);
  baseGrad.addColorStop(0,'#ffaa00');baseGrad.addColorStop(0.5,'#ffdd00');baseGrad.addColorStop(1,'#ffaa00');
  ctx.fillStyle=baseGrad;ctx.fillRect(0,0,1024,512);
  for(let i=0;i<15000;i++){
    const x=Math.random()*1024,y=Math.random()*512,r=Math.random()*6+1;
    const b=Math.random();
    if(b>0.7)ctx.fillStyle='rgba(255,255,220,'+(0.3+Math.random()*0.4)+')';
    else if(b>0.4)ctx.fillStyle='rgba(255,200,60,'+(0.25+Math.random()*0.35)+')';
    else ctx.fillStyle='rgba(220,80,10,'+(0.15+Math.random()*0.25)+')';
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  for(let i=0;i<200;i++){
    const x=Math.random()*1024,y=Math.random()*512,r=10+Math.random()*30;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(255,255,180,0.5)');g.addColorStop(0.6,'rgba(255,180,40,0.3)');g.addColorStop(1,'rgba(255,120,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  for(let i=0;i<12;i++){
    const x=Math.random()*1024,y=Math.random()*512,r=15+Math.random()*35;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(80,20,0,0.85)');g.addColorStop(0.6,'rgba(140,60,10,0.5)');g.addColorStop(1,'rgba(255,180,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}
function makeGlowSprite(size,color){
  const c=document.createElement('canvas');c.width=c.height=256;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,color);g.addColorStop(0.3,color.replace(/[\d.]+\)$/,'0.6)'));g.addColorStop(0.6,color.replace(/[\d.]+\)$/,'0.2)'));g.addColorStop(1,color.replace(/[\d.]+\)$/,'0)'));
  ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
  s.scale.set(size,size,1);
  return s;
}
function makePlanetTexture(baseColor){
  const c=document.createElement('canvas');c.width=512;c.height=256;
  const ctx=c.getContext('2d');
  ctx.fillStyle=baseColor;ctx.fillRect(0,0,512,256);
  for(let i=0;i<3000;i++){
    const x=Math.random()*512,y=Math.random()*256,r=Math.random()*8+1;
    const a=0.05+Math.random()*0.15;
    ctx.fillStyle='rgba(255,255,255,'+a+')';
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  for(let i=0;i<1500;i++){
    const x=Math.random()*512,y=Math.random()*256,r=Math.random()*6+1;
    ctx.fillStyle='rgba(0,0,0,'+(0.05+Math.random()*0.15)+')';
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  return new THREE.CanvasTexture(c);
}

function createSaturnRing(){
  const innerR=2.1,outerR=3.2;
  const c=document.createElement('canvas');c.width=512;c.height=64;
  const ctx=c.getContext('2d');
  for(let x=0;x<512;x++){
    const a=0.5+Math.sin(x*0.1)*0.3;
    ctx.fillStyle='rgba(220,200,150,'+a+')';
    ctx.fillRect(x,0,1,64);
  }
  const ringTex=new THREE.CanvasTexture(c);
  const geo=new THREE.RingGeometry(innerR,outerR,64,1);
  const mat=new THREE.MeshBasicMaterial({map:ringTex,side:THREE.DoubleSide,transparent:true,opacity:0.8});
  const ring=new THREE.Mesh(geo,mat);
  ring.rotation.x=Math.PI/2;
  return ring;
}

function initCosmos(){
  if(typeof THREE==='undefined'){console.warn('Three.js fehlt');return;}
  try{
    const canvas=document.getElementById('cosmos-canvas');
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,5000);
    camera.position.set(0,14,38);
    camera.lookAt(0,0,0);
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setClearColor(0x000005,1);

    // Sterne
    const sg=new THREE.BufferGeometry();
    const sp=new Float32Array(12000*3);
    const scArr=new Float32Array(12000*3);
    for(let i=0;i<12000;i++){
      const r=400+Math.random()*1000,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
      sp[i*3]=r*Math.sin(ph)*Math.cos(th);
      sp[i*3+1]=r*Math.cos(ph);
      sp[i*3+2]=r*Math.sin(ph)*Math.sin(th);
      const b=0.6+Math.random()*0.4;
      scArr[i*3]=b;scArr[i*3+1]=b;scArr[i*3+2]=b;
    }
    sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
    sg.setAttribute('color',new THREE.BufferAttribute(scArr,3));
    const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:1.5,vertexColors:true,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending}));
    scene.add(stars);

    // === SONNE zentral ===
    const sun=new THREE.Mesh(new THREE.SphereGeometry(2,64,64),new THREE.MeshBasicMaterial({map:makeSunTexture()}));
    sun.position.set(0,0,0);
    scene.add(sun);
    cosmosState.sun=sun;

    // Korona
    const glow1=makeGlowSprite(14,'rgba(255,180,60,1)');glow1.position.set(0,0,0);scene.add(glow1);
    const glow2=makeGlowSprite(22,'rgba(255,140,30,1)');glow2.position.set(0,0,0);scene.add(glow2);
    const glow3=makeGlowSprite(32,'rgba(255,100,20,1)');glow3.position.set(0,0,0);scene.add(glow3);

    // Sonnenlicht (sehr hell)
    const sunLight=new THREE.PointLight(0xffffff,3.5,300);
    sunLight.position.set(0,0,0);scene.add(sunLight);

    // Ambient (heller für Erde)
    const ambient=new THREE.AmbientLight(0x556688,2.0);
    scene.add(ambient);
    cosmosState.ambient=ambient;

    // === PLANETEN ===
    const PLANET_DATA=[
      {id:'mercury',name:'Merkur',radius:0.35,dist:5,color:'#888888',speed:0.035},
      {id:'venus',name:'Venus',radius:0.55,dist:7,color:'#eebb77',speed:0.025},
      {id:'earth',name:'Erde',radius:0.85,dist:10,color:'#2288ff',speed:0.018,isEarth:true},
      {id:'mars',name:'Mars',radius:0.6,dist:13.5,color:'#cc4422',speed:0.014},
      {id:'jupiter',name:'Jupiter',radius:1.5,dist:18,color:'#ddbb88',speed:0.009},
      {id:'saturn',name:'Saturn',radius:1.2,dist:24,color:'#ddcc88',speed:0.006,hasRing:true},
      {id:'neptune',name:'Neptun',radius:0.95,dist:30,color:'#4466cc',speed:0.004}
    ];

    PLANET_DATA.forEach(p=>{
      const grp=new THREE.Group();
      let mesh;
      if(p.isEarth){
        // Erde mit echter Textur + HELLER
        const earthTex=new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
        mesh=new THREE.Mesh(
          new THREE.SphereGeometry(p.radius,48,48),
          new THREE.MeshPhongMaterial({map:earthTex,shininess:30,specular:0x6688aa,emissive:0x224466,emissiveIntensity:0.8})
        );
        cosmosState.earth=mesh;
      }else{
        mesh=new THREE.Mesh(
          new THREE.SphereGeometry(p.radius,32,32),
          new THREE.MeshPhongMaterial({map:makePlanetTexture(p.color),shininess:10,emissive:new THREE.Color(p.color).multiplyScalar(0.1)})
        );
      }
      grp.add(mesh);
      grp.userData={...p,mesh,angle:Math.random()*Math.PI*2};
      scene.add(grp);
      cosmosState.planets[p.id]=grp;

      // Saturn-Ring
      if(p.hasRing){
        const ring=createSaturnRing();
        ring.scale.set(p.radius/1.2,p.radius/1.2,1);
        mesh.add(ring);
      }

      // Umlaufbahn
      const orbitGeo=new THREE.RingGeometry(p.dist-0.02,p.dist+0.02,128);
      const orbitMat=new THREE.MeshBasicMaterial({color:0x4488aa,side:THREE.DoubleSide,transparent:true,opacity:0.15});
      const orbit=new THREE.Mesh(orbitGeo,orbitMat);
      orbit.rotation.x=Math.PI/2;
      scene.add(orbit);
      cosmosState.orbits.push(orbit);
    });

    // === MOND (kreist um Erde) ===
    const moonGroup=new THREE.Group();
    const moonTex=new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
    const moon=new THREE.Mesh(
      new THREE.SphereGeometry(0.25,24,24),
      new THREE.MeshPhongMaterial({map:moonTex,shininess:5,emissive:0x222222,emissiveIntensity:0.3})
    );
    moonGroup.add(moon);
    scene.add(moonGroup);
    cosmosState.moon=moonGroup;
    cosmosState.moonMesh=moon;

    // === BELEUCHTUNG ANWENDEN ===
    applyKosmosConfig();

    // Raycaster für Erde
    const raycaster=new THREE.Raycaster();
    const mouse=new THREE.Vector2();
    cosmosState.raycaster=raycaster;
    cosmosState.mouse=mouse;

    renderer.domElement.addEventListener('mousemove',e=>{
      mouse.x=(e.clientX/innerWidth)*2-1;
      mouse.y=-(e.clientY/innerHeight)*2+1;
      raycaster.setFromCamera(mouse,camera);
      const hits=cosmosState.earth?raycaster.intersectObject(cosmosState.earth):[];
      canvas.style.cursor=hits.length>0?'pointer':'default';
    });
    renderer.domElement.addEventListener('click',e=>{
      mouse.x=(e.clientX/innerWidth)*2-1;
      mouse.y=-(e.clientY/innerHeight)*2+1;
      raycaster.setFromCamera(mouse,camera);
      const hits=cosmosState.earth?raycaster.intersectObject(cosmosState.earth):[];
      if(hits.length>0){
        openCyborgChat();
        const hint=document.getElementById('click-hint');
        if(hint)hint.style.opacity='0';
      }
    });

    let t0=Date.now();
    (function animate(){
      requestAnimationFrame(animate);
      const dt=(Date.now()-t0)*0.001;
      const speedMul=cosmosState.config.speed||1;

      // Sonne rotieren
      sun.rotation.y+=0.0008*speedMul;

      // Planeten kreisen um Sonne
      Object.keys(cosmosState.planets).forEach(id=>{
        const grp=cosmosState.planets[id];
        const p=grp.userData;
        p.angle+=p.speed*0.01*speedMul;
        grp.position.x=Math.cos(p.angle)*p.dist;
        grp.position.z=Math.sin(p.angle)*p.dist;
        p.mesh.rotation.y+=0.01;
        // Achsneigung
        p.mesh.rotation.z=0.1;
      });

      // Mond kreist um Erde
      if(cosmosState.planets.earth){
        const earthPos=cosmosState.planets.earth.position;
        const moonAngle=dt*0.8*speedMul;
        cosmosState.moon.position.set(
          earthPos.x+Math.cos(moonAngle)*1.8,
          earthPos.y+Math.sin(moonAngle*0.3)*0.2,
          earthPos.z+Math.sin(moonAngle)*1.8
        );
        cosmosState.moonMesh.rotation.y+=0.02;
      }

      // Pulsieren Sonne
      const pulse=1+Math.sin(Date.now()*0.001)*0.05;
      glow1.scale.set(14*pulse,14*pulse,1);
      glow2.scale.set(22*(2-pulse),22*(2-pulse),1);

      stars.rotation.y+=0.00003;
      renderer.render(scene,camera);
    })();

    addEventListener('resize',()=>{
      renderer.setSize(innerWidth,innerHeight);
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
    });

    cosmosState.scene=scene;
    cosmosState.camera=camera;
    cosmosState.renderer=renderer;
  }catch(e){console.error('Cosmos:',e);}
}

function applyKosmosConfig(){
  if(!cosmosState.scene)return;
  const c=cosmosState.config;
  // Sonne
  if(cosmosState.sun)cosmosState.sun.visible=c.sun!==false;
  // Planeten
  ['mercury','venus','earth','mars','jupiter','saturn','neptune'].forEach(id=>{
    if(cosmosState.planets[id])cosmosState.planets[id].visible=c[id]!==false;
  });
  // Mond
  if(cosmosState.moon)cosmosState.moon.visible=c.moon!==false;
  // Umlaufbahnen
  cosmosState.orbits.forEach(o=>o.visible=c.orbits!==false);
  // Helligkeit
  if(cosmosState.ambient)cosmosState.ambient.intensity=2.0*(c.brightness||1);
  localStorage.setItem('haldo_kosmos',JSON.stringify(c));
}

let cyborgState={scene:null,camera:null,renderer:null,head:null,eyes:[],mouth:null,speaking:false,blinkTimer:0,container:null,gltf:null,currentModel:null};
function initCyborg3D(container){
  if(typeof THREE==='undefined')return;
  container.innerHTML='';
  const canvas=document.createElement('canvas');
  canvas.style.cssText='width:100%;height:100%;display:block;';
  container.appendChild(canvas);
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setSize(container.clientWidth,container.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(35,container.clientWidth/container.clientHeight,0.1,100);
  camera.position.set(0,0.3,2.5);camera.lookAt(0,0.2,0);
  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const d1=new THREE.DirectionalLight(0xffffff,1.5);d1.position.set(2,3,3);scene.add(d1);
  const d2=new THREE.DirectionalLight(0x06b6d4,1.2);d2.position.set(-2,1,-2);scene.add(d2);
  const d3=new THREE.DirectionalLight(0xff88aa,0.6);d3.position.set(0,-1,2);scene.add(d3);
  const headGroup=new THREE.Group();
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.5,32,32),new THREE.MeshStandardMaterial({color:0x88aacc,roughness:0.4,metalness:0.6}));
  head.scale.set(0.85,1,0.9);headGroup.add(head);
  const face=new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32),new THREE.MeshStandardMaterial({color:0xaaccee,roughness:0.3,metalness:0.3}));
  face.scale.set(0.82,0.95,0.75);face.position.z=0.08;headGroup.add(face);
  const eyes=[];
  [-0.18,0.18].forEach(x=>{
    const eyeWhite=new THREE.Mesh(new THREE.SphereGeometry(0.09,16,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.1}));
    eyeWhite.position.set(x,0.1,0.35);headGroup.add(eyeWhite);
    const pupil=new THREE.Mesh(new THREE.SphereGeometry(0.04,16,16),new THREE.MeshStandardMaterial({color:0x06b6d4,emissive:0x06b6d4,emissiveIntensity:1.5}));
    pupil.position.set(x,0.1,0.43);headGroup.add(pupil);
    eyes.push({white:eyeWhite,pupil});
  });
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.02,0.02),new THREE.MeshStandardMaterial({color:0x333333,emissive:0x06b6d4,emissiveIntensity:0.3}));
  mouth.position.set(0,-0.12,0.42);headGroup.add(mouth);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.18,0.4,16),new THREE.MeshStandardMaterial({color:0x667799,roughness:0.5,metalness:0.7}));
  neck.position.y=-0.6;headGroup.add(neck);
  const shoulders=new THREE.Mesh(new THREE.SphereGeometry(0.55,24,24),new THREE.MeshStandardMaterial({color:0x556688,roughness:0.6,metalness:0.4}));
  shoulders.scale.set(1.3,0.5,0.8);shoulders.position.y=-0.9;headGroup.add(shoulders);
  scene.add(headGroup);
  cyborgState.scene=scene;cyborgState.camera=camera;cyborgState.renderer=renderer;
  cyborgState.head=headGroup;cyborgState.eyes=eyes;cyborgState.mouth=mouth;
  cyborgState.container=container;cyborgState.blinkTimer=Math.random()*3000;
  let lastT=Date.now(),headBob=0;
  (function loop(){
    requestAnimationFrame(loop);
    const now=Date.now();const dt=now-lastT;lastT=now;headBob+=dt*0.002;
    headGroup.rotation.x=Math.sin(headBob)*0.03;
    headGroup.rotation.y=Math.sin(headBob*0.7)*0.05;
    headGroup.position.y=Math.sin(headBob*1.2)*0.02;
    cyborgState.blinkTimer-=dt;
    if(cyborgState.blinkTimer<=0){
      cyborgState.blinkTimer=2000+Math.random()*4000;
      const blinkStart=Date.now();
      const blink=()=>{
        const e=Date.now()-blinkStart;
        const s=e<100?Math.max(0.05,1-e/50):Math.min(1,(e-100)/50);
        eyes.forEach(ey=>{ey.white.scale.y=Math.max(0.05,s);ey.pupil.scale.y=Math.max(0.05,s);});
        if(e<200)setTimeout(blink,16);
      };
      blink();
    }
    if(cyborgState.speaking){
      mouth.scale.y=1+Math.abs(Math.sin(Date.now()*0.02))*4;
      mouth.scale.x=1+Math.abs(Math.sin(Date.now()*0.015))*0.5;
      eyes.forEach(ey=>{ey.pupil.material.emissiveIntensity=1+Math.sin(Date.now()*0.01)*0.5;});
    }else{
      mouth.scale.y=Math.max(1,mouth.scale.y*0.9);
      mouth.scale.x=Math.max(1,mouth.scale.x*0.9);
    }
    renderer.render(scene,camera);
  })();
  const ro=new ResizeObserver(()=>{
    const w=container.clientWidth,h=container.clientHeight;
    if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
  });
  ro.observe(container);
}

function cyAddMessage(role,text){
  const log=document.getElementById('cy-log');if(!log)return;
  const d=document.createElement('div');d.className='msg '+role;d.textContent=text;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
}
function cySend(){
  const inp=document.getElementById('cy-input');if(!inp)return;
  const q=inp.value.trim();if(!q)return;
  inp.value='';
  cyAddMessage('user',q);
  const status=document.getElementById('cy-status');
  if(status)status.textContent='🤔 DENKT NACH…';
  setTimeout(()=>{
    const reply=processHalDoCommand(q);
    cyAddMessage('ai',reply);
    if(status)status.textContent='🟢 ONLINE · BEREIT';
    speak(reply);
  },500);
}

function processHalDoCommand(input){
  const ql=input.toLowerCase().trim();
  for(const verb of ['öffne ','starte ','open ','start ','zeige ']){
    if(ql.startsWith(verb)){
      const target=ql.substring(verb.length).trim();
      const app=REGISTRY.find(a=>a.nm.toLowerCase().includes(target)||a.id.toLowerCase()===target);
      if(app){setTimeout(()=>openApp(app.id),500);return '✓ Öffne '+app.nm+'…';}
    }
  }
  const taskM=input.match(/^(?:erstelle?|add|neue?)\s+(?:aufgabe|task)\s+(.+)$/i);
  if(taskM){const tasks=store('tasks',[]);tasks.push({id:Date.now(),text:taskM[1],done:false,date:''});save('tasks',tasks);return '✓ Aufgabe erstellt: "'+taskM[1]+'"';}
  const calM=input.match(/^(?:erstelle?|add|neue?)\s+(?:termin|event)\s+(.+)$/i);
  if(calM){const events=store('cal_events',[]);events.push({id:Date.now(),title:calM[1],date:new Date().toISOString().slice(0,10)});save('cal_events',events);return '✓ Termin erstellt: "'+calM[1]+'"';}
  const langM=ql.match(/^(?:sprache|language|lang)\s+(.+)$/);
  if(langM){
    const langMap={deutsch:'de',englisch:'en',english:'en',türkisch:'tr',türkçe:'tr',kurdisch:'ku',kurdi:'ku',arabisch:'ar',persisch:'fa',hebräisch:'he',russisch:'ru',französisch:'fr',spanisch:'es',italienisch:'it',chinesisch:'zh',japanisch:'ja',koreanisch:'ko',portugiesisch:'pt',hindi:'hi'};
    const code=langMap[langM[1].trim()]||langM[1].trim();
    if(I18N[code]){setLanguage(code);return '✓ Sprache: '+LANGNAMES[code];}
    return '❌ Sprache nicht gefunden.';
  }
  if(/wetter|weather/.test(ql)){setTimeout(()=>openApp('W'),300);return '✓ Öffne Wetter…';}
  if(/zeit|uhrzeit|time/.test(ql)){return '🕐 Es ist '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr.';}
  if(/notfall|hilfe|emergency/.test(ql)){setTimeout(()=>openApp('H'),300);return '🚨 Notfall-Modus geöffnet.';}
  if(/aufgaben|tasks/.test(ql)){const t=store('tasks',[]);return '📋 '+t.filter(x=>!x.done).length+' offene Aufgabe(n).';}
  if(/termine|kalender/.test(ql)){const e=store('cal_events',[]);return '📅 '+e.length+' Termin(e).';}
  if(/herz/.test(ql))return '🫀 Das Herz ist ein muskuläres Hohlorgan mit vier Kammern.';
  if(/hallo|hi|hey/.test(ql))return 'Hallo Bruder! 💙 Wie kann ich helfen?';
  return '🤖 Ich habe verstanden: "'+input+'". Versuche: "öffne Browser", "erstelle Aufgabe …", "sprache english".';
}

/* ==================== HELPER: CRUD ==================== */
function makeCRUD(config){
  return function(body){
    body.style.cssText='display:flex;height:100%;';
    const sb=document.createElement('div');sb.className='app-sidebar';
    const ct=document.createElement('div');ct.className='app-content';
    body.appendChild(sb);body.appendChild(ct);
    let items=store('crud_'+config.id,config.initial||[]);
    let selId=items[0]?items[0].id:null;
    const persist=()=>save('crud_'+config.id,items);
    const fields=config.fields;
    let active='select';
    function flash(msg){const d=document.createElement('div');d.style.cssText='color:#06b6d4;font-size:12px;margin-top:8px;';d.textContent=msg;ct.appendChild(d);setTimeout(()=>d.remove(),1800);}
    function render(){
      sb.innerHTML='';
      ['create','edit','select','settings','delete'].forEach(k=>{
        const b=document.createElement('button');
        b.className='side-btn'+(active===k?' active':'');
        b.textContent=T(k);
        b.onclick=()=>{active=k;render();};
        sb.appendChild(b);
      });
      const sp=document.createElement('button');sp.className='side-btn speak-btn';sp.textContent='🔊 '+T('speak');
      sp.onclick=()=>speak((config.title||config.id)+'. '+items.length+' Einträge.');
      sb.appendChild(sp);
      ct.innerHTML='';
      if(active==='create'){
        ct.innerHTML='<h3>'+T('create')+'</h3>';
        const f=document.createElement('form');
        fields.forEach(fd=>{const i=document.createElement('input');i.name=fd.name;i.placeholder=fd.label;f.appendChild(i);});
        const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);
        f.onsubmit=e=>{e.preventDefault();const item={id:Date.now()};fields.forEach(fd=>item[fd.name]=f.querySelector('[name="'+fd.name+'"]').value);items.push(item);persist();f.reset();flash('✓ '+T('save'));};
        ct.appendChild(f);
      }else if(active==='edit'){
        ct.innerHTML='<h3>'+T('edit')+'</h3>';
        if(!items.length){ct.innerHTML+='<p class="muted">'+T('noEntries')+'</p>';return;}
        if(!items.find(i=>i.id===selId))selId=items[0].id;
        const sel=document.createElement('select');
        items.forEach(it=>{const o=document.createElement('option');o.value=it.id;o.textContent=it[fields[0].name]||'#'+it.id;sel.appendChild(o);});
        sel.value=selId;sel.onchange=()=>{selId=Number(sel.value);render();};
        ct.appendChild(sel);
        const item=items.find(i=>i.id===selId);
        const f=document.createElement('form');
        fields.forEach(fd=>{const i=document.createElement('input');i.name=fd.name;i.placeholder=fd.label;i.value=item[fd.name]||'';f.appendChild(i);});
        const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);
        f.onsubmit=e=>{e.preventDefault();fields.forEach(fd=>item[fd.name]=f.querySelector('[name="'+fd.name+'"]').value);persist();flash('✓ '+T('save'));render();};
        ct.appendChild(f);
      }else if(active==='select'){
        ct.innerHTML='<h3>'+T('select')+'</h3>';
        const s=document.createElement('input');s.placeholder='🔍 '+T('search');ct.appendChild(s);
        const list=document.createElement('div');ct.appendChild(list);
        const rl=()=>{
          list.innerHTML='';
          const q=s.value.toLowerCase();
          const filt=items.filter(it=>!q||fields.some(fd=>String(it[fd.name]||'').toLowerCase().includes(q)));
          if(!filt.length){list.innerHTML='<p class="muted">'+T('noEntries')+'</p>';return;}
          filt.forEach(it=>{
            const row=document.createElement('div');row.className='list-row';
            row.innerHTML='<span>'+esc(it[fields[0].name]||'—')+'</span>'+(fields[1]?'<span class="meta">'+esc(it[fields[1].name]||'')+'</span>':'');
            row.onclick=()=>{selId=it.id;active='edit';render();};
            list.appendChild(row);
          });
        };
        s.oninput=rl;rl();
      }else if(active==='settings'){
        ct.innerHTML='<h3>'+T('settings')+'</h3><p>'+T('total')+': <b>'+items.length+'</b></p>';
        const exp=document.createElement('button');exp.textContent='⬇ Export JSON';
        exp.onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=config.id+'.json';a.click();};
        ct.appendChild(exp);
        const w=document.createElement('button');w.className='danger';w.textContent='🗑 Alles löschen';
        w.onclick=()=>{if(confirm(T('confirm'))){items=[];persist();render();}};
        ct.appendChild(w);
      }else if(active==='delete'){
        ct.innerHTML='<h3>'+T('delete')+'</h3>';
        if(!items.length){ct.innerHTML+='<p class="muted">'+T('noEntries')+'</p>';return;}
        items.forEach(it=>{
          const row=document.createElement('div');row.className='list-row';
          row.innerHTML='<span>'+esc(it[fields[0].name]||'—')+'</span>';
          const d=document.createElement('button');d.className='danger';d.textContent='✕';
          d.onclick=()=>{if(confirm(T('confirm'))){items=items.filter(x=>x.id!==it.id);persist();render();}};
          row.appendChild(d);ct.appendChild(row);
        });
      }
    }
    render();
  };
}

const openWindows={};
let zCounter=20;
const nextZ=()=>zCounter++;

function openApp(id){
  const def=REGISTRY.find(a=>a.id===id);if(!def)return;
  const splash=document.getElementById('app-splash');
  if(splash){
    splash.querySelector('.splash-icon').textContent=def.ico;
    splash.querySelector('.splash-name').textContent=def.nm;
    splash.classList.add('show');
    setTimeout(()=>splash.classList.remove('show'),700);
  }
  document.getElementById('start-menu').classList.remove('show');
  if(openWindows[id]){
    const win=document.getElementById('win-'+id);
    if(win){win.classList.remove('minimized');win.style.zIndex=nextZ();}
    return;
  }
  const win=document.createElement('div');
  win.className='window';win.id='win-'+id;
  win.style.width='880px';win.style.height='600px';
  win.style.left=(80+Object.keys(openWindows).length*25)+'px';
  win.style.top=(40+Object.keys(openWindows).length*25)+'px';
  win.style.zIndex=nextZ();
  win.innerHTML=`
    <div class="window-header" onmousedown="startDrag(event,'${id}')">
      <div class="window-title">${def.ico} ${def.nm}</div>
      <div class="window-controls">
        <button class="win-btn" onclick="event.stopPropagation();minimizeApp('${id}')">—</button>
        <button class="win-btn" onclick="event.stopPropagation();maximizeApp('${id}')">▢</button>
        <button class="win-btn close" onclick="event.stopPropagation();closeApp('${id}')">✕</button>
      </div>
    </div>
    <div class="window-body" id="body-${id}"></div>
  `;
  document.body.appendChild(win);
  openWindows[id]=true;
  document.getElementById('taskbar-apps').innerHTML+=`<div class="taskbar-app" id="tb-${id}" onclick="focusApp('${id}')">${def.ico} ${def.nm}</div>`;
  setTimeout(()=>{
    try{def.fn(document.getElementById('body-'+id));}
    catch(e){console.error(e);document.getElementById('body-'+id).innerHTML='<p style="color:#f77;padding:20px">Fehler: '+e.message+'</p>';}
  },60);
}
function closeApp(id){
  const w=document.getElementById('win-'+id);if(w)w.remove();
  const tb=document.getElementById('tb-'+id);if(tb)tb.remove();
  delete openWindows[id];
}
function focusApp(id){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}}
function minimizeApp(id){const w=document.getElementById('win-'+id);if(w)w.classList.toggle('minimized');}
function maximizeApp(id){
  const w=document.getElementById('win-'+id);if(!w)return;
  if(w.dataset.max==='1'){w.style.left=w.dataset.l;w.style.top=w.dataset.t;w.style.width=w.dataset.wd;w.style.height=w.dataset.ht;w.dataset.max='0';}
  else{w.dataset.l=w.style.left;w.dataset.t=w.style.top;w.dataset.wd=w.style.width;w.dataset.ht=w.style.height;w.style.left='0';w.style.top='0';w.style.width='100vw';w.style.height='calc(100vh - 50px)';w.dataset.max='1';}
}
let dragState=null;
function startDrag(e,id){
  if(e.target.closest('.win-btn'))return;
  const w=document.getElementById('win-'+id);if(!w)return;
  dragState={id,sx:e.clientX,sy:e.clientY,wx:w.offsetLeft,wy:w.offsetTop};
  w.style.zIndex=nextZ();
}
addEventListener('mousemove',e=>{
  if(!dragState)return;
  const w=document.getElementById('win-'+dragState.id);
  if(!w||w.dataset.max==='1')return;
  w.style.left=(dragState.wx+e.clientX-dragState.sx)+'px';
  w.style.top=Math.max(0,dragState.wy+e.clientY-dragState.sy)+'px';
});
addEventListener('mouseup',()=>{dragState=null;});

let appOrder = store('appOrder', REGISTRY.map(a=>a.id));
function orderedRegistry(){return appOrder.map(id=>REGISTRY.find(a=>a.id===id)).filter(Boolean);}

function populateStartMenu(){
  const grid=document.getElementById('sm-apps');if(!grid)return;
  grid.innerHTML='';
  orderedRegistry().forEach(a=>{
    const card=document.createElement('div');
    card.className='sm-app-card';card.draggable=true;card.dataset.id=a.id;
    card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';
    card.onclick=()=>openApp(a.id);
    card.ondragstart=e=>{e.dataTransfer.setData('text/plain',a.id);card.classList.add('dragging');};
    card.ondragend=()=>card.classList.remove('dragging');
    card.ondragover=e=>e.preventDefault();
    card.ondrop=e=>{
      e.preventDefault();
      const dragId=e.dataTransfer.getData('text/plain');
      if(dragId===a.id)return;
      const fromIdx=appOrder.indexOf(dragId);
      const toIdx=appOrder.indexOf(a.id);
      appOrder.splice(fromIdx,1);appOrder.splice(toIdx,0,dragId);
      save('appOrder',appOrder);
      populateStartMenu();
    };
    grid.appendChild(card);
  });
}
function filterStartMenu(q){
  const grid=document.getElementById('sm-apps');if(!grid)return;
  const filt=orderedRegistry().filter(a=>a.nm.toLowerCase().includes(q.toLowerCase()));
  grid.innerHTML='';
  filt.forEach(a=>{
    const card=document.createElement('div');card.className='sm-app-card';
    card.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';
    card.onclick=()=>openApp(a.id);
    grid.appendChild(card);
  });
}

function rowHTML(label,sub,ctrlHTML){
  return `<div class="settings-row"><div><div class="lbl">${label}</div><div class="sub">${sub}</div></div><div class="ctrl">${ctrlHTML}</div></div>`;
}
function toggleHTML(id,on){
  return `<span class="toggle ${on?'on':''}" data-toggle="${id}" onclick="toggleSetting('${id}',this)"></span>`;
}
function toggleSetting(id,el){
  const on=el.classList.toggle('on');
  const key='haldo_set_'+id;
  localStorage.setItem(key,on?'1':'0');
  if(id.startsWith('kosmos_')){
    const k=id.replace('kosmos_','');
    cosmosState.config[k]=on;
    applyKosmosConfig();
  }
  if(id==='auto_save'){localStorage.setItem('haldo_autosave',on?'1':'0');}
}
function getToggle(id,def=true){
  const v=localStorage.getItem('haldo_set_'+id);
  if(v===null)return def;
  return v==='1';
}

function renderGeneral(c){
  c.innerHTML='<h3>🔧 Allgemein</h3>';
  c.innerHTML+=rowHTML('Automatisch speichern','Änderungen sofort sichern',toggleHTML('auto_save',getToggle('auto_save',true)));
  c.innerHTML+=rowHTML('Beim Start willkommen heißen','Welcome-Screen anzeigen',toggleHTML('welcome',getToggle('welcome',true)));

function viewAI(body){
  body.style.cssText='display:flex;height:100%;padding:18px;flex-direction:column;';
  const wrap=document.createElement('div');wrap.className='chat-box';
  const log=document.createElement('div');log.className='chat-log';
  const inpRow=document.createElement('div');inpRow.className='chat-input';
  const inp=document.createElement('input');inp.placeholder='Frage oder Befehl…';
  const snd=document.createElement('button');snd.textContent='➤';
  wrap.appendChild(log);inpRow.appendChild(inp);inpRow.appendChild(snd);wrap.appendChild(inpRow);
  body.appendChild(wrap);
  let history=store('ai_classic',[{role:'ai',text:'Hallo! Ich bin HalDo AI. Befehle: "öffne Browser", "erstelle Aufgabe …", "sprache english".'}]);
  const render=()=>{log.innerHTML='';history.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.text;log.appendChild(d);});log.scrollTop=log.scrollHeight;};
  const send=()=>{
    const q=inp.value.trim();if(!q)return;
    history.push({role:'user',text:q});inp.value='';render();
    setTimeout(()=>{
      const reply=processHalDoCommand(q);
      history.push({role:'ai',text:reply});
      if(history.length>40)history=history.slice(-40);
      save('ai_classic',history);render();speak(reply);
    },400);
  };
  snd.onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send();};
  render();
}

function viewCalendar(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';
  const ct=document.createElement('div');ct.className='app-content';
  body.appendChild(sb);body.appendChild(ct);
  let events=store('cal_events',[]);let viewDate=new Date();let active='select';
  const persist=()=>save('cal_events',events);
  function render(){
    sb.innerHTML='';
    [['select','📅 Kalender'],['create','➕ Neu'],['settings','⚙ Einstellungen'],['delete','🗑 Löschen']].forEach(([id,label])=>{
      const b=document.createElement('button');
      b.className='side-btn'+(active===id?' active':'');
      b.textContent=label;b.onclick=()=>{active=id;render();};
      sb.appendChild(b);
    });
    const sp=document.createElement('button');sp.className='side-btn speak-btn';sp.textContent='🔊 '+T('speak');
    sp.onclick=()=>speak('Kalender. '+events.length+' Termine.');
    sb.appendChild(sp);
    ct.innerHTML='';
    if(active==='select'){
      const head=document.createElement('div');head.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px;';
      const prev=document.createElement('button');prev.textContent='◀';
      prev.onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);render();};
      const next=document.createElement('button');next.textContent='▶';
      next.onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);render();};
      const title=document.createElement('h3');title.style.margin='0';title.style.flex='1';
      title.textContent=viewDate.toLocaleString(currentLang,{month:'long',year:'numeric'});
      head.appendChild(prev);head.appendChild(title);head.appendChild(next);
      ct.appendChild(head);
      const grid=document.createElement('div');grid.className='cal-grid';
      ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>{const c=document.createElement('div');c.className='cal-head';c.textContent=d;grid.appendChild(c);});
      const y=viewDate.getFullYear(),m=viewDate.getMonth();
      const startDay=(new Date(y,m,1).getDay()+6)%7;
      const days=new Date(y,m+1,0).getDate();
      const today=new Date();
      for(let i=0;i<startDay;i++)grid.appendChild(document.createElement('div'));
      for(let d=1;d<=days;d++){
        const c=document.createElement('div');c.className='cal-cell';
        const dt=new Date(y,m,d);
        if(dt.toDateString()===today.toDateString())c.classList.add('today');
        c.innerHTML='<div class="day">'+d+'</div>';
        const key=dt.toISOString().slice(0,10);
        events.filter(e=>e.date===key).forEach(e=>{
          const ev=document.createElement('div');
          ev.style.cssText='font-size:10px;background:rgba(6,182,212,.4);color:#fff;padding:1px 3px;margin-top:2px;border-radius:2px;';
          ev.textContent=e.title;c.appendChild(ev);
        });
        c.onclick=()=>{const tit=prompt('Termin am '+d+'.'+(m+1)+'.'+y+':','');if(tit){events.push({id:Date.now(),title:tit,date:key});persist();render();}};
        grid.appendChild(c);
      }
      ct.appendChild(grid);
    }else if(active==='create'){
      ct.innerHTML='<h3>➕ Termin</h3>';
      const f=document.createElement('form');
      const ti=document.createElement('input');ti.placeholder='Titel';f.appendChild(ti);
      const di=document.createElement('input');di.type='date';di.value=new Date().toISOString().slice(0,10);f.appendChild(di);
      const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);
      f.onsubmit=e=>{e.preventDefault();events.push({id:Date.now(),title:ti.value,date:di.value});persist();active='select';render();};
      ct.appendChild(f);
    }else if(active==='settings'){
      ct.innerHTML='<h3>⚙ Einstellungen</h3><p>Termine: <b>'+events.length+'</b></p>';
      const exp=document.createElement('button');exp.textContent='⬇ Export';
      exp.onclick=()=>{const b=new Blob([JSON.stringify(events,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='termine.json';a.click();};
      ct.appendChild(exp);
    }else{
      ct.innerHTML='<h3>🗑 Löschen</h3>';
      events.forEach(ev=>{
        const row=document.createElement('div');row.className='list-row';
        row.innerHTML='<span>'+esc(ev.title)+'</span><span class="meta">'+ev.date+'</span>';
        const d=document.createElement('button');d.className='danger';d.textContent='✕';
        d.onclick=()=>{if(confirm(T('confirm'))){events=events.filter(x=>x.id!==ev.id);persist();render();}};
        row.appendChild(d);ct.appendChild(row);
      });
    }
  }
  render();
}

    renderer.setSize(wrap.clientWidth,wrap.clientHeight);
    renderer.setClearColor(0x001122,1);
    wrap.appendChild(renderer.domElement);
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(45,wrap.clientWidth/wrap.clientHeight,0.1,100);
    camera.position.set(0,1.2,4);camera.lookAt(0,0.7,0);
    scene.add(new THREE.AmbientLight(0xffffff,0.75));
    const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(2,4,3);scene.add(dl);
    const skel=new THREE.Group();const org=new THREE.Group();

    const skull=new THREE.Mesh(new THREE.SphereGeometry(0.22,24,24),boneMat);skull.position.y=1.5;skel.add(skull);
    for(let i=0;i<8;i++){const v=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.09,12),boneMat);v.position.y=1.2-i*0.11;skel.add(v);}
    for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(0.25,0.018,8,22,Math.PI),boneMat);r.position.y=1.1-i*0.1;r.rotation.y=Math.PI/2;skel.add(r);}
    const pelv=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.035,8,20),boneMat);pelv.position.y=0.42;pelv.rotation.x=Math.PI/2;skel.add(pelv);
    const armL=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.75,12),boneMat);armL.position.set(0.38,1,0);skel.add(armL);
    const armR=armL.clone();armR.position.x=-0.38;skel.add(armR);
    const legL=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.05,0.95,12),boneMat);legL.position.set(0.12,0,0);skel.add(legL);
    const legR=legL.clone();legR.position.x=-0.12;skel.add(legR);
    scene.add(skel);
    const brain=new THREE.Mesh(new THREE.SphereGeometry(0.16,20,20),new THREE.MeshStandardMaterial({color:0xff88aa,roughness:0.5}));brain.position.y=1.5;org.add(brain);
    const heart=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,16),new THREE.MeshStandardMaterial({color:0xcc2222,roughness:0.35}));heart.position.set(0.05,1,0.02);org.add(heart);
    const lungL=new THREE.Mesh(new THREE.SphereGeometry(0.13,16,16),new THREE.MeshStandardMaterial({color:0xffaabb,roughness:0.5}));lungL.position.set(0.16,1.05,0);lungL.scale.set(1,1.4,1);org.add(lungL);
    const lungR=lungL.clone();lungR.position.x=-0.16;org.add(lungR);
    const liver=new THREE.Mesh(new THREE.SphereGeometry(0.13,16,16),new THREE.MeshStandardMaterial({color:0x884422,roughness:0.5}));liver.position.set(-0.08,0.75,0);liver.scale.set(1.3,0.7,1);org.add(liver);
    const stomach=new THREE.Mesh(new THREE.SphereGeometry(0.1,16,16),new THREE.MeshStandardMaterial({color:0xddaa66,roughness:0.5}));stomach.position.set(0.08,0.7,0);org.add(stomach);
    scene.add(org);
    const tg=document.createElement('div');tg.className='layer-toggles';
    tg.innerHTML='<label><input type="checkbox" data-layer="sk" checked> Skelett</label><label><input type="checkbox" data-layer="or" checked> Organe</label>';
    tg.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{if(cb.dataset.layer==='sk')skel.visible=cb.checked;if(cb.dataset.layer==='or')org.visible=cb.checked;});
    wrap.appendChild(tg);
    let rot=0;
    function anim(){raf=requestAnimationFrame(anim);rot+=0.006;skel.rotation.y=rot;org.rotation.y=rot;renderer.render(scene,camera);}
    anim();
    const ro=new ResizeObserver(()=>{const w=wrap.clientWidth,h=wrap.clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}});
    ro.observe(wrap);
    cleanup=()=>{cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();};
  }
  render();
}

    sb.innerHTML='';
    [['select','🔐 Tresor'],['create','➕ Eintrag'],['settings','⚙ API'],['delete','🗑 Löschen']].forEach(([id,label])=>{
      const b=document.createElement('button');
      b.className='side-btn'+(active===id?' active':'');
      b.textContent=label;b.onclick=()=>{active=id;render();};
      sb.appendChild(b);
    });
    const sp=document.createElement('button');sp.className='side-btn speak-btn';sp.textContent='🔊 '+T('speak');
    sp.onclick=()=>speak('Sicherheit.');
    sb.appendChild(sp);
    ct.innerHTML='';
    if(active==='select'){
      ct.innerHTML='<h3>🔐 Tresor</h3>';
      if(!items.length){ct.innerHTML+='<p class="muted">'+T('noEntries')+'</p>';return;}
      items.forEach(it=>{
        const row=document.createElement('div');row.className='list-row';
        row.innerHTML='<span>'+esc(it.name)+' – '+esc(it.user)+'</span>';
        const b=document.createElement('button');b.textContent='👁';
        b.onclick=()=>{try{alert('Passwort: '+atob(it.pass));}catch(e){alert('Fehler');}};
        row.appendChild(b);ct.appendChild(row);
      });
    }else if(active==='create'){
      ct.innerHTML='<h3>➕ Neuer Eintrag</h3>';
      const f=document.createElement('form');
      const nm=document.createElement('input');nm.placeholder='Name';f.appendChild(nm);
      const us=document.createElement('input');us.placeholder='Benutzer';f.appendChild(us);
      const pw=document.createElement('input');pw.type='password';pw.placeholder='Passwort';f.appendChild(pw);
      const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);
      f.onsubmit=e=>{e.preventDefault();items.push({id:Date.now(),name:nm.value,user:us.value,pass:btoa(pw.value)});persist();f.reset();render();};
      ct.appendChild(f);
    }else if(active==='settings'){
      ct.innerHTML='<h3>⚙ API & Sicherheit</h3>';
      const key=document.createElement('input');key.placeholder='HalDo API-Key';key.value=localStorage.getItem('haldo_api_key')||'';
      ct.appendChild(key);
      const b=document.createElement('button');b.textContent=T('save');
      b.onclick=()=>{localStorage.setItem('haldo_api_key',key.value);alert('✓ Gespeichert');};
      ct.appendChild(b);
    }else{
      ct.innerHTML='<h3>🗑 Löschen</h3>';
      items.forEach(it=>{
        const row=document.createElement('div');row.className='list-row';
        row.innerHTML='<span>'+esc(it.name)+'</span>';
        const d=document.createElement('button');d.className='danger';d.textContent='✕';
        d.onclick=()=>{if(confirm(T('confirm'))){items=items.filter(x=>x.id!==it.id);persist();render();}};
        row.appendChild(d);ct.appendChild(row);
      });
    }
  }
  render();
}

function viewTasks(body){
  body.style.cssText='display:flex;height:100%;';
  let tasks=store('tasks',[]);
  const persist=()=>save('tasks',tasks);
  const sb=document.createElement('div');sb.className='app-sidebar';
  const ct=document.createElement('div');ct.className='app-content';
  body.appendChild(sb);body.appendChild(ct);
  let active='select';
  function render(){
    sb.innerHTML='';
    [['select','✅ Aufgaben'],['create','➕ Neu'],['settings','⚙ Einstellungen'],['delete','🗑 Löschen']].forEach(([id,label])=>{
      const b=document.createElement('button');
      b.className='side-btn'+(active===id?' active':'');
      b.textContent=label;b.onclick=()=>{active=id;render();};
      sb.appendChild(b);
    });
    const sp=document.createElement('button');sp.className='side-btn speak-btn';sp.textContent='🔊 '+T('speak');
    sp.onclick=()=>speak('Aufgaben. '+tasks.filter(x=>!x.done).length+' offen.');
    sb.appendChild(sp);
    ct.innerHTML='';
    if(active==='select'){
      ct.innerHTML='<h3>✅ Aufgaben ('+tasks.filter(x=>!x.done).length+' offen)</h3>';
      if(!tasks.length){ct.innerHTML+='<p class="muted">'+T('noEntries')+'</p>';return;}
      tasks.forEach(tk=>{
        const row=document.createElement('div');row.className='list-row';
        const cb=document.createElement('input');cb.type='checkbox';cb.checked=tk.done;cb.style.width='auto';cb.style.margin='0';
        cb.onchange=()=>{tk.done=cb.checked;persist();render();};
        const span=document.createElement('span');span.textContent=tk.text;if(tk.done)span.style.textDecoration='line-through';
        row.appendChild(cb);row.appendChild(span);
        if(tk.date){const meta=document.createElement('span');meta.className='meta';meta.textContent=tk.date;row.appendChild(meta);}
        ct.appendChild(row);
      });
    }else if(active==='create'){
      ct.innerHTML='<h3>➕ Neue Aufgabe</h3>';
      const f=document.createElement('form');
      const i=document.createElement('input');i.placeholder='Aufgabe';f.appendChild(i);
      const d=document.createElement('input');d.type='date';f.appendChild(d);
      const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);
      f.onsubmit=e=>{e.preventDefault();tasks.push({id:Date.now(),text:i.value,date:d.value,done:false});persist();i.value='';render();};
      ct.appendChild(f);
    }else if(active==='settings'){
      ct.innerHTML='<h3>⚙ Einstellungen</h3><p>Gesamt: '+tasks.length+', Offen: '+tasks.filter(x=>!x.done).length+'</p>';
    }else{
      ct.innerHTML='<h3>🗑 Löschen</h3>';
      tasks.forEach(tk=>{
        const row=document.createElement('div');row.className='list-row';
        row.innerHTML='<span>'+esc(tk.text)+'</span>';
        const d=document.createElement('button');d.className='danger';d.textContent='✕';
        d.onclick=()=>{if(confirm(T('confirm'))){tasks=tasks.filter(x=>x.id!==tk.id);persist();render();}};
        row.appendChild(d);ct.appendChild(row);
      });
    }
  }
  render();
}

function viewUpdates(body){
  body.style.cssText='padding:18px;';
  body.innerHTML='<h3>🔄 Updates</h3><p class="muted">System aktuell</p><div style="font-size:24px;font-weight:bold;color:#10b981;margin:20px 0">v1.0.0</div><button onclick="alert(\'System ist aktuell.\')">Nach Updates suchen</button>';
}

function viewVideo(body){
  body.style.cssText='padding:18px;';
  body.innerHTML='<h3>🎬 Video Studio</h3><p class="muted">Importiere ein Video:</p>';
  const inp=document.createElement('input');inp.type='file';inp.accept='video/*';
  const vids=store('videos',[]);
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      vids.push({id:Date.now(),name:f.name,url:r.result});
      save('videos',vids);
      const v=document.createElement('video');v.controls=true;v.src=r.result;v.style.cssText='width:100%;margin-top:12px;border-radius:8px;';
      body.appendChild(v);
    };
    r.readAsDataURL(f);
  };
  body.appendChild(inp);
}

function viewWeather(body){
  body.style.cssText='padding:18px;';
  body.innerHTML='<h3>🌤️ Wetter</h3>';
  const out=document.createElement('div');out.style.cssText='font-size:18px;margin:20px 0;';
  body.appendChild(out);
  const btn=document.createElement('button');btn.textContent='📍 Standort';
  btn.onclick=()=>{
    if(!navigator.geolocation){out.textContent='GPS fehlt';return;}
    out.textContent='Lade…';
    navigator.geolocation.getCurrentPosition(async p=>{
      try{
        const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&current=temperature_2m,weather_code');
        const j=await r.json();
        out.innerHTML='<div style="font-size:48px;font-weight:800;color:#06b6d4">'+j.current.temperature_2m+'°C</div>';
        speak('Aktuelle Temperatur: '+Math.round(j.current.temperature_2m)+' Grad.');
      }catch(e){out.textContent='Fehler.';}
    },()=>{out.textContent='GPS verweigert.';});
  };
  body.appendChild(btn);
}

function viewExperience(body){
  body.style.cssText='padding:18px;';
  body.innerHTML='<h3>🎨 Themes</h3>';
  ['#06b6d4','#ff66dd','#88ff88','#ffcc44','#ff6666','#aa88ff'].forEach(c=>{
    const b=document.createElement('button');b.textContent=c;b.style.cssText='background:'+c+';color:#000;margin:4px;font-weight:700;';
    b.onclick=()=>{document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent2',c);localStorage.setItem('haldo_theme',c);};

  });
}

/* ==================== BOOT ==================== */
function enterApp(){
  document.getElementById('welcome').classList.add('hide');
  document.getElementById('taskbar').classList.add('show');
  populateStartMenu();
  renderSettingsPanel();
  const hint=document.getElementById('click-hint');
  if(hint)setTimeout(()=>{hint.style.opacity='0';},8000);
}
function startClock(){
  const c=document.getElementById('sys-clock');
  const tick=()=>c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  tick();setInterval(tick,1000);
}
document.addEventListener('DOMContentLoaded',()=>{
  initCosmos();
  startClock();
  populateStartMenu();
  renderSettingsPanel();
  const savedTheme=localStorage.getItem('haldo_theme');
  if(savedTheme){document.documentElement.style.setProperty('--accent',savedTheme);document.documentElement.style.setProperty('--accent2',savedTheme);}
  const savedFont=localStorage.getItem('haldo_font_size');
  if(savedFont)document.documentElement.style.setProperty('--font-size',savedFont+'px');
});
</script>
