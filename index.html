<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS – v131</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#00e5ff;--primary-rgb:0,229,255;--secondary:#4da8ff;--accent:#b478ff;
  --gold:#ffd700;--gold-rgb:255,215,0;--bg-0:#01010a;--panel:rgba(8,15,35,0.72);
  --border:rgba(0,229,255,0.38);--border-strong:rgba(0,229,255,0.75);
  --text:#e8f6ff;--text-dim:#7fa5d0;
  --glow-sm:0 0 14px rgba(0,229,255,0.5);--glow-md:0 0 28px rgba(0,229,255,0.55);
  --blur:26px;--radius-w:18px;--radius-b:14px;--topbar-h:58px;
  --font-base:13px;--anim-speed:1;
  --safe-top:max(env(safe-area-inset-top, 0px), 24px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --safe-left:env(safe-area-inset-left, 0px);--safe-right:env(safe-area-inset-right, 0px);
}
[data-theme="cyborg"]{--primary:#ff78c8;--primary-rgb:255,120,200;--secondary:#b478ff;--accent:#ff78c8;--border:rgba(255,120,200,.42);--border-strong:rgba(255,120,200,.8);--glow-sm:0 0 14px rgba(255,120,200,.55);--glow-md:0 0 28px rgba(255,120,200,.6)}
[data-theme="gold"]{--primary:#ffd700;--primary-rgb:255,215,0;--secondary:#ffb300;--accent:#ff9500;--border:rgba(255,215,0,.42);--border-strong:rgba(255,215,0,.8);--glow-sm:0 0 14px rgba(255,215,0,.55);--glow-md:0 0 28px rgba(255,215,0,.6)}
[data-theme="matrix"]{--primary:#00ff88;--primary-rgb:0,255,136;--secondary:#00cc66;--accent:#00ffaa;--border:rgba(0,255,136,.42);--border-strong:rgba(0,255,136,.8);--glow-sm:0 0 14px rgba(0,255,136,.55);--glow-md:0 0 28px rgba(0,255,136,.6)}
[data-theme="crimson"]{--primary:#ff3355;--primary-rgb:255,51,85;--secondary:#ff6644;--accent:#ff0055;--border:rgba(255,51,85,.42);--border-strong:rgba(255,51,85,.8);--glow-sm:0 0 14px rgba(255,51,85,.55);--glow-md:0 0 28px rgba(255,51,85,.6)}
[data-theme="sunset"]{--primary:#ff9900;--primary-rgb:255,153,0;--secondary:#ff5599;--accent:#ffcc00;--border:rgba(255,153,0,.42);--border-strong:rgba(255,153,0,.8);--glow-sm:0 0 14px rgba(255,153,0,.55);--glow-md:0 0 28px rgba(255,153,0,.6)}
[data-theme="ice"]{--primary:#aee0ff;--primary-rgb:174,224,255;--secondary:#e6f7ff;--accent:#cceeff;--border:rgba(174,224,255,.45);--border-strong:rgba(174,224,255,.85);--glow-sm:0 0 14px rgba(174,224,255,.55);--glow-md:0 0 28px rgba(174,224,255,.6);--text:#f4fbff}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;color:var(--text);user-select:none;-webkit-font-smoothing:antialiased;position:fixed;inset:0;letter-spacing:.15px;font-size:var(--font-base)}
#cosmosBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}

#loader{position:fixed;inset:0;z-index:10000;background:radial-gradient(circle at center,#050520,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#loader .spin{width:60px;height:60px;border:3px solid rgba(0,229,255,.2);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:var(--primary);font-weight:600;letter-spacing:2px;font-size:12px}

#welcome{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 24px;text-align:center;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .6s}
#welcome.hide{opacity:0;pointer-events:none}
#welcome .globe{font-size:90px;filter:drop-shadow(0 0 40px var(--primary));animation:globeFloat 4s ease-in-out infinite}
@keyframes globeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
#welcome h1{font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent),var(--primary));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
#welcome h2{font-size:clamp(14px,2vw,18px);color:var(--text);font-weight:400;line-height:1.6;max-width:600px;opacity:.9}
#welcome .presented{font-size:11px;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase}
#welcome .presented b{color:var(--gold);font-weight:700}
#welcome .enter-btn{margin-top:16px;padding:16px 48px;border-radius:32px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer;border:none;box-shadow:0 8px 30px rgba(var(--primary-rgb),.6);transition:all .25s}
#welcome .enter-btn:hover{transform:scale(1.05);box-shadow:0 12px 40px rgba(var(--primary-rgb),.8)}

#appSplash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:radial-gradient(circle at center,rgba(0,229,255,.18) 0%,rgba(5,8,16,.96) 70%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#appSplash.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.splash-ic{font-size:110px;filter:drop-shadow(0 0 40px var(--primary));animation:splashSpin 1.2s ease-out}
@keyframes splashSpin{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.15) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
.splash-nm{font-size:28px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),#ffaa00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.splash-pr{font-size:10px;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase}
.splash-pr b{color:var(--gold)}
.splash-greet{font-size:12px;color:var(--text);text-align:center;max-width:80vw;line-height:1.6;margin-top:8px;opacity:.85}

#topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--topbar-h) + var(--safe-top));padding:var(--safe-top) calc(16px + var(--safe-right)) 0 calc(16px + var(--safe-left));z-index:1000;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(8,15,35,0.92),rgba(8,15,35,0.62));backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border-bottom:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.45);box-sizing:border-box}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;transition:all .25s}
.brand:active{transform:scale(.96)}
.brand-logo{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0%,transparent 40%),radial-gradient(circle at 70% 70%,var(--accent),var(--primary) 45%,var(--secondary) 75%,#002040);box-shadow:0 0 18px rgba(var(--primary-rgb),.7),inset -4px -4px 12px rgba(0,0,0,.5),inset 4px 4px 12px rgba(255,255,255,.2);animation:spinGlobe 20s linear infinite}
@keyframes spinGlobe{to{transform:rotate(360deg)}}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:8px;color:var(--text-dim);letter-spacing:2.5px;margin-top:-1px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:7px}
.tb-btn{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(var(--primary-rgb),.08),rgba(var(--primary-rgb),.02));border:1.5px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tb-btn:hover{background:rgba(var(--primary-rgb),.15);box-shadow:var(--glow-sm)}
.tb-btn:active{transform:scale(.92)}
.tb-clock{font-family:"SF Mono",ui-monospace,monospace;font-size:12px;color:var(--primary);padding:0 10px;font-weight:700;letter-spacing:.8px;text-shadow:0 0 8px rgba(var(--primary-rgb),.7);background:rgba(var(--primary-rgb),.08);border-radius:8px;height:30px;display:flex;align-items:center;border:1px solid var(--border)}

#sidebar{position:fixed;top:calc(var(--topbar-h) + var(--safe-top));left:0;bottom:0;width:220px;padding:12px 10px calc(12px + var(--safe-bottom)) 10px;z-index:900;background:linear-gradient(180deg,rgba(8,15,35,0.92),rgba(8,15,35,0.75));backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border-right:1.5px solid var(--border);overflow-y:auto;overflow-x:hidden;transition:transform .35s cubic-bezier(.4,.14,.3,1);scrollbar-width:thin;scrollbar-color:var(--primary) transparent;box-sizing:border-box}
#sidebar.collapsed{transform:translateX(-100%)}
.side-section{margin-bottom:14px}
.side-label{font-size:9px;color:var(--text-dim);letter-spacing:2.5px;text-transform:uppercase;padding:6px 10px;font-weight:800;opacity:.7}
.side-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;margin:2px 0;border-radius:11px;background:transparent;border:1px solid transparent;color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .2s;text-align:left;min-height:42px}
.side-btn:hover{background:rgba(var(--primary-rgb),.12);border-color:var(--border);box-shadow:var(--glow-sm)}
.side-btn:active{transform:scale(.97)}
.side-btn .ico{font-size:16px;width:22px;text-align:center}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}

#desktop{position:fixed;top:calc(var(--topbar-h) + var(--safe-top));left:220px;right:0;bottom:var(--safe-bottom);z-index:1;overflow:hidden;transition:left .35s cubic-bezier(.4,.14,.3,1)}
#desktop.full{left:0}

.window{position:absolute;min-width:300px;min-height:220px;background:linear-gradient(135deg,rgba(8,15,35,0.82),rgba(8,15,35,0.68));backdrop-filter:blur(var(--blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--blur)) saturate(180%);border:1.5px solid var(--border);border-radius:var(--radius-w);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(var(--primary-rgb),.15);display:flex;flex-direction:column;z-index:200;overflow:hidden;animation:winOpen calc(.3s / var(--anim-speed)) cubic-bezier(.4,.14,.3,1);will-change:transform}
.window.active{border-color:var(--border-strong);box-shadow:0 20px 70px rgba(0,0,0,.7),0 0 50px rgba(var(--primary-rgb),.35);z-index:250}
@keyframes winOpen{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.win-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:grab;user-select:none;background:linear-gradient(90deg,rgba(var(--primary-rgb),.14),rgba(var(--primary-rgb),.02));border-bottom:1.5px solid var(--border);min-height:48px;flex-shrink:0}
.win-header.dragging{cursor:grabbing}
.win-title{font-size:13px;font-weight:700;flex:1;padding-left:4px;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-controls{display:flex;gap:6px;flex-shrink:0}
.win-ctrl{width:36px;height:36px;min-width:36px;min-height:36px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-weight:600;position:relative;z-index:999999}
.win-ctrl:hover{background:rgba(var(--primary-rgb),.25);box-shadow:var(--glow-sm)}
.win-ctrl.close:hover{background:rgba(255,60,80,.75);border-color:rgba(255,60,80,.9)}
.win-body{flex:1;padding:16px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--primary) transparent;font-size:var(--font-base);line-height:1.55}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}

.btn{min-height:42px;padding:10px 18px;border-radius:var(--radius-b);background:linear-gradient(135deg,rgba(var(--primary-rgb),.2),rgba(var(--primary-rgb),.05));border:1.5px solid var(--border);color:var(--text);font-size:var(--font-base);font-weight:600;cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:rgba(var(--primary-rgb),.3);box-shadow:var(--glow-sm);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;border-color:transparent;box-shadow:0 4px 14px rgba(var(--primary-rgb),.4)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffaa00);color:#000;border-color:transparent;box-shadow:0 4px 14px rgba(var(--gold-rgb),.4)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.input,textarea,select{width:100%;min-height:42px;padding:10px 14px;border-radius:var(--radius-b);background:rgba(0,0,0,.35);border:1.5px solid var(--border);color:var(--text);font-size:var(--font-base);font-family:inherit;transition:all .25s;outline:none}
.input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 20px rgba(var(--primary-rgb),.35)}
textarea{min-height:100px;resize:vertical;font-family:inherit}
.toggle{position:relative;display:inline-block;width:48px;height:27px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;border-radius:14px;background:rgba(0,0,0,.55);border:1.5px solid var(--border);cursor:pointer;transition:.3s}
.toggle .slider::before{content:"";position:absolute;height:19px;width:19px;left:2px;top:2px;background:linear-gradient(135deg,#888,#aaa);border-radius:50%;transition:.3s}
.toggle input:checked + .slider{background:rgba(var(--primary-rgb),.45);border-color:var(--primary);box-shadow:0 0 18px rgba(var(--primary-rgb),.5)}
.toggle input:checked + .slider::before{transform:translateX(21px);background:linear-gradient(135deg,var(--primary),#fff);box-shadow:0 0 12px var(--primary)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 14px;border-radius:18px;background:rgba(255,255,255,.05);border:1.5px solid var(--border);color:var(--text);font-size:11px;font-weight:600;cursor:pointer;transition:all .25s}
.chip:hover,.chip.on{background:rgba(var(--primary-rgb),.28);border-color:var(--primary);box-shadow:var(--glow-sm)}
.set-section{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(0,0,0,.25)}
.set-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;user-select:none;background:rgba(var(--primary-rgb),.04)}
.set-head:hover{background:rgba(var(--primary-rgb),.1)}
.set-head .letter{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;font-weight:900;font-size:13px;flex-shrink:0}
.set-head .title{flex:1;font-size:13px;font-weight:700}
.set-head .chev{transition:transform .3s;color:var(--primary);font-size:11px}
.set-section.open .chev{transform:rotate(180deg)}
.set-body{display:none;padding:10px 15px 15px}
.set-section.open .set-body{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);min-height:46px}
.set-row:last-child{border-bottom:none}
.set-row-label{flex:1;font-size:12px}
.slider-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.slider-row label{flex:1;font-size:12px}
.slider-row input[type=range]{flex:1;accent-color:var(--primary);height:24px}
.slider-row .val{min-width:44px;text-align:right;color:var(--primary);font-weight:700;font-size:11px}

#toasts{position:fixed;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:5000;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;max-width:min(90vw,400px)}
.toast{background:linear-gradient(135deg,rgba(8,15,35,0.92),rgba(8,15,35,0.8));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1.5px solid var(--primary);border-radius:14px;padding:12px 18px;box-shadow:var(--glow-md),0 8px 30px rgba(0,0,0,.5);font-size:12px;font-weight:600;color:var(--text);animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:10px}
@keyframes toastIn{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{transform:translateY(-24px) scale(.9);opacity:0}}

#avatarFab{position:fixed;bottom:calc(20px + var(--safe-bottom));right:calc(20px + var(--safe-right));z-index:800;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle,var(--primary) 0%,var(--secondary) 55%,var(--accent) 100%);border:2px solid var(--border-strong);box-shadow:0 0 28px rgba(var(--primary-rgb),.65),0 0 55px rgba(var(--primary-rgb),.35);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;transition:all .3s;animation:breathe 3.5s ease-in-out infinite}
#avatarFab:hover{transform:scale(1.08)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#avatarFab::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--border-strong);animation:pulseRing 2.5s ease-out infinite}
@keyframes pulseRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}

.chat-container{display:flex;flex-direction:column;height:100%;min-height:320px}
.chat-messages{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin}
.chat-msg{padding:10px 14px;border-radius:16px;max-width:85%;font-size:var(--font-base);line-height:1.5;animation:msgIn .3s;word-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#001;border-bottom-right-radius:6px;font-weight:500}
.chat-msg.ai{align-self:flex-start;background:rgba(var(--primary-rgb),.15);border:1px solid var(--border);border-bottom-left-radius:6px}
.chat-input-row{display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-row input{flex:1}
.chat-input-row .btn{min-width:46px;padding:10px 13px}

.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:11px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);cursor:pointer;transition:all .3s;text-align:center}
.app-tile:hover{background:rgba(var(--primary-rgb),.18);box-shadow:var(--glow-sm);transform:translateY(-3px)}
.app-tile .ic{font-size:28px}
.app-tile .nm{font-size:10px;line-height:1.25;word-break:break-word;font-weight:500}

.hidden{display:none!important}
.win-body h3{color:var(--primary);font-size:14px;margin-bottom:11px;margin-top:14px;font-weight:700}
.win-body h3:first-child{margin-top:0}
.win-body p{margin-bottom:9px;color:var(--text-dim);font-size:12px;line-height:1.65}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:7px;border:1px solid var(--border)}
.list-item .txt{flex:1;font-size:12px}

@media(max-width:640px){
  :root{--topbar-h:54px;--font-base:12.5px}
  #sidebar{width:200px}
  #desktop{left:0}
  .window{min-width:260px;max-width:calc(100vw - 20px)}
  #avatarFab{width:60px;height:60px;font-size:26px;bottom:calc(16px + var(--safe-bottom));right:calc(16px + var(--safe-right))}
  .brand-name{font-size:13px}
  .tb-clock{font-size:11px;padding:0 8px;height:28px}
  .tb-btn{width:36px;height:36px;font-size:15px}
  #welcome .globe{font-size:70px}
  .splash-ic{font-size:80px}
  .splash-nm{font-size:22px}
}
</style>
</head>
<body data-theme="holo">

<script>
'use strict';
const HalDo = window.HalDo = {};
HalDo.version = 'v131 Realistic Cosmos + 44 Apps';

HalDo.Sound = (() => {
  let ctx;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; };
  const beep = (f,d,t='sine',v=.15) => { try { const c=ensure(); const o=c.createOscillator(),g=c.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d); } catch(e){} };
  const S = {
    click:()=>beep(880,.05,'sine',.08),
    success:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*70)),
    error:()=>{beep(220,.2,'sawtooth',.15);setTimeout(()=>beep(165,.25,'sawtooth',.15),150)},
    message:()=>{beep(1000,.08);setTimeout(()=>beep(1300,.12),90)},
    alarm:()=>{for(let i=0;i<3;i++){setTimeout(()=>beep(1200,.15,'square',.2),i*200);setTimeout(()=>beep(900,.15,'square',.2),i*200+100)}}
  };
  return { play:(n)=>{try{(S[n]||S.click)()}catch(e){}} };
})();

HalDo.Toast = (() => {
  const c = document.getElementById('toasts');
  return {
    show(msg, o={}) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span style="font-size:18px">${o.icon||'✨'}</span><span>${msg}</span>`;
      c.appendChild(t);
      if (o.sound) HalDo.Sound.play(o.sound);
      setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(),350); }, o.duration||3000);
    }
  };
})();

/* ═══════════════════════════════════════════════════
   THREE.JS 3D KOSMOS – FOTOREALISTISCHE ERDE (GRÖSSER)
   ═══════════════════════════════════════════════════ */
HalDo.Cosmos = (() => {
  let scene, camera, renderer, sunMesh, sunCorona, sunCorona2, sunCorona3;
  let planets = [], starsSmall, starsBig, clock;
  let earthMesh, earthClouds, earthAtmo, earthNight;
  let jupiterMoons = [];
  let targetMouseX = 0, targetMouseY = 0, mouseX = 0, mouseY = 0;
  let loadedTextures = 0, totalTextures = 6;

  const TEX_URLS = {
    earthDay: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
    earthNight: 'https://unpkg.com/three-globe/example/img/earth-night.jpg',
    earthTopology: 'https://unpkg.com/three-globe/example/img/earth-topology.png',
    earthWater: 'https://unpkg.com/three-globe/example/img/earth-water.png',
    earthClouds: 'https://unpkg.com/three-globe/example/img/clouds.png',
    moon: 'https://unpkg.com/three-globe/example/img/moon.jpg'
  };
  const textures = {};
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';

  const makeProcedural = (color, color2, type='bands') => {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = color; ctx.fillRect(0,0,256,128);
    if (type === 'bands') {
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = i % 2 === 0 ? color : color2;
        ctx.globalAlpha = 0.5 + Math.random()*0.3;
        ctx.fillRect(0, i * 128/12, 256, 128/12);
      }
      ctx.globalAlpha = 1;
      if (color === '#d4a373') {
        ctx.fillStyle = 'rgba(200,80,50,0.85)';
        ctx.beginPath();
        ctx.ellipse(180, 80, 22, 13, 0, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (type === 'crater') {
      for (let i = 0; i < 40; i++) {
        ctx.fillStyle = `rgba(0,0,0,${0.15 + Math.random()*0.3})`;
        ctx.beginPath();
        ctx.arc(Math.random()*256, Math.random()*128, Math.random()*8 + 2, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (type === 'cloud') {
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.random()*0.2})`;
        ctx.beginPath();
        ctx.ellipse(Math.random()*256, Math.random()*128, Math.random()*30+10, Math.random()*10+3, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (type === 'sun') {
      const g = ctx.createRadialGradient(128,64,0,128,64,128);
      g.addColorStop(0,'#fff5a0'); g.addColorStop(0.4,'#ffcc00');
      g.addColorStop(0.7,'#ff9900'); g.addColorStop(1,'#ff4400');
      ctx.fillStyle = g; ctx.fillRect(0,0,256,128);
      for (let i = 0; i < 250; i++) {
        ctx.fillStyle = Math.random()>0.5 ? 'rgba(255,255,220,0.5)' : 'rgba(200,50,0,0.35)';
        ctx.beginPath();
        ctx.arc(Math.random()*256, Math.random()*128, Math.random()*4, 0, Math.PI*2);
        ctx.fill();
      }
    }
    return new THREE.CanvasTexture(canvas);
  };

  const loadTex = (key, url) => {
    loader.load(url, tex => {
      textures[key] = tex;
      loadedTextures++;
      if (loadedTextures === totalTextures) hideLoader();
    }, undefined, () => { loadedTextures++; if (loadedTextures === totalTextures) hideLoader(); });
  };

  const hideLoader = () => {
    setTimeout(() => {
      const l = document.getElementById('loader');
      if (l) { l.classList.add('hide'); setTimeout(() => l.remove(), 600); }
    }, 500);
  };

  const createStars = (count, size, opacity) => {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 400 + Math.random() * 700;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i*3+2] = r * Math.cos(phi);
      const c = Math.random();
      if (c < 0.65) { colors[i*3]=1; colors[i*3+1]=1; colors[i*3+2]=1; }
      else if (c < 0.82) { colors[i*3]=0.65; colors[i*3+1]=0.82; colors[i*3+2]=1; }
      else if (c < 0.94) { colors[i*3]=1; colors[i*3+1]=0.9; colors[i*3+2]=0.55; }
      else { colors[i*3]=1; colors[i*3+1]=0.65; colors[i*3+2]=0.65; }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size, vertexColors: true, transparent: true, opacity,
      sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    return new THREE.Points(geo, mat);
  };

  const init = () => {
    const canvas = document.getElementById('cosmosBg');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000208);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0, 10, 42);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    clock = new THREE.Clock();

    loadTex('earthDay', TEX_URLS.earthDay);
    loadTex('earthNight', TEX_URLS.earthNight);
    loadTex('earthTopology', TEX_URLS.earthTopology);
    loadTex('earthWater', TEX_URLS.earthWater);
    loadTex('earthClouds', TEX_URLS.earthClouds);
    loadTex('moon', TEX_URLS.moon);

    setTimeout(hideLoader, 6000);

    starsSmall = createStars(5000, 1.0, 0.75);
    scene.add(starsSmall);
    starsBig = createStars(900, 2.4, 0.95);
    scene.add(starsBig);

    const sunGeo = new THREE.SphereGeometry(4, 64, 64);
    const sunTex = makeProcedural('#ffcc00', '#ff4400', 'sun');
    sunMesh = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ map: sunTex }));
    scene.add(sunMesh);

    scene.add(new THREE.PointLight(0xfff5d0, 3.5, 0, 1));
    scene.add(new THREE.AmbientLight(0x505070, 0.45));

    const makeGlow = (size, color1, color2) => {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const cx = c.getContext('2d');
      const g = cx.createRadialGradient(256,256,20,256,256,256);
      g.addColorStop(0, color1); g.addColorStop(0.5, color2); g.addColorStop(1, 'rgba(255,60,0,0)');
      cx.fillStyle = g; cx.fillRect(0,0,512,512);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(c),
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
      }));
      sprite.scale.set(size, size, 1);
      return sprite;
    };
    sunCorona = makeGlow(28, 'rgba(255,240,150,0.95)', 'rgba(255,180,60,0.5)');
    sunCorona2 = makeGlow(45, 'rgba(255,200,100,0.5)', 'rgba(255,120,30,0.2)');
    sunCorona3 = makeGlow(75, 'rgba(255,150,60,0.2)', 'rgba(255,60,0,0.05)');
    scene.add(sunCorona);
    scene.add(sunCorona2);
    scene.add(sunCorona3);

    const planetDefs = [
      { name:'Merkur',  color:'#8a7d6b', color2:'#5a4f42', size:1.2, dist:11, speed:0.7,  type:'crater' },
      { name:'Venus',   color:'#e8c88a', color2:'#a88040', size:1.7, dist:15, speed:0.55, type:'cloud' },
      { name:'Erde',    color:'#4da8ff', color2:'#1a5599', size:4.5, dist:26, speed:0.42, type:'earth' },
      { name:'Mars',    color:'#c1440e', color2:'#8a2f0a', size:1.4, dist:34, speed:0.35, type:'crater' },
      { name:'Jupiter', color:'#d4a373', color2:'#a08050', size:4.2, dist:44, speed:0.25, type:'bands' },
      { name:'Saturn',  color:'#e8d5a0', color2:'#a07840', size:3.7, dist:55, speed:0.20, type:'bands', ring:true },
      { name:'Uranus',  color:'#7de0e0', color2:'#3a8080', size:2.4, dist:64, speed:0.15, type:'bands' },
      { name:'Neptun',  color:'#3355ee', color2:'#0a1a6a', size:2.2, dist:72, speed:0.12, type:'bands' },
      { name:'Pluto',   color:'#b08860', color2:'#5a4020', size:0.9, dist:80, speed:0.09, type:'crater' },
      { name:'Xena',    color:'#8866aa', color2:'#4a2a6a', size:1.0, dist:88, speed:0.07, type:'crater' },
      { name:'Sedna',   color:'#9977cc', color2:'#4a3a7a', size:1.05, dist:96, speed:0.05, type:'crater' },
      { name:'Eris',    color:'#aaccff', color2:'#5070a0', size:1.1, dist:104, speed:0.04, type:'crater' }
    ];

    planets = [];
    planetDefs.forEach((def) => {
      const geo = new THREE.SphereGeometry(def.size, 64, 64);
      let mat;

      if (def.name === 'Erde') {
        mat = new THREE.MeshPhongMaterial({
          color: 0xffffff,
          shininess: 15,
          specular: new THREE.Color(0x333333)
        });
        earthMesh = new THREE.Mesh(geo, mat);
        earthMesh.position.set(def.dist, 0, 0);
        scene.add(earthMesh);

        const applyEarthTextures = () => {
          if (textures.earthDay) {
            mat.map = textures.earthDay;
            mat.needsUpdate = true;
          }
          if (textures.earthTopology) {
            mat.bumpMap = textures.earthTopology;
            mat.bumpScale = 0.08;
            mat.needsUpdate = true;
          }
          if (textures.earthWater) {
            mat.specularMap = textures.earthWater;
            mat.specular = new THREE.Color(0x556677);
            mat.needsUpdate = true;
          }
          if (textures.earthDay && textures.earthNight && !earthNight) {
            const nightGeo = new THREE.SphereGeometry(def.size * 1.002, 64, 64);
            const nightMat = new THREE.MeshBasicMaterial({
              map: textures.earthNight,
              blending: THREE.AdditiveBlending,
              transparent: true,
              opacity: 0.85,
              depthWrite: false
            });
            earthNight = new THREE.Mesh(nightGeo, nightMat);
            earthMesh.add(earthNight);
          }
        };
        setTimeout(applyEarthTextures, 1500);
        setTimeout(applyEarthTextures, 3000);
        setTimeout(applyEarthTextures, 5000);

        const cloudsGeo = new THREE.SphereGeometry(def.size * 1.015, 64, 64);
        const cloudsMat = new THREE.MeshPhongMaterial({
          transparent: true,
          opacity: 0.75,
          depthWrite: false
        });
        earthClouds = new THREE.Mesh(cloudsGeo, cloudsMat);
        earthMesh.add(earthClouds);
        setTimeout(() => {
          if (textures.earthClouds) {
            cloudsMat.map = textures.earthClouds;
            cloudsMat.alphaMap = textures.earthClouds;
            cloudsMat.needsUpdate = true;
          }
        }, 2500);
        setTimeout(() => {
          if (textures.earthClouds && !cloudsMat.map) {
            cloudsMat.map = textures.earthClouds;
            cloudsMat.alphaMap = textures.earthClouds;
            cloudsMat.needsUpdate = true;
          }
        }, 5000);

        const atmoGeo = new THREE.SphereGeometry(def.size * 1.15, 64, 64);
        const atmoMat = new THREE.ShaderMaterial({
          vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
              vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
              vNormal = normalize(normalMatrix * normal);
              vViewPosition = -mvPosition.xyz;
              gl_Position = projectionMatrix * mvPosition;
            }`,
          fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
              vec3 viewDir = normalize(vViewPosition);
              float fresnel = pow(1.0 - abs(dot(vNormal, viewDir)), 3.0);
              gl_FragColor = vec4(0.35, 0.65, 1.0, fresnel * 0.95);
            }`,
          blending: THREE.AdditiveBlending,
          side: THREE.BackSide,
          transparent: true,
          depthWrite: false
        });
        earthAtmo = new THREE.Mesh(atmoGeo, atmoMat);
        earthMesh.add(earthAtmo);

        const moonGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const moonMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, shininess: 2 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.userData = { orbitRadius: def.size + 5.5, angle: 0, speed: 0.03 };
        scene.add(moonMesh);
        earthMesh.userData.moon = moonMesh;
        setTimeout(() => {
          if (textures.moon) { moonMat.map = textures.moon; moonMat.needsUpdate = true; }
        }, 2000);

        planets.push({ mesh: earthMesh, dist: def.dist, speed: def.speed, angle: Math.random() * Math.PI * 2 });
        return;
      }

      const tex = makeProcedural(def.color, def.color2, def.type);
      mat = new THREE.MeshPhongMaterial({
        map: tex,
        shininess: def.type === 'bands' ? 3 : 1,
        emissive: new THREE.Color(def.color2),
        emissiveIntensity: 0.12
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(def.dist, 0, 0);
      scene.add(mesh);

      if (def.ring) {
        const ringGeo = new THREE.RingGeometry(def.size * 1.4, def.size * 2.4, 64);
        const ringCanvas = document.createElement('canvas');
        ringCanvas.width = 256; ringCanvas.height = 32;
        const rc = ringCanvas.getContext('2d');
        for (let x = 0; x < 256; x++) {
          const alpha = (Math.sin(x * 0.3) * 0.4 + 0.5) * (1 - Math.abs(x-128)/128 * 0.3);
          const c = x % 3 === 0 ? '180,150,100' : '232,213,160';
          rc.fillStyle = `rgba(${c},${alpha})`;
          rc.fillRect(x, 0, 1, 32);
        }
        const ringMat = new THREE.MeshBasicMaterial({
          map: new THREE.CanvasTexture(ringCanvas),
          transparent: true, opacity: 0.88,
          side: THREE.DoubleSide, depthWrite: false
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI / 2.3;
        mesh.add(ringMesh);
      }

      if (def.name === 'Jupiter') {
        const moonColors = [0xddddcc, 0xccccbb, 0xbbbbaa, 0xaaaa99];
        for (let i = 0; i < 4; i++) {
          const mGeo = new THREE.SphereGeometry(0.25 + i*0.03, 16, 16);
          const mMat = new THREE.MeshPhongMaterial({ color: moonColors[i], shininess: 1 });
          const m = new THREE.Mesh(mGeo, mMat);
          m.userData = { orbitRadius: def.size + 1.8 + i*0.8, angle: Math.random()*Math.PI*2, speed: 0.03 - i*0.005 };
          mesh.add(m);
          jupiterMoons.push(m);
        }
      }

      const orbitGeo = new THREE.RingGeometry(def.dist - 0.08, def.dist + 0.08, 128);
      const orbitMat = new THREE.MeshBasicMaterial({
        color: 0x00aaff, side: THREE.DoubleSide, transparent: true, opacity: 0.09
      });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = -Math.PI / 2;
      scene.add(orbit);

      planets.push({ mesh, dist: def.dist, speed: def.speed, angle: Math.random() * Math.PI * 2 });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    window.addEventListener('mousemove', e => {
      targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    animate();
  };

  const animate = () => {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const t = clock.getElapsedTime();

    mouseX += (targetMouseX - mouseX) * 0.03;
    mouseY += (targetMouseY - mouseY) * 0.03;
    camera.position.x = mouseX * 3;
    camera.position.y = 10 + mouseY * 2;
    camera.lookAt(0, 0, 0);

    if (sunMesh) sunMesh.rotation.y += dt * 0.08;
    if (sunCorona) { const p = 1 + Math.sin(t * 1.5) * 0.04; sunCorona.scale.set(28*p, 28*p, 1); }
    if (sunCorona2) { const p = 1 + Math.sin(t * 1.2 + 1) * 0.05; sunCorona2.scale.set(45*p, 45*p, 1); }
    if (sunCorona3) { const p = 1 + Math.sin(t * 0.9 + 2) * 0.06; sunCorona3.scale.set(75*p, 75*p, 1); }

    if (starsSmall) starsSmall.rotation.y += dt * 0.005;
    if (starsBig) starsBig.rotation.y += dt * 0.003;

    planets.forEach(p => {
      p.angle += dt * p.speed * 0.15;
      p.mesh.position.x = Math.cos(p.angle) * p.dist;
      p.mesh.position.z = Math.sin(p.angle) * p.dist;
      p.mesh.rotation.y += dt * 0.5;
    });

    if (earthClouds) earthClouds.rotation.y += dt * 0.14;
    if (earthNight && earthMesh) earthNight.rotation.y = earthMesh.rotation.y;

    if (earthMesh && earthMesh.userData.moon) {
      const m = earthMesh.userData.moon;
      m.userData.angle += dt * m.userData.speed;
      m.position.x = earthMesh.position.x + Math.cos(m.userData.angle) * m.userData.orbitRadius;
      m.position.z = earthMesh.position.z + Math.sin(m.userData.angle) * m.userData.orbitRadius;
      m.rotation.y += dt * 0.3;
    }

    jupiterMoons.forEach(m => {
      m.userData.angle += dt * m.userData.speed;
      m.position.x = Math.cos(m.userData.angle) * m.userData.orbitRadius;
      m.position.z = Math.sin(m.userData.angle) * m.userData.orbitRadius;
    });

    renderer.render(scene, camera);
  };

  return { start: init };
})();

/* ═══ WINDOWS ═══ */
HalDo.Windows = (() => {
  const desktop = document.getElementById('desktop');
  let zTop = 250;
  const wins = new Map();
  let cascade = 0;

  const create = (id, title, html, opts = {}) => {
    if (wins.has(id)) {
      const w = wins.get(id);
      w.el.style.zIndex = ++zTop;
      w.el.classList.add('active');
      document.querySelectorAll('.window').forEach(x => { if (x !== w.el) x.classList.remove('active'); });
      return w;
    }
    const el = document.createElement('div');
    el.className = 'window active';
    el.dataset.id = id;

    const maxW = desktop.clientWidth - 20;
    const maxH = desktop.clientHeight - 20;
    const vw = Math.min(maxW, opts.width || 500);
    const vh = Math.min(maxH, opts.height || 420);
    el.style.width = vw + 'px';
    el.style.height = vh + 'px';

    const maxX = Math.max(0, desktop.clientWidth - vw);
    const maxY = Math.max(0, desktop.clientHeight - vh);
    const baseX = 15 + (cascade % 4) * 25;
    const baseY = 40 + (cascade % 4) * 25;
    cascade++;

    el.style.left = Math.max(10, Math.min(maxX, opts.x ?? baseX)) + 'px';
    el.style.top = Math.max(40, Math.min(maxY, opts.y ?? baseY)) + 'px';
    el.style.zIndex = ++zTop;

    const header = document.createElement('div');
    header.className = 'win-header';
    header.innerHTML = `
      <span class="win-title">${title}</span>
      <div class="win-controls">
        <button class="win-ctrl" data-act="min" title="Minimieren">–</button>
        <button class="win-ctrl" data-act="max" title="Maximieren">□</button>
        <button class="win-ctrl close" data-act="close" title="Schließen">×</button>
      </div>`;
    const body = document.createElement('div');
    body.className = 'win-body';
    body.innerHTML = html;
    el.appendChild(header);
    el.appendChild(body);
    desktop.appendChild(el);

    el.addEventListener('mousedown', () => {
      el.style.zIndex = ++zTop;
      document.querySelectorAll('.window').forEach(x => { if (x !== el) x.classList.remove('active'); });
      el.classList.add('active');
    });

    header.querySelectorAll('.win-ctrl').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        const act = b.dataset.act;
        if (act === 'close') destroy(id);
        else if (act === 'min') { el.style.transform = 'scale(0)'; setTimeout(() => { el.style.display = 'none'; setTimeout(() => { el.style.transform = 'scale(1)'; el.style.display = 'flex'; }, 210); }, 200); }
        else if (act === 'max') {
          if (el.dataset.maxed === '1') {
            el.style.left = el.dataset.pL; el.style.top = el.dataset.pT;
            el.style.width = el.dataset.pW; el.style.height = el.dataset.pH;
            el.dataset.maxed = '0';
          } else {
            el.dataset.pL = el.style.left; el.dataset.pT = el.style.top;
            el.dataset.pW = el.style.width; el.dataset.pH = el.style.height;
            el.style.left = '0'; el.style.top = '0';
            el.style.width = '100%'; el.style.height = '100%';
            el.dataset.maxed = '1';
          }
        }
      });
    });

    let dragging = false, sx, sy, ox, oy;
    const dragStart = e => {
      if (e.target.closest('.win-ctrl')) return;
      if (!header.contains(e.target)) return;
      if (e.target.closest('.win-body')) return;
      dragging = true;
      const rect = el.getBoundingClientRect();
      const dRect = desktop.getBoundingClientRect();
      ox = rect.left - dRect.left; oy = rect.top - dRect.top;
      sx = e.clientX; sy = e.clientY;
      header.classList.add('dragging');
      el.style.zIndex = ++zTop;
      e.preventDefault();
    };
    const dragMove = e => {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const nx = Math.max(0, Math.min(desktop.clientWidth - el.offsetWidth, ox + p.clientX - sx));
      const ny = Math.max(0, Math.min(desktop.clientHeight - el.offsetHeight, oy + p.clientY - sy));
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    };
    const dragEnd = () => { dragging = false; header.classList.remove('dragging'); };
    header.addEventListener('mousedown', dragStart);
    header.addEventListener('touchstart', dragStart, { passive: false });
    window.addEventListener('mousemove', dragMove);
    window.addEventListener('touchmove', dragMove, { passive: false });
    window.addEventListener('mouseup', dragEnd);
    window.addEventListener('touchend', dragEnd);

    wins.set(id, { el, body });
    return { el, body };
  };

  const destroy = id => {
    const w = wins.get(id);
    if (w) {
      if (id === 'camera' && w.body._stream) w.body._stream.getTracks().forEach(t => t.stop());
      if (id === 'voice-memos' && w.body._rec && w.body._rec.state !== 'inactive') w.body._rec.stop();
      w.el.remove(); wins.delete(id);
    }
  };
  const get = id => wins.get(id);
  const closeAll = () => { wins.forEach((w, id) => destroy(id)); };
  return { create, destroy, get, closeAll };
})();

      else if (/wie.*geht/i.test(t)) r = 'Alles gut hier! Die Erde dreht sich, die Sterne leuchten. Und dir, Bruder? 💙';
      else if (/wer.*bist/i.test(t)) r = 'Ich bin HalDo AI – deine KI im HalDo AI OS, entwickelt von Halil Donma.';

      else if (/wetter/i.test(t)) r = '🌤️ Öffne die Wetter-App für Live-Daten!';
      else if (/erde|earth/i.test(t)) r = '🌍 Die Erde zeigt echte NASA-Texturen: Tag-Seite mit Kontinenten, Nacht-Seite mit Stadt-Lichtern, Wolken, Atmosphäre und Topographie!';
      else if (/sonne|sun/i.test(t)) r = '☀️ Die Sonne hat 3 Corona-Schichten die pulsieren und strahlt auf alle 12 Planeten!';
      else if (/planet/i.test(t)) r = '🪐 Alle 12 Planeten: Merkur, Venus, Erde, Mars, Jupiter mit 4 Monden, Saturn mit Ringen, Uranus, Neptun, Pluto, Xena, Sedna, Eris!';
      else if (/stern|star/i.test(t)) r = '⭐ Über 5900 Sterne leuchten in 4 Farben am Himmel!';
      else if (/app/i.test(t)) r = '📱 Ich habe 44 funktionierende Apps: Chat, Übersetzer, Währung, Kamera, Voice Memos, QR-Code, Workout, Klavier, Periodensystem und viele mehr!';
      else if (/ezidi|êzîdî/i.test(t)) r = '🦚 Êzîdî ist eine der ältesten Religionen – Heiligtum Lalisch, Engel Melek Taus.';
      else r = ['Interessant, Bruder! 🚀', 'Verstanden!', 'Schau in "Alle Apps" für alle 44 Tools!', 'HalDo AI sagt: Bleib positiv! 💙'][Math.floor(Math.random()*4)];
      addMsg(r, 'ai');
      HalDo.Avatar.speak(r.slice(0, 100));
      HalDo.Sound.play('message');
    }, 400);
  };
  const submit = () => { const v = input.value.trim(); if (!v) return; addMsg(v, 'user'); input.value = ''; respond(v); };

  input.onkeydown = e => { if (e.key === 'Enter') submit(); };
  w.body.querySelector('#cmic').onclick = () => {

    if (!SR) return HalDo.Toast.show('Spracherkennung nicht verfügbar', { icon:'⚠️', sound:'error' });
    const rec = new SR();
    rec.lang = 'de-DE';
    rec.onresult = e => { input.value = e.results[0][0].transcript; submit(); };
    rec.start();
  };
};

HalDo.Apps.stopwatch = () => {
  if (HalDo.Windows.get('stopwatch')) return;
  const w = HalDo.Windows.create('stopwatch', '⏲️ Stoppuhr', `
    <h3>⏲️ Stoppuhr</h3>
    <div style="text-align:center;padding:24px;background:rgba(var(--primary-rgb),.15);border-radius:16px;border:1.5px solid var(--border);margin-bottom:12px">
      <div id="swd" style="font-size:44px;font-weight:900;font-family:monospace;color:var(--primary);text-shadow:0 0 20px rgba(var(--primary-rgb),.7)">00:00.00</div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <button class="btn primary" id="sws" style="flex:1">▶ Start</button>
      <button class="btn" id="swl" style="flex:1">📍 Runde</button>
      <button class="btn" id="swr" style="flex:1">↻ Reset</button>
    </div>
    <div id="swlaps" style="max-height:160px;overflow-y:auto"></div>
  `, { width: 400, height: 440 });
  const disp = w.body.querySelector('#swd');
  const lapsEl = w.body.querySelector('#swlaps');
  let startTime = 0, elapsed = 0, running = false, rafId, laps = [];
  const fmt = ms => {
    const m = Math.floor(ms/60000);
    const s = Math.floor((ms%60000)/1000);
    const cs = Math.floor((ms%1000)/10);
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  };
  const update = () => {
    if (running) elapsed = performance.now() - startTime;
    disp.textContent = fmt(elapsed);
    if (running) rafId = requestAnimationFrame(update);
  };
  const renderLaps = () => {
    lapsEl.innerHTML = laps.map((l,i)=>`<div class="list-item"><span style="font-size:12px;color:var(--text-dim)">Runde ${i+1}</span><div class="txt" style="text-align:right;font-family:monospace;font-weight:700;color:var(--primary)">${fmt(l)}</div></div>`).join('');
  };
  w.body.querySelector('#sws').onclick = () => {
    if (running) {
      running = false; cancelAnimationFrame(rafId);
      w.body.querySelector('#sws').textContent = '▶ Weiter';
    } else {
      running = true; startTime = performance.now() - elapsed; update();
      w.body.querySelector('#sws').textContent = '⏸ Stop';
    }
    HalDo.Sound.play('click');
  };
  w.body.querySelector('#swl').onclick = () => {
    if (running || elapsed > 0) {
      laps.push(elapsed); renderLaps();
      HalDo.Sound.play('success');
    }
  };
  w.body.querySelector('#swr').onclick = () => {
    running = false; cancelAnimationFrame(rafId);
    elapsed = 0; laps = []; disp.textContent = '00:00.00';
    w.body.querySelector('#sws').textContent = '▶ Start';
    renderLaps();
    HalDo.Sound.play('click');
  };
};

  `, { width: 440, height: 500 });
  const statusEl = w.body.querySelector('#vmStatus');
  const timeEl = w.body.querySelector('#vmTime');
  const listEl = w.body.querySelector('#vmList');
  let mediaRec = null, chunks = [], timerInterval = null, startTime = 0;
  w.body._rec = mediaRec;
  const memos = JSON.parse(localStorage.getItem('haldo_memos_v1') || '[]');
  const save = () => { try { localStorage.setItem('haldo_memos_v1', JSON.stringify(memos)); } catch(e) { HalDo.Toast.show('Speicher voll', {icon:'⚠️'}); } };
  const render = () => {
    listEl.innerHTML = memos.map((m,i)=>`
      <div class="list-item">
        <div class="txt"><b>${m.name}</b><br><small style="color:var(--text-dim)">${new Date(m.date).toLocaleString('de-DE')}</small></div>
        <audio controls src="${m.data}" style="height:32px;max-width:150px"></audio>

      </div>`).join('') || '<p style="color:var(--text-dim);font-size:11px">Keine Aufnahmen</p>';
  };
  window._vmDel = i => { memos.splice(i,1); save(); render(); };

        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t => t.stop());
        statusEl.textContent = '🎙️';
        clearInterval(timerInterval);
      };
      mediaRec.start();
      statusEl.textContent = '🔴';
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const s = Math.floor((Date.now() - startTime)/1000);
        timeEl.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
      }, 100);
      HalDo.Sound.play('success');
      HalDo.Toast.show('Aufnahme läuft...', {icon:'🔴'});
    } catch (e) {
      HalDo.Toast.show('Mikrofon verweigert', {icon:'⚠️', sound:'error'});
    }
  };
  w.body.querySelector('#vmStop').onclick = () => {
    if (mediaRec && mediaRec.state === 'recording') {
      mediaRec.stop();
      timeEl.textContent = '00:00';
      HalDo.Sound.play('click');
    }
  };
  render();
};

/* --- Habits --- */
HalDo.Apps.gewohnheiten = () => {
  if (HalDo.Windows.get('gewohnheiten')) return;
  const KEY = 'haldo_habits_v1';
  const data = JSON.parse(localStorage.getItem(KEY) || '[]');
  const today = new Date().toDateString();
  const w = HalDo.Windows.create('gewohnheiten', '🔥 Gewohnheiten', `
    <h3>🔥 Gewohnheiten</h3>
    <div style="display:flex;gap:6px;margin-bottom:10px">
      <input class="input" id="hI" placeholder="Neue Gewohnheit...">
      <button class="btn primary" id="hA">+</button>
    </div>
    <div id="hL"></div>
  `, { width: 440, height: 480 });
  const list = w.body.querySelector('#hL');
  const save = () => localStorage.setItem(KEY, JSON.stringify(data));
  const calcStreak = (h) => {
    if (!h.days || !h.days.length) return 0;
    const sorted = [...h.days].sort().reverse();
    let streak = 0;
    let cur = new Date();
    for (let i = 0; i < 365; i++) {
      const s = cur.toDateString();
      if (sorted.includes(s)) { streak++; cur.setDate(cur.getDate()-1); }
      else if (i === 0) { cur.setDate(cur.getDate()-1); continue; }
      else break;
    }
    return streak;
  };
  const render = () => {
    list.innerHTML = data.map((h,i) => {
      const doneToday = h.days && h.days.includes(today);
      const streak = calcStreak(h);
      return `<div class="list-item">
        <span style="font-size:24px">${doneToday?'✅':'⬜'}</span>
        <div class="txt"><b>${h.name}</b><br><small style="color:${streak>0?'var(--primary)':'var(--text-dim)'}">🔥 ${streak} Tage Streak</small></div>
        <button class="btn ${doneToday?'':'primary'}" onclick="window._hT(${i})" style="min-height:32px;padding:4px 10px;font-size:11px">${doneToday?'✓':'Check'}</button>

      </div>`;

      <button class="btn" id="pReset" style="flex:1">↻ Reset</button>
    </div>
  `, { width: 400, height: 440 });
  let mins = 25, sec = 0, running = false, tick, sessions = 0, mode = 'work';

  const modeEl = w.body.querySelector('#pMode');
  const sessEl = w.body.querySelector('#pSession');

/* --- Converter --- */
HalDo.Apps.converter = () => {
  if (HalDo.Windows.get('converter')) return;
  const w = HalDo.Windows.create('converter', '🔄 Einheiten-Rechner', `
    <h3>🔄 Einheiten-Umrechner</h3>
    <div class="list-item">
      <div class="txt">Kategorie</div>
      <select class="input" id="cat" style="width:180px;min-height:36px">
        <option value="len">Länge</option>
        <option value="weight">Gewicht</option>
        <option value="temp">Temperatur</option>
        <option value="time">Zeit</option>
        <option value="data">Daten</option>
      </select>
    </div>
    <div style="display:flex;gap:6px;margin-top:14px;align-items:center">
      <input class="input" id="fromV" type="number" value="1" style="flex:1">
      <select class="input" id="fromU" style="width:100px;min-height:42px"></select>
    </div>
    <div style="text-align:center;padding:14px;font-size:20px;color:var(--primary);font-weight:800">↓</div>
    <div style="display:flex;gap:6px;align-items:center">
      <input class="input" id="toV" readonly style="flex:1;background:rgba(var(--primary-rgb),.15);font-weight:700">
      <select class="input" id="toU" style="width:100px;min-height:42px"></select>
    </div>
  `, { width: 440, height: 400 });
  const units = {
    len: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.34, ft: 0.3048, in: 0.0254, yd: 0.9144 },
    weight: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.0283495, t: 1000 },
    temp: { C: 'C', F: 'F', K: 'K' },
    time: { s: 1, min: 60, h: 3600, d: 86400, w: 604800, y: 31536000 },
    data: { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 }
  };
  const cat = w.body.querySelector('#cat');
  const fromU = w.body.querySelector('#fromU');
  const toU = w.body.querySelector('#toU');
  const fromV = w.body.querySelector('#fromV');
  const toV = w.body.querySelector('#toV');
  const fillUnits = () => {
    const keys = Object.keys(units[cat.value]);
    fromU.innerHTML = keys.map(k=>`<option value="${k}">${k}</option>`).join('');
    toU.innerHTML = keys.map(k=>`<option value="${k}">${k}</option>`).join('');
    toU.selectedIndex = Math.min(1, keys.length-1);
    calc();
  };
  const calc = () => {
    const c = cat.value, f = fromU.value, t = toU.value;
    const v = parseFloat(fromV.value) || 0;
    let result;
    if (c === 'temp') {
      let celsius;
      if (f === 'C') celsius = v;
      else if (f === 'F') celsius = (v - 32) * 5/9;
      else celsius = v - 273.15;
      if (t === 'C') result = celsius;
      else if (t === 'F') result = celsius * 9/5 + 32;
      else result = celsius + 273.15;
    } else result = v * units[c][f] / units[c][t];
    toV.value = result.toFixed(4).replace(/\.?0+$/, '');
  };
  cat.onchange = fillUnits;
  fromU.onchange = calc;
  toU.onchange = calc;
  fromV.oninput = calc;
  fillUnits();
};

HalDo.Apps.metronome = () => {
  if (HalDo.Windows.get('metronome')) return;
  const w = HalDo.Windows.create('metronome', '🎵 Metronom', `
    <h3>🎵 Metronom</h3>
    <div style="text-align:center;padding:28px;background:rgba(var(--primary-rgb),.15);border-radius:16px;border:1.5px solid var(--border);margin-bottom:14px">
      <div id="metBpm" style="font-size:64px;font-weight:900;color:var(--primary);text-shadow:0 0 20px rgba(var(--primary-rgb),.7);font-family:monospace">120</div>
      <div style="font-size:11px;color:var(--text-dim);letter-spacing:2px">BPM</div>
      <div id="metDot" style="width:40px;height:40px;background:var(--primary);border-radius:50%;margin:16px auto 0;box-shadow:0 0 25px var(--primary);transition:all .1s"></div>
    </div>
    <div class="slider-row">
      <label>Tempo</label>
      <input type="range" id="metSlider" min="40" max="240" value="120">
      <span class="val" id="metVal">120</span>
    </div>
    <button class="btn primary" id="metToggle" style="width:100%;margin-top:12px">▶ Start</button>
  `, { width: 380, height: 480 });
  const bpmEl = w.body.querySelector('#metBpm');
  const dotEl = w.body.querySelector('#metDot');
  const slider = w.body.querySelector('#metSlider');
  const valEl = w.body.querySelector('#metVal');
  const toggle = w.body.querySelector('#metToggle');
  let audioCtx, running = false, tick, beatCount = 0;
  const playTick = (high) => {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = high ? 1200 : 800;
      o.type = 'square';
      g.gain.setValueAtTime(0.15, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      o.connect(g).connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.05);
    } catch(e) {}
  };
  const tickFn = () => {
    beatCount++;
    const isAccent = beatCount % 4 === 1;
    playTick(isAccent);
    dotEl.style.transform = 'scale(1.6)';
    dotEl.style.background = isAccent ? '#ff3355' : 'var(--gold)';
    setTimeout(() => {
      dotEl.style.transform = 'scale(1)';
      dotEl.style.background = 'var(--primary)';
    }, 80);
  };
  slider.oninput = () => {
    const v = parseInt(slider.value);
    bpmEl.textContent = v;
    valEl.textContent = v;
    if (running) { clearInterval(tick); tick = setInterval(tickFn, 60000 / v); }
  };
  toggle.onclick = () => {
    if (running) {
      running = false;
      clearInterval(tick);
      toggle.textContent = '▶ Start';
      toggle.classList.remove('gold');
      beatCount = 0;
      HalDo.Sound.play('click');
    } else {
      running = true;
      beatCount = 0;
      tick = setInterval(tickFn, 60000 / parseInt(slider.value));
      toggle.textContent = '⏸ Stop';
      toggle.classList.add('gold');
      HalDo.Sound.play('success');
    }
  };
};

    const press = () => { playNote(n.f); key.style.background = 'linear-gradient(180deg,var(--primary),var(--secondary))'; };
    const release = () => { key.style.background = ''; };
    key.onmousedown = press; key.onmouseup = release; key.onmouseleave = release;
    key.ontouchstart = e => { e.preventDefault(); press(); };
    key.ontouchend = release;
    keysEl.appendChild(key);
  });
  notesEl.innerHTML = notes.map(n=>`<button class="chip" data-f="${n.f}" style="${n.black ? 'background:rgba(0,0,0,.3)' : ''}">${n.n}</button>`).join('');
  notesEl.querySelectorAll('button').forEach(b => {
    b.onclick = () => playNote(parseFloat(b.dataset.f));
  });
  const handler = e => {
    if (!HalDo.Windows.get('piano')) { document.removeEventListener('keydown', handler); return; }
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    const n = notes.find(x => x.k === e.key.toLowerCase());
    if (n) { playNote(n.f); e.preventDefault(); }
  };
  document.addEventListener('keydown', handler);
};

/* --- Mathe-Solver --- */
HalDo.Apps.mathsolver = () => {
  if (HalDo.Windows.get('mathsolver')) return;
  const w = HalDo.Windows.create('mathsolver', '📐 Mathe-Solver', `
    <h3>📐 Quadratische Gleichung lösen</h3>
    <p style="font-size:12px;text-align:center;color:var(--primary);font-weight:700;font-family:monospace;margin:10px 0">ax² + bx + c = 0</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px">
      <div><label style="font-size:10px;color:var(--text-dim);display:block;margin-bottom:4px">a</label><input class="input" id="ma" type="number" value="1" step="any"></div>
      <div><label style="font-size:10px;color:var(--text-dim);display:block;margin-bottom:4px">b</label><input class="input" id="mb" type="number" value="-5" step="any"></div>
      <div><label style="font-size:10px;color:var(--text-dim);display:block;margin-bottom:4px">c</label><input class="input" id="mc" type="number" value="6" step="any"></div>
    </div>
    <button class="btn primary" id="mGo" style="width:100%">🔍 Lösen</button>
    <div id="mOut" style="margin-top:14px;padding:14px;background:rgba(var(--primary-rgb),.15);border-radius:12px;border:1.5px solid var(--border);min-height:120px;font-size:13px;line-height:1.9"></div>
    <h3 style="margin-top:14px">📚 Schnell-Beispiele</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="chip" onclick="document.getElementById('ma').value=1;document.getElementById('mb').value=-5;document.getElementById('mc').value=6;document.getElementById('mGo').click()">x²-5x+6=0</button>
      <button class="chip" onclick="document.getElementById('ma').value=1;document.getElementById('mb').value=0;document.getElementById('mc').value=-4;document.getElementById('mGo').click()">x²-4=0</button>
      <button class="chip" onclick="document.getElementById('ma').value=2;document.getElementById('mb').value=4;document.getElementById('mc').value=2;document.getElementById('mGo').click()">2x²+4x+2=0</button>
      <button class="chip" onclick="document.getElementById('ma').value=1;document.getElementById('mb').value=0;document.getElementById('mc').value=1;document.getElementById('mGo').click()">x²+1=0</button>
    </div>
  `, { width: 420, height: 540 });
  w.body.querySelector('#mGo').onclick = () => {
    const a = parseFloat(w.body.querySelector('#ma').value) || 1;
    const b = parseFloat(w.body.querySelector('#mb').value) || 0;
    const c = parseFloat(w.body.querySelector('#mc').value) || 0;
    const out = w.body.querySelector('#mOut');
    if (a === 0) { out.innerHTML = '<p style="color:#ff6688">⚠️ a darf nicht 0 sein (sonst keine quadratische Gleichung).</p>'; HalDo.Sound.play('error'); return; }
    const disc = b*b - 4*a*c;
    const sign = v => v >= 0 ? '+ ' + v : '− ' + Math.abs(v);
    let html = `<div><b style="color:var(--primary)">Gleichung:</b> ${a}x² ${sign(b)}x ${sign(c)} = 0</div>`;
    html += `<div style="margin-top:8px"><b style="color:var(--primary)">Diskriminante:</b> Δ = b² − 4ac = ${disc.toFixed(4)}</div>`;
    if (disc > 0) {
      const x1 = (-b + Math.sqrt(disc)) / (2*a);
      const x2 = (-b - Math.sqrt(disc)) / (2*a);
      html += `<div style="margin-top:10px"><b style="color:#00ff88">✓ Zwei reelle Lösungen:</b></div><div style="font-family:monospace;color:var(--gold);font-size:17px;margin-top:6px">x₁ = ${x1.toFixed(4)}</div><div style="font-family:monospace;color:var(--gold);font-size:17px">x₂ = ${x2.toFixed(4)}</div>`;
    } else if (Math.abs(disc) < 0.0001) {
      const x = -b / (2*a);
      html += `<div style="margin-top:10px"><b style="color:#00ff88">✓ Eine Lösung (doppelt):</b></div><div style="font-family:monospace;color:var(--gold);font-size:17px;margin-top:6px">x = ${x.toFixed(4)}</div>`;
    } else {
      const re = -b / (2*a);
      const im = Math.sqrt(-disc) / (2*a);
      html += `<div style="margin-top:10px"><b style="color:#ffcc00">⚠ Komplexe Lösungen:</b></div><div style="font-family:monospace;color:var(--gold);font-size:15px;margin-top:6px">x₁ = ${re.toFixed(3)} + ${Math.abs(im).toFixed(3)}i</div><div style="font-family:monospace;color:var(--gold);font-size:15px">x₂ = ${re.toFixed(3)} − ${Math.abs(im).toFixed(3)}i</div>`;
    }
    out.innerHTML = html;
    HalDo.Sound.play('success');
  };
  setTimeout(() => w.body.querySelector('#mGo').click(), 200);
};

/* --- Countdown --- */
HalDo.Apps.countdown = () => {
  if (HalDo.Windows.get('countdown')) return;
  const KEY = 'haldo_countdown_v1';
  let events = JSON.parse(localStorage.getItem(KEY) || '[]');
  const w = HalDo.Windows.create('countdown', '⏳ Countdown', `
    <h3>⏳ Countdown bis Datum</h3>
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <input class="input" id="cdN" placeholder="Ereignis (z.B. Geburtstag)" style="flex:1;min-width:120px">
      <input class="input" id="cdD" type="date" style="width:150px">
      <button class="btn primary" id="cdA" style="min-width:44px">+</button>
    </div>
    <div id="cdL"></div>
  `, { width: 480, height: 540 });
  const list = w.body.querySelector('#cdL');
  const save = () => localStorage.setItem(KEY, JSON.stringify(events));
  let iv;
  const render = () => {
    if (!events.length) { list.innerHTML = '<p style="color:var(--text-dim);font-size:11px">Noch keine Ereignisse. Füge dein erstes hinzu!</p>'; return; }
    list.innerHTML = events.slice().sort((a,b) => new Date(a.date) - new Date(b.date)).map((e) => {
      const i = events.indexOf(e);
      const now = new Date();
      const target = new Date(e.date + 'T00:00:00');
      const diff = target - now;
      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      const past = diff < 0;
      return `<div class="list-item">
        <div class="txt"><b>${e.name}</b><br><small style="color:var(--text-dim)">📅 ${target.toLocaleDateString('de-DE')}</small></div>
        <div style="text-align:right;font-family:monospace;font-weight:900;color:${past ? '#ff6688' : 'var(--primary)'};font-size:13px">
          ${past ? '⏰ Vorbei' : `<div style="font-size:22px">${days}d</div><div style="font-size:10px">${hours}h ${mins}m ${secs}s</div>`}
        </div>
        <button class="win-ctrl" onclick="window._cdD(${i})">×</button>
      </div>`;
    }).join('');
  };
  window._cdD = i => { events.splice(i,1); save(); render(); };
  w.body.querySelector('#cdA').onclick = () => {
    const n = w.body.querySelector('#cdN').value.trim();
    const d = w.body.querySelector('#cdD').value;
    if (!n || !d) return;
    events.push({ name: n, date: d, created: Date.now() });
    save(); render();
    w.body.querySelector('#cdN').value = '';
    w.body.querySelector('#cdD').value = '';
    HalDo.Sound.play('success');
    HalDo.Toast.show('Countdown erstellt', {icon:'⏳', sound:'success'});
  };
  render();
  iv = setInterval(() => { if (!HalDo.Windows.get('countdown')) { clearInterval(iv); return; } render(); }, 1000);
};

/* ═══ UI ═══ */
HalDo.UI = (() => {
  const iconMap = {chat:'💬',notes:'📝',tasks:'✅',calendar:'📅',journal:'📔',calc:'🧮',weather:'🌤️',timer:'⏱️',music:'🎵',dashboard:'🏠',about:'ℹ️',apps:'📱',settings:'⚙️','water-y':'💧','mood-y':'😊','sleep-y':'😴',gewohnheiten:'🔥',ziele:'🎯',pomodoro:'🍅',contacts:'👥',bookmarks:'🔖',password:'🔐',converter:'🔄',worldclock:'🌍',flashcards:'🎴',qr:'📱',random:'🎲',stopwatch:'⏲️',camera:'📷','voice-memos':'🎙️',bmi:'⚖️',textanalyzer:'📊',scicalc:'🔬',files:'📁',translator:'🌐',torch:'🔦',shopping:'🛒',recipes:'🍳',workout:'💪',metronome:'🎵',piano:'🎹',currency:'💱',periodic:'⚛️',mathsolver:'📐',countdown:'⏳',vocab:'📖'};

  const showSplash = (icon, name, greeting) => {
    const el = document.getElementById('appSplash');
    el.querySelector('#splashIc').textContent = icon;
    el.querySelector('#splashNm').textContent = name;
    el.querySelector('#splashGreet').textContent = greeting || `Willkommen bei ${name} – präsentiert von Halil Donma`;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 900);
  };

  const openApp = id => {
    HalDo.Sound.play('click');
    const a = HalDo.Registry.all.find(x => x.id === id);
    const name = a?.name || id;
    const icon = iconMap[id] || '📦';
    showSplash(icon, name, `Willkommen bei ${name} – präsentiert von Halil Donma`);

    setTimeout(() => {
      if (HalDo.Apps[id]) return HalDo.Apps[id]();
      if (HalDo.Windows.get(id)) return;
      const group = a?.group || 'HalDo';
      const categoryApps = HalDo.Registry.all.filter(x => x.group === group && HalDo.Apps[x.id]).slice(0, 6);
      HalDo.Windows.create(id, icon + ' ' + name, `
        <div style="text-align:center;padding:16px">
          <div style="font-size:56px;margin-bottom:10px">${icon}</div>
          <h3 style="font-size:16px;color:var(--primary)">${name}</h3>
          <p style="margin-top:8px">Kategorie: <b>${group}</b></p>
          <p style="color:var(--text-dim);font-size:12px;margin-top:14px;line-height:1.7">
            Diese App ist registriert und in Entwicklung. Sie wird bald als voll funktionsfähige App verfügbar sein.
          </p>
          ${categoryApps.length ? `
            <h3 style="margin-top:18px;font-size:13px">✨ Diese Apps aus "${group}" funktionieren bereits:</h3>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px">
              ${categoryApps.map(c => `<button class="chip" onclick="HalDo.UI.openApp('${c.id}')">${iconMap[c.id]||'📦'} ${c.name}</button>`).join('')}
            </div>
          ` : ''}
        </div>`, { width: 420, height: 380 });
    }, 400);
  };

  const toggleSidebar = () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
    document.getElementById('desktop').classList.toggle('full');
    HalDo.Sound.play('click');
  };

  const themes = ['holo','cyborg','gold','matrix','crimson','sunset','ice'];
  const cycleTheme = () => {
    const cur = document.body.dataset.theme || 'holo';
    setTheme(themes[(themes.indexOf(cur)+1) % themes.length]);
  };
  const setTheme = t => {
    document.body.dataset.theme = t;
    localStorage.setItem('haldo_theme', t);
    HalDo.Toast.show('Theme: ' + t.toUpperCase(), { icon: '🎨', sound: 'success' });
  };
  const closeAll = () => {
    HalDo.Windows.closeAll();
    HalDo.Toast.show('Alle Fenster geschlossen', { icon: '❌', sound: 'click' });
  };

  const openSettings = () => {
    HalDo.Sound.play('click');
    if (HalDo.Windows.get('settings')) return;
    const curFont = localStorage.getItem('haldo_fontSize') || '13';
    const curBlur = localStorage.getItem('haldo_blur') || '26';
    const curAnim = localStorage.getItem('haldo_anim') || '1';

    const html = `
      <div style="margin-bottom:14px;padding:12px;background:rgba(var(--primary-rgb),.15);border-radius:12px;border:1.5px solid var(--border)">
        <b style="color:var(--primary);font-size:12px">🎨 THEME AUSWÄHLEN</b>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">
          ${['holo','cyborg','gold','matrix','crimson','sunset','ice'].map(t=>`<button class="chip" onclick="HalDo.UI.setTheme('${t}')">${t.toUpperCase()}</button>`).join('')}
        </div>
      </div>

      <h3>🎨 Display</h3>
      <div class="slider-row">
        <label>Schriftgröße</label>
        <input type="range" id="setFont" min="11" max="18" value="${curFont}">
        <span class="val" id="valFont">${curFont}px</span>
      </div>
      <div class="slider-row">
        <label>Blur-Stärke</label>
        <input type="range" id="setBlur" min="0" max="50" value="${curBlur}">
        <span class="val" id="valBlur">${curBlur}px</span>
      </div>
      <div class="slider-row">
        <label>Animations-Speed</label>
        <input type="range" id="setAnim" min="0.5" max="2" step="0.1" value="${curAnim}">
        <span class="val" id="valAnim">${curAnim}x</span>
      </div>

      <h3>✨ Funktionen testen</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn" onclick="HalDo.Sound.play('success')">🔊 Sound testen</button>
        <button class="btn" onclick="HalDo.Toast.show('Test-Nachricht', {icon:'✨', sound:'success'})">📬 Toast testen</button>
        <button class="btn" onclick="HalDo.Avatar.speak('Hallo Bruder, ich bin HalDo AI')">🗣️ Stimme testen</button>
      </div>

      <h3>📊 Info</h3>
      <div class="list-item"><div class="txt"><b>Version</b></div><span style="color:var(--primary)">v131</span></div>
      <div class="list-item"><div class="txt"><b>Apps</b></div><span style="color:var(--primary)">44 funktionierend</span></div>
      <div class="list-item"><div class="txt"><b>Entwickler</b></div><span style="color:var(--gold)">Halil Donma</span></div>

      <h3>⚠️ Aktionen</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn" onclick="if(confirm('Alle Fenster schließen?')) HalDo.UI.closeAll()">Fenster schließen</button>
        <button class="btn" onclick="if(confirm('Alle Daten löschen?')) { localStorage.clear(); location.reload(); }">Reset alles</button>
      </div>
    `;
    const w = HalDo.Windows.create('settings', '⚙️ Einstellungen', html, { width: 540, height: 620 });

    w.body.querySelector('#setFont').oninput = e => {
      const v = e.target.value;
      w.body.querySelector('#valFont').textContent = v + 'px';
      document.documentElement.style.setProperty('--font-base', v + 'px');
      localStorage.setItem('haldo_fontSize', v);
    };
    w.body.querySelector('#setBlur').oninput = e => {
      const v = e.target.value;
      w.body.querySelector('#valBlur').textContent = v + 'px';
      document.documentElement.style.setProperty('--blur', v + 'px');
      localStorage.setItem('haldo_blur', v);
    };
    w.body.querySelector('#setAnim').oninput = e => {
      const v = e.target.value;
      w.body.querySelector('#valAnim').textContent = v + 'x';
      document.documentElement.style.setProperty('--anim-speed', v);
      localStorage.setItem('haldo_anim', v);
    };
  };

  return { openApp, toggleSidebar, cycleTheme, setTheme, openSettings, closeAll, showSplash };
})();

/* ═══ AVATAR ═══ */
HalDo.Avatar = (() => {
  const fab = document.getElementById('avatarFab');
  const speak = text => {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE'; u.rate = 1; u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    } catch(e){}
  };
  const think = () => { fab.textContent = '🤔'; setTimeout(() => fab.textContent = '🤖', 800); };
  return { speak, think };
})();

      if (a) a.querySelector('.win-ctrl.close')?.click();

  });
});
