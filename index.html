<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS Pro Max</title>
<style>
:root{--bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--border:#374151;--text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;--gold:#fbbf24;--danger:#ef4444;--success:#10b981;--font:'Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#000;user-select:none;font-family:var(--font);color:var(--text);font-size:14px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
#cosmos-canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;}
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);transition:opacity .5s;}
#welcome.hide{opacity:0;pointer-events:none;}
#welcome h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;color:#fff;box-shadow:0 0 30px rgba(6,182,212,.6);}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:50px;background:rgba(17,24,39,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 12px;gap:10px;z-index:9997;}
#taskbar.show{display:flex;}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:10px 20px;border-radius:10px;font-weight:bold;color:#fff;cursor:pointer;}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow-x:auto;}
.taskbar-app{background:rgba(55,65,81,.5);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid transparent;}
.taskbar-app:hover{border-color:var(--accent);}
#sys-clock{color:var(--dim);font-size:13px;font-weight:600;}
#start-menu{position:fixed;bottom:60px;left:10px;width:720px;max-height:85vh;background:rgba(17,24,39,.98);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;z-index:9998;box-shadow:0 -10px 40px rgba(0,0,0,.8);}
#start-menu.show{display:flex;}
.sm-tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);}
.sm-tab{flex:1;padding:10px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;}
.sm-tab.active{color:var(--accent);background:rgba(6,182,212,.15);border-bottom:2px solid var(--accent);}
.sm-panel{flex:1;overflow-y:auto;padding:12px;display:none;}
.sm-panel.active{display:block;}
.sm-apps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:8px;cursor:pointer;background:rgba(55,65,81,.2);border:1px solid transparent;}
.sm-app-card:hover{background:rgba(55,65,81,.6);border-color:var(--accent);}
.sm-app-card .ico{font-size:22px;margin-bottom:4px;}
.sm-app-card .nm{font-size:9px;text-align:center;}
.window{position:fixed;background:rgba(10,14,26,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.7);min-width:380px;min-height:280px;}
.window.minimized{display:none;}
.window-header{padding:12px 16px;background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:move;}
.window-title{font-weight:600;color:var(--accent);font-size:13px;}
.window-controls{display:flex;gap:6px;}
.win-btn{width:28px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);font-size:14px;}
.win-btn:hover{background:rgba(255,255,255,.2);}
.win-btn.close:hover{background:var(--danger);}
.window-body{flex:1;overflow:hidden;display:flex;}
.app-sidebar{width:180px;flex:none;padding:10px 8px;background:rgba(0,10,20,.6);border-right:1px solid rgba(55,65,81,.5);display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.side-btn{text-align:left;padding:9px 12px;font-size:12px;color:#a0c8e0;cursor:pointer;border-radius:8px;border:1px solid transparent;}
.side-btn:hover{background:rgba(55,65,81,.5);color:#fff;}
.side-btn.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.app-content{flex:1;padding:18px;overflow-y:auto;min-width:0;}
.app-content h3{margin-bottom:12px;color:var(--accent);font-size:16px;}
.app-content h4{margin:14px 0 8px;color:var(--accent);font-size:13px;}
.app-content input,.app-content select,.app-content textarea{margin-bottom:8px;}
.app-content button{padding:9px 16px;margin:4px 4px 4px 0;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.app-content button.danger{background:var(--danger);border-color:var(--danger);}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:6px;}
.list-row:hover{background:rgba(55,65,81,.6);border-color:var(--accent);}
.chat-box{display:flex;flex-direction:column;height:100%;}
.chat-log{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid var(--border);margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;max-width:85%;}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
.msg.ai{align-self:flex-start;background:rgba(31,41,55,.9);border:1px solid var(--border);}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;margin:0;}
.music-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.3);flex-wrap:wrap;}
.music-tab{padding:8px 14px;font-size:12px;border-radius:6px;cursor:pointer;color:#a0c8e0;border:1px solid transparent;}
.music-tab.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.music-content{flex:1;overflow-y:auto;padding:18px;}
.music-gen-form{background:rgba(31,41,55,.5);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.chip{padding:6px 12px;font-size:11px;border-radius:16px;background:rgba(55,65,81,.6);border:1px solid var(--border);cursor:pointer;color:#fff;}
.chip.active{background:rgba(6,182,212,.35);border-color:var(--accent);}
.music-track{background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.music-track .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.tacho{position:relative;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at center,#1a1a2e 0%,#0a0a15 100%);border:6px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.tacho-inner{display:flex;flex-direction:column;align-items:center;z-index:1;}
.tacho-speed{font-size:56px;font-weight:900;color:#fff;text-shadow:0 0 10px var(--accent);}
.tacho-needle{position:absolute;width:6px;height:120px;background:linear-gradient(to top,#ef4444,transparent);top:30px;left:50%;transform-origin:bottom center;transform:translateX(-50%) rotate(0deg);transition:transform .1s;z-index:2;}
.konto-setup{max-width:500px;margin:20px auto;padding:24px;background:rgba(31,41,55,.6);border:1px solid var(--accent);border-radius:12px;}
.mail-layout{display:flex;height:100%;width:100%;}
.mail-list-panel{width:320px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;}
.mail-folder{padding:8px 14px;cursor:pointer;color:#a0c8e0;}
.mail-folder.active{background:rgba(6,182,212,.2);color:#fff;}
.mail-detail{flex:1;display:flex;flex-direction:column;}
.mail-compose{padding:20px;flex:1;overflow-y:auto;}
.mail-ai-bar{background:rgba(6,182,212,.15);border:1px solid var(--accent);border-radius:8px;padding:10px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;}
.holo-map{position:relative;width:100%;height:420px;background:radial-gradient(circle at center,#0a1a2e,#000);border-radius:12px;overflow:hidden;border:1px solid var(--accent);}
.klassen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:12px;}
.klasse-btn{background:rgba(55,65,81,.5);border:2px solid var(--border);border-radius:10px;padding:14px 8px;cursor:pointer;text-align:center;}
.klasse-btn.active{border-color:var(--accent);background:rgba(6,182,212,.25);}
.simulator{background:radial-gradient(circle at center,#0a2a3a,#000);border-radius:12px;padding:20px;text-align:center;margin-top:12px;}
.sim-answer{background:rgba(55,65,81,.6);border:2px solid var(--border);color:#fff;padding:14px;border-radius:10px;margin-bottom:8px;cursor:pointer;text-align:left;}
.sim-answer.correct{border-color:#10b981;background:rgba(16,185,129,.25);}
.sim-answer.wrong{border-color:#ef4444;background:rgba(239,68,68,.25);}
</style>
</head>
<body>
<canvas id="cosmos-canvas"></canvas>
<div id="welcome">
  <div style="font-size:80px;filter:drop-shadow(0 0 30px #06b6d4)">🤖</div>
  <h1>HALDO AI OS PRO MAX</h1>
  <h2>Das komplette Betriebssystem.</h2>
  <button class="enter-btn" onclick="enterApp()">JETZT STARTEN →</button>
</div>
<div id="app-splash"><div class="splash-icon" id="splash-icon">🤖</div><div class="splash-name" id="splash-name">HalDo AI OS</div></div>
<div id="taskbar">
  <div class="start-btn" onclick="toggleStartMenu(event)"><span>⊞</span> Start</div>
  <div class="taskbar-apps" id="taskbar-apps"></div>
  <div id="sys-clock">--:--</div>
</div>
<div id="start-menu">
  <div class="sm-tabs">
    <button class="sm-tab active" data-tab="apps">📱 Apps</button>
    <button class="sm-tab" data-tab="settings">⚙️ Einstellungen</button>
  </div>
  <div class="sm-panel active" id="sm-panel-apps">
    <div class="sm-apps" id="sm-apps"></div>
  </div>
  <div class="sm-panel" id="sm-panel-settings">
    <div class="settings-layout"><div class="settings-nav" id="settings-nav"></div><div class="settings-content" id="settings-content"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==================== KERN & DATEN ==================== */
const store=(k,d)=>{try{const v=localStorage.getItem('haldo_'+k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>localStorage.setItem('haldo_'+k,JSON.stringify(v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let allVoices=[]; function loadVoices(){if(!('speechSynthesis'in window))return;allVoices=speechSynthesis.getVoices();} speechSynthesis.onvoiceschanged=loadVoices;loadVoices();
function speak(text, lang='de-DE'){ if(!('speechSynthesis'in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text)); u.lang=lang; speechSynthesis.speak(u); }

const GENRES={'Kurdisch':['Dengbêjî','Stran','Govend'],'Türkisch':['Arabesk','Türk Halk Müziği'],'Westlich':['Pop','Rock','Hip-Hop','Electronic','Klassik','Lo-Fi'],'Arabisch':['Maqām','Tarab']};
const INSTRUMENTE={'Tasten':['Klavier','Synth-Pad'],'Saiten':['Gitarre','Bass','Saz'],'Drums':['Schlagzeug','Darbuka']};
const STIMMUNGEN=['Happy','Traurig','Episch','Chill','Dunkel'];

/* ==================== AUDIO SYNTHESE ==================== */
const semiToFreq=(s,o)=>440*Math.pow(2,(((o+1)*12+s)-69)/12);
const PLAY={ kick:(c,t,d)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+.12);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(d);o.start(t);o.stop(t+.3);}, snare:(c,t,d)=>{const dur=.2,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);for(let i=0;i<b.length;i++)b.getChannelData(0)[i]=Math.random()*2-1;const n=c.createBufferSource();n.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1000;const g=c.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f);f.connect(g);g.connect(d);n.start(t);n.stop(t+dur);}, hihat:(c,t,d,v)=>{const dur=.05,b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);for(let i=0;i<b.length;i++)b.getChannelData(0)[i]=Math.random()*2-1;const n=c.createBufferSource();n.buffer=b;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f);f.connect(g);g.connect(d);n.start(t);n.stop(t+dur);}, piano:(c,f,t,dur,d)=>{const o1=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();o1.type='triangle';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;o1.connect(g);o2.connect(g);g.connect(d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o1.start(t);o2.start(t);o1.stop(t+dur);o2.stop(t+dur);}, bass:(c,f,t,dur,d)=>{const o=c.createOscillator(),filt=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;filt.type='lowpass';filt.frequency.value=400;o.connect(filt);filt.connect(g);g.connect(d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur);}, pad:(c,f,t,dur,d)=>{const o=c.createOscillator(),filt=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;filt.type='lowpass';filt.frequency.value=1200;o.connect(filt);filt.connect(g);g.connect(d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.3);g.gain.setValueAtTime(.08,t+dur-.3);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur);}};

async function generateSong(cfg){
  const ctx=new OfflineAudioContext(2,44100*cfg.duration,44100);const master=ctx.createGain();master.gain.value=.65;master.connect(ctx.destination);
  const beat=60/(cfg.bpm||120),bar=beat*4,bars=Math.ceil(cfg.duration/bar);
  const scale=[0,2,4,5,7,9,11].map(i=>i); // C-Dur als Fallback
  for(let b=0;b<bars;b++){
    const root=scale[b%scale.length],st=b*bar;
    if(cfg.inst.includes('Klavier')){[0,4,7].forEach((o,i)=>PLAY.piano(ctx,semiToFreq((root+o)%12,4),st+i*.02,beat*4*.95,master));}
    if(cfg.inst.includes('Synth-Pad')){[0,4,7].forEach(o=>PLAY.pad(ctx,semiToFreq((root+o)%12,4),st,beat*4*.95,master));}
    if(cfg.inst.includes('Bass')){PLAY.bass(ctx,semiToFreq(root,2),st,beat*1.8,master);PLAY.bass(ctx,semiToFreq(root,2),st+beat*2,beat*1.8,master);}
    if(cfg.genres.includes('Pop')||cfg.genres.includes('Rock')||cfg.genres.includes('Electronic')){
      for(let i=0;i<4;i++){const t=st+i*beat;if(i===0||i===2)PLAY.kick(ctx,t,master);if(i===1||i===3)PLAY.snare(ctx,t,master);PLAY.hihat(ctx,t,master,.15);}
    }
  }
  return await ctx.startRendering();
}

/* ==================== KOSMOS (3D Hintergrund) ==================== */
function initCosmos(){if(typeof THREE==='undefined')return;const canvas=document.getElementById('cosmos-canvas');const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,5000);camera.position.set(0,20,60);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x000005,1);const sg=new THREE.BufferGeometry();const sp=new Float32Array(15000*3);for(let i=0;i<15000;i++){sp[i*3]=(Math.random()-.5)*2000;sp[i*3+1]=(Math.random()-.5)*2000;sp[i*3+2]=(Math.random()-.5)*2000;}sg.setAttribute('position',new THREE.BufferAttribute(sp,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:2,color:0xffffff,transparent:true,opacity:.8}));scene.add(stars);const sun=new THREE.Mesh(new THREE.SphereGeometry(3,32,32),new THREE.MeshBasicMaterial({color:0xffaa00}));scene.add(sun);const earth=new THREE.Mesh(new THREE.SphereGeometry(2,32,32),new THREE.MeshPhongMaterial({color:0x2288ff}));earth.position.set(20,0,0);scene.add(earth);scene.add(new THREE.PointLight(0xffffff,2,100));scene.add(new THREE.AmbientLight(0x404040,2));(function anim(){requestAnimationFrame(anim);sun.rotation.y+=.01;earth.rotation.y+=.02;earth.position.x=Math.cos(Date.now()*.0005)*20;earth.position.z=Math.sin(Date.now()*.0005)*20;renderer.render(scene,camera);})();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});}

/* ==================== APPS (Von A bis Z) ==================== */
const viewAI=function(body){body.style.cssText='display:flex;height:100%;flex-direction:column;padding:18px;';const log=document.createElement('div');log.className='chat-log';const inp=document.createElement('div');inp.className='chat-input';inp.innerHTML='<input id="ai-inp" placeholder="Frage…"><button id="ai-snd">➤</button>';body.appendChild(log);body.appendChild(inp);let h=store('ai_history',[{role:'ai',text:'Willkommen bei HalDo AI. Wie kann ich helfen?'}]);const r=()=>{log.innerHTML='';h.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.text;log.appendChild(d);});log.scrollTop=log.scrollHeight;};const send=()=>{const q=document.getElementById('ai-inp').value.trim();if(!q)return;h.push({role:'user',text:q});document.getElementById('ai-inp').value='';r();setTimeout(()=>{h.push({role:'ai',text:'Verstanden. Ich stehe dir zur Verfügung, Bruder.'});if(h.length>40)h=h.slice(-40);save('ai_history',h);r();speak('Verstanden.');},400);};setTimeout(()=>{document.getElementById('ai-snd').onclick=send;document.getElementById('ai-inp').onkeydown=e=>{if(e.key==='Enter')send();};},0);r();};

const viewMusic=function(body){
  body.style.cssText='display:flex;height:100%;flex-direction:column;';const tabs=document.createElement('div');tabs.className='music-tabs';const ct=document.createElement('div');ct.className='music-content';body.appendChild(tabs);body.appendChild(ct);
  let active='studio';let tracks=store('music_tracks',[]);let settings=Object.assign({prompt:'',bpm:120,duration:15,genres:['Pop'],inst:['Klavier','Bass'],stim:['Happy']},store('music_settings',{}));
  function chips(items,act,onChange){const g=document.createElement('div');g.className='chip-group';items.forEach(i=>{const c=document.createElement('div');c.className='chip'+(act.includes(i)?' active':'');c.textContent=i;c.onclick=()=>{if(act.includes(i)){act.splice(act.indexOf(i),1);c.classList.remove('active');}else{act.push(i);c.classList.add('active');}onChange();};g.appendChild(c);});return g;}
  function render(){tabs.innerHTML='';[['studio','🎛️ Studio'],['lib','📚 Bibliothek']].forEach(([id,l])=>{const b=document.createElement('button');b.className='music-tab'+(active===id?' active':'');b.textContent=l;b.onclick=()=>{active=id;render();};tabs.appendChild(b);});ct.innerHTML='';
    if(active==='studio'){
      ct.innerHTML='<h3>🎵 Musik Studio (Synthese)</h3><div class="music-gen-form"><textarea id="m-p" placeholder="Beschreibung">'+esc(settings.prompt)+'</textarea></div>';
      const gT=document.createElement('h4');gT.textContent='Genres';ct.appendChild(gT);Object.keys(GENRES).forEach(k=>{ct.appendChild(chips(GENRES[k],settings.genres,()=>save('music_settings',settings)));});
      const iT=document.createElement('h4');iT.textContent='Instrumente';ct.appendChild(iT);Object.keys(INSTRUMENTE).forEach(k=>{ct.appendChild(chips(INSTRUMENTE[k],settings.inst,()=>save('music_settings',settings)));});
      const sT=document.createElement('h4');sT.textContent='Stimmung';ct.appendChild(sT);ct.appendChild(chips(STIMMUNGEN,settings.stim,()=>save('music_settings',settings)));
      ct.innerHTML+='<div style="margin-top:10px;"><label>BPM</label><input type="number" id="m-bpm" value="'+settings.bpm+'"><label>Dauer (s)</label><input type="number" id="m-dur" value="'+settings.duration+'"></div><button id="m-gen" style="margin-top:16px;width:100%;padding:14px;font-size:16px;">🎼 Song generieren</button><div id="m-stat" style="margin-top:10px;color:var(--accent);"></div>';
      setTimeout(()=>{document.getElementById('m-gen').onclick=async()=>{const btn=document.getElementById('m-gen'),st=document.getElementById('m-stat');btn.disabled=true;btn.textContent='Generiere...';st.textContent='Komponiere...';settings.prompt=document.getElementById('m-p').value;settings.bpm=parseInt(document.getElementById('m-bpm').value)||120;settings.duration=parseInt(document.getElementById('m-dur').value)||15;save('music_settings',settings);try{const buf=await generateSong(settings);const id=Date.now();window._audioStore=window._audioStore||{};window._audioStore[id]=buf;tracks.unshift({id,title:settings.prompt||'Song',bpm:settings.bpm,genres:[...settings.genres]});save('music_tracks',tracks);st.textContent='✅ Fertig!';active='lib';setTimeout(render,600);}catch(e){st.textContent='Fehler: '+e.message;btn.disabled=false;btn.textContent='🎼 Song generieren';}};},0);
    } else {
      ct.innerHTML='<h3>📚 Bibliothek</h3>';tracks.forEach(t=>{const el=document.createElement('div');el.className='music-track';el.innerHTML='<b>'+esc(t.title)+'</b> ('+t.bpm+' BPM)<div class="actions"></div>';const acts=el.querySelector('.actions');const buf=window._audioStore&&window._audioStore[t.id];if(buf){const play=document.createElement('button');play.textContent='▶ Play';play.onclick=()=>{const ac=new(window.AudioContext||window.webkitAudioContext)();const src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.start(0);speak('Spiele '+t.title);};acts.appendChild(play);}const del=document.createElement('button');del.textContent='🗑';del.className='danger';del.onclick=()=>{tracks=tracks.filter(x=>x.id!==t.id);save('music_tracks',tracks);if(window._audioStore)delete window._audioStore[t.id];render();};acts.appendChild(del);ct.appendChild(el);});if(!tracks.length)ct.innerHTML+='<p>Keine Songs.</p>';
    }
  } render();
};

const viewFahrschule=function(body){
  body.style.cssText='display:flex;height:100%;';const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';body.appendChild(sb);body.appendChild(ct);
  let active='klassen';let sel=store('fs_class','B');const K=[{c:'AM',i:'🛵'},{c:'A1',i:'🏍️'},{c:'A2',i:'🏍️'},{c:'A',i:'🏍️'},{c:'B',i:'🚗'},{c:'BE',i:'🚗'},{c:'C',i:'🚛'},{c:'D',i:'🚌'}];const Q=[{q:'Innerorts?',a:['30','50','60'],c:1,k:'B'},{q:'Promille?',a:['0.0','0.5','0.8'],c:0,k:'B'},{q:'Mofa?',a:['20','25','45'],c:1,k:'AM'}];
  function render(){sb.innerHTML='';[['klassen','🚗 Klassen'],['sim','🎯 Simulator']].forEach(([id,l])=>{const b=document.createElement('button');b.className='side-btn'+(active===id?' active':'');b.textContent=l;b.onclick=()=>{active=id;render();};sb.appendChild(b);});ct.innerHTML='';
    if(active==='klassen'){ct.innerHTML='<h3>Klasse wählen</h3><div class="klassen-grid">'+K.map(k=>'<div class="klasse-btn'+(sel===k.c?' active':'')+'" onclick="localStorage.setItem(\'haldo_fs_class\',\''+k.c+'\');this.parentElement.parentElement.parentElement.querySelector(\'.side-btn\').click()"><div style="font-size:24px">'+k.i+'</div><b>'+k.c+'</b></div>').join('')+'</div>';}
    else{ct.innerHTML='<h3>Simulator</h3>';const q=Q.find(x=>x.k===sel);if(!q){ct.innerHTML+='<p>Keine Fragen für '+sel+'</p>';return;}const s=document.createElement('div');s.className='simulator';s.innerHTML='<h4>'+q.q+'</h4>';q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='sim-answer';b.textContent=a;b.onclick=()=>{if(i===q.c){b.classList.add('correct');speak('Richtig');}else{b.classList.add('wrong');speak('Falsch');}setTimeout(render,1500);};s.appendChild(b);});ct.appendChild(s);}
  } render();
};

const viewBlitzer=function(body){
  body.style.cssText='display:flex;height:100%;';const ct=document.createElement('div');ct.className='app-content';body.appendChild(ct);let cs=store('bl_speed',50),sl=store('bl_limit',50);
  function render(){ct.innerHTML='<h3>🚨 HalDo Blitzer</h3><div style="text-align:center;margin-bottom:10px;"><h2 style="color:#ef4444">Limit: '+sl+'</h2></div>';const t=document.createElement('div');t.className='tacho';const pct=Math.min(cs/260,1);t.innerHTML='<div class="tacho-needle" style="transform:translateX(-50%) rotate('+(-90+pct*180)+'deg)"></div><div class="tacho-inner"><div class="tacho-speed">'+cs+'</div><div>km/h</div></div>';ct.appendChild(t);const c=document.createElement('div');c.style.cssText='display:flex;gap:10px;justify-content:center;margin-top:20px';c.innerHTML='<button id="m">−</button><button id="p">+</button>';ct.appendChild(c);setTimeout(()=>{document.getElementById('m').onclick=()=>{cs=Math.max(0,cs-5);save('bl_speed',cs);render();};document.getElementById('p').onclick=()=>{cs=Math.min(300,cs+5);save('bl_speed',cs);render();};},0);}
  render();
};

const viewEmail=function(body){
  body.style.cssText='display:flex;height:100%;';const wrap=document.createElement('div');wrap.className='mail-layout';body.appendChild(wrap);
  let acc=store('mail_acc',null);let mails=store('mail_inbox',[{id:1,from:'HalDo AI',to:'halil@haldo.ai',sub:'Willkommen',body:'Willkommen!',folder:'inbox'}]);let compose=false;
  function render(){wrap.innerHTML='';
    if(!acc){const s=document.createElement('div');s.className='konto-setup';s.innerHTML='<h2>Konto erstellen</h2><p>halil@haldo.ai</p><input id="a-n" value="Halil"><button id="a-b" style="margin-top:10px">Erstellen</button>';s.querySelector('#a-b').onclick=()=>{acc={name:s.querySelector('#a-n').value};save('mail_acc',acc);render();};wrap.appendChild(s);return;}
    const lp=document.createElement('div');lp.className='mail-list-panel';const dp=document.createElement('div');dp.className='mail-detail';wrap.appendChild(lp);wrap.appendChild(dp);
    lp.innerHTML='<div style="padding:10px"><button id="new" style="width:100%">✍ Neu</button></div>';['inbox','sent'].forEach(f=>{const e=document.createElement('div');e.className='mail-folder';e.textContent=f==='inbox'?'📥 Posteingang':'📤 Gesendet';e.onclick=()=>{dp.innerHTML='';mails.filter(m=>m.folder===f).forEach(m=>{const r=document.createElement('div');r.className='list-row';r.textContent=m.sub;r.onclick=()=>{dp.innerHTML='<div style="padding:20px"><h2>'+m.sub+'</h2><p style="color:var(--dim)">'+m.from+'</p><hr style="margin:10px 0;border-color:#374151"><p>'+m.body+'</p></div>';};dp.appendChild(r);});};lp.appendChild(e);});
    if(compose){dp.innerHTML='<div class="mail-compose"><h3>Neu</h3><input id="m-to" placeholder="An"><input id="m-sub" placeholder="Betreff"><textarea id="m-bdy" style="height:200px"></textarea><button id="snd">Senden</button></div>';dp.querySelector('#snd').onclick=()=>{mails.push({id:Date.now(),from:acc.name,to:dp.querySelector('#m-to').value,sub:dp.querySelector('#m-sub').value,body:dp.querySelector('#m-bdy').value,folder:'sent'});save('mail_inbox',mails);compose=false;render();speak('Gesendet');};}
    lp.querySelector('#new').onclick=()=>{compose=true;render();};
  } render();
};

const viewNavigation=function(body){body.style.cssText='display:flex;height:100%;';const ct=document.createElement('div');ct.className='app-content';body.appendChild(ct);let r=store('nav_route',{f:'',t:''});ct.innerHTML='<h3>🗺️ Navigation</h3><div style="display:flex;gap:10px"><input id="f" placeholder="Von" value="'+r.f+'"><input id="t" placeholder="Nach" value="'+r.t+'"><button id="go">Start</button></div><div class="holo-map"><div style="position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:80px;color:#fbbf24">⬆️</div></div>';setTimeout(()=>{document.getElementById('go').onclick=()=>{r.f=document.getElementById('f').value;r.t=document.getElementById('t').value;save('nav_route',r);speak('Route berechnet');};},0);};
const viewVideo=function(body){body.style.cssText='padding:18px;';body.innerHTML='<h3>🎬 Video Studio</h3><textarea placeholder="Prompt..." style="height:100px"></textarea><button onclick="speak(\'Video generiert\')" style="margin-top:10px">Generieren</button>';};
const viewBild=function(body){body.style.cssText='padding:18px;';body.innerHTML='<h3>🖼️ Bild Studio</h3><textarea placeholder="Prompt..." style="height:100px"></textarea><button onclick="speak(\'Bild generiert\')" style="margin-top:10px">Generieren</button>';};

// Generischer CRUD für kleine Apps
function makeCRUD(id,title){return function(body){body.style.cssText='display:flex;height:100%';const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';body.appendChild(sb);body.appendChild(ct);sb.innerHTML='<button class="side-btn active">📋 Liste</button>';ct.innerHTML='<h3>'+title+'</h3><div id="l"></div>';const l=document.getElementById('l');(store(id,[])||[]).forEach(i=>{const d=document.createElement('div');d.className='list-row';d.textContent=i.n||i.t||'Eintrag';l.appendChild(d);});};}
const appsList=[
  {id:'A',ico:'🧠',nm:'HalDo AI',fn:viewAI},{id:'MS',ico:'🎵',nm:'Musik',fn:viewMusic},{id:'E',ico:'✉️',nm:'Mail',fn:viewEmail},{id:'FS',ico:'🚗',nm:'Fahrschule',fn:viewFahrschule},{id:'BL',ico:'🚨',nm:'Blitzer',fn:viewBlitzer},{id:'N',ico:'🗺️',nm:'Navigation',fn:viewNavigation},{id:'VD',ico:'🎬',nm:'Video',fn:viewVideo},{id:'BD',ico:'🖼️',nm:'Bild',fn:viewBild},
  {id:'F',ico:'📂',nm:'Files',fn:makeCRUD('files','Files')},{id:'C',ico:'📅',nm:'Kalender',fn:makeCRUD('cal','Kalender')},{id:'T',ico:'✅',nm:'Tasks',fn:makeCRUD('tasks','Tasks')},{id:'NO',ico:'📝',nm:'Notizen',fn:makeCRUD('notizen','Notizen')},{id:'KO',ico:'👥',nm:'Kontakte',fn:makeCRUD('kontakte','Kontakte')},{id:'PW',ico:'🔑',nm:'Passwörter',fn:makeCRUD('pw','Passwörter')},{id:'FI',ico:'💰',nm:'Finanzen',fn:makeCRUD('finanzen','Finanzen')},{id:'RE',ico:'🍳',nm:'Rezepte',fn:makeCRUD('rezepte','Rezepte')},{id:'EI',ico:'🛒',nm:'Einkauf',fn:makeCRUD('einkauf','Einkauf')},{id:'Z',ico:'⚙️',nm:'System',fn:function(b){b.innerHTML='<div style="padding:20px"><h3>System</h3><p>HalDo AI OS Pro Max</p></div>';}}
];

/* ==================== WINDOW MANAGER ==================== */
const openWindows={};let zC=20;
function toggleStartMenu(e){if(e)e.stopPropagation();const sm=document.getElementById('start-menu');sm.classList.toggle('show');}
document.addEventListener('click',function(e){const sm=document.getElementById('start-menu');if(sm.classList.contains('show')&&!sm.contains(e.target)&&!e.target.closest('.start-btn'))sm.classList.remove('show');});
document.querySelectorAll('.sm-tab').forEach(t=>{t.onclick=(e)=>{e.stopPropagation();document.querySelectorAll('.sm-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.sm-panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('sm-panel-'+t.dataset.tab).classList.add('active');};});

function openApp(id){
  const def=appsList.find(a=>a.id===id);if(!def)return;document.getElementById('start-menu').classList.remove('show');
  if(openWindows[id]){document.getElementById('win-'+id).style.zIndex=++zC;return;}
  const win=document.createElement('div');win.className='window';win.id='win-'+id;win.style.cssText='width:900px;height:600px;left:'+(50+Object.keys(openWindows).length*20)+'px;top:'+(50+Object.keys(openWindows).length*20)+'px;z-index:'+(++zC);
  win.innerHTML='<div class="window-header" onmousedown="startDrag(event,\''+id+'\')"><div class="window-title">'+def.ico+' '+def.nm+'</div><div class="window-controls"><button class="win-btn close" onclick="event.stopPropagation();closeApp(\''+id+'\')">✕</button></div></div><div class="window-body" id="body-'+id+'"></div>';
  document.body.appendChild(win);openWindows[id]=true;
  document.getElementById('taskbar-apps').innerHTML+='<div class="taskbar-app" onclick="document.getElementById(\'win-'+id+'\').style.zIndex=++zC">'+def.ico+' '+def.nm+'</div>';
  try{def.fn(document.getElementById('body-'+id));}catch(e){document.getElementById('body-'+id).innerHTML='<p style="color:red;padding:20px">Fehler: '+e.message+'</p>';}
}
function closeApp(id){document.getElementById('win-'+id).remove();delete openWindows[id];}
let drag=null;
function startDrag(e,id){const w=document.getElementById('win-'+id);drag={id,x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop};w.style.zIndex=++zC;}
addEventListener('mousemove',e=>{if(!drag)return;const w=document.getElementById('win-'+drag.id);w.style.left=(drag.l+e.clientX-drag.x)+'px';w.style.top=(drag.t+e.clientY-drag.y)+'px';});
addEventListener('mouseup',()=>drag=null);

/* ==================== BOOT ==================== */
function populateStartMenu(){const g=document.getElementById('sm-apps');g.innerHTML='';appsList.forEach(a=>{const c=document.createElement('div');c.className='sm-app-card';c.innerHTML='<div class="ico">'+a.ico+'</div><div class="nm">'+a.nm+'</div>';c.onclick=()=>openApp(a.id);g.appendChild(c);});}
function enterApp(){document.getElementById('welcome').classList.add('hide');document.getElementById('taskbar').classList.add('show');populateStartMenu();}
function startClock(){const c=document.getElementById('sys-clock');setInterval(()=>c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),1000);}
document.addEventListener('DOMContentLoaded',()=>{initCosmos();startClock();populateStartMenu();});
</script>
