<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04060c">
<title>HalDo AI OS Pro Max v125</title>
<style>
:root{
  --primary:#00e5ff;--secondary:#4da8ff;--accent:#b478ff;
  --glow:rgba(0,229,255,.5);
  --bg1:#04060c;--bg2:#080f1e;
  --border:rgba(0,229,255,.4);--gold:#ffd700;
  --text:#e8f4ff;--muted:#8fb3d9;
  --font-scale:1;--blur:24px;--glow-str:1;--cosmos-scale:1;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:calc(14px * var(--font-scale));
  background:radial-gradient(ellipse at 50% 30%,var(--bg2) 0%,var(--bg1) 70%);
  color:var(--text);padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;font-size:calc(14px * var(--font-scale))}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px;opacity:.5}

/* ═════════ COSMOS ═════════ */
#cosmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#cosmos-scale{
  position:absolute;top:50%;left:50%;
  width:1100px;height:1100px;
  margin:-550px 0 0 -550px;
  transform:scale(var(--cosmos-scale));
  transform-origin:center center;
}
#cosmos.hide-stars .star{display:none}
#cosmos.hide-sun #sun{display:none}
#cosmos.hide-planets .orbit-wrapper{display:none}
#cosmos.hide-moon .moon{display:none}

.star{
  position:absolute;background:#fff;border-radius:50%;
  box-shadow:0 0 3px rgba(255,255,255,.8);
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}

/* SONNE — echte Textur + Corona */
#sun{
  position:absolute;top:50%;left:50%;
  width:100px;height:100px;margin:-50px 0 0 -50px;
  border-radius:50%;
  background:radial-gradient(circle at 48% 48%,
    #ffffff 0%,
    #fffce8 8%,
    #fff3a0 20%,
    #ffdb4d 35%,
    #ffb020 50%,
    #ff7700 70%,
    #e64000 88%,
    #aa2000 100%);
  box-shadow:
    0 0 40px 15px rgba(255,220,100,.7),
    0 0 100px 40px rgba(255,150,50,.45),
    0 0 200px 80px rgba(255,80,0,.25),
    inset 0 0 30px rgba(255,255,220,.6),
    inset 0 0 60px rgba(255,180,80,.4);
  animation:sunPulse 4s ease-in-out infinite;
}
#sun::before{
  content:'';position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,240,150,.35),transparent 65%);
  animation:sunCorona 8s linear infinite;
}
#sun::after{
  content:'';position:absolute;inset:-60px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,50,.12),transparent 55%);
  animation:sunCorona 12s linear infinite reverse;
}
@keyframes sunPulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.15)}
}
@keyframes sunCorona{
  0%{transform:rotate(0) scale(1)}
  50%{transform:rotate(180deg) scale(1.1)}
  100%{transform:rotate(360deg) scale(1)}
}

/* ORBIT-RAHMEN */
.orbit-wrapper{
  position:absolute;top:50%;left:50%;
  border:1px solid rgba(255,255,255,.04);
  border-radius:50%;
  pointer-events:none;
}
.orbit-planet{
  position:absolute;top:0;left:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  animation:orbitRotate linear infinite;
}
@keyframes orbitRotate{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* PLANETEN — echte Texturen */
.planet{
  position:relative;width:100%;height:100%;border-radius:50%;
  overflow:hidden;
}

/* Merkur — grau mit Kratern */
.p-mercury{
  background:
    radial-gradient(circle at 28% 32%,rgba(220,220,220,.35) 0%,transparent 8%),
    radial-gradient(circle at 68% 22%,rgba(60,60,60,.5) 0%,transparent 6%),
    radial-gradient(circle at 45% 68%,rgba(90,90,90,.4) 0%,transparent 5%),
    radial-gradient(circle at 22% 72%,rgba(80,80,80,.3) 0%,transparent 4%),
    radial-gradient(circle at 40% 40%,#b8a898 0%,#8a7a6a 50%,#4a3a2a 100%);
  box-shadow:
    inset -3px -3px 5px rgba(0,0,0,.75),
    inset 2px 2px 3px rgba(255,255,255,.15),
    0 0 6px rgba(180,160,140,.5);
}

/* Venus — dichte gelbe Wolken */
.p-venus{
  background:
    radial-gradient(circle at 35% 30%,#fff8d0 0%,transparent 20%),
    radial-gradient(circle at 60% 65%,#ffdd88 0%,transparent 25%),
    radial-gradient(circle at 50% 50%,#ffe070 0%,#e8b030 40%,#a87820 75%,#6a4810 100%);
  box-shadow:
    inset -3px -3px 5px rgba(0,0,0,.45),
    inset 2px 2px 4px rgba(255,240,180,.4),
    0 0 8px rgba(232,176,92,.6);
}

/* ERDE — realistische Ozeane + Kontinente */
.p-earth{
  background:
    radial-gradient(ellipse 22% 28% at 32% 32%,#5aab5a 0%,#3e7f4a 55%,transparent 100%),
    radial-gradient(ellipse 18% 22% at 68% 40%,#5aab5a 0%,#3e7f4a 55%,transparent 100%),
    radial-gradient(ellipse 16% 20% at 52% 68%,#5aab5a 0%,#3e7f4a 55%,transparent 100%),
    radial-gradient(ellipse 10% 14% at 22% 62%,#5aab5a 0%,transparent 100%),
    radial-gradient(ellipse 12% 10% at 76% 72%,#5aab5a 0%,transparent 100%),
    radial-gradient(ellipse 30% 12% at 50% 15%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(ellipse 25% 10% at 30% 55%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(circle at 40% 40%,#4ab8ff 0%,#2a6fdd 50%,#0a3a8a 100%);
  box-shadow:
    inset -4px -4px 7px rgba(0,0,0,.75),
    inset 3px 3px 5px rgba(150,220,255,.35),
    0 0 14px rgba(77,168,255,.75);
}

/* MARS — rot mit Polkappen und dunklen Flecken */
.p-mars{
  background:
    radial-gradient(ellipse 30% 15% at 50% 8%,rgba(255,255,255,.75) 0%,transparent 100%),
    radial-gradient(ellipse 25% 12% at 50% 92%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(circle at 35% 40%,#b84420 0%,transparent 22%),
    radial-gradient(circle at 65% 60%,#a03018 0%,transparent 18%),
    radial-gradient(circle at 45% 70%,#c9502a 0%,transparent 15%),
    radial-gradient(circle at 40% 40%,#e87850 0%,#b84420 45%,#7a2a10 100%);
  box-shadow:
    inset -3px -3px 5px rgba(0,0,0,.65),
    inset 2px 2px 4px rgba(255,180,120,.3),
    0 0 8px rgba(226,107,74,.65);
}

/* JUPITER — Bänder + roter Fleck */
.p-jupiter{
  background:
    radial-gradient(ellipse 18% 12% at 60% 60%,#c96040 0%,#8a3018 60%,transparent 100%),
    linear-gradient(180deg,
      #d4b896 0%,#c9a878 6%,#d4b896 12%,
      #b8946a 18%,#d4b896 24%,#c9a878 30%,
      #e0c8a0 38%,#d4b896 46%,#b8946a 54%,
      #d4b896 62%,#e0c8a0 70%,#c9a878 78%,
      #d4b896 86%,#b8946a 92%,#d4b896 100%);
  box-shadow:
    inset -4px -4px 7px rgba(0,0,0,.55),
    inset 2px 2px 5px rgba(255,240,200,.25),
    0 0 12px rgba(212,165,116,.7);
}

/* SATURN — mit Ring */
.p-saturn{
  background:
    linear-gradient(180deg,
      #f0dca8 0%,#e0c890 15%,#d4b878 30%,
      #e8d098 45%,#d4b878 60%,#e8d098 75%,
      #d4b878 88%,#c9a050 100%);
  box-shadow:
    inset -3px -3px 5px rgba(0,0,0,.45),
    inset 2px 2px 4px rgba(255,240,180,.35),
    0 0 10px rgba(232,200,122,.7);
  overflow:visible;
}
.p-saturn::after{
  content:'';position:absolute;
  top:50%;left:50%;
  width:230%;height:34%;
  transform:translate(-50%,-50%) rotate(-22deg);
  border-radius:50%;
  border:2px solid rgba(240,220,168,.75);
  box-shadow:
    inset 0 0 3px rgba(255,240,180,.6),
    0 0 4px rgba(232,200,140,.5);
  pointer-events:none;
}

/* URANUS — eisblau */
.p-uranus{
  background:
    linear-gradient(180deg,
      #d4f4f4 0%,#b8ecec 20%,#a0dde0 40%,
      #b8ecec 60%,#d4f4f4 80%,#a0d8dc 100%);
  box-shadow:
    inset -3px -3px 5px rgba(0,0,0,.4),
    inset 2px 2px 4px rgba(220,255,255,.4),
    0 0 10px rgba(125,232,232,.7);
}

/* NEPTUN — tiefblau mit Sturm */
.p-neptun{
  background:
    radial-gradient(ellipse 20% 12% at 38% 55%,#1a2a6a 0%,transparent 100%),
    radial-gradient(circle at 30% 25%,#8ac0ff 0%,transparent 12%),
    radial-gradient(circle at 50% 50%,#4a7ae0 0%,#1a3a9a 55%,#0a1a5a 100%);
  box-shadow:
    inset -3px -3px 5px rgba(0,0,0,.7),
    inset 2px 2px 4px rgba(150,200,255,.35),
    0 0 10px rgba(90,124,232,.7);
}

/* MOND — kreist um Erde */
.moon-wrapper{
  position:absolute;top:50%;left:50%;
  width:0;height:0;
  animation:moonOrbit 3s linear infinite;
}
.moon{
  position:absolute;top:-3px;left:14px;
  width:6px;height:6px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#f0f0f0,#a0a0a0 60%,#606060 100%);
  box-shadow:inset -1px -1px 2px rgba(0,0,0,.5),0 0 4px rgba(200,200,200,.7);
}
@keyframes moonOrbit{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* ═════════ TOPBAR ═════════ */
#topbar{
  position:fixed;top:var(--safe-t);left:0;right:0;height:58px;z-index:150;
  display:flex;align-items:center;padding:0 14px;gap:10px;
  background:linear-gradient(180deg,rgba(5,10,20,.95),rgba(5,10,20,.5));
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-bottom:1.5px solid var(--border);
  box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 30px var(--glow);
}
#topbar .logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;flex-shrink:0;
  box-shadow:0 0 20px var(--glow),0 0 40px rgba(180,120,255,.3);
  transition:transform .2s;
}
#topbar .logo:active{transform:scale(.94)}
#topbar .title{font-size:15px;font-weight:800;letter-spacing:.4px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
#topbar .subtitle{font-size:10px;color:var(--muted);margin-top:1px}
#topbar .spacer{flex:1}
.icon-btn{
  min-width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,229,255,.08);border:1.5px solid var(--border);
  font-size:18px;transition:all .2s;
}
.icon-btn:active{background:rgba(0,229,255,.25);transform:scale(.94)}

/* ═════════ SIDEBAR ═════════ */
#sidebar{
  position:fixed;top:calc(var(--safe-t) + 58px);left:0;bottom:calc(var(--safe-b) + 62px);
  width:82px;z-index:140;padding:14px 6px;overflow-y:auto;overflow-x:hidden;
  background:linear-gradient(180deg,rgba(10,25,45,.85),rgba(5,12,22,.9));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1.5px solid var(--border);
  display:flex;flex-direction:column;gap:8px;
  transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:6px 0 24px rgba(0,0,0,.4);
}
#sidebar.hidden{transform:translateX(-100%)}
.nav-btn{
  width:70px;height:64px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(0,229,255,.05);border:1.5px solid rgba(0,229,255,.18);
  font-size:22px;transition:all .2s;flex-shrink:0;
}
.nav-btn:active{background:rgba(0,229,255,.25);transform:scale(.95)}
.nav-btn.active{background:rgba(0,229,255,.2);border-color:var(--primary);box-shadow:0 0 16px var(--glow)}
.nav-btn .lbl{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.nav-btn.active .lbl{color:var(--primary)}

/* ═════════ WINDOWS ═════════ */
#winLayer{position:fixed;inset:0;z-index:200;pointer-events:none;
  padding-top:calc(var(--safe-t) + 58px);padding-left:82px}
.win{
  position:absolute;pointer-events:auto;
  min-width:300px;min-height:200px;
  max-width:calc(100vw - 100px);max-height:calc(100vh - 130px);
  background:linear-gradient(160deg,rgba(10,25,45,.94),rgba(8,18,35,.97));
  backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  border:1.5px solid var(--border);border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px var(--glow);
  display:flex;flex-direction:column;overflow:hidden;z-index:200;
}
.win.active{z-index:250;box-shadow:0 25px 80px rgba(0,0,0,.8),0 0 60px var(--glow)}
.win-head{
  height:48px;display:flex;align-items:center;padding:0 10px;gap:8px;
  background:linear-gradient(180deg,rgba(0,229,255,.12),rgba(0,229,255,.03));
  border-bottom:1.5px solid var(--border);flex-shrink:0;cursor:grab;
}
.win-head:active{cursor:grabbing}
.win-head .wtitle{flex:1;font-size:13px;font-weight:800;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;padding:0 100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-btn{
  min-width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;background:rgba(0,229,255,.1);border:1.5px solid var(--border);
  position:relative;z-index:999999;
}
.win-btn.close:hover,.win-btn.close:active{background:rgba(255,80,80,.4);border-color:#ff5050}
.win-body{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.6}

/* ═════════ BOTTOM ═════════ */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;height:62px;z-index:150;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 12px;padding-bottom:calc(var(--safe-b) + 8px);
  background:linear-gradient(0deg,rgba(5,10,20,.95),rgba(5,10,20,.5));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1.5px solid var(--border);
}
.bb-btn{
  height:44px;padding:0 16px;border-radius:14px;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.1));
  border:1.5px solid var(--border);
  font-size:14px;font-weight:700;
  box-shadow:0 4px 16px rgba(0,229,255,.2);transition:all .2s;
}
.bb-btn:active{transform:scale(.95);background:linear-gradient(135deg,rgba(0,229,255,.35),rgba(180,120,255,.25))}
.bb-btn.pink{border-color:rgba(255,120,200,.5);background:linear-gradient(135deg,rgba(255,120,200,.2),rgba(180,120,255,.15))}

/* ═════════ TOASTS ═════════ */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 100px);z-index:1000;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100vw - 40px);max-width:380px;
}
.toast{
  background:linear-gradient(135deg,rgba(0,229,255,.95),rgba(180,120,255,.95));
  color:#001;padding:12px 20px;border-radius:14px;
  font-size:13px;font-weight:800;text-align:center;
  box-shadow:0 8px 32px rgba(0,229,255,.5);
  animation:toastIn .3s ease-out;max-width:100%;
  border:1.5px solid rgba(255,255,255,.3);
}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.out{animation:toastOut .3s ease-in forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

/* ═════════ WELCOME ═════════ */
#welcomeBanner{
  position:fixed;top:calc(var(--safe-t) + 70px);left:50%;transform:translateX(-50%) translateY(-20px);
  z-index:1100;padding:14px 24px;border-radius:16px;
  background:linear-gradient(135deg,rgba(0,229,255,.95),rgba(180,120,255,.95));
  color:#001;font-size:14px;font-weight:800;text-align:center;
  box-shadow:0 12px 40px rgba(0,229,255,.6),0 0 60px rgba(180,120,255,.4);
  border:2px solid var(--gold);opacity:0;pointer-events:none;
  transition:all .4s cubic-bezier(.2,.9,.3,1);max-width:calc(100vw - 40px);
}
#welcomeBanner.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ═════════ MODAL ═════════ */
#modalLayer{
  position:fixed;inset:0;z-index:1100;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
}
#modalLayer.show{display:flex}
.modal{
  background:linear-gradient(160deg,rgba(10,25,45,.98),rgba(8,18,35,.99));
  border:1.5px solid var(--border);border-radius:18px;
  max-width:460px;width:100%;max-height:80vh;overflow-y:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 60px var(--glow);padding:22px;
}

/* ═════════ UTILS ═════════ */
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{padding:10px 16px;border-radius:12px;background:rgba(0,229,255,.12);
  border:1.5px solid var(--border);font-weight:600;font-size:13px;
  transition:all .2s;min-height:40px}
.btn:active{background:rgba(0,229,255,.3);transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#001;border:none;box-shadow:0 4px 16px var(--glow)}
.btn.danger{background:rgba(255,80,80,.2);border-color:rgba(255,80,80,.5)}
.inp{width:100%;padding:10px 14px;border-radius:12px;
  background:rgba(0,229,255,.08);border:1.5px solid rgba(0,229,255,.3);
  font-size:14px;outline:none;transition:all .2s;margin-bottom:10px}
.inp:focus{border-color:var(--primary);box-shadow:0 0 12px var(--glow)}
.card{background:linear-gradient(160deg,rgba(0,229,255,.06),rgba(180,120,255,.03));
  border:1.5px solid rgba(0,229,255,.2);
  border-radius:14px;padding:14px;margin-bottom:10px}
.card:hover{border-color:var(--primary);box-shadow:0 0 16px var(--glow)}
.list-item{padding:12px 14px;border-radius:12px;background:rgba(0,229,255,.06);
  border:1.5px solid rgba(0,229,255,.15);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
.grad-text{background:linear-gradient(90deg,var(--primary),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* Registry */
.reg-cat{padding:12px 14px;border-radius:14px;margin-bottom:8px;
  background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(180,120,255,.04));
  border:1.5px solid rgba(0,229,255,.2);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:12px}
.reg-cat:active{transform:scale(.98)}
.reg-cat .letter{width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#001;
  box-shadow:0 0 10px var(--glow)}
.reg-cat .info{flex:1}
.reg-cat .name{font-weight:700;font-size:13px}
.reg-cat .meta{font-size:11px;color:var(--muted);margin-top:2px}

.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;margin-top:10px}
.app-tile{
  aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.1));
  border:1.5px solid rgba(0,229,255,.3);font-size:22px;
  transition:all .2s;cursor:pointer;padding:6px;
}

<script>
'use strict';
window.HalDo = window.HalDo || {};

/* ═════════ STORAGE ═════════ */
HalDo.store = {
  get(k, d){ try{ const v = localStorage.getItem('haldo_'+k+'_v1'); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('haldo_'+k+'_v1', JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('haldo_'+k+'_v1'); }catch(e){} }
};

/* ═════════ PREFS ═════════ */
HalDo.prefs = {
  get(k, d){ return HalDo.store.get('pref_'+k, d); },
  set(k, v){ HalDo.store.set('pref_'+k, v); this.apply(); },
  apply(){
    const r = document.documentElement.style;
    r.setProperty('--font-scale', this.get('fontScale', 1));
    r.setProperty('--blur', this.get('blur', 24) + 'px');
    r.setProperty('--glow-str', this.get('glowStr', 1));
    const cos = document.getElementById('cosmos');
    if (cos){
      cos.classList.toggle('hide-stars', !this.get('showStars', true));
      cos.classList.toggle('hide-sun', !this.get('showSun', true));
      cos.classList.toggle('hide-planets', !this.get('showPlanets', true));
      cos.classList.toggle('hide-moon', !this.get('showMoon', true));
    }
  }
};

/* ═════════ THEME ═════════ */
HalDo.theme = {
  current: 'holo',
  presets: {
    holo:{ primary:'#00e5ff', secondary:'#4da8ff', accent:'#b478ff', name:'Holo', emoji:'💠' },
    cyborg:{ primary:'#ff78c8', secondary:'#b478ff', accent:'#ff4488', name:'Cyborg', emoji:'⚡' },
    gold:{ primary:'#ffd700', secondary:'#ffb000', accent:'#ff8c00', name:'Gold', emoji:'👑' },
    matrix:{ primary:'#00ff88', secondary:'#00cc66', accent:'#88ff00', name:'Matrix', emoji:'🟢' },
    crimson:{ primary:'#ff5555', secondary:'#ff7788', accent:'#ff0088', name:'Crimson', emoji:'🔴' },
    sunset:{ primary:'#ff8800', secondary:'#ffaa44', accent:'#ffcc00', name:'Sunset', emoji:'🌅' },
    ice:{ primary:'#a8e0ff', secondary:'#e0f4ff', accent:'#ffffff', name:'Ice', emoji:'❄️' }
  },
  apply(name){
    const p = this.presets[name] || this.presets.holo;
    const r = document.documentElement.style;
    r.setProperty('--primary', p.primary);
    r.setProperty('--secondary', p.secondary);
    r.setProperty('--accent', p.accent);
    r.setProperty('--glow', p.primary + '88');
    r.setProperty('--border', p.primary + '66');
    this.current = name;
    HalDo.prefs.set('theme', name);
    document.querySelectorAll('.chip[data-t]').forEach(c => c.classList.toggle('active', c.dataset.t === name));
  },
  toggleCyborg(){
    this.apply(this.current === 'cyborg' ? 'holo' : 'cyborg');
    HalDo.toast(this.current === 'cyborg' ? '⚡ CYBORG MODE' : '💠 Holo Mode');
  },
  init(){ this.apply(HalDo.prefs.get('theme', 'holo')); }
};

/* ═════════ TOAST ═════════ */
HalDo.toast = function(msg, ms){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, ms || 2400);
};

/* ═════════ WELCOME ═════════ */
HalDo.welcome = function(appName){

  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.remove('show'), 3200);
};

/* ═════════ WINDOW MANAGER ═════════ */
HalDo.win = {
  zTop: 200,
  open(id, opts){
    opts = opts || {};
    const existing = document.getElementById('win-'+id);
    if (existing){ this.focus(id); return existing; }
    const layer = document.getElementById('winLayer');
    const w = document.createElement('div');
    w.className = 'win active'; w.id = 'win-'+id;
    const isMobile = window.innerWidth < 700;
    const W = Math.min(opts.w || (isMobile ? window.innerWidth - 96 : 520), window.innerWidth - 100);
    const H = Math.min(opts.h || (isMobile ? window.innerHeight - 220 : 560), window.innerHeight - 130);
    const offset = (this.zTop - 200) % 8 * 24;
    w.style.width = W + 'px'; w.style.height = H + 'px';
    w.style.left = Math.max(90, (window.innerWidth - W) / 2 + offset - 40) + 'px';
    w.style.top = Math.max(70, (window.innerHeight - H) / 2 + offset - 30) + 'px';
    w.innerHTML = '<div class="win-head"><button class="win-btn close">✕</button><div class="wtitle">'+(opts.title||'Fenster')+'</div><button class="win-btn min">▁</button></div><div class="win-body"></div>';
    layer.appendChild(w);
    this.zTop++; w.style.zIndex = this.zTop;
    w.querySelector('.close').onclick = e => { e.stopPropagation(); this.close(id); };
    w.querySelector('.min').onclick = e => { e.stopPropagation(); w.style.display = 'none'; setTimeout(() => this.close(id), 100); };
    w.addEventListener('mousedown', () => this.focus(id));
    w.addEventListener('touchstart', () => this.focus(id), { passive: true });
    this.drag(w, w.querySelector('.win-head'));
    return w;
  },
  focus(id){
    document.querySelectorAll('.win').forEach(w => w.classList.remove('active'));
    const w = document.getElementById('win-'+id);
    if (w){ w.classList.add('active'); this.zTop++; w.style.zIndex = this.zTop; }
  },
  close(id){ const w = document.getElementById('win-'+id); if (w) w.remove(); },
  body(id){ const w = document.getElementById('win-'+id); return w ? w.querySelector('.win-body') : null; },
  drag(win, handle){
    let sx, sy, ox, oy, dragging = false;
    const start = (e) => {
      const t = e.touches ? e.touches[0] : e;
      const rect = handle.getBoundingClientRect();
      const x = t.clientX - rect.left;
      if (x < 100 || x > rect.width - 100) return;
      dragging = true; sx = t.clientX; sy = t.clientY;
      ox = win.offsetLeft; oy = win.offsetTop;
      if (e.cancelable) e.preventDefault();
    };
    const move = (e) => {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      let nx = ox + (t.clientX - sx), ny = oy + (t.clientY - sy);
      nx = Math.max(85, Math.min(nx, window.innerWidth - 100));
      ny = Math.max(62, Math.min(ny, window.innerHeight - 80));
      win.style.left = nx + 'px'; win.style.top = ny + 'px';
      if (e.cancelable) e.preventDefault();
    };
    const end = () => { dragging = false; };
    handle.addEventListener('mousedown', start);
    handle.addEventListener('touchstart', start, { passive: false });
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }
};

HalDo.apps.aiChat = {
  open(){
    HalDo.win.open('aiChat', { title:'💬 HalDo AI Chat', w: 540, h: 620 });
    HalDo.welcome('HalDo AI Chat');
    const b = HalDo.win.body('aiChat');
    const history = HalDo.store.get('chat', []);
    b.innerHTML = '<div id="chatLog" style="height:calc(100% - 60px);overflow-y:auto;padding-right:6px;margin-bottom:10px"></div><div style="display:flex;gap:8px"><input class="inp" id="chatInput" placeholder="Schreib etwas..." style="margin:0;flex:1"><button class="btn primary" id="chatSend" style="min-width:60px">➤</button></div>';
    const log = b.querySelector('#chatLog');
    const addMsg = (role, text) => {
      const d = document.createElement('div');
      const isUser = role === 'user';
      d.style.cssText = 'margin-bottom:10px;padding:10px 14px;border-radius:14px;max-width:80%;font-size:13px;line-height:1.5;' + (isUser ? 'background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.2));margin-left:auto;border:1.5px solid rgba(0,229,255,.4)' : 'background:rgba(180,120,255,.15);border:1.5px solid rgba(180,120,255,.3)');
      d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight;
    };
    history.forEach(m => addMsg(m.role, m.text));
    const send = () => {
      const inp = b.querySelector('#chatInput');
      const text = inp.value.trim(); if (!text) return;
      addMsg('user', text); history.push({role:'user', text}); inp.value = '';
      setTimeout(() => {
        let reply = '🤖 Ich verstehe dich, Bruder. AI-Anbindung kommt in Phase 4.';
        const t = text.toLowerCase();
        if (/\b(hi|hallo|hey|haldo)\b/.test(t)) reply = '👋 Hallo Bruder! Willkommen bei HalDo AI OS Professional. Wie kann ich dir helfen?';
        else if (t.includes('zeit')) reply = '🕐 ' + new Date().toLocaleTimeString('de-DE');
        else if (t.includes('datum')) reply = '📅 ' + new Date().toLocaleDateString('de-DE', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
        else if (t.includes('theme')) reply = '🎨 Aktuell: ' + HalDo.theme.presets[HalDo.theme.current].name;
        else if (t.includes('app')) reply = '📱 Registry hat 375 Apps in 26 Kategorien A–Z.';
        addMsg('assistant', reply); history.push({role:'assistant', text: reply});
        HalDo.store.set('chat', history.slice(-50));
      }, 400);
    };
    b.querySelector('#chatSend').onclick = send;
    b.querySelector('#chatInput').onkeydown = e => { if (e.key === 'Enter') send(); };
    b.querySelector('#chatInput').focus();
  }
};

HalDo.apps.avatar = {
  open(){

  },
  speak(text){
    const face = document.getElementById('avFace');
    const status = document.getElementById('avStatus');
    if (!face) return;
    face.classList.add('speaking');
    if (status) status.textContent = '🔊 Speaking...';
    if ('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'de-DE';
      u.onend = () => { face.classList.remove('speaking'); if (status) status.textContent = 'Bereit · Idle'; };
      speechSynthesis.speak(u);
    } else {
      setTimeout(() => { face.classList.remove('speaking'); if (status) status.textContent = 'Bereit · Idle'; }, 2000);
    }
  },
  listen(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return HalDo.toast('❌ Spracherkennung nicht verfügbar');
    const r = new SR(); r.lang = 'de-DE';
    const status = document.getElementById('avStatus');
    if (status) status.textContent = '🎤 Listening...';
    r.onresult = (e) => {
      const txt = e.results[0][0].transcript;
      HalDo.toast('🎤 ' + txt);
      if (status) status.textContent = '🗣️ "' + txt + '"';
      HalDo.apps.avatar.speak('Du hast gesagt: ' + txt);
    };

    r.start();
  }
};

    this.render();
  },
  add(){
    const inp = document.getElementById('habitInp'); const t = inp.value.trim(); if (!t) return;
    const list = HalDo.store.get('habits', []);
    list.push({ id: Date.now(), name: t, checks: [] });
    HalDo.store.set('habits', list); inp.value = ''; this.render();
  },
  check(id){
    const list = HalDo.store.get('habits', []);
    const today = new Date().toISOString().split('T')[0];
    list.forEach(h => { if (h.id === id && !h.checks.includes(today)) h.checks.push(today); });
    HalDo.store.set('habits', list); this.render();
  },
  del(id){ HalDo.store.set('habits', HalDo.store.get('habits', []).filter(h => h.id !== id)); this.render(); },
  streak(h){
    const days = [...h.checks].sort().reverse();
    let s = 0, d = new Date();
    for (let i = 0; i < 365; i++) {
      const key = d.toISOString().split('T')[0];
      if (days.includes(key)) { s++; d.setDate(d.getDate() - 1); } else break;
    }
    return s;
  },
  render(){
    const el = document.getElementById('habitsList'); if (!el) return;
    const list = HalDo.store.get('habits', []);
    const today = new Date().toISOString().split('T')[0];
    el.innerHTML = list.length ? list.map(h => '<div class="list-item"><span style="flex:1">'+h.name+' <span style="color:var(--primary);font-weight:700">🔥 '+this.streak(h)+'</span></span><button class="btn '+(h.checks.includes(today)?'primary':'')+'" style="min-height:34px;padding:6px 12px;font-size:12px" onclick="HalDo.apps.habits.check('+h.id+')">'+(h.checks.includes(today)?'✓':'Heute')+'</button><button class="win-btn close" style="min-width:32px;height:32px;font-size:14px" onclick="HalDo.apps.habits.del('+h.id+')">✕</button></div>').join('') : '<div class="empty">Keine Gewohnheiten</div>';

};

  ctx: null,
  tone(n){
    const freqs = { C:261.63, D:293.66, E:329.63, F:349.23, G:392.00, A:440.00, B:493.88 };
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.frequency.value = freqs[n];
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
    osc.start(); osc.stop(this.ctx.currentTime + 0.4);
    const now = document.getElementById('mNow'); if (now) now.textContent = '🎵 ' + n;
  }

/* ═════════ COSMOS INIT ═════════ */
function initCosmos(){
  const scale = document.getElementById('cosmos-scale');
  if (!scale){ console.error('cosmos-scale not found'); return; }
  
  // 150 Sterne
  for (let i = 0; i < 150; i++){
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 0.4;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    if (Math.random() > 0.85){
      const c = ['#ffe8b0','#b0e8ff','#ffb0e8'][Math.floor(Math.random() * 3)];
      s.style.background = c;
      s.style.boxShadow = '0 0 4px ' + c;
    }
    scale.appendChild(s);
  }
  
  // Sonne
  const sun = document.createElement('div');
  sun.id = 'sun';
  scale.appendChild(sun);
  
  // Planeten (Durchmesser in 1100x1100 Koordinaten)
  const planets = [
    { cls:'p-mercury', r:100, s:6,  t:8,   dur:8,   moon:false },
    { cls:'p-venus',   r:140, s:10, t:10,  dur:14,  moon:false },
    { cls:'p-earth',   r:190, s:11, t:11,  dur:22,  moon:true },
    { cls:'p-mars',    r:240, s:8,  t:8,   dur:30,  moon:false },
    { cls:'p-jupiter', r:310, s:26, t:26,  dur:45,  moon:false },
    { cls:'p-saturn',  r:390, s:22, t:22,  dur:60,  moon:false },
    { cls:'p-uranus',  r:460, s:16, t:16,  dur:80,  moon:false },
    { cls:'p-neptun',  r:490, s:15, t:15,  dur:100, moon:false }
  ];
  
  planets.forEach(p => {
    // Orbit-Ring
    const orbit = document.createElement('div');
    orbit.className = 'orbit-wrapper';
    orbit.style.width = (p.r * 2) + 'px';
    orbit.style.height = (p.r * 2) + 'px';
    orbit.style.marginTop = '-' + p.r + 'px';
    orbit.style.marginLeft = '-' + p.r + 'px';
    scale.appendChild(orbit);
    
    // Rotierender Planet-Container
    const orbitPlanet = document.createElement('div');
    orbitPlanet.className = 'orbit-planet';
    orbitPlanet.style.width = p.s + 'px';
    orbitPlanet.style.height = p.s + 'px';
    orbitPlanet.style.marginLeft = '-' + (p.s/2) + 'px';
    orbitPlanet.style.marginTop = '-' + (p.s/2) + 'px';
    orbitPlanet.style.animationDuration = p.dur + 's';
    // The planet orbits at radius r from center
    // Using transform-origin trick: instead, position at top and rotate parent
    orbitPlanet.style.left = '50%';
    orbitPlanet.style.top = '0';
    orbitPlanet.style.transform = 'translate(-50%, -50%)';
    // But we need it to rotate around the orbit center. Use animation on a wrapper.
    // Actually simplest: animate the orbitPlanet itself with rotate around center
    // But that rotates the planet. Let me use a different technique.
    
    // Better: the orbit-wrapper has position:absolute at center. Its child at top.
    // Rotating orbit-wrapper rotates the child around center.
    // So let me instead rotate orbit-wrapper, and position planet at top of it.
    
    // Redo: rotate the ORBIT itself. But orbit is border-only, invisible.
    // No - we need a wrapper that rotates, containing the planet at its top edge.
    
    // Simplest working approach: use the animation on the planet directly with rotate+translate
    orbitPlanet.style.animation = 'planetOrbit ' + p.dur + 's linear infinite';
    orbitPlanet.style.transformOrigin = 'center center';
    
    // Actually the cleanest is: put planet at top center of a rotating wrapper
    // The wrapper rotates around its center (which is the sun)
    orbit.style.animation = 'orbitRotate ' + p.dur + 's linear infinite';
    orbit.style.borderColor = 'rgba(255,255,255,0.06)';
    orbit.style.animationTimingFunction = 'linear';
    orbit.style.animationIterationCount = 'infinite';
    
    const planet = document.createElement('div');
    planet.className = 'planet ' + p.cls;
    planet.style.width = p.s + 'px';
    planet.style.height = p.s + 'px';
    
    // For Saturn, ring needs to fit; make wrapper bigger
    if (p.cls === 'p-saturn') {
      planet.style.overflow = 'visible';
    }
    
    // Moon around Earth
    if (p.moon){
      const moonWrap = document.createElement('div');
      moonWrap.className = 'moon-wrapper';
      const moon = document.createElement('div');
      moon.className = 'moon';
      moonWrap.appendChild(moon);
      planet.appendChild(moonWrap);
    }
    
    orbit.appendChild(planet);
    scale.appendChild(orbit);
  });
  
  console.log('🪐 Cosmos init: 150 stars, sun, 8 planets, moon');
}

    if (HalDo.prefs.get('welcome', true)){
      setTimeout(() => HalDo.welcome('HalDo AI OS Professional'), 500);
    }
    setTimeout(() => { try{ HalDo.apps.dashboard.open(); }catch(e){ console.error('Dashboard:', e); } }, 1200);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') HalDo.closeModal(); });
    console.log('%c🦚 HalDo AI OS Pro Max v125 — READY', 'color:#00e5ff;font-size:14px;font-weight:bold');
  } catch(e){ console.error('Init failed:', e); }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
