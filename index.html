<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#00e5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS – Real 3D Cosmos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --primary:#00e5ff;--primary-rgb:0,229,255;
  --secondary:#4da8ff;--accent:#b478ff;
  --gold:#ffd700;--gold-rgb:255,215,0;
  --bg-0:#01010a;--panel:rgba(8,15,35,0.72);
  --border:rgba(0,229,255,0.38);--border-strong:rgba(0,229,255,0.75);
  --text:#e8f6ff;--text-dim:#7fa5d0;
  --glow-sm:0 0 14px rgba(0,229,255,0.5);
  --glow-md:0 0 28px rgba(0,229,255,0.55);
  --blur:26px;--radius-w:18px;--radius-b:14px;
  --topbar-h:58px;
  --safe-top:max(env(safe-area-inset-top, 0px), 24px);
  --safe-bottom:env(safe-area-inset-bottom, 0px);
  --safe-left:env(safe-area-inset-left, 0px);
  --safe-right:env(safe-area-inset-right, 0px);
}

[data-theme="cyborg"]{--primary:#ff78c8;--primary-rgb:255,120,200;--secondary:#b478ff;--accent:#ff78c8;--border:rgba(255,120,200,.42);--border-strong:rgba(255,120,200,.8);--glow-sm:0 0 14px rgba(255,120,200,.55);--glow-md:0 0 28px rgba(255,120,200,.6)}
[data-theme="gold"]{--primary:#ffd700;--primary-rgb:255,215,0;--secondary:#ffb300;--accent:#ff9500;--border:rgba(255,215,0,.42);--border-strong:rgba(255,215,0,.8);--glow-sm:0 0 14px rgba(255,215,0,.55);--glow-md:0 0 28px rgba(255,215,0,.6)}
[data-theme="matrix"]{--primary:#00ff88;--primary-rgb:0,255,136;--secondary:#00cc66;--accent:#00ffaa;--border:rgba(0,255,136,.42);--border-strong:rgba(0,255,136,.8);--glow-sm:0 0 14px rgba(0,255,136,.55);--glow-md:0 0 28px rgba(0,255,136,.6)}
[data-theme="crimson"]{--primary:#ff3355;--primary-rgb:255,51,85;--secondary:#ff6644;--accent:#ff0055;--border:rgba(255,51,85,.42);--border-strong:rgba(255,51,85,.8);--glow-sm:0 0 14px rgba(255,51,85,.55);--glow-md:0 0 28px rgba(255,51,85,.6)}
[data-theme="sunset"]{--primary:#ff9900;--primary-rgb:255,153,0;--secondary:#ff5599;--accent:#ffcc00;--border:rgba(255,153,0,.42);--border-strong:rgba(255,153,0,.8);--glow-sm:0 0 14px rgba(255,153,0,.55);--glow-md:0 0 28px rgba(255,153,0,.6)}
[data-theme="ice"]{--primary:#aee0ff;--primary-rgb:174,224,255;--secondary:#e6f7ff;--accent:#cceeff;--border:rgba(174,224,255,.45);--border-strong:rgba(174,224,255,.85);--glow-sm:0 0 14px rgba(174,224,255,.55);--glow-md:0 0 28px rgba(174,224,255,.6);--text:#f4fbff}

html,body{height:100%;overflow:hidden;background:#000}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  color:var(--text);user-select:none;-webkit-font-smoothing:antialiased;
  position:fixed;inset:0;letter-spacing:.15px;
}

#cosmosBg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}

/* ═══ WELCOME SCREEN ═══ */
#welcome{
  position:fixed;inset:0;z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;padding:40px 24px;text-align:center;
  background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .6s;
}
#welcome.hide{opacity:0;pointer-events:none}
#welcome .globe{
  font-size:90px;
  filter:drop-shadow(0 0 40px var(--primary));
  animation:globeFloat 4s ease-in-out infinite;
}
@keyframes globeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
#welcome h1{
  font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent),var(--primary));
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 5s linear infinite;
}
@keyframes shimmer{to{background-position:-300% 0}}
#welcome h2{font-size:clamp(14px,2vw,18px);color:var(--text);font-weight:400;line-height:1.6;max-width:600px;opacity:.9}
#welcome .presented{font-size:11px;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase}
#welcome .presented b{color:var(--gold);font-weight:700}
#welcome .enter-btn{
  margin-top:16px;padding:16px 48px;border-radius:32px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#000;font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer;
  border:none;box-shadow:0 8px 30px rgba(var(--primary-rgb),.6);
  transition:all .25s;
}
#welcome .enter-btn:hover{transform:scale(1.05);box-shadow:0 12px 40px rgba(var(--primary-rgb),.8)}
#welcome .enter-btn:active{transform:scale(.96)}

/* ═══ APP SPLASH ═══ */
#appSplash{
  position:fixed;inset:0;z-index:99999;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:18px;
  background:radial-gradient(circle at center,rgba(0,229,255,.18) 0%,rgba(5,8,16,.96) 70%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
#appSplash.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.splash-ic{
  font-size:110px;filter:drop-shadow(0 0 40px var(--primary));
  animation:splashSpin 1.2s ease-out;
}
@keyframes splashSpin{0%{transform:scale(0) rotate(0)}50%{transform:scale(1.15) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
.splash-nm{
  font-size:28px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(90deg,var(--gold),#ffaa00);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.splash-pr{font-size:10px;color:var(--text-dim);letter-spacing:4px;text-transform:uppercase}
.splash-pr b{color:var(--gold)}
.splash-greet{font-size:12px;color:var(--text);text-align:center;max-width:80vw;line-height:1.6;margin-top:8px;opacity:.85}

/* ═══ TOPBAR – SAFE AREA FIX ═══ */
#topbar{
  position:fixed;top:0;left:0;right:0;
  height:calc(var(--topbar-h) + var(--safe-top));
  padding:var(--safe-top) calc(16px + var(--safe-right)) 0 calc(16px + var(--safe-left));
  z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,rgba(8,15,35,0.92),rgba(8,15,35,0.62));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border-bottom:1px solid var(--border);
  box-shadow:0 8px 32px rgba(0,0,0,.45);
  box-sizing:border-box;
}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;transition:all .25s}
.brand:active{transform:scale(.96)}
.brand-logo{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0%,transparent 40%),
    radial-gradient(circle at 70% 70%,var(--accent),var(--primary) 45%,var(--secondary) 75%,#002040);
  box-shadow:0 0 18px rgba(var(--primary-rgb),.7),inset -4px -4px 12px rgba(0,0,0,.5),inset 4px 4px 12px rgba(255,255,255,.2);
  animation:spinGlobe 20s linear infinite;
}
@keyframes spinGlobe{to{transform:rotate(360deg)}}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.3px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:8px;color:var(--text-dim);letter-spacing:2.5px;margin-top:-1px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:7px}
.tb-btn{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.08),rgba(var(--primary-rgb),.02));
  border:1.5px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.tb-btn:hover{background:rgba(var(--primary-rgb),.15);box-shadow:var(--glow-sm)}
.tb-btn:active{transform:scale(.92)}
.tb-clock{
  font-family:"SF Mono",ui-monospace,monospace;font-size:12px;color:var(--primary);
  padding:0 10px;font-weight:700;letter-spacing:.8px;
  text-shadow:0 0 8px rgba(var(--primary-rgb),.7);
  background:rgba(var(--primary-rgb),.08);border-radius:8px;height:30px;
  display:flex;align-items:center;border:1px solid var(--border);
}

/* ═══ SIDEBAR ═══ */
#sidebar{
  position:fixed;
  top:calc(var(--topbar-h) + var(--safe-top));
  left:0;bottom:0;
  width:220px;
  padding:12px 10px calc(12px + var(--safe-bottom)) 10px;
  z-index:900;
  background:linear-gradient(180deg,rgba(8,15,35,0.92),rgba(8,15,35,0.75));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border-right:1.5px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
  transition:transform .35s cubic-bezier(.4,.14,.3,1);
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
  box-sizing:border-box;
}
#sidebar.collapsed{transform:translateX(-100%)}
.side-section{margin-bottom:14px}
.side-label{font-size:9px;color:var(--text-dim);letter-spacing:2.5px;text-transform:uppercase;padding:6px 10px;font-weight:800;opacity:.7}
.side-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 11px;margin:2px 0;border-radius:11px;
  background:transparent;border:1px solid transparent;
  color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;
  transition:all .2s;text-align:left;min-height:42px;
}
.side-btn:hover{background:rgba(var(--primary-rgb),.12);border-color:var(--border);box-shadow:var(--glow-sm)}
.side-btn:active{transform:scale(.97)}
.side-btn .ico{font-size:16px;width:22px;text-align:center}
#sidebar::-webkit-scrollbar{width:6px}
#sidebar::-webkit-scrollbar-thumb{background:var(--primary);border-radius:3px}

/* ═══ DESKTOP ═══ */
#desktop{
  position:fixed;
  top:calc(var(--topbar-h) + var(--safe-top));
  left:220px;right:0;bottom:var(--safe-bottom);
  z-index:1;overflow:hidden;
  transition:left .35s cubic-bezier(.4,.14,.3,1);
}
#desktop.full{left:0}

/* ═══ WINDOWS ═══ */
.window{
  position:absolute;
  min-width:300px;min-height:220px;
  background:linear-gradient(135deg,rgba(8,15,35,0.82),rgba(8,15,35,0.68));
  backdrop-filter:blur(var(--blur)) saturate(180%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(180%);
  border:1.5px solid var(--border);
  border-radius:var(--radius-w);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 30px rgba(var(--primary-rgb),.15);
  display:flex;flex-direction:column;
  z-index:200;overflow:hidden;
  animation:winOpen .3s cubic-bezier(.4,.14,.3,1);
  will-change:transform;
}
.window.active{border-color:var(--border-strong);box-shadow:0 20px 70px rgba(0,0,0,.7),0 0 50px rgba(var(--primary-rgb),.35);z-index:250}
@keyframes winOpen{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.win-header{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;cursor:grab;user-select:none;
  background:linear-gradient(90deg,rgba(var(--primary-rgb),.14),rgba(var(--primary-rgb),.02));
  border-bottom:1.5px solid var(--border);
  min-height:48px;flex-shrink:0;
}
.win-header.dragging{cursor:grabbing}
.win-title{font-size:13px;font-weight:700;flex:1;padding-left:4px;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-controls{display:flex;gap:6px;flex-shrink:0}
.win-ctrl{
  width:36px;height:36px;min-width:36px;min-height:36px;border-radius:10px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--text);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-weight:600;position:relative;z-index:999999;
}
.win-ctrl:hover{background:rgba(var(--primary-rgb),.25);box-shadow:var(--glow-sm)}
.win-ctrl.close:hover{background:rgba(255,60,80,.75);border-color:rgba(255,60,80,.9)}
.win-body{
  flex:1;padding:16px;overflow:auto;
  scrollbar-width:thin;scrollbar-color:var(--primary) transparent;
  font-size:13px;line-height:1.55;
}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}

/* ═══ BUTTONS ═══ */
.btn{
  min-height:42px;padding:10px 18px;border-radius:var(--radius-b);
  background:linear-gradient(135deg,rgba(var(--primary-rgb),.2),rgba(var(--primary-rgb),.05));
  border:1.5px solid var(--border);color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .25s;display:inline-flex;align-items:center;gap:7px;justify-content:center;
}
.btn:hover{background:rgba(var(--primary-rgb),.3);box-shadow:var(--glow-sm);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;border-color:transparent;box-shadow:0 4px 14px rgba(var(--primary-rgb),.4)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#ffaa00);color:#000;border-color:transparent}
.input,textarea,select{
  width:100%;min-height:42px;padding:10px 14px;border-radius:var(--radius-b);
  background:rgba(0,0,0,.35);border:1.5px solid var(--border);
  color:var(--text);font-size:13px;font-family:inherit;
  transition:all .25s;outline:none;
}
.input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 20px rgba(var(--primary-rgb),.35)}
textarea{min-height:100px;resize:vertical;font-family:inherit}

.toggle{position:relative;display:inline-block;width:48px;height:27px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;border-radius:14px;background:rgba(0,0,0,.55);border:1.5px solid var(--border);cursor:pointer;transition:.3s}
.toggle .slider::before{content:"";position:absolute;height:19px;width:19px;left:2px;top:2px;background:linear-gradient(135deg,#888,#aaa);border-radius:50%;transition:.3s}
.toggle input:checked + .slider{background:rgba(var(--primary-rgb),.45);border-color:var(--primary);box-shadow:0 0 18px rgba(var(--primary-rgb),.5)}
.toggle input:checked + .slider::before{transform:translateX(21px);background:linear-gradient(135deg,var(--primary),#fff);box-shadow:0 0 12px var(--primary)}

.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;
  padding:6px 14px;border-radius:18px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--border);
  color:var(--text);font-size:11px;font-weight:600;cursor:pointer;transition:all .25s;
}
.chip:hover,.chip.on{background:rgba(var(--primary-rgb),.28);border-color:var(--primary);box-shadow:var(--glow-sm)}

.set-section{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(0,0,0,.25)}
.set-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;user-select:none;background:rgba(var(--primary-rgb),.04)}
.set-head:hover{background:rgba(var(--primary-rgb),.1)}
.set-head .letter{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;font-weight:900;font-size:13px;flex-shrink:0}
.set-head .title{flex:1;font-size:13px;font-weight:700}
.set-head .chev{transition:transform .3s;color:var(--primary);font-size:11px}
.set-section.open .chev{transform:rotate(180deg)}
.set-body{display:none;padding:10px 15px 15px}
.set-section.open .set-body{display:block}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);min-height:46px}
.set-row:last-child{border-bottom:none}
.set-row-label{flex:1;font-size:12px}

/* ═══ TOASTS ═══ */
#toasts{
  position:fixed;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  z-index:5000;display:flex;flex-direction:column;gap:9px;align-items:center;
  pointer-events:none;max-width:min(90vw,400px);
}
.toast{
  background:linear-gradient(135deg,rgba(8,15,35,0.92),rgba(8,15,35,0.8));
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1.5px solid var(--primary);border-radius:14px;
  padding:12px 18px;box-shadow:var(--glow-md),0 8px 30px rgba(0,0,0,.5);
  font-size:12px;font-weight:600;color:var(--text);
  animation:toastIn .3s;pointer-events:auto;display:flex;align-items:center;gap:10px;
}
@keyframes toastIn{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{transform:translateY(-24px) scale(.9);opacity:0}}

/* ═══ AVATAR ═══ */
#avatarFab{
  position:fixed;
  bottom:calc(20px + var(--safe-bottom));
  right:calc(20px + var(--safe-right));
  z-index:800;
  width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.3),transparent 50%),radial-gradient(circle,var(--primary) 0%,var(--secondary) 55%,var(--accent) 100%);
  border:2px solid var(--border-strong);
  box-shadow:0 0 28px rgba(var(--primary-rgb),.65),0 0 55px rgba(var(--primary-rgb),.35);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:32px;transition:all .3s;animation:breathe 3.5s ease-in-out infinite;
}
#avatarFab:hover{transform:scale(1.08)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#avatarFab::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1.5px solid var(--border-strong);animation:pulseRing 2.5s ease-out infinite}
@keyframes pulseRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* ═══ CHAT ═══ */
.chat-container{display:flex;flex-direction:column;height:100%;min-height:320px}
.chat-messages{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin}
.chat-msg{padding:10px 14px;border-radius:16px;max-width:85%;font-size:13px;line-height:1.5;animation:msgIn .3s;word-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#001;border-bottom-right-radius:6px;font-weight:500}
.chat-msg.ai{align-self:flex-start;background:rgba(var(--primary-rgb),.15);border:1px solid var(--border);border-bottom-left-radius:6px}
.chat-msg.system{align-self:center;background:rgba(255,215,0,.1);border:1px solid var(--gold);color:var(--gold);font-size:11px;padding:6px 14px;text-align:center;font-weight:600}
.chat-input-row{display:flex;gap:7px;padding-top:12px;border-top:1px solid var(--border);flex-shrink:0}
.chat-input-row input{flex:1}
.chat-input-row .btn{min-width:46px;padding:10px 13px}

/* ═══ APP GRID ═══ */
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:11px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);cursor:pointer;transition:all .3s;text-align:center}
.app-tile:hover{background:rgba(var(--primary-rgb),.18);box-shadow:var(--glow-sm);transform:translateY(-3px)}
.app-tile .ic{font-size:28px}
.app-tile .nm{font-size:10px;line-height:1.25;word-break:break-word;font-weight:500}

.hidden{display:none!important}
.win-body h3{color:var(--primary);font-size:14px;margin-bottom:11px;margin-top:14px;font-weight:700}
.win-body h3:first-child{margin-top:0}
.win-body p{margin-bottom:9px;color:var(--text-dim);font-size:12px;line-height:1.65}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const HalDo = window.HalDo = {};
HalDo.version = 'v128 Real 3D Cosmos';

/* ═══ SOUND ═══ */
HalDo.Sound = (() => {
  let ctx;
  const ensure = () => { if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if (ctx.state==='suspended') ctx.resume(); return ctx; };
  const beep = (f,d,t='sine',v=.15) => { try { const c=ensure(); const o=c.createOscillator(),g=c.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d); } catch(e){} };
  const S = {
    click:()=>beep(880,.05,'sine',.08),
    success:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*70)),
    error:()=>{beep(220,.2,'sawtooth',.15);setTimeout(()=>beep(165,.25,'sawtooth',.15),150)},
    message:()=>{beep(1000,.08);setTimeout(()=>beep(1300,.12),90)},
    alarm:()=>{for(let i=0;i<3;i++){setTimeout(()=>beep(1200,.15,'square',.2),i*200);setTimeout(()=>beep(900,.15,'square',.2),i*200+100)}}
  };
  return { play:(n)=>{try{(S[n]||S.click)()}catch(e){}} };
})();

/* ═══ TOAST ═══ */
HalDo.Toast = (() => {
  const c = document.getElementById('toasts');
  return {
    show(msg, o={}) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span style="font-size:18px">${o.icon||'✨'}</span><span>${msg}</span>`;
      c.appendChild(t);
      if (o.sound) HalDo.Sound.play(o.sound);
      setTimeout(() => { t.classList.add('out'); setTimeout(()=>t.remove(),350); }, o.duration||3000);
    }
  };
})();

/* ═══════════════════════════════════════════════════
   THREE.JS 3D KOSMOS mit ECHTEN TEXTUREN
   ═══════════════════════════════════════════════════ */
HalDo.Cosmos = (() => {
  let scene, camera, renderer, sunMesh, sunGlow, sunCorona;
  let planets = [], planetData = [];
  let stars, clock, earthMesh, earthClouds, earthAtmo;
  let jupiterMoons = [];
  let targetMouseX = 0, targetMouseY = 0, mouseX = 0, mouseY = 0;
  
  // Texturen: three.js (sicher) + Fallback procedural
  const TEX_URLS = {
    earth: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
    earthClouds: 'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
    earthSpecular: 'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
    earthNormal: 'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
    moon: 'https://threejs.org/examples/textures/planets/moon_1024.jpg'
  };
  const textures = {};
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';
  
  // Procedural-Texturen als Fallback
  const makeProcedural = (color, color2, type='bands') => {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = color; ctx.fillRect(0,0,256,128);
    
    if (type === 'bands') {
      // Jupiter/Saturn Banden
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = i % 2 === 0 ? color : color2;
        ctx.globalAlpha = 0.5 + Math.random()*0.3;
        ctx.fillRect(0, i * 128/12 + Math.random()*3, 256, 128/12);
      }
      ctx.globalAlpha = 1;
      // Großer roter Fleck für Jupiter
      if (color === '#d4a373') {
        ctx.fillStyle = 'rgba(200,80,50,0.8)';
        ctx.beginPath();
        ctx.ellipse(180, 80, 25, 15, 0, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (type === 'crater') {
      // Merkur/Mars/Mond mit Kratern
      for (let i = 0; i < 40; i++) {
        ctx.fillStyle = `rgba(0,0,0,${0.15 + Math.random()*0.3})`;
        ctx.beginPath();
        ctx.arc(Math.random()*256, Math.random()*128, Math.random()*8 + 2, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (type === 'cloud') {
      // Venus mit wirbelnden Wolken
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.random()*0.2})`;
        ctx.beginPath();
        ctx.ellipse(Math.random()*256, Math.random()*128, Math.random()*30+10, Math.random()*10+3, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (type === 'sun') {
      // Sonne mit Granulation
      const g = ctx.createRadialGradient(128,64,0,128,64,128);
      g.addColorStop(0,'#ffcc00');
      g.addColorStop(0.5,'#ff9900');
      g.addColorStop(1,'#ff4400');
      ctx.fillStyle = g; ctx.fillRect(0,0,256,128);
      for (let i = 0; i < 200; i++) {
        ctx.fillStyle = Math.random()>0.5 ? 'rgba(255,255,200,0.4)' : 'rgba(200,50,0,0.3)';
        ctx.beginPath();
        ctx.arc(Math.random()*256, Math.random()*128, Math.random()*4, 0, Math.PI*2);
        ctx.fill();
      }
    }
    return new THREE.CanvasTexture(canvas);
  };
  
  // Lade drei.js Texturen (Erde, Mond)
  const loadTexture = (key, url) => {
    loader.load(url, tex => { textures[key] = tex; }, undefined, () => {
      console.warn('Texture fail:', key, '- using procedural');
    });
  };
  
  // Initialisierung
  const init = () => {
    const canvas = document.getElementById('cosmosBg');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000208);
    
    camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0, 15, 55);
    camera.lookAt(0, 0, 0);
    
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    
    clock = new THREE.Clock();
    
    // Lade echte Texturen
    loadTexture('earth', TEX_URLS.earth);
    loadTexture('earthClouds', TEX_URLS.earthClouds);
    loadTexture('earthNormal', TEX_URLS.earthNormal);
    loadTexture('earthSpecular', TEX_URLS.earthSpecular);
    loadTexture('moon', TEX_URLS.moon);
    
    // ═══ STERNE (5000) ═══
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(5000 * 3);
    const starColors = new Float32Array(5000 * 3);
    const starSizes = new Float32Array(5000);
    for (let i = 0; i < 5000; i++) {
      const r = 500 + Math.random() * 500;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i*3+2] = r * Math.cos(phi);
      // Sternfarben: weiß, blau, gelb, rötlich
      const c = Math.random();
      if (c < 0.7) { starColors[i*3]=1; starColors[i*3+1]=1; starColors[i*3+2]=1; }
      else if (c < 0.85) { starColors[i*3]=0.7; starColors[i*3+1]=0.8; starColors[i*3+2]=1; }
      else if (c < 0.95) { starColors[i*3]=1; starColors[i*3+1]=0.85; starColors[i*3+2]=0.6; }
      else { starColors[i*3]=1; starColors[i*3+1]=0.7; starColors[i*3+2]=0.7; }
      starSizes[i] = Math.random() * 2 + 0.5;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
    
    // Shader für Sterne mit Größe
    const starMat = new THREE.ShaderMaterial({
      uniforms: {},
      vertexShader: `
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        void main() {
          vColor = color;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (300.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }`,
      fragmentShader: `
        varying vec3 vColor;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;
          float alpha = 1.0 - smoothstep(0.0, 0.5, d);
          gl_FragColor = vec4(vColor, alpha);
        }`,
      transparent: true,
      vertexColors: true,
      depthWrite: false
    });
    stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
    
    // ═══ SONNE ═══
    const sunGeo = new THREE.SphereGeometry(4, 64, 64);
    const sunTex = makeProcedural('#ffcc00', '#ff4400', 'sun');
    const sunMat = new THREE.MeshBasicMaterial({ map: sunTex, color: 0xffffff });
    sunMesh = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sunMesh);
    
    // Sonnen-Licht
    const sunLight = new THREE.PointLight(0xfff5d0, 3, 0, 1);
    sunLight.position.set(0, 0, 0);
    sunLight.castShadow = false;
    scene.add(sunLight);
    
    // Ambient für Planeten
    const ambient = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambient);
    
    // Corona (Sprite mit radialem Gradient)
    const coronaCanvas = document.createElement('canvas');
    coronaCanvas.width = coronaCanvas.height = 512;
    const cc = coronaCanvas.getContext('2d');
    const cg = cc.createRadialGradient(256,256,20,256,256,256);
    cg.addColorStop(0, 'rgba(255,220,100,0.95)');
    cg.addColorStop(0.2, 'rgba(255,180,60,0.7)');
    cg.addColorStop(0.5, 'rgba(255,120,30,0.3)');
    cg.addColorStop(1, 'rgba(255,60,0,0)');
    cc.fillStyle = cg;
    cc.fillRect(0,0,512,512);
    const coronaTex = new THREE.CanvasTexture(coronaCanvas);
    const coronaMat = new THREE.SpriteMaterial({ map: coronaTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
    sunCorona = new THREE.Sprite(coronaMat);
    sunCorona.scale.set(25, 25, 1);
    scene.add(sunCorona);
    
    // ═══ PLANETEN ═══
    const planetDefs = [
      { name:'Merkur',  color:'#8a7d6b', color2:'#5a4f42', size:0.8,  dist:9,  speed:0.7,  type:'crater' },
      { name:'Venus',   color:'#e8c88a', color2:'#a88040', size:1.2,  dist:13, speed:0.55, type:'cloud' },
      { name:'Erde',    color:'#4da8ff', color2:'#1a5599', size:1.3,  dist:18, speed:0.42, type:'earth' },
      { name:'Mars',    color:'#c1440e', color2:'#8a2f0a', size:0.9,  dist:23, speed:0.35, type:'crater' },
      { name:'Jupiter', color:'#d4a373', color2:'#a08050', size:3.2,  dist:32, speed:0.25, type:'bands' },
      { name:'Saturn',  color:'#e8d5a0', color2:'#a07840', size:2.7,  dist:42, speed:0.20, type:'bands', ring:true },
      { name:'Uranus',  color:'#7de0e0', color2:'#3a8080', size:1.9,  dist:51, speed:0.15, type:'bands' },
      { name:'Neptun',  color:'#3355ee', color2:'#0a1a6a', size:1.8,  dist:60, speed:0.12, type:'bands' },
      { name:'Pluto',   color:'#b08860', color2:'#5a4020', size:0.6,  dist:68, speed:0.09, type:'crater' },
      { name:'Xena',    color:'#8866aa', color2:'#4a2a6a', size:0.7,  dist:75, speed:0.07, type:'crater' },
      { name:'Sedna',   color:'#9977cc', color2:'#4a3a7a', size:0.75, dist:82, speed:0.05, type:'crater' },
      { name:'Eris',    color:'#aaccff', color2:'#5070a0', size:0.85, dist:90, speed:0.04, type:'crater' }
    ];
    
    planetData = planetDefs;
    planets = [];
    
    planetDefs.forEach((def, idx) => {
      const geo = new THREE.SphereGeometry(def.size, 48, 48);
      let mat;
      
      if (def.type === 'earth' && textures.earth) {
        mat = new THREE.MeshPhongMaterial({
          map: textures.earth,
          shininess: 5
        });
      } else {
        const tex = makeProcedural(def.color, def.color2, def.type);
        mat = new THREE.MeshPhongMaterial({
          map: tex,
          shininess: def.type === 'bands' ? 3 : 1,
          emissive: new THREE.Color(def.color2),
          emissiveIntensity: 0.15
        });
      }
      
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(def.dist, 0, 0);
      scene.add(mesh);
      
      // Erde: Wolken + Atmosphäre
      if (def.name === 'Erde') {
        earthMesh = mesh;
        
        // Wolken
        if (textures.earthClouds) {
          const cloudsGeo = new THREE.SphereGeometry(def.size * 1.02, 48, 48);
          const cloudsMat = new THREE.MeshPhongMaterial({
            map: textures.earthClouds,
            transparent: true,
            opacity: 0.85,
            depthWrite: false
          });
          earthClouds = new THREE.Mesh(cloudsGeo, cloudsMat);
          earthMesh.add(earthClouds);
        }
        
        // Atmosphäre (blauer Glow)
        const atmoGeo = new THREE.SphereGeometry(def.size * 1.12, 32, 32);
        const atmoMat = new THREE.MeshBasicMaterial({
          color: 0x4da8ff,
          transparent: true,
          opacity: 0.18,
          side: THREE.BackSide
        });
        earthAtmo = new THREE.Mesh(atmoGeo, atmoMat);
        earthMesh.add(earthAtmo);
        
        // Mond
        const moonGeo = new THREE.SphereGeometry(0.35, 32, 32);
        const moonMat = textures.moon
          ? new THREE.MeshPhongMaterial({ map: textures.moon, shininess: 2 })
          : new THREE.MeshPhongMaterial({ color: 0xcccccc, shininess: 2 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.position.set(3, 0, 0);
        moonMesh.userData = { type: 'moonEarth', orbitRadius: 3, angle: 0, speed: 0.02 };
        scene.add(moonMesh);
        mesh.userData.moon = moonMesh;
      }
      
      // Saturn: Ringe
      if (def.ring) {
        const ringGeo = new THREE.RingGeometry(def.size * 1.4, def.size * 2.4, 64);
        // Ring-Textur (procedural)
        const ringCanvas = document.createElement('canvas');
        ringCanvas.width = 256; ringCanvas.height = 32;
        const rc = ringCanvas.getContext('2d');
        for (let x = 0; x < 256; x++) {
          const alpha = (Math.sin(x * 0.3) * 0.4 + 0.5) * (1 - Math.abs(x-128)/128 * 0.3);
          const c = x % 3 === 0 ? '180,150,100' : '232,213,160';
          rc.fillStyle = `rgba(${c},${alpha})`;
          rc.fillRect(x, 0, 1, 32);
        }
        const ringTex = new THREE.CanvasTexture(ringCanvas);
        const ringMat = new THREE.MeshBasicMaterial({
          map: ringTex,
          transparent: true,
          opacity: 0.85,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI / 2.3;
        mesh.add(ringMesh);
      }
      
      // Jupiter: 4 Monde
      if (def.name === 'Jupiter') {
        const moonColors = [0xddddcc, 0xccccbb, 0xbbbbaa, 0xaaaa99];
        for (let i = 0; i < 4; i++) {
          const mGeo = new THREE.SphereGeometry(0.15 + i*0.02, 16, 16);
          const mMat = new THREE.MeshPhongMaterial({ color: moonColors[i], shininess: 1 });
          const m = new THREE.Mesh(mGeo, mMat);
          m.userData = { orbitRadius: def.size + 1.5 + i*0.6, angle: Math.random()*Math.PI*2, speed: 0.03 - i*0.005 };
          mesh.add(m);
          jupiterMoons.push(m);
        }
      }
      
      // Umlaufbahn
      const orbitGeo = new THREE.RingGeometry(def.dist - 0.05, def.dist + 0.05, 128);
      const orbitMat = new THREE.MeshBasicMaterial({
        color: 0x00aaff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.08
      });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = -Math.PI / 2;
      scene.add(orbit);
      
      planets.push({
        mesh,
        dist: def.dist,
        speed: def.speed,
        angle: Math.random() * Math.PI * 2
      });
    });
    
    // Events
    window.addEventListener('resize', onResize);
    window.addEventListener('mousemove', e => {
      targetMouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      targetMouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });
    
    animate();
  };
  
  const onResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  
  const animate = () => {
    requestAnimationFrame(animate);
    
    const dt = clock.getDelta();
    const t = clock.getElapsedTime();
    
    // Sanfte Mouse-Parallax
    mouseX += (targetMouseX - mouseX) * 0.03;
    mouseY += (targetMouseY - mouseY) * 0.03;
    camera.position.x = mouseX * 3;
    camera.position.y = 15 + mouseY * 2;
    camera.lookAt(0, 0, 0);
    
    // Sonne rotiert
    if (sunMesh) sunMesh.rotation.y += dt * 0.08;
    if (sunCorona) {
      const pulse = 1 + Math.sin(t * 1.5) * 0.05;
      sunCorona.scale.set(25 * pulse, 25 * pulse, 1);
    }
    
    // Sterne rotieren langsam
    if (stars) stars.rotation.y += dt * 0.005;
    
    // Planeten bewegen
    planets.forEach(p => {
      p.angle += dt * p.speed * 0.15;
      p.mesh.position.x = Math.cos(p.angle) * p.dist;
      p.mesh.position.z = Math.sin(p.angle) * p.dist;
      p.mesh.rotation.y += dt * 0.5;
    });
    
    // Erde-Wolken driften
    if (earthClouds) earthClouds.rotation.y += dt * 0.15;
    
    // Erd-Mond
    if (earthMesh && earthMesh.userData.moon) {
      const m = earthMesh.userData.moon;
      m.userData.angle += dt * m.userData.speed;
      m.position.x = earthMesh.position.x + Math.cos(m.userData.angle) * m.userData.orbitRadius;
      m.position.z = earthMesh.position.z + Math.sin(m.userData.angle) * m.userData.orbitRadius;
    }
    
    // Jupiter-Monde
    jupiterMoons.forEach(m => {
      m.userData.angle += dt * m.userData.speed;
      m.position.x = Math.cos(m.userData.angle) * m.userData.orbitRadius;
      m.position.z = Math.sin(m.userData.angle) * m.userData.orbitRadius;
    });
    
    renderer.render(scene, camera);
  };
  
  return { start: init };
})();

/* ═══ WINDOWS – SAFE POSITIONING ═══ */
HalDo.Windows = (() => {
  const desktop = document.getElementById('desktop');
  let zTop = 250;
  const wins = new Map();
  let cascade = 0;
  
  const create = (id, title, html, opts = {}) => {
    if (wins.has(id)) {
      const w = wins.get(id);
      w.el.style.zIndex = ++zTop;
      w.el.classList.add('active');
      document.querySelectorAll('.window').forEach(x => { if (x !== w.el) x.classList.remove('active'); });
      return w;
    }
    const el = document.createElement('div');
    el.className = 'window active';
    el.dataset.id = id;
    
    const maxW = desktop.clientWidth - 20;
    const maxH = desktop.clientHeight - 20;
    const vw = Math.min(maxW, opts.width || 500);
    const vh = Math.min(maxH, opts.height || 420);
    el.style.width = vw + 'px';
    el.style.height = vh + 'px';
    
    // Position: Weiter unten als vorher (60px statt 20px)
    const maxX = Math.max(0, desktop.clientWidth - vw);
    const maxY = Math.max(0, desktop.clientHeight - vh);
    const baseX = 15 + (cascade % 4) * 25;
    const baseY = 40 + (cascade % 4) * 25; // 40px statt 20px - weiter unten!
    cascade++;
    
    el.style.left = Math.max(10, Math.min(maxX, opts.x ?? baseX)) + 'px';
    el.style.top = Math.max(40, Math.min(maxY, opts.y ?? baseY)) + 'px';
    el.style.zIndex = ++zTop;
    
    const header = document.createElement('div');
    header.className = 'win-header';
    header.innerHTML = `
      <span class="win-title">${title}</span>
      <div class="win-controls">
        <button class="win-ctrl" data-act="min" title="Minimieren">–</button>
        <button class="win-ctrl" data-act="max" title="Maximieren">□</button>
        <button class="win-ctrl close" data-act="close" title="Schließen">×</button>
      </div>`;
    const body = document.createElement('div');
    body.className = 'win-body';
    body.innerHTML = html;
    el.appendChild(header);
    el.appendChild(body);
    desktop.appendChild(el);
    
    el.addEventListener('mousedown', () => {
      el.style.zIndex = ++zTop;
      document.querySelectorAll('.window').forEach(x => { if (x !== el) x.classList.remove('active'); });
      el.classList.add('active');
    });
    
    header.querySelectorAll('.win-ctrl').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        const act = b.dataset.act;
        if (act === 'close') destroy(id);
        else if (act === 'min') { el.style.transform = 'scale(0)'; setTimeout(() => { el.style.display = 'none'; setTimeout(() => { el.style.transform = 'scale(1)'; el.style.display = 'flex'; }, 210); }, 200); }
        else if (act === 'max') {
          if (el.dataset.maxed === '1') {
            el.style.left = el.dataset.pL; el.style.top = el.dataset.pT;
            el.style.width = el.dataset.pW; el.style.height = el.dataset.pH;
            el.dataset.maxed = '0';
          } else {
            el.dataset.pL = el.style.left; el.dataset.pT = el.style.top;
            el.dataset.pW = el.style.width; el.dataset.pH = el.style.height;
            el.style.left = '0'; el.style.top = '0';
            el.style.width = '100%'; el.style.height = '100%';
            el.dataset.maxed = '1';
          }
        }
      });
    });
    
    let dragging = false, sx, sy, ox, oy;
    const dragStart = e => {
      if (e.target.closest('.win-ctrl')) return;
      if (!header.contains(e.target)) return;
      if (e.target.closest('.win-body')) return;
      dragging = true;
      const rect = el.getBoundingClientRect();
      const dRect = desktop.getBoundingClientRect();
      ox = rect.left - dRect.left; oy = rect.top - dRect.top;
      sx = e.clientX; sy = e.clientY;
      header.classList.add('dragging');
      el.style.zIndex = ++zTop;
      e.preventDefault();
    };
    const dragMove = e => {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const nx = Math.max(0, Math.min(desktop.clientWidth - el.offsetWidth, ox + p.clientX - sx));
      const ny = Math.max(0, Math.min(desktop.clientHeight - el.offsetHeight, oy + p.clientY - sy));
      el.style.left = nx + 'px';
      el.style.top = ny + 'px';
    };
    const dragEnd = () => { dragging = false; header.classList.remove('dragging'); };
    header.addEventListener('mousedown', dragStart);
    header.addEventListener('touchstart', dragStart, { passive: false });
    window.addEventListener('mousemove', dragMove);
    window.addEventListener('touchmove', dragMove, { passive: false });
    window.addEventListener('mouseup', dragEnd);
    window.addEventListener('touchend', dragEnd);
    
    wins.set(id, { el, body });
    return { el, body };
  };
  
  const destroy = id => { const w = wins.get(id); if (w) { w.el.remove(); wins.delete(id); } };
  const get = id => wins.get(id);
  const closeAll = () => { wins.forEach((w, id) => destroy(id)); };
  return { create, destroy, get, closeAll };
})();

HalDo.Apps.timer = () => {
  if (HalDo.Windows.get('timer')) return;
  const w = HalDo.Windows.create('timer', '⏱️ Timer', `
    <h3>⏱️ Timer</h3>
    <div style="text-align:center;padding:20px;background:rgba(var(--primary-rgb),.15);border-radius:16px;border:1.5px solid var(--border);margin-bottom:12px">
      <div id="td" style="font-size:46px;font-weight:900;font-family:monospace;color:var(--primary);text-shadow:0 0 20px rgba(var(--primary-rgb),.7)">00:00</div>
    </div>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px">
      ${[30,60,300,600,1800].map(s=>`<button class="chip" onclick="window._tS(${s})">${s>=60?s/60+'m':s+'s'}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn primary" id="ts" style="flex:1">▶ Start</button>
      <button class="btn" id="tp" style="flex:1">⏸ Stop</button>
      <button class="btn" id="tr" style="flex:1">↻ Reset</button>
    </div>`, { width: 380, height: 380 });
  const disp = w.body.querySelector('#td');
  let total = 60, remaining = 60, running = false, tick;
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const upd = () => disp.textContent = fmt(remaining);
  window._tS = s => { total = remaining = s; upd(); };
  w.body.querySelector('#ts').onclick = () => {
    if (running) return;
    running = true;
    tick = setInterval(() => {
      remaining--; upd();
      if (remaining <= 0) {
        clearInterval(tick); running = false;
        HalDo.Sound.play('alarm');
        HalDo.Toast.show('⏰ Timer abgelaufen!', { icon:'⏰', sound:'alarm', duration:5000 });
      }
    }, 1000);
  };
  w.body.querySelector('#tp').onclick = () => { running = false; clearInterval(tick); };
  w.body.querySelector('#tr').onclick = () => { running = false; clearInterval(tick); remaining = total; upd(); };
  upd();
};

HalDo.Apps.music = () => {
  if (HalDo.Windows.get('music')) return;
  const tracks = [
    { name:'Cosmic Ambient', freq:261.63, color:'#00e5ff' },
    { name:'Deep Space', freq:220, color:'#b478ff' },
    { name:'Nebula Dream', freq:329.63, color:'#ff78c8' },
    { name:'Solar Winds', freq:440, color:'#ffd700' },
    { name:'Starfall', freq:523.25, color:'#00ff88' }
  ];
  const w = HalDo.Windows.create('music', '🎵 Musik', `
    <h3>🎵 Musik Studio</h3>
    <div id="ml"></div>
    <div style="margin-top:12px"><button class="btn" id="ms" style="width:100%">⏹ Stop</button></div>`, { width: 400, height: 400 });
  const list = w.body.querySelector('#ml');
  list.innerHTML = tracks.map((t,i)=>`
    <div class="list-item" style="cursor:pointer" onclick="window._mp(${i})">
      <span style="font-size:22px;filter:drop-shadow(0 0 6px ${t.color})">🎵</span>
      <div class="txt"><b>${t.name}</b><br><small style="color:${t.color}">${t.freq.toFixed(0)} Hz</small></div>
      <span style="color:var(--primary);font-size:16px">▶</span>
    </div>`).join('');
  let osc, lfo;
  const stop = () => { try { osc?.stop(); lfo?.stop(); } catch(e){} };
  window._mp = i => {
    stop();
    const c = new (window.AudioContext||window.webkitAudioContext)();
    osc = c.createOscillator(); const gain = c.createGain(); lfo = c.createOscillator();
    const lfoGain = c.createGain();
    osc.type = 'sine'; osc.frequency.value = tracks[i].freq;
    lfo.type = 'sine'; lfo.frequency.value = 3; lfoGain.gain.value = tracks[i].freq * 0.05;
    lfo.connect(lfoGain).connect(osc.frequency);
    gain.gain.value = .08;
    osc.connect(gain).connect(c.destination);
    osc.start(); lfo.start();
    HalDo.Toast.show('▶ ' + tracks[i].name, { icon:'🎵' });
    HalDo.Sound.play('success');
  };
  w.body.querySelector('#ms').onclick = () => { stop(); HalDo.Sound.play('click'); };
};

HalDo.Apps.calendar = () => {

  const cal = w.body.querySelector('#cal');
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m+1, 0).getDate();
  const start = (first + 6) % 7;
  let h = `<div style="text-align:center;margin-bottom:12px;color:var(--primary);font-weight:800;font-size:14px">${now.toLocaleDateString('de-DE',{month:'long',year:'numeric'}).toUpperCase()}</div>`;
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>h+=`<div style="font-size:10px;color:var(--text-dim);font-weight:800;padding:4px">${d}</div>`);
  for (let i=0;i<start;i++) h+='<div></div>';
  for (let d=1;d<=days;d++) {
    const isToday = d===now.getDate();
    h += `<div style="padding:9px 4px;border-radius:10px;font-size:12px;font-weight:600;${isToday?'background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;box-shadow:0 0 16px rgba(var(--primary-rgb),.5)':'background:rgba(255,255,255,.03);color:var(--text)'}">${d}</div>`;
  }
  h += '</div>';
  cal.innerHTML = h;
};
