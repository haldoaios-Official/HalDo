<style id="v49-style">
.v49-card{padding:14px;border-radius:14px;background:linear-gradient(150deg,rgba(20,30,60,.65),rgba(10,16,40,.82));border:1px solid rgba(120,180,255,.14);margin-bottom:8px}
.v49-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);transition:.15s}
.v49-tile{padding:14px;border-radius:14px;background:linear-gradient(150deg,rgba(0,229,255,.08),rgba(180,120,255,.04));border:1px solid rgba(0,229,255,.22);text-align:center;cursor:pointer;transition:.15s}
.v49-tile:hover{transform:translateY(-2px);border-color:var(--c1);box-shadow:0 8px 24px rgba(0,80,160,.22)}
.v49-tile.on{background:linear-gradient(150deg,var(--c1),var(--c2));color:#02101e;border-color:var(--c1)}
.v49-tile .ic{font-size:38px;line-height:1;margin-bottom:6px}
.v49-tile .nm{font-size:12px;font-weight:700}
.v49-tile .sub{font-size:10px;opacity:.75;margin-top:3px}
.v49-setting{padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.v49-setting .lbl{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.v49-setting .desc{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.v49-range{width:100%;accent-color:var(--c1);margin-top:8px}
.v49-color-row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.v49-color-row > div{aspect-ratio:1;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:.15s}
.v49-color-row > div:hover{transform:scale(1.1)}
.v49-color-row > div.on{border-color:#fff;box-shadow:0 0 12px currentColor}
.v49-switch{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.1);position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.v49-switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.v49-switch.on{background:linear-gradient(135deg,var(--c1),var(--c2))}
.v49-switch.on::after{left:25px}
.v49-cat{padding:10px 14px;border-radius:12px;background:linear-gradient(150deg,rgba(0,229,255,.08),rgba(20,30,60,.4));border:1px solid rgba(0,229,255,.2);margin-top:16px;margin-bottom:8px;font-weight:800;font-size:14px;color:var(--c1);letter-spacing:.5px}
.v49-stage{position:relative;width:100%;max-width:420px;margin:0 auto;border-radius:20px;background:linear-gradient(180deg,rgba(10,16,40,.6),rgba(20,30,60,.9));border:1px solid rgba(0,229,255,.25);overflow:hidden;box-shadow:0 0 60px rgba(0,229,255,.2)}
.v49-canvas{width:100%;aspect-ratio:1;display:block;cursor:pointer;touch-action:none}
.v49-bubble{position:absolute;top:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:rgba(255,255,255,.95);color:#0a1028;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:.3s;pointer-events:none;max-width:80%;z-index:10}
.v49-bubble.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.v49-btn{padding:10px 14px;border-radius:999px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(180,120,255,.06));border:1px solid rgba(0,229,255,.3);color:var(--c1);font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;transition:.15s}
.v49-btn:hover{transform:translateY(-2px)}
.v49-btn.on{background:linear-gradient(135deg,var(--c1),var(--c2));color:#02101e}
.v49-stat{padding:14px;border-radius:14px;text-align:center;background:linear-gradient(150deg,rgba(0,229,255,.08),rgba(20,30,60,.4));border:1px solid rgba(0,229,255,.18)}
.v49-stat .v{font-size:22px;font-weight:800;color:var(--c1);font-variant-numeric:tabular-nums}
.v49-stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.v49-info{padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(0,229,255,.1),rgba(0,229,255,.02));border-left:4px solid var(--c1);margin-top:10px}
.v49-warn{padding:12px 14px;border-radius:12px;background:linear-gradient(90deg,rgba(224,59,90,.15),rgba(224,59,90,.03));border-left:4px solid #e03b5a;margin-top:10px}
</style>

<script>
(function(){
'use strict';
var H = window.HalDo;
if(!H || !H.APPS){ console.error('[v49] Foundation fehlt'); return; }
var APPS = H.APPS;
var esc=H.esc, uid=H.uid, store=H.store, toast=H.toast;

/* ============================================================
   AVATAR-ENGINE V2 (mit Hintergrund, Kleidung, Effekten)
   ============================================================ */
function createAvatarV2(canvas, opts){
  opts = opts || {};
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H2 = canvas.height;
  var st = {
    t: 0, blink: 0, blinkTimer: 0, mood: 'normal', moodTimer: 0,
    handPhase: 0, mode: opts.mode || 'human', talking: false, talkTimer: 0,
    bg: opts.bg || 'space', clothes: opts.clothes || 'casual',
    accessory: opts.accessory || 'none', particles: []
  };
  for(var i = 0; i < 40; i++){
    st.particles.push({
      x: Math.random() * W, y: Math.random() * H2,
      r: Math.random() * 2 + 1, vy: Math.random() * 0.3 + 0.1,
      a: Math.random() * 0.5 + 0.2
    });
  }
  var raf;
  
  function skin(){
    return st.mode === 'human' ? '#f4c4a0' :
           st.mode === 'cyborg' ? '#8fa8d4' :
           st.mode === 'ezidi' ? '#e8c8a0' :
           st.mode === 'robot' ? '#c0c8d8' : '#a8c8e8';
  }
  function eyeCol(){
    return st.mode === 'human' || st.mode === 'ezidi' ? '#3a2010' :
           st.mode === 'cyborg' ? '#00e5ff' :
           st.mode === 'robot' ? '#4de88a' : '#b478ff';
  }
  function hairCol(){
    return st.mode === 'human' ? '#3a2010' :
           st.mode === 'cyborg' ? '#5a7ab8' :
           st.mode === 'ezidi' ? '#2a1a10' :
           st.mode === 'robot' ? '#8898b8' : '#4a3a80';
  }
  
  function drawBg(){
    if(st.bg === 'space'){
      var g = ctx.createRadialGradient(W/2, H2/2, 50, W/2, H2/2, W);
      g.addColorStop(0, 'rgba(30,40,90,.9)');
      g.addColorStop(1, 'rgba(5,10,30,.95)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H2);
      st.particles.forEach(function(p){
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + p.a + ')';
        ctx.fill();
        p.y += p.vy;
        if(p.y > H2){ p.y = 0; p.x = Math.random() * W; }
      });
    } else if(st.bg === 'sunset'){
      var g2 = ctx.createLinearGradient(0, 0, 0, H2);
      g2.addColorStop(0, '#ff6b88');
      g2.addColorStop(.5, '#ffb03a');
      g2.addColorStop(1, '#4a2050');
      ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H2);
      ctx.beginPath();
      ctx.arc(W/2, H2 * .6, 90, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,216,74,.75)';
      ctx.fill();
    } else if(st.bg === 'ocean'){
      var g3 = ctx.createLinearGradient(0, 0, 0, H2);
      g3.addColorStop(0, '#00e5ff');
      g3.addColorStop(.6, '#4a90e0');
      g3.addColorStop(1, '#0a2050');
      ctx.fillStyle = g3; ctx.fillRect(0, 0, W, H2);
      for(var w = 0; w < 5; w++){
        ctx.beginPath();
        ctx.arc(W/2 + Math.sin(st.t + w) * 100, H2 * .8 + w * 20, 60, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,.08)';
        ctx.fill();
      }
    } else if(st.bg === 'forest'){
      var g4 = ctx.createLinearGradient(0, 0, 0, H2);
      g4.addColorStop(0, '#4de88a');
      g4.addColorStop(.6, '#2a5a3a');
      g4.addColorStop(1, '#0a2050');
      ctx.fillStyle = g4; ctx.fillRect(0, 0, W, H2);
      for(var f = 0; f < 8; f++){
        ctx.beginPath();
        ctx.moveTo(50 + f * 70, H2);
        ctx.lineTo(50 + f * 70, H2 * .55);
        ctx.lineTo(70 + f * 70, H2 * .85);
        ctx.lineTo(30 + f * 70, H2 * .85);
        ctx.closePath();
        ctx.fillStyle = 'rgba(20,60,30,.6)';
        ctx.fill();
      }
    } else if(st.bg === 'city'){
      var g5 = ctx.createLinearGradient(0, 0, 0, H2);
      g5.addColorStop(0, '#0a1028');
      g5.addColorStop(1, '#2a2050');
      ctx.fillStyle = g5; ctx.fillRect(0, 0, W, H2);
      for(var b = 0; b < 12; b++){
        var bh = 100 + Math.random() * 200;
        ctx.fillStyle = 'rgba(30,40,80,.8)';
        ctx.fillRect(b * 50, H2 - bh, 45, bh);
        for(var ww = 0; ww < 3; ww++){
          for(var hh = 0; hh < 5; hh++){
            ctx.fillStyle = Math.random() > .5 ? 'rgba(255,216,74,.6)' : 'rgba(0,229,255,.4)';
            ctx.fillRect(b * 50 + 8 + ww * 12, H2 - bh + 15 + hh * 30, 6, 8);
          }
        }
      }
    } else if(st.bg === 'ezidi'){
      var g6 = ctx.createLinearGradient(0, 0, 0, H2);
      g6.addColorStop(0, '#e03b5a');
      g6.addColorStop(.5, '#fff');
      g6.addColorStop(1, '#4de88a');
      ctx.fillStyle = g6; ctx.fillRect(0, 0, W, H2);
      ctx.beginPath();
      ctx.arc(W/2, H2 * .35, 100, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,216,74,.4)';
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(10,16,40,.9)';
      ctx.fillRect(0, 0, W, H2);
    }
  }
  
  function drawClothes(cx, cy, headR){
    var shY = cy + headR + 20;
    var col = '#00e5ff';
    if(st.clothes === 'suit'){ col = '#2a2a3a'; }
    else if(st.clothes === 'ezidi'){ col = '#e03b5a'; }
    else if(st.clothes === 'shirt'){ col = '#4de88a'; }
    else if(st.clothes === 'robe'){ col = '#b478ff'; }
    else { col = '#00e5ff'; }
    
    ctx.beginPath();
    ctx.moveTo(cx - 100, shY);
    ctx.lineTo(cx + 100, shY);
    ctx.lineTo(cx + 80, H2);
    ctx.lineTo(cx - 80, H2);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    
    if(st.clothes === 'suit'){
      ctx.beginPath();
      ctx.moveTo(cx - 20, shY);
      ctx.lineTo(cx, shY + 60);
      ctx.lineTo(cx + 20, shY);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - 15, shY + 30);
      ctx.lineTo(cx, shY + 90);
      ctx.lineTo(cx + 15, shY + 30);
      ctx.closePath();
      ctx.fillStyle = '#e03b5a';
      ctx.fill();
    } else if(st.clothes === 'ezidi'){
      for(var i = 0; i < 6; i++){
        ctx.beginPath();
        ctx.arc(cx - 70 + i * 28, shY + 40, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd84a';
        ctx.fill();
      }
    }
  }
  
  function draw(){
    st.t += .02;
    st.blinkTimer++;
    st.moodTimer++;
    st.handPhase += .04;
    st.talkTimer++;
    
    if(st.blinkTimer > 100 + Math.random() * 80){
      st.blink = 1; st.blinkTimer = 0;
      setTimeout(function(){ st.blink = 0; }, 130);
    }
    if(st.moodTimer > 120 && st.mood !== 'normal'){
      st.mood = 'normal'; st.moodTimer = 0;
    }
    
    ctx.clearRect(0, 0, W, H2);
    drawBg();
    
    var cx = W / 2, cy = H2 / 2 - 20, headR = 100;
    var bob = Math.sin(st.t) * 3;
    
    drawHands(cx, cy, headR, bob);
    drawClothes(cx, cy + bob, headR);
    drawHead(cx, cy + bob, headR);
    drawFace(cx, cy + bob, headR);
    
    raf = requestAnimationFrame(draw);
  }
  
  function drawHead(cx, cy, headR){
    ctx.fillStyle = skin();
    ctx.fillRect(cx - 20, cy + headR - 10, 40, 40);
    
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, headR, 0, Math.PI * 2);
    var grd = ctx.createRadialGradient(cx - 30, cy - 40, 20, cx, cy, headR);
    grd.addColorStop(0, skin());
    grd.addColorStop(1, st.mode === 'human' ? '#d8a880' : st.mode === 'cyborg' ? '#5a7ab8' : st.mode === 'ezidi' ? '#c8a878' : st.mode === 'robot' ? '#98a8c8' : '#7a90b8');
    ctx.fillStyle = grd; ctx.fill();
    ctx.restore();
    
    if(st.mode === 'ezidi'){
      for(var i = 0; i < 7; i++){
        var a = -Math.PI / 2 + (i - 3) * .28;
        var px = cx + Math.cos(a) * headR * .95;
        var py = cy + Math.sin(a) * headR * .95;
        ctx.beginPath();
        ctx.ellipse(px, py, 8, 22, a + Math.PI / 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,229,255,.6)'; ctx.fill();
        ctx.beginPath();
        ctx.arc(px, py, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd84a'; ctx.fill();
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#0a1028'; ctx.fill();
      }
    } else if(st.mode === 'cyborg'){
      ctx.beginPath();
      ctx.moveTo(cx, cy - headR);
      ctx.lineTo(cx, cy - headR - 45);
      ctx.strokeStyle = 'rgba(0,229,255,.8)';
      ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy - headR - 50, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,229,255,.9)'; ctx.fill();
    } else if(st.mode === 'robot'){
      for(var j = 0; j < 2; j++){
        var ax = cx + (j === 0 ? -40 : 40);
        ctx.beginPath();
        ctx.moveTo(ax, cy - headR);
        ctx.lineTo(ax, cy - headR - 35);
        ctx.strokeStyle = '#4de88a'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath();
        ctx.arc(ax, cy - headR - 40, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#4de88a'; ctx.fill();
      }
    }
    
    if(st.mode === 'human' || st.mode === 'ezidi'){
      ctx.beginPath();
      ctx.arc(cx, cy, headR, Math.PI * 1.05, Math.PI * 1.95);
      ctx.lineTo(cx + headR * .9, cy - headR * .4);
      ctx.lineTo(cx - headR * .9, cy - headR * .4);
      ctx.closePath();
      ctx.fillStyle = hairCol(); ctx.fill();
    }
  }
  
  function drawFace(cx, cy, headR){
    var eY = cy - 15, eX = 36;
    var eR = st.mood === 'surprise' ? 22 : st.mood === 'sleep' ? 8 : 17;
    drawEye(cx - eX, eY, eR);
    drawEye(cx + eX, eY, eR);
    
    ctx.strokeStyle = hairCol(); ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    if(st.mood === 'surprise'){
      ctx.moveTo(cx - eX - 18, eY - 40); ctx.lineTo(cx - eX + 18, eY - 45);
      ctx.moveTo(cx + eX - 18, eY - 45); ctx.lineTo(cx + eX + 18, eY - 40);
    } else if(st.mood === 'happy'){
      ctx.moveTo(cx - eX - 18, eY - 30);
      ctx.quadraticCurveTo(cx - eX, eY - 42, cx - eX + 18, eY - 30);
      ctx.moveTo(cx + eX - 18, eY - 30);
      ctx.quadraticCurveTo(cx + eX, eY - 42, cx + eX + 18, eY - 30);
    } else {
      ctx.moveTo(cx - eX - 16, eY - 35); ctx.lineTo(cx - eX + 16, eY - 35);
      ctx.moveTo(cx + eX - 16, eY - 35); ctx.lineTo(cx + eX + 16, eY - 35);
    }
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(cx, eY + 15);
    ctx.lineTo(cx - 8, eY + 42);
    ctx.lineTo(cx + 8, eY + 42);
    ctx.strokeStyle = st.mode === 'cyborg' || st.mode === 'robot' ? 'rgba(0,229,255,.5)' : 'rgba(0,0,0,.2)';
    ctx.lineWidth = 2; ctx.stroke();
    
    var mY = cy + 42;
    ctx.beginPath();
    ctx.strokeStyle = st.mode === 'cyborg' || st.mode === 'robot' ? 'rgba(0,229,255,.8)' : '#5a2010';
    ctx.lineWidth = 3;
    if(st.mood === 'happy'){
      ctx.arc(cx, mY - 10, 30, .15 * Math.PI, .85 * Math.PI);
    } else if(st.mood === 'surprise'){
      ctx.arc(cx, mY, 15, 0, Math.PI * 2);
    } else if(st.mood === 'sleep'){
      ctx.moveTo(cx - 20, mY); ctx.quadraticCurveTo(cx, mY + 6, cx + 20, mY);
    } else if(st.talking){
      var open = Math.abs(Math.sin(st.talkTimer * .4)) * 12;
      ctx.ellipse(cx, mY, 18, 6 + open, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#5a2010'; ctx.fill();
    } else {
      ctx.moveTo(cx - 26, mY); ctx.quadraticCurveTo(cx, mY + 10, cx + 26, mY);
    }
    ctx.stroke();
    
    if(st.mood === 'happy'){
      ctx.beginPath();
      ctx.arc(cx - 65, cy + 20, 14, 0, Math.PI * 2);
      ctx.arc(cx + 65, cy + 20, 14, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,100,150,.35)'; ctx.fill();
    }
  }
  
  function drawEye(x, y, r){
    if(st.blink || st.mood === 'sleep'){
      ctx.beginPath();
      ctx.moveTo(x - r, y);
      ctx.quadraticCurveTo(x, y + r * .3, x + r, y);
      ctx.strokeStyle = eyeCol(); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
      return;
    }
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * .9, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    var dx = Math.sin(st.t * .5) * r * .3;
    var dy = Math.cos(st.t * .3) * r * .15;
    ctx.beginPath();
    ctx.arc(x + dx, y + dy, r * .6, 0, Math.PI * 2);
    ctx.fillStyle = eyeCol(); ctx.fill();
    ctx.beginPath();
    ctx.arc(x + dx, y + dy, r * .3, 0, Math.PI * 2);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.beginPath();
    ctx.arc(x + dx - r * .2, y + dy - r * .2, r * .15, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }
  
  function drawHands(cx, cy, headR, bob){
    var hY = cy + headR + 90 + bob * .5;
    var lX = cx - 140 + Math.sin(st.handPhase) * 8;
    var rX = cx + 140 - Math.sin(st.handPhase) * 8;
    drawHand(lX, hY, 'left');
    drawHand(rX, hY, 'right');
  }
  
  function drawHand(x, y, side){
    ctx.save();
    ctx.translate(x, y);
    var sc = skin();
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 28, 0, 0, Math.PI * 2);
    var grd = ctx.createRadialGradient(-8, -8, 5, 0, 0, 30);
    grd.addColorStop(0, sc);
    grd.addColorStop(1, '#d8a880');
    ctx.fillStyle = grd; ctx.fill();
    var wave = Math.sin(st.handPhase * 1.5) * 4;
    var fingers = [
      {dx: -12, dy: -28, r: 6, ang: -.2 + wave * .02},
      {dx: -4, dy: -32, r: 7, ang: -.05 + wave * .02},
      {dx: 4, dy: -32, r: 7, ang: .05 + wave * .02},
      {dx: 12, dy: -28, r: 6, ang: .2 + wave * .02}
    ];
    fingers.forEach(function(f){
      ctx.beginPath();
      ctx.ellipse(f.dx, f.dy, f.r * .6, f.r, f.ang, 0, Math.PI * 2);
      ctx.fillStyle = sc; ctx.fill();
    });
    ctx.beginPath();
    ctx.ellipse(side === 'left' ? 18 : -18, -8, 6, 10, side === 'left' ? .5 : -.5, 0, Math.PI * 2);
    ctx.fillStyle = sc; ctx.fill();
    ctx.restore();
  }
  
  draw();
  
  return {
    setMode: function(m){ st.mode = m; },
    setBg: function(b){ st.bg = b; },
    setClothes: function(c){ st.clothes = c; },
    setMood: function(m){ st.mood = m; st.moodTimer = 0; },
    wave: function(){ st.handPhase = 0; },
    startTalk: function(text){
      st.talking = true; st.talkTimer = 0;
      if(text){
        try{
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'de-DE'; u.pitch = 1.1;
          u.onend = function(){ st.talking = false; };
          speechSynthesis.speak(u);
        }catch(e){}
      }
      setTimeout(function(){ if(st.talking && !text) st.talking = false; }, 3000);
    },
    destroy: function(){ cancelAnimationFrame(raf); }
  };
}

/* 1 · AVATAR MIT HINTERGRUND */
APPS['avatar-hintergrund'] = {
  name:'🎨 Avatar + Hintergrund', icon:'🎨',
  render: function(){
    return '<div class="col" style="gap:12px">'+
      '<div class="v9-header"><div class="v9-h1">🎨 Avatar + Hintergrund</div><div class="dim sm">Setze deinen Avatar in Szene</div></div>'+

APPS['backup-manager'] = {
  name:'💾 Backup-Manager', icon:'💾',
  render: function(){
    return '<div class="col" style="gap:12px">'+
      '<div class="v9-header"><div class="v9-h1">💾 Backup-Manager</div><div class="dim sm">Alle Daten sichern & wiederherstellen</div></div>'+
      '<div class="v49-stat"><div class="v" id="v49-bmSize">–</div><div class="l">Daten-Größe</div></div>'+
      '<button class="btn primary" id="v49-bmExport" style="width:100%">📤 Backup exportieren (.json)</button>'+
      '<div class="row" style="margin-top:8px"><input type="file" id="v49-bmFile" accept=".json" style="display:none"><button class="btn" id="v49-bmImport" style="flex:1">📥 Backup importieren</button></div>'+
      '<div class="v49-warn"><b>⚠️ Hinweis</b><div class="dim sm" style="margin-top:4px">Backup enthält ALLE HalDo-Daten (Einstellungen, Notizen, Tagebücher, etc.). Bewahre es sicher auf!</div></div>'+
    '</div>';
  },
  init: function(win){
    function updateSize(){
      var t = 0, c = 0;
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('haldo') === 0){ t += (localStorage.getItem(k) || '').length; c++; }
      }
      win.querySelector('#v49-bmSize').textContent = (t/1024).toFixed(1) + ' KB (' + c + ' Einträge)';
    }
    
    win.querySelector('#v49-bmExport').onclick = function(){
      var data = {};
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf('haldo') === 0) data[k] = localStorage.getItem(k);
      }
      var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'haldo-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      toast('📤 Backup erstellt');
    };
    
    win.querySelector('#v49-bmImport').onclick = function(){ win.querySelector('#v49-bmFile').click(); };
    win.querySelector('#v49-bmFile').onchange = function(e){
      var f = e.target.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(ev){
        try{
          var data = JSON.parse(ev.target.result);
          var count = 0;
          Object.keys(data).forEach(function(k){
            if(k.indexOf('haldo') === 0){ localStorage.setItem(k, data[k]); count++; }
          });
          toast('✅ ' + count + ' Einträge importiert');
          setTimeout(function(){ location.reload(); }, 1500);
        }catch(err){ toast('❌ Fehler: ' + err.message); }
      };
      r.readAsText(f);
    };
    updateSize();
  }
};

APPS['volltextsuche'] = {

    return '<div class="col" style="gap:12px">'+
      '<div class="v9-header"><div class="v9-h1">🔍 Volltextsuche</div><div class="dim sm">Suche in ALLEN Apps & Daten</div></div>'+
      '<input class="v49-search" id="v49-vtQ" placeholder="🔍 Suche in allen Apps und Daten…">'+

    '</div>';
  },
  init: function(win){
    var Q = win.querySelector('#v49-vtQ');
    var R = win.querySelector('#v49-vtRes');
    
    function search(){
      var q = Q.value.trim().toLowerCase();
      if(!q){ R.innerHTML = '<div class="empty">Tippe etwas, um über alle Apps und Daten zu suchen</div>'; return; }
      
      var appResults = [];
      Object.keys(APPS).forEach(function(id){
        var a = APPS[id];
        var n = (a.name || id).toLowerCase();
        if(n.indexOf(q) >= 0 || id.toLowerCase().indexOf(q) >= 0){
          appResults.push({type: 'app', id: id, name: a.name || id, icon: a.icon || '📱'});
        }
      });
      
      // Daten durchsuchen (localStorage)
      var dataResults = [];
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(!k || k.indexOf('haldo') !== 0) continue;
        var v = localStorage.getItem(k) || '';
        if(v.toLowerCase().indexOf(q) >= 0){
          dataResults.push({type: 'data', key: k, value: v.slice(0, 100)});
        }
      }
      
      var html = '';
      if(appResults.length){
        html += '<div class="v49-cat">📱 Apps (' + appResults.length + ')</div>';
        html += appResults.slice(0, 30).map(function(r){
          return '<div class="v49-row" data-open="'+esc(r.id)+'" style="cursor:pointer"><span style="font-size:22px">'+esc(r.icon)+'</span><b style="flex:1">'+esc(r.name)+'</b><span class="dim sm">›</span></div>';
        }).join('');
      }
      if(dataResults.length){
        html += '<div class="v49-cat">💾 Daten (' + dataResults.length + ')</div>';
        html += dataResults.slice(0, 20).map(function(r){
          return '<div class="v49-card"><b>'+esc(r.key)+'</b><div class="dim sm" style="margin-top:4px;font-family:monospace;font-size:10px">'+esc(r.value)+'…</div></div>';
        }).join('');
      }
      if(!appResults.length && !dataResults.length){
        html = '<div class="empty">Keine Ergebnisse für "' + esc(q) + '"</div>';
      }
      
      R.innerHTML = html;
      R.querySelectorAll('[data-open]').forEach(function(el){
        el.onclick = function(){
          var id = el.dataset.open;
          if(typeof window.HalDo.openWin === 'function') window.HalDo.openWin(id);
        };
      });
    }
    
    Q.oninput = search;
    search();
  }
};
