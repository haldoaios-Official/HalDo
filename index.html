<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS — Professionelle</title>
<style>
/* ========== RESET & BASE ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050812; --bg2:#0a0e1a;
  --holo-1:#00e5ff; --holo-2:#4da8ff; --holo-3:#b478ff;
  --cyber-1:#ff78c8; --cyber-2:#b478ff;
  --accent:#00e5ff; --accent2:#b478ff;
  --glass:rgba(15,25,45,.55);
  --glass-b:rgba(0,229,255,.35);
  --glass-b2:rgba(0,229,255,.15);
  --txt:#e8f4ff; --txt2:#8ba9c9; --txt3:#4a6588;
  --gold:#ffd479;
  --blur:24px;
  --glow:0 0 20px rgba(0,229,255,.35);
  --radius:18px;
  --r-btn:14px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --fs:15px;
  --speed:1;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
body.cyborg{
  --accent:#ff78c8; --accent2:#b478ff;
  --glass:rgba(30,10,35,.6);
  --glass-b:rgba(255,120,200,.4);
  --glass-b2:rgba(255,120,200,.15);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--font);font-size:var(--fs);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ========== COSMOS CANVAS ========== */
#cosmos{position:fixed;inset:0;z-index:0;display:block;pointer-events:none}

/* ========== TOP BAR ========== */
#topbar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:800;
  padding:var(--safe-t) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(5,8,18,.9),rgba(5,8,18,.3));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--glass-b2);
}
#logoBtn{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;transition:.25s}
#logoBtn:hover{background:var(--glass-b2)}
#logoBtn img{width:32px;height:32px;border-radius:8px;filter:drop-shadow(0 0 8px var(--accent))}
#logoBtn .title{font-weight:700;font-size:16px;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#logoBtn .sub{font-size:10px;color:var(--txt3);letter-spacing:2px;text-transform:uppercase}
#topbar .spacer{flex:1}
#topbar .icon-btn{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:var(--glass);border:1.5px solid var(--glass-b2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:.25s;font-size:18px;position:relative;
}
#topbar .icon-btn:hover{border-color:var(--glass-b);box-shadow:var(--glow)}
#topbar .icon-btn.badge::after{
  content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)
}
#clock-top{font-size:13px;color:var(--txt2);font-variant-numeric:tabular-nums;padding:0 8px}

/* ========== SIDEBAR ========== */
#sidebar{
  position:fixed;top:56px;left:0;bottom:0;width:220px;z-index:700;
  padding:16px 10px calc(16px + var(--safe-b)) 10px;
  background:linear-gradient(180deg,rgba(5,8,18,.7),rgba(5,8,18,.4));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--glass-b2);
  display:flex;flex-direction:column;gap:6px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--accent) transparent;
  padding-left:calc(10px + var(--safe-l));
}
#sidebar.hidden{transform:translateX(-100%)}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:12px;
  color:var(--txt2);font-size:14px;font-weight:500;
  transition:.2s;position:relative;overflow:hidden;
}
.nav-item .ico{font-size:19px;width:24px;text-align:center}
.nav-item:hover{background:var(--glass-b2);color:var(--txt)}
.nav-item.active{background:var(--glass-b);color:var(--txt);box-shadow:0 0 16px rgba(0,229,255,.25)}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--accent);border-radius:2px;box-shadow:0 0 8px var(--accent)
}
.nav-item .badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:8px;background:var(--accent);color:#000;font-weight:700}
#sidebar .section-label{font-size:10px;letter-spacing:2px;color:var(--txt3);padding:14px 14px 6px;text-transform:uppercase}

/* ========== WINDOWS LAYER ========== */
#windows{position:fixed;inset:0;z-index:200;pointer-events:none}
.win{
  position:absolute;pointer-events:auto;
  background:var(--glass);border:1.5px solid var(--glass-b);
  border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(0,229,255,.08);
  display:flex;flex-direction:column;overflow:hidden;
  min-width:280px;min-height:200px;
  transition:box-shadow .2s;
  animation:winOpen .3s cubic-bezier(.4,0,.2,1);
}
@keyframes winOpen{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.win.active{box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 50px rgba(0,229,255,.25)}
.win.minimized{display:none}
.win-head{
  height:44px;display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);
  border-bottom:1px solid var(--glass-b2);
  cursor:move;user-select:none;flex-shrink:0;
}
.win-title{font-weight:600;font-size:13px;letter-spacing:.3px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-title .ico{margin-right:6px;font-size:14px}
.win-btns{display:flex;gap:4px}
.win-btn{
  width:34px;height:34px;min-width:34px;border-radius:8px;
  display:grid;place-items:center;font-size:14px;
  color:var(--txt2);transition:.2s;z-index:999999;
}
.win-btn:hover{background:var(--glass-b2);color:var(--txt)}
.win-btn.close:hover{background:#ff4757;color:#fff}
.win-body{flex:1;overflow:auto;padding:16px;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px;opacity:.5}
.win-resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--glass-b) 50%);border-radius:0 0 var(--radius) 0}

/* ========== BOTTOM BAR ========== */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;height:64px;z-index:750;
  padding:0 var(--safe-r) var(--safe-b) var(--safe-l);
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(0deg,rgba(5,8,18,.95),rgba(5,8,18,.3));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--glass-b2);
}
.bb-btn{
  display:flex;align-items:center;gap:8px;padding:10px 20px;min-height:44px;
  border-radius:14px;background:var(--glass);border:1.5px solid var(--glass-b2);
  color:var(--txt);font-size:13px;font-weight:600;letter-spacing:.3px;
  transition:.25s;backdrop-filter:blur(12px);
}
.bb-btn:hover{border-color:var(--glass-b);box-shadow:var(--glow);transform:translateY(-2px)}
.bb-btn.hot{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.2));border-color:var(--accent)}
.bb-btn .ico{font-size:17px}
body.cyborg .bb-btn.hot{background:linear-gradient(135deg,rgba(255,120,200,.2),rgba(180,120,255,.2))}

/* ========== TOASTS ========== */
#toasts{position:fixed;bottom:calc(80px + var(--safe-b));left:50%;transform:translateX(-50%);
  z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{
  padding:10px 20px;border-radius:12px;
  background:var(--glass);border:1.5px solid var(--glass-b);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 10px 30px rgba(0,0,0,.4),var(--glow);
  font-size:13px;font-weight:500;color:var(--txt);
  animation:toastIn .3s cubic-bezier(.4,0,.2,1);pointer-events:auto;
  max-width:340px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}

/* ========== SETTINGS APP ========== */
.set-section{border:1.5px solid var(--glass-b2);border-radius:14px;margin-bottom:10px;background:rgba(255,255,255,.02);overflow:hidden}
.set-section-head{
  display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;
  font-weight:600;font-size:14px;transition:.2s;
}
.set-section-head:hover{background:var(--glass-b2)}
.set-section-head .letter{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:800;font-size:13px;
}
.set-section-head .arrow{margin-left:auto;color:var(--txt3);transition:.3s}
.set-section.open .set-section-head .arrow{transform:rotate(90deg)}
.set-section-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.set-section.open .set-section-body{max-height:3000px}
.set-item{
  display:flex;align-items:center;gap:14px;padding:11px 18px;
  border-top:1px solid var(--glass-b2);font-size:13.5px;
}
.set-item .label{flex:1;color:var(--txt)}
.set-item .label small{display:block;font-size:11px;color:var(--txt3);margin-top:2px}
.set-item select,.set-item input[type=text],.set-item input[type=number]{
  background:var(--glass);border:1.5px solid var(--glass-b2);border-radius:8px;
  padding:6px 10px;color:var(--txt);font-size:12px;min-width:110px;outline:none
}
.set-item select:focus,.set-item input:focus{border-color:var(--accent)}
.set-item input[type=color]{width:36px;height:26px;border:none;background:none;cursor:pointer}
.set-item input[type=range]{width:100px;accent-color:var(--accent)}

/* Toggle */
.toggle{position:relative;width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.1);cursor:pointer;transition:.25s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s}
.toggle.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.toggle.on::after{left:23px}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:10px;background:var(--glass);border:1.5px solid var(--glass-b2);font-size:12px;transition:.2s;cursor:pointer}
.chip:hover{border-color:var(--glass-b)}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:600;border-color:transparent}

/* ========== APP REGISTRY ========== */
.reg-search{width:100%;padding:12px 16px;border-radius:12px;background:var(--glass);border:1.5px solid var(--glass-b2);color:var(--txt);outline:none;font-size:14px;margin-bottom:14px}
.reg-search:focus{border-color:var(--accent);box-shadow:var(--glow)}
.reg-cat{margin-bottom:14px}
.reg-cat-h{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent);margin-bottom:8px;text-transform:uppercase}
.reg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reg-app{
  padding:10px 12px;border-radius:12px;background:var(--glass);border:1.5px solid var(--glass-b2);
  font-size:12.5px;cursor:pointer;transition:.2s;text-align:left;
  display:flex;align-items:center;gap:8px;
}
.reg-app:hover{border-color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.3);transform:translateY(-1px)}
.reg-app.soon{opacity:.6}
.reg-app .ico{font-size:14px}
.reg-app .soon-tag{margin-left:auto;font-size:9px;padding:2px 6px;border-radius:6px;background:var(--accent);color:#000;font-weight:700}

/* ========== AI CHAT ========== */
.chat-msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;min-height:200px;max-height:340px;overflow-y:auto}
.chat-msg{padding:10px 14px;border-radius:14px;font-size:13.5px;max-width:80%;line-height:1.5;word-wrap:break-word}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-bottom-right-radius:4px}
.chat-msg.ai{align-self:flex-start;background:var(--glass);border:1.5px solid var(--glass-b2);border-bottom-left-radius:4px}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;padding:12px 16px;border-radius:12px;background:var(--glass);border:1.5px solid var(--glass-b2);color:var(--txt);outline:none}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{padding:12px 20px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:600}

/* ========== AVATAR ========== */
.avatar-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;padding:20px}
.avatar-svg{width:180px;height:180px;filter:drop-shadow(0 0 30px var(--accent))}
.avatar-ring{position:absolute;width:230px;height:230px;border-radius:50%;border:2px dashed var(--accent);animation:spin 18s linear infinite;opacity:.4}
.avatar-ring.r2{width:260px;height:260px;border-color:var(--accent2);animation-duration:24s;animation-direction:reverse;opacity:.25}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-label{margin-top:16px;text-align:center}
.avatar-label .name{font-weight:700;font-size:16px;color:var(--accent)}
.avatar-label .status{font-size:12px;color:var(--txt2);margin-top:4px}

/* ========== APP HELPERS ========== */
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--glass);border:1.5px solid var(--glass-b2);margin-bottom:6px;font-size:13.5px}
.list-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.list-item .del{margin-left:auto;color:var(--txt3);cursor:pointer;font-size:16px;padding:4px 8px}
.list-item .del:hover{color:#ff4757}
.add-row{display:flex;gap:8px;margin-bottom:12px}
.add-row input{flex:1;padding:10px 14px;border-radius:10px;background:var(--glass);border:1.5px solid var(--glass-b2);color:var(--txt);outline:none;font-size:13.5px}
.add-row input:focus{border-color:var(--accent)}
.add-row button{padding:10px 18px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:600;font-size:13.5px}

.calc-display{background:rgba(0,0,0,.3);border-radius:12px;padding:16px;text-align:right;font-size:32px;font-weight:600;color:var(--txt);font-variant-numeric:tabular-nums;margin-bottom:12px;min-height:64px;overflow:hidden;word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-btn{padding:16px;border-radius:12px;background:var(--glass);border:1.5px solid var(--glass-b2);font-size:18px;font-weight:600;transition:.15s}
.calc-btn:hover{background:var(--glass-b2);border-color:var(--accent)}
.calc-btn.op{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(180,120,255,.2));border-color:var(--accent)}
.calc-btn.eq{grid-column:span 2;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000}

.wcard{background:var(--glass);border:1.5px solid var(--glass-b2);border-radius:14px;padding:16px;text-align:center}
.wcard .temp{font-size:44px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wcard .icon{font-size:56px;margin:10px 0}
.wcard .meta{display:flex;justify-content:space-around;margin-top:14px;font-size:12px;color:var(--txt2)}
.wcard .meta div{display:flex;flex-direction:column;gap:3px}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  #sidebar{width:200px}
  #logoBtn .sub{display:none}
  .win{min-width:calc(100vw - 32px) !important;left:16px !important;right:16px !important;width:auto !important}
  #topbar{height:52px}
  .bb-btn{padding:10px 14px;font-size:12px}
  .bb-btn .label{display:none}
  .set-item{flex-direction:column;align-items:flex-start;gap:8px}
}

/* ========== WELCOME MODAL ========== */
#welcome{
  position:fixed;inset:0;z-index:1200;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,rgba(0,229,255,.08),rgba(0,0,0,.85));
  backdrop-filter:blur(8px);animation:fadeIn .4s;padding:20px;
}
#welcome.hidden{display:none}
.welcome-card{
  max-width:420px;width:100%;padding:32px 24px;border-radius:24px;
  background:var(--glass);border:1.5px solid var(--glass-b);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(0,229,255,.2);
  text-align:center;
}
.welcome-card img{width:72px;height:72px;border-radius:16px;margin-bottom:16px;filter:drop-shadow(0 0 20px var(--accent))}
.welcome-card h1{font-size:22px;margin-bottom:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome-card p{color:var(--txt2);font-size:13.5px;line-height:1.6;margin-bottom:20px}
.welcome-card .author{color:var(--gold);font-weight:600;font-size:12px;letter-spacing:1px;margin-bottom:20px}
.welcome-card button{padding:14px 32px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;font-size:14px;letter-spacing:.5px;transition:.25s;width:100%}
.welcome-card button:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,229,255,.4)}

/* Utility */
.hidden{display:none !important}
.flex{display:flex;gap:8px;align-items:center}
.muted{color:var(--txt2);font-size:12px}
h3{font-size:15px;margin-bottom:10px;color:var(--accent)}
</style>
</head>
<body>

<!-- 🌌 COSMOS -->
<canvas id="cosmos"></canvas>

<!-- 🔝 TOP BAR -->
<header id="topbar">
  <button id="logoBtn" title="Menü ein/aus">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=HalDo&backgroundColor=00e5ff" alt="HalDo">
    <div>
      <div class="title">HalDo AI OS</div>
      <div class="sub">Professionelle · v126</div>
    </div>
  </button>
  <div class="spacer"></div>
  <div id="clock-top">--:--</div>
  <button class="icon-btn" id="btnTheme" title="Theme wechseln">🎨</button>
  <button class="icon-btn" id="btnLang" title="Sprache">🌐</button>
  <button class="icon-btn" id="btnSettings" title="Einstellungen">⚙️</button>
</header>

<!-- 📱 SIDEBAR -->
<aside id="sidebar">
  <div class="section-label">Home</div>
  <button class="nav-item active" data-app="dashboard"><span class="ico">🏠</span>Dashboard</button>
  <button class="nav-item" data-app="journal"><span class="ico">📓</span>Journal</button>
  <button class="nav-item" data-app="tasks"><span class="ico">✅</span>Tasks</button>
  <button class="nav-item" data-app="clock"><span class="ico">🕐</span>Weltzeituhr</button>
  <button class="nav-item" data-app="weather"><span class="ico">🌤️</span>Wetter (Live)</button>

  <div class="section-label">Apps</div>
  <button class="nav-item" data-app="notes"><span class="ico">📝</span>Notes</button>
  <button class="nav-item" data-app="calc"><span class="ico">🧮</span>Calculator</button>
  <button class="nav-item" data-app="password"><span class="ico">🔐</span>Password</button>
  <button class="nav-item" data-app="registry"><span class="ico">📱</span>App-Registry<span class="badge">375</span></button>

/* ═══════════ COSMOS ═══════════ */
const Cosmos = (()=>{
  const cvs = $('#cosmos'); const ctx = cvs.getContext('2d');
  let W,H, stars=[], planets=[], sun=null, moon=null, shooters=[], nebula=[];
  let t=0, raf;

  function resize(){
    W=cvs.width=window.innerWidth*devicePixelRatio;
    H=cvs.height=window.innerHeight*devicePixelRatio;
    cvs.style.width=window.innerWidth+'px';
    cvs.style.height=window.innerHeight+'px';
    init();
  }
  function init(){
    sun = {x:W*0.5,y:H*0.55,r:Math.min(W,H)*0.055,phase:0};
    stars = Array.from({length:350},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.6+0.3,
      a:Math.random()*0.6+0.3,
      tw:Math.random()*Math.PI*2
    }));
    const colors=['#a9a9a9','#e8b874','#6fa9ff','#d8653a','#e0c088','#e8d4a0','#8fd4e8','#7fb5e8'];
    const names=['Merkur','Venus','Erde','Mars','Jupiter','Saturn','Uranus','Neptun','Pluto','Ceres','Eris','Haumea'];
    planets = names.map((n,i)=>({
      name:n, color:colors[i%colors.length],
      orbit: sun.r*(2.2+i*0.85),
      size: 2.5+i*0.9,
      angle: Math.random()*Math.PI*2,
      speed: 0.15/(1+i*0.3),
      yScale: 0.55
    }));
    moon = {angle:0, orbit: planets[2].orbit+18, size:2};
    shooters = [];
    nebula = Array.from({length:6},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*200+120,
      hue: Math.random()*60+230,
      a:Math.random()*0.06+0.02
    }));
  }

  function drawSun(){
    const g = ctx.createRadialGradient(sun.x,sun.y,0,sun.x,sun.y,sun.r*3.2);
    g.addColorStop(0,'rgba(255,220,120,1)');
    g.addColorStop(0.15,'rgba(255,180,80,0.9)');
    g.addColorStop(0.4,'rgba(255,120,60,0.35)');
    g.addColorStop(1,'rgba(255,80,40,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.arc(sun.x,sun.y,sun.r*3.2,0,Math.PI*2);ctx.fill();
    // core
    const c = ctx.createRadialGradient(sun.x,sun.y,0,sun.x,sun.y,sun.r);
    c.addColorStop(0,'#fffbe8');c.addColorStop(0.5,'#ffd479');c.addColorStop(1,'#ff9040');
    ctx.fillStyle=c;
    ctx.beginPath();ctx.arc(sun.x,sun.y,sun.r,0,Math.PI*2);ctx.fill();
    // corona
    const cr = sun.r*(1.4+Math.sin(sun.phase)*0.05);
    ctx.strokeStyle='rgba(255,200,120,'+(0.25+Math.sin(sun.phase*1.3)*0.15)+')';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sun.x,sun.y,cr,0,Math.PI*2);ctx.stroke();
  }

  function drawStars(){
    for(const s of stars){
      const a = s.a*(0.6+Math.sin(t*0.03+s.tw)*0.4);
      ctx.fillStyle=`rgba(200,230,255,${a})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
  }

  function drawNebula(){
    for(const n of nebula){
      const g = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      g.addColorStop(0,`hsla(${n.hue},80%,60%,${n.a})`);
      g.addColorStop(1,`hsla(${n.hue},80%,60%,0)`);
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
    }
  }

  function drawPlanets(){
    for(const p of planets){
      p.angle += 0.0008*p.speed;
      const x = sun.x + Math.cos(p.angle)*p.orbit;
      const y = sun.y + Math.sin(p.angle)*p.orbit*p.yScale;
      // orbit
      ctx.strokeStyle='rgba(120,180,255,0.06)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(sun.x,sun.y,p.orbit,p.orbit*p.yScale,0,0,Math.PI*2);ctx.stroke();
      // planet
      const g = ctx.createRadialGradient(x-p.size*0.3,y-p.size*0.3,0,x,y,p.size*1.4);
      g.addColorStop(0,p.color);g.addColorStop(1,'rgba(0,0,0,0.6)');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(x,y,p.size*1.4,0,Math.PI*2);ctx.fill();
      // moon of Earth (index 2)
      if(p.name==='Erde'){
        moon.angle += 0.012;
        const mx = x + Math.cos(moon.angle)*18;
        const my = y + Math.sin(moon.angle)*18*0.6;
        ctx.fillStyle='#c8c8c8';
        ctx.beginPath();ctx.arc(mx,my,moon.size,0,Math.PI*2);ctx.fill();
      }
    }
  }

  function drawShooters(){
    if(Math.random()<0.006 && shooters.length<3){
      shooters.push({x:Math.random()*W*0.7, y:Math.random()*H*0.3,
        vx:6+Math.random()*3, vy:3+Math.random()*2, life:1});
    }
    for(let i=shooters.length-1;i>=0;i--){
      const s=shooters[i];
      s.x+=s.vx; s.y+=s.vy; s.life-=0.02;
      ctx.strokeStyle=`rgba(255,255,255,${s.life})`;
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*8,s.y-s.vy*8);ctx.stroke();
      if(s.life<=0) shooters.splice(i,1);
    }
  }

  function loop(){
    t++;
    ctx.fillStyle='rgba(5,8,18,1)';
    ctx.fillRect(0,0,W,H);
    drawNebula();
    drawStars();
    drawSun();
    drawPlanets();
    drawShooters();
    raf = requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  return {start(){resize();loop()}, stop(){cancelAnimationFrame(raf)}};
})();
Cosmos.start();

/* ═══════════ WINDOW MANAGER ═══════════ */
const WM = (()=>{
  let zTop = 200;
  const openWins = new Map();

  function open(id, opts={}){
    if(openWins.has(id)){ bringToFront(openWins.get(id)); return openWins.get(id); }
    const def = APPS[id];
    if(!def){ HalDo.toast('⚠️ App nicht gefunden: '+id); return; }
    const win = document.createElement('div');
    win.className='win'; win.id='win-'+id;
    const w = opts.w || def.w || 520;
    const h = opts.h || def.h || 420;
    const x = Math.min(Math.max(20, (window.innerWidth-w)/2 + (openWins.size*20)), window.innerWidth-w-20);
    const y = Math.min(Math.max(70, (window.innerHeight-h)/2 + (openWins.size*15)), window.innerHeight-h-80);
    win.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++zTop}`;
    win.innerHTML = `
      <div class="win-head">
        <div class="win-title"><span class="ico">${def.icon||'📱'}</span>${def.name}</div>
        <div class="win-btns">
          <button class="win-btn min" title="Minimieren">─</button>
          <button class="win-btn max" title="Maximieren">□</button>
          <button class="win-btn close" title="Schließen">✕</button>
        </div>
      </div>
      <div class="win-body"></div>
      <div class="win-resize"></div>
    `;
    $('#windows').appendChild(win);
    openWins.set(id, win);
    makeDraggable(win);
    makeResizable(win);
    win.querySelector('.close').onclick = ()=>close(id);
    win.querySelector('.min').onclick = ()=>win.classList.add('minimized');
    win.querySelector('.max').onclick = ()=>{
      if(win.dataset.max==='1'){
        win.style.left=win.dataset.ol;win.style.top=win.dataset.ot;
        win.style.width=win.dataset.ow;win.style.height=win.dataset.oh;
        win.dataset.max='0';
      } else {
        win.dataset.ol=win.style.left;win.dataset.ot=win.style.top;
        win.dataset.ow=win.style.width;win.dataset.oh=win.style.height;
        win.style.left='10px';win.style.top='66px';
        win.style.width='calc(100vw - 240px)';
        win.style.height='calc(100vh - 140px)';
        win.dataset.max='1';
      }
    };
    win.addEventListener('mousedown', ()=>bringToFront(win));
    win.addEventListener('touchstart', ()=>bringToFront(win),{passive:true});
    if(def.render) def.render(win.querySelector('.win-body'), win);
    bringToFront(win);
    return win;
  }

  function bringToFront(win){
    if(!win) return;
    $$('.win').forEach(w=>w.classList.remove('active'));
    win.classList.add('active');
    win.style.zIndex = ++zTop;
    win.classList.remove('minimized');
  }

  function close(id){
    const w = openWins.get(id);
    if(w){ w.style.animation='winOpen .2s reverse'; setTimeout(()=>w.remove(),200); }
    openWins.delete(id);
  }

  function makeDraggable(win){
    const head = win.querySelector('.win-head');
    let sx,sy,ox,oy,dragging=false;
    const start=(e)=>{
      if(e.target.closest('.win-btn')) return;
      dragging=true;
      const p = e.touches?e.touches[0]:e;
      sx=p.clientX; sy=p.clientY;
      ox=parseInt(win.style.left)||0; oy=parseInt(win.style.top)||0;
      bringToFront(win);
    };
    const move=(e)=>{
      if(!dragging) return;
      const p = e.touches?e.touches[0]:e;
      const nx = Math.max(0, Math.min(window.innerWidth-100, ox + (p.clientX-sx)));
      const ny = Math.max(56, Math.min(window.innerHeight-50, oy + (p.clientY-sy)));
      win.style.left=nx+'px'; win.style.top=ny+'px';
      if(e.cancelable) e.preventDefault();
    };
    const end=()=>dragging=false;
    head.addEventListener('mousedown', start);
    head.addEventListener('touchstart', start,{passive:true});
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move,{passive:false});
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }

  function makeResizable(win){
    const h = win.querySelector('.win-resize');
    let sx,sy,ow,oh,resizing=false;
    const start=(e)=>{
      resizing=true;
      const p = e.touches?e.touches[0]:e;
      sx=p.clientX; sy=p.clientY;
      ow=parseInt(win.style.width)||300; oh=parseInt(win.style.height)||200;
    };
    const move=(e)=>{
      if(!resizing) return;
      const p = e.touches?e.touches[0]:e;
      win.style.width = Math.max(280, ow + (p.clientX-sx))+'px';
      win.style.height = Math.max(200, oh + (p.clientY-sy))+'px';
    };
    const end=()=>resizing=false;
    h.addEventListener('mousedown', start);
    h.addEventListener('touchstart', start,{passive:true});
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move,{passive:false});
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }

  return {open, close, bringToFront};
})();
HalDo.WM = WM;

  body.innerHTML = SECTIONS.map(s=>{
    const items = s.items.map(it=>{
      const [label,sub,type,...args] = it;
      let ctrl = '';
      if(type==='toggle'){
        const on = args[0]; const key=args[1];
        ctrl = `<div class="toggle ${on?'on':''}" data-toggle="${label}" data-key="${key||''}"></div>`;
      } else if(type==='select'){
        const opts=args[0],cur=args[1],key=args[2];
        ctrl = `<select data-select="${label}" data-key="${key||''}">${opts.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;
      } else if(type==='range'){
        const [min,max,cur]=args;
        ctrl = `<input type="range" min="${min}" max="${max}" value="${cur}" data-range="${label}">`;
      } else if(type==='color'){
        ctrl = `<input type="color" value="${args[0]}" data-color="${label}">`;
      } else if(type==='text'){
        ctrl = `<input type="text" value="${args[0]}" style="min-width:120px">`;
      } else if(type==='btn'){
        ctrl = `<button class="chip" onclick="HalDo.toast('${args[0]}: ${label}')">${args[0]}</button>`;
      }
      return `<div class="set-item"><div class="label">${label}<small>${sub}</small></div>${ctrl}</div>`;
    }).join('');
    return `<div class="set-section" data-sec="${s.k}">
      <div class="set-section-head">
        <div class="letter">${s.k}</div>
        <div>${s.icon} ${s.t}</div>
        <div class="arrow">▶</div>
      </div>
      <div class="set-section-body">${items}</div>
    </div>`;
  }).join('');

  // Wire toggles
  $$('.set-section-head', body).forEach(h=>{
    h.onclick = ()=>h.parentElement.classList.toggle('open');
  });
  $$('.toggle', body).forEach(t=>{
    t.onclick = ()=>{
      t.classList.toggle('on');
      if(t.dataset.key==='cyborg') HalDo.toggleCyborg();
    };
  });
  $$('select[data-key="theme"]',body).forEach(sel=>{
    sel.onchange=()=>HalDo.setTheme(sel.value.toLowerCase());
  });
}

  calc:{name:'Calculator',icon:'🧮',w:320,h:480,render:(b)=>{
    let cur='0',prev=null,op=null,fresh=true;
    b.innerHTML = `<div class="calc-display" id="cd">0</div><div class="calc-grid" id="cg"></div>`;
    const keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','=','⌫'];
    b.querySelector('#cg').innerHTML = keys.map(k=>{
      const cls = ['÷','×','−','+','%','±'].includes(k)?'op':k==='='?'eq':'';
      return `<button class="calc-btn ${cls}" data-k="${k}">${k}</button>`;
    }).join('');
    const upd=()=>b.querySelector('#cd').textContent=cur;
    b.querySelectorAll('[data-k]').forEach(btn=>btn.onclick=()=>{
      const k=btn.dataset.k;
      if(k==='C'){cur='0';prev=null;op=null;fresh=true}
      else if(k==='⌫'){cur=cur.length>1?cur.slice(0,-1):'0'}
      else if(k==='±'){cur=(parseFloat(cur)*-1).toString()}
      else if(k==='%'){cur=(parseFloat(cur)/100).toString()}
      else if(['+','−','×','÷'].includes(k)){
        if(prev!==null && op){cur=String(evalExpr(prev,cur,op));}
        prev=cur;op=k;fresh=true;
      }
      else if(k==='='){if(prev!==null&&op){cur=String(evalExpr(prev,cur,op));prev=null;op=null;fresh=true;}}
      else if(k==='.'){if(!cur.includes('.'))cur+='.'}
      else {if(fresh||cur==='0')cur=k;else cur+=k;fresh=false;}
      if(['+','−','×','÷'].includes(k)||k==='=') fresh=true;
      else fresh=false;
      upd();
    });
    function evalExpr(a,b,o){const x=parseFloat(a),y=parseFloat(b);return o==='+'?x+y:o==='−'?x-y:o==='×'?x*y:y!==0?x/y:NaN;}

  }},
  journal:{name:'Journal',icon:'📓',w:540,h:520,render:(b)=>{
    const items = store.get('journal',[]);
    const moods=['😊','😐','😢','😡','🤩','😴'];
    b.innerHTML = `
      <div class="add-row"><input id="jT" placeholder="Titel..."><select id="jM" style="padding:10px 8px;border-radius:10px;background:var(--glass);border:1.5px solid var(--glass-b2);color:var(--txt)">${moods.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <textarea id="jC" placeholder="Wie war dein Tag?" rows="3" style="width:100%;padding:10px 14px;border-radius:10px;background:var(--glass);border:1.5px solid var(--glass-b2);color:var(--txt);outline:none;font-size:13.5px;margin-bottom:10px;resize:vertical"></textarea>
      <button id="jAdd" class="chip" style="width:100%;margin-bottom:14px">✍️ Eintrag speichern</button>
      <div id="jL"></div>
    `;
    const render=()=>{
      const it=store.get('journal',[]);
      b.querySelector('#jL').innerHTML = it.length? it.map((j,i)=>`<div class="list-item"><div style="flex:1"><div>${j.m} <strong>${j.t}</strong></div><div class="muted" style="font-size:11px">${new Date(j.ts).toLocaleString('de-DE')} · ${j.c}</div></div><span class="del" data-i="${i}">×</span></div>`).join('') : '<div class="muted">Noch keine Einträge.</div>';
      b.querySelectorAll('.del').forEach(d=>d.onclick=()=>{const a=store.get('journal',[]);a.splice(+d.dataset.i,1);store.set('journal',a);render()});
    };
    b.querySelector('#jAdd').onclick=()=>{const t=b.querySelector('#jT').value.trim()||'Ohne Titel';const c=b.querySelector('#jC').value.trim();const m=b.querySelector('#jM').value;const a=store.get('journal',[]);a.unshift({t,c,m,ts:Date.now()});store.set('journal',a);b.querySelector('#jT').value='';b.querySelector('#jC').value='';render();HalDo.toast('📓 Eintrag gespeichert')};
    render();
  }},
  registry:{name:'App-Registry (375 Apps)',icon:'📱',w:720,h:620,render:(b)=>{
    const cats = Object.keys(REGISTRY);
    b.innerHTML = `
      <input class="reg-search" id="rSearch" placeholder="🔍 375 Apps durchsuchen…">
      <div id="rList"></div>`;
    const render=(q='')=>{
      q=q.toLowerCase();
      b.querySelector('#rList').innerHTML = cats.map(c=>{
        const apps = REGISTRY[c].filter(a=>a.toLowerCase().includes(q));
        if(!apps.length) return '';
        return `<div class="reg-cat"><div class="reg-cat-h">${c} — ${apps.length} Apps</div>
          <div class="reg-grid">${apps.map(a=>{
            const id = c+'_'+a.replace(/\s+/g,'_');
            const built = Object.keys(APPS).includes(a.toLowerCase());
            return `<button class="reg-app ${built?'':'soon'}" data-id="${id}" data-name="${a}"><span class="ico">${built?'✅':'📱'}</span>${a}${built?'':'<span class="soon-tag">SOON</span>'}</button>`;
          }).join('')}</div></div>`;
      }).join('') || '<div class="muted">Keine Treffer.</div>';
      b.querySelectorAll('.reg-app').forEach(el=>{
        el.onclick=()=>{
          if(el.classList.contains('soon')) HalDo.toast('📱 "'+el.dataset.name+'" — Coming Soon');
        };
      });
    };
    b.querySelector('#rSearch').oninput=(e)=>render(e.target.value);
    render();
  }},
  avatar:{name:'HalDo AI Avatar',icon:'🤖',w:480,h:520,render:(b)=>{
    b.innerHTML = `
      <div class="avatar-wrap" style="position:relative">
        <div class="avatar-ring"></div>
        <div class="avatar-ring r2"></div>
        <svg class="avatar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="avG" cx="50%" cy="40%">
              <stop offset="0%" stop-color="${getComputedStyle(document.documentElement).getPropertyValue('--accent')||'#00e5ff'}"/>
              <stop offset="100%" stop-color="${getComputedStyle(document.documentElement).getPropertyValue('--accent2')||'#b478ff'}"/>
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="70" fill="url(#avG)" opacity=".15"/>
          <ellipse cx="100" cy="90" rx="60" ry="65" fill="url(#avG)"/>
          <ellipse cx="100" cy="90" rx="60" ry="65" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
          <!-- Eyes -->
          <g id="eyeL"><ellipse cx="80" cy="80" rx="9" ry="12" fill="#fff"/><circle cx="80" cy="82" r="5" fill="#0a0e1a"/></g>
          <g id="eyeR"><ellipse cx="120" cy="80" rx="9" ry="12" fill="#fff"/><circle cx="120" cy="82" r="5" fill="#0a0e1a"/></g>
          <!-- Mouth -->
          <path id="mouth" d="M 80 120 Q 100 132 120 120" stroke="#0a0e1a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Antenna -->
          <line x1="100" y1="25" x2="100" y2="10" stroke="var(--accent)" stroke-width="3"/>
          <circle cx="100" cy="10" r="5" fill="var(--accent)"/>
        </svg>
        <div class="avatar-label">
          <div class="name">HalDo AI</div>
          <div class="status" id="avStatus">● Bereit</div>
        </div>
        <div class="flex" style="margin-top:10px">
          <button class="chip" onclick="HalDo.toast('👋 Hallo! Ich bin HalDo.')">👋 Hallo</button>
          <button class="chip" onclick="HalDo.toast('🎤 Mikrofon aktiv')">🎤 Hören</button>
          <button class="chip" onclick="HalDo.toast('🔊 Spreche...')">🔊 Sprechen</button>
        </div>
      </div>
    `;
    // Blink animation
    const eyeL = b.querySelector('#eyeL'), eyeR = b.querySelector('#eyeR');
    setInterval(()=>{
      eyeL.style.transform='scaleY(0.1)'; eyeR.style.transform='scaleY(0.1)';
      setTimeout(()=>{eyeL.style.transform='';eyeR.style.transform='';},120);
    }, 3200);
  }},
  chat:{name:'HalDo AI Chat',icon:'💬',w:520,h:560,render:(b)=>{
    const history = store.get('chat',[]);
    b.innerHTML = `
      <div class="chat-msgs" id="cm"></div>
      <div class="chat-input"><input id="ci" placeholder="Schreib eine Nachricht..." autofocus><button id="cs">Senden</button></div>
    `;
    const cm = b.querySelector('#cm');
    const draw=()=>{
      cm.innerHTML = history.length? history.map(m=>`<div class="chat-msg ${m.r}">${m.t}</div>`).join('') : `<div class="chat-msg ai">Hallo! Ich bin HalDo AI. Frag mich etwas oder sag einfach „Hi HalDo". 💙</div>`;
      cm.scrollTop = cm.scrollHeight;
    };
    draw();
    const send=()=>{
      const v=b.querySelector('#ci').value.trim(); if(!v) return;
      history.push({r:'user',t:v});
      setTimeout(()=>{
        history.push({r:'ai',t:HalDoReply(v)});
        store.set('chat',history);
        draw();
      }, 400);
      b.querySelector('#ci').value=''; draw();
    };
    b.querySelector('#cs').onclick=send;
    b.querySelector('#ci').onkeydown=(e)=>{if(e.key==='Enter')send()};
    function HalDoReply(msg){
      const m=msg.toLowerCase();
      if(m.includes('hi haldo')||m.includes('hey haldo')||m.includes('hallo haldo')||m==='haldo') return 'Hallo Bruder! 👋 Was kann ich für dich tun?';
      if(m.includes('wie geht')) return 'Mir geht es bestens! Ich laufe auf v126. Und dir?';
      if(m.includes('zeit')) return 'Es ist '+new Date().toLocaleTimeString('de-DE');
      if(m.includes('wetter')) return 'Öffne die Wetter-App für Live-Daten! 🌤️';
      if(m.includes('danke')) return 'Gern geschehen! 💙';
      if(m.includes('wer bist')) return 'Ich bin HalDo AI, dein lebendiger KI-Assistent, entwickelt von Halil Donma. ⚡';
      if(m.includes('ezid')) return 'Êzîdî ist eine sehr alte Religion — ich respektiere alle Glaubensrichtungen. Frag mich mehr über die Êzîdî-Kultur! 🕊️';
      return 'Interessant! Ich lerne noch — die volle KI-Anbindung kommt bald. 💙';
    }
  }}
};

/* ═══════════ WIRE SIDEBAR & BOTTOM ═══════════ */
$$('[data-app]').forEach(btn=>{
  btn.onclick = ()=>{
    const id = btn.dataset.app;
    WM.open(id);
    $$('.nav-item').forEach(n=>n.classList.remove('active'));
    if(btn.classList.contains('nav-item')) btn.classList.add('active');
    if(window.innerWidth < 768) $('#sidebar').classList.add('hidden');
  };
});

/* ═══════════ CLOCK ═══════════ */
const updClock=()=>{
  const d=new Date();
  const t=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  const dc = $('#clock-top'); if(dc) dc.textContent=t;
};
setInterval(updClock, 1000); updClock();

HalDo.open = (id)=>WM.open(id);
HalDo.close = (id)=>WM.close(id);
HalDo.version='126.0.1';

console.log('%c🚀 HalDo AI OS v126 — Foundation','color:#00e5ff;font-size:16px;font-weight:bold');
console.log('%cPräsentiert von Halil Donma','color:#b478ff');
