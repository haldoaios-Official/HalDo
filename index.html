        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 30px; }

        .tile:hover { background: #00d4ff22; transform: translateY(-3px); }
        .icon { font-size: 30px; margin-bottom: 10px; }
        .name { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🦚 HalDo AI OS</h1>
    <p style="text-align:center; color:#7a8ba8;">Wähle ein Modul aus:</p>

    <div class="grid">

            <div class="icon">👤</div>
            <div class="name">HalDo Clone</div>
        </a>
        <a href="musik-studio.html" class="tile">
            <div class="icon">🎵</div>

        </a>
        <a href="bild-studio.html" class="tile">
            <div class="icon">🎨</div>

        </a>
        <a href="human.html" class="tile">

        </a>
        <a href="robot.html" class="tile">

        </a>
        <a href="holo.html" class="tile">
            <div class="icon">✨</div>

        </a>
        <a href="cyborg.html" class="tile">
            <div class="icon">🦾</div>

        </a>
        <a href="ai.html" class="tile">
            <div class="icon">🧠</div>
            <div class="name">KI-Kern</div>
        </a>
    </div>
</body>
</html>
