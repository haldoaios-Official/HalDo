<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>HalDo AI OS Pro Max Professionelle</title>
<style>
/* ============ DESIGN-REGELN ============ */
:root{
  --cyan:#00e5ff;
  --blue:#4da8ff;
  --purple:#b478ff;
  --pink:#ff78c8;
  --violet:#b478ff;
  --gold:#d4af37;
  --bg-deep:#0a0e1a;
  --glass:rgba(15,25,45,0.55);
  --glass-border:rgba(0,229,255,0.4);
  --glow:0 0 24px rgba(0,229,255,0.55);
  --glow-strong:0 0 40px rgba(0,229,255,0.85);
  --radius-win:18px;
  --radius-btn:14px;
  --blur:24px;
  --z-inactive:200;
  --z-active:250;
  --z-panel:900;
  --z-toast:1000;
  --z-modal:1100;
  --z-alert:1200;
  --z-winbtn:999999;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg-deep);color:#e8f4ff;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ============ KOSMOS ============ */
#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#cosmosOverlay{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 0%,rgba(10,14,26,0.35) 70%,rgba(10,14,26,0.75) 100%)}

/* ============ TOP-BAR ============ */
#topBar{
  position:fixed;top:0;left:0;right:0;height:calc(56px + var(--safe-t));
  padding:var(--safe-t) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
  display:flex;align-items:center;gap:12px;z-index:800;
  background:linear-gradient(180deg,rgba(10,14,26,0.85) 0%,rgba(10,14,26,0.45) 100%);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-bottom:1.5px solid var(--glass-border);
}
#sidebarToggle{
  width:44px;height:44px;min-width:44px;min-height:44px;border-radius:var(--radius-btn);
  background:var(--glass);border:1.5px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:var(--glow);transition:transform .15s,box-shadow .15s;
}
#sidebarToggle:active{transform:scale(0.94);box-shadow:var(--glow-strong)}
#brand{flex:1;font-size:16px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#topActions{display:flex;gap:8px}
.top-btn{width:44px;height:44px;min-width:44px;min-height:44px;border-radius:var(--radius-btn);
  background:var(--glass);border:1.5px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:var(--glow);transition:transform .15s}
.top-btn:active{transform:scale(0.94)}

/* ============ SIDEBAR ============ */
#sidebar{
  position:fixed;top:calc(56px + var(--safe-t));left:0;bottom:calc(64px + var(--safe-b));
  width:240px;padding:14px 10px calc(14px + var(--safe-b)) calc(10px + var(--safe-l));
  background:linear-gradient(180deg,rgba(10,14,26,0.75),rgba(10,14,26,0.55));
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-right:1.5px solid var(--glass-border);
  overflow-y:auto;overflow-x:hidden;z-index:700;
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  scrollbar-width:thin;scrollbar-color:var(--cyan) transparent;
}
#sidebar.open{transform:translateX(0)}
#sidebar::-webkit-scrollbar{width:5px}
#sidebar::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px}
.sb-cat{margin-bottom:14px}
.sb-cat-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--cyan);opacity:.7;padding:6px 10px;margin-bottom:2px}
.sb-btn{
  display:flex;align-items:center;gap:10px;width:100%;min-height:44px;
  padding:10px 12px;margin:2px 0;border-radius:var(--radius-btn);
  font-size:14px;font-weight:500;color:#c8e4ff;text-align:left;
  transition:background .15s,color .15s,transform .1s;
}
.sb-btn:hover{background:rgba(0,229,255,0.08);color:#fff}
.sb-btn:active{transform:scale(0.98);background:rgba(0,229,255,0.15)}
.sb-btn .ico{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sb-btn .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-btn.cyborg{color:#ffb0dc}
.sb-btn.cyborg:hover{background:rgba(255,120,200,0.1);color:#fff}
.sb-btn.ai{color:#a0d8ff}
.sb-btn.ai:hover{background:rgba(77,168,255,0.12);color:#fff}

/* ============ WINDOWS ============ */
#windows{position:fixed;inset:0;z-index:var(--z-inactive);pointer-events:none}
.win{
  position:absolute;pointer-events:auto;
  min-width:300px;max-width:calc(100vw - 24px);
  max-height:calc(100vh - 160px);
  background:var(--glass);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border:1.5px solid var(--glass-border);
  border-radius:var(--radius-win);
  box-shadow:0 0 40px rgba(0,229,255,0.35),inset 0 0 20px rgba(0,229,255,0.08);
  display:flex;flex-direction:column;overflow:hidden;
  z-index:var(--z-inactive);
  animation:winIn .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes winIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.win.active{
  z-index:var(--z-active);
  border-color:var(--cyan);
  box-shadow:0 0 60px rgba(0,229,255,0.6),inset 0 0 24px rgba(0,229,255,0.12);
}
.win-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;min-height:52px;
  background:linear-gradient(90deg,rgba(0,229,255,0.08),rgba(180,120,255,0.08));
  border-bottom:1px solid rgba(0,229,255,0.25);
  cursor:grab;
}
.win-header:active{cursor:grabbing}
.win-title{
  flex:1;font-size:14px;font-weight:700;color:var(--cyan);
  letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding:0 8px;
}
.win-close{
  width:44px;height:44px;min-width:44px;min-height:44px;
  border-radius:var(--radius-btn);
  background:rgba(255,80,80,0.15);border:1.5px solid rgba(255,100,100,0.5);
  color:#ff8888;font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  z-index:var(--z-winbtn);position:relative;
  transition:transform .15s,background .15s;
}
.win-close:hover{background:rgba(255,80,80,0.3)}
.win-close:active{transform:scale(0.9)}
.win-body{
  flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.6;
  scrollbar-width:thin;scrollbar-color:var(--cyan) transparent;
}
.win-body::-webkit-scrollbar{width:6px}
.win-body::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px}

/* Window content elements */
.win-body h3{font-size:15px;color:var(--cyan);margin:14px 0 8px;font-weight:700}
.win-body p{color:#c8e4ff;margin-bottom:10px}
.win-body input,.win-body textarea,.win-body select{
  width:100%;padding:12px;margin:6px 0;border-radius:var(--radius-btn);
  background:rgba(0,0,0,0.3);border:1.5px solid rgba(0,229,255,0.3);
  color:#fff;font-size:14px;font-family:inherit;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.win-body input:focus,.win-body textarea:focus,.win-body select:focus{
  border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,0.35)
}
.win-body textarea{resize:vertical;min-height:100px}
.btn{
  min-height:44px;padding:10px 18px;border-radius:var(--radius-btn);
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  color:#001824;font-weight:700;font-size:14px;letter-spacing:.3px;
  border:none;box-shadow:0 4px 20px rgba(0,229,255,0.4);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{box-shadow:0 6px 26px rgba(0,229,255,0.6)}
.btn:active{transform:scale(0.96)}
.btn.ghost{background:rgba(0,229,255,0.1);color:var(--cyan);border:1.5px solid var(--glass-border);box-shadow:none}
.btn.ghost:hover{background:rgba(0,229,255,0.18)}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Toggle */
.toggle{position:relative;display:inline-block;width:52px;height:30px;flex-shrink:0}
.toggle input{display:none}
.toggle .slider{
  position:absolute;inset:0;background:rgba(255,255,255,0.1);
  border-radius:15px;cursor:pointer;transition:background .2s;
  border:1.5px solid rgba(0,229,255,0.3);
}
.toggle .slider:before{
  content:"";position:absolute;width:22px;height:22px;left:3px;top:2px;
  background:#fff;border-radius:50%;transition:transform .2s;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.toggle input:checked + .slider{background:var(--cyan);border-color:var(--cyan)}
.toggle input:checked + .slider:before{transform:translateX(22px)}
.set-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid rgba(0,229,255,0.12);gap:12px;
}
.set-row:last-child{border-bottom:none}
.set-row .label{flex:1;font-size:14px;color:#c8e4ff}
.set-row .label small{display:block;font-size:11px;opacity:.6;margin-top:2px}

/* List items */
.list-item{
  padding:12px;margin:6px 0;border-radius:12px;
  background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.18);
  display:flex;align-items:center;gap:10px;
}
.list-item .txt{flex:1;font-size:14px;word-break:break-word}
.list-item .meta{font-size:11px;opacity:.6;margin-top:3px}
.list-item .del{width:36px;height:36px;min-width:36px;min-height:36px;
  border-radius:10px;background:rgba(255,80,80,0.15);color:#ff8888;font-size:16px;
  display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:30px 10px;opacity:.5;font-size:13px}

/* ============ BOTTOM-BAR ============ */
#bottomBar{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(64px + var(--safe-b));
  padding:0 calc(12px + var(--safe-r)) var(--safe-b) calc(12px + var(--safe-l));
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(0deg,rgba(10,14,26,0.9) 0%,rgba(10,14,26,0.55) 100%);
  backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-top:1.5px solid var(--glass-border);z-index:800;
}
.bot-btn{
  flex:1;max-width:160px;height:48px;
  min-height:44px;border-radius:var(--radius-btn);
  background:var(--glass);border:1.5px solid var(--glass-border);
  color:#c8e4ff;font-size:13px;font-weight:700;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 0 16px rgba(0,229,255,0.25);
  transition:transform .15s,box-shadow .15s,background .15s;
}
.bot-btn:active{transform:scale(0.95)}
.bot-btn[data-mode="chat"]{border-color:var(--cyan);color:var(--cyan)}
.bot-btn[data-mode="ai"]{border-color:var(--blue);color:var(--blue)}
.bot-btn[data-mode="cyborg"]{border-color:var(--pink);color:var(--pink);
  box-shadow:0 0 16px rgba(255,120,200,0.3)}

/* ============ TOASTS ============ */
#toasts{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(100px + var(--safe-b));
  z-index:var(--z-toast);pointer-events:none;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  width:calc(100% - 32px);max-width:400px;
}
.toast{
  padding:12px 20px;border-radius:var(--radius-btn);
  background:var(--glass);backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  border:1.5px solid var(--glass-border);
  color:#fff;font-size:14px;font-weight:500;
  box-shadow:0 0 24px rgba(0,229,255,0.5);
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1);
  text-align:center;max-width:100%;
}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}

/* ============ MODAL ============ */
#modalBackdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.75);
  backdrop-filter:blur(8px);z-index:var(--z-modal);
  display:none;align-items:center;justify-content:center;padding:20px;
}
#modalBackdrop.show{display:flex}
.modal{
  background:var(--glass);border:1.5px solid var(--glass-border);
  border-radius:var(--radius-win);padding:24px;max-width:400px;width:100%;
  box-shadow:0 0 60px rgba(0,229,255,0.6);
}
.modal h3{color:var(--cyan);margin-bottom:14px;font-size:17px}

/* ============ CYBORG MODE ============ */
body.cyborg{
  --cyan:#ff78c8;
  --blue:#b478ff;
  --glass-border:rgba(255,120,200,0.4);
  --glow:0 0 24px rgba(255,120,200,0.55);
  --glow-strong:0 0 40px rgba(255,120,200,0.85);
}

/* ============ RESPONSIVE ============ */
@media (max-width:520px){
  .win{min-width:0}
  #brand{font-size:13px}
  .bot-btn{font-size:11px;padding:0 6px}
  .bot-btn .ico{font-size:16px}
  .win-body{padding:12px}
}
</style>
</head>
<body>

<script>
/* ================================================================
   HalDo AI OS Pro Max Professionelle — Teil 1 (Grundgerüst)
   v1.0 Foundation
   ================================================================ */
(function(){
'use strict';

/* ---------- TOAST ---------- */
function toast(msg,ms=2500){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},ms);
}

/* ---------- WELCOME ---------- */
function welcome(appName){
  return `Willkommen bei ${appName} – präsentiert von Halil Donma`;
}

/* ---------- SIDEBAR ---------- */
const sidebar=document.getElementById('sidebar');
const sidebarToggle=document.getElementById('sidebarToggle');
sidebarToggle.addEventListener('click',()=>sidebar.classList.toggle('open'));
document.addEventListener('click',(e)=>{
  if(window.innerWidth<900 && sidebar.classList.contains('open')){
    if(!sidebar.contains(e.target)&&!sidebarToggle.contains(e.target)) sidebar.classList.remove('open');
  }
});

/* ---------- WINDOW SYSTEM ---------- */
let winZ=250;
const winContainer=document.getElementById('windows');
const openWins=new Map();

function openWin(id,title,contentHTML,opts={}){
  if(openWins.has(id)){
    const w=openWins.get(id);
    bringToFront(w);
    return w;
  }
  const win=document.createElement('div');
  win.className='win active';
  win.dataset.id=id;
  const width=opts.width||Math.min(420,window.innerWidth-24);
  const height=opts.height||Math.min(560,window.innerHeight-180);
  const left=opts.x!=null?opts.x:(window.innerWidth-width)/2;
  const top=opts.y!=null?opts.y:Math.max(80,(window.innerHeight-height)/2);
  win.style.cssText=`left:${left}px;top:${top}px;width:${width}px;height:${height}px;`;

  win.innerHTML=`
    <div class="win-header">
      <div class="win-title">${title}</div>
      <button class="win-close" aria-label="Schließen">✕</button>
    </div>
    <div class="win-body">${contentHTML}</div>
  `;
  winContainer.appendChild(win);
  openWins.set(id,win);

  win.querySelector('.win-close').addEventListener('click',()=>closeWin(id));

  makeDraggable(win);

  win.addEventListener('mousedown',()=>bringToFront(win));
  win.addEventListener('touchstart',()=>bringToFront(win),{passive:true});

  bringToFront(win);

  setTimeout(()=>toast(welcome(title)),400);

  if(opts.onMount) opts.onMount(win);
  return win;
}

function closeWin(id){
  const win=openWins.get(id);
  if(!win) return;
  win.style.animation='winIn .2s reverse';
  setTimeout(()=>{win.remove();openWins.delete(id);},180);
}

function bringToFront(win){
  openWins.forEach(w=>w.classList.remove('active'));
  win.classList.add('active');
  winZ++;
  win.style.zIndex=winZ;
}

function makeDraggable(win){
  const header=win.querySelector('.win-header');
  let dragging=false,sx=0,sy=0,sl=0,st=0;

  function down(x,y,target){
    if(target.closest('.win-close')) return;
    // Drag-Zone NUR Mitte: 100px Schutz links/rechts
    const rect=header.getBoundingClientRect();
    const relX=x-rect.left;
    if(relX<100 || relX>rect.width-100) return;

    dragging=true;
    sx=x;sy=y;
    const wr=win.getBoundingClientRect();
    sl=wr.left;st=wr.top;
    win.style.transition='none';
    bringToFront(win);
  }
  function move(x,y){
    if(!dragging) return;
    const dx=x-sx,dy=y-sy;
    let nl=sl+dx,nt=st+dy;
    const wr=win.getBoundingClientRect();
    nl=Math.max(0,Math.min(window.innerWidth-wr.width,nl));
    nt=Math.max(60,Math.min(window.innerHeight-wr.height-70,nt));
    win.style.left=nl+'px';
    win.style.top=nt+'px';
  }
  function up(){dragging=false;win.style.transition='';}

  header.addEventListener('mousedown',e=>down(e.clientX,e.clientY,e.target));
  document.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  document.addEventListener('mouseup',up);

  header.addEventListener('touchstart',e=>{
    const t=e.touches[0];down(t.clientX,t.clientY,e.target);
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const t=e.touches[0];move(t.clientX,t.clientY);
  },{passive:true});
  document.addEventListener('touchend',up);
}

/* ---------- STORAGE HELPER ---------- */
function store(key,def){
  try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):def;}
  catch(e){return def;}
}
function save(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}
}

function AppHalDoAI(){
  const html=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 24px rgba(0,229,255,.6);">🤖</div>
      <div><strong style="color:var(--cyan)">HalDo AI</strong><br><small style="opacity:.6">Modus: Standard</small></div>
    </div>
    <div id="chatLog" style="min-height:200px;max-height:340px;overflow-y:auto;padding:10px;background:rgba(0,0,0,.2);border-radius:12px;margin-bottom:10px;"></div>
    <div style="display:flex;gap:8px;">
      <input id="chatIn" placeholder="Sag Hallo..." style="flex:1;">
      <button class="btn" id="chatSend">➤</button>
    </div>
  `;
  openWin('haldoai','HalDo AI',html,{
    onMount(w){
      const $=s=>w.querySelector(s);
      const log=$('#chatLog');
      function addMsg(who,txt){
        const div=document.createElement('div');
        div.style.cssText='margin:6px 0;padding:8px 12px;border-radius:12px;font-size:13px;max-width:85%;'+
          (who==='ai'?'background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.3);color:#c8e4ff;':
                         'background:rgba(180,120,255,.15);border:1px solid rgba(180,120,255,.3);color:#e0d0ff;margin-left:auto;');
        div.textContent=txt;log.appendChild(div);log.scrollTop=log.scrollHeight;
      }
      addMsg('ai','Hallo Bruder! Ich bin HalDo AI. Willkommen bei HalDo AI OS Pro Max – präsentiert von Halil Donma. Wie kann ich dir helfen?');
      function reply(txt){
        const t=txt.toLowerCase();
        if(/hi|hey|hallo|haldo|servus|moin/.test(t)) return 'Hallo Bruder! Schön dich zu sehen. 💙';
        if(/wie geht|wie läuft/.test(t)) return 'Mir geht es bestens, danke! Ich bin bereit für alles. 🚀';
        if(/journal|tagebuch/.test(t)) {AppJournal();return 'Journal geöffnet! 📔';}
        if(/task|aufgabe/.test(t)) {AppTasks();return 'Tasks geöffnet! ✅';}
        if(/settings|einstellung/.test(t)) {AppSettings();return 'Settings geöffnet! ⚙️';}
        if(/cyborg/.test(t)) {document.body.classList.toggle('cyborg');return 'CYBORG-Modus umgeschaltet! ⚡';}
        if(/danke/.test(t)) return 'Immer gerne, Bruder! 💙';
        return 'Interessant, Bruder. Ich verstehe dich – aber mein volles AI-Gehirn kommt in Phase 4. Für jetzt kann ich: Journal, Tasks, Settings und Cyborg öffnen. Sag z.B. "Journal" oder "Cyborg".';
      }
      function send(){
        const v=$('#chatIn').value.trim();if(!v)return;
        addMsg('me',v);$('#chatIn').value='';
        setTimeout(()=>addMsg('ai',reply(v)),400);
      }
      $('#chatSend').onclick=send;
      $('#chatIn').onkeydown=e=>{if(e.key==='Enter')send();};
      setTimeout(()=>$('#chatIn').focus(),300);
    }
  });
}

/* ================================================================
   KOSMOS (Canvas: Sonne + 12 Planeten + Sterne)
   ================================================================ */
const canvas=document.getElementById('cosmos');
const ctx=canvas.getContext('2d');
let W=0,H=0,CX=0,CY=0,DPR=Math.min(window.devicePixelRatio||1,2);
let STAR_COUNT=365;
const stars=[];

const planets=[
  {name:'Merkur', color:'#9e9e9e', orbit:0.14, size:0.004, speed:0.020},
  {name:'Venus',  color:'#e6c78a', orbit:0.18, size:0.005, speed:0.016},
  {name:'Erde',   color:'#4da8ff', orbit:0.22, size:0.006, speed:0.013},
  {name:'Mars',   color:'#c1440e', orbit:0.26, size:0.005, speed:0.011},
  {name:'Jupiter',color:'#d4a373', orbit:0.32, size:0.010, speed:0.008},
  {name:'Saturn', color:'#e6c78a', orbit:0.38, size:0.009, speed:0.007},
  {name:'Uranus', color:'#a0e6e6', orbit:0.44, size:0.007, speed:0.006},
  {name:'Neptun', color:'#3b5998', orbit:0.49, size:0.007, speed:0.005},
  {name:'Pluto',  color:'#a08878', orbit:0.53, size:0.003, speed:0.004},
  {name:'Xena',   color:'#cccccc', orbit:0.57, size:0.003, speed:0.0035},
  {name:'Sedna',  color:'#dddddd', orbit:0.60, size:0.003, speed:0.003},
  {name:'Eris',   color:'#eeeeee', orbit:0.63, size:0.003, speed:0.0025}
];
let angles=planets.map(()=>Math.random()*Math.PI*2);

function initStars(){
  stars.length=0;
  for(let i=0;i<STAR_COUNT;i++){
    stars.push({
      x:Math.random(), y:Math.random(),
      r:Math.random()*1.4+0.2,
      tw:Math.random()*Math.PI*2,
      ts:0.008+Math.random()*0.02
    });
  }
}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2;CY=H/2;
}
window.addEventListener('resize',resize);
resize();initStars();

let t=0;
function draw(){
  t+=1;
  // Hintergrund-Gradient
  const g=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H));
  g.addColorStop(0,'#0a1220');
  g.addColorStop(0.5,'#070b14');
  g.addColorStop(1,'#03050a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Sterne
  stars.forEach(s=>{
    s.tw+=s.ts;
    const a=0.4+0.6*Math.abs(Math.sin(s.tw));
    ctx.fillStyle=`rgba(200,230,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fill();
  });

  // Sonne (Zentrum) mit Corona
  const sunR=Math.min(W,H)*0.035;
  const pulse=1+0.08*Math.sin(t*0.03);
  // Corona
  const cg=ctx.createRadialGradient(CX,CY,sunR*0.8,CX,CY,sunR*4*pulse);
  cg.addColorStop(0,'rgba(255,200,80,0.55)');
  cg.addColorStop(0.4,'rgba(255,140,40,0.22)');
  cg.addColorStop(1,'rgba(255,100,20,0)');
  ctx.fillStyle=cg;
  ctx.beginPath();ctx.arc(CX,CY,sunR*4*pulse,0,Math.PI*2);ctx.fill();
  // Sonnenkern
  const sg=ctx.createRadialGradient(CX,CY,0,CX,CY,sunR);
  sg.addColorStop(0,'#fff8e0');
  sg.addColorStop(0.5,'#ffd166');
  sg.addColorStop(1,'#ff8c1a');
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.arc(CX,CY,sunR,0,Math.PI*2);ctx.fill();

  // Planeten
  const base=Math.min(W,H);
  planets.forEach((p,i)=>{
    angles[i]+=p.speed*0.01;
    const orbitR=p.orbit*base;
    const x=CX+Math.cos(angles[i])*orbitR;
    const y=CY+Math.sin(angles[i])*orbitR;
    const r=Math.max(p.size*base,1.5);

    // Orbit-Linie (dezent)
    ctx.strokeStyle='rgba(0,229,255,0.05)';
    ctx.lineWidth=0.6;
    ctx.beginPath();ctx.arc(CX,CY,orbitR,0,Math.PI*2);ctx.stroke();

    // Planet
    const pg=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
    pg.addColorStop(0,'#ffffff');
    pg.addColorStop(0.35,p.color);
    pg.addColorStop(1,'#000000');
    ctx.fillStyle=pg;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();

    // Glow
    ctx.shadowColor=p.color;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(x,y,r*0.9,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  requestAnimationFrame(draw);
}
draw();

window.__cosmosSetStars=(n)=>{STAR_COUNT=n;initStars();};

setTimeout(()=>toast('💙 Willkommen bei HalDo AI OS Pro Max – präsentiert von Halil Donma'),600);

})();
