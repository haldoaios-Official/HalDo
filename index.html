<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<title>HalDo AI OS v135</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='82'%3E🦚%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#02040a;color:#dff6ff;font-size:13px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
:root{--p1:#00e5ff;--p2:#4da8ff;--p3:#b478ff;--bg-card:rgba(15,25,50,.85);--border:1.5px solid rgba(0,229,255,.4);--border-soft:1px solid rgba(0,229,255,.18);--text:#dff6ff;--text-dim:#7a9bb8;--text-mute:#4a6b88;--radius:18px;--shadow:0 10px 40px rgba(0,229,255,.15);--glow:0 0 20px rgba(0,229,255,.5);--topbar-h:56px;--bottombar-h:60px}
body.cyborg{--p1:#ff78c8;--p2:#b478ff;--p3:#ff5cae;--border:1.5px solid rgba(255,120,200,.5);--border-soft:1px solid rgba(255,120,200,.2);--glow:0 0 20px rgba(255,120,200,.6)}
#bgLayer{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#0a1a3a,#02040a 70%)}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;display:flex;align-items:center;gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top);background:rgba(10,20,40,.4);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:var(--border-soft)}
#topbar .logo{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 6px;border-radius:10px}
#topbar .logo .peacock{font-size:22px;filter:drop-shadow(0 0 8px var(--p1))}
#topbar .logo .txt{display:flex;flex-direction:column;line-height:1.05}
#topbar .logo .txt .t1{font-size:12px;font-weight:800;color:var(--p1)}
#topbar .logo .txt .t2{font-size:8px;color:var(--text-mute);letter-spacing:1.5px}
#topbar .spacer{flex:1}
#topbar .icon-btn{width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,.4);border:var(--border-soft);color:var(--p1);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
#topbar .icon-btn:hover{background:rgba(0,229,255,.15);box-shadow:var(--glow)}
@media(max-width:380px){#topbar .icon-btn{width:34px;height:34px}#topbar .logo .txt{display:none}}
#sidebar{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));left:0;width:260px;max-width:80vw;z-index:45;padding:10px 8px;background:rgba(10,20,40,.92);backdrop-filter:blur(28px);border-right:var(--border-soft);overflow-y:auto;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#sidebar.open{transform:translateX(0)}
#sidebar::-webkit-scrollbar{width:4px}#sidebar::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:2px}
#sidebar .group{font-size:9.5px;color:var(--text-mute);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:12px 8px 6px}
#sidebar .item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;width:100%;text-align:left;margin-bottom:2px}
#sidebar .item:hover{background:rgba(0,229,255,.1)}
#sidebar .item .ico{font-size:20px;flex-shrink:0;width:26px;text-align:center}
#sidebar .item .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar .item .sub{font-size:9.5px;color:var(--text-mute);font-weight:600}
#sidebar .sep{height:1px;background:var(--border-soft);margin:8px 6px;border:none}
#desktop{position:fixed;top:calc(var(--topbar-h) + env(safe-area-inset-top));left:0;right:0;bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom));z-index:20;overflow:hidden;pointer-events:none}
#desktop .window{pointer-events:auto}
.window{position:absolute;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:100;min-width:260px;min-height:200px;animation:winOpen .25s ease}
@keyframes winOpen{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.window.focused{box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 50px rgba(0,229,255,.25);border-color:var(--p1);z-index:999}
.window.minimized{display:none}
.window.maximized{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(0,229,255,.1),transparent);border-bottom:var(--border-soft);cursor:move;flex-shrink:0;user-select:none;touch-action:none}
.titlebar .ico{font-size:18px;pointer-events:none}
.titlebar .title{flex:1;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.wbtns{display:flex;gap:5px}
.wbtn{width:36px;height:36px;min-width:36px;border-radius:9px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s}
.wbtn:hover{background:rgba(0,229,255,.25)}
.wbtn.close{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5);color:#ff8080}
.wbtn.set{background:rgba(180,120,255,.15);border-color:rgba(180,120,255,.5);color:#c084fc}
.wbtn.max{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:#4ade80}
.wbtn.voice{background:rgba(255,200,60,.15);border-color:rgba(255,200,60,.5);color:#fbbf24}
.wbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch}
.wbody::-webkit-scrollbar{width:6px}.wbody::-webkit-scrollbar-thumb{background:rgba(0,229,255,.3);border-radius:3px}
.resizer{position:absolute;width:18px;height:18px;bottom:0;right:0;cursor:nwse-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;bottom:4px;right:4px;width:10px;height:10px;border-right:2px solid var(--p1);border-bottom:2px solid var(--p1);opacity:.4}
#bottombar{position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);z-index:50;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;padding-bottom:env(safe-area-inset-bottom);background:rgba(10,20,40,.4);backdrop-filter:blur(18px);border-top:var(--border-soft)}
.bbtn{min-width:80px;padding:8px 14px;border-radius:12px;background:rgba(0,229,255,.1);border:var(--border-soft);color:var(--p1);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.bbtn:hover{background:rgba(0,229,255,.2);transform:translateY(-2px)}
.bbtn .ico{font-size:18px;line-height:1}
.bbtn.cyborg{background:rgba(255,120,200,.15);border-color:rgba(255,120,200,.5);color:#ff78c8}
@media(max-width:400px){.bbtn{min-width:66px;padding:6px 8px;font-size:10px}.bbtn .ico{font-size:16px}}
.modal{position:fixed;inset:0;z-index:200;background:rgba(2,4,10,.8);display:none;align-items:flex-start;justify-content:center;padding:14px;padding-top:calc(var(--topbar-h) + 14px);padding-bottom:calc(var(--bottombar-h) + 14px);backdrop-filter:blur(8px);overflow-y:auto}
.modal.show{display:flex}
.panel-box{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--bg-card);backdrop-filter:blur(28px);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:auto 0}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg-card);backdrop-filter:blur(28px);border-bottom:var(--border-soft);z-index:2}
.phead .ico{font-size:20px}
.phead h2{font-size:13.5px;font-weight:900;color:var(--p1);flex:1}
.phead .close{width:38px;height:38px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#ff8080;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.pbody{padding:14px 16px 18px}
.group{margin-bottom:14px;padding:12px;background:rgba(0,0,0,.2);border-radius:12px;border:var(--border-soft)}
.group h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--p1);font-weight:800;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:10px}
.row:last-child{border-bottom:none}
.row .lbl{font-size:12px;font-weight:700;flex:1;min-width:0}
.row .lbl small{display:block;font-size:10px;color:var(--text-mute);font-weight:600;margin-top:2px}
.row input[type=text],.row input[type=password]{padding:8px 10px;background:rgba(0,0,0,.4);border:var(--border-soft);border-radius:8px;font-size:12px;min-width:120px;max-width:60%;outline:none;color:inherit}
.sw{width:46px;height:24px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#7a9bb8;transition:.2s}
.sw.on{background:rgba(0,229,255,.3);border-color:var(--p1)}
.sw.on::after{left:22px;background:var(--p1);box-shadow:0 0 10px var(--p1)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-card{padding:10px 6px;border-radius:12px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.theme-card.active{border-color:var(--p1);box-shadow:var(--glow)}
.theme-card .preview{height:44px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.1)}
.theme-card .preview.kosmos{background:radial-gradient(circle at 50% 50%,#ff9028,#0a1a3a 60%,#02040a)}
.theme-card .preview.erde{background:radial-gradient(circle at 40% 40%,#4a8fd8,#1a4a8a 50%,#02040a)}
.theme-card .preview.holo{background:linear-gradient(135deg,#0a1a3a,#1a2a5a);box-shadow:inset 0 0 30px rgba(0,229,255,.3)}
.theme-card .name{font-size:10px;font-weight:800}
.speed-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.speed-row input[type=range]{flex:1;accent-color:var(--p1);height:6px}
.speed-row .sv{font-size:11px;font-weight:800;color:var(--p1);min-width:50px;text-align:right;font-family:ui-monospace}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.lang-card{padding:9px;border-radius:10px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.lang-card.active{border-color:var(--p1);background:rgba(0,229,255,.12)}
.lang-card .flag{font-size:20px;display:block;margin-bottom:3px}
.lang-card .name{font-size:10.5px;font-weight:800}
.voice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.voice-card{padding:11px 8px;border-radius:11px;background:rgba(0,0,0,.25);border:var(--border-soft);cursor:pointer;text-align:center}
.voice-card.active{border-color:var(--p1);background:rgba(0,229,255,.15);box-shadow:var(--glow)}
.voice-card .emoji{font-size:28px;display:block;margin-bottom:4px}
.voice-card .n{font-size:11.5px;font-weight:800}
.voice-card .d{font-size:9.5px;color:var(--text-mute);margin-top:2px}
@media(max-width:420px){.voice-grid{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(var(--bottombar-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);padding:10px 18px;background:var(--bg-card);border:var(--border);border-radius:22px;font-size:12px;font-weight:700;color:var(--p1);z-index:500;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;max-width:calc(100vw - 32px);box-shadow:var(--glow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:#22c55e;color:#4ade80}
#toast.err{border-color:#ef4444;color:#ff8080}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 13px;border-radius:11px;border:var(--border-soft);background:rgba(0,0,0,.3);color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.25));border-color:var(--p1);color:var(--text)}
.card{padding:13px;background:rgba(0,0,0,.2);border-radius:13px;border:var(--border-soft);margin-bottom:10px}
.card h3{font-size:11.5px;font-weight:900;color:var(--p1);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.btn{padding:10px 15px;border-radius:11px;border:none;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.15s;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;box-shadow:0 4px 15px rgba(0,229,255,.3)}
.btn.sec{background:rgba(0,229,255,.1);color:var(--p1);border:var(--border-soft);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn.full{width:100%}
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.3);border:var(--border-soft);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.placeholder{padding:40px 20px;text-align:center;color:var(--text-mute);font-size:12px;line-height:1.6}
.msg{max-width:82%;padding:10px 14px;border-radius:15px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;font-weight:600;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:rgba(0,229,255,.1);border:var(--border-soft);border-bottom-left-radius:4px}
.chat-quick{display:flex;gap:6px;padding:6px 0 8px;overflow-x:auto;scrollbar-width:none}
.chat-quick::-webkit-scrollbar{display:none}
.chat-quick button{padding:6px 11px;background:rgba(0,229,255,.1);border:var(--border-soft);border-radius:14px;color:var(--text-dim);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chat-input-row{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.chat-input-row textarea{flex:1;background:rgba(0,0,0,.35);border:var(--border-soft);color:var(--text);padding:10px 14px;border-radius:20px;font-family:inherit;font-size:13px;outline:none;resize:none;line-height:1.4;min-height:42px;max-height:120px}
.chat-input-row .ibtn{width:42px;height:42px;border-radius:50%;border:var(--border-soft);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,229,255,.1);color:var(--p1)}
.chat-input-row .ibtn.send{background:linear-gradient(135deg,var(--p1),var(--p2));color:#001428;border:none}
.badge-info{padding:8px 10px;background:rgba(0,229,255,.08);border:1px dashed rgba(0,229,255,.3);border-radius:8px;font-size:10.5px;color:var(--text-dim);line-height:1.5;margin-top:6px}
.hint{position:fixed;bottom:calc(var(--bottombar-h) + env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-mute);background:rgba(0,0,0,.5);padding:6px 14px;border-radius:16px;z-index:15;pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;transition:opacity .3s}
.hint.hide{opacity:0}
.ez-engel{padding:14px;background:linear-gradient(135deg,rgba(216,180,120,.12),rgba(0,229,255,.08));border-radius:12px;margin-bottom:10px;border-left:3px solid #d8b478}
.ez-engel .n{font-size:14px;font-weight:900;color:#e8ca9a}
.ez-engel .sub{font-size:10.5px;color:#c084fc;font-weight:700;margin-top:2px}
.ez-engel .d{font-size:11.5px;line-height:1.6;color:var(--text-dim);margin-top:6px}
.ez-qewl{padding:14px;background:linear-gradient(135deg,rgba(180,120,255,.1),rgba(0,229,255,.08));border-radius:12px;margin-bottom:10px;border-left:3px solid var(--p3)}
.ez-qewl .t{font-size:13px;font-weight:900;color:var(--p3)}
.ez-qewl .tr{font-size:10.5px;color:#c084fc;margin-top:2px;font-style:italic}
.ez-qewl .txt{font-size:12px;line-height:1.75;color:var(--text-dim);margin-top:8px;font-style:italic}
.ez-timeline{padding:14px;background:rgba(0,0,0,.2);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--p1)}
.ez-timeline .y{font-size:10px;color:#c084fc;font-weight:800;letter-spacing:1px}
.ez-timeline .n{font-size:13px;font-weight:900;color:var(--p1);margin-top:4px}
.ez-timeline .d{font-size:11.5px;line-height:1.65;color:var(--text-dim);margin-top:6px}
.alpha-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.alpha-cell{padding:10px 4px;background:rgba(0,0,0,.2);border-radius:8px;text-align:center;border:1px solid rgba(0,229,255,.2);cursor:pointer}
.alpha-cell .ch{font-size:18px;font-weight:900;color:var(--p1)}
.alpha-cell:hover{background:rgba(0,229,255,.15)}
@media(max-width:400px){.alpha-grid{grid-template-columns:repeat(5,1fr)}}
.contact-item{display:flex;align-items:center;gap:12px;padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px}
.contact-item .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p3));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#001428;flex-shrink:0}
.contact-item .info{flex:1;min-width:0}
.contact-item .info .nm{font-size:13px;font-weight:800}
.contact-item .info .ph{font-size:10.5px;color:var(--text-mute)}
.contact-item .actions{display:flex;gap:5px}
.contact-item .actions button{width:34px;height:34px;border-radius:50%;border:var(--border-soft);background:rgba(0,229,255,.1);color:var(--p1);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.radio-item{display:flex;align-items:center;gap:12px;padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px;cursor:pointer}
.radio-item.active{background:rgba(0,229,255,.15);border:1px solid var(--p1)}
.radio-item .logo{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.radio-item .info{flex:1;min-width:0}
.radio-item .info .nm{font-size:13px;font-weight:800}
.radio-item .info .gn{font-size:10.5px;color:var(--text-mute)}
.doc-item{display:flex;align-items:center;gap:12px;padding:11px;background:rgba(0,0,0,.2);border-radius:10px;margin-bottom:5px;cursor:pointer}
.doc-item:hover{background:rgba(0,229,255,.1)}
.doc-item .ico{font-size:24px;flex-shrink:0}
.doc-item .info{flex:1;min-width:0}
.doc-item .info .nm{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item .info .dt{font-size:10px;color:var(--text-mute)}
.pdf-viewer{width:100%;height:100%;border:none;border-radius:10px;background:#fff}
.camera-video{width:100%;max-width:480px;border-radius:12px;background:#000;border:1px solid var(--p1)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.gallery-item{aspect-ratio:1;background:rgba(0,0,0,.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;border:var(--border-soft);cursor:pointer;overflow:hidden}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.table-cell{width:100%;padding:8px;background:rgba(0,0,0,.3);border:1px solid rgba(0,229,255,.15);color:inherit;font-size:12px;font-family:ui-monospace;outline:none}

.chess-board{display:grid;grid-template-columns:repeat(8,1fr);gap:0;max-width:360px;margin:0 auto;border:2px solid var(--p1);border-radius:8px;overflow:hidden;aspect-ratio:1}
.chess-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;user-select:none}
.chess-cell.light{background:#e8d0a8}
.chess-cell.dark{background:#a07848}

  function drawPlanet(x,y,r,pl){

    if(pl.hasRing){ctx.save();ctx.translate(x,y);ctx.rotate(-0.4);var rg=ctx.createLinearGradient(-r*2,0,r*2,0);rg.addColorStop(0,"rgba(232,216,160,.2)");rg.addColorStop(0.5,"rgba(245,232,192,.75)");rg.addColorStop(1,"rgba(200,184,136,.2)");ctx.strokeStyle=rg;ctx.lineWidth=r*0.4;ctx.beginPath();ctx.ellipse(0,0,r*1.85,r*0.52,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="rgba(255,244,212,.9)";ctx.lineWidth=r*0.12;ctx.beginPath();ctx.ellipse(0,0,r*1.95,r*0.57,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
    ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.arc(x-r*0.4,y-r*0.4,r*0.22,0,Math.PI*2);ctx.fill();

  function drawClockPlanet(cx,cy,scale,hand,now){

    var orbitR=hand.d*scale;ctx.strokeStyle="rgba(255,255,255,.05)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,orbitR,0,Math.PI*2);ctx.stroke();

  function drawKosmos(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){var s=stars[i],a=0.4+Math.sin(t*0.03+s.tw)*0.4;ctx.fillStyle="rgba(180,220,255,"+a+")";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();}

      var px=cx+Math.cos(angles[p])*orbitR,py=cy+Math.sin(angles[p])*orbitR;

      planetScreenPos.push({x:px,y:py,r:pl.size*scale*0.9+6,app:pl.app});
      angles[p]+=pl.speed*speedFactor*0.03;pl.rotAngle+=pl.rot*speedFactor*0.035;
    }

    t+=1;
  }
  function drawErde(){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,w,h);
    for(var i=0;i<stars.length;i++){var s=stars[i];ctx.fillStyle="rgba(180,220,255,.5)";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size,0,Math.PI*2);ctx.fill();}
    var cx=w/2,cy=h/2,R=Math.min(w,h)*0.28;sunScreenPos={x:cx,y:cy,r:0};
    var atm=ctx.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.3);atm.addColorStop(0,"rgba(100,180,255,.45)");atm.addColorStop(1,"transparent");ctx.fillStyle=atm;ctx.beginPath();ctx.arc(cx,cy,R*1.3,0,Math.PI*2);ctx.fill();
    var g=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);g.addColorStop(0,"#6fa8dc");g.addColorStop(0.5,"#2c5f8a");g.addColorStop(1,"#0a2540");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();
    var rot=t*0.002*speedFactor;for(var k=0;k<6;k++){var ang=k*(Math.PI*2/6)+rot;if(Math.cos(ang)<-0.2)continue;var px=cx+Math.sin(ang)*R*0.7,py=cy+(Math.sin(k*1.7)*0.3)*R,sz=R*0.15;ctx.fillStyle="rgba(60,120,60,.7)";ctx.beginPath();ctx.ellipse(px,py,sz,sz*0.7,0,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle="rgba(100,180,255,.6)";ctx.lineWidth=2;ctx.shadowBlur=30;ctx.shadowColor="#4da8ff";ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;t+=1;
  }
  function drawHolo(){ctx.clearRect(0,0,w,h);for(var i=0;i<stars.length;i++){var s=stars[i],a=0.3+Math.sin(t*0.03+i)*0.3;ctx.fillStyle="rgba(0,229,255,"+a+")";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.size*0.7,0,Math.PI*2);ctx.fill();}sunScreenPos={x:0,y:0,r:0};planetScreenPos=[];t+=1;}
  function loop(){if(theme==="kosmos")drawKosmos();else if(theme==="erde")drawErde();else drawHolo();animId=requestAnimationFrame(loop);}
  return{
    init:function(){
      canvas=$("bgCanvas");ctx=canvas.getContext("2d");resize();initStars();
      window.addEventListener("resize",resize);
      canvas.addEventListener("click",function(e){
        var rect=canvas.getBoundingClientRect();var x=e.clientX-rect.left,y=e.clientY-rect.top;
        for(var i=0;i<planetScreenPos.length;i++){var p=planetScreenPos[i];var dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<=p.r*p.r){if(p.app)Windows.open(p.app);return;}}
        if(theme==="kosmos"){var dx2=x-sunScreenPos.x,dy2=y-sunScreenPos.y;if(dx2*dx2+dy2*dy2<=(sunScreenPos.r*1.7)*(sunScreenPos.r*1.7))Windows.open("chat");}
      });
      canvas.addEventListener("mousemove",function(e){
        var rect=canvas.getBoundingClientRect();var x=e.clientX-rect.left,y=e.clientY-rect.top;var hover=false;
        if(theme==="kosmos"){var dx2=x-sunScreenPos.x,dy2=y-sunScreenPos.y;if(dx2*dx2+dy2*dy2<=(sunScreenPos.r*1.7)*(sunScreenPos.r*1.7))hover=true;}
        for(var i=0;i<planetScreenPos.length;i++){var p=planetScreenPos[i];var dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<=p.r*p.r)hover=true;}
        sunHover=hover;canvas.style.cursor=hover?"pointer":"crosshair";
      });
      if(animId)cancelAnimationFrame(animId);loop();
    },
    setTheme:function(th,spd,ck){theme=th;speedFactor=(spd||5)*0.05;if(ck!==undefined)clockOn=ck;}
  };
})();

  bindWindow:function(win){

    function md(e){if(!drag)return;var p=e.touches?e.touches[0]:e;var dx=p.clientX-sx,dy=p.clientY-sy;var dr=desktop.getBoundingClientRect(),ww=win.offsetWidth,wh=win.offsetHeight;win.style.left=Math.max(-ww*0.4,Math.min(dr.width-ww*0.6,ox+dx))+"px";win.style.top=Math.max(-10,Math.min(dr.height-50,oy+dy))+"px";}

      function er(){rz=false;}

MODULES.haldoai={render:function(el){
  var prov=S.get("ai_provider","gemini");
  var hist=S.get("ai_hist",[]);
  function build(){
    el.innerHTML='<div class="tabs">'
      +'<button class="tab'+(prov==="gemini"?" active":"")+'" data-aip="gemini">🦚 Gemini</button>'
      +'<button class="tab'+(prov==="openai"?" active":"")+'" data-aip="openai">🤖 OpenAI</button>'

      +hist.map(function(m){return '<div class="msg '+(m.r==="user"?"user":"bot")+'">'+esc(m.t)+'</div>';}).join("")
      +'</div>'
      +'<div class="chat-input-row"><textarea id="aiIn" placeholder="Frag '+(prov==="gemini"?"Gemini":prov==="openai"?"GPT":"Claude")+'…" rows="1"></textarea><button class="ibtn send" id="aiSend">➤</button></div>'
      +'<button class="btn sec full" id="aiClear" style="margin-top:8px">🗑️ Verlauf löschen</button></div>';
    el.querySelectorAll("[data-aip]").forEach(function(b){b.addEventListener("click",function(){prov=b.dataset.aip;S.set("ai_provider",prov);build();});});
    if(prov==="info"){
      $("aiSetPanel").innerHTML='<div class="card"><h3>ℹ️ Echte KI nutzen</h3><div style="font-size:11.5px;line-height:1.7;color:var(--text-dim)">'
        +'<p style="margin-bottom:8px"><b style="color:var(--p1)">Google Gemini:</b> Kostenloser Key unter <b>aistudio.google.com/app/apikey</b>. Sehr schnell & gut.</p>'
        +'<p style="margin-bottom:8px"><b style="color:var(--p1)">OpenAI:</b> Key unter <b>platform.openai.com/api-keys</b> (kostenpflichtig).</p>'
        +'<p style="margin-bottom:8px"><b style="color:var(--p1)">Anthropic Claude:</b> Key unter <b>console.anthropic.com</b>.</p>'
        +'<p><b style="color:var(--p1)">Datenschutz:</b> Deine Keys werden nur lokal in deinem Browser gespeichert (localStorage).</p>'
        +'</div></div>';
      return;
    }
    var key=S.get("ai_key_"+prov,"");
    var mdl=S.get("ai_model_"+prov, prov==="gemini"?"gemini-2.0-flash":prov==="openai"?"gpt-4o-mini":"claude-3-5-haiku-20241022");
    $("aiSetPanel").innerHTML='<div class="card"><h3>🔑 '+esc(prov.toUpperCase())+' API-Key</h3>'
      +'<div class="field"><label>API-Key</label><input type="password" id="aiKey" placeholder="Key einfügen..." value="'+esc(key)+'"></div>'
      +'<div class="field"><label>Modell</label><input type="text" id="aiModel" value="'+esc(mdl)+'"></div>'
      +'<button class="btn sec full" id="aiSaveKey">💾 Speichern</button>'
      +'<div class="badge-info">'+(key?'✅ Key gespeichert ('+key.length+' Zeichen)':'⚠️ Ohne Key → keine echten Antworten')+'</div></div>';
    $("aiSaveKey").addEventListener("click",function(){S.set("ai_key_"+prov,$("aiKey").value.trim());S.set("ai_model_"+prov,$("aiModel").value.trim());toast("💾 Key gespeichert","ok");build();});

    $("aiSend").addEventListener("click",sendMsg);
    $("aiIn").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}});
    $("aiClear").addEventListener("click",function(){hist=[];S.set("ai_hist",hist);build();});

    function sendMsg(){
      var t=$("aiIn").value.trim();if(!t)return;
      var key=S.get("ai_key_"+prov,"");if(!key){toast("⚠️ Erst API-Key eingeben","err");return;}
      hist.push({r:"user",t:t});$("aiIn").value="";S.set("ai_hist",hist);
      var body=$("aiBody");body.innerHTML+='<div class="msg user">'+esc(t)+'</div><div class="msg bot" id="aiWait">⏳ Denkt nach…</div>';
      body.scrollTop=body.scrollHeight;
      callAPI(t,key,S.get("ai_model_"+prov,"")).then(function(reply){
        var w=$("aiWait");if(w)w.textContent=reply;
        hist.push({r:"bot",t:reply});S.set("ai_hist",hist);
        Voice.auto(reply);
      }).catch(function(e){
        var w=$("aiWait");if(w)w.textContent="❌ Fehler: "+e.message;
      });
    }
  }
  function callAPI(prompt,key,model){
    if(prov==="gemini"){
      model=model||"gemini-2.0-flash";
      return fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+key,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
      }).then(function(r){return r.json();}).then(function(d){
        if(d.error)throw new Error(d.error.message);
        return d.candidates[0].content.parts[0].text;
      });
    }
    if(prov==="openai"){
      model=model||"gpt-4o-mini";
      return fetch("https://api.openai.com/v1/chat/completions",{
        method:"POST",headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"},
        body:JSON.stringify({model:model,messages:[{role:"user",content:prompt}]})
      }).then(function(r){return r.json();}).then(function(d){
        if(d.error)throw new Error(d.error.message);
        return d.choices[0].message.content;
      });
    }
    if(prov==="claude"){
      model=model||"claude-3-5-haiku-20241022";
      return fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true","Content-Type":"application/json"},
        body:JSON.stringify({model:model,max_tokens:1024,messages:[{role:"user",content:prompt}]})
      }).then(function(r){return r.json();}).then(function(d){
        if(d.error)throw new Error(d.error.message);
        return d.content[0].text;
      });
    }
    return Promise.reject(new Error("Provider unbekannt"));
  }
  build();
}};

    } else if(tab==="mathe"){
      body='<div class="card"><h3>🧠 Mathe-Trainer</h3>'
        +'<div class="field"><label>Schwierigkeit</label><select id="mDiff"><option value="1">Leicht (+/-)</option><option value="2" selected>Mittel (×)</option><option value="3">Schwer (÷ / gemischt)</option></select></div>'
        +'<div id="mQuiz" style="padding:20px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(180,120,255,.1));border-radius:14px;text-align:center;min-height:140px">'
        +'<div style="font-size:12px;color:var(--text-mute)">Score: <span id="mScore">0</span> · Streak: <span id="mStreak">0</span></div>'
        +'<div id="mQ" style="font-size:36px;font-weight:900;color:var(--p1);margin:14px 0">—</div>'
        +'<input type="number" id="mA" placeholder="Antwort" style="padding:14px;font-size:20px;text-align:center;background:rgba(0,0,0,.4);border:2px solid var(--p1);border-radius:12px;color:var(--p1);width:180px;outline:none;font-weight:900">'
        +'<button class="btn" id="mGo" style="margin-left:8px">OK</button></div>'
        +'<button class="btn sec full" id="mStart" style="margin-top:10px">▶ Starten</button></div>';
    }
    el.innerHTML='<div class="tabs">'
      +'<button class="tab'+(tab==="vokabeln"?" active":"")+'" data-lt="vokabeln">📖 Vokabeln</button>'
      +'<button class="tab'+(tab==="uebersetzer"?" active":"")+'" data-lt="uebersetzer">🌐 Übersetzer</button>'
      +'<button class="tab'+(tab==="formeln"?" active":"")+'" data-lt="formeln">🧮 Formeln</button>'
      +'<button class="tab'+(tab==="mathe"?" active":"")+'" data-lt="mathe">🧠 Mathe</button></div>'+body;
    el.querySelectorAll("[data-lt]").forEach(function(b){b.addEventListener("click",function(){tab=b.dataset.lt;build();});});

      $("trGo").addEventListener("click",function(){
        var t=$("trIn").value.trim(),f=$("trFrom").value,to=$("trTo").value;if(!t)return;

          .then(function(r){return r.json();}).then(function(d){$("trRes").textContent=d.responseData.translatedText;Voice.speak(d.responseData.translatedText);})
          .catch(function(e){$("trRes").textContent="❌ "+e.message;});
      });
    }
    if(tab==="mathe"){
      var score=0,streak=0,cur=null;
      function gen(){var d=parseInt($("mDiff").value);var a,b,op,r;if(d===1){a=Math.floor(Math.random()*50)+1;b=Math.floor(Math.random()*50)+1;op=Math.random()<0.5?"+":"-";r=op==="+"?a+b:a-b;}
        else if(d===2){a=Math.floor(Math.random()*12)+2;b=Math.floor(Math.random()*12)+2;op="×";r=a*b;}
        else{op=["÷","×","+"][Math.floor(Math.random()*3)];if(op==="÷"){b=Math.floor(Math.random()*11)+2;r=Math.floor(Math.random()*11)+2;a=b*r;}else if(op==="×"){a=Math.floor(Math.random()*15)+5;b=Math.floor(Math.random()*15)+5;r=a*b;}else{a=Math.floor(Math.random()*200)+10;b=Math.floor(Math.random()*200)+10;r=a+b;}}
        cur={q:a+" "+op+" "+b,r:r};$("mQ").textContent=cur.q;$("mA").value="";$("mA").focus();}
      $("mStart").addEventListener("click",function(){score=0;streak=0;$("mScore").textContent=0;$("mStreak").textContent=0;gen();});
      $("mGo").addEventListener("click",function(){if(!cur)return;var v=parseInt($("mA").value);if(v===cur.r){score++;streak++;$("mScore").textContent=score;$("mStreak").textContent=streak;$("mQ").style.color="#4ade80";}else{$("mQ").style.color="#ff8080";streak=0;$("mStreak").textContent=0;}setTimeout(function(){$("mQ").style.color="var(--p1)";gen();},300);});
      $("mA").addEventListener("keydown",function(e){if(e.key==="Enter")$("mGo").click();});
    }
  }
  build();
}};

MODULES.finanzen={render:function(el){
  var items=S.get("fin_items",[]);

    var t=items.reduce(function(s,i){return s+(i.type==="in"?i.amount:-i.amount);},0);
    var inc=items.filter(function(i){return i.type==="in";}).reduce(function(s,i){return s+i.amount;},0);
    var exp=items.filter(function(i){return i.type==="out";}).reduce(function(s,i){return s+i.amount;},0);

      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'

      +'<div style="padding:14px;background:rgba(239,68,68,.15);border-radius:12px"><div style="font-size:10px;color:var(--text-mute);font-weight:700">AUSGABEN</div><div style="font-size:22px;font-weight:900;color:#ff8080">-'+exp.toFixed(2)+'€</div></div></div>'
      +'<div style="padding:18px;background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(180,120,255,.15));border-radius:14px;text-align:center;margin-bottom:14px"><div style="font-size:10px;color:var(--text-mute);font-weight:700">BILANZ</div><div style="font-size:34px;font-weight:900;color:'+(t>=0?"#4ade80":"#ff8080")+'">'+t.toFixed(2)+'€</div></div>'
      +'<div class="card"><h3>➕ Neue Buchung</h3><div class="field"><label>Beschreibung</label><input type="text" id="fiDesc" placeholder="z.B. Einkauf"></div><div class="field"><label>Betrag</label><input type="number" id="fiAmt" step="0.01" placeholder="0.00"></div>'
      +'<div style="display:flex;gap:8px"><button class="btn" id="fiIn" style="flex:1;background:linear-gradient(135deg,#22c55e,#10b981)">+ Einnahme</button><button class="btn danger" id="fiOut" style="flex:1">- Ausgabe</button></div></div>'
      +'<div class="card"><h3>📋 Buchungen ('+items.length+')</h3>'
      +(items.length?items.slice().reverse().map(function(i,idx){var ri=items.length-1-idx;return '<div style="padding:10px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:12px;font-weight:800">'+esc(i.desc)+'</div><div style="font-size:9px;color:var(--text-mute)">'+esc(i.date)+'</div></div><div style="display:flex;align-items:center;gap:8px"><div style="font-size:13px;font-weight:900;color:'+(i.type==="in"?"#4ade80":"#ff8080")+'">'+(i.type==="in"?"+":"-")+i.amount.toFixed(2)+'€</div><button data-fdel="'+ri+'" style="background:transparent;border:none;color:#ff8080;cursor:pointer">✕</button></div></div>';}).join(""):'<div style="color:var(--text-mute);text-align:center;padding:20px">Keine Buchungen</div>')+'</div>';
    $("fiIn").addEventListener("click",function(){add("in");});$("fiOut").addEventListener("click",function(){add("out");});
    el.querySelectorAll("[data-fdel]").forEach(function(b){b.addEventListener("click",function(){items.splice(parseInt(b.dataset.fdel),1);S.set("fin_items",items);build();});});
  }
  function add(type){var d=$("fiDesc").value.trim()||(type==="in"?"Einnahme":"Ausgabe");var a=parseFloat($("fiAmt").value);if(isNaN(a)||a<=0)return;items.push({desc:d,amount:a,type:type,date:new Date().toLocaleDateString("de-DE")});S.set("fin_items",items);build();}
  build();
}};

          if(!d1.features||!d1.features.length)throw new Error("Start nicht gefunden");var c1=d1.features[0].geometry.coordinates;
          return fetch("https://api.openrouteservice.org/geocode/search?api_key="+key+"&text="+encodeURIComponent(z)+"&size=1").then(function(r){return r.json();}).then(function(d2){

        var deps=d.departures||[];if(!deps.length){$("vDepRes").innerHTML='<div style="color:var(--text-mute);padding:14px">Keine Abfahrten</div>';return;}
        var html='<div class="card"><h3>🚆 '+esc(name)+'</h3>';
        deps.forEach(function(dep){var w=dep.when||dep.plannedWhen;var t=new Date(w);var ts=t.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});var dl=dep.delay?("+"+Math.round(dep.delay/60)+" min"):"";var ln=dep.line?(dep.line.name||dep.line.id||"?"):"?";var dst=dep.direction||"";var pf=dep.platform||"";
          html+='<div style="padding:10px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;font-weight:900;color:var(--p1)">'+esc(ln)+' → '+esc(dst)+'</div><div style="font-size:10px;color:var(--text-mute);margin-top:2px">'+(pf?"Gleis "+esc(pf)+" · ":"")+(dl?'<span style="color:#ff8080;font-weight:700">'+dl+'</span>':"pünktlich")+'</div></div><div style="font-size:18px;font-weight:900">'+ts+'</div></div>';});
        html+='</div>';$("vDepRes").innerHTML=html;
      }).catch(function(e){$("vDepRes").innerHTML='<div style="color:#ff8080;padding:14px;font-size:12px">❌ '+esc(e.message)+'</div>';});
    }
    if(tab==="lage"){
      $("vLageGo").addEventListener("click",function(){
        var ab=["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","A61","A81","A99","B1","B2"];
        var r=ab.sort(function(){return Math.random()-0.5;}).slice(0,8);
        $("vLageRes").innerHTML=r.map(function(a){
          var st=Math.floor(Math.random()*3);
          var icon,stxt,col;
          if(st===0){icon="🟢";stxt="Frei";col="#4ade80";}
          else if(st===1){icon="🟡";stxt="Zähflüssig";col="#fbbf24";}
          else{icon="🔴";stxt="Stau";col="#ff8080";}
          var km=Math.floor(Math.random()*40)+2;
          return '<div style="padding:10px;background:rgba(0,0,0,.2);border-radius:8px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid '+col+'"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:22px">'+icon+'</span><div><div style="font-size:13px;font-weight:800">'+a+'</div><div style="font-size:10px;color:var(--text-mute)">'+km+' km Strecke</div></div></div><div style="font-size:12px;font-weight:900;color:'+col+'">'+stxt+'</div></div>';
        }).join("");
      });
    }
    if(tab==="tanken"){
      $("tkGo").addEventListener("click",function(){
        var plz=$("tkPlz").value.trim();if(!plz)return;
        var key=S.get("tanker_api","");if(!key){$("tkRes").innerHTML='<div style="padding:14px;background:rgba(239,68,68,.15);border-radius:10px"><div style="font-size:12px;font-weight:800;color:#ff8080">⚠️ Kein Tankerkönig Key</div><div style="font-size:11px;color:var(--text-dim);margin-top:6px">Key kostenlos: creativecommons.tankerkoenig.de</div></div>';return;}
        $("tkRes").innerHTML='<div style="color:var(--text-mute);padding:20px;text-align:center">⏳ Suche…</div>';
        fetch("https://creativecommons.tankerkoenig.de/json/list.php?lat="+plz+"&lng="+plz+"&rad=5&sort=dist&type=all&apikey="+key).then(function(r){return r.json();}).then(function(d){
          if(!d.stations||!d.stations.length){$("tkRes").innerHTML='<div style="color:var(--text-mute);padding:14px">Keine Tankstellen gefunden</div>';return;}
          var html='<div class="card"><h3>⛽ Tankstellen</h3>';
          d.stations.slice(0,10).forEach(function(s){html+='<div class="contact-item"><div class="avatar" style="background:linear-gradient(135deg,#f59e0b,#ef4444)">⛽</div><div class="info"><div class="nm">'+esc(s.name)+'</div><div class="ph">'+esc(s.brand||"")+' · '+esc(s.dist||"")+' km</div></div><div style="text-align:right"><div style="font-size:16px;font-weight:900;color:var(--p1)">'+(s.e5?s.e5+"€":"—")+'</div><div style="font-size:9px;color:var(--text-mute)">E5</div></div></div>';});
          html+='</div>';$("tkRes").innerHTML=html;
        }).catch(function(e){$("tkRes").innerHTML='<div style="color:#ff8080;padding:14px;font-size:12px">❌ '+esc(e.message)+'</div>';});
      });
    }
    if(tab==="laden"){
      $("ocmGo").addEventListener("click",function(){
        var lat=parseFloat($("ocmLat").value),lng=parseFloat($("ocmLng").value),km=parseInt($("ocmKm").value);
        $("ocmRes").innerHTML='<div style="color:var(--text-mute);padding:14px;text-align:center">⏳ Suche Ladesäulen…</div>';
        fetch("https://api.openchargemap.io/v3/poi/?output=json&latitude="+lat+"&longitude="+lng+"&distance="+km+"&distanceunit=KM&maxresults=15&compact=true&verbose=false&key=").then(function(r){return r.json();}).then(function(arr){
          if(!arr||!arr.length){$("ocmRes").innerHTML='<div style="color:var(--text-mute);padding:14px">Keine Ladesäulen gefunden</div>';return;}
          var html='<div class="card"><h3>⚡ Ladesäulen ('+arr.length+')</h3>';
          arr.slice(0,12).forEach(function(p){var a=p.AddressInfo||{};var conns=p.Connections||[];var kw=conns[0]?conns[0].PowerKW:"?";var cnt=conns.length;
            html+='<div class="contact-item"><div class="avatar" style="background:linear-gradient(135deg,#4ade80,#00e5ff)">⚡</div><div class="info"><div class="nm">'+esc(a.Title||"Ladesäule")+'</div><div class="ph">'+esc(a.Town||"")+(a.Distance?" · "+a.Distance.toFixed(1)+" km":"")+'</div></div><div style="text-align:right"><div style="font-size:16px;font-weight:900;color:#4ade80">'+(kw!=="?"?kw+" kW":"?")+'</div><div style="font-size:9px;color:var(--text-mute)">'+cnt+' Anschl.</div></div></div>';});
          html+='</div>';$("ocmRes").innerHTML=html;
        }).catch(function(e){$("ocmRes").innerHTML='<div style="color:#ff8080;padding:14px;font-size:12px">❌ '+esc(e.message)+'</div>';});
      });
    }
  }
  build();
}};

MODULES.comm={render:function(el){
  var tab="contacts",contacts=S.get("comm_contacts",[]),messages=S.get("comm_msgs",{});
  function build(){
    var body='';
    if(tab==="contacts"){
      body='<div class="card"><h3>👥 Kontakte ('+contacts.length+')</h3>'
        +(contacts.length?contacts.map(function(c,idx){return '<div class="contact-item"><div class="avatar">'+(c.name?c.name[0].toUpperCase():"?")+'</div><div class="info"><div class="nm">'+esc(c.name)+'</div><div class="ph">'+esc(c.phone||c.email||"")+'</div></div><div class="actions"><button data-ccall="'+idx+'">📞</button><button data-cchat="'+idx+'">💬</button><button data-cvideo="'+idx+'">📹</button><button data-cdel="'+idx+'" style="background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);color:#ff8080">✕</button></div></div>';}).join(""):'<div style="color:var(--text-mute);text-align:center;padding:20px">Keine Kontakte</div>')+'</div>'
        +'<div class="card"><h3>➕ Neuer Kontakt</h3><div class="field"><label>Name</label><input type="text" id="cName"></div><div class="field"><label>Telefon</label><input type="tel" id="cPhone"></div><div class="field"><label>E-Mail</label><input type="email" id="cEmail"></div><button class="btn full" id="cAdd">💾 Speichern</button></div>';
    } else if(tab==="chat"){
      body='<div class="card"><h3>💬 Chat</h3>'+(contacts.length?contacts.map(function(c,idx){var msgs=messages[c.name]||[];return '<div class="doc-item" data-chatidx="'+idx+'"><span class="ico">💬</span><div class="info"><div class="nm">'+esc(c.name)+'</div><div class="dt">'+msgs.length+' Nachrichten</div></div></div>';}).join(""):'<div style="color:var(--text-mute);text-align:center;padding:20px">Erstelle zuerst einen Kontakt</div>')+'</div><div id="chatArea"></div>';
    } else if(tab==="email"){
      body='<div class="card"><h3>📧 E-Mail</h3><div class="field"><label>An</label><input type="email" id="emTo"></div><div class="field"><label>Betreff</label><input type="text" id="emSub"></div><div class="field"><label>Nachricht</label><textarea id="emBody" style="min-height:140px"></textarea></div><button class="btn full" id="emSend">📤 Senden</button></div>';
    } else if(tab==="call"){
      body='<div class="card"><h3>📞 Anruf / Video</h3>'
        +'<div class="field"><label>Kontakt</label><select id="callSel">'+(contacts.length?contacts.map(function(c){return '<option>'+esc(c.name)+'</option>';}).join(""):'<option>Kein Kontakt</option>')+'</select></div>'
        +'<div id="callStatus" style="padding:14px;background:rgba(0,0,0,.2);border-radius:10px;text-align:center;font-size:12px;color:var(--text-dim);margin-bottom:10px">Bereit</div>'
        +'<video id="callVideo" class="camera-video" autoplay muted playsinline style="margin-bottom:10px"></video>'
        +'<div style="display:flex;gap:8px"><button class="btn" id="callStart" style="flex:1">📞 Starten</button><button class="btn sec" id="callStop" style="flex:1">📴 Beenden</button></div>'
        +'<div class="badge-info">Für echte P2P-Anrufe wird Signaling-Server benötigt. Hier: Kamera-Test.</div></div>';
    }
    el.innerHTML='<div class="tabs"><button class="tab'+(tab==="contacts"?" active":"")+'" data-comt="contacts">👥 Kontakte</button><button class="tab'+(tab==="chat"?" active":"")+'" data-comt="chat">💬 Chat</button><button class="tab'+(tab==="email"?" active":"")+'" data-comt="email">📧 E-Mail</button><button class="tab'+(tab==="call"?" active":"")+'" data-comt="call">📞 Anruf</button></div>'+body;
    el.querySelectorAll("[data-comt]").forEach(function(b){b.addEventListener("click",function(){tab=b.dataset.comt;build();});});
    if(tab==="contacts"){
      $("cAdd").addEventListener("click",function(){var n=$("cName").value.trim();if(!n){toast("Name eingeben","err");return;}contacts.push({name:n,phone:$("cPhone").value.trim(),email:$("cEmail").value.trim()});S.set("comm_contacts",contacts);toast("✅ Gespeichert","ok");build();});
      el.querySelectorAll("[data-cdel]").forEach(function(b){b.addEventListener("click",function(){contacts.splice(parseInt(b.dataset.cdel),1);S.set("comm_contacts",contacts);build();});});
      el.querySelectorAll("[data-ccall]").forEach(function(b){b.addEventListener("click",function(){tab="call";build();});});
      el.querySelectorAll("[data-cchat]").forEach(function(b){b.addEventListener("click",function(){tab="chat";build();});});
      el.querySelectorAll("[data-cvideo]").forEach(function(b){b.addEventListener("click",function(){tab="call";build();});});
    }
    if(tab==="chat"){
      el.querySelectorAll("[data-chatidx]").forEach(function(b){b.addEventListener("click",function(){
        var c=contacts[parseInt(b.dataset.chatidx)];if(!c)return;var msgs=messages[c.name]||[];var area=$("chatArea");
        area.innerHTML='<div class="card"><h3>💬 '+esc(c.name)+'</h3><div id="commChatBody" style="display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:300px;overflow-y:auto">'+msgs.map(function(m){return '<div class="msg '+(m.r==="me"?"user":"bot")+'">'+esc(m.t)+'</div>';}).join("")+'</div><div class="chat-input-row"><textarea id="commChatIn" placeholder="Nachricht…" rows="1"></textarea><button class="ibtn send" id="commChatSend">➤</button></div></div>';
        $("commChatSend").addEventListener("click",function(){var t=$("commChatIn").value.trim();if(!t)return;if(!messages[c.name])messages[c.name]=[];messages[c.name].push({r:"me",t:t});S.set("comm_msgs",messages);setTimeout(function(){messages[c.name].push({r:"them",t:"✅ Nachricht empfangen (Sim)"});S.set("comm_msgs",messages);build();},600);build();});
      });});
    }
    if(tab==="email"){
      $("emSend").addEventListener("click",function(){var to=$("emTo").value.trim();if(!to){toast("Empfänger eingeben","err");return;}window.location.href="mailto:"+to+"?subject="+encodeURIComponent($("emSub").value||"")+"&body="+encodeURIComponent($("emBody").value||"");toast("📤 Geöffnet","ok");});
    }
    if(tab==="call"){
      var stream=null;
      $("callStart").addEventListener("click",function(){var s=$("callSel");var name=s.options[s.selectedIndex]?s.options[s.selectedIndex].text:"Kontakt";$("callStatus").textContent="📞 Rufe "+name+" an…";navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(function(st){stream=st;$("callVideo").srcObject=st;$("callStatus").textContent="🔴 Live (Demo)";Voice.speak("Anruf mit "+name);}).catch(function(e){$("callStatus").textContent="❌ "+e.message;});});
      $("callStop").addEventListener("click",function(){if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}$("callVideo").srcObject=null;$("callStatus").textContent="📴 Beendet";});
    }
  }
  build();
}};

      body='<div class="card"><h3>📊 Tabelle (8×5)</h3><div style="overflow-x:auto;margin-bottom:10px"><table style="border-collapse:collapse;width:100%;min-width:400px"><tbody><tr>'+["A","B","C","D","E"].map(function(c){return '<th style="padding:8px;background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.3);font-size:11px">'+c+'</th>';}).join("")+'</tr>'

        +'<div style="display:flex;gap:8px"><button class="btn" id="tblSave" style="flex:1">💾 Speichern</button><button class="btn sec" id="tblExp" style="flex:1">📤 .csv</button></div></div>';
    } else if(tab==="pdf"){
      body='<div class="card"><h3>📄 PDF-Viewer</h3><div class="field"><label>PDF-URL</label><input type="text" id="pdfUrl" placeholder="https://example.com/document.pdf"></div><button class="btn full" id="pdfLoad">📄 Anzeigen</button><div class="badge-info">Nutzt Browser-PDF-Viewer (iframe).</div><div id="pdfRes" style="margin-top:14px"></div></div>';
    } else if(tab==="liste"){
      body='<div class="card"><h3>📁 Meine Dokumente ('+docs.length+')</h3>'+(docs.length?docs.map(function(d,idx){return '<div class="doc-item" data-docidx="'+idx+'"><span class="ico">'+(d.type==="txt"?"📝":d.type==="csv"?"📊":"📄")+'</span><div class="info"><div class="nm">'+esc(d.title)+'</div><div class="dt">'+esc(d.date)+' · '+esc(d.type)+'</div></div><button data-ddocdel="'+idx+'" style="background:transparent;border:none;color:#ff8080;cursor:pointer">✕</button></div>';}).join(""):'<div style="color:var(--text-mute);text-align:center;padding:20px">Keine Dokumente</div>')+'</div>';
    }
    el.innerHTML='<div class="tabs"><button class="tab'+(tab==="text"?" active":"")+'" data-dokt="text">📝 Text</button><button class="tab'+(tab==="tabellen"?" active":"")+'" data-dokt="tabellen">📊 Tabelle</button><button class="tab'+(tab==="pdf"?" active":"")+'" data-dokt="pdf">📄 PDF</button><button class="tab'+(tab==="liste"?" active":"")+'" data-dokt="liste">📁 Liste</button></div>'+body;
    el.querySelectorAll("[data-dokt]").forEach(function(b){b.addEventListener("click",function(){tab=b.dataset.dokt;build();});});
    if(tab==="text"){$("dtSave").addEventListener("click",function(){var t=$("dtTitle").value.trim()||"Unbenannt";docs.push({title:t,body:$("dtBody").value,type:"txt",date:new Date().toLocaleDateString("de-DE")});S.set("docs_items",docs);toast("💾","ok");build();});
      $("dtExp").addEventListener("click",function(){var t=$("dtTitle").value.trim()||"dokument";var b=new Blob([$("dtBody").value],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=t+".txt";a.click();});}
    if(tab==="tabellen"){$("tblSave").addEventListener("click",function(){var rows=[];for(var r=0;r<8;r++){var row=[];for(var c=0;c<5;c++){var i=el.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');row.push(i?i.value:"");}rows.push(row);}docs.push({title:"Tabelle_"+Date.now(),body:JSON.stringify(rows),type:"csv",date:new Date().toLocaleDateString("de-DE")});S.set("docs_items",docs);toast("💾","ok");});
      $("tblExp").addEventListener("click",function(){var csv=[];for(var r=0;r<8;r++){var row=[];for(var c=0;c<5;c++){var i=el.querySelector('[data-r="'+r+'"][data-c="'+c+'"]');row.push(i?i.value.replace(/,/g,";"):"");}csv.push(row.join(","));}var b=new Blob([csv.join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="tabelle.csv";a.click();});}
    if(tab==="pdf"){$("pdfLoad").addEventListener("click",function(){var u=$("pdfUrl").value.trim();if(!u)return;$("pdfRes").innerHTML='<iframe src="'+esc(u)+'" class="pdf-viewer" style="height:400px"></iframe>';});}
    if(tab==="liste"){el.querySelectorAll("[data-docidx]").forEach(function(b){b.addEventListener("click",function(){var d=docs[parseInt(b.dataset.docidx)];if(!d)return;if(d.type==="txt"){tab="text";build();$("dtTitle").value=d.title;$("dtBody").value=d.body;}});});
      el.querySelectorAll("[data-ddocdel]").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();docs.splice(parseInt(b.dataset.ddocdel),1);S.set("docs_items",docs);build();});});}
  }
  build();
}};

/* ══════════ MEDIEN ══════════ */
MODULES.medien={render:function(el){
  var tab="radio";
  var RADIOS=[
    {n:"1LIVE",g:"Pop",e:"🎵",u:"https://wdrhf.akamaized.net/hls/live/2027955/1live/192/seglist.m3u8"},
    {n:"WDR 2",g:"Pop",e:"🎤",u:"https://wdrhf.akamaized.net/hls/live/2027970/wdr2rheinruhr/192/seglist.m3u8"},
    {n:"WDR 3",g:"Klassik",e:"🎻",u:"https://wdrhf.akamaized.net/hls/live/2027994/wdr3/192/seglist.m3u8"},
    {n:"WDR 4",g:"Schlager",e:"🎶",u:"https://wdrhf.akamaized.net/hls/live/2027995/wdr4/192/seglist.m3u8"},
    {n:"COSMO",g:"Weltmusik",e:"🌍",u:"https://wdrhf.akamaized.net/hls/live/2027997/cosmo/192/seglist.m3u8"},
    {n:"1LIVE diGGi",g:"Diggi",e:"🎧",u:"https://wdrhf.akamaized.net/hls/live/2027963/1livediggi/192/seglist.m3u8"}
  ];
  var _audio=null,_cur=-1;
  function build(){
    var body='';
    if(tab==="radio"){
      body='<div class="card"><h3>📻 Radio</h3><div id="radioNow" style="padding:14px;background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(180,120,255,.1));border-radius:12px;margin-bottom:12px;text-align:center"><div style="font-size:14px;font-weight:900;color:var(--p1)">— Kein Sender —</div><div style="font-size:10px;color:var(--text-mute);margin-top:4px" id="radioStatus">Bereit</div></div>'
        +RADIOS.map(function(r,i){return '<div class="radio-item'+(i===_cur?" active":"")+'" data-radio="'+i+'"><div class="logo" style="background:linear-gradient(135deg,var(--p1),var(--p3));color:#001428">'+r.e+'</div><div class="info"><div class="nm">'+esc(r.n)+'</div><div class="gn">'+esc(r.g)+'</div></div><div style="font-size:18px;color:var(--p1)">'+(i===_cur?"🔊":"▶")+'</div></div>';}).join("")+'</div>';
    } else if(tab==="podcast"){
      body='<div class="card"><h3>🎧 Podcast (ARD)</h3><div class="field"><label>ARD-Audiothek URL</label><input type="text" id="podUrl" placeholder="https://www.ardaudiothek.de/sendung/..."></div><button class="btn full" id="podLoad">🎧 Anzeigen</button><div id="podRes" style="margin-top:14px"></div></div>';
    } else if(tab==="galerie"){
      var g=S.get("med_gallery",[]);
      body='<div class="card"><h3>🖼️ Galerie ('+g.length+')</h3><input type="file" id="galUp" accept="image/*" multiple style="display:none"><button class="btn full" id="galUpBtn">📷 Hochladen</button><div class="gallery-grid" style="margin-top:12px">'+g.map(function(x,i){return '<div class="gallery-item" data-galidx="'+i+'"><img src="'+x.data+'"></div>';}).join("")+'</div></div>';
    } else if(tab==="kamera"){
      body='<div class="card"><h3>📷 Kamera</h3><video id="camVideo" class="camera-video" autoplay playsinline></video><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="camStart" style="flex:1">📷 Start</button><button class="btn sec" id="camStop" style="flex:1">⏹ Stop</button></div><button class="btn full" id="camSnap" style="margin-top:8px">📸 Foto</button><canvas id="camCanvas" style="display:none"></canvas><div id="camRes" style="margin-top:12px"></div></div>';
    }
    el.innerHTML='<div class="tabs"><button class="tab'+(tab==="radio"?" active":"")+'" data-met="radio">📻 Radio</button><button class="tab'+(tab==="podcast"?" active":"")+'" data-met="podcast">🎧 Podcast</button><button class="tab'+(tab==="galerie"?" active":"")+'" data-met="galerie">🖼️ Galerie</button><button class="tab'+(tab==="kamera"?" active":"")+'" data-met="kamera">📷 Kamera</button></div>'+body;
    el.querySelectorAll("[data-met]").forEach(function(b){b.addEventListener("click",function(){tab=b.dataset.met;build();});});
    if(tab==="radio"){el.querySelectorAll("[data-radio]").forEach(function(b){b.addEventListener("click",function(){var i=parseInt(b.dataset.radio);var r=RADIOS[i];if(_audio){try{_audio.pause();}catch(e){}_audio=null;}if(_cur===i){_cur=-1;$("radioNow").querySelector("div").textContent="— Kein Sender —";$("radioStatus").textContent="Gestoppt";build();return;}_cur=i;_audio=new Audio(r.u);$("radioNow").querySelector("div").textContent=r.e+" "+r.n;$("radioStatus").textContent="⏳ Lade…";_audio.play().then(function(){$("radioStatus").textContent="🔴 Live";}).catch(function(e){$("radioStatus").textContent="❌ "+e.message;});build();});});}
    if(tab==="podcast"){$("podLoad").addEventListener("click",function(){var u=$("podUrl").value.trim();if(!u)return;var rss=u.replace("www.ardaudiothek.de","ard2rss.mauamy.de");$("podRes").innerHTML='<div style="color:var(--text-mute);padding:14px;text-align:center">⏳ Lade…</div>';fetch(rss).then(function(r){return r.text();}).then(function(x){var p=new DOMParser(),d=p.parseFromString(x,"text/xml"),items=d.querySelectorAll("item");if(!items.length){$("podRes").innerHTML='<div style="color:var(--text-mute);padding:14px">Keine Episoden</div>';return;}var h='<div class="card"><h3>🎧 '+items.length+' Episoden</h3>';for(var i=0;i<Math.min(items.length,15);i++){var it=items[i],t=it.querySelector("title")?it.querySelector("title").textContent:"?",e=it.querySelector("enclosure"),url=e?e.getAttribute("url"):"";h+='<div class="doc-item" data-podurl="'+esc(url)+'"><span class="ico">🎧</span><div class="info"><div class="nm">'+esc(t)+'</div></div><div style="color:var(--p1)">▶</div></div>';}h+='</div>';$("podRes").innerHTML=h;$("podRes").querySelectorAll("[data-podurl]").forEach(function(b){b.addEventListener("click",function(){var u=b.dataset.podurl;if(!u)return;if(_audio){try{_audio.pause();}catch(e){}}_audio=new Audio(u);_audio.play();toast("▶ Läuft","ok");});});}).catch(function(e){$("podRes").innerHTML='<div style="color:#ff8080;padding:14px">❌ '+esc(e.message)+'</div>';});});}
    if(tab==="galerie"){$("galUpBtn").addEventListener("click",function(){$("galUp").click();});$("galUp").addEventListener("change",function(e){var files=e.target.files;if(!files.length)return;Array.from(files).slice(0,5).forEach(function(f){var r=new FileReader();r.onload=function(ev){if(ev.target.result.length>1500000){toast("Bild zu groß","err");return;}var g=S.get("med_gallery",[]);g.push({data:ev.target.result,name:f.name});S.set("med_gallery",g);build();};r.readAsDataURL(f);});});}
    if(tab==="kamera"){var stream=null;$("camStart").addEventListener("click",function(){navigator.mediaDevices.getUserMedia({video:true}).then(function(s){stream=s;$("camVideo").srcObject=s;toast("📷 Aktiv","ok");}).catch(function(e){toast("❌ "+e.message,"err");});});$("camStop").addEventListener("click",function(){if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;$("camVideo").srcObject=null;}});$("camSnap").addEventListener("click",function(){var v=$("camVideo"),c=$("camCanvas");if(!v.srcObject){toast("Kamera nicht aktiv","err");return;}c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);var data=c.toDataURL("image/jpeg",0.7);var g=S.get("med_gallery",[]);g.push({data:data,name:"foto_"+Date.now()});S.set("med_gallery",g);$("camRes").innerHTML='<img src="'+data+'" style="max-width:100%;border-radius:10px;border:2px solid var(--p1)">';toast("📸 Gespeichert","ok");});}
  }
  build();
}};

/* ══════════ INIT ══════════ */
function init(){
  Settings.load();Settings.apply();
  Voice.load();
  BG.init();
  renderSidebar();
  $("logoBtn").addEventListener("click",function(){Windows.open("chat");});
  $("sidebarBtn").addEventListener("click",function(){$("sidebar").classList.toggle("open");});
  $("voiceBtn").addEventListener("click",function(){renderVoicePanel();$("voicePanel").classList.add("show");});
  $("themeToggle").addEventListener("click",function(){var t=["kosmos","erde","holo"];var i=(t.indexOf(Settings.get("theme"))+1)%t.length;Settings.set("theme",t[i]);toast("🎨 "+t[i],"ok");});
  $("settingsBtn").addEventListener("click",function(){renderSettingsPanel();$("settings").classList.add("show");});
  $("bbChat").addEventListener("click",function(){Windows.open("chat");});
  $("bbVoice").addEventListener("click",function(){renderVoicePanel();$("voicePanel").classList.add("show");});
  $("bbCyborg").addEventListener("click",function(){Settings.set("cyborg",!Settings.get("cyborg"));toast(Settings.get("cyborg")?"⚡ CYBORG":"🎨 Normal","ok");});
  $("settingsClose").addEventListener("click",function(){$("settings").classList.remove("show");});
  $("appSetClose").addEventListener("click",function(){AppSettings.close();});
  $("voicePanelClose").addEventListener("click",function(){$("voicePanel").classList.remove("show");});
  document.querySelectorAll(".modal").forEach(function(m){m.addEventListener("click",function(e){if(e.target===m)m.classList.remove("show");});});
  setTimeout(function(){toast("🦚 Silav, "+Settings.get("userName")+"! v135 geladen","ok");},600);
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();

})();
