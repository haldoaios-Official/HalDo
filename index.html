<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>HalDo AI OS Professional</title>
<style>
/* ═══════════════ ROOT & THEME VARIABLES ═══════════════ */
:root{
  --holo-cyan:#00e5ff; --holo-blue:#4da8ff; --holo-purple:#b478ff;
  --cyborg-pink:#ff78c8; --cyborg-violet:#b478ff;
  --gold:#ffd700; --gold-dark:#b8860b;
  --bg-deep:#05070f; --bg-glass:rgba(10,20,40,0.55);
  --glass-border:rgba(0,229,255,0.4);
  --primary:var(--holo-cyan); --secondary:var(--holo-blue); --accent:var(--holo-purple);
  --text:#e8f4ff; --text-dim:#8ab4d8;
  --blur:24px; --radius-win:18px; --radius-btn:14px;
  --glow:0 0 12px var(--primary); --glow-strong:0 0 24px var(--primary),0 0 48px var(--secondary);
  --font:'Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-size:14px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);font-size:var(--font-size);color:var(--text);background:var(--bg-deep);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ═══════════════ COSMOS CANVAS ═══════════════ */
#cosmos{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at center,#0a1428 0%,#05070f 60%,#000 100%)}
#ringCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ═══════════════ TOP BAR ═══════════════ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:calc(56px + var(--safe-top));
  padding-top:var(--safe-top);padding-left:calc(12px + var(--safe-left));padding-right:calc(12px + var(--safe-right));
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(5,15,30,0.65);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-bottom:1.5px solid var(--glass-border);
  z-index:100;gap:12px;
}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:1px}
#topbar .brand-logo{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 30%,var(--primary),var(--secondary) 70%,transparent);
  box-shadow:var(--glow),0 0 8px var(--accent);font-size:20px;cursor:pointer;
  transition:transform .3s;
}
#topbar .brand-logo:hover{transform:scale(1.1) rotate(15deg)}
#topbar .brand-text{font-size:16px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
#topbar .brand-ver{font-size:10px;color:var(--text-dim);opacity:.7}
#topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);font-size:18px;
  transition:all .2s;
}
.icon-btn:hover{background:rgba(255,255,255,0.15);box-shadow:var(--glow)}
.icon-btn.active{background:var(--primary);color:#000;box-shadow:var(--glow-strong)}

/* ═══════════════ SIDEBAR ═══════════════ */
#sidebar{
  position:fixed;left:0;top:calc(56px + var(--safe-top));bottom:0;
  width:76px;padding:12px 0 calc(12px + var(--safe-bottom)) 0;
  display:flex;flex-direction:column;gap:6px;align-items:center;
  background:rgba(5,15,30,0.55);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border-right:1.5px solid var(--glass-border);
  z-index:90;overflow-y:auto;scrollbar-width:none;
  transition:width .3s;
}
#sidebar::-webkit-scrollbar{display:none}
#sidebar.expanded{width:200px;align-items:stretch;padding-left:8px;padding-right:8px}
.side-btn{
  display:flex;align-items:center;gap:12px;
  padding:10px;border-radius:14px;min-height:48px;
  background:transparent;border:1px solid transparent;
  color:var(--text-dim);font-size:20px;transition:all .2s;
  white-space:nowrap;overflow:hidden;
}
#sidebar.expanded .side-btn{padding:10px 14px}
.side-btn:hover{background:rgba(0,229,255,0.1);color:var(--text);border-color:var(--glass-border);box-shadow:var(--glow)}
.side-btn .lbl{display:none;font-size:14px;font-weight:600;letter-spacing:.5px}
#sidebar.expanded .side-btn .lbl{display:inline}
.side-sep{width:60%;height:1px;background:var(--glass-border);margin:6px 0}

/* ═══════════════ WORKSPACE ═══════════════ */
#workspace{
  position:fixed;left:76px;top:calc(56px + var(--safe-top));right:0;bottom:0;
  z-index:10;overflow:hidden;
}
#workspace.sidebar-open{left:200px}

/* ═══════════════ WINDOWS ═══════════════ */
.window{
  position:absolute;min-width:320px;min-height:200px;
  background:rgba(10,20,40,0.72);backdrop-filter:blur(var(--blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);
  border:1.5px solid var(--glass-border);border-radius:var(--radius-win);
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08),var(--glow);
  z-index:200;display:flex;flex-direction:column;overflow:hidden;
  transform-origin:center;animation:winIn .25s ease-out;
}
.window.active{z-index:250;box-shadow:0 12px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12),var(--glow-strong)}
@keyframes winIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.win-titlebar{
  height:44px;display:flex;align-items:center;padding:0 10px;gap:8px;
  background:rgba(0,0,0,0.25);border-bottom:1px solid var(--glass-border);
  cursor:grab;flex-shrink:0;
}
.win-titlebar:active{cursor:grabbing}
.win-title{flex:1;font-weight:600;font-size:13px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-controls{display:flex;gap:6px;z-index:999999;position:relative}
.win-btn{
  width:32px;height:32px;min-width:32px;min-height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);font-size:14px;transition:all .15s;
  z-index:999999;position:relative;
}
.win-btn:hover{background:rgba(255,255,255,.22);transform:scale(1.08)}
.win-btn.close:hover{background:#ff4d6a;color:#fff}
.win-btn.min:hover{background:var(--gold);color:#000}
.win-btn.max:hover{background:var(--primary);color:#000}
.win-body{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.win-body::-webkit-scrollbar{width:8px}
.win-body::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:4px}
.win-resize{position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize;z-index:999998}

/* ═══════════════ BOTTOM DOCK ═══════════════ */
#dock{
  position:fixed;bottom:calc(12px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  display:flex;gap:10px;padding:8px 12px;
  background:rgba(5,15,30,0.75);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border:1.5px solid var(--glass-border);border-radius:22px;
  box-shadow:var(--glow);z-index:800;
}
.dock-btn{
  width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:rgba(255,255,255,.06);transition:all .2s;border:1px solid transparent;
}
.dock-btn:hover{transform:translateY(-4px);background:rgba(255,255,255,.16);box-shadow:var(--glow)}
.dock-btn.active{background:var(--primary);color:#000;box-shadow:var(--glow-strong)}
.dock-btn.cyborg.active{background:var(--cyborg-pink);box-shadow:0 0 24px var(--cyborg-pink)}

/* ═══════════════ SETTINGS / APPS PANELS ═══════════════ */
.panel-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  z-index:900;display:none;animation:fadeIn .2s;
}
.panel-overlay.show{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.panel{
  position:fixed;top:calc(56px + var(--safe-top) + 10px);bottom:calc(76px + var(--safe-bottom));
  left:calc(76px + var(--safe-left) + 10px);right:calc(10px + var(--safe-right));
  background:rgba(5,15,30,0.88);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border:1.5px solid var(--glass-border);border-radius:var(--radius-win);
  box-shadow:0 12px 48px rgba(0,0,0,.7),var(--glow-strong);
  z-index:910;display:none;flex-direction:column;overflow:hidden;
  animation:panelIn .25s ease-out;
}
.panel.show{display:flex}
@keyframes panelIn{from{opacity:0;transform:scale(.96) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.panel-header{
  height:56px;display:flex;align-items:center;padding:0 16px;gap:12px;
  border-bottom:1.5px solid var(--glass-border);flex-shrink:0;
}
.panel-title{flex:1;font-size:16px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.panel-close{
  width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.panel-close:hover{background:#ff4d6a;color:#fff}
.panel-body{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.panel-body::-webkit-scrollbar{width:10px}
.panel-body::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:5px}

/* ═══════════════ SETTINGS SECTIONS ═══════════════ */
.set-section{
  margin-bottom:12px;background:rgba(255,255,255,.03);
  border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;
}
.set-header{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  cursor:pointer;transition:background .2s;min-height:52px;
}
.set-header:hover{background:rgba(0,229,255,.08)}
.set-header .icon{font-size:22px;width:32px;text-align:center}
.set-header .title{flex:1;font-weight:600;letter-spacing:.5px}
.set-header .chev{font-size:14px;transition:transform .25s;color:var(--text-dim)}
.set-section.open .set-header .chev{transform:rotate(180deg)}
.set-body{
  display:none;padding:4px 16px 16px 16px;border-top:1px solid var(--glass-border);
  animation:expandDown .25s ease-out;
}
.set-section.open .set-body{display:block}
@keyframes expandDown{from{opacity:0;max-height:0}to{opacity:1;max-height:2000px}}

.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 0;border-bottom:1px dashed rgba(0,229,255,.15);flex-wrap:wrap;
}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1;min-width:140px;font-size:13.5px;color:var(--text)}
.set-row .lbl small{display:block;font-size:11px;color:var(--text-dim);margin-top:2px}

/* Toggle */
.toggle{
  position:relative;width:48px;height:26px;border-radius:14px;flex-shrink:0;
  background:rgba(255,255,255,.15);transition:background .25s;cursor:pointer;
  border:1px solid var(--glass-border);
}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--text);transition:transform .25s;box-shadow:0 2px 4px rgba(0,0,0,.4);
}
.toggle.on{background:var(--primary);box-shadow:var(--glow)}
.toggle.on::after{transform:translateX(22px);background:#000}

/* Slider */
.slider{
  -webkit-appearance:none;appearance:none;width:140px;height:6px;border-radius:3px;
  background:rgba(255,255,255,.15);outline:none;flex-shrink:0;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--primary);cursor:pointer;box-shadow:var(--glow);border:2px solid #000;
}
.slider::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;
  background:var(--primary);cursor:pointer;box-shadow:var(--glow);border:2px solid #000;
}

/* Select & Input */
.set-select,.set-input{
  background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
  border-radius:10px;padding:8px 12px;min-height:36px;color:var(--text);
  min-width:120px;font-size:13px;
}
.set-select option{background:#0a1428;color:var(--text)}
.set-input:focus,.set-select:focus{outline:none;border-color:var(--primary);box-shadow:var(--glow)}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
  transition:all .2s;min-height:32px;display:inline-flex;align-items:center;
}
.chip:hover{background:rgba(0,229,255,.2)}
.chip.active{background:var(--primary);color:#000;box-shadow:var(--glow)}

/* ═══════════════ APP GRID ═══════════════ */
.app-cat{margin-bottom:20px}
.app-cat-title{
  font-size:15px;font-weight:700;margin-bottom:10px;padding:8px 12px;
  background:linear-gradient(90deg,var(--primary),transparent);
  border-left:3px solid var(--primary);border-radius:4px;letter-spacing:.5px;
}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.app-tile{
  background:rgba(255,255,255,.05);border:1px solid var(--glass-border);
  border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;
  transition:all .2s;min-height:100px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;
}
.app-tile:hover{background:rgba(0,229,255,.15);transform:translateY(-2px);box-shadow:var(--glow)}
.app-tile .ico{font-size:26px}
.app-tile .nm{font-size:11px;font-weight:600;line-height:1.2;word-break:break-word}

/* ═══════════════ AVATAR ═══════════════ */
#avatarPanel{
  position:fixed;right:calc(10px + var(--safe-right));top:calc(56px + var(--safe-top) + 10px);
  width:300px;height:460px;
  background:rgba(5,15,30,0.85);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));
  border:1.5px solid var(--glass-border);border-radius:var(--radius-win);
  box-shadow:var(--glow-strong);z-index:850;
  display:none;flex-direction:column;overflow:hidden;
  animation:panelIn .25s ease-out;
}
#avatarPanel.show{display:flex}
#avatarPanel.cyborg{border-color:var(--cyborg-pink);box-shadow:0 0 24px var(--cyborg-pink),0 0 48px var(--cyborg-violet)}
.avatar-head{height:44px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--glass-border);gap:10px}
.avatar-head .name{flex:1;font-weight:700;letter-spacing:1px;font-size:13px}
.avatar-stage{
  flex:1;display:flex;align-items:center;justify-content:center;position:relative;
  background:radial-gradient(circle at 50% 40%,rgba(0,229,255,.15) 0%,transparent 60%);
}
.avatar-stage .ring{
  position:absolute;border:1.5px solid var(--glass-border);border-radius:50%;pointer-events:none;
}
.avatar-stage .ring.r1{width:220px;height:220px;animation:spin 12s linear infinite}
.avatar-stage .ring.r2{width:260px;height:260px;animation:spin 18s linear infinite reverse;border-style:dashed}
.avatar-stage .ring.r3{width:290px;height:290px;animation:spin 24s linear infinite;border-color:var(--accent);opacity:.4}
@keyframes spin{to{transform:rotate(360deg)}}
#avatarSVG{width:180px;height:200px;z-index:2;filter:drop-shadow(0 0 12px var(--primary))}
.avatar-actions{padding:10px;display:flex;gap:8px;border-top:1px solid var(--glass-border)}
.avatar-actions button{
  flex:1;min-height:44px;border-radius:12px;background:rgba(255,255,255,.08);
  border:1px solid var(--glass-border);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.avatar-actions button:hover{background:rgba(0,229,255,.2);box-shadow:var(--glow)}
.avatar-actions button.active{background:var(--primary);color:#000;box-shadow:var(--glow)}

/* ═══════════════ CHAT ═══════════════ */
.chat-list{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.chat-msg{
  max-width:85%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;
  animation:msgIn .25s ease-out;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;border-bottom-right-radius:4px}
.chat-msg.bot{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid var(--glass-border);border-bottom-left-radius:4px}
.chat-input-row{display:flex;gap:8px;padding:10px 0}
.chat-input-row input{
  flex:1;min-height:44px;border-radius:22px;padding:0 16px;
  background:rgba(255,255,255,.08);border:1px solid var(--glass-border);
}
.chat-input-row button{
  width:44px;height:44px;border-radius:50%;background:var(--primary);color:#000;
  font-size:18px;box-shadow:var(--glow);
}

/* ═══════════════ TOASTS ═══════════════ */
#toast-container{
  position:fixed;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;align-items:center;z-index:1000;
  pointer-events:none;width:calc(100% - 32px);max-width:400px;
}
.toast{
  background:rgba(10,20,40,0.92);backdrop-filter:blur(16px);
  border:1.5px solid var(--glass-border);border-radius:14px;
  padding:12px 18px;font-size:13px;font-weight:600;box-shadow:var(--glow);
  animation:toastIn .3s ease-out;
  display:flex;align-items:center;gap:10px;
}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast.out{animation:toastOut .3s ease-in forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-20px)}}

/* ═══════════════ WELCOME / GREETING ═══════════════ */
.welcome-banner{
  position:fixed;top:calc(66px + var(--safe-top));left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(180,120,255,.25));
  backdrop-filter:blur(var(--blur));border:1.5px solid var(--primary);
  border-radius:16px;padding:10px 20px;font-size:12px;font-weight:600;
  letter-spacing:.5px;box-shadow:var(--glow-strong);z-index:899;
  animation:welcomeIn .6s ease-out;text-align:center;
  max-width:calc(100% - 40px);
}
@keyframes welcomeIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.welcome-banner.hide{animation:welcomeOut .6s ease-in forwards}
@keyframes welcomeOut{to{opacity:0;transform:translate(-50%,-30px)}}

/* ═══════════════ CYBORG MODE ═══════════════ */
body.cyborg{
  --primary:var(--cyborg-pink); --secondary:var(--cyborg-violet); --accent:#ff3dbb;
  --holo-cyan:var(--cyborg-pink); --holo-blue:var(--cyborg-violet);
}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media (max-width:600px){
  #sidebar{width:64px}
  #sidebar.expanded{width:180px}
  #workspace{left:64px}
  #workspace.sidebar-open{left:180px}
  .window{min-width:280px}
  .app-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
  #avatarPanel{width:260px;height:400px}
  #dock{gap:6px;padding:6px 8px}
  .dock-btn{width:44px;height:44px;font-size:20px}
  #topbar .brand-text{display:none}
}

/* ═══════════════ APP-SPECIFIC ═══════════════ */
.calc-display{
  background:rgba(0,0,0,.5);border:1px solid var(--glass-border);border-radius:12px;
  padding:20px;text-align:right;font-size:32px;font-weight:700;margin-bottom:12px;
  font-family:monospace;overflow:hidden;letter-spacing:1px;
}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-grid button{
  min-height:56px;border-radius:12px;background:rgba(255,255,255,.08);
  border:1px solid var(--glass-border);font-size:18px;font-weight:600;
}
.calc-grid button:hover{background:rgba(0,229,255,.2)}
.calc-grid button.op{background:rgba(0,229,255,.15);color:var(--primary)}
.calc-grid button.eq{background:var(--primary);color:#000}
.note-card,.task-card{

<script>
/* ═══════════════════════════════════════════════════════
   HALDO AI OS — CORE
   ═══════════════════════════════════════════════════════ */
const HalDo = window.HalDo = {};
const $ = (s,p=document)=>p.querySelector(s);
const $$ = (s,p=document)=>[...p.querySelectorAll(s)];
const LS = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  del:k=>localStorage.removeItem(k)
};

/* ═══════════════ COSMOS ═══════════════ */
const Cosmos = (()=>{
  const cv = $('#cosmos'), ctx = cv.getContext('2d');
  let W,H,stars=[],planets=[],shooting=[],t=0;
  const colors = ['#00e5ff','#4da8ff','#b478ff','#ff78c8','#ffd700','#ff8c42','#7cff8c','#8cd7ff','#ff6ec7','#a78bfa','#fbbf24','#34d399'];
  function resize(){
    W = cv.width = innerWidth*devicePixelRatio;
    H = cv.height = innerHeight*devicePixelRatio;
    cv.style.width = innerWidth+'px';
    cv.style.height = innerHeight+'px';
    init();
  }
  function init(){
    stars=[];
    for(let i=0;i<350;i++) stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.4+0.2, 
      a:Math.random()*0.8+0.2,
      tw:Math.random()*Math.PI*2,
      sp:0.0005+Math.random()*0.002
    });
    planets=[];
    const cx=W/2, cy=H/2;
    for(let i=0;i<12;i++){
      const orbit = (W*0.08) + i*(W*0.035);
      planets.push({
        cx, cy, orbit,
        angle:Math.random()*Math.PI*2,
        speed:(0.0001+Math.random()*0.0004)*(i%2?-1:1),
        size: 3+Math.random()*3 + (i===4?4:0),
        color: colors[i%colors.length],
        glow:i===4
      });
    }
  }
  function spawnShooting(){
    if(Math.random()<0.008){
      shooting.push({
        x:Math.random()*W*0.8, y:Math.random()*H*0.4,
        len:120+Math.random()*180, ang:Math.PI/4+Math.random()*0.3,
        a:1, sp:8+Math.random()*6
      });
    }
  }
  function draw(){
    t+=0.005;
    ctx.clearRect(0,0,W,H);
    // Nebula
    const g1=ctx.createRadialGradient(W*0.3,H*0.4,0,W*0.3,H*0.4,W*0.4);
    g1.addColorStop(0,'rgba(0,229,255,0.06)');g1.addColorStop(1,'transparent');
    ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
    const g2=ctx.createRadialGradient(W*0.75,H*0.6,0,W*0.75,H*0.6,W*0.35);
    g2.addColorStop(0,'rgba(180,120,255,0.06)');g2.addColorStop(1,'transparent');
    ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
    // Stars
    for(const s of stars){
      s.tw+=s.sp*2;
      const a = s.a*(0.6+0.4*Math.sin(s.tw));
      ctx.fillStyle=`rgba(255,255,255,${a})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
    }
    // Sun
    const cx=W/2, cy=H/2;
    const sunR = 32*devicePixelRatio;
    // Corona
    for(let i=3;i>0;i--){
      const cg=ctx.createRadialGradient(cx,cy,sunR*i*0.3,cx,cy,sunR*i*0.8);
      cg.addColorStop(0,`rgba(255,200,60,${0.15/i})`);
      cg.addColorStop(0.5,`rgba(255,120,50,${0.08/i})`);
      cg.addColorStop(1,'transparent');
      ctx.fillStyle=cg;
      ctx.beginPath();ctx.arc(cx,cy,sunR*i,0,7);ctx.fill();
    }
    const sg=ctx.createRadialGradient(cx-sunR*0.3,cy-sunR*0.3,0,cx,cy,sunR);
    sg.addColorStop(0,'#fff8d0');sg.addColorStop(0.4,'#ffd700');sg.addColorStop(0.8,'#ff8c42');sg.addColorStop(1,'#c44a00');
    ctx.fillStyle=sg;
    ctx.beginPath();ctx.arc(cx,cy,sunR,0,7);ctx.fill();
    // Planets
    for(const p of planets){
      p.angle+=p.speed;
      const x = p.cx+Math.cos(p.angle)*p.orbit;
      const y = p.cy+Math.sin(p.angle)*p.orbit*0.55;
      // Orbit line
      ctx.strokeStyle='rgba(0,229,255,0.06)';
      ctx.lineWidth=1*devicePixelRatio;
      ctx.beginPath();
      ctx.ellipse(p.cx,p.cy,p.orbit,p.orbit*0.55,0,0,7);
      ctx.stroke();
      // Planet
      const r=p.size*devicePixelRatio;
      const pg=ctx.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
      pg.addColorStop(0,'#fff');pg.addColorStop(0.3,p.color);pg.addColorStop(1,'rgba(0,0,0,0.3)');
      ctx.fillStyle=pg;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      if(p.glow){
        const gg=ctx.createRadialGradient(x,y,r,x,y,r*4);
        gg.addColorStop(0,`${p.color}88`);gg.addColorStop(1,'transparent');
        ctx.fillStyle=gg;
        ctx.beginPath();ctx.arc(x,y,r*4,0,7);ctx.fill();
      }
    }
    // Shooting stars
    spawnShooting();
    for(let i=shooting.length-1;i>=0;i--){
      const sh=shooting[i];
      const x2=sh.x+Math.cos(sh.ang)*sh.len;
      const y2=sh.y+Math.sin(sh.ang)*sh.len;
      const lg=ctx.createLinearGradient(sh.x,sh.y,x2,y2);
      lg.addColorStop(0,'rgba(255,255,255,0)');
      lg.addColorStop(0.6,`rgba(0,229,255,${sh.a*0.6})`);
      lg.addColorStop(1,`rgba(255,255,255,${sh.a})`);
      ctx.strokeStyle=lg;ctx.lineWidth=2*devicePixelRatio;
      ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(x2,y2);ctx.stroke();
      sh.x+=Math.cos(sh.ang)*sh.sp*devicePixelRatio;
      sh.y+=Math.sin(sh.ang)*sh.sp*devicePixelRatio;
      sh.a-=0.012;
      if(sh.a<=0) shooting.splice(i,1);
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);
  return {init:()=>{resize();draw()}};
})();

/* ═══════════════ TEXT RINGS (3 rotierende Zeilen) ═══════════════ */
const RingText = (()=>{
  const cv=$('#ringCanvas'), ctx=cv.getContext('2d');
  let W,H,t=0;
  const rings=[
    {text:'ÊZÎDÎ · ÊZÎDÎ · ÊZÎDÎ · ܐܝܙܝܕܝ · يزدي · ÊZÎDÎ · ÊZÎDÎ ·', r:0.30, speed:0.00015, size:11, color:'rgba(255,215,0,0.55)'},
    {text:'KURDÎ · کوردی · ܟܘܪܕܝ · Kurdî · KURDÎ · Kürtçe · 库尔德语 · クルド語 ·', r:0.36, speed:-0.00012, size:10, color:'rgba(0,229,255,0.5)'},
    {text:'ሰላም · שלום · مرحبا · 𐎘𐎍𐎎 · Ειρήνη · Pax · Peace · 和平 · 平和 · SALAAM ·', r:0.42, speed:0.0001, size:9, color:'rgba(180,120,255,0.5)'}
  ];
  function resize(){
    W=cv.width=innerWidth*devicePixelRatio;
    H=cv.height=innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px';
    cv.style.height=innerHeight+'px';
  }
  function draw(){
    t+=1;
    ctx.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2;
    for(const ring of rings){
      const radius=Math.min(W,H)*ring.r;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(t*ring.speed);
      ctx.fillStyle=ring.color;
      ctx.font=`${ring.size*devicePixelRatio}px 'Segoe UI',sans-serif`;
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      const chars=ring.text.split('');
      const totalAngle=Math.PI*2;
      const stepAngle=totalAngle/chars.length;
      for(let i=0;i<chars.length;i++){
        const a=i*stepAngle;
        ctx.save();
        ctx.rotate(a);
        ctx.translate(0,-radius);
        ctx.rotate(Math.PI);
        ctx.fillText(chars[i],0,0);
        ctx.restore();
      }
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);
  return {init:()=>{resize();draw()}};
})();

/* ═══════════════ WINDOW MANAGER ═══════════════ */
const WM = (()=>{
  const ws=$('#workspace');
  let zTop=250;
  function open(opts={}){
    const {title='App', icon='📱', content='', width=520, height=420, appId=null} = opts;
    const win=document.createElement('div');
    win.className='window';
    const offset = document.querySelectorAll('.window').length * 20;
    win.style.width = Math.min(width, innerWidth - 100)+'px';
    win.style.height = Math.min(height, innerHeight - 200)+'px';
    win.style.left = (30 + offset%180) + 'px';
    win.style.top = (30 + offset%150) + 'px';
    win.innerHTML = `
      <div class="win-titlebar">
        <span style="font-size:16px">${icon}</span>
        <span class="win-title">${title}</span>
        <div class="win-controls">
          <button class="win-btn min" title="Minimieren">—</button>
          <button class="win-btn max" title="Maximieren">□</button>
          <button class="win-btn close" title="Schließen">✕</button>
        </div>
      </div>
      <div class="win-body">${content}</div>
      <div class="win-resize"></div>
    `;
    ws.appendChild(win);
    win.style.zIndex = ++zTop;
    win.addEventListener('mousedown',()=>{win.style.zIndex=++zTop;$$('.window').forEach(w=>w.classList.remove('active'));win.classList.add('active')});
    win.addEventListener('touchstart',()=>{win.style.zIndex=++zTop;$$('.window').forEach(w=>w.classList.remove('active'));win.classList.add('active')},{passive:true});
    
    // Dragging
    const tb = $('.win-titlebar', win);
    let drag=null;
    const startDrag=(e)=>{
      const p = e.touches?e.touches[0]:e;
      drag={x:p.clientX,y:p.clientY,l:win.offsetLeft,t:win.offsetTop};
      e.preventDefault?.();
    };
    const moveDrag=(e)=>{
      if(!drag) return;
      const p = e.touches?e.touches[0]:e;
      win.style.left = (drag.l + p.clientX - drag.x)+'px';
      win.style.top = Math.max(0, drag.t + p.clientY - drag.y)+'px';
    };
    const endDrag=()=>drag=null;
    tb.addEventListener('mousedown',startDrag);
    tb.addEventListener('touchstart',startDrag,{passive:false});
    document.addEventListener('mousemove',moveDrag);
    document.addEventListener('touchmove',moveDrag,{passive:false});
    document.addEventListener('mouseup',endDrag);
    document.addEventListener('touchend',endDrag);
    
    // Resize
    const rz=$('.win-resize',win);
    let rs=null;
    const startRs=(e)=>{const p=e.touches?e.touches[0]:e;rs={x:p.clientX,y:p.clientY,w:win.offsetWidth,h:win.offsetHeight};e.preventDefault?.()};
    const moveRs=(e)=>{if(!rs)return;const p=e.touches?e.touches[0]:e;
      win.style.width=Math.max(280,rs.w+p.clientX-rs.x)+'px';
      win.style.height=Math.max(180,rs.h+p.clientY-rs.y)+'px';
    };
    const endRs=()=>rs=null;
    rz.addEventListener('mousedown',startRs);rz.addEventListener('touchstart',startRs,{passive:false});
    document.addEventListener('mousemove',moveRs);document.addEventListener('touchmove',moveRs,{passive:false});
    document.addEventListener('mouseup',endRs);document.addEventListener('touchend',endRs);
    
    // Buttons
    $('.win-btn.close',win).onclick=(e)=>{e.stopPropagation();win.remove()};
    $('.win-btn.min',win).onclick=(e)=>{e.stopPropagation();$('.win-body',win).style.display = $('.win-body',win).style.display==='none'?'block':'none'};
    $('.win-btn.max',win).onclick=(e)=>{
      e.stopPropagation();
      if(win.dataset.max==='1'){
        win.style.left=win.dataset.l;win.style.top=win.dataset.t;win.style.width=win.dataset.w;win.style.height=win.dataset.h;
        win.dataset.max='0';
      }else{
        win.dataset.l=win.style.left;win.dataset.t=win.style.top;win.dataset.w=win.style.width;win.dataset.h=win.style.height;
        win.style.left='0';win.style.top='0';win.style.width='100%';win.style.height='100%';
        win.dataset.max='1';
      }
    };
    // Willkommensgruß
    Toast.show(`Willkommen zu HalDo AI OS Professional — ${title} · von Halil Donma`, '👋');
    return win;
  }
  return {open};
})();

/* ═══════════════ TOASTS ═══════════════ */
const Toast = (()=>{
  const c = $('#toast-container');
  function show(msg, icon='✨', dur=3200){
    const el = document.createElement('div');
    el.className='toast';
    el.innerHTML = `<span style="font-size:18px">${icon}</span><span>${msg}</span>`;
    c.appendChild(el);
    setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},dur);
  }
  return {show};
})();

/* ═══════════════ THEME SYSTEM ═══════════════ */
const Themes = (()=>{
  const presets = {
    holo:{primary:'#00e5ff',secondary:'#4da8ff',accent:'#b478ff'},
    cyborg:{primary:'#ff78c8',secondary:'#b478ff',accent:'#ff3dbb'},
    gold:{primary:'#ffd700',secondary:'#ffb800',accent:'#ff8c42'},
    matrix:{primary:'#00ff88',secondary:'#00cc66',accent:'#00ffcc'},
    crimson:{primary:'#ff3d5a',secondary:'#ff6b8a',accent:'#ffb800'},
    sunset:{primary:'#ff8c42',secondary:'#ff4d6d',accent:'#ffd700'},
    ice:{primary:'#8cd7ff',secondary:'#c0e8ff',accent:'#ffffff'}
  };
  function apply(name){
    const p = presets[name];
    if(!p) return;
    document.documentElement.style.setProperty('--primary',p.primary);
    document.documentElement.style.setProperty('--secondary',p.secondary);
    document.documentElement.style.setProperty('--accent',p.accent);
    document.documentElement.style.setProperty('--holo-cyan',p.primary);
    document.documentElement.style.setProperty('--holo-blue',p.secondary);
    document.documentElement.style.setProperty('--holo-purple',p.accent);
    LS.set('haldo_theme',name);
    Toast.show(`Theme: ${name.toUpperCase()}`,'🎨');
  }
  function applyCustom(primary,secondary,accent){
    document.documentElement.style.setProperty('--primary',primary);
    document.documentElement.style.setProperty('--secondary',secondary);
    document.documentElement.style.setProperty('--accent',accent);
    LS.set('haldo_theme_custom',{primary,secondary,accent});
  }
  function init(){
    const saved = LS.get('haldo_theme');
    if(saved && presets[saved]) apply(saved);
    const custom = LS.get('haldo_theme_custom');
    if(custom) applyCustom(custom.primary,custom.secondary,custom.accent);
  }
  return {apply,applyCustom,init,presets};
})();

  function renderItem(item){
    if(item.type==='toggle'){

        <input type="range" class="slider" data-key="${item.key}" data-def="${item.def}" min="${item.min}" max="${item.max}" step="${item.step}"></div>`;
    }
    if(item.type==='select'){
      const opts = item.opts.map(o=>`<option value="${o}">${o}</option>`).join('');

        <select class="set-select" data-key="${item.key}" data-def="${item.def}" data-action="${item.action||''}">${opts}</select></div>`;

      return `<div class="set-row"><div class="lbl">${item.lbl}</div><span style="color:var(--primary);font-weight:600">${item.value}</span></div>`;
    }
    if(item.type==='button'){
      return `<div class="set-row"><div class="lbl">${item.lbl}</div>
        <button class="big-btn" data-action="${item.action||''}" style="${item.danger?'background:#ff4d6a;color:#fff':''}">${item.btn}</button></div>`;

  function applyAction(action,val){

      const sizes={S:'12px',M:'14px',L:'16px',XL:'18px'};

      document.documentElement.style.setProperty('--glow',glows[val]+' var(--primary)');

    if(action==='theme'){
      const map={Holo:'holo',Cyborg:'cyborg',Gold:'gold',Matrix:'matrix',Crimson:'crimson',Sunset:'sunset',Ice:'ice'};
      if(map[val]) Themes.apply(map[val]);
    }
    if(action==='lang'){
      const codes={'Deutsch':'de','English':'en','Kurmancî':'ku','Sorani':'ckb','Êzidî':'ez','Türkçe':'tr','العربية':'ar','فارسی':'fa','עברית':'he','Русский':'ru','Français':'fr','Español':'es','Italiano':'it','中文':'zh','日本語':'ja',"O'zbek":'uz','Latina':'la'};
      if(codes[val]) Lang.set(codes[val]);
    }
  }
  function updateCustomColors(){
    const p=LS.get('haldo_set_c_primary','#00e5ff');
    const s=LS.get('haldo_set_c_secondary','#4da8ff');
    const a=LS.get('haldo_set_c_accent','#b478ff');
    Themes.applyCustom(p,s,a);
  }
  function handleAction(a){
    const map={
      terminal:()=>appTerminal(),
      export:()=>{const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=LS.get(k)};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='haldo_export_'+Date.now()+'.json';a.click();Toast.show('Daten exportiert!','📤')},
      wifi:()=>appWifi(),
      bt:()=>appBluetooth(),
      check_updates:()=>Toast.show('System ist aktuell (v125)','✅'),
      apikey:()=>appApiKey(),
    };
    if(map[a]) map[a]();
    else Toast.show('Funktion in Arbeit...','⚙️');
  }
  return {render, applyAction, updateCustomColors};
})();

/* ═══════════════ AI CHAT ═══════════════ */
const AIChat = (()=>{
  const patterns = [
    {r:/\b(hi|hey|hallo|haldo)\b/i, resp:['Hallo Bruder! 👋 Wie kann ich helfen?','Hey! Ich bin HalDo AI. Was brauchst du?','Hallo! Bereit für dich 💙']},
    {r:/wie geht|how are/i, resp:['Mir geht es super, danke der Nachfrage! 🤖','Bestens! Bin bereit zu helfen.']},
    {r:/wer bist|who are you/i, resp:['Ich bin HalDo AI — dein persönlicher Betriebssystem-Assistent von Halil Donma. 🚀']},
    {r:/uhrzeit|time/i, resp:[()=>`Es ist ${new Date().toLocaleTimeString('de-DE')} Uhr.`]},
    {r:/datum|date/i, resp:[()=>`Heute ist der ${new Date().toLocaleDateString('de-DE')}.`]},
    {r:/wetter|weather/i, resp:['Öffne die Wetter-App für Live-Daten. 🌤️']},
    {r:/hilfe|help/i, resp:['Ich kann: Apps öffnen, Zeit/Datum sagen, Fragen beantworten, Termine verwalten. Was willst du?']},
    {r:/ezidi|êzîdî/i, resp:['Êzidîtum ist eine der ältesten Religionen Mesopotamiens. 🕊️ Öffne "Êzîdî Wissen" für Details.']},
    {r:/danke|thank/i, resp:['Gerne, Bruder! 💙','Immer wieder gerne! ❤️']},
  ];
  function respond(msg){
    for(const p of patterns){
      if(p.r.test(msg)){
        const r=p.resp[Math.floor(Math.random()*p.resp.length)];
        return typeof r==='function'?r():r;
      }
    }
    return `Interessant! Ich habe "${msg}" verstanden. Als Phase-1-KI kann ich noch nicht alles beantworten, aber ich lerne dazu. Frag mich nach Zeit, Datum, oder sag "Hilfe". 💙`;
  }
  function append(text, isUser){
    const list = $('#chatList');
    const el = document.createElement('div');
    el.className='chat-msg '+(isUser?'user':'bot');
    el.textContent = text;
    list.appendChild(el);
    list.parentElement.scrollTop = list.parentElement.scrollHeight;
  }
  function send(){
    const inp = $('#chatInput');
    const msg = inp.value.trim();
    if(!msg) return;
    append(msg,true);
    inp.value='';
    setTimeout(()=>{
      const r = respond(msg);
      append(r,false);
      Avatar.speak(r);
    },400);
  }
  function init(){
    $('#chatSend').onclick = send;
    $('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter') send()});
    append('Hallo Bruder! 👋 Ich bin HalDo AI. Sag "Hey HalDo", "Hallo HalDo" oder frag mich was!',false);
  }
  return {init,send,respond};
})();

/* ═══════════════ AVATAR (Living AI) ═══════════════ */
const Avatar = (()=>{
  let blinking=false, speaking=false;
  function startBlink(){
    if(!LS.get('haldo_set_anim_blink',true)) return;
    blinking = !blinking;
    const eyeL = $('#eyeLg'), eyeR = $('#eyeRg');
    const s = blinking ? 'scaleY(0.1)' : 'scaleY(1)';
    eyeL.style.transition = eyeR.style.transition = 'transform 0.12s';
    eyeL.style.transformOrigin = '68px 98px';
    eyeR.style.transformOrigin = '132px 98px';
    eyeL.style.transform = s;
    eyeR.style.transform = s;
    setTimeout(startBlink, blinking ? 200 : 2500+Math.random()*3000);
  }
  function startBreathe(){
    const face = $('#faceEllipse');
    setInterval(()=>{
      if(!LS.get('haldo_set_anim_breathe',true)) return;
      face.setAttribute('rx', 70 + Math.sin(Date.now()/1200)*2);
      face.setAttribute('ry', 82 + Math.sin(Date.now()/1200)*2);
    },50);
  }
  function startEyeMove(){
    setInterval(()=>{
      if(!LS.get('haldo_set_anim_eyes',true)) return;
      const dx=(Math.random()-0.5)*4, dy=(Math.random()-0.5)*4;
      ['#pupilL','#pupilR'].forEach(s=>{
        const el=$(s);
        const base = s==='#pupilL' ? [68,98] : [132,98];
        el.setAttribute('cx', base[0]+dx);
        el.setAttribute('cy', base[1]+dy);
      });
    },1500);
  }
  function speak(text){
    if(!LS.get('haldo_set_tts',true) && !speaking) return;
    speaking = true;
    const mouth = $('#mouth');
    mouth.style.transition='d 0.15s';
    let phase=0;
    const anim = setInterval(()=>{
      phase++;
      const openness = 5 + Math.sin(phase*0.8)*8;
      mouth.setAttribute('d', `M 75 ${145} Q 100 ${145+openness} 125 ${145}`);
    },100);
    if('speechSynthesis' in window){
      const utter = new SpeechSynthesisUtterance(text.slice(0,200));
      utter.lang = 'de-DE';
      utter.rate = parseFloat(LS.get('haldo_set_ai_speed',1));
      utter.onend = ()=>{clearInterval(anim); mouth.setAttribute('d','M 75 145 Q 100 155 125 145'); speaking=false};
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    } else {
      setTimeout(()=>{clearInterval(anim);mouth.setAttribute('d','M 75 145 Q 100 155 125 145');speaking=false},2000);
    }
  }
  function open(){
    $('#avatarPanel').classList.add('show');
    const cyborg = document.body.classList.contains('cyborg');
    $('#avatarName').textContent = cyborg ? 'HalDo CYBORG' : 'HalDo AI';
    $('#avatarIcon').textContent = cyborg ? '⚡' : '🤖';
    $('#avatarPanel').classList.toggle('cyborg',cyborg);
  }
  function close(){$('#avatarPanel').classList.remove('show')}
  function init(){
    startBlink();
    startBreathe();
    startEyeMove();
    $('#avatarSpeak').onclick = ()=>{
      $('#avatarSpeak').classList.toggle('active');
      if(speaking){speechSynthesis?.cancel();speaking=false}
      else speak('Hallo, ich bin HalDo AI. Wie kann ich dir helfen?');
    };
    $('#avatarListen').onclick = ()=>{
      $('#avatarListen').classList.toggle('active');
      if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return Toast.show('Spracherkennung nicht verfügbar','⚠️');
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SR();
      rec.lang='de-DE'; rec.interimResults=false;
      rec.onresult=(e)=>{
        const t = e.results[0][0].transcript;
        Toast.show('Du: '+t,'🎤');
        Toast.show('HalDo AI: '+AIChat.respond(t),'🤖');
      };
      rec.start();
    };
    $('#avatarChat').onclick = ()=>{close();openPanel('chatPanel')};
  }
  return {init,open,close,speak};
})();

});

/* ═══════════════ APPS ═══════════════ */
function buildAppContent(key,name){
  if(key==='calc') return {html:`
    <div class="calc-display" id="calcDisp">0</div>
    <div class="calc-grid">
      <button data-k="C" class="op">C</button><button data-k="±" class="op">±</button><button data-k="%" class="op">%</button><button data-k="/" class="op">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>
      <button data-k="0" style="grid-column:span 2">0</button><button data-k=".">.</button><button data-k="=" class="eq">=</button>
    </div>`,init:()=>{
      let expr='0';
      const d=$('#calcDisp');
      document.querySelectorAll('.calc-grid button').forEach(b=>{
        b.onclick=()=>{
          const k=b.dataset.k;
          if(k==='C'){expr='0'}
          else if(k==='='){try{expr=String(eval(expr.replace(/×/g,'*').replace(/÷/g,'/')))}catch{expr='Err'}}
          else if(k==='±'){expr = expr.startsWith('-') ? expr.slice(1) : '-'+expr}
          else if(k==='%'){try{expr=String(eval(expr)/100)}catch{expr='Err'}}
          else {
            if(expr==='0'||expr==='Err') expr=k;
            else expr+=k;
          }
          d.textContent=expr;
        };
      });
    }};
  if(key==='notes') return {html:`
    <div style="margin-bottom:12px"><button class="big-btn" id="newNote">+ Neue Notiz</button></div>
    <div id="notesList"></div>`,init:()=>{
      function render(){
        const notes = LS.get('haldo_notes',[]);
        $('#notesList').innerHTML = notes.map((n,i)=>`
          <div class="note-card">
            <input placeholder="Titel" value="${n.title||''}" data-i="${i}" data-f="title">
            <textarea placeholder="Inhalt..." data-i="${i}" data-f="body">${n.body||''}</textarea>
            <button style="color:#ff4d6a;font-size:12px;margin-top:6px" data-del="${i}">Löschen</button>
          </div>`).join('') || '<p style="opacity:.5;text-align:center;padding:20px">Noch keine Notizen</p>';
        $$('#notesList input,#notesList textarea').forEach(el=>{
          el.oninput=()=>{const i=+el.dataset.i,f=el.dataset.f;const notes=LS.get('haldo_notes',[]);notes[i][f]=el.value;LS.set('haldo_notes',notes)};
        });
        $$('#notesList [data-del]').forEach(b=>{
          b.onclick=()=>{const notes=LS.get('haldo_notes',[]);notes.splice(+b.dataset.del,1);LS.set('haldo_notes',notes);render()};
        });
      }
      $('#newNote').onclick=()=>{const notes=LS.get('haldo_notes',[]);notes.unshift({title:'',body:''});LS.set('haldo_notes',notes);render()};
      render();
    }};
  if(key==='tasks') return {html:`
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="taskInp" class="set-input" style="flex:1" placeholder="Neue Aufgabe...">
      <button class="big-btn" id="addTask">+</button>
    </div><div id="taskList"></div>`,init:()=>{
      function render(){
        const tasks = LS.get('haldo_tasks',[]);
        $('#taskList').innerHTML = tasks.map((t,i)=>`
          <div class="task-card ${t.done?'done':''}">
            <input type="checkbox" ${t.done?'checked':''} data-i="${i}">
            <span style="flex:1">${t.title}</span>
            <button data-del="${i}" style="color:#ff4d6a">✕</button>
          </div>`).join('') || '<p style="opacity:.5;text-align:center;padding:20px">Noch keine Aufgaben</p>';
        $$('#taskList input[type=checkbox]').forEach(c=>{
          c.onchange=()=>{const tasks=LS.get('haldo_tasks',[]);tasks[+c.dataset.i].done=c.checked;LS.set('haldo_tasks',tasks);render()};
        });
        $$('#taskList [data-del]').forEach(b=>{
          b.onclick=()=>{const tasks=LS.get('haldo_tasks',[]);tasks.splice(+b.dataset.del,1);LS.set('haldo_tasks',tasks);render()};
        });
      }
      $('#addTask').onclick=()=>{
        const t=$('#taskInp').value.trim();
        if(!t) return;
        const tasks=LS.get('haldo_tasks',[]);tasks.unshift({title:t,done:false,created:Date.now()});
        LS.set('haldo_tasks',tasks);$('#taskInp').value='';render();
      };
      $('#taskInp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#addTask').click()});
      render();
    }};
  if(key==='journal') return {html:`
    <div style="margin-bottom:12px">
      <select id="moodSel" class="set-select" style="width:100%;margin-bottom:8px">
        <option value="😊">😊 Gut</option><option value="😐">😐 Okay</option><option value="😔">😔 Schlecht</option>
        <option value="😡">😡 Wütend</option><option value="😴">😴 Müde</option><option value="🤩">🤩 Super</option>
      </select>
      <textarea id="journalBody" class="set-input" style="width:100%;min-height:120px;resize:vertical" placeholder="Was beschäftigt dich heute?"></textarea>
      <button class="big-btn" id="saveJournal" style="margin-top:8px;width:100%">Eintrag speichern</button>
    </div>
    <div id="journalList"></div>`,init:()=>{
      function render(){
        const entries = LS.get('haldo_journal',[]);
        $('#journalList').innerHTML = entries.map(e=>`
          <div class="note-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
              <span style="font-size:20px">${e.mood||'📝'}</span>
              <span style="font-size:11px;opacity:.6">${new Date(e.ts).toLocaleString('de-DE')}</span>
            </div>
            <div style="font-size:13px;line-height:1.5">${e.body}</div>
          </div>`).join('') || '<p style="opacity:.5;text-align:center;padding:20px">Noch keine Einträge</p>';
      }
      $('#saveJournal').onclick=()=>{
        const body=$('#journalBody').value.trim();
        if(!body) return;
        const entries=LS.get('haldo_journal',[]);
        entries.unshift({body,mood:$('#moodSel').value,ts:Date.now()});
        LS.set('haldo_journal',entries);
        $('#journalBody').value='';
        render();
        Toast.show('Journal-Eintrag gespeichert','📔');
      };
      render();
    }};
  if(key==='weather') return {html:`
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <input id="wCity" class="set-input" style="flex:1" placeholder="Stadt" value="Berlin">
      <button class="big-btn" id="wSearch">🔍</button>
    </div>
    <div id="wResult" style="text-align:center;padding:20px;opacity:.6">Suche starten...</div>`,init:async()=>{
      async function search(){
        const city=$('#wCity').value.trim()||'Berlin';
        $('#wResult').innerHTML='<p>Lade Wetter...</p>';
        try{
          const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=de`).then(r=>r.json());
          if(!geo.results?.length){$('#wResult').innerHTML='<p>Stadt nicht gefunden</p>';return}
          const {latitude:lat,longitude:lon,name:cityName,country} = geo.results[0];
          const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`).then(r=>r.json());
          const c = w.current;
          const codeMap = {0:'☀️ Klar',1:'🌤️ Meist klar',2:'⛅ Teils wolkig',3:'☁️ Bewölkt',45:'🌫️ Nebel',48:'🌫️ Reifnebel',51:'🌦️ Nieselregen',61:'🌧️ Regen',63:'🌧️ Regen',65:'🌧️ Starkregen',71:'🌨️ Schnee',80:'🌧️ Schauer',95:'⛈️ Gewitter'};
          $('#wResult').innerHTML = `
            <div style="font-size:24px;font-weight:700">${cityName}, ${country}</div>
            <div style="font-size:52px;font-weight:800;margin:12px 0;color:var(--primary)">${Math.round(c.temperature_2m)}°C</div>
            <div style="font-size:16px;margin-bottom:12px">${codeMap[c.weather_code]||'🌡️'}</div>
            <div style="display:flex;gap:20px;justify-content:center;font-size:13px;opacity:.8">
              <div>💧 ${c.relative_humidity_2m}%</div>
              <div>💨 ${c.wind_speed_10m} km/h</div>
            </div>
            <div style="margin-top:16px;font-size:12px;opacity:.7">
              Max: ${Math.round(w.daily.temperature_2m_max[0])}°C · Min: ${Math.round(w.daily.temperature_2m_min[0])}°C
            </div>`;
        }catch(e){$('#wResult').innerHTML='<p>Fehler beim Laden</p>'}
      }
      $('#wSearch').onclick=search;
      $('#wCity').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
      search();
    }};
  if(key==='timer') return {html:`
    <div style="text-align:center;padding:20px">
      <div id="timerDisp" class="stat-big" style="font-size:64px">00:00</div>
      <div style="display:flex;gap:8px;margin-top:20px;justify-content:center">
        <input id="timerSec" class="set-input" type="number" placeholder="Sekunden" value="60" style="width:120px">
        <button class="big-btn" id="timerStart">Start</button>
        <button class="big-btn" id="timerStop" style="background:#ff4d6a;color:#fff">Stop</button>
      </div>
    </div>`,init:()=>{
      let interval=null, remain=0;
      function tick(){
        remain--;
        if(remain<=0){clearInterval(interval);$('#timerDisp').textContent='00:00';Toast.show('Timer fertig!','⏰');return}
        const m=Math.floor(remain/60),s=remain%60;
        $('#timerDisp').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
      $('#timerStart').onclick=()=>{
        clearInterval(interval);
        remain = parseInt($('#timerSec').value)||60;
        tick();
        interval=setInterval(tick,1000);
      };
      $('#timerStop').onclick=()=>clearInterval(interval);
    }};
  if(key==='password') return {html:`
    <div style="text-align:center;padding:20px">
      <div id="pwOut" style="font-family:monospace;font-size:20px;padding:20px;background:rgba(0,0,0,.5);border-radius:12px;word-break:break-all;margin-bottom:16px;min-height:60px">Klick auf Generieren</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px">
        <label style="font-size:12px">Länge: <input id="pwLen" type="range" min="8" max="64" value="16" class="slider"></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <label style="font-size:12px"><input type="checkbox" id="pwUpper" checked> A-Z</label>
        <label style="font-size:12px"><input type="checkbox" id="pwLower" checked> a-z</label>
        <label style="font-size:12px"><input type="checkbox" id="pwDigits" checked> 0-9</label>
        <label style="font-size:12px"><input type="checkbox" id="pwSymbols" checked> !@#$</label>
      </div>
      <button class="big-btn" id="pwGen" style="margin-top:16px">Generieren</button>
      <button class="big-btn" id="pwCopy" style="margin-top:8px">Kopieren</button>
    </div>`,init:()=>{
      function gen(){
        const len=+$('#pwLen').value;
        let chars='';
        if($('#pwUpper').checked) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if($('#pwLower').checked) chars+='abcdefghijklmnopqrstuvwxyz';
        if($('#pwDigits').checked) chars+='0123456789';
        if($('#pwSymbols').checked) chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
        if(!chars) chars='abc123';
        let pw='';
        for(let i=0;i<len;i++) pw+=chars[Math.floor(Math.random()*chars.length)];
        $('#pwOut').textContent = pw;
      }
      $('#pwGen').onclick=gen;
      $('#pwCopy').onclick=()=>{navigator.clipboard.writeText($('#pwOut').textContent);Toast.show('Passwort kopiert','📋')};
      gen();
    }};
  if(key==='qr') return {html:`
    <div style="padding:12px">
      <input id="qrInp" class="set-input" style="width:100%;margin-bottom:12px" placeholder="Text oder URL">
      <button class="big-btn" id="qrGen">QR-Code erstellen</button>
      <div id="qrOut" style="text-align:center;margin-top:20px"></div>
    </div>`,init:()=>{
      $('#qrGen').onclick=()=>{
        const t = $('#qrInp').value.trim();
        if(!t) return;
        // Simple QR via API
        const url = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(t)}`;
        $('#qrOut').innerHTML = `<img src="${url}" style="border-radius:12px;background:#fff;padding:8px">`;
      };
    }};
  if(key==='stats') return {html:`
    <div style="padding:12px">
      <textarea id="statInp" class="set-input" style="width:100%;min-height:100px" placeholder="Zahlen (Komma oder Zeile getrennt)"></textarea>
      <button class="big-btn" id="statCalc" style="margin-top:8px">Berechnen</button>
      <div id="statOut" style="margin-top:16px"></div>
    </div>`,init:()=>{
      $('#statCalc').onclick=()=>{
        const nums = $('#statInp').value.split(/[\s,;]+/).map(Number).filter(n=>!isNaN(n));
        if(!nums.length) return $('#statOut').innerHTML='<p>Keine Zahlen</p>';
        const sum=nums.reduce((a,b)=>a+b,0);
        const mean=sum/nums.length;
        const sorted=[...nums].sort((a,b)=>a-b);
        const median = sorted.length%2 ? sorted[(sorted.length-1)/2] : (sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;
        const min=Math.min(...nums), max=Math.max(...nums);
        $('#statOut').innerHTML = `
          <div class="note-card"><b>Anzahl:</b> ${nums.length}</div>
          <div class="note-card"><b>Summe:</b> ${sum}</div>
          <div class="note-card"><b>Mittelwert:</b> ${mean.toFixed(2)}</div>
          <div class="note-card"><b>Median:</b> ${median}</div>
          <div class="note-card"><b>Min:</b> ${min} · <b>Max:</b> ${max}</div>`;
      };
    }};
  if(key==='random') return {html:`
    <div style="padding:20px;text-align:center">
      <div id="rndOut" class="stat-big" style="font-size:80px">?</div>
      <div style="display:flex;gap:8px;justify-content:center;margin:20px 0">
        <input id="rndMin" class="set-input" type="number" value="1" style="width:80px">
        <input id="rndMax" class="set-input" type="number" value="100" style="width:80px">
      </div>
      <button class="big-btn" id="rndGen">Zufallszahl</button>
    </div>`,init:()=>{
      $('#rndGen').onclick=()=>{
        const min=+$('#rndMin').value, max=+$('#rndMax').value;
        $('#rndOut').textContent = Math.floor(Math.random()*(max-min+1))+min;
      };
    }};
  if(key==='ezidi') return {html:`
    <div style="padding:16px;line-height:1.6">
      <h2 style="color:var(--gold);margin-bottom:12px">🕊️ Êzîdîtum — Die alte Religion</h2>
      <p style="margin-bottom:12px">Êzîdîtum ist eine der ältesten monotheistischen Religionen Mesopotamiens. Die Êzîdî glauben an einen einzigen Gott (Xwedê) und verehren <b>Tawûsî Melek</b> (den Pfauengel) als Stellvertreter Gottes.</p>
      <p style="margin-bottom:12px"><b>Heiliges Buch:</b> Mishefa Reş (Schwarzes Buch) und Jelwa</p>
      <p style="margin-bottom:12px"><b>Heiliger Ort:</b> Lalisch (Lalişa Nûranî) im Irak</p>
      <p style="margin-bottom:12px"><b>Sprache:</b> Kurmancî (Kurdisch) ist die Liturgiesprache</p>
      <p style="margin-bottom:12px"><b>Feste:</b> Çarşema Sor (Neujahr im April), Cejiyê Êzîyan</p>
      <p style="margin-bottom:12px"><b>Kasten:</b> Mîr (Fürst), Şêx, Pîr, Murîd</p>
      <div style="margin-top:20px;padding:12px;background:rgba(255,215,0,.1);border-left:3px solid var(--gold);border-radius:8px;font-size:12px">
        <b>Êzîdî Sprüche:</b><br>
        "Êzîdî ne tenê dînek e, ew nasnameyek e." (Êzîdîtum ist nicht nur Religion, es ist Identität.)<br>
        "Xwedê mezin e, Êzîdî sax bin." (Gott ist groß, Êzîdî sollen leben.)
      </div>
    </div>`,w:560,h:500};
  if(key==='blitzer') return {html:`
    <div style="text-align:center;padding:20px">
      <div class="stat-big" style="font-size:72px" id="speedDisp">0</div>
      <div style="font-size:14px;opacity:.7;margin-bottom:20px">km/h</div>
      <div id="blitzerWarn" style="padding:12px;background:rgba(255,77,106,.2);border:1px solid #ff4d6a;border-radius:12px;margin-bottom:16px;min-height:50px;display:flex;align-items:center;justify-content:center">
        🛡️ Keine Blitzer in der Nähe
      </div>
      <div style="font-size:12px;opacity:.7">
        A7 · Frankfurt · Richtung Kassel<br>
        Nächste Ausfahrt: 2 km
      </div>
      <button class="big-btn" id="blitzerSim" style="margin-top:16px">Simulieren</button>
    </div>`,init:()=>{
      $('#blitzerSim').onclick=()=>{
        const sp = Math.floor(Math.random()*160)+40;
        $('#speedDisp').textContent = sp;
        if(sp>120){
          $('#blitzerWarn').innerHTML = '⚠️ <b>BLITZER IN 200 m!</b> Bitte bremsen!';
          $('#blitzerWarn').style.background='rgba(255,77,106,.4)';
          Avatar.speak(`Achtung! Blitzer in 200 Metern. Deine Geschwindigkeit: ${sp} km/h. Bitte bremsen.`);
        } else {
          $('#blitzerWarn').innerHTML = '🛡️ Keine Blitzer in der Nähe';
          $('#blitzerWarn').style.background='rgba(255,77,106,.2)';
        }
      };
    }};
  if(key==='memory') return {html:`
    <div style="padding:12px">
      <input id="memInp" class="set-input" style="width:100%;margin-bottom:8px" placeholder="Was soll ich mir merken?">
      <button class="big-btn" id="memSave" style="width:100%">Merken</button>
      <div id="memList" style="margin-top:16px"></div>
    </div>`,init:()=>{
      function render(){
        const mem = LS.get('haldo_memory',[]);
        $('#memList').innerHTML = mem.map((m,i)=>`
          <div class="note-card">
            <div>${m.text}</div>
            <div style="font-size:11px;opacity:.6;margin-top:6px">${new Date(m.ts).toLocaleString('de-DE')}</div>
          </div>`).join('') || '<p style="opacity:.5;text-align:center;padding:20px">Noch nichts gemerkt</p>';
      }
      $('#memSave').onclick=()=>{
        const t=$('#memInp').value.trim();
        if(!t) return;
        const mem=LS.get('haldo_memory',[]);
        mem.unshift({text:t,ts:Date.now()});
        LS.set('haldo_memory',mem);
        $('#memInp').value='';render();
        Toast.show('Gemerkt!','🧠');
      };
      render();
    }};
  if(key==='about') return {html:`
    <div style="padding:20px;text-align:center">
      <div style="font-size:64px;margin-bottom:12px">🌌</div>
      <h2 style="color:var(--primary);font-size:22px;margin-bottom:8px">HalDo AI OS Professional</h2>
      <p style="font-size:12px;opacity:.7;margin-bottom:20px">Version 125 · Phase 1 Foundation</p>
      <div style="text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:16px;border:1px solid var(--glass-border)">
        <p><b>Entwickler:</b> Halil Donma</p>
        <p><b>Build:</b> 2024.125.0</p>
        <p><b>Apps:</b> 375+ geplant, 40+ aktiv</p>
        <p><b>Sprachen:</b> 18 verfügbar</p>
        <p><b>Plattform:</b> Web (iOS/Android/Desktop)</p>
      </div>
      <p style="margin-top:20px;font-size:11px;opacity:.6">© 2024 HalDo AI OS · Made with 💙 by Halil Donma</p>
    </div>`,w:480,h:460};
  if(key==='terminal') return {html:`
    <div style="padding:12px">
      <div id="termOut" style="background:#000;color:#00ff88;font-family:monospace;font-size:13px;padding:12px;border-radius:8px;min-height:200px;max-height:300px;overflow:auto;margin-bottom:8px">
        <div>HalDo OS Terminal v1.0</div>
        <div>Type "help" for commands</div>
      </div>
      <div style="display:flex;gap:8px">
        <input id="termInp" class="set-input" style="flex:1;font-family:monospace" placeholder="$ command">
        <button class="big-btn" id="termRun">▶</button>
      </div>
    </div>`,init:()=>{
      const cmds = {
        help:()=>'Commands: help, whoami, date, clear, echo, ls, version, coin, roll',
        whoami:()=>'user@haldo-os',
        date:()=>new Date().toString(),
        clear:()=>{$('#termOut').innerHTML='';return ''},
        ls:()=>'apps/  documents/  downloads/  photos/  system/',
        version:()=>'HalDo AI OS v125',
        echo:(args)=>args.join(' '),
        coin:()=>Math.random()<0.5?'Kopf':'Zahl',
        roll:(args)=>{const n=+args[0]||6;return Math.floor(Math.random()*n)+1},
      };
      $('#termRun').onclick=()=>{
        const line = $('#termInp').value.trim();
        if(!line) return;
        const [cmd,...args]=line.split(/\s+/);
        let out='';
        if(cmds[cmd]) out = cmds[cmd](args);
        else out = `command not found: ${cmd}`;
        $('#termOut').innerHTML += `<div style="color:#fff">$ ${line}</div>${out?`<div>${out}</div>`:''}`;
        $('#termInp').value='';
        $('#termOut').scrollTop=$('#termOut').scrollHeight;
      };
      $('#termInp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#termRun').click()});
    },w:560,h:460};
  if(key==='wifi') return {html:`
    <div style="padding:16px">
      <h3 style="margin-bottom:12px">📶 Netzwerk</h3>
      <div id="wifiStatus" class="note-card">Lade...</div>
      <div id="wifiList" style="margin-top:12px"></div>
    </div>`,init:()=>{
      const conn = navigator.connection;
      const status = conn ? `
        <p><b>Typ:</b> ${conn.effectiveType||'unbekannt'}</p>
        <p><b>Geschwindigkeit:</b> ${conn.downlink||'?'} Mbps</p>
        <p><b>Latenz:</b> ${conn.rtt||'?'} ms</p>
        <p><b>Online:</b> ${navigator.onLine?'✅ Ja':'❌ Nein'}</p>` : `<p><b>Online:</b> ${navigator.onLine?'✅ Ja':'❌ Nein'}</p><p>Network API nicht verfügbar</p>`;
      $('#wifiStatus').innerHTML = status;
      // Simulierte WLAN-Liste
      const networks = ['HalDo-5G','WLAN-Gast','FritzBox-7390','Privates Netzwerk','Nachbar-WLAN'];
      $('#wifiList').innerHTML = networks.map((n,i)=>`
        <div class="note-card" style="display:flex;justify-content:space-between;align-items:center">
          <span>📶 ${n}</span>
          <button class="big-btn" style="min-height:32px;padding:0 12px;font-size:12px">Verbinden</button>
        </div>`).join('');
    }};
  if(key==='bluetooth') return {html:`
    <div style="padding:16px;text-align:center">
      <h3 style="margin-bottom:12px">📶 Bluetooth</h3>
      <p style="font-size:13px;opacity:.7;margin-bottom:16px">Suche nach Geräten in der Nähe</p>
      <button class="big-btn" id="btSearch">🔍 Geräte suchen</button>
      <div id="btList" style="margin-top:16px"></div>
    </div>`,init:()=>{
      $('#btSearch').onclick=async()=>{
        if(!navigator.bluetooth){$('#btList').innerHTML='<p style="color:#ff4d6a">Bluetooth nicht verfügbar in diesem Browser</p>';return}
        try{
          const device = await navigator.bluetooth.requestDevice({acceptAllDevices:true});
          $('#btList').innerHTML = `<div class="note-card">✅ Verbunden: <b>${device.name||'Unbenannt'}</b></div>`;
        }catch(e){$('#btList').innerHTML='<p style="opacity:.6">Suche abgebrochen</p>'}
      };
    }};
  if(key==='apikey') return {html:`
    <div style="padding:16px">
      <h3 style="margin-bottom:12px">🔑 API-Key-Verwaltung</h3>
      <p style="font-size:12px;opacity:.7;margin-bottom:16px">Speichere deine API-Keys für KI-Dienste. Sie bleiben lokal auf deinem Gerät.</p>
      <div class="note-card">
        <label style="font-size:12px"><b>OpenAI API Key</b></label>
        <input id="keyOpenAI" class="set-input" style="width:100%;margin-top:6px" type="password" placeholder="sk-...">
      </div>
      <div class="note-card">
        <label style="font-size:12px"><b>Google Gemini Key</b></label>
        <input id="keyGemini" class="set-input" style="width:100%;margin-top:6px" type="password" placeholder="AIza...">
      </div>
      <div class="note-card">
        <label style="font-size:12px"><b>Anthropic Claude Key</b></label>
        <input id="keyClaude" class="set-input" style="width:100%;margin-top:6px" type="password" placeholder="sk-ant-...">
      </div>
      <div class="note-card">
        <label style="font-size:12px"><b>Open-Meteo (kostenlos)</b></label>
        <input id="keyMeteo" class="set-input" style="width:100%;margin-top:6px" placeholder="Kein Key nötig">
      </div>
      <button class="big-btn" id="saveKeys" style="width:100%;margin-top:12px">💾 Speichern</button>
    </div>`,init:()=>{
      const keys = LS.get('haldo_apikeys',{});
      ['keyOpenAI','keyGemini','keyClaude','keyMeteo'].forEach(id=>{
        const field = id.replace('key','');
        $('#'+id).value = keys[field]||'';
      });
      $('#saveKeys').onclick=()=>{
        LS.set('haldo_apikeys',{
          OpenAI:$('#keyOpenAI').value,
          Gemini:$('#keyGemini').value,
          Claude:$('#keyClaude').value,
          Meteo:$('#keyMeteo').value,
        });
        Toast.show('API-Keys gespeichert','🔑');
      };
    },w:520,h:520};
  // Generic fallback
  return {html:`
    <div style="padding:30px;text-align:center">
      <div style="font-size:64px;margin-bottom:16px">${AppRegistry.iconFor(name)}</div>
      <h2 style="color:var(--primary);margin-bottom:8px">${name}</h2>
      <p style="font-size:13px;opacity:.7;line-height:1.6;margin-top:12px">
        Diese App ist Teil von HalDo AI OS Professional.<br>
        Die vollständige Implementierung wird in den nächsten Phasen ausgerollt.<br><br>
        <b>Bereits verfügbar:</b> Calculator, Notes, Tasks, Journal, Weather, Timer, Password, QR, Stats, Random, Ezidi, Blitzer, Memory, Terminal, WLAN, Bluetooth, API-Keys.
      </p>
      <div style="margin-top:20px;padding:12px;background:rgba(0,229,255,.1);border:1px solid var(--glass-border);border-radius:12px;font-size:11px;opacity:.8">
        <b>Willkommen zu HalDo AI OS Professional</b><br>
        ${name} · von Halil Donma
      </div>
    </div>`,w:480,h:400};
}

/* ═══════════════ PANEL TRIGGERS ═══════════════ */
function setupTriggers(){
  // Sidebar
  $$('.side-btn').forEach(b=>{
    b.onclick=()=>{
      const p=b.dataset.panel;
      $$('.side-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      if(p==='home'){Toast.show('HalDo AI OS Home','🏠');showWelcome('Home')}
      else if(p==='apps'){AppRegistry.render($('#appsBody'));openPanel('appsPanel')}
      else if(p==='system'){Settings.render($('#settingsBody'));openPanel('settingsPanel')}
      else if(p==='chat'){openPanel('chatPanel')}
      else if(p==='files'){launchApp('Files')}
      else if(p==='setup'){launchApp('Settings')}
      else if(p==='info'){launchApp('About')}
      else if(p==='ai'){Avatar.open()}
      else if(p==='cyborg'){
        document.body.classList.toggle('cyborg');
        Toast.show(document.body.classList.contains('cyborg')?'⚡ CYBORG AN':'🤖 Standard AN','⚡');
        LS.set('haldo_set_cyborg_mode',document.body.classList.contains('cyborg'));
      }
    };
  });
  // Topbar
  $('#btnSettings').onclick=()=>{Settings.render($('#settingsBody'));openPanel('settingsPanel')};
  $('#btnLang').onclick=()=>{
    Settings.render($('#settingsBody'));openPanel('settingsPanel');
    setTimeout(()=>{
      document.querySelector('[data-key="R"]')?.classList.add('open');
      document.querySelector('[data-key="R"]')?.scrollIntoView({behavior:'smooth',block:'start'});
    },100);
  };
  $('#btnTheme').onclick=()=>{
    Settings.render($('#settingsBody'));openPanel('settingsPanel');
    setTimeout(()=>{
      document.querySelector('[data-key="F"]')?.classList.add('open');
      document.querySelector('[data-key="F"]')?.scrollIntoView({behavior:'smooth',block:'start'});
    },100);
  };
  // Logo → Sidebar toggle
  $('#logoBtn').onclick=()=>{
    $('#sidebar').classList.toggle('expanded');
    $('#workspace').classList.toggle('sidebar-open', $('#sidebar').classList.contains('expanded'));
  };
  // Dock
  $('#dockChat').onclick=()=>openPanel('chatPanel');
  $('#dockAI').onclick=()=>Avatar.open();
  $('#dockCyborg').onclick=()=>{
    document.body.classList.toggle('cyborg');
    Toast.show(document.body.classList.contains('cyborg')?'⚡ CYBORG AN':'🤖 Standard AN','⚡');
    $('#dockCyborg').classList.toggle('active',document.body.classList.contains('cyborg'));
    LS.set('haldo_set_cyborg_mode',document.body.classList.contains('cyborg'));
    Avatar.open();
  };
}

/* ═══════════════ WELCOME GREETING ═══════════════ */
function showWelcome(appName){
  const w = document.createElement('div');
  w.className='welcome-banner';
  w.textContent = `✨ Willkommen zu HalDo AI OS Professional — ${appName||'Home'} · von Halil Donma ✨`;
  document.body.appendChild(w);
  setTimeout(()=>{w.classList.add('hide');setTimeout(()=>w.remove(),600)},3500);
}

/* ═══════════════ INIT ═══════════════ */
function init(){
  Cosmos.init();
  RingText.init();
  Themes.init();
  AIChat.init();
  Avatar.init();
  setupTriggers();
  // Load cyborg
  if(LS.get('haldo_set_cyborg_mode',false)){
    document.body.classList.add('cyborg');
    $('#dockCyborg').classList.add('active');
  }
  // Font size
  const fs = LS.get('haldo_set_font_size','M');
  Settings.applyAction('fontsize',fs);
  // Blur
  const bl = LS.get('haldo_set_blur','Mittel');
  Settings.applyAction('blur',bl);
  // Glow
  const gl = LS.get('haldo_set_glow','Normal');
  Settings.applyAction('glow',gl);
  // Welcome
  setTimeout(()=>showWelcome('Home'),300);
  Toast.show('HalDo AI OS v125 bereit · Willkommen Bruder!','🌌',4000);
  // Auto-Launch Chat nach kurzer Zeit?
  // Nein - sauberer Start
}

document.addEventListener('DOMContentLoaded',init);
// Fallback
if(document.readyState!=='loading') init();
</script>
</body>
</html>
