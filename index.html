<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00e5ff">
<title>HalDo AI OS Pro Max</title>
<style>
:root{
  --c-cyan:#00e5ff;--c-blue:#4da8ff;--c-purple:#b478ff;--c-pink:#ff78c8;
  --c-bg:#02040a;--c-panel:rgba(8,18,38,.55);--c-panel2:rgba(8,18,38,.85);
  --c-border:rgba(0,229,255,.4);--c-text:#e8f6ff;--c-dim:rgba(232,246,255,.6);
  --accent1:var(--c-cyan);--accent2:var(--c-purple);
  --r-w:18px;--r-b:14px;
  --sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);
  --sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px);
  --sb-w:72px;--tb-h:56px;--bb-h:64px;
}
[data-theme="cyborg"]{--accent1:var(--c-pink);--accent2:var(--c-purple);--c-border:rgba(255,120,200,.45);--c-panel:rgba(45,10,50,.55);--c-panel2:rgba(45,10,50,.85)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:var(--c-text);background:var(--c-bg);-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;color:inherit;font-size:16px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--accent1);border-radius:3px;opacity:.5}
::-webkit-scrollbar-track{background:transparent}

#cosmos{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0a1530 0%,#02040a 70%)}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
#sun{position:absolute;left:50%;top:50%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff8c0 0%,#ffb020 35%,#ff5500 70%,transparent 100%);box-shadow:0 0 80px 30px rgba(255,150,0,.5),0 0 200px 80px rgba(255,100,0,.2);animation:sunPulse 4s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)}}
.orbit{position:absolute;left:50%;top:50%;border:1px solid rgba(0,229,255,.08);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.planet{position:absolute;border-radius:50%;box-shadow:0 0 12px 2px rgba(120,180,255,.4);animation:orbit linear infinite}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--orbit)) rotate(0deg)}to{transform:rotate(360deg) translateX(var(--orbit)) rotate(-360deg)}}
.shooting{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 8px 2px #fff;animation:shoot 4s linear infinite}
@keyframes shoot{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-300px,300px);opacity:0}}

#topbar{position:fixed;top:0;left:0;right:0;height:calc(var(--tb-h) + var(--sa-t));padding:var(--sa-t) calc(12px + var(--sa-r)) 0 calc(var(--sb-w) + 12px + var(--sa-l));display:flex;align-items:center;justify-content:space-between;z-index:100;background:linear-gradient(180deg,rgba(2,4,10,.85),transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.5px}
#topbar .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent1);box-shadow:0 0 10px var(--accent1);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
#topbar .actions{display:flex;gap:8px}
.tb-btn{width:40px;height:40px;border-radius:12px;background:var(--c-panel);border:1.5px solid var(--c-border);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.tb-btn:hover,.tb-btn:active{background:rgba(0,229,255,.15);box-shadow:0 0 20px rgba(0,229,255,.4)}
.tb-btn.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#02040a;font-weight:700}

#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sb-w);padding:calc(var(--tb-h) + var(--sa-t) + 8px) 0 calc(var(--bb-h) + var(--sa-b) + 8px) 0;display:flex;flex-direction:column;gap:4px;background:linear-gradient(90deg,rgba(2,4,10,.9),rgba(2,4,10,.5));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1.5px solid var(--c-border);z-index:90;padding-left:var(--sa-l);transition:transform .3s;overflow-y:auto}
#sidebar.hidden{transform:translateX(-100%)}
.sb-btn{width:56px;height:56px;margin:0 auto;border-radius:14px;background:var(--c-panel);border:1.5px solid var(--c-border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;transition:all .2s;flex-shrink:0}
.sb-btn .lbl{font-size:8px;color:var(--c-dim);text-transform:uppercase;letter-spacing:.5px}
.sb-btn:hover,.sb-btn:active{background:rgba(0,229,255,.15);box-shadow:0 0 20px rgba(0,229,255,.4);transform:translateX(2px)}
.sb-btn.active{background:linear-gradient(135deg,rgba(0,229,255,.3),rgba(180,120,255,.3));border-color:var(--accent1);box-shadow:0 0 24px rgba(0,229,255,.5)}

#desktop{position:fixed;top:calc(var(--tb-h) + var(--sa-t));left:calc(var(--sb-w) + var(--sa-l));right:var(--sa-r);bottom:calc(var(--bb-h) + var(--sa-b));z-index:50;overflow:hidden;pointer-events:none}
.win{position:absolute;width:480px;height:560px;min-width:280px;min-height:200px;background:var(--c-panel2);border:1.5px solid var(--c-border);border-radius:var(--r-w);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 40px rgba(0,0,0,.5),0 0 40px rgba(0,229,255,.15);display:flex;flex-direction:column;pointer-events:auto;overflow:hidden;animation:winIn .3s ease}
@keyframes winIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.win.active{box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 60px rgba(0,229,255,.35)}
.win.min{display:none}
.win-head{height:48px;flex-shrink:0;display:flex;align-items:center;padding:0 8px 0 16px;background:linear-gradient(90deg,rgba(0,229,255,.08),transparent);border-bottom:1px solid var(--c-border);cursor:move;touch-action:none}
.win-head .title{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:move}
.win-ctrls{display:flex;gap:6px;z-index:999999;position:relative}
.win-btn{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;z-index:999999;position:relative}
.win-btn:hover{background:rgba(0,229,255,.2)}
.win-btn.close:hover{background:rgba(255,80,80,.4)}
.win-body{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.5}
.win-body *{pointer-events:auto}
.win-resize{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--c-border) 50%);z-index:10}
@media(max-width:700px){.win{width:calc(100vw - var(--sb-w) - 20px);height:calc(100vh - var(--tb-h) - var(--bb-h) - 40px);left:10px!important;top:10px!important}}

#bottombar{position:fixed;bottom:0;left:calc(var(--sb-w) + var(--sa-l));right:var(--sa-r);height:calc(var(--bb-h) + var(--sa-b));padding:0 12px var(--sa-b) 12px;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(0deg,rgba(2,4,10,.9),transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:95}
.bb-btn{flex:1;max-width:160px;height:48px;border-radius:var(--r-b);background:var(--c-panel);border:1.5px solid var(--c-border);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;transition:all .2s;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.bb-btn:hover,.bb-btn:active{background:rgba(0,229,255,.18);box-shadow:0 0 24px rgba(0,229,255,.5);transform:translateY(-2px)}
.bb-btn.cyborg{background:linear-gradient(135deg,rgba(255,120,200,.2),rgba(180,120,255,.2));border-color:var(--c-pink)}

#toasts{position:fixed;left:50%;bottom:calc(var(--bb-h) + var(--sa-b) + 100px);transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 40px);max-width:400px}
.toast{padding:12px 18px;background:var(--c-panel2);border:1.5px solid var(--c-border);border-radius:var(--r-b);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 4px 30px rgba(0,229,255,.3);font-size:13px;text-align:center;animation:toastIn .3s ease;pointer-events:auto}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

#avatar{position:fixed;right:20px;bottom:calc(var(--bb-h) + var(--sa-b) + 20px);width:110px;height:110px;z-index:80;pointer-events:none;display:flex;align-items:center;justify-content:center}
#avatar .halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 55%,rgba(0,229,255,.3) 70%,transparent 80%);animation:halo 3s linear infinite}
@keyframes halo{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#avatar svg{width:90px;height:90px;filter:drop-shadow(0 0 12px var(--accent1))}
#avatar .eye{animation:blink 4s infinite;transform-origin:center}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#avatar.speaking .mouth{animation:speak .3s infinite alternate}
@keyframes speak{from{transform:scaleY(1)}to{transform:scaleY(.3)}}

.card{background:rgba(255,255,255,.04);border:1.5px solid var(--c-border);border-radius:14px;padding:14px;margin-bottom:12px;transition:all .2s}
.card:hover{background:rgba(0,229,255,.06);box-shadow:0 0 20px rgba(0,229,255,.15)}
.card h4{font-size:14px;margin-bottom:6px;color:var(--accent1)}
.card .meta{font-size:11px;color:var(--c-dim);margin-top:6px}
.btn{padding:10px 16px;min-height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#02040a;font-weight:700;font-size:13px;transition:all .15s;display:inline-block}
.btn:hover{filter:brightness(1.2);box-shadow:0 0 20px rgba(0,229,255,.5)}
.btn.ghost{background:var(--c-panel);color:var(--c-text);border:1.5px solid var(--c-border)}
.btn.danger{background:linear-gradient(135deg,#ff4466,#ff2244);color:#fff}
.inp{width:100%;padding:10px 14px;min-height:40px;border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--c-border);color:var(--c-text);font-size:14px;margin-bottom:8px;transition:all .15s}
.inp:focus{background:rgba(0,229,255,.08);box-shadow:0 0 20px rgba(0,229,255,.3);border-color:var(--accent1)}
.ta{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
.tab{padding:8px 14px;min-height:36px;border-radius:10px;background:var(--c-panel);border:1.5px solid var(--c-border);font-size:12px;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#02040a;font-weight:700}
.list-item{padding:12px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-item:last-child{border-bottom:none}
.list-item .txt{flex:1;font-size:13px;word-break:break-word}
.list-item .sub{font-size:10px;color:var(--c-dim);margin-top:2px}
.empty{text-align:center;padding:30px 10px;color:var(--c-dim);font-size:12px}
.centered{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;gap:12px;text-align:center}
.big-icon{font-size:48px;filter:drop-shadow(0 0 20px var(--accent1))}
.small{font-size:11px;color:var(--c-dim)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:12px;gap:8px}
.kv:last-child{border-bottom:none}
.kv .v{color:var(--accent1);font-weight:600;text-align:right;word-break:break-word;max-width:65%}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:6px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:4px;transition:width .3s}
.center{text-align:center}
h3{margin-bottom:12px;font-size:16px;color:var(--accent1)}
h4{font-size:13px;margin:12px 0 8px;color:var(--accent1)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.menu-tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--c-panel);border:1.5px solid var(--c-border);border-radius:12px;font-size:20px;padding:6px;transition:all .15s;cursor:pointer}
.menu-tile:hover{background:rgba(0,229,255,.15);box-shadow:0 0 20px rgba(0,229,255,.3)}
.menu-tile .lbl{font-size:9px;text-align:center;line-height:1.1;color:var(--c-dim);overflow:hidden;max-height:22px}
@keyframes navFly{0%{transform:translateY(20px) scale(.5);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateY(-380px) scale(1.2);opacity:0}}
@keyframes pulseWarn{0%,100%{box-shadow:0 0 20px rgba(255,68,102,.4)}50%{box-shadow:0 0 40px rgba(255,68,102,.9)}}
</style>
</head>
<body data-theme="normal">
<div id="cosmos"><div id="sun"></div></div>
<div id="topbar">
  <div class="brand"><span class="dot"></span><span>HalDo AI OS</span><span style="font-size:10px;color:var(--c-dim);font-weight:400">Pro Max v126</span></div>
  <div class="actions">
    <button class="tb-btn" id="themeBtn" title="Theme">🌗</button>
    <button class="tb-btn" id="appsBtn" title="Apps">📱</button>
  </div>
</div>
<aside id="sidebar"></aside>
<main id="desktop"></main>
<div id="bottombar">
  <button class="bb-btn" onclick="HalDo.apps.open('chat')">💬 Chat</button>
  <button class="bb-btn" onclick="HalDo.apps.open('avatar')">🤖 AI</button>
  <button class="bb-btn cyborg" onclick="HalDo.theme.toggle()">⚡ CYBORG</button>
</div>
<div id="toasts"></div>
<div id="avatar"><div class="halo"></div>
  <svg viewBox="0 0 100 100">
    <defs><radialGradient id="ag"><stop offset="0%" stop-color="var(--accent1)" stop-opacity=".4"/><stop offset="100%" stop-color="var(--accent2)" stop-opacity=".1"/></radialGradient></defs>
    <circle cx="50" cy="50" r="45" fill="url(#ag)" stroke="var(--accent1)" stroke-width="1.5" opacity=".8"/>
    <circle cx="35" cy="45" r="6" fill="var(--accent1)" class="eye"/>
    <circle cx="65" cy="45" r="6" fill="var(--accent1)" class="eye"/>
    <rect x="40" y="65" width="20" height="4" rx="2" fill="var(--accent1)" class="mouth"/>
  </svg>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   HALDO AI OS PRO MAX v126 – CORE
   ═══════════════════════════════════════════════════════ */
const HalDo = {apps:{},win:{},theme:{},store:{},util:{},avatar:{}};

HalDo.store.get = (k,d) => { try { const v = localStorage.getItem('haldo_'+k+'_v1'); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
HalDo.store.set = (k,v) => { try { localStorage.setItem('haldo_'+k+'_v1', JSON.stringify(v)); } catch(e){} };
HalDo.util.uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
HalDo.util.esc = (s) => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
HalDo.util.today = () => new Date().toISOString().slice(0,10);
HalDo.util.toast = (msg) => {
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2500);
};
HalDo.theme.set = (name) => {
  document.body.dataset.theme = name;
  document.getElementById('themeBtn').textContent = name==='cyborg'?'🌗':'⚡';
  document.getElementById('themeBtn').classList.toggle('active', name==='cyborg');
  HalDo.store.set('theme', name);
};
HalDo.theme.toggle = () => {
  const next = document.body.dataset.theme === 'cyborg' ? 'normal' : 'cyborg';
  HalDo.theme.set(next);
  HalDo.util.toast(next==='cyborg'?'⚡ CYBORG-MODUS AKTIV':'🌌 Normal-Modus');
};

let zTop = 250;
HalDo.win.open = (id, title, html, opts={}) => {
  const existing = document.getElementById('win-'+id);
  if (existing) { HalDo.win.focus(id); return existing; }
  const w = document.createElement('div');
  w.className='win'; w.id='win-'+id;
  const cnt = Object.keys(HalDo.win.open._c||{}).length;
  w.style.left = Math.max(10,(60 + (cnt*20) % 200)) + 'px';
  w.style.top = Math.max(10,(40 + (cnt*20) % 120)) + 'px';
  w.innerHTML = `<div class="win-head"><div class="title">${HalDo.util.esc(title)}</div><div class="win-ctrls"><button class="win-btn" data-act="min" title="Min">—</button><button class="win-btn close" data-act="close" title="Close">✕</button></div></div><div class="win-body">${html}</div><div class="win-resize"></div>`;
  document.getElementById('desktop').appendChild(w);
  const head = w.querySelector('.win-head');
  let dragX=0, dragY=0, drag=false;
  head.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-btn')) return;
    drag = true; HalDo.win.focus(id);
    dragX = e.clientX - w.offsetLeft; dragY = e.clientY - w.offsetTop;
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove', e => {
    if (!drag) return;
    w.style.left = Math.max(0, Math.min(window.innerWidth-100, e.clientX - dragX)) + 'px';
    w.style.top = Math.max(0, Math.min(window.innerHeight-100, e.clientY - dragY)) + 'px';
  });
  head.addEventListener('pointerup', () => drag=false);
  head.addEventListener('pointercancel', () => drag=false);
  const rz = w.querySelector('.win-resize');
  let rs=false, rw=0, rh=0, rx=0, ry=0;
  rz.addEventListener('pointerdown', e => { rs=true; rw=w.offsetWidth; rh=w.offsetHeight; rx=e.clientX; ry=e.clientY; rz.setPointerCapture(e.pointerId); e.stopPropagation(); });
  rz.addEventListener('pointermove', e => { if(!rs)return; w.style.width=Math.max(280,rw+(e.clientX-rx))+'px'; w.style.height=Math.max(200,rh+(e.clientY-ry))+'px'; });
  rz.addEventListener('pointerup', () => rs=false);
  w.querySelector('[data-act="close"]').onclick = () => { w.remove(); delete HalDo.win.open._c?.[id]; };
  w.querySelector('[data-act="min"]').onclick = () => w.classList.toggle('min');
  w.addEventListener('pointerdown', () => HalDo.win.focus(id));
  HalDo.win.focus(id);
  HalDo.win.open._c = HalDo.win.open._c || {}; HalDo.win.open._c[id] = 1;
  if (opts.onMount) setTimeout(()=>opts.onMount(w), 0);
  return w;
};
HalDo.win.focus = (id) => {
  document.querySelectorAll('.win').forEach(x=>x.classList.remove('active'));
  const w = document.getElementById('win-'+id); if(w){ w.style.zIndex = ++zTop; w.classList.add('active'); }
};
HalDo.win.close = (id) => { const w=document.getElementById('win-'+id); if(w)w.remove(); };

/* Registry 375 Apps */
const REGISTRY = {
  'A':['HalDo AI','Assistant','Chat','Voice AI','Translator AI','AI Writer','AI Image','AI Music','AI Code','AI Memory','AI Tutor','AI Journal','AI Coach','AI Health','AI Finance','AI Recipes','AI Travel'],
  'B':['Bildung','Mathe','Deutsch','Englisch','Geschichte','Biologie','Chemie','Physik','Erdkunde','Politik','Musik','Kunst','Sport','Informatik','Ethik','Religion','Philosophie','Psychologie','Soziologie','Wirtschaft','Recht','Medien','Umwelt','Astronomie','Geologie','Meteorologie','Archäologie','Anthropologie','Linguistik','Literatur','Poesie','Rhetorik','Logik','Statistik','Wahrscheinlichkeit','Algebra','Geometrie','Analysis','Trigonometrie','Stochastik'],

function initCosmos(){
  const c = document.getElementById('cosmos');
  for (let i=0; i<180; i++){
    const s = document.createElement('div');
    s.className='star';
    const size = Math.random()*2+1;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${Math.random()*3}s;opacity:${Math.random()*.7+.3}`;
    c.appendChild(s);
  }
  for (let i=0; i<3; i++){
    const s = document.createElement('div');
    s.className='shooting';
    s.style.cssText = `left:${60+Math.random()*40}%;top:${Math.random()*50}%;animation-delay:${i*2}s`;
    c.appendChild(s);
  }
  const planets = [
    {size:6,orbit:120,dur:20,color:'#b0b0b0'},{size:10,orbit:170,dur:30,color:'#ffb87a'},
    {size:12,orbit:230,dur:45,color:'#4da8ff'},{size:8,orbit:290,dur:60,color:'#ff6b3d'},
    {size:26,orbit:370,dur:100,color:'#e0a870'},{size:22,orbit:450,dur:140,color:'#ffd89a'},
    {size:16,orbit:530,dur:180,color:'#88ddff'},{size:16,orbit:610,dur:220,color:'#5a8fff'},
    {size:10,orbit:690,dur:260,color:'#a8e8ff'},{size:12,orbit:770,dur:320,color:'#7a9fff'},
    {size:10,orbit:850,dur:380,color:'#6a9fff'},{size:8,orbit:930,dur:440,color:'#5a8fff'}
  ];
  planets.forEach((p,i) => {
    const o = document.createElement('div');
    o.className='orbit'; o.style.width=p.orbit*2+'px'; o.style.height=p.orbit*2+'px';
    c.appendChild(o);
    const pl = document.createElement('div');
    pl.className='planet';
    pl.style.cssText = `width:${p.size}px;height:${p.size}px;background:radial-gradient(circle at 30% 30%,#fff,${p.color});animation-duration:${p.dur}s;animation-delay:-${i*p.dur/12}s;--orbit:${p.orbit}px;left:50%;top:50%;margin-left:${-p.size/2}px;margin-top:${-p.size/2}px;`;
    c.appendChild(pl);
  });
}

APPS.habits = () => {

    html:`<input class="inp" id="hN" placeholder="Neue Gewohnheit..."><button class="btn" id="hAdd">+ Hinzufügen</button><h4>Heute</h4><div>${list}</div>`,

/* 9 Calendar */
APPS.calendar = () => {
  const state = {m: new Date().getMonth(), y: new Date().getFullYear()};
  const render = () => {
    const first = new Date(state.y, state.m, 1);const last = new Date(state.y, state.m+1, 0);
    const startDay = (first.getDay()+6)%7;const events = HalDo.store.get('events', []);const today = HalDo.util.today();
    let cells = '';
    for(let i=0;i<startDay;i++) cells += '<div style="aspect-ratio:1"></div>';
    for(let d=1;d<=last.getDate();d++){
      const ds = `${state.y}-${String(state.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ev = events.filter(e=>e.date===ds);const isToday = ds===today;
      cells += `<div style="aspect-ratio:1;border:1px solid var(--c-border);border-radius:6px;padding:2px;font-size:10px;position:relative;${isToday?'background:rgba(0,229,255,.2)':''}"><div>${d}</div>${ev.length?`<div style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent1)"></div>`:''}</div>`;
    }
    return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="win-btn" data-prev>◀</button><b>${['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][state.m]} ${state.y}</b><button class="win-btn" data-next>▶</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:9px;color:var(--c-dim);margin-bottom:4px">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div>${x}</div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div><h4 style="margin-top:16px">Termin</h4><input class="inp" id="eT" placeholder="Titel..."><input class="inp" id="eD" type="date" value="${today}"><button class="btn" id="eAdd">+ Hinzufügen</button>`;
  };
  return {
    title:'📅 Kalender',
    html: render(),
    onMount:(w)=>{
      const rebind = () => {
        w.querySelector('[data-prev]').onclick=()=>{state.m--;if(state.m<0){state.m=11;state.y--;}w.querySelector('.win-body').innerHTML=render();rebind();};
        w.querySelector('[data-next]').onclick=()=>{state.m++;if(state.m>11){state.m=0;state.y++;}w.querySelector('.win-body').innerHTML=render();rebind();};
        w.querySelector('#eAdd').onclick=()=>{const t=w.querySelector('#eT').value.trim();if(!t)return;const a=HalDo.store.get('events',[]);a.push({id:HalDo.util.uid(),title:t,date:w.querySelector('#eD').value});HalDo.store.set('events',a);w.querySelector('.win-body').innerHTML=render();rebind();};
      };
      rebind();
    }
  };
};

APPS.breathing = () => {

  const phases=[{n:'Einatmen',t:4},{n:'Halten',t:4},{n:'Ausatmen',t:6},{n:'Halten',t:2}];
  return {
    title:'🌬 Atemübung',
    html:`<div class="centered"><div id="bCircle" style="width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.4),rgba(180,120,255,.2));transition:transform 4s ease-in-out"></div><div id="bPhase" style="font-size:24px;color:var(--accent1);margin-top:20px">Bereit</div><div id="bCount" class="small"></div><button class="btn" id="bStart" style="margin-top:16px">▶ Start</button></div>`,
    onMount:(w)=>{
      const c=w.querySelector('#bCircle'),p=w.querySelector('#bPhase'),co=w.querySelector('#bCount');
      const run=()=>{
        const ph=phases[phase];p.textContent=ph.n;
        c.style.transform=ph.n==='Einatmen'?'scale(1.6)':ph.n==='Ausatmen'?'scale(1)':'scale(1.3)';

      };
      w.querySelector('#bStart').onclick=()=>{phase=0;run();};
    }
  };
};

/* 21 Converter */
APPS.converter = () => {
  const cats={'Länge':{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.34,ft:0.3048,in:0.0254},'Gewicht':{g:1,kg:1000,mg:0.001,t:1e6,lb:453.592,oz:28.3495},'Temperatur':{c:1,f:1,k:1},'Volumen':{l:1,ml:0.001,m3:1000,gal:3.78541}};
  let cat='Länge';
  const units=()=>Object.keys(cats[cat]);
  const opts=()=>units().map(u=>`<option>${u}</option>`).join('');
  return {
    title:'📏 Umrechner',
    html:`<div class="tabs" id="cvTabs">${Object.keys(cats).map(c=>`<button class="tab ${c===cat?'active':''}" data-c="${c}">${c}</button>`).join('')}</div><input class="inp" id="cvVal" type="number" value="1"><div class="row"><select class="inp" id="cvFrom">${opts()}</select><span>→</span><select class="inp" id="cvTo">${opts()}</select></div><button class="btn" id="cvGo">Umrechnen</button><div id="cvOut" style="font-size:24px;text-align:center;color:var(--accent1);font-weight:700;margin-top:12px;min-height:32px"></div>`,
    onMount:(w)=>{
      w.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;w.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('active',x.dataset.c===cat));w.querySelector('#cvFrom').innerHTML=opts();w.querySelector('#cvTo').innerHTML=opts();});
      w.querySelector('#cvGo').onclick=()=>{
        const v=+w.querySelector('#cvVal').value;const f=w.querySelector('#cvFrom').value,t=w.querySelector('#cvTo').value;
        if(cat==='Temperatur'){let c=v;if(f==='f')c=(v-32)*5/9;if(f==='k')c=v-273.15;let r=c;if(t==='f')r=c*9/5+32;if(t==='k')r=c+273.15;w.querySelector('#cvOut').textContent=r.toFixed(2)+' '+t.toUpperCase();return;}
        const r=v*cats[cat][f]/cats[cat][t];w.querySelector('#cvOut').textContent=r.toFixed(4)+' '+t;
      };
    }
  };
};

APPS.flash = () => {

  };
  const items=HalDo.store.get('flash',[]);
  return {title:'🎴 Flashcards',html:`<div class="row"><input class="inp" id="fcQ" placeholder="Frage..."><input class="inp" id="fcA" placeholder="Antwort..."></div><button class="btn" id="fcAdd">+ Karte</button><div id="fcBody">${render(items)}</div>`,onMount:(w)=>{
    const rebind=()=>{
      const cur=HalDo.store.get('flash',[]);
      const p=w.querySelector('#fPrev');if(p)p.onclick=()=>{idx--;showAnswer=false;w.querySelector('#fcBody').innerHTML=render(cur);rebind();};
      const n=w.querySelector('#fNext');if(n)n.onclick=()=>{idx++;showAnswer=false;w.querySelector('#fcBody').innerHTML=render(cur);rebind();};

  }};
};

/* 37 Traffic/Blitzer */
APPS.traffic = () => {
  const dangers=['Achtung Blitzer!','Geschwindigkeitskontrolle!','Stau voraus!','Baustelle!','Unfallstelle!','Wildwechsel!','Glatteis möglich','Nebel! Sicht reduziert','Schulweg achten','Rettungsgasse bilden','LKW-Kolonne','Geisterfahrer!','Ölspur','Aquaplaning','Vollsperrung','Tunnel! Licht','Rückstau','Verkehrskontrolle','Fahrbahnschäden','Fahrzeugpanne'];
  const beep=(f,d)=>{try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}catch(e){}};
  const speak=(t)=>{if(!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=1.1;window.speechSynthesis.speak(u);}catch(e){}};
  const cx=100,cy=100,r=82,startDeg=135,toRad=d=>d*Math.PI/180,pt=(deg,rr)=>[cx+rr*Math.cos(toRad(deg)),cy+rr*Math.sin(toRad(deg))];
  let ticks='';
  for(let i=0;i<=26;i++){const ang=startDeg+(i/26)*270;const[x1,y1]=pt(ang,r);const[x2,y2]=pt(ang,r-6);ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i%5===0?'#fff':'rgba(255,255,255,.4)'}" stroke-width="${i%5===0?2:1}"/>`;}
  let lastIdx=-1;
  return {title:'🚦 Blitzer v2',html:`<div class="centered"><div style="position:relative;width:280px;height:280px"><svg viewBox="0 0 200 200" style="width:100%;height:100%"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/><defs><linearGradient id="agrad"><stop offset="0%" stop-color="#00e5ff"/><stop offset="50%" stop-color="#b478ff"/><stop offset="100%" stop-color="#ff4466"/></linearGradient></defs><path id="arcProg" fill="none" stroke="url(#agrad)" stroke-width="10" stroke-linecap="round"/>${ticks}<g id="needle" style="transform-origin:100px 100px;transition:transform .12s"><line x1="100" y1="100" x2="${pt(startDeg,r-10)[0]}" y2="${pt(startDeg,r-10)[1]}" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="100" r="8" fill="#fff" stroke="#00e5ff" stroke-width="2"/></g></svg><div style="position:absolute;top:62%;left:50%;transform:translate(-50%,0);text-align:center"><div id="spd" style="font-size:42px;font-weight:800;color:#fff;text-shadow:0 0 12px var(--accent1)">0</div><div class="small" style="font-size:9px">km/h</div></div></div><div style="display:flex;gap:10px;margin-top:12px;align-items:center"><div style="padding:6px 14px;background:#fff;color:#000;border-radius:50%;font-weight:900;font-size:18px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;border:5px solid #ff2244">120</div><div style="padding:8px 14px;background:#4da8ff;color:#fff;border-radius:10px;font-weight:700;font-size:12px">A7 → Frankfurt</div></div><input type="range" min="0" max="260" value="0" id="spdIn" style="width:100%;margin-top:12px"><div id="warnBox" style="margin-top:12px;padding:12px;background:rgba(0,229,255,.08);border-radius:10px;font-size:13px;min-height:48px;width:100%;text-align:center;border-left:4px solid var(--accent1);transition:all .2s">Geschwindigkeit anpassen</div><div class="small" style="margin-top:8px;font-size:10px">🔊 KI-Sprachansage ab 100 km/h</div></div>`,onMount:(w)=>{
    const upd=()=>{const v=+w.querySelector('#spdIn').value;w.querySelector('#spd').textContent=v;const sweep=(v/260)*270;const endDeg=startDeg+sweep;const[sx,sy]=pt(startDeg,r);const[ex,ey]=pt(endDeg,r);const large=sweep>180?1:0;w.querySelector('#arcProg').setAttribute('d',`M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}`);w.querySelector('#needle').style.transform=`rotate(${sweep}deg)`;const wb=w.querySelector('#warnBox');let msg='✓ OK',col='#4dff88';if(v>130){msg=`⚠️ ZU SCHNELL! +${v-130}`;col='#ff4466';}else if(v>120){msg=`⚡ +${v-120} über Richtgeschw.`;col='#ffcc00';}else if(v>50){msg='✓ Autobahn-Tempo';col='#4da8ff';}const di=Math.floor(v/20);if(v>=100&&di!==lastIdx){lastIdx=di;const d=dangers[Math.floor(Math.random()*dangers.length)];msg='🚨 '+d;col='#ff4466';beep(880,.15);setTimeout(()=>beep(660,.15),180);speak(d);wb.style.animation='pulseWarn .6s 2';setTimeout(()=>wb.style.animation='',1200);}else if(v<100)lastIdx=-1;wb.textContent=msg;wb.style.color=col;wb.style.borderLeftColor=col;};
    w.querySelector('#spdIn').oninput=upd;upd();
  }};
};

APPS.statistics = () => ({title:'📊 Statistik',html:`<textarea class="inp ta" id="sIn" placeholder="Zahlen (Komma/Zeile)"></textarea><button class="btn" id="sGo">Berechnen</button><div id="sOut" style="margin-top:12px"></div>`,onMount:(w)=>{w.querySelector('#sGo').onclick=()=>{const nums=w.querySelector('#sIn').value.split(/[,\s\n]+/).map(Number).filter(n=>!isNaN(n));if(!nums.length)return w.querySelector('#sOut').innerHTML='<div class="empty">Keine Zahlen</div>';const sum=nums.reduce((a,b)=>a+b,0),mean=sum/nums.length;const sorted=[...nums].sort((a,b)=>a-b);const median=sorted.length%2?sorted[(sorted.length-1)/2]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2;const min=Math.min(...nums),max=Math.max(...nums);const variance=nums.reduce((a,b)=>a+(b-mean)**2,0)/nums.length;w.querySelector('#sOut').innerHTML=`<div class="kv"><span>Anzahl</span><span class="v">${nums.length}</span></div><div class="kv"><span>Summe</span><span class="v">${sum.toFixed(2)}</span></div><div class="kv"><span>Mittel</span><span class="v">${mean.toFixed(2)}</span></div><div class="kv"><span>Median</span><span class="v">${median.toFixed(2)}</span></div><div class="kv"><span>Min</span><span class="v">${min}</span></div><div class="kv"><span>Max</span><span class="v">${max}</span></div><div class="kv"><span>Std</span><span class="v">${Math.sqrt(variance).toFixed(2)}</span></div>`;};}});

APPS.scicalc = () => ({title:'🔬 Sci-Calc',html:`<input class="inp" id="scIn" placeholder="sin(45) + sqrt(16)" style="font-size:18px"><div id="scOut" style="font-size:24px;text-align:right;color:var(--accent1);font-weight:700;margin:12px 0;min-height:32px"></div>`,onMount:(w)=>{const inp=w.querySelector('#scIn'),out=w.querySelector('#scOut');inp.oninput=()=>{try{let e=inp.value.replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sqrt\(/g,'Math.sqrt(').replace(/π/g,'Math.PI').replace(/\^/g,'**');const r=Function('"use strict";return ('+e+')')();out.textContent=Number.isFinite(r)?('= '+r):'';}catch(err){out.textContent='';}};}});

APPS.textanalyzer = () => ({title:'📊 Text Analyzer',html:`<textarea class="inp ta" id="taIn" placeholder="Text..." style="min-height:120px"></textarea><button class="btn" id="taGo">Analysieren</button><div id="taOut" style="margin-top:12px"></div>`,onMount:(w)=>{w.querySelector('#taGo').onclick=()=>{const t=w.querySelector('#taIn').value;const chars=t.length;const words=t.trim()?t.trim().split(/\s+/).length:0;const sents=(t.match(/[.!?]+/g)||[]).length;const lines=t.split('\n').length;w.querySelector('#taOut').innerHTML=`<div class="kv"><span>Zeichen</span><span class="v">${chars}</span></div><div class="kv"><span>Wörter</span><span class="v">${words}</span></div><div class="kv"><span>Sätze</span><span class="v">${sents}</span></div><div class="kv"><span>Zeilen</span><span class="v">${lines}</span></div><div class="kv"><span>Lesezeit</span><span class="v">${Math.ceil(words/200)} min</span></div>`;};}});

APPS.datecalc = () => ({title:'📅 Datum Rechner',html:`<h4>Alter</h4><input class="inp" id="dAge" type="date"><button class="btn" id="dAgeGo">Berechnen</button><div id="dAgeOut" style="margin-bottom:16px"></div><h4>Tage bis</h4><input class="inp" id="dUntil" type="date"><button class="btn" id="dUntilGo">Berechnen</button><div id="dUntilOut"></div>`,onMount:(w)=>{w.querySelector('#dAgeGo').onclick=()=>{const b=new Date(w.querySelector('#dAge').value);if(isNaN(b))return HalDo.util.toast('Datum fehlt');const n=new Date();let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=30;}if(m<0){y--;m+=12;}w.querySelector('#dAgeOut').innerHTML=`<div class="card center"><div style="font-size:24px;color:var(--accent1);font-weight:700">${y}J ${m}M ${d}T</div></div>`;};w.querySelector('#dUntilGo').onclick=()=>{const t=new Date(w.querySelector('#dUntil').value);if(isNaN(t))return HalDo.util.toast('Datum fehlt');const diff=Math.ceil((t-new Date())/(1000*60*60*24));w.querySelector('#dUntilOut').innerHTML=`<div class="card center"><div style="font-size:24px;color:var(--accent1);font-weight:700">${diff} Tage</div></div>`;};}});

APPS.clipboard = () => ({title:'📋 Clipboard',html:`<textarea class="inp ta" id="cbIn" placeholder="Text..."></textarea><button class="btn" id="cbAdd">+ Speichern</button><div>${(HalDo.store.get('clipboard',[])).map(c=>`<div class="card"><div style="font-size:12px;white-space:pre-wrap">${HalDo.util.esc(c.text)}</div><div class="row" style="margin-top:6px"><button class="btn ghost" data-cp="${c.id}">📋</button><button class="win-btn" data-del="${c.id}">🗑</button></div></div>`).join('')||'<div class="empty">Leer</div>'}</div>`,onMount:(w)=>{w.querySelector('#cbAdd').onclick=()=>{const t=w.querySelector('#cbIn').value;if(!t)return;const a=HalDo.store.get('clipboard',[]);a.unshift({id:HalDo.util.uid(),text:t});HalDo.store.set('clipboard',a);REOPEN(w,'clipboard');};w.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{HalDo.store.set('clipboard',HalDo.store.get('clipboard',[]).filter(x=>x.id!==b.dataset.del));REOPEN(w,'clipboard');});w.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const i=HalDo.store.get('clipboard',[]).find(x=>x.id===b.dataset.cp);if(i&&navigator.clipboard)navigator.clipboard.writeText(i.text).then(()=>HalDo.util.toast('📋 Kopiert'));});}});

APPS.health = () => ({title:'❤️ Health',html:`<input class="inp" id="hWeight" type="number" placeholder="Gewicht kg"><input class="inp" id="hHeight" type="number" placeholder="Größe cm"><input class="inp" id="hAge" type="number" placeholder="Alter"><div class="row" style="margin-bottom:8px"><label><input type="radio" name="hSex" value="m" checked> M</label><label><input type="radio" name="hSex" value="f"> F</label></div><button class="btn" id="hGo">Berechnen</button><div id="hOut" style="margin-top:12px"></div>`,onMount:(w)=>{w.querySelector('#hGo').onclick=()=>{const wt=+w.querySelector('#hWeight').value,ht=+w.querySelector('#hHeight').value/100,ag=+w.querySelector('#hAge').value;const sx=w.querySelector('input[name=hSex]:checked').value;if(!wt||!ht||!ag)return HalDo.util.toast('Alle Felder!');const bmi=wt/(ht*ht);const bmr=sx==='m'?88.36+(13.4*wt)+(4.8*ht*100)-(5.7*ag):447.6+(9.2*wt)+(3.1*ht*100)-(4.3*ag);const cat=bmi<18.5?'Untergewicht':bmi<25?'Normal':bmi<30?'Übergewicht':'Adipositas';w.querySelector('#hOut').innerHTML=`<div class="kv"><span>BMI</span><span class="v">${bmi.toFixed(1)} (${cat})</span></div><div class="kv"><span>Grundumsatz</span><span class="v">${Math.round(bmr)} kcal</span></div><div class="kv"><span>Gesamt</span><span class="v">${Math.round(bmr*1.55)} kcal</span></div>`;};}});

APPS.workout = () => {let t=0,int=null;return {title:'💪 Workout',html:`<div class="centered"><div id="wTime" style="font-size:48px;font-weight:700;color:var(--accent1)">00:00</div><div class="small">Trainingszeit</div><div class="row" style="margin-top:12px"><button class="btn" id="wStart">▶</button><button class="btn ghost" id="wStop">⏸</button><button class="btn ghost" id="wReset">↺</button></div></div><h4 style="margin-top:16px">Übungen</h4><div class="grid">${['Liegestütze','Kniebeugen','Situps','Burpees','Plank','Hampelmänner'].map(n=>`<div class="card center" style="cursor:pointer" data-e="${n}"><div style="font-size:20px;font-weight:700;color:var(--accent1)" class="c">0</div><div class="small">${n}</div></div>`).join('')}</div>`,onMount:(w)=>{const d=w.querySelector('#wTime');const upd=()=>{const m=Math.floor(t/60),s=t%60;d.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');};w.querySelector('#wStart').onclick=()=>{clearInterval(int);int=setInterval(()=>{t++;upd();},1000);};w.querySelector('#wStop').onclick=()=>clearInterval(int);w.querySelector('#wReset').onclick=()=>{clearInterval(int);t=0;upd();};w.querySelectorAll('[data-e]').forEach(c=>c.onclick=()=>{const n=c.querySelector('.c');n.textContent=(+n.textContent)+1;});}};};

   ═══════════════════════════════════════════════════════ */
HalDo.apps.open = (id) => {
  const f = APPS[id];
  if (!f) return HalDo.util.toast('❌ App: '+id+' nicht gefunden');
  const app = f();
  HalDo.win.open(id, app.title, app.html, {onMount:app.onMount});
};

Object.keys(APPS).forEach(k => { HalDo[k] = { open: () => HalDo.apps.open(k) }; });
