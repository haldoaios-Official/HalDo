<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HalDo Arztbuch - 3D Anatomie Pro Max</title>
<style>
/* ============================================================
   BASIS & THEME
============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070b12; --bg2:#0d1420;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);
  --accent:#00d4ff; --accent-2:#00ffa3;
  --danger:#ff4d6d; --warn:#ffb703;
  --text:#e8f1ff; --muted:#7e91ab;
  --r:16px;
}
html,body{height:100%;}
body{
  background: #000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:260px 1fr;position:relative;z-index:1;opacity:0;transition:opacity 0.5s;}
#app.ready{opacity:1;}
#sidebar{background:rgba(10,16,26,.72);backdrop-filter:blur(22px);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;z-index:50;}
.brand-logo{font-size:24px;font-weight:800;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:#c3d1e6;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:all .18s ease;}
.nav-item:hover{background:var(--glass);color:#fff;}
.nav-item.active{background:linear-gradient(90deg,rgba(0,212,255,.18),rgba(0,255,163,.06));border-color:rgba(0,212,255,.3);color:#fff;box-shadow:0 0 20px rgba(0,212,255,.12);}
.nav-item .ico{font-size:16px;width:20px;text-align:center;}
#main{position:relative;overflow:hidden;padding:22px 26px;display:flex;flex-direction:column;height:100vh;height:100dvh;}
.view{display:none;flex:1;min-height:0;overflow-y:auto;padding-right:4px;}
.view.active{display:block;}
.view.active.col{display:flex;flex-direction:column;overflow:hidden;}
.anatomy-wrap{display:flex;flex-direction:column;flex:1;min-height:0;gap:14px;}
.anatomy-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center; position:relative; z-index:10;}
.layer-btn{padding:8px 16px;border-radius:11px;border:1px solid var(--border);background:var(--glass);color:#c3d1e6;font-size:12.5px;font-weight:600;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px;}
.layer-btn:hover{background:var(--glass-2);color:#fff;}
.layer-btn.active{background:linear-gradient(90deg,rgba(0,212,255,.22),rgba(0,255,163,.08));border-color:var(--accent);color:#fff;box-shadow:0 0 18px rgba(0,212,255,.2);}
.spacer{flex:1;}
#anatomy-canvas{flex:1;min-height:320px;border-radius:var(--r);border:1px solid var(--border);background:transparent;overflow:hidden;position:relative;}
#anatomy-canvas canvas{display:block;width:100%!important;height:100%!important;}
.anatomy-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);background:rgba(0,0,0,.5);padding:6px 14px;border-radius:99px;border:1px solid var(--border);white-space:nowrap;pointer-events:none;}

#bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

/* Responsive */
@media (max-width:860px){
  #app{grid-template-columns:1fr;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:255px;transform:translateX(-100%);}
  #sidebar.open{transform:none;}
  #main{padding:66px 16px 16px;}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div>
        <div class="brand-logo">HalDo</div>
        <div class="brand-sub">Arztbuch Pro Max</div>
      </div>
    </div>
    <div class="nav-section">Übersicht</div>
    <button class="nav-item active" data-view="anatomie"><span class="ico">🧍</span> Anatomie 3D</button>
  </aside>
  <main id="main">
    <section id="view-anatomie" class="view active col">
      <div class="view-head">
        <h1>Anatomie 3D Pro Max</h1>
        <p class="sub">Prozedural · Fotorealistisch · 4 Ebenen</p>
      </div>
      <div class="anatomy-wrap">
        <div class="anatomy-toolbar">
          <button class="layer-btn" data-layer="haut">🫥 Haut</button>
          <button class="layer-btn" data-layer="muskeln">💪 Muskeln</button>
          <button class="layer-btn" data-layer="skelett">🦴 Skelett</button>
          <button class="layer-btn active" data-layer="organe">🫀 Organe</button>
          <div class="spacer"></div>
          <button class="layer-btn" id="resetCam">🔄 Kamera</button>
        </div>
        <div id="anatomy-canvas">
          <div class="anatomy-hint">Ziehen = Drehen · Scrollen = Zoom · Organ anklicken</div>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. WELTRAUM HINTERGRUND (Sonne, Mond, Sterne, Erde)
============================================================ */
function initBackground() {
  const canvas = document.getElementById('bg-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020205); // Tiefes Weltraum-Schwarz
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.z = 10;

  // --- STERNE ---
  const starGeometry = new THREE.BufferGeometry();
  const starCount = 8000;
  const starPositions = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i += 3) {
    starPositions[i] = (Math.random() - 0.5) * 2000;
    starPositions[i+1] = (Math.random() - 0.5) * 2000;
    starPositions[i+2] = (Math.random() - 0.5) * 2000;
  }
  starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
  const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.9 });
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);

  // --- SONNE (mit Glut-Effekt) ---
  const sunGeo = new THREE.SphereGeometry(3, 64, 64);
  const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd55 });
  const sun = new THREE.Mesh(sunGeo, sunMat);
  sun.position.set(30, 20, -40);
  scene.add(sun);

  // Sonnen-Corona (Sprite)
  const canvasSun = document.createElement('canvas');
  canvasSun.width = 256; canvasSun.height = 256;
  const ctx = canvasSun.getContext('2d');
  const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0, 'rgba(255, 240, 180, 1)');
  gradient.addColorStop(0.2, 'rgba(255, 200, 50, 0.8)');
  gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.3)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);
  const sunSpriteMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvasSun), blending: THREE.AdditiveBlending });
  const sunSprite = new THREE.Sprite(sunSpriteMat);
  sunSprite.scale.set(30, 30, 1);
  sunSprite.position.copy(sun.position);
  scene.add(sunSprite);

  // --- ERDE (Mittig) ---
  const earthGeo = new THREE.SphereGeometry(5, 64, 64);
  const textureLoader = new THREE.TextureLoader();
  const earthMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
  const earthMat = new THREE.MeshStandardMaterial({ map: earthMap, roughness: 0.8, metalness: 0.1 });
  const earth = new THREE.Mesh(earthGeo, earthMat);
  earth.position.set(15, -10, -20);
  scene.add(earth);

  // --- MOND ---
  const moonGeo = new THREE.SphereGeometry(1.5, 32, 32);
  const moonMap = textureLoader.load('https://unpkg.com/three-globe/example/img/moon-map.jpg');
  const moonMat = new THREE.MeshStandardMaterial({ map: moonMap, roughness: 1.0 });
  const moon = new THREE.Mesh(moonGeo, moonMat);
  moon.position.set(22, -7, -18);
  scene.add(moon);

  // Lichter im Weltraum
  const sunLight = new THREE.PointLight(0xffccaa, 2000, 1000);
  sunLight.position.copy(sun.position);
  scene.add(sunLight);
  scene.add(new THREE.AmbientLight(0x111122, 1));

  const clock = new THREE.Clock();
  function animateBg() {
    requestAnimationFrame(animateBg);
    const delta = clock.getDelta();
    earth.rotation.y += delta * 0.02;
    moon.rotation.y += delta * 0.01;
    moon.position.x = 22 + Math.sin(clock.elapsedTime * 0.2) * 2; // Leichtes Kreisen
    stars.rotation.y += delta * 0.001;
    renderer.render(scene, camera);
  }
  animateBg();

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
}
initBackground();

/* ============================================================
   2. FOTOREALISTISCHE ANATOMIE (Prozedural Pro Max)
============================================================ */
let scene, camera, renderer, controls;
let bodyGroup, currentLayer = 'organe';
const layers = {};
let organMeshes = [];

function initAnatomy() {
  const host = document.getElementById('anatomy-canvas');
  const w = host.clientWidth, h = host.clientHeight;

  scene = new THREE.Scene();
  scene.background = null; 

  camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
  camera.position.set(0, 1.15, 3.1);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  host.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.0, 0);
  controls.enableDamping = true;
  controls.minDistance = 1.0;
  controls.maxDistance = 5.5;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;

  // --- BELEUCHTUNG FÜR SSS (Subsurface Scattering) ---
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const keyLight = new THREE.DirectionalLight(0xffeedd, 2.0); 
  keyLight.position.set(2, 3, 4); 
  scene.add(keyLight);
  
  const rimLight = new THREE.DirectionalLight(0x00d4ff, 1.5); 
  rimLight.position.set(-3, 1, -2); 
  scene.add(rimLight);

  // --- MATERIALIEN ---
  // Haut: MeshPhysicalMaterial mit Transmission (SSS-Effekt)
  const skinMat = new THREE.MeshPhysicalMaterial({
    color: 0xffdbba, 
    roughness: 0.4, 
    metalness: 0.0,
    clearcoat: 0.2, 
    clearcoatRoughness: 0.3,
    transmission: 0.4, // Lässt Licht durch die Haut
    thickness: 1.0, 
    ior: 1.4
  });
  
  const muscleMat = new THREE.MeshStandardMaterial({ color: 0xb32b2b, roughness: 0.6 });
  const boneMat = new THREE.MeshStandardMaterial({ color: 0xf4f0e6, roughness: 0.5 });

  // --- DER KÖRPER (Detailliert) ---
  bodyGroup = new THREE.Group();
  scene.add(bodyGroup);
  
  layers.haut = new THREE.Group();
  layers.muskeln = new THREE.Group();
  layers.skelett = new THREE.Group();
  layers.organe = new THREE.Group();
  bodyGroup.add(layers.haut, layers.muskeln, layers.skelett, layers.organe);

  // Helper für einfache Erstellung
  const add = (group, geo, mat, pos, scl) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(pos[0], pos[1], pos[2]);
    if(scl) m.scale.set(scl[0], scl[1], scl[2]);
    group.add(m); return m;
  };

  // --- HAUT EBENE (Glatte Formen) ---
  // Kopf (mit Gesichtsansatz)
  add(layers.haut, new THREE.SphereGeometry(0.12, 32, 32), skinMat, [0, 1.7, 0], [1, 1.15, 0.95]);
  // Nacken
  add(layers.haut, new THREE.CylinderGeometry(0.05, 0.06, 0.15, 32), skinMat, [0, 1.55, 0]);
  
  // Torso (Schultern, Brust, Taille) - Nutze LatheGeometry für Kurven
  const torsoPoints = [];
  torsoPoints.push(new THREE.Vector2(0.1, 0.8));   // Hüfte
  torsoPoints.push(new THREE.Vector2(0.18, 1.0));  // Taille
  torsoPoints.push(new THREE.Vector2(0.22, 1.25)); // Brust
  torsoPoints.push(new THREE.Vector2(0.18, 1.45)); // Schultern
  const torsoGeo = new THREE.LatheGeometry(torsoPoints, 32);
  add(layers.haut, torsoGeo, skinMat, [0, 0, 0], [1.2, 1, 0.7]); // Skaliert für flacheren Torso

  // Arme
  for (const s of [1, -1]) {
    add(layers.haut, new THREE.SphereGeometry(0.08, 32, 32), skinMat, [s*0.26, 1.4, 0], [1, 1.2, 1]); // Schulter
    add(layers.haut, new THREE.CapsuleGeometry(0.06, 0.28, 16, 32), skinMat, [s*0.3, 1.1, 0]); // Bizeps
    add(layers.haut, new THREE.CapsuleGeometry(0.05, 0.25, 16, 32), skinMat, [s*0.32, 0.75, 0]); // Unterarm
    add(layers.haut, new THREE.BoxGeometry(0.06, 0.1, 0.03), skinMat, [s*0.33, 0.55, 0.02]); // Hand
  }

  // Beine
  for (const s of [1, -1]) {
    add(layers.haut, new THREE.CapsuleGeometry(0.09, 0.35, 16, 32), skinMat, [s*0.11, 0.6, 0]); // Oberschenkel
    add(layers.haut, new THREE.CapsuleGeometry(0.07, 0.35, 16, 32), skinMat, [s*0.11, 0.2, 0]); // Unterschenkel
    add(layers.haut, new THREE.BoxGeometry(0.1, 0.08, 0.25), skinMat, [s*0.11, 0.0, 0.06]); // Fuß
  }

  // --- MUSKELN EBENE ---
  for (const s of [1, -1]) {
    // Brust
    add(layers.muskeln, new THREE.SphereGeometry(0.11, 32, 32), muscleMat, [s*0.1, 1.3, 0.08], [1.2, 0.8, 0.6]);
    // Bauch (6-Pack)
    for (let i = 0; i < 3; i++) {
      add(layers.muskeln, new THREE.BoxGeometry(0.08, 0.08, 0.08), muscleMat, [s*0.045, 1.15 - i*0.1, 0.1]);
    }
    // Bizeps
    add(layers.muskeln, new THREE.SphereGeometry(0.065, 32, 32), muscleMat, [s*0.3, 1.1, 0.02], [1, 1.6, 1]);
    // Oberschenkel
    add(layers.muskeln, new THREE.CapsuleGeometry(0.09, 0.3, 16, 32), muscleMat, [s*0.11, 0.6, 0.01]);
  }

  // --- SKELETT EBENE ---
  add(layers.skelett, new THREE.SphereGeometry(0.09, 32, 32), boneMat, [0, 1.7, 0]); // Schädel
  add(layers.skelett, new THREE.CylinderGeometry(0.03, 0.03, 0.7, 16), boneMat, [0, 1.1, -0.02]); // Wirbelsäule
  
  for (let i = 0; i < 6; i++) { // Rippen
    const rib = new THREE.Mesh(new THREE.TorusGeometry(0.16 - i*0.015, 0.012, 16, 32), boneMat);
    rib.position.set(0, 1.35 - i*0.08, 0);
    rib.rotation.x = Math.PI / 2;
    rib.scale.set(1, 0.7, 1);
    layers.skelett.add(rib);
  }

  // --- ORGANE EBENE ---
  const addOrgan = (geo, pos, color, key, scl) => {
    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, emissive: color, emissiveIntensity: 0.2 });
    const m = add(layers.organe, geo, mat, pos, scl);
    m.userData.organ = key;
    organMeshes.push(m);
  };

  addOrgan(new THREE.SphereGeometry(0.07, 32, 32), [0, 1.7, 0], '#f2a0c0', 'brain'); // Gehirn
  addOrgan(new THREE.SphereGeometry(0.06, 32, 32), [-0.03, 1.3, 0.03], '#e63946', 'heart', [1, 1.3, 1]); // Herz
  addOrgan(new THREE.SphereGeometry(0.08, 32, 32), [0.08, 1.32, 0], '#f4a6b8', 'lunge', [0.8, 1.5, 0.8]); // Lunge R
  addOrgan(new THREE.SphereGeometry(0.08, 32, 32), [-0.08, 1.32, 0], '#f4a6b8', 'lunge', [0.8, 1.5, 0.8]); // Lunge L
  addOrgan(new THREE.SphereGeometry(0.09, 32, 32), [0.07, 1.1, 0.03], '#8b2e2e', 'liver', [1.2, 0.7, 0.9]); // Leber

  // Initiale Ebene setzen
  setLayer(currentLayer);

  // Raycaster für Klicks
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', (e) => {
    if (!layers.organe.visible) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(organMeshes, false);
    if (hits.length) {
      alert("Organ angeklickt: " + hits[0].object.userData.organ);
      // Hier später Modal öffnen
    }
  });

  const ro = new ResizeObserver(() => {
    const w = host.clientWidth, h = host.clientHeight;
    if(!w || !h) return;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  ro.observe(host);

  animate();
}

function setLayer(name) {
  currentLayer = name;
  for (const k in layers) if(layers[k]) layers[k].visible = (k === name);
  document.querySelectorAll('.layer-btn[data-layer]').forEach(b => b.classList.toggle('active', b.dataset.layer === name));
}

document.querySelectorAll('.layer-btn[data-layer]').forEach(b => b.addEventListener('click', () => setLayer(b.dataset.layer)));

document.getElementById('resetCam').addEventListener('click', () => {
  camera.position.set(0, 1.15, 3.1);
  controls.target.set(0, 1.0, 0);
  controls.update();
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// Start
setTimeout(() => {
  document.getElementById('app').classList.add('ready');
  initAnatomy();
}, 500);
</script>
</body>
</html>
