<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HalDo AI OS Pro Max v2.0</title>
<style>
:root{
  --bg:#0a0e1a;--bg2:rgba(17,24,39,.85);--bg3:#1f2937;--border:#374151;
  --text:#f3f4f6;--dim:#9ca3af;--accent:#06b6d4;--accent2:#3b82f6;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --radius:12px;--font:'Segoe UI',system-ui,sans-serif;--font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;user-select:none;font-family:var(--font);color:var(--text);font-size:var(--font-size);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;width:100%;outline:none;font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
#cosmos-canvas{position:fixed;inset:0;z-index:0;pointer-events:auto;width:100%;height:100%;display:block;}

/* Welcome */
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;gap:20px;padding:40px;text-align:center;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);transition:opacity .5s;}
#welcome.hide{opacity:0;pointer-events:none;}
#welcome .logo-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 0 30px rgba(6,182,212,.9));animation:floatLogo 3s ease-in-out infinite;}
@keyframes floatLogo{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
#welcome h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#fffbeb,#fde047,#f59e0b,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(251,191,36,.8);}
#welcome h2{font-size:clamp(14px,2vw,20px);color:#e5e7eb;font-weight:400;line-height:1.6;}
#welcome .presented{font-size:12px;color:#9ca3af;letter-spacing:3px;text-transform:uppercase;}
#welcome .presented b{color:#fbbf24;}
#welcome .enter-btn{margin-top:20px;padding:16px 48px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:30px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 0 40px rgba(6,182,212,.6);transition:transform .2s;color:#fff;}
#welcome .enter-btn:hover{transform:scale(1.05);}

/* Taskbar */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:54px;background:rgba(17,24,39,.95);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:none;align-items:center;padding:0 12px;gap:10px;z-index:9997;padding-bottom:env(safe-area-inset-bottom);}
#taskbar.show{display:flex;}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:10px 20px;border-radius:10px;font-weight:bold;display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;box-shadow:0 0 15px rgba(6,182,212,.4);}
.start-btn:hover{filter:brightness(1.15);}
.taskbar-apps{flex:1;display:flex;gap:8px;overflow-x:auto;}
.taskbar-app{background:rgba(55,65,81,.5);padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid transparent;white-space:nowrap;}
.taskbar-app:hover{border-color:var(--accent);background:rgba(31,41,55,.8);}
#sys-clock{color:var(--dim);font-size:13px;font-weight:600;}

/* Start Menu */
#start-menu{position:fixed;bottom:64px;left:10px;width:min(720px,calc(100vw - 20px));max-height:82vh;background:rgba(17,24,39,.98);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:none;flex-direction:column;overflow:hidden;z-index:9998;box-shadow:0 -10px 40px rgba(0,0,0,.8);}
#start-menu.show{display:flex;}
.sm-drag-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--accent);cursor:move;background:rgba(0,0,0,.2);}
.sm-tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);}
.sm-tab{flex:1;padding:10px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;}
.sm-tab.active{color:var(--accent);background:rgba(6,182,212,.15);border-bottom:2px solid var(--accent);}
.sm-panel{flex:1;overflow-y:auto;padding:12px;display:none;min-height:0;}
.sm-panel.active{display:block;}
.sm-search{padding:8px 10px 10px;}
.sm-search input{background:rgba(0,0,0,.3);border:1px solid var(--border);padding:8px 12px;border-radius:6px;}
.sm-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
.sm-app-card{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent;background:rgba(55,65,81,.2);}
.sm-app-card:hover{background:rgba(55,65,81,.6);border-color:var(--accent);transform:translateY(-2px);}
.sm-app-card .ico{font-size:24px;margin-bottom:6px;pointer-events:none;}
.sm-app-card .nm{font-size:10px;text-align:center;line-height:1.2;pointer-events:none;}

/* Settings */
.settings-layout{display:flex;height:100%;min-height:450px;max-height:70vh;}
.settings-nav{width:200px;flex:none;padding:8px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;overflow-y:auto;background:rgba(0,0,0,.3);}
.settings-nav-item{text-align:left;padding:9px 10px;font-size:12px;border-radius:6px;color:#a0c8e0;background:transparent;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.settings-nav-item:hover{background:rgba(55,65,81,.5);color:#fff;}
.settings-nav-item.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.settings-content{flex:1;padding:16px;overflow-y:auto;min-width:0;}
.settings-content h3{color:var(--accent);font-size:15px;margin-bottom:12px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(55,65,81,.5);gap:12px;}
.settings-row:last-child{border:none;}
.settings-row .lbl{font-size:13px;font-weight:600;}
.settings-row .sub{font-size:11px;color:var(--dim);margin-top:2px;}
.settings-row .ctrl{flex-shrink:0;min-width:160px;max-width:240px;}
.settings-row .ctrl button{padding:6px 14px;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;font-weight:600;}
.toggle{position:relative;width:44px;height:24px;background:rgba(55,65,81,.8);border-radius:12px;cursor:pointer;transition:background .2s;display:inline-block;}
.toggle.on{background:var(--accent);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;}
.toggle.on::after{transform:translateX(20px);}

/* Windows */
.window{position:fixed;background:rgba(10,14,26,.96);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:0 20px 50px rgba(0,0,0,.7);min-width:340px;min-height:280px;}
.window.minimized{display:none;}
.window-header{padding:12px 16px;background:rgba(0,0,0,0.5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;}
.window-title{font-weight:600;color:var(--accent);display:flex;align-items:center;gap:10px;font-size:13px;}
.window-controls{display:flex;gap:6px;}
.win-btn{width:32px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);font-size:14px;}
.win-btn:hover{background:rgba(255,255,255,.2);}
.win-btn.close:hover{background:var(--danger);}
.window-body{flex:1;overflow:hidden;display:flex;}

/* Splash */
#app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 50% 50%,rgba(6,182,212,.2) 0%,rgba(5,8,16,.98) 75%);backdrop-filter:blur(10px);}
#app-splash.show{display:flex;animation:splashIn .3s;}
.splash-icon{font-size:110px;filter:drop-shadow(0 0 40px #06b6d4);animation:starGlow 1.2s ease-out;}
.splash-name{font-size:32px;font-weight:800;background:linear-gradient(90deg,#fde047,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;}
.splash-presented{font-size:12px;color:var(--dim);letter-spacing:4px;text-transform:uppercase;}
.splash-presented b{color:#fbbf24;}
@keyframes splashIn{from{opacity:0;}to{opacity:1;}}
@keyframes starGlow{0%{transform:scale(0) rotate(0deg);}50%{transform:scale(1.2) rotate(180deg);}100%{transform:scale(1) rotate(360deg);}}

/* App UI */
.app-sidebar{width:180px;flex:none;padding:10px 8px;background:rgba(0,10,20,.6);border-right:1px solid rgba(55,65,81,.5);display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.side-btn{text-align:left;padding:9px 12px;font-size:12px;background:transparent;border:1px solid transparent;color:#a0c8e0;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-btn:hover{background:rgba(55,65,81,.5);color:#fff;}
.side-btn.active{background:rgba(6,182,212,.2);border-color:var(--accent);color:#fff;}
.side-btn.speak-btn{margin-top:auto;color:var(--accent);}
.app-content{flex:1;padding:18px;overflow-y:auto;min-width:0;}
.app-content h3{margin-bottom:12px;color:var(--accent);font-size:16px;}
.app-content input,.app-content select,.app-content textarea{margin-bottom:8px;}
.app-content button{padding:9px 16px;margin:4px 4px 4px 0;background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:8px;font-size:12px;font-weight:600;}
.app-content button:hover{background:var(--accent2);}
.app-content button.danger{background:var(--danger);border-color:var(--danger);}
.app-content button.ghost{background:transparent;color:var(--text);border-color:var(--border);}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(55,65,81,.3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:6px;}
.list-row:hover{background:rgba(55,65,81,.6);border-color:var(--accent);}
.list-row .meta{color:var(--dim);font-size:11px;margin-left:auto;}
.muted{color:var(--dim);}
.qt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.qt-panel{background:rgba(31,41,55,.5);padding:14px;border-radius:10px;border:1px solid var(--border);}
.qt-panel h4{margin-bottom:8px;font-size:12px;color:var(--accent);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;margin-top:10px;}
.cal-cell{min-height:56px;padding:3px;background:rgba(55,65,81,.4);border:1px solid var(--border);border-radius:4px;cursor:pointer;}
.cal-cell:hover{background:rgba(55,65,81,.8);}
.cal-cell .day{color:var(--accent);font-weight:700;font-size:10px;}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 6px rgba(6,182,212,.4);}
.cal-head{color:var(--accent);text-align:center;padding:3px;font-weight:700;font-size:10px;}
.chat-box{display:flex;flex-direction:column;height:100%;}
.chat-log{flex:1;overflow-y:auto;padding:10px;background:rgba(0,0,0,.3);border-radius:10px;border:1px solid var(--border);margin-bottom:10px;display:flex;flex-direction:column;gap:8px;}
.msg{padding:8px 12px;border-radius:10px;font-size:13px;max-width:85%;line-height:1.5;word-wrap:break-word;}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;}
.msg.ai{align-self:flex-start;background:rgba(31,41,55,.9);border:1px solid var(--border);}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;margin:0;}
.chat-input button{margin:0;}
.q-badge{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;background:rgba(6,182,212,.3);color:#a0f0ff;}
.q-badge.richtig{background:rgba(16,185,129,.3);color:#6ee7b7;}
.q-badge.falsch{background:rgba(239,68,68,.3);color:#fca5a5;}
#click-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(6,182,212,.9);color:#fff;padding:8px 20px;border-radius:20px;font-size:12px;z-index:99;animation:pulse 2s infinite;pointer-events:none;transition:opacity .5s;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.7);}50%{box-shadow:0 0 0 15px rgba(6,182,212,0);}}

/* Music Studio */
.music-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:12px;}
.inst-btn{padding:12px 8px;background:rgba(31,41,55,.5);border:1px solid var(--border);border-radius:8px;text-align:center;font-size:11px;cursor:pointer;transition:all .2s;}
.inst-btn:hover{border-color:var(--accent);background:rgba(6,182,212,.2);}
.inst-btn.active{background:rgba(6,182,212,.4);border-color:var(--accent);color:#fff;}
.track-row{display:flex;gap:6px;align-items:center;padding:8px;background:rgba(31,41,55,.3);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px;}
.track-row .nm{flex:1;}
.btn-sm{padding:4px 10px!important;font-size:11px!important;margin:0!important;}

/* Blitzer */
.blitzer-card{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(31,41,55,.6));border:1px solid rgba(239,68,68,.4);padding:12px;border-radius:10px;margin-bottom:8px;}
.blitzer-card .dist{font-size:24px;font-weight:800;color:#ef4444;margin-bottom:4px;}
.alarm-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:8px;}
.alarm-tile{padding:10px 6px;background:rgba(31,41,55,.5);border:1px solid var(--border);border-radius:8px;text-align:center;font-size:11px;cursor:pointer;}
.alarm-tile:hover{border-color:var(--accent);}
.alarm-tile.active{background:rgba(6,182,212,.3);border-color:var(--accent);color:#fff;}
</style>
</head>
<body>
<canvas id="cosmos-canvas"></canvas>

<div id="welcome">
  <img src="logo.png" class="logo-img" alt="Logo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
  <div style="font-size:80px;display:none;filter:drop-shadow(0 0 30px #06b6d4)">🤖</div>
  <h1>HALDO AI OS PRO MAX</h1>
  <h2>Willkommen zurück, Bruder 💙<br>Dein Universum aus Medizin, Alltag und Intelligenz.</h2>
  <div class="presented">Präsentiert von <b>Halil Donma</b></div>
  <button class="enter-btn" onclick="enterApp()">JETZT STARTEN →</button>
</div>

<div id="app-splash"><div class="splash-icon" id="splash-icon">🤖</div><div class="splash-name" id="splash-name">HalDo AI OS</div><div class="splash-presented">Präsentiert von <b>Halil Donma</b></div></div>

<div id="taskbar">
  <div class="start-btn" onclick="toggleStartMenu(event)"><span>⊞</span> <span>Start</span></div>
  <div class="taskbar-apps" id="taskbar-apps"></div>
  <div id="sys-clock">--:--</div>
</div>

<div id="start-menu">
  <div class="sm-drag-header" id="sm-drag-handle"><span>🚀 HalDo AI OS Pro Max v2.0</span><span style="font-size:11px;color:var(--dim)">≡ ziehen</span></div>
  <div class="sm-tabs">
    <button class="sm-tab active" data-tab="apps">📱 Apps</button>
    <button class="sm-tab" data-tab="settings">⚙️ Einstellungen</button>
  </div>
  <div class="sm-panel active" id="sm-panel-apps">
    <div class="sm-search"><input type="text" id="sm-search-input" placeholder="Apps durchsuchen…" oninput="filterStartMenu(this.value)"></div>
    <div class="sm-apps" id="sm-apps"></div>
  </div>
  <div class="sm-panel" id="sm-panel-settings">
    <div class="settings-layout"><div class="settings-nav" id="settings-nav"></div><div class="settings-content" id="settings-content"></div></div>
  </div>
</div>

<div id="click-hint">👆 Klicke auf die Erde, um mit HalDo AI zu sprechen</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==================== i18n ==================== */
const I18N={
  de:{start:'Start',create:'Erstellen',edit:'Bearbeiten',select:'Auswählen',settings:'Einstellungen',delete:'Löschen',save:'Speichern',speak:'Vorlesen',add:'Hinzufügen',search:'Suchen',noEntries:'Keine Einträge',total:'Gesamt',confirm:'Wirklich löschen?',send:'Senden'},
  en:{start:'Start',create:'Create',edit:'Edit',select:'Select',settings:'Settings',delete:'Delete',save:'Save',speak:'Speak',add:'Add',search:'Search',noEntries:'No entries',total:'Total',confirm:'Really delete?',send:'Send'},
  ku:{start:'Destpêk',create:'Çêkirin',edit:'Sererast',select:'Hilbijartin',settings:'Mîheng',delete:'Jêbirin',save:'Tomar',speak:'Xwendin',add:'Zêde',search:'Lêgerîn',noEntries:'Tu tişt tune',total:'Giştî',confirm:'Jê bibe?',send:'Bipeşîne'},
  tr:{start:'Başlat',create:'Oluştur',edit:'Düzenle',select:'Seç',settings:'Ayarlar',delete:'Sil',save:'Kaydet',speak:'Oku',add:'Ekle',search:'Ara',noEntries:'Kayıt yok',total:'Toplam',confirm:'Silinsin mi?',send:'Gönder'},
  ar:{start:'ابدأ',create:'إنشاء',edit:'تعديل',select:'اختيار',settings:'إعدادات',delete:'حذف',save:'حفظ',speak:'نطق',add:'إضافة',search:'بحث',noEntries:'لا شيء',total:'المجموع',confirm:'حذف؟',send:'إرسال'},
  fa:{start:'شروع',create:'ایجاد',edit:'ویرایش',select:'انتخاب',settings:'تنظیمات',delete:'حذف',save:'ذخیره',speak:'خواندن',add:'افزودن',search:'جستجو',noEntries:'موردی نیست',total:'مجموع',confirm:'حذف؟',send:'ارسال'},
  ru:{start:'Старт',create:'Создать',edit:'Изменить',select:'Выбрать',settings:'Настройки',delete:'Удалить',save:'Сохранить',speak:'Читать',add:'Добавить',search:'Поиск',noEntries:'Нет',total:'Всего',confirm:'Удалить?',send:'Отправить'},
  fr:{start:'Démarrer',create:'Créer',edit:'Modifier',select:'Sélectionner',settings:'Paramètres',delete:'Supprimer',save:'Enregistrer',speak:'Lire',add:'Ajouter',search:'Rechercher',noEntries:'Aucune',total:'Total',confirm:'Supprimer ?',send:'Envoyer'},
  es:{start:'Inicio',create:'Crear',edit:'Editar',select:'Seleccionar',settings:'Ajustes',delete:'Eliminar',save:'Guardar',speak:'Leer',add:'Añadir',search:'Buscar',noEntries:'Ninguna',total:'Total',confirm:'¿Eliminar?',send:'Enviar'},
  it:{start:'Avvia',create:'Crea',edit:'Modifica',select:'Seleziona',settings:'Impostazioni',delete:'Elimina',save:'Salva',speak:'Leggi',add:'Aggiungi',search:'Cerca',noEntries:'Nessuna',total:'Totale',confirm:'Eliminare?',send:'Invia'},
  zh:{start:'开始',create:'创建',edit:'编辑',select:'选择',settings:'设置',delete:'删除',save:'保存',speak:'朗读',add:'添加',search:'搜索',noEntries:'无条目',total:'总计',confirm:'删除？',send:'发送'},
  ja:{start:'開始',create:'作成',edit:'編集',select:'選択',settings:'設定',delete:'削除',save:'保存',speak:'読み上げ',add:'追加',search:'検索',noEntries:'なし',total:'合計',confirm:'削除？',send:'送信'}
};
const LANGCODES={de:'de-DE',en:'en-US',ku:'tr-TR',tr:'tr-TR',ar:'ar-SA',fa:'fa-IR',ru:'ru-RU',fr:'fr-FR',es:'es-ES',it:'it-IT',zh:'zh-CN',ja:'ja-JP'};
const LANGNAMES={de:'🇩🇪 Deutsch',en:'🇬🇧 English',ku:'☀️ Kurdî',tr:'🇹🇷 Türkçe',ar:'🇸🇦 العربية',fa:'🇮🇷 فارسی',ru:'🇷🇺 Русский',fr:'🇫🇷 Français',es:'🇪🇸 Español',it:'🇮🇹 Italiano',zh:'🇨🇳 中文',ja:'🇯🇵 日本語'};
let currentLang=localStorage.getItem('haldo_lang')||'de';
const T=k=>(I18N[currentLang]&&I18N[currentLang][k])||I18N.de[k]||k;
const store=(k,d)=>{try{const v=localStorage.getItem('haldo_'+k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>localStorage.setItem('haldo_'+k,JSON.stringify(v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ==================== Speech ==================== */
function speak(text,voiceType='default',lang=currentLang){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text));
  u.lang=LANGCODES[lang]||'de-DE';
  u.rate=parseFloat(localStorage.getItem('haldo_voice_rate')||1);

const ALARM_TYPES={
  beep:'🔔 Piepton',siren:'🚨 Sirene',bell:'🔕 Glocke',bird:'🐦 Vogel',chime:'🎵 Glockenspiel',
  buzzer:'📢 Summer',horn:'📯 Hupe',whistle:'💨 Pfeife',warble:'🎶 Triller',pulse:'💓 Puls',
  bell2:'🔔 Glocke 2',beep2:'📻 Doppel-Piep'
};
function playAlarm(type='beep',duration=3,volume=0.5){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const master=ctx.createGain();master.gain.value=volume;master.connect(ctx.destination);
    const t=ctx.currentTime;
    const mk=(freq,typeOsc,dur)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.type=typeOsc;o.frequency.value=freq;o.connect(g);g.connect(master);g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur);return o;};
    if(type==='beep'){for(let i=0;i<duration*2;i++){setTimeout(()=>mk(1000,'square',0.15),i*500);}}
    else if(type==='beep2'){for(let i=0;i<duration*2;i++){setTimeout(()=>{mk(1000,'square',0.1);setTimeout(()=>mk(1400,'square',0.1),150);},i*500);}}
    else if(type==='siren'){const o=ctx.createOscillator();const g=ctx.createGain();o.type='sawtooth';o.connect(g);g.connect(master);g.gain.value=0.2;const period=duration/4;for(let i=0;i<duration*2;i++){o.frequency.linearRampToValueAtTime(800,t+i*0.125);o.frequency.linearRampToValueAtTime(1200,t+i*0.125+0.0625);}o.start(t);o.stop(t+duration);}
    else if(type==='bell'){mk(1000,'sine',duration);setTimeout(()=>mk(1500,'sine',duration*0.8),100);}
    else if(type==='bell2'){mk(800,'sine',duration);mk(1200,'sine',duration);}
    else if(type==='bird'){for(let i=0;i<duration*4;i++){setTimeout(()=>{const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(2000,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(3000,ctx.currentTime+0.1);g.gain.value=0.15;o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+0.1);},i*250);}}
    else if(type==='chime'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>mk(f,'sine',0.6),i*150));}
    else if(type==='buzzer'){mk(200,'square',duration);}
    else if(type==='horn'){mk(150,'sawtooth',duration*0.8);setTimeout(()=>mk(180,'sawtooth',duration*0.6),200);}
    else if(type==='whistle'){const o=ctx.createOscillator();const g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(2000,t);o.frequency.exponentialRampToValueAtTime(3000,t+0.2);o.frequency.exponentialRampToValueAtTime(2000,t+0.4);o.connect(g);g.connect(master);g.gain.value=0.2;o.start(t);o.stop(t+Math.min(duration,0.5));}
    else if(type==='warble'){for(let i=0;i<duration*8;i++){setTimeout(()=>mk(i%2?1200:800,'sine',0.12),i*125);}}
    else if(type==='pulse'){for(let i=0;i<duration*2;i++){setTimeout(()=>mk(600,'sine',0.2),i*500);}}
    else{mk(800,'sine',duration);}
  }catch(e){console.warn('Alarm:',e);}
}

function processHalDoCommand(input){

    if(ql.startsWith(v)){const t=ql.substring(v.length).trim();const app=REGISTRY.find(a=>a.nm.toLowerCase().includes(t)||a.id.toLowerCase()===t);if(app){setTimeout(()=>openApp(app.id),500);return '✓ Öffne '+app.nm+'…';}}
  }
  const taskM=input.match(/^(?:erstelle?|add|neue?)\s+(?:aufgabe|task)\s+(.+)$/i);
  if(taskM){const t=store('tasks',[]);t.push({id:Date.now(),text:taskM[1],done:false,date:''});save('tasks',t);return '✓ Aufgabe: "'+taskM[1]+'"';}
  if(/wetter|weather/.test(ql)){setTimeout(()=>openApp('W'),300);return '✓ Öffne Wetter…';}

  if(/blitzer/.test(ql)){setTimeout(()=>openApp('BL'),300);return '🚨 Öffne Blitzer…';}

  if(/musik|music/.test(ql)){setTimeout(()=>openApp('MS'),300);return '🎵 Öffne Music Studio…';}
  if(/aufgaben|tasks/.test(ql)){const t=store('tasks',[]);return '📋 '+t.filter(x=>!x.done).length+' offene Aufgabe(n).';}
  if(/hallo|hi|hey/.test(ql))return 'Hallo Bruder! 💙 Wie kann ich helfen?';
  return '🤖 Verstanden: "'+input+'". Befehle: "öffne Fahrschule", "öffne Blitzer", "wetter", "musik".';
}

function makeCRUD(config){
  return function(body){
    body.style.cssText='display:flex;height:100%;';
    const sb=document.createElement('div');sb.className='app-sidebar';
    const ct=document.createElement('div');ct.className='app-content';
    body.appendChild(sb);body.appendChild(ct);
    let items=store('crud_'+config.id,config.initial||[]);
    let selId=items[0]?items[0].id:null;
    const persist=()=>save('crud_'+config.id,items);
    const fields=config.fields;let active='select';
    function flash(m){const d=document.createElement('div');d.style.cssText='color:#06b6d4;font-size:12px;margin-top:8px;';d.textContent=m;ct.appendChild(d);setTimeout(()=>d.remove(),1800);}
    function render(){
      sb.innerHTML='';
      ['create','edit','select','settings','delete'].forEach(k=>{const b=document.createElement('button');b.className='side-btn'+(active===k?' active':'');b.textContent=T(k);b.onclick=()=>{active=k;render();};sb.appendChild(b);});
      const sp=document.createElement('button');sp.className='side-btn speak-btn';sp.textContent='🔊 '+T('speak');sp.onclick=()=>speak((config.title||config.id)+'. '+items.length+' Einträge.');sb.appendChild(sp);
      ct.innerHTML='';
      if(active==='create'){ct.innerHTML='<h3>'+T('create')+'</h3>';const f=document.createElement('form');fields.forEach(fd=>{const i=document.createElement('input');i.name=fd.name;i.placeholder=fd.label;f.appendChild(i);});const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);f.onsubmit=e=>{e.preventDefault();const item={id:Date.now()};fields.forEach(fd=>item[fd.name]=f.querySelector('[name="'+fd.name+'"]').value);items.push(item);persist();f.reset();flash('✓ '+T('save'));};ct.appendChild(f);}
      else if(active==='edit'){ct.innerHTML='<h3>'+T('edit')+'</h3>';if(!items.length){ct.innerHTML+='<p class="muted">'+T('noEntries')+'</p>';return;}if(!items.find(i=>i.id===selId))selId=items[0].id;const sel=document.createElement('select');items.forEach(it=>{const o=document.createElement('option');o.value=it.id;o.textContent=it[fields[0].name]||'#'+it.id;sel.appendChild(o);});sel.value=selId;sel.onchange=()=>{selId=Number(sel.value);render();};ct.appendChild(sel);const item=items.find(i=>i.id===selId);const f=document.createElement('form');fields.forEach(fd=>{const i=document.createElement('input');i.name=fd.name;i.placeholder=fd.label;i.value=item[fd.name]||'';f.appendChild(i);});const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);f.onsubmit=e=>{e.preventDefault();fields.forEach(fd=>item[fd.name]=f.querySelector('[name="'+fd.name+'"]').value);persist();flash('✓ '+T('save'));render();};ct.appendChild(f);}
      else if(active==='select'){ct.innerHTML='<h3>'+T('select')+'</h3>';const s=document.createElement('input');s.placeholder='🔍 '+T('search');ct.appendChild(s);const list=document.createElement('div');ct.appendChild(list);const rl=()=>{list.innerHTML='';const q=s.value.toLowerCase();const filt=items.filter(it=>!q||fields.some(fd=>String(it[fd.name]||'').toLowerCase().includes(q)));if(!filt.length){list.innerHTML='<p class="muted">'+T('noEntries')+'</p>';return;}filt.forEach(it=>{const row=document.createElement('div');row.className='list-row';row.innerHTML='<span>'+esc(it[fields[0].name]||'—')+'</span>'+(fields[1]?'<span class="meta">'+esc(it[fields[1].name]||'')+'</span>':'');row.onclick=()=>{selId=it.id;active='edit';render();};list.appendChild(row);});};s.oninput=rl;rl();}
      else if(active==='settings'){ct.innerHTML='<h3>'+T('settings')+'</h3><p>'+T('total')+': <b>'+items.length+'</b></p>';const exp=document.createElement('button');exp.textContent='⬇ Export JSON';exp.onclick=()=>{const b=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=config.id+'.json';a.click();};ct.appendChild(exp);const w=document.createElement('button');w.className='danger';w.textContent='🗑 Alles löschen';w.onclick=()=>{if(confirm(T('confirm'))){items=[];persist();render();}};ct.appendChild(w);}
      else if(active==='delete'){ct.innerHTML='<h3>'+T('delete')+'</h3>';if(!items.length){ct.innerHTML+='<p class="muted">'+T('noEntries')+'</p>';return;}items.forEach(it=>{const row=document.createElement('div');row.className='list-row';row.innerHTML='<span>'+esc(it[fields[0].name]||'—')+'</span>';const d=document.createElement('button');d.className='danger';d.textContent='✕';d.onclick=()=>{if(confirm(T('confirm'))){items=items.filter(x=>x.id!==it.id);persist();render();}};row.appendChild(d);ct.appendChild(row);});}
    }
    render();
  };
}

const viewAI = function(body){
  body.style.cssText='display:flex;height:100%;padding:18px;flex-direction:column;';
  const wrap=document.createElement('div');wrap.className='chat-box';
  const log=document.createElement('div');log.className='chat-log';
  const inpRow=document.createElement('div');inpRow.className='chat-input';
  const inp=document.createElement('input');inp.placeholder='Frage oder Befehl…';
  const snd=document.createElement('button');snd.textContent='➤';
  wrap.appendChild(log);inpRow.appendChild(inp);inpRow.appendChild(snd);wrap.appendChild(inpRow);body.appendChild(wrap);
  let h=store('ai_classic',[{role:'ai',text:'Hallo! Ich bin HalDo AI. Befehle: "öffne Fahrschule", "öffne Blitzer", "musik".'}]);
  const render=()=>{log.innerHTML='';h.forEach(m=>{const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.text;log.appendChild(d);});log.scrollTop=log.scrollHeight;};
  const send=()=>{const q=inp.value.trim();if(!q)return;h.push({role:'user',text:q});inp.value='';render();setTimeout(()=>{const r=processHalDoCommand(q);h.push({role:'ai',text:r});if(h.length>40)h=h.slice(-40);save('ai_classic',h);render();speak(r);},400);};
  snd.onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send();};render();
};

const viewCalendar = function(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';
  body.appendChild(sb);body.appendChild(ct);
  let events=store('cal_events',[]);let viewDate=new Date();let active='select';
  const persist=()=>save('cal_events',events);
  function render(){
    sb.innerHTML='';
    [['select','📅 Kalender'],['create','➕ Neu'],['delete','🗑 Löschen']].forEach(([id,label])=>{const b=document.createElement('button');b.className='side-btn'+(active===id?' active':'');b.textContent=label;b.onclick=()=>{active=id;render();};sb.appendChild(b);});
    ct.innerHTML='';
    if(active==='select'){
      const head=document.createElement('div');head.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:10px;';
      const prev=document.createElement('button');prev.textContent='◀';prev.onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);render();};
      const next=document.createElement('button');next.textContent='▶';next.onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);render();};
      const title=document.createElement('h3');title.style.margin='0';title.style.flex='1';title.textContent=viewDate.toLocaleString(currentLang,{month:'long',year:'numeric'});
      head.appendChild(prev);head.appendChild(title);head.appendChild(next);ct.appendChild(head);
      const grid=document.createElement('div');grid.className='cal-grid';
      ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>{const c=document.createElement('div');c.className='cal-head';c.textContent=d;grid.appendChild(c);});
      const y=viewDate.getFullYear(),m=viewDate.getMonth();
      const sd=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const today=new Date();
      for(let i=0;i<sd;i++)grid.appendChild(document.createElement('div'));
      for(let d=1;d<=days;d++){const c=document.createElement('div');c.className='cal-cell';const dt=new Date(y,m,d);if(dt.toDateString()===today.toDateString())c.classList.add('today');c.innerHTML='<div class="day">'+d+'</div>';const key=dt.toISOString().slice(0,10);events.filter(e=>e.date===key).forEach(e=>{const ev=document.createElement('div');ev.style.cssText='font-size:10px;background:rgba(6,182,212,.4);color:#fff;padding:1px 3px;margin-top:2px;border-radius:2px;';ev.textContent=e.title;c.appendChild(ev);});c.onclick=()=>{const tit=prompt('Termin:','');if(tit){events.push({id:Date.now(),title:tit,date:key});persist();render();}};grid.appendChild(c);}
      ct.appendChild(grid);
    }else if(active==='create'){ct.innerHTML='<h3>➕ Termin</h3>';const f=document.createElement('form');const ti=document.createElement('input');ti.placeholder='Titel';f.appendChild(ti);const di=document.createElement('input');di.type='date';di.value=new Date().toISOString().slice(0,10);f.appendChild(di);const b=document.createElement('button');b.textContent=T('save');f.appendChild(b);f.onsubmit=e=>{e.preventDefault();events.push({id:Date.now(),title:ti.value,date:di.value});persist();active='select';render();};ct.appendChild(f);}
    else{ct.innerHTML='<h3>🗑 Löschen</h3>';events.forEach(ev=>{const row=document.createElement('div');row.className='list-row';row.innerHTML='<span>'+esc(ev.title)+'</span><span class="meta">'+ev.date+'</span>';const d=document.createElement('button');d.className='danger';d.textContent='✕';d.onclick=()=>{if(confirm(T('confirm'))){events=events.filter(x=>x.id!==ev.id);persist();render();}};row.appendChild(d);ct.appendChild(row);});}
  }
  render();
};

const viewTasks = function(body){

  let active='select';

    sb.innerHTML='';
    [['select','✅ Aufgaben'],['create','➕ Neu'],['delete','🗑 Löschen']].forEach(([id,label])=>{const b=document.createElement('button');b.className='side-btn'+(active===id?' active':'');b.textContent=label;b.onclick=()=>{active=id;render();};sb.appendChild(b);});
    ct.innerHTML='';

const viewWeather = function(body){
  body.style.cssText='padding:18px;overflow-y:auto;';
  body.innerHTML='<h3>🌤️ Wetter</h3>';
  const out=document.createElement('div');out.style.cssText='font-size:18px;margin:20px 0;';body.appendChild(out);
  const btn=document.createElement('button');btn.textContent='📍 Standort';
  btn.onclick=()=>{if(!navigator.geolocation){out.textContent='GPS fehlt';return;}out.textContent='Lade…';navigator.geolocation.getCurrentPosition(async p=>{try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+p.coords.latitude+'&longitude='+p.coords.longitude+'&current=temperature_2m,weather_code');const j=await r.json();out.innerHTML='<div style="font-size:48px;font-weight:800;color:#06b6d4">'+j.current.temperature_2m+'°C</div>';speak(Math.round(j.current.temperature_2m)+' Grad.');}catch(e){out.textContent='Fehler.';}},()=>{out.textContent='GPS verweigert.';});};

};

const viewFahrschuleApp = function(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';
  body.appendChild(sb);body.appendChild(ct);
  let active='quiz';
  let stats=store('fahrschule_stats',{richtig:0,falsch:0});
  let questions=store('fahrschule_fragen',[
    {id:1,q:'Wie schnell innerorts?',a:'50 km/h'},
    {id:2,q:'Rotes Dreieck?',a:'Vorfahrt gewähren'},
    {id:3,q:'Promille für Fahranfänger?',a:'0,0 Promille'},
    {id:4,q:'Probezeit?',a:'2 Jahre'},
    {id:5,q:'Außerorts Landstraße?',a:'100 km/h'},
    {id:6,q:'Autobahn Richtgeschwindigkeit?',a:'130 km/h'},
    {id:7,q:'Profil mindestens?',a:'1,6 mm'},
    {id:8,q:'Wildwechsel?',a:'Bremsen, nicht ausweichen'}
  ]);
  let quizIndex=0;
  function render(){
    sb.innerHTML='';
    [['quiz','🎯 Quiz'],['fragen','📚 Fragen'],['stats','📊 Statistik'],['settings','⚙ Einstellungen']].forEach(([id,label])=>{const b=document.createElement('button');b.className='side-btn'+(active===id?' active':'');b.textContent=label;b.onclick=()=>{active=id;render();};sb.appendChild(b);});
    ct.innerHTML='';
    if(active==='quiz'){
      if(quizIndex>=questions.length){ct.innerHTML='<h3>🎯 Quiz</h3><p style="color:#10b981;font-size:18px;">🎉 Score: '+stats.richtig+'/'+(stats.richtig+stats.falsch)+'</p>';const b=document.createElement('button');b.textContent='🔄 Neu';b.onclick=()=>{quizIndex=0;stats={richtig:0,falsch:0};save('fahrschule_stats',stats);render();};ct.appendChild(b);return;}
      const q=questions[quizIndex];
      ct.innerHTML='<h3>🎯 Frage '+(quizIndex+1)+'/'+questions.length+'</h3>';
      const p=document.createElement('div');p.className='qt-panel';p.innerHTML='<p style="font-size:16px;margin-bottom:12px;">'+esc(q.q)+'</p>';
      const inp=document.createElement('input');inp.placeholder='Antwort…';
      const btn=document.createElement('button');btn.textContent='Prüfen';
      btn.onclick=()=>{const user=inp.value.trim().toLowerCase();const ok=user.includes(q.a.toLowerCase().slice(0,4))||q.a.toLowerCase().includes(user.slice(0,4));if(ok){stats.richtig++;p.innerHTML+='<p class="q-badge richtig">✓ '+esc(q.a)+'</p>';}else{stats.falsch++;p.innerHTML+='<p class="q-badge falsch">✗ '+esc(q.a)+'</p>';}save('fahrschule_stats',stats);setTimeout(()=>{quizIndex++;render();},1500);};
      p.appendChild(inp);p.appendChild(btn);ct.appendChild(p);
    }else if(active==='fragen'){
      ct.innerHTML='<h3>📚 Fragen</h3>';
      questions.forEach(q=>{const row=document.createElement('div');row.className='list-row';row.innerHTML='<span><b>'+esc(q.q)+'</b></span><span class="meta">'+esc(q.a)+'</span>';ct.appendChild(row);});
    }else if(active==='stats'){
      const total=stats.richtig+stats.falsch;const rate=total>0?Math.round(stats.richtig/total*100):0;
      ct.innerHTML='<h3>📊 Statistik</h3><div class="qt-grid"><div class="qt-panel"><h4>✓ Richtig</h4><div style="font-size:32px;color:#10b981;">'+stats.richtig+'</div></div><div class="qt-panel"><h4>✗ Falsch</h4><div style="font-size:32px;color:#ef4444;">'+stats.falsch+'</div></div><div class="qt-panel"><h4>📊 Quote</h4><div style="font-size:32px;color:#06b6d4;">'+rate+'%</div></div></div>';
    }else{ct.innerHTML='<h3>⚙ Einstellungen</h3><p>Klassen: B, A, C, D</p>';}
  }
  render();

      const b=document.createElement('button');b.textContent='➕ '+T('add');f.appendChild(b);
      f.onsubmit=e=>{e.preventDefault();blitzer.push({id:Date.now(),ort:or.value,typ:ty.value,mine:true,dist:Math.random()*10});persist();f.reset();active='mine';render();};ct.appendChild(f);

      ct.innerHTML+=`<div class="settings-row"><div><div class="lbl">Stimme</div><div class="sub">Sprecher-Typ</div></div><div class="ctrl"><select id="bl-voice">${voices.map(([v,n])=>`<option value="${v}" ${settings.voice===v?'selected':''}>${n}</option>`).join('')}</select></div></div>`;

        t.onclick=()=>{
          tiles.querySelectorAll('.alarm-tile').forEach(x=>x.classList.remove('active'));

      saveAs.onclick=()=>{const activeTile=ct.querySelector('.alarm-tile.active');if(activeTile){const found=Object.entries(ALARM_TYPES).find(([k,v])=>v===activeTile.textContent);if(found){settings.alarm=found[0];persistSettings();alert('✓ Standard: '+activeTile.textContent);}}};

/* ==================== MUSIC STUDIO (NEU) ==================== */
const viewMusicStudio = function(body){
  body.style.cssText='display:flex;height:100%;';
  const sb=document.createElement('div');sb.className='app-sidebar';const ct=document.createElement('div');ct.className='app-content';
  body.appendChild(sb);body.appendChild(ct);
  let active='studio';
  let studio=store('music_studio',{
    genres:['pop'],instruments:['piano','drums','bass'],moods:['happy'],bpm:120,
    lyrics:'Ich bin ein Stern im Universum,\nleuchte hell wie die Sonne,\nfliege durch die Galaxie,\nmeine Träume sind unendlich.'
  });
  let audioCtx=null;
  let playing=false;
  let activeSources=[];

  function getCtx(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}return audioCtx;}

  // Instruments A-Z
  const INSTRUMENTS={
    piano:'🎹 Klavier',guitar:'🎸 Gitarre',bass:'🎸 Bass',drums:'🥁 Drums',
    strings:'🎻 Streicher',synth:'🎛️ Synth',flute:'🪈 Flöte',trumpet:'🎺 Trompete',
    saxophone:'🎷 Saxophon',violin:'🎻 Violine',cello:'🎼 Cello',organ:'⛪ Orgel',
    harp:'🪕 Harfe',banjo:'🪕 Banjo',ukulele:'🪕 Ukulele',xylophone:'🎵 Xylophon',
    marimba:'🎵 Marimba',accordion:'🪗 Akkordeon',harmonica:'🎵 Mundharmonika',bell:'🔔 Glocke'
  };
  const GENRES={'pop':'Pop','rock':'Rock','hiphop':'Hip-Hop','electronic':'Electronic','jazz':'Jazz','classical':'Klassik','metal':'Metal','folk':'Folk','reggae':'Reggae'};
  const MOODS={'happy':'😊 Fröhlich','sad':'😢 Traurig','epic':'🔥 Episch','chill':'😌 Chill','dark':'🌑 Dunkel'};
  const PROGRESSIONS={happy:[0,4,5,3],sad:[5,3,0,4],epic:[0,5,3,4],chill:[0,3,5,4],dark:[0,1,5,4]};
  const CHORDS=[[261.63,329.63,392.00],[293.66,349.23,440.00],[329.63,392.00,493.88],[349.23,440.00,523.25],[392.00,493.88,587.33],[440.00,523.25,659.25],[493.88,587.33,739.99]];

  function playNote(freq,dur,inst='piano',vol=0.15,when=0){
    const ctx=getCtx();const o=ctx.createOscillator();const g=ctx.createGain();
    const waves={piano:'triangle',guitar:'sawtooth',bass:'sine',strings:'sawtooth',synth:'square',flute:'sine',violin:'sawtooth',cello:'triangle',organ:'sine',bell:'sine',trumpet:'square',saxophone:'sawtooth'};
    o.type=waves[inst]||'sine';o.frequency.value=freq;
    o.connect(g);g.connect(ctx.destination);
    const t=ctx.currentTime+when;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t);o.stop(t+dur+0.05);
    activeSources.push(o);
    return o;
  }

  function playDrum(type='kick',when=0,vol=0.3){
    const ctx=getCtx();const t=ctx.currentTime+when;
    if(type==='kick'){const o=ctx.createOscillator();const g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+0.1);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.2);activeSources.push(o);}
    else if(type==='snare'){const bufferSize=ctx.sampleRate*0.15;const buf=ctx.createBuffer(1,bufferSize,ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;const src=ctx.createBufferSource();const g=ctx.createGain();src.buffer=buf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);src.connect(g);g.connect(ctx.destination);src.start(t);activeSources.push(src);}
    else if(type==='hihat'){const bufferSize=ctx.sampleRate*0.05;const buf=ctx.createBuffer(1,bufferSize,ctx.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<bufferSize;i++)data[i]=Math.random()*2-1;const src=ctx.createBufferSource();const g=ctx.createGain();src.buffer=buf;g.gain.setValueAtTime(vol*0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);src.connect(g);g.connect(ctx.destination);src.start(t);activeSources.push(src);}
  }

  function playPattern(){
    if(playing)return;
    playing=true;
    const bpm=studio.bpm;const beat=60/bpm;
    const chord=CHORDS[PROGRESSIONS[studio.moods[0]||'happy'][0]];
    // Drums
    if(studio.instruments.includes('drums')){
      for(let i=0;i<8;i++){
        setTimeout(()=>{if(!playing)return;playDrum('kick',0,0.25);},i*beat);
        if(i%2===1)setTimeout(()=>{if(!playing)return;playDrum('snare',0,0.2);},i*beat);
        setTimeout(()=>{if(!playing)return;playDrum('hihat',0,0.1);},i*beat+beat/2);
      }
    }
    // Chords
    const inst=studio.instruments.find(i=>['piano','guitar','synth','strings','flute','bell','organ'].includes(i))||'piano';
    chord.forEach((f,i)=>{
      for(let r=0;r<4;r++){setTimeout(()=>{if(!playing)return;playNote(f*2,beat*0.8,inst,0.08);},r*beat*2+i*0.02);}
    });
    // Bass
    if(studio.instruments.includes('bass')){
      for(let r=0;r<4;r++){setTimeout(()=>{if(!playing)return;playNote(chord[0]/2,beat*0.7,'bass',0.15);},r*beat*2);}
    }
    // Total duration
    const totalDur=8*beat*1000;
    setTimeout(()=>{playing=false;activeSources=[];},totalDur+500);
  }

  function stopAll(){
    playing=false;
    activeSources.forEach(s=>{try{s.stop();}catch(e){}});
    activeSources=[];
  }

  function exportWav(){
    const sr=44100;const dur=8;const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const offline=new OfflineAudioContext(2,sr*dur,sr);
    const beat=60/studio.bpm;const chord=CHORDS[PROGRESSIONS[studio.moods[0]||'happy'][0]];
    chord.forEach(f=>{
      for(let r=0;r<4;r++){const t=r*beat*2;const o=offline.createOscillator();const g=offline.createGain();o.type='triangle';o.frequency.value=f*2;o.connect(g);g.connect(offline.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+beat*0.8);o.start(t);o.stop(t+beat*0.8+0.05);}
    });
    offline.startRendering().then(buffer=>{
      const wav=bufferToWav(buffer);
      const blob=new Blob([wav],{type:'audio/wav'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='haldo-song-'+Date.now()+'.wav';a.click();
      alert('✓ WAV exportiert!');
    });
  }
  function bufferToWav(buffer){
    const numCh=buffer.numberOfChannels;const len=buffer.length*numCh*2+44;
    const ab=new ArrayBuffer(len);const view=new DataView(ab);
    const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
    writeStr(0,'RIFF');view.setUint32(4,len-8,true);writeStr(8,'WAVE');writeStr(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,numCh,true);view.setUint32(24,buffer.sampleRate,true);view.setUint32(28,buffer.sampleRate*numCh*2,true);view.setUint16(32,numCh*2,true);view.setUint16(34,16,true);writeStr(36,'data');view.setUint32(40,len-44,true);
    let off=44;for(let i=0;i<buffer.length;i++){for(let ch=0;ch<numCh;ch++){const s=Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]));view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}}
    return ab;
  }

  function render(){
    sb.innerHTML='';
    [['studio','🎛️ Studio'],['library','📚 Bibliothek'],['lyrics','✍️ Songtext'],['settings','⚙ Einstellungen']].forEach(([id,label])=>{const b=document.createElement('button');b.className='side-btn'+(active===id?' active':'');b.textContent=label;b.onclick=()=>{active=id;render();};sb.appendChild(b);});
    ct.innerHTML='';
    if(active==='studio'){
      ct.innerHTML='<h3>🎛️ Studio</h3>';
      // Genre
      ct.innerHTML+='<div style="font-size:12px;color:var(--dim);margin-bottom:4px;">Genres (Mehrfachauswahl):</div>';
      const ggrid=document.createElement('div');ggrid.style.cssText='display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;';
      Object.entries(GENRES).forEach(([k,v])=>{const b=document.createElement('button');b.className='btn-sm'+(studio.genres.includes(k)?'':' ghost');b.textContent=v;b.style.margin='0';b.onclick=()=>{if(studio.genres.includes(k))studio.genres=studio.genres.filter(x=>x!==k);else studio.genres.push(k);save('music_studio',studio);render();};ggrid.appendChild(b);});
      ct.appendChild(ggrid);
      // Instruments
      ct.innerHTML+='<div style="font-size:12px;color:var(--dim);margin-bottom:4px;">Instrumente (A-Z):</div>';
      const igrid=document.createElement('div');igrid.className='music-grid';
      Object.entries(INSTRUMENTS).forEach(([k,v])=>{const b=document.createElement('div');b.className='inst-btn'+(studio.instruments.includes(k)?' active':'');b.textContent=v;b.onclick=()=>{if(studio.instruments.includes(k))studio.instruments=studio.instruments.filter(x=>x!==k);else studio.instruments.push(k);save('music_studio',studio);render();};igrid.appendChild(b);});
      ct.appendChild(igrid);
      // Moods
      ct.innerHTML+='<div style="font-size:12px;color:var(--dim);margin-bottom:4px;">Stimmung:</div>';
      const mgrid=document.createElement('div');mgrid.style.cssText='display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;';
      Object.entries(MOODS).forEach(([k,v])=>{const b=document.createElement('button');b.className='btn-sm'+(studio.moods.includes(k)?'':' ghost');b.textContent=v;b.style.margin='0';b.onclick=()=>{studio.moods=[k];save('music_studio',studio);render();};mgrid.appendChild(b);});
      ct.appendChild(mgrid);
      // BPM
      const bpmRow=document.createElement('div');bpmRow.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:12px;';
      bpmRow.innerHTML='<span style="font-size:12px;">BPM:</span><input type="range" min="60" max="180" value="'+studio.bpm+'" style="flex:1;" oninput="this.nextElementSibling.textContent=this.value"><span style="min-width:40px;">'+studio.bpm+'</span>';
      bpmRow.querySelector('input').onchange=(e)=>{studio.bpm=parseInt(e.target.value);save('music_studio',studio);};
      ct.appendChild(bpmRow);
      // Play/Stop
      const playBar=document.createElement('div');playBar.style.cssText='display:flex;gap:8px;margin-bottom:12px;';
      const play=document.createElement('button');play.textContent='▶️ Abspielen';play.style.background='#10b981';play.onclick=()=>{playPattern();};
      const stop=document.createElement('button');stop.textContent='⏹ Stop';stop.style.background='#ef4444';stop.onclick=()=>{stopAll();};
      const exp=document.createElement('button');exp.textContent='💾 WAV Export';exp.onclick=()=>{exportWav();};
      playBar.appendChild(play);playBar.appendChild(stop);playBar.appendChild(exp);
      ct.appendChild(playBar);
    }else if(active==='library'){
      ct.innerHTML='<h3>📚 Bibliothek</h3>';
      const songs=store('music_songs',[]);
      if(!songs.length){ct.innerHTML+='<p class="muted">Noch keine Songs. Erstelle im Studio einen und exportiere ihn.</p>';}
      else songs.forEach(s=>{const row=document.createElement('div');row.className='list-row';row.innerHTML='<span>'+esc(s.name)+'</span><span class="meta">'+s.date+'</span>';ct.appendChild(row);});
    }else if(active==='lyrics'){
      ct.innerHTML='<h3>✍️ Songtext-Editor</h3>';
      const ta=document.createElement('textarea');ta.style.cssText='width:100%;min-height:200px;font-family:inherit;';ta.value=studio.lyrics;ta.oninput=()=>{studio.lyrics=ta.value;save('music_studio',studio);};ct.appendChild(ta);

// ═════════════════════════════════════════════════════════════
// ⚠️ DIE ENTSCHEIDENDE FIX-ZEILE:
// Verhindert, dass der globale Click-Handler das Menü schließt,
// wenn ein Button im Settings-Panel geklickt wurde, der das
// Panel neu rendert (und dadurch e.target aus dem DOM entfernt).
// ═════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{
  const settingsPanel=document.getElementById('sm-panel-settings');
  if(settingsPanel){
    settingsPanel.addEventListener('click',e=>e.stopPropagation());
  }
  // Global: click outside closes menu
  document.addEventListener('click',e=>{
    const sm=document.getElementById('start-menu');
    if(!sm.classList.contains('show'))return;
    if(e.target.closest('#start-menu'))return;
    if(e.target.closest('.start-btn'))return;
    sm.classList.remove('show');
  });
});

/* ==================== OPEN APP ==================== */
function openApp(id){
  const def=REGISTRY.find(a=>a.id===id);if(!def)return;
  const splash=document.getElementById('app-splash');
  if(splash){splash.querySelector('.splash-icon').textContent=def.ico;splash.querySelector('.splash-name').textContent=def.nm;splash.classList.add('show');setTimeout(()=>splash.classList.remove('show'),700);}
  document.getElementById('start-menu').classList.remove('show');
  if(openWindows[id]){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}return;}
  const win=document.createElement('div');
  win.className='window';win.id='win-'+id;
  win.style.width='min(880px,96vw)';win.style.height='min(600px,80vh)';
  win.style.left=(40+Object.keys(openWindows).length*25)+'px';win.style.top=(40+Object.keys(openWindows).length*25)+'px';win.style.zIndex=nextZ();
  win.innerHTML=`<div class="window-header" onmousedown="startDrag(event,'${id}')"><div class="window-title">${def.ico} ${def.nm}</div><div class="window-controls"><button class="win-btn" onclick="event.stopPropagation();minimizeApp('${id}')">—</button><button class="win-btn" onclick="event.stopPropagation();maximizeApp('${id}')">▢</button><button class="win-btn close" onclick="event.stopPropagation();closeApp('${id}')">✕</button></div></div><div class="window-body" id="body-${id}"></div>`;
  document.body.appendChild(win);openWindows[id]=true;
  document.getElementById('taskbar-apps').innerHTML+=`<div class="taskbar-app" id="tb-${id}" onclick="focusApp('${id}')">${def.ico} ${def.nm}</div>`;
  setTimeout(()=>{try{def.fn(document.getElementById('body-'+id));}catch(e){console.error(e);document.getElementById('body-'+id).innerHTML='<p style="color:#f77;padding:20px">Fehler: '+e.message+'</p>';}},60);
}
function closeApp(id){const w=document.getElementById('win-'+id);if(w)w.remove();const tb=document.getElementById('tb-'+id);if(tb)tb.remove();delete openWindows[id];}
function focusApp(id){const w=document.getElementById('win-'+id);if(w){w.classList.remove('minimized');w.style.zIndex=nextZ();}}
function minimizeApp(id){const w=document.getElementById('win-'+id);if(w)w.classList.toggle('minimized');}
function maximizeApp(id){const w=document.getElementById('win-'+id);if(!w)return;if(w.dataset.max==='1'){w.style.left=w.dataset.l;w.style.top=w.dataset.t;w.style.width=w.dataset.wd;w.style.height=w.dataset.ht;w.dataset.max='0';}else{w.dataset.l=w.style.left;w.dataset.t=w.style.top;w.dataset.wd=w.style.width;w.dataset.ht=w.style.height;w.style.left='0';w.style.top='0';w.style.width='100vw';w.style.height='calc(100vh - 54px)';w.dataset.max='1';}}
let dragState=null;
function startDrag(e,id){if(e.target.closest('.win-btn'))return;const w=document.getElementById('win-'+id);if(!w)return;dragState={id,sx:e.clientX,sy:e.clientY,wx:w.offsetLeft,wy:w.offsetTop};w.style.zIndex=nextZ();}
addEventListener('mousemove',e=>{if(!dragState)return;const w=document.getElementById('win-'+dragState.id);if(!w||w.dataset.max==='1')return;w.style.left=(dragState.wx+e.clientX-dragState.sx)+'px';w.style.top=Math.max(0,dragState.wy+e.clientY-dragState.sy)+'px';});
addEventListener('mouseup',()=>{dragState=null;});

/* ==================== BOOT ==================== */
function enterApp(){
  document.getElementById('welcome').classList.add('hide');
  document.getElementById('taskbar').classList.add('show');
  populateStartMenu();
  renderSettingsPanel();
  playGlassSound();
  const h=document.getElementById('click-hint');
  if(h)setTimeout(()=>{h.style.opacity='0';},8000);
}
function startClock(){const c=document.getElementById('sys-clock');const tick=()=>c.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,1000);}
document.addEventListener('DOMContentLoaded',()=>{
  initCosmos();startClock();populateStartMenu();renderSettingsPanel();
  const t2=localStorage.getItem('haldo_theme');if(t2){document.documentElement.style.setProperty('--accent',t2);document.documentElement.style.setProperty('--accent2',t2);}
  const f=localStorage.getItem('haldo_font_size');if(f)document.documentElement.style.setProperty('--font-size',f+'px');
});
</script>
