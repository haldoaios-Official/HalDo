<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HalDo AI OS Pro Max</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #000; color: #d8f1ff;
    user-select: none;
  }
  #cosmos { position: fixed; inset: 0; z-index: 0; display: block; }

  /* Top Bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 40px;
    background: rgba(2, 12, 24, 0.75);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(80, 200, 255, 0.25);
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px; z-index: 200;
  }
  #topbar .brand {
    font-weight: 700; color: #66e0ff; letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(102, 224, 255, 0.7);
    font-size: 14px;
  }
  #topbar .spacer { flex: 1; }
  #topbar select, #topbar button {
    background: rgba(10, 30, 50, 0.85); color: #c8ecff;
    border: 1px solid rgba(80, 200, 255, 0.4); border-radius: 6px;
    padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  #topbar button:hover { background: rgba(30, 80, 120, 0.9); }
  #clock { font-family: monospace; color: #66e0ff; font-size: 13px; }

  /* Start menu button */
  #startBtn {
    background: transparent; border: 1px solid rgba(80,200,255,0.5);
    color: #66e0ff; font-size: 16px; padding: 4px 10px; border-radius: 6px;
    cursor: pointer;
  }

  /* Start Menu */
  #startmenu {
    position: fixed; top: 46px; left: 8px; z-index: 300;
    width: 520px; max-height: calc(100vh - 110px);
    background: rgba(2, 15, 30, 0.96);
    border: 1px solid rgba(80, 200, 255, 0.4);
    border-radius: 10px; padding: 14px;
    box-shadow: 0 0 40px rgba(0, 150, 255, 0.35);
    display: none; overflow-y: auto;
  }
  #startmenu.open { display: block; }
  #startmenu h3 { margin: 0 0 10px; color: #66e0ff; font-size: 14px; letter-spacing: 1.5px; }
  #startmenu .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .app-tile {
    background: rgba(10, 30, 50, 0.85);
    border: 1px solid rgba(80, 200, 255, 0.3);
    border-radius: 8px; padding: 8px 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; text-align: center; color: #b8e6ff;
    transition: all .15s;
  }
  .app-tile:hover {
    background: rgba(30, 90, 140, 0.9);
    border-color: #66e0ff;
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0, 180, 255, 0.4);
  }
  .app-tile .icon { font-size: 22px; }
  .app-tile .letter { color: #66e0ff; font-size: 9px; font-weight: 700; }

  /* Windows */
  #windows { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
  .window {
    position: absolute; pointer-events: auto;
    background: rgba(3, 15, 30, 0.94);
    border: 1px solid rgba(80, 200, 255, 0.4);
    border-radius: 10px;
    box-shadow: 0 10px 50px rgba(0, 80, 180, 0.5), 0 0 0 1px rgba(80,200,255,0.1) inset;
    display: flex; flex-direction: column;
    min-width: 400px; min-height: 260px;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .window.minimized { display: none; }
  .win-header {
    height: 36px; flex: none; display: flex; align-items: center;
    padding: 0 10px; gap: 10px; cursor: move;
    background: linear-gradient(90deg, rgba(20,80,130,0.9), rgba(10,40,70,0.9));
    border-bottom: 1px solid rgba(80,200,255,0.3);
  }
  .win-title {
    font-size: 13px; font-weight: 600; color: #aee6ff;
    text-shadow: 0 0 6px rgba(0,180,255,0.6);
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .win-controls { display: flex; gap: 4px; }
  .win-controls button {
    width: 26px; height: 22px; border: 1px solid rgba(80,200,255,0.4);
    background: rgba(10,30,50,0.7); color: #aee6ff; cursor: pointer;
    border-radius: 4px; font-size: 12px; line-height: 1;
  }
  .win-controls button:hover { background: rgba(30,90,140,0.9); }
  .win-controls button[data-act="close"]:hover { background: #b32222; border-color: #ff5555; }
  .win-body { flex: 1; display: flex; min-height: 0; }

  /* App sidebar */
  .app-sidebar {
    width: 170px; flex: none; padding: 8px; overflow-y: auto;
    background: rgba(0, 10, 20, 0.6);
    border-right: 1px solid rgba(80,200,255,0.15);
    display: flex; flex-direction: column; gap: 4px;
  }
  .side-btn {
    text-align: left; padding: 8px 10px; font-size: 12px;
    background: transparent; border: 1px solid transparent;
    color: #a0d0e8; cursor: pointer; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-btn:hover { background: rgba(30,80,120,0.4); color: #fff; }
  .side-btn.active {
    background: rgba(30,110,170,0.7);
    border-color: rgba(80,200,255,0.6); color: #fff;
    box-shadow: 0 0 10px rgba(0,180,255,0.4);
  }
  .side-btn.speak-btn { margin-top: auto; color: #66e0ff; }

  /* App content */
  .app-content {
    flex: 1; padding: 14px; overflow-y: auto; min-width: 0;
  }
  .app-content h3 {
    margin: 0 0 10px; color: #66e0ff; font-size: 15px; letter-spacing: 1px;
  }
  .app-content input, .app-content select, .app-content textarea {
    width: 100%; padding: 8px 10px; margin: 4px 0;
    background: rgba(0,15,30,0.9); color: #d8f1ff;
    border: 1px solid rgba(80,200,255,0.3); border-radius: 6px;
    font-size: 13px; font-family: inherit; outline: none;
  }
  .app-content input:focus, .app-content select:focus, .app-content textarea:focus {
    border-color: #66e0ff; box-shadow: 0 0 8px rgba(0,180,255,0.4);
  }
  .app-content button {
    padding: 8px 14px; margin: 6px 4px 6px 0;
    background: linear-gradient(180deg, #1c6fa8, #0e3f66);
    border: 1px solid #66e0ff; color: #fff; border-radius: 6px;
    cursor: pointer; font-size: 12px;
  }
  .app-content button:hover { background: linear-gradient(180deg, #2a8fd0, #145a8a); }
  .app-content button.danger { background: linear-gradient(180deg, #a82020, #661010); border-color: #ff5555; }
  .app-content .list { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .app-content .list-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: rgba(10, 30, 50, 0.6);
    border: 1px solid rgba(80,200,255,0.15); border-radius: 6px;
    cursor: pointer; font-size: 12px;
  }
  .app-content .list-row:hover { background: rgba(30,80,120,0.6); border-color: rgba(80,200,255,0.5); }
  .app-content .list-row .muted { color: #7ea3bb; font-size: 11px; flex: 1; text-align: right; }
  .muted { color: #7ea3bb; }

  /* Taskbar */
  #taskbar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 44px;
    background: rgba(2, 12, 24, 0.9); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(80,200,255,0.3);
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
    z-index: 250; overflow-x: auto;
  }
  .task-btn {
    padding: 4px 10px; background: rgba(10,30,50,0.9);
    border: 1px solid rgba(80,200,255,0.3); color: #b8e6ff;
    border-radius: 6px; font-size: 11px; cursor: pointer;
    white-space: nowrap;
  }
  .task-btn:hover { background: rgba(30,80,120,0.9); }
  .task-btn.active { border-color: #66e0ff; box-shadow: 0 0 10px rgba(0,180,255,0.5); }

  /* Anatomy */
  .anatomy-wrap {
    width: 100%; height: calc(100% - 10px); min-height: 380px;
    border: 1px solid rgba(80,200,255,0.3); border-radius: 8px;
    overflow: hidden; position: relative; background: #001122;
  }
  .anatomy-wrap canvas { display: block; }
  .layer-toggles {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    display: flex; gap: 10px; font-size: 11px;
    background: rgba(0,20,40,0.8); padding: 6px 10px;
    border: 1px solid rgba(80,200,255,0.4); border-radius: 6px;
  }
  .layer-toggles label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

  /* Chat (AI) */
  .chat-box { display: flex; flex-direction: column; height: 100%; }
  .chat-log {
    flex: 1; overflow-y: auto; padding: 8px;
    background: rgba(0,15,30,0.6); border-radius: 6px;
    border: 1px solid rgba(80,200,255,0.2); margin-bottom: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg { padding: 6px 10px; border-radius: 8px; font-size: 12px; max-width: 85%; }
  .msg.user { align-self: flex-end; background: rgba(30,110,170,0.8); color: #fff; }
  .msg.ai { align-self: flex-start; background: rgba(20,50,80,0.8); color: #c8ecff; border: 1px solid rgba(80,200,255,0.3); }
  .chat-input { display: flex; gap: 6px; }
  .chat-input input { flex: 1; }
  .chat-input button { margin: 0; }

  /* Quick tools */
  .qt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qt-panel { background: rgba(10,30,50,0.6); padding: 10px; border-radius: 8px; border: 1px solid rgba(80,200,255,0.2); }
  .qt-panel h4 { margin: 0 0 8px; font-size: 12px; color: #66e0ff; }

  /* Calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 11px; }
  .cal-cell {
    min-height: 50px; padding: 3px; background: rgba(10,30,50,0.5);
    border: 1px solid rgba(80,200,255,0.15); border-radius: 3px; cursor: pointer;
  }
  .cal-cell:hover { background: rgba(30,80,120,0.6); }
  .cal-cell .day { color: #66e0ff; font-weight: 700; font-size: 10px; }
  .cal-cell.today { border-color: #66e0ff; box-shadow: 0 0 6px rgba(0,180,255,0.4); }
  .cal-head { color: #66e0ff; text-align: center; padding: 3px; font-weight: 700; font-size: 10px; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: rgba(0,10,20,0.5); }
  ::-webkit-scrollbar-thumb { background: rgba(80,200,255,0.4); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(80,200,255,0.7); }
</style>
</head>

const LANGCODES = {
  de:'de-DE', en:'en-US', ku:'tr-TR', ez:'tr-TR', ar:'ar-SA', fa:'fa-IR',
  he:'he-IL', tr:'tr-TR', zh:'zh-CN', ja:'ja-JP', uz:'uz-UZ', ru:'ru-RU',
  fr:'fr-FR', es:'es-ES', it:'it-IT', hi:'hi-IN', pt:'pt-BR', ko:'ko-KR',
  ckb:'ar-IQ', la:'it-IT'
};

const LANGNAMES = {
  de:'🇩🇪 Deutsch', en:'🇬🇧 English', ku:'☀️ Kurdî', ez:'🦚 Êzîdî',
  ar:'🇸🇦 العربية', fa:'🇮🇷 فارسی', he:'🇮🇱 עברית', tr:'🇹🇷 Türkçe',
  zh:'🇨🇳 中文', ja:'🇯🇵 日本語', uz:'🇺🇿 Oʻzbek', ru:'🇷🇺 Русский',

};

// ---------- Globale State ----------
const state = {
  lang: localStorage.getItem('haldo_lang') || 'de',
  zIndex: 100,
  openWindows: {},
  ttsEnabled: true,
  voiceSettings: JSON.parse(localStorage.getItem('haldo_voice') || '{"rate":1,"pitch":1}'),
  theme: localStorage.getItem('haldo_theme') || 'cyan',
};

const t = (key) => (I18N[state.lang] || I18N.de)[key] || I18N.de[key] || key;
const store = (k, d) => { try { const v = localStorage.getItem('haldo_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save  = (k, v) => localStorage.setItem('haldo_' + k, JSON.stringify(v));

// ---------- TTS ----------
function speak(text) {
  if (!state.ttsEnabled || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = state.voiceSettings.rate || 1;
  u.pitch = state.voiceSettings.pitch || 1;
  u.lang = LANGCODES[state.lang] || 'de-DE';
  speechSynthesis.speak(u);
}
function stopSpeak() { if (window.speechSynthesis) speechSynthesis.cancel(); }

// KOSMOS (Three.js)
// ============================================================
function initCosmos() {
  const canvas = document.getElementById('cosmos');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000006, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 3000);
  camera.position.set(0, 2.5, 13);
  camera.lookAt(0, 0.5, 0);

  // Sterne
  const starGeo = new THREE.BufferGeometry();
  const starCount = 8000;
  const pos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i += 3) {
    const r = 200 + Math.random() * 800;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i] = r * Math.sin(ph) * Math.cos(th);
    pos[i + 1] = r * Math.cos(ph);
    pos[i + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.4, sizeAttenuation: true }));
  scene.add(stars);

  // Sonne (leuchtend)
  const sunPos = new THREE.Vector3(-8, 3, -5);
  const sun = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0xffd060 }));
  sun.position.copy(sunPos);
  scene.add(sun);

  // Sonnen-Glow (Sprite)
  const gc = document.createElement('canvas'); gc.width = gc.height = 256;
  const gx = gc.getContext('2d');
  const grd = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,230,140,1)');
  grd.addColorStop(0.35, 'rgba(255,160,60,0.55)');
  grd.addColorStop(1, 'rgba(255,100,0,0)');
  gx.fillStyle = grd; gx.fillRect(0, 0, 256, 256);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(gc), blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.scale.set(8, 8, 1); glow.position.copy(sunPos);
  scene.add(glow);

  const sunLight = new THREE.PointLight(0xffaa55, 2, 100);
  sunLight.position.copy(sunPos); scene.add(sunLight);

  // Erde
  const eCanvas = document.createElement('canvas'); eCanvas.width = 1024; eCanvas.height = 512;
  const ex = eCanvas.getContext('2d');
  ex.fillStyle = '#062a5a'; ex.fillRect(0, 0, 1024, 512);
  ex.fillStyle = '#1c7a3c';
  [[140,200,80,50],[220,230,65,45],[320,180,55,40],[430,190,75,55],[540,210,55,45],[640,200,50,40],
   [700,260,60,70],[760,300,55,60],[480,340,55,40],[280,360,50,35],[860,400,55,40],[150,360,60,55],[900,180,60,55]]
   .forEach(([x,y,w,h]) => { ex.beginPath(); ex.ellipse(x, y, w, h, 0, 0, Math.PI * 2); ex.fill(); });
  ex.fillStyle = 'rgba(255,255,255,0.45)';
  for (let i = 0; i < 60; i++) {
    ex.beginPath();
    ex.ellipse(Math.random() * 1024, Math.random() * 512, 15 + Math.random() * 55, 8 + Math.random() * 20, Math.random() * Math.PI, 0, Math.PI * 2);
    ex.fill();
  }
  const earthTex = new THREE.CanvasTexture(eCanvas);
  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1.9, 64, 64),
    new THREE.MeshPhongMaterial({ map: earthTex, shininess: 20, specular: 0x224466 })
  );
  scene.add(earth);

  // Atmosphäre
  const atmo = new THREE.Mesh(
    new THREE.SphereGeometry(2.05, 48, 48),
    new THREE.MeshBasicMaterial({ color: 0x3fa9ff, transparent: true, opacity: 0.18, side: THREE.BackSide })
  );
  scene.add(atmo);

  // Ring mit Text
  const rc = document.createElement('canvas'); rc.width = 4096; rc.height = 128;
  const rx = rc.getContext('2d');
  rx.clearRect(0, 0, 4096, 128);
  rx.font = 'bold 56px monospace';
  rx.fillStyle = '#66e0ff';
  rx.textAlign = 'center'; rx.textBaseline = 'middle';
  rx.shadowColor = '#00aaff'; rx.shadowBlur = 18;
  const txt = 'HALIL DONMA  •  HALDO AI OS PRO MAX  •  ';
  rx.fillText(txt, 1024, 64);
  rx.fillText(txt, 3072, 64);
  const ringTex = new THREE.CanvasTexture(rc);
  ringTex.wrapS = THREE.RepeatWrapping;
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(3.4, 0.06, 12, 220),
    new THREE.MeshBasicMaterial({ map: ringTex, transparent: true, color: 0x66e0ff, side: THREE.DoubleSide })
  );
  ring.rotation.x = Math.PI / 2.1;
  ring.position.y = 0.4;
  scene.add(ring);

  // Mond
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 24, 24),
    new THREE.MeshPhongMaterial({ color: 0xbbbbbb, shininess: 5 })
  );
  scene.add(moon);

  // Lichter
  scene.add(new THREE.AmbientLight(0x223344, 1.3));
  const dl = new THREE.DirectionalLight(0xffffff, 1.1);
  dl.position.copy(sunPos); scene.add(dl);

  // Animation
  let t0 = Date.now();
  function animate() {
    requestAnimationFrame(animate);
    earth.rotation.y += 0.0012;
    atmo.rotation.y = earth.rotation.y;
    ring.rotation.z += 0.0018;
    ringTex.offset.x += 0.0006;
    const tt = (Date.now() - t0) * 0.00025;
    moon.position.set(4.8 * Math.cos(tt), 0.6 + 0.3 * Math.sin(tt * 1.7), 4.8 * Math.sin(tt));
    stars.rotation.y += 0.00008;
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });
}

function openApp(appId) {
  const app = APPS.find(a => a.id === appId);
  if (!app) return;
  document.getElementById('startmenu').classList.remove('open');
  let win = document.getElementById('win-' + appId);
  if (win) {
    win.classList.remove('minimized');
    win.style.zIndex = ++state.zIndex;
    renderTaskbar();
    return;
  }
  win = document.createElement('div');
  win.className = 'window';
  win.id = 'win-' + appId;
  const idx = Object.keys(state.openWindows).length;
  const off = (idx % 7) * 28;
  win.style.left = (70 + off) + 'px';
  win.style.top  = (60 + off) + 'px';
  win.style.width  = '920px';
  win.style.height = '600px';
  win.style.zIndex = ++state.zIndex;
  win.innerHTML =
    '<div class="win-header">' +
      '<span class="win-title">' + app.icon + ' ' + app.name + '</span>' +
      '<div class="win-controls">' +
        '<button data-act="min" title="Minimize">—</button>' +
        '<button data-act="max" title="Maximize">▢</button>' +
        '<button data-act="close" title="Close">✕</button>' +
      '</div>' +
    '</div>' +
    '<div class="win-body">' +
      '<div class="app-sidebar"></div>' +
      '<div class="app-content"></div>' +
    '</div>';
  document.getElementById('windows').appendChild(win);
  state.openWindows[appId] = win;

  // Controls
  win.querySelector('[data-act="min"]').onclick = e => { e.stopPropagation(); win.classList.toggle('minimized'); renderTaskbar(); };
  win.querySelector('[data-act="max"]').onclick = e => {
    e.stopPropagation();
    if (win.dataset.max === '1') {
      win.style.left = win.dataset.l; win.style.top = win.dataset.t;
      win.style.width = win.dataset.w; win.style.height = win.dataset.h;
      win.dataset.max = '0';
    } else {
      win.dataset.l = win.style.left; win.dataset.t = win.style.top;
      win.dataset.w = win.style.width; win.dataset.h = win.style.height;
      win.style.left = '0'; win.style.top = '40px';
      win.style.width = '100vw'; win.style.height = 'calc(100vh - 90px)';
      win.dataset.max = '1';
    }
  };
  win.querySelector('[data-act="close"]').onclick = e => {
    e.stopPropagation();
    if (win._cleanup) win._cleanup();
    win.remove();
    delete state.openWindows[appId];
    renderTaskbar();
  };
  win.onmousedown = () => { win.style.zIndex = ++state.zIndex; };

  // Drag
  const header = win.querySelector('.win-header');
  let drag = null;
  header.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    drag = { x: e.clientX, y: e.clientY, l: win.offsetLeft, t: win.offsetTop };
    win.style.zIndex = ++state.zIndex;
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    win.style.left = (drag.l + e.clientX - drag.x) + 'px';
    win.style.top  = Math.max(40, drag.t + e.clientY - drag.y) + 'px';
  });
  window.addEventListener('mouseup', () => { drag = null; });

  // Render app
  const sidebar = win.querySelector('.app-sidebar');
  const content = win.querySelector('.app-content');
  try {
    app.render(sidebar, content, win);
  } catch (err) {
    content.innerHTML = '<p style="color:#ff7777">Fehler: ' + err.message + '</p>';
    console.error(err);
  }
  renderTaskbar();
}

function renderTaskbar() {
  const tb = document.getElementById('taskbar');
  tb.innerHTML = '';
  Object.keys(state.openWindows).forEach(id => {
    const app = APPS.find(a => a.id === id);
    const win = state.openWindows[id];
    if (!app) return;
    const b = document.createElement('button');
    b.className = 'task-btn' + (win.classList.contains('minimized') ? '' : ' active');
    b.textContent = app.icon + ' ' + app.name;
    b.onclick = () => {
      if (win.classList.contains('minimized')) {
        win.classList.remove('minimized');
        win.style.zIndex = ++state.zIndex;
      } else if (win.style.zIndex == state.zIndex) {
        win.classList.add('minimized');
      } else {
        win.style.zIndex = ++state.zIndex;
      }
      renderTaskbar();
    };
    tb.appendChild(b);
  });
}

function crudApp(cfg) {
  return function (sidebar, content) {
    const key = 'crud_' + cfg.id;
    let items = store(key, cfg.initial || []);
    let selectedId = items[0] ? items[0].id : null;
    const fields = cfg.fields || [
      { name: 'title', label: 'Name' },
      { name: 'desc', label: 'Beschreibung' }
    ];
    const persist = () => save(key, items);

    const tabs = ['create', 'edit', 'select', 'settings', 'delete'];
    let active = 'select';

    function renderSidebar() {
      sidebar.innerHTML = '';
      tabs.forEach(tab => {
        const b = document.createElement('button');
        b.className = 'side-btn' + (active === tab ? ' active' : '');
        b.textContent = t(tab);
        b.onclick = () => { active = tab; renderBody(); };
        sidebar.appendChild(b);
      });
      if (cfg.extraTabs) {
        cfg.extraTabs.forEach(x => {
          const b = document.createElement('button');
          b.className = 'side-btn';
          b.textContent = x.label;
          b.onclick = () => x.fn(content);
          sidebar.appendChild(b);
        });
      }
      const sb = document.createElement('button');
      sb.className = 'side-btn speak-btn';
      sb.textContent = '🔊 ' + t('speak');
      sb.onclick = () => speak(cfg.id + '. ' + items.length + ' Einträge.');
      sidebar.appendChild(sb);
    }

    function renderBody() {
      renderSidebar();
      content.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'app-panel';

      if (active === 'create') {
        box.innerHTML = '<h3>' + t('create') + '</h3>';
        const form = document.createElement('form');
        fields.forEach(f => {
          const inp = document.createElement('input');
          inp.name = f.name; inp.placeholder = f.label;
          form.appendChild(inp);
        });
        const btn = document.createElement('button');
        btn.textContent = t('save');
        form.appendChild(btn);
        form.onsubmit = e => {
          e.preventDefault();
          const item = { id: Date.now() };
          fields.forEach(f => item[f.name] = form.querySelector('[name="' + f.name + '"]').value);
          items.push(item); persist();
          form.reset();
          flash(box, '✓ ' + t('save'));
        };
        box.appendChild(form);
      } else if (active === 'edit') {
        box.innerHTML = '<h3>' + t('edit') + '</h3>';
        if (items.length === 0) { box.innerHTML += '<p class="muted">' + t('noEntries') + '</p>'; }
        else {
          if (!items.find(i => i.id === selectedId)) selectedId = items[0].id;
          const sel = document.createElement('select');
          items.forEach(it => {
            const o = document.createElement('option');
            o.value = it.id; o.textContent = it[fields[0].name] || ('#' + it.id);
            sel.appendChild(o);
          });
          sel.value = selectedId;
          sel.onchange = () => { selectedId = Number(sel.value); renderBody(); };
          box.appendChild(sel);
          const item = items.find(i => i.id === selectedId);
          const form = document.createElement('form');
          fields.forEach(f => {
            const inp = document.createElement('input');
            inp.name = f.name; inp.placeholder = f.label;
            inp.value = item[f.name] || '';
            form.appendChild(inp);
          });
          const btn = document.createElement('button');
          btn.textContent = t('save');
          form.appendChild(btn);
          form.onsubmit = e => {
            e.preventDefault();
            fields.forEach(f => item[f.name] = form.querySelector('[name="' + f.name + '"]').value);
            persist();
            flash(box, '✓ ' + t('save'));
            renderBody();
          };
          box.appendChild(form);
        }
      } else if (active === 'select') {
        box.innerHTML = '<h3>' + t('select') + '</h3>';
        const search = document.createElement('input');
        search.placeholder = '🔍 ' + t('search');
        box.appendChild(search);
        const list = document.createElement('div');
        list.className = 'list';
        const render = () => {
          list.innerHTML = '';
          const q = search.value.toLowerCase();
          const filtered = items.filter(it =>
            !q || fields.some(f => String(it[f.name] || '').toLowerCase().includes(q))
          );
          if (filtered.length === 0) {
            list.innerHTML = '<p class="muted">' + t('noEntries') + '</p>';
            return;
          }
          filtered.forEach(it => {
            const row = document.createElement('div');
            row.className = 'list-row';
            row.innerHTML = '<span>' + esc(it[fields[0].name] || '—') + '</span>' +
              '<span class="muted">' + esc(it[fields[1] ? fields[1].name : ''] || '') + '</span>';
            row.onclick = () => { selectedId = it.id; active = 'edit'; renderBody(); };
            list.appendChild(row);
          });
        };
        search.oninput = render;
        render();
        box.appendChild(list);
      } else if (active === 'settings') {
        box.innerHTML = '<h3>' + t('settings') + '</h3>';
        box.innerHTML += '<p>' + t('total') + ': <b>' + items.length + '</b></p>';
        const exp = document.createElement('button');
        exp.textContent = '⬇ Export JSON';
        exp.onclick = () => {
          const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = cfg.id + '_export.json'; a.click();
        };
        box.appendChild(exp);
        const imp = document.createElement('input');
        imp.type = 'file'; imp.accept = '.json';
        imp.onchange = () => {
          const file = imp.files[0]; if (!file) return;
          const fr = new FileReader();
          fr.onload = () => {
            try {
              const data = JSON.parse(fr.result);
              if (Array.isArray(data)) { items = data; persist(); renderBody(); }
            } catch (e) { alert('Ungültige Datei'); }
          };
          fr.readAsText(file);
        };
        box.appendChild(imp);
        const wipe = document.createElement('button');
        wipe.className = 'danger';
        wipe.textContent = '🗑 Alles löschen';
        wipe.onclick = () => {
          if (confirm(t('confirm'))) { items = []; persist(); renderBody(); }
        };
        box.appendChild(wipe);
      } else if (active === 'delete') {
        box.innerHTML = '<h3>' + t('delete') + '</h3>';
        if (items.length === 0) { box.innerHTML += '<p class="muted">' + t('noEntries') + '</p>'; }
        items.forEach(it => {
          const row = document.createElement('div');
          row.className = 'list-row';
          row.innerHTML = '<span>' + esc(it[fields[0].name] || '—') + '</span>';
          const del = document.createElement('button');
          del.className = 'danger'; del.textContent = '✕';
          del.onclick = () => {
            if (confirm(t('confirm'))) {
              items = items.filter(x => x.id !== it.id);
              persist(); renderBody();
            }
          };
          row.appendChild(del);
          box.appendChild(row);
        });
      }
      content.appendChild(box);
    }

    renderBody();
  };
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function flash(el, msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'color:#66e0ff;font-size:12px;margin-top:6px;';
  el.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}

// ---------- A: AI Assistant ----------
function renderAI(sidebar, content) {
  let chats = store('ai_chats', [{ id: 1, name: 'Neuer Chat', messages: [] }]);
  let currentId = chats[0].id;
  let active = 'chat';

  function persist() { save('ai_chats', chats); }

  function renderSidebar() {
    sidebar.innerHTML = '';
    [['chat', '💬 Chat'], ['templates', '📋 Vorlagen'], ['settings', '⚙ Einstellungen'], ['delete', '🗑 Löschen']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active === id ? ' active' : '');
      b.textContent = label;
      b.onclick = () => { active = id; render(); };
      sidebar.appendChild(b);
    });
    const sb = document.createElement('button');
    sb.className = 'side-btn speak-btn';
    sb.textContent = '🔊 ' + t('speak');
    sb.onclick = () => {
      const chat = chats.find(c => c.id === currentId);
      const last = chat && chat.messages.length ? chat.messages[chat.messages.length - 1].text : 'Bereit.';
      speak(last);
    };
    sidebar.appendChild(sb);
  }

  function render() {
    renderSidebar();
    content.innerHTML = '';
    if (active === 'chat') {
      const wrap = document.createElement('div');
      wrap.className = 'chat-box';
      const log = document.createElement('div');
      log.className = 'chat-log';
      const chat = chats.find(c => c.id === currentId) || chats[0];
      if (!chat.messages.length) {
        chat.messages.push({ role: 'ai', text: 'Hallo! Ich bin HalDo AI. Stelle mir eine Frage – oder nutze die Sprachsteuerung.' });
        persist();
      }
      chat.messages.forEach(m => {
        const d = document.createElement('div');
        d.className = 'msg ' + m.role;
        d.textContent = m.text;
        log.appendChild(d);
      });
      wrap.appendChild(log);
      const inputRow = document.createElement('div');
      inputRow.className = 'chat-input';
      const input = document.createElement('input');
      input.placeholder = 'Nachricht eingeben…';
      const send = document.createElement('button');
      send.textContent = '➤';
      const sendMsg = () => {
        const v = input.value.trim();
        if (!v) return;
        chat.messages.push({ role: 'user', text: v });
        persist();
        // Antwort-Generierung
        const apiKey = store('api_key', '');
        setTimeout(() => {
          let reply;
          if (apiKey) {
            reply = 'API-Key erkannt. (Live-Anbindung folgt – dies ist der Demo-Modus.) Deine Nachricht: "' + v + '"';
          } else {
            reply = demotextAI(v);
          }
          chat.messages.push({ role: 'ai', text: reply });
          persist();
          render();
          speak(reply);
        }, 250);
        input.value = '';
        render();
      };
      send.onclick = sendMsg;
      input.onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
      inputRow.appendChild(input);
      inputRow.appendChild(send);
      wrap.appendChild(inputRow);
      content.appendChild(wrap);
    } else if (active === 'templates') {
      content.innerHTML = '<h3>📋 Prompt-Vorlagen</h3>';
      ['Erkläre mir die Anatomie des Herzens', 'Erstelle einen Arztbrief', 'Fasse folgenden Text zusammen: ', 'Übersetze ins Kurdische: ', 'Erfinde eine Geschichte über den Mond'].forEach(tpl => {
        const row = document.createElement('div');
        row.className = 'list-row';
        row.textContent = tpl;
        row.onclick = () => {
          const chat = chats.find(c => c.id === currentId);
          chat.messages.push({ role: 'user', text: tpl });
          chat.messages.push({ role: 'ai', text: 'Antwort folgt…' });
          persist(); active = 'chat'; render();
        };
        content.appendChild(row);
      });
      const newBtn = document.createElement('button');
      newBtn.textContent = '+ Neuer Chat';
      newBtn.onclick = () => {
        const id = Date.now();
        chats.push({ id, name: 'Chat ' + chats.length, messages: [] });
        currentId = id; persist(); render();
      };
      content.appendChild(newBtn);
    } else if (active === 'settings') {
      content.innerHTML = '<h3>⚙ KI-Einstellungen</h3>';
      const key = document.createElement('input');
      key.placeholder = 'API-Key (Gemini / HalDo)';
      key.value = store('api_key', '');
      content.appendChild(key);
      const model = document.createElement('select');
      ['HalDo Nano', 'Gemini Pro', 'GPT-4', 'Local Offline'].forEach(m => {
        const o = document.createElement('option'); o.textContent = m; model.appendChild(o);
      });
      content.appendChild(model);
      const b = document.createElement('button');
      b.textContent = t('save');
      b.onclick = () => { save('api_key', key.value); flash(content, '✓ Gespeichert'); };
      content.appendChild(b);
      content.innerHTML += '<p class="muted">Voice-Einstellungen findest du unter ⚙ System Center → Stimme.</p>';
    } else if (active === 'delete') {
      content.innerHTML = '<h3>🗑 Chats löschen</h3>';
      chats.forEach(c => {
        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = '<span>' + esc(c.name) + ' (' + c.messages.length + ')</span>';
        const d = document.createElement('button');
        d.className = 'danger'; d.textContent = '✕';
        d.onclick = () => {
          if (confirm(t('confirm'))) {
            chats = chats.filter(x => x.id !== c.id);
            if (chats.length === 0) chats = [{ id: Date.now(), name: 'Neuer Chat', messages: [] }];
            currentId = chats[0].id;
            persist(); render();
          }
        };
        row.appendChild(d);
        content.appendChild(row);
      });
    }
  }
  render();
}
function demotextAI(q) {
  const ql = q.toLowerCase();
  if (/hallo|hi|hey/.test(ql)) return 'Hallo! Wie kann ich dir helfen?';
  if (/herz/.test(ql)) return 'Das Herz ist ein muskuläres Hohlorgan, das sauerstoffarmes Blut aus dem Körper und sauerstoffreiches Blut aus der Lunge pumpt. Es besteht aus vier Kammern: zwei Vorhöfen und zwei Ventrikeln.';
  if (/arztbrief|bericht/.test(ql)) return 'Sehr geehrte Kollegin, sehr geehrter Kollege, hiermit berichten wir über den stationären Aufenthalt des Patienten. Diagnose: … Therapie: … Empfehlung: …';
  if (/übersetze/.test(ql)) return 'Übersetzungsmodus aktiv. Bitte gib den Zielsprachen-Code (z.B. "ku") vor dem Text an.';
  if (/mond|stern|kosmos/.test(ql)) return 'Der Mond umkreist die Erde in ca. 27,3 Tagen. Er ist der einzige natürliche Satellit der Erde.';
  return 'Interessante Frage: "' + q + '". Im Demo-Modus antworte ich mit einer vorbereiteten Antwort. Trage in den Einstellungen einen API-Key ein, um die Live-KI zu aktivieren.';
}

// ---------- H: Health & Medical ----------
function renderHealth(sidebar, content) {
  const sections = [
    ['anatomy', '🧬 3D Anatomie'],
    ['diseases', '🦠 Krankheiten A–Z'],
    ['meds', '💊 Medikamente A–Z'],
    ['labs', '🧪 Laborwerte A–Z'],
    ['symptoms', '🤒 Symptome'],
    ['vitals', '❤ Vitalwerte'],
    ['allergies', '⚠ Allergien'],
    ['emergency', '🚨 Notfallkontakte'],
    ['vaccines', '💉 Impfpass'],
  ];
  let active = 'anatomy';

  function renderSidebar() {
    sidebar.innerHTML = '';
    sections.forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active === id ? ' active' : '');
      b.textContent = label;
      b.onclick = () => { active = id; render(); };
      sidebar.appendChild(b);
    });
    const sb = document.createElement('button');
    sb.className = 'side-btn speak-btn';
    sb.textContent = '🔊 ' + t('speak');
    sb.onclick = () => speak('HalDo Arztbuch. 3D Anatomie und medizinische Datenbanken.');
    sidebar.appendChild(sb);
  }

  function render() {
    renderSidebar();
    // Cleanup previous renderer
    if (content._cleanup) { try { content._cleanup(); } catch (e) {} content._cleanup = null; }
    content.innerHTML = '';
    if (active === 'anatomy') {
      const wrap = document.createElement('div');
      wrap.className = 'anatomy-wrap';
      content.appendChild(wrap);
      initAnatomy(wrap);
    } else {
      const cfg = {
        diseases: { key: 'health_diseases', fields: [{ name: 'name', label: 'Krankheit' }, { name: 'icd', label: 'ICD-10' }, { name: 'desc', label: 'Beschreibung' }] },
        meds: { key: 'health_meds', fields: [{ name: 'name', label: 'Medikament' }, { name: 'dose', label: 'Dosierung' }, { name: 'info', label: 'Info' }] },
        labs: { key: 'health_labs', fields: [{ name: 'name', label: 'Laborwert' }, { name: 'value', label: 'Wert' }, { name: 'unit', label: 'Einheit' }] },
        symptoms: { key: 'health_symptoms', fields: [{ name: 'name', label: 'Symptom' }, { name: 'severity', label: 'Schwere' }, { name: 'note', label: 'Notiz' }] },
        vitals: { key: 'health_vitals', fields: [{ name: 'name', label: 'Vitalwert (z.B. Blutdruck)' }, { name: 'value', label: 'Wert' }, { name: 'date', label: 'Datum' }] },
        allergies: { key: 'health_allergies', fields: [{ name: 'name', label: 'Allergie' }, { name: 'reaction', label: 'Reaktion' }] },
        emergency: { key: 'health_emergency', fields: [{ name: 'name', label: 'Name' }, { name: 'phone', label: 'Telefon' }, { name: 'relation', label: 'Beziehung' }] },
        vaccines: { key: 'health_vaccines', fields: [{ name: 'name', label: 'Impfung' }, { name: 'date', label: 'Datum' }, { name: 'next', label: 'Nächste' }] },
      }[active];
      if (cfg) renderSimpleCRUD(content, cfg);
    }
  }

  function renderSimpleCRUD(container, cfg) {
    let items = store(cfg.key, []);
    const persist = () => save(cfg.key, items);
    const panel = document.createElement('div');
    panel.className = 'app-panel';
    panel.innerHTML = '<h3>' + sections.find(s => s[0] === active)[1] + '</h3>';

    // Add form
    const form = document.createElement('form');
    cfg.fields.forEach(f => {
      const inp = document.createElement('input');
      inp.name = f.name; inp.placeholder = f.label;
      form.appendChild(inp);
    });
    const addBtn = document.createElement('button');
    addBtn.textContent = '＋ ' + t('add');
    form.appendChild(addBtn);
    form.onsubmit = e => {
      e.preventDefault();
      const item = { id: Date.now() };
      cfg.fields.forEach(f => item[f.name] = form.querySelector('[name="' + f.name + '"]').value);
      items.push(item); persist();
      form.reset();
      renderList();
    };
    panel.appendChild(form);

    const list = document.createElement('div');
    list.className = 'list';
    panel.appendChild(list);

    function renderList() {
      list.innerHTML = '';
      if (items.length === 0) { list.innerHTML = '<p class="muted">' + t('noEntries') + '</p>'; return; }
      items.forEach(it => {
        const row = document.createElement('div');
        row.className = 'list-row';
        const vals = cfg.fields.map(f => esc(it[f.name] || '')).join(' · ');
        row.innerHTML = '<span>' + vals + '</span>';
        const d = document.createElement('button');
        d.className = 'danger'; d.textContent = '✕';
        d.onclick = e => {
          e.stopPropagation();
          if (confirm(t('confirm'))) { items = items.filter(x => x.id !== it.id); persist(); renderList(); }
        };
        row.appendChild(d);
        list.appendChild(row);
      });
    }
    renderList();
    container.appendChild(panel);
  }

  function initAnatomy(wrap) {
    if (typeof THREE === 'undefined') {
      wrap.innerHTML = '<p style="padding:20px;color:#ff8888">Three.js nicht geladen.</p>';
      return;
    }
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setClearColor(0x001122, 1);
    wrap.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
    camera.position.set(0, 1.2, 4);
    camera.lookAt(0, 0.7, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dl = new THREE.DirectionalLight(0xffffff, 1.1);
    dl.position.set(2, 4, 3); scene.add(dl);
    const dl2 = new THREE.DirectionalLight(0x88ccff, 0.5);
    dl2.position.set(-3, 1, -2); scene.add(dl2);

    const skeleton = new THREE.Group();
    const organs = new THREE.Group();
    const bones = new THREE.MeshStandardMaterial({ color: 0xeeeecc, roughness: 0.6, metalness: 0.1 });

    // Skull
    const skull = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 24), bones);
    skull.position.y = 1.5; skeleton.add(skull);
    // Spine
    for (let i = 0; i < 8; i++) {
      const v = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.09, 12), bones);
      v.position.y = 1.2 - i * 0.11; skeleton.add(v);
    }
    // Ribs
    for (let i = 0; i < 5; i++) {
      const rib = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.018, 8, 22, Math.PI), bones);
      rib.position.y = 1.1 - i * 0.1;
      rib.rotation.y = Math.PI / 2; skeleton.add(rib);
    }
    // Pelvis
    const pelvis = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 8, 20), bones);
    pelvis.position.y = 0.42; pelvis.rotation.x = Math.PI / 2; skeleton.add(pelvis);
    // Arms
    const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.75, 12), bones);
    armL.position.set(0.38, 1.0, 0); skeleton.add(armL);
    const armR = armL.clone(); armR.position.x = -0.38; skeleton.add(armR);
    // Legs
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.95, 12), bones);
    legL.position.set(0.12, 0, 0); skeleton.add(legL);
    const legR = legL.clone(); legR.position.x = -0.12; skeleton.add(legR);
    scene.add(skeleton);

    // Organs
    const brain = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 20), new THREE.MeshStandardMaterial({ color: 0xff88aa, roughness: 0.5 }));
    brain.position.y = 1.5; organs.add(brain);
    const heart = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.35 }));
    heart.position.set(0.05, 1.0, 0.02); organs.add(heart);
    const lungL = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffaabb, roughness: 0.5 }));
    lungL.position.set(0.16, 1.05, 0); lungL.scale.set(1, 1.4, 1); organs.add(lungL);
    const lungR = lungL.clone(); lungR.position.x = -0.16; organs.add(lungR);
    const liver = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), new THREE.MeshStandardMaterial({ color: 0x884422, roughness: 0.5 }));
    liver.position.set(-0.08, 0.75, 0); liver.scale.set(1.3, 0.7, 1); organs.add(liver);
    const stomach = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xddaa66, roughness: 0.5 }));
    stomach.position.set(0.08, 0.7, 0); organs.add(stomach);
    const intest = new THREE.Mesh(new THREE.TorusKnotGeometry(0.1, 0.03, 60, 8), new THREE.MeshStandardMaterial({ color: 0xdd8888, roughness: 0.6 }));
    intest.position.y = 0.45; organs.add(intest);
    scene.add(organs);

    // Layer-Toggles
    const tg = document.createElement('div');
    tg.className = 'layer-toggles';
    tg.innerHTML =
      '<label><input type="checkbox" data-layer="sk" checked> Skelett</label>' +
      '<label><input type="checkbox" data-layer="or" checked> Organe</label>';
    tg.querySelectorAll('input').forEach(cb => {
      cb.onchange = () => {
        if (cb.dataset.layer === 'sk') skeleton.visible = cb.checked;
        if (cb.dataset.layer === 'or') organs.visible = cb.checked;
      };
    });
    wrap.appendChild(tg);

    let rot = 0;
    let raf;
    function animate() {
      raf = requestAnimationFrame(animate);
      rot += 0.006;
      skeleton.rotation.y = rot; organs.rotation.y = rot;
      renderer.render(scene, camera);
    }
    animate();

    const ro = new ResizeObserver(() => {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (w && h) {
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    });
    ro.observe(wrap);

    content._cleanup = () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      renderer.dispose();
    };
  }

  render();
}

// ---------- C: Calendar ----------
function renderCalendar(sidebar, content) {
  let events = store('cal_events', []);
  let active = 'select';
  let viewDate = new Date();

  function persist() { save('cal_events', events); }

  function renderSidebar() {
    sidebar.innerHTML = '';
    [['create', '➕ ' + t('create')], ['select', '📅 Kalender'], ['settings', '⚙ Einstellungen'], ['delete', '🗑 Löschen']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active === id ? ' active' : '');
      b.textContent = label;
      b.onclick = () => { active = id; render(); };
      sidebar.appendChild(b);
    });
    const sb = document.createElement('button');
    sb.className = 'side-btn speak-btn';
    sb.textContent = '🔊 ' + t('speak');
    sb.onclick = () => speak('Kalender. ' + events.length + ' Termine.');
    sidebar.appendChild(sb);
  }

  function render() {
    renderSidebar();
    content.innerHTML = '';
    if (active === 'select') {
      const head = document.createElement('div');
      head.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:10px;';
      const prev = document.createElement('button'); prev.textContent = '◀';
      prev.onclick = () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1); render(); };
      const next = document.createElement('button'); next.textContent = '▶';
      next.onclick = () => { viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1); render(); };
      const title = document.createElement('h3');
      title.style.margin = '0'; title.style.flex = '1';
      title.textContent = viewDate.toLocaleString(state.lang, { month: 'long', year: 'numeric' });
      head.appendChild(prev); head.appendChild(title); head.appendChild(next);
      content.appendChild(head);
      const grid = document.createElement('div');
      grid.className = 'cal-grid';
      ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].forEach(d => {
        const c = document.createElement('div');
        c.className = 'cal-head'; c.textContent = d; grid.appendChild(c);
      });
      const y = viewDate.getFullYear(), m = viewDate.getMonth();
      const first = new Date(y, m, 1);
      const startDay = (first.getDay() + 6) % 7;
      const days = new Date(y, m + 1, 0).getDate();
      const today = new Date();
      for (let i = 0; i < startDay; i++) grid.appendChild(document.createElement('div'));
      for (let d = 1; d <= days; d++) {
        const c = document.createElement('div');
        c.className = 'cal-cell';
        const dt = new Date(y, m, d);
        if (dt.toDateString() === today.toDateString()) c.classList.add('today');
        c.innerHTML = '<div class="day">' + d + '</div>';
        const key = dt.toISOString().slice(0, 10);
        events.filter(e => e.date === key).forEach(e => {
          const ev = document.createElement('div');
          ev.style.cssText = 'font-size:10px;background:rgba(30,110,170,0.7);color:#fff;padding:1px 3px;margin-top:2px;border-radius:2px;';
          ev.textContent = e.title;
          c.appendChild(ev);
        });
        c.onclick = () => {
          const title2 = prompt('Termin am ' + d + '.' + (m + 1) + '.' + y + ':', '');
          if (title2) {
            events.push({ id: Date.now(), title: title2, date: key });
            persist(); render();
          }
        };
        grid.appendChild(c);
      }
      content.appendChild(grid);
    } else if (active === 'create') {
      content.innerHTML = '<h3>' + t('create') + ' Termin</h3>';
      const form = document.createElement('form');
      const tIn = document.createElement('input'); tIn.placeholder = 'Titel'; tIn.name = 'title'; form.appendChild(tIn);
      const dIn = document.createElement('input'); dIn.type = 'date'; dIn.name = 'date'; dIn.value = new Date().toISOString().slice(0, 10); form.appendChild(dIn);
      const b = document.createElement('button'); b.textContent = t('save'); form.appendChild(b);
      form.onsubmit = e => {
        e.preventDefault();
        events.push({ id: Date.now(), title: tIn.value, date: dIn.value });
        persist(); flash(content, '✓ Gespeichert');
        active = 'select'; render();
      };
      content.appendChild(form);
    } else if (active === 'settings') {
      content.innerHTML = '<h3>⚙ Kalender</h3><p>Termine: ' + events.length + '</p>';
    } else if (active === 'delete') {
      content.innerHTML = '<h3>🗑 Termine löschen</h3>';
      events.forEach(ev => {
        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = '<span>' + esc(ev.title) + '</span><span class="muted">' + ev.date + '</span>';
        const d = document.createElement('button'); d.className = 'danger'; d.textContent = '✕';
        d.onclick = () => {
          if (confirm(t('confirm'))) { events = events.filter(x => x.id !== ev.id); persist(); render(); }
        };
        row.appendChild(d);
        content.appendChild(row);
      });
    }
  }
  render();
}

function renderTasks(sidebar, content) {
  let tasks = store('tasks', []);
  let active = 'select';
  function persist() { save('tasks', tasks); }
  function renderSidebar() {
    sidebar.innerHTML = '';
    [['create', '➕ ' + t('create')], ['select', '✅ Aufgaben'], ['settings', '⚙ Einstellungen'], ['delete', '🗑 Löschen']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active === id ? ' active' : '');
      b.textContent = label; b.onclick = () => { active = id; render(); };
      sidebar.appendChild(b);
    });
    const sb = document.createElement('button');
    sb.className = 'side-btn speak-btn';
    sb.textContent = '🔊 ' + t('speak');
    sb.onclick = () => speak('Aufgaben. ' + tasks.filter(x => !x.done).length + ' offen.');
    sidebar.appendChild(sb);
  }
  function render() {
    renderSidebar(); content.innerHTML = '';
    if (active === 'create') {
      content.innerHTML = '<h3>＋ Neue Aufgabe</h3>';
      const form = document.createElement('form');
      const i = document.createElement('input'); i.placeholder = 'Aufgabe'; form.appendChild(i);
      const d = document.createElement('input'); d.type = 'date'; form.appendChild(d);
      const b = document.createElement('button'); b.textContent = t('save'); form.appendChild(b);
      form.onsubmit = e => {
        e.preventDefault();
        tasks.push({ id: Date.now(), text: i.value, date: d.value, done: false });
        persist(); i.value = ''; flash(content, '✓ ' + t('save'));
      };
      content.appendChild(form);
    } else if (active === 'select') {
      content.innerHTML = '<h3>✅ Aufgaben (' + tasks.filter(x => !x.done).length + ' offen)</h3>';
      const list = document.createElement('div'); list.className = 'list';
      tasks.forEach(tk => {
        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = '<span style="' + (tk.done ? 'text-decoration:line-through;opacity:0.5' : '') + '">' + esc(tk.text) + '</span><span class="muted">' + (tk.date || '') + '</span>';
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = tk.done;
        cb.onchange = () => { tk.done = cb.checked; persist(); render(); };
        row.insertBefore(cb, row.firstChild);
        list.appendChild(row);
      });
      content.appendChild(list);
    } else if (active === 'settings') {
      content.innerHTML = '<h3>⚙ Aufgaben</h3><p>Gesamt: ' + tasks.length + ', Offen: ' + tasks.filter(x => !x.done).length + '</p>';
      const b = document.createElement('button');
      b.textContent = 'Alle als erledigt markieren';
      b.onclick = () => { tasks.forEach(x => x.done = true); persist(); render(); };
      content.appendChild(b);
    } else if (active === 'delete') {
      content.innerHTML = '<h3>🗑 Löschen</h3>';
      tasks.forEach(tk => {
        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = '<span>' + esc(tk.text) + '</span>';
        const d = document.createElement('button'); d.className = 'danger'; d.textContent = '✕';
        d.onclick = () => { if (confirm(t('confirm'))) { tasks = tasks.filter(x => x.id !== tk.id); persist(); render(); } };
        row.appendChild(d); content.appendChild(row);
      });
    }
  }
  render();
}

      content.innerHTML = '<h3>⚙ Dokumente</h3><p>Anzahl: ' + docs.length + '</p>';

        const row = document.createElement('div');
        row.className = 'list-row';
        row.innerHTML = '<span>' + esc(d.title) + '</span>';
        const b = document.createElement('button'); b.className = 'danger'; b.textContent = '✕';
        b.onclick = () => { if (confirm(t('confirm'))) { docs = docs.filter(x => x.id !== d.id); if (docs.length === 0) docs = [{ id: Date.now(), title: 'Neu', body: '' }]; currentId = docs[0].id; persist(); render(); } };
        row.appendChild(b); content.appendChild(row);
      });
    }
  }
  render();
}

      ci.oninput = () => {
        try { cr.textContent = '= ' + Function('"use strict";return(' + ci.value.replace(/[^0-9+\-*/(). ]/g, '') + ')')(); }
        catch { cr.textContent = ''; }
      };
      calc.appendChild(ci); calc.appendChild(cr);
      grid.appendChild(calc);
      // Timer
      const timer = document.createElement('div'); timer.className = 'qt-panel';
      timer.innerHTML = '<h4>⏱ Timer</h4>';
      const ti = document.createElement('input'); ti.type = 'number'; ti.placeholder = 'Sekunden'; ti.value = 60;
      const tbtn = document.createElement('button'); tbtn.textContent = 'Start';
      const tout = document.createElement('div'); tout.style.cssText = 'margin-top:6px;color:#66e0ff;font-size:16px;font-weight:700;';
      tbtn.onclick = () => {
        let s = parseInt(ti.value) || 0;
        tout.textContent = s + 's';
        const iv = setInterval(() => {
          s--; tout.textContent = s + 's';
          if (s <= 0) { clearInterval(iv); tout.textContent = '⏰ Fertig!'; speak('Timer beendet'); }
        }, 1000);
      };
      timer.appendChild(ti); timer.appendChild(tbtn); timer.appendChild(tout);
      grid.appendChild(timer);
      // Umrechner
      const conv = document.createElement('div'); conv.className = 'qt-panel';
      conv.innerHTML = '<h4>📏 Umrechner</h4>';

      const cSel = document.createElement('select');
      [['km_m', 'km → m'], ['m_cm', 'm → cm'], ['kg_g', 'kg → g'], ['C_F', '°C → °F'], ['F_C', '°F → °C'], ['EUR_USD', 'EUR → USD'], ['USD_EUR', 'USD → EUR']].forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; cSel.appendChild(o); });
      const cOut = document.createElement('div'); cOut.style.cssText = 'margin-top:6px;color:#66e0ff;font-size:16px;font-weight:700;';
      function doConv() {
        const v = parseFloat(cIn.value) || 0;
        const map = { km_m: v => v * 1000, m_cm: v => v * 100, kg_g: v => v * 1000, C_F: v => v * 9 / 5 + 32, F_C: v => (v - 32) * 5 / 9, EUR_USD: v => v * 1.08, USD_EUR: v => v / 1.08 };
        cOut.textContent = '= ' + map[cSel.value](v).toFixed(2);
      }
      cIn.oninput = doConv; cSel.onchange = doConv; doConv();
      conv.appendChild(cIn); conv.appendChild(cSel); conv.appendChild(cOut);
      grid.appendChild(conv);
      // Passwortgenerator
      const pw = document.createElement('div'); pw.className = 'qt-panel';
      pw.innerHTML = '<h4>🔑 Passwort</h4>';
      const pwBtn = document.createElement('button'); pwBtn.textContent = 'Generieren';

      pwBtn.onclick = () => {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
        let p = '';
        for (let i = 0; i < 20; i++) p += chars[Math.floor(Math.random() * chars.length)];
        pwOut.textContent = p;
      };
      pw.appendChild(pwBtn); pw.appendChild(pwOut);
      grid.appendChild(pw);
      content.appendChild(grid);

// ---------- Recorder ----------
function renderRecorder(sidebar, content) {
  let recordings = store('recordings', []);
  let active = 'select';
  let mediaRecorder = null;
  let chunks = [];
  function renderSidebar() {
    sidebar.innerHTML = '';
    [['select', '🎙 Aufnahmen'], ['create', '⏺ Aufnahme'], ['settings', '⚙ Audio'], ['delete', '🗑 Löschen']].forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'side-btn' + (active === id ? ' active' : '');
      b.textContent = label; b.onclick = () => { active = id; render(); };
      sidebar.appendChild(b);
    });
    const sb = document.createElement('button');
    sb.className = 'side-btn speak-btn';
    sb.textContent = '🔊 ' + t('speak');
    sb.onclick = () => speak('Recorder. ' + recordings.length + ' Aufnahmen.');
    sidebar.appendChild(sb);
  }
  function render() {
    renderSidebar(); content.innerHTML = '';
    if (active === 'create') {
      content.innerHTML = '<h3>⏺ Aufnahme</h3>';
      const start = document.createElement('button'); start.textContent = '⏺ Start';
      const stop = document.createElement('button'); stop.textContent = '⏹ Stop';
      const status = document.createElement('div'); status.style.marginTop = '10px'; status.style.color = '#66e0ff';
      start.onclick = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];
          mediaRecorder.ondataavailable = e => chunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            recordings.push({ id: Date.now(), url, name: 'Aufnahme ' + new Date().toLocaleTimeString() });
            save('recordings', recordings);
            status.textContent = '✓ Aufnahme gespeichert';
            stream.getTracks().forEach(t => t.stop());
            active = 'select'; render();
          };
          mediaRecorder.start();
          status.textContent = '⏺ Aufnahme läuft…';
        } catch (e) { status.textContent = 'Mikrofon nicht verfügbar: ' + e.message; }
      };
      stop.onclick = () => { if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); };
      content.appendChild(start); content.appendChild(stop); content.appendChild(status);
    } else if (active === 'select') {
      content.innerHTML = '<h3>🎙 Aufnahmen</h3>';
      recordings.forEach(r => {
        const panel = document.createElement('div'); panel.className = 'qt-panel'; panel.style.marginBottom = '6px';
        panel.innerHTML = '<h4>' + esc(r.name) + '</h4>';
        const a = document.createElement('audio'); a.controls = true; a.src = r.url; a.style.width = '100%';
        panel.appendChild(a);
        content.appendChild(panel);
      });
      if (recordings.length === 0) content.innerHTML += '<p class="muted">Keine Aufnahmen.</p>';
    } else if (active === 'settings') {
      content.innerHTML = '<h3>⚙ Audio-Format</h3><p class="muted">WebM, MP3, WAV.</p>';
    } else {
      content.innerHTML = '<h3>🗑 Löschen</h3>';
      recordings.forEach(r => {
        const row = document.createElement('div'); row.className = 'list-row';
        row.innerHTML = '<span>' + esc(r.name) + '</span>';
        const b = document.createElement('button'); b.className = 'danger'; b.textContent = '✕';
        b.onclick = () => { if (confirm(t('confirm'))) { recordings = recordings.filter(x => x.id !== r.id); save('recordings', recordings); render(); } };
        row.appendChild(b); content.appendChild(row);
      });
    }
  }
  render();
}

// ============================================================
// START MENU + LANGUAGE + CLOCK
// ============================================================
function buildStartMenu() {
  const grid = document.getElementById('startGrid');
  grid.innerHTML = '';
  APPS.forEach(app => {
    const tile = document.createElement('div');
    tile.className = 'app-tile';
    tile.innerHTML = '<div class="letter">' + app.letter + '</div>' +
                     '<div class="icon">' + app.icon + '</div>' +
                     '<div>' + app.name + '</div>';
    tile.onclick = () => openApp(app.id);
    grid.appendChild(tile);
  });
}

function setLang(lang) {
  state.lang = lang;
  localStorage.setItem('haldo_lang', lang);
  document.getElementById('langSelect').value = lang;
  // Alle offenen Fenster neu rendern
  Object.keys(state.openWindows).forEach(id => {
    const app = APPS.find(a => a.id === id);
    const win = state.openWindows[id];
    if (!app || !win) return;
    const sidebar = win.querySelector('.app-sidebar');
    const content = win.querySelector('.app-content');
    if (win._cleanup) { try { win._cleanup(); } catch (e) {} win._cleanup = null; }
    sidebar.innerHTML = ''; content.innerHTML = '';
    try { app.render(sidebar, content, win); } catch (e) { content.innerHTML = '<p style="color:#f77">' + e.message + '</p>'; }
  });
}

function buildLangSelect() {
  const sel = document.getElementById('langSelect');
  sel.innerHTML = '';
  Object.keys(LANGNAMES).forEach(code => {
    const o = document.createElement('option');
    o.value = code; o.textContent = LANGNAMES[code];
    if (code === state.lang) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => setLang(sel.value);
}

function startClock() {
  const el = document.getElementById('clock');
  const tick = () => {
    const d = new Date();
    el.textContent = d.toLocaleTimeString(state.lang, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  };
  tick(); setInterval(tick, 1000);
}

// ============================================================
// INIT
// ============================================================
function init() {
  initCosmos();
  buildStartMenu();
  buildLangSelect();
  startClock();
  renderTaskbar();

  document.getElementById('startBtn').onclick = () => {
    document.getElementById('startmenu').classList.toggle('open');
  };
  document.addEventListener('click', e => {
    const sm = document.getElementById('startmenu');
    const sb = document.getElementById('startBtn');
    if (sm.classList.contains('open') && !sm.contains(e.target) && e.target !== sb) {
      sm.classList.remove('open');
    }
  });
  document.getElementById('voiceToggle').onclick = () => {
    state.ttsEnabled = !state.ttsEnabled;
    document.getElementById('voiceToggle').textContent = state.ttsEnabled ? '🔊' : '🔇';
    if (!state.ttsEnabled) stopSpeak();
  };
}

document.addEventListener('DOMContentLoaded', init);
</script>
