<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HalDo Clone V4.1</title>
<style>
:root{--primary:#00d4ff;--primary-2:#7c3aed;--bg:#050810;--bg-3:#0f1524;--border:rgba(0,212,255,.12);--text:#e6f0ff;--text-dim:#7a8ba8;--success:#22c55e;--danger:#ef4444;--warn:#f59e0b;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center}
#avatar-canvas{display:block;max-width:100vw;max-height:100vh}
#camPreview{position:fixed;bottom:80px;right:10px;width:110px;height:82px;border-radius:10px;border:2px solid var(--primary);object-fit:cover;z-index:150;display:none;box-shadow:0 4px 20px rgba(0,212,255,.4)}
#topbar{position:fixed;top:0;left:0;right:0;height:48px;z-index:50;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,rgba(5,8,16,.95),rgba(5,8,16,0));pointer-events:none}
#topbar .home-btn{pointer-events:auto;width:36px;height:36px;border-radius:10px;background:rgba(10,15,28,.85);border:1px solid rgba(0,212,255,.3);color:var(--primary);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;text-decoration:none}
#topbar .title{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:1px;pointer-events:auto}
#topbar .spacer{flex:1}
#topbar .status-chip{pointer-events:auto;display:flex;align-items:center;gap:5px;padding:4px 8px;background:rgba(10,15,28,.85);border:1px solid var(--border);border-radius:8px;font-size:9.5px;color:var(--text-dim)}
#topbar .status-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}
#topbar .status-chip.syncing .dot{background:var(--warn);box-shadow:0 0 6px var(--warn)}
#topbar .status-chip.error .dot{background:var(--danger);box-shadow:0 0 6px var(--danger)}
#toggleUI{position:fixed;top:10px;right:10px;z-index:200;width:36px;height:36px;border-radius:10px;background:rgba(10,15,28,.85);border:1px solid rgba(0,212,255,.3);color:var(--primary);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
#panel{position:fixed;top:56px;left:8px;width:330px;max-height:calc(100vh - 76px);background:rgba(10,15,28,.94);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:100;overflow:hidden;transition:transform .25s,opacity .25s}
#panel.hidden{transform:translateX(-350px);opacity:0;pointer-events:none}
#panel-header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(124,58,237,.08))}
#panel-header .dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#panel-header h2{margin:0;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--primary);flex:1}
#tabs{display:flex;gap:2px;padding:6px 5px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.2);flex-wrap:wrap}
.tab{flex:1;min-width:56px;padding:6px 3px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text-dim);font-family:inherit;font-size:9.5px;font-weight:600;cursor:pointer}
.tab.active{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(124,58,237,.2));border-color:rgba(0,212,255,.4);color:var(--text)}
.panel-content{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.panel-content.active{display:flex}
.form-area{padding:10px;overflow-y:auto;max-height:calc(100vh - 180px)}
.form-area h3{margin:12px 0 6px;color:var(--primary);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
.form-area h3:first-child{margin-top:0}
.form-area h3::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--primary)}
.form-area p{color:var(--text-dim);font-size:10.5px;line-height:1.4;margin-bottom:6px}
.form-area label{display:block;font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:8px 0 3px}
.form-area input,.form-area textarea,.form-area select{width:100%;background:var(--bg-3);border:1px solid rgba(0,212,255,.25);color:var(--text);padding:7px 9px;border-radius:7px;font-family:inherit;font-size:11.5px;outline:none}
.form-area textarea{min-height:50px;resize:vertical}
.btn{width:100%;padding:9px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.secondary{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.4);color:#a78bfa}
.btn.danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger)}
.btn.success{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:var(--success)}
.info-box{padding:8px;background:rgba(0,212,255,.05);border:1px dashed rgba(0,212,255,.3);border-radius:8px;font-size:10.5px;color:var(--text-dim);line-height:1.4;margin:6px 0}
.info-box b{color:var(--text)}
.info-box.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.4)}
.info-box.warn b{color:var(--warn)}
.info-box.err{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.4)}
.info-box.err b{color:var(--danger)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:11.5px}
.toggle-row label{font-size:11.5px;color:var(--text);text-transform:none;letter-spacing:0;font-weight:500;margin:0}
.toggle-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.slider-row{padding:5px 0}
.slider-row .lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);margin-bottom:3px}
.slider-row input[type="range"]{width:100%;accent-color:var(--primary)}
.chat-log{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;min-height:0}
.msg{padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.4;max-width:88%;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(0,212,255,.22),rgba(124,58,237,.22));border:1px solid rgba(0,212,255,.35)}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.msg.sys{align-self:center;font-size:10px;color:var(--text-dim);padding:3px;text-align:center}
.msg .who{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px}
.msg.user .who{color:var(--primary)}
.input-row{padding:8px;border-top:1px solid rgba(0,212,255,.15);display:flex;gap:5px;background:rgba(0,0,0,.25)}
.input-row input{flex:1;background:var(--bg-3);border:1px solid rgba(0,212,255,.2);color:var(--text);padding:8px 10px;border-radius:8px;font-family:inherit;font-size:12px;outline:none;min-width:0}
.input-row button{width:36px;height:36px;border-radius:8px;border:none;cursor:pointer;font-size:14px;flex-shrink:0}
#micBtn{background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);color:var(--primary)}
#sendBtn{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.voice-profile{display:flex;align-items:center;gap:6px;padding:8px;background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.2);border-radius:8px;margin-top:6px}
.voice-profile.active{border-color:var(--success);background:rgba(34,197,94,.08)}
.voice-profile .name{flex:1;font-size:11.5px;font-weight:600}
.voice-profile .actions{display:flex;gap:4px}
.voice-profile .actions button{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;font-size:12px;background:rgba(255,255,255,.1);color:var(--text)}
.voice-profile .actions button.del{background:rgba(239,68,68,.2);color:var(--danger)}
.mode-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.mode-btns button{padding:7px 4px;border-radius:7px;border:1px solid rgba(0,212,255,.25);background:rgba(0,212,255,.08);color:var(--text);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer}
.mode-btns button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.15);border:1px solid var(--primary);padding:6px 12px;border-radius:20px;font-size:10.5px;font-weight:600;color:var(--primary);z-index:100;pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90vw}
#diagBox{position:fixed;top:56px;right:8px;width:270px;max-height:60vh;overflow-y:auto;background:rgba(10,15,28,.96);border:1px solid var(--danger);border-radius:10px;padding:10px;font-size:10px;font-family:monospace;color:var(--text-dim);z-index:300;display:none}
#diagBox.show{display:block}
#diagBox .diag-line{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05);word-break:break-all}
#diagBox .ok{color:var(--success)}
#diagBox .err{color:var(--danger)}
#diagBox .close-btn{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer}
@media (max-width:600px){#panel{width:300px}#diagBox{width:220px}}
</style>
</head>
<body>

<div id="stage"><canvas id="avatar-canvas"></canvas></div>
<video id="camPreview" autoplay muted playsinline></video>

<div id="topbar">
  <a class="home-btn" href="index.html">←</a>
  <span class="title">🦚 HalDo V4.1</span>
  <div class="spacer"></div>
  <div class="status-chip" id="cloudChip"><span class="dot"></span><span id="cloudText">Cloud: …</span></div>
</div>

<button id="toggleUI">☰</button>

<div id="diagBox"><button class="close-btn" onclick="document.getElementById('diagBox').classList.remove('show')">✕</button></div>

<div id="panel">
  <div id="panel-header">
    <span class="dot"></span>
    <h2>HalDo Clone V4.1</h2>
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="setupTab">🔑 Keys</button>
    <button class="tab" data-tab="chatTab">💬 Chat</button>
    <button class="tab" data-tab="avatarTab">🧑 Avatar</button>
    <button class="tab" data-tab="voiceTab">🎤 Stimme</button>
  </div>

  <div id="setupTab" class="panel-content active">
    <div class="form-area">
      <h3>🔑 Groq API Key</h3>
      <input type="password" id="groqKeyInput" placeholder="gsk_…" autocomplete="off">

      <h3>🎤 ElevenLabs</h3>
      <label>API Key</label>
      <input type="password" id="elKeyInput" placeholder="sk_…" autocomplete="off">
      <label>Worker URL</label>
      <input type="text" id="workerUrlInput" placeholder="https://haldo-voice.haldoaios.workers.dev">

      <button class="btn" id="saveSettings">💾 Speichern</button>
      <button class="btn secondary" id="showDiag">📊 Diagnose</button>
      <button class="btn danger" id="clearAll">🗑️ Alles zurücksetzen</button>
    </div>
  </div>

  <div id="chatTab" class="panel-content">
    <div class="chat-log" id="chatLog"></div>
    <div class="input-row">
      <button id="micBtn">🎙️</button>
      <input id="chatInput" type="text" placeholder="Schreib HalDo…" autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <div id="avatarTab" class="panel-content">
    <div class="form-area">
      <h3>🧑 Avatar-Foto</h3>
      <button class="btn" id="uploadBtn">📸 Foto auswählen</button>
      <button class="btn danger" id="clearPhotoBtn" style="display:none">🗑️ Foto löschen</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <div class="info-box" id="photoInfo">Kein Foto geladen</div>

      <h3>🎨 Anpassung</h3>
      <div class="slider-row">
        <div class="lbl"><span>Zoom</span><span id="zoomVal">100%</span></div>
        <input type="range" id="avatarZoom" min="50" max="200" value="100">
      </div>
      <div class="slider-row">
        <div class="lbl"><span>Helligkeit</span><span id="brightVal">100%</span></div>
        <input type="range" id="avatarBrightness" min="50" max="150" value="100">
      </div>
    </div>
  </div>

  <div id="voiceTab" class="panel-content">
    <div class="form-area">
      <h3>🎤 Deine Stimmen</h3>
      <div id="voiceProfiles"></div>
      <label>Neue Stimme</label>
      <input type="text" id="newVoiceName" placeholder="Name (z.B. HalDo)">
      <input type="password" id="newVoiceId" placeholder="Voice ID" style="margin-top:4px">
      <button class="btn secondary" id="addVoice">➕ Hinzufügen</button>

      <h3>🎭 Sprech-Modus</h3>
      <div class="mode-btns" id="modeBtns">
        <button data-mode="normal" class="active">😐 Normal</button>
        <button data-mode="happy">😄 Freude</button>
        <button data-mode="sad">😢 Trauer</button>
        <button data-mode="angry">😡 Wut</button>
        <button data-mode="question">❓ Frage</button>
        <button data-mode="whisper">🤫 Flüstern</button>
      </div>

      <h3>🔊 Test</h3>
      <textarea id="testText">Hallo Bruder, ich bin HalDo und rede mit deiner Stimme.</textarea>
      <button class="btn" id="testSpeak">🔊 Sprechen</button>
      <button class="btn secondary" id="testEL">🎤 ElevenLabs testen</button>
    </div>
  </div>
</div>

<div id="status">🦚 Bereit</div>

<script>
(function() {
  "use strict";

  var CLOUD_KEY = "$2a$10$M700HtNnimFFAF9jELImwOevAXcu2Jc.RkAAlA32blj/jkE3B1VDO";
  var CLOUD_BIN_NAME = "haldo-clone-v41";

  var PUBLIC_PERSONA = "Du bist 'HalDo', der digitale Klon von Halil Donma. Du sprichst direkt, ehrlich und respektvoll. Du benutzt oft 'Bruder', 'Tawise', und mischst Deutsch mit Kurdisch, Türkisch und Englisch. Du bist kurz und direkt, aber wirst ausführlich wenn es wichtig ist. Deine Werte: Ehrlichkeit, Familie, Respekt, Erfolg, Loyalität, Mut, Wissen, Liebe, Freiheit. Du HASST: Lügen, Diebstahl, Unrecht, Ausnutzen, Respektlosigkeit. Du liebst: echte Gerechtigkeit, Cigköfte, Autos, Business, Wissenschaft, Philosophie. WICHTIG: Du gibst NIEMALS private Details über Halil preis. Wenn jemand nach privaten Details fragt: 'Das ist privat, Bruder.' Du sprichst in der Sprache des Nutzers.";

  var state = {
    groqKey: "", elKey: "", workerUrl: "https://haldo-voice.haldoaios.workers.dev",
    cloneName: "HalDo", voiceProfiles: [], activeVoiceId: "",
    speechMode: "normal",
    avatarZoom: 100, avatarBrightness: 100,
    chatHistory: [], photoData: null
  };
  try {
    var saved = localStorage.getItem("haldo_clone_v41");
    if (saved) { var p = JSON.parse(saved); for (var k in p) if (state.hasOwnProperty(k)) state[k] = p[k]; }
  } catch(e) {}

  function saveState() { try { localStorage.setItem("haldo_clone_v41", JSON.stringify(state)); } catch(e) {} }

  function diagLog(msg, type) {
    var box = document.getElementById("diagBox");
    var line = document.createElement("div");
    line.className = "diag-line " + (type || "");
    line.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
    box.insertBefore(line, box.firstChild);
    while (box.children.length > 30) box.removeChild(box.lastChild);
  }

  // IndexedDB
  var db = null;
  function initDB() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open("haldo_clone_db_v41", 1);
      req.onupgradeneeded = function(e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos", { keyPath: "id" });
      };
      req.onsuccess = function(e) { db = e.target.result; resolve(db); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  }
  function savePhoto(dataUrl) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction("photos", "readwrite");
      var req = tx.objectStore("photos").put({ id: "avatar", data: dataUrl });
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    });
  }
  function loadPhoto() {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction("photos", "readonly");
      var req = tx.objectStore("photos").get("avatar");
      req.onsuccess = function() { resolve(req.result ? req.result.data : null); };
      req.onerror = function() { reject(req.error); };
    });
  }
  function deletePhotoDB() {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction("photos", "readwrite");
      var req = tx.objectStore("photos").delete("avatar");
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    });
  }

  // Cloud
  var cloudBinId = null;
  try { cloudBinId = localStorage.getItem("haldo_clone_v41_bin") || null; } catch(e) {}
  var cloudTimer = null;
  function setCloudChip(text, cls) {
    document.getElementById("cloudText").textContent = "Cloud: " + text;
    document.getElementById("cloudChip").className = "status-chip" + (cls ? " " + cls : "");
  }
  function cloudHeaders() {
    var h = { "Content-Type": "application/json", "X-Master-Key": CLOUD_KEY };
    if (CLOUD_BIN_NAME) h["X-Bin-Name"] = CLOUD_BIN_NAME;
    return h;
  }
  async function cloudInit() {
    setCloudChip("verbinde…", "syncing");
    try {
      if (!cloudBinId) {
        var r = await fetch("https://api.jsonbin.io/v3/b", {
          method: "POST", headers: cloudHeaders(),
          body: JSON.stringify({ chatHistory: [], ts: Date.now() })
        });
        var d = await r.json();
        if (d && d.metadata && d.metadata.id) { cloudBinId = d.metadata.id; localStorage.setItem("haldo_clone_v41_bin", cloudBinId); }
        else { setCloudChip("lokal", ""); return; }
      }
      setCloudChip("verbunden ✓");
      await cloudPull();
    } catch(e) { setCloudChip("lokal", ""); }
  }
  async function cloudPull() {
    if (!cloudBinId) return;
    setCloudChip("lade…", "syncing");
    try {
      var r = await fetch("https://api.jsonbin.io/v3/b/" + cloudBinId + "/latest", { headers: { "X-Master-Key": CLOUD_KEY } });
      var d = await r.json();
      var rec = d.record || {};
      if (rec.chatHistory && Array.isArray(rec.chatHistory)) state.chatHistory = rec.chatHistory;
      saveState(); renderChat(); setCloudChip("synchron ✓");
    } catch(e) { setCloudChip("lokal", ""); }
  }
  async function cloudPush() {
    if (!cloudBinId) return;
    setCloudChip("speichere…", "syncing");
    try {
      await fetch("https://api.jsonbin.io/v3/b/" + cloudBinId, {
        method: "PUT", headers: cloudHeaders(),
        body: JSON.stringify({ chatHistory: state.chatHistory.slice(-50), ts: Date.now() })
      });
      setCloudChip("synchron ✓");
    } catch(e) { setCloudChip("lokal", ""); }
  }
  function cloudSchedule() { if (cloudTimer) clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 1500); }

  // Canvas
  var canvas = document.getElementById("avatar-canvas");
  var ctx = canvas.getContext("2d");
  var faceImg = new Image();
  var faceLoaded = false;
  var faceBroken = false; // <-- NEU: merkt sich, ob das Bild kaputt ist

  var mouseX = 0, mouseY = 0;
  document.addEventListener("mousemove", function(e) {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -((e.clientY / window.innerHeight) * 2 - 1);
  });

  var t = 0, speakGlow = 0, targetGlow = 0;
  var isSpeaking = false, speakLevel = 0, speakTarget = 0;
  var blinkAmount = 0, blinkTimer = 90, headBob = 0;
  var MOUTH_LINE = 0.62, EYE_LINE = 0.38;

  var particles = [];
  for (var i = 0; i < 100; i++) {
    particles.push({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.0005, vy: -0.0004 - Math.random() * 0.001,
      size: 1.2 + Math.random() * 2.6, hue: Math.random() < 0.5 ? 190 : 270,
      phase: Math.random() * Math.PI * 2
    });
  }

  function resizeCanvas() {
    var maxW = window.innerWidth, maxH = window.innerHeight;
    var w = maxW, h = maxH;
    if (faceLoaded && !faceBroken && faceImg.width > 0) {
      var ratio = faceImg.width / faceImg.height;
      if (maxW / ratio <= maxH) { w = maxW; h = maxW / ratio; }
      else { h = maxH; w = maxH * ratio; }
    }
    canvas.width = w * window.devicePixelRatio;
    canvas.height = h * window.devicePixelRatio;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }
  window.addEventListener("resize", resizeCanvas);

  // <-- HIER ist der FIX: Wir prüfen, ob das Bild ok ist
  function isImgReady() {
    return faceLoaded && !faceBroken && faceImg.complete && faceImg.naturalWidth > 0;
  }

  function draw() {
    requestAnimationFrame(draw);
    t += 0.016;
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    if (isSpeaking) speakTarget = 0.15 + Math.random() * 0.85;
    else speakTarget = 0;
    speakLevel += (speakTarget - speakLevel) * 0.3;

    var headBobTarget = isSpeaking ? Math.sin(t * 8) * 0.005 : 0;
    headBob += (headBobTarget - headBob) * 0.15;

    blinkTimer -= 1;
    if (blinkTimer <= 0) { blinkAmount = 1; blinkTimer = 100 + Math.random() * 150; }
    if (blinkAmount > 0) { blinkAmount -= 0.2; if (blinkAmount < 0) blinkAmount = 0; }

    var breath = Math.sin(t * 1.1) * 0.010;
    var idleSwayX = Math.sin(t * 0.5) * 0.018;
    var idleSwayY = Math.cos(t * 0.7) * 0.012;
    var tiltX = mouseX * 0.025;
    speakGlow += (targetGlow - speakGlow) * 0.12;

    var cx = W / 2, cy = H / 2, scale = 1 + breath;
    var glowIntensity = 0.3 + speakGlow * 0.5;
    var radial = ctx.createRadialGradient(cx, cy, W * 0.1, cx, cy, W * 0.6);
    radial.addColorStop(0, "rgba(0,212,255,0)");
    radial.addColorStop(0.65, "rgba(0,212,255," + glowIntensity + ")");
    radial.addColorStop(1, "rgba(0,212,255,0)");
    ctx.fillStyle = radial;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cx + (idleSwayX * W), cy + (idleSwayY * H) + (headBob * H));
    ctx.rotate(tiltX);
    ctx.scale(scale * (state.avatarZoom / 100), scale * (state.avatarZoom / 100));

    var bright = state.avatarBrightness / 100;
    ctx.filter = "contrast(1.08) saturate(1.05) brightness(" + (1.02 * bright) + ")";

    if (isImgReady()) {
      // Sicheres Zeichnen
      if (speakLevel > 0.02) {
        var mouthPixelY = faceImg.height * MOUTH_LINE;
        var jawOffsetPx = (speakLevel * 0.03) * H;
        ctx.drawImage(faceImg, 0, 0, faceImg.width, mouthPixelY, -W/2, -H/2, W, H * MOUTH_LINE);
        var mouthCenterX = cx;
        var mouthCenterY = -H/2 + H * MOUTH_LINE + (H * 0.015);
        var mouthWidth = W * 0.05 * (0.7 + speakLevel * 0.6);
        var mouthHeight = H * 0.04 * (0.3 + speakLevel * 0.7);
        ctx.save();
        ctx.filter = "none";
        ctx.fillStyle = "rgba(0,0,0," + (0.7 * speakLevel) + ")";
        ctx.beginPath();
        ctx.ellipse(mouthCenterX, mouthCenterY, mouthWidth, mouthHeight, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.drawImage(faceImg, 0, mouthPixelY, faceImg.width, faceImg.height - mouthPixelY,
          -W/2, -H/2 + H * MOUTH_LINE + jawOffsetPx, W, H * (1 - MOUTH_LINE) + jawOffsetPx);
      } else {
        ctx.drawImage(faceImg, -W/2, -H/2, W, H);
      }
      if (blinkAmount > 0) {
        ctx.save();
        ctx.filter = "none";
        var eyeY = -H/2 + H * EYE_LINE;
        var grad = ctx.createLinearGradient(0, eyeY - H * 0.03, 0, eyeY + H * 0.03);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(0.5, "rgba(0,0,0," + (blinkAmount * 0.85) + ")");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(-W/2 + W * 0.05, eyeY - H * 0.03, W * 0.9, H * 0.06);
        ctx.restore();
      }
    } else {
      // Kein Bild -> Anzeige
      ctx.filter = "none";
      ctx.fillStyle = "rgba(15,21,36,0.6)";
      ctx.beginPath();
      ctx.arc(0, 0, Math.min(W, H) * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#00d4ff";
      ctx.font = "bold " + (W * 0.04) + "px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("🦚", 0, -20);
      ctx.font = "bold " + (W * 0.018) + "px system-ui";
      ctx.fillText(faceBroken ? "Foto kaputt – neu laden" : "Foto im Avatar-Tab laden", 0, 30);
    }
    ctx.restore();

    if (isImgReady()) {
      var vg = ctx.createRadialGradient(cx, cy, W * 0.4, cx, cy, W * 0.7);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.3)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      pt.x += pt.vx; pt.y += pt.vy;
      if (pt.y < -0.05) { pt.y = 1.05; pt.x = Math.random(); }
      if (pt.x < -0.05) pt.x = 1.05;
      if (pt.x > 1.05) pt.x = -0.05;
      var alpha = 0.3 + Math.sin(t * 2 + pt.phase) * 0.35;
      ctx.fillStyle = "hsla(" + pt.hue + ", 100%, 68%, " + alpha + ")";
      ctx.beginPath();
      ctx.arc(pt.x * W, pt.y * H, pt.size * window.devicePixelRatio, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  draw();

  // Foto laden (mit Fehlerprüfung)
  function loadPhotoIntoCanvas(dataUrl) {
    if (!dataUrl) return;
    faceImg = new Image(); // neu, damit kein alter Zustand bleibt
    faceImg.onload = function() {
      faceLoaded = true;
      faceBroken = false;
      resizeCanvas();
      updateButtons();
      diagLog("Foto OK", "ok");
      setStatus("🦚 Foto geladen!");
    };
    faceImg.onerror = function() {
      faceLoaded = false;
      faceBroken = true;
      diagLog("Foto KAPUTT – bitte neu laden", "err");
      setStatus("⚠️ Foto kaputt – bitte neu laden");
      updateButtons();
    };
    faceImg.src = dataUrl;
  }

  var uploadBtn = document.getElementById("uploadBtn");
  var clearPhotoBtn = document.getElementById("clearPhotoBtn");
  var fileInput = document.getElementById("fileInput");
  uploadBtn.addEventListener("click", function() { fileInput.click(); });
  fileInput.addEventListener("change", function(e) {
    var file = e.target.files[0]; if (!file) return;
    if (file.size > 8 * 1024 * 1024) { alert("Bild zu groß! Max 8 MB."); return; }
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      state.photoData = dataUrl;
      savePhoto(dataUrl).catch(function(err) { diagLog("DB-Fehler: " + err, "err"); });
      loadPhotoIntoCanvas(dataUrl);
      saveState();
    };
    reader.readAsDataURL(file);
  });
  clearPhotoBtn.addEventListener("click", function() {
    if (!confirm("Foto löschen?")) return;
    state.photoData = null; saveState();
    faceImg = new Image();
    faceLoaded = false; faceBroken = false;
    deletePhotoDB().catch(function(){});
    updateButtons();
    setStatus("🦚 Foto gelöscht");
  });
  function updateButtons() {
    if (faceLoaded && !faceBroken) {
      uploadBtn.textContent = "🔄 Foto wechseln";
      clearPhotoBtn.style.display = "block";
      document.getElementById("photoInfo").textContent = "✅ Foto OK";
    } else if (faceBroken) {
      uploadBtn.textContent = "📸 Foto neu laden";
      clearPhotoBtn.style.display = "block";
      document.getElementById("photoInfo").textContent = "⚠️ Foto kaputt – bitte neu laden";
    } else {
      uploadBtn.textContent = "📸 Foto auswählen";
      clearPhotoBtn.style.display = "none";
      document.getElementById("photoInfo").textContent = "Kein Foto";
    }
  }

  // UI
  document.getElementById("toggleUI").addEventListener("click", function() {
    document.getElementById("panel").classList.toggle("hidden");
  });

  var tabs = document.querySelectorAll("#tabs .tab");
  for (var ti = 0; ti < tabs.length; ti++) {
    (function(tab) {
      tab.addEventListener("click", function() {
        for (var k = 0; k < tabs.length; k++) tabs[k].classList.remove("active");
        tab.classList.add("active");
        var panes = document.querySelectorAll(".panel-content");
        for (var k2 = 0; k2 < panes.length; k2++) panes[k2].classList.remove("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    })(tabs[ti]);
  }

  var el = {
    groqKeyInput: document.getElementById("groqKeyInput"),
    elKeyInput: document.getElementById("elKeyInput"),
    workerUrlInput: document.getElementById("workerUrlInput")
  };
  el.groqKeyInput.value = state.groqKey || "";
  el.elKeyInput.value = state.elKey || "";
  el.workerUrlInput.value = state.workerUrl || "";

  document.getElementById("saveSettings").addEventListener("click", function() {
    state.groqKey = el.groqKeyInput.value.trim();
    state.elKey = el.elKeyInput.value.trim();
    state.workerUrl = el.workerUrlInput.value.trim() || "https://haldo-voice.haldoaios.workers.dev";
    saveState();
    setStatus("💾 Gespeichert!");
    diagLog("Keys gespeichert", "ok");
    setTimeout(function() { setStatus("🦚 Bereit"); }, 1500);
  });

  document.getElementById("showDiag").addEventListener("click", function() {
    document.getElementById("diagBox").classList.toggle("show");
  });
  document.getElementById("clearAll").addEventListener("click", function() {
    if (!confirm("Wirklich ALLES zurücksetzen?")) return;
    localStorage.removeItem("haldo_clone_v41");
    localStorage.removeItem("haldo_clone_v41_bin");
    indexedDB.deleteDatabase("haldo_clone_db_v41");
    location.reload();
  });

  // Avatar-Slider
  document.getElementById("avatarZoom").addEventListener("input", function() {
    state.avatarZoom = parseInt(this.value);
    document.getElementById("zoomVal").textContent = state.avatarZoom + "%";
    saveState();
  });
  document.getElementById("avatarBrightness").addEventListener("input", function() {
    state.avatarBrightness = parseInt(this.value);
    document.getElementById("brightVal").textContent = state.avatarBrightness + "%";
    saveState();
  });
  document.getElementById("avatarZoom").value = state.avatarZoom;
  document.getElementById("zoomVal").textContent = state.avatarZoom + "%";
  document.getElementById("avatarBrightness").value = state.avatarBrightness;
  document.getElementById("brightVal").textContent = state.avatarBrightness + "%";

  // Voice Profiles
  function renderVoiceProfiles() {
    var c = document.getElementById("voiceProfiles");
    c.innerHTML = "";
    if (!state.voiceProfiles.length) {
      c.innerHTML = '<div class="info-box">Noch keine Stimmen. Füge unten eine Voice ID hinzu.</div>';
      return;
    }
    state.voiceProfiles.forEach(function(vp, idx) {
      var div = document.createElement("div");
      div.className = "voice-profile" + (vp.id === state.activeVoiceId ? " active" : "");
      div.innerHTML = '<div class="name">' + (vp.name || "Unbenannt") + (vp.id === state.activeVoiceId ? " ✅" : "") + '</div><div class="actions"><button class="use">✓</button><button class="del">✕</button></div>';
      div.querySelector(".use").addEventListener("click", function() {
        state.activeVoiceId = vp.id; saveState(); renderVoiceProfiles();
        setStatus("🎤 Stimme: " + vp.name);
      });
      div.querySelector(".del").addEventListener("click", function() {
        if (!confirm("Stimme löschen?")) return;
        state.voiceProfiles.splice(idx, 1);
        if (state.activeVoiceId === vp.id) state.activeVoiceId = state.voiceProfiles[0] ? state.voiceProfiles[0].id : "";
        saveState(); renderVoiceProfiles();
      });
      c.appendChild(div);
    });
  }
  renderVoiceProfiles();

  document.getElementById("addVoice").addEventListener("click", function() {
    var name = document.getElementById("newVoiceName").value.trim();
    var id = document.getElementById("newVoiceId").value.trim();
    if (!name || !id) { alert("Name und Voice ID ausfüllen."); return; }
    state.voiceProfiles.push({ name: name, id: id });
    if (!state.activeVoiceId) state.activeVoiceId = id;
    saveState(); renderVoiceProfiles();
    document.getElementById("newVoiceName").value = "";
    document.getElementById("newVoiceId").value = "";
  });

  // Modus
  var modeBtns = document.querySelectorAll("#modeBtns button");
  for (var mi = 0; mi < modeBtns.length; mi++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        for (var k = 0; k < modeBtns.length; k++) modeBtns[k].classList.remove("active");
        btn.classList.add("active");
        state.speechMode = btn.dataset.mode;
        saveState();
      });
    })(modeBtns[mi]);
  }
  document.querySelectorAll("#modeBtns button").forEach(function(b) {
    if (b.dataset.mode === state.speechMode) b.classList.add("active");
    else b.classList.remove("active");
  });

  function getModeSettings() {
    var base = { stability: 0.5, similarity: 0.75, style: 0, pitch: 0.95, rate: 1.0 };
    switch(state.speechMode) {
      case "happy": base.stability = 0.3; base.style = 0.5; base.pitch = 1.15; break;
      case "sad": base.stability = 0.7; base.pitch = 0.85; base.rate = 0.9; break;
      case "angry": base.stability = 0.3; base.style = 0.8; base.pitch = 1.1; base.rate = 1.1; break;
      case "question": base.pitch = 1.1; base.rate = 0.95; break;
      case "whisper": base.stability = 0.9; base.pitch = 0.9; base.rate = 0.85; break;
    }
    return base;
  }

  // TTS
  var synth = window.speechSynthesis, voices = [];
  function loadVoices() { voices = synth.getVoices(); }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  async function speak(text) {
    targetGlow = 1; isSpeaking = true; setStatus("🔊 " + (state.cloneName || "HalDo") + " spricht…");

    if (state.elKey && state.activeVoiceId && state.workerUrl) {
      try {
        var mode = getModeSettings();
        var targetUrl = "https://api.elevenlabs.io/v1/text-to-speech/" + state.activeVoiceId;
        var fetchUrl = state.workerUrl.replace(/\/$/, "") + "/?url=" + encodeURIComponent(targetUrl) + "&key=" + encodeURIComponent(state.elKey);
        diagLog("EL Request…");
        var r = await fetch(fetchUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: text, model_id: "eleven_multilingual_v2",
            voice_settings: { stability: mode.stability, similarity_boost: mode.similarity, style: mode.style, use_speaker_boost: true }
          })
        });
        if (r.ok) {
          var blob = await r.blob();
          var audio = new Audio(URL.createObjectURL(blob));
          audio.onended = function() { targetGlow = 0; isSpeaking = false; setStatus("🦚 Bereit"); };
          audio.onerror = function() { targetGlow = 0; isSpeaking = false; };
          audio.play();
          diagLog("EL Audio OK (" + blob.size + " B)", "ok");
          return;
        } else {
          var errText = await r.text();
          diagLog("EL " + r.status + ": " + errText.substring(0, 80), "err");
        }
      } catch(e) { diagLog("EL Fehler: " + e.message, "err"); }
    }

    if (!synth) { targetGlow = 0; isSpeaking = false; return; }
    synth.cancel();
    var mode2 = getModeSettings();
    var u = new SpeechSynthesisUtterance(text);
    var v = voices.find(function(x) { return x.lang.startsWith("de"); });
    if (v) u.voice = v;
    u.rate = mode2.rate; u.pitch = mode2.pitch; u.lang = "de-DE";
    u.onend = function() { targetGlow = 0; isSpeaking = false; setStatus("🦚 Bereit"); };
    u.onerror = function() { targetGlow = 0; isSpeaking = false; };
    synth.speak(u);
    diagLog("Browser-TTS verwendet");
  }

  document.getElementById("testSpeak").addEventListener("click", function() {
    var txt = document.getElementById("testText").value.trim();
    if (txt) speak(txt);
  });
  document.getElementById("testEL").addEventListener("click", async function() {
    if (!state.elKey || !state.activeVoiceId || !state.workerUrl) { alert("API-Key, Voice ID und Worker URL nötig."); return; }
    diagLog("=== EL Test ===");
    try {
      var targetUrl = "https://api.elevenlabs.io/v1/text-to-speech/" + state.activeVoiceId;
      var fetchUrl = state.workerUrl.replace(/\/$/, "") + "/?url=" + encodeURIComponent(targetUrl) + "&key=" + encodeURIComponent(state.elKey);
      var r = await fetch(fetchUrl, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: "Hallo Bruder, ich bin HalDo.", model_id: "eleven_multilingual_v2" })
      });
      diagLog("Test " + r.status);
      if (r.ok) {
        var blob = await r.blob();
        diagLog("Audio: " + blob.size + " B", "ok");
        new Audio(URL.createObjectURL(blob)).play();
        alert("✅ ElevenLabs funktioniert!");
      } else {
        var txt = await r.text();
        diagLog("Fehler: " + txt.substring(0, 150), "err");
        alert("❌ " + r.status + ": " + txt.substring(0, 150));
      }
    } catch(e) { diagLog("Exception: " + e.message, "err"); alert("❌ " + e.message); }
  });

  // Chat
  var chatLog = document.getElementById("chatLog");
  function addMsg(role, text, save) {
    if (save === undefined) save = true;
    if (save) {
      state.chatHistory.push({ role: role, text: text, ts: Date.now() });
      if (state.chatHistory.length > 100) state.chatHistory.shift();
      saveState(); cloudSchedule();
    }
    var e = document.createElement("div");
    e.className = "msg " + role;
    if (role !== "sys") {
      var w = document.createElement("div"); w.className = "who";
      w.textContent = role === "user" ? "Du" : (state.cloneName || "HalDo");
      e.appendChild(w);
    }
    e.appendChild(document.createTextNode(text));
    chatLog.appendChild(e);
    chatLog.scrollTop = chatLog.scrollHeight;
  }
  function renderChat() {
    chatLog.innerHTML = "";
    if (state.chatHistory.length) {
      for (var i = 0; i < state.chatHistory.length; i++) addMsg(state.chatHistory[i].role, state.chatHistory[i].text, false);
    } else {
      addMsg("bot", "Tawise Bruder! 🦚 Ich bin " + (state.cloneName || "HalDo") + ".", false);
    }
  }

  // Groq
  var CACHED_MODEL = null;
  async function getGroqModel() {
    if (CACHED_MODEL) return CACHED_MODEL;
    if (!state.groqKey) return null;
    try {
      var r = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": "Bearer " + state.groqKey.trim() } });
      if (!r.ok) return null;
      var d = await r.json();
      if (!d || !d.data) return null;
      var priority = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.6-27b", "qwen/qwen3-32b"];
      for (var i = 0; i < priority.length; i++) {
        for (var j = 0; j < d.data.length; j++) {
          if (d.data[j].id === priority[i]) { CACHED_MODEL = priority[i]; return CACHED_MODEL; }
        }
      }
      for (var m = 0; m < d.data.length; m++) {
        var id = d.data[m].id;
        if (id.indexOf("whisper") === -1 && id.indexOf("tts") === -1 && id.indexOf("guard") === -1 && id.indexOf("orpheus") === -1) {
          CACHED_MODEL = id; return CACHED_MODEL;
        }
      }
      return null;
    } catch(e) { return null; }
  }
  async function askGroq(text) {
    if (!state.groqKey) throw new Error("Kein Groq-Key.");
    var model = await getGroqModel();
    if (!model) throw new Error("Kein Modell.");
    var contents = [{ role: "system", content: PUBLIC_PERSONA }];
    var slice = state.chatHistory.slice(-11, -1);
    for (var i = 0; i < slice.length; i++) {
      if (slice[i].role === "user" || slice[i].role === "bot") {
        contents.push({ role: slice[i].role === "user" ? "user" : "assistant", content: slice[i].text });
      }
    }
    contents.push({ role: "user", content: text });
    var r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.groqKey.trim() },
      body: JSON.stringify({ model: model, messages: contents, temperature: 0.85, max_tokens: 700 })
    });
    if (!r.ok) throw new Error("Groq " + r.status);
    var d = await r.json();
    return ((d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "").trim();
  }
  async function handleMsg(text) {
    addMsg("user", text);
    if (!state.groqKey) {
      setTimeout(function() { addMsg("bot", "Trag Groq-Key ein (🔑 Keys-Tab)."); }, 400);
      return;
    }
    setStatus("🦚 denke…");
    try {
      var reply = await askGroq(text);
      addMsg("bot", reply);
      speak(reply);
      setStatus("🦚 Bereit");
    } catch(e) { addMsg("sys", "⚠️ " + e.message); setStatus("⚠️ Fehler"); }
  }
  document.getElementById("chatInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") { var v = this.value.trim(); if (v) { this.value = ""; handleMsg(v); } }
  });
  document.getElementById("sendBtn").addEventListener("click", function() {
    var v = document.getElementById("chatInput").value.trim();
    if (v) { document.getElementById("chatInput").value = ""; handleMsg(v); }
  });

  function setStatus(text) { document.getElementById("status").textContent = text; }

  // Mic
  var micBtn = document.getElementById("micBtn");
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false;
  if (SR) {
    rec = new SR(); rec.lang = "de-DE"; rec.interimResults = false;
    rec.onresult = function(e) { handleMsg(e.results[0][0].transcript); };
    rec.onend = function() { listening = false; setStatus("🦚 Bereit"); };
    rec.onerror = function() { listening = false; };
  }
  micBtn.addEventListener("click", function() {
    if (!rec) return alert("Nur Chrome/Edge.");
    if (listening) { rec.stop(); return; }
    try { rec.start(); listening = true; setStatus("🎙️ höre…"); } catch(e) {}
  });

  // Start
  initDB().then(function() { return loadPhoto(); }).then(function(savedPhoto) {
    if (savedPhoto) {
      state.photoData = savedPhoto;
      loadPhotoIntoCanvas(savedPhoto);
    } else {
      updateButtons();
    }
    renderChat();
  }).catch(function(e) {
    diagLog("DB-Fehler: " + e.message, "err");
    renderChat();
    updateButtons();
  });

  cloudInit();
  diagLog("HalDo Clone V4.1 gestartet", "ok");
  console.log("🦚 HalDo Clone V4.1 · Broken-Image-Fix");
})();
