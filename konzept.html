<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HalDo Avatar Konzept v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;color:#fff;}

/* === Farbthemen === */
:root{--primary:#00e5ff;--primary-dim:#0088aa;--glow:rgba(0,229,255,.6);--accent:#00ff88;}
body.theme-green{--primary:#00ff88;--primary-dim:#00aa55;--glow:rgba(0,255,136,.6);--accent:#88ff00;}
body.theme-red{--primary:#ff3344;--primary-dim:#aa1122;--glow:rgba(255,51,68,.6);--accent:#ff8800;}
body.theme-gold{--primary:#ffcc00;--primary-dim:#aa8800;--glow:rgba(255,204,0,.6);--accent:#ff8800;}

#stage{position:fixed;inset:0;overflow:hidden;}

/* Himmel */
#sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #0a1a3a 0%, #030612 50%, #000 100%);}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite ease-in-out;}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:1;transform:scale(1.4);}}
.nebula{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:float 25s infinite ease-in-out;}
#neb1{width:400px;height:400px;background:#5a2a8a;left:5%;top:10%;}
#neb2{width:350px;height:350px;background:var(--primary-dim);right:8%;top:40%;animation-direction:reverse;}
#neb3{width:300px;height:300px;background:#8a2a5a;left:40%;bottom:5%;}
@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(50px,-40px);}}

/* Sonne */
#sun{position:absolute;width:120px;height:120px;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #fff 0%, #fff8b0 15%, #ffdd44 40%, #ff9900 70%, #cc2200 100%);
  box-shadow:0 0 60px var(--primary),0 0 120px var(--primary-dim);
  animation:sunPulse 4s infinite ease-in-out;}
@keyframes sunPulse{0%,100%{box-shadow:0 0 60px var(--primary),0 0 120px var(--primary-dim);}50%{box-shadow:0 0 90px var(--primary),0 0 180px var(--primary-dim);}}
.flare{position:absolute;left:50%;top:42%;transform-origin:0 0;width:140px;height:2px;background:linear-gradient(90deg,var(--primary),transparent);border-radius:2px;filter:blur(2px);opacity:.6;}

/* Bahnen & Planeten */
.orbit{position:absolute;left:50%;top:42%;border:1px solid rgba(100,150,220,.12);border-radius:50%;transform:translate(-50%,-50%);}
.planet{position:absolute;border-radius:50%;animation:orbit linear infinite;}

/* === TITEL === */
#title{position:absolute;top:3%;left:50%;transform:translateX(-50%);text-align:center;z-index:30;}
#title h1{font-size:34px;letter-spacing:8px;color:var(--primary);text-shadow:0 0 25px var(--glow);font-weight:900;transition:color .5s,text-shadow .5s;}
#title p{font-size:10px;letter-spacing:6px;color:#88ccff;margin-top:4px;}

/* === AVATAR CONTAINER === */
#avatarStage{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:520px;height:640px;z-index:20;display:flex;align-items:center;justify-content:center;transition:filter .5s;filter:drop-shadow(0 0 45px var(--glow));}

.avatar{width:100%;height:100%;animation:breathe 3.5s infinite ease-in-out;}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-8px) scale(1.01);}}

.avatar svg{width:100%;height:100%;overflow:visible;}

/* Robot-Modus */
.robot-mode .human-face{display:none;}
.robot-mode .robot-face{display:block;}

/* Cyborg-Modus */
.cyborg-mode .human-face{display:block;}
.cyborg-mode .robot-face{display:none;}

/* Glow auf Augen */
.eye-glow{filter:drop-shadow(0 0 12px var(--primary));animation:eyePulse 2s infinite alternate;}
@keyframes eyePulse{0%{opacity:.8;}100%{opacity:1;filter:drop-shadow(0 0 20px var(--primary));}}

/* Atmung für Kopf */
.head-breath{animation:headBreathe 3.5s infinite ease-in-out;transform-origin:center bottom;}
@keyframes headBreathe{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}

/* Antenne */
.antenna{animation:antennaGlow 1.5s infinite alternate;}
@keyframes antennaGlow{0%{opacity:.5;}100%{opacity:1;filter:drop-shadow(0 0 12px var(--primary));}}

/* Schaltkreise */
.circuit{stroke:var(--primary);stroke-width:1.5;fill:none;opacity:.7;stroke-dasharray:5 5;animation:circuitFlow 3s linear infinite;}
@keyframes circuitFlow{to{stroke-dashoffset:20;}}

/* Brust-Ring */
.chest-ring{fill:none;stroke:var(--primary);stroke-width:2;opacity:.9;animation:chestPulse 2s infinite;}
@keyframes chestPulse{0%,100%{stroke-opacity:1;}50%{stroke-opacity:.4;}}

/* Partikel um Avatar */
.particle{position:absolute;width:4px;height:4px;background:var(--primary);border-radius:50%;box-shadow:0 0 10px var(--primary);pointer-events:none;animation:particleFloat 6s infinite ease-in-out;}
@keyframes particleFloat{0%{opacity:0;transform:translate(0,0);}20%{opacity:1;}100%{opacity:0;transform:translate(var(--tx),var(--ty));}}

/* === CONTROL PANEL === */
#controls{position:absolute;top:14%;right:3%;width:230px;background:linear-gradient(135deg,rgba(0,20,45,.9),rgba(0,10,25,.95));border:1.5px solid var(--primary);border-radius:14px;padding:14px;backdrop-filter:blur(15px);box-shadow:0 0 30px var(--glow);z-index:30;transition:border-color .5s,box-shadow .5s;}
#controls h3{font-size:11px;color:var(--primary);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase;transition:color .5s;}
.ctrl-group{margin-bottom:14px;}
.ctrl-group label{font-size:10px;color:#88ccff;letter-spacing:1.5px;display:block;margin-bottom:6px;text-transform:uppercase;}
.ctrl-btn{width:100%;padding:8px 10px;margin:3px 0;background:rgba(0,30,60,.6);border:1px solid var(--primary);color:var(--primary);border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;transition:.2s;text-align:left;}
.ctrl-btn:hover{background:var(--primary);color:#000;box-shadow:0 0 15px var(--glow);}
.ctrl-btn.active{background:var(--primary);color:#000;}
.color-btn{display:inline-block;width:38px;height:38px;margin:4px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;transition:.2s;vertical-align:middle;}
.color-btn:hover{transform:scale(1.15);}
.color-btn.active{border-color:#fff;box-shadow:0 0 20px currentColor;transform:scale(1.15);}

/* Chat-Vorschau */
#chatDemo{position:absolute;bottom:6%;left:3%;width:320px;background:linear-gradient(180deg,rgba(0,20,45,.92),rgba(0,10,25,.96));border:1.5px solid var(--primary);border-radius:14px;padding:12px;backdrop-filter:blur(15px);box-shadow:0 0 30px var(--glow);z-index:25;transition:border-color .5s,box-shadow .5s;}
#chatDemo h3{font-size:11px;color:var(--primary);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:6px;transition:color .5s;}
.status-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);animation:dotPulse 1.5s infinite;}
@keyframes dotPulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.msg{padding:8px 12px;margin:5px 0;border-radius:12px;font-size:12px;line-height:1.4;}
.msg.user{background:rgba(0,80,160,.5);margin-left:auto;max-width:80%;text-align:right;border:1px solid var(--primary);}
.msg.bot{background:rgba(0,200,255,.15);max-width:85%;border:1px solid var(--primary);}
.msg.bot::before{content:'◉ ';color:var(--primary);}

/* Statusbar */
#statusbar{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px 14px;background:rgba(0,15,35,.88);border:1px solid var(--primary);border-radius:30px;backdrop-filter:blur(12px);box-shadow:0 0 25px var(--glow);z-index:30;transition:border-color .5s,box-shadow .5s;}
.status-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:linear-gradient(135deg,rgba(0,60,100,.8),rgba(0,30,60,.8));border:1.5px solid var(--primary);cursor:pointer;transition:.25s;color:var(--primary);}
.status-icon:hover{transform:scale(1.18);box-shadow:0 0 20px var(--glow);background:var(--primary);color:#000;}

/* Info-Box */
#info{position:absolute;top:14%;left:3%;width:230px;background:rgba(0,15,35,.85);border:1px solid var(--primary);border-radius:12px;padding:12px;font-size:11px;z-index:30;backdrop-filter:blur(10px);transition:border-color .5s;}
#info h4{color:var(--primary);font-size:10px;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase;transition:color .5s;}
#info .row{display:flex;justify-content:space-between;padding:3px 0;color:#aaddff;}

@media(max-width:900px){
  #avatarStage{width:340px;height:440px;bottom:0;}
  #controls{width:180px;top:12%;right:2%;padding:10px;transform:scale(.85);transform-origin:top right;}
  #chatDemo{width:240px;left:2%;bottom:5%;transform:scale(.8);transform-origin:bottom left;}
  #info{display:none;}
  #title h1{font-size:20px;letter-spacing:4px;}
  #statusbar{gap:5px;padding:6px 10px;}
  .status-icon{width:26px;height:26px;font-size:11px;}
}
</style>
</head>
<body class="theme-blue">
<div id="stage">
  <div id="sky"></div>
  <div class="nebula" id="neb1"></div>
  <div class="nebula" id="neb2"></div>
  <div class="nebula" id="neb3"></div>

  <!-- Sonne -->
  <div id="sun">
    <div class="flare" style="transform:rotate(0deg);"></div>
    <div class="flare" style="transform:rotate(45deg);"></div>
    <div class="flare" style="transform:rotate(90deg);"></div>
    <div class="flare" style="transform:rotate(135deg);"></div>
    <div class="flare" style="transform:rotate(180deg);"></div>
    <div class="flare" style="transform:rotate(225deg);"></div>
    <div class="flare" style="transform:rotate(270deg);"></div>
    <div class="flare" style="transform:rotate(315deg);"></div>
  </div>

  <!-- Titel -->
  <div id="title">
    <h1>HALDO AI</h1>
    <p>CYBORG OPERATING SYSTEM v25</p>
  </div>

  <!-- Info -->
  <div id="info">
    <h4>System Status</h4>
    <div class="row"><span>AI Core</span><span style="color:var(--primary);">Online</span></div>
    <div class="row"><span>Neural</span><span style="color:var(--primary);">98%</span></div>
    <div class="row"><span>Planeten</span><span style="color:var(--primary);">9/9</span></div>
    <div class="row"><span>Sterne</span><span style="color:var(--primary);">2000</span></div>
    <div class="row"><span>Apps</span><span style="color:var(--primary);">23</span></div>
  </div>

  <!-- Avatar -->
  <div id="avatarStage" class="cyborg-mode">
    <div class="avatar" id="avatarEl">
      <svg viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGrad" cx="40%" cy="20%">
            <stop offset="0%" stop-color="#3a6a8a"/>
            <stop offset="60%" stop-color="#152a4a"/>
            <stop offset="100%" stop-color="#0a1525"/>
          </radialGradient>
          <radialGradient id="headGrad" cx="35%" cy="30%">
            <stop offset="0%" stop-color="#4a8aaa"/>
            <stop offset="50%" stop-color="#1a3a5a"/>
            <stop offset="100%" stop-color="#0a1a2a"/>
          </radialGradient>
          <radialGradient id="skinGrad" cx="35%" cy="30%">
            <stop offset="0%" stop-color="#e8c8a8"/>
            <stop offset="60%" stop-color="#c8a888"/>
            <stop offset="100%" stop-color="#8a6a4a"/>
          </radialGradient>
        </defs>

        <!-- === KÖRPER === -->
        <ellipse cx="260" cy="560" rx="150" ry="100" fill="url(#bodyGrad)" stroke="var(--primary)" stroke-width="2"/>
        <path class="circuit" d="M160 520 Q200 480 260 490 Q320 500 360 470"/>
        <path class="circuit" d="M140 570 Q200 600 260 590 Q320 580 380 610"/>

        <!-- Brust-Ring -->
        <circle class="chest-ring" cx="260" cy="540" r="35"/>
        <circle cx="260" cy="540" r="20" fill="var(--primary)" opacity="0.3"/>
        <circle cx="260" cy="540" r="8" fill="var(--primary)"/>

        <!-- Schultern -->
        <ellipse cx="130" cy="520" rx="55" ry="65" fill="url(#bodyGrad)" stroke="var(--primary)" stroke-width="1.5" opacity="0.9"/>
        <ellipse cx="390" cy="520" rx="55" ry="65" fill="url(#bodyGrad)" stroke="var(--primary)" stroke-width="1.5" opacity="0.9"/>

        <!-- Hals -->
        <rect x="230" y="370" width="60" height="70" fill="#0a1a2a" stroke="var(--primary)" stroke-width="1.5"/>

        <!-- === KOPF (head-breath group) === -->
        <g class="head-breath">
          <!-- === ROBOT FACE === -->
          <g class="robot-face">
            <ellipse cx="260" cy="240" rx="130" ry="150" fill="url(#headGrad)" stroke="var(--primary)" stroke-width="2.5"/>
            <!-- Visor -->
            <path d="M150 220 Q260 170 370 220 L370 275 Q260 320 150 275 Z" fill="#001a33" stroke="var(--primary)" stroke-width="2.5"/>
            <!-- Augen -->
            <ellipse class="eye-glow" cx="205" cy="245" rx="22" ry="14" fill="var(--primary)"/>
            <ellipse class="eye-glow" cx="315" cy="245" rx="22" ry="14" fill="var(--primary)"/>
            <!-- Mund -->
            <rect x="225" y="310" width="70" height="8" rx="4" fill="var(--primary)" opacity="0.85"/>
            <!-- Ohren -->
            <ellipse cx="128" cy="245" rx="18" ry="32" fill="#0a4a6a" stroke="var(--primary)" stroke-width="1.5"/>
            <ellipse cx="392" cy="245" rx="18" ry="32" fill="#0a4a6a" stroke="var(--primary)" stroke-width="1.5"/>
            <!-- Antenne -->
            <line x1="260" y1="95" x2="260" y2="60" stroke="var(--primary)" stroke-width="2.5"/>
            <circle class="antenna" cx="260" cy="52" r="9" fill="var(--primary)"/>
          </g>

          <!-- === CYBORG/HUMAN FACE === -->
          <g class="human-face">
            <!-- Kopf-Form (menschlich) -->
            <ellipse cx="260" cy="240" rx="125" ry="150" fill="url(#skinGrad)" stroke="var(--primary)" stroke-width="1.5" opacity="0.95"/>
            <!-- Cyborg-Platten auf Stirn -->
            <path d="M180 130 Q260 100 340 130 L340 150 Q260 130 180 150 Z" fill="var(--primary)" opacity="0.25" stroke="var(--primary)" stroke-width="1"/>
            <path class="circuit" d="M200 140 L260 125 L320 140"/>
            <!-- Augen -->
            <ellipse cx="205" cy="245" rx="22" ry="16" fill="#fff"/>
            <ellipse cx="315" cy="245" rx="22" ry="16" fill="#fff"/>
            <ellipse class="eye-glow" cx="205" cy="248" rx="10" ry="10" fill="var(--primary)"/>
            <ellipse class="eye-glow" cx="315" cy="248" rx="10" ry="10" fill="var(--primary)"/>
            <!-- Augenbrauen -->
            <path d="M180 220 Q205 212 228 218" stroke="var(--primary-dim)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M292 218 Q315 212 340 220" stroke="var(--primary-dim)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- Nase -->
            <path d="M260 260 L252 290 L268 290 Z" fill="rgba(0,0,0,.2)"/>
            <!-- Mund -->
            <path d="M235 315 Q260 325 285 315" stroke="var(--primary-dim)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- Wangen (Cyborg-Elemente) -->
            <line x1="160" y1="270" x2="180" y2="270" stroke="var(--primary)" stroke-width="2" opacity="0.6"/>
            <line x1="340" y1="270" x2="360" y2="270" stroke="var(--primary)" stroke-width="2" opacity="0.6"/>
            <!-- Ohr-Implantate -->
            <rect x="120" y="235" width="18" height="40" rx="4" fill="#0a4a6a" stroke="var(--primary)" stroke-width="1.5"/>
            <rect x="382" y="235" width="18" height="40" rx="4" fill="#0a4a6a" stroke="var(--primary)" stroke-width="1.5"/>
            <circle cx="129" cy="255" r="3" fill="var(--primary)"/>
            <circle cx="391" cy="255" r="3" fill="var(--primary)"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <h3>⚙️ Anpassen</h3>
    <div class="ctrl-group">
      <label>Avatar-Stil</label>
      <button class="ctrl-btn active" onclick="setStyle('cyborg',this)">🧑‍💻 Cyborg (Mensch)</button>
      <button class="ctrl-btn" onclick="setStyle('robot',this)">🤖 Robot</button>
    </div>
    <div class="ctrl-group">
      <label>Farbe</label>
      <div>
        <div class="color-btn active" style="background:#00e5ff;color:#00e5ff;" onclick="setTheme('blue',this)" title="Blau/Cyan"></div>
        <div class="color-btn" style="background:#00ff88;color:#00ff88;" onclick="setTheme('green',this)" title="Grün"></div>
        <div class="color-btn" style="background:#ff3344;color:#ff3344;" onclick="setTheme('red',this)" title="Rot"></div>
        <div class="color-btn" style="background:#ffcc00;color:#ffcc00;" onclick="setTheme('gold',this)" title="Gold"></div>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div id="chatDemo">
    <h3><span class="status-dot"></span> HalDo AI · Live</h3>
    <div class="msg user">Bruder, zeig mir das neue Design</div>
    <div class="msg bot">Schau an! Ich hab zwei Gesichter und vier Farben. Probier sie aus!</div>
  </div>

  <!-- Statusbar -->
  <div id="statusbar">
    <div class="status-icon">✕</div>
    <div class="status-icon">💬</div>
    <div class="status-icon">📱</div>
    <div class="status-icon">⚙️</div>
    <div class="status-icon">🔊</div>
    <div class="status-icon">🌐</div>
  </div>
</div>

<script>
// Sterne
const sky = document.getElementById('sky');
for(let i=0;i<250;i++){
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random()*2.5 + 0.5;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random()*100 + '%';
  s.style.top = Math.random()*100 + '%';
  s.style.animationDelay = (Math.random()*3) + 's';
  s.style.animationDuration = (2 + Math.random()*3) + 's';
  sky.appendChild(s);
}

// Planeten
const planetData = [
  {size:8, radius:130, color:'#a89080', duration:8},
  {size:11, radius:170, color:'#e8c088', duration:12},
  {size:13, radius:210, color:'#4a90d9', duration:16},
  {size:10, radius:250, color:'#c1604a', duration:20},
  {size:22, radius:310, color:'#d8b890', duration:28},
  {size:19, radius:370, color:'#e8d4a0', duration:36},
  {size:14, radius:430, color:'#88dddd', duration:44},
  {size:14, radius:490, color:'#4466dd', duration:52}
];
planetData.forEach(p => {
  const orbit = document.createElement('div');
  orbit.className = 'orbit';
  orbit.style.width = (p.radius*2) + 'px';
  orbit.style.height = (p.radius*2) + 'px';
  document.getElementById('stage').appendChild(orbit);

  const planet = document.createElement('div');
  planet.className = 'planet';
  planet.style.width = p.size + 'px';
  planet.style.height = p.size + 'px';
  planet.style.background = `radial-gradient(circle at 30% 30%, ${p.color}, rgba(0,0,0,0.8))`;
  planet.style.boxShadow = `0 0 12px ${p.color}`;
  planet.style.animationDuration = p.duration + 's';
  planet.style.animationDelay = -(Math.random()*p.duration) + 's';
  planet.style.left = '50%';
  planet.style.top = '50%';
  planet.style.marginLeft = (-p.size/2) + 'px';
  planet.style.marginTop = (-p.size/2) + 'px';
  planet.style.transformOrigin = `${p.radius}px 0`;
  orbit.appendChild(planet);
});

// Partikel um Avatar
setInterval(()=>{
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = (30 + Math.random()*40) + '%';
  p.style.top = (40 + Math.random()*40) + '%';
  p.style.setProperty('--tx', (Math.random()*200-100)+'px');
  p.style.setProperty('--ty', (-Math.random()*200-50)+'px');
  document.getElementById('avatarStage').appendChild(p);
  setTimeout(()=>p.remove(), 6000);
}, 400);

// Theme / Style Umschalter
function setStyle(style, el){
  document.querySelectorAll('#controls .ctrl-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  const stage = document.getElementById('avatarStage');
  stage.classList.remove('cyborg-mode','robot-mode');
  stage.classList.add(style + '-mode');
}

function setTheme(theme, el){
  document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.body.className = 'theme-' + theme;
}
</script>
</body>
</html>
