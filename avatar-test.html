<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Avatar Test 3 · HalDo 3D Gesicht</title>
<style>
  body { margin: 0; overflow: hidden; background: #050810; font-family: system-ui, sans-serif; color: #00d4ff; }
  #status { position: fixed; top: 20px; left: 20px; background: rgba(0,212,255,0.15); border: 1px solid #00d4ff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 0 20px rgba(0,212,255,0.4); z-index: 100; }
  #hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3); padding: 10px 20px; border-radius: 20px; font-size: 12px; color: #7a8ba8; z-index: 100; }
</style>
</head>
<body>
<div id="status">✅ Schritt 3 · 3D-Gesicht geladen</div>
<div id="hint">👀 Beweg die Maus — Kopf und Augen folgen dir</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
if (typeof THREE === "undefined") {
  document.getElementById("status").textContent = "❌ Three.js nicht geladen";
} else {

  // ============ 1. SZENE ============
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 6);
  camera.lookAt(0, 0, 0);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x050810, 1);
  document.body.appendChild(renderer.domElement);

  // ============ 2. LICHT ============
  const light1 = new THREE.DirectionalLight(0xffffff, 1.1);
  light1.position.set(3, 4, 5);
  scene.add(light1);
  const light2 = new THREE.PointLight(0x00d4ff, 1.5, 15);
  light2.position.set(-4, 1, 2);
  scene.add(light2);
  const light3 = new THREE.PointLight(0x7c3aed, 1.2, 15);
  light3.position.set(4, -2, -2);
  scene.add(light3);
  const ambient = new THREE.AmbientLight(0x404060, 0.8);
  scene.add(ambient);

  // ============ 3. MATERIALIEN ============
  const skinMat = new THREE.MeshPhongMaterial({ color: 0xe8c19c, shininess: 30, specular: 0x555555 });
  const hairMat = new THREE.MeshPhongMaterial({ color: 0x3d2415, shininess: 80, specular: 0x222222 });
  const lipMat = new THREE.MeshPhongMaterial({ color: 0xb54a4a, shininess: 90, specular: 0x444444 });
  const eyeWhiteMat = new THREE.MeshPhongMaterial({ color: 0xfbfaf8, shininess: 100, specular: 0xffffff });
  const irisMat = new THREE.MeshPhongMaterial({ color: 0x4a7ba8, shininess: 120, specular: 0xffffff });
  const pupilMat = new THREE.MeshPhongMaterial({ color: 0x0a0a0a });
  const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.5 });
  const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.5 });

  // ============ 4. KOPF + GESICHT ============
  const headGroup = new THREE.Group();
  scene.add(headGroup);

  // --- Kopf (Kugel, oval) ---
  const headGeo = new THREE.SphereGeometry(1, 64, 64);
  const head = new THREE.Mesh(headGeo, skinMat);
  head.scale.set(0.85, 1.05, 0.9);
  headGroup.add(head);

  // --- HALS ---
  const neckGeo = new THREE.CylinderGeometry(0.28, 0.32, 0.6, 32);
  const neck = new THREE.Mesh(neckGeo, skinMat);
  neck.position.set(0, -1.05, 0);
  headGroup.add(neck);

  // --- SCHULTERN ---
  const shoulderGeo = new THREE.SphereGeometry(0.9, 32, 32);
  const shoulder = new THREE.Mesh(shoulderGeo, skinMat);
  shoulder.scale.set(1.4, 0.5, 0.8);
  shoulder.position.set(0, -1.5, 0);
  headGroup.add(shoulder);

  // --- HAARE (hinten) ---
  const hairBackGeo = new THREE.SphereGeometry(1.05, 32, 32);
  const hairBack = new THREE.Mesh(hairBackGeo, hairMat);
  hairBack.scale.set(0.9, 1.05, 0.95);
  hairBack.position.set(0, 0.05, -0.08);
  headGroup.add(hairBack);

  // --- HAARE (vorne / Pony) ---
  const hairFrontGeo = new THREE.SphereGeometry(1.02, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.45);
  const hairFront = new THREE.Mesh(hairFrontGeo, hairMat);
  hairFront.scale.set(0.88, 1.0, 0.92);
  hairFront.position.set(0, 0.1, 0.02);
  headGroup.add(hairFront);

  // --- HAARE (Seitensträhnen) ---
  const strandGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.7, 12);
  const strandL = new THREE.Mesh(strandGeo, hairMat);
  strandL.position.set(-0.85, -0.2, 0.1);
  strandL.rotation.z = 0.15;
  headGroup.add(strandL);

  const strandR = new THREE.Mesh(strandGeo, hairMat);
  strandR.position.set(0.85, -0.2, 0.1);
  strandR.rotation.z = -0.15;
  headGroup.add(strandR);

  // --- OHREN ---
  const earGeo = new THREE.SphereGeometry(0.13, 32, 32);
  const earL = new THREE.Mesh(earGeo, skinMat);
  earL.scale.set(0.5, 0.9, 0.4);
  earL.position.set(-0.82, 0, 0);
  headGroup.add(earL);

  const earR = new THREE.Mesh(earGeo, skinMat);
  earR.scale.set(0.5, 0.9, 0.4);
  earR.position.set(0.82, 0, 0);
  headGroup.add(earR);

  // --- NASE ---
  const noseGeo = new THREE.SphereGeometry(0.1, 32, 32);
  const nose = new THREE.Mesh(noseGeo, skinMat);
  nose.scale.set(0.6, 0.8, 1.2);
  nose.position.set(0, -0.05, 0.85);
  headGroup.add(nose);

  // Nasenlöcher
  const nostrilGeo = new THREE.SphereGeometry(0.025, 16, 16);
  const nostrilL = new THREE.Mesh(nostrilGeo, new THREE.MeshPhongMaterial({ color: 0x3a1a10 }));
  nostrilL.position.set(-0.06, -0.1, 0.92);
  headGroup.add(nostrilL);
  const nostrilR = new THREE.Mesh(nostrilGeo, new THREE.MeshPhongMaterial({ color: 0x3a1a10 }));
  nostrilR.position.set(0.06, -0.1, 0.92);
  headGroup.add(nostrilR);

  // --- LIPPEN ---
  const upperLipGeo = new THREE.SphereGeometry(0.11, 32, 32);
  const upperLip = new THREE.Mesh(upperLipGeo, lipMat);
  upperLip.scale.set(1.3, 0.35, 0.5);
  upperLip.position.set(0, -0.38, 0.85);
  headGroup.add(upperLip);

  const lowerLipGeo = new THREE.SphereGeometry(0.1, 32, 32);
  const lowerLip = new THREE.Mesh(lowerLipGeo, lipMat);
  lowerLip.scale.set(1.2, 0.4, 0.5);
  lowerLip.position.set(0, -0.5, 0.85);
  headGroup.add(lowerLip);

  // --- AUGEN ---
  const eyeY = 0.15;
  const eyeX = 0.32;
  const eyeZ = 0.78;

  function createEye(offsetX) {
    const g = new THREE.Group();
    // Augapfel
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.13, 32, 32), eyeWhiteMat);
    g.add(ball);
    // Iris
    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.075, 32, 32), irisMat);
    iris.position.z = 0.095;
    iris.scale.z = 0.4;
    g.add(iris);
    // Pupille
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.035, 32, 32), pupilMat);
    pupil.position.z = 0.12;
    pupil.scale.z = 0.5;
    g.add(pupil);
    // Glanz
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.018, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    shine.position.set(-0.03, 0.03, 0.14);
    g.add(shine);
    g.position.set(offsetX, eyeY, eyeZ);
    return g;
  }

  const leftEye = createEye(-eyeX);
  const rightEye = createEye(eyeX);
  headGroup.add(leftEye);
  headGroup.add(rightEye);

  // --- AUGENBRAUEN ---
  const browGeo = new THREE.BoxGeometry(0.3, 0.045, 0.06);
  const browMat = new THREE.MeshPhongMaterial({ color: 0x3d2415 });
  const browL = new THREE.Mesh(browGeo, browMat);
  browL.position.set(-0.32, 0.33, 0.85);
  browL.rotation.z = -0.1;
  headGroup.add(browL);
  const browR = new THREE.Mesh(browGeo, browMat);
  browR.position.set(0.32, 0.33, 0.85);
  browR.rotation.z = 0.1;
  headGroup.add(browR);

  // ============ 5. HOLOGRAMM-RINGE ============
  const ringGroup = new THREE.Group();
  scene.add(ringGroup);

  function createRing(radius, mat, tubeRadius) {
    const geo = new THREE.TorusGeometry(radius, tubeRadius, 16, 100);
    return new THREE.Mesh(geo, mat);
  }

  const ring1 = createRing(2.2, ringMat1, 0.012);
  ring1.rotation.x = Math.PI * 0.5;
  ringGroup.add(ring1);

  const ring2 = createRing(2.5, ringMat2, 0.009);
  ring2.rotation.x = Math.PI * 0.5;
  ringGroup.add(ring2);

  // ============ 6. MAUS-TRACKING ============
  let mouseX = 0;
  let mouseY = 0;

  document.addEventListener("mousemove", (e) => {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -((e.clientY / window.innerHeight) * 2 - 1);
  });

  // ============ 7. RESIZE ============
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ 8. ANIMATION ============
  let t = 0;

  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    // Atmung
    headGroup.position.y = Math.sin(t * 1.2) * 0.05;

    // Kopf dreht in Richtung Maus
    headGroup.rotation.y = mouseX * 0.25;
    headGroup.rotation.x = -mouseY * 0.15;

    // Augen folgen der Maus
    const eyeTargetX = mouseX * 0.06;
    const eyeTargetY = mouseY * 0.05;

    leftEye.position.x = -eyeX + eyeTargetX;
    rightEye.position.x = eyeX + eyeTargetX;
    leftEye.position.y = eyeY + eyeTargetY;
    rightEye.position.y = eyeY + eyeTargetY;

    leftEye.lookAt(mouseX * 3, mouseY * 3, 5);
    rightEye.lookAt(mouseX * 3, mouseY * 3, 5);

    // Ringe rotieren
    ringGroup.rotation.y += 0.003;
    ring1.rotation.z += 0.008;
    ring2.rotation.z -= 0.005;

    renderer.render(scene, camera);
  }

  animate();
}
</script>
</body>
</html>
