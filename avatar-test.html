<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo AI OS · Foto-Avatar V4</title>
<style>
:root{--primary:#00d4ff;--primary-2:#7c3aed;--bg:#050810;--bg-3:#0f1524;--border:rgba(0,212,255,.12);--text:#e6f0ff;--text-dim:#7a8ba8;--success:#22c55e;--danger:#ef4444;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 600px at 20% -10%,rgba(0,212,255,.06),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(124,58,237,.06),transparent 55%);pointer-events:none;z-index:0}

#stage{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#avatar-canvas{max-width:98vw;max-height:98vh}

#panel{position:fixed;top:20px;left:20px;width:380px;max-height:calc(100vh - 40px);background:rgba(10,15,28,.92);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:100;overflow:hidden}
#panel-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(124,58,237,.08))}
#panel-header .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#panel-header h2{margin:0;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--primary)}
#panel-header .badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:10px;background:rgba(0,212,255,.15);color:var(--primary);border:1px solid rgba(0,212,255,.3);font-weight:700}

#tabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.2)}
.tab{flex:1;padding:7px 4px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text-dim);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.tab.active{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(124,58,237,.2));border-color:rgba(0,212,255,.4);color:var(--text)}

.panel-content{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.panel-content.active{display:flex}
.form-area{padding:14px;overflow-y:auto;max-height:65vh}
.form-area label{display:block;font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px;margin-top:10px}
.form-area input[type="password"]{width:100%;background:var(--bg-3);border:1px solid rgba(0,212,255,.3);color:var(--text);padding:9px 12px;border-radius:9px;font-family:inherit;font-size:12.5px;outline:none}
.form-area h3{margin-bottom:10px;color:var(--primary);font-size:14px}
.form-area p{color:var(--text-dim);font-size:12.5px;line-height:1.6}
.form-area .info-box{padding:10px;background:rgba(0,212,255,.05);border:1px dashed rgba(0,212,255,.3);border-radius:10px;font-size:11px;color:var(--text-dim);line-height:1.6;margin-top:10px}
.form-area .info-box b{color:var(--text)}

.upload-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;transition:all .15s;box-shadow:0 4px 16px rgba(0,212,255,.3)}
.upload-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,212,255,.5)}
.upload-btn.danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger);box-shadow:none}

.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;max-width:88%;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(0,212,255,.22),rgba(124,58,237,.22));border:1px solid rgba(0,212,255,.35)}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.msg.sys{align-self:center;font-size:11px;color:var(--text-dim);padding:4px;text-align:center}
.msg .who{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px}
.msg.user .who{color:var(--primary)}
.input-row{padding:12px;border-top:1px solid rgba(0,212,255,.15);display:flex;gap:8px;background:rgba(0,0,0,.2)}
.input-row input{flex:1;background:var(--bg-3);border:1px solid rgba(0,212,255,.2);color:var(--text);padding:10px 14px;border-radius:10px;font-family:inherit;font-size:13px;outline:none}
.input-row button{width:42px;height:42px;border-radius:10px;border:none;cursor:pointer;font-size:16px;flex-shrink:0}
#micBtn{background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);color:var(--primary)}
#sendBtn{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}

#settings{position:fixed;top:20px;right:20px;width:240px;max-height:calc(100vh - 40px);overflow-y:auto;background:rgba(10,15,28,.92);border:1px solid var(--border);border-radius:14px;padding:14px;backdrop-filter:blur(20px);font-size:12px;z-index:100}
#settings h3{margin:0 0 12px;font-size:11px;color:var(--primary);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
#settings h3::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary)}
.group{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.group-title{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.row label{font-size:11.5px;color:var(--text-dim);flex:1}
.row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.keyInput{width:100%;background:var(--bg-3);border:1px solid rgba(0,212,255,.3);color:var(--text);padding:6px 9px;border-radius:8px;font-family:inherit;font-size:11px;outline:none;margin-top:5px}
.mode-row{display:flex;gap:4px;margin-bottom:8px}
.mode-btn{flex:1;padding:8px 2px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);color:var(--text-dim);border-radius:8px;font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;transition:all .15s}
.mode-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none}

#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.15);border:1px solid var(--primary);padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;color:var(--primary);z-index:100;pointer-events:none}

@media (max-width:900px){#settings{display:none}#panel{width:300px}}
</style>
</head>
<body>

<div id="stage"><canvas id="avatar-canvas"></canvas></div>

<div id="panel">
  <div id="panel-header">
    <span class="dot"></span>
    <h2>HalDo AI OS</h2>
    <span class="badge">Foto V4</span>
  </div>
  <div id="tabs">
    <button class="tab" data-tab="chatTab">💬 Chat</button>
    <button class="tab active" data-tab="homeTab">🏠 Home</button>
  </div>
  <div id="chatTab" class="panel-content">
    <div class="chat-log" id="chatLog"></div>
    <div class="input-row">
      <button id="micBtn">🎙️</button>
      <input id="chatInput" type="text" placeholder="Schreib mir was…" autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>
  <div id="homeTab" class="panel-content active">
    <div class="form-area">
      <h3>🦚 Foto-Avatar V4</h3>
      <p><b style="color:var(--text)">Neu in V4:</b><br>
      ✅ Foto <b>größer</b> (95% statt 85%)<br>
      ✅ Cyborg <b>stärker</b> (mehr LEDs, Panel-Linien)<br>
      ✅ Holo <b>intensiver</b> (mehr Scan-Lines)<br>
      ✅ Mehr Glow um Avatar</p>

      <button class="upload-btn" id="uploadBtn">📸 Foto auswählen</button>
      <button class="upload-btn danger" id="clearBtn" style="display:none">🗑️ Foto löschen</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">

      <div class="info-box">
        <b>💡 Tipp:</b> Wähle ein <b>frontales Foto</b> — Gesicht gut sichtbar.
      </div>
    </div>
  </div>
</div>

<div id="settings">
  <h3>Studio</h3>
  <div class="group">
    <div class="group-title">🎭 Avatar-Modus</div>
    <div class="mode-row">
      <button class="mode-btn active" data-mode="human">🧑 Human</button>
      <button class="mode-btn" data-mode="cyborg">🤖 Cyborg</button>
      <button class="mode-btn" data-mode="hologram">✨ Holo</button>
    </div>
  </div>
  <div class="group">
    <div class="group-title">✨ Effekte</div>
    <div class="row"><label>Atmung</label><input type="checkbox" id="breathOn" checked></div>
    <div class="row"><label>Tracking</label><input type="checkbox" id="trackingOn" checked></div>
    <div class="row"><label>Partikel</label><input type="checkbox" id="particlesOn" checked></div>
    <div class="row"><label>Scan-Linien</label><input type="checkbox" id="scanlinesOn" checked></div>
  </div>
  <div class="group">
    <div class="group-title">🔑 API Key</div>
    <input class="keyInput" id="groqKey" type="password" placeholder="Groq gsk_…" autocomplete="off">
  </div>
</div>

<div id="status">🦚 Bereit</div>

<script>
(function() {
  "use strict";

  var state = {
    avatarMode: "human",
    breathOn: true,
    trackingOn: true,
    particlesOn: true,
    scanlinesOn: true,
    groqKey: "",
    chatHistory: [],
    photoData: null
  };
  try {
    var saved = localStorage.getItem("haldo_photo_v4");
    if (saved) {
      var parsed = JSON.parse(saved);
      for (var k in parsed) { state[k] = parsed[k]; }
    }
  } catch (e) {}
  // Migration: photoData aus v3 übernehmen
  if (!state.photoData) {
    try {
      var old = localStorage.getItem("haldo_photo_v3");
      if (old) {
        var op = JSON.parse(old);
        if (op.photoData) { state.photoData = op.photoData; saveState(); }
      }
    } catch(e) {}
  }

  function saveState() {
    try { localStorage.setItem("haldo_photo_v4", JSON.stringify(state)); } catch (e) {}
  }

  // ==================== CANVAS ====================
  var canvas = document.getElementById("avatar-canvas");
  var ctx = canvas.getContext("2d");

  var faceImg = new Image();
  var faceLoaded = false;

  if (state.photoData) {
    faceImg.onload = function() {
      faceLoaded = true;
      resizeCanvas();
      setStatus("🦚 Avatar bereit");
      updateButtons();
    };
    faceImg.src = state.photoData;
  }

  var mouseX = 0, mouseY = 0;
  document.addEventListener("mousemove", function(e) {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -((e.clientY / window.innerHeight) * 2 - 1);
  });

  var t = 0;
  var speakGlow = 0;
  var targetGlow = 0;

  // Partikel — mehr + größer
  var particles = [];
  for (var i = 0; i < 120; i++) {
    particles.push({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.0005,
      vy: -0.0004 - Math.random() * 0.001,
      size: 1.2 + Math.random() * 2.8,
      hue: Math.random() < 0.5 ? 190 : 270,
      phase: Math.random() * Math.PI * 2
    });
  }

  function resizeCanvas() {
    // Fast Vollbild — Foto größer!
    var maxW = Math.min(window.innerWidth * 0.98, 900);
    var maxH = window.innerHeight * 0.98;
    var w = maxW;
    var h = maxW;
    if (faceLoaded && faceImg.width > 0) {
      var ratio = faceImg.width / faceImg.height;
      if (maxW / ratio <= maxH) {
        w = maxW;
        h = maxW / ratio;
      } else {
        h = maxH;
        w = maxH * ratio;
      }
    } else {
      if (h > maxH) { h = maxH; w = maxH; }
    }
    canvas.width = w * window.devicePixelRatio;
    canvas.height = h * window.devicePixelRatio;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }
  window.addEventListener("resize", resizeCanvas);

  // ==================== DRAW ====================
  function draw() {
    requestAnimationFrame(draw);
    t += 0.016;
    var W = canvas.width;
    var H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    var breath = state.breathOn ? Math.sin(t * 1.1) * 0.008 : 0;
    var tiltX = state.trackingOn ? mouseX * 0.025 : 0;

    speakGlow += (targetGlow - speakGlow) * 0.12;

    var cx = W / 2;
    var cy = H / 2;
    var scale = 1 + breath;

    // === STARKE GLOW ===
    var glowColor = state.avatarMode === "cyborg" ? "0,212,255" : state.avatarMode === "hologram" ? "124,58,237" : "0,212,255";
    var glowIntensity = 0.3 + speakGlow * 0.5;
    var radial = ctx.createRadialGradient(cx, cy, W * 0.15, cx, cy, W * 0.6);
    radial.addColorStop(0, "rgba(" + glowColor + ", 0)");
    radial.addColorStop(0.6, "rgba(" + glowColor + ", " + glowIntensity + ")");
    radial.addColorStop(1, "rgba(" + glowColor + ", 0)");
    ctx.fillStyle = radial;
    ctx.fillRect(0, 0, W, H);

    // === FOTO — GRÖSSER ===
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tiltX);
    ctx.scale(scale, scale);

    var filterStr = "";
    var globalAlpha = 1;
    if (state.avatarMode === "human") {
      filterStr = "contrast(1.08) saturate(1.05) brightness(1.02)";
    } else if (state.avatarMode === "cyborg") {
      // STÄRKERER METALL-LOOK
      filterStr = "grayscale(0.92) saturate(1.3) contrast(1.35) brightness(0.88) hue-rotate(185deg)";
      globalAlpha = 0.98;
    } else if (state.avatarMode === "hologram") {
      // STÄRKERES HOLO
      filterStr = "hue-rotate(170deg) saturate(2.5) brightness(1.35) contrast(1.15)";
      globalAlpha = 0.72;
    }

    ctx.filter = filterStr;
    ctx.globalAlpha = globalAlpha;

    if (faceLoaded) {
      var imgW = faceImg.width;
      var imgH = faceImg.height;
      // Foto größer zeichnen
      var drawW = W * 0.95;
      var drawH = drawW * (imgH / imgW);
      var finalH = Math.min(drawH, H * 0.98);
      var finalW = finalH * (imgW / imgH);
      ctx.drawImage(faceImg, -finalW / 2, -finalH / 2, finalW, finalH);
    } else {
      ctx.filter = "none";
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(15,21,36,0.6)";
      ctx.beginPath();
      ctx.arc(0, 0, Math.min(W, H) * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,212,255,0.5)";
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#00d4ff";
      ctx.font = "bold " + (W * 0.05) + "px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("📸", 0, -20);
      ctx.font = "bold " + (W * 0.022) + "px system-ui";
      ctx.fillText("Foto auswählen", 0, 30);
    }
    ctx.restore();

    // === MODUS-OVERLAYS ===
    if (state.avatarMode === "cyborg" && faceLoaded) {
      drawCyborgOverlay(W, H);
    } else if (state.avatarMode === "hologram" && faceLoaded) {
      drawHoloOverlay(W, H);
    } else if (state.avatarMode === "human" && faceLoaded) {
      var vg = ctx.createRadialGradient(cx, cy, W * 0.4, cx, cy, W * 0.65);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.4)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    // === PARTIKEL ===
    if (state.particlesOn) {
      ctx.save();
      for (var p = 0; p < particles.length; p++) {
        var pt = particles[p];
        pt.x += pt.vx;
        pt.y += pt.vy;
        if (pt.y < -0.05) { pt.y = 1.05; pt.x = Math.random(); }
        if (pt.x < -0.05) pt.x = 1.05;
        if (pt.x > 1.05) pt.x = -0.05;
        var px = pt.x * W;
        var py = pt.y * H;
        var alpha = 0.3 + Math.sin(t * 2 + pt.phase) * 0.35;
        ctx.fillStyle = "hsla(" + pt.hue + ", 100%, 68%, " + alpha + ")";
        ctx.beginPath();
        ctx.arc(px, py, pt.size * window.devicePixelRatio, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ==================== CYBORG (STÄRKER) ====================
  function drawCyborgOverlay(W, H) {
    var cx = W / 2;
    var cy = H / 2;

    // === HEADSET-BOGEN (stärker) ===
    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255,0.95)";
    ctx.lineWidth = W * 0.014;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 35;
    ctx.beginPath();
    ctx.arc(cx, cy - H * 0.02, W * 0.33, Math.PI * 1.02, Math.PI * 1.98);
    ctx.stroke();
    // Innerer LED-Streifen
    ctx.strokeStyle = "rgba(124,58,237,0.8)";
    ctx.lineWidth = W * 0.005;
    ctx.shadowColor = "#7c3aed";
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(cx, cy - H * 0.02, W * 0.315, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    ctx.restore();

    // === OHRMUSCHELN (größer, stärker) ===
    var dirs = [-1, 1];
    for (var i = 0; i < dirs.length; i++) {
      var ex = cx + dirs[i] * W * 0.315;
      var ey = cy - H * 0.02;
      var pulse = 0.75 + Math.sin(t * 5 + i * 1.7) * 0.25;
      ctx.save();
      // Äußerer Ring
      ctx.strokeStyle = "rgba(0,212,255," + pulse + ")";
      ctx.lineWidth = W * 0.008;
      ctx.shadowColor = "#00d4ff";
      ctx.shadowBlur = 35;
      ctx.beginPath();
      ctx.arc(ex, ey, W * 0.028, 0, Math.PI * 2);
      ctx.stroke();
      // Innerer LED
      ctx.fillStyle = "rgba(0,212,255," + pulse + ")";
      ctx.beginPath();
      ctx.arc(ex, ey, W * 0.014, 0, Math.PI * 2);
      ctx.fill();
      // Weißer Kern
      ctx.fillStyle = "rgba(255,255,255," + pulse + ")";
      ctx.beginPath();
      ctx.arc(ex, ey, W * 0.005, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // === PANEL-LINIEN auf Gesicht (horizontal) ===
    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255,0.4)";
    ctx.lineWidth = W * 0.0018;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 10;
    for (var li = 0; li < 4; li++) {
      var ly = cy - H * 0.35 + li * H * 0.12;
      ctx.beginPath();
      ctx.moveTo(cx - W * 0.32, ly);
      ctx.lineTo(cx + W * 0.32, ly);
      ctx.stroke();
    }
    // Vertikale Linie in der Mitte
    ctx.beginPath();
    ctx.moveTo(cx, cy - H * 0.4);
    ctx.lineTo(cx, cy + H * 0.4);
    ctx.stroke();
    ctx.restore();

    // === LED-AUGEN (stärker + größer) ===
    var eyeY = cy - H * 0.08;
    var eyeDX = W * 0.115;
    for (var j = 0; j < dirs.length; j++) {
      var ex2 = cx + dirs[j] * eyeDX;
      var pulse2 = 0.75 + Math.sin(t * 4.5 + (dirs[j] + 1)) * 0.25;
      ctx.save();
      // Äußerer Glow
      ctx.shadowColor = "#00d4ff";
      ctx.shadowBlur = 50 * pulse2;
      ctx.fillStyle = "rgba(0,212,255," + (0.35 * pulse2) + ")";
      ctx.beginPath();
      ctx.arc(ex2, eyeY, W * 0.045, 0, Math.PI * 2);
      ctx.fill();
      // Haupt-LED
      ctx.fillStyle = "rgba(0,212,255," + (0.95 * pulse2) + ")";
      ctx.beginPath();
      ctx.arc(ex2, eyeY, W * 0.028, 0, Math.PI * 2);
      ctx.fill();
      // Weißer Kern
      ctx.fillStyle = "rgba(255,255,255," + pulse2 + ")";
      ctx.beginPath();
      ctx.arc(ex2, eyeY, W * 0.012, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // === BRUST-REAKTOR (größer + stärker) ===
    var reactorY = cy + H * 0.42;
    var pulse3 = 1 + Math.sin(t * 3) * 0.2;
    var rR = W * 0.055 * pulse3;
    ctx.save();
    // Äußerer Glow
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 70;
    ctx.fillStyle = "rgba(0,212,255,0.4)";
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 1.4, 0, Math.PI * 2);
    ctx.fill();
    // Haupt-Reaktor
    ctx.fillStyle = "#00d4ff";
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR, 0, Math.PI * 2);
    ctx.fill();
    // Innerer weißer Kern
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 0.4, 0, Math.PI * 2);
    ctx.fill();
    // Rotierender Ring 1
    ctx.strokeStyle = "rgba(124,58,237,0.95)";
    ctx.lineWidth = W * 0.008;
    ctx.shadowColor = "#7c3aed";
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 1.9, t * 0.9, t * 0.9 + Math.PI * 1.4);
    ctx.stroke();
    // Rotierender Ring 2 (gegenläufig)
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 2.2, -t * 0.6, -t * 0.6 + Math.PI * 0.8);
    ctx.stroke();
    ctx.restore();

    // === HALS-LEDs ===
    ctx.save();
    ctx.fillStyle = "rgba(0,212,255,0.9)";
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 20;
    for (var hi = 0; hi < 3; hi++) {
      var hy = cy + H * 0.28 + hi * H * 0.025;
      var hw = W * 0.008 * (1 - hi * 0.15);
      ctx.fillRect(cx - hw/2, hy, hw, H * 0.008);
    }
    ctx.restore();
  }

  // ==================== HOLO (INTENSIVER) ====================
  function drawHoloOverlay(W, H) {
    var cx = W / 2;
    var cy = H / 2;

    // === CYAN-TINT (stärker) ===
    ctx.fillStyle = "rgba(0,212,255,0.10)";
    ctx.fillRect(0, 0, W, H);

    // === SCAN-LINES (doppelt + stärker) ===
    if (state.scanlinesOn) {
      ctx.save();
      // Grobe Linien
      ctx.fillStyle = "rgba(0,212,255,0.22)";
      var lineSpacing = 4 * window.devicePixelRatio;
      var offset = (t * 60) % lineSpacing;
      for (var y = 0; y < H; y += lineSpacing) {
        ctx.fillRect(0, y + offset, W, 2 * window.devicePixelRatio);
      }
      // Feine Linien überlagert
      ctx.fillStyle = "rgba(0,212,255,0.10)";
      var lineSpacing2 = 2 * window.devicePixelRatio;
      var offset2 = (-t * 30) % lineSpacing2;
      for (var y2 = 0; y2 < H; y2 += lineSpacing2) {
        ctx.fillRect(0, y2 + offset2, W, 1 * window.devicePixelRatio);
      }
      ctx.restore();
    }

    // === BODEN-RINGE (mehr + größer) ===
    var baseY = cy + H * 0.47;
    for (var i = 0; i < 5; i++) {
      var rx = W * (0.42 - i * 0.055);
      var ry = rx * 0.14;
      var color = i % 2 === 0 ? "0,212,255" : "124,58,237";
      ctx.strokeStyle = "rgba(" + color + ", " + (0.8 - i * 0.12) + ")";
      ctx.lineWidth = W * 0.006;
      ctx.save();
      ctx.shadowColor = i % 2 === 0 ? "#00d4ff" : "#7c3aed";
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.ellipse(cx, baseY, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // === HORIZONTALER SCAN-STRAHL (stärker) ===
    var scanY = cy + (Math.sin(t * 0.9) * 0.5 + 0.5) * H * 0.9 - H * 0.5;
    var grad = ctx.createLinearGradient(0, scanY - H * 0.1, 0, scanY + H * 0.1);
    grad.addColorStop(0, "rgba(0,212,255,0)");
    grad.addColorStop(0.5, "rgba(0,212,255,0.75)");
    grad.addColorStop(1, "rgba(0,212,255,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, scanY - H * 0.1, W, H * 0.2);

    // Zusätzlicher horizontaler Strahl (schnell gegenläufig)
    var scanY2 = cy + (Math.sin(-t * 1.4) * 0.5 + 0.5) * H * 0.9 - H * 0.5;
    var grad2 = ctx.createLinearGradient(0, scanY2 - H * 0.05, 0, scanY2 + H * 0.05);
    grad2.addColorStop(0, "rgba(124,58,237,0)");
    grad2.addColorStop(0.5, "rgba(124,58,237,0.6)");
    grad2.addColorStop(1, "rgba(124,58,237,0)");
    ctx.fillStyle = grad2;
    ctx.fillRect(0, scanY2 - H * 0.05, W, H * 0.1);

    // === GLOW-RAHMEN ===
    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255,0.5)";
    ctx.lineWidth = W * 0.006;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 30;
    ctx.strokeRect(W * 0.02, H * 0.02, W * 0.96, H * 0.96);
    ctx.restore();

    // === ECKEN-MARKER (wie im Sci-Fi-UI) ===
    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255,0.9)";
    ctx.lineWidth = W * 0.005;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 20;
    var cLen = W * 0.04;
    var corners = [
      [W * 0.03, H * 0.03, 1, 1],
      [W * 0.97, H * 0.03, -1, 1],
      [W * 0.03, H * 0.97, 1, -1],
      [W * 0.97, H * 0.97, -1, -1]
    ];
    for (var ci = 0; ci < corners.length; ci++) {
      var c = corners[ci];
      ctx.beginPath();
      ctx.moveTo(c[0], c[1] + c[3] * cLen);
      ctx.lineTo(c[0], c[1]);
      ctx.lineTo(c[0] + c[2] * cLen, c[1]);
      ctx.stroke();
    }
    ctx.restore();
  }

  draw();

  // ==================== FOTO UPLOAD ====================
  var uploadBtn = document.getElementById("uploadBtn");
  var clearBtn = document.getElementById("clearBtn");
  var fileInput = document.getElementById("fileInput");

  uploadBtn.addEventListener("click", function() { fileInput.click(); });

  fileInput.addEventListener("change", function(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      alert("Bild zu groß! Bitte ein kleineres Foto (unter 4 MB) verwenden.");
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev) {
      var dataUrl = ev.target.result;
      state.photoData = dataUrl;
      saveState();
      faceImg.onload = function() {
        faceLoaded = true;
        resizeCanvas();
        setStatus("🦚 Foto geladen!");
        updateButtons();
      };
      faceImg.src = dataUrl;
    };
    reader.readAsDataURL(file);
  });

  clearBtn.addEventListener("click", function() {
    if (!confirm("Foto wirklich löschen?")) return;
    state.photoData = null;
    saveState();
    faceLoaded = false;
    faceImg = new Image();
    setStatus("🦚 Foto gelöscht");
    updateButtons();
  });

  function updateButtons() {
    if (faceLoaded) {
      uploadBtn.textContent = "🔄 Foto wechseln";
      clearBtn.style.display = "block";
    } else {
      uploadBtn.textContent = "📸 Foto auswählen";
      clearBtn.style.display = "none";
    }
  }
  updateButtons();

  // ==================== UI ====================
  var modeBtns = document.querySelectorAll("[data-mode]");
  for (var mbi = 0; mbi < modeBtns.length; mbi++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        state.avatarMode = btn.dataset.mode;
        saveState();
        for (var k = 0; k < modeBtns.length; k++) { modeBtns[k].classList.remove("active"); }
        btn.classList.add("active");
      });
    })(modeBtns[mbi]);
  }
  for (var mbj = 0; mbj < modeBtns.length; mbj++) {
    if (modeBtns[mbj].dataset.mode === state.avatarMode) { modeBtns[mbj].classList.add("active"); }
    else { modeBtns[mbj].classList.remove("active"); }
  }

  function bindCheck(id, key) {
    var el = document.getElementById(id);
    el.checked = state[key];
    el.addEventListener("change", function(e) {
      state[key] = e.target.checked;
      saveState();
    });
  }
  bindCheck("breathOn", "breathOn");
  bindCheck("trackingOn", "trackingOn");
  bindCheck("particlesOn", "particlesOn");
  bindCheck("scanlinesOn", "scanlinesOn");

  var tabs = document.querySelectorAll(".tab");
  for (var ti = 0; ti < tabs.length; ti++) {
    (function(tab) {
      tab.addEventListener("click", function() {
        for (var k = 0; k < tabs.length; k++) { tabs[k].classList.remove("active"); }
        tab.classList.add("active");
        var panes = document.querySelectorAll(".panel-content");
        for (var k2 = 0; k2 < panes.length; k2++) { panes[k2].classList.remove("active"); }
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    })(tabs[ti]);
  }

  var gk = document.getElementById("groqKey");
  gk.value = state.groqKey;
  gk.addEventListener("input", function(e) {
    state.groqKey = e.target.value.trim();
    saveState();
  });

  // ==================== CHAT ====================
  var chatLog = document.getElementById("chatLog");
  var chatInput = document.getElementById("chatInput");

  function addMsg(role, text, save) {
    if (save === undefined) save = true;
    if (save) {
      state.chatHistory.push({ role: role, text: text, ts: Date.now() });
      if (state.chatHistory.length > 100) state.chatHistory.shift();
      saveState();
    }
    var el = document.createElement("div");
    el.className = "msg " + role;
    if (role !== "sys") {
      var w = document.createElement("div");
      w.className = "who";
      w.textContent = role === "user" ? "Du" : "HalDo";
      el.appendChild(w);
    }
    el.appendChild(document.createTextNode(text));
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  if (state.chatHistory.length) {
    for (var hi = 0; hi < state.chatHistory.length; hi++) {
      var hm = state.chatHistory[hi];
      addMsg(hm.role, hm.text, false);
    }
  } else {
    addMsg("bot", "Hallo Bruder! 🦚 Foto V4 — größeres Bild + stärkere Effekte!", false);
  }

  async function askGroq(text) {
    if (!state.groqKey) throw new Error("Kein Groq-Key.");
    var contents = [];
    var slice = state.chatHistory.slice(-11, -1);
    for (var i = 0; i < slice.length; i++) {
      contents.push({
        role: slice[i].role === "user" ? "user" : "model",
        content: slice[i].text
      });
    }
    contents.push({ role: "user", content: text });
    var r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + state.groqKey
      },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: contents,
        temperature: 0.8,
        max_tokens: 500
      })
    });
    if (!r.ok) throw new Error("Groq " + r.status);
    var d = await r.json();
    var content = (d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "(keine)";
    return content.trim();
  }

  function localReply(text) {
    var l = text.toLowerCase().trim();
    if (/^(hallo|hi|hey|servus|merhaba|silav|guten)/.test(l)) {
      var h = new Date().getHours();
      var g = h < 6 ? "Gute Nacht" : h < 12 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
      return g + " Bruder!";
    }
    if (/uhrzeit|wie spät/.test(l)) {
      return "Es ist " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr.";
    }
    if (/witz|lustig/.test(l)) {
      var witze = [
        "Warum können Geister so schlecht lügen? Weil man durch sie hindurchsieht! 👻",
        "Was macht ein Clown im Büro? Faxen! 🤡"
      ];
      return witze[Math.floor(Math.random() * 2)];
    }
    return null;
  }

  async function handleMsg(text) {
    addMsg("user", text);
    var local = localReply(text);
    if (!state.groqKey) {
      if (local) {
        setTimeout(function() { addMsg("bot", local); speak(local); }, 400);
      } else {
        setTimeout(function() { addMsg("bot", "Kein Groq-Key. Trag ihn rechts ein."); }, 400);
      }
      return;
    }
    setStatus("🤖 denke…");
    try {
      var reply = await askGroq(text);
      addMsg("bot", reply);
      speak(reply);
      setStatus("🦚 Bereit");
    } catch (e) {
      addMsg("sys", "⚠️ " + e.message);
      setStatus("⚠️ Fehler");
    }
  }

  chatInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      var v = chatInput.value.trim();
      if (v) { chatInput.value = ""; handleMsg(v); }
    }
  });
  document.getElementById("sendBtn").addEventListener("click", function() {
    var v = chatInput.value.trim();
    if (v) { chatInput.value = ""; handleMsg(v); }
  });

  // ==================== TTS ====================
  var synth = window.speechSynthesis;
  var voices = [];
  function loadVoices() { voices = synth.getVoices(); }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  function speak(text) {
    if (!synth) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = voices.find(function(x) { return x.lang.startsWith("de"); });
    if (v) u.voice = v;
    u.rate = 1.0; u.pitch = 1.05; u.lang = "de-DE";
    u.onstart = function() { targetGlow = 1; setStatus("🔊 spricht…"); };
    u.onend = function() { targetGlow = 0; setStatus("🦚 Bereit"); };
    u.onerror = function() { targetGlow = 0; };
    synth.speak(u);
  }

  function setStatus(text) { document.getElementById("status").textContent = text; }

  // ==================== MIC ====================
  var micBtn = document.getElementById("micBtn");
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  var listening = false;
  if (SR) {
    rec = new SR();
    rec.lang = "de-DE";
    rec.interimResults = false;
    rec.onresult = function(e) { handleMsg(e.results[0][0].transcript); };
    rec.onend = function() { listening = false; micBtn.classList.remove("listening"); setStatus("🦚 Bereit"); };
    rec.onerror = function() { listening = false; micBtn.classList.remove("listening"); };
  }
  micBtn.addEventListener("click", function() {
    if (!rec) return alert("Nur Chrome/Edge.");
    if (listening) { rec.stop(); return; }
    try { rec.start(); listening = true; micBtn.classList.add("listening"); setStatus("🎙️ höre…"); } catch (e) {}
  });

  console.log("🦚 HalDo Foto-Avatar V4 · Größer + stärkere Effekte");
})();
</script>
</body>
</html>
