<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo Avatar · Mit Bild-Erstellung</title>
<style>
  body { margin: 0; overflow: hidden; background: #050810; font-family: system-ui, -apple-system, sans-serif; color: #e6f0ff; height: 100vh; }
  #canvas-wrap { position: fixed; inset: 0; z-index: 0; }

  /* ===== CHAT PANEL (links) ===== */
  #chatPanel {
    position: fixed;
    top: 20px; left: 20px;
    width: 380px;
    max-height: calc(100vh - 40px);
    background: rgba(10, 15, 28, 0.92);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 16px;
    display: flex; flex-direction: column;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 212, 255, 0.1);
    z-index: 100;
    overflow: hidden;
  }
  #chatHeader {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,212,255,0.15);
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(124,58,237,0.08));
  }
  #chatHeader .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 10px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  #chatHeader h2 {
    margin: 0; font-size: 13px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: #00d4ff;
  }
  #chatHeader .badge {
    margin-left: auto;
    font-size: 10px; padding: 3px 8px;
    border-radius: 10px;
    background: rgba(0,212,255,0.15);
    color: #00d4ff;
    border: 1px solid rgba(0,212,255,0.3);
    font-weight: 700;
  }

  /* ===== TABS ===== */
  #tabs {
    display: flex; gap: 3px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(0,212,255,0.1);
    background: rgba(0,0,0,0.2);
  }
  .tab {
    flex: 1;
    padding: 7px 10px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: #7a8ba8;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
  }
  .tab:hover { color: #e6f0ff; background: rgba(255,255,255,0.04); }
  .tab.active {
    background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(124,58,237,0.2));
    border-color: rgba(0,212,255,0.4);
    color: #e6f0ff;
  }

  /* ===== CHAT TAB ===== */
  #chatTab, #imageTab { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  #chatTab.hidden, #imageTab.hidden { display: none; }

  #chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex; flex-direction: column;
    gap: 10px;
    min-height: 200px;
  }
  #chatLog::-webkit-scrollbar { width: 6px; }
  #chatLog::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }

  .msg {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    max-width: 88%;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(0,212,255,0.22), rgba(124,58,237,0.22));
    border: 1px solid rgba(0,212,255,0.35);
  }
  .msg.bot {
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .msg.sys {
    align-self: center;
    font-size: 11px;
    color: #7a8ba8;
    background: transparent;
    padding: 4px;
    text-align: center;
  }
  .msg .who {
    font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: #7a8ba8; margin-bottom: 4px;
  }
  .msg.user .who { color: #00d4ff; }

  .typing {
    display: flex; gap: 4px;
    padding: 12px 16px;
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #00d4ff;
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  .input-row {
    padding: 12px;
    border-top: 1px solid rgba(0,212,255,0.15);
    display: flex; gap: 8px;
    background: rgba(0,0,0,0.2);
  }
  .input-row input {
    flex: 1;
    background: #0f1524;
    border: 1px solid rgba(0,212,255,0.2);
    color: #e6f0ff;
    padding: 10px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .input-row input:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  .input-row button {
    width: 42px; height: 42px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    transition: all .15s;
    flex-shrink: 0;
  }
  #micBtn {
    background: rgba(0,212,255,0.15);
    border: 1px solid rgba(0,212,255,0.3);
    color: #00d4ff;
  }
  #micBtn.listening {
    background: linear-gradient(135deg, #ef4444, #f97316);
    color: #fff;
    animation: micPulse 1s infinite;
  }
  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
  }
  #sendBtn {
    background: linear-gradient(135deg, #00d4ff, #7c3aed);
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,212,255,0.3);
  }

  /* ===== BILD-ERSTELLUNG TAB ===== */
  #imageTab {
    padding: 0;
  }
  #imageForm {
    padding: 14px;
    border-bottom: 1px solid rgba(0,212,255,0.1);
  }
  #imageForm label {
    display: block;
    font-size: 11px;
    color: #7a8ba8;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  #imageForm input[type="password"],
  #imageForm input[type="text"],
  #imageForm textarea,
  #imageForm select {
    width: 100%;
    background: #0f1524;
    border: 1px solid rgba(0,212,255,0.3);
    color: #e6f0ff;
    padding: 9px 12px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    margin-bottom: 10px;
    box-sizing: border-box;
  }
  #imageForm input:focus, #imageForm textarea:focus, #imageForm select:focus {
    border-color: #00d4ff;
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }
  #imageForm textarea {
    resize: vertical;
    min-height: 60px;
    font-size: 13px;
  }
  #imageForm select {
    cursor: pointer;
  }
  #imageGoBtn {
    width: 100%;
    padding: 11px;
    background: linear-gradient(135deg, #00d4ff, #7c3aed);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,212,255,0.3);
    transition: all .15s;
  }
  #imageGoBtn:hover { box-shadow: 0 6px 24px rgba(0,212,255,0.5); }
  #imageGoBtn:disabled {
    opacity: 0.5;
    cursor: wait;
  }

  #imageResults {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
  }
  #imageResults::-webkit-scrollbar { width: 6px; }
  #imageResults::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }

  .image-card {
    margin-bottom: 12px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(0,212,255,0.2);
    background: rgba(255,255,255,0.03);
    animation: fadeIn .3s ease;
  }
  .image-card img {
    width: 100%;
    display: block;
  }
  .image-card .info {
    padding: 8px 12px;
    font-size: 11px;
    color: #7a8ba8;
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .image-card .info .prompt-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .image-card .info a {
    color: #00d4ff;
    text-decoration: none;
    font-weight: 600;
  }
  .image-card .info a:hover { text-decoration: underline; }

  .image-loading {
    padding: 40px 20px;
    text-align: center;
    color: #00d4ff;
    font-size: 13px;
    background: rgba(0,212,255,0.05);
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px dashed rgba(0,212,255,0.3);
  }
  .image-loading .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid rgba(0,212,255,0.2);
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .image-error {
    padding: 14px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 10px;
    color: #ef4444;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .key-hint {
    font-size: 10.5px;
    color: #7a8ba8;
    line-height: 1.4;
    margin-top: -6px;
    margin-bottom: 10px;
  }
  .key-hint a {
    color: #00d4ff;
    text-decoration: none;
  }
  .key-hint a:hover { text-decoration: underline; }

  /* ===== SETTINGS PANEL (rechts) ===== */
  #panel {
    position: fixed; top: 20px; right: 20px;
    width: 260px; max-height: calc(100vh - 40px);
    overflow-y: auto;
    background: rgba(10, 15, 28, 0.92);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 14px;
    padding: 14px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    font-size: 12px;
    z-index: 100;
  }
  #panel::-webkit-scrollbar { width: 5px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }
  #panel h3 {
    margin: 0 0 12px 0; font-size: 12px;
    color: #00d4ff; letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  #panel h3::before {
    content: ""; width: 7px; height: 7px;
    border-radius: 50%; background: #00d4ff;
    box-shadow: 0 0 10px #00d4ff;
  }
  .group { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .group-title {
    font-size: 10px; color: #7a8ba8;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 8px; font-weight: 700;
  }
  .row {
    display: flex; align-items: center;
    justify-content: space-between; gap: 10px; padding: 4px 0;
  }
  .row label { font-size: 11.5px; color: #a8b8d0; flex: 1; }
  input[type="color"] { width: 34px; height: 24px; border: 1px solid rgba(0,212,255,0.3); border-radius: 6px; background: transparent; cursor: pointer; padding: 2px; }
  input[type="range"] { width: 90px; accent-color: #00d4ff; }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #00d4ff; cursor: pointer; }
  select {
    background: #0f1524; color: #e6f0ff;
    border: 1px solid rgba(0,212,255,.3);
    border-radius: 6px; padding: 4px 7px;
    font-family: inherit; font-size: 11px;
    outline: none; cursor: pointer;
    max-width: 130px;
  }
  .val { font-size: 10px; color: #00d4ff; font-weight: 700; min-width: 28px; text-align: right; }
  .keyInput {
    width: 100%;
    background: #0f1524;
    border: 1px solid rgba(0,212,255,0.3);
    color: #e6f0ff;
    padding: 6px 9px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11px;
    outline: none;
    margin-top: 5px;
    box-sizing: border-box;
  }
  .keyInput:focus { border-color: #00d4ff; }
  .hint { font-size: 10px; color: #7a8ba8; line-height: 1.4; margin-top: 4px; }

  #status {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 212, 255, 0.15);
    border: 1px solid #00d4ff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    z-index: 100;
    transition: all .2s;
  }
  #status.speaking { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,0.15); }
  #status.listening { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.15); }
  #status.generating { border-color: #f5c542; color: #f5c542; background: rgba(245,197,66,0.15); }

  @media (max-width: 900px) {
    #panel { display: none; }
    #chatPanel { width: 320px; }
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<!-- ===== CHAT + BILD PANEL ===== -->
<div id="chatPanel">
  <div id="chatHeader">
    <span class="dot"></span>
    <h2>HalDo</h2>
    <span class="badge" id="aiStatus">kein Key</span>
  </div>

  <!-- TABS -->
  <div id="tabs">
    <button class="tab active" data-tab="chatTab">💬 Chat</button>
    <button class="tab" data-tab="imageTab">🎨 Bild erstellen</button>
  </div>

  <!-- CHAT TAB -->
  <div id="chatTab">
    <div id="chatLog"></div>
    <div class="input-row">
      <button id="micBtn" title="Spracheingabe">🎙️</button>
      <input id="chatInput" type="text" placeholder="Schreib mir was…" autocomplete="off">
      <button id="sendBtn" title="Senden">➤</button>
    </div>
  </div>

  <!-- BILD TAB -->
  <div id="imageTab" class="hidden">
    <div id="imageForm">
      <label for="pollKey">Pollinations API-Key</label>
      <input type="password" id="pollKey" placeholder="sk_… (einmal eintragen)">
      <div class="key-hint">
        Key holen auf <a href="https://enter.pollinations.ai/keys" target="_blank">enter.pollinations.ai/keys</a> — bleibt lokal in deinem Browser gespeichert.
      </div>

      <label for="imagePrompt">Was soll ich zeichnen?</label>
      <textarea id="imagePrompt" placeholder="z.B. Ein brauner Bär im Wald, sonniger Tag, fotorealistisch"></textarea>

      <label for="imageModel">Modell</label>
      <select id="imageModel">
        <option value="black-forest-labs/flux.1-schnell" selected>Flux 1 Schnell (empfohlen)</option>
        <option value="black-forest-labs/flux.2-pro">Flux 2 Pro (hohe Qualität)</option>
        <option value="black-forest-labs/flux.2-flex">Flux 2 Flex</option>
        <option value="openai/gpt-image-1-mini">GPT Image 1 Mini</option>
        <option value="google/gemini-2.5-flash-image">Gemini 2.5 Flash Image</option>
      </select>

      <button id="imageGoBtn">🎨 Erstellen</button>
    </div>
    <div id="imageResults"></div>
  </div>
</div>

<!-- ===== SETTINGS ===== -->
<div id="panel">
  <h3>Avatar-Studio</h3>

  <div class="group">
    <div class="group-title">🤖 KI & Gemini</div>
    <input class="keyInput" id="apiKey" type="password" placeholder="Gemini API-Key (AIza…)">
    <div class="hint">Kostenlos auf <b>aistudio.google.com/apikey</b></div>
    <div class="row" style="margin-top:6px;">
      <label>Modell</label>
      <select id="aiModel"><option value="">wird geladen…</option></select>
    </div>
    <div class="row">
      <label>Auto-Vorlesen</label>
      <input type="checkbox" id="autoSpeak" checked>
    </div>
  </div>

  <div class="group">
    <div class="group-title">💇 Haare</div>
    <div class="row"><label>Farbe</label><input type="color" id="hairColor" value="#1a1410"></div>
    <div class="row"><label>Stil</label>
      <select id="hairStyle">
        <option value="curly" selected>Lockig</option>
        <option value="straight">Glatt</option>
        <option value="short">Kurz</option>
        <option value="bald">Glatze</option>
      </select>
    </div>
  </div>

  <div class="group">
    <div class="group-title">🧔 Bart</div>
    <div class="row"><label>An</label><input type="checkbox" id="beardOn" checked></div>
    <div class="row"><label>Farbe</label><input type="color" id="beardColor" value="#3a2a1a"></div>
    <div class="row"><label>Grau</label><input type="range" id="beardGray" min="0" max="100" value="55"><span class="val" id="beardGrayVal">55%</span></div>
    <div class="row"><label>Schnauzer</label><input type="checkbox" id="mustacheOn" checked></div>
  </div>

  <div class="group">
    <div class="group-title">🎨 Haut & Augen</div>
    <div class="row"><label>Haut</label><input type="color" id="skinColor" value="#c99a72"></div>
    <div class="row"><label>Augen</label><input type="color" id="eyeColor" value="#4a3220"></div>
    <div class="row"><label>Brauen</label><input type="checkbox" id="browsOn" checked></div>
  </div>

  <div class="group">
    <div class="group-title">👕 Kleidung</div>
    <div class="row"><label>Shirt</label><input type="color" id="shirtColor" value="#0a0a0a"></div>
  </div>

  <div class="group">
    <div class="group-title">🎙️ Stimme</div>
    <div class="row"><label>Stimme</label><select id="voiceSelect"></select></div>
    <div class="row"><label>Tempo</label><input type="range" id="voiceRate" min="0.5" max="2" step="0.1" value="1"><span class="val" id="voiceRateVal">1.0</span></div>
    <div class="row"><label>Tonhöhe</label><input type="range" id="voicePitch" min="0.5" max="2" step="0.1" value="1"><span class="val" id="voicePitchVal">1.0</span></div>
  </div>

  <div class="group">
    <div class="group-title">✨ Effekte</div>
    <div class="row"><label>Ringe</label><input type="checkbox" id="ringsOn" checked></div>
    <div class="row"><label>Tracking</label><input type="checkbox" id="trackingOn" checked></div>
    <div class="row"><label>Blinzeln</label><input type="checkbox" id="blinkOn" checked></div>
  </div>
</div>

<div id="status">🦚 Bereit</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  "use strict";

  if (typeof THREE === "undefined") {
    document.getElementById("status").textContent = "❌ Three.js nicht geladen";
    return;
  }

  // ==================== STATE ====================
  const defaults = {
    hairColor: "#1a1410", hairStyle: "curly",
    beardOn: true, beardColor: "#3a2a1a", beardGray: 55, mustacheOn: true,
    skinColor: "#c99a72", eyeColor: "#4a3220", browsOn: true,
    shirtColor: "#0a0a0a",
    ringsOn: true, trackingOn: true, blinkOn: true,
    emotion: "neutral",
    voiceRate: 1.0, voicePitch: 1.0, voiceName: "",
    apiKey: "", aiModel: "", autoSpeak: true,
    pollKey: "", imageModel: "black-forest-labs/flux.1-schnell",
    chatHistory: []
  };
  const state = Object.assign({}, defaults);
  try {
    const saved = localStorage.getItem("haldo_avatar_settings_v7");
    if (saved) Object.assign(state, JSON.parse(saved));
  } catch(e) {}

  function saveState() {
    try { localStorage.setItem("haldo_avatar_settings_v7", JSON.stringify(state)); } catch(e) {}
  }

  // ==================== SZENE ====================
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.1, 5.5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x050810, 1);
  document.getElementById("canvas-wrap").appendChild(renderer.domElement);

  // LICHT
  const dirLight = new THREE.DirectionalLight(0xfff4e6, 1.15);
  dirLight.position.set(3, 4, 5);
  scene.add(dirLight);
  const cyanLight = new THREE.PointLight(0x00d4ff, 1.2, 15);
  cyanLight.position.set(-4, 1, 2);
  scene.add(cyanLight);
  const purpLight = new THREE.PointLight(0x7c3aed, 1.0, 15);
  purpLight.position.set(4, -2, -2);
  scene.add(purpLight);
  scene.add(new THREE.AmbientLight(0x606580, 0.9));

  // MATERIALIEN
  const skinMat = new THREE.MeshPhongMaterial({ color: state.skinColor, shininess: 25, specular: 0x333333 });
  const hairMat = new THREE.MeshPhongMaterial({ color: state.hairColor, shininess: 60, specular: 0x222222 });
  const beardMat = new THREE.MeshPhongMaterial({ color: state.beardColor, shininess: 20, specular: 0x111111 });
  const grayBeardMat = new THREE.MeshPhongMaterial({ color: 0xb8b8b8, shininess: 15, specular: 0x222222 });

  // ==================== EMOTION SYSTEM ====================
  const emotionTargets = {

    happy:     { browL: 0.38, browR: 0.38, browLz: -0.18, browRz: 0.18, mouthY: -0.47, mouthCurve: 1 },

  const synth = window.speechSynthesis;
  let voices = [];
  let speaking = false;
  let speakInterval = null;

  function loadVoices() {
    voices = synth.getVoices();
    const select = document.getElementById("voiceSelect");
    select.innerHTML = "";
    const de = voices.filter(v => v.lang.startsWith("de"));
    const others = voices.filter(v => !v.lang.startsWith("de"));
    [...de, ...others].forEach(v => {
      const opt = document.createElement("option");
      opt.value = v.name;
      opt.textContent = v.name + " (" + v.lang + ")";
      if (state.voiceName && v.name === state.voiceName) opt.selected = true;
      select.appendChild(opt);
    });
    if (!state.voiceName && de.length) {
      state.voiceName = de[0].name;
      select.value = de[0].name;
      saveState();
    }
  }
  if (synth) {
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  }

  function speak(text) {
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(x => x.name === state.voiceName);
    if (v) u.voice = v;
    u.rate = state.voiceRate;
    u.pitch = state.voicePitch;
    u.onstart = () => {
      speaking = true;
      document.getElementById("status").textContent = "🔊 HalDo spricht…";
      document.getElementById("status").className = "speaking";
      speakInterval = setInterval(() => {
        targetMouthOpen = 0.4 + Math.random() * 0.6;
        setTimeout(() => { targetMouthOpen = 0.15 + Math.random() * 0.3; }, 70);
      }, 110);
    };
    u.onend = () => {
      speaking = false;
      targetMouthOpen = 0;
      if (speakInterval) { clearInterval(speakInterval); speakInterval = null; }
      document.getElementById("status").textContent = "🦚 Bereit";
      document.getElementById("status").className = "";
    };
    u.onerror = u.onend;
    synth.speak(u);
  }

  let blinkTimer = 0;
  let nextBlink = 100 + Math.random() * 150;
  let blinkProgress = 1;

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    headGroup.position.y = Math.sin(t * 1.1) * 0.04;

    if (state.trackingOn) {
      headGroup.rotation.y += ((mouseX * 0.25) - headGroup.rotation.y) * 0.08;
      headGroup.rotation.x += ((-mouseY * 0.15) - headGroup.rotation.x) * 0.08;
      const eTargetX = mouseX * 0.06;
      const eTargetY = mouseY * 0.05;
      leftEye.position.x = -eyeX + eTargetX;
      rightEye.position.x = eyeX + eTargetX;
      leftEye.position.y = eyeY + eTargetY;
      rightEye.position.y = eyeY + eTargetY;
      leftEye.lookAt(mouseX * 3, mouseY * 3, 5);
      rightEye.lookAt(mouseX * 3, mouseY * 3, 5);
      lidL.position.x = leftEye.position.x;
      lidL.position.y = leftEye.position.y;
      lidR.position.x = rightEye.position.x;
      lidR.position.y = rightEye.position.y;
    } else {
      headGroup.rotation.y += (0 - headGroup.rotation.y) * 0.08;
      headGroup.rotation.x += (0 - headGroup.rotation.x) * 0.08;
    }

    if (state.blinkOn && !speaking) {
      blinkTimer++;
      if (blinkTimer > nextBlink) {
        blinkProgress = Math.max(0, blinkProgress - 0.15);
        if (blinkProgress <= 0) {
          blinkTimer = 0;
          nextBlink = 100 + Math.random() * 200;
          setTimeout(() => { blinkProgress = 1; }, 80);
        }
      } else {
        blinkProgress = Math.min(1, blinkProgress + 0.1);
      }
    } else {
      blinkProgress = Math.min(1, blinkProgress + 0.1);
    }
    const lidScale = Math.max(0.01, 1 - blinkProgress);
    lidL.scale.y = lidScale;
    lidR.scale.y = lidScale;

    const emo = emotionTargets[state.emotion] || emotionTargets.neutral;
    currentBrow.L += (emo.browL - currentBrow.L) * 0.1;
    currentBrow.R += (emo.browR - currentBrow.R) * 0.1;
    currentBrow.Lz += (emo.browLz - currentBrow.Lz) * 0.1;
    currentBrow.Rz += (emo.browRz - currentBrow.Rz) * 0.1;
    browL.position.y = currentBrow.L;
    browR.position.y = currentBrow.R;
    browL.rotation.z = currentBrow.Lz;
    browR.rotation.z = currentBrow.Rz;
    mouthGroup.position.y += (emo.mouthY - mouthGroup.position.y) * 0.1;
    const curve = emo.mouthCurve;
    upperLip.position.y = 0.06 + curve * 0.02;
    lowerLip.position.y = -0.08 - curve * 0.02;

    currentMouthOpen += (targetMouthOpen - currentMouthOpen) * 0.25;
    mouthGroup.scale.y = 1 + currentMouthOpen * 0.9;
    mouthInner.visible = currentMouthOpen > 0.15;
    mouthInner.position.y = -0.02 - currentMouthOpen * 0.03;

    if (state.ringsOn) {
      ringGroup.visible = true;
      ringGroup.rotation.y += 0.003;
      ring1.rotation.z += 0.008;
      ring2.rotation.z -= 0.005;
      ring3.rotation.z += 0.006;
    } else {
      ringGroup.visible = false;
    }

    renderer.render(scene, camera);
  }

  const aiModelEl = document.getElementById("aiModel");
  const validModels = ["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-2.0-flash","gemini-3.5-flash","gemini-3.7-flash","gemini-3.8-flash"];
  if (!validModels.includes(state.aiModel) && state.aiModel) state.aiModel = "gemini-2.5-flash";

  async function loadAvailableModels() {
    if (!state.apiKey) {
      aiModelEl.innerHTML = "<option value=\"\">(kein Key)</option>";
      return;
    }
    aiModelEl.innerHTML = "<option value=\"\">lade…</option>";
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(state.apiKey)}`;
      const res = await fetch(url);
      if (!res.ok) { aiModelEl.innerHTML = "<option value=\"\">(Fehler)</option>"; return; }
      const data = await res.json();
      const models = (data.models || []).filter(m =>
        m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent")
      );
      if (!models.length) { aiModelEl.innerHTML = "<option value=\"\">(keine)</option>"; return; }
      aiModelEl.innerHTML = "";
      models.forEach(m => {
        const shortName = m.name.replace("models/", "");
        const opt = document.createElement("option");
        opt.value = shortName;
        opt.textContent = shortName;
        if (state.aiModel === shortName) opt.selected = true;
        aiModelEl.appendChild(opt);
      });
      if (!models.find(m => m.name.replace("models/","") === state.aiModel)) {
        const first = models[0].name.replace("models/", "");
        state.aiModel = first;
        aiModelEl.value = first;
        saveState();
      }
    } catch (e) {
      aiModelEl.innerHTML = "<option value=\"\">(Netzwerkfehler)</option>";
    }
  }
  if (state.apiKey) loadAvailableModels();
  else aiModelEl.innerHTML = "<option value=\"\">Trag Key ein</option>";
  aiModelEl.addEventListener("change", (e) => {
    state.aiModel = e.target.value;
    saveState();
  });

  function updateAIStatus() {
    const badge = document.getElementById("aiStatus");
    if (state.apiKey) {
      badge.textContent = "KI aktiv";
      badge.style.background = "rgba(34,197,94,0.15)";
      badge.style.color = "#22c55e";
      badge.style.borderColor = "#22c55e";
    } else {
      badge.textContent = "kein Key";
      badge.style.background = "rgba(0,212,255,0.15)";
      badge.style.color = "#00d4ff";
      badge.style.borderColor = "rgba(0,212,255,0.3)";
    }
  }
  updateAIStatus();

  // ==================== CHAT ====================
  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");

  function addMessage(role, text, save) {
    if (save !== false) {
      state.chatHistory.push({ role, text, ts: Date.now() });
      if (state.chatHistory.length > 100) state.chatHistory.shift();
      saveState();
    }
    const el = document.createElement("div");
    el.className = "msg " + role;
    if (role !== "sys") {
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = role === "user" ? "Du" : "HalDo";
      el.appendChild(who);
    }
    el.appendChild(document.createTextNode(text));
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
    return el;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "typing";
    el.id = "typingInd";
    el.innerHTML = "<span></span><span></span><span></span>";
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
  }
  function hideTyping() {
    const el = document.getElementById("typingInd");
    if (el) el.remove();
  }

  if (state.chatHistory.length) {
    state.chatHistory.forEach(m => addMessage(m.role, m.text, false));
  } else {
    addMessage("bot",
      "Hallo Bruder! Ich bin HalDo 🦚 — dein persönlicher Assistent. " +
      "Chatte mit mir, oder wechsle oben zu 🎨 Bild erstellen!",
      false
    );
  }

  async function askGemini(userText) {
    if (!state.apiKey) throw new Error("Kein API-Key.");
    if (!state.aiModel) throw new Error("Kein Modell.");
    const model = state.aiModel;
    const sys = "Du bist HalDo, ein freundlicher, warmer, intelligenter Assistent. Antworte natürlich, kurz und auf Deutsch.";
    const contents = [];
    const hist = state.chatHistory.slice(-11, -1);
    hist.forEach(m => {
      contents.push({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.text }] });
    });
    contents.push({ role: "user", parts: [{ text: userText }] });

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
    const body = { contents, generationConfig: { temperature: 0.8, maxOutputTokens: 500 } };
    if (sys) body.systemInstruction = { parts: [{ text: sys }] };
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) { const err = await res.text(); throw new Error("Gemini " + res.status + ": " + err.slice(0, 180)); }
    const data = await res.json();
    const txt = data?.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join("\n");
    return (txt || "(keine Antwort)").trim();
  }

  function localReply(text) {
    const lower = text.toLowerCase().trim();
    if (/^(hallo|hi|hey|servus|merhaba|silav|guten (morgen|tag|abend))/.test(lower)) {
      const h = new Date().getHours();
      const greet = h < 6 ? "Gute Nacht" : h < 12 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
      return greet + " Bruder! Wie kann ich dir helfen?";
    }
    if (/uhrzeit|wie spät/.test(lower)) return "Es ist " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr.";
    if (/datum|welcher tag/.test(lower)) return "Heute ist " + new Date().toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" }) + ".";
    if (/witz|lustig/.test(lower)) {
      const witze = ["Warum können Geister so schlecht lügen? Weil man durch sie hindurchsieht! 👻", "Was macht ein Clown im Büro? Faxen! 🤡", "Wie nennt man einen Bumerang, der nicht zurückkommt? Stock. 🪃"];
      return witze[Math.floor(Math.random() * witze.length)];
    }
    if (/was kannst du|fähigkeit|hilfe/.test(lower)) return "Ich kann: chatten, Bilder erstellen, Uhrzeit, Witze. Frag mich was! 🦚";
    return null;
  }

  function detectEmotion(text) {
    const l = text.toLowerCase();
    if (/\?|wirklich|unglaublich|staun/.test(l)) return "surprised";
    if (/haha|lach|witz|freu|toll|super|schön/.test(l)) return "happy";
    if (/sorry|traurig|leider/.test(l)) return "sad";
    if (/wütend|ärger|sauer/.test(l)) return "angry";
    if (/denk|überleg|vielleicht/.test(l)) return "thinking";
    return "neutral";
  }

  async function handleUserMessage(text) {
    addMessage("user", text);
    const local = localReply(text);
    if (!state.apiKey) {
      if (local) {
        setTimeout(() => { addMessage("bot", local); if (state.autoSpeak) speak(local); state.emotion = detectEmotion(local); }, 400);
      } else {
        setTimeout(() => addMessage("bot", "Ich habe noch keinen Gemini-Key. Trag ihn rechts oben ein."), 400);
      }
      return;
    }
    showTyping();
    document.getElementById("status").textContent = "🤖 denke…";
    try {
      const reply = await askGemini(text);
      hideTyping();
      addMessage("bot", reply);
      state.emotion = detectEmotion(reply);
      if (state.autoSpeak) speak(reply);
      document.getElementById("status").textContent = "🦚 Bereit";
    } catch (e) {
      hideTyping();
      addMessage("sys", "⚠️ " + e.message);
      document.getElementById("status").textContent = "⚠️ Fehler";
    }
  }

  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const v = chatInput.value.trim(); if (v) { chatInput.value = ""; handleUserMessage(v); } }
  });
  sendBtn.addEventListener("click", () => {
    const v = chatInput.value.trim();
    if (v) { chatInput.value = ""; handleUserMessage(v); }
  });

  // ==================== SPRACHEINGABE ====================
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  let isListening = false;
  if (SpeechRec) {
    rec = new SpeechRec();
    rec.lang = "de-DE";
    rec.interimResults = false;
    rec.continuous = false;
    rec.onresult = (e) => {
      const txt = e.results[0][0].transcript;
      handleUserMessage(txt);
    };
    rec.onend = () => { isListening = false; micBtn.classList.remove("listening"); document.getElementById("status").textContent = "🦚 Bereit"; document.getElementById("status").className = ""; };
    rec.onerror = () => { isListening = false; micBtn.classList.remove("listening"); };
  }
  micBtn.addEventListener("click", () => {
    if (!rec) { alert("Spracheingabe nur in Chrome/Edge."); return; }
    if (isListening) { rec.stop(); return; }
    try {
      rec.start(); isListening = true;
      micBtn.classList.add("listening");
      document.getElementById("status").textContent = "🎙️ Ich höre zu…";
      document.getElementById("status").className = "listening";
    } catch(e) {}
  });

  // ==================== BILD-ERSTELLUNG ====================
  const imagePrompt = document.getElementById("imagePrompt");
  const imageGoBtn = document.getElementById("imageGoBtn");
  const imageResults = document.getElementById("imageResults");

  async function generateImage() {
    const prompt = imagePrompt.value.trim();
    const key = state.pollKey;
    const model = state.imageModel;

    if (!prompt) { alert("Schreib erst, was ich zeichnen soll!"); return; }
    if (!key) { alert("Trag erst deinen Pollinations-Key oben ein (sk_…)"); return; }

    imageGoBtn.disabled = true;
    imageGoBtn.textContent = "⏳ Wird erstellt…";
    document.getElementById("status").textContent = "🎨 Bild wird erstellt…";
    document.getElementById("status").className = "generating";

    const loading = document.createElement("div");
    loading.className = "image-loading";
    loading.innerHTML = "<div class=\"spinner\"></div><br>Erstelle Bild: „" + prompt + "“";
    imageResults.prepend(loading);

    const encodedPrompt = encodeURIComponent(prompt);
    const url = `https://gen.pollinations.ai/image/${encodedPrompt}?model=${encodeURIComponent(model)}&width=1024&height=1024&nologo=true&key=${encodeURIComponent(key)}`;

    // Wir laden das Bild und zeigen es an
    const img = new Image();
    img.crossOrigin = "anonymous";

    const timeout = setTimeout(() => {
      loading.remove();
      imageGoBtn.disabled = false;
      imageGoBtn.textContent = "🎨 Erstellen";
      document.getElementById("status").textContent = "⚠️ Zeitüberschreitung";
      document.getElementById("status").className = "";
      const err = document.createElement("div");
      err.className = "image-error";
      err.textContent = "❌ Zu lange gedauert. Das Modell ist vielleicht überlastet. Versuch es nochmal oder wähle ein anderes Modell.";
      imageResults.prepend(err);
    }, 60000);

    img.onload = () => {
      clearTimeout(timeout);
      loading.remove();
      const card = document.createElement("div");
      card.className = "image-card";
      const imgClone = document.createElement("img");
      imgClone.src = url;
      card.appendChild(imgClone);
      const info = document.createElement("div");
      info.className = "info";
      const pt = document.createElement("span");
      pt.className = "prompt-text";
      pt.textContent = prompt;
      const dl = document.createElement("a");
      dl.href = url; dl.download = "haldo-image-" + Date.now() + ".jpg"; dl.target = "_blank";
      dl.textContent = "⬇️ Öffnen";
      info.appendChild(pt); info.appendChild(dl);
      card.appendChild(info);
      imageResults.prepend(card);

      imageGoBtn.disabled = false;
      imageGoBtn.textContent = "🎨 Erstellen";
      document.getElementById("status").textContent = "✅ Fertig!";
      document.getElementById("status").className = "";
      setTimeout(() => {
        if (document.getElementById("status").textContent === "✅ Fertig!") {
          document.getElementById("status").textContent = "🦚 Bereit";
        }
      }, 2000);
    };

    img.onerror = () => {
      clearTimeout(timeout);
      loading.remove();
      imageGoBtn.disabled = false;
      imageGoBtn.textContent = "🎨 Erstellen";
      document.getElementById("status").textContent = "⚠️ Fehler";
      document.getElementById("status").className = "";

      const err = document.createElement("div");
      err.className = "image-error";
      err.innerHTML = "❌ Bild konnte nicht erstellt werden.<br><br>" +
        "<b>Mögliche Gründe:</b><br>" +
        "• Key ungültig oder abgelaufen → <a href=\"https://enter.pollinations.ai/keys\" target=\"_blank\" style=\"color:#00d4ff\">neuen Key holen</a><br>" +
        "• Kein Pollen-Guthaben → auf enter.pollinations.ai prüfen<br>" +
        "• Modell überlastet → anderes Modell probieren<br>" +
        "• Zu viele Anfragen → 30 Sek. warten";
      imageResults.prepend(err);
    };

    img.src = url;
  }

  imageGoBtn.addEventListener("click", generateImage);
  imagePrompt.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generateImage();
  });

  console.log("🦚 HalDo Avatar v7 · Mit Bild-Erstellung");
})();
</script>
</body>
</html>
