<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Avatar Test 2 · HalDo 3D Kopf</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #050810;
    font-family: system-ui, -apple-system, sans-serif;
    color: #00d4ff;
  }
  #status {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(0, 212, 255, 0.15);
    border: 1px solid #00d4ff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    z-index: 100;
  }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid rgba(0, 212, 255, 0.3);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 12px;
    color: #7a8ba8;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="status">✅ Schritt 2 · 3D-Kopf geladen</div>
<div id="hint">👀 Beweg die Maus — die Augen folgen dir</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
if (typeof THREE === "undefined") {
  document.getElementById("status").textContent = "❌ Three.js nicht geladen";
} else {

  // ============ 1. SZENE ============
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 0, 6);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x050810, 1);
  document.body.appendChild(renderer.domElement);

  // ============ 2. LICHT ============
  // Warmes Hauptlicht von vorne rechts
  const light1 = new THREE.DirectionalLight(0xffffff, 1.1);
  light1.position.set(3, 4, 5);
  scene.add(light1);

  // Cyan-Akzent von links
  const light2 = new THREE.PointLight(0x00d4ff, 1.5, 15);
  light2.position.set(-4, 1, 2);
  scene.add(light2);

  // Violett-Akzent von rechts hinten
  const light3 = new THREE.PointLight(0x7c3aed, 1.2, 15);
  light3.position.set(4, -2, -2);
  scene.add(light3);

  // Weiches Umgebungslicht
  const ambient = new THREE.AmbientLight(0x404060, 0.8);
  scene.add(ambient);

  // ============ 3. KOPF ============
  // Der Kopf ist eine Kugel, die in Y etwas gestreckt wird (wie ein echter Kopf)
  const headGroup = new THREE.Group();
  scene.add(headGroup);

  const headGeo = new THREE.SphereGeometry(1, 64, 64);
  const headMat = new THREE.MeshPhongMaterial({
    color: 0xe8c19c,     // Hautfarbe
    shininess: 30,
    specular: 0x555555,
    flatShading: false
  });
  const head = new THREE.Mesh(headGeo, headMat);
  // Kopf etwas in die Länge ziehen (menschliche Kopfform)
  head.scale.set(0.85, 1.05, 0.9);
  headGroup.add(head);

  // ============ 4. AUGEN ============
  // Position: leicht vorne, in Augenhöhe
  const eyeY = 0.15;
  const eyeX = 0.32;
  const eyeZ = 0.78;

  function createEye(offsetX) {
    const eyeGroup = new THREE.Group();

    // Augapfel (weiß)
    const ballGeo = new THREE.SphereGeometry(0.13, 32, 32);
    const ballMat = new THREE.MeshPhongMaterial({
      color: 0xfbfaf8,
      shininess: 100,
      specular: 0xffffff
    });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    eyeGroup.add(ball);

    // Iris (blau)
    const irisGeo = new THREE.SphereGeometry(0.075, 32, 32);
    const irisMat = new THREE.MeshPhongMaterial({
      color: 0x4a7ba8,
      shininess: 120,
      specular: 0xffffff
    });
    const iris = new THREE.Mesh(irisGeo, irisMat);
    iris.position.z = 0.095;
    iris.scale.z = 0.4;
    eyeGroup.add(iris);

    // Pupille (schwarz)
    const pupilGeo = new THREE.SphereGeometry(0.035, 32, 32);
    const pupilMat = new THREE.MeshPhongMaterial({ color: 0x0a0a0a });
    const pupil = new THREE.Mesh(pupilGeo, pupilMat);
    pupil.position.z = 0.12;
    pupil.scale.z = 0.5;
    eyeGroup.add(pupil);

    // Glanzpunkt (Highlight)
    const shineGeo = new THREE.SphereGeometry(0.018, 16, 16);
    const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const shine = new THREE.Mesh(shineGeo, shineMat);
    shine.position.set(-0.03, 0.03, 0.14);
    eyeGroup.add(shine);

    eyeGroup.position.set(offsetX, eyeY, eyeZ);
    return eyeGroup;
  }

  const leftEye = createEye(-eyeX);
  const rightEye = createEye(eyeX);
  headGroup.add(leftEye);
  headGroup.add(rightEye);

  // ============ 5. HOLOGRAMM-RING ============
  const ringGroup = new THREE.Group();
  scene.add(ringGroup);

  function createRing(radius, color, tubeRadius) {
    const geo = new THREE.TorusGeometry(radius, tubeRadius, 16, 100);
    const mat = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.5
    });
    return new THREE.Mesh(geo, mat);
  }

  const ring1 = createRing(2, 0x00d4ff, 0.01);
  ring1.rotation.x = Math.PI * 0.5;
  ringGroup.add(ring1);

  const ring2 = createRing(2.3, 0x7c3aed, 0.008);
  ring2.rotation.x = Math.PI * 0.5;
  ringGroup.add(ring2);

  const ring3 = createRing(2.6, 0x00d4ff, 0.006);
  ring3.rotation.x = Math.PI * 0.5;
  ringGroup.add(ring3);

  // ============ 6. MAUS-TRACKING ============
  let mouseX = 0;
  let mouseY = 0;

  document.addEventListener("mousemove", (e) => {
    // Normalisiert von -1 bis +1
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -((e.clientY / window.innerHeight) * 2 - 1);
  });

  // ============ 7. RESIZE ============
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ============ 8. ANIMATION ============
  let t = 0;

  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    // Kopf atmet (schwebt leicht)
    headGroup.position.y = Math.sin(t * 1.2) * 0.05;

    // Kopf dreht sich leicht in Richtung Maus
    headGroup.rotation.y = mouseX * 0.25;
    headGroup.rotation.x = -mouseY * 0.15;

    // Augen folgen der Maus (stärker als der Kopf)
    const eyeTargetX = mouseX * 0.06;
    const eyeTargetY = mouseY * 0.05;

    leftEye.position.x = -eyeX + eyeTargetX;
    rightEye.position.x = eyeX + eyeTargetX;
    leftEye.position.y = eyeY + eyeTargetY;
    rightEye.position.y = eyeY + eyeTargetY;

    // Augen schauen leicht in Richtung Maus (Z-Rotation)
    leftEye.lookAt(mouseX * 3, mouseY * 3, 5);
    rightEye.lookAt(mouseX * 3, mouseY * 3, 5);

    // Ringe rotieren
    ringGroup.rotation.y += 0.003;
    ring1.rotation.z += 0.008;
    ring2.rotation.z -= 0.005;
    ring3.rotation.z += 0.006;

    renderer.render(scene, camera);
  }

  animate();
}
</script>
</body>
</html>
