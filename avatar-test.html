<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo Avatar · Chat mit KI</title>
<style>
  body { margin: 0; overflow: hidden; background: #050810; font-family: system-ui, -apple-system, sans-serif; color: #e6f0ff; height: 100vh; }
  #canvas-wrap { position: fixed; inset: 0; z-index: 0; }

  /* ===== CHAT PANEL (links) ===== */
  #chatPanel {
    position: fixed;
    top: 20px; left: 20px;
    width: 360px;
    max-height: calc(100vh - 40px);
    background: rgba(10, 15, 28, 0.92);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 16px;
    display: flex; flex-direction: column;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 212, 255, 0.1);
    z-index: 100;
    overflow: hidden;
  }
  #chatHeader {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(0,212,255,0.15);
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(124,58,237,0.08));
  }
  #chatHeader .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 10px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  #chatHeader h2 {
    margin: 0; font-size: 13.5px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: #00d4ff;
  }
  #chatHeader .badge {
    margin-left: auto;
    font-size: 10px; padding: 3px 8px;
    border-radius: 10px;
    background: rgba(0,212,255,0.15);
    color: #00d4ff;
    border: 1px solid rgba(0,212,255,0.3);
    font-weight: 700;
  }

  #chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex; flex-direction: column;
    gap: 10px;
    min-height: 200px;
    max-height: calc(100vh - 320px);
  }
  #chatLog::-webkit-scrollbar { width: 6px; }
  #chatLog::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }

  .msg {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.5;
    max-width: 88%;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(0,212,255,0.22), rgba(124,58,237,0.22));
    border: 1px solid rgba(0,212,255,0.35);
  }
  .msg.bot {
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .msg.sys {
    align-self: center;
    font-size: 11.5px;
    color: #7a8ba8;
    background: transparent;
    padding: 4px;
    text-align: center;
  }
  .msg .who {
    font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: #7a8ba8; margin-bottom: 4px;
  }
  .msg.user .who { color: #00d4ff; }

  .typing {
    display: flex; gap: 4px;
    padding: 12px 16px;
    align-self: flex-start;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #00d4ff;
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  #chatInputWrap {
    padding: 12px;
    border-top: 1px solid rgba(0,212,255,0.15);
    display: flex; gap: 8px;
    background: rgba(0,0,0,0.2);
  }
  #chatInput {
    flex: 1;
    background: #0f1524;
    border: 1px solid rgba(0,212,255,0.2);
    color: #e6f0ff;
    padding: 10px 14px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
  }
  #chatInput:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  #micBtn, #sendBtn {
    width: 42px; height: 42px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    transition: all .15s;
    flex-shrink: 0;
  }
  #micBtn {
    background: rgba(0,212,255,0.15);
    border: 1px solid rgba(0,212,255,0.3);
    color: #00d4ff;
  }
  #micBtn:hover { background: rgba(0,212,255,0.25); }
  #micBtn.listening {
    background: linear-gradient(135deg, #ef4444, #f97316);
    color: #fff;
    animation: micPulse 1s infinite;
  }
  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
  }
  #sendBtn {
    background: linear-gradient(135deg, #00d4ff, #7c3aed);
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,212,255,0.3);
  }
  #sendBtn:hover { box-shadow: 0 6px 24px rgba(0,212,255,0.5); }

  /* ===== QUICK BUTTONS ===== */
  #quickBar {
    padding: 8px 12px;
    display: flex; gap: 6px; flex-wrap: wrap;
    border-top: 1px solid rgba(0,212,255,0.1);
    background: rgba(0,0,0,0.15);
  }
  .quick {
    font-size: 11px;
    padding: 5px 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: #a8b8d0;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .quick:hover { background: rgba(0,212,255,0.15); color: #e6f0ff; border-color: rgba(0,212,255,0.4); }

  /* ===== SETTINGS PANEL (rechts) ===== */
  #panel {
    position: fixed; top: 20px; right: 20px;
    width: 280px; max-height: calc(100vh - 40px);
    overflow-y: auto;
    background: rgba(10, 15, 28, 0.92);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 14px;
    padding: 16px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    font-size: 13px;
    z-index: 100;
  }
  #panel::-webkit-scrollbar { width: 5px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }
  #panel h3 {
    margin: 0 0 14px 0; font-size: 13px;
    color: #00d4ff; letter-spacing: 1.5px;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  #panel h3::before {
    content: ""; width: 8px; height: 8px;
    border-radius: 50%; background: #00d4ff;
    box-shadow: 0 0 10px #00d4ff;
  }
  .group { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .group-title {
    font-size: 10.5px; color: #7a8ba8;
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 8px; font-weight: 700;
  }
  .row {
    display: flex; align-items: center;
    justify-content: space-between; gap: 10px; padding: 5px 0;
  }
  .row label { font-size: 12px; color: #a8b8d0; flex: 1; }
  input[type="color"] { width: 38px; height: 26px; border: 1px solid rgba(0,212,255,0.3); border-radius: 6px; background: transparent; cursor: pointer; padding: 2px; }
  input[type="range"] { width: 100px; accent-color: #00d4ff; }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #00d4ff; cursor: pointer; }
  select {
    background: #0f1524; color: #e6f0ff;
    border: 1px solid rgba(0,212,255,.3);
    border-radius: 6px; padding: 5px 8px;
    font-family: inherit; font-size: 11.5px;
    outline: none; cursor: pointer;
    max-width: 140px;
  }
  .val { font-size: 10.5px; color: #00d4ff; font-weight: 700; min-width: 30px; text-align: right; }
  .keyInput {
    width: 100%;
    background: #0f1524;
    border: 1px solid rgba(0,212,255,0.3);
    color: #e6f0ff;
    padding: 7px 10px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11.5px;
    outline: none;
    margin-top: 6px;
  }
  .keyInput:focus { border-color: #00d4ff; }
  .hint { font-size: 10.5px; color: #7a8ba8; line-height: 1.4; margin-top: 4px; }

  #status {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 212, 255, 0.15);
    border: 1px solid #00d4ff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: #00d4ff;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    z-index: 100;
    transition: all .2s;
  }
  #status.speaking { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,0.15); }
  #status.listening { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.15); }

  @media (max-width: 900px) {
    #panel { display: none; }
    #chatPanel { width: 300px; }
  }
  @media (max-width: 600px) {
    #chatPanel { width: calc(100vw - 40px); left: 20px; top: auto; bottom: 20px; max-height: 60vh; }
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<!-- ===== CHAT ===== -->
<div id="chatPanel">
  <div id="chatHeader">
    <span class="dot"></span>
    <h2>HalDo Chat</h2>
    <span class="badge" id="aiStatus">kein Key</span>
  </div>
  <div id="chatLog"></div>
  <div id="quickBar">
    <button class="quick" data-q="Hallo! Wie geht es dir?">👋 Hallo</button>
    <button class="quick" data-q="Wie spät ist es?">🕐 Zeit</button>
    <button class="quick" data-q="Erzähl mir einen Witz!">😂 Witz</button>
    <button class="quick" data-q="Was kannst du alles?">💡 Fähigkeiten</button>
    <button class="quick" data-q="Gib mir eine kreative Idee für heute.">✨ Idee</button>
  </div>
  <div id="chatInputWrap">
    <button id="micBtn" title="Spracheingabe">🎙️</button>
    <input id="chatInput" type="text" placeholder="Schreib mir was…" autocomplete="off">
    <button id="sendBtn" title="Senden">➤</button>
  </div>
</div>

<!-- ===== SETTINGS ===== -->
<div id="panel">
  <h3>Avatar-Studio</h3>

  <div class="group">
    <div class="group-title">🤖 KI & Gemini</div>
    <input class="keyInput" id="apiKey" type="password" placeholder="Gemini API-Key (AIza…)">
    <div class="hint">Kostenlos auf <b>aistudio.google.com/apikey</b> — Key bleibt lokal.</div>
    <div class="row" style="margin-top:8px;">
      <label>Modell</label>
      <select id="aiModel">
        <option value="">Wird geladen…</option>
      </select>
    </div>
    <div class="row">
      <label>Auto-Vorlesen</label>
      <input type="checkbox" id="autoSpeak" checked>
    </div>
  </div>

  <div class="group">
    <div class="group-title">💇 Haare</div>
    <div class="row"><label>Haarfarbe</label><input type="color" id="hairColor" value="#1a1410"></div>
    <div class="row"><label>Frisur</label>
      <select id="hairStyle">
        <option value="curly" selected>Lockig</option>
        <option value="straight">Glatt</option>
        <option value="short">Kurz</option>
        <option value="bald">Glatze</option>
      </select>
    </div>
  </div>

  <div class="group">
    <div class="group-title">🧔 Bart</div>
    <div class="row"><label>Bart an</label><input type="checkbox" id="beardOn" checked></div>
    <div class="row"><label>Bartfarbe</label><input type="color" id="beardColor" value="#3a2a1a"></div>
    <div class="row"><label>Grau-Anteil</label><input type="range" id="beardGray" min="0" max="100" value="55"><span class="val" id="beardGrayVal">55%</span></div>
    <div class="row"><label>Schnurrbart</label><input type="checkbox" id="mustacheOn" checked></div>
  </div>

  <div class="group">
    <div class="group-title">🎨 Haut & Augen</div>
    <div class="row"><label>Hautfarbe</label><input type="color" id="skinColor" value="#c99a72"></div>
    <div class="row"><label>Augenfarbe</label><input type="color" id="eyeColor" value="#4a3220"></div>
    <div class="row"><label>Augenbrauen</label><input type="checkbox" id="browsOn" checked></div>
  </div>

  <div class="group">
    <div class="group-title">👕 Kleidung</div>
    <div class="row"><label>Shirt</label><input type="color" id="shirtColor" value="#0a0a0a"></div>
  </div>

  <div class="group">
    <div class="group-title">🎙️ Stimme</div>
    <div class="row"><label>Stimme</label><select id="voiceSelect"></select></div>
    <div class="row"><label>Tempo</label><input type="range" id="voiceRate" min="0.5" max="2" step="0.1" value="1"><span class="val" id="voiceRateVal">1.0</span></div>
    <div class="row"><label>Tonhöhe</label><input type="range" id="voicePitch" min="0.5" max="2" step="0.1" value="1"><span class="val" id="voicePitchVal">1.0</span></div>
  </div>

  <div class="group">
    <div class="group-title">✨ Effekte</div>
    <div class="row"><label>Holo-Ringe</label><input type="checkbox" id="ringsOn" checked></div>
    <div class="row"><label>Maus-Tracking</label><input type="checkbox" id="trackingOn" checked></div>
    <div class="row"><label>Auto-Blinzeln</label><input type="checkbox" id="blinkOn" checked></div>
  </div>
</div>

<div id="status">🦚 Bereit</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  "use strict";

  if (typeof THREE === "undefined") {
    document.getElementById("status").textContent = "❌ Three.js nicht geladen";
    return;
  }

  // ==================== STATE ====================
  const defaults = {
    hairColor: "#1a1410", hairStyle: "curly",
    beardOn: true, beardColor: "#3a2a1a", beardGray: 55, mustacheOn: true,
    skinColor: "#c99a72", eyeColor: "#4a3220", browsOn: true,
    shirtColor: "#0a0a0a",
    ringsOn: true, trackingOn: true, blinkOn: true,
    emotion: "neutral",
    voiceRate: 1.0, voicePitch: 1.0, voiceName: "",
    apiKey: "", aiModel: "", autoSpeak: true,
    chatHistory: []
  };
  const state = Object.assign({}, defaults);
  try {
    const saved = localStorage.getItem("haldo_avatar_settings_v6");
    if (saved) Object.assign(state, JSON.parse(saved));
  } catch(e) {}

  function saveState() {
    try { localStorage.setItem("haldo_avatar_settings_v6", JSON.stringify(state)); } catch(e) {}
  }

  // ==================== SZENE ====================
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.1, 5.5);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x050810, 1);
  document.getElementById("canvas-wrap").appendChild(renderer.domElement);

  // LICHT
  const dirLight = new THREE.DirectionalLight(0xfff4e6, 1.15);
  dirLight.position.set(3, 4, 5);
  scene.add(dirLight);
  const cyanLight = new THREE.PointLight(0x00d4ff, 1.2, 15);
  cyanLight.position.set(-4, 1, 2);
  scene.add(cyanLight);
  const purpLight = new THREE.PointLight(0x7c3aed, 1.0, 15);
  purpLight.position.set(4, -2, -2);
  scene.add(purpLight);
  scene.add(new THREE.AmbientLight(0x606580, 0.9));

  // MATERIALIEN
  const skinMat = new THREE.MeshPhongMaterial({ color: state.skinColor, shininess: 25, specular: 0x333333 });
  const hairMat = new THREE.MeshPhongMaterial({ color: state.hairColor, shininess: 60, specular: 0x222222 });
  const beardMat = new THREE.MeshPhongMaterial({ color: state.beardColor, shininess: 20, specular: 0x111111 });
  const grayBeardMat = new THREE.MeshPhongMaterial({ color: 0xb8b8b8, shininess: 15, specular: 0x222222 });
  const lipMat = new THREE.MeshPhongMaterial({ color: 0xa85050, shininess: 60, specular: 0x333333 });
  const eyeWhiteMat = new THREE.MeshPhongMaterial({ color: 0xfbfaf8, shininess: 100, specular: 0xffffff });
  const irisMat = new THREE.MeshPhongMaterial({ color: state.eyeColor, shininess: 120, specular: 0xffffff });
  const pupilMat = new THREE.MeshPhongMaterial({ color: 0x0a0a0a });
  const browMat = new THREE.MeshPhongMaterial({ color: 0x1a1410, shininess: 30 });
  const shirtMat = new THREE.MeshPhongMaterial({ color: state.shirtColor, shininess: 15, specular: 0x111111 });
  const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.45 });
  const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x7c3aed, transparent: true, opacity: 0.45 });

  // ==================== AUFBAU ====================
  const headGroup = new THREE.Group();
  scene.add(headGroup);

  // Hals
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.55, 32), skinMat);
  neck.position.set(0, -1.05, 0.02);
  headGroup.add(neck);

  // Schultern
  const shoulder = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 32), shirtMat);
  shoulder.scale.set(1.55, 0.55, 0.85);
  shoulder.position.set(0, -1.55, 0);
  headGroup.add(shoulder);

  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.06, 16, 40), shirtMat);
  collar.rotation.x = Math.PI * 0.5;
  collar.position.set(0, -1.3, 0);
  headGroup.add(collar);

  // Kopf
  const head = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), skinMat);
  head.scale.set(0.98, 1.08, 0.92);
  headGroup.add(head);

  // Wangen
  const cheekMat = new THREE.MeshPhongMaterial({ color: 0xd88070, transparent: true, opacity: 0.35 });
  const cheekGeo = new THREE.SphereGeometry(0.22, 16, 16);
  const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
  cheekL.scale.set(1, 0.7, 0.3);
  cheekL.position.set(-0.5, -0.05, 0.72);
  headGroup.add(cheekL);
  const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
  cheekR.scale.set(1, 0.7, 0.3);
  cheekR.position.set(0.5, -0.05, 0.72);
  headGroup.add(cheekR);

  // Augen
  const eyeY = 0.12, eyeX = 0.34, eyeZ = 0.82;
  const leftEye = new THREE.Group();
  const rightEye = new THREE.Group();
  function buildEye(g) {
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.135, 32, 32), eyeWhiteMat));
    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.08, 32, 32), irisMat);
    iris.position.z = 0.1; iris.scale.z = 0.4; g.add(iris);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.04, 32, 32), pupilMat);
    pupil.position.z = 0.125; pupil.scale.z = 0.5; g.add(pupil);
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    shine.position.set(-0.035, 0.035, 0.145); g.add(shine);
  }
  buildEye(leftEye); buildEye(rightEye);
  leftEye.position.set(-eyeX, eyeY, eyeZ);
  rightEye.position.set(eyeX, eyeY, eyeZ);
  headGroup.add(leftEye, rightEye);

  // Lider
  const lidMat = new THREE.MeshPhongMaterial({ color: state.skinColor });
  const lidGeo = new THREE.SphereGeometry(0.14, 32, 32, 0, Math.PI * 2, 0, Math.PI * 0.5);
  const lidL = new THREE.Mesh(lidGeo, lidMat);
  const lidR = new THREE.Mesh(lidGeo, lidMat);
  lidL.position.set(-eyeX, eyeY, eyeZ);
  lidR.position.set(eyeX, eyeY, eyeZ);
  lidL.rotation.x = Math.PI;
  lidR.rotation.x = Math.PI;
  lidL.scale.set(1, 0.01, 1);
  lidR.scale.set(1, 0.01, 1);
  headGroup.add(lidL, lidR);

  // Augenbrauen
  const browGroup = new THREE.Group();
  const browGeo = new THREE.BoxGeometry(0.36, 0.075, 0.09);
  const browL = new THREE.Mesh(browGeo, browMat);
  browL.position.set(-0.34, 0.36, 0.86);
  browL.rotation.z = -0.12;
  browGroup.add(browL);
  const browR = new THREE.Mesh(browGeo, browMat);
  browR.position.set(0.34, 0.36, 0.86);
  browR.rotation.z = 0.12;
  browGroup.add(browR);
  headGroup.add(browGroup);
  browGroup.visible = state.browsOn;

  // Nase
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.11, 32, 32), skinMat);
  nose.scale.set(0.75, 0.9, 1.3);
  nose.position.set(0, -0.05, 0.88);
  headGroup.add(nose);
  const nostrilMat = new THREE.MeshPhongMaterial({ color: 0x3a1a10 });
  const nostrilGeo = new THREE.SphereGeometry(0.028, 16, 16);
  const nostrilL = new THREE.Mesh(nostrilGeo, nostrilMat);
  nostrilL.position.set(-0.07, -0.12, 0.94);
  headGroup.add(nostrilL);
  const nostrilR = new THREE.Mesh(nostrilGeo, nostrilMat);
  nostrilR.position.set(0.07, -0.12, 0.94);
  headGroup.add(nostrilR);

  // Mund
  const mouthGroup = new THREE.Group();
  mouthGroup.position.set(0, -0.48, 0.86);
  headGroup.add(mouthGroup);

    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(x => x.name === state.voiceName);
    if (v) u.voice = v;
    u.rate = state.voiceRate;
    u.pitch = state.voicePitch;
    u.onstart = () => {

      document.getElementById("status").textContent = "🦚 Bereit";
      document.getElementById("status").className = "";

    u.onerror = u.onend;
    synth.speak(u);

  // ==================== ANIMATION ====================
  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.016;

    headGroup.position.y = Math.sin(t * 1.1) * 0.04;

    if (state.trackingOn) {
      headGroup.rotation.y += ((mouseX * 0.25) - headGroup.rotation.y) * 0.08;
      headGroup.rotation.x += ((-mouseY * 0.15) - headGroup.rotation.x) * 0.08;
      const eTargetX = mouseX * 0.06;
      const eTargetY = mouseY * 0.05;
      leftEye.position.x = -eyeX + eTargetX;
      rightEye.position.x = eyeX + eTargetX;
      leftEye.position.y = eyeY + eTargetY;
      rightEye.position.y = eyeY + eTargetY;
      leftEye.lookAt(mouseX * 3, mouseY * 3, 5);
      rightEye.lookAt(mouseX * 3, mouseY * 3, 5);
      lidL.position.x = leftEye.position.x;
      lidL.position.y = leftEye.position.y;
      lidR.position.x = rightEye.position.x;
      lidR.position.y = rightEye.position.y;
    } else {
      headGroup.rotation.y += (0 - headGroup.rotation.y) * 0.08;
      headGroup.rotation.x += (0 - headGroup.rotation.x) * 0.08;
    }

    // Blinzeln
    if (state.blinkOn && !speaking) {
      blinkTimer++;
      if (blinkTimer > nextBlink) {
        blinkProgress = Math.max(0, blinkProgress - 0.15);
        if (blinkProgress <= 0) {
          blinkTimer = 0;
          nextBlink = 100 + Math.random() * 200;
          setTimeout(() => { blinkProgress = 1; }, 80);
        }
      } else {
        blinkProgress = Math.min(1, blinkProgress + 0.1);
      }
    } else {
      blinkProgress = Math.min(1, blinkProgress + 0.1);
    }
    const lidScale = Math.max(0.01, 1 - blinkProgress);
    lidL.scale.y = lidScale;
    lidR.scale.y = lidScale;

    // Emotionen
    const emo = emotionTargets[state.emotion] || emotionTargets.neutral;
    currentBrow.L += (emo.browL - currentBrow.L) * 0.1;
    currentBrow.R += (emo.browR - currentBrow.R) * 0.1;
    currentBrow.Lz += (emo.browLz - currentBrow.Lz) * 0.1;
    currentBrow.Rz += (emo.browRz - currentBrow.Rz) * 0.1;
    browL.position.y = currentBrow.L;
    browR.position.y = currentBrow.R;
    browL.rotation.z = currentBrow.Lz;
    browR.rotation.z = currentBrow.Rz;
    mouthGroup.position.y += (emo.mouthY - mouthGroup.position.y) * 0.1;
    const curve = emo.mouthCurve;
    upperLip.position.y = 0.06 + curve * 0.02;
    lowerLip.position.y = -0.08 - curve * 0.02;

    // Mund-offen
    currentMouthOpen += (targetMouthOpen - currentMouthOpen) * 0.25;
    mouthGroup.scale.y = 1 + currentMouthOpen * 0.9;
    mouthInner.visible = currentMouthOpen > 0.15;
    mouthInner.position.y = -0.02 - currentMouthOpen * 0.03;

    if (state.ringsOn) {
      ringGroup.visible = true;
      ringGroup.rotation.y += 0.003;
      ring1.rotation.z += 0.008;
      ring2.rotation.z -= 0.005;
      ring3.rotation.z += 0.006;
    } else {
      ringGroup.visible = false;
    }

    renderer.render(scene, camera);
  }

  async function loadAvailableModels() {

    aiModelEl.innerHTML = "<option value=\"\">Lade Modelle…</option>";

        return;

      const data = await res.json();

        return;

        opt.value = shortName;
        opt.textContent = shortName;
        if (state.aiModel === shortName) opt.selected = true;

  // ==================== GEMINI ====================
  async function askGemini(userText) {
    if (!state.apiKey) throw new Error("Kein API-Key. Trag ihn oben rechts ein (aistudio.google.com/apikey).");
    if (!state.aiModel) throw new Error("Kein Modell gewählt. Lade die Seite neu oder trag einen API-Key ein.");
    const model = state.aiModel;
    const sys = "Du bist HalDo, ein freundlicher, warmer, intelligenter Assistent. Antworte natürlich, hilfsbereit, kurz und auf Deutsch, außer der Nutzer schreibt in einer anderen Sprache. Sei persönlich und menschlich.";
    const contents = [];
    const hist = state.chatHistory.slice(-11, -1);
    hist.forEach(m => {
      contents.push({
        role: m.role === "user" ? "user" : "model",
        parts: [{ text: m.text }]
      });
    });
    contents.push({ role: "user", parts: [{ text: userText }] });

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
    const body = { contents, generationConfig: { temperature: 0.8, maxOutputTokens: 500 } };
    if (sys) body.systemInstruction = { parts: [{ text: sys }] };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error("Gemini Fehler " + res.status + ": " + err.slice(0, 200));
    }
    const data = await res.json();
    const txt = data?.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join("\n");
    return (txt || "(keine Antwort)").trim();
  }

  // Lokale Schnellantworten (ohne KI-Key)
  function localReply(text) {
    const lower = text.toLowerCase().trim();
    if (/^(hallo|hi|hey|servus|merhaba|silav|guten (morgen|tag|abend))/.test(lower)) {
      const h = new Date().getHours();
      const greet = h < 6 ? "Gute Nacht" : h < 12 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
      return greet + " Bruder! Wie kann ich dir helfen?";
    }
    if (/uhrzeit|wie spät/.test(lower)) {
      return "Es ist " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr.";
    }
    if (/datum|welcher tag/.test(lower)) {
      return "Heute ist " + new Date().toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" }) + ".";
    }
    if (/witz|lustig/.test(lower)) {
      const witze = [
        "Warum können Geister so schlecht lügen? Weil man durch sie hindurchsieht! 👻",
        "Was macht ein Clown im Büro? Faxen! 🤡",
        "Wie nennt man einen Bumerang, der nicht zurückkommt? Stock. 🪃"
      ];
      return witze[Math.floor(Math.random() * witze.length)];
    }
    if (/was kannst du|fähigkeit|hilfe/.test(lower)) {
      return "Ich kann: mit dir reden, Uhrzeit & Datum sagen, Witze erzählen. Mit API-Key: Fragen beantworten, Texte schreiben, Ideen geben, übersetzen — fast alles! 🦚";
    }
    return null;
  }

  // Emotion aus Antwort ableiten
  function detectEmotion(text) {
    const l = text.toLowerCase();
    if (/\?|wirklich|unglaublich|echt|staun/.test(l)) return "surprised";
    if (/haha|lach|witz|freu|toll|super|schön/.test(l)) return "happy";
    if (/sorry|traurig|leider|schade/.test(l)) return "sad";
    if (/wütend|ärger|sauer|nerv/.test(l)) return "angry";
    if (/denk|überleg|vielleicht|hmm/.test(l)) return "thinking";
    return "neutral";
  }

  async function handleUserMessage(text) {
    addMessage("user", text);

    const local = localReply(text);
    if (!state.apiKey) {
      if (local) {
        setTimeout(() => {
          addMessage("bot", local);
          if (state.autoSpeak) speak(local);
          state.emotion = detectEmotion(local);
        }, 400);
      } else {
        setTimeout(() => {
          addMessage("bot", "Ich habe noch keinen API-Key. Trag oben rechts deinen Gemini-Key ein (aistudio.google.com/apikey) — dann kann ich richtig antworten!");
        }, 400);
      }
      return;
    }

    showTyping();
    document.getElementById("status").textContent = "🤖 denke nach…";
    try {
      const reply = await askGemini(text);
      hideTyping();
      addMessage("bot", reply);
      state.emotion = detectEmotion(reply);
      if (state.autoSpeak) speak(reply);
      document.getElementById("status").textContent = "🦚 Bereit";
    } catch (e) {
      hideTyping();
      addMessage("sys", "⚠️ " + e.message);
      document.getElementById("status").textContent = "⚠️ Fehler";
      console.warn(e);
    }
  }

  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      const v = chatInput.value.trim();
      if (v) { chatInput.value = ""; handleUserMessage(v); }
    }
  });
  sendBtn.addEventListener("click", () => {
    const v = chatInput.value.trim();
    if (v) { chatInput.value = ""; handleUserMessage(v); }
  });

  document.querySelectorAll(".quick").forEach(btn => {
    btn.addEventListener("click", () => {
      const q = btn.dataset.q;
      handleUserMessage(q);
    });
  });

  // ==================== SPRACHEINGABE ====================
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  let isListening = false;

  if (SpeechRec) {
    rec = new SpeechRec();
    rec.lang = "de-DE";
    rec.interimResults = false;
    rec.continuous = false;
    rec.onresult = (e) => {
      const txt = e.results[0][0].transcript;
      chatInput.value = txt;
      handleUserMessage(txt);
      chatInput.value = "";
    };
    rec.onend = () => {
      isListening = false;
      micBtn.classList.remove("listening");
      document.getElementById("status").textContent = "🦚 Bereit";
      document.getElementById("status").className = "";
    };
    rec.onerror = (e) => {
      isListening = false;
      micBtn.classList.remove("listening");
      document.getElementById("status").textContent = "⚠️ " + e.error;
    };
  }

  micBtn.addEventListener("click", () => {
    if (!rec) {
      alert("Spracheingabe wird von deinem Browser nicht unterstützt. Nutze Chrome oder Edge.");
      return;
    }
    if (isListening) {
      rec.stop();
      return;
    }
    try {
      rec.start();
      isListening = true;
      micBtn.classList.add("listening");
      document.getElementById("status").textContent = "🎙️ Ich höre zu…";
      document.getElementById("status").className = "listening";
    } catch (e) {
      console.warn(e);
    }
  });

  console.log("🦚 HalDo Avatar v6 · Chat + KI bereit");
  console.log("📌 Aktuelles Modell:", state.aiModel);
})();
</script>
</body>
</html>
