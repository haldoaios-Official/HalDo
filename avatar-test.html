<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo AI OS · Foto-Avatar V6</title>
<style>
:root{--primary:#00d4ff;--primary-2:#7c3aed;--bg:#050810;--bg-3:#0f1524;--border:rgba(0,212,255,.12);--text:#e6f0ff;--text-dim:#7a8ba8;--success:#22c55e;--danger:#ef4444;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden}
#stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center}
#avatar-canvas{display:block;max-width:100vw;max-height:100vh}
#topbar{position:fixed;top:0;left:0;right:0;height:44px;z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(180deg,rgba(5,8,16,.95),rgba(5,8,16,0));pointer-events:none}
#topbar .title{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:1px;pointer-events:auto}
#topbar .spacer{flex:1}
#topbar .mode-row{display:flex;gap:4px;pointer-events:auto}
.mode-btn{padding:6px 12px;background:rgba(10,15,28,.85);border:1px solid rgba(0,212,255,.3);color:var(--text-dim);border-radius:8px;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;backdrop-filter:blur(10px);transition:all .15s}
.mode-btn.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none}
#toggleUI{position:fixed;top:10px;left:10px;z-index:200;width:38px;height:38px;border-radius:10px;background:rgba(10,15,28,.85);border:1px solid rgba(0,212,255,.3);color:var(--primary);cursor:pointer;font-size:16px;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
#toggleUI:hover{background:rgba(0,212,255,.2)}
#panel{position:fixed;top:60px;left:10px;width:300px;max-height:calc(100vh - 80px);background:rgba(10,15,28,.88);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:100;overflow:hidden;transition:transform .25s,opacity .25s}
#panel.hidden{transform:translateX(-320px);opacity:0;pointer-events:none}
#panel-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(124,58,237,.08))}
#panel-header .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#panel-header h2{margin:0;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--primary)}
#tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.2)}
.tab{flex:1;padding:6px 4px;background:transparent;border:1px solid transparent;border-radius:7px;color:var(--text-dim);font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer}
.tab.active{background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(124,58,237,.2));border-color:rgba(0,212,255,.4);color:var(--text)}
.panel-content{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0}
.panel-content.active{display:flex}
.form-area{padding:12px;overflow-y:auto;max-height:60vh}
.form-area h3{margin-bottom:8px;color:var(--primary);font-size:13px}
.form-area p{color:var(--text-dim);font-size:11.5px;line-height:1.5;margin-bottom:6px}
.upload-btn{width:100%;padding:11px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .15s}
.upload-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,212,255,.5)}
.upload-btn.danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:var(--danger);box-shadow:none}
.info-box{padding:10px;background:rgba(0,212,255,.05);border:1px dashed rgba(0,212,255,.3);border-radius:9px;font-size:11px;color:var(--text-dim);line-height:1.5;margin-top:8px}
.info-box b{color:var(--text)}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.msg{padding:9px 12px;border-radius:11px;font-size:12.5px;line-height:1.45;max-width:88%;word-wrap:break-word;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(0,212,255,.22),rgba(124,58,237,.22));border:1px solid rgba(0,212,255,.35)}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.msg.sys{align-self:center;font-size:10.5px;color:var(--text-dim);padding:3px}
.msg .who{font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:3px}
.msg.user .who{color:var(--primary)}
.input-row{padding:10px;border-top:1px solid rgba(0,212,255,.15);display:flex;gap:6px;background:rgba(0,0,0,.25)}
.input-row input{flex:1;background:var(--bg-3);border:1px solid rgba(0,212,255,.2);color:var(--text);padding:8px 12px;border-radius:9px;font-family:inherit;font-size:12.5px;outline:none;min-width:0}
.input-row button{width:38px;height:38px;border-radius:9px;border:none;cursor:pointer;font-size:15px;flex-shrink:0}
#micBtn{background:rgba(0,212,255,.15);border:1px solid rgba(0,212,255,.3);color:var(--primary)}
#sendBtn{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
#settings{position:fixed;top:60px;right:10px;width:200px;max-height:calc(100vh - 80px);overflow-y:auto;background:rgba(10,15,28,.88);border:1px solid var(--border);border-radius:14px;padding:12px;backdrop-filter:blur(20px);font-size:11.5px;z-index:100;transition:transform .25s,opacity .25s}
#settings.hidden{transform:translateX(220px);opacity:0;pointer-events:none}
#settings h3{margin:0 0 10px;font-size:10.5px;color:var(--primary);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
#settings h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary)}
.group{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.group-title{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0}
.row label{font-size:11px;color:var(--text-dim);flex:1}
.row input[type="checkbox"]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.keyInput{width:100%;background:var(--bg-3);border:1px solid rgba(0,212,255,.3);color:var(--text);padding:6px 9px;border-radius:7px;font-family:inherit;font-size:10.5px;outline:none;margin-top:4px}
#status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,212,255,.15);border:1px solid var(--primary);padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;color:var(--primary);z-index:100;pointer-events:none;backdrop-filter:blur(10px)}
@media (max-width:600px){#panel{width:280px}#settings{width:180px}}
</style>
</head>
<body>

<div id="stage"><canvas id="avatar-canvas"></canvas></div>

<div id="topbar">
  <div class="title">🦚 HalDo Foto V6</div>
  <div class="spacer"></div>
  <div class="mode-row">
    <button class="mode-btn active" data-mode="human">🧑 Human</button>
    <button class="mode-btn" data-mode="cyborg">🤖 Cyborg</button>
    <button class="mode-btn" data-mode="hologram">✨ Holo</button>
  </div>
</div>

<button id="toggleUI" title="Panels ein-/ausblenden">☰</button>

<div id="panel">
  <div id="panel-header">
    <span class="dot"></span>
    <h2>HalDo AI OS</h2>
  </div>
  <div id="tabs">
    <button class="tab" data-tab="chatTab">💬 Chat</button>
    <button class="tab active" data-tab="homeTab">🏠 Home</button>
  </div>
  <div id="chatTab" class="panel-content">
    <div class="chat-log" id="chatLog"></div>
    <div class="input-row">
      <button id="micBtn">🎙️</button>
      <input id="chatInput" type="text" placeholder="Schreib mir…" autocomplete="off">
      <button id="sendBtn">➤</button>
    </div>
  </div>
  <div id="homeTab" class="panel-content active">
    <div class="form-area">
      <h3>🦚 Foto-Avatar V6</h3>
      <p><b style="color:var(--text)">Fix in V6:</b><br>
      ✅ Headset <b>auf den Kopf</b><br>
      ✅ LED-Augen <b>auf die Augen</b><br>
      ✅ Reaktor <b>kleiner + höher</b><br>
      ✅ Holo Scan-Strahl <b>über Breite</b></p>
      <button class="upload-btn" id="uploadBtn">📸 Foto auswählen</button>
      <button class="upload-btn danger" id="clearBtn" style="display:none">🗑️ Foto löschen</button>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <div class="info-box">
        <b>💡</b> ☰ oben links um Panels einzuklappen.
      </div>
    </div>
  </div>
</div>

<div id="settings">
  <h3>Studio</h3>
  <div class="group">
    <div class="group-title">✨ Effekte</div>
    <div class="row"><label>Atmung</label><input type="checkbox" id="breathOn" checked></div>
    <div class="row"><label>Tracking</label><input type="checkbox" id="trackingOn" checked></div>
    <div class="row"><label>Partikel</label><input type="checkbox" id="particlesOn" checked></div>
    <div class="row"><label>Scan-Linien</label><input type="checkbox" id="scanlinesOn" checked></div>
  </div>
  <div class="group">
    <div class="group-title">🔑 API Key</div>
    <input class="keyInput" id="groqKey" type="password" placeholder="Groq gsk_…" autocomplete="off">
  </div>
</div>

<div id="status">🦚 Bereit</div>

<script>
(function() {
  "use strict";

  var state = {
    avatarMode: "human",
    breathOn: true,
    trackingOn: true,
    particlesOn: true,
    scanlinesOn: true,
    groqKey: "",
    chatHistory: [],
    photoData: null
  };
  try {
    var saved = localStorage.getItem("haldo_photo_v6");
    if (saved) {
      var parsed = JSON.parse(saved);
      for (var k in parsed) { state[k] = parsed[k]; }
    }
  } catch (e) {}
  if (!state.photoData) {
    try {
      var old5 = localStorage.getItem("haldo_photo_v5");
      if (old5) { var o5 = JSON.parse(old5); if (o5.photoData) state.photoData = o5.photoData; }
      if (!state.photoData) {
        var old4 = localStorage.getItem("haldo_photo_v4");
        if (old4) { var o4 = JSON.parse(old4); if (o4.photoData) state.photoData = o4.photoData; }
      }
      if (!state.photoData) {
        var old3 = localStorage.getItem("haldo_photo_v3");
        if (old3) { var o3 = JSON.parse(old3); if (o3.photoData) state.photoData = o3.photoData; }
      }
    } catch(e) {}
  }

  function saveState() {
    try { localStorage.setItem("haldo_photo_v6", JSON.stringify(state)); } catch (e) {}
  }

  var canvas = document.getElementById("avatar-canvas");
  var ctx = canvas.getContext("2d");

  var faceImg = new Image();
  var faceLoaded = false;

  if (state.photoData) {
    faceImg.onload = function() {
      faceLoaded = true;
      resizeCanvas();
      setStatus("🦚 Avatar bereit");
      updateButtons();
    };
    faceImg.src = state.photoData;
  }

  var mouseX = 0, mouseY = 0;
  document.addEventListener("mousemove", function(e) {
    mouseX = (e.clientX / window.innerWidth) * 2 - 1;
    mouseY = -((e.clientY / window.innerHeight) * 2 - 1);
  });

  var t = 0;
  var speakGlow = 0;
  var targetGlow = 0;

  var particles = [];
  for (var i = 0; i < 100; i++) {
    particles.push({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - 0.5) * 0.0005,
      vy: -0.0004 - Math.random() * 0.001,
      size: 1.2 + Math.random() * 2.6,
      hue: Math.random() < 0.5 ? 190 : 270,
      phase: Math.random() * Math.PI * 2
    });
  }

  function resizeCanvas() {
    var maxW = window.innerWidth;
    var maxH = window.innerHeight;
    var w = maxW, h = maxH;
    if (faceLoaded && faceImg.width > 0) {
      var ratio = faceImg.width / faceImg.height;
      if (maxW / ratio <= maxH) { w = maxW; h = maxW / ratio; }
      else { h = maxH; w = maxH * ratio; }
    }
    canvas.width = w * window.devicePixelRatio;
    canvas.height = h * window.devicePixelRatio;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }
  window.addEventListener("resize", resizeCanvas);

  function draw() {
    requestAnimationFrame(draw);
    t += 0.016;
    var W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    var breath = state.breathOn ? Math.sin(t * 1.1) * 0.008 : 0;
    var tiltX = state.trackingOn ? mouseX * 0.025 : 0;
    speakGlow += (targetGlow - speakGlow) * 0.12;

    var cx = W / 2, cy = H / 2;
    var scale = 1 + breath;

    var glowColor = state.avatarMode === "cyborg" ? "0,212,255" : state.avatarMode === "hologram" ? "124,58,237" : "0,212,255";
    var glowIntensity = 0.3 + speakGlow * 0.5;
    var radial = ctx.createRadialGradient(cx, cy, W * 0.1, cx, cy, W * 0.6);
    radial.addColorStop(0, "rgba(" + glowColor + ", 0)");
    radial.addColorStop(0.65, "rgba(" + glowColor + ", " + glowIntensity + ")");
    radial.addColorStop(1, "rgba(" + glowColor + ", 0)");
    ctx.fillStyle = radial;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tiltX);
    ctx.scale(scale, scale);

    var filterStr = "";
    var globalAlpha = 1;
    if (state.avatarMode === "human") {
      filterStr = "contrast(1.06) saturate(1.05) brightness(1.01)";
    } else if (state.avatarMode === "cyborg") {
      filterStr = "grayscale(0.9) saturate(1.4) contrast(1.35) brightness(0.92) hue-rotate(185deg)";
      globalAlpha = 0.98;
    } else if (state.avatarMode === "hologram") {
      filterStr = "hue-rotate(175deg) saturate(2.8) brightness(1.3) contrast(1.15)";
      globalAlpha = 0.75;
    }

    ctx.filter = filterStr;
    ctx.globalAlpha = globalAlpha;

    if (faceLoaded) {
      ctx.drawImage(faceImg, -W / 2, -H / 2, W, H);
    } else {
      ctx.filter = "none";
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(15,21,36,0.6)";
      ctx.beginPath();
      ctx.arc(0, 0, Math.min(W, H) * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#00d4ff";
      ctx.font = "bold " + (W * 0.04) + "px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("📸", 0, -20);
      ctx.font = "bold " + (W * 0.018) + "px system-ui";
      ctx.fillText("Foto auswählen", 0, 30);
    }
    ctx.restore();

    if (state.avatarMode === "cyborg" && faceLoaded) {
      drawCyborgOverlay(W, H);
    } else if (state.avatarMode === "hologram" && faceLoaded) {
      drawHoloOverlay(W, H);
    } else if (state.avatarMode === "human" && faceLoaded) {
      var vg = ctx.createRadialGradient(cx, cy, W * 0.35, cx, cy, W * 0.65);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.35)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    if (state.particlesOn) {
      ctx.save();
      for (var p = 0; p < particles.length; p++) {
        var pt = particles[p];
        pt.x += pt.vx; pt.y += pt.vy;
        if (pt.y < -0.05) { pt.y = 1.05; pt.x = Math.random(); }
        if (pt.x < -0.05) pt.x = 1.05;
        if (pt.x > 1.05) pt.x = -0.05;
        var px = pt.x * W, py = pt.y * H;
        var alpha = 0.3 + Math.sin(t * 2 + pt.phase) * 0.35;
        ctx.fillStyle = "hsla(" + pt.hue + ", 100%, 68%, " + alpha + ")";
        ctx.beginPath();
        ctx.arc(px, py, pt.size * window.devicePixelRatio, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ==================== CYBORG — Positionen korrigiert ====================
  // Foto: Augen bei ~32% vom Top, Mund ~48%, Kinn ~55%, Brust ~75%
  // ====================
  function drawCyborgOverlay(W, H) {
    var cx = W / 2;

    // === HEADSET-BOGEN — oben auf dem Kopf ===
    // Kopf-Oberseite liegt bei ~10-15% vom Top → cy - H*0.35
    var headTopY = H * 0.18; // knapp über Kopf
    var headWidth = W * 0.28;

    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255,0.95)";
    ctx.lineWidth = W * 0.014;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 40;
    ctx.lineCap = "round";
    ctx.beginPath();
    // Bogen auf dem Kopf
    ctx.arc(cx, headTopY + H * 0.10, headWidth, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    // Innerer violett Bogen
    ctx.strokeStyle = "rgba(124,58,237,0.75)";
    ctx.lineWidth = W * 0.005;
    ctx.shadowColor = "#7c3aed";
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(cx, headTopY + H * 0.10, headWidth * 0.94, Math.PI * 1.10, Math.PI * 1.90);
    ctx.stroke();
    ctx.restore();

    // === OHRMUSCHELN — seitlich auf Kopfhöhe ===
    var dirs = [-1, 1];
    var earY = H * 0.32; // auf Augen-/Ohrenhöhe
    var earX = W * 0.32;

    for (var i = 0; i < dirs.length; i++) {
      var ex = cx + dirs[i] * earX;
      var ey = earY;
      var pulse = 0.75 + Math.sin(t * 5 + i * 1.7) * 0.25;
      ctx.save();
      ctx.strokeStyle = "rgba(0,212,255," + pulse + ")";
      ctx.lineWidth = W * 0.008;
      ctx.shadowColor = "#00d4ff";
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.arc(ex, ey, W * 0.028, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ex, ey, W * 0.017, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(0,212,255," + pulse + ")";
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(ex, ey, W * 0.008, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // === LED-AUGEN — auf Augenhöhe (~32% vom Top) ===
    var eyeY = H * 0.32;
    var eyeDX = W * 0.11;

    for (var j = 0; j < dirs.length; j++) {
      var ex2 = cx + dirs[j] * eyeDX;
      var pulse2 = 0.8 + Math.sin(t * 4.5 + (dirs[j] + 1)) * 0.2;
      ctx.save();
      // Äußerer Glow
      ctx.shadowColor = "#00d4ff";
      ctx.shadowBlur = 60 * pulse2;
      ctx.fillStyle = "rgba(0,212,255," + (0.3 * pulse2) + ")";
      ctx.beginPath();
      ctx.arc(ex2, eyeY, W * 0.042, 0, Math.PI * 2);
      ctx.fill();
      // Ring
      ctx.strokeStyle = "rgba(0,212,255," + (0.95 * pulse2) + ")";
      ctx.lineWidth = W * 0.004;
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.arc(ex2, eyeY, W * 0.032, 0, Math.PI * 2);
      ctx.stroke();
      // LED
      ctx.fillStyle = "rgba(0,212,255," + (0.95 * pulse2) + ")";
      ctx.beginPath();
      ctx.arc(ex2, eyeY, W * 0.020, 0, Math.PI * 2);
      ctx.fill();
      // Weißer Kern
      ctx.fillStyle = "rgba(255,255,255," + pulse2 + ")";
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(ex2, eyeY, W * 0.010, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // === PANEL-LINIEN auf Stirn ===
    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255,0.30)";
    ctx.lineWidth = W * 0.0015;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 6;
    for (var li = 0; li < 3; li++) {
      var ly = H * (0.12 + li * 0.05);
      ctx.beginPath();
      ctx.moveTo(cx - W * 0.18, ly);
      ctx.lineTo(cx + W * 0.18, ly);
      ctx.stroke();
    }
    ctx.restore();

    // === BRUST-REAKTOR — auf Brust (~75% vom Top) ===
    var reactorY = H * 0.75;
    var pulse3 = 1 + Math.sin(t * 3) * 0.15;
    var rR = W * 0.045 * pulse3;

    ctx.save();
    // Äußerer Glow
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 80;
    ctx.fillStyle = "rgba(0,212,255,0.35)";
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 1.5, 0, Math.PI * 2);
    ctx.fill();
    // Haupt-Reaktor
    ctx.fillStyle = "#00d4ff";
    ctx.shadowBlur = 60;
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR, 0, Math.PI * 2);
    ctx.fill();
    // Weißer Kern
    ctx.fillStyle = "rgba(255,255,255,0.98)";
    ctx.shadowBlur = 40;
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 0.40, 0, Math.PI * 2);
    ctx.fill();
    // Ring 1
    ctx.strokeStyle = "rgba(124,58,237,1)";
    ctx.lineWidth = W * 0.008;
    ctx.shadowColor = "#7c3aed";
    ctx.shadowBlur = 35;
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 1.8, t * 0.9, t * 0.9 + Math.PI * 1.4);
    ctx.stroke();
    // Ring 2
    ctx.strokeStyle = "rgba(0,212,255,1)";
    ctx.shadowColor = "#00d4ff";
    ctx.beginPath();
    ctx.arc(cx, reactorY, rR * 2.1, -t * 0.6, -t * 0.6 + Math.PI * 0.8);
    ctx.stroke();
    ctx.restore();
  }

  // ==================== HOLO — Scan-Strahl über Breite ====================
  function drawHoloOverlay(W, H) {
    var cx = W / 2, cy = H / 2;

    // === CYAN-TINT ===
    ctx.fillStyle = "rgba(0,212,255,0.12)";
    ctx.fillRect(0, 0, W, H);

    // === SCAN-LINES (über ganze Breite) ===
    if (state.scanlinesOn) {
      ctx.save();
      ctx.fillStyle = "rgba(0,212,255,0.22)";
      var lineSpacing = 4 * window.devicePixelRatio;
      var offset = (t * 60) % lineSpacing;
      for (var y = 0; y < H; y += lineSpacing) {
        ctx.fillRect(0, y + offset, W, 2 * window.devicePixelRatio);
      }
      ctx.fillStyle = "rgba(0,212,255,0.10)";
      var ls2 = 2 * window.devicePixelRatio;
      var off2 = (-t * 30) % ls2;
      for (var y2 = 0; y2 < H; y2 += ls2) {
        ctx.fillRect(0, y2 + off2, W, 1 * window.devicePixelRatio);
      }
      ctx.restore();
    }

    // === SCAN-STRAHL — volle Breite, hoch/runter ===
    // Strahl 1 (cyan)
    var scanY = (Math.sin(t * 0.7) * 0.5 + 0.5) * H;
    var grad = ctx.createLinearGradient(0, scanY - H * 0.08, 0, scanY + H * 0.08);
    grad.addColorStop(0, "rgba(0,212,255,0)");
    grad.addColorStop(0.5, "rgba(0,212,255,0.75)");
    grad.addColorStop(1, "rgba(0,212,255,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, scanY - H * 0.08, W, H * 0.16);

    // Strahl 2 (violett, gegenläufig)
    var scanY2 = (Math.sin(-t * 1.1) * 0.5 + 0.5) * H;
    var grad2 = ctx.createLinearGradient(0, scanY2 - H * 0.04, 0, scanY2 + H * 0.04);
    grad2.addColorStop(0, "rgba(124,58,237,0)");
    grad2.addColorStop(0.5, "rgba(124,58,237,0.55)");
    grad2.addColorStop(1, "rgba(124,58,237,0)");
    ctx.fillStyle = grad2;
    ctx.fillRect(0, scanY2 - H * 0.04, W, H * 0.08);

    // === BODEN-RINGE (tiefer) ===
    var baseY = H * 0.92;
    for (var i = 0; i < 4; i++) {
      var rx = W * (0.45 - i * 0.08);
      var ry = rx * 0.10;
      var color = i % 2 === 0 ? "0,212,255" : "124,58,237";
      ctx.strokeStyle = "rgba(" + color + ", " + (0.75 - i * 0.12) + ")";
      ctx.lineWidth = W * 0.005;
      ctx.save();
      ctx.shadowColor = i % 2 === 0 ? "#00d4ff" : "#7c3aed";
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.ellipse(cx, baseY, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // === ECKEN-MARKER (pulsierend) ===
    var pulse4 = 0.7 + Math.sin(t * 1.5) * 0.3;
    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255," + pulse4 + ")";
    ctx.lineWidth = W * 0.005;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 25;
    var cLen = W * 0.05;
    var corners = [
      [W * 0.025, H * 0.06, 1, 1],
      [W * 0.975, H * 0.06, -1, 1],
      [W * 0.025, H * 0.94, 1, -1],
      [W * 0.975, H * 0.94, -1, -1]
    ];
    for (var ci = 0; ci < corners.length; ci++) {
      var c = corners[ci];
      ctx.beginPath();
      ctx.moveTo(c[0], c[1] + c[3] * cLen);
      ctx.lineTo(c[0], c[1]);
      ctx.lineTo(c[0] + c[2] * cLen, c[1]);
      ctx.stroke();
    }
    ctx.restore();

    // === GLOW-RAHMEN (pulsierend) ===
    ctx.save();
    ctx.strokeStyle = "rgba(0,212,255," + (0.35 * pulse4) + ")";
    ctx.lineWidth = W * 0.002;
    ctx.shadowColor = "#00d4ff";
    ctx.shadowBlur = 30;
    ctx.strokeRect(W * 0.03, H * 0.07, W * 0.94, H * 0.86);
    ctx.restore();
  }

  draw();

  // ==================== FOTO UPLOAD ====================
  var uploadBtn = document.getElementById("uploadBtn");
  var clearBtn = document.getElementById("clearBtn");
  var fileInput = document.getElementById("fileInput");

  uploadBtn.addEventListener("click", function() { fileInput.click(); });

  fileInput.addEventListener("change", function(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      alert("Bild zu groß! Bitte unter 4 MB.");
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev) {
      state.photoData = ev.target.result;
      saveState();
      faceImg.onload = function() {
        faceLoaded = true;
        resizeCanvas();
        setStatus("🦚 Foto geladen!");
        updateButtons();
      };
      faceImg.src = state.photoData;
    };
    reader.readAsDataURL(file);
  });

  clearBtn.addEventListener("click", function() {
    if (!confirm("Foto wirklich löschen?")) return;
    state.photoData = null;
    saveState();
    faceLoaded = false;
    faceImg = new Image();
    setStatus("🦚 Foto gelöscht");
    updateButtons();
  });

  function updateButtons() {
    if (faceLoaded) {
      uploadBtn.textContent = "🔄 Foto wechseln";
      clearBtn.style.display = "block";
    } else {
      uploadBtn.textContent = "📸 Foto auswählen";
      clearBtn.style.display = "none";
    }
  }
  updateButtons();

  // ==================== PANEL TOGGLE ====================
  var panel = document.getElementById("panel");
  var settings = document.getElementById("settings");
  document.getElementById("toggleUI").addEventListener("click", function() {
    panel.classList.toggle("hidden");
    settings.classList.toggle("hidden");
  });

  // ==================== UI ====================
  var modeBtns = document.querySelectorAll("[data-mode]");
  for (var mbi = 0; mbi < modeBtns.length; mbi++) {
    (function(btn) {
      btn.addEventListener("click", function() {
        state.avatarMode = btn.dataset.mode;
        saveState();
        for (var k = 0; k < modeBtns.length; k++) { modeBtns[k].classList.remove("active"); }
        btn.classList.add("active");
      });
    })(modeBtns[mbi]);
  }
  for (var mbj = 0; mbj < modeBtns.length; mbj++) {
    if (modeBtns[mbj].dataset.mode === state.avatarMode) { modeBtns[mbj].classList.add("active"); }
    else { modeBtns[mbj].classList.remove("active"); }
  }

  function bindCheck(id, key) {
    var el = document.getElementById(id);
    el.checked = state[key];
    el.addEventListener("change", function(e) {
      state[key] = e.target.checked;
      saveState();
    });
  }
  bindCheck("breathOn", "breathOn");
  bindCheck("trackingOn", "trackingOn");
  bindCheck("particlesOn", "particlesOn");
  bindCheck("scanlinesOn", "scanlinesOn");

  var tabs = document.querySelectorAll(".tab");
  for (var ti = 0; ti < tabs.length; ti++) {
    (function(tab) {
      tab.addEventListener("click", function() {
        for (var k = 0; k < tabs.length; k++) { tabs[k].classList.remove("active"); }
        tab.classList.add("active");
        var panes = document.querySelectorAll(".panel-content");
        for (var k2 = 0; k2 < panes.length; k2++) { panes[k2].classList.remove("active"); }
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    })(tabs[ti]);
  }

  var gk = document.getElementById("groqKey");
  gk.value = state.groqKey;
  gk.addEventListener("input", function(e) {
    state.groqKey = e.target.value.trim();
    saveState();
  });

  // ==================== CHAT ====================
  var chatLog = document.getElementById("chatLog");
  var chatInput = document.getElementById("chatInput");

  function addMsg(role, text, save) {
    if (save === undefined) save = true;
    if (save) {
      state.chatHistory.push({ role: role, text: text, ts: Date.now() });
      if (state.chatHistory.length > 100) state.chatHistory.shift();
      saveState();
    }
    var el = document.createElement("div");
    el.className = "msg " + role;
    if (role !== "sys") {
      var w = document.createElement("div");
      w.className = "who";
      w.textContent = role === "user" ? "Du" : "HalDo";
      el.appendChild(w);
    }
    el.appendChild(document.createTextNode(text));
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  if (state.chatHistory.length) {
    for (var hi = 0; hi < state.chatHistory.length; hi++) {
      var hm = state.chatHistory[hi];
      addMsg(hm.role, hm.text, false);
    }
  } else {
    addMsg("bot", "Hallo Bruder! 🦚 Foto V6 — Positionen gefixt!", false);
  }

  async function askGroq(text) {
    if (!state.groqKey) throw new Error("Kein Groq-Key.");
    var contents = [];
    var slice = state.chatHistory.slice(-11, -1);
    for (var i = 0; i < slice.length; i++) {
      contents.push({
        role: slice[i].role === "user" ? "user" : "model",
        content: slice[i].text
      });
    }
    contents.push({ role: "user", content: text });
    var r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + state.groqKey },
      body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: contents, temperature: 0.8, max_tokens: 500 })
    });
    if (!r.ok) throw new Error("Groq " + r.status);
    var d = await r.json();
    return ((d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "(keine)").trim();
  }

  function localReply(text) {
    var l = text.toLowerCase().trim();
    if (/^(hallo|hi|hey|servus|merhaba|silav|guten)/.test(l)) {
      var h = new Date().getHours();
      var g = h < 6 ? "Gute Nacht" : h < 12 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
      return g + " Bruder!";
    }
    if (/uhrzeit|wie spät/.test(l)) return "Es ist " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr.";
    if (/witz|lustig/.test(l)) return ["Warum können Geister so schlecht lügen? Weil man durch sie hindurchsieht! 👻", "Was macht ein Clown im Büro? Faxen! 🤡"][Math.floor(Math.random() * 2)];
    return null;
  }

  async function handleMsg(text) {
    addMsg("user", text);
    var local = localReply(text);
    if (!state.groqKey) {
      if (local) setTimeout(function() { addMsg("bot", local); speak(local); }, 400);
      else setTimeout(function() { addMsg("bot", "Kein Groq-Key. Trag ihn rechts ein."); }, 400);
      return;
    }
    setStatus("🤖 denke…");
    try {
      var reply = await askGroq(text);
      addMsg("bot", reply);
      speak(reply);
      setStatus("🦚 Bereit");
    } catch (e) { addMsg("sys", "⚠️ " + e.message); setStatus("⚠️ Fehler"); }
  }

  chatInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      var v = chatInput.value.trim();
      if (v) { chatInput.value = ""; handleMsg(v); }
    }
  });
  document.getElementById("sendBtn").addEventListener("click", function() {
    var v = chatInput.value.trim();
    if (v) { chatInput.value = ""; handleMsg(v); }
  });

  var synth = window.speechSynthesis;
  var voices = [];
  function loadVoices() { voices = synth.getVoices(); }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  function speak(text) {
    if (!synth) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    var v = voices.find(function(x) { return x.lang.startsWith("de"); });
    if (v) u.voice = v;
    u.rate = 1.0; u.pitch = 1.05; u.lang = "de-DE";
    u.onstart = function() { targetGlow = 1; setStatus("🔊 spricht…"); };
    u.onend = function() { targetGlow = 0; setStatus("🦚 Bereit"); };
    u.onerror = function() { targetGlow = 0; };
    synth.speak(u);
  }

  function setStatus(text) { document.getElementById("status").textContent = text; }

  var micBtn = document.getElementById("micBtn");
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false;
  if (SR) {
    rec = new SR();
    rec.lang = "de-DE";
    rec.interimResults = false;
    rec.onresult = function(e) { handleMsg(e.results[0][0].transcript); };
    rec.onend = function() { listening = false; micBtn.classList.remove("listening"); setStatus("🦚 Bereit"); };
    rec.onerror = function() { listening = false; micBtn.classList.remove("listening"); };
  }
  micBtn.addEventListener("click", function() {
    if (!rec) return alert("Nur Chrome/Edge.");
    if (listening) { rec.stop(); return; }
    try { rec.start(); listening = true; micBtn.classList.add("listening"); setStatus("🎙️ höre…"); } catch (e) {}
  });

  console.log("🦚 HalDo Foto-Avatar V6 · Positionen korrigiert");
})();
</script>
</body>
</html>
