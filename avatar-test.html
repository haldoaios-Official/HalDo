<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo Avatar · Mit Bild + Audio</title>
<style>
  body { margin: 0; overflow: hidden; background: #050810; font-family: system-ui, -apple-system, sans-serif; color: #e6f0ff; height: 100vh; }
  #canvas-wrap { position: fixed; inset: 0; z-index: 0; }

  #chatPanel {
    position: fixed; top: 20px; left: 20px;
    width: 400px; max-height: calc(100vh - 40px);
    background: rgba(10, 15, 28, 0.92);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 16px;
    display: flex; flex-direction: column;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 212, 255, 0.1);
    z-index: 100; overflow: hidden;
  }
  #chatHeader {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,212,255,0.15);
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(124,58,237,0.08));
  }
  #chatHeader .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  #chatHeader h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #00d4ff; }
  #chatHeader .badge { margin-left: auto; font-size: 10px; padding: 3px 8px; border-radius: 10px; background: rgba(0,212,255,0.15); color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); font-weight: 700; }

  #tabs { display: flex; gap: 3px; padding: 8px 12px; border-bottom: 1px solid rgba(0,212,255,0.1); background: rgba(0,0,0,0.2); }
  .tab { flex: 1; padding: 7px 6px; background: transparent; border: 1px solid transparent; border-radius: 8px; color: #7a8ba8; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .tab:hover { color: #e6f0ff; background: rgba(255,255,255,0.04); }
  .tab.active { background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(124,58,237,0.2)); border-color: rgba(0,212,255,0.4); color: #e6f0ff; }

  .panel-content { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  .panel-content.hidden { display: none; }

  #chatLog { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; }
  #chatLog::-webkit-scrollbar { width: 6px; }
  #chatLog::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }

  .msg { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 88%; word-wrap: break-word; white-space: pre-wrap; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, rgba(0,212,255,0.22), rgba(124,58,237,0.22)); border: 1px solid rgba(0,212,255,0.35); }
  .msg.bot { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
  .msg.sys { align-self: center; font-size: 11px; color: #7a8ba8; background: transparent; padding: 4px; text-align: center; }
  .msg .who { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #7a8ba8; margin-bottom: 4px; }
  .msg.user .who { color: #00d4ff; }

  .typing { display: flex; gap: 4px; padding: 12px 16px; align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: #00d4ff; animation: bounce 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-6px); opacity: 1; } }

  .input-row { padding: 12px; border-top: 1px solid rgba(0,212,255,0.15); display: flex; gap: 8px; background: rgba(0,0,0,0.2); }
  .input-row input { flex: 1; background: #0f1524; border: 1px solid rgba(0,212,255,0.2); color: #e6f0ff; padding: 10px 14px; border-radius: 10px; font-family: inherit; font-size: 13px; outline: none; }
  .input-row input:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  .input-row button { width: 42px; height: 42px; border-radius: 10px; border: none; cursor: pointer; font-size: 16px; transition: all .15s; flex-shrink: 0; }
  #micBtn { background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.3); color: #00d4ff; }
  #micBtn.listening { background: linear-gradient(135deg, #ef4444, #f97316); color: #fff; animation: micPulse 1s infinite; }
  @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
  #sendBtn { background: linear-gradient(135deg, #00d4ff, #7c3aed); color: #fff; box-shadow: 0 4px 16px rgba(0,212,255,0.3); }

  /* Form Styles */
  .form-area { padding: 14px; border-bottom: 1px solid rgba(0,212,255,0.1); overflow-y: auto; }
  .form-area label { display: block; font-size: 10.5px; color: #7a8ba8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; margin-top: 10px; }
  .form-area label:first-child { margin-top: 0; }
  .form-area input[type="password"], .form-area input[type="text"], .form-area textarea, .form-area select {
    width: 100%; background: #0f1524; border: 1px solid rgba(0,212,255,0.3); color: #e6f0ff;
    padding: 9px 12px; border-radius: 9px; font-family: inherit; font-size: 12.5px; outline: none;
    margin-bottom: 4px; box-sizing: border-box;
  }
  .form-area input:focus, .form-area textarea:focus, .form-area select:focus { border-color: #00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  .form-area textarea { resize: vertical; min-height: 60px; font-size: 13px; }
  .form-area select { cursor: pointer; }

  .go-btn { width: 100%; padding: 11px; background: linear-gradient(135deg, #00d4ff, #7c3aed); color: #fff; border: none; border-radius: 9px; font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(0,212,255,0.3); transition: all .15s; margin-top: 8px; }
  .go-btn:hover { box-shadow: 0 6px 24px rgba(0,212,255,0.5); }
  .go-btn:disabled { opacity: 0.5; cursor: wait; }

  /* Sub-Tabs */
  .sub-tabs { display: flex; gap: 3px; padding: 6px 12px; background: rgba(0,0,0,0.15); border-bottom: 1px solid rgba(0,212,255,0.08); }
  .sub-tab { flex: 1; padding: 5px 6px; background: transparent; border: none; border-radius: 6px; color: #7a8ba8; font-family: inherit; font-size: 10.5px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .sub-tab.active { background: rgba(0,212,255,0.15); color: #00d4ff; }

  .sub-content { display: none; }
  .sub-content.active { display: block; }

  /* Results */
  #imageResults, #audioResults { flex: 1; overflow-y: auto; padding: 14px; }
  #imageResults::-webkit-scrollbar, #audioResults::-webkit-scrollbar { width: 6px; }
  #imageResults::-webkit-scrollbar-thumb, #audioResults::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }

  .media-card { margin-bottom: 12px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(0,212,255,0.2); background: rgba(255,255,255,0.03); animation: fadeIn .3s ease; }
  .media-card img, .media-card video { width: 100%; display: block; }
  .media-card audio { width: 100%; padding: 12px; box-sizing: border-box; }
  .media-card .info { padding: 8px 12px; font-size: 11px; color: #7a8ba8; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .media-card .info .prompt-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .media-card .info a { color: #00d4ff; text-decoration: none; font-weight: 600; }
  .media-card .info a:hover { text-decoration: underline; }

  .loading-box { padding: 40px 20px; text-align: center; color: #00d4ff; font-size: 13px; background: rgba(0,212,255,0.05); border-radius: 12px; margin-bottom: 12px; border: 1px dashed rgba(0,212,255,0.3); }
  .loading-box .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid rgba(0,212,255,0.2); border-top-color: #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box { padding: 14px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.4); border-radius: 10px; color: #ef4444; font-size: 12px; line-height: 1.5; margin-bottom: 12px; }
  .error-box a { color: #00d4ff; }

  .key-hint { font-size: 10px; color: #7a8ba8; line-height: 1.4; margin-bottom: 8px; }
  .key-hint a { color: #00d4ff; text-decoration: none; }

  /* Settings Panel */
  #panel {
    position: fixed; top: 20px; right: 20px;
    width: 250px; max-height: calc(100vh - 40px);
    overflow-y: auto;
    background: rgba(10, 15, 28, 0.92);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 14px; padding: 14px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    font-size: 12px; z-index: 100;
  }
  #panel::-webkit-scrollbar { width: 5px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 3px; }
  #panel h3 { margin: 0 0 12px 0; font-size: 12px; color: #00d4ff; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  #panel h3::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #00d4ff; box-shadow: 0 0 10px #00d4ff; }
  .group { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .group-title { font-size: 10px; color: #7a8ba8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .row label { font-size: 11.5px; color: #a8b8d0; flex: 1; }
  input[type="color"] { width: 34px; height: 24px; border: 1px solid rgba(0,212,255,0.3); border-radius: 6px; background: transparent; cursor: pointer; padding: 2px; }
  input[type="range"] { width: 90px; accent-color: #00d4ff; }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #00d4ff; cursor: pointer; }
  select { background: #0f1524; color: #e6f0ff; border: 1px solid rgba(0,212,255,.3); border-radius: 6px; padding: 4px 7px; font-family: inherit; font-size: 11px; outline: none; cursor: pointer; max-width: 130px; }
  .val { font-size: 10px; color: #00d4ff; font-weight: 700; min-width: 28px; text-align: right; }
  .keyInput { width: 100%; background: #0f1524; border: 1px solid rgba(0,212,255,0.3); color: #e6f0ff; padding: 6px 9px; border-radius: 8px; font-family: inherit; font-size: 11px; outline: none; margin-top: 5px; box-sizing: border-box; }
  .hint { font-size: 10px; color: #7a8ba8; line-height: 1.4; margin-top: 4px; }

  #status { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 212, 255, 0.15); border: 1px solid #00d4ff; padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #00d4ff; box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); z-index: 100; transition: all .2s; }
  #status.speaking { border-color: #ec4899; color: #ec4899; background: rgba(236,72,153,0.15); }
  #status.listening { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.15); }
  #status.generating { border-color: #f5c542; color: #f5c542; background: rgba(245,197,66,0.15); }

  @media (max-width: 900px) {
    #panel { display: none; }
    #chatPanel { width: 340px; }
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div id="chatPanel">
  <div id="chatHeader">
    <span class="dot"></span>
    <h2>HalDo</h2>
    <span class="badge" id="aiStatus">kein Key</span>
  </div>

  <div id="tabs">
    <button class="tab active" data-tab="chatTab">💬 Chat</button>
    <button class="tab" data-tab="imageTab">🎨 Bild</button>
    <button class="tab" data-tab="audioTab">🎵 Audio</button>
  </div>

  <!-- CHAT TAB -->
  <div id="chatTab" class="panel-content">
    <div id="chatLog"></div>
    <div class="input-row">
      <button id="micBtn" title="Spracheingabe">🎙️</button>
      <input id="chatInput" type="text" placeholder="Schreib mir was…" autocomplete="off">
      <button id="sendBtn" title="Senden">➤</button>
    </div>
  </div>

  <!-- IMAGE TAB -->
  <div id="imageTab" class="panel-content hidden">
    <div class="form-area">
      <label for="pollKey">Pollinations API-Key</label>
      <input type="password" id="pollKey" placeholder="sk_… (einmal eintragen)">
      <div class="key-hint">Key holen auf <a href="https://enter.pollinations.ai/keys" target="_blank">enter.pollinations.ai/keys</a></div>

      <label for="imagePrompt">Was soll ich zeichnen?</label>
      <textarea id="imagePrompt" placeholder="z.B. Ein brauner Bär im Wald, sonniger Tag, fotorealistisch"></textarea>

      <label for="imageModel">Modell</label>
      <select id="imageModel">
        <option value="black-forest-labs/flux.1-schnell" selected>Flux 1 Schnell (empfohlen)</option>
        <option value="black-forest-labs/flux.2-pro">Flux 2 Pro (hohe Qualität)</option>
        <option value="black-forest-labs/flux.2-flex">Flux 2 Flex</option>
        <option value="openai/gpt-image-1-mini">GPT Image 1 Mini</option>
        <option value="google/gemini-2.5-flash-image">Gemini 2.5 Flash Image</option>
      </select>

      <button class="go-btn" id="imageGoBtn">🎨 Erstellen</button>
    </div>
    <div id="imageResults"></div>
  </div>

  <!-- AUDIO TAB -->
  <div id="audioTab" class="panel-content hidden">
    <div class="sub-tabs">
      <button class="sub-tab active" data-sub="speechSub">🔊 Sprache</button>
      <button class="sub-tab" data-sub="musicSub">🎵 Musik</button>
      <button class="sub-tab" data-sub="sfxSub">🎬 Sound-Effekt</button>
    </div>

    <!-- SPRACHE -->
    <div id="speechSub" class="sub-content active">
      <div class="form-area">
        <label>Text zum Vorlesen</label>
        <textarea id="speechText" placeholder="Hallo, ich bin HalDo und kann sprechen!">Hallo Bruder, wie geht es dir?</textarea>

        <label>Stimme</label>
        <select id="speechVoice">
          <option value="nova" selected>Nova (weiblich, warm)</option>
          <option value="rachel">Rachel (weiblich)</option>
          <option value="bella">Bella (weiblich)</option>
          <option value="sarah">Sarah (weiblich)</option>
          <option value="elli">Elli (weiblich, jung)</option>
          <option value="charlotte">Charlotte (weiblich)</option>
          <option value="adam">Adam (männlich)</option>
          <option value="antoni">Antoni (männlich, tief)</option>
          <option value="josh">Josh (männlich, jung)</option>
          <option value="daniel">Daniel (männlich, ruhig)</option>
          <option value="brian">Brian (männlich, erzählerisch)</option>
          <option value="sam">Sam (männlich, energetisch)</option>
          <option value="alloy">Alloy (neutral)</option>
          <option value="shimmer">Shimmer (hell)</option>
        </select>

        <label>Modell</label>
        <select id="speechModel">
          <option value="elevenlabs/eleven-v3" selected>ElevenLabs v3 (beste Qualität)</option>
          <option value="elevenlabs/eleven-flash-v2.5">ElevenLabs Flash (schnell)</option>
          <option value="openai/tts-1">OpenAI TTS 1</option>
          <option value="openai/tts-1-hd">OpenAI TTS HD</option>
        </select>

        <button class="go-btn" id="speechGoBtn">🔊 Vorlesen</button>
      </div>
    </div>

    <!-- MUSIK -->
    <div id="musicSub" class="sub-content">
      <div class="form-area">
        <label>Beschreibe die Musik</label>
        <textarea id="musicText" placeholder="z.B. Ruhige Klaviermusik, entspannend, abendliche Stimmung">Ruhige Klaviermusik zum Entspannen, warm und melodisch</textarea>

        <label>Modell</label>
        <select id="musicModel">
          <option value="elevenlabs/music-v2.5" selected>ElevenLabs Music v2.5</option>
          <option value="google/lyria-3.5">Google Lyria 3.5</option>
          <option value="google/lyria-3-clip-preview">Google Lyria 3 Clip</option>
          <option value="stability-ai/stable-audio-3">Stable Audio 3</option>
        </select>

        <button class="go-btn" id="musicGoBtn">🎵 Musik erstellen</button>
      </div>
    </div>

    <!-- SOUND-EFFECT -->
    <div id="sfxSub" class="sub-content">
      <div class="form-area">
        <label>Beschreibe den Sound</label>
        <textarea id="sfxText" placeholder="z.B. Regen auf einem Blechdach">Regen auf einem Blechdach, beruhigend</textarea>

        <label>Modell</label>
        <select id="sfxModel">
          <option value="elevenlabs/eleven-text-to-sound-v2" selected>ElevenLabs Text-to-Sound v2</option>
          <option value="stability-ai/stable-audio-3">Stable Audio 3</option>
        </select>

        <button class="go-btn" id="sfxGoBtn">🎬 Sound erstellen</button>
      </div>
    </div>

    <div id="audioResults"></div>
  </div>
</div>

<div id="panel">
  <h3>Avatar-Studio</h3>

  <div class="group">
    <div class="group-title">🤖 KI & Gemini</div>
    <input class="keyInput" id="apiKey" type="password" placeholder="Gemini API-Key (AIza…)">
    <div class="hint">Kostenlos auf <b>aistudio.google.com/apikey</b></div>
    <div class="row" style="margin-top:6px;">
      <label>Modell</label>
      <select id="aiModel"><option value="">wird geladen…</option></select>
    </div>
    <div class="row">
      <label>Auto-Vorlesen</label>
      <input type="checkbox" id="autoSpeak" checked>
    </div>
  </div>

  <div class="group">
    <div class="group-title">💇 Haare</div>
    <div class="row"><label>Farbe</label><input type="color" id="hairColor" value="#1a1410"></div>
    <div class="row"><label>Stil</label>
      <select id="hairStyle">
        <option value="curly" selected>Lockig</option>
        <option value="straight">Glatt</option>
        <option value="short">Kurz</option>
        <option value="bald">Glatze</option>
      </select>
    </div>
  </div>

  <div class="group">
    <div class="group-title">🧔 Bart</div>
    <div class="row"><label>An</label><input type="checkbox" id="beardOn" checked></div>
    <div class="row"><label>Farbe</label><input type="color" id="beardColor" value="#3a2a1a"></div>
    <div class="row"><label>Grau</label><input type="range" id="beardGray" min="0" max="100" value="55"><span class="val" id="beardGrayVal">55%</span></div>
    <div class="row"><label>Schnauzer</label><input type="checkbox" id="mustacheOn" checked></div>
  </div>

  <div class="group">
    <div class="group-title">🎨 Haut & Augen</div>
    <div class="row"><label>Haut</label><input type="color" id="skinColor" value="#c99a72"></div>
    <div class="row"><label>Augen</label><input type="color" id="eyeColor" value="#4a3220"></div>
    <div class="row"><label>Brauen</label><input type="checkbox" id="browsOn" checked></div>
  </div>

  <div class="group">
    <div class="group-title">👕 Kleidung</div>
    <div class="row"><label>Shirt</label><input type="color" id="shirtColor" value="#0a0a0a"></div>
  </div>

  <div class="group">
    <div class="group-title">🎙️ Stimme (Browser)</div>
    <div class="row"><label>Stimme</label><select id="voiceSelect"></select></div>
    <div class="row"><label>Tempo</label><input type="range" id="voiceRate" min="0.5" max="2" step="0.1" value="1"><span class="val" id="voiceRateVal">1.0</span></div>
    <div class="row"><label>Tonhöhe</label><input type="range" id="voicePitch" min="0.5" max="2" step="0.1" value="1"><span class="val" id="voicePitchVal">1.0</span></div>
  </div>

  <div class="group">
    <div class="group-title">✨ Effekte</div>
    <div class="row"><label>Ringe</label><input type="checkbox" id="ringsOn" checked></div>
    <div class="row"><label>Tracking</label><input type="checkbox" id="trackingOn" checked></div>
    <div class="row"><label>Blinzeln</label><input type="checkbox" id="blinkOn" checked></div>
  </div>
</div>

<div id="status">🦚 Bereit</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function() {
  "use strict";
  if (typeof THREE === "undefined") { document.getElementById("status").textContent = "❌ Three.js nicht geladen"; return; }

  const defaults = {
    hairColor: "#1a1410", hairStyle: "curly",
    beardOn: true, beardColor: "#3a2a1a", beardGray: 55, mustacheOn: true,
    skinColor: "#c99a72", eyeColor: "#4a3220", browsOn: true,
    shirtColor: "#0a0a0a",
    ringsOn: true, trackingOn: true, blinkOn: true,
    emotion: "neutral",
    voiceRate: 1.0, voicePitch: 1.0, voiceName: "",
    apiKey: "", aiModel: "", autoSpeak: true,
    pollKey: "",
    imageModel: "black-forest-labs/flux.1-schnell",
    speechVoice: "nova", speechModel: "elevenlabs/eleven-v3",
    musicModel: "elevenlabs/music-v2.5",
    sfxModel: "elevenlabs/eleven-text-to-sound-v2",
    chatHistory: []
  };
  const state = Object.assign({}, defaults);
  try { const s = localStorage.getItem("haldo_avatar_settings_v8"); if (s) Object.assign(state, JSON.parse(s)); } catch(e) {}

  const emotionTargets = {

  const synth = window.speechSynthesis;
  let voices = [], speaking = false, speakInterval = null;
  function loadVoices() {
    voices = synth.getVoices();
    const sel = document.getElementById("voiceSelect"); sel.innerHTML = "";
    const de = voices.filter(v => v.lang.startsWith("de"));
    const others = voices.filter(v => !v.lang.startsWith("de"));
    [...de, ...others].forEach(v => {
      const o = document.createElement("option");
      o.value = v.name; o.textContent = v.name + " (" + v.lang + ")";
      if (state.voiceName && v.name === state.voiceName) o.selected = true;
      sel.appendChild(o);
    });
    if (!state.voiceName && de.length) { state.voiceName = de[0].name; sel.value = de[0].name; saveState(); }
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  function speak(text) {
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(x => x.name === state.voiceName);
    if (v) u.voice = v;
    u.rate = state.voiceRate; u.pitch = state.voicePitch;
    u.onstart = () => {
      speaking = true;
      document.getElementById("status").textContent = "🔊 spricht…";
      document.getElementById("status").className = "speaking";
      speakInterval = setInterval(() => {
        targetMouthOpen = 0.4 + Math.random() * 0.6;
        setTimeout(() => { targetMouthOpen = 0.15 + Math.random() * 0.3; }, 70);
      }, 110);
    };
    u.onend = () => {
      speaking = false; targetMouthOpen = 0;
      if (speakInterval) { clearInterval(speakInterval); speakInterval = null; }
      document.getElementById("status").textContent = "🦚 Bereit";
      document.getElementById("status").className = "";
    };
    u.onerror = u.onend;
    synth.speak(u);
  }

  let blinkTimer = 0, nextBlink = 100 + Math.random() * 150, blinkProgress = 1;
  let t = 0;
  function animate() {
    requestAnimationFrame(animate); t += 0.016;
    headGroup.position.y = Math.sin(t * 1.1) * 0.04;
    if (state.trackingOn) {
      headGroup.rotation.y += ((mouseX * 0.25) - headGroup.rotation.y) * 0.08;
      headGroup.rotation.x += ((-mouseY * 0.15) - headGroup.rotation.x) * 0.08;
      const eTX = mouseX * 0.06, eTY = mouseY * 0.05;
      leftEye.position.x = -eyeX + eTX; rightEye.position.x = eyeX + eTX;
      leftEye.position.y = eyeY + eTY; rightEye.position.y = eyeY + eTY;
      leftEye.lookAt(mouseX * 3, mouseY * 3, 5); rightEye.lookAt(mouseX * 3, mouseY * 3, 5);
      lidL.position.x = leftEye.position.x; lidL.position.y = leftEye.position.y;
      lidR.position.x = rightEye.position.x; lidR.position.y = rightEye.position.y;
    } else {
      headGroup.rotation.y += (0 - headGroup.rotation.y) * 0.08;
      headGroup.rotation.x += (0 - headGroup.rotation.x) * 0.08;
    }
    if (state.blinkOn && !speaking) {
      blinkTimer++;
      if (blinkTimer > nextBlink) {
        blinkProgress = Math.max(0, blinkProgress - 0.15);
        if (blinkProgress <= 0) { blinkTimer = 0; nextBlink = 100 + Math.random() * 200; setTimeout(() => { blinkProgress = 1; }, 80); }
      } else blinkProgress = Math.min(1, blinkProgress + 0.1);
    } else blinkProgress = Math.min(1, blinkProgress + 0.1);
    const ls = Math.max(0.01, 1 - blinkProgress);
    lidL.scale.y = ls; lidR.scale.y = ls;
    const emo = emotionTargets[state.emotion] || emotionTargets.neutral;
    currentBrow.L += (emo.browL - currentBrow.L) * 0.1;
    currentBrow.R += (emo.browR - currentBrow.R) * 0.1;
    currentBrow.Lz += (emo.browLz - currentBrow.Lz) * 0.1;
    currentBrow.Rz += (emo.browRz - currentBrow.Rz) * 0.1;
    browL.position.y = currentBrow.L; browR.position.y = currentBrow.R;
    browL.rotation.z = currentBrow.Lz; browR.rotation.z = currentBrow.Rz;
    mouthGroup.position.y += (emo.mouthY - mouthGroup.position.y) * 0.1;
    const curve = emo.mouthCurve;
    upperLip.position.y = 0.06 + curve * 0.02;
    lowerLip.position.y = -0.08 - curve * 0.02;
    currentMouthOpen += (targetMouthOpen - currentMouthOpen) * 0.25;
    mouthGroup.scale.y = 1 + currentMouthOpen * 0.9;

    mouthInner.position.y = -0.02 - currentMouthOpen * 0.03;

  const aiModelEl = document.getElementById("aiModel");
  async function loadModels() {
    if (!state.apiKey) { aiModelEl.innerHTML = "<option value=\"\">(kein Key)</option>"; return; }
    aiModelEl.innerHTML = "<option value=\"\">lade…</option>";
    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(state.apiKey)}`);
      if (!r.ok) { aiModelEl.innerHTML = "<option value=\"\">(Fehler)</option>"; return; }
      const d = await r.json();
      const ms = (d.models || []).filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"));
      aiModelEl.innerHTML = "";
      ms.forEach(m => {
        const n = m.name.replace("models/", "");
        const o = document.createElement("option"); o.value = n; o.textContent = n;
        if (state.aiModel === n) o.selected = true;
        aiModelEl.appendChild(o);
      });
      if (!ms.find(m => m.name.replace("models/","") === state.aiModel)) {
        const f = ms[0]?.name.replace("models/", "");
        if (f) { state.aiModel = f; aiModelEl.value = f; saveState(); }
      }
    } catch(e) { aiModelEl.innerHTML = "<option value=\"\">(Netzwerkfehler)</option>"; }
  }
  if (state.apiKey) loadModels(); else aiModelEl.innerHTML = "<option value=\"\">Trag Key ein</option>";
  aiModelEl.addEventListener("change", e => { state.aiModel = e.target.value; saveState(); });
  function updateAIStatus() {
    const b = document.getElementById("aiStatus");
    if (state.apiKey) { b.textContent = "KI aktiv"; b.style.background = "rgba(34,197,94,0.15)"; b.style.color = "#22c55e"; b.style.borderColor = "#22c55e"; }
    else { b.textContent = "kein Key"; b.style.background = "rgba(0,212,255,0.15)"; b.style.color = "#00d4ff"; b.style.borderColor = "rgba(0,212,255,0.3)"; }
  }
  updateAIStatus();

  // ==================== CHAT ====================
  const chatLog = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  function addMessage(role, text, save) {
    if (save !== false) { state.chatHistory.push({ role, text, ts: Date.now() }); if (state.chatHistory.length > 100) state.chatHistory.shift(); saveState(); }
    const el = document.createElement("div");
    el.className = "msg " + role;
    if (role !== "sys") { const w = document.createElement("div"); w.className = "who"; w.textContent = role === "user" ? "Du" : "HalDo"; el.appendChild(w); }
    el.appendChild(document.createTextNode(text));
    chatLog.appendChild(el); chatLog.scrollTop = chatLog.scrollHeight;
  }
  function showTyping() {
    const el = document.createElement("div"); el.className = "typing"; el.id = "typingInd";
    el.innerHTML = "<span></span><span></span><span></span>";
    chatLog.appendChild(el); chatLog.scrollTop = chatLog.scrollHeight;
  }
  function hideTyping() { const e = document.getElementById("typingInd"); if (e) e.remove(); }
  if (state.chatHistory.length) state.chatHistory.forEach(m => addMessage(m.role, m.text, false));
  else addMessage("bot", "Hallo Bruder! Ich bin HalDo 🦚 Chatte, erstelle Bilder oder mach Musik!", false);

  async function askGemini(userText) {
    if (!state.apiKey) throw new Error("Kein API-Key.");
    if (!state.aiModel) throw new Error("Kein Modell.");
    const contents = [];
    state.chatHistory.slice(-11, -1).forEach(m => contents.push({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.text }] }));
    contents.push({ role: "user", parts: [{ text: userText }] });
    const sys = "Du bist HalDo, freundlich, warm, intelligent. Antworte kurz und auf Deutsch.";
    const body = { contents, generationConfig: { temperature: 0.8, maxOutputTokens: 500 }, systemInstruction: { parts: [{ text: sys }] } };
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${state.aiModel}:generateContent?key=${encodeURIComponent(state.apiKey)}`;
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) { const e = await r.text(); throw new Error("Gemini " + r.status + ": " + e.slice(0, 180)); }
    const d = await r.json();
    return (d?.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join("\n") || "(keine)").trim();
  }
  function localReply(text) {
    const l = text.toLowerCase().trim();
    if (/^(hallo|hi|hey|servus|merhaba|silav|guten (morgen|tag|abend))/.test(l)) {
      const h = new Date().getHours();
      const g = h < 6 ? "Gute Nacht" : h < 12 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
      return g + " Bruder!";
    }
    if (/uhrzeit|wie spät/.test(l)) return "Es ist " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr.";
    if (/witz|lustig/.test(l)) {
      const w = ["Warum können Geister so schlecht lügen? Weil man durch sie hindurchsieht! 👻", "Was macht ein Clown im Büro? Faxen! 🤡", "Wie nennt man einen Bumerang, der nicht zurückkommt? Stock. 🪃"];
      return w[Math.floor(Math.random() * w.length)];
    }
    return null;
  }
  function detectEmotion(text) {
    const l = text.toLowerCase();
    if (/\?|wirklich|unglaublich/.test(l)) return "surprised";
    if (/haha|lach|witz|freu|toll/.test(l)) return "happy";
    if (/sorry|traurig|leider/.test(l)) return "sad";
    if (/wütend|ärger|sauer/.test(l)) return "angry";
    if (/denk|überleg|vielleicht/.test(l)) return "thinking";
    return "neutral";
  }
  async function handleUserMessage(text) {
    addMessage("user", text);
    const local = localReply(text);
    if (!state.apiKey) {
      if (local) setTimeout(() => { addMessage("bot", local); if (state.autoSpeak) speak(local); state.emotion = detectEmotion(local); }, 400);
      else setTimeout(() => addMessage("bot", "Ich habe noch keinen Gemini-Key. Trag ihn rechts ein."), 400);
      return;
    }
    showTyping(); document.getElementById("status").textContent = "🤖 denke…";
    try {
      const reply = await askGemini(text);
      hideTyping(); addMessage("bot", reply);
      state.emotion = detectEmotion(reply);
      if (state.autoSpeak) speak(reply);
      document.getElementById("status").textContent = "🦚 Bereit";
    } catch(e) { hideTyping(); addMessage("sys", "⚠️ " + e.message); document.getElementById("status").textContent = "⚠️ Fehler"; }
  }
  chatInput.addEventListener("keydown", e => { if (e.key === "Enter") { const v = chatInput.value.trim(); if (v) { chatInput.value = ""; handleUserMessage(v); } } });
  document.getElementById("sendBtn").addEventListener("click", () => { const v = chatInput.value.trim(); if (v) { chatInput.value = ""; handleUserMessage(v); } });

  // ==================== SPRACHEINGABE ====================
  const micBtn = document.getElementById("micBtn");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, isListening = false;
  if (SR) {
    rec = new SR(); rec.lang = "de-DE"; rec.interimResults = false; rec.continuous = false;
    rec.onresult = e => handleUserMessage(e.results[0][0].transcript);
    rec.onend = () => { isListening = false; micBtn.classList.remove("listening"); document.getElementById("status").textContent = "🦚 Bereit"; document.getElementById("status").className = ""; };
    rec.onerror = () => { isListening = false; micBtn.classList.remove("listening"); };
  }
  micBtn.addEventListener("click", () => {
    if (!rec) { alert("Nur in Chrome/Edge."); return; }
    if (isListening) { rec.stop(); return; }
    try { rec.start(); isListening = true; micBtn.classList.add("listening"); document.getElementById("status").textContent = "🎙️ höre…"; document.getElementById("status").className = "listening"; } catch(e) {}
  });

  // ==================== BILD-ERSTELLUNG ====================
  const imagePrompt = document.getElementById("imagePrompt");
  const imageGoBtn = document.getElementById("imageGoBtn");
  const imageResults = document.getElementById("imageResults");
  const imageModelEl = document.getElementById("imageModel");
  imageModelEl.value = state.imageModel;
  imageModelEl.addEventListener("change", e => { state.imageModel = e.target.value; saveState(); });

  imageGoBtn.addEventListener("click", async () => {
    const prompt = imagePrompt.value.trim();
    const key = state.pollKey;
    if (!prompt) { alert("Schreib erst, was ich zeichnen soll!"); return; }
    if (!key) { alert("Trag erst deinen Pollinations-Key oben ein (sk_…)"); return; }
    imageGoBtn.disabled = true; imageGoBtn.textContent = "⏳ Erstelle…";
    document.getElementById("status").textContent = "🎨 Bild…"; document.getElementById("status").className = "generating";
    const load = document.createElement("div"); load.className = "loading-box";
    load.innerHTML = "<div class=\"spinner\"></div><br>„" + prompt + "“";
    imageResults.prepend(load);
    const url = `https://gen.pollinations.ai/image/${encodeURIComponent(prompt)}?model=${encodeURIComponent(state.imageModel)}&width=1024&height=1024&nologo=true&key=${encodeURIComponent(key)}`;
    const img = new Image(); img.crossOrigin = "anonymous";
    const to = setTimeout(() => { load.remove(); imageGoBtn.disabled = false; imageGoBtn.textContent = "🎨 Erstellen"; document.getElementById("status").textContent = "⚠️ Timeout"; const e = document.createElement("div"); e.className = "error-box"; e.textContent = "❌ Zu lange gedauert. Anderes Modell probieren."; imageResults.prepend(e); }, 60000);
    img.onload = () => {
      clearTimeout(to); load.remove();
      const c = document.createElement("div"); c.className = "media-card";
      const ic = document.createElement("img"); ic.src = url; c.appendChild(ic);
      const info = document.createElement("div"); info.className = "info";
      const pt = document.createElement("span"); pt.className = "prompt-text"; pt.textContent = prompt;
      const dl = document.createElement("a"); dl.href = url; dl.target = "_blank"; dl.textContent = "⬇️ Öffnen";
      info.appendChild(pt); info.appendChild(dl); c.appendChild(info);
      imageResults.prepend(c);
      imageGoBtn.disabled = false; imageGoBtn.textContent = "🎨 Erstellen";
      document.getElementById("status").textContent = "✅ Fertig!"; document.getElementById("status").className = "";
      setTimeout(() => { if (document.getElementById("status").textContent === "✅ Fertig!") document.getElementById("status").textContent = "🦚 Bereit"; }, 2000);
    };
    img.onerror = () => {
      clearTimeout(to); load.remove();
      imageGoBtn.disabled = false; imageGoBtn.textContent = "🎨 Erstellen";
      document.getElementById("status").textContent = "⚠️ Fehler";
      const e = document.createElement("div"); e.className = "error-box";
      e.innerHTML = "❌ Fehler.<br>• <a href=\"https://enter.pollinations.ai/keys\" target=\"_blank\">Key prüfen</a><br>• Pollen-Guthaben prüfen<br>• Anderes Modell versuchen";
      imageResults.prepend(e);
    };
    img.src = url;
  });

  // ==================== AUDIO-ERSTELLUNG ====================
  const audioResults = document.getElementById("audioResults");
  const speechText = document.getElementById("speechText");
  const speechVoice = document.getElementById("speechVoice");
  const speechModel = document.getElementById("speechModel");
  const speechGoBtn = document.getElementById("speechGoBtn");
  const musicText = document.getElementById("musicText");
  const musicModel = document.getElementById("musicModel");
  const musicGoBtn = document.getElementById("musicGoBtn");
  const sfxText = document.getElementById("sfxText");
  const sfxModel = document.getElementById("sfxModel");
  const sfxGoBtn = document.getElementById("sfxGoBtn");

  speechVoice.value = state.speechVoice;
  speechModel.value = state.speechModel;
  musicModel.value = state.musicModel;
  sfxModel.value = state.sfxModel;
  speechVoice.addEventListener("change", e => { state.speechVoice = e.target.value; saveState(); });
  speechModel.addEventListener("change", e => { state.speechModel = e.target.value; saveState(); });
  musicModel.addEventListener("change", e => { state.musicModel = e.target.value; saveState(); });
  sfxModel.addEventListener("change", e => { state.sfxModel = e.target.value; saveState(); });

  async function generateAudio(prompt, model, voice, btn, typeLabel) {
    const key = state.pollKey;
    if (!prompt) { alert("Schreib erst deinen Text!"); return; }
    if (!key) { alert("Trag erst deinen Pollinations-Key ein (sk_…)"); return; }
    btn.disabled = true; const origText = btn.textContent; btn.textContent = "⏳ Erstelle…";
    document.getElementById("status").textContent = "🎵 " + typeLabel + "…"; document.getElementById("status").className = "generating";
    const load = document.createElement("div"); load.className = "loading-box";
    load.innerHTML = "<div class=\"spinner\"></div><br>" + typeLabel + ": „" + prompt.slice(0, 60) + "…“";
    audioResults.prepend(load);

    let url = `https://gen.pollinations.ai/audio/${encodeURIComponent(prompt)}?model=${encodeURIComponent(model)}&key=${encodeURIComponent(key)}`;
    if (voice) url += `&voice=${encodeURIComponent(voice)}`;

    try {
      const res = await fetch(url);
      if (!res.ok) {
        const errText = await res.text();
        throw new Error("Fehler " + res.status + ": " + errText.slice(0, 200));
      }
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      load.remove();
      const c = document.createElement("div"); c.className = "media-card";
      const audio = document.createElement("audio"); audio.controls = true; audio.src = objUrl; audio.autoplay = true;
      c.appendChild(audio);
      const info = document.createElement("div"); info.className = "info";
      const pt = document.createElement("span"); pt.className = "prompt-text"; pt.textContent = prompt.slice(0, 60);
      const dl = document.createElement("a"); dl.href = objUrl; dl.download = "haldo-" + typeLabel + "-" + Date.now() + ".mp3"; dl.textContent = "⬇️ Download";
      info.appendChild(pt); info.appendChild(dl); c.appendChild(info);
      audioResults.prepend(c);
      document.getElementById("status").textContent = "✅ Fertig!"; document.getElementById("status").className = "";
      setTimeout(() => { if (document.getElementById("status").textContent === "✅ Fertig!") document.getElementById("status").textContent = "🦚 Bereit"; }, 2000);
    } catch(err) {
      load.remove();
      document.getElementById("status").textContent = "⚠️ Fehler";
      const e = document.createElement("div"); e.className = "error-box";
      e.innerHTML = "❌ " + err.message + "<br><br>• <a href=\"https://enter.pollinations.ai/keys\" target=\"_blank\">Key prüfen</a><br>• Pollen-Guthaben prüfen<br>• Anderes Modell versuchen";
      audioResults.prepend(e);
    }
    btn.disabled = false; btn.textContent = origText;
  }

  speechGoBtn.addEventListener("click", () => generateAudio(speechText.value.trim(), state.speechModel, state.speechVoice, speechGoBtn, "Sprache"));
  musicGoBtn.addEventListener("click", () => generateAudio(musicText.value.trim(), state.musicModel, null, musicGoBtn, "Musik"));
  sfxGoBtn.addEventListener("click", () => generateAudio(sfxText.value.trim(), state.sfxModel, null, sfxGoBtn, "Sound"));

  console.log("🦚 HalDo Avatar v8 · Mit Bild + Audio");
})();
</script>
</body>
</html>
