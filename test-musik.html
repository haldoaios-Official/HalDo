<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo Profi-Musik-Test</title>
<style>
  body { background: #050810; color: #e8ecff; font-family: system-ui, sans-serif; padding: 20px; line-height: 1.6; max-width: 900px; margin: 0 auto; }
  h1 { color: #00e5ff; }
  .test-box { background: rgba(0,0,0,.3); padding: 16px; border-radius: 12px; border: 1px solid rgba(0,229,255,.3); margin: 12px 0; }
  .test-box h3 { color: #b478ff; margin-bottom: 10px; font-size: 14px; }
  button { background: linear-gradient(135deg, #00e5ff, #b478ff); border: none; padding: 10px 16px; border-radius: 8px; color: #000; font-weight: 900; cursor: pointer; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .result { background: rgba(0,0,0,.4); padding: 12px; border-radius: 8px; margin-top: 10px; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto; border-left: 3px solid #00e5ff; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>🎤🎹 HalDo Profi-Musik-Test</h1>

<div class="test-box">
  <h3>1. Test: Echter Gesang (meSing.js)</h3>
  <button id="btnTestSing">🎤 "Hallo HalDo" singen (auf einer Melodie)</button>
  <div id="logSing" class="result"></div>
</div>

<div class="test-box">
  <h3>2. Test: Profi-Instrument (SpessaSynth)</h3>
  <button id="btnTestInstrument">🎹 Hochwertiges Klavier spielen</button>
  <div id="logInstrument" class="result"></div>
</div>

<!-- SpessaSynth für Profi-Instrumente -->
<script src="https://cdn.jsdelivr.net/npm/spessasynth_lib@3.26.20/dist/spessasynth_lib.min.js"></script>
<!-- meSing.js für Gesang -->
<script src="https://cdn.jsdelivr.net/npm/mespeak@1.0.0/mespeak.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mesing@0.0.1/meSing.js"></script>

<script>
  var logSing = document.getElementById("logSing");
  var logInstrument = document.getElementById("logInstrument");
  var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // --- Test 1: Echter Gesang mit meSing.js ---
  document.getElementById("btnTestSing").addEventListener("click", async function() {
    if (audioCtx.state === "suspended") await audioCtx.resume();
    logSing.textContent = "⏳ Lade Gesangs-Engine...";

    // meSing.js benötigt meSpeak
    if (!window.meSpeak) {
      logSing.textContent = "❌ meSpeak.js nicht geladen!";
      return;
    }

    try {
      // Eine einfache Melodie (C4, E4, G4, C5)
      var melody = [60, 64, 67, 72]; // MIDI-Noten
      var lyrics = "Hal-lo Hal-Do"; // Text (Silben getrennt)

      // meSing.js Funktion aufrufen
      // Hinweis: Die genaue API kann variieren, hier eine gängige Methode
      meSing(lyrics, melody, {
        voice: "de",
        pitch: 1.0,
        speed: 1.0,
        onEnd: function() {
          logSing.textContent = "✅ Gesang beendet.";
        }
      });
      logSing.textContent = "✅ Gesang wird abgespielt...";

    } catch (e) {
      logSing.textContent = "❌ Fehler: " + e.message;
      console.error(e);
    }
  });

  // --- Test 2: Profi-Instrument mit SpessaSynth ---
  document.getElementById("btnTestInstrument").addEventListener("click", async function() {
    if (audioCtx.state === "suspended") await audioCtx.resume();
    logInstrument.textContent = "⏳ Lade Profi-Instrument...";

    try {
      // SpessaSynth initialisieren
      // Wir brauchen einen Soundfont. Für den Test laden wir einen kleinen integrierten.
      // In der echten App werden wir einen hochwertigen Soundfont laden.
      const synth = new SpessaSynth();
      await synth.init(audioCtx);

      // Ein C-Dur Akkord (C4, E4, G4)
      synth.noteOn(0, 60, 127); // Kanal 0, Note C4, Velocity max
      synth.noteOn(0, 64, 127); // E4
      synth.noteOn(0, 67, 127); // G4

      logInstrument.textContent = "✅ Akkord gespielt! (SpessaSynth)";

      // Nach 2 Sekunden stoppen
      setTimeout(() => {
        synth.noteOff(0, 60);
        synth.noteOff(0, 64);
        synth.noteOff(0, 67);
      }, 2000);

    } catch (e) {
      logInstrument.textContent = "❌ Fehler: " + e.message;
      console.error(e);
    }
  });
</script>

</body>
</html>
