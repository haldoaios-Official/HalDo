<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo Einfach-Musik-Test</title>
<style>
  body { background: #050810; color: #e8ecff; font-family: system-ui, sans-serif; padding: 20px; line-height: 1.6; max-width: 900px; margin: 0 auto; }
  h1 { color: #00e5ff; }
  .test-box { background: rgba(0,0,0,.3); padding: 16px; border-radius: 12px; border: 1px solid rgba(0,229,255,.3); margin: 12px 0; }
  .test-box h3 { color: #b478ff; margin-bottom: 10px; font-size: 14px; }
  button { background: linear-gradient(135deg, #00e5ff, #b478ff); border: none; padding: 10px 16px; border-radius: 8px; color: #000; font-weight: 900; cursor: pointer; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .result { background: rgba(0,0,0,.4); padding: 12px; border-radius: 8px; margin-top: 10px; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto; border-left: 3px solid #00e5ff; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>🎤🎹 HalDo Einfach-Musik-Test</h1>

<div class="test-box">
  <h3>1. Test: Gesang mit der Browser-Stimme</h3>
  <button id="btnTestSing">🎤 "Hallo HalDo" singen (mit Melodie)</button>
  <div id="logSing" class="result"></div>
</div>

<div class="test-box">
  <h3>2. Test: Echtes Instrument (WebAudioFont)</h3>
  <button id="btnTestInstrument">🎹 Klavier-Akkord spielen</button>
  <div id="logInstrument" class="result"></div>
</div>

<!-- WebAudioFont für Instrumente -->
<script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0250_SoundBlasterOld_sf2.js"></script>

<script>
  var logSing = document.getElementById("logSing");
  var logInstrument = document.getElementById("logInstrument");
  var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // --- Test 1: Gesang mit SpeechSynthesis ---
  document.getElementById("btnTestSing").addEventListener("click", async function() {
    if (audioCtx.state === "suspended") await audioCtx.resume();
    logSing.textContent = "⏳ Starte Gesang...";

    if (!window.speechSynthesis) {
      logSing.textContent = "❌ SpeechSynthesis nicht verfügbar!";
      return;
    }

    // Eine einfache Melodie (C4, E4, G4, C5)
    var notes = [
      { text: "Hal", pitch: 1.0, rate: 1.0 },
      { text: "lo", pitch: 1.2, rate: 1.0 },
      { text: "Hal", pitch: 1.4, rate: 1.0 },
      { text: "Do", pitch: 1.6, rate: 1.0 }
    ];

    // Spracheinstellungen
    var utterance = new SpeechSynthesisUtterance("Hal-lo Hal-Do");
    utterance.lang = "de-DE";
    utterance.rate = 0.8; // Etwas langsamer für den Gesang
    utterance.pitch = 1.0; // Start-Tonhöhe

    // Wir können die Tonhöhe während des Sprechens nicht direkt ändern.
    // Stattdessen sprechen wir die Silben einzeln mit unterschiedlichen Tonhöhen.
    // Das ist eine einfache Annäherung.
    var i = 0;
    function speakNext() {
      if (i >= notes.length) {
        logSing.textContent = "✅ Gesang beendet.";
        return;
      }
      var note = notes[i];
      var u = new SpeechSynthesisUtterance(note.text);
      u.lang = "de-DE";
      u.pitch = note.pitch;
      u.rate = note.rate;
      u.onend = function() {
        i++;
        speakNext();
      };
      speechSynthesis.speak(u);
    }
    logSing.textContent = "🎤 Singe: Hal-lo Hal-Do...";
    speakNext();
  });

  // --- Test 2: Echtes Instrument mit WebAudioFont ---
  document.getElementById("btnTestInstrument").addEventListener("click", async function() {
    if (audioCtx.state === "suspended") await audioCtx.resume();
    logInstrument.textContent = "⏳ Lade Instrument...";

    try {
      if (!window.WebAudioFontPlayer || !window._tone_0250_SoundBlasterOld_sf2) {
        throw new Error("WebAudioFont nicht geladen!");
      }

      var player = new WebAudioFontPlayer();
      var instrument = _tone_0250_SoundBlasterOld_sf2;
      player.loader.decodeAfterLoading(audioCtx, '_tone_0250_SoundBlasterOld_sf2');

      // Ein C-Dur Akkord (C4, E4, G4)
      player.queueWaveTable(audioCtx, audioCtx.destination, instrument, 0, 60, 1.5); // C4
      player.queueWaveTable(audioCtx, audioCtx.destination, instrument, 0, 64, 1.5); // E4
      player.queueWaveTable(audioCtx, audioCtx.destination, instrument, 0, 67, 1.5); // G4

      logInstrument.textContent = "✅ Akkord gespielt! (Echtes Klavier-Sample)";

    } catch (e) {
      logInstrument.textContent = "❌ Fehler: " + e.message;
      console.error(e);
    }
  });
</script>

</body>
</html>
