<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>HalDo Musik-Test</title>
<style>
  body { background: #050810; color: #e8ecff; font-family: system-ui, sans-serif; padding: 20px; line-height: 1.6; max-width: 900px; margin: 0 auto; }
  h1 { color: #00e5ff; }
  .test-box { background: rgba(0,0,0,.3); padding: 16px; border-radius: 12px; border: 1px solid rgba(0,229,255,.3); margin: 12px 0; }
  .test-box h3 { color: #b478ff; margin-bottom: 10px; font-size: 14px; }
  button { background: linear-gradient(135deg, #00e5ff, #b478ff); border: none; padding: 10px 16px; border-radius: 8px; color: #000; font-weight: 900; cursor: pointer; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log { background: rgba(0,0,0,.4); padding: 12px; border-radius: 8px; margin-top: 10px; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto; border-left: 3px solid #00e5ff; white-space: pre-wrap; }
</style>
</head>
<body>

<h1>🎵 HalDo Musik-Test</h1>

<div class="test-box">
  <h3>1. Test: WebAudioFont (Echtes Instrument)</h3>
  <button id="btnTestInstrument">🎹 Klavier-Ton spielen</button>
  <div id="logInstrument" class="result"></div>
</div>

<div class="test-box">
  <h3>2. Test: meSpeak.js (Sprachsynthese)</h3>
  <button id="btnTestSpeech">🗣️ "Hallo, ich bin HalDo" sprechen</button>
  <div id="logSpeech" class="result"></div>
</div>

<!-- Bibliotheken laden -->
<script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0250_SoundBlasterOld_sf2.js"></script>
<script src="https://www.masswerk.at/mespeak/mespeak.js"></script>

<script>
  var logInst = document.getElementById("logInstrument");
  var logSpeech = document.getElementById("logSpeech");
  var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // --- Test 1: WebAudioFont ---
  document.getElementById("btnTestInstrument").addEventListener("click", function() {
    if(!window.WebAudioFontPlayer) {
      logInst.textContent = "❌ WebAudioFontPlayer nicht geladen!";
      return;
    }
    logInst.textContent = "⏳ Lade Instrument...";
    var player = new WebAudioFontPlayer();
    var instrument = _tone_0250_SoundBlasterOld_sf2; // Ein Klavier-Soundfont

    player.loader.decodeAfterLoading(audioCtx, '_tone_0250_SoundBlasterOld_sf2');
    // C4 (MIDI-Note 60) für 1 Sekunde spielen
    player.queueWaveTable(audioCtx, audioCtx.destination, instrument, 0, 60, 1.0);
    logInst.textContent = "✅ Klavier-Ton (C4) gespielt!";
  });

  // --- Test 2: meSpeak.js ---
  document.getElementById("btnTestSpeech").addEventListener("click", function() {
    if(!window.meSpeak) {
      logSpeech.textContent = "❌ meSpeak nicht geladen!";
      return;
    }
    logSpeech.textContent = "⏳ Versuche zu sprechen...";
    meSpeak.speak("Hallo, ich bin HalDo", {
      amplitude: 100,
      wordgap: 0,
      pitch: 50,
      speed: 175,
      voice: "de"
    }, function(success, id) {
      if(success) logSpeech.textContent = "✅ Sprachausgabe erfolgreich!";
      else logSpeech.textContent = "❌ Sprachausgabe fehlgeschlagen.";
    });
  });
</script>

</body>
</html>
