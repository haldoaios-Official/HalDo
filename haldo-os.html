<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HalDo AI OS — Der professionelle</title>
<style>
:root{
  --bg:#05010f; --accent:#00e5ff; --accent2:#ff00e5; --gold:#ffd700; --text:#e0f7ff;
  --glass:rgba(20,25,50,0.42); --glass-b:rgba(255,255,255,0.14);
  --blur:14px; --glow:18px; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;}
#cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* Splash */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#0a0420,#000);transition:opacity .9s,visibility .9s;}
#splash.hide{opacity:0;visibility:hidden;}
.splash-ring{width:110px;height:110px;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent2);border-bottom-color:var(--gold);animation:spin 1.4s linear infinite;margin-bottom:28px;box-shadow:0 0 40px rgba(0,229,255,.35);}
.splash-title{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;animation:glowPulse 2.2s ease-in-out infinite;}
.splash-sub{margin-top:14px;font-size:clamp(.9rem,2vw,1.15rem);color:var(--gold);opacity:.9;}
.splash-credit{margin-top:34px;font-size:.8rem;letter-spacing:2px;color:var(--accent);opacity:.7;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 8px var(--accent));}50%{filter:drop-shadow(0 0 28px var(--accent2));}}

/* Shell */
.top-bar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--glass);backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--glass-b);}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px;}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 1.8s infinite;}
@keyframes pulse{50%{opacity:.4;}}
.top-actions{display:flex;gap:8px;align-items:center;}
.chip{padding:6px 12px;border-radius:20px;font-size:.78rem;cursor:pointer;border:1px solid var(--glass-b);background:rgba(255,255,255,.04);transition:.25s;color:var(--text);}
.chip:hover{background:rgba(255,255,255,.12);border-color:var(--accent);}

/* Main */
main{position:relative;z-index:3;flex:1;overflow:hidden;padding:14px;display:flex;gap:14px;}
.window{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--glass);backdrop-filter:blur(var(--blur));border-radius:var(--radius);border:2px solid var(--gold);box-shadow:0 8px 40px rgba(0,0,0,.55),inset 0 0 0 1px var(--accent);overflow:hidden;animation:fadeIn .6s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.window-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--glass-b);background:rgba(0,0,0,.25);}
.window-title{font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
.window-title .icon{font-size:1.15rem;}
.window-body{flex:1;overflow-y:auto;padding:14px;}
.window-body::-webkit-scrollbar{width:8px;}
.window-body::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px;}

/* Search */
.search-wrap{position:sticky;top:0;z-index:2;padding-bottom:12px;background:linear-gradient(var(--bg),transparent);}
.search{width:100%;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid var(--glass-b);color:var(--text);font-size:.92rem;outline:none;transition:.25s;}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,229,255,.25);}

/* Settings grid */
.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.cat-tab{padding:6px 10px;border-radius:9px;font-size:.76rem;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid transparent;transition:.2s;font-weight:600;color:var(--text);}
.cat-tab:hover{background:rgba(255,255,255,.13);}
.cat-tab.active{background:var(--accent);color:#001018;box-shadow:0 0 14px var(--accent);}
.cat-section{margin-bottom:22px;animation:fadeIn .35s ease;}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--glass-b);}
.cat-head .letter{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-size:.95rem;}
.cat-head h3{font-size:1.02rem;letter-spacing:.4px;}

/* Items */
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.035);border:1px solid transparent;margin-bottom:6px;transition:.22s;}
.item:hover{background:rgba(255,255,255,.08);border-color:var(--glass-b);}
.item-label{flex:1;font-size:.9rem;line-height:1.35;}
.item-hint{font-size:.72rem;opacity:.55;margin-top:2px;}

/* Toggle */
.toggle{position:relative;width:46px;height:26px;border-radius:20px;background:rgba(255,255,255,.14);cursor:pointer;transition:.28s;flex-shrink:0;}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.28s;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.toggle.on{background:var(--accent);box-shadow:0 0 14px var(--accent);}
.toggle.on::after{transform:translateX(20px);}

/* Select */
select{background:rgba(0,0,0,.5);border:1px solid var(--glass-b);color:var(--text);padding:7px 10px;border-radius:9px;font-size:.84rem;cursor:pointer;outline:none;min-width:130px;}
select:focus{border-color:var(--accent);}

/* Slider */
input[type=range]{-webkit-appearance:none;width:150px;height:5px;border-radius:5px;background:rgba(255,255,255,.14);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);cursor:pointer;}
.slider-val{font-size:.78rem;color:var(--accent);min-width:42px;text-align:right;font-weight:700;}

/* Button */
.btn{padding:7px 14px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:700;font-size:.8rem;border:none;cursor:pointer;transition:.22s;letter-spacing:.3px;}
.btn:hover{filter:brightness(1.15);box-shadow:0 0 16px var(--accent);}
.btn.ghost{background:transparent;border:1px solid var(--glass-b);color:var(--text);font-weight:500;}
.btn.ghost:hover{border-color:var(--accent);background:rgba(0,229,255,.08);box-shadow:none;}

/* Registry */
.reg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;}
.reg-card{padding:14px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--glass-b);cursor:pointer;transition:.25s;position:relative;overflow:hidden;}
.reg-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.reg-card .letter{font-size:.72rem;font-weight:800;color:var(--gold);letter-spacing:2px;}
.reg-card h4{font-size:.88rem;margin:5px 0;font-weight:700;}
.reg-card .count{font-size:.72rem;opacity:.6;}
.reg-card .apps{padding-left:14px;margin:10px 0;display:none;}
.reg-card.open .apps{display:block;}
.reg-card .apps li{font-size:.74rem;opacity:.7;padding:2px 0;list-style:disc;}

/* Bottom bar */
.bottom-bar{position:relative;z-index:5;display:flex;gap:10px;justify-content:center;padding:11px 16px;background:var(--glass);backdrop-filter:blur(var(--blur));border-top:1px solid var(--glass-b);}
.bb-btn{flex:1;max-width:180px;padding:11px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--glass-b);cursor:pointer;font-weight:700;font-size:.85rem;transition:.25s;color:var(--text);text-align:center;}
.bb-btn:hover{border-color:var(--accent);background:rgba(0,229,255,.1);}
.bb-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border-color:transparent;box-shadow:0 0 20px var(--accent);}

/* Avatar */
#avatar{position:fixed;right:22px;bottom:90px;z-index:6;width:110px;height:110px;cursor:pointer;transition:.35s;}
#avatar:hover{transform:scale(1.08);}
.avatar-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);opacity:.6;animation:spin 6s linear infinite;}
.avatar-ring::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px dashed var(--accent2);opacity:.5;animation:spin 9s linear infinite reverse;}
.avatar-face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a2050,#0a0420);border:2px solid var(--gold);box-shadow:0 0 30px var(--accent);overflow:hidden;}

/* Toast */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-30px);z-index:9998;padding:11px 22px;border-radius:11px;background:rgba(0,0,0,.85);border:1px solid var(--accent);color:var(--text);font-size:.85rem;opacity:0;transition:.35s;pointer-events:none;box-shadow:0 0 24px rgba(0,229,255,.4);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Theme dots in top bar */
.theme-dots{display:flex;gap:5px;}
.theme-dot{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.2s;}
.theme-dot:hover{transform:scale(1.25);}
.theme-dot.active{border-color:#fff;}

[dir="rtl"] .item{flex-direction:row-reverse;}
[dir="rtl"] .window-head{flex-direction:row-reverse;}

@media(max-width:720px){
  main{flex-direction:column;padding:8px;gap:8px;}
  .window{flex:1;}
  #avatar{width:84px;height:84px;right:12px;bottom:78px;}
  .reg-grid{grid-template-columns:1fr 1fr;}
  .item{flex-direction:column;align-items:flex-start;}
  .item > *:last-child{align-self:flex-end;}
}
</style>
</head>
<body>

<!-- Splash -->

  <div class="splash-ring"></div>

</main>

<!-- Avatar -->
<div id="avatar" title="HalDo AI Avatar — klicken für Emotion">

      <ellipse cx="72" cy="58" rx="5" ry="3" fill="var(--accent2)" opacity=".4"/>
    </svg>
  </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <div class="bb-btn" data-bb="chat">💬 Chat</div>
  <div class="bb-btn active" data-bb="ai">🤖 AI</div>
  <div class="bb-btn" data-bb="cyborg">⚡ CYBORG</div>

<div id="toast"></div>

<script>
/* =========================================================
   THEMES
========================================================= */
const THEMES = {
  Holo:    {bg:'#05010f',accent:'#00e5ff',accent2:'#ff00e5',gold:'#ffd700',text:'#e0f7ff'},
  Cyborg:  {bg:'#0a0014',accent:'#ff00aa',accent2:'#a020f0',gold:'#ff2bd6',text:'#ffe0ff'},
  Gold:    {bg:'#0a0800',accent:'#ffd700',accent2:'#b8860b',gold:'#ffd700',text:'#fff8dc'},
  Matrix:  {bg:'#000a00',accent:'#00ff41',accent2:'#008f11',gold:'#00ff41',text:'#c8ffc8'},
  Crimson: {bg:'#0f0000',accent:'#ff2d55',accent2:'#8b0000',gold:'#ff2d55',text:'#ffd0d8'},
  Sunset:  {bg:'#0f0500',accent:'#ff6b35',accent2:'#ff2d95',gold:'#ffb800',text:'#ffe8d0'},
  Ice:     {bg:'#000a14',accent:'#7dd3fc',accent2:'#0ea5e9',gold:'#e0f2fe',text:'#e0f7ff'}
};
function applyTheme(name){
  const t = THEMES[name] || THEMES.Holo;
  const r = document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--accent',t.accent);
  r.setProperty('--accent2',t.accent2); r.setProperty('--gold',t.gold);
  r.setProperty('--text',t.text);
  document.querySelectorAll('.theme-dot').forEach(d=>d.classList.toggle('active',d.dataset.theme===name));
  localStorage.setItem('haldo_theme',name);
}

/* =========================================================
   I18N (DE / EN / KU / AR) — Grundgerüst für 17+ Sprachen
========================================================= */
const I18N = {
  de:{settings:'Einstellungen (A–Z)',registry:'App-Registry',search:'🔍 Suchen...',back:'← Zurück',chat:'Chat',ai:'AI',cyborg:'CYBORG',welcomed:'Willkommen bei HalDo AI OS'},
  en:{settings:'Settings (A–Z)',registry:'App Registry',search:'🔍 Search...',back:'← Back',chat:'Chat',ai:'AI',cyborg:'CYBORG',welcomed:'Welcome to HalDo AI OS'},
  ku:{settings:'Mîheng (A–Z)',registry:'Tomarê App',search:'🔍 Lêgerîn...',back:'← Paş',chat:'Gihiştin',ai:'AI',cyborg:'CYBORG',welcomed:'Bi xêr hatî HalDo AI OS'},
  ar:{settings:'الإعدادات (A–Z)',registry:'سجل التطبيقات',search:'🔍 بحث...',back:'← رجوع',chat:'دردشة',ai:'AI',cyborg:'CYBORG',welcomed:'مرحبًا بك في HalDo AI OS'}
};
let LANG = 'de';
function t(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.de[k]||k;}
function applyLang(code){
  LANG = code;
  document.documentElement.dir = (code==='ar'||code==='he'||code==='fa')?'rtl':'ltr';
  document.getElementById('settingsTitle').textContent = t('settings');
  document.getElementById('search').placeholder = t('search');
  document.getElementById('regSearch').placeholder = t('search');
  document.getElementById('btnBack').textContent = t('back');
  document.querySelectorAll('[data-bb]').forEach(b=>{
    const k=b.dataset.bb; b.textContent = (k==='chat'?'💬 ':k==='ai'?'🤖 ':'⚡ ') + t(k);
  });
  localStorage.setItem('haldo_lang',code);
}

/* =========================================================
   SETTINGS DATA — ALLE 26 KATEGORIEN A–Z
========================================================= */
const CATS = [
{k:'A',icon:'👤',name:'Account & Profil',items:[
  {id:'displayName',t:'text',l:'Anzeigename',v:'Halil Donma'},
  {id:'avatarStyle',t:'select',l:'Avatar-Stil',v:'CYBORG ⚡',opts:['Standard 🤖','CYBORG ⚡','Hologramm 🌌','Living AI 🫀']},
  {id:'cloudSync',t:'toggle',l:'Cloud-Synchronisation',v:true},
  {id:'syncInterval',t:'slider',l:'Sync-Intervall',v:15,min:5,max:120,step:5,u:'min'},
  {id:'family',t:'button',l:'Familienfreigabe verwalten'},

]},
{k:'B',icon:'🔔',name:'Benachrichtigungen',items:[
  {id:'toast',t:'toggle',l:'Toast-Benachrichtigungen',v:true},
  {id:'toastPos',t:'select',l:'Toast-Position',v:'Oben Mitte',opts:['Oben Mitte','Oben Rechts','Unten','Deaktiviert']},

]},

  {id:'hologram',t:'toggle',l:'Holografische Ringe um Avatar',v:true},

  {id:'breathe',t:'toggle',l:'Avatar: Atmen',v:true},

  {id:'bt',t:'toggle',l:'Bluetooth',v:true},
  {id:'nfc',t:'toggle',l:'NFC',v:false},
  {id:'sensors',t:'button',l:'Sensoren kalibrieren'}
]},

/* =========================================================
   STATE
========================================================= */
const STATE = JSON.parse(localStorage.getItem('haldo_state')||'{}');
function saveState(){localStorage.setItem('haldo_state',JSON.stringify(STATE));}
function getVal(id,def){return STATE[id]!==undefined?STATE[id]:def;}
function setVal(id,v){STATE[id]=v;saveState();}

/* =========================================================
   RENDER SETTINGS
========================================================= */
let activeCat = 'A';
function buildCatTabs(){
  const el = document.getElementById('catTabs');
  el.innerHTML = CATS.map(c=>`<div class="cat-tab ${c.k===activeCat?'active':''}" data-cat="${c.k}">${c.k} · ${c.name.split(' ')[0]}</div>`).join('');
  el.querySelectorAll('.cat-tab').forEach(t=>t.onclick=()=>{activeCat=t.dataset.cat;buildCatTabs();renderCategory();});
}
function renderCategory(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = q ? CATS : CATS.filter(c=>c.k===activeCat);
  const container = document.getElementById('catContent');
  container.innerHTML = list.map(cat=>{
    const items = cat.items.filter(it=>!q || it.l.toLowerCase().includes(q));
    if(!items.length) return '';
    return `<div class="cat-section">
      <div class="cat-head"><div class="letter">${cat.k}</div><h3>${cat.icon} ${cat.name}</h3></div>
      ${items.map(it=>renderItem(cat.k,it)).join('')}
    </div>`;
  }).join('') || '<p style="opacity:.6;padding:20px;">Keine Treffer.</p>';

  // bind interactions
  container.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.toggle;
      const was = el.classList.contains('on');
      el.classList.toggle('on');
      setVal(id,!was);
      toast(`${id}: ${!was?'AN':'AUS'}`);
      if(id==='cyborgMode') applyTheme(!was?'Cyborg':'Holo');
    };
  });
  container.querySelectorAll('select[data-sel]').forEach(el=>{
    el.onchange = ()=>{setVal(el.dataset.sel,el.value);toast('Gespeichert: '+el.value);};
  });
  container.querySelectorAll('input[type=range]').forEach(el=>{
    const out = el.parentElement.querySelector('.slider-val');
    el.oninput = ()=>{
      if(out) out.textContent = el.value+(el.dataset.unit||'');
      setVal(el.dataset.slider,el.value);
      if(el.dataset.slider==='blur') document.documentElement.style.setProperty('--blur',el.value+'px');
      if(el.dataset.slider==='glow') document.documentElement.style.setProperty('--glow',el.value+'px');
    };
  });
  container.querySelectorAll('input[type=text]').forEach(el=>{
    el.onchange = ()=>setVal(el.dataset.txt,el.value);
  });
  container.querySelectorAll('input[type=color]').forEach(el=>{
    el.oninput = ()=>{
      document.documentElement.style.setProperty('--accent',el.value);
      setVal(el.dataset.color,el.value);
    };
  });
  container.querySelectorAll('input[type=time]').forEach(el=>{
    el.onchange = ()=>setVal(el.dataset.time,el.value);
  });
  container.querySelectorAll('.btn[data-btn]').forEach(el=>{
    el.onclick = ()=>toast('⚙️ '+el.dataset.btn+' — Aktion ausgeführt');
  });
  container.querySelectorAll('[data-theme]').forEach(el=>{
    el.onclick = ()=>{applyTheme(el.dataset.theme);setVal('theme',el.dataset.theme);toast('Theme: '+el.dataset.theme);};
  });
}

function renderItem(catK,it){
  const v = getVal(it.id, it.v);
  const lbl = `<div><div class="item-label">${it.l}</div></div>`;
  switch(it.t){
    case 'toggle': return `<div class="item">${lbl}<div class="toggle ${v?'on':''}" data-toggle="${it.id}"></div></div>`;
    case 'select': return `<div class="item">${lbl}<select data-sel="${it.id}">${it.opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`;
    case 'slider': return `<div class="item">${lbl}<div style="display:flex;align-items:center;gap:8px;"><input type="range" min="${it.min}" max="${it.max}" step="${it.step}" value="${v}" data-slider="${it.id}" data-unit="${it.u||''}"><span class="slider-val">${v}${it.u||''}</span></div></div>`;
    case 'text': return `<div class="item">${lbl}<input type="text" value="${v}" data-txt="${it.id}" style="background:rgba(0,0,0,.5);border:1px solid var(--glass-b);color:var(--text);padding:7px 10px;border-radius:9px;font-size:.84rem;min-width:150px;outline:none;"></div>`;
    case 'button': return `<div class="item">${lbl}<button class="btn" data-btn="${it.l}">Öffnen</button></div>`;
    case 'info': return `<div class="item"><div><div class="item-label">${it.l}</div><div class="item-hint">${v}</div></div><span style="font-size:.78rem;opacity:.7;">ℹ️</span></div>`;
    case 'color': return `<div class="item">${lbl}<input type="color" value="${v}" data-color="${it.id}" style="width:44px;height:30px;border:none;background:none;cursor:pointer;border-radius:8px;"></div>`;
    case 'time': return `<div class="item">${lbl}<input type="time" value="${v}" data-time="${it.id}" style="background:rgba(0,0,0,.5);border:1px solid var(--glass-b);color:var(--text);padding:6px 10px;border-radius:9px;font-size:.84rem;"></div>`;
    case 'theme': return `<div class="item">${lbl}<div style="display:flex;gap:6px;flex-wrap:wrap;">${Object.keys(THEMES).map(n=>`<div data-theme="${n}" style="width:34px;height:24px;border-radius:7px;cursor:pointer;background:linear-gradient(90deg,${THEMES[n].accent},${THEMES[n].accent2});border:2px solid ${n===v?'#fff':'transparent'};" title="${n}"></div>`).join('')}</div></div>`;
    case 'langsel': return `<div class="item">${lbl}<select data-sel="${it.id}" onchange="applyLang(this.value)"><option value="de" ${v==='de'?'selected':''}>🇩🇪 Deutsch</option><option value="en" ${v==='en'?'selected':''}>🇬🇧 English</option><option value="ku" ${v==='ku'?'selected':''}>☀️ Kurdî</option><option value="ar" ${v==='ar'?'selected':''}>🌙 العربية</option></select></div>`;
    default: return '';
  }
}

/* =========================================================
   REGISTRY RENDER
========================================================= */
function renderRegistry(){
  const el = document.getElementById('regGrid');
  const q = document.getElementById('regSearch').value.trim().toLowerCase();
  el.innerHTML = Object.entries(REGISTRY).map(([k,r])=>{
    const apps = r.apps.filter(a=>!q || a.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
    if(!apps.length) return '';
    return `<div class="reg-card" data-card="${k}">
      <div class="letter">${k} — ${r.count} APPS</div>
      <h4>${r.name}</h4>
      <div class="count">${r.count} Apps</div>
      <ul class="apps">${apps.map(a=>`<li>${a}</li>`).join('')}</ul>
    </div>`;
  }).join('');
  el.querySelectorAll('.reg-card').forEach(c=>c.onclick=()=>c.classList.toggle('open'));
}

========================================================= */
const canvas = document.getElementById('cosmos');
const ctx = canvas.getContext('2d');
let W,H,stars=[],planets=[],shooting=[],earthAngle=0,moonAngle=0,mouseX=0,mouseY=0;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();
window.addEventListener('mousemove',e=>{mouseX=(e.clientX/W-.5)*2;mouseY=(e.clientY/H-.5)*2;});

function initCosmos(){
  stars=[]; const n = 350;
  for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random(),sp:.01+Math.random()*.03});
  planets=[];
  const names=['Merkur','Venus','Erde','Mars','Jupiter','Saturn','Uranus','Neptun'];
  names.forEach((n,i)=>planets.push({name:n,r:40+i*22,sp:.0004+i*.00015,size:2+i*.6,angle:Math.random()*Math.PI*2}));
}
initCosmos();

function drawCosmos(t){
  ctx.clearRect(0,0,W,H);
  // deep gradient background
  const bg = ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,Math.max(W,H));
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#00e5ff';
  bg.addColorStop(0,'#0a0420'); bg.addColorStop(.5,'#05010f'); bg.addColorStop(1,'#000');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // parallax nebula
  const nx = W/2+mouseX*30, ny = H/2+mouseY*20;
  const neb = ctx.createRadialGradient(nx,ny,10,nx,ny,300);
  neb.addColorStop(0,hexA(accent,.06)); neb.addColorStop(1,'transparent');
  ctx.fillStyle=neb; ctx.fillRect(0,0,W,H);
  // stars
  stars.forEach(s=>{
    s.a += s.sp; const tw = .5+Math.sin(s.a)*.5;
    const px = s.x - mouseX*s.r*2, py = s.y - mouseY*s.r*2;
    ctx.beginPath(); ctx.arc(px,py,s.r,0,7); ctx.fillStyle=`rgba(255,255,255,${tw*.9})`; ctx.fill();
  });
  // Earth
  earthAngle += .002;
  const ex = W*.78 - mouseX*8, ey = H*.55 - mouseY*6, er = Math.min(W,H)*.16;
  // atmosphere
  const atm = ctx.createRadialGradient(ex,ey,er*.9,ex,ey,er*1.35);
  atm.addColorStop(0,hexA(accent,.4)); atm.addColorStop(1,'transparent');
  ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(ex,ey,er*1.35,0,7); ctx.fill();
  // earth body
  const eg = ctx.createRadialGradient(ex-er*.3,ey-er*.3,er*.2,ex,ey,er);
  eg.addColorStop(0,'#2a6b9c'); eg.addColorStop(.6,'#0d3a5c'); eg.addColorStop(1,'#021018');
  ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(ex,ey,er,0,7); ctx.fill();
  // continents (fake)
  ctx.save(); ctx.beginPath(); ctx.arc(ex,ey,er,0,7); ctx.clip();
  for(let i=0;i<5;i++){
    const a = earthAngle+i*1.3;
    ctx.fillStyle='rgba(46,120,66,.55)';
    ctx.beginPath();
    ctx.ellipse(ex+Math.cos(a)*er*.4, ey+Math.sin(a*.7)*er*.3, er*.28, er*.18, a, 0, 7);
    ctx.fill();
  }
  ctx.restore();
  // terminator (night shadow)
  const term = ctx.createLinearGradient(ex-er,ey,ex+er,ey);
  term.addColorStop(0,'rgba(0,0,10,.85)'); term.addColorStop(.5,'rgba(0,0,10,.1)'); term.addColorStop(1,'rgba(0,0,10,.7)');
  ctx.fillStyle=term; ctx.beginPath(); ctx.arc(ex,ey,er,0,7); ctx.fill();
  // moon
  moonAngle += .008;
  const mx = ex+Math.cos(moonAngle)*er*1.8, my = ey+Math.sin(moonAngle)*er*.6;
  ctx.fillStyle='#c8c8d0'; ctx.beginPath(); ctx.arc(mx,my,er*.09,0,7); ctx.fill();
  // sun
  const sx = W*.18 - mouseX*10, sy = H*.28 - mouseY*6, sr = Math.min(W,H)*.06;
  const glow = ctx.createRadialGradient(sx,sy,0,sx,sy,sr*4);
  glow.addColorStop(0,'rgba(255,230,120,.9)'); glow.addColorStop(.3,'rgba(255,180,50,.5)'); glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,sr*4,0,7); ctx.fill();
  ctx.fillStyle='#ffdd66'; ctx.beginPath(); ctx.arc(sx,sy,sr*(1+Math.sin(t*.002)*.05),0,7); ctx.fill();
  // planets
  planets.forEach(p=>{
    p.angle += p.sp*16;
    const px = sx+Math.cos(p.angle)*p.r*2.2;
    const py = sy+Math.sin(p.angle)*p.r*2.2*.4;
    ctx.beginPath(); ctx.arc(px,py,p.size,0,7);
    ctx.fillStyle = ['#b0b0b0','#e6c98c','#4a90d9','#d96a4a','#d9b98a','#d9cf8a','#8ac9d9','#5a7bd9'][planets.indexOf(p)]||'#fff';
    ctx.fill();
    // orbit
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(sx,sy,p.r*2.2,p.r*2.2*.4,0,0,7); ctx.stroke();
  });
  // shooting stars
  if(Math.random()<.008) shooting.push({x:Math.random()*W,y:0,vx:2+Math.random()*3,vy:2+Math.random()*2,life:1});
  shooting.forEach((s,i)=>{
    s.x+=s.vx; s.y+=s.vy; s.life-=.008;
    ctx.strokeStyle=`rgba(255,255,255,${s.life})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*8,s.y-s.vy*8); ctx.stroke();
    if(s.life<=0) shooting.splice(i,1);
  });
  requestAnimationFrame(drawCosmos);
}
function hexA(hex,a){
  const h = hex.replace('#',''); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}
requestAnimationFrame(drawCosmos);

/* =========================================================
   AVATAR ANIMATIONS
========================================================= */
let blinkOn=true, breatheOn=true;
setInterval(()=>{
  if(!blinkOn) return;
  const l=document.getElementById('eyeL'), r=document.getElementById('eyeR');
  if(!l) return;
  l.setAttribute('r','1'); r.setAttribute('r','1');
  setTimeout(()=>{l.setAttribute('r','7');r.setAttribute('r','7');},140);
},3200);
setInterval(()=>{
  const l=document.getElementById('eyeL'), r=document.getElementById('eyeR');
  if(!l||!blinkOn) return;
  const dx=(Math.random()-.5)*3, dy=(Math.random()-.5)*3;
  l.setAttribute('cx',35+dx); l.setAttribute('cy',42+dy);
  r.setAttribute('cx',65+dx); r.setAttribute('cy',42+dy);
},1800);
document.getElementById('avatar').onclick = ()=>{
  const mouths = ['M38 66 Q50 76 62 66','M38 68 L62 68','M40 70 Q50 62 60 70'];
  document.getElementById('mouth').setAttribute('d',mouths[Math.floor(Math.random()*mouths.length)]);
  toast('🤖 HalDo AI: Ich bin bereit, dir zu helfen!');
};

/* =========================================================
   TOAST
========================================================= */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),1800);
}

/* =========================================================
   TOP BAR / BOTTOM BAR / INIT
========================================================= */
document.getElementById('themeDots').innerHTML = Object.keys(THEMES).map(n=>
  `<div class="theme-dot" data-theme="${n}" style="background:linear-gradient(135deg,${THEMES[n].accent},${THEMES[n].accent2});" title="${n}"></div>`
).join('');
document.querySelectorAll('.theme-dot').forEach(d=>d.onclick=()=>{applyTheme(d.dataset.theme);toast('Theme: '+d.dataset.theme);});
document.getElementById('langSelect').onchange = e=>applyLang(e.target.value);

document.querySelectorAll('[data-bb]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-bb]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const k=b.dataset.bb;
  if(k==='cyborg'){applyTheme('Cyborg');toast('⚡ CYBORG-Modus aktiviert');}
  else if(k==='chat'){toast('💬 HalDo Chat — bereit');}
  else if(k==='ai'){toast('🤖 HalDo AI — verbunden');}
});

document.getElementById('btnRegistry').onclick = ()=>{
  document.getElementById('winSettings').style.display='none';
  document.getElementById('winRegistry').style.display='flex';
  renderRegistry();
};
document.getElementById('btnBack').onclick = ()=>{
  document.getElementById('winRegistry').style.display='none';
  document.getElementById('winSettings').style.display='flex';
};
document.getElementById('search').oninput = renderCategory;
document.getElementById('regSearch').oninput = renderRegistry;

/* INIT */
(function init(){
  applyTheme(localStorage.getItem('haldo_theme')||'Holo');
  applyLang(localStorage.getItem('haldo_lang')||'de');
  buildCatTabs();
  renderCategory();
  renderRegistry();
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    setTimeout(()=>toast('✨ '+t('welcomed')+' · 375 Apps geladen'),400);
  }, 2200);
})();
</script>
