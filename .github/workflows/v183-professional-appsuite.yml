name: HalDo v183 Professional App Suite
on:
  pull_request:
    branches:
      - work-v167-medical-apps
    paths:
      - 'index.html'
      - 'js/haldo-v183-professional-appsuite.js'
      - 'scripts/test-v183-professional-appsuite.mjs'
      - '.github/workflows/v183-professional-appsuite.yml'
  push:
    branches:
      - work-v183-professional-appsuite
    paths:
      - 'index.html'
      - 'js/haldo-v183-professional-appsuite.js'
      - 'scripts/test-v183-professional-appsuite.mjs'
      - '.github/workflows/v183-professional-appsuite.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haldo-v183-professional-appsuite
  cancel-in-progress: true
jobs:
  professional-appsuite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check js/haldo-v183-professional-appsuite.js
          node --check scripts/test-v183-professional-appsuite.mjs
      - name: Run Chromium end-to-end tests
        run: node scripts/test-v183-professional-appsuite.mjs
