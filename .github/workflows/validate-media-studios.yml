name: Validate HalDo Media and System Modules

on:
  pull_request:
    branches: [main]
    paths:
      - 'music-studio-pro.js'
      - 'video-studio-pro.js'
      - 'system-center-pro.js'
      - 'js/haldo-human-3d-engine.js'
      - 'scripts/test-human3d-capabilities.mjs'
      - 'scripts/test-system-diagnostics.mjs'
      - 'scripts/test-runtime-dependencies.mjs'
      - 'scripts/test-inline-script-integrity.mjs'
      - 'scripts/test-runtime-error-monitor.mjs'
      - 'index.html'
      - 'scripts/test-system-center-contract.mjs'
      - '.github/workflows/validate-media-studios.yml'

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax and runtime contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Music Studio
        run: node --check music-studio-pro.js
      - name: Check Video Studio
        run: node --check video-studio-pro.js
      - name: Check System Center
        run: node --check system-center-pro.js
      - name: Check Human3D Engine
        run: node --check js/haldo-human-3d-engine.js
      - name: Test Human3D model capability inspection
        run: node scripts/test-human3d-capabilities.mjs
      - name: Test System Center registration and inventory states
        run: node scripts/test-system-center-contract.mjs
      - name: Test System Diagnostics and App Health Monitor
        run: node scripts/test-system-diagnostics.mjs
      - name: Audit local runtime script dependencies
        run: node scripts/test-runtime-dependencies.mjs
      - name: Validate inline scripts and identity load order
        run: node scripts/test-inline-script-integrity.mjs
      - name: Test Runtime Error Monitor contract
        run: node scripts/test-runtime-error-monitor.mjs
