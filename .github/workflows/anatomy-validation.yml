name: Anatomy 3D validation

on:
  pull_request:
    paths:
      - "anatomie.html"
      - "index.html"
      - "models/**"
      - "scripts/validate-anatomy-assets.py"
      - "scripts/test-anatomy-browser.mjs"
      - ".github/workflows/anatomy-validation.yml"
  push:
    branches:
      - "work-anatomy-3d-integration"
    paths:
      - "anatomie.html"
      - "index.html"
      - "models/**"
      - "scripts/validate-anatomy-assets.py"
      - "scripts/test-anatomy-browser.mjs"
      - ".github/workflows/anatomy-validation.yml"

permissions:
  contents: read

jobs:
  validate-anatomy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate anatomy manifest, GLB files and JavaScript
        run: python scripts/validate-anatomy-assets.py
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all three profiles in a real browser
        run: node scripts/test-anatomy-browser.mjs
      - name: Upload 3D profile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-profile-screenshots
          path: artifacts/anatomy/
          if-no-files-found: ignore
